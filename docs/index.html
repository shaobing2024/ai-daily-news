const DATA = {"date": "2026-08-14", "generatedAt": "2026-08-13T23:36:33Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "谷歌推出 Gemini 3.7 Flash 模型，首发优惠价为原 3.6 Flash 的一半", "summary": "IT之家 8 月 14 日消息，当地时间 8 月 13 日，谷歌宣布推出 Gemini 3.7 Flash 模型，专为编程与 Agents 场景打造。IT之家注意到，本次发布距 Gemini 3.6 Flash 发布仅间隔约三周，谷歌称该版本的推出直接源于开发者的反馈以及一系列算法创新。Gemini 3.7 Flash 在软件工程、知识工作及网页开发工作流方面均实现了大幅提升。此外，在今年年底前（截至 2026 年 12 月 31 日），Gemini 3.7 Flash 将以首发优惠价提供（Gemini 3.6 Flash 也将有相同优惠），仅为原 3.6 Flash 每百万 Token 价格的一半：输入：每百万 Token 0.75 美元（现汇率约合 5.1 元人民币）输出：每百万 Token 3.75 美元（现汇率约合 25.3 元人民币）即日起，面向 160 多个国家和地区的 Google AI Pro 及 Ultra 订阅用户推出的 Gemini Spark 将正式接入 Gemini 3.7 Flash。本次模型升级显著提升了 Spark 处理知识工作的效率，优化了其对 Google Workspace 系列应用工具的使用能力，从而为复杂且跨技能的综合工作流提供更高的准确度与更高质量的输出。此外，Gemini 3.7 Flash 推出了全新的安全防御机制，在严防化学、生物、放射性及核（CBRN）领域和网络攻击滥用的同时，确保合法且有益的应用场景得以顺利实施。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/989/497.htm", "publishedAt": "2026-08-13T23:30:13+00:00"}, {"title": "最高每秒生成 750 个词元：OpenAI 推 Ultrafast 模式，GPT-5.6 Sol AI 提速 14 倍", "summary": "IT之家 8 月 14 日消息，OpenAI 公司今天（8 月 14 日）发布公告，宣布以预览形式，针对其最强 AI 模型 GPT-5.6 Sol 推出 Ultrafast（超高速）模式，是标准处理速度的 14 倍，最高每秒输出 750 个词元（Token）。在服务支持方面，OpenAI 公司表示该模式由 Cerebras 提供，目标是在用户工作流中，进一步提高模型的响应速度。OpenAI 公司表示，在过去模型速度和能力两者不可兼得，如果用户需要更快的输出速度，通常需要牺牲模型能力，转而选择更小或更专用的模型。而 Ultrafast 可以实现两者兼得，让“每秒完成更多有价值工作”成为新的方向。OpenAI 列出的早期应用场景包括：事故响应与可靠性分析、金融研究与安全分析、客服与语音交互、电商场景中的商品问答与库存查询，以及实时研究和实验。IT之家附上相关截图如下：OpenAI 称，这一模式面向对实时性要求极高的业务场景，当前处于有限预览，仅向一小批客户开放。公司表示，这些早期测试有助于判断速度提升在什么环节价值最大，也有助于观察模型能否跟上用户操作节奏。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/989/492.htm", "publishedAt": "2026-08-13T23:02:48+00:00"}, {"title": "备战 IPO 上市：彭博社称 2026 年 OpenAI 年化营收有望翻番达 400 亿美元", "summary": "IT之家 8 月 14 日消息，彭博社今天（8 月 14 日）发布博文，报道称在收 IPO（首次公开募股）上市前，OpenAI 的发展势头良好，2026 有望实现年化收入超过 400 亿美元（IT之家注：现汇率约合 2,702.76 亿元人民币），比 2025 年收入（约 200 亿美元（现汇率约合 1,351.38 亿元人民币））翻一番。据彭博社报道，联合创始人兼总裁格雷格 · 布罗克曼在内部公告中告知员工，仅 7 月份，月度营收增长率就增长了 20% 以上。首席财务官莎拉 · 弗莱尔此前曾指出，公司经历了快速扩张期，2025 年的年化营收增长率超过 200 亿美元（现汇率约合 1,351.38 亿元人民币）。在市场竞争方面，Anthropic 在今年 5 月公布的年化营收为 470 亿美元（现汇率约合 3,175.75 亿元人民币），不过彭博社指出由于两家公司在计算统计上存在差异，很难直观、公平对比两家公司的年化营收。在市场竞争策略方面，OpenAI 公司为抵御外部竞争对手的冲击，捍卫市场份额，积极调整其市场策略和定价策略，通过降低部分 AI 模型的价格，从而吸引注重成本的开发者。OpenAI 公司还聘请了一位经验丰富的网络安全高管，以提振企业销售。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/989/490.htm", "publishedAt": "2026-08-13T22:49:25+00:00"}, {"title": "从“开放模型”到“开放生态”，AI 开源进入下半场", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/oEMzispbWkEP8TtKdUtf?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-13T18:21:46+00:00"}, {"title": "神秘生图模型“mona-lisa-1”曝光：含 OpenAI 来源信号，GPT-Image-2 发布三个月仍稳坐第一", "summary": "IT之家 8 月 13 日消息，8 月 9 日有一款代号为“mona-lisa-1”的图像生成模型出现在 AI 竞技场的盲测列表中。爆料者 AiBattle 称，他将该模型生成的图片提交至 OpenAI 官方内容验证工具后，检测到了与 OpenAI 相关的来源信号。因此，这款“mona-lisa-1”被认定为新一代的 GPT-Image 模型。OpenAI 方面截至目前尚未就该模型发布任何正式公告、产品文档或公开说明，也未确认其与现有产品的具体关系。@TimJayas 使用相同提示词，将这款神秘模型其与 GPT-Image 2 进行了对比。测试结果显示，“mona-lisa-1”在部分细节表现上更为丰富。据多位测试者反馈，该模型目前仅出现在 LM Arena 的盲测环节，尚未接入 ChatGPT、OpenAI API 或 Codex 等正式产品通道。部分对比测试显示，“mona-lisa-1”在真实感、细节层次以及减少传统 AI 生成图像常见的人工质感方面有一定表现差异，但也有测试指出部分生成结果仍存在噪声或伪影现象。IT之家注意到，GPT-Image 2 正式发布前也曾以匿名代号形式出现在 Arena 平台进行盲测。目前“mona-lisa-1”的具体技术架构、训练完成时间及后续正式发布计划，均有待 OpenAI 进一步公开。OpenAI 官方 Verify 页面明确说明，该工具可检查图片或音频文件中是否存在与 OpenAI 工具相关的内容来源信号，包括 C2PA 元数据以及 SynthID 水印，主要面向由 ChatGPT、OpenAI API 或 Codex 生成的内容。OpenAI 同时指出，若检测到受支持的来源信号，可表明相关内容由 OpenAI 工具生成或导出，但验证结果本身并不能用于确认具体使用了哪一款模型。因此，目前尚不能仅凭 SynthID 等来源信号确认“mona-lisa-1”即为 GPT-Image 2 的直接继任型号。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/989/476.htm", "publishedAt": "2026-08-13T14:41:37+00:00"}, {"title": "部分 Claude 模型将添加“文本水印”，Anthropic 回应各界关切", "summary": "IT之家 8 月 13 日消息，Anthropic 本周宣布，部分 Claude 模型会直接在输出文本中嵌入一种“难以察觉的水印”。内容被复制粘贴后，水印仍会随文本保留，经过一定程度修改后也可能继续存在，用于帮助判断一段文字究竟由 AI 生成还是由人类撰写。Anthropic 目前尚未公开水印系统的完整技术原理。技术细节的不透明已经引发一些科技从业者担忧。具体来看，版权如何认定、Claude 输出质量是否会受到影响，以及只使用 AI 进行少量辅助的作品会不会因此被误判等问题，备受关注。据《商业内幕》今天（12 日）晚间报道，Anthropic 方面对于各界关心的问题作出了回应。谁能识别水印？科技投资人比尔 · 格利担心，如果只有 Anthropic 能够识别水印，Anthropic 就可能同时扮演“法官、陪审团和检察官”的多重角色。Anthropic 发言人回应说，公司计划提供免费的应用程序接口（API），让普通用户和第三方也能自行检测一段文字是否带有 Claude 水印。只让 AI 稍作修改的内容怎么算？一些开发者还担心，如果 Anthropic 通过特定词语组合来标记 AI 生成文本，水印机制可能会影响 Claude 本身的回答。Anthropic 发言人称，水印不会改变 Claude 回答的含义、质量或可读性。数字医疗机构 Klick 生成式 AI 负责人西蒙 · 史密斯周二在 X 发文称，他担心仅由 AI 做过轻微处理的文字也会被认定为 AI 创作，例如只是把一篇文章交给 Claude 检查语法。Anthropic 表示，水印代表的是 Claude 曾经处理过文本，并不能证明整段文字都是 Claude 写的。即使 Claude 只负责校对、翻译或总结，水印也可能继续保留。对版权会有何种影响？微软前高管史蒂文 · 辛诺夫斯基把关注点放在了数字隐私上。“真正的问题是数据保留，以及你是否有权拥有不留下数字痕迹的私人想法。”软件工程师培训师兼教练约翰 · 克里克特也提出，如果 AI 生成的代码带有水印，版权认定可能会变得更加复杂，因为作者届时可能难以证明作品中包含足够多的人类创作投入。Anthropic 回应称，公司加入水印是为了遵守欧盟《人工智能法》。从 8 月 2 日起，全球范围内受支持的 Claude 模型生成文本已经开始使用该水印。Anthropic 并非唯一采用水印技术的 AI 公司。谷歌使用 SynthID 为 AI 生成内容添加水印，OpenAI 也在部分图片和音频中使用 SynthID。马斯克旗下社交平台 X 也会给系统判断为 AI 生成或经过 AI 处理的内容加上“由 AI 制作”标签。周三，即将离任的白宫新闻秘书卡罗琳 · 莱维特发布辞职帖时一度被加上该标签，随后又消失。相关阅读：《Anthropic 为 Claude 生成 AI 内容添加水印，网友吵翻了》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/989/462.htm", "publishedAt": "2026-08-13T13:47:17+00:00"}, {"title": "对标 Claude Cowork：DeepSeek Harness 公测，同步开放插件生态", "summary": "IT之家 8 月 13 日消息，DeepSeek-V4-Pro-0813 正式开源，同时还推出了其开源（MIT 协议）的代码智能体框架 Harness 的 v0.1 开发者预览版（基于 Cordis），并同步开放了配套的插件生态系统。截至IT之家发稿，相关 GitHub 仓库仍处于非公开状态（更新：现已公开）。在已安装 Node.js 开发工具链的系统中，可以使用 npx 命令快速启动 DeepSeek Harness 的 Web UI：npx&nbsp;@deepseek-ai/dsh&nbsp;web该命令会启动 Web UI，默认地址为 http://127.0.0.1:3080。如需从仓库源码运行：git&nbsp;clone&nbsp;https://github.com/deepseek-ai/deepseek-harness.git cd&nbsp;deepseek-harness pnpm&nbsp;install pnpm&nbsp;run&nbsp;build pnpm&nbsp;dsh&nbsp;web据官方介绍，DeepSeek Harness 采取“一切皆插件”的设计思路。深度求索采用插件式开放架构来构建 Agent Harness：模型、工具、技能、会话、沙箱、存储、循环、调度、UI 等所有 Agent 能力均由插件组合而成，可自由替换、灵活重组。“Harness”的通俗定义是将模型转化为智能体的工具。在大型语言模型之外，Harness 负责调度上下文、工具、任务状态、反馈与边界，把模型能力落地到真实环境中，完成从理解需求到交付代码的完整闭环。DeepSeek 此前在官方招聘信息中给出了“Model+Harness=Agent”的公式。在产品定位上，DeepSeek Harness 精准对标 OpenAI Codex 及 Anthropic Claude Cowork，旨在成为一款主打编程和办公场景的 AI 生产力工具。团队负责人崔添翼已于 8 月 2 日面向全球公开征集 Harness 内测用户。招募帖发布后，短时间内吸引了数十名全球开发者报名。DeepSeek Harness 基于具有时空可组合性的 Cordis 插件系统构建。Cordis 元框架只负责插件的加载与卸载以及依赖关系，Agent Harness 的所有具体组件都是不同的 Cordis 插件。插件通过 Cordis 服务与事件彼此协作，并可以在配置层自由组合。开发者无需改动 DeepSeek Harness 的源码本身，就能以插件的方式独立选择、替换或扩展其中的任一能力。这就是 DeepSeek Harness 最重要的设计原则：一切皆插件。DeepSeek Harness（DSH）提供 dsh 命令行工具，用于产品配置与启动。其核心命令 dsh --profile &lt;name&gt; 用于启动指定配置文件。该工具支持 Web、Headless 等多种运行模式，并允许通过插件机制进行扩展。针对不同的使用场景，DeepSeek Harness 提供四种模式，每种模式会默认加载不同的插件集合：标准模式：提供完整的工具组合；PTC 模式：程序化工具调用（Programmatic Tool Calling），由模型生成的一段代码来组合多轮工具调用；极简模式：仅保留一个 shell 工具与一个文件编辑工具，用于最小环境下的模型基准测试；创造模式：可以检查当前运行时、在内存中试验 Cordis 插件，并据此组合和创作新的模式。DeepSeek-V4-Pro-0813 是一款基于混合专家（MoE）的模型，总参数量高达 1.6 万亿，实际推理中每个 token 仅激活 490 亿参数。该模型拥有 100 万 token 的上下文窗口，并支持最大 38.4 万 token 的输出长度。在交互模式上，V4 Pro 提供“思考模式”与“非思考模式”两种选项，其中思考模式为默认设置。此外，V4 Pro 全面支持 JSON 结构化输出、Tool Calls、Responses API 和 Anthropic API 等高级功能。据 DeepSeek 开展的内部测评，正式版相比预览版能力大幅提升，在多项测试中接近甚至超越 Claude Fable 5。例如在 Terminal Bench 2.1 测试中得分 87.9，远超预览版的 72.1。在其他测试中，DeepSWE 从 12.8 跃升至 62.7，DSBench-Hard 翻倍至 67.2。值得关注的是，DeepSeek-V4-Pro-0813 的权重已正式开放。DeepSeek 的权重采用 MIT 许可证。此举被解读为将模型底座从对特定算力的依赖中解耦，开发者可下载自建，不再依赖云端单一服务；国产 GPU、通用算力卡无需厂商定制即可直接运行。这降低了政企私有化门槛，提升了供应链抗风险能力。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/989/446.htm", "publishedAt": "2026-08-13T12:52:43+00:00"}, {"title": "全新红旗 H7 轿车预售发布：鸿鹄混动、司南组合辅助驾驶系统，首发 18.18 万元起", "summary": "IT之家 8 月 13 日消息，全新红旗 H7 轿车今晚预售发布，该车搭载鸿鹄混动、司南组合辅助驾驶系统，首发 18.18 万元起。180 智混版：预售价 19.18 万元、首发诚意价 18.18 万元；240 智混版：预售价 20.68 万元、首发诚意价 19.68 万元；210 四驱智混版：预售价 23.18 万元、首发诚意价 22.18 万元。外观方面，全新红旗 H7 尺寸为 5060×1910×1480mm、轴距 2970mm，采用流影穿云外观设计，行业首创前排渐变隔音隐私玻璃，并配备半隐藏式门把手、无边框后视镜、璀璨之眼晶钻日行灯、流光归羽尾灯、1.376m² 透光天幕等。内饰方面，新车采用天光入境设计，配备“星河环绕”氛围灯和“日出东方”扬声器，全球首发 BOSE 三大智能音效技术，支持 7.1.4 杜比全景沉浸音效。车内还配有 4L 智能冷暖冰箱、500L 常规容积后备厢（1717L 拓展容积）。智能方面，全新红旗 H7 预装灵犀座舱 5.0，搭载 8295P 智舱芯片，配备 15.6 英寸真 2.5K 中控屏、30 英寸自适应 AR-HUD，支持豆包大模型交互、智能 4 音区语音识别、DMS+Face ID 双效监测等功能。车内座椅支撑四座通风加热、前排支持 10 点位按摩。智驾方面，新车采用红旗司南组合辅助驾驶系统，支持全场景城市领航辅助、全场景高速领航辅助、全场景智能泊车辅助。动力方面，全新红旗 H7 采用鸿鹄混动，CLTC 纯电续航 240km、综合续航 1954km，WLTC 百公里馈电油耗 4.4L，支持 AI 智慧能量管理系统，并提供三元锂、磷酸铁锂双电池包可选。IT之家注意到，新车四驱版综合功率 479kW、扭矩 871N·m、百公里制动距离 35.8m。安全方面，新车采用 2000MPa 级 9H4M 高强笼式“金钟罩”车身 + 一体式双门环结构；全系标配 9 安全气囊，支持 6 毫秒极速响应，同时支持全方位 22 项主动安全能力。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/989/440.htm", "publishedAt": "2026-08-13T12:29:51+00:00"}, {"title": "DeepSeek-V4-Pro 正式版上线", "summary": "DeepSeek V4 Pro 正式版已发布。 当前，DeepSeek V4 Pro 正式版已同步在 APP、网页端和 API 更新上线。用户可以通过 APP 或网页端选择“专家模式”使用全新的 V4 Pro 正式版模型， API 模型名不变，其他更新细节详见 DeepSeek API 官方接口文档。 Agent 能力大幅提升 正式版 DeepSeek V4 Pro 增强了 Agent 能力，在生产环...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/501923", "publishedAt": "2026-08-13T11:31:34+00:00"}, {"title": "Claude一举扫清2000阶以下哈达玛矩阵！AI开始清空数学待解列表", "summary": "好数学家不挑AI模型", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/472016.html", "publishedAt": "2026-08-13T11:29:04+00:00"}, {"title": "深度测评 SpaceXAI 的 Grok 4.6：Agent 能力突出、成本效率成杀手锏", "summary": "Artificial Analysis对Grok 4.6进行了独立深度评测，结果显示这款模型在Agent任务上表现尤为出色，同时在成本效率方面建立了显著优势。Grok 4.6在AI智能指数（九项基准测试的复合评分）中获得61分，较Grok 4.5提升5分，较Grok 4.3提升23分。 评测的核心发现是：Grok 4.6的Agent能力突出于静态推理能力之上。模型在多轮交...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/501921/grok-4-6-benchmarks-and-analysis", "publishedAt": "2026-08-13T10:39:09+00:00"}, {"title": "智象未来 (HiDream.ai)算法科学家潘滢炜博士确认出席AICon深圳，将分享“从 Token 预测到状态预测：迈向世界模型的原生全模态之路”", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/9d9Oik3uZpqfjbfElZaq?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-13T10:00:00+00:00"}, {"title": "Qwen 团队开源 Qwen3.8-2.4T，首次将 Max 级模型开放给社区", "summary": "阿里通义千问团队在HuggingFace上正式开源了Qwen3.8-2.4T-A95B，这是Qwen开源模型家族中迄今为止能力最强的一代，也是Qwen-Max级别模型首次向社区开放。 Qwen3.8-2.4T-A95B是一款总参数量2.4万亿、激活参数95B的因果语言模型。与Qwen3.5共享架构基础，但在编码、专业工作、研究和长周期代理任务方面实现了显著提升。模型...", "so  行业的底层假设：大语言模型的能力边界，不是算力不够，不是数据不够，而是语言本身就是人类体验的有损压缩。LLM 看到...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/492309/llms-cant-jump", "publishedAt": "2026-08-10T10:26:53+00:00"}]}, {"label": "产品发布/更新", "items": [{"title": "英伟达 GeForce NOW 原生 Linux 应用发布：结束 Beta 测试，支持 Ubuntu 24.04 及 Flatpak 安装", "summary": "IT之家 8 月 13 日消息，英伟达于当地时间 8 月 13 日宣布，其云游戏服务 GeForce NOW 的原生 Linux 应用已正式结束测试阶段，面向所有用户发布。该应用于 2026 年 1 月以 Beta 版形式首次登陆 Linux 平台，经过数月的社区反馈与优化，现已推出正式版本。Linux 版 GeForce NOW 客户端将继续支持 Ubuntu 24.04 及更新版本。英伟达同时新增了官方 Flatpak 软件仓库，以简化安装和后续更新流程。用户可通过英伟达的.bin 安装程序或添加 Flatpak 仓库直接安装 com.nvidia.geforcenow 包。性能方面，英伟达对云端 DLSS 帧生成技术进行了优化，以降低延迟，使游戏操作反馈更加灵敏。这一改进在 1440p 和 4K 分辨率下以 60 或 120 FPS 进行串流时效果尤为明显。针对 GeForce NOW Performance 会员，英伟达还部署了额外的服务器端软件优化，旨在提升部分对 CPU 性能要求较高的游戏的帧率。这些云端升级均为自动生效，用户无需进行任何安装或配置操作，且不产生额外费用。此外，本周的“GFN Thursday”为游戏库新增了九款作品，包括《Car Wash Simulator》、《Pax Autocratica》、《Clawed》、《Hell Let Loose: Vietnam》、《Sandustry》、《Cat Mail Co.》、《Misery》、《Monster Hunter Wilds Prologue Demo》和《Pratfall》。IT之家注：GeForce NOW 目前支持超过 2000 款 PC 游戏，用户可串流来自 Steam、Epic Games、Xbox、Ubisoft 等平台的已购游戏。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/989/486.htm", "publishedAt": "2026-08-13T15:46:37+00:00"}, {"title": "华为 MatePad Edge 鸿蒙 HarmonyOS 7 花粉 Beta 版开推，新增全新视效、AI 变声检测等功能", "summary": "IT之家 8 月 13 日消息，华为官方平板软件维护宣布，MatePad Edge 开启鸿蒙 HarmonyOS 7 花粉 Beta 版本推送（版本号 7.0.0.102 SP5）。据介绍，新版本将带来沉浸光感视效、星盾防诈等功能。▲ IT之家图赏：华为 MatePad Edge 实拍IT之家附华为 MatePad Edge 鸿蒙 HarmonyOS 7 花粉 Beta 版更新内容如下：一、版本推送时间2026 年 8 月 13 日：发布 HarmonyOS 7 花粉 Beta 版 7.0.0.102 SP5 版本，已开始分批推送给花粉 Beta 版升级尝鲜报名入选成功的用户* 注：1、提交花粉 Beta 版升级尝鲜报名信息后，我们预计于 7 个工作日内完成审核，具体请以实际审核时间为准，请您耐心等待或进入“升级尝鲜”页查看审核结果。2、我们会依据报名信息、产品使用体验以及当前版本优化进度等多重因素，对报名用户逐步分批审核，“审核通过”后您可选择版本按照提示进行升级，若您报名后设备版本不在支持升级的基线版本上，将搜不到 HarmonyOS 7 新版本。二、适配机型HUAWEI MatePad Edge （QXS-W00）HUAWEI MatePad Edge （QXS-W10）HUAWEI MatePad Edge （QXS-W20）三、版本更新日志6.1.0.135SP9 → 7.0.0.102SP5 更新点：【亮点推荐】沉浸光感：新增全新视效，覆盖更多的应用场景，例如将桌面图标拖入大文件夹、在控制中心调节音量等场景。同时，视觉效果支持档位调节，您可根据个人喜好进行设置 (设置&gt; 桌面和个性化 &gt; 沉浸光感)。星盾防诈：1. 支持 AI 变声检测功能，通话时可识别伪造音，并进行提醒，守护您的通话安全。2. 识别风险二维码，并自动拦截，让扫码更安心。【桌面和个性化】1. 长按桌面文件夹选择“解散”可解散文件夹，让应用一键重回桌面，操作简单，体验高效。2. 简化桌面图标字体大小调节功能，在桌面双指捏合，选择“图标”即可进行调节，让个性化设置更简单。【系统】1. 长按状态栏时钟，可切换为“时分秒”样式，抢票抢购更从容，再次长按或 15 分钟后恢复为“时分”样式。2. 状态栏新增快捷返回前应用功能，当在应用内打开新应用窗口时，状态栏左上角会显示前应用名称及返回箭头，点击箭头可从新应用一键返回前应用界面，极简交互，高效体验。3. 优化底部小艺导航条使用体验，通过设置 &gt; 搜索“导航条”进入设置界面，关闭“点击导航条返回”开关后，可点击触达到导航后面的应用界面。4. 三键导航支持隐藏，在设置 &gt; 系统 &gt; 系统导航 &gt; 三键导航 &gt; 导航键可隐藏，打开导航键可隐藏开关后，点击导航键左侧的箭头即可隐藏导航键，从桌面底部上滑可显示导航键。【备忘录】1. 待办时间提醒支持自定义重复周期，待办可自动循环提醒，告别反复创建，化繁为简，智享生活 (备忘录&gt; 新建待办 &gt; 时间提醒 &gt; 重复 &gt; 自定义)。2. 待办在排序编辑页支持长按拖动排序，操作更简单，顺序调整更随心 (待办&gt; 右上角四点图标 &gt; 排序编辑)。3. 加锁备忘录支持设置隐藏，重要内容随心记，更安心 (备忘录&gt; 右上角四点图标 &gt; 隐藏加锁备忘)。【日历】1. 日程卡片支持台历模式，开启该模式后，日历桌面卡片将呈现简洁美观的台历视图，带来更精致的视觉体验 (日历&gt; 右上角四点图标 &gt; 启用台历，然后捏合桌面 &gt; 卡片 &gt; 日历 &gt; 临近日程 &gt; 添加至桌面)。2. 支持通过邮箱账户、URL 链接导入外部日程，一键同步，操作简单，省心便捷 (日历&gt; 侧边栏 &gt; 日历账户 &gt; 添加 &gt; 导入日程 &gt; 添加邮箱账户 / URL 导入)。【通知】通知和状态栏设置界面支持字母顺序检索，一键直达目标应用，简单易用，通知管理更高效。【联系人】支持合并号码相同、姓名不同的联系人，还可处理公司、职位等字段冲突，通讯录更精简、更准确 (联系人&gt; 右上角四点图标 &gt; 设置 &gt; 整理联系人 &gt; 手动合并重复联系人)。【畅连】在畅连消息对话框新增一键发起屏幕共享功能，在聊天对话框点击“+”，选择“共享屏幕”，可便捷发起屏幕共享，共享时可轻松涂鸦，边看边聊，操作更简单，沟通更顺畅。相关阅读：《华为 MatePad Edge 鸿蒙二合一平板电脑开启 HarmonyOS 7 花粉 Beta 招募》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/989/472.htm", "publishedAt": "2026-08-13T14:27:36+00:00"}, {"title": "首发体验 | DeepSeek Harness 来了，它不想做下一个Codex", "summary": "一切皆插件#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1675083?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-08-13T12:46:11+00:00"}, {"title": "4.8亿美元砸向端侧算力！Agent芯片新贵冲出重围", "summary": "首颗AI芯片已进入量产", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/472059.html", "publishedAt": "2026-08-13T12:34:42+00:00"}, {"title": "秦家族“超大杯”车型：比亚迪秦 MAX 正式上市，9.99 万-14.39 万元", "summary": "IT之家 8 月 13 日消息，比亚迪秦家族最新的“超大杯”车型秦 MAX 今天（13 日）晚间正式上市，新车提供 EV、DM-i 两种车型共 9 种不同配置，售价区间为 9.99 万-14.39 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
