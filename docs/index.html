发掘和培...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503501", "publishedAt": "2026-11-10T03:57:26+00:00"}, {"title": "华境 S 大六座 SUV 累计交付突破 4 万台，标配华为乾崑智驾 ADS 5 Pro", "summary": "IT之家 11 月 10 日消息，华境汽车官方今日宣布，华境 S 拿下插电式混动大型 SUV 销量四连冠，累计交付达成 40,000 台。据IT之家此前报道，本月初，华境汽车官方宣布，旗下华境 S 在 10 月交付 7507 台，实现连续 6 个月增长。该车是上汽通用五菱与华为合作的首款搭载华为乾崑科技的旗舰大六座 SUV，2026 年 9 月交付 7416 台、8 月交付 7306 台、7 月交付 7203 台、6 月交付 5689 台。华境 S 全系标配华为乾崑智驾 ADS Pro 增强版与鸿蒙座舱。该车已于 5 月 8 日正式上市，长 5235mm / 宽 1999mm / 高 1800mm，轴距 3105mm。9 月 12 日，华境 S 宣布新增 4 款配置（主要在鸿蒙座舱方面迎来升级），全系超级置换价 14.98 万元-19.68 万元。延伸阅读华境 S 是上汽通用五菱与华为合作打造的首款车型，也是上汽通用五菱旗下华境汽车品牌的首款产品，该车型的参数配置信息已收录于上汽通用五菱官网。华为乾崑智驾 ADS 5 于 2026 年 10 月 22 日公布了 Max、Pro、SE 三大版本的硬件与功能差异对照表。其中华境 S 搭载的 ADS Pro 采用舱内激光视觉 Limera，配备 11 颗摄像头、3 颗毫米波雷达；定位更高的 ADS Max 搭载 896 线双光路图像级激光雷达，并可选配高精度固态激光雷达；入门的 ADS SE 则无激光雷达，仅配备 10 颗摄像头和 3 颗毫米波雷达。三个版本均配备 12 颗超声波雷达，算法全系升级至 WEWA 2.0 AI 智能体架构。官方说明，老款 ADS 4 的 Max / Pro / SE 机型升级对应 ADS 5 版本没有硬件门槛。华境 S 定位大型插电式混合动力 SUV，上市指导价为 15.98 万至 20.68 万元，共 8 款配置，文中提到的 14.98 万至 19.68 万元为“超级置换价”。参数方面，其四驱版 0-100km/h 加速为 5.2 秒，WLTC 最低荷电状态油耗为 5.98 至 6.98L/100km，最高车速 190km/h。在 2026 年 10 月全国插电式混动大型 SUV 零售销量排行榜中，华境 S 以 7507 辆位居第一，极氪 9X 以 4356 辆、腾势 N8L 以 3479 辆分列二、三位，岚图泰山 X8、腾势 N9、魏牌 V9X、岚图泰山、领克 900 等车型紧随其后。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/024/739.htm", "publishedAt": "2026-11-10T03:50:02+00:00"}, {"title": "Anthropic 发布 Fable 5.2 与 Mythos 5.2，声称“8 天写出一个能开机的操作系统”", "summary": "Anthropic 在 11 月 9 日发布了 Claude Fable 5.2 和 Claude Mythos 5.2。这两个名字看起来像两条产品线，实际上是同一个底层模型——Fable 带完整的网络安全和生物学防护，对所有用户开放；Mythos 卸掉部分限制，只通过验证计划提供给从事防御性安全或生物医学研究的机构。 对开发者来说，真正想知道的不是它能解什么难...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503499/claude-fable-and-mythos-5-2", "publishedAt": "2026-11-10T03:37:45+00:00"}, {"title": "Adobe 与迪士尼达成多年战略合作，将 AI 工具推广至迪士尼乐园、内容制作领域", "summary": "IT之家 11 月 10 日消息，Adobe 公司昨日宣布与华特迪士尼公司达成一项为期多年的战略合作协议，为迪士尼业务开发定制 AI 模型，计划将 AI 工具推广至迪士尼主题乐园、内容制作、体育内容传播等领域。IT之家从官方新闻稿获悉，Adobe 将成为迪士尼官方 AI 创新合作伙伴，为迪士尼提供 Adobe Firefly、Firefly Foundry、Premiere 和 Photoshop 等工具的优先使用权限，并派出工程和研究团队，为迪士尼工作流提供支持。同时，双方还将利用 Firefly Foundry 开发生成式 AI 模型。这些模型将围绕迪士尼角色、场景环境和视觉风格进行训练，生成符合作品设定、可用于商业和制作流程的内容。相关模型将以人为本，由艺术家主导开发。迪士尼幻想工程研发部门已经开始使用 Firefly Foundry，将 AI 工具导入主题乐园开发流程。目前的应用包括将手绘草图转化为 2D 概念图的模型，以及生成符合迪士尼品牌和作品风格的图像模型。此外，双方还将在华特迪士尼影业旗下的 StudioLAB 和 ESPN Edge 创新中心开展合作。StudioLAB 主要负责探索 AI 对内部创意工作流程的帮助，ESPN Edge 则将研究利用 AI 提升体育内容的粉丝参与度，并探索盘活 ESPN 历史档案内容的新方式。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/024/731.htm", "publishedAt": "2026-11-10T03:26:36+00:00"}, {"title": "机械革命大师之路 X10 NVIDIA RTX Spark 新品发布会定档 11 月 19 日", "summary": "IT之家 11 月 10 日消息，机械革命宣布，大师之路 X10 NVIDIA RTX Spark 新品发布会定档 11 月 19 日。当想象与强大算力相遇方寸之间，未来就此展开机械革命大师之路 X10，让 AI 触手可及11 月 19 日敬请期待，无限可能由你开启IT之家注意到，在 6 月的 2026 台北国际电脑展主题演讲中，英伟达 CEO 黄仁勋正式宣布推出 RTX Spark PC 处理器。英伟达 RTX Spark 由联发科合作的 20 核 Grace CPU + 英伟达 Blackwell RTX GPU 组成（6144 CUDA 核心），AI 性能达到 1petaFLOP。英伟达 RTX Spark 采用台积电 3nm 工艺打造，配备 128GB 统一内存。英伟达宣称将与微软一起开启 PC 新世代。黄仁勋谈到了适配英伟达 RTX Spark 的应用，RTX Spark 让创作者、AI 开发者和游戏玩家能够渲染 90GB 以上的超大型 3D 场景、编辑 12K 4:2:2 视频、生成 4K AI 视频、使用本地智能体运行具有高达 100 万 token 上下文的 1200 亿参数 LLM，并以 1440p 分辨率和每秒 100 帧以上的速度畅玩 3A 游戏。据悉，大师之路 X10 将搭载机械革命自主研发的 AI SSD，可将超大规模本地模型从 DRAM 卸载到 NAND 上，同时通过保存并复用已处理上下文、优化模型加载方式，减少重复计算与加载开销。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/024/726.htm", "publishedAt": "2026-11-10T03:11:29+00:00"}, {"title": "qOntology 本体工程平台开源版 v1.1.0 发布：AI 辅助建模、知识图谱多视图！企业本体 FDE 的超强工具！", "summary": "qOntology 本体工程平台开源版 v1.1.0 围绕本体工程中的知识整理、模型维护与图谱探索进行更新，重点增强 AI 辅助建模和知识图谱多视图能力，同时补充项目版本管理、约束规则配置，并对本体应用及基础管理页面进行调整。 本次更新关注的是本体建设过程中的几个具体环节： 如何从业务材料中整理建模候选，如何通过不同视图...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503498", "publishedAt": "2026-11-10T03:07:06+00:00"}, {"title": "国家发改委：多渠道丰富老年教育资源供给，帮助老年人跨越“数字鸿沟”", "summary": "IT之家 11 月 10 日消息，国家发展改革委今日召开奋进“十五五”系列新闻发布会，介绍增进民生福祉有关情况。据界面新闻报道，国家发展改革委价格司副司长张璐琴表示，持续扩大优质产品和服务供给，更好满足老年人多样化消费需求。一是拓展适老消费场景。加力推进“一刻钟便民生活圈”扩围升级，发展助餐助浴助洁等社区和居家上门服务，引导商超等设置特色老年用品体验区，推动电商平台设立银发消费板块，让老年人消费更方便。二是丰富银发消费业态。支持各地面向老年人开展更多文艺展演等活动、提供更多网络视听、舞台艺术产品，丰富老年人精神文化生活；增加银发旅游列车和邮轮游产品供给，打造高品质旅居养老目的地，为老年人提供更多旅游休闲好线路、好去处；多渠道丰富老年教育资源供给，将新技术产品服务使用作为老年教育重要内容，帮助老年人跨越“数字鸿沟”；办好老年体育健身活动，鼓励体育用品企业开发适老化运动装备，让更多老年人享受运动的快乐、增强身体素质。三是加快适老科技研发应用。重点推进适合老年人的食品、康复护理、安全风险监测等领域技术和产品创新，积极开发脑机接口、智能辅具、智能机器人等产品服务，让技术进步的成果惠及更多老年人。图源：PixabayIT之家注意到，民政部、国家发展改革委、工业和信息化部、商务部、市场监管总局、全国老龄办日前印发《关于培育多元场景 促进适老用品产品消费的若干措施》，其中提到，以国家重大科技项目为牵引，加快推进具身智能、大语言模型、脑机接口、外骨骼等前沿技术在养老领域应用，研发升级老年人失能照护、康复护理、精神陪护等智能设备。鼓励立足各类消费场景，推动智慧健康管理、智能康复评估及治疗等健康管理产品，以及二便护理、康复支持、生活照料等智能养老服务机器人加快落地应用，为老年人提供生活协助、安全防护、健康监测、应急救助等智能照护解决方案。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/024/720.htm", "publishedAt": "2026-11-10T03:02:48+00:00"}, {"title": "蚂蚁灵波 LingBot-Touch 触觉基础模型开源，为通用大脑接入“手感”", "summary": "IT之家 11 月 10 日消息，今日，蚂蚁灵波科技开源触觉基础模型 LingBot-Touch，为机器人大脑补齐关键的触觉感知能力。IT之家从官方介绍获悉，基于近 5000 小时真实触觉数据预训练，LingBot-Touch 覆盖磁触觉、视触觉和压阻式三类主流传感原理，可将不同信号转化为同一套触觉表征，让积累的“手感”能够跨传感器、跨灵巧手、跨模型和跨任务复用。在 26 项真机测试中，接入这一表征后，四种动作模型的平均任务成功率较无触觉时提高约 14 至 26 个百分点。此前，蚂蚁灵波 LingBot 系列模型已构建起覆盖高精度空间感知、高动态环境交互与可泛化灵巧操作的全栈技术体系，让机器人看得更清楚、想得更明白、干得更利索。此次 LingBot-Touch 将通用大脑的感知能力延伸到“指尖”，让机器人“摸得更灵敏”，具身原生通用大脑能力再提升。看清之后，为什么还需要“摸得灵敏”？在真实物理世界中，机器人每执行一步动作，都需要感知物体和环境的变化，再修正下一步动作。许多精细操作里，看清物体的位置、把手伸到正确的地方，并不意味着任务就能顺利完成。接触之后受力是否合适、物体是否滑移，仅靠视觉往往难以判断。以拧瓶盖为例，深度信息可以帮助手指对准瓶盖。但开始转动后，瓶盖可能已经松动，也可能是指腹沿着盖壁打滑。这两种情况在画面中相似，却需要不同的动作调整。指尖的接触位置、受力大小及其变化，成为动作模型的重要判断依据，而这些信息往往被手指和物体遮挡，视觉难以获得。为了验证触觉表征对真实操作的帮助，该团队在 Sharpa Wave 和 XHand 两款灵巧手上进行了 26 项真机测试，涵盖翻书页、拧瓶盖、辨识麻将牌等精细操作。接入 LingBot-Touch 后，LingBot-VLA、π0.5、Diffusion Policy 和 T-Rex 四种动作模型的平均任务成功率，较无触觉时提高约 14 至 26 个百分点。其中，在 T-Rex 控制 Sharpa Wave 拧瓶盖的任务中，不使用触觉时的成功率为 56.25%，直接输入传感器原始信号时为 62.5%，接入 LingBot-Touch 的触觉表征后，成功率达到 90%。这一系列真机实验表明，高质量触觉信息输入可以为机器人动作成功率带来显著提升。统一触觉表征，跨灵巧手、跨模型复用给机器人装上触觉传感器，并不等于它就能用好触觉。商用触觉传感器整体仍处于较早的发展阶段，视触觉、磁触觉、压阻式等路线各有优势和局限。面向不同成本和使用场景，多种路线可能长期并存。更棘手的是，同样一次接触，在不同传感原理和触点布局下，会形成不同的原始信号。如果模型只学会解读其中一种，更换传感器或灵巧手后，已有的数据和触觉经验就可能难以复用，需要重新采集、训练和适配。该团队的思路是，让触觉理解摆脱对特定传感器物理信号的依赖，使不同来源的数据能够共同用于训练，让积累的触觉能力跨灵巧手和跨动作模型复用。为此，LingBot-Touch 按传感原理分别设置编码入口，先处理不同的原始信号，再将不同布局的触点映射到统一的指尖坐标空间。共享模型学习接触位置、受力及其随时间的变化，输出统一的触觉 Token—— 供不同动作模型使用的触觉表征。在这一架构下，人戴触觉手套和遥操作灵巧手采集的数据可以共同用于训练，不同动作模型也可以利用训练好的模型提取接触特征。这一架构还为未来接入新类型的触觉传感器留出了扩展空间。在 XHand 上，团队进一步验证了触觉能力的跨硬件复用。XHand 采用的磁触觉传感器型号并不在预训练数据中，模型学到的磁触觉经验全部来自人戴手套采集的数据。换到这只灵巧手后，团队保持 LingBot-Touch 参数不变，只用 XHand 的操作示范训练动作模型。LingBot-Touch 提供的是位于触觉传感器和动作模型之间的通用感知能力，而不是某一硬件或某一策略的专用模块。本次测试接入了四种不同动作模型，不绑定自研的 LingBot-VLA 模型。传感器和灵巧手厂商可以根据成本与任务需求选择硬件，整机团队可以保留自己的动作策略，减少更换硬件与算法组合时重新开发触觉能力的重复投入。为兼顾感知能力与端侧算力，团队提供了两种容量的模型。此次 26 项真机测试全部使用约 530 万参数的轻量版 LingBot-Touch-Tiny 完成。接入 LingBot-VLA、π0.5 和 T-Rex 后，模型参数量仅增加约 0.13% 至 0.16%。容量较大的版本 LingBot-Touch-Small 在感知测试中表现出进一步提升的潜力：当预训练数据增至近 5000 小时时，模型仍能从新增数据中获益，说明触觉预训练还有持续扩展提升的空间。蚂蚁灵波表示，在通用大模型加速演进的时点，LingBot-Touch 的发布正是团队对“具身原生”路线的持续投入和笃定 —— 不同于面向数字信息的多模态范式，机器人身处真实物理世界，信息从传感器来，作用到环境中去，既需要理解深度这类空间感知信息，也需要处理触觉、力觉、温度等接触感知模态。模态输入的质量，很大程度上决定了动作输出的质量。参考项目主页", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/024/701.htm", "publishedAt": "2026-11-10T02:46:47+00:00"}, {"title": "宇树科技股价涨超 10%，此前已连续 2 个交易日收涨", "summary": "IT之家 11 月 10 日消息，宇树科技今日（11 月 10 日）股价盘中大涨，最高涨超 12%。截至IT之家发稿，宇树科技股价涨超 10%，市值约 3200 亿元。此前，该股已连续 2 个交易日收涨。11 月 4 日，宇树科技创始人王兴兴在 2026 世界互联网大会乌镇峰会互联网企业家论坛上表示，大概率明年将是机器人行业或机器人模型的临界点。王兴兴表示，随着 GPT-6 的发布，目前物理 AI 已经看到被击穿的苗头，很可能最近 1-2 年或 2-3 年，目前具身智能迈过 ChatGPT 时刻的最核心挑战是 AI 模型的输入输出和真实机器人的对齐。他认为，在商业服务的落地会比家庭、工业领域更快些。王兴兴还透露，宇树科技未来重点在攻克机器人大脑技术，除了宇树科技自身的技术突破，还将在全球范围寻求合作，看好物理 AI 技术，并致力于突破。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/024/660.htm", "publishedAt": "2026-11-10T02:20:01+00:00"}, {"title": "35 秒内“叫停”失控的 AI 智能体，OpenAI 部署“控制室”系统", "summary": "IT之家 11 月 10 日消息，OpenAI 今天宣布，公司已在内部研究设施中部署“控制室”系统，用于停止可能存在风险的 AI 任务，可在 35 秒内“叫停”失控的 AI 智能体。据介绍，这套系统将智能体训练、评估和数据处理任务等负载接入中央服务，然后由系统负责决定任务能否继续输出。IT之家了解到，这套系统与负责标记可疑行为的传统监控不同，它可以主动阻止风险研究任务进一步请求输出。当研究员启用某一项任务时，需要向控制室请求唯一任务 ID。然后该标识符会附加到发送给推理引擎的请求中。接着引擎会咨询控制室，确认相关任务是否可以运行。如果研究员或监控系统下令停止指示，控制室服务就会拒绝下一次推理请求，让推理引擎不再为任务声称任何模型输出。OpenAI 表示，这套系统从收到停止指令，到阻止任务进一步继续的最长延迟为 35 秒。这种延迟源于推理授权请求的缓存层，公司正努力将延迟缩短至 0。该系统还具备自动化监控机制集成。OpenAI 透露，所有前沿强化学习任务都会配备独立的模型监控器，用于检查模型行为，并在发现潜在问题时发出警报。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/024/631.htm", "publishedAt": "2026-11-10T02:05:45+00:00"}, {"title": "6999 元，“第二代豆包手机”努比亚 NaviX Ultra 星空典藏版开启预售", "summary": "IT之家 11 月 10 日消息，努比亚今日宣布 NaviX Ultra 星空典藏版将于 10:00 开启预售，11 月 16 日 10:00 正式开售。IT之家查询获悉，新品售价 6999 元，仅提供 16GB+512GB 一个版本。据此前官方介绍，努比亚 NaviX Ultra 手机的“星空典藏版”采用微纳米浮雕工艺，灵感源自梵高《星空》。官方表示，也是努比亚星空影像基因的一次传承。IT之家注意到，被称为“第二代豆包手机”的努比亚 NaviX Ultra 于 9 月 16 日发布，号称“全球首款 AI 智能体手机”，由中兴通讯努比亚全链路主导打造，实现一句话让 AI 跨应用执行复杂任务，豆包手机助手主导 AI 助手体验，售价 5999 元起。努比亚 NaviX Ultra 搭载行业首个集成指纹识别的独立 AI 按键，支持方言识别能力、语音唤醒能力，并内置 Seed 最新全双工语音大模型，按键位置也进行了优化，更方便操作。硬件配置上，努比亚 NaviX Ultra 搭载第五代骁龙 8 至尊版移动平台，搭载 6.78 英寸 1~144Hz LTPO 2.0 自适应刷新率屏幕，后置 2 亿像素主摄，内置 7100mAh 电池。京东努比亚 NaviX Ultra 星空典藏版 6999 元直达链接京东 11.11 无门槛红包 面额至高 26888 元，每天抽 3 次：点此抽红包。淘宝 11.11 无门槛红包 面额至高 26888 元，每天抽 1 次：点此抽红包。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/024/624.htm", "publishedAt": "2026-11-10T02:02:40+00:00"}, {"title": "Codex 游戏掌机突然开卖，网友却在催更 GPT-6.2", "summary": "人类的快乐却还是如此朴素。#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1688678?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-11-10T01:19:39+00:00"}, {"title": "刚刚，Claude Fable 5.2 登顶世界第一，一夜斩杀 Opus 5.5", "summary": "全球最强模型再次易主#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1688605?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-11-09T22:54:06+00:00"}, {"title": "不能把整个安全体系押在大模型上：AI 分诊 CVE，人工审查仍不能少", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/mBvmvcQ8a8ty2Ob1xN64?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-09T16:00:00+00:00"}, {"title": "千星达成！开源终端 uniTerm v1.12 发布：Docker 多租户部署、本地服务、终端录制与批量执行齐上线", "summary": "uniTerm 是一款轻量级一站式开源终端软件。整合终端、文件传输、远 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
