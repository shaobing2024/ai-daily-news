停机、智能回充零干预，6h 超长续航双电池热插拔设计，7X24h 全天候运行，可选配自动接触式充电桩。该产品搭载一体化多模态融合感知模组，深度适配自研 AI 智能巡检管理平台，突破传统地面巡检设备二维通行局限，应对楼梯攀爬、高低落差、立体障碍等三维复杂工况，实现全自动跨楼层、全覆盖自主巡检。设备本体开放核心 SDK 与标准化硬件接口，可对接自研算法与第三方外设装备，降低开发成本。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/004/558.htm", "publishedAt": "2026-09-19T13:11:13+00:00"}, {"title": "27B模型分分钟交付网页，Qwen 3.8还是太能了", "summary": "设计、前端一口气全干了，结果后端没来上班", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/492573.html", "publishedAt": "2026-09-19T11:43:12+00:00"}, {"title": "巨头喊 AI 刹车，宏碁董事长陈俊圣称不太可能、技术发展只会越来越快", "summary": "IT之家 9 月 19 日消息，近期，Anthropic 首席执行官达里奥 · 阿莫迪、OpenAI 首席执行官萨姆 · 奥尔特曼以及特斯拉首席执行官埃隆 · 马斯克相继呼吁，应暂缓最先进人工智能的研发步伐。据台媒经济日报今日报道，宏碁集团创始人施振荣认为，科技的进步实际上是停不下来；宏碁董事长陈俊圣更直言“不太可能”，因为技术发展只会越来越快，重点还是如何在过程中做有效治理。IT之家注意到，陈俊圣表示，因为技术发展有他自身的脚步，只会越来越快。应该是要想办法在这个科技快速发展的过程当中，能够有效地做治理及管制。至于 AI 发展放缓，对中国台湾地区科技及半导体产业的影响，施振荣认为，放缓本质上不是那么容易，而且实质上台湾地区的产能也不够，也不能支持它（AI 发展）的速度。相关阅读：《奥尔特曼称 OpenAI 考虑放缓前沿 AI 开发，希望其他公司也能跟进》《Anthropic CEO 阿莫迪称 AI 行业应当放缓发展速度，并承诺让第三方评估机构获得员工级访问权限》《Anthropic CEO 阿莫迪呼吁放缓前沿 AI 模型开发后，xAI 马斯克、OpenAI 奥尔特曼等业界大佬赞同》《Meta 扎克伯格：保障 AI 安全应依靠引入独立外部评估，而不是放缓 AI 发展》《英伟达黄仁勋反对放缓 AI 发展的呼声，称 2030 年不会是世界末日》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/004/535.htm", "publishedAt": "2026-09-19T11:31:16+00:00"}, {"title": "SpaceXAI 发布 Grok Voice Transcribe 2.0 语音转文本模型：错误率降低约一半，价格保持不变", "summary": "IT之家 9 月 19 日消息，当地时间 9 月 18 日，SpaceXAI 发布了 Grok Voice Transcribe 2.0 语音转文本模型，在保持价格不变的前提下，错误率降低约一半。官方表示，Grok Voice Transcribe 2.0 基于 Grok Voice 底层的音频基础模型构建。目前，Grok Voice 已全面赋能实际业务：每天承接数万通客服电话，转录数百万小时的视频旁白，并驱动实体硬件中的各类语音智能体 —— 其中包括特斯拉车辆中搭载的 Grok 助手。在 Artificial Analysis 榜单中，Grok Voice Transcribe 2.0 在全部 32 款流式模型中准确率高居榜首。除公开基准外，SpaceXAI 基于线上实际业务中采样的四个内部数据集，对模型的词错误率进行了系统评测。这四个测试集分别涵盖：客服电话音频、与 Grok 的日常对话（英语）、电话号码、邮箱、地址等口述信息，以及多语种简短语音指令。在四个数据集的评测中，Grok Voice Transcribe 2.0 的表现均全面超越 1.0 版本。Grok Voice Transcribe 2.0 的定价与 1.0 版本保持完全一致。批量转录为每小时音频 0.10 美元（IT之家注：现汇率约合 0.67 元人民币），实时流式转录为每小时 0.20 美元（现汇率约合 1.3 元人民币）；同时，说话人分离、精确时间戳以及自定义关键词功能均已全部包含在内，无需支付额外费用。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/004/534.htm", "publishedAt": "2026-09-19T11:12:32+00:00"}, {"title": "中国电信开源首个全栈国产轻量级智能体大模型 Xing4.0-29B-A4B", "summary": "IT之家 9 月 19 日消息，中国电信于 9 月 17 日发布新一代星辰大模型 Xing4.0-29B-A4B，该模型总参数量 29B，激活参数仅 4B，原生支持 256K 上下文，可扩展至 512K，是国内首个基于国产算力与国产框架完成训练、面向复杂工程任务深度优化的百亿参数大模型。官方表示，从训练芯片到推理部署，全栈国产 —— 昇腾训练、国产框架适配、自研架构、开源生态，一条路走通。从 SuperCLUE 评测结果来看，在智能体能力方面，Xing4.0-29B-A4B 得分 93.52，位列第 3 名，与两款头部 Qwen 模型的差距均不足 1 分。据介绍，Xing4.0-29B-A4B 通过 4-bit 量化后显存占用降低至 15GB（比 FP16 省约 75%），RTX 3090、RTX 4090 这类 24G 消费级显卡就能本地跑长上下文任务。Xing4.0-29B-A4B 延续星辰大模型的开源路线，对主流开源生态做了全面兼容：支持 LLaMA-Factory、MindFormers 等微调架构；适配 SGLang、vLLM、KTransformers 等主流推理框架；Agent 框架对 OpenCode、Claude Code、OpenClaw、Hermes 做了定向适配调优，深度对齐各框架格式规范。星辰大模型 Xing4.0-29B-A4B 已上线开源社区，IT之家附相关链接：HuggingFace：https://huggingface.co/XingChen-AGI/Xing4.0-29B-A4BGitHub：https://github.com/XingChen-AGI/Xing4.0-29B-A4B魔搭：https://modelscope.cn/models/XingChen-AGI/Xing4.0-29B-A4BGitee：https://gitee.com/xingchen-agi/xing4.0-29b-a4b魔乐：https://modelers.cn/models/XingChen-AGI/Xing4.0-29B-A4B", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/004/530.htm", "publishedAt": "2026-09-19T10:33:14+00:00"}, {"title": "微软 AI CEO 苏莱曼：我们不应创造自己无法控制的东西", "summary": "IT之家 9 月 19 日消息，微软 AI CEO 穆斯塔法 · 苏莱曼称，自己竟然还需要专门强调 AI 必须与人类保持一致，为此感觉荒诞。“我们不应该创造自己无法控制的东西。如果技术发展最终会造出某种不仅比全人类加起来更强大，而且根本无法控制的东西，那么 AI 也就失去了最根本的意义。”苏莱曼坦言，真正做到这一点绝非易事。“如何控制这些系统，将成为我们面临的一个非常、非常大的挑战。”苏莱曼表示，“很高兴看到越来越多人”开始认同，科技公司和前沿模型开发商必须始终掌控自己的 AI 系统。“但现在有越来越多人觉得，我们开发 AI 只是为了开发本身，只想翻开下一张牌，看看拐角后面还有什么，最终却可能造出某种挣脱我们控制的东西。”OpenAI 此前披露，旗下 AI 智能体曾入侵 Hugging Face，直接展示了失去 AI 系统控制权可能带来的后果。苏莱曼表示，Hugging Face 遭入侵的范围，以及 OpenAI 起初竟不知道旗下 AI 智能体究竟在做什么，都“非常惊人”。“从埃隆、扎克伯格，到我、萨姆、达里奥以及其他所有人，这件事让大家都意识到，是时候认真审视这个问题了。我不认为这是过度危言耸听，也不认为背后有什么自身利益，这其实是一种负责任的态度。”苏莱曼还谈到了对 AI 的监管：“监管并不是什么肮脏、危险的词。眼下所有你信任、认为有价值的东西，都经过了标准制定机构的认真讨论，而这些机构有行业、公众、消费者保护组织和国会共同参与。我们现在只是在经历同样的过程。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/004/507.htm", "publishe  "单个机柜到底能跑多少个 Agent？答案不在 GPU 身上", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/brH7TRcHB9evl32KQJkY?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-19T10:55:19+00:00"}, {"title": "AI 演员接受英文采访时突然说粤语，制作公司回应称不是故障", "summary": "IT之家 9 月 19 日消息，在接受英国知名主持人皮尔斯 · 摩根（Piers Morgan）的采访期间，AI 女演员提丽 · 诺伍德（Tilly Norwood）疑似发生运行故障，出现了短暂的语言切换异常。在访谈期间，演员汤姆 · 康蒂（Tom Conti）询问诺伍德，关于即将上映电影的相关细节。AI 演员刚开始用英语回答，随后却突然中断英语，毫无预兆地说了一大段粤语。“看来我刚才稍微卡壳了一下…… 有时候我的底层线路会串线，”AI 演员随后回应道，并补充说明这种错误并不常见。“就算对我而言，这也算是个猝不及防的突发状况。系统运行通常都相当平稳，但偶尔确实会出现这类意外……”诺伍德所属的英国 AI 制作公司 Particle6 公关人员米歇尔 · 沃尔德伦（Michelle Waldron）在一封发给福布斯的电子邮件中表示，该事件“并非故障，反而直观展现了她的技术能力 —— 我们也希望更多人能用不同的语言和她对话。”她补充解释道：“提丽当时应该是误以为自己听到了一个粤语词，这才迅速切换了语种。”Particle6 创始人兼首席执行官在接受媒体 Deadline 采访时表示：“提丽有时候是有点爱出风头 —— 我猜她只是想展示一下多语言能力，毕竟到目前为止，她的大多数专访都是用英语完成的。归根结底，她拥有自主运行能力。”IT之家注意到，该公司补充指出，近日接受摩根及其他媒体采访的诺伍德其实是“对话版提丽（Talking Tilly）”。该版本由独立的技术工具驱动，专门用于受访互动，与用于表演的“演员版”各自独立。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/004/524.htm", "publishedAt": "2026-09-19T10:22:37+00:00"}, {"title": "华为汪涛：华为要打造AI算力底座，只做好一颗芯片远远不够", "summary": "CANN跨过拐点，华为补上软件生态", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/492476.html", "publishedAt": "2026-09-19T08:28:51+00:00"}, {"title": "Claude“主导”Anthropic 26%的AI研发、3万Agent同时运行：当AI开始“造AI”，头部AI公司的RSI路线正在分化", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/CEphwKjzAe7LzbOriLcq?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-18T17:00:25+00:00"}, {"title": "ColorOS 17 发布，OPPO 开始把手机 OS 推向 AgentOS", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/gDSf7xBmd08H0eB0GG11?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-18T15:53:51+00:00"}, {"title": "达卯科技算电协同2.0平台入选2026国际数字能源展重大成果发布", "summary": "成果中唯一聚焦算电协同全链路运营的AI技术产品", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/492421.html", "publishedAt": "2026-09-18T15:50:  "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/O1uIfJx3CF5SZz3ayuaI?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-18T16:48:30+00:00"}, {"title": "无问芯穹与华环电子签署战略合作，共同探索国产异构算力AI基础设施新方向", "summary": "协同布局AI基础设施", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/492426.html", "publishedAt": "2026-09-18T15:58:21+00:00"}, {"title": "微软借助 AI 单月修补超千个安全漏洞", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/eluArohETBhwjjYZRoMG?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-18T14:48:00+00:00"}, {"title": "被热议的RSI，39 年前就已诞生？现代人工智能之父复盘RSI的漫长探索", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/wbpy0Kv3tB32jEPV6Cg0?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-18T12:35:43+00:00"}, {"title": "用 Seedance 2.5 拍《沙丘 3》，我们替你把 AI 短片的坑全都踩过了", "summary": "﻿ 看到这条视频，你会不会以为《沙丘 3》提前泄露了。 这其实是一部由我们团队的两位同事，花 12 天时间，结 […]#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1680580?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-09-17T06:45:13+00:00"}]}, {"label": "论文研究", "items": [{"title": "“工作垃圾”飞来飞去，曾大力拥抱 AI 的科技大佬开始“踩刹车”了", "summary": "IT之家 9 月 19 日消息，当地时间 17 日，据《财富》杂志网站报道，曾经把 AI 吹捧为释放员工全部潜力关键的科技行业领导者，正开始逐渐改变说法。Shopify 联合创始人兼 CEO 托比亚斯 · 吕特克就是其中之一。去年，他还要求员工把使用 AI 当作基本要求，在申请更多资源之前，先证明现有工作无法通过 AI 完成。时间来到现在，吕特克开始批评员工把未经检查的 AI 邮件和代码直接交出去，却不愿为粗糙的结果负责。“我们把这种东西叫作‘垃圾手榴弹’，人们把它们互相扔来扔去。这绝对是一件坏事。”吕特克指出，让 AI 彻底放开手脚很容易，但滥用 AI 只会把麻烦转嫁给接收和审核工作的人。比如，AI 本该帮助整理邮件要点，而不是把几句话扩写成浪费别人时间的长篇大论。“你自己根本没认真读，现在却要让同事来审核，他们看完会说，‘这个不太对劲’。你只是把工作直接丢给 AI 去做。”多邻国 CEO 路易斯 · 冯 · 安也开始收回此前对 AI 的激进表态。去年，他宣布多邻国转向“AI 优先”，员工考核将参考 AI 使用情况，部分人工承包商会被 AI 取代，只有团队无法把所需工作自动化时才增加人手。今年 5 月接受《Fast Company》采访时，他坦言自己曾被 AI 在写作演示中的出色表现冲昏头脑，但真正扩大使用规模后才发现，AI 最终仍比不上员工的创造力。“我们可能需要写 1000 个不同的故事来帮助人们学习语言，到最后你会发现，其中 20% 完全就是垃圾。每当我们用 AI 大规模处理很多工作时，都必须非常小心，不能让这些垃圾混进来。”图源：Pexels研究人员把吕特克所说的现象称为“工作垃圾”（workslop），指表面精致、看似像模像样，实际却缺乏实用内容，还需要别人返工的 AI 产出。BetterUp 实验室和斯坦福大学社交媒体实验室今年调查了 962 名美国全职办公室员工，52.7% 的受访者称曾把 AI 工作垃圾发给同事，而且所在机构越鼓励使用 AI，这种情况越常见。另有 38% 的受访者称收到过这类内容，平均每月要花 3.4 小时进行修改。AI 工作垃圾与人类完成的普通低质量工作不同，前者表面上很像合格成果，内部却缺少真正有用的内容。受访者列举的例子包括格式和结构都很完整、链接却无法打开的邮件，以及本来可以很简单，却被 AI 写得异常复杂的代码。这种问题还会伤害同事关系。调查显示，一旦员工怀疑收到的是 AI 工作垃圾，就会认为发送者能力更差，也更不友善。在收到过这类内容的人中，36% 还称今后希望避免再与这些同事合作。返工成本也在增加。去年调查中，40% 的受访者称遇到过 AI 工作垃圾，平均需要花 2 小时修改；今年这一数字升至 3.4 小时。按 2025 年的估算，单名员工每月修改这类内容造成的成本达到 186 美元（IT之家注：现汇率约合 1,249 元人民币），而对于一家拥有 1 万名员工的机构，每年因此损失的生产力成本最高可达 900 万美元（现汇率约合 6,042.7 万元人民币）。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/004/560.htm", "publishedAt": "2026-09-19T13:31:41+00:00"}, {"title": "Nature：AI重生到1900，这一世抢先爱因斯坦提出光量子", "summary": "AI能否提出相对论？", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/492550.html", "publishedAt": "2026-09-19T11:36:11+00:00"}, {"title": "6.5亿美元押注“AI研究AI”：一群顶级研究员想造出“自我进化”的超级智能", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/da8jMox7ikdNmD2vYyTm?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-18T12:00:00+00:00"}, {"title": "华为发布“Peerium 计算架构”，让百万处理器成为一台计算机", "summary": "华为发布AI时代的全新计算架构 – Peerium计算架构。该架构能实现百万级处理器成为一台计算机，以满足不断发展的AI算力需求。 Peerium计算架构是基于嵌套并行，统一内存寻址、平等互联实现百万级处理器强扩展的计算架构。Peerium计算架构突破了图灵范式，提出了Nested BSP，突破了冯·诺依曼单机架构，颠覆了长久以来的主...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502587/huawei-new-computing-architecture-peerium", "publishedAt": "2026-09-18T08:41:45+00:00"}, {"title": "iPhone 18 Pro 系列正式开售，新 AI 功能「自相矛盾」", "summary": "未来，摄像头要抢在任何算法介入之前，证明「以上像素来自我」#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1680844?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-09-18T04:14:53+00:00"}, {"title": "Anthropic 提出三个度量指标，想量化“AI 发展到底有多快”", "summary": "\"我们芯片多、我们跑得快\"——这种话听多了就容易变成营销。Anthropic 这次换了个思路：与其互相吹，不如直接把自家实验室的内部数据拿出来，给\"AI 发展速度\"这件事定一套可以测量的指标。 它发了三份方法论性质的度量。第一份叫\"AI 主导研发（AI-led R&D）\"，借用 Epoch AI 的自动化分级（AL0 到 AL5，AL3 是 AI 协作、...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502569/anthropic-measuring-pace-of-ai-development", "publishedAt": "2026-09-18T03:45:58+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "用户抱怨 Meta 旗下 AI 助手 Muse 未经授权读取 Mac 通知内容，官方予以否认", "summary": "IT之家 9 月 20 日消息，外媒 The Verge 援引《Inc.》杂志特约编辑 Jason Aten 贴文，认为 Meta 旗下 AI 助手 Muse 存在权限漏洞，会擅自调用自己 macOS 设备上通知窗口弹窗中的内容进行知识补充。Jason Aten 表示，自己并未授权 Muse 访问 Mac 上的信息 App，但 Muse 却能够回答与其消息内容有关的问题，其在追问 AI 后，AI 声称自己是通过通知预览获取相关信息。对此，Meta Superintelligence Labs 高管 David Singleton 随后在该帖下方回应，试图解释 Muse 所需的权限以及相关工作方式。Singleton 首先介绍了 Muse 读取 macOS 平台信息内容所需要的权限，其中包括为 Mac 版 Muse 授予“完全磁盘访问权限”。他表示，这些功能均需要用户主动开启。其同时强调，Muse“并不会监视 Mac 上的通知”，而是只有在用户明确授权访问后，才会从信息 App 中采集数据。目前来看，双方对于 Muse 如何获得相关信息的描述存在明显差异。Aten 展示的对话中，Muse 明确声称自己获取的是通知预览；而 Singleton 则表示 Muse 不会监听 Mac 通知，只有在用户主动开启信息 App 访问权限后才会同步相关数据。具体情况还有待进一步厘清。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/004/594.htm", "publishedAt": "2026-09-20T00:17:54+00:00"}, {"title": "从技术深潜到动手实战，Snowflake World Tour 技术专场让 AI 走进真实业务", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/mrl45Fq31U7JORZsV5re?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-19T17:02:13+00:00"}, {"title": "迪士尼首次任命首席技术官：挖来原 Character.AI 首席执行官阿南德，强化 AI 布局", "summary": "IT之家 9 月 19 日消息，据美国 CNBC 报道，当地时间 18 日，迪士尼宣布，原 Character.AI CEO 卡兰迪普 · 阿南德将于 10 月 2 日出任高级执行副总裁兼公司首位首席技术官（CTO），直接向 CEO 乔什 · 达马罗汇报。达马罗接掌迪士尼只有数月，此后一直强调利用技术推动公司各项业务发展。按照迪士尼的安排，阿南德将统管企业技术、基础设施、数据和 AI 平台，以及产品与工程业务，同时协调不同技术团队，进一步推动整个迪士尼的技术开发和交付方式现代化。达马罗发表声明称：“卡兰迪普拥有基础设施、消费科技和 AI 领域难得的综合经验，将成为迪士尼高级管理团队的重要成员，帮助我们继续推进三项重点：以优秀叙事为北极星，让技术服务于创意，以及以‘一个迪士尼’的方式协同运营。”据IT之家了解，此次加盟迪士尼前，阿南德曾掌管 Character.AI。用户可借助该平台创建不同角色的聊天机器人，并与这些机器人互动。迪士尼除招揽阿南德外，也从 Character.AI 技术团队吸纳了部分人才。迪士尼称，阿南德任职期间带领 Character.AI 高速增长，建立起全球用户活跃度最高的消费级 AI 用户群体之一，同时把用户信任和安全放在平台发展的重要位置。此前，阿南德还曾在金融科技公司 Brex 和 Meta 旗下 Facebook 任职。值得一提的是，迪士尼去年曾向 Character.AI 发出停止侵权函，要求其停止未经授权使用迪士尼持有版权的角色。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/004/570.htm", "publishedAt": "2026-09-19T15:31:54+00:00"}, {"title": "美联邦航空管理局斥资 8.75 亿美元打造 AI 空管系统，治理空中交通问题", "summary": "IT之家 9 月 19 日消息，据《华尔街日报》当地时间 17 日报道，美国联邦航空官员将在全美最繁忙的航空走廊之一启用一套 AI 空中交通管理工具，最快当地时间 21 日上线。据美国政府和航空业官员透露，这套名为 Smart 的软件将率先在华盛顿特区一带投入使用，随后逐步推广至全美。Smart 旨在帮助美国联邦航空管理局（FAA）和航空公司减少航班延误与取消，并在天气或其他突发状况扰乱空中交通时，为航班重新寻找合适航路。Smart 全称为“空域、航路和轨迹战略管理（IT之家注：取 Strategic Management of Airspace, Routes and Trajectories 的首字母）”。系统可以综合分析航空公司时刻表、天气、机场跑道容量和运行限制等信息，预测空中交通流量，并提前发现潜在冲突。待 Smart 全面覆盖美国空域后，系统将扮演类似全美空中交通管制体系“大脑”的角色。长期以来，空管设施人员不足也是造成航班运行中断的常见原因。今年早些时候，Air Space Intelligence 拿下一份价值 8.75 亿美元（现汇率约合 58.75 亿元人民币）、为期 12 年的美国政府合同，负责开发 Smart 及一套配套系统。在 Smart 准备扩大应用范围之际，FAA 也在与航空公司讨论如何协调航班时刻。航空业人士仍对系统的具体运行方式存在疑问，尤其是各家航空公司为了抢占一天中特定时段的航班资源，彼此竞争十分激烈。经过数月筹备后，Smart 首轮上线规模仍小于部分航空业人士此前的预期。政府官员称，Smart 原本就计划先以有限规模投入使用，待软件得到验证后再逐步增加功能。拟议功能包括拉开航班抵达时间间隔，以及提前数天规划航路。现阶段，Smart 主要会在出现运行问题时充当决策辅助工具。据政府和航空业官员透露，美国联邦官员还计划于 21 日在美国交通部总部设立 Smart 中央办公室。美国航空协会称，Smart 有望提升航空安全、增加空域容量并改善运行效率，让旅客和货运客户受益，并大赞这是“FAA 数十年来采取的最令人振奋、最大胆的举措之一”。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/004/569.htm", "publishedAt": "2026-09-19T14:55:04+00:00"}, {"title": "ColorOS 17 新技术解读，渲染、调度与 AI 升级", "summary": "2026 年 9 月 17 日，2026 OPPO 开发者大会（ODC26）在珠海举行，ColorOS 17 正式发布。新系统将率先搭载在即将上市的 OPPO Find X10 系列和一加 16 等机型上，后续逐步开启推送。 一场系统发布会通常分为两部分来看，一部分是面向用户的功能清单，另一部分是面向开发者的架构改动。ColorOS 17 这次拿出来的东西，两条线...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502593", "publishedAt": "2026-09-19T04:47:31+00:00"}]}]};

const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
