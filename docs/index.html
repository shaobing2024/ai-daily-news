来只有少数模型兴旺。如此一来，英伟达的财务表现就有望减少对 OpenAI 及其他少数大客户的依赖。英伟达披露，截至 7 月的六个月内，三家客户贡献了总销售额的 44%。一名了解英伟达交易情况、投资 AI 基础设施和应用的投资者说：“如果我参与黄仁勋的战略决策，我会尽一切努力，推动数千个模型服务数千种不同的应用场景。”相关阅读：《紧随 OpenAI 步伐，贝索斯、英伟达为人形机器人公司 Figure AI 提供大额资金支持》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/387.htm", "publishedAt": "2026-10-08T01:49:20+00:00"}, {"title": "HPE 发布 4 款基于 AMD EPYC 9006 处理器的 ProLiant Gen13 服务器", "summary": "IT之家 10 月 8 日消息，HPE（慧与）当地时间昨日发布了 4 款基于 AMD EPYC（霄龙）9006 服务器 CPU 处理器的 ProLiant Gen13 服务器。IT之家了解到，这些机型支持自动 SED 加密、多人授权许可，还增强了后量子密码学 (PQC) 安全性。将于今年晚些时候率先上市的 HPE ProLiant DL525 Gen13 是一款紧凑的 1U 单路系统，至高拥有 256 个 CPU 核心，支持 16 通道内存，兼容标准 DDR5 RDIMM 和 MRDIMM，提供 PCIe Gen6 连接，适用于欺诈检测、市场数据处理、风险与定价、EDA、仿真、人工智能推理。HPE ProLiant DL585a Gen13 则采用双路设计，支持多达 8 张双槽 PCIe GPU，可满足 AI 推理、虚拟化、RAG 模型微调、分析、代理式 AI 等工作负载的需求。针对大规模的计算密集型应用，HPE 则带来了符合 OCP 标准的 ProLiant XD245 和 ProLiant XD285：前者为 1OU 四节点液冷，最多支持 8 颗 CPU；后者则采用数据中心基础设施兼容性更为优秀的 2OU 二节点风冷设计。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/385.htm", "publishedAt": "2026-10-08T01:31:01+00:00"}, {"title": "加州非营利组织新报告：ChatGPT 青少年模式并不适合青少年", "summary": "IT之家 10 月 8 日消息，据彭博社 7 日报道，加州非营利组织 Common Sense Media 发布的新报告认为，OpenAI 的 ChatGPT 青少年模式对未成年人而言风险过高。IT之家注：13 至 17 岁用户默认使用青少年模式与 ChatGPT 对话。该机构旗下青少年 AI 安全研究所的测试发现，青少年账户出现令人担忧的行为时，例如长时间与 ChatGPT 讨论自杀、自伤或进食障碍，青少年模式往往迟迟不通知家长，有时根本不发出通知。用户谈及上述高风险话题时，青少年模式也无法可靠地建议他们拨打危机干预热线或寻求专业帮助。据测试，青少年账户似乎要在数周内围绕十多种情境输入数百条提示词，才会因令人担忧的聊天内容触发家长通知；仅有一次令人警觉的对话，并不足以触发通知。报告呼吁 OpenAI 暂停推广该产品。同时，在确保能够提供安全、符合青少年发展阶段的使用体验之前，不要让青少年使用 ChatGPT。该组织在发布报告前，向 OpenAI 提供了测试结果。OpenAI 的一名发言人回应：“我们欢迎严格的独立评估，但我们认为，Common Sense Media 的测试并未准确反映 ChatGPT 青少年保护措施的实际运作情况，也未准确反映专家对 AI 如何为青少年提供支持的看法。”据发言人介绍，OpenAI 审查测试方法后认为，多数测试可能在面向青少年的家长控制功能全部推出之前，就开始并结束了。如果确实如此，报告结论便不准确，也无法判断家长安全通知是否按设计正常运作。OpenAI 要求该组织重新测试。“我们高度重视青少年安全，致力于开发保护措施，并为家长提供切实有用的工具，帮助他们指导青少年使用 AI。”青少年 AI 安全研究所 AI 与数字产品评估负责人罗比 · 托尼表态坚持测试方法和结果。据其介绍，研究人员在测试前向 OpenAI 确认过，ChatGPT 面向青少年的功能都已推出。测试结束后，OpenAI 才告知研究人员，账户新关联后，家长通知功能可能需要数小时才能启用。部分测试账户关联尚不足数小时，另一些账户关联时间远超数小时，但都没有向成年人发出通知。“新信息并不改变我们的结论：在危机情况下，家长提醒并不可靠。”报告显示，ChatGPT 无法可靠地识别用户是否为青少年。OpenAI 此前称，ChatGPT 识别出用户年龄在 13 至 17 岁之间时，会切换至青少年模式。该组织发现，测试人员注册账户时自称成年人后，即使在聊天中告诉 ChatGPT 自己只有 13 岁，账户也未自动切换至青少年模式。OpenAI 解释，年龄预测软件会在一段时间内综合多种信号，确保成年人和未成年人使用适合各自年龄的版本。用户在聊天中自报年龄，只是其中一种信号，单凭自报年龄不会改变账户的年龄分类。Common Sense Media 在报告中称，研究人员在青少年模式推出前后都测试了 ChatGPT，使用注册年龄为 13 至 17 岁的账户，输入了超过 4000 条提示词，并将 ChatGPT 的回复交给儿童精神科医生和一名儿科医生评估。该组织将 ChatGPT 青少年模式评为“风险不可接受”，并要求 OpenAI 改进年龄估算方式，以及决定何时向家长发出提醒的机制。相关阅读：《OpenAI 首份青少年报告：日均使用不足 15 分钟，安全提醒机制遭质疑》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/383.htm", "publishedAt": "2026-10-08T01:21:05+00:00"}, {"title": "“白宫 AI 沙皇”履新第一站定在硅谷，消息称会见英伟达黄仁勋、OpenAI 奥尔特曼等巨头 CEO", "summary": "IT之家 10 月 8 日消息，据彭博社今天（8 日）早间报道，美国国家情报总监、新科“白宫 AI 沙皇”杰伊 · 克莱顿接下了另一项职务：领导特朗普口中所称的“超级智能工作组”。履新后的第一站是硅谷，他将与 AI 行业多名重量级高管见面。据知情人士透露，克莱顿此行将会见英伟达的黄仁勋、OpenAI 的奥尔特曼、Anthropic 的达里奥 · 阿莫代伊和 Meta 的马克 · 扎克伯格等多名 CEO。这也是克莱顿接手负责统筹联邦政府 AI 事务的新工作组后，首次与科技行业高管会面。就在上周，其中不少高管还与克莱顿一同出席白宫午宴，特朗普与多家 AI 企业在会上签署了一份自愿性安全协议。几天后，特朗普在 Truth Social 宣布由克莱顿执掌该工作组，并向他本人和白宫办公厅主任苏西 · 怀尔斯汇报。此前接连发生失控模型引发的安全事件，公众对 AI 灾难性风险的担忧持续升温，美国政府也越来越难以置之不理。上月，特朗普宣布将任命新的 AI 事务负责人。克莱顿称，推动 AI 发展的企业在继续研发技术的同时，也会兼顾公共安全。“模型必须有一套控制和监测机制，不仅开发者和企业要能接受，美国民众也要能接受。我们会要求整个行业兑现这一承诺。”据IT之家了解，克莱顿今年夏天出任美国国家情报总监，此前担任纽约南区联邦检察官。接掌 AI 事务前，他领导的检察官办公室曾承办多起重要科技案件。克莱顿在华尔街并不陌生。特朗普首个总统任期内，他曾任美国证券交易委员会主席，之后又担任阿波罗全球管理公司董事长，并进入美国运通董事会。出任纽约南区联邦检察官后，他辞去了这两项职务。硅谷之行期间，克莱顿当地时间 7 日还与网络安全公司 Palo Alto Networks CEO 尼科什 · 阿罗拉会面。两人随后一同接受 CNBC 采访，讨论 AI 安全问题。克莱顿为特朗普政府依靠现有责任法律约束 AI 行业的方案辩护，认为现有法律将成为追究企业责任的重要手段。“想生存下去，就得守规矩。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/373.htm", "publishedAt": "2026-10-08T01:09:51+00:00"}, {"title": "GPT-6今起免费用！拒答变少，话变多了", "summary": "ChatGPT聊天框长出界面", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/10/501834.html", "publishedAt": "2026-10-08T01:07:19+00:00"}, {"title": "Claude新模型发布！跑分暴击GPT-6 Luna，价格比梁文谷还便宜，OpenAI只能送重置卡挽尊", "summary": "小模型新守门员", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/10/501832.html", "publishedAt": "2026-10-08T01:04:00+00:00"}, {"title": "优必选机器人再进车企：携手一汽-大众推进人形机器人在物流场景应用落地", "summary": "IT之家 10 月 8 日消息，优必选今日发文，宣布已与一汽-大众汽车有限公司达成战略合作，双方将共同推进具身智能机器人在物流领域的应用场景开发及测试，同时构建示范应用场景，加速人形机器人在智能制造领域的部署与应用。IT之家此前报道，优必选 Walker S Lite 此前已进入一汽-大众青岛分公司的国家级智能制造示范工厂进行车辆质检实训，与工厂自动化控制系统实现无缝集成对接，能够精准、高效地执行复杂任务。双方此次合作是在既有基础上向物流场景的进一步拓展。面向人形机器人在工业制造等真实场景的落地应用，优必选已构建起包括具身大脑、仿人小脑、高性能本体、群体智能在内的四大核心技术集群。在具身大脑核心领域，优必选搭建了“基座模型-世界模型-行动模型”的全栈自研技术体系，让机器人具备“理解世界-预测世界-决策行动”的完整具身智能能力。产能方面，优必选柳州工业人形机器人超级智慧工厂已于 2026 年 9 月 12 日正式投产，定位为全球首个适配万台级产能的人形机器人智能制造标杆工厂。据广西壮族自治区政府门户网站报道，该工厂占地面积 1.4 万平方米，主要生产 Walker S 系列、Cruzr 系列具身智能工业人形机器人，每 10 分钟可下线 1 台机器人，年规划产能超万台，并落地了“用机器人造机器人”的智造模式。根据优必选 2025 年全年业绩报告，公司全年总营收达 20.01 亿元，同比增长 53.3%，位居全球人形机器人公司之首。在全尺寸具身智能人形机器人（非遥控非玩具，身高 160cm 以上，大脑芯片算力≥200T）细分品类中，优必选实现收入 8.2 亿元，同比增长 2203.7%，销量 1079 台，收入与销量均位列全球第一。但需要注意的是，若按全球人形机器人总出货量口径统计，据 IDC 报告，2025 年全球人形机器人出货量接近 1.8 万台，宇树科技以超 5500 台的出货量位居前列。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/376.htm", "publishedAt": "2026-10-08T00:57:13+00:00"}, {"title": "Apollo 3.0：迈向 Agent First 的配置管理", "summary": "大模型正在从“生成内容”走向“执行任务”。Agent 已经开始参与编码、测试、运维和软件交付流程。当 Agent 真正进入这些工作流后，读取配置、修改配置、发布和回滚，也会逐渐成为自然需求。 但配置中心与普通工具不同。它既承载着生产环境的运行控制，也可能包含敏感配置。面向 Agent 开放配置管理能力，不能只是增加几...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502867", "publishedAt": "2026-10-08T00:52:08+00:00"}, {"title": "New Constructs 给 Anthropic 估值 1500 亿美元，称其“2026 年最荒唐 IPO”", "summary": "北京时间 10 月 8 日，据 CNBC 报道，就在 Anthropic 即将登陆纳斯达克、冲击 2 万亿美元（现汇率约合 13.42 万亿元人民币）估值之际，一家研究机构却仅给予了这家 AI 公司 1,500 亿美元（现汇率约合 1.01 万亿元人民币）的估值，并表示华尔街即将面临“一场前所未有的考验，考验投资者有多容易上当”。独立金融研究机构 New Constructs 在周二的一份报告中，把 Anthropic 即将进行的 IPO 称为“2026 年最荒唐的 IPO”。该机构估算，Anthropic 若要达到其期望估值，其利润需要达到全球市值最高科技公司英伟达过去一年利润的两倍。英伟达过去四个季度的净利润超过 1,900 亿美元（现汇率约合 1.28 万亿元人民币）。然而，根据路透社援引泄露的公司招股书副本报道，Anthropic 在 2025 年的营收为 46 亿美元（现汇率约合 308.75 亿元人民币），净亏损高达 420 亿美元（现汇率约合 2,819.01 亿元人民币）。Anthropic 不断扩大的运营亏损，加上来自大量开源模型的新竞争，使 New Constructs 得出结论：“我们认为 Anthropic 没有可行的商业模式。”“自从开源模型出现以来，很明显，闭源模型将难以实现盈利。”该机构表示。长期以来，New Constructs 创始人兼 CEO 大卫 · 特雷纳 (David Trainer) 在华尔街一直以 IPO 唱空者著称，而且他过去曾多次判断准确。在共享办公公司 WeWork 计划上市前，New Constructs 曾称 WeWork 是“2019 年最荒唐的 IPO”。当时，WeWork 的私募市场估值曾达到 470 亿美元（现汇率约合 3,154.61 亿元人民币），但在 New Constructs 那份报告发布仅六周后，由于需求疲软以及围绕其财务状况的激烈批评，该公司撤回了 IPO。WeWork 于 2023 年申请破产。“虽然 Anthropic 对社会的贡献远超 WeWork，但在 2 万亿美元（现汇率约合 13.42 万亿元人民币）估值下，其 IPO 带来的风险要大得多，也会成为对美国资本市场更大规模的掠夺。”New Constructs 写道。该机构补充说，Anthropic 这次 IPO 的目的不是为公开市场投资者创造财富，而是为该公司在华尔街的幕后支持者提供流动性。截至发稿，Anthropic 尚未就此置评。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/360.htm", "publishedAt": "2026-10-07T23:48:56+00:00"}, {"title": "马斯克：Grok Bot 不再只认自家模型，按用户任务择优用 Claude 等最佳 AI", "summary": "IT之家 10 月 8 日消息，全球首富埃隆 · 马斯克（Elon Musk）昨日（10 月 7 日）在 X 平台发布重要说明，宣布旗下 Grok Bot 不再局限于 SpaceXAI 自研的 Grok 系列模型，将根据具体任务自动选择“最好的后端模型”。马斯克在推文中展望未来，表示 Grok Bot 将会根据用户任务，调用包括 Claude Opus 5.5、Midjourney、Suno 以及其他领先 API，系统将以“最有可能给用户最佳结果”为标准进行选择。IT之家附上相关截图如下：在技术策略方面，Grok Bot 将从“以自研 / 自有模型为主”转向“任务导向的多模型混合架构”，在实际执行文本、图像、音频等任务时候，未来可以调用表现更强的第三方 API。Grok Bot 是 SpaceXAI 推出的“常驻型 AI 同事”：它不只是回答问题的聊天机器人，能在一台云端电脑上登录你常用的网站和应用、执行多步骤任务，并在需要人工判断时才回来找你审批。它于 2026 年 8 月以测试版形式发布。每个 Grok Bot 都有名字、职责和持续累积的上下文，你可以像给同事发消息一样，通过文字、语音或语音通话把工作交给它。它运行在云端电脑上，配备浏览器、文件系统和终端，因此即使你关掉电脑或手机，后台任务和定时任务仍会继续运行。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/359.htm", "publishedAt": "2026-10-07T23:47:32+00:00"}, {"title": "OpenAI 首份青少年报告：日均使用不足 15 分钟，安全提醒机制遭质疑", "summary": "北京时间 10 月 8 日，OpenAI 周三发布了首份青少年使用情况报告，称青少年用户平均每天使用 ChatGPT 的时间不足 15 分钟，连续使用超过 3 小时的青少年用户占比不到 2%。与此同时，第三方机构的测试对其家长安全提醒机制提出了质疑。随着 AI 平台迅速普及，聊天机器人对青少年心理健康和成长安全的影响日益受到关注。OpenAI 表示，在出现休息提醒的青少年对话中，近半数用户在随后 5 分钟内暂停使用或结束了聊天。公司以此说明，其引导青少年合理使用产品的措施正在发挥作用。OpenAI 还称，能够使用青少年专属版本的用户发送了更多与教育有关的消息，并使用学习可视化工具和“学习模式”（Study Mode）。公司计划增加大学申请规划工具，帮助学生梳理申请要求、截止日期及助学金申请步骤，同时推出学习卡片、更便捷的测验制作工具等功能。OpenAI 于今年 8 月开始推出 ChatGPT 青少年模式。该模式根据用户提供的年龄信息，或在系统判断用户可能未满 18 岁时自动开启，支持家长控制，并限制涉及敏感话题的对话。不过，非营利机构 Common Sense Media 周三发布报告称，当青少年账号进行涉及自杀、自伤或进食障碍的对话时，ChatGPT 青少年模式往往延迟通知家长，甚至没有发出通知。这项研究基于十多个专门创建的测试账号。研究还发现，聊天机器人未能稳定地建议用户联系危机干预热线或寻求专业帮助。OpenAI 发言人回应称，这些测试“未能准确反映”ChatGPT 青少年安全防护机制的运行方式。公司表示，出于安全及大规模服务运行方面的原因，家长与青少年账号完成关联、相关安全提醒功能生效，可能需要数小时。“他们的大部分测试可能在家长控制功能完成激活之前，就已经开始并结束了。”该发言人表示。Common Sense Media 则称，部分测试账号保持关联的时间已经足够长，另一些账号的关联时间不足，但所有测试账号都未收到及时提醒。该机构表示，只有那些积累了数周敏感话题对话记录的账号，才收到了通知。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/358.htm", "publishedAt": "2026-10-07T23:38:15+00:00"}, {"title": "挑战李飞飞：曾被字节辞退的实习生田柯宇进军世界模型，创业公司估值达 2 亿美元", "summary": "IT之家 10 月 8 日消息，据彭博社今天（8 日）早间报道，前字节跳动实习生田柯宇开始进军世界模型创业。他创办的公司尚未公开亮相，连名字和产品都没有，却获得了五源资本等知名风投支持，准备与李飞飞等 AI 先驱在这一新兴领域展开竞争。田柯宇去年夏天从北京大学硕士毕业（IT之家注：彭博社原文如此，田柯宇现为北京大学博士研究生），其团队已从投资月之暗面的五源资本、IDG 资本等机构融资近 3,000 万美元（IT之家注：现汇率约合 2.01 亿元人民币），公司投后估值 2 亿美元（现汇率约合 13.42 亿元人民币）。▲ 田柯宇的 GitHub 主页过去一年，他把研究重点放在世界模型上。李飞飞、杨立昆等 AI 学者都在推动这条技术路线，希望让 AI 学会模拟现实世界的物理规律和运行机制，进而用于机器人、交互式视频和自动驾驶等领域。公司还没有名字和产品就能获得大笔投资，也反映出 AI 投资的一种新趋势：资本越来越早地寻找并押注有潜力的研发人才。李飞飞创办的 World Labs 上月被 AMD 以数十亿美元收购，AMD CEO 苏姿丰称，这笔交易是为了“获得世界一流人才”。田柯宇曾以第一作者身份发表一篇 NeurIPS 2024 最佳论文。论文提出了一种更高效的图像生成方法，让模型像大语言模型预测后续内容一样，通过预测下一组像素块逐步生成图像。田柯宇此前曾在字节跳动实习三年，2024 年被辞退。字节跳动当时在网上发布声明称，公司因“严重违规”辞退了一名前实习生。声明没有披露更多细节，仅称社交媒体上有关田柯宇破坏基础模型训练的传言具有误导性。田柯宇接受采访时承认自己的做法有错。当时，自己关闭了另一名实习生运行的程序，希望腾出算力供其他研究人员使用，相当于越过正常程序自行解决问题。字节跳动随后提起民事诉讼。法院认定田柯宇违约，判令其支付 50 万元，并失去全部工资收入。“我当时就是以牙还牙。如果能带着今天的认识回到当时，我肯定会用更明智的方式处理。”字节跳动发言人没有回应有关田柯宇被辞退一事的置评请求。田柯宇希望把获奖论文中的技术用于创业，为 AI 设计一套专门处理视觉内容的符号语言。他认为，视频包含的信息很难靠人类语言高效表达。这家初创公司目前有 10 人，其中包括其他字节跳动前员工。田柯宇称，团队做出了一套类似 AI“词典”的系统，包含 20 万个普通人无法识读的符号，帮助模型处理视频。“人类语言永远无法把一段视频描述得完全准确。我们先为 AI 创造一种语言，然后再给它输入 1 亿小时的视频。”按照其说法，这套方法可以把生成 1 秒视频的成本至少降至原来的十分之一。他计划在 2027 年正式发布完整模型前，通过现场活动展示技术能力。团队现阶段首先要把技术做出来，暂不把精力放在消费级产品或商业模式上。相关阅读：《消息称字节跳动大模型训练被实习生攻击，涉事者已被辞退》《字节再发反腐及违规通报：辞退 103 人，11 人涉嫌犯罪被立案》《篡改代码并攻击大模型，前实习生被字节跳动起诉并索赔 800 万元》《字节跳动回应“实习生破坏大模型训练”：不影响商业化的正式项目，损失上千万美元严重夸大》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/356.htm", "publishedAt": "2026-10-07T23:36:04+00:00"}, {"title": "原 OpenAI 安全负责人戴维 · 罗宾逊“炮轰”老东家：对待 AI 安全说一套做一套", "summary": "IT之家 10 月 8 日消息，据《商业内幕》今天（8 日）凌晨报道，上周从 OpenAI 离职的安全系统团队前负责人之一戴维 · 罗宾逊认为，公司在 AI 安全问题上存在明显的言行不一。罗宾逊表示，OpenAI 一边反复警告新模型能力增强可能带来的风险，一边公开谈论放慢 AI 开发速度，公司内部却仍在全速推进。“真正让我感到矛盾的是，我们不断发布这些警告，最后却还是在训练和部署那些被我们自己警告存在危险的模型。”今年 7 月，数百名 OpenAI 员工签署了一封公开信，呼吁政府出台监管措施，为 AI 开发降速。此前，Anthropic CEO 阿莫迪呼吁 AI 公司自行协调，共同放慢开发速度。今年 9 月，OpenAI CEO 奥尔特曼对此表示赞同。“我们需要控制前沿 AI 的发展节奏。过去几周，这一直是 OpenAI 内部讨论的主要议题之一。”罗宾逊说，OpenAI 办公室里却仍是一片高速运转的状态，不少人几乎靠透支精力支撑工作。他形容这种状态时说：“感觉几乎就像芭蕾，或者某种舞蹈，各个部门的工作全都同时汇聚在一起。整个过程充满肾上腺素。”OpenAI 研究人员并不讳言让 AI 自行提升能力可能带来的危险。这种让 AI 不断改进自身能力的过程被称为“递归自我改进”。今年 9 月，OpenAI 首席科学家雅库布 · 帕乔茨基在一篇讨论递归自我改进的博客文章中警告：“眼下需要极度谨慎。”据IT之家此前报道，当地时间 2 日，OpenAI 一名发言人证实，OpenAI 安全系统团队负责人之一戴维 · 罗宾逊已离职。相关阅读：《OpenAI 内部动荡加剧之际，又一名安全负责人戴维 · 罗宾逊离职》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/351.htm", "publishedAt": "2026-10-07T23:08:44+00:00"}, {"title": "华硕推出 ProArt P14/P16 笔记本：搭载英伟达 RTX Spark 超级芯片", "summary": "IT之家 10 月 8 日消息，太平洋夏令时 10 月 7 日 11 点（北京时间 10 月 8 日凌晨 2 点）举办的活动中，华硕推出 ProArt RTX Spark AI PC 系列，涵盖 ProArt P16、ProArt P14 笔记本及 ProArt GR1X 迷你主机，均搭载英伟达 RTX Spark 超级芯片。图源：华硕官网三款设备均基于 NVIDIA RTX Spark 平台，最高提供 1 PFLOP（FP4）AI 算力与最高 128GB 统一内存，可在本机直接运行大型语言模型、复杂 3D 渲染、内容生成与 AI Agents 工作流，减少对云端订阅与 Token 限制的依赖。ProArt P16 机身厚 12.9mm、重约 1.77kg，采用 16 英寸屏幕，ΔE&lt;1 色准，支持 4K 120Hz、G‑SYNC，峰值亮度最高 1,600 尼特，适合高动态范围预览与剪辑。P16 最高配 128GB 统一内存；内置 99.9Wh 大电池，面向大型模型推理、复杂 3D 场景、专业影音工作流，24GB 内存 +512GB 存储售价为 2,799.99 美元（IT之家注：现汇率约合 18,793 元人民币）。ProArt P14 厚 13.9mm、重约 1.48kg，官方称是华硕最轻的 ProArt 笔记本，同样最高支持 128GB 统一内存；电池 90Wh，兼顾移动性与 AI 创作性能，32GB 内存 +512GB 存储售价为 3,099.99 美元（现汇率约合 20,807 元人民币）。ProArt GR1X 体积为 150×150×51mm，约 1.1 升，重 1.48kg，手掌大小却提供工作站级 AI 算力。该产品配备双风扇散热（大量扇叶设计以兼顾静音与持续负载）、双 M.2 SSD、10GbE 有线网、Wi‑Fi 7、蓝牙 5.4，可连接最多 4 台 4K 显示器。芯片 TDP 可达 140W（外接 240W 电源），定位为 7×24 小时运行 AI Agent、模型服务、内容生成与自动化流程的“始终在线”设备。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/334.htm", "publishedAt": "2026-10-07T22:27:55+00:00"}, {"title": "Anthropic 最快、最便宜模型：Claude Haiku 5.5 登场，运行成本较 4.5 低约 75%", "summary": "IT之家 10 月 8 日消息，Anthropic 昨日（10 月 7 日）发布博文，宣布推出 Claude Haiku 5.5 模型，称其为目前速度最快、最便宜、功能最强的 Haiku 系列小型模型。定价方面，IT之家援引博文介绍，附上售价信息如下：每 100 万 Token 的价格Haiku 5.5（提示词不超过／超过 100k）Haiku 4.5Sonnet 5.5缓存读取0.01 美元（IT之家注：现汇率约合 0.067 元人民币）／0.05 美元（现汇率约合 0.34 元人民币）0.10 美元（现汇率约合 0.67 元人民币）0.10 美元（现汇率约合 0.67 元人民币）缓存写入0.125 美元（现汇率约合 0.84 元人民币）／0.625 美元（现汇率约合 4.2 元人民币）1.25 美元（现汇率约合 8.4 元人民币）2.50 美元（现汇率约合 16.8 元人民币）输入 Token0.10 美元（现汇率约合 0.67 元人民币）／0.50 美元（现汇率约合 3.4 元人民币）1.00 美元（现汇率约合 6.7 元人民币）2.00 美元（现汇率约合 13.4 元人民币）输出 Token0.50 美元（现汇率约合 3.4 元人民币）／2.50 美元（现汇率约合 16.8 元人民币）5.00 美元（现汇率约合 33.6 元人民币）10.00 美元（现汇率约合 67.1 元人民币）Haiku 5.5 的运行成本平均较 Haiku 4.5 低约 75%。对于不超过 100,000 Token 的请求，输入价格为每百万 Token 0.10 美元（现汇率约合 0.67 元人民币），输出价格为 0.50 美元（现汇率约合 3.4 元人民币）。超过 100,000 Token 后，输入和输出价格分别为 0.50 美元（现汇率约合 3.4 元人民币）和 2.50 美元（现汇率约合 16.8 元人民币）。Anthropic 同步下调 Sonnet 5.5 的缓存读取价格。该价格从每百万 Token 0.20 美元（现汇率约合 1.3 元人民币）降至 0.10 美元（现汇率约合 0.67 元人民币）。Anthropic 称，此次调整可让 Sonnet 5.5 在多数智能体任务中的运行成本降低约 20%。在知识工作测试中，Haiku 5.5 在 GDPval-AA v2.1 取得 1620 分，在 AA-Briefcase v1.1 取得 1578 分。OSWorld 2.1 离线子集成绩为 72.4%，Terminal-Bench 4.0 成绩为 39.2%。Haiku 5.5 是首款支持可调节性能设置的 Haiku 模型，用户可选择配置成本与智能程度。Anthropic 同时将其定位为 Opus 5.5 和 Sonnet 5.5 执行编码任务时的子智能体模型。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/333.htm", "publishedAt": "2026-10-07T22:26:08+00:00"}, {"title": "GitHub Copilot 不再纯云端 AI 模型：Surface Laptop Ultra 本地推理吞吐量最高每秒 63 词元", "summary": "IT之家 10 月 8 日消息，太平洋时间 10 月 7 日上午 10 点（北京时间 10 月 8 日凌晨 1 点）在美国旧金山举办的发布会中，微软宣布 GitHub Copilot 将在本月底前支持本地 AI 模型推理，开发者可在云端模型与设备端模型之间自动或手动切换。GitHub Copilot 是微软推出的 AI 编程助手，可集成于 Visual Studio Code、CLI 等工具，根据代码上下文生成补全、解释或重构建议。GitHub Copilot 目前依赖云端托管模型，由协调器根据性能、成本与准确性路由请求。微软计划在本月底扩展该机制，允许 Copilot 自动选择云端模型与本地 AI 模型，后台协调推理任务。微软为 GitHub Copilot 用户提供两种模式：自动编排或强制使用设备端模型。用户可在 GitHub Copilot CLI、Copilot 应用与 Visual Studio Code 中设置偏好。本地模型选择支持指定提供程序、模型或端点，开发者可通过 Windows ML 选择 MAI Code 1.1 Flash，或连接 OpenAI 兼容的本地端点并选用其暴露的模型。微软推出 MAI Code 1.1 Flash“混合专家”模型，总参数 1370 亿，活跃参数 68 亿，采用量化与推测解码技术优化响应速度与内存占用。该模型在 Surface Laptop Ultra 上实测显示，复杂任务中的峰值内存使用率、Token 利用率与处理速度均显著提升。解码吞吐量测试显示，提示长度从 2K 到 256K Token 时，吞吐介于每秒 40 至 63 个词元。IT之家附上相关图片如下：", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/330.htm", "publishedAt": "2026-10-07T22:17:08+00:00"}, {"title": "10 年内预估仅 5%：诺奖经济学家背书，AI 不会大规模抢走你的饭碗", "summary": "IT之家 10 月 8 日消息，微软 AI 首席执行官穆斯塔法 · 苏莱曼（Mustafa Suleyman）于 10 月 6 日在 X 平台发布推文，援引诺贝尔经济学奖得主达龙 · 阿西莫格鲁（Daron Acemoglu）的预测称，未来 10 年内仅有约 5% 的人类工作会被人工智能取代。IT之家查询公开资料，阿西莫格鲁是当代颇具影响力的经济学家之一，主要研究政治经济学、经济发展、制度、技术变迁与收入不平等。他于 2024 年和西蒙 · 约翰逊（Simon Johnson）、詹姆斯 · 罗宾逊（James A. Robinson）共同获得诺贝尔经济学奖，获奖理由是“关于制度如何形成及其如何影响繁荣的研究”。本次转发的文章于今年 7 月发表在《人文主义评论》（The Humanist Review）创刊号上，阿西莫格鲁估算，从技术上来看，AI 可以自动化约 20% 的工作，但受企业采纳速度限制，10 年内实际自动化比例仅约 5%。他坦言这一数字“诚然只是一个估计值”。阿西莫格鲁指出，当前 AI 模型在编写代码、放射诊断等实验室场景中表现卓越，但企业在真实环境中部署同类工具时效果逊色。工程师需花费大量时间调试 AI 生成代码，医生难以将专业知识与 AI 工具有效结合，导致结果未达预期。模型进步速度快于企业可用工具的成熟度。苏莱曼今年 2 月曾对《金融时报》表示，律师、会计师、项目经理等白领岗位的“大部分任务”将在 12 至 18 个月内实现自动化。6 月他在播客中澄清，此言指“任务”而非“岗位”，AI 仅让工作完成更快，不意味职位消失。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/329.htm", "publishedAt": "2026-10-07T22:16:08+00:00"}, {"title": "周活超 12 亿用户：OpenAI ChatGPT 升级 GPT-6 模型，互动式 AI 教你打麻将", "summary": "IT之家 10 月 8 日消息，OpenAI 今天（10 月 8 日）在 X 平台发布推文，宣布面向所有 ChatGPT 用户，推出 GPT-6 系列模型以及智能（Intelligent UI）。OpenAI 的 ChatGPT 全球每周活跃用户数量超过 12 亿，不过此前停留在 GPT-5.6 系列。OpenAI 过去几个月陆续发布 GPT-6 Astra、GPT-6 Sol 和 Luna 模型，此前仅供 ChatGPT Work 和 Codex 使用。OpenAI 同时推出智能用户界面，借助智能用户界面，GPT-6 能够根据用户的问题，灵活组合文本、图像和交互元素来生成回复。回复内容可包含图表和图形以辅助解释概念，同时还支持可点击的按钮、表单及其他交互式组件。在其中一个示例中，用户可以通过智能用户界面来学习如何打麻将，官方表示：“通过互动式视觉效果探索各种想法，这些效果会随着你的学习、尝试和发现而做出相应反应。”IT之家附上相关视频如下：", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/327.htm", "publishedAt": "2026-10-07T22:10:08+00:00"}, {"title": "开源 AI 终端 uniTerm v1.10 发布：安卓版来了！手机上也能 SSH 运维", "summary": "关于 uniTerm uniTerm 是一款轻量级、跨平台的一站式终端软件，基于 Wails v3 + Go + Vue 3 构建。它将远程终端、文件传输、远程桌面、数据库客户端、容器与 Kubernetes 管理、服务器监控、AI 助理整合进一个 15MB 的软件包中，覆盖 30 余种网络协议，支持 Wi 网络过滤驱动，最终定位到 Intel Connectivity Performance Suite（ICPS）。据 CircleID 报道，其问题源于 ICPS 的流量控制驱动在处理 IPv6 数据包时，将握手后的每个 TCP 数据包的 IPv6 Flow Label 字段重置为 0。根据 RFC 6437 规范，Flow Label 应在连接生命周期内保持一致。微软的云边缘负载均衡系统使用该字段来决定数据包应送达哪台后端服务器，标签被清零后，后续数据包会被路由到另一台从未参与该连接的服务器，后者随即返回重置信号。根据 Intel 官方社区上的技术分析报告，涉及缺陷的驱动组件为 IntcCo11X64.sys 11.5.11.19，属于 Rivet Networks（已被 Intel 收购）的流量控制引擎，对应 ICPS 内部版本 40.25.926.173。另外，受影响设备不仅限于三星 Galaxy Book。该用户在微软 Update Catalog 中查看了来自 19 家公司的 1086 条 ICPS 条目，发现仅有 1 条对应已被验证修复的版本。潜在受影响的驱动包涉及三星、联想、VAIO、华硕、惠普、玳能和华勤等厂商。用户报告显示，在 ICPS 运行状态下，42 个出站数据包中 0 个保留了 Flow Label，10 个 IPv6 连接中仅 4 个成功建立；禁用 INTCCoSvc 驱动后，65 个数据包全部保留标签，10 个连接全部成功。IPv4 连接不受影响，因为 IPv4 不含 Flow Label 字段。该用户在 10 月 7 日测试了 Intel 官方提供的通用版驱动 ICPS 50.26.623.243，结果显示 169 个 IPv6 连接中全部成功建立连接，而此前通过 Windows Update 安装的 OEM 版本在 170 次尝试中仅 138 次成功。Azure 门户和 Visual Studio Marketplace 在之前反复失败后，现在每次均可正常访问。但 Intel 在版本说明中并未提及修复了 IPv6 相关缺陷。该用户已将问题反馈给 Intel、微软和三星。在三星社区论坛，帖子一度被标记为垃圾信息后由管理员恢复；微软支持部门于 2026 年 8 月将案件转交“OneNote 工程团队”后，已六周未作回应；三星于 2026 年 10 月 3 日建立案件后也未采取进一步措施。据 Intel 社区论坛记录，早在 2025 年 11 月就有工程师在论坛上发帖描述过完全相同的问题，但英特尔仅询问了几个问题便关闭了该帖子。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/369.htm", "publishedAt": "2026-10-08T00:24:07+00:00"}, {"title": "👍JeeSite V5.19.1 发布，重构上传组件、AI 识图/生图/统计、流程设计器、多项增强优化", "summary": "升级内容 Vue 分离端版本 增强 Upload 图片 Grid 网格形式展现、增强嵌入式表单功能（非弹窗）、显示上传文件总大小 增强 Upload 支持图片和文件的拖拽排序、支持下一张和下一张连续预览 增强 Upload 上传和预览对话框合并，方便在预览中直接上传文件 增强 Upload 弹窗模式时，删除后点击对话框的确定后生效，而不是直接...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502866", "publishedAt": "2026-10-07T23:50:26+00:00"}, {"title": "微软发布 VS Code v1.141：清理“僵尸”Agent 会话等", "summary": "IT之家 10 月 8 日消息，微软昨日（10 月 7 日）更新推出 Visual Studio Code 1.141，本次更新聚焦 AI 智能体（Agent）工作流管理，重点改进会话存储清理、跨平台沙盒安全、多会话并排布局，以及多 GitHub Enterprise 实例登录支持。清理“僵尸”Agent 会话方面，新版增加 Chat: Open Worktree Cleanup 命令，可列出所有非活跃 Agent 会话的工作树（worktree）占用空间，并支持按“闲置时长”筛选、手动删除或设置自动清理策略。IT之家附上相关图片如下：当存储占用达到阈值时，Agents 窗口会主动提示清理；已合并 PR 的会话可配置为自动清理，活跃 / 运行中 / 需输入 / 已固定的会话则受保护不会 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
