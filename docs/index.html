圆口音频输出与蓝牙音频输出。该产品内置 96Wh 大容量电池，可支持约 4-5 小时连续观影。除电源适配器外，还兼容车载点烟器、户外电源、USB-C 充电宝等多种补电方式，整机净重 4.8kg，桌面占地约 0.05㎡，室内、户外均可使用。该机内置定制版 AIOS 3.0 系统，支持 7 大智能场景应用，涵盖基础交互与数字人管家、影音娱乐、设备控制、养生康养、生活助手、学前教育、AI 创作，一屏覆盖健身、观赛、绘画等多种生活场景。该产品支持手机及遥控器语音输入，可一句话完成交互应答；AI 智能搜索支持通过片名、演员、角色、台词、剧情检索片源，甚至可识别方言，记得一句台词就能找到对应剧集。其机身配备 HDMI IN 接口与 3.5mm 音频接口，可通过 HDMI 线连接笔记本电脑，作为桌面副屏使用，工作时展开参考资料、创作时查看图片内容，让桌面多一块可用屏幕。IT之家附详细参数如下：", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/031/970.htm", "publishedAt": "2026-11-25T02:44:19+00:00"}, {"title": "开源办公套件 LibreOffice 新规：用 AI 开发写代码，需先申请、后提交", "summary": "IT之家 11 月 25 日消息，开源办公套件 LibreOffice 的维护方“文档基金会”（The Document Foundation，TDF）于 11 月 24 日宣布，进一步收紧开发过程中使用大语言模型（LLM）及 AI 辅助编程的政策。根据官方公告，社区贡献者今后若希望在开发工作中使用 AI 大模型，必须事先获得项目工程指导委员会的批准，并在代码提交记录中明确披露相关使用情况。IT之家援引博文介绍，贡献者不能直接把 AI 生成的内容提交给项目。对于借助 LLM 完成的代码补丁，提交者不能盲目接受模型输出，必须能够用自己的语言解释每一行被修改代码的原理、逻辑和作用，证明自己真正理解并负责该变更。政策还划定了 AI 的“禁区”，贡献者不得使用大模型撰写提交说明、代码注释、缺陷报告，以及与其他开发者沟通的邮件或消息。此外，LibreOffice 代码库中的部分区域也被列为禁止使用 LLM 的范围。文档基金会强调此举并非全面禁止 AI，希望借此巩固“人工生成代码”的优先地位。项目认为，优秀的贡献即使经过 AI 辅助仍可被接受，但前提是贡献者必须对代码质量、安全性和可维护性承担明确责任。参考Updated (and more restrictive) policy for LLM usage in LibreOffice development", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/031/965.htm", "publishedAt": "2026-11-25T02:32:15+00:00"}, {"title": "宝马新世代首款国产车型 BMW iX3 上市交付：26.99 万元起，全域 800V 架构 + Momenta R7 智驾", "summary": "IT之家 11 月 25 日消息，宝马基于全新纯电平台 Neue Klasse 打造的首款量产车型 —— 新世代 BMW iX3 今日正式上市并同步开启交付。另外，新世代 BMW i3 将于 11 月 27 日上市并开启订购。新车共推出三个版本，采用全国统一价模式，30L 后驱版 26.99 万元、40L xDrive 四驱版 29.99 万元、50L xDrive 四驱版 33.99 万元，预订与上市同价。购车权益方面，即日起至 2027 年 1 月 31 日（含）前下订，并于 2027 年 6 月 30 日（含）前完成购车，可享受限时购车权益。其中，BMW / MINI 车主预订可获得 15000 BMW 会员积分；用户还可选择悦选明天计划或悦贷金融计划，相关方案包含首付 6.55 万元、月付低至 2888 元等金融权益，另有首付 0 元起、5 年长分期方案。此外，BMW 城区领航驾驶辅助 7 年延长服务包官方建议零售价为 25000 元，符合条件的用户在首次激活 BMW 互联驾驶服务后 30 天内购买，可享 15000 元限时优惠价。车身尺寸方面，新车长、宽、高分别为 4885mm、1895mm 和 1635mm，轴距达到 3005mm，较海外标准轴距版增加 108mm，增加的空间全部用于第二排。外观采用数字天使光翼前脸，配备 3D 光耀格栅，霍氏弯角升级为镜光弯角，尾部采用 L 形天羽尾灯设计。内饰方面，新车搭载新世 25T02:51:30+00:00"}, {"title": "陈睿谈短内容冲击：B站是 AI 时代最受益的平台之一，用户数仍会持续增加", "summary": "IT之家 11 月 25 日消息，据新浪科技今天报道，哔哩哔哩（B站）董事长兼 CEO 陈睿在公司 2026 年第三季度财报中表示，社区是B站最强的特质，也是B站的壁垒。社区建立在用户、UP 主和平台三者之上。陈睿认为，B站用户可能是中国最年轻、最活跃以及有着最好教育、最好审美的用户。他们懂得去欣赏好的内容，也始终渴望好内容，构成了B站社区的基本盘。B站 UP 主也同样重要，是中国互联网环境中最具才华的创作者。他们都是年轻人，有自我表达的欲望和创作的才华，在社区里逐步成长成为了创作者。他表示，B站 UP 主和用户是一种共生的关系，UP 主为用户创作优质内容，用户通过反馈和激励，支持 UP 主持续成长。他认为B站让 UP 主和用户能更好地连接起来，这种连接、信任以及社区的归属感，是B站的重要特质。谈到短内容对互联网的冲击时陈睿指出，短内容主要追求持续吸引用户注意力，而B站做的是优质内容，最重要的是占据用户的心智，让用户产生获得感。B站由此形成了与短内容不同的用户基本盘。B站应该是在 AI 时代受益最大的平台之一。优质内容在过去最大的瓶颈是供给，AI 一方面让更多好内容被高效地创作出来，同时也让好内容更快地被用户看见。在他看来，随着新一代年轻人的成长、用户审美水平提升，以及精神世界日益丰富，B站用户数量在未来仍会持续增加。据IT之家此前报道，B站 2026 财年第三季度营业总收入 83.17 亿元，同比增长 8%，环比增长 4.75%。毛利润 31.03 亿元，同比增长 10%；毛利率 37.3%，同比增长 0.6 个百分点；归母净利润 5.09 亿元，同比增长 8.1%，环比增长 47.94%。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/031/942.htm", "publishedAt": "2026-11-25T01:24:04+00:00"}, {"title": "谷歌发现，技术债务会通过“智能体分心”导致编码智能体偏离正轨", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/sFmubmDWkulIOTBLX0Dr?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-24T13:00:00+00:00"}, {"title": "数据分析的下一站：智能体分析", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/video/Q0rXqh3OmSAhcePiDjh2?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-24T12:40:02+00:00"}, {"title": "实测小豆：主动办事的背后，AI 正在走向每一个人", "summary": "Personal Agent 的下半场，拼的是主动办事#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1691355?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign", "publishedAt": "2026-11-24T11:04:40+00:00"}, {"title": ":fire::fire::fire: Claude Code 工程最佳实践 | 主数据平台 1.8.0 发布，专注于单点登录", "summary": "更新周期：2026-10-24 ~ 2026-11-22，后端 41 次提交、前端 40 次提交 编码规则与单号生成组件（全新功能） 控制台新增「编码规则」模块，支持规则主表、规则明细、拖拽排序、动态配置和试生成 支持常量、日期、变量、流水号、随机码、校验位、GUID/雪花 ID、组织编码、父单号截取共 9 类规则明细 提供单个生成、同参批量...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/50 ceUrl": "https://www.oschina.net/news/503711", "publishedAt": "2026-11-20T10:02:48+00:00"}]}, {"label": "论文研究", "items": [{"title": "AI 泡沫要来了？教授称英伟达像郁金香和 NFT", "summary": "IT之家 11 月 25 日消息，科技媒体 Business Insider 昨日（11 月 24 日）发布博文，针对英伟达公司股价剧烈震荡，密歇根大学罗斯商学院教授埃里克 · 戈登（Erik Gordon）认为其估值像 17 世纪荷兰“郁金香狂热”、以及疫情期间的 Bored Ape NFT 热潮。IT之家查询英伟达公司股价，10 月 6 日到 11 月 20 日，英伟达的市值暴跌了近 3 万亿美元（现汇率约合 20.03 万亿元人民币），跌幅接近 50%。受黄仁勋重掌帅印利好信息影响，英伟达股价于当地时间 11 月 23 日盘中上涨 34.3%，收盘上涨 31.48%，创下自 2003 年 5 月以来最大单日增幅。不过在美国东部时间 11 月 24 日 16 点（北京时间 25 日凌晨 4 点）收盘，英伟达又下跌 5.86%，市场情绪仍在快速切换。对此戈登教授将英伟达当前的市值表现，与 17 世纪荷兰的“郁金香狂热”以及疫情期间 Bored Ape NFT 的炒作热潮相类比。他认为，英伟达股价与基本面经济现实之间的关联似乎并不充分，其走势更多受到市场情绪、公司领导层动态以及 AI 产业叙事的驱动，恐怕成为“AI 泡沫”的导火索。IT之家注：“郁金香狂热”是历史上著名的资产投机泡沫之一，当时，稀有郁金香球茎因色彩、花纹稀缺而备受贵族和富裕阶层追捧，价格不断攀升，部分稀有品种球茎一度被炒到相当于房屋、土地甚至多年收入的价格。随着越来越多买家涌入，价格脱离球茎的实际观赏和种植价值，形成典型的“击鼓传花”式上涨。1637 年初，郁金香价格骤然崩盘，许多买家手中的合约和球茎迅速贬值，参与者蒙受重大损失。Bored Ape Yacht Club（无聊猿游艇俱乐部，简称 BAYC）是由 Yuga Labs 推出的 NFT 收藏项目，2021 年正式上线。每个 NFT 都是一幅由算法生成的卡通猿猴头像，持有者通常还获得会员身份、社群活动及部分商业使用权。在疫情后的加密货币与 NFT 热潮中，Bored Ape 迅速成为“数字身份”和社交资本的象征。随着 2022 年后加密货币价格下跌、流动性收紧，NFT 市场大幅降温，许多 Bored Ape NFT 的价格也较峰值明显回落。不过该媒体也指出，英伟达并非缺乏基本面支撑。援引官方财报数据显示，截至 10 月 25 日的三个月内，公司实现约 780 亿美元（现汇率约合 5,208.98 亿元人民币）营业利润，同比增长 115%，表明 AI 芯片需求仍在强劲增长。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/032/058.htm", "publishedAt": "2026-11-25T04:08:18+00:00"}, {"title": "“人类史上最大 IPO”上市不到 1 周就破发，Anthropic 跌破 83 美元发行价", "summary": "IT之家 11 月 25 日消息，彭博社昨日（11 月 24 日）发布博文，报道称“人类史上最大 IPO”上市（11 月 19 日）的 Anthropic 首次跌破每股 83 美元（IT之家注：现汇率约合 554.3 元人民币）的 IPO 发行价，美国东部时间 11 月 24 日 16 点（北京时间 25 日凌晨 4 点）收报 81.91 美元（现汇率约合 547 元人民币），单日下跌 6.54%。这家上周刚创下纪录登陆纳斯达克的 AI 公司，上市首日曾以 111.50 美元（现汇率约合 744.6 元人民币）开盘，较发行价高出 34%，盘中一度突破 115 美元（现汇率约合 768 元人民币），完全稀释估值一度超过 2 万亿美元（现汇率约合 13.36 万亿元人民币）。然而，短短数个交易日后，市场情绪迅速逆转。Anthropic 盘中最低跌至约 76 美元（现汇率约合 507.5 元人民币），较发行价低近 9%，较上市首日高点回撤约 34%；路透社测算，其市值一度面临蒸发近 2,000 亿美元（现汇率约合 1.34 万亿元人民币）的压力。本轮下跌并非 Anthropic 独有。市场对 AI 企业盈利能力、巨额算力资本开支以及高估值可持续性的疑虑升温，引发科技股广泛抛售。上周，标普 500 指数与道琼斯工业指数双双进入技术性回调区间，英伟达则录得 2008 年以来最大单周跌幅。值得注意的是，尽管英伟达在黄仁勋恢复 CEO 职务后带动 AI 相关股票一度反弹，Anthropic 仍未能跟随上涨，彭博社认为投资者正更严格审视 AI 公司的基本面与现金流。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/031/983.htm", "publishedAt": "2026-11-25T03:29:13+00:00"}, {"title": "华为与行芯科技打造“韬 EDA”，实现行业首次国产 EDA 工具串链成功", "summary": "IT之家 11 月 25 日消息，以“卓越创新、开放共赢”为主题的第七届华为创新和知识产权论坛于 11 月 24 日在北京举办。行芯科技董事长兼总经理贺青受邀发表《工欲善其事 必先利其器——3D-Native τ-Aware Signoff：韬定律落地的 EDA 基石》主题演讲。贺青介绍称，在韬定律的技术牵引下，行芯凭借自研底层技术完成 3D-Native τ-Aware Signoff EDA 工具，将缩短 τ 的创新构想转化为可量化、可验证的工程能力。面向韬芯片的国产 EDA 工具 —— 韬 EDA，正是与华为开展多年深度协作共同打磨而成。依托行芯原生技术能力与双方联合创新机制，沉淀出两款标杆自研产品：信号路径 RC 抽取工具 GloryEX 锁定 τ 演进收益，实现从几何到时间的高精度、高效率转化，荣获 2025 年中国芯 EDA 专项“产品革新奖”；电源路径 PI 签核工具 GloryBolt 保障 τ 演进稳定，实现能量守恒的真三维一体化签核，荣获 2026 年中国芯 EDA 专项“金口碑产品奖”。双方还共创融合 PDK 创新技术，实现多工艺、多尺度、多结构耦合。2025 年、2026 年，联合创新项目分别落地产品新功能 27 项、37 项，推动行芯自研工具从实验室走向量产前线。IT之家从演讲获悉，在自研产品落地基础上，华为进一步拉通行芯 EDA 与其他国产 EDA 工具，基于实战项目完成串链，实现行业首次国产 EDA 工具串链成功。Fabless、多个 Fab 与封装厂形成多方协同，将单点工具能力连接为面向真实设计流程的产业生产力。如今，行芯已建成覆盖信号路径与电源路径的成套自研工具链体系。面向下一步，在华为对韬芯片的技术牵引下，行芯将联同上下游产业链共同构建 τ-Aware 工具框架，支撑韬芯片多元发展；2027 年双方联合创新项目已规划 30 项产品新功能。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/031/982.htm", "publishedAt": "2026-11-25T03:23:55+00:00"}, {"title": "黄仁勋重掌英伟达：公司股价创 23 年来最大单日涨幅，身价日增约 330 亿美元跻身全球富豪第 13 位", "summary": "IT之家 11 月 25 日消息，《福布斯》昨日（11 月 24 日）发布博文，报道称受黄仁勋复职英伟达公司 CEO 利好消息影响，英伟达公司股价于当地时间 11 月 23 日盘中上涨 34.3%，创下自 2003 年 5 月以来最大单日增幅，带动黄仁勋个人财富单日增加约 330 亿美元（IT之家注：现汇率约合 2,203.8 亿元人民币）。根据《福布斯》报道，黄仁勋目前持有英伟达约 3.5% 股份，个人净资产已升至约 1,431 亿美元（现汇率约合 9,556.47 亿元人民币），在全球富豪榜上升至第 13 位。黄仁勋于 1993 年联合创立英伟达，并在 1999 年推动公司上市。在其主导下，英伟达的 GPU 从游戏显卡逐步发展为全球人工智能算力的核心基础设施，公司市值曾在 2025 年突破 5 万亿美元（现汇率约合 33.39 万亿元人民币）。IT之家发稿前查询《福布斯》实时富豪榜数据，截至 2026 年 11 月 24 日，黄仁勋实时净资产约为 1,355 亿美元（现汇率约合 9,048.93 亿元人民币），位列全球富豪榜第 14 位；他持有英伟达超过 3.5% 的股份。上图中机翻存在错误，应该是黄仁勋", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/031/980.htm", "publishedAt": "2026-11-25T03:13:45+00:00"}, {"title": "华为OSTA星芒 O1 Pro 评测：一台真正为 AI 而生的鸿蒙手机", "summary": " const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
