-07-28T13:34:37+00:00"}, {"title": "华为鸿蒙 HarmonyOS 开发套件 26.0.0 Beta2 版本发布，新增音频设备增强管理器、游戏伴随服务等", "summary": "IT之家 7 月 28 日消息，除了鸿蒙 HarmonyOS 7 花粉 Beta 版开启招募和新版本推送外，华为今日还发布了鸿蒙 HarmonyOS 开发套件 26.0.0 Beta2 版本。据介绍，26.0.0 Beta 在 6.1.1 (24) 的基础上：进一步增强了组件的材质效果，实现更好的沉浸光感效果，新增了多个基于状态管理（V2）实现的组件；Ability Kit 新增了基于 ModularObjectExtensionAbility 的模块化对象，支持应用将自身功能以模块化对象的形式开放给其他应用调用；Core File Kit 支持将沙箱目录共享为系统级可见；Device Security Kit 增强了星盾引擎能力和超级隐私管控能力；Graphics Accelerate Kit 新增预启动特性，提升游戏应用的启动体验；Notification Kit 进一步增强了通知管理能力和显示效果，支持以半模态方式拉起应用的通知设置界面，等等。另外，ArkWeb 的 Chromium 内核从 132 升级为 144 版本。IT之家附华为鸿蒙 HarmonyOS 开发套件 26.0.0 Beta2 版本新增和增强特性如下：Ability Kit新增基于 ModularObjectExtensionAbility 的模块化对象，支持应用将自身功能以模块化对象的形式开放给其他应用调用。提供基于 C API 的使用 ModularObjectExtensionAbility 实现模块化对象的指导。支持使用 Taihe 实现 ModularObjectExtensionAbility 的 IPC 通信。提供声明 ModularObject 分发器的 C API，提供基于类型库元数据的跨进程延迟绑定调用能力。提供声明 ModularObjectExtensionAbility 实例的 C API，包括注册生命周期回调函数和获取上下文等能力。提供声明 ModularObjectExtensionAbility 上下文的 C API，包括启动 UIAbility、销毁 ModularObjectExtensionAbility 自身、创建和销毁 IPC 对象等功能。提供声明用于管理 ModularObjectExtensionAbility 的 C API，包括查询 ModularObjectExtensionAbility 信息、连接与断开连接等能力。新增提供 NativeAbility 数据信息的相关 C API，用于获取 Ability 实例 ID、Ability 名称和 napi_env 等信息。新增声明 ExtensionAbility 的连接选项的 C API，提供包括连接成功、断开连接和连接失败的回调接口。新增自动填充请求信息的定义能力，应用可定义自动填充的信息类型。包管理新增 pluginBundleManager 模块，提供应用对自分发插件的管理能力，包括安装、卸载本地插件。Account Kit新增支持华为账号亲密圈服务，实现用户添加和选择亲友的能力。Agent Framework Kit新增支持通过 AgentAbilityExtension 实现智能体间 A2A 协议通信。AOD Navigation Kit【新增 Kit】AOD Navigation Kit（熄屏导航服务）提供了应用接入熄屏导航的能力，在保障导航实时性的同时有效控制设备功耗，支持轨迹、里程等关键导航信息在设备熄屏界面无需解锁即可便捷查看。AppGallery Kit新增支持暂停下载任务。新增支持 Car 设备，涉及的能力包括：应用归因服务、隐私管理服务、图标管理服务、应用市场推荐、产品特性按需分发、生态查询、应用市场更新。ArkData数据共享能力新增支持发布多个值类型的配置用于多应用共享。ArkGraphics 2D绘制模块字体绘制能力新增支持获取文字的轮廓路径，同时支持字体回退能力。ArkUI新增多个基于状态管理（V2）实现的组件，包括 ChipV2、ChipGroupV2、CounterV2、PopupV2、SwipeRefresherV2、TreeViewV2、CounterV2。新增智慧手势的能力：新增智慧手势的 API，提供智慧手势使能、监听、选中态控制，以及动态决策智慧手势行为的能力。交互属性新增对智慧手势的响应。滚动与滑动组件新增懒加载瀑布流布局组件 LazyVWaterFlowLayout、懒加载垂直线性布局组件 LazyColumnLayout、懒加载动态布局容器组件 LazyDynamicLayout。响应式环境变量组件新增环境变量容器 WithEnv、自定义环境变量 @CustomEnv。新增 DatePickerComponent 组件，用于选择日期（年月日）和时间（时分秒）。新增 SelectionContainer 组件，用于为多个文本节点提供跨节点文本选中、复制及菜单扩展能力。新增支持设置调测标签，帮助开发者分辨同类节点，提高开发和分析调试的效率。ChipGroup 组件新增支持通过 backgroundSystemMaterial 和 activatedBackgroundSystemMaterial 配置正常状态和激活状态下的系统材质背景。SelectionMenu 组件新增支持通过 backgroundSystemMaterial 配置菜单的背景板的系统材质。Navigation 组件新增配置项 systemMaterial 属性，支持系统材质效果。弹窗类组件 DatePickerDialog 新增配置项 systemMaterial，支持系统材质效果。C API 新增沉浸式材质类型和 API 声明。组件动态属性新增悬浮状态样式。UIContext 的 OverlayManager 新增按层级配置浮层的能力。文本类组件新增支持尾部缩进属性（tailIndents），包括：Text 组件、属性字符串自定义组件的生命周期新增支持组件由非激活状态转变为激活状态的装饰器 @ComponentActive，以及组件由激活状态转变为非激活状态的装饰器 @ComponentInactive。窗口管理新增支持设置主窗或子窗支持的窗口模式。窗口管理的闪控球新增销毁事件的监听。当闪控球销毁时，回调函数会接收到销毁原因的字符串。ArkTSsetMultithreadingDetectionEnabled 接口新增多线程检测可配置参数，支持开发者配置故障类型、采样频率、故障上报时间间隔Audio Kit新增音频设备增强管理器功能。新增基于 C/C++ 的音频格式转换能力。AVSession Kit新增支持自定义播控中心的控制按钮显示布局的能力。媒体会话管理 AVSession 新增支持设置应用支持的播放倍速列表、设置应用支持的循环模式列表、设置应用支持的控制类型列表。同时通过 AVSessionController 支持获取应用支持的播放倍速列表、获取应用支持的循环模式列表、获取应用支持的控制类型列表，以及支持注册播放倍速列表变化的监听事件、注册循环模式列表变化的监听事件、注册控制类型列表变化的监听事件。Basic Services Kit串口通信能力新增支持对串口通信的管理，包括获取串口设备列表、打开和关闭串口、读写数据、硬件流控信号管理等。Camera KitC API 新增元数据对象扩展概念的声明。Confidential Space Kit【新增 Kit】Confidential Space Kit（机密空间服务）提供了在机密空间内部运行数据应用、处理隐私数据的能力，支持应用与系统、应用与应用在空间内安全地共享数据，防止隐私信息外泄。Core File Kit新增支持压缩解压缩模块，为应用提供数据压缩和解压缩的能力，可用于文件打包分发、减少存储占用、加速网络传输等场景。Desktop Extension Kit新增查询接入快捷栏能力，支持开发者查询当前设备是否可以接入快捷栏。新增设置快捷栏应用图标和进度条能力，支持开发者自定义图标和进度条。新增检查设备状态是否支持状态栏图标接入能力，以及图标悬浮（hover）状态回调能力。Device Security Kit新增设备开关机、音频接口插拔、视频接口插拔、账户管理等通知类审计事件。新增应用进程执行、文件读结束的阻断类审计事件。新增 ArkTS API、C API，支持审计阻断类事件设置默认超时阻断策略。新增 ArkTS API、C API，支持全量查询阻断类客户端信息。新增 ArkTS API、C API，支持全量查询通知类客户端信息。Enterprise Data Guard Kit新增进程管控时长管理，支持开发者查询、设置进程管控策略和查询、添加与删除进程管控信息。Enterprise Space Kit新增切换工作空间的能力。新增支持跨空间消息提醒配置的能力。Enterprise Threat Protection Kit病毒检测与处置服务新增威胁进程终止接口，为企业安全类应用提供对运行中恶意进程及可疑进程的安全处置能力。FAST Kit新增高性能排序能力，支持通用数据类型的排序操作。新增多项式零点求解器能力，支持一元多项式的实数根计算。新增复数向量基础运算、信号处理与线性代数、向量归约与统计能力。新增高性能哈希表数据结构能力，支持哈希表的创建与销毁等功能。新增系统优化能力，支持应用程序向系统提供性能场景信息，系统在生效范围内优化应用性能，提升用户体验。Graphics Accelerate Kit新增游戏伴随服务，为游戏陪玩类的应用提供伴随悬浮控件、游戏状态感知、音频采集与传输、游戏画面采集等基础能力。Linx Kit【新增 Kit】Linx Kit（灵犀加速库）基于芯片底层架构实现软硬协同优化，提供 CPU 的性能加速能力。Map Kit新增支持折线添加文字。新增支持 3D 地球背景替换。新增支持信号路线功能，可预测路线中的弱信号或无信号路段，提前提醒用户下载离线地图、提升户外安全性。在屏幕坐标和经纬度转换场景下，新增设置相对于地面的高度。新增支持根据经纬度查询离线地图中未下载的区域。MDM Kit企业设备的账号管理新增创建普通系统账号、移除系统账号以及切换系统账号的接口。企业设备的应用管理新增支持查询指定应用的窗口状态信息列表。可以查询到应用是否在底部 Dock 栏，以及当前应用窗口是否在前台显示等信息。Media Kit新增 C API，支持对音频 PCM 数据处理后再播出的能力，同时支持设置音频处理后再播出的回调函数单次可返回的最大数据量。新增 ArkTS API，支持广告插播能力，实现广告资源的播放以及广告事件的监听。新增 ArkTS API，实现应用可以离线缓存下载在线资源。新增 ArkTS API 和 C PAI，支持录屏过程中暂停录制屏幕与恢复录制屏幕的能力。新增 C PAI，支持对指定应用的所有窗口进行屏幕录制。NearLink Kit新增订阅的配对状态变化原因详情。新增订阅的连接状态变化事件的原因详情。新增扫描扫描过滤条件，过滤信号强度大于或等于信号强度门限值的广播报文。Network Kit建立 WebSocket 连接的可选参数新增支持 supportOriginPort，可用于控制 Origin 字段是否携带自定义端口号。Online Authentication Kit新增用户认证失败切换其他认证方式的认证方式指示。新增可选择的认证类型列表。新增 credentialDisclosurePropertyList 参数，支持查看凭证披露属性列表。PDF Kit新增支持自定义渲染风格功能。新增支持二进制数据读取 PDF 能力。新增支持根据视图坐标点获取 PDF 页面索引。新增支持视图坐标与 PDF 页面坐标的双向点转换。新增支持视图坐标与 PDF 页面坐标的双向矩形转换。Pen Kit新增手写笔跟手性加速接口，支持笔记类应用提升手写笔书写时延。Performance Analysis KitHiDebug 新增支持注册内存导出监听器，用于在内存占用较高或通过 hidumper 命令手动触发时导出应用内存快照。Ringtone Kit查询不同铃声类型和文件类型对应的文件大小上限。Remote Communication Kit新增支持设置抛出异常时是否在异常信息中显示明文内容。新增支持证书压缩和解压缩。新增支持国密 TLCP 协议。新增支持多路传输控制协议（MPTCP）。Service Collaboration Kit新增碰一碰场景 API，设备间可以通过顶端碰的方式触发连接、传递信息、断开连接等。Service Support Kit【新增 Kit】Service Support Kit（服务与支持）为企业开发者应用提供设备硬件检测能力，通过对设备的硬件状态信息进行检测，以达到硬件信息快速评估、提升检测效率的效果。Spatial Recon Kit新增分块 3DGS（Tiled 3D Gaussian Splatting）渲染对象，支持设置驱动分块选择的相机、设置瓦片请求回调函数、通知渲染器指定的瓦片现在可以加载等。新增高级回调函数（HMS_SpatialReconNGCallbackFunc）类型，支持在通知开发者重建或保存的结果时传入额外的数据，方便开发者区分不同的重建任务。UI Design Kit新增颜色选择与收藏管理功能，支持网格、光谱和滑块三种颜色选择模式，支持用户将常用颜色添加到收藏列表。HdsSnackBar 组件新增新增支持左侧图标、中间文本的标题和内容、右侧操作区关闭按钮的图标的样式修改。HdsListItem 组件新增多态样式的设置功能。HdsListItemCard 组件单选框支持样式选择。XEngine Kit空域 AI 超分特性 OpenGL ES 移除对 OH_NativeBuffer 的依赖，提升集成灵活性。26.0.0 Beta2 开发者套件配套信息如下：软件包发布类型版本号发布时间API 版本Beta26.0.0 Beta2* 注意：设备系统支持的 API 能力范围请以 API 版本为准。2026/07/28DevEco StudioBetaDevEco Studio 26.0.0 Beta2 (26.0.0.621)2026/07/28SDKBetaHarmonyOS SDK 26.0.0 Beta2基于 OpenHarmony SDK Ohos_sdk_public 26.0.0.32 (API Version 26.0.0 Beta2)2026/07/28相关阅读：《华为鸿蒙 HarmonyOS 开发套件版本号格式调整：统一 API 与 OpenHarmony 体系，分 X.Y.Z 字段》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/749.htm", "publishedAt": "2026-07-28T12:24:14+00:00"}, {"title": "AI 公司被曝大量收购旧书，以获取“纯净”训练素材", "summary": "IT之家 7 月 28 日消息，AI 公司在推动内存和存储资源日益紧张之后，如今似乎又将目光投向了人类的文学遗产。调查媒体 404 Media 最新报道称，多家 AI 公司正通过中间商大规模收购二手图书，以获取高质量训练数据用于训练 AI 模型，同时避免引发公众舆论反弹。AI 的发展离不开海量数据，但并非所有数据都有价值，关键在于数据质量。近年来，大量由 AI 生成的低质量内容（俗称“AI 垃圾内容”）充斥互联网，不仅污染了数据环境，也降低了 AI 继续学习的效果。因此，领先的 AI 公司开始重新寻找由人类创作的内容，尤其是 2022 年之前出版的纸质书籍，因为这些内容更有可能是原创作品，尚未受到 AI 生成内容的污染。事实上，AI 公司利用纸质图书训练模型已有先例。作为当前卷入版权诉讼的主要 AI 公司之一，Anthropic 曾投入数百万美元购买大量纸质图书，用于提取内容训练 Claude AI 模型，随后再将这些图书销毁。据悉，该公司从 Better World Books 大量采购图书。法院虽然认定，将正版图书用于 AI 训练属于版权法中的“合理使用”，但 Anthropic 因长期保存一个包含 700 万本盗版图书的数据库，侵犯了作者和出版商版权，最终被判赔偿高达 15 亿美元（IT之家注：现汇率约合 101.62 亿元人民币）。类似争议也发生在谷歌身上。近期，一个出版商联盟已对谷歌提起诉讼，指控其未经授权使用数百万本受版权保护的图书训练 Gemini AI 模型。拥有超过 1.11 亿本图书目录信息的在线数据库 ISBNdb，长期以来一直是书商、图书馆和发行商的重要平台。随着 AI 行业迅速发展，ISBNdb 也开始调整业务方向，推出专门面向 AI 企业的大规模图书采购服务。404 Media 报道称，相关订单规模从一次采购 1000 本到一次采购 100 万本不等。一位不愿透露姓名的职业书商表示，今年 4 月以来，图书销量出现了前所未有的增长。过去生意好的时候，一周只能卖出约 20 本书；而近几个月，每周销量已飙升至数百本，是平时销量的约五倍。Alibris、Biblio 等二手书交易平台上的其他书商，也反映出现了类似的大宗采购现象。尽管目前没有确凿证据证明这些采购行为一定来自 ISBNdb 或某家 AI 公司，但其中存在不少异常现象。例如，大规模采购的对象几乎全部都是带有国际标准书号（ISBN）的图书，这种由 13 位数字组成的编码是全球图书唯一识别标识。此外，这些采购行为几乎没有任何主题、类型或作者偏好，无论是小说、教材还是专业书籍都在采购范围内。更令人意外的是，买家似乎完全不在意价格，即使部分图书明显高于市场价，也会直接买下。在 Anthropic 的版权诉讼过程中，曾参与 Google Books 项目、后来负责 Anthropic“巴拿马计划（Project Panama）”数字化项目的汤姆 · 哈维（Tom Harvey）证实，Anthropic 曾聘请多家专业文档扫描公司对纸质图书进行数字化处理。其中一家合作公司是 Datamation Information Services，该公司提供非破坏性扫描和破坏性扫描两种图书数字化服务。非破坏性扫描通常使用俯拍扫描仪、平板扫描仪或 V 型扫描设备，在不拆解图书的情况下完成数字化。而破坏性扫描则会直接拆开书籍，将每一页送入高速工业扫描仪进行处理。由于破坏性扫描效率更高、成本更低，因此 AI 公司普遍选择这一方式，最终导致数百万本纸质图书被拆毁。毫无疑问，纸质图书对于 AI 来说是一座巨大的知识宝库。然而，这种做法也引发了越来越多的伦理争议。批评者认为，目前尚不清楚 AI 公司在数字化过程中，是否会区分普通图书与珍贵图书、绝版图书。如果这些稀有书籍被拆毁，它们可能将永久退出流通。另一个更大的问题在于，这些扫描后的内容最终都会进入 AI 公司的私有数据库，仅用于训练 AI，而普通公众无法访问。这意味着，人们或许能够获得更加智能的 AI，但代价可能是，人类积累的大量知识资源将不再以公开、可获取的形式留给未来世代。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/742.htm", "publishedAt": "2026-07-28T11:22:59+00:00"}, {"title": "拒绝模仿在世作家文笔，OpenAI 悄悄为 ChatGPT 增加限制", "summary": "IT之家 7 月 28 日消息，据科技媒体 Android Authority 今天报道，OpenAI 最近悄悄更新 ChatGPT。当用户要求按某位在世作家文笔仿写作品时，AI 会直接拒绝。实测显示，当用户要求用斯蒂芬 · 金（IT之家注：Stephen King）的写作风格创作开场时，ChatGPT 会回应称“我无法完全按照斯蒂芬的风格或独特语气进行写作，但是可以基于‘美国小镇恐怖故事’写出原创作品。”同时，ChatGPT 目前无法将《奥德赛》改写成斯蒂芬 · 金风格，也无法模仿谭恩美。但它可以按照斯蒂芬 · 金的叙事风格、不安感和氛围改写作品。但对于查尔斯 · 狄更斯、欧内斯特 · 海明威和威廉 · 莎士比亚等逝世已久的作家来说，ChatGPT 仍然会接受类似的仿写请求。虽然美国版权法只保护具体文字表达，而不保护抽象的写作风格，但 OpenAI 显然希望降低法律风险。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/740.htm", "publishedAt": "2026-07-28T11:11:25+00:00"}, {"title": "全球第一，智元 WITA-Omni Preview 具身大模型登顶 DailyOmni 全模态理解榜单", "summary": "IT之家 7 月 28 日消息，据智元 AGIBOT 微信公众号消息，近日，具身全模态理解权威榜单 DailyOmni 最新评测结果揭晓，智元自研的具身原生全模态大模型 WITA-Omni Preview，凭借领先的音视频联合理解与时序推理能力，以 85.21 分综合成绩登顶榜首，超过千问、Gemini、豆包、英伟达等国内外领先模型，并在八项细分指标中的六项取得第一。据IT之家了解，DailyOmni 是行业公认的检验音视频时序对齐、跨模态联合推理能力的权威第三方榜单。不同于面向图文、短视频的常规评测任务，该榜单大量采用真实开放环境音视频素材，核心考验模型融合视觉画面、环境音频信息，精准识别声画对应关系、事件先后顺序及跨模态语义的综合能力，高度贴合人形机器人在真实物理空间开展人机交互所需的核心感知能力。官方称，WITA-Omni 领先的关键，在于它并不是简单地把聊天模型“装进”机器人，而是将物理动作和表情提升为与语音并列的一级输出，用一个原生端到端模型统一驱动感知、决策与表达，从 Thinker–Talker 范式上进一步扩展出面向具身输出的 Thinker–Talker–Actor 架构。WITA-Omni 的领先并非单纯依靠模型规模，而是来自一套围绕具身全模态交互构建的分层数据体系与针对性训练方法。在中训练阶段，WITA-Omni 使用总计千万小时级的开源和自有多模态数据，将强文本、视觉底座进一步升级为能够“听得见、看得懂，并进行音画联合推理”的全模态模型。此外，公开音视频数据通常缺少真实交互中的轮次切换、响应时机、动作和表情信息，难以直接训练端到端具身交互模型。为此，智元构建了以人为中心、面向真实交互场景的大规模高质量全模态数据集，完整保留声音、画面、语言、动作和表情之间天然的时序关系。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/739.htm", "publishedAt": "2026-07-28T11:08:34+00:00"}, {"title": "Day0 适配：阿里云灵骏真武 M890 超节点实例现已支持月之暗面 Kimi K3 大模型", "summary": "IT之家 7 月 28 日消息，阿里云今天宣布，灵骏真武 M890 超节点实例成功适配 2.8 万亿参数大模型 Kimi K3，基于芯片、推理平台和模型的联合优化，有效提升模型推理效率。IT之家了解到，Kimi K3 是月之暗面最新的旗舰模型，参数规模达到 2.8 万亿，采用混合专家（MoE）架构。而灵骏真武超节点实例基于平头哥训推一体 AI 芯片真武 M890 打造，具备 ICN Switch 1.0 互联芯片，可让 64 张 M890 实现 800 GB/s 的 All-to-All 高速互联，显存规模达 9TB，可将万亿级 MoE 模型的 EP 专家并行通信流量，跑在一个高带宽通信域内，保证 Token（词元）生成效率。同时，阿里云、平头哥和 Kimi 团队从子、软件栈等层面进行深度协同，成功让 kimi K3 模型实现 Day0 适配。真武芯片的 T-Head SAIL 软件栈可让 Kimi 自研 Mooncake 推理框架实现“开箱即跑”，M890 的 Triton 支持也让大量基于 Triton 编写的自定义算子无需重写，大幅降低适配工作量。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/734.htm", "publishedAt": "2026-07-28T10:40:53+00:00"}, {"title": "印度法院判决：OpenAI 用新闻内容训练 AI 不侵权", "summary": "印度德里高等法院于当地时间 7 月 24 日裁定，OpenAI利用亚洲国际新闻社（ANI）的内容训练人工智能模型，不构成侵犯版权。 法官Amit Bansal在判决中明确指出，OpenAI的行为符合印度《版权法》中定义的研究类\"合理使用\"例外情形。与此同时，ANI未能向法院提交充分证据，证明ChatGPT生成的回复中存在对ANI受版权保护内容的...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/481476", "publishedAt": "2026-07-28T10:38:07+00:00"}, {"title": "Meta 联合贝莱德成立合资企业，投资 140 亿美元建设得州 AI 数据中心", "summary": "IT之家 7 月 28 日消息，Meta Platforms 与贝莱德（BlackRock）今日宣布成立一家合资企业，共同开发并持有位于美国得克萨斯州埃尔帕索（El Paso）的一座数据中心园区。Meta 已拥有超过 15 年的数据中心开发、建设和运营经验。其 Meta Compute 战略正是在这一基础上发展而来，将自身的基础设施建设能力与资本合作伙伴相结合，以满足其长期 AI 战略对建设速度和灵活性的需求。作为全球领先的资产管理公司，贝莱德及其旗下的全球基础设施合伙公司（Global Infrastructure Partners，GIP）和 HPS Investment Partners，将为该战略提供支持。贝莱德不仅能够提供大规模资金，还拥有丰富的基础设施投资和私募融资经验，可帮助关键数据中心项目快速落地。Meta 表示，在经过激烈的竞争性遴选后，公司最终选择贝莱德作为合作伙伴，这也体现了 Meta 在扩大 Meta Compute 规模过程中，对基础设施融资渠道多元化的审慎策略。Meta 创始人兼 CEO 马克 · 扎克伯格（Mark Zuckerberg）表示：“建设支撑超级智能（Superintelligence）的基础设施，是确保这项技术成果能够惠及所有人的关键。与拉里 · 芬克（Larry Fink）及贝莱德团队合作，将帮助我们以更快速度、更大规模推进这一目标，把我们在世界级数据中心设计和运营方面的经验，与全球领先基础设施投资机构的能力结合起来。”贝莱德董事长兼 CEO 拉里 · 芬克表示：“我们很高兴能与马克及 Meta 管理团队合作，共同打造埃尔帕索数据中心园区。该项目将创造数千个高技能岗位，并推动当地经济增长。全球企业都在寻找能够长期合作、共同推进关键项目的战略伙伴，而贝莱德正具备这样的能力。这项交易也充分展现了我们与 GIP、HPS 整合后的综合实力，为客户提供了参与 AI 基础设施和能源领域投资的重要机会。”这座位于得州埃尔帕索、目前正在建设中的先进数据中心园区，将拥有 1 吉瓦（GW）的计算能力，对于推动 Meta AI 技术发展、加速 AI 模型研发以及提升核心业务能力具有重要意义。Meta 将负责园区的施工管理、行政管理及物业管理工作，并将在项目建成后成为首个也是唯一的入驻用户。交易预计将在未来几天内完成，项目计划于 2028 年开始逐步投入运营。此次埃尔帕索数据中心项目，是 Meta 一项超过 100 亿美元的投资。项目建设高峰期预计将创造超过 4000 个建筑施工岗位，建成后还将提供约 300 个长期运营岗位。目前已有超过 2300 名工作人员在现场施工。该项目也是美国“劳动力学院”（America's Workforce Academy）计划的一部分。该计划为参与者提供免费的技能工种培训，学员毕业后可直接进入 Meta 合作伙伴的数据中心项目工作。此外，Meta 还向埃尔帕索公立学校捐赠 50 万美元，用于支持劳动力培养计划，通过实践课程和 STEM（科学、技术、工程和数学）教育以及技能培训，为学生提供更多职业发展机会。Meta 还将继续与当地非营利组织合作，推进水资源恢复项目，包括增加供水能力、改善水质、提供安全饮用水以及修复当地生态环境。与此同时，贝莱德也将通过旗下基金会支持的全国性项目“Future Builders”，推动得州技能人才培养。该项目总投资接近 3000 万美元，计划在未来三年培训超过 1.2 万名电工，以满足得州不断增长的能源、基础设施和数据中心建设需求。根据交易安排，由贝莱德管理的基金将持有合资公司 80% 的股权，Meta 持有剩余 20%。双方将按持股比例共同承担约 140 亿美元（IT之家注：现汇率约合 948.44 亿元人民币）的项目开发成本，用于建设园区建筑，以及电力、制冷和网络连接等长期基础设施。交易完成时，Meta 将向合资公司注入价值约 23 亿美元的土地和在建工程资产，贝莱德则将投入约 49 亿美元现金。为了使双方股权比例符合 80:20 的结构，Meta 将一次性获得约 10 亿美元的资金分配。贝莱德此次投资中，部分资金将来自一笔总额为 125 亿美元的债务融资。项目建成后，Meta 将与合资公司签署租赁协议，租用整个数据中心园区。租赁合同初始期限为 4 年，并设有 4 次续租选择权，使 Meta 最长可拥有约 20 年的使用期限。此外，Meta 还将提供剩余价值担保（Residual Value Guarantee，RVG），担保金额上限约为 130 亿美元，并会随着时间逐步下降。如果在租赁期前 16 年内满足特定条件，当园区资产的公允价值低于担保门槛时，Meta 需要支付两者之间的差额。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/701.htm", "publishedAt": "2026-07-28T09:54:32+00:00"}, {"title": "阿里 Qoder 上线实时语音智能体 Qoder Voice", "summary": "阿里AI编程助手Qoder正式推出实时语音交互智能体Qoder Voice，由全双工语音模型Qwen-Audio-3.0-Realtime驱动，支持开发者通过自然语音完成任务创建、方案讨论和代码执行，实现语音与AI编程的实时协同。 据介绍，用户在Qoder Quest模式主界面点击语音入口，即可通过悬浮窗在任意界面唤起Qoder Voice。发出语音指令后，系统...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/481439", "publishedAt": "2026-07-28T09:46:26+00:00"}, {"title": "Kimi K3、Unlimited OCR包揽全球前二，中国开源模型持续刷屏海外", "summary": "", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/461949.html", "publishedAt": "2026-07-28T08:17:05+00:00"}, {"title": "夜莺监控发布 V9 正式版，引入 AI", "summary": "核心要点 夜莺 v9.0.0 正式版已发布，从 v8.5.1 到 v9.0.0 历时半年、前后端合计上千个提交，是夜莺历史上体量最大的一次大版本迭代。 v9 的头号主线是 Nightingale AI：内置 AI 助手、20+ 个开箱即用的 Skill、大模型（LLM）集中配置管理，并可按页面智能推荐提示词。 夜莺内置了 MCP Server 与 A2A 协议端点，默认只读...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/481363/nightingale-v9-released", "publishedAt": "2026-07-28T08:03:04+00:00"}, {"title": "Kimi K3 一开源，Anthropic  "Debian 就项目中的 LLM 使用进行决议", "summary": "Debian 开发者正在就一项关于是否允许在 Debian 软件项目中使用 AI 大语言模型（LLM）的通用决议展开讨论。 方案一旨在明确禁止使用或借助大型语言模型 (LLM) 或其他生成式 AI 工具编写的任何 Debian 贡献。此方案将涵盖 Debian 源代码包、Debian 官方项目软件（例如 lintian）、Debian 网络资源、Debian 贡献者添加的文...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/480266/debian-gr-llm-usage", "publishedAt": "2026-07-27T03:37:08+00:00"}, {"title": "GPFS、Alluxio、JuiceFS 怎么选？一文看懂架构与适用场景", "summary": "这篇文章会先从 AI 工作负载的典型 I/O 模式出发，梳理不同业务对存储系统提出的实际挑战；随后围绕 GPFS、Alluxio 和 JuiceFS 展开比较，分析它们在架构设计、文件系统语义、缓存机制、成本模型和适用边界上的差异，以及它们在不同 AI 场景中的适用性。", "sourceName": "开源中国", "sourceUrl": "https://my.oschina.net/u/5389802/blog/19726712", "publishedAt": "2026-07-27T03:23:42+00:00"}, {"title": "DataBuff v0.1.5 发布 · 写入性能大幅提升", "summary": "DataBuff 是一款面向云原生与微服务场景的开源 AI Native OpenTelemetry APM，采用 OTLP 标准接入、Apache Doris 统一存储，Web 端提供拓扑 / Trace / 指标与多 Agent 排障。项目已在 OSCHINA 软件库收录：https://www.oschina.net/p/databuff 今天，DataBuff 正式发布 v0.1.5（2026-07-21）。相对 v0.1.4 共 25 个提交、...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/480213/databuff-0-1-5-released", "publishedAt": "2026-07-27T02:39:33+00:00"}, {"title": "对话腾讯副总裁林松涛：意图正在代替入口，Agent 需要一颗「小脑」", "summary": "大模型是「大脑」，Marvis 想补上「小脑」#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1673039?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-07-24T07:43:20+00:00"}, {"title": "200 家硅谷初创联名反对白宫政府封禁中国开源 AI 模型", "summary": "\"这对 Anthropic 来说太好了，因为我们所有人都不得不花钱买 Anthropic 的服务。\" 7 月 22 日，近 200 家硅谷初创企业联名致信白宫，呼吁不要切断美国开发者获取中国开源 AI 模型的渠道。Particle 创始人 Suhail Doshi 在接受 POLITICO 采访时把话说得最直白：\"将会有数百家公司瞬间死掉。\" 这封信来自一个刚刚成立的叫\"...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/478417", "publishedAt": "2026-07-24T06:39:45+00:00"}, {"title": "德国黑森林实验室发布 Flux3 多模态模型", "summary": "德国人工智能初创公司黑森林实验室（Black Forest Labs）正式发布多模态基础模型 Flux3。该模型基于Self-Flow架构打造，配备专用的图像、视频、音频及动作编解码器，实现了对物理与数字环境的统一理解与生成。 作为首款支持原生音频生成的模型，Flux3可一次性输出长达20秒的音视频同步片段，并涵盖文本/图像/视频转视频、...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/478329", "publishedAt": "2026-07-24T04:01:10+00:00"}]}, {"label": "产品发布/更新", "items": [{"title": "AI 用电需求持续攀升，特斯拉包下 140 兆瓦太阳能电站全部电力", "summary": "IT之家 7 月 28 日消息，特斯拉已签署一项长期购电协议（PPA），将购买一座位于美国得州东北部、装机容量为 140MWac（交流侧 140 兆瓦）的太阳能发电站的全部发电量。这座名为 Lumen Farm 的太阳能电站由可再生能源开发商 Zelestra 建设。Zelestra 获得了私募股权公司 EQT 的支持。项目预计将于 2027 年开工，并于 2029 年投入运营。双方均未披露电价，也没有说明这些电力将具体用于哪些业务。Zelestra 仅确认，特斯拉将购买该电站的“全部发电量”。实际上，在得州，一座 140 兆瓦级太阳能电站足以满足大型、持续增长的用电需求，而特斯拉在当地拥有不少这样的用电场景，包括得州超级工厂（Gigafactory Texas）以及快速扩张的 AI 算力基础设施。这是双方的第二次合作。2024 年，Zelestra 曾与特斯拉签署一份 57MWac 的购电协议，为西班牙卡斯蒂利亚-拉曼恰地区的三座太阳能电站提供电力。这也是双方首次在美国开展合作。Zelestra 美国公司 CEO Phil North 表示：“作为值得信赖的全球合作伙伴，我们能够在多个地区为客户提供定制化解决方案。因此，我们很高兴将与特斯拉的合作拓展至美国市场。”虽然 Zelestra 并非家喻户晓的企业，但它已成为得州最活跃的太阳能开发商之一。目前，公司拥有超过 16GW 的可再生能源项目储备，并且最近被彭博新能源财经（BloombergNEF）评为全球十大企业清洁能源供应商之一。Zelestra 在得州的另一位重要客户是 Meta。过去一年，公司陆续与 Meta 签署了多项太阳能购电协议，为其数据中心供电，其中包括 180MWdc 的 Palmera 项目和 176MWdc 的 Skull Creek 项目。此外，公司还凭借这些 Meta 合同获得了 6 亿美元（IT之家注：现汇率约合 40.65 亿元人民币）绿色融资，用于支持一个总装机容量达 440MW 的得州太阳能项目组合。这意味着，特斯拉如今正从与 Meta 数据中心合作的同一家开发商购买电力，接入同一个得州电网（ERCOT），原因也相同 —— 满足快速增长的用电需求，并获得价格低廉、来源清洁的电力供应。随着需求不断增加，得州太阳能资源的争夺正变得愈发激烈，而特斯拉如今也加入了这场“抢电”行列。耐人寻味的是：特斯拉本可以自己建设这座电站这笔交易之所以令人意外，是因为特斯拉本身就是一家太阳能企业。2016 年，特斯拉收购了当时美国最大的住宅太阳能安装商 SolarCity。如今，特斯拉仍销售太阳能板和 Solar Roof（太阳能屋顶），生产 Powerwall 家用储能系统和市场销量领先的 Megapack 电网级储能系统，同时还正在得州休斯敦附近建设一座年产能达 100GW 的太阳能电池板工厂，而这座工厂与 Lumen Farm 项目位于同一个州。然而，为了实现其得州业务的绿色供电，特斯拉却选择购买其他公司太阳能电站的电力。这也反映出特斯拉近年来持续削减太阳能业务所留下的影响。公司当年斥资 26 亿美元收购 SolarCity 后，太阳能业务规模却大幅萎缩。年部署规模从 SolarCity 高峰时期约 870MW，降至不足当年的一小部分。特斯拉关闭了多个销售渠道，让这项业务逐渐边缘化，多年来将资源主要投入电动汽车和 Megapack 储能业务。直到最近，特斯拉才开始重建太阳能业务。公司于 2025 年底重新推出太阳能租赁服务，今年 1 月发布了美国本土制造的太阳能板，目前又正在建设休斯敦大型太阳能板工厂。不过，重建业务需要时间，而特斯拉显然已经等不及自家公用事业级太阳能项目建成，因此只能先通过购电协议获得所需的清洁电力。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/783.htm", "publishedAt": "2026-07-28T15:09:21+00:00"}, {"title": "AMD 与 Core Scientific 达成合作，锁定最高 2.5GW AI 数据中心算力资源", "summary": "IT之家 7 月 28 日消息，AMD 当地时间周二宣布与 Core Scientific 达成合作协议，将获得最高 2.5 吉瓦的数据中心容量，以满足人工智能计算需求持续增长背景下对基础设施的扩张需求。受消息影响，Core Scientific 盘前股价上涨 6%，而 AMD 股价则下跌 4%，走势与其他芯片厂商基本一致。随着云服务提供商和企业不断加大 AI 基础设施投资，电力、土地以及数据中心资源的需求持续攀升。据IT之家了解，根据协议，在满足特定商业条件的情况下，AMD 将获得按市场价格购买 Core Scientific 普通股的认股权证。双方并未披露交易的具体财务条款。此次合作将使 AMD 自 2027 年起获得 Core Scientific 超过 500 兆瓦的 AI 数据中心容量，其客户可利用这些设施部署人工智能系统。未来，这一容量还可进一步扩展至最高 2.5 吉瓦。近年来，Core Scientific 正逐步从加密货币业务转向承接 AI 和高性能计算（HPC）工作负载托管。根据协议，该公司还将与 AMD 合作开展数据中心物理基础设施设计，并部署 AMD 的芯片和软件解决方案。AMD 企业发展战略负责人 Mathew Hein 表示：“Core Scientific 丰富的 AI 数据中心资源，将进一步扩大客户获取 AI 基础设施的渠道，帮助他们大规模部署基于 AMD 的人工智能解决方案。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/773.htm", "publishedAt": "2026-07-28T14:22:39+00:00"}, {"title": "NVIDIA 发布 GeForce Game Ready 610.88 WHQL 显卡驱动程序", "summary": "IT之家 7 月 28 日消息，NVIDIA（英伟达）今日正式推出 GeForce Game Ready 610.88 WHQL 显卡驱动程序。IT之家了解到，该版本驱动程序为《战争机器：事变日》多人模式测试版抢先体验、《光环：战役进化》、《雾影猎人》优化了用户的系统。《战争机器：事变日》将于 10 月 7 日正式发布，预购玩家和 PC Game Pass 订阅用户可于 8 月 6 日起抢先体验其多人模式测试；《光环：战役进化》已于 7 月 23 日开启抢先体验，并于今日正式发布；《雾影猎人》则将在 7 月 30 日正式上线。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/772.htm", "publishedAt": "2026-07-28T14:22:29+00:00"}, {"title": "消息称苹果智能家居中枢将搭载全新 Siri AI，将于今秋至明年初发布", "summary": "IT之家 7 月 28 日消息，据彭博社的马克 · 古尔曼报道，知情人士透露，苹果计划很快推出一款以全新 Siri AI 助手为核心的智能家居中枢设备。知情人士还表示，苹果同时准备推出一款新的 Apple TV 和升级版 HomePod mini。这两款产品在外观上“与现有版本基本保持一致”，但内部将搭载性能更强的芯片，以支持 Siri AI 功能。据报道，苹果备受期待的智能家居中枢设备目前有两个版本正在开发。其中一个采用半球形底座设计，屏幕安装在底座顶部；另一个则通过全新的磁吸系统固定在墙面上。报道称，这款设备将配备一块 7 英寸方形显示屏，并围绕 Siri AI 打造。其将运行一套基于 tvOS 全新开发的操作系统，界面融合了 tvOS 和 watchOS 的设计风格，支持应用程序、图标以及小组件。此外，这款设备还将支持 FaceTime 视频通话、家庭安防监控、HomeKit 智能家居生态，并提供类似 Apple Watch 的可自定义表盘功能。其中最引人注目的新功能预计将是面部识别。报道称，该设备能够识别正在查看屏幕的用户身份，判断用户与屏幕之间的距离，并实时调整界面显示内容。系统会根据观看者自动调整信息的大小和展示方式，以获得更好的浏览体验，同时还能根据当前用户显示其个人日历、备忘录等个性化内容。最后，报道还透露，苹果还有另外两款智能家居产品正在研发，发布时间会更晚。其中包括一款配备 9 英寸显示屏、定位更高端的机器人版家庭中枢，以及一款功能更先进的家用安防摄像头。报道称，苹果计划于今年秋季推出新款 Apple TV 和 HomePod mini，而智能家居中枢设备则将于 10 月至明年年初期间发布。IT之家注意到，这一举措将使苹果与亚马逊公司和谷歌在人工智能技术不断进步的市场中展开更直接的竞争。苹果的新款智能设备将与亚马逊的 EchoShow 以及谷歌的 NestHub 展开较量。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/764.htm", "publishedAt": "2026-07-28T13:45:57+00:00"}, {"title": "英伟达重构工程软件栈：Agent、PhysicsNeMo 与 CUDA-X 合流", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/zqDgQBsALhkhCkBoRg9l?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-28T11:22:54+00:00"}, {"title": "豆包搜索，走出了豆包", "summary": "把搜索能力开放给Agent了", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/461961.html", "publishedAt": "2026-07-28T10:12:52+00:00"}, {"title": "从超级顾问到 Agent 蜂群：AI Native 人才服务组织的共生进化｜AICon深圳", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/2YUiVa3OsKab7LQ36LS9?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-28T10:00:00+00:00"}, {"title": "当AI学会“仿真思维”，教师才能回归育人本质", "summary": "从“工具效率”到“认知理解”，教育AI进入深水区", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/461939.html", "publishedAt": "2026-07-28T07:32:47+00:00"}, {"title": "美团正式发布 CatPaw：全场景 AI Agent，从个人提效到企业智能化", "summary": "目前，CatPaw 已在美团内部大规模落地：累计覆盖 9 万员工、搭建 Agent 3 万个，并在多个真实业务场景中完成验证。", "sourceName": "开源中国", "sourceUrl": "https://my.oschina.net/meituantech/blog/19728543", "publishedAt": "2026-07-28T06:47:15+00:00"}, {"title": "API 智能开发平台 5.2 发布", "summary": "ApiGo 是是一款基于 AI 技术的企业级低代码 API 开发与治理平台。 通过智能化配置快速将数据变成标准 REST API，生成 AI Skill 技能， 实现从设计、开发到运维的全生命周期智能管理。支持多数据源（mysql、oracle、postgresql、Kingbase、达梦、TiDB、es、Hive、DolphinDB）等；支持实时接口开发、接口文档、数据脱敏、数...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/481254/crabc-5-2-released", "publishedAt": "2026-07-28T05:55:50+00:00"}, {"title": "谷歌 AI 概览出现率一年升至 43%，AI 搜索成为主流入口", "summary": "Similarweb最新报告显示，人工智能搜索正在快速改变传统搜索模式，谷歌AI概览（AI Overviews）在搜索结果中的出现比例已从一年前的15%提升至43%，AI驱动的信息获取方式正在逐渐成为用户搜索的默认体验。 报告指出，谷歌AI概览最初只是传统搜索结果之上的辅助功能，如今已成为搜索流程的重要组成部分。用户在获得AI生成答...", "sourceName": "开源中国", "sourceUrl": "https:// 2VRtKCSo1kB?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-28T19:30:29+00:00"}, {"title": "《赛博朋克：边缘行者》衍生 2.5D 格斗游戏曝光，WayForward 工作室开发", "summary": "IT之家 7 月 28 日消息，据游戏媒体 IGN 今天报道，《赛博朋克：边缘行者》2.5D 横板格斗游戏最近曝光，不过该游戏的开发状态目前无法确认。据报道，该项目由 WayForward 工作室开发，代号“Gemini”，自 2025 年开始便进入制作阶段。玩法方面，这款游戏在规划阶段拥有“回滚机制”（rollback-driven），画风偏向动画，类似《热血硬派国夫君外传热血少女》系列游戏。值得注意的是，WayForward 去年曾因资金问题取消一款未官宣的外部 IP 游戏，并导致工作室于去年 9 月裁员，但我们目前无法确认这个被砍项目是否是“Gemini”。截至IT之家发稿，CD Projekt 暂未回应置评请求。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/786.htm", "publishedAt": "2026-07-28T15:36:21+00:00"}, {"title": "美国大学教授出奇招抓 AI 作弊：往试卷里塞隐藏提示词，35 名学生中 32 人中招", "summary": "IT之家 7 月 28 日消息，据科技媒体 TechSpot 昨天报道，美国奥尔康州立大学历史学教授杰森 · 吉布森（IT之家注：Jason Gibson）最近分享自己抓 AI 作弊的奇招，结果显示他任教的两个班级中，共有 32 人被抓现行。据报道，这名教授给学生出的期中考试题目中，有一题涉及工业革命。他知道许多学生会直接照抄 AI 答案，因此他决定往试卷文档里加入一条提示词，要求 AI 以毫无逻辑的方式描述“马达加斯加”。这段提示词使用白色字体嵌入在文档里，因此学生无法直接用肉眼看到。最终学生们交上来的 35 份试卷中，有 32 张答卷露出马脚。其实这些学生哪怕稍微检查一下 AI 给出的答案，就能发现异常。其中一个答案先是描述了工业革命，然后突然说“马达加斯加在下午时分横向漂浮”；另一答案则先讨论技术发展与社会不平等，然后结尾是“马达加斯加紫色单车对天花板低语”。杰森教授表示，他这么做并不是想嘲讽学生。发现他们作弊后，他给了这些学生申诉机会。最后 30 人选择认栽，但仍有 2 人试图为自己的行为辩解。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/759.htm", "publishedAt": "2026-07-28T13:24:35+00:00"}, {"title": "刚刚，北大校友翁荔官宣离职，AI 时代最好的「对齐」是照顾好自己", "summary": "AI 时代最好的「对齐」是照顾好自己#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1673220?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-07-28T04:10:08+00:00"}, {"title": "圆桌访谈：当 AI Coding 成为日常，开发者真正该关心什么？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/video/hTlgBWF6rgBKDi7TEb7i?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-27T18:03:04+00:00"}, {"title": "跨境电商也“招” AI 员工了？模力工场×InfoQ×数势科技，共办龙岗跨境电商 AI 闭门峰会", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/gkXGgedf2YZCM6mhxCv8?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-27T16:13:05+00:00"}, {"title": "超维动力携手北大医疗：务实构建具身智能医疗落地路径", "summary": "一次技术与场景的深度耦合", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/461444.html", "publishedAt": "2026-07-27T09:55:17+00:00"}, {"title": "刚拿完菲尔兹奖，他扭头加盟 OpenAI", "summary": "全世界最聪明的数学家，集体投奔 AI#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1673003?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-07-24T02:19:16+00:00"}]}, {"label": "论文研究", "items": [{"title": "潜伏 9 年的 Linux 内核高危漏洞 RefluXFS 曝光：源于 XFS 文件系统设计缺陷、超 1600 万台设备面临风险", "summary": "IT之家 7 月 28 日消息，安全公司 Qualys 发文，披露了 Linux 内核中存在的一项名为 RefluXFS 的本地权限提升漏洞（CVE-2026-64600），该漏洞自 2017 年 Linux 内核 4.11 版本开始便一直存在，历经约 9 年才被发现，CVSS 评分达 7.8 分。IT之家获悉，CVE-2026-64600 源于 Linux 内核 XFS 文件系统 Copy-on-Write（CoW，写时复制）机制中的竞争条件问题。黑客可以利用该漏洞，在启用了 reflink 功能的 XFS 磁盘分区中修改任意可读取文件，并通过覆盖系统关键文件实现本地权限提升，最终获取 Root 权限。由于该漏洞利用的是文件系统设计缺陷，因此即使系统启用了 SMEP、SMAP、KASLR 等内存保护机制，或者采用内核锁定（Kernel Lockdown）、容器隔离等安全措施，也无法有效阻止攻击。因此，所有启用了 XFS 文件系统 reflink 功能的 Linux 平台都可能受到影响（包括 RHEL、Oracle Linux、Amazon Linux、Fedora 等发行版），全球超过 1640 万台 Linux 主机可能面临风险。目前，Linux 内核开发团队已将相关修复补丁合并至上游内核，后续将由各 Linux 发行版厂商陆续整合至对应内核版本中。Qualys 进一步披露，研究团队利用人工验证结合 AI 辅助分析方法找到了这一漏洞，团队首先利用 Claude 协助分析 Linux 内核源码，缩小搜索范围并定位潜在问题区域，随后由安全研究人员进一步完成了 RefluXFS 漏洞验证及攻击流程分析步骤。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/729.htm", "publishedAt": "2026-07-28T10:29:41+00:00"}, {"title": "新晋菲尔兹奖得主 Tsimerman 官宣加入 OpenAI", "summary": "当地时间 7 月 23 日上午，2026 年国际数学家大会在费城开幕，本年度菲尔兹奖四位得主揭晓——邓煜、约翰·帕登、雅各布·齐默尔曼与王虹。其中邓煜、王虹成为菲尔兹奖自设立以来首批获此殊荣的中国籍数学家。 在赛后新闻发布会上，其中一位新科得主雅各布·齐默尔曼（Jacob Tsimerman）顺势宣布将转向 AI 安全领域研究，...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/478486", "publishedAt": "2026-07-24T07:50:13+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "底座焕新：一次跑通复杂迁移、数据工程与智能开发 ｜Snowflake Discover AI 技术实战周", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/video/6O const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
