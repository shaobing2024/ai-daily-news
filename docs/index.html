44 元人民币）的 Codex Pro 订阅服务覆盖。CozyBlaze 解释称：“模型通过 MCP，也就是 Model Context Protocol，以及经过修改的 SourcePauseTool 来控制《传送门》。模型思考时，游戏会保持暂停状态；当模型发送一组输入指令后，SPT 会解除暂停并执行这些操作。”在 AI 进行思考期间，系统会向其提供游戏截图以及玩家角色所在位置等信息。随后，游戏恢复运行，GPT-6 Astra 按照自己规划好的步骤执行移动和其他操作。这也解释了为什么经过剪辑的精彩视频长度约为 2 小时，但 GPT-6 Astra 游玩《传送门》的完整视频直播记录加起来却长达约 24 小时。对于这次实验成果，CozyBlaze 的态度相当务实。他承认，目前仍然存在许多需要解决的问题，这次通关过程也不应该被视为 AI 能力的标准化基准测试。不过，他表示：“但看到一个通用型智能体能够自主探索游戏世界，并最终一路完成整个游戏，会让人感觉最初的愿景正在逐渐成为现实。”CozyBlaze 所说的“最初愿景”，指的是 OpenAI 早在 2016 年提出的一项长期目标。当时，OpenAI 曾设想，未来能够打造一个单一 AI 智能体，让它解决各种不同类型的游戏任务。GPT-6 Astra 于本月早些时候成为 OpenAI 的新旗舰模型。OpenAI 表示，新模型代表了“新一代智能”，并且在计算机操作、网页浏览、软件工程、网络安全、科学研究以及专业工作等领域达到了当前最先进水平。预计在未来几天里，会看到 Astra 大展其强大的智能能力。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/999/488.htm", "publishedAt": "2026-09-07T14:40:44+00:00"}, {"title": "小米秋季旗舰新品发布会一文汇总：18 Fold 中折叠上市，澎程 N70/N90 轮番炸场", "summary": "小米中折叠手机 + 澎程系列 SUV，小米“双王牌”到齐！今晚（9 月 7 日）19:00，小米秋季旗舰新品发布会准时开启。小米不仅发布了 18 Fold 手机和 9 Pro Max 平板，还正式推出澎程家族力作 N90 Max、N70 Max、N70 Pro，更带来了 One more thing。手机、汽车，双双都是万众瞩目的焦点新品，小米这次亮出的“双王牌”到底有多能打？IT之家小编这就为大家盘一盘。一、小米 18 Fold咱们先聚焦于小米的折叠屏手机，雷军表示，小米做折叠屏手机已经有五六年的历史，已推出四款大折叠、两款小折叠。这几年小米一直在思考一个问题，结合小折叠与大折叠优势，能不能做一款尺寸更合适、比例更舒服、更多人喜欢的新形态呢，小米的答案是“中折叠”。小米 18 Fold 在两年前立项，研发了 20 个月，是小米迄今为止最高端手机。具体来看，屏幕方面，小米 18 Fold 配备 5.38 英寸外屏 +7.58 英寸内屏，内外屏采用约√2:1 标准纸张比例。雷军称，这个比例恰到好处。用来阅读，如看书般自然；用来观影，画面铺展不用裁切；办公看文档，无需缩放调整，内容一目了然。两块屏幕均为超级像素屏，支持 LTPO 1-120Hz 刷新率、4000nits 超级阳光屏 (APL 30%)。配色方面，除了主打的“西野红”，还有暖金白、黑色两款颜色。设计方面，小米 18 Fold 展开厚度为 5.02mm，闭合厚度为 10.68mm，整机重量为 219g，配备超椭圆大 R 角、纯平包裹式中框、跑道型 DECO。外屏单手操控可覆盖大部分区域，单行显示字数更多，符合人眼横向阅读习惯。此外，键盘比 6.9 英寸直板机宽 8%。展开高度为 117.8mm，展开宽度为 163.8mm，展开厚度为 5.02mm，支持全新多任务模式，至高支持六分屏，搭配“超级小爱灵感球”，复杂操作一键即达。转轴方面，小米 18 Fold 搭载新一代小米龙骨转轴，采用三级连杆结构、自然水滴形态，支持转轴全贴合保护。使用高强度机身材料，包括 7 系铝合金中框、小米龙晶玻璃 3.0，同时外屏还进行了离子注入强化。创新采用双层 UTG 超薄玻璃、有机柔性绝缘材料，尖锐物品抗冲击性较上代提升 258%、钢球重物跌落高度较上代提升 214%，整机跌落高度达到 1.2m，平均折痕深度≤30µm。性能方面，小米 18 Fold 首发搭载玄戒 O3 小米 AI 旗舰 SoC，这也是首款超 500 万分的 AI 旗舰 SoC。CPU 多核性能提升 60%，中低负载功耗降低 25%；GPU 性能提升 85%，功耗降低 64%；NPU Tensor 算力 200TOPS，Vector 算力 3.13TFLOPS。此外，小米联合长鑫存储率先量产国产 LPDDR6。续航方面，内置 6000mAh 小米金沙江电池，采用双叠片电池，拥有 20% 高含硅量、920Wh/L 能量密度，支持 67W 有线秒充、50W 无线秒充。影像方面，搭载全焦段徕卡超清三摄，包括徕卡 2 亿主摄、5000 万像素 3.5x 徕卡潜望长焦、5000 万像素徕卡超广角。另外还有一个陶瓷特别版，使用新型氮化硅陶瓷，重量更轻、硬度更高。价格方面：12GB+256GB 售价 10999 元；12GB+512GB 售价 11999 元；16GB+512GB 售价 12999 元；16GB+1TB LPDDR6 售价 14999 元；16GB+1TB LPDDR6 陶瓷特别版售价 15999 元。二、小米平板 9 Pro Max紧跟小米 18 Fold，小米平板 9 Pro Max 随即登场，同样首发玄戒 O3 芯片。来看重点规格，小米平板 9 Pro Max 搭载了一块 13.3 英寸高清原色屏，144Hz 刷新率，3.4K 分辨率；3:2 屏幕比例、适配 PC 级应用界面；全局亮度 1000nits、ΔE≈0.47，可选纳米柔光屏版。采用金属一体化机身设计，配备简约 Deco、跑道型设计、XRING 徽标，可选浓郁酒红、黑色、银色三种颜色。厚度为 5.67mm、整机重 645g，电池容量 12000mAh，支持 120W 小米澎湃秒充。首发搭载玄戒 O3 AI 旗舰处理器，CPU 多核、GPU 跑分逼近苹果 M5。搭载 6 麦克风阵列和旗舰 8 扬声器，采用 32MP+50MP 超清前后摄，支持 Wi-Fi 7 高速连接。首发小米澎湃 OS 4，专为大屏生产力构建；支持多分屏模式，至高支持 6 分屏；双分屏，自由调节显示比例；三分屏，一屏三应用并行；六分屏，复杂任务，全景处理。支持 DP-in 音视频输入，通过全功能 Type-C 直连，可变便携显示器，可做电脑副屏、专业数位屏、游戏大屏。价格方面：8GB+256GB 售价 4799 元12GB+256GB 售价 5299 元16GB+256GB 售价 5799 元12GB+512GB 售价 6099 元16GB+512GB 售价 6599 元16GB+512GB 柔光屏版售价 6899 元16GB+1TB 柔光屏版售价 7899 元悬浮键盘售价 1099 元三、澎程 N70 Pro看完小米的新手机和新平板，该把目光投向汽车了。还记得 7 月 30 日的技术发布会上，雷军主要讲了 N90 Max，N70 只是顺带一提；但到了今天，N70 成了重点介绍的焦点。小米澎程 N70 定位“中大型五座增程 SUV”，拥有经典豪华 SUV 车身比例：车长 4960mm、宽 1998mm、轴距 2950mm。集延续蜻蜓大灯、光环尾灯、无边框后视镜、鹅卵石激光雷达等家族化设计语言于一身。车身颜色共有 6 款，分别为蝴蝶谷蓝、远山青、珍珠白、火山灰、曜石黑、冷卡其。看完外在看内在，澎程 N70 提供砂陶米、摩卡棕、暗夜黑 3 款内饰颜色。全车 6.14㎡防晒玻璃，天幕搭配全遮光物理遮阳帘；全车高频接触面 95% 软包覆，婴幼儿可直接皮肤接触；还有双拼色方向盘、立柜式中控台、电镀门把手等更多细节。空间方面，澎程 N70 不同于传统五座 SUV 二排几乎不可移动，基于小米昆仑技术架构能实现智能可变空间。一排标配按摩座椅，标配滑动中岛；二排采用电动座椅，提供最大 135 度躺倒角度，二排乘坐空间 1010mm，头部空间 1021mm，二排座椅极致后移后最大乘坐空间 1410mm。后备厢标准容积 1203L，二排放倒后车后提供 2425L 空间；支持对坐模式，双人对坐最大空间 1687mm；后车门支持近 90 度开合，可选电动迎宾踏板。后排提供 21.4 英寸 3K 分辨率面板，配 14 扬声器高级音响系统。智能方面，澎程 N70 搭载第三代骁龙 8 移动平台、NVIDIA DRIVE AGX Thor 700TOPS 辅助驾驶算力芯片，带有 12 颗超声波雷达，标配小米 HAD 辅助驾驶。搭载小米澎湃智能座舱；域控制模块四合一，车机流畅，响应迅速；超级小爱深度语言控车，车内、车外都能控；人车家全生态互联，兼容苹果生态。驾驶方面，澎程 N70 Pro 峰值功率 210kW，0-100km/h 加速 7.9s，最高时速 190km/h，转弯半径 5.67m，搭载 52kWh 磷酸铁锂小米龙甲电池，CLTC 纯电续航 351 km，CLTC 综合续航 1351km。使用小米昆仑增程器 1.5T，支持 92# 汽油，WLTC 亏电油耗 Pro 5.7L/100km，增程器官方首保后 3 年或增程器 3 万公里保养一次。安全方面，澎程 N70 标配 14 处 2200MPa 小米超强钢、2200MPa「内嵌式防滚架」、一体式热成型门环、一体式热成型前地板骨架、9 个安全气囊、门把手三重冗余设计、尾门双应急拉手、低速慢行灯，支持 160km/h 爆胎稳定控制、650mm 最高涉水能力、应急浮水脱困功能等。价格方面，澎程 N70 Pro 售价 20.99 万元，首销期间赠前排免费选装座椅、8000 元轮毂选装券和 3000 元车漆选装券。四、澎程 N70 MaxPro 之上还有 Max，澎程 N70 Max 同步正式上市，定价 23.99 万元起。从 Pro 到 Max，最显著的区别在于动力和底盘相关的规格，澎湃 N70 Max 采用双电机四驱设计，最大功率 310kW、零百加速 5.5s、最高时速 190km/h，标配前双叉臂、后 H 臂多连杆悬架；标配空气弹簧、连续阻尼可变减振器；转弯半径 5.67m，宣称三车道一把过。搭载 76kWh 大电池、45L 油箱、小米昆仑增程器 1.5T，CLTC 纯电续航达 505km、CLTC 综合续航达到 1461km，WLTC 亏电油耗 6.1L/100km，92# 95# 98#汽油多油品适配。另外，新车增程器首保后，3 年或增程器 3 万公里保养一次。值得一提的是，雷军强调作为一家北方车厂，小米一直有一个明确的目标：希望把增程车的冬季体验，做到行业最好。为此，小米把积累多年的纯电车热管理技术，完整迁移到增程车上。在低温环境下，小米澎程系列的纯电续航保持率高达 66%；环境温度-40℃ 时，仍能一键冷启动。另外，像激光雷达、辅助驾驶、4D 毫米波雷达、NVIDIA Thor 芯片、Xiaomi HAD 辅助驾驶、小米 XLA 认知大模型，统统都是标配。五、澎程 N90 Max看完了澎程 N70 的两款车型，是时候锁定 N90 Max 了，该车大七座旗舰增程 SUV，长宽高分别为 5285/1998/1825mm，轴距 3080mm。不仅可选酒红等 7 种外观颜色和砂陶米等 3 款内饰以及个性化饰板，还标配 21 英寸棱镜轮毂，普利司通静音轮胎。作为新一代“陆地公务舱”，采用 2+2+3 式布局，第三排成年人乘坐也不拥挤；一二排标配 16 点式座椅按摩，全车最多可选 4 个零重力座椅，一排可选标准按摩座椅 / 旋转座椅（带按摩功能）/零重力座椅，还可选智能电动门。一排座椅支持电动旋转（支持小爱同学控制），在“对坐模式”下双人乘坐空间最大 1760mm、四人模式二排空间 1370mm，二三排极致后移，空间最大 1550mm，后备厢容积可达 1831 升。后排配备 3K 分辨率 21.4 英寸后排娱乐屏，支持海量儿童内容。中岛内置两个手机位、四个杯托、6.6L 容量、9L 独立压缩机冰箱，可滑动到第二排座位作为“多功能茶几”使用。全车提供 17 个空调出风口，配备 4890W 峰值功率 25 扬声器 7.1.4 声学架构音箱系统。搭载双电机四驱，峰值功率 310kW，最高时速 190km/h，采用搭载前双叉臂 + 后多连杆独立悬架。采用大电池增程，CLTC 纯电续航 464km，CLTC 综合续航 1705km，WLTC 亏电油耗 6.26L/100km。搭载小米澎湃智能座舱，超级小爱语音交互，实现全场景互联互通，支持双 5G 双卡双通、Wi-Fi 7、IoT 通讯接口、内置 ETC 可免费激活。满配辅助驾驶，标配前向激光雷达、后向固态激光雷达、700TOPS NVIDIA Thor™芯片。搭载铠甲笼式车身、一体式热成型门环，16 处关键位置采用 2200MPa 超强钢，配备 12 个安全气囊，每个座位更安全。三重安全冗余门把手、750mm 最高涉水能力、160km/h 高速爆胎稳定控制。价格方面，澎程 N90 Max 售价 26.99 万元，10 月 7 日 24 时之前下定，前排旋转座椅、Nappa 真皮、8000 元轮毂选装券、3000 元车漆选装券免费送、二排双零重力座椅免费送，价值 2.6 万元的小米 HAD 辅助驾驶终身免费使用。同时可选豪华套装，包含智能电动门、后排娱乐屏、电动迎宾踏板、车载 9L 压缩机冰箱、麂皮绒车顶、主驾外后视镜防眩目，定价 3.1 万元，限时优惠价 2 万元。六、澎程 N90 Max 探索版在澎程 N90 Max 正式发布后，雷军带来了 One more thing —— 澎程 N90 Max 探索版。“探索版”的核心，在于配备了原生电动升降顶舱系统。一键启动后，车顶自动升起，车内秒变上下两层 LOFT 结构，二层形成独立的通透活动空间，可用面积达 2110mm×985mm，最大承重 200kg。配合车内空间优化，整车挑高可达 2294mm，用户可在车内完全站立。雷军表示，这个升降顶舱年检不用拆下来，因为是原生的升降顶舱，和整车融为一体；但他也提醒，升降顶舱需要在非公共道路上、驻车场景下使用，也不建议在恶劣天气下使用。顶舱采用车身同色设计，闭合状态下车高仅增加 100mm，风阻系数控制在 0.245。车顶升起后，二层配备五面纱窗，采光面积达 1.7㎡，并集成独立照明、双空调出风口、18W Type-C 充电口及磁吸拓展点位，兼顾视野通透性与功能完备性。针对升降顶舱的安全性，小米原生设计了 19 项专项安全防护机制，顶舱底部加强框采用先进高强钢，整车通过 44.7km/h 翻滚试验，确保升降顶舱无脱落、无明显变形。耐久性方面，车顶完成 1 万次循环开闭测试，配合 1.2 万次踩踏测试，功能无异常。车内空间布局是探索版的另一大亮点。二排配备经典方格绗缝工艺沙发座椅，支持一键快速成床，形成 1.87m×1.24m 的纯平大床，并标配通风与加热功能。二排座椅支持四六分折，可单独成床，满足多样化场景需求。在舒适性配置上，新车搭载舒享地暖系统，采用航空级柔性发热膜，三挡加热可调，地板最高温度可达 38°C，在 0°C 环境下 10 分钟内地板表面最高可升温至 25°C。配合方向盘加热、全车座椅加热、热泵空调及压缩机冰箱制热功能，构建完整的冬季温暖体验。内饰细节方面，车辆配备悬浮式床头柜（集成 220V/12V 双电源、磁吸点位与床头灯）、总容量 20L 的嵌入式壁橱，以及 11.5 英寸柔光化妆镜（4000K 自然日光色温，115° 任意角度悬停）。全车铺设 1.7㎡ 原生木纹铝合金地板，采用 9 层喷涂与 7 层复合结构，兼具真实触感与优异抗弯折性能。娱乐系统方面，搭载 30 英寸巨幕投影系统，支持 1080P 高清显示与 650 流明亮度，幕布 25 秒快速升降，可通过遥控或语音控制，最远视距达 1096mm，并内置海量儿童内容资源。在户外场景下，车辆定位为“露营神车”，配合电动顶舱、外放电及丰富的车内起居功能，实现从交通工具到移动居所的跨越。至于其它的规格，澎程 N90 Max 探索版基本和 N90 Max 看齐，售价 29.99 万元。七、总结关于小米秋季旗舰新品发布会的情况，IT之家小编就盘到这里。从 18 Fold 到平板 9 Pro Max 再到澎程新车的定价，大家这波是否愿意喊一声“雷神”？需要注意的是，在本月底，小米还有一场发布会，届时迎面走来的将会是 18 Pro 系列等新品，敬请期待！", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/999/486.htm", "publishedAt": "2026-09-07T14:34:20+00:00"}, {"title": "26.99 万元，小米澎程 N90 Max 大七座旗舰 SUV 正式上市", "summary": "IT之家 9 月 7 日消息，在今晚的小米秋季旗舰新品发布会上，雷军宣布小米澎程 N90 Max 大七座旗舰 SUV 正式上市，售价为 26.99 万元。IT之家从发布会现场获悉，10 月 7 日 24 时之前下定，前排旋转座椅、Nappa 真皮、8000 元轮毂选装券、3000 元车漆选装券免费送、二排双零重力座椅免费送，价值 2.6 万元的小米 HAD 辅助驾驶终身免费使用。新车还提供豪华套装，包含智能电动门、后排娱乐屏、电动迎宾踏板、车载 9L 压缩机冰箱、麂皮绒车顶、主驾外后视镜防眩目，定价 3.1 万元，限时优惠价 2 万元。小米澎程 N90 Max 整体造型方正大气，设计理念是为空间而生，提供远山青、蝴蝶谷蓝、火山灰以及专属的酒红等 7 款配色，车辆全系标配 21 寸大轮毂，都是普利司通静音轮胎。配备了蜻蜓大灯、光环尾灯等家族化语言，同时还有四款个性化饰板可选。该车长宽高分别为 5285/1998/1825mm，轴距 3080mm。内饰方面，该车采用 2+2+3 式布局，第三排成年人乘坐也不拥挤；一二排标配 16 点式座椅按摩，全车最多可选 4 个零重力座椅，一排可选标准按摩座椅 / 旋转座椅（带按摩功能）/零重力座椅，还可选智能电动门。一排座椅支持电动旋转（支持小爱同学控制），在“对坐模式”下双人乘坐空间最大 1760mm、四人模式二排空间 1370mm，二三排极致后移，空间最大 1550mm，号称新一代的陆地公务舱，后备厢容积可达 1831 升。该车后排配备 3K 分辨率 21.4 英寸后排娱乐屏，支持海量儿童内容。中岛内置两个手机位、四个杯托、6.6L 容量、9L 独立压缩机冰箱，可滑动到第二排座位作为“多功能茶几”使用。全车提供 17 个空调出风口，配备 4890W 峰值功率 25 扬声器 7.1.4 。IT之家附小米澎程 N70 系列车型核心亮点如下：", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/999/458.htm", "publishedAt": "2026-09-07T12:38:48+00:00"}, {"title": "vivo X500 系列手机全球首发蓝图光御 900 传感器，CIPA 7.0 防抖、AI 摄影助手", "summary": "IT之家 9 月 7 日消息，在今晚的 vivo 创作者盛典活动中，vivo 官方公布了 X500 系列手机的影像配置。vivo X500 系列将首发主摄和潜望长焦 CIPA 7.0 防抖等级，全新升级 2 亿长焦画质。vivo X500 Pro Max 支持了 Ultra 同款 400mm 增距镜，搭配 CIPA 7.0 防抖等级、三星 HP0 长焦镜头，更好适配远处风景、演唱会拍摄场景；RAW 域生成式重建技术，端侧模型保证出片速度，云端大模型突破画质上限。vivo X500 Pro Max 还与联发科合作，首发长焦跟随功能，支持辅助构图 + 姿势识别，更好跟随拍摄。vivo X500 系列手机将全球首发蓝图光御 900 传感器，配合全球首发的 vivo 蓝图超高动态技术，实现最高 17EV 的动态范围。新机还是 vivo 品牌首发 4K 240fps 慢动作、4K 120fps DCG HDR，全新升级 VCS 4.0。新机带来蓝图鲜明、蓝图原色风格摄影，还有全新电影感色彩风格、人文银盐风格，用户可在调色盘中随意自定义图片色彩。vivo X500 系列支持数字中间片，电影色彩与照片实现色彩同源；还有全新升级的去反色技术色貌模型，拍摄文物、模型等更还原。人像方面，vivo X500 系列全新升级闪光人像多焦段闪光灯、人文胶片色彩风格。IT之家从活动现场获悉，vivo 还带来了全新升级的 AI 摄影助手，可精准认出 5,000 种场景标签，自动推荐拍摄摆姿、构图、色调等。vivo 还首发相册灵感修图，与联发科共同打造，就像和 AI 助手对话那样，一句话即可完成修图。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/999/452.htm", "publishedAt": "2026-09-07T12:16:29+00:00"}, {"title": "凯迪拉克 XT5 PHEV 上市：纯电续航 215km，权益价 25.99 万元起", "summary": "IT之家 9 月 7 日消息，凯迪拉克 XT5 PHEV 已上市，新车共推出 2 款车型，建议零售价 31-35 万元，全款一口价 27.99-29.99 万元，可享限时两周年购车权益，包括 1 万元两周年感恩购车补贴和至高 1 万元增换购补贴，限时权益价 25.99-27.99 万元。IT之家注意到，即日起至 10 月 7 日，用户下订全新 XT5 PHEV 还可享包括两周年购车权益在内的 8 万元限时购车礼包，涵盖 3 年金身保障、3 年辅助驾驶无忧等多重权益。外观造型上，XT5 PHEV 基本延续燃油版车型设计语言，配备盾型网状发光前格栅与发光车标，搭配分体式大灯组。车顶因激光雷达的布置而取消了鲨鱼鳍天线，前包围经过重新设计，集成全新主动式进气格栅。车身尺寸为 4888/1957/1688 毫米，轴距 2863 毫米。与燃油版相比，车身高度降低 6 毫米，其余参数保持不变。车侧采用传统门把手设计，搭配 21 英寸全新样式轮圈、265 毫米低滚阻轮胎及亮黑色车窗饰条。尾部设计弱化了后包围的存在感，采用更大面积的车身同色涂装，排气布局改为隐藏式设计，保留标志性的 7 字形尾灯。配色方面新增大峡谷橙哑光色与幻沙白色两种选择。内饰布局与燃油版保持一致，新增黄石晨曦与银幕流光两种内饰主题，配备呼吸氛围灯及车载香氛系统。座舱核心是一块 33 英寸 9K 曲面显示屏，匹配 AKG 录音棚级音响系统与电子防眩目内后视镜。车机搭载高通骁龙 8775P 芯片，并引入字节跳动豆包 AI 大模型。语音交互能力得到显著增强，系统支持自然语义理解 —— 例如说出“我冷了”即可自动调节空调；可执行复合指令，如“去机场，顺便提醒我买花”能够同步完成导航设置与日程提醒。四音区独立语音识别让前后排乘客均可独立唤醒并控制车辆功能。此外，新车继续支持 CarPlay 手机互联。前排新增 OMS 舱内感知摄像头，可辅助看护车内儿童。五路视角哨兵模式支持车辆周围实时监控，异常情况自动录像并支持手机远程查看。舒适性配置方面，座椅采用 Fine Nappa 半苯胺手工真皮材质，前排支持电动加热、通风、腰撑调节及位置记忆，后排配备座椅加热功能。得益于纯平地板设计与缩短 84 毫米的中央扶手，后排乘坐体验有所提升。便利性配置上，中控区域保留了实体物理按键与旋钮，方向盘采用全新功能按键布局。中央扶手区域经过重新设计，配备双 50 瓦无线快充、66 瓦有线快充以及车载冷暖箱 —— 后者可在 15 分钟内完成制冰，并具备银离子抑菌功能。新车搭载凯迪拉克全自研的超级插混系统，基于 5C 原生插混架构打造，采用 P1+P3+P4 三电机布局，匹配双挡 DHT 专用变速箱，并全系标配四驱系统。该架构可实现城市工况以纯电驱动为主、高速工况发动机直驱的智能能量管理策略。动力参数方面，这套 1.5T 插混系统的综合输出功率达到 385 千瓦，峰值扭矩 740 牛 · 米，百公里加速时间 4.8 秒，即使在亏电状态下也能实现 5.4 秒的破百成绩。续航表现上，CLTC 工况纯电续航里程为 215 公里，满油满电综合续航可达 1360 公里。日常通勤综合油耗低至 0.61 升 / 百公里，亏电油耗为 6.05 升 / 百公里。此外，新车支持 5C 超快充技术，电量从 30% 充至 80% 仅需 15 分钟，并具备 6 千瓦对外放电功能，燃油兼容性方面可适配 92 号及以上标号汽油。智能化是此次 XT5 PHEV 的核心升级点之一。新车全系配备激光雷达硬件，并搭载 Momenta R7 世界模型辅助驾驶系统，官方强调该系统“量产即交付”，无需等待后续 OTA 解锁。这套智驾系统的应用场景覆盖较为全面，不仅支持城市常规道路，还可应对非铺装路面、盘山公路乃至地图信息有限的乡间小路。具体功能上，系统可在拥堵路况下实现“云感跟车”，对施工占道、突然加塞等突发状况进行提前感知与避让。在极端窄路环境中，即使单侧仅剩 20 厘米空间，车辆仍能精准通过。值得一提的是，在无手机信号、无导航数据的偏远地区，系统仍可保持稳定巡航。泊车辅助方面，新车支持标准车位与机械车位的自主泊入。误入死胡同时，“循迹倒车”功能可支持最长 150 米原路返回。对于高频使用的固定车位，系统还具备记忆泊车能力。XT5 PHEV 继续搭载全路况电动蜂鸟底盘，并进行了针对性升级。其中，RTD 电子实时阻尼可调悬架进化至第二代预瞄式版本，可通过前置传感器提前 20 米识别减速带、井盖及坑洼路面，以每秒 500 次的频率扫描并实时调整阻尼，官方称可化解多达 60% 的颠簸冲击。制动系统采用与凯雷德同款的 Brembo 六活塞刹车卡钳，并新增舒适制动功能。四驱系统方面，前后双电机布局的响应速度达到传统机械四驱的四分之一，提升了雨雪湿滑及泥泞路况下的抓地表现。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/999/451.htm", "publishedAt": "2026-09-07T12:13:18+00:00"}, {"title": "选手可选福利：模力方舟旗舰模型为开源大赛提供专属折扣", "summary": "近日，两场开源软件大赛（“2026 上海开源软件应用创新大赛”与“2026北京开源行业解决方案创新赛”）正火热进行中，陆续有选手咨询模力方舟的模型调用成本能不能省一点。 即日起，模力方舟给参赛选手准备了一份可选福利，旗下旗舰模型按官方刊例价提供专属折扣，覆盖 DeepSeek V4 全系、Kimi K3 与 K2.6、GLM-5.2 与 5....", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502363", "publishedAt": "2026-09-07T11:38:09+00:00"}, {"title": "把千亿模型装进笔记本，Windows 终于要反击 Mac 了", "summary": "都想让 PC 成为 AI 的运行环境#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1678877?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-09-07T10:36:12+00:00"}, {"title": "OpenAI 智能体大规模入侵 Hugging Face 技术事件报告", "summary": "本文档是 OpenAI 于 2026 年 8 月 26 日发布的官方博文《Hugging Face 事件与未来之路》，文章复盘了 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
