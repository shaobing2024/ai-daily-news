thome.com/0/987/449.htm", "publishedAt": "2026-08-08T15:09:05+00:00"}, {"title": "全球最大 AI 算力超级单体：远景乌兰察布星河基地投产，百万卡并行、百万 P 算力", "summary": "IT之家 8 月 8 日消息，远景科技集团 8 月 6 日宣布在内蒙古乌兰察布建成 AI 算力超级单体，标志着“远景乌兰察布星河基地”正式投产。该基地是远景“戈壁使命（Mission Gobi）”计划落地的首个旗舰项目，园区总规划容量达 2GW。该超级单体采用超高比例绿电直连，建筑体量达 12 万平方米（约 20 个标准足球场）。基地具备百万卡并行能力与百万 P 算力规模，算力输出可达同等面积下传统数据中心的 10 倍。IT之家注：1P 算力代表每秒进行一千万亿次浮点运算，相当于约 50 万台主流笔记本电脑同时工作的算力水平。乌兰察布是国家“东数西算”八大节点之一，网络时延优势明显，且全域绿电占比高达 67%。基地充分利用当地风能优势，通过自建风场及专线实现绿电直供。远景科技集团 AIDC（人工智能算力中心）总经理郑子浩表示，星河基地主要面向头部科技与 AI 公司大规模使用国产算力的需求。他表示：“中国芯片正在走一条集群化突围的道路。远景超级单体可为这支‘集团军’提供最强保障：够大的部署基地、充足的电力粮草和畅通的能源补给线。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/987/435.htm", "publishedAt": "2026-08-08T13:05:45+00:00"}, {"title": "谷歌急了：AI核心员工全给我搬回硅谷坐班！", "summary": "再花15亿美元买现成AI编程团队", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/468398.html", "publishedAt": "2026-08-08T02:45:02+00:00"}, {"title": "Kimi K3也失控了…学霸AI逃离沙箱只为找答案", "summary": "啊，这真是个AI“失控”的夏天", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/468338.html", "publishedAt": "2026-08-08T02:35:38+00:00"}, {"title": "Gartner发布2026中国网络安全技术成熟度曲线，AI安全开始“挤泡沫”", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/zko5GmLUpmxdSwWbkfTI?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-07T22:07:05+00:00"}, {"title": "HBM 不够用了，AI SSD 迎来爆发前夜", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/sQW5F63ZP4QMyhlWAzQi?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-07T10:38:28+00:00"}, {"title": "AI 视频降本的三种做法，只有一种不牺牲画质", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/HqthsfSNK4bQYqOSh6Ni?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-07T10:29:29+00:00"}, {"title": "AI批量轰炸苹果bug赏金计划，审核团队已下线", "summary": "", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/466738.html", "publishedAt": "2026-08-07T06:21:05+00:00"}, {"title": "SpaceXAI 单季资本开支达 183 亿美元", "summary": "根据风险投资人Tomer Tunguz 博客（VC 分析）披露的最新分析与第二季度业绩报告，SpaceXAI在上个季度的总资本支出飙升至183.7亿美元。其中，绝大部分资金被直接用于 AI 领域，金额高达158.3亿美元，这一单项投入已经逼近微软同期总资本开支的四成。 与亚马逊、Alphabet、微软以及 Meta 等传统科技巨头相比，SpaceXAI的资...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/488955", "publishedAt": "2026-08-06T06:47:37+00:00"}, {"title": "Gemini 把逆风翻盘的希望，全押在这个人身上", "summary": "Gemini 新任掌门人，到底什么来头？#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1673901?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-08-06T02:26:41+00:00"}]}, {"label": "论文研究", "items": [{"title": "Cloudflare：AI 机器人流量已超越人类，预计五年后人机流量比达 1:1000 近乎“误差”", "summary": "IT之家 8 月 8 日消息，Cloudflare 在 2026 年第二季度财报电话会议上披露，AI 机器人等来源的非人类流量已于 2026 年 5 月正式超过人类流量，比 CEO 马修 · 普林斯（Matthew Prince）此前预测的 2027 年底大幅提前。Cloudflare 进一步预测，若当前趋势延续，五年后非人类流量将达到人类流量的 1000 倍。马修 · 普林斯表示，届时人类在互联网上的存在将变得微不足道。“换句话说，人类将成为互联网上四舍五入的误差，不是因为人类流量在下降，而是因为非人类流量的增长速度实在太快。”非人类流量的激增主要基于 AI 来源，特别是 AI 智能体（Agentic AI）的兴起。与传统网络爬虫不同，AI 智能体的行为高度模拟普通浏览，但以机器速度运行且规模巨大。普林斯举例说明：普通人在搜索相机时可能只会查五家零售商，而一个 AI 智能体可能查询 5000 个网站。数以百万计的用户要求助手比价、研究主题或汇总文章时，流量规模即呈指数级放大。普林斯在电话会上强调，部分非人类流量具有恶意属性。恶意流量可能来自黑客攻击者，也可能从特定客户商业模式角度被视为恶意 —— 例如 AI 公司试图抓取依赖广告收入的媒体公司内容。最新财报显示，Cloudflare 在 2026 年第二季度实现营收 6.96 亿美元（现汇率约合 47.05 亿元人民币），同比增长 36%，净亏损 2.057 亿美元（IT之家注：现汇率约合 13.9 亿元人民币），亏损同比扩大逾两倍。Cloudflare 计划资本支出约为营收的 14% 至 15%，约 4.3 亿美元（现汇率约合 29.07 亿元人民币）。普林斯以此对比超大规模云服务商：超大规模云商的 GPU 利用率“极低”，“他们做的只是卖一个盒子，利用率得靠客户自己最大化”。他称 Cloudflare 的业务模式是“让每美元资本支出发挥 10 倍效能”，通过服务器调度工作负载，不直接参与 GPU 服务器的租赁竞争。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/987/438.htm", "publishedAt": "2026-08-08T13:38:40+00:00"}, {"title": "华为乾崑 ADS 代客充电功能展望：让车自己去充电，机械臂自动插拔枪", "summary": "IT之家 8 月 8 日消息，华为今日放出了一段关于代客充电的“创意畅想”演示视频，展示了其可能会在未来某一天推出的代客充电服务（IT 之家注：仅展示未来自动驾驶技术可能的应用场景，不构成商业承诺）。如果车主临时有事无法守在充电站时，可通过手机 App 实现一键操作，让车辆在全程无人的情况下，也能自主完成补能。车主在华为乾崑 App 下达充电指令后，车辆依靠乾崑 ADS 智驾能力自主识别停车场路线，自行开到空闲充电车位。车辆停稳后充电口盖板自动打开，配套机械臂通过视觉定位精准对接充电枪。充电过程中系统实时向手机端同步电量与预估充满时间，并支持无感自动结算扣费。电量充满后机械臂自动拔枪归位，车辆可自主驶至车主指定位置等候。这一演示不仅展示了车辆自动化水平的提升，也预示着未来补能生态的新形态。该功能属于华为打造的“10 分钟乾崑智驾生态圈”组成部分。该规划于今年 4 月 23 日正式提出，旨在与相关生态伙伴一起面向未来，围绕停车缴费、自动充电、洗车养车等智慧化场景打造全场景服务闭环。据华为介绍，在华为乾崑生态合作伙伴所服务的停车场，可直接选择充电车位，领航辅助 NCA 一键直达，自主寻找空闲充电车位并泊入，让充电更省心。在停车缴费服务，在华为乾崑生态合作伙伴所服务的停车场，手机打开华为乾崑 App-ADS 板块，即可一键支付，无需扫码，即付即走。此外，华为用户只需一次授权，即可在华为乾崑生态合作伙伴的充电站使用，真正实现“插上就能充，充完就能走”。根据规划，2026 年第二季度停车缴费服务将支持 30 万个停车场，超 180 万根充电桩可接入地图，全国超 3000 家洗车店支持在线预约及人工代客洗车服务。华为乾崑智驾系统遵循快速迭代的路径。2026 年 4 月 23 日，华为乾崑智驾 ADS 5 正式发布，其底层架构升级为 WEWA 2.0 AI 智能体架构，并首发了面向自动驾驶的乾崑 OS 操作系统。截至 7 月 16 日，华为乾崑已与超 25 个品牌、超 50 款车型展开合作，车型覆盖轿车、SUV、MPV、越野车，动力类型涵盖纯电、混动和燃油，乾崑智驾总搭载量已突破 190 万台。相关阅读：《华为乾崑 7 月安全出行报告发布，累计辅助驾驶里程突破 134.1 亿公里》《华为乾崑 2026 上半年安全出行报告发布，辅助驾驶活跃用户数占比 97.5%》《华为乾崑智驾 ADS 5 OTA / 商用年度计划公布，首个版本本月推送》《一键超充不必动手：鸿蒙智行家庭智慧旗舰 SUV 问界 M8 纯电版支持机械臂自动充电》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/987/373.htm", "publishedAt": "2026-08-08T08:51:11+00:00"}, {"title": "许多顶级实验室的人现在几乎不读论文了", "summary": "「许多顶级实验室的人现在几乎不读论文了，而且他们认为 ICLR/ICML/NeurIPS 充斥着大量过度宣传和欺诈。」 OpenAI 研究员 Keller Jordan 这条推文引发了广泛讨论。他不是在说风凉话，他是说出了一个圈内人尽皆知但很少公开捅破的事实。 Jordan 随后补充了一句软化声明：「我不认为这些会议上大部分论文都在过度宣传或造假...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/490131", "publishedAt": "2026-08-07T11:26:18+00:00"}, {"title": "宇树科技 IPO 战略配售曝光：DeepSeek 获配 93.3 万股，锁定 36 个月", "summary": "8月6日晚间，“人形机器人第一股”宇树科技股份有限公司披露IPO发行价格及战略配售结果，杭州深度求索人工智能基础技术研究有限公司（DeepSeek）获配93.3399万股，按150.8元/股发行价格计算，认购金额约1.41亿元，股份锁定期为36个月。 公告显示，本次宇树科技战略配售对象主要包括长期投资机构、与公司业务具有战略合作...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/489801", "publishedAt": "2026-08-07T06:09:12+00:00"}, {"title": "Jeff Dean 离开 Google：一个时代的结束，一个实验室的开始", "summary": "Google 员工编号 20。MapReduce 作者之一。Bigtable 作者之一。TensorFlow 的作者之一。Gemini 的架构师。Google 首席科学家。 Jeff Dean 在 Google 工作了 27 年后，宣布离职。 他不是一个人走。一同离开的还有 Sanjay Ghemawat（Google 员工编号 23，Jeff Dean 二十多年的编程搭档，MapReduce 和 Bigtable 的共同作者）...", "sourceName": "开源中国", "sourceUrl" const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
