7-29T07:25:46+00:00"}, {"title": "谷歌解散 AlphaFold 团队以专注于 Gemini，前者曾获诺贝尔奖", "summary": "北京时间 7 月 29 日，据《金融时报》报道，谷歌旗下 AI 实验室 DeepMind 已解散其诺贝尔奖获奖 AI 系统 AlphaFold 背后的团队，该系统用于预测蛋白质结构。目前，该公司正在全面调整其科研战略，这一战略曾使其成为全球领先的 AI 实验室之一。DeepMind CEO 哈萨比斯和江珀获得诺贝尔化学奖根据《金融时报》对近期人事变动的分析及知情人士提供的消息，过去一年里，AlphaFold 论文的大多数原始作者都已被重新分配到其他团队。DeepMind 证实，这些员工已在内部转岗，参与围绕谷歌 Gemini 大语言模型构建的项目，以及酶设计、核聚变和基因组学等领域的工作。另有部分人员已调往 Alphabet 旗下药物发现公司 Isomorphic Labs。在 AlphaFold 原始论文的谷歌 DeepMind 全职作者中，近四分之一已彻底离开该公司。此次重组反映出，自大语言模型兴起以来，DeepMind 的科研战略发生了重大转变。“过去九年，我们的战略一直是聚焦于重大科学挑战，让每个项目都围绕一个明确的目标展开。如今这一战略已经发生了变化。”谷歌 DeepMind 研究副总裁普什米特 · 科利 (Pushmeet Kohli) 表示。他创立并领导着谷歌 DeepMind 的“AI 科学”(AI for Science) 团队。他表示，DeepMind 如今不再只是围绕蛋白质折叠等单一科学问题组织研究团队，而是将重点放在打造由 Gemini 驱动、能够协助科学家开展研究，并最终实现科学研究部分流程自动化的系统上。同时，DeepMind 也在与 OpenAI 和 Anthropic 竞争，开发最前沿的 AI 智能体。DeepMind 在 2018 年开始研发 AlphaFold，该系统利用 AI 预测蛋白质的三维结构，彻底改变了生物学研究。这一突破性成果使副总裁、工程研究员约翰 · 江珀 (John Jumper) 以及 DeepMind CEO 德米斯 · 哈萨比斯 (Demis Hassabis) 荣获 2024 年诺贝尔化学奖。今年早些时候，江珀和另一位 AlphaFold 研究员乔纳斯 · 阿德勒 (Jonas Adler) 转入了谷歌内部的“Code Strike”团队。该团队的成立是为了提升公司在 AI 编程方面的能力，以追赶 Anthropic 和 OpenAI。上个月，江珀宣布他将离职前往 Anthropic，阿德勒和 AlphaFold 同事亚历山大 · 普里策尔 (Alexander Pritzel) 也一同加入。一位要求匿名的 DeepMind 员工表示，这三人都是公司的“关键、重要、核心成员”，他们的离职在公司内部引发了震动。DeepMind 表示，研究人员的流动反映了其科学优先事项的不断演变。该公司表示：“我们为自身的科学传统以及 AlphaFold 的全球影响力感到无比自豪。AlphaFold 也启发了 Isomorphic Labs 的成立，其使命是重新构想药物发现。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/065.htm", "publishedAt": "2026-07-29T06:47:15+00:00"}, {"title": "消息称蚂蚁数科正筹备 Pre-IPO 轮融资，OceanBase 同步启动 A 轮拟募资 20 亿至 30 亿元", "summary": "IT之家 7 月 29 日消息，据《科创板日报》今日报道，蚂蚁集团旗下子公司蚂蚁数科正在筹备 Pre-IPO 轮融资。《科创板日报》昨日还报道称，蚂蚁旗下独立数据库公司 OceanBase 正在寻求 A 轮融资。今年 7 月 21 日，蚂蚁国际宣布完成约 12 亿美元（现汇率约合 81.34 亿元人民币） A 轮融资，蚂蚁集团、阿里巴巴及多家国际投资机构参与。上述三家子公司的独立融资，标志着蚂蚁集团围绕全球化、AI 和数据等方向孵化的新业务，正逐步建立更加独立的治理、激励和融资机制，并接受外部市场的检验。蚂蚁集团起步于 2004 年诞生的支付宝，而蚂蚁数科是蚂蚁集团旗下科技商业化的独立板块，自 2024 年 4 月起独立运营。其 CEO 赵闻飙曾透露，公司将于年内实现盈亏平衡。IDC 报告显示，蚂蚁数科位列中国智能体开发平台私有化市场非云厂商第一，在 2025 年中国金融大模型与智能体服务市场占有率第一。公开数据显示，蚂蚁数科已与 300 余家合作伙伴共同服务全球超过 30000 家企业客户。OceanBase 方面，据彭博社等多家媒体报道，公司正在与投资者洽谈 A 轮融资，目前已与多家头部投资机构接洽，目标融资规模约 20~30 亿元人民币。知情人士称，此次融资将帮助 OceanBase 进一步增强独立运营能力，并支持其向 AI 数据平台领域拓展。针对上述报道，OceanBase 回应称，公司全力投入 AI 时代的数据技术与产品创新，将持续与资本市场保持开放沟通。对于融资规模、投资机构及具体进展，OceanBase 未作进一步回应。知情人士称，2026 年 OceanBase 年化收入已超过 14 亿元，同比增长约 70%。公司目前拥有数千家客户，主要集中在中国市场，包括交通银行、中国移动等，同时已开始拓展东南亚、日本、印度和拉丁美洲市场。据彭博社报道，OceanBase 正在将 Databricks 等公司作为发展参照 ——Databricks 从数据分析和 AI 能力向数据库及企业应用延伸，OceanBase 则从分布式数据库和核心交易系统出发，向企业全量数据管理、Agent 数据供给和数据服务拓展。公开资料显示，OceanBase 诞生于 2010 年，最初用于满足蚂蚁集团内部数据库管理需求，长期支撑支付、金融等核心系统。根据 IDC 报告，2025 年上半年，OceanBase 以 2810 万美元（IT之家注：现汇率约合 1.9 亿元人民币）营收稳居中国分布式事务数据库本地部署市场第一。面向 AI 时代，OceanBase 正从分布式数据库向 AI 数据平台演进。今年 6 月，公司发布新一代湖库一体 AI 数据库，目前已在数十家客户场景中测试。2024 年，OceanBase 设立独立董事会，并建立了独立的员工股权激励机制。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/059.htm", "publishedAt": "2026-07-29T06:43:43+00:00"}, {"title": "苹果系统更新点名感谢 AI：Claude、Codex 揪出多项漏洞", "summary": "在最新发布的iOS、iPadOS、watchOS、tvOS、visionOS及macOS Tahoe系统更新中，官方修复了大量安全漏洞，而相当一部分修复成果归功于AI辅助安全研究——这是苹果首次在官方CVE漏洞归因列表中直接提及AI模型的名字。 根据苹果官方安全公告，Anthropic的Claude模型与OpenAI的Codex Security各自协助发现了 3 项漏洞，NVIDI...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/482125", "publishedAt": "2026-07-29T06:26:45+00:00"}, {"title": "小米澎程车型全系标配小米 HAD 辅助驾驶，N90 Max 还有后向固态激光雷达", "summary": "IT之家 7 月 29 日消息，今天（29 日）下午，小米澎程公布了旗下新车的智能化软硬件配置。IT之家从官方介绍获悉，小米澎程车型将搭载 16.1 英寸 3K 中控屏、8.88 英寸仪表屏、21.4 英寸后排娱乐屏，支持 20 英寸 HUD；副驾椅背可拓展 Pad，支持后排移动控制屏；配备第三代骁龙 8 移动平台，支持超级小爱、CarIoT 生态。两款新车全系标配超级小爱，不仅支持车内动态音区语音交互，还可实现车外小爱语音边走边说。智能辅助驾驶方面，新车全系标配小米 HAD、小米 XLA 认知大模型，号称满配辅助驾驶。硬件方面，其包括 700TOPS 英伟达 Thor 芯片、顶部激光雷达、4D 毫米波雷达、11 颗高清摄像头、12 颗超声波雷达，N90 Max 车型还搭载了后向固态激光雷达。小米汽车将于 7 月 30 日晚 7 点举办澎程系列技术发布会，这是小米汽车继 2023 年 12 月 28 日之后举办的第二次技术发布会。届时，IT之家将带来详细报道。澎程是小米汽车继 SU7/YU7 系列之后的第二个产品系列，定位为“智能可变大空间 SUV”，拥有两款车型。小米澎程 N90 Max｜大七座旗舰增程 SUV小米澎程 N70 Max｜大五座四驱增程 SUV", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/036.htm", "publishedAt": "2026-07-29T06:16:06+00:00"}, {"title": "首 ian 官方项目软件（例如 lintian）、Debian 网络资源、Debian 贡献者添加的文...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/480266/debian-gr-llm-usage", "publishedAt": "2026-07-27T03:37:08+00:00"}, {"title": "GPFS、Alluxio、JuiceFS 怎么选？一文看懂架构与适用场景", "summary": "这篇文章会先从 AI 工作负载的典型 I/O 模式出发，梳理不同业务对存储系统提出的实际挑战；随后围绕 GPFS、Alluxio 和 JuiceFS 展开比较，分析它们在架构设计、文件系统语义、缓存机制、成本模型和适用边界上的差异，以及它们在不同 AI 场景中的适用性。", "sourceName": "开源中国", "sourceUrl": "https://my.oschina.net/u/5389802/blog/19726712", "publishedAt": "2026-07-27T03:23:42+00:00"}, {"title": "DataBuff v0.1.5 发布 · 写入性能大幅提升", "summary": "DataBuff 是一款面向云原生与微服务场景的开源 AI Native OpenTelemetry APM，采用 OTLP 标准接入、Apache Doris 统一存储，Web 端提供拓扑 / Trace / 指标与多 Agent 排障。项目已在 OSCHINA 软件库收录：https://www.oschina.net/p/databuff 今天，DataBuff 正式发布 v0.1.5（2026-07-21）。相对 v0.1.4 共 25 个提交、...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/480213/databuff-0-1-5-released", "publishedAt": "2026-07-27T02:39:33+00:00"}, {"title": "对话腾讯副总裁林松涛：意图正在代替入口，Agent 需要一颗「小脑」", "summary": "大模型是「大脑」，Marvis 想补上「小脑」#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1673039?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-07-24T07:43:20+00:00"}]}, {"label": "产品发布/更新", "items": [{"title": "华为全新小艺任务登场：4 大类 2300+ 项技能，鸿蒙电脑 9 月 OTA 升级支持", "summary": "IT之家 7 月 29 日消息，在今天的华为鸿蒙电脑新品技术沟通会上，华为终端云服务小艺业务部总裁贾永利分享了鸿蒙自主决策 Agent PC 新体验，并带来了全新小艺任务。据介绍，华为全新小艺任务将实现“从能说到能干”的转变，支持多智能体协同架构，拥有 4 大类 2300+ 项技能，可自主规划按需组合。另外，小艺任务将支持定制邮件、浏览器控制等功能，可提供分析任务、生成表格、本地搜索、汇总确认、桌面文件解析、信息获取等能力。同时，端侧运行 WebAgent 任务成功率持平人类水平。IT之家从华为鸿蒙电脑新品技术沟通会现场了解到，鸿蒙电脑将在 9 月通过 OTA 支持全新小艺任务。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/113.htm", "publishedAt": "2026-07-29T07:48:20+00:00"}, {"title": "AI 重塑亚洲航空货运格局，取代跨境电商成为增长新引擎", "summary": "IT之家 7 月 29 日消息，据路透社报道，全球人工智能（AI）竞赛正在重塑亚洲航空货运格局。随着跨境电商增长放缓，航空公司开始围绕不断壮大的半导体制造中心重新规划航线网络。航空公司和物流企业表示，与疫情后包裹运输热潮不同，AI 基础设施带来的货运需求建立在先进存储芯片、处理器未来数年的订单，以及全球数千亿美元数据中心投资计划之上，因此需求更加稳定、持续。与此同时，美国和欧洲收紧低价值商品进口政策，正在抑制此前推动航空货运快速增长的跨境电商业务。货运数据分析公司 Xeneta 首席航空货运官尼尔 · 范德沃（Niall van de Wouw）在本月发布年中展望报告时表示：“电商曾是航空货运最大的增长引擎，但如今情况已经发生了变化。”大韩航空就是这一转变最典型的例子之一。今年第二季度，大韩航空货运收入同比增长 46%，达到 1.54 万亿韩元（IT之家注：现汇率约合 71.1 亿元人民币）。公司表示，AI 芯片、服务器机架以及数据中心基础设施运输已取代来自中国的跨境电商货物，成为货运业务增长的主要动力。大韩航空货运业务负责人、执行副总裁严在东（Jaedong Eum）表示，高端科技货物运输已迅速成长为公司的核心增长引擎。他指出，目前市场需求具有很高的可预测性，先进高带宽存储器（HBM）芯片和处理器的订单已经排到未来两到三年，且需求仍然持续超过供应。根据 Xeneta 数据，今年 4 月，全球半导体销售额同比增长超过一倍，创下自 1986 年有记录以来的最大增幅。相比之下，中国低价值商品和跨境电商出口在 5 月同比下降 7%，已连续第六个月下滑。美国去年取消了来自中国低价值进口商品的免税政策，欧盟本月也正式废除了类似的免税门槛。快时尚零售商 Shein 周日表示，这些政策变化已经影响了其美国业务，并预计未来还将对欧洲市场带来进一步压力。日本全日空（ANA）也表示，欧盟的新政策将成为整个航空货运市场的风险因素，不过半导体相关货运需求依然保持强劲。货物结构的变化也正在重塑亚洲贸易运输路线。日本负责出口半导体制造设备，韩国生产先进存储芯片，中国台湾地区则是全球先进芯片制造中心。与此同时，越南、马来西亚、泰国和新加坡正迅速成长为面向北美和欧洲市场的 AI 服务器制造和组装基地。新加坡樟宜机场集团航空枢纽与货运发展执行副总裁林清杰（Lim Ching Kiat）表示，在全球半导体需求强劲带动下，今年上半年樟宜机场货运吞吐量同比增长 8.7%。各家航空公司也开始围绕这些新的货物流向调整布局。日本航空表示，过去一年，除中国大陆以外亚洲地区航空出口增长中，约 80% 来自科技产品，凸显半导体和 AI 硬件正在重塑区域航空货运格局。公司已经增加了连接台北、曼谷、河内等半导体产业中心与东京成田机场的全货机航班。全日空则表示，随着整合日本货运航空（Nippon Cargo Airlines），公司将把更多大型货机投入跨太平洋及欧洲航线，同时利用亚洲航线网络，将区域各半导体制造中心的货物集中运往全球市场。在中国台湾地区，中华航空新增了飞往东南亚的货运航班，以满足制造商分散生产布局后的运输需求，并表示 AI 相关货运推动其上半年货运量同比增长 8.1%。长荣航空则表示，AI 相关货物目前已贡献公司最高约一半的货运收入。航空公司指出，AI 硬件与传统航空货物不同，运输对象通常包括精密且高价值的半导体制造设备、图形处理器（GPU）以及完整服务器机架，因此对运输条件要求更高。国际航空运输协会（IATA）预计，2025 年 AI 相关货物将占全球航空运输货物价值的 53.5%，但重量仅占全部航空货运量的 7%。与大量跨境电商货物相比，AI 硬件体积小、价值高，而且通常需要快速交付，以保证数据中心项目按计划建设，因此更适合采用成本较高的航空运输。为了适应市场变化，国泰航空表示，公司已经引入新软件，可自动判断半导体设备和 AI 硬件在飞机货舱内的最佳装载和固定方式。AI 货运热潮也正在考验航空货运基础设施。物流企业 Dimerco Express Group 表示，今年 7 月，AI 和半导体货物已经让台北航空货运枢纽接近满负荷运转，导致飞往美国及亚洲地区的货运舱位持续紧张。大韩航空的严在东表示：“随着全球大型科技公司陆续推出下一代 AI 处理器，并持续推进长期基础设施投资，我们预计 2026 年下半年航空货运需求仍将保持强劲。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/091.htm", "publishedAt": "2026-07-29T06:59:30+00:00"}, {"title": "Bigme 大我推出 F13 彩墨屏 AI 数码相框：待机时间最长可达 1.5 年，预购特价 239 美元", "summary": "IT之家 7 月 29 日消息，Bigme 大我今日宣布，Bigme F13 彩墨屏 AI 数码相框已正式在 Bigme 官网（bigme.vip）开启预购，预购特价 239 美元（IT之家注：现汇率约合 1620 元人民币），国内平台也即将开启预购。据介绍，Bigme F13 搭载 1 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
