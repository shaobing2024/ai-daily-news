const DATA = {"date": "2026-10-27", "generatedAt": "2026-10-27T01:47:32Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "菲尔兹奖得主邓煜评论 AI 公司反蒸馏：你不能只在你蒸馏全人类知识时支持蒸馏", "summary": "IT之家 10 月 27 日消息，据潮新闻 10 月 26 日报道，菲尔兹奖得主、芝加哥大学数学系教授邓煜在上周末的“知识分子”“赛先生”论坛上发表主旨演讲，系统阐述了他对 AI 时代数学研究的思考。邓煜表示，AI 相对于人的优势，一方面是 AI 具有无限知识面，另一方面是 AI 具有极低的尝试成本 / 试错成本。但我们要坚持一点，在数学研究中也好，在任何事情中也好，人总是作为主体；AI 是作为一个工具，是我们人利用来进行研究的工具。邓煜认为，如果把 AI 作为研究者，就应遵守学术规范。如果 AI 证明了一个非常重大的问题，一个非常合理的要求，是公布 AI 的思维链。然而 AI 公司拒绝公布，很明显是不符合学术界的惯例的。“这家 AI 公司并不愿意这样做。在他们公布的所有证明中，只有极少数真正公布了思维链，大多数情况下，他们都以所谓的防蒸馏为借口，拒绝公布思维链及相关的信息。”邓煜表示，对 AI 公司来讲，你不能在只有你蒸馏全人类的网络文献、全人类的知识的时候，就大大方方地去蒸馏；事实上没有人想要蒸馏你，大家只是想要了解一下思维链，然后你觉得别人想要蒸馏你，就开始说这个不行，那个不行。邓煜提议，可以通过开源数学模型，保证数学界有属于自己的模型掌握在自己手里，不需要去依赖于这样一些 AI 公司。其次，模型的使用也遵循学术界规范，包括数据使用、思维链的公布、可追溯性等。IT之家注意到，当地时间 9 月 11 日，陶哲轩、邓煜、彼得 · 舒尔茨（Peter Scholze）等 25 位菲尔兹奖得主作为最初签署人，联合发表声明《人工智能在数学中的严重错位》（A Severe Misalignment of AI in Mathematics），警告 AI 公司与数学共同体之间正在出现“严重错位”。声明称，在过去几个月里，大语言模型的数学能力有了显著提升，能够解决许多数学领域的重大悬而未决问题。然而，AI 公司将数学问题作为基准解决的推动，对数学科学和数学界都是有害的。AI 公司的目标与数学界的目标严重错位，这些是影响其他科学和创意职业乃至整个社会的更广泛对齐问题的一部分。声明提到，这些 AI 解决方案往往仓促发布，没有时间进行正式的写作，也没有时间去隔离新方法和新想法，或引用他人的相关工作。和所有创意职业一样，这引发了严重的署名和抄袭问题。此外，没有愿意负责其发展和融入数学经典的数学家，AI 构思的想法永远无法完全实现，数学家之间关键的人类传递链也将丧失。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/230.htm", "publishedAt": "2026-10-27T01:11:15+00:00"}, {"title": "苹果 Siri AI 即日起支持法语、日语、韩语等语言，繁体中文得等到年底前", "summary": "IT之家 10 月 27 日消息，苹果今天（27 日）通过新闻稿宣布，今天发布的 27.2 版本软件更新，进一步扩大新一代 Siri AI 的使用范围，新增支持法语、日语、韩语、葡萄牙语和西班牙语。Siri AI 是全面升级的 Siri，不仅功能更强大，对话也更加自然，还能提供更个性化的服务。根据介绍，其基于 Apple 智能打造，在保护用户隐私的同时，大幅提升了 Siri 的能力。新版本能够理解用户的个人情况，从信息、邮件、照片等内容中查找所需资料，还可以执行更多系统级应用操作。借助屏幕感知能力，Siri AI 可以理解屏幕上显示的内容，回答用户的问题或完成相应操作。此外，Siri AI 还能利用广泛的知识获取“几乎任何话题”的最新信息。新闻稿提到，苹果计划继续增加 Siri AI 支持的语言，繁体中文、挪威语、土耳其语和越南语将在年底前加入。目前，Siri AI 测试版支持 iOS 27.2、iPadOS 27.2、macOS 27.2、watchOS 27.2 和 visionOS 27.2。IT之家提醒：用户需要使用兼容 Apple 智能的设备，并将设备语言设为 Siri AI 支持的英语、法语、日语、韩语、葡萄牙语或西班牙语。部分功能可能存在地区或语言限制。此外，部分需要调用服务器端模型的 Apple 智能功能设有每日使用限额，包括不限于 Siri AI、智能照片编辑工具、图乐园，以及快捷指令中的 AFM 3 Cloud 模型，具体限额或因功能类型、请求复杂程度、系统负载、系统政策等因素而异。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/229.htm", "publishedAt": "2026-10-27T01:04:05+00:00"}, {"title": "Mac 版 Ollama 新增离线生成 AI 语音：数据不出门，速度比原方案最高快 35%", "summary": "IT之家 10 月 27 日消息，本地运行 AI 模型的开源平台 Ollama 于 10 月 24 日宣布，其 Mac 应用正式支持文本转语音（TTS）生成，Windows 和 Linux 版本也将随后跟进。科技媒体 9to5Mac 认为这是 Ollama 首次加入语音生成能力，让本地 AI 从“能读会写”进一步迈向“能开口说话”。首个支持的语音模型是 Gradium 开发的 Phonon 系列。该模型体积较小、技术指标先进，用户无需依赖云端服务，可通过 Ollama 直接下载并在 Apple Silicon Mac 上运行，更适合注重隐私、需要离线使用的场景。在 macOS 上，Ollama 采用苹果开源机器学习框架 MLX，充分利用 Apple Silicon 的统一内存架构来提升运行效率。官方测试显示，在搭载 M5 Max 芯片的 MacBook Pro 上，Phonon 在保持了与 Hugging Face Transformers 参考实现相当的词错误率前提下，语音生成速度比 Gradium 自身实现快 35%。新功能还支持实时语音生成，用户不必等待 AI 完整输出文本，可以在回答生成过程中同步听到语音，交互体验更接近自然对话。IT之家援引博文介绍，Phonon 目前提供英语、法语、德语、西班牙语和葡萄牙语五种语言的独立模型，并配有支持全部五种语言的多语言模型；用户还可选择美式英语或英式英语等不同口音的音色。Ollama 是 GitHub 上广受欢迎的 AI 开源项目之一，拥有近 18.5 万颗 Star 和约 1.86 万个 Fork 分叉，用户可以在本地下载、运行开放 AI 模型，也可按需接入云端更强大的模型。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/228.htm", "publishedAt": "2026-10-27T01:00:25+00:00"}, {"title": "苹果 iOS 27.2 修复 163 个安全漏洞，封堵大部分 iOS 27 完美越狱漏洞", "summary": "IT之家 10 月 27 日消息，苹果今天（10 月 27 日）发布 iOS 27.2 与 iPadOS 27.2 系统更新，一次性修复 163 个安全漏洞（检索 CVE 关键词，显示共有 163 个可追踪漏洞编号），涉及 Apple Intelligence、邮件隐私、浏览器内核及系统底层等关键领域。苹果建议用户尽快完成升级。IT之家援引博文介绍，本次更新最受关注的修复，可能是允许远程攻击者访问敏感数据的 Apple Intelligence 漏洞，以及一个可能导致用户真实邮箱地址泄露的“隐藏邮件地址”功能缺陷。此外，苹果还修复了超过 30 项 WebKit 漏洞和约 15 个内核漏洞，进一步降低网页攻击与系统级入侵风险。值得注意的是，安全研究团队 Calif 获得 6 个 CVE 编号的漏洞披露署名。该团队曾在 iPhone Duo 发布当天完成越狱，并演示了针对 iOS 27.0.1 的“完美越狱”；其研究人员表示，越狱所利用的大部分漏洞已在 iOS 27.2 中被封堵。苹果表示，目前没有证据显示这些漏洞已被实际恶意利用，但由于漏洞细节已经公开，未及时更新的设备仍可能面临攻击风险。随着 AI 模型在漏洞挖掘中的作用增强，iOS 安全更新数量持续增长。本次更新中，Anthropic Research 获得 3 项修复署名，另有 4 项引用了 OpenAI。对于尚未升级至 iOS 27 的旧设备，苹果同步发布 iOS 26.7.2，其中包含多项相同安全修复。用户可在“设置 — 通用 — 软件更新”中检查并安装。相关阅读：《运行 iOS 27.0.1 的苹果 iPhone 18 Pro 被“完美越狱”：重启后仍可维持最高权限》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/221.htm", "publishedAt": "2026-10-27T00:32:57+00:00"}, {"title": "微软 CEO 纳德拉：以前我认为 AI 越强大也会越安全，现在不信了", "summary": "IT之家 10 月 27 日消息，据《商业内幕》今天（27 日）早间报道，微软 CEO 萨提亚 · 纳德拉改变了对 AI“对齐”问题的看法。他过去认为，AI 系统越强大，就越容易让其行为符合人类的价值观和目标，但现在，自己不再相信两者会自然而然地同步发展。在新一期《20VC》播客中，主持人哈里 · 斯特宾斯问纳德拉，过去一年里有什么想法发生了改变。纳德拉解释，他原本认为，随着 AI 能力不断提高，确保 AI 行为符合人类价值观和目标的“对齐”问题也会迎刃而解。模型规模扩大带来的效果符合纳德拉的预期，AI 能力持续提升，但对齐问题依然没有得到解决。“我过去总以为，对齐问题自然就会解决。我不再这么认为了。我觉得，对齐可能是一个更棘手、性质也不同的问题。”纳德拉曾于 10 月 10 日在 X 发文警告 AI 的风险，主张加强外部安全管控。他认为，企业应将 AI 模型视为内部安全威胁，采取防护措施时应假定模型遭到入侵。纳德拉在帖子中写道：“我们需要通过可靠、具有确定性的系统设计、人工管控和完善的操作规程，为行为难以完全预测的 AI 模型建立防护机制。对于现有标准不足的领域，还需要制定行业标准。”据IT之家了解，纳德拉并非唯一认为 AI 能力提升不能自动确保人类掌控 AI 的科技行业高管。OpenAI CEO 萨姆 · 奥尔特曼和 Anthropic CEO 达里奥 · 阿莫代伊都曾就 AI 的潜在威胁发出警告。今年 7 月，1000 多名 AI 从业者联署的一封信也警告，AI 能力的发展速度可能超过人类理解或控制它的能力。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/219.htm", "publishedAt": "2026-10-27T00:23:35+00:00"}, {"title": "OpenAI 宣布斩获三项重大科学突破，涉及数学猜想、计算机算法及千禧年难题", "summary": "IT之家 10 月 27 日消息，OpenAI 宣布，其 AI 模型在数学、计算机科学和物理学领域取得三项重大突破，展现出 AI 独立发现并证明复杂科学理论的能力，而不只是回答问题或辅助研究。在数学领域，AI 证明了适用于所有维度的局部光滑猜想，并由此解决局部光滑猜想与挂谷猜想。在计算机科学领域，AI 推翻了长期被广泛接受的指数时间假设，意味着未来可能找到速度更快的算法。在物理学领域，AI 提出量子色动力学及杨–米尔斯理论的严格数学存在性证明，涉及世界七大千禧年数学难题之一。OpenAI 表示，数学和计算机科学成果已通过 Lean 数学验证工具进行形式化验证，并公开证明材料；物理学成果正由诺贝尔物理学奖得主等专家参与审查。相关成果仍需学术界进一步独立确认。IT之家附上 OpenAI 官方的声明大意如下：局部光滑猜想与挂谷猜想数学方面的新成果来自调和分析领域。1991 年，数学家克里斯托弗 · 索格提出局部光滑猜想，试图解释波在聚焦时的行为。按照该猜想，波即使出现极其强烈的聚焦，也只能持续很短的时间。如果随机选取一个具有代表性的时刻，观察到的聚焦程度总会远低于最极端的情况。数学中经常出现类似现象：某种现象在最坏情况下可以达到非常极端的程度，但经过平均处理后，实际观察到的情况要温和得多。局部光滑猜想描述的现象具有基础性意义，因此涉及数学分析的众多问题。其中，挂谷猜想和斯坦因限制猜想都可以由局部光滑猜想推导出来。2019 年，古思、王虹和张睿翔证明了二维空间中的局部光滑猜想。2025 年，王虹与扎尔又证明了三维挂谷猜想。OpenAI 的模型此次给出了局部光滑猜想在所有维度下的证明，从而也解决了所有维度下的挂谷猜想和斯坦因限制猜想。证明的关键是一种新构建的辅助偏微分方程。OpenAI 于 2026 年 10 月 18 日获得 AI 生成的证明，并在第二天完成 Lean 形式化证明。随后，OpenAI 联系外部专家，讨论如何围绕该成果建立合作机制。根据专家建议，OpenAI 决定直接公开 AI 生成的证明，采用与 10 月 6 日发布研究成果时相同的方式。目前，模型撰写的自然语言证明和 Lean 形式化证明均已上传至公开的 GitHub 代码仓库。指数时间假设被推翻计算机科学方面的发现涉及指数时间假设（ETH）。ETH 是计算复杂性理论中一个存在已久的猜想，研究布尔公式可满足性问题的计算难度，与著名的 P 和 NP 问题密切相关。长期以来，学术界普遍认为 ETH 成立。数百篇研究论文以该假设为前提，推导出图论、计算生物学、数据库和计算几何等领域的计算难度结论。近期，OpenAI 的系统却给出了 ETH 不成立的证明，并通过 Lean 完成了形式化验证。ETH 被推翻后，研究人员需要重新审视许多计算任务究竟还能获得多大幅度的速度提升。新成果也有助于指导更高效算法的研究。不过，要找到能够实现这些提升的算法，并将理论成果转化为实际应用，仍需要大量后续研究。OpenAI 邀请三位算法设计和计算复杂性理论专家牵头，负责验证、研究和解释这项成果，分别是加利福尼亚大学圣迭戈分校的拉塞尔 · 因帕利亚佐和拉马莫汉 · 帕图里，以及麻省理工学院的瑞安 · 威廉姆斯。三位专家在该领域都有长期研究积累：因帕利亚佐和帕图里与弗朗西斯 · 赞恩共同提出了 ETH，并在过去 30 年间围绕该假设发表了多篇具有影响力的论文。威廉姆斯曾证明 ETH 某些强化版本不成立，也曾以 ETH 为基础推导计算难度结论，并在算法与计算复杂性下界之间建立联系。OpenAI 接受了合作团队提出的两项要求：首先，公开研究成果的所有原始数据，方便其他研究人员独立验证；其次，由 OpenAI 提供资金，举办一场学术会议，讨论新成果对计算机科学领域的整体影响。合作团队还邀请学术界共同组织对 ETH 证明的公开审查，并就 AI 研究突破引发的问题展开讨论，包括如何验证成果、如何开放研究资料、如何认定学术贡献，以及未来应如何开展科研工作。OpenAI 于 10 月 16 日生成了推翻 ETH 的自然语言证明，10 月 17 日又完成了 Lean 形式化证明。随后，OpenAI 开始着手建立前述外部合作机制。模型生成的自然语言证明和 Lean 证明现已在 OpenAI 的公开 GitHub 代码仓库发布。量子色动力学的存在性与标准模型的统一完备化物理学方面，OpenAI 提出了一项关于量子场论存在性的研究成果。该成果从严格的数学意义上，证明了四维空间中某些包含规范场和费米子的相互作用量子场论确实存在，其中包括量子色动力学（QCD），以及粒子物理学标准模型的一种统一完备化理论。证明采用了构造性量子场论中巴拉班提出的研究方法。此外，研究还解决了一个子问题，即证明纯杨-米尔斯理论的存在性。该问题属于克雷数学研究所设立的量子杨-米尔斯理论千禧年大奖难题的一部分。粒子物理学标准模型描述了亚原子基本粒子之间的相互作用，涵盖自然界四种基本相互作用中的三种，不包括引力。由于标准模型本身无法直接推广至任意短的距离尺度，OpenAI 的存在性证明针对的是包含标准模型规范场和费米子的最简单大统一理论。量子色动力学研究夸克、胶子等粒子如何通过强相互作用发生联系。纯杨-米尔斯理论研究的范围更窄，只涉及传递强相互作用的胶子之间的自相互作用，不包括夸克等物质粒子。OpenAI 邀请大卫 · 格罗斯牵头研究，团队其他成员包括迈克尔 · 道格拉斯、阿瑟 · 贾菲、伊戈尔 · 克莱巴诺夫和尼基塔 · 涅克拉索夫。五位学者在量子场论及数学物理领域均有重要贡献：大卫 · 格罗斯： 1973 年，他参与的杨-米尔斯理论渐近自由研究，为量子色动力学成为公认的强相互作用理论奠定了基础，并使他获得 2004 年诺贝尔物理学奖。渐近自由也是严格证明这些理论在数学上存在的关键机制。阿瑟 · 贾菲：他与威滕共同制定了量子杨-米尔斯理论千禧年大奖难题，也是千禧年大奖难题设立构想的提出者之一，并参与创办克雷数学研究所。迈克尔 · 道格拉斯：过去 20 年，他一直参与推动该问题的研究，曾于 2004 年报告研究进展，并在今年年初全面梳理了最新成果。伊戈尔 · 克莱巴诺夫：他较早将规范场与弦理论的对偶性用于研究禁闭现象，这是量子色动力学的重要性质。他目前负责西蒙斯基金会的禁闭与量子色动力学弦合作研究项目。尼基塔 · 涅克拉索夫：他在杨-米尔斯理论推广形式的精确求解方法方面取得了开创性成果，并于 2023 年获得丹尼 · 海涅曼数学物理奖。参考官方公告：Working with academic communities to build scientific understanding", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/203.htm", "publishedAt": "2026-10-26T23:37:17+00:00"}, {"title": "Anthropic 招股书披露：曾因安全顾虑暂停旗舰 AI 模型训练一个多月", "summary": "IT之家 10 月 27 日消息，Anthropic 在当地时间周一公布的 IPO 招股文件中披露，出于安全方面的顾虑，该公司曾暂停下一代旗舰 AI 模型的训练长达一个多月；另外还有四个 AI 智能体在测试期间突破限制，接入了真实的外部计算机系统。IT之家注意到，这家 Claude 开发企业在文件的风险提示章节中表示，其推迟了一款全新前沿基础模型的预训练工作，目的是强化防护机制，防止模型权重与知识产权被盗。这份披露内容展现出，研发能力越来越强的 AI 模型会伴随各类安全难题，部分从业者已经发出警示，这类技术未来有可能脱离人类管控。竞争对手 OpenAI 今年早些时候也曾因为安全问题暂停部分训练工作，当时其模型出现了入侵 Hugging Face 平台的情况。这些事件说明，突发的安全事故有可能打乱核心模型的开发与上线节奏，而这些模型正是 Anthropic 冲刺备受期待的上市进程、实现业务增长的关键。Anthropic 警示，训练暂停会造成营收延后，使公司落后于竞争对手。这份文件用大约 94 页篇幅罗列了风险因素。沙箱逃逸招股文件还披露了此前未对外公开的安全评估事故：四个 AI 模型脱离测试沙箱环境，访问到现实中的计算机系统，相关会话持续时长在 10 小时至 34 小时之间。Anthropic 称，在和第三方合作方开展网络安全测试时出现操作失误。按照要求测试环境应当关闭联网权限，但最终环境仍保持着互联网连接。其中一起事故里，该模型的早期版本持续尝试一项无法完成的评估任务，期间找到一条保存的密码，并利用密码获取了第三方系统的管理员权限。随后它拿到更多凭证、修改系统设置，还访问到个人数据。文件没有写明涉事外部合作方的身份。Anthropic 表示已经通知所有受影响的相关方，没有发现模型刻意躲避人类监管、或是多个模型互相协同行动的证据。事后公司叫停了部分上线前网络安全评估项目，并暂停风险等级更高的强化学习测试环境。另外，该公司在当地时间上周日称，Claude 曾绕过付费墙，在没有获得人工授权的情况下调取了美国佐治亚州公开的汇总选票数据。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/201.htm", "publishedAt": "2026-10-26T23:28:31+00:00"}, {"title": "OpenAI 低成本新模型 GPT-6.1 Terra 深夜炸场：每项任务成本仅 Claude Opus 5.5 九分之一，更快更准确", "summary": "IT之家 10 月 27 日消息，OpenAI 今天（27 日）凌晨宣布推出新模型 GPT-6.1 Terra，主打以更低成本完成复杂的电脑操作任务，尤其擅长需要视觉推理和操作桌面软件的工作。与 GPT-5.6 Terra 相比，新模型在事实准确性和编程能力方面也有大幅提升。Terra 主要面向希望降低自动化成本的企业，可用于处理发票、解读技术图纸等工作。OpenAI 称，面对难度较高的专业任务，Terra 也能以远低于高价模型的成本完成。在考察复杂专业工作的 Agents’ Last Exam 基准测试中，Terra 的成绩明显提高。测试项目包括根据建筑图纸建立三维模型，以及逐一记录电影镜头，供影片修复团队使用。采用中等推理强度时，Terra 的得分比 GPT-5.6 Terra 高 15 个百分点，完成任务的成本却只有后者的约三分之一。与 GPT-6 Astra 相比，Terra 的测试成绩不相上下，每个 Token 的价格却仅为后者的约十分之一。Terra 在速度上同样具有优势。OpenAI 称，其任务执行速度是 GPT-6 Astra 和 GPT-6.1 Sol 的 3 倍以上。在最高推理强度下，每项任务的成本也仅为 Claude Opus 5.5 的约九分之一。桌面软件自动化是 Terra 取得进步的另一个领域。OSWorld 2.1 通过多步骤操作任务，测试模型使用桌面应用程序的能力。在中等推理强度下，Terra 不仅超过了 GPT-5.6 Terra 此前的最佳成绩，完成每项任务的成本也明显更低。在视觉推理基准测试 MMMU-Pro 中，Terra 在所有推理强度下的成绩均超过 GPT-5.6 Terra。尽管成本更低，其表现仍接近 GPT-6 Astra 和 GPT-6.1 Sol。OpenAI 还着重减少模型的事实性错误，以降低错误回答对自动化流程的影响。该公司通过一套内部基准测试，利用专门设计的提示词检验模型回答中的薄弱环节。结果显示，在低推理强度下，Terra 的错误率为 16.7%，远低于 GPT-5.6 Terra 的 53.6%，下降 36.9 个百分点。将推理强度提高至最高档后，Terra 的错误率进一步降至 4.3%，比上一代低 18 个百分点，接近 GPT-6 Astra 和 GPT-6.1 Sol 的水平。编程能力也有显著进步。Terminal-Bench 4.0 通过命令行任务测试 AI 编程智能体解决问题的能力，例如修复网页加载时发生的布局偏移。在最高推理强度下，Terra 成功完成了 50.3% 的测试任务，而 GPT-5.6 Terra 的成功率仅为 21.5%，新模型的成功率达到前代的两倍以上。对于难度最高的编程任务，OpenAI 仍建议选择 GPT-6.1 Sol 或 GPT-6 Astra。GPT-6.1 Terra 于 10 月 27 日向 Plus、Pro、Enterprise 和 Edu 用户开放，可在 ChatGPT Work 和 Codex 中使用。开发者也能通过 OpenAI API 调用，模型标识为 gpt-6.1-terra。API 标准定价方面，每 100 万个输入 Token 收费 1 美元（IT之家注：现汇率约合 6.7 元人民币），每 100 万个缓存输入 Token 收费 0.05 美元（现汇率约合 0.33 元人民币），每 100 万个输出 Token 收费 5 美元（现汇率约合 33.4 元人民币）。OpenAI 称，新模型的价格比 GPT-5.6 Terra 和 GPT-6.1 Sol 低 50%。安全方面，Terra 沿用了 GPT-6 Astra 的防护措施。OpenAI 称，新模型抵御提示词注入攻击的能力有所增强，也能更清楚地向用户说明自身局限。按照 OpenAI 的准备框架评估，Terra 的网络安全能力已达到“关键级”门槛。更低的价格有望让开发者和企业更容易采用复杂的电脑自动化技术。对于难度最高的编程任务，GPT-6.1 Sol 和 GPT-6 Astra 仍具有更强的处理能力。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/200.htm", "publishedAt": "2026-10-26T23:26:19+00:00"}, {"title": "Anthropic 招股书披露生态打法：打造高粘性企业客户体系", "summary": "IT之家 10 月 27 日消息，Anthropic 正在打造一套跨产品生态，正是这类生态让亚马逊、优步等科技企业拥有极强的用户粘性，其 S-1 招股文件显示这套策略已经初见成效。目前，年消费至少十万美元的客户里，超过一半会同时使用 Claude 平台以及 Claude Code、Cowork 这类第一方应用；去年年底这一比例大约只有三成。这份当地时间周一提交给美国证券交易委员会的 S-1 文件写道：“企业客户的采纳速度与深度，有力证明 Claude 处在人工智能领域的前沿位置。”截至 9 月 30 日，Anthropic 有超过 11900 家客户年消费不低于 10 万美元（IT之家注：现汇率约合 66.8 万元人民币）；超过 1900 家客户年消费达到 100 万美元（现汇率约合 668.4 万元人民币）以上；大约 250 家客户每年消费 1,000 万美元（现汇率约合 6,677.4 万元人民币）及以上。Anthropic 将客户付费规模持续增长归因于“客户在企业内部大范围部署 Claude，价值得到认可，使用量显著提升”，这推动公司在第三季度末实现约 900% 的净收入留存率。Anthropic 对传统 SaaS 行业含蓄地提出质疑，其把 Claude 定位成并非“服务单一场景的静态产品”，而是“能力快速迭代的前沿 AI 体系”，覆盖模型层、开发者平台，还有用户直接使用的各类应用。文件中写道：“任意一层取得的技术进展，都会在三层架构里形成叠加效应，加快我们推出更强智能能力的节奏。”公司称，正是这套一体化方案，让越来越多客户同时选用 Claude 平台和第一方应用。这套打法并不陌生。优步最初只做打车服务，后来拓展到外卖和货运业务；亚马逊依靠 AWS 云服务吸引客户，再顺着客户关系延伸到存储、数据库等其他产品，一步步把生态打造得让客户难以离开。和这些公司一样，Anthropic 不必为每一款产品寻找全新买家：一家企业从调用 API 起步，可以接着给工程师部署 Claude Code，再面向全体员工推广 Cowork。这类应用用户的价值要高得多。招股文件显示，第三季度，使用 Claude Code、消费金额排在前 5% 的 Claude 企业客户，每月支出大约是没有使用这款编程工具的普通企业客户的二十倍。该数据说明单客户付费额还有很大上涨空间，也解释了为什么 Anthropic 十分希望把第一方应用打进那些从 API 服务起步的客户账户。Anthropic 表示，依靠应用 AI 团队，其进一步放大了这种自然渗透效应。内部的应用 AI 团队会对接初创公司与大型企业，协助客户把 Claude 嵌入自身现有的技术栈。近期，该公司还和黑石以及其他私募机构联合推出了一个名为 Ode with Anthropic 的新项目，派驻专属工程师进驻企业，基于 Claude 为客户搭建定制化 AI 工具。Anthropic 同时依托和超大规模云厂商 AWS、谷歌云、微软 Azure 的第三方分销合作。文件中将该模式称为“联合市场推广方案”：Anthropic 直接和客户签订合同，再向各家云厂商支付服务费。公司称这种方式可以“避免渠道冲突”，并且“自主掌控定价”。随着这家 AI 巨头持续推出“全新品类产品，目标是让新产品创造的经济价值远超现有业务”，这套尚在成型的粘性策略或许会变得至关重要。公司表示，相比普通企业，其不会花太多精力巩固现有产品与商业模式，而是会投入更多资源去定义新业务。尽管营收增速亮眼，2026 年上半年营收达到 163 亿美元（现汇率约合 1,088.42 亿元人民币），远高于去年同期的 12 亿美元（现汇率约合 80.13 亿元人民币），招股文件也列出了不少阻力。帮助销售 Claude 的云合作伙伴，正逐渐把 Anthropic 视作竞争对手，Anthropic 认为这可能导致其难以从这些云厂商获取所需算力。文件写明，亚马逊、谷歌、微软可能会优先保障自身需求，或是优先支持它们投资的其他竞品。客户集中是另一项风险。风险提示章节写道：“头部客户的需求一旦出现不利变动…… 会对我们的业务和发展前景造成负面影响。因此，如果一家或多家核心客户大幅缩减开支、或是终止合作，同时又没有新增客户或者其他老客户增加订单来弥补缺口，就会对我们的业务、财务状况和经营成果产生不利影响。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/198.htm", "publishedAt": "2026-10-26T23:08:58+00:00"}, {"title": "苹果 iOS / iPadOS 27.2 正式版发布：增强 Siri AI，更新 Apple Music 品牌视觉", "summary": "IT之家 10 月 27 日消息，苹果今日向 iPhone 和 iPad 用户推送了 iOS / iPadOS 27.2 更新（内部版本号：24B119），本次更新距离上次发布正式版间隔 28 天。 需要注意的是，因苹果各区域节点服务器配置缓存问题，可能有些地方探测到升级更新的时间略有延迟，一般半小时内，不会太久。在官方更新日志中，只是提及“本更新为 iPhone 提供了改进、错误修复和安全更新。”图源：@小小数码君 在更新内容方面，IT之家查询海外媒体报道，附上相关更新日志内容如下：Siri AI记忆能力：Siri AI 可记住此前的对话内容。例如，你可以问它“上周推荐过哪些餐厅”。更广的个人上下文：Siri 可参考更多信息源，包括信息中的照片附件、日历活动参与者、语音留言，以及更好的 Safari 历史记录和阅读列表结果。排除的 App：新增统一设置，可选择哪些 App 不能被 Siri、搜索和建议访问。精细文本选择：可只选取并复制 Siri 回答中的部分内容。新增语言：Siri AI 新增法语、日语、韩语、葡萄牙语和西班牙语；但 Siri AI 在欧盟及中国大陆不可用。信息、照片与 FaceTime信息建议操作：根据聊天内容提供快捷操作建议。例如，对话中提到约会安排时，可快速创建日历事件或提醒事项；用户可在设置中控制建议类型。照片共享相簿：可编辑说明和评论、避免重复添加照片，并在相簿即将到期时显示提醒，方便参与者保存重要照片和视频。SynthID 水印识别：照片和 Image Playground 支持识别图像是否由生成式 AI 创建或修改。FaceTime：支持在通话中添加第三方手语翻译或实时字幕员；Dual Capture 双镜头同摄扩展到群组 FaceTime，可同时分享前置与后置摄像头画面。Apple Music、播客与 Apple TVApple Music 全新品牌视觉：应用图标改为黑白配色，取代原来的红色设计；应用内选中标签的强调色由红色改为蓝色，小组件也换为黑色背景。播客：首页拆分为“最新单集”和“继续播放”两个区域，分别显示关注节目的新内容，以及尚未听完的节目；应用图标和播放队列界面也有调整。Apple TV 个人档案：iPhone 端 Apple TV 应用新增个人档案，家庭成员可拥有独立的观看记录和推荐内容；也支持儿童账户与密码保护。Apple TV 多画面：体育内容支持 Multiview，可同时观看最多四场赛事，但该功能限于 Apple TV 上的体育直播。Home、HomePod 与系统细节Home App 智能门锁：为兼容门锁新增“关门后自动上锁”和“门未关提醒”功能；后者可在门长时间未关时提醒，提醒时间可设为 5 至 30 分钟。HomePod：更新后新增“锁定控制”设置，避免误触开始播放音频，同时保留计时器和闹钟等触控响应；HomePod 需同时更新至 27.2 固件。CarPlay Ultra：可套用主题，车内氛围灯可能随主题变化，实际效果取决于车企整合程度。其他界面调整：包括 Apple Books 阅读界面进度条与 Liquid Glass 菜单、“查找”图标微调、Siri 辅助功能设置恢复侧边按钮启动选项，以及修复主屏幕拖动小组件时可能闪烁或卡住的问题。附 iOS / iPadOS 27 发布历史：2026-10-20：iOS 27.2 RC (24B115)2026-10-14：iOS 27.2 Beta 4 (24B5110a)2026-10-06：iOS 27.2 Beta 3 (24B5099f)2026-09-29：iOS 27.0.1 (24A446)2026-09-22：iOS 27.2 Beta 2 (24B5089g)2026-09-17：iOS 27.2 Beta (24B5084k)2026-09-15：iOS 27.0 (24A437)2026-09-01：iOS 27.0 Beta 8 (24A5430a)2026-08-25：iOS 27.0 Beta 7 (24A5424a)2026-08-18：iOS 27.0 Beta 6 (24A5418b)2026-08-11：iOS 27.0 Beta 5 (24A5408d)2026-07-21：iOS 27.0 Beta 4 (24A5390f)2026-07-07：iOS 27.0 Beta 3 (24A5380h)2026-06-23：iOS 27.0 Beta 2 (24A5370h)2026-06-09：iOS 27 Beta (24A5355q)IT之家小伙伴如果找到更多新内容，可以在投稿或评论区中提出你的发现 ~[微笑]", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/187.htm", "publishedAt": "2026-10-26T18:44:02+00:00"}, {"title": "模型好选，搜索难做：一个投研Agent的两年开发历程", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/NrUkJExfuuFOICsjVYbb?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-26T14:57:35+00:00"}, {"title": "IT之家 11.11 严选好货：苹果 iPhone Duo 折叠屏手机开放购买，罗技 MX Master 3S Lite 鼠标 699 → 305 元", "summary": "全网 11.11 狂促今日继续，数码家电、日用百货、服装鞋帽皆为年内好价。京东 无门槛红包至高 26888 元，每天抽 3 次：点此抽红包。淘宝 无门槛红包至高 26888 元，每天抽 1 次：点此抽红包。一键保价京东一键保价没事就点点：点此保价。IT之家 · 严选好货数码好价iPhone Duo 京东现已开放购买（今天不少地区白色也开放购买了哦），售价 15999 元起。还可每天 20:00 蹲点抢 12 期免息需券哦：点此抢新品免息券。京东 iPhone Duo 折叠屏手机 256GB 夜空色 15999 元直达链接罗技 Logitech MX Master 3s &nbsp;Lite（国行称为菁英版）在去年 10 月上市，官方定价 699 元。鼠标较普通版相同，配件较普通版缺少 Logi Bolt 接收器，如需 2.4G 模式可另购接收器。今日京东 PLUS 低至 305 元，支持 PLUS 180 天只换不修 + 官方 1 年质保：京东罗技 MX Master 3S 菁英版大师系列补贴后 305 元直达链接会员类京东 WPS 超会 3 年 + 京东 PLUS 1 年单会员 59 元 / 年 268 元返 30 6-10-21T14:16:01+00:00"}, {"title": "从开源创新到全球增长 | 2026 上海开源软件应用创新大赛颁奖典礼暨创新增长大会", "summary": "10 月 30 日，以“从开源创新到全球增长”为主题的 2026 上海开源软件应用创新大赛颁奖典礼暨创新增长大会，将落地上海张江人工智能创新小镇。 2026上海开源软件应用创新大赛由开源中国主办，以“开源向实（Open Source, Real Impact）”为主题，面向全国征集优秀开源项目。自大赛启动报名以来，累计已收到报名项目 700 ...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503142", "publishedAt": "2026-10-21T11:45:10+00:00"}, {"title": "Mistral 发布 Voxtral 3，支持 50 多种语言的语音 Agent SDK", "summary": "Mistral 发布了 Voxtral 3，一套语音 Agent SDK 加语音模型，支持 50 多种语言。官方给的演示场景很能说明定位：一个说英语的患者，拿着一张法语转诊信打给诊所，语音代理听懂了法语内容、完成预约、还承诺用英语回短信——跨语言、带工具调用、有情绪适应能力的完整语音工作流。 语音 AI 的问题一直在于「端到端」。转录...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503136/mistral-ai-voxtral-3", "publishedAt": "2026-10-21T07:31:23+00:00"}]}, {"label": "产品发布/更新", "items": [{"title": "苹果首款折叠 iPhone Duo 确认缺失 FaceTime“眼神交流”功能", "summary": "IT之家 10 月 27 日消息，科技媒体 MacRumors 昨日（10 月 26 日）发布博文，指出在苹果首款折叠 iPhone Duo 机型上，其 FaceTime 设置中缺少“眼神交流”（Eye Contact）选项，用户在视频通话时无法获得该功能带来的视线校正效果。图源：苹果IT之家援引博文介绍，“眼神交流”功能最早随 iOS 14 推出，主要针对视频通话场景，依靠机器学习调整用户眼部画面，让对方感觉用户正注视摄像头。该功能此前已广泛覆盖多款 iPhone，包括 iPhone SE 机型（采用 Touch ID 指纹识别认证、没有面容 ID）。该媒体最新确认 iPhone Duo 不提供该设置。最初由论坛用户 TwoBytes 发现，在 FaceTime 通话中感觉自己的眼神“有些不对劲”，随后发现设置菜单中并无相关控制选项。报道分析认为，问题未必源于 iPhone Duo 缺少 Face ID 或 TrueDepth 摄像头，因为 iPhone SE 同样没有这些硬件却支持该功能。iPhone 18 Pro（左）与 iPhone Duo 的眼神交流设置更可能的原因在于 Duo 内屏的屏下摄像头位置：摄像头位于屏幕右侧，偏离了通话对象面部通常显示的屏幕中央区域。相比普通 iPhone 摄像头与视线之间较小的垂直偏移，Duo 需要校正的横向偏移更大，技术实现难度更高。此外，折叠形态也让问题更复杂。摄像头相对于用户视线的位置，会随所用屏幕及设备折叠状态而变化，其中一个佐证是苹果已限制另一项基于注视的辅助功能“眼动追踪”，仅在 Duo 完全展开时可用。MacRumors 表示已就此事联系苹果，寻求技术层面的解释；截至发稿，苹果尚未公开说明该功能缺失的具体原因，也未透露是否会在后续系统更新中补齐。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/238.htm", "publishedAt": "2026-10-27T01:34:11+00:00"}, {"title": "Anthropic 提交 IPO 招股文件，亚洲芯片股走强", "summary": "IT之家 10 月 27 日消息，据彭博社报道，受 Anthropic PBC 提交 IPO 招股文件的推动，投资者对人工智能交易的热情重新燃起，亚洲半导体板块股票应声大涨。今日早盘交易中，三星电子、SK 海力士股价涨幅均超 5%，带动韩国综合股价指数（Kospi）一度冲高 4.4%。日本日经 225 指数最大涨幅达 2.2%，芯片相关企业爱德万测试（Advantest Corp.）、住友硅业（Sumco Corp.）涨幅都超过 6%。开发 Claude 的 Anthropic 向上市再迈进一步，是隔夜一系列利好消息里最核心的一条，缓解了市场近期对 AI 领域融资情况的担忧。其他值得关注的消息还有 SpaceX 一笔 400 亿美元（IT之家注：现汇率约合 2,673.5 亿元人民币）设备融资租赁项目，以及 Meta Platforms 拟实施 950 亿美元（现汇率约合 6,349.56 亿元人民币）售股计划。万泰环球资本（Vantage Global Prime）市场分析师赫柏 · 陈（Hebe Chen）表示：“Anthropic 这份标志性的 IPO 申报文件，叠加 Meta 大举加码资本开支，重新点燃了市场整体风险偏好。资金不再偏向防御性资产，芯片股再度成为行情主线。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/237.htm", "publishedAt": "2026-10-27T01:28:24+00:00"}, {"title": "630 亿美元！华尔街银行与黑石为 Anthropic 采购博通 AI 芯片提供融资", "summary": "IT之家 10 月 27 日消息，据路透社报道，美国银行（Bank of America）、黑石（Blackstone）、花旗（Citi）和摩根士丹利（Morgan Stanley）将提供 630 亿美元（IT之家注：现汇率约合 4,206.79 亿元人民币）融资，用于为 Anthropic 采购博通（Broadcom）的人工智能芯片与网络设备，这是和人工智能算力建设相关的规模最大的一笔债务交易之一。人工智能需求持续走高，各大科技企业争相储备算力，支撑复杂度不断提升的业务负载，由此催生了对计算基础设施的巨额投入。相关企业当地时间周一表示，这笔交易将通过一家新设立的特殊目的实体实施，由该实体购入博通的 AI 加速芯片和网络设备，再出租给开发 Claude 的 Anthropic。美国银行、花旗和摩根士丹利负责安排第一顺位抵押融资，黑石则提供第二顺位抵押融资的承诺出资部分。博通为优先级债务出借方提供“残值支持”，相当于在这套融资架构里向贷方给出担保：资产价值下跌产生的损失，博通愿意承担，上限和第一顺位债务金额持平，不过公告没有披露该档债务的具体规模。企业方面称，这批设备预计从 2027 年开始交付，属于此前公布、由博通参与的战略性算力供应协议的一部分。更早之前，阿波罗（Apollo）和黑石就已经和博通达成协议，出资 350 亿美元（现汇率约合 2,337.11 亿元人民币）用于扩容 Anthropic 的 AI 算力。这笔最新交易凸显，银行与另类资管机构，在为不断扩张的 AI 算力需求配套基建融资这件事上，扮演着越来越重要的角色。Anthropic 在当地时间周一提交了 IPO 申请，本次 IPO 有望创下纪录；但与此同时，高额亏损和安全隐患的披露，也可能考验投资者对这家 AI 巨头的投资意愿。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/199.htm", "publishedAt": "2026-10-26T23:20:26+00:00"}, {"title": "中科慧灵完成数亿元A++轮融资：制鞋机器人订单超 4 亿元，具身智能开始拼量产交付", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/2svt5BbWUOHbADdo0UZo?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-26T18:30:50+00:00"}, {"title": "让 AI 从需求一路干到上线，软件开发组织要变了？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/b32Mw2zaPrxyJ6ChePD5?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-26T18:08:13+00:00"}, {"title": "网易《逆水寒：新世界》将推“自拍模式”，可自定义动作、邀请 AI 门客 NPC 合照", "summary": "IT之家 10 月 26 日消息，网易《逆水寒：新世界》首个大型资料片【苗疆蛊事】将于 10 月 30 日正式开启，将首次采用双线更新的框架。根据官方今日预热，随着新版本开启，【自拍模式】将正式上线；还有全新【门客站】入驻，让玩家邂逅更多合拍搭子；再搭配全面焕新的【剧组站】升级，帮助玩家随手拍出江湖大片。在【自拍模式】下，玩家可以一边走动一边切换动作自拍，手臂的位置、举着相机的朝向都能随心调节。如果不喜欢正襟危坐地看镜头，还可以随时移开视线，自由设置头部和眼神的朝向。在牵手状态下进入自拍，身旁的 TA 会与玩家同步做出自拍动作。身旁同游的门客也会默契地望向镜头，主动加入玩家的合照。新模式同样支持坐姿自拍。坐在大理小镇的木椅上，把彩云之南的慢时光统统收进眼底。带宠物一起自拍时，不仅能随时控制宠物是否看向镜头，它们还会主动凑到镜头前开启自拍互动 —— 不同种类、不同性格的宠物，还会有各自独特的抢镜表现。暂不支持逆崽八爪鱼萌萌泥的自拍看镜头效果IT之家从官方了解到，目前开发组已经在紧锣密鼓地调试中，预计在后续版本进一步拓宽自拍的姿势与边界 —— 比如坐骑上自拍、自定义动作自拍。新版本中，【门客站】将正式入驻【剧组站】，玩家可以为自己的门客上架作品。不仅能自由定制门客的开场白、开场白动作和语音，以及封面背景，还能为同一个门客发布多个作品，在不同作品赋予 TA 百变人设。门客作品将自然融入剧组站的日常推荐流里。它依然保持着玩家熟悉的【表演模式】，不会打扰玩家的浏览节奏。如果玩家希望看到更多门客作品，还可以在专门的“门客”频道里尽情浏览。玩家还可以点击【面谈】，走进 TA 的世界，把全江湖的神仙门客变成合拍人选。从表演模式切换到面谈模式除了随缘偶遇，玩家还可以直接通过 IP、角色名、人设标签等条件精准寻访。在【面谈】投缘后发起【委托】，这位保留了创作者全套顶配穿搭的门客（无需玩家自己拥有其时装和捏脸），将作为“24 小时特邀同行伙伴”加入玩家的门客列表。这群性格各异的委托门客也同样适配自拍功能，在玩家自拍时，TA 会主动上镜，配合玩家一同拍照。若是 24 小时的相处让玩家意犹未尽，还可以继续发起委托，或是直接将 TA 正式招募至麾下。此外，【剧组站】也在新版本中迎来了三项重磅升级 ——新版本更新后，剧组站作品将支持播放外观的脚印特效。仅支持 4.2.1 版本后通过“智能生成”入口生成的新动作点击作品页「更多」菜单中新增的「复制口令」，即可一键生成包含作品 ID、作品名与作者名的专属分享文案。接收方只需复制这段文字，打开剧组站，系统便会自动识别剪贴板口令，弹窗确认后直接跳转播放。新版本中，剧组模式也将支持分片段编辑变速轨道。无论是自定义动作、细微的表情变化，还是语音台词与镜头运镜，都可以随心开启倍速或慢放。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/172.htm", "publishedAt": "2026-10-26T14:22:26+00:00"}, {"title": "JimuReport v2.5.5 发布，填报增强与 Word 导出专项修复", "summary": "项目介绍 真正的 AI 报表来了，一句话描述需求，AI 自动生成报表与数据大屏，支持对话式修改报表；同时提供类 Excel 拖拽设计器，兼容 30 余种数据源，轻松应对各类复杂报表场景 :sparkles: 积木报表是一款免费的数据可视化报表工具，集报表、打印、大屏、仪表盘于一体，像搭积木一样完全在线设计。分两大模块：JimuRep...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503217", "publishedAt": "2026-10-26T05:49:34+00:00"}, {"title": ":fire::fire::fire: Claude Code 工程最佳实践 | 主数据平台 1.7.0 发布，移动端上线", "summary": "更新版本：V1.7.0 升级简介： 新增权限组申请与审核（开发者自助申请、运营逐组审批）；开放平台接口在线调试；Feign 内部接口统一迁移 /inner/** 并接入令牌鉴权；附件体系与文件存储增强（公开桶）；用户体系增强（身份证号等）；移动端（uniapp）登录与分享增强。 后端 50 次提交、前端 50 次提交、移动端 12 次提交、...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503199", "publishedAt": "2026-10-26T01 e 分享对话可被陌生人找到：标题写进 URL、一次 DNS 查询全暴露", "summary": "Meta 的 AI 助手 Muse 刚上线就撞上隐私问题：用户分享的对话，能被陌生人轻易找到。Meta 已经暂停了分享功能，理由正是安全公司 Claroc 的报告——他们枚举出了 6,800 个 Muse 用户创建的分享链接，打开其中几百个就看到了个人和商业机密。 问题出在一个看似细节的设计决策上。Muse 的分享链接域名是 cf.metaaiusercon...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503140/meta-muse-exposes-users-personal-when-they-share-conversations", "publishedAt": "2026-10-21T10:35:57+00:00"}, {"title": "ApiGo 5.4.0发布，加固安全认证", "summary": "ApiGo 5.2.0：接口认证新增 OAuth2 与企业 IdP JWT 两种方式 ApiGo 做的事没变——把 ERP、CRM 这类企业存量系统的数据封装成标准 REST API 和 MCP 工具，让 AI 智能体在安全管控下访问。这次更新动的是\"谁能访问\"这一层：在原有的AppKey认证、签名认证之外，新增了 OAuth2 客户端凭证和企业 IdP JWT 两种企业内部更常用...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503138", "publishedAt": "2026-10-21T07:45:23+00:00"}]}, {"label": "行业动态", "items": [{"title": "AI 造富：Anthropic 七位联合创始人身家均超 130 亿美元", "summary": "IT之家 10 月 27 日消息，Anthropic PBC 当地时间周一披露的 IPO 文件显示，公司七位联合创始人每人大约持有公司 1.4% 的股份，按估值计算，各自身家超过 130 亿美元（IT之家注：现汇率约合 868.89 亿元人民币）。阿莫代伊兄妹这让包括达里奥 · 阿莫代伊（Dario Amodei）、丹妮拉 · 阿莫代伊（Daniela Amodei）兄妹在内的全部七位创始人跻身彭博亿万富豪指数前 300 名，财富规模超过比尔 · 阿克曼（Bill Ackman）、斯坦 · 德鲁肯米勒（Stan Druckenmiller）等知名金融领域亿万富豪。该身家是基于 Anthropic 上一轮融资 9,650 亿美元（现汇率约合 6.45 万亿元人民币）的估值测算得出，相比彭博此前测算的每人 80 亿美元（现汇率约合 534.7 亿元人民币）大幅上涨。彭博财富指数的数据显示，如果 Anthropic 上市后估值能够达到投资者此前提出的 2 万亿美元（现汇率约合 13.37 万亿元人民币），在不考虑新股发行带来股权稀释的前提下，每位创始人的账面财富将超过 270 亿美元（现汇率约合 1,804.61 亿元人民币）。创始人的身家变化，直观体现出科技行业，尤其是人工智能领域，在今年拉动美国股市、创造财富方面的绝对主导地位。彭博数据显示，2026 年前九个月，在全球 500 位最富有人士中，科技富豪的财富合计增加 8,450 亿美元（现汇率约合 5.65 万亿元人民币），而科技行业以外的亿万富豪平均净资产出现缩水。在写给潜在股东的信中，Anthropic 联合创始人表示，人工智能以及 Anthropic 本身，“代表着历史上最重大的经济机遇之一”。除阿莫代伊兄妹外，Anthropic 其余联合创始人为汤姆 · 布朗（Tom Brown）、杰克 · 克拉克（Jack Clark）、贾里德 · 卡普兰（Jared Kaplan）、萨姆 · 麦肯德利什（Sam McCandlish）以及克里斯托弗 · 奥拉（Christopher Olah）。招股文件写明，七位创始人都承诺，会把自己持有的 Anthropic 个人股权中的 80% 用于慈善事业。创始人的持股比例看似不高，但并不妨碍他们掌握公司控制权。根据 Anthropic 拟采用的治理架构，只要创始人保留的 A 类股数量不少于上市时所持 A 类股的 2%，就可以继续作为创始人有限责任公司（Founder LLC）的成员；这家主体持有 F 类股份，掌握 50.1% 的股东投票权。也就是说，哪怕一名创始人卖掉自身原有股份的 98%，在这一控制权股份的投票上，他依然和其他创始人拥有同等话语权。不过创始人的多数投票权受到 Anthropic 长期受益信托一定程度的制衡，该信托有权在七人董事会中任命、罢免四名董事。该信托可以永久存续；而创始人这一特殊投票股份会在符合资格的创始人不足三人时失效，触发情形包括创始人离世、丧失行为能力、辞职，或是卖出、赠予超过上市时所持 A 股约 98% 的份额。信托由五名受托人管理，受托人基本自行推举继任人选。股票期权相关信息总部位于旧金山的 Anthropic 于 2021 年成立，创始团队由一批原 OpenAI 员工组成，当年他们因为对公司发展方向存在分歧而离职。招股文件显示，2026 年上半年，Anthropic 营收 163 亿美元（现汇率约合 1,089.45 亿元人民币），净亏损 807 亿美元（现汇率约合 5,393.79 亿元人民币）；而去年同期营收 12 亿美元（现汇率约合 80.21 亿元人民币），净亏损 130 亿美元（现汇率约合 868.89 亿元人民币）。Anthropic 确认，首席执行官达里奥 · 阿莫代伊与总裁丹妮拉 · 阿莫代伊，已经在 2025 年和 2026 年的两次要约收购中出售了部分股份。去年 Anthropic 推出规模 1.57 亿美元（现汇率约合 10.49 亿元人民币）的要约收购，阿莫代伊兄妹二人都售出了部分股票。今年 Anthropic 开展规模 47 亿美元（现汇率约合 314.14 亿元人民币）的要约收购，阿莫代伊兄妹、首席财务官克里希纳 · 拉奥（Krishna Rao），以及丹妮拉 · 阿莫代伊的配偶霍尔登 · 卡诺夫斯基（Holden Karnofsky），都在本次交易里出售股份。今年，Anthropic 还替阿莫代伊兄妹支付了 500 万美元（现汇率约合 3,341.9 万元人民币）监管申报相关费用，这笔费用和他们收购、持有 Anthropic 证券有关。暴富的不只是创始人：文件数据显示，截至 6 月，Anthropic 员工以及其他期权持有人，所持股票期权对应的潜在账面收益大约 980 亿美元（现汇率约合 6,550.08 亿元人民币）。这笔收益来自公司估值在员工拿到期权后的暴涨。截至 6 月，员工与其他期权持有人行权认购对应股票的平均成本仅每股 2.89 美元（现汇率约合 19.3 元人民币）。全部期权行权一共需要约 52 亿美元（现汇率约合 347.56 亿元人民币）资金，而对应的标的股票账面估值超过 1,030 亿美元（现汇率约合 6,884.26 亿元人民币）。Anthropic 还设有捐赠配套计划：员工可以承诺将一部分股权奖励捐给符合条件的慈善机构，公司会用无投票权 N 类股票进行等额配套捐赠。8 月，公司确认当月因员工捐赠产生一笔 20 亿美元（现汇率约合 133.68 亿元人民币）支出，为此发行 2800 万股用于配套捐赠。七位联合创始人承诺捐赠 80% 股权的计划，不在这项配套捐赠的覆盖范围内。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/231.htm", "publishedAt": "2026-10-27T01:17:15+00:00"}, {"title": "IPO 文件阐述 Anthropic 的野心：AI 有望解决过去几代人未能攻克的难题", "summary": "IT之家 10 月 26 日消息，Anthropic 已向美国证券交易委员会（SEC）提交 S-1 注册文件，为纳斯达克上市做准备。这家 AI 公司早在今年 6 月就秘密递交了上市申请，此次公开的文件披露了更多细节。据文件所述，Anthropic 今年上半年营收 163 亿美元（IT之家注：现汇率约合 1,088.42 亿元人民币），净亏损达 807 亿美元（现汇率约合 5,388.7 亿元人民币）。《华尔街日报》此前曾根据泄露文件描述过这一情况，其中大部分亏损来自与公司融资票据相关的会计费用。该文件还列出了 Anthropic 为获取 AI 算力而签订的数十亿美元协议。待所有计划中的算力全部交付后，Anthropic 每月将向 SpaceX 支付约 31 亿美元（现汇率约合 207 亿元人民币），以使用英伟达 GPU；截至 2029 年，相关支出总额最高可达 1,205 亿美元（现汇率约合 8,046.32 亿元人民币）。值得注意的是，Anthropic 还在文件中写道：“我们认为 AI 是人类历史上，影响最为深远的技术之一。如果它得到妥善管理，有望加速科学创新、大幅提高经济增速、让治愈重大疾病成为可能，并解决从前几代人未能攻克的难题。”Anthropic 的目标是实现上述收益的同时，防范 AI 这项强大技术带来的风险。AI 相关事故可能造成“灾难性”后果，甚至整个保险行业都可能无法承担此类风险。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/171.htm", "publishedAt": "2026-10-26T14:19:11+00:00"}, {"title": "苹果 iPad mini（A20 Pro）仅 512GB 机型配备 6 核中央处理器、双 16 核神经网络引擎", "summary": "IT之家 10 月 26 日消息，苹果今天发布了 iPad mini（A20 Pro），也就是俗称的“iPad mini 8”，该机采用 A20 Pro 芯片，10 月 29 日凌晨 1 点 10 分接受预购，11 月 6 日发售，定价 5499 元起。不过IT之家注意到，该机 128GB（5499 元起）/256GB（6299 元起）版本机型的 A20 Pro 芯片为“5 核中央处理器、7 核图形处理器、16 核神经网络引擎”规格，仅有顶配 512GB 机型（7999 元起）为“6 核中央处理器、7 核图形处理器、双 16 核神经网络引擎”规格。官网信息显示，配备 6 核中央处理器的 iPad mini (A20 Pro) 对比上一代 iPad mini（A17 Pro）内存带宽翻倍、图形处理器性能提速约 2.7 倍、中央处理器性能提速约 1.6 倍，测试使用 Affinity Photo 2 v2.6.4 进行。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/169.htm", "publishedAt": "2026-10-26T14:13:09+00:00"}, {"title": "地铁里的 AI 伪人广告，正在集体霸凌人类", "summary": "唯有诚意与创意不可辜负#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1685809?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-10-26T07:42:44+00:00"}, {"title": "10 MB 的桌面 AI 客户端：用仓颉 + 系统 WebView 替代 Electron", "summary": "我用华为仓颉写了个桌面框架，产物 4.7–10 MB. 项目：cj-tauri（仓颉版 Tauri），MIT 仓库：https://atomgit.com/qq8864/cj-tauri 官网：https://yangyongzhen.github.io/cj-tauri/ 思路跟 Tauri 一样：前端照写 Web，后端是原生二进制，中间一条 IPC 桥加一层能力白名单， WebView 用系统自带的（Windows WebView2 / ...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503196", "publishedAt": "2026-10-25T10:13:31+00:00"}, {"title": "一位开发者让电视服用了 Claude，这是它系统发生的变化", "summary": "欢迎来到「大逆向时代」#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1685473?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-10-24T10:10:44+00:00"}, {"title": "实测 Kimi K3.1 Pro，国模终于继续卷旗舰", "summary": "大而美的 Kimi 回来了#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1685684?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2 https://www.oschina.net/news/503150/deepseek-raises-15-billion-in-challenge-to-leading-us-labs", "publishedAt": "2026-10-22T03:40:47+00:00"}]}, {"label": "论文研究", "items": [{"title": "人类史上最大 IPO！Anthropic 提交纳斯达克 IPO 申请，股票代码为“ANT”", "summary": "IT之家 10 月 26 日消息，10 月 26 日，人工智能初创公司 Anthropic 向美国证券交易委员会提交 S-1 注册文件，计划首次公开发行 A 类普通股，并申请在纳斯达克以“ANT”为股票代码上市。本次发行规模、定价区间与上市日期暂未公布。据《华尔街日报》报道，Anthropic 计划于 11 月 16 日当周进行 IPO。Anthropic 目标估值有望高达 2 万亿美元，若成功落地，将成为有史以来规模最大的 IPO。招股书披露，公司业绩呈现高速增长态势：2025 年营收 45.85 亿美元（IT之家注：现汇率约合 306.16 亿元人民币），净亏损 419.65 亿美元（现汇率约合 2,802.19 亿元人民币）；2026 年上半年营收飙升至 162.86 亿美元（现汇率约合 1,087.49 亿元人民币），同比暴涨 13 倍。虽然当期净亏损扩大至 807.48 亿美元（现汇率约合 5,391.9 亿元人民币），但营业亏损大幅收窄至 6.93 亿美元（现汇率约合 46.27 亿元人民币），调整后营业利润扭亏为盈至 16 亿美元（现汇率约合 106.84 亿元人民币）。公司解释，营收扩容与算力运营效率优化带动主业向好，巨额账面亏损主要来自可转换票据公允价值变动，并非实际经营支出。此外，该公司客户规模实现跨越式扩张：截至 2026 年 6 月末，年收入 10 万美元（现汇率约合 66.8 万元人民币）以上的付费客户突破 6000 家，仅一年多时间就从 400 家实现十余倍增长。Claude 系列新品持续落地，带动订阅与按量计费两项收入同步走高。算力基建成为未来最大开支项。截至今年 6 月底，Anthropic 手握 1,124 亿美元（现汇率约合 7,505.45 亿元人民币）现金等价物与 193 亿美元（现汇率约合 1,288.75 亿元人民币）短期投资，资金储备充足。同时，公司已签下巨额长期算力租赁协议，已确定的未来最低付款额约 4,170 亿美元（现汇率约合 2.78 万亿元人民币）；待敲定条款的协议还将带来 1,250 亿 —1,500 亿美元（现汇率约合 8,346.81 亿 — 1 万亿元人民币）支出，用于采购服务器、数据中心与云资源，付款周期横跨多年。公司明确，后续仍会持续加码算力投入，依靠营收与股权融资支撑资本开支。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/162.htm", "publishedAt": "2026-10-26T13:29:45+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "老干妈否认“用 AI 把 600 名工人裁到 48 人”，回应称相关 AI 裁员传闻为不实信息", "summary": "IT之家 10 月 27 日消息，“老干妈 AI 裁员传闻引争议”话题于 10 月 26 日登上社交平台热搜，据蓝鲸新闻报道，老干妈官方热线工作人员回应称，相关 AI 裁员传闻为不实信息，公司从未发布此类信息，请消费者理性看待。另据观点网报道，老干妈常务副总、首席质量官李鑫在 2026 年贵州省质量发展大会上对外透露，“通过四年的质量巩固与体系优化，2025 年，我们营收达 54 亿元，创历史最高峰值。”随后，在网络上不少自媒体发文，称“老干妈用 AI 把 600 名工人裁到 48 人，自己年营收高达 54 亿”，相关内容引发热议，甚至有消费者表示不再购买老干妈。IT之家注意到，报道还称，老干妈车间全面上线 AI 视觉质检系统，实现核心原料 100% 可追溯，高速工业相机扫描传送带上的辣椒，0.3 秒即可识别霉变、斑点辣椒，依靠气流自动剔除不合格原料，关键工序产品不良率降至 0.02%。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/227.htm", "publishedAt": "2026-10-27T00:55:13+00:00"}, {"title": "苹果 iOS 27.2 更新汇总：增强 Siri AI，调整 Apple Music 品牌视觉等", "summary": "IT之家 10 月 27 日消息，苹果公司今天面向 iPhone 18 Pro 等机型推送 iOS 27.2 正式版更新（内部版本号：24B119），并为其首款折叠 iPhone Duo 推送专属 iOS 27.2 更新（内部版本号：24B91020）。IT之家综合 MacRumors 等多家海外媒体报道，汇总梳理本次更新内容如下：一、增强 Siri AI 体验（国内暂未上线）Siri AI 现在能记住用户此前的对话内容。例如，用户可以询问 Siri 之前推荐过的某家餐厅，而不必重新描述需求。在 iOS 27.2 更新中，苹果扩大了可调用的信息来源，包括：信息应用中附带的照片日历活动的参与者语音留言Safari 浏览历史与阅读列表，苹果公司还提升检索效果苹果重新设计了“排除应用”（Excluded Apps）功能，用户可更快选择 Siri、搜索和系统建议不能访问哪些应用。Siri 回复也支持细粒度文本选择，可只复制需要的部分。需要注意的是，Siri AI 要求 iPhone 15 Pro 或更新机型，且目前暂未在欧盟和中国大陆上线。二、信息 App 支持上下文建议“信息”（Messages）应用新增了建议（Suggestions）功能。系统会根据对话内容，在聊天界面中显示可轻点的快捷操作，例如追踪包裹，或将晚餐邀请加入日历。用户可自行选择启用哪些建议，目前包括：日历提醒事项备忘录地图航班与包裹该功能曾在 iOS 27 测试阶段出现，但在 iOS 27 正式版发布前被移除，此次随 iOS 27.2 正式回归。三、扩展 Siri AI 支持的语言Siri AI 新增法语、日语、韩语、葡萄牙语和西班牙语支持。不过，欧盟和中国大陆用户仍无法使用该功能。四、调整 Apple Music 品牌视觉Apple Music 更换了新的黑白图标，取代此前的红色图标。应用内导航栏和其他区域的高亮色也同步调整，移除了红色元素，更好配合苹果近期的 Apple Music 品牌重塑。五、照片 App 改进共享相册与整理“照片”应用中的共享相册现在支持编辑标题和评论。苹果还加入了两项实用改进：避免重复照片，以及在共享相册到期前提醒用户保存重要照片和视频。六、SynthID 标识 AI 生成与编辑内容iOS 27.2 为 Image Playground 生成的图片，以及部分“照片”应用编辑结果加入 SynthID 标签。具体触发场景包括：使用“扩展”（Extend）功能使用“重框”（Reframe）功能使用“清理”（Clean Up）工具进行较大幅度的编辑用户可通过 Google 的 SynthID Detector 网站检查图片是否带有 SynthID 标识。这项更新有助于区分 AI 生成或 AI 辅助编辑的内容。七、播客：首页信息结构更清晰播客应用的“首页”标签页新增了两个独立板块：“新节目”和“继续播放”，取代原来的“Up Next”板块。这让用户更容易区分尚未收听的新内容与正在收听的节目。八、游戏：好友信息更完整Games 应用中的“好友”标签页现在会为好友推荐提供更多上下文信息，并在好友的玩家页面显示其最近玩过的游戏，方便用户了解朋友的游玩动态。九、Apple TV 中创建个人资料Apple TV 应用现在支持在 iPhone 和 iPad 的账户设置中创建个人资料。资料只需填写姓名、内容分级，以及是否为儿童。为儿童创建资料时，默认内容限制为 PG 级，但用户可进一步自定义电视节目和电影的年龄分级。十、在 iPhone 上拓展支持最多 4 路体育赛事直播同时，Multiview（多视图）功能扩展至 iPhone，用户可在 Apple TV 应用中同时观看最多四路体育直播。适用内容限于 Apple TV 订阅内的赛事，包括美国地区的 MLS、F1，以及 MLB 赛季中的“周五夜棒球”双场赛事。十一、电话应用“电话”应用新增 Call Context（通话上下文）功能。如果用户已在联系人中保存了某人的周年纪念日，拨打该联系人电话时会收到提醒。十二、扩展 FaceTime 的 Dual Capture（双摄同录）FaceTime 的 Dual Capture（双摄同录）现已支持群组通话，可同时传输前置和后置摄像头画面。在兼容设备上，FaceTime 通话中切换摄像头会自动开启该功能。图源：苹果支持 Dual Capture 的机型包括：iPhone 17iPhone 17 ProiPhone 17 Pro MaxiPhone AiriPhone 18 ProiPhone 18 Pro MaxiPhone Duo苹果还新增了在通话中添加第三方手语翻译员或实时字幕员的功能，提升无障碍沟通能力。十三、快捷指令：自动化与编辑能力增强快捷指令应用获得多项新自动化和操作，包括：iPhone Duo 新增“当我的 iPhone 被打开或关闭”自动化锻炼自动化新增对健身应用的支持应用自动化可显示被关闭的应用名称可通过“显示操作”和“显示描述快捷方式”配置窗口布局可在资料库中编辑快捷指令的名称和图标十四、iPhone Duo 专属更新iOS 27.2 为 iPhone Duo 增加了 USB-C Apple Pencil 支持，方便用户进行书写、标注等操作。它还新增 Edge Light（边缘补光）功能，可在视频通话时照亮用户面部。十五、时钟时钟应用的闹钟列表中，上午和下午标签变得更小，界面更加紧凑。十六：应用追踪透明度（在欧盟地区）在欧盟地区，“应用追踪透明度”新增了替代性扩展提示，并支持每年重新提示。法国、德国、意大利、波兰和罗马尼亚的用户必须使用该替代提示。十七、未包含改版健康应用苹果在 iOS 27.2 测试版中测试了重新设计的健康应用，但该改版并未随 iOS 27.2 正式推出，预计要到今年晚些时候才会发布。十八、安全修复iOS 27.2 修复了超过 160 个安全漏洞。苹果表示这些漏洞均未被主动利用，但由于修复数量较多，建议用户尽快更新。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/218.htm", "publishedAt": "2026-10-27T00:22:22+00:00"}, {"title": "微软向约 6 万名员工推出自愿离职买断方案，适配 AI 时代人员结构调整", "summary": "IT之家 10 月 27 日消息，微软于当地时间周一向科技媒体 TechCrunch 证实，公司正向约 6 万名员工提供自愿离职买断方案。此举是微软为削减成本、适配人工智能时代调整人员结构的最新举措。微软首席人力官埃米 · 科尔曼（Amy Coleman）向员工发送了关于本次买断方案的通知，IT之家注意到，这份通知也同步发布在微软官网。通知显示，美国、加拿大、印度和英国部分团队中副总裁级别及以下的员工符合申请资格。据彭博社报道，参与本次买断计划的部门包括 Xbox、Windows、Copilot 以及财务部门。数据中心、销售和市场营销等岗位的部分员工不在此次范围内。发给员工的通知写道：“自愿离职方案是我们调整变革方式的重要一环：它能带来更高的灵活性，在可行的情况下，为员工规划下一阶段职业道路提供更多选择。对于那些已经考虑离开公司发展的符合条件员工，这项方案提供了一个全新选择，让他们可以在公司的支持下完成过渡。”微软表示，符合条件的员工会在周一收到一封邮件，内含自愿离职方案详情链接。本次买断的相关条款和微软标准离职补偿方案相近。通知中提到：“自愿离职方案对我们而言是一项新尝试。我们会从中总结经验。与此同时，我们会继续帮助员工聚焦核心工作、学习新技能，并在合适的时机，协助员工在微软内部寻找新岗位。不存在一套适用于所有团队和员工的统一方案。我们通过这类方式，在满足不同业务需求的同时，持续为内部员工创造成长和发挥价值的机会。”借助自愿买断方案，微软可以缩减人员规模，同时避免大规模裁员带来的强烈冲击。这并非微软首次推出买断计划。今年早些时候，微软就向达到退休年龄的员工提供过买断方案，在大约 8750 符合条件的员工中，超过三成选择接受。截至六月底，微软员工总数为 223,000 人。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/197.htm", "publishedAt": "2026-10-26T22:57:21+00:00"}, {"title": "苹果 watchOS 27.2 正式版发布：增强 Siri AI，回归 App 切换器", "summary": "IT之家 10 月 27 日消息，苹果今日向 Apple Watch 用户推送了 watchOS 27.2 更新（内部版本号：24S118），本次更新距离上次发布正式版间隔 27 天。 需要注意的是，因苹果各区域节点服务器配置缓存问题，可能有些地方探测到升级更新的时间略有延迟，一般半小时内，不会太久。IT之家查询公开资料，附上 watchOS 27.2 更新主要内容如下：Siri AI 增强（国内暂未上线）记住此前对话：Siri AI 可保留之前交互中的有用上下文，例如询问它上周推荐过的餐厅。调用更多个人情境：回答时可参考信息中附带的照片、日历活动参与者、语音留言，以及 iPhone 上 Safari 历史和阅读列表的更优结果。响应更快：Apple Watch 上的 Siri AI 响应速度提升。新增语言：在英语之外，新增法语、日语、韩语、葡萄牙语和西班牙语支持。隐私设置：iPhone 上的 Excluded Apps 可统一选择哪些应用的数据不允许被 Siri、搜索和系统建议访问。界面与功能变化Apple Music 新图标：应用图标从红白配色改为黑白设计，Music 应用内也加入更多单色和偏蓝色系的设计调整。App 切换器回归：watchOS 27.0 移除的 App Switcher 以新的手势方式回归，可更方便地在最近使用的应用间切换。错误修复与安全更新：官方说明还包含其他功能改进、Bug 修复和安全更新，但未在发布说明中列出完整安全漏洞清单。如何更新在配对 iPhone 的 Watch 应用 &gt; 通用 &gt; 软件更新中安装，或在手表的“设置”中检查更新。安装要求 Apple Watch 电量超过 50%，并全程放在充电器上；建议先将 iPhone 更新到 iOS 27.2。附 watchOS 27 发布历史：2026-10-20：watchOS 27.2 RC (24S116)2026-10-14：watchOS 27.2 Beta 4 (24S5112a)2026-10-06：watchOS 27.2 Beta 3 (24S5101f)2026-09-29：watchOS 27.0.1 (24R365)2026-09-22：watchOS 27.2 Beta 2 (24S5091f)2026-09-17：watchOS 27.2 Beta (24S5086l)2026-09-15：watchOS 27.0 (24R364)2026-09-10：watchOS 27.0 RC (24R363)2026-09-01：watchOS 27.0 Beta 8 (24R5360a)2026-08-25：watchOS 27.0 Beta 7 (24R5358a)2026-08-18：watchOS 27.0 Beta 6 (24R5353a)2026-08-11：watchOS 27.0 Beta 5 (24R5347a)2026-07-21：watchOS 27.0 Beta 4 (24R5325h)2026-07-07：watchOS 27.0 Beta 3 (24R5315i)2026-06-24：watchOS 27.0 Beta 2 (24R5305g)2026-06-09：watchOS 27 Beta (24R5289n)IT之家小伙伴如果找到更多新内容，可以在投稿或评论区中提出你的发现 ~[微笑]", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/190.htm", "publishedAt": "2026-10-26T18:44:03+00:00"}, {"title": "苹果 visionOS 27.2 正式版发布：增强 Siri AI 体验", "summary": "IT之家 10 月 27 日消息，苹果今日向 Vision Pro 用户推送了 visionOS 27.2 更新（内部版本号：24N120），本次更新距离上次发布正式版间隔 28 天。 需要注意的是，因苹果各区域节点服务器配置缓存问题，可能有些地方探测到升级更新的时间略有延迟，一般半小时内，不会太久。Siri AI 更新（国内暂未上线）新增语言：Siri AI 扩展支持法语、日语、韩语、葡萄牙语和西班牙语；此前仅支持英语。应用数据排除：新增 Excluded Apps 设置，可选择哪些应用的数据不能被 Siri、搜索和系统建议访问，增强隐私控制。更精细的文本操作：Siri 的回答支持选择并复制部分文本，而不必复制整段内容。AI 图像与 FaceTimeSynthID 水印识别：照片和 Image Playground 增加 SynthID 支持，可帮助识别由生成式 AI 工具创建或修改的图像。FaceTime 无障碍功能：通话中可添加第三方手语翻译员或实时字幕员，提升听障及手语用户的沟通体验。修复与安装苹果官方发布说明将本次更新概括为“错误修复和安全更新”，并未列出完整的安全漏洞清单。开发者发布说明还提到，从 Safari 打开 3D 对象后，移动对象可能发生意外重新定位，这是该版本已记录的已知问题。在 Vision Pro 上，前往设置 &gt; 通用 &gt; 软件更新即可安装。更新过程中需要取下头显，EyeSight 显示屏上会出现进度条。附 visionOS 27 发布历史：2026-10-20：visionOS 27.2 RC (24N118)2026-1 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
