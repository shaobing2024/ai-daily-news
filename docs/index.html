const DATA = {"date": "2026-08-26", "generatedAt": "2026-08-25T23:21:12Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "NVIDIA 发布机器人计算机 Jetson Orin Nano 2，带来双倍算力或四成节能", "summary": "IT之家 8 月 26 日消息，NVIDIA（英伟达）当地时间 25 日宣布推出面向入门级边缘人工智能的 Jetson Orin Nano 2 机器人计算机。这一产品预计将在 2027H1 以模组及开发套件的形态上市。Jetson Orin Nano 2 采用与 Jetson Orin Nano Super 相同的外形规格，却能提供前代 2 倍的 AI 推理计算能力；而如果将性能控制在前代相同水平，该产品则仅需 15W 功耗，是前代的 60%。其标准模式下 AI 算力达 78 TOPS，集成 8 核 Arm 指令集 CPU 和 8GB 内存，视频处理性能也有显著提升。NVIDIA 机器人与边缘人工智能副总裁 Deepu Talla 表示：当今的中小型前沿模型已达到去年最大前沿模型的精度，为边缘设备解锁了实时智能。Jetson Orin Nano 2 计算机将这一突破带入数百万开发者手中，提供实时推理所需的性能和能效。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/994/303.htm", "publishedAt": "2026-08-25T23:18:40+00:00"}, {"title": "AI 竞赛升温：曝 OpenAI 已预训练 Bel 模型：超 10T 参数，冲击通用人工智能", "summary": "IT之家 8 月 26 日消息，消息源 @synthwavedd 今天（8 月 26 日）在 X 平台发布推文，爆料称 OpenAI 已完成预训练下一代模型，内部代号为 Bel，是 Doug 模型的直接继任者，总产数量超过 10T。消息称 OpenAI 希望将 Bel 模型打造成为 GPT-6 之后的基座模型，甚至冲击通用人工智能（AGI）阈值模型。通用人工智能（Artificial General Intelligence，简称 AGI）是一种假设的智能系统，能够像人一样学习、理解和执行人类能做的任何智力任务。与当前只能处理特定任务的狭义人工智能不同，AGI 具备跨领域的泛化能力、推理能力以及适应未知环境的自我学习能力。IT之家翻译消息源观点如下：这些模型的探索都可能让 Anthropic 感到压力。OpenAI 认为，面对即将公开发布的 Astra，Anthropic 并没有拿得出手的应对方案，据我了解事实也的确如此，主要受算力条件所限。Anthropic 已经做好心理准备，今年余下大部分时间里局势会偏向 OpenAI，但他们相信明年初就能重回领先地位。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/994/296.htm", "publishedAt": "2026-08-25T23:00:23+00:00"}, {"title": "OpenAI 发布适用于 ChatGPT Work 和 Codex 的 Admin 插件，管理员可通过对话管理用户和权限", "summary": "IT之家 8 月 26 日消息，OpenAI 推出了一款全新的 ChatGPT Admin 插件，让工作区管理员可以直接通过对话管理用户和权限、分析使用情况，并根据相关数据生成报告。OpenAI 今日宣布，面向 ChatGPT Work 和 Codex 推出全新的 Admin 管理插件。这项工具允许工作区管理员直接在 ChatGPT 中调整设置、提出问题，并根据工作区的使用情况和活动数据生成报告。OpenAI 表示，通过 Admin 插件，管理员可以直接在 ChatGPT Work 和 Codex 中完成日常管理工作，包括但不限于以下几个方面。首先是了解产品的采用和使用情况。管理员可以查看 ChatGPT Work 和 Codex 的活动数据及额度使用情况，找出哪些团队可能需要进一步支持，并及时发现哪些成员或团队即将达到额度上限。其次是管理成员和群组。管理员可以添加或移除成员、调整群组设置，并处理常规的入职、离职以及团队变动等事务。第三是管理访问权限。管理员能够查看用户的实际权限，排查访问问题，并根据角色或群组控制不同功能和模型的访问权限。此外，Admin 插件还支持管理使用额度和消费申请。管理员可以调整个人、群组以及整个工作区的额度限制，根据当前使用情况审核相关申请，并在掌握完整背景信息的情况下批准或拒绝这些请求。IT之家注意到，在 OpenAI 展示的一段演示中，OpenAI GTM 团队成员 Aarti Bagul 正在准备每月一次的 AI 推广情况评审。她首先询问 ChatGPT Work，过去 30 天内各个团队的产品采用率和额度使用情况发生了哪些变化，随后又要求系统生成图表，突出显示变化最明显的部分。在接下来的演示过程中，她继续分析相关趋势，要求提供更详细的数据拆分和解释，同时审批使用额度申请。最终，她还让 ChatGPT 自动创建了一份演示文稿，并将其直接分享到 Slack 频道。OpenAI 表示，这款新的 Admin 插件可以用于自动化重复性的管理流程，在现有权限控制体系下扩大管理能力，同时也能够为企业内部 IT 运营提供支持。目前，Admin 插件已经上线 ChatGPT Work 的 Plugins 插件目录，管理员可以直接获取并使用。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/994/294.htm", "publishedAt": "2026-08-25T22:55:08+00:00"}, {"title": "NVIDIA DLSS 4.5 光线重建更新实测：提升游戏画面质感的“大杀器”", "summary": "今年 6 月，英伟达在 COMPUTEX 2026 展会上正式发布了 DLSS 4.5 光线重建技术，适用于全部的 GeForce RTX 显卡，该技术可以提升光线追踪、路径追踪场景的画面质量。本次发布的更新采用了第二代 Transformer AI 模型，新模型计算能力提升了 35%，可处理参数量增加 20%，降噪器更强大，空间感知能力更深入，同时性能表现与旧版模型基本持平。新版 RR 模型将于 8 月末推出，屏幕前的各位玩家朋友们是不是已经迫不及待了。IT之家最近提前体验了新的 F 预设 RR 模型，趁此机会给大家简单分享一下新模型在游戏中的实际表现究竟如何。一、测试平台为了展现 DLSS 4.5 光线重建更新对于游戏体验的帮助，并贴合主流玩家硬件水平，本次测试我们统一使用以下硬件平台进行测试。处理器我们选择的是 AMD 锐龙 7 9800X3D，显卡为 16GB GDDR7 显存的 GeForce RTX 5070 Ti；主板是来自七彩虹的 COLORFIRE B850M-MEOW WIFI7 V14，存储部分则是美商海盗船 DDR5 6000MHz C30 32GB*2 内存套条 + 三星 990 Pro 固态硬盘（1TB 和 4TB）。系统方面，我们选择了最新的 Windows 11 25H2 版本，并进行了全新安装。GeForce Game Ready 的驱动版本和大家一样，也是最新的 610.88 版本，不过体验新的 F 模型预设需要使用命令行工具额外导入，NVIDIA App 版本也更新至最新正式版。二、游戏实测由于这次更新的新模型，在性能表现上与旧模型几乎一致，因此我们的测试重点主要在游戏画面的对比上。首先，大家需要在 NVIDIA App 中找到支持 DLSS 4.5 新 RR 模型的游戏，在 DLSS 优设-模型预设里从使用全局（默认）切换到自定义，然后在光线重建选项中找到并选择预设 F 模型，最后重新进入游戏，才能在游戏中生效。本次测试，我们主要对比关闭光线重建、DLSS 4 光线重建以及 DLSS 4.5 光线重建的游戏画面，其中 DLSS 4 光线重建会选择全局默认模式或者老模型预设 D 进行测试。1、《生化危机：安魂曲》第一款游戏我们选择了 DLSS 4.5 光线重建新模型效果最为明显的《生化危机：安魂曲》，游戏本身在开启路径追踪选项下的画面差距就非常大，本次更新后，游戏在雨天积水效果、玻璃反射和物体细节清晰度上均有提升。先说一下画面设置，游戏的画面分辨率选择 4K，光线追踪选项设置为开启 / 关闭路径追踪。图形质量部分全部选择高档位，开启所有效果，纹理过滤质量设置为高（各向异性 x8）。超分辨率质量部分选择 NVIDIA DLSS，超分辨率选择质量，帧生成选择 3 倍，Reflex 低延迟选择开启 + 增强。光影质量部分选择全高设置，开启所有特效选项。左：DLSS 光线追踪-高；中：DLSS 4 光线重建 + 路径追踪；右：DLSS 4.5 第二代 Transformer 模型的光线重建 + 路径追踪游戏开头结束过场 CG 后，有一段女主前往调查地的线性探索场景，刚好是经典的雨天，无论是光影还是氛围感都直接拉满。刚踏入这段旅程的开始，小编就注意到 RR 新模型 F 预设的一个重要提升。在不放大截图画面的情况下，关闭路径光追和开启路径光追的区别基本体现在暖光反射的还原上，左侧只开启光线追踪的画面完全是冷色调，连高处悬挂的明亮广告牌左侧墙体光照反射都可以忽略不计，而中间和右侧在开启路径追踪后，整体色调更暖，尤其是地面和墙上的光照反射都很明显。左：DLSS 光线追踪-高；中：DLSS 4 光线重建 + 路径追踪；右：DLSS 4.5 第二代 Transformer 模型的光线重建 + 路径追踪那么 DLSS 4.5 新模型的提升在哪儿呢？放大看这里的积水，关闭路径追踪时，积水效果很假，就像是还没有清理、已经被污染的碎冰渣一样，着实有点用力过猛。开启路径光追后，又迎来了一个新问题，路面积水大幅削弱，根本没有雨天的氛围，这个问题其实在 DLSS 4 老模型上非常普遍，小编在测试《007 初露锋芒》、《逆水寒手游》等游戏时就注意到，雨天水面的积水非常朦胧，只能看出是潮湿的地面，根本没有形成积水，雨滴落地的效果就像是硬生生在水泥地上泛起涟漪，然后直接渗入地下一样。而在开启 DLSS 4.5 RR 新模型后，雨天积水效果真实了不少，雨水滴落在水洼的力度和涟漪效果更加拟真，积水洼不停被雨滴落下砸出的小水坑也非常还原，不过这部分毕竟属于动态物理效果，放大后的清晰度还有进步空间。左：DLSS 光线追踪-高；中：DLSS 4 光线重建 + 路径追踪；右：DLSS 4.5 第二代 Transformer 模型的光线重建 + 路径追踪第二个场景是街边的橱窗，仅开启光线追踪时前面的灯管亮度明显过曝，后面的橱窗玻璃完全没有光线反射效果，直接一片漆黑。而开启路径追踪后，橱窗玻璃的反射效果被正确还原，无论是广告文字牌还是焦点反射都非常真实，窗帘和右侧悬挂的小牌子也不再漆黑一片。左：DLSS 光线追踪-高；中：DLSS 4 光线重建 + 路径追踪；右：DLSS 4.5 第二代 Transformer 模型的光线重建 + 路径追踪进一步放大会发现，在 DLSS 4.5 新模型下前面灯柱的清晰度明显提升，反射在玻璃橱窗上的倒影也最明显，并且商店对面的红色广告牌反光也是最完整、最清晰。这就是 F 预设模型的第一个特性，提升反射效果和细节质量，让透明物体成像更加稳定，同时减少画面噪点。左：DLSS 光线追踪-高；中：DLSS 4 光线重建 + 路径追踪；右：DLSS 4.5 第二代 Transformer 模型的光线重建 + 路径追踪不只是透明玻璃的反射细节提升，有色玻璃的提升同样非常明显。在这组汽车玻璃的场景中，关闭路径追踪时画面整体发白，车身上的伪噪点最多，车窗玻璃反射的广告灯牌亮度最低、最暗淡，下方更小的物体反射基本看不清。DLSS 4 老模型即便有路径追踪加持，表现依旧不够理想，整体光线和亮度做了修正，噪点数量明显减少，但车灯和上方车身的反射高光丢失了部分细节，整体发虚；广告灯牌的反射亮度正常了，但更小物体的反射积块挤成一团，反射轮廓反而不如关闭路径追踪下清楚。RR 新模型 F 预设下的车窗玻璃反射比较清楚，已经能分辨出右侧车窗上的灯牌文字了，而左侧对于巷道顶部天空的反射也更加还原，能分辨出是什么场景。车窗和车身反射的高光细节也最丰富、最饱满。左：DLSS 光线追踪-高；中：DLSS 4 光线重建 + 路径追踪；右：DLSS 4.5 第二代 Transformer 模型的光线重建 + 路径追踪再看最后一组电话亭的对比，由于玻璃部分采用了做旧处理，因此反射效果是不如上面的透明玻璃和车窗玻璃的。不过，三者的区别依旧不小，关闭路径追踪下电话亭玻璃几乎没有看到反光物体；开启路径追踪时还是能清楚看到对面摊子和背后卷闸门的倒影。其次就是电话亭的细节表现，出乎意料的是 DLSS 4 旧模型表现最差，整体的污渍划痕和顶部的铁锈细节最少、画面最糊，还有封印黄色胶条的褶皱纹理也最淡，甚至不如关闭路径追踪下的表现，算法缺陷比较明显；RR 新模型 F 预设整体细节最丰富，最清晰，也最锐利。短短一分钟都不到的线性探索场景，就能看出这么多提升，RR 新模型对于物体反射的改进不可谓不大。2、《识质存在》《识质存在》作为一款科幻射击题材的游戏作品，玩家大部分时间都身处空间站室内环境，因此在光照效果的比重上，全局光照、激光效果、全息投影以及空间反射的部分更大。其中，全局光照和空间反射部分，DLSS 4 光线重建就已经有了不错的效果，这次 RR 新模型 F 预设的主要提升在于激光效果和全息投影上。依旧交代一下游戏画面设置，分辨率选择 4K，开启光线追踪，开启 / 关闭路径追踪，DLSS 超分选择质量档，DLSS 插帧选择 3 倍帧生成。画面特效部分基本为全高，网格质量选最高，Reflex 低延迟选择开启 + 增强。关闭动态模糊、镜头光晕、镜头畸变、景深以及垂直同步等效果选项。左：DLSS 光线追踪-高；中：DLSS 4 光线重建 + 路径追踪；右：DLSS 4.5 第二代 Transformer 模型的光线重建 + 路径追踪先看这个常亮的激光幕束，关闭路径追踪时激光光束线条最平，动态小光条的闪烁最不明显，地面也完全没有激光反射倒影；DLSS 4 路径追踪下，动态小光条的呈现更加立体清晰，地面也有了不错的倒影表现，但是激光生成时并不是连续的直线，而是不停闪烁中间粗两边细的小光条连续闪烁变化，玩家肉眼感知到的动态变化就是线条粗细不均，闪烁速度和响应时间间隔长短。这方面 RR 新模型 F 预设的激光闪烁速度最快，响应时间最短，这点从倒影部分激光的“断线”程度就能看出来。左：DLSS 光线追踪-高；中：DLSS 4 光线重建 + 路径追踪；右：DLSS 4.5 第二代 Transformer 模型的光线重建 + 路径追踪对于非常亮、非固定位置的移动激光，区别则体现在激光光束消失时的过渡和残影回收表现。关闭路径追踪时激光直接瞬间消失，而且没有残影；DLSS 4 路径光追下，激光消失阶段会留下明显的残影，消失需要 1s-2s 的时间；而开启 RR 新模型 F 预设后，激光“消失”得更快，但没有完全消失，仔细看还是能在浅色背景处找到细微的残影痕迹。左：DLSS 光线追踪-高；中：DLSS 4 光线重建 + 路径追踪；右：DLSS 4.5 第二代 Transformer 模型的光线重建 + 路径追踪全息投影方面，主要提升的是探索过程中短暂出现的投影，比如这里的剧情小投影。在关闭路径追踪时，投影的粒子效果比较粗糙，人物更加“透明”，噪点比较密集；DLSS 4 路径追踪下，人物更有立体感，粒子噪点明显减少，但身上出现了如磨砂玻璃表面一般凹凸不平的纹理，并且褶皱边缘的毛刺较多；而 RR 新模型 F 预设下，全息投影的亮度和清晰度更扎实，衣服布料褶皱更自然、整体纹理更平滑、毛刺更少。不过负面效果也是有的，那就是手部的动态抖动更快更明显，因此截图中手部的变形最严重，不过在游戏中玩家接受的是连贯动态画面，因此视觉影响比较有限。从《识质存在》游戏的表现来看，DLSS 4.5 光线重建的第二个特性也很实用，对于粒子和光线特效多的游戏，新模型进一步提升了特效的光照响应效果、动态细节真实性和模型精细度，对于类似《星球大战》系列、《地平线》系列这类光污染和特效多的游戏而言，今后的新作可以充分利用这些特性，将游戏的视觉效果带向新的高度。3、《心灵杀手 2》最后这款游戏《心灵杀手 2》的画面整体更偏写实，虽然题材是超自然现实和恐怖悬疑，但游戏中很多场景的建模细节和光照表现都很仿真。因此，复杂光照下的物体阴影和表现材质纹理，就成了 RR 新模型的提升重点。照例先交代画面设置，显示部分的游戏分辨率选择 4K，开启 DLSS 均衡档和 DLSS 2X 帧生成，效果部分关闭动态模糊和镜头扭曲效果，仅保留胶片颗粒。质量部分选择全高，并非高档位预设。光线追踪部分选择极致档光线追踪，开启或关闭 DLSS 光线重建，其它选项一律选择极致。左：DLSS 光线追踪-高；中：DLSS 4 光线重建 + 路径追踪；右：DLSS 4.5 第二代 Transformer 模型的光线重建 + 路径追踪在这个室内场景中，关闭路径追踪时的墙面颜色最白，台灯投影最浅；DLSS 4 路径追踪下墙面纹理最糊，女主衣服褶皱细节最少、印记最浅、卷马尾也有点虚影，不够清晰；RR 新模型 F 预设下，墙面纹理最清晰，台灯投影更真实，女主衣服褶皱细节最多，层次感最强，卷马尾线条更加锐利清楚。左：DLSS 光线追踪-高；中：DLSS 4 光线重建 + 路径追踪；右：DLSS 4.5 第二代 Transformer 模型的光线重建 + 路径追踪左：DLSS 光线追踪-高；中：DLSS 4 光线重建 + 路径追踪；右：DLSS 4.5 第二代 Transformer 模型的光线重建 + 路径追踪继续观察木柱反光和桌子前侧木头细节，也是 RR 新模型 F 预设的反光最自然，木柱纹理细节最多，桌子前侧木纹细节更丰富。左：DLSS 光线追踪-高；中：DLSS 4 光线重建 + 路径追踪；右：DLSS 4.5 第二代 Transformer 模型的光线重建 + 路径追踪挪动视角至左侧吧台处，关闭路径追踪时吧台柜上的椅腿投影最浅、层次最平，且地板上出现了不自然的反射，看上去显脏，路径追踪下就没有这个问题。另外，女主身上背的猎枪也有虚影，不够清楚。DLSS 4 路径追踪下吧台柜的投影更立体但氛围感还是差了一点；RR 新模型 F 预设的吧台柜颜色和细节对比度更高、锐度更强，椅腿投影最立体，而且地板反光也更为柔和。相比前两款游戏，《心灵杀手 2》的 RR 新模型提升感觉没有那么直观和具体，不过打开新模型后确实能感受出整体光照下，物体阴影和表面细节更加自然和真实。三、总结今年IT之家实测了多款游戏的 NVIDIA DLSS 新技术升级，从 DLSS 4 性能翻倍的 4 倍帧生成，到 DLSS 4.5 突破上限的六倍动态多帧生成，再到全新升级的光线重建模型，英伟达始终以颠覆性的技术迭代，刷新着玩家既有显卡硬件的性能和画面表现，让老旧硬件持续解锁全新画质与帧率上限，年轻的新生代玩家“吃的是真好”，着实令人羡慕。入局 AI 时代，英伟达的前瞻眼界，让其足够敏锐地抓住了机遇，将 DLSS 技术不断迭代，让用户手里的硬件不停焕发新的活力，持续“战未来”，不用频繁换新显卡，就能持续畅享极致流畅、高清沉浸式的游戏体验，感受最纯粹的游戏快乐。或许这就是 AI 赋能游戏技术的终极魅力：以持续的技术革新，让硬件不断重生，让热爱生生不息。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/994/261.htm", "publishedAt": "2026-08-25T15:30:14+00:00"}, {"title": "OpenAI 秀肌肉，与博通共研的 Jalapeño 芯片将向英伟达 GB300 发起挑战", "summary": "IT之家 8 月 25 日消息，OpenAI 今天（25 日）晚间在 Hot Chips 大会上公布了全新推理系统 Jalapeño 的更多细节，并首次披露基准测试成绩。在 SemiAnalysis 的 InferenceX 测试中，Jalapeño 无论是单用户 token 处理量，还是每千瓦吞吐量，都超过了目前市面上的顶尖推理处理器。OpenAI 硬件负责人理查德 · 何在媒体电话会上表示：“测试结果最重要的一点，是 Jalapeño 相比目前最先进的产品实现了非常显著的性能提升。它可以用相同的电力处理更多 AI 工作负载，同时更快给出响应。Jalapeño 既适合高效服务大量用户，也能保持很低的延迟。”Jalapeño 由 OpenAI 与博通共同开发，OpenAI 自有模型也参与了研发。OpenAI 希望把 Jalapeño 发展成一个能够延续多代的技术平台，使 AI 产品、模型、芯片和内存从一开始就协同设计。这款芯片主要负责 AI 推理，也就是让已经训练好的 AI 模型真正运行起来，完成任务或驱动 AI 智能体。OpenAI 使用 InferenceX 平台测试 Jalapeño 的推理性能，并与英伟达 GB200 和 GB300 超级芯片系统进行比较。OpenAI 称，在 GPT-OSS 120B、DeepSeek R1 和 Kimi K2.5 1T 三个模型上，Jalapeño 每瓦能够完成的 AI 工作量是对比系统的 1.5 至 1.9 倍，端到端延迟则约为对比系统的 28% 至 59%。全栈协同开发也让 OpenAI 能够直接优化推理过程中最容易拖慢速度的环节。Jalapeño 重点降低预填充和通信阶段的延迟，而这两个环节在 OpenAI 看来往往是推理性能的主要瓶颈。OpenAI 在公布测试结果的博客文章中提到，Jalapeño 从设计之初就尽量减少数据搬运和通信延迟。生成响应时使用的 KV 缓存等模型状态可以明确存放并保留在本地，系统再根据不同推理阶段，调配合适的计算、内存和网络资源。据IT之家了解，OpenAI 计划在今年年底前先“小规模”部署 Jalapeño，2027 年再逐步扩大部署量，但没有公布明年具体会投入多少芯片。参考OpenAI 官方稿件：Jalapeño’s first results show industry-leading speed and efficiency in AI inference", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/994/253.htm", "publishedAt": "2026-08-25T14:53:05+00:00"}, {"title": "基于下一代 Qwen4 架构所构建的多模态 MoE 模型，阿里千问预告明晚开源 Qwen3.8-Flash-Next", "summary": "IT之家 8 月 25 日消息，魔搭社区（ModelScope）显示，阿里千问 Qwen3.8-Flash-Nex 功能更新。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/994/295.htm", "publishedAt": "2026-08-25T22:59:38+00:00"}, {"title": "华为 MatePad Pro 13.2 英寸 2023 款等平板推送 HarmonyOS 6.1.0.135 升级，AI 修图沾色功能增强", "summary": "IT之家 8 月 25 日消息，华为 MatePad Pro 13.2 英寸 2023 款等旧款平板今日推送了鸿蒙 HarmonyOS 6.1.0.135 版本升级，系统包大小约 2.75GB。据介绍，本次更新图库 AI 修图中的沾色功能进一步增强，同时新增预置应用“教育空间”。▲ IT之家开箱：华为 MatePad Pro 13.2 英寸「罗兰紫」图赏IT之家附华为 MatePad Pro 13.2 英寸 2023 款等平板此次更新内容如下：图库AI 沾色支持为逆光人物图一键生成剪影效果，在复刻色调的同时，增强人物光影对比，让您的图片更有氛围感（图库编辑 &gt; AI 修图 &gt; 沾色）。应用1.新增预置应用“教育空间”，专为孩子打造的专属纯净学习空间，配备系统化家长守护机制，整合一站式体系化教育资源，护航孩子的学习成长。2.优化部分应用的使用体验。系统1.优化部分场景的系统稳定性。2.优化部分场景的使用体验。安全合入 2026 年 7 月安全补丁，增强系统安全。系统重要补丁亲爱的用户，本次更新优化了部分场景的系统稳定性，推荐您进行更新。华为目前常采用分批的方式进行升级推送，未收到更新的用户需继续等待。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/994/250.htm", "publishedAt": "2026-08-25T14:44:50+00:00"}, {"title": "苹果全新 Mac mini 首次支持 Genlock，通过 USB-C 实现显示器、摄像头精准同步", "summary": "IT之家 8 月 25 日消息，今天（25 日）晚间，苹果正式发布全新 Mac mini 便携式主机，搭载 M6 芯片的 Mac mini 价格为 6999 元起，教育版售价为 6199 元；搭载 M5 Pro 的 Mac mini 售价 12999 元起（15 核 CPU+16 核 GPU），教育版售价为 12199 元起。苹果官方的新闻稿显示，全新 Mac mini 首次支持 Genlock 技术，可通过 USB-C 连接实现显示器与摄像头（包括 iPhone 17 Pro 摄像头）之间的精准同步。据IT之家了解，苹果在 iPhone 17 Pro 与 iPhone 17 Pro Max 上加入了 Genlock 功能，让多台摄像设备支持极高精度的视频同步，方便实现多机位拍摄及虚拟制作。Genlock（同步锁相）是用于多机位视频拍摄的同步技术，通过统一信号锁定所有摄像机的帧时间，实现精确对齐，避免画面不同步。苹果全球营销高级副总裁 Greg Joswiak 表示，Genlock 能让多机位或带有屏幕图形的拍摄快速实现精准过渡，无需逐帧手动对齐，并可支持“子弹时间”等电影特效。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/994/248.htm", "publishedAt": "2026-08-25T14:32:32+00:00"}, {"title": "刚刚，新款 Mac mini 发布！价格大涨2500元，苹果第一次为 AI 造电脑", "summary": "一台 Mac ，同时为 AI 和人类服务#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1676537?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-08-25T13:10:31+00:00"}, {"title": "QQ 宠物靠 AI 在手机复活，可我更想要一只桌宠企鹅", "summary": "下线 8 年的 QQ 宠物，这几天居然在手机 QQ 上官宣回归了。#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceNam const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
