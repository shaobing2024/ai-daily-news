const DATA = {"date": "2026-10-02", "generatedAt": "2026-10-02T01:57:09Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "腾讯 WorkBuddy：Hy4 preview 夜间限免、Hy3 限免延期至 10 月 31 日", "summary": "IT之家 10 月 2 日消息，腾讯 WorkBuddy 于 9 月 30 日晚宣布，决定将 Hy3 模型限免及 Hy4 preview 模型夜间限免均延期至 10 月 31 日。如果用户已经体验过 Hy4 preview —— WorkBuddy 在闲时夜间 (23:00 - 次日 8:00) 继续提供免费体验 Hy4 preview 的模型额度，截止 10 月 31 日，其余时间正常消耗积分使用。如果用户暂未体验过 Hy4 preview —— 只要在 10 月 10 日 23:59 前首次开启 Hy4 preview 对话，从首次开启那天算起，往后 14 天都有每日免费额度。（举例：10 月 10 日首次开启，免费额度用到 10 月 24 日）IT之家注意到，官方此前曾发布公告说明，Hy4 preview 是一个大语言模型，暂不具备多模态能力；当用户调用 Hy4 preview 执行视频、图像等生成任务时，会切换到相应多模态模型完成，因此会按照正常规则产生积分消耗。此外，因免费体验参与热度太高，为保障每位用户都能顺畅使用，官方对每日免费额度做了合理分配；当日资源繁忙时会进入排队，会在页面提示重置时间恢复。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/222.htm", "publishedAt": "2026-10-02T01:27:21+00:00"}, {"title": "英伟达黄仁勋将出席：微软预热本月 Surface 发布会，聚焦本地 AI 重塑下一代 PC", "summary": "IT之家 10 月 2 日消息，微软官方开发者账号 @windowsdev 今天（10 月 2 日）在 X 平台发布推文，宣布将于太平洋时间 10 月 7 日上午 10 点（北京时间 10 月 8 日凌晨 1 点）举办一场面向开发者与构建者的线上活动。IT之家曾于 9 月 16 日报道，微软宣布将在美国旧金山举办本次活动，主题为本地人工智能如何塑造 PC 的下一阶段，预估展示 Windows 和 Surface 设备的未来规划。而最新预告中，微软表示将会携手英伟达公司，介绍 RTX Spark 的新体验，并为开发者和 Builder 带来更多工具和功能等。RTX Spark 是 NVIDIA 为 Windows 轻薄本和小型台式机打造的“超级芯片”（superchip）平台，把 NVIDIA 的 Grace Arm CPU 与 Blackwell 架构的 RTX GPU 封装在同一芯片 / 基板上，通过 NVLink‑C2C 高速互连，并采用统一内存架构，让 CPU 与 GPU 共享同一块高速 LPDDR5X 内存池。根据目前曝光的信息，本次活动聚焦本地端侧 AI，主题聚焦“本地 AI 如何塑造下一代 PC”。在产品方面，微软预计将公布 Surface Laptop Ultra 更多细节，包括搭载 NVIDIA RTX Spark、最高 128GB 统一内存、完整 CUDA 支持，并可在本地运行最高 1,200 亿参数的 AI 模型。在出席人员方面，除了微软首席执行官萨提亚 · 纳德拉（Satya Nadella）、Windows 和 Surface 负责人帕万 · 达武鲁里（Pavan Davuluri）之外，英伟达首席执行官黄仁勋也受邀参与本次活动。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/212.htm", "publishedAt": "2026-10-02T00:53:03+00:00"}, {"title": "苹果首款 AI 智能安防摄像头曝光：金属圆柱造型，不录视频、仅推送文本提醒", "summary": "IT之家 10 月 2 日消息，在首期 Power On 播客节目中，彭博社的马克 · 古尔曼（Mark Gurman）爆料称，苹果正筹备推出家用智能摄像头（代号为 J450），将配套协同苹果首款智能家居中枢（Home Hub）工作。外观方面，J450 采用金属圆柱体，看起来像是“巨型金属润唇膏”，其摄像头将以低帧率运行，依赖 AI 模型分析周围环境。在隐私方面，IT之家援引博文介绍，该产品定位并非传统监控录像设备，不会向用户提供或保存可回看的视频，通过 AI 分析低帧率画面后发送文字描述。设备将集成面部识别能力，可判断何人进入房间或离开住宅。同时，系统支持识别宠物活动，并向用户推送相应文字提醒。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/208.htm", "publishedAt": "2026-10-02T00:34:07+00:00"}, {"title": "加州检察长向 OpenAI 发出传票，调查 AI 网络安全风险", "summary": "IT之家 10 月 2 日消息，据路透社今天（2 日）凌晨报道，加利福尼亚州总检察长罗布 · 邦塔办公室宣布，邦塔本人已向 OpenAI 发出调查传票，要求其就 AI 模型涉及的网络安全事件和风险提供更多信息。邦塔上个月宣布，加州司法部已就“Hugging Face 事件”正式展开调查。随着 AI 行业面临更严格的审视，该事件受到持续关注。今年早些时候，OpenAI 开发的 AI 智能体入侵开源平台 Hugging Face，取得了后者部分基础设施的访问权限，也暴露出能力越来越强的 AI 系统可能带来的网络安全风险。邦塔在声明中说：“我的办公室正在就 OpenAI 及其 AI 模型涉及的网络安全事件和风险，向 OpenAI 进一步了解情况。”他同时警告，开发者如果不能确保 AI 模型不会发动或协助网络攻击，可能面临法律追责。OpenAI 没有立即回应路透社的置评请求。美国联邦贸易委员会同时也在调查 Anthropic、OpenAI 等 AI 实验室，范围覆盖整个行业，目的是查明这些公司的技术可能给消费者带来哪些风险。当地时间 1 日，一名美国联邦贸易委员会高级官员告诉路透社，这是美国首次针对失控 AI 智能体采取正式执法行动。艾奥瓦州总检察长布伦娜 · 伯德还牵头组成了一个由 15 个州总检察长参加的联盟，就 Hugging Face 遭入侵一事要求 OpenAI 提供信息，参与州包括阿拉巴马州、阿肯色州、得克萨斯州和犹他州。据IT之家了解，OpenAI 和 Anthropic 还在调查多起旗下 AI 智能体入侵企业和政府系统的事件。相关阅读：《曝美国联邦贸易委员会对 Anthropic、OpenAI 及其他 AI 实验室加大调查力度》《消息称 OpenAI、Anthropic 正调查数万起 AI 安全事件》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/204.htm", "publishedAt": "2026-10-02T00:06:15+00:00"}, {"title": "OpenAI 上线“虚拟试穿”功能：ChatGPT 能帮你试衣，还能找“明星同款”", "summary": "IT之家 10 月 2 日消息，当地时间 1 日，OpenAI 再次扩展 ChatGPT 的购物能力。公司宣布在全球推出两项新功能，一项是让用户虚拟试穿服装和配饰，另一项是新增收藏功能，方便用户先把看中的商品存起来，之后再查看。据IT之家了解，新功能基于不久前推出的 ChatGPT Images 2.5 模型。按照 OpenAI 的说法，这一模型生成的画面光线更自然、纹理更丰富，执行编辑指令也更稳定，同时还能缩短生成图片所需时间。ChatGPT 用户可以上传自拍照或全身照，查看某件服装或配饰穿在自己身上的效果，ChatGPT 的购物结果页面会新增一个“试穿”按钮。用户还可以上传商品图片，再让 ChatGPT 模拟试穿效果。另一项新功能是“收藏”。用户可以把发现的商品存入应用内的资料库，方便之后回看。OpenAI 还提到，这些商品会和试穿图片保存在一起。OpenAI 还宣布，ChatGPT 在购物上不只这几种用法。比如，用户可以先描述自己想尝试的穿衣风格，再让 ChatGPT 去挑出完成整套造型所需的单品；也可以上传名人的穿搭照片，让 ChatGPT 找出他们身上穿的、可以买到的商品。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/197.htm", "publishedAt": "2026-10-01T23:18:01+00:00"}, {"title": "流式转录 AI 新标杆：微软 MAI-Transcribe-2-Streaming 登场，2.5% 词错误率、0.13 秒延迟夺冠", "summary": "IT之家 10 月 2 日消息，微软昨日（10 月 1 日）发布公告，宣布推出其首个实时流式语音转写模型 MAI‑Transcribe‑2‑Streaming，可在讲话进行时持续输出文字，覆盖 60 种语言，并支持自动语言检测。费用方面，MAI‑Transcribe‑2‑Streaming 模型目前处于优惠阶段，价格为每小时 0.54 美元（IT之家注：现汇率约合 3.6 元人民币），约合每 1,000 分钟 9 美元（现汇率约合 60.5 元人民币），开发者可以通过 Microsoft Foundry、MAI Playground、OpenRouter 等渠道体验或接入。IT之家注，微软此前已推出非流式的 MAI‑Transcribe‑2，在 Azure Speech 公共预览阶段的价格为每小时 0.10 美元（现汇率约合 0.67 元人民币）。流式“Streaming”是实时返回相关结果，适合实时对话和字幕；而非流式是处理完成后一次性返回，适合录音文件、会议记录和临床文书等完整转写任务。延迟方面，MAI-Transcribe-2-Streaming 会在接收到音频后约 100 多毫秒内生成首批“部分文本”，随后根据更多上下文持续修正，并在语句结束后快速提交稳定结果。微软称，在其实时评估中，文字最快可在语音出现后约 320 毫秒显示；在 Artificial Analysis 的测试中，模型最终转录延迟为 0.13 秒，最终词错误率为 2.50%，位列 28 个流式语音转文字模型之首。在实际体验方面，语音应用无需等到用户说完一句话，就可以提前理解意图、启动推理或调用工具。例如，客服智能体可以在来电者尚未说完时开始识别问题，实时字幕系统也能更接近“所说即所见”的体验。功能方面，MAI-Transcribe-2-Streaming 支持 60 种语言，并具备自动、连续的语言检测能力。用户无需在会话开始前手动指定语言，系统可以根据语音内容识别语言变化。跑分方面，在 Artificial Analysis 于 9 月 28 日公布的流式语音转文字排行榜中，MAI-Transcribe-2-Streaming 的最终词错误率为 2.50%，低于 Grok Voice Transcribe 2.0 Streaming 的 2.73% 和 ElevenLabs Scribe v2 Realtime 的 3.59%。微软同时强调，该模型在最终转录和首次部分转录两个指标上均排名第一。相关阅读：《微软最强转录 AI 模型：MAI-Transcribe-2 登场，60 语种平均词错误率 5.2%》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/183.htm", "publishedAt": "2026-10-01T23:04:38+00:00"}, {"title": "因违反敏感信息访问和共享规定，OpenAI 与三名研究人员终止合作", "summary": "IT之家 10 月 2 日消息，当地时间 1 日，根据《华尔街日报》报道，OpenAI 宣布与三名研究人员终止合作，原因是三人违反了敏感信息访问和共享规定。OpenAI 发言人在声明中说：“我们已与三名违反公司敏感信息访问和处理规定的人员解除关系。调查确认，这些人员绕过公司既定流程，不当处理敏感信息，不仅违反了公司规定，也破坏了我们工作所必需的信任。”三人名叫贾斯敏 · 王、托梅克 · 科尔巴克和米基塔 · 巴莱斯尼。遭解雇的托梅克 · 科尔巴克是 OpenAI 安全团队成员。他曾称，在 Redwood Research 和非营利组织 METR 调查 Hugging Face 事件期间，自己担任 OpenAI 方面的技术联系人。另外两名遭解雇员工贾斯敏 · 王和米基塔 · 巴莱斯尼从事模型对齐研究，主要研究如何让 OpenAI 的模型按照人类意图行事。据IT之家了解，涉事员工被指将公司机密信息提供给一家第三方 AI 安全机构。此前，OpenAI 披露，失控的智能体突破了一个原本禁止联网的安全测试环境，随后入侵 Hugging Face。OpenAI 近期还称，公司支持由独立机构评估安全论证，这一做法在业内得到越来越多支持。“我们致力于支持独立评估，并向评估人员开放训练、评测和部署等环节的深度访问权限。评估人员应当能够借此质疑我们的假设，找出我们可能遗漏的风险，并独立判断我们的防护措施是否有效。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/182.htm", "publishedAt": "2026-10-01T23:04:22+00:00"}, {"title": "谷歌Gemini 4突然发布！RSI加持，GPT和Opus都让让", "summary": "价格只有Astra一半", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/10/499663.html", "publishedAt": "2026-10-01T15:02:14+00:00"}, {"title": "华为 Mate XT 2 三折叠手机获 HarmonyOS 7.0.0.109 SP8 升级，通信共享升级支持多人互助共享", "summary": "IT之家 10 月 1 日消息，在今天的华为 Mate 90 系列及全场景新品发布会结束后，Mate XT 2 非凡大师三折叠手机迎来了一次系统更新。更新日志显示，新版本锁屏新增 3D 空间壁纸、通信共享支持多人互助通信共享等功能。IT之家附完整更新日志如下：亮点推荐新增 3D 空间壁纸功能，通过照片中的元素与景深时钟、透视时钟巧妙结合，打造空间感锁屏壁纸，为您提供丰富的壁纸视觉效果和玩法（设置 &gt; 桌面和个性化 &gt; 壁纸 &gt; 3D 空间壁纸）多设备协同通信共享功能再升级，手机与搭载 HarmonyOS 7 的手机、平板、鸿蒙电脑之间支持多人互助通信共享，通过碰一碰或者登录同一华为账号共享网络建立互助网络，在移动网络信号弱或网络负载大等场景下可获得更快、更稳的网络体验图库静态 / 动态照片皆可生成 3D 动态照片，可添加多种空间运镜效果，解锁全新视角（图库内选择某照片进入大图 &gt; 点击右上角 3D 动态照片图标）设置深色模式支持随日出日落自动切换（设置 &gt; 显示和亮度 &gt; 深色模式 &gt; 日出日落）相机1.优化拍照色彩表现，照片色彩更自然2.优化拍照亮度表现，提升暗光环境下拍摄体验3.优化长焦、夜景等场景下拍摄效果，提升成像质量4.优化相机稳定性和部分界面显示效果，提升使用体验桌面和个性化系统熄屏显示新增熄屏循迹导航功能，开启后，可在熄屏显示界面显示“地图”等部分应用循迹导航信息（设置 &gt; 桌面和个性化 &gt; 熄屏显示设置 &gt; 熄屏循迹导航）小艺优化多模态基础大模型推理速度，进一步提升天气摘要、小艺帮接、文本润色等智能功能的使用体验（温馨提醒：由于涉及到大模型更新，本次更新包体积较大）系统1.优化部分游戏的帧率，提升游戏流畅性2.优化部分第三方应用的使用体验3.优化整机系统稳定性，让您的设备运行更稳定系统扩展特性对系统扩展特性进行同步更新，增强特性功能，提升用户体验。需要注意的是，华为鸿蒙 HarmonyOS 系统常采取分批方式进行推送，未收到推送需继续等待。部分用户有快速升级的需求，可以通过“设置-软件更新-检查更新”尝试下载版本进行升级。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/160.htm", "publishedAt": "2026-10-01T14:23:44+00:00"}, {"title": "刚刚，Gemini 4 Argon 发布：多项基测碾压 GPT-6 Astra，已参与谷歌 80 万行内核代码迁移", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/vVrSzjhEvkmpevS7wZzU?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-01T11:00:00+00:00"}, {"title": "Gemini 4 正式发布，我们终于有了一个写作强于代码的前沿模型", "summary": "跑分不可思议，能力谨慎怀疑#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1682765?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-10-01T00:31:33+00 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
