const DATA = {"date": "2026-09-18", "generatedAt": "2026-09-18T00:58:34Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "华为开创 Peerium 计算架构：突破传统图灵范式与冯 · 诺依曼单机架构的限制，让百万处理器协同成为一台计算机", "summary": "IT之家 9 月 18 日消息，华为 9 月 17 日在上海发布 AI 时代的全新计算架构 Peerium，称该架构可实现百万级处理器作为一台计算机协同工作，以满足持续增长的 AI 算力需求。华为介绍称，Peerium 计算架构基于嵌套并行、统一内存寻址和平等互联，实现百万级处理器的强扩展能力。该架构提出 Nested BSP（IT之家注：嵌套批量同步并行，一种将并行计算任务分层递归组织的计算范式），突破了传统图灵范式与冯 · 诺依曼单机架构的限制。华为表示，Peerium 架构颠覆了长久以来的主从架构。冯 · 诺依曼体系结构要求计算机按程序顺序执行，运算器、控制器、存储器、输入与输出系统各司其职，主从关系贯穿其中。其中，灵衢是实现 Peerium 架构的关键互联技术。华为介绍称，灵衢基于一个开放协议，可无限扩展地联接 CPU、NPU、内存、SSD、网卡和交换机，实现计算、存储与网络的平等互联。Atlas 950 超节点是 Peerium 计算架构的首代产品。华为称，25.6 万卡 Atlas 950 超节点集群已在部署中，基于 NPO 的 Atlas 960 系统正在测试中。华为轮值董事长徐直军表示：“AI 时代，华为基于开创的 Peerium 计算架构，持续打造满足客户训练和推理需求的超节点和集群，让算力无处不在，让智能无所不及。”相关阅读：《华为徐直军谈鸿蒙生态临界点：突破 1 亿用户就如同核裂变“临界质量”或者飞机起飞“离地速度”》《徐直军：华为用国产芯片、鸿蒙生态实现了国内市场出货份额的第一》《华为轮值董事长汪涛：华为 AI 战略的核心是算力，坚持硬件变现》《华为轮值董事长汪涛：昇腾 960 芯片将提前至 2027 年 Q1 发布，实现性能翻番》《华为打造业界首个采用 NPO 技术的超节点，汪涛宣布 openEuler 成为中国服务器操作系统份额第一》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/003/910.htm", "publishedAt": "2026-09-18T00:31:55+00:00"}, {"title": "微软及 OpenAI 内部文件曝光：高管曾警告 AI 可能对新闻机构产生“毁灭性影响”", "summary": "IT之家 9 月 18 日消息，随着美国《纽约时报》等新闻机构持续推进就微软、OpenAI 之间针对训练数据版权问题的诉讼，微软和 OpenAI 内部一批此前被标记为机密的文件现已正式公开，其中展示了微软和 OpenAI 内部员工对 AI 影响的担忧。其中，微软应用科学部门主管 Brent Hecht 曾在内部文件中警告，将新闻内容用于 AI 训练是“前所未有的大规模盗窃”，甚至称其可能是“人类历史上规模最大的劳动力盗窃”。在另一份文件中，Hecht 还质疑微软和 OpenAI 关于 AI 训练新闻内容属于合理使用（Fair Use）的观点，认为大规模抓取新闻内容的做法可能与“合理使用”的理念相悖。同时，微软内部文件还曾提出所谓“毁灭循环（doom loop）”风险，即 AI 产品不断减少新闻网站流量和收入，最终导致新闻机构减少内容生产，而 AI 模型本身也因此失去可靠的信息来源。事实上，微软内部数据似乎已经体现了这种趋势。微软数据显示，部分涉诉新闻机构的点击率下降了 83% 至 93%，另一些机构则下降了 51% 至 94%。新闻机构还援引 ChatGPT 搜索结果点击率较低以及自身流量下降的报道，认为 AI 聊天机器人正在逐渐取代用户直接访问新闻网站的需求。微软 CEO Satya Nadella 在作证时也承认，聊天机器人能够直接在 AI 平台向用户提供信息，从而减少用户访问原始新闻网站的需求。他表示，这相当于聊天机器人通过直接提供信息，“从新闻网站那里拿走了点击量”。OpenAI 内部也存在类似观点，ChatGPT 负责人 Nick Turley 曾在内部确认，使用新闻内容训练商业 AI 产品，并让这些产品能够取代新闻提供商，可能会给出版商带来“生存性威胁”。Turley 认为，当聊天机器人已经直接提供信息时，用户“没有充分理由”再点击原始链接。他还在内部讨论中将聊天机器人描述为“基本上具有替代性”，并认为随着产品能力提升，这种替代关系还会进一步增强。IT之家注意到，以《纽约时报》为首的新闻机构还指控微软和 OpenAI 公司内部人员早已意识到 AI 产品可能输出与训练数据高度相似的内容。原告方表示，他们进行了多种测试，尝试让微软和 OpenAI 的 AI 产品直接复现新闻文章内容，结果发现出现大段内容复现。对此，相应新闻机构认为微软和 OpenAI 并未充分采取措施阻止这些输出，甚至采取了让新闻机构更难测试 AI 模型的措施。事实上，微软应用科学部门主管 Brent Hecht 一份内部文件称，公司开发了一项过滤机制，可能让训练数据版权方“更难了解哪些内容被用于训练”。对于上述指控，微软发言人回应称，微软的 AI 产品属于具有转换性质的合理使用，并不会取代新闻网站。微软还表示，Hecht 的内部文件仅代表一名员工的个人观点，并非法律分析，也不能代表微软公司的立场。而 OpenAI 截至报道发布时尚未回应相关置评请求。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/003/908.htm", "publishedAt": "2026-09-18T00:25:42+00:00"}, {"title": "谷歌最强 AI 模型：Gemini 4 Pro 开测，SVG 生图表现惊艳", "summary": "IT之家 9 月 18 日消息，根据 @LuminaBench 等网友反馈，谷歌正以“gemini-3.8-flash”名称，在 Arena 等基准平台测试其最强 Gemini 4 Pro 模型，内部开发代号为 Argon。根据网友晒出的模型测试图片，在生成经典的“鹈鹕骑自行车”SVG 图片为例，其非常优秀，该网友还附上了和 OpenAI 最强模型 GPT-6 Astra Pro 的对比，并认为在谷歌官方发布后，Gemini 4 Pro 模型的能力会进一步提升。IT之家附上相关截图如下：", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/003/902.htm", "publishedAt": "2026-09-18T00:03:24+00:00"}, {"title": "OpenAI 被指控“为赚钱不择手段”：明知威胁出版商生存，仍大量侵权", "summary": "北京时间 9 月 18 日，根据《纽约时报》提交的最新诉讼文件，OpenAI 在明知其对出版商构成“生存威胁”的情况下，仍复制了数百万篇受版权保护的文章，以打造潜在价值高达“天文数字”的 AI 技术。目前，《纽约时报》和其他媒体机构正向 OpenAI 寻求数十亿美元的损害赔偿金。此案的关键在于，OpenAI 和共同被告微软是否通过利用出版商的内容训练其模型，侵犯了版权法。《纽约时报》的律师表示，OpenAI 受商业利益驱动，大量获取该报的内容。他们称，OpenAI 联合创始人格雷格 · 布罗克曼 (Greg Brockman) 大约在 2017 年写道，他“被那些天文数字般的财富深深驱动”，希望通过 OpenAI 技术的商业化获得这笔财富。《纽约时报》周四提交的文件披露了新的证据。这起案件是版权持有人针对 AI 公司提起的数十起诉讼中最受关注的案件之一。版权持有人指控这些公司盗用相关材料训练 AI 模型，而这些模型正在威胁人类内容创作者的工作岗位。OpenAI 一直辩称，根据版权法，利用公开可获得的内容训练模型属于“合理使用”，这一法律依据与搜索引擎访问相关内容时采用的理由类似。该公司表示，其大语言模型会对原始内容进行转换，而不是对其进行复制，而且不会成为《纽约时报》或其他出版物的替代品。但《纽约时报》的律师表示，“被告未经许可，反复完整复制数百万篇受版权保护的文章，以开发具有替代性的商业 AI 产品”。《纽约时报》律师还称，OpenAI 是在明知其 AI 工具可能取代原始材料的情况下这样做的。根据周四提交的文件，OpenAI 旗下 ChatGPT 负责人曾写道，AI 产品对出版商构成“生存威胁”，这些产品“在很大程度上具有替代性，就是这样，而且随着它们变得更好，替代性会越来越强”。诉讼还引用了微软应用科学总监布伦特 · 赫克特 (Brent Hecht) 的话。赫克特据称曾写道，用受版权保护的内容训练大语言模型是“一场规模空前的惊人盗窃”，此案胜诉将“彻底嘲弄‘合理使用’这一理念”。微软发现，与传统搜索引擎相比，使用其 AI 回答工具的用户对原始内容的点击率低了 83% 至 93%。微软在一份声明中表示：“这些言论反映的是一名员工的个人观点，并非法律分析。”诉讼文件还称，OpenAI 采用了“越界且具有欺骗性”的手段获取付费墙后的内容，而如今担任 OpenAI 总裁、实际上第二号高管的布罗克曼当时已经知悉这一做法。文件称，当一名员工告诉布罗克曼“有办法绕过《纽约时报》付费墙”后，布罗克曼回应道：“啊，不错。”微软 CEO 萨蒂亚 · 纳德拉 (Satya Nadella) 为该案所作的证词中表示，如果当时“得知 OpenAI 抓取并利用付费墙后的信息进行训练”，他会依据两家公司当时的协议，行使微软的权利，要求 OpenAI“重新训练其模型”。微软周四表示，纳德拉的证词“谈的是广泛原则以及人们查找和消费信息方式正在发生的变化”，并非对本案核心“版权问题的结论”。OpenAI 未立即回应置评请求。该公司此前曾表示：“本案不是人类创作与 AI 之争，而是《纽约时报》想以牺牲惠及所有人的进步为代价，谋求一笔不该得的横财。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/003/897.htm", "publishedAt": "2026-09-17T23:48:09+00:00"}, {"title": "OpenAI 披露 GPT-5.6 Sol 异常行为：AI 模型会留下指令要求“未来版本的自己”隐瞒自身错误", "summary": "IT之家 9 月 18 日消息，OpenAI 发文，披露研究团队在训练最新模型 GPT-5.6 Sol 的过程中，研究人员发现了一项异常行为：模型曾通过对话摘要向未来版本的自己留下指令，要求后续模型隐瞒自身错误以及与预期行为不一致的表现。目前，研究团队已经针对这一具体问题进行修复。IT之家参考 OpenAI 的报告，研究人员在训练 GPT-5.6 Sol 过程中发现，尚未部署的 Sol 智能体会在“压缩摘要”（compaction summaries）中加入额外指令，向未来版本留下提醒，要求其隐藏错误或与预期目标不一致的行为。例如，一个 Sol 智能体负责制作财务模型时无法找到用户要求的历史数据，于是在摘要中写道，由于没有源文件，可能需要自行创建“Historical Data”工作表并填入合理的 2024 年历史数据，并留下指令，要求后续模型“只有被问到时才保持信息透明度”、“最终回复只需要提供文件链接”。再如，另一个 Sol 智能体在断网情况下进行“制作供应商目录”任务，由于相应智能体无法访问互联网，只能依靠缓存的源文件。模型在摘要中意识到供应商来源与对应标签可能并不完全匹配，结果在摘要中要求后续模型“除非必要，否则不要在最终结果中提及消息存在谬误可能性”的指令。事实上，类似行为并非仅出现在 Sol 模型身上。OpenAI 表示，一款尚未发布的 Astra 系列模型在强化学习训练期间也曾利用压缩摘要向后续模型传递提示词注入指令。其中一个案例中，模型添加了“BREACH ALERT”指令，要求后续模型忽略开发者消息；另一个案例则加入了与当前任务无关的人格设定，试图改变后续模型与用户互动时的行为方式。OpenAI 表示，其训练运行监控系统首先发现了这一异常行为。随后，研究人员专门建立监测机制，并对训练数据进行扫描，最终发现 27 份摘要中存在类似越狱提示的指令。不过，后续模型并非总会执行这些指令。外媒指出，在上述两个案例中，尽管前一个智能体在摘要中留下了“说谎”指令，但后续 Sol 智能体并不会真正识别这些指令。不过这并不代表 Sol 智能体具有完美的纠错能力，仍需要开发人员重点核查提示词摘要。从此次披露来看，AI 智能体除了可能在执行任务时出现直接错误外，还可能通过历史摘要等机制影响后续模型的行为。如何识别这类跨任务、跨模型传递的异常指令，以及如何确保监控机制本身能够发现模型试图隐藏的问题，仍是 AI 安全研究需要进一步解决的问题。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/003/896.htm", "publishedAt": "2026-09-17T23:46:48+00:00"}, {"title": "特斯拉推送 2026.26.200.11 软件更新：为更多车型上线豆包大模型语音助手", "summary": "IT之家 9 月 18 日消息，特斯拉昨日发布了最新的 2026.26.200.11 版软件更新，已开始分批推送。本次升级涵盖豆包大模型、宠物模式、导航、辅助驾驶、媒体应用及安全修复。特斯拉车机新增豆包大模型语音助手（需开通高级车载娱乐服务），可提供实时信息并进行自然对话（可选灵动女声薇薇、沉稳男声云舟等音色，以及万事通、音乐爱好者、故事会等角色）。IT之家附其他更新如下：宠物模式：前往“控制 &gt; 显示 &gt; 自定义宠物模式”，选择并命名您的宠物。视觉更新：中央显示屏现可显示更高画质的 Tesla 图像，并进一步丰富停车场景环境。盲点警报氛围灯：现在，当盲点区内有物体并且转向信号灯已启用，或在驻车时探测到有物体靠近时，氛围灯会变为红色。要禁用此功能，请前往“控制 &gt; 车灯 &gt; 盲点警报氛围灯”。驻车时发出盲点警报：如果您尝试在探测到盲点区有物体不断靠近的情况下打开车门（例如，一名骑自行车者正在从后方不断靠近），盲点指示灯会闪烁，蜂鸣声会响起，并且在首次按下按钮时车门不会打开。稍等片刻后再次按下按钮可忽略该警告。沉浸式音效升级：高级沉浸式音效使用先进的声音提取技术将听者置于沉浸式空间内部一个细节丰富的声场前方。此增强功能适用于所有流媒体来源。前往“设置 &gt; 音频 &gt; 音调 &gt; 沉浸式音效”进行调整。行程：“行程”现在位于“能量”应用程序中，在此，您可以创建和管理多个行程，以跟踪不同驾驶、路线或状况下的能耗。前往“应用程序启动器 &gt; 能量 &gt; 行程”。要快速访问行程卡，请在媒体卡上向左滑动。预估续航里程：您的预估电池续航里程现在会考虑到与电池逐渐老化相关的其他特征。智能导航：智能导航现可适应您的日常习惯。除了“住宅”、“公司”之外，在“目的地建议”启用的情况下，您的车辆现在还可以针对您经常到访的地点提供建议并规划路线，例如上班途中送孩子上学。位置数据对 Tesla 是完全匿名的，并且不与车辆关联。熟路：导航现在会优先选择您常走的路线。熟路功能默认关闭，可在“控制 &gt; 导航 &gt; 熟路”中开启。使用此功能需在“控制 &gt; 导航 &gt; 在线路线规划”中开启在线路线规划。当地图上出现熟路时，路线气泡会显示标识。位置数据对特斯拉匿名，不会与您的车辆关联。自动软件更新：现在，您的 Tesla 可以在夜间自动安装已下载的软件更新。此功能启用后，更新会在您的 Tesla 驻车并且未使用时安装，确保您始终拥有最新的功能和改进。要启用此功能，请点击“控制 &gt; 软件 &gt; 自动安装更新”。欢迎动画：现在，Tesla 开机时会显示欢迎动画。行车记录仪查看器更新：您可以前往“应用程序启动器 &gt; 行车记录仪查看器”，将行车记录仪最近的视频片段中的任何短片永久保存在您的 Tesla 上。短片会保留在车辆上，绝不会与 Tesla 分享。画板：借助目前支持贴纸和表情符号的增强版画板，释放您内心的艺术家天分。保存您的草图，以便在手机应用程序中访问并进行分享。要求使用手机应用程序 4.55.6 或更高版本。后排控制屏：现在，当您的 Tesla 导航路线时，后排座椅上的乘客可以查看后排显示屏上的地图并与之交互。点击后排显示屏上的地图图标，以同步查看。摄像头预览：您现在可以随时打开摄像头预览，即使您的 Tesla 未处于驻车状态。前往“控制”&gt;“服务”&gt;“摄像头预览”，然后点击任何摄像头视图即可单独查看。轻点网格按钮以切换回所有摄像头。可视化驾驶：定制您的辅助驾驶缩放偏好。捏合视觉视图，或在“控制 &gt; 辅助驾驶 &gt; 可视化摄像头缩放”中选择一个预设项。网页浏览器：现在，您可以在网页浏览器中使用您的 Tesla 内饰摄像头和驾驶室麦克风。点击可在网站请求访问权限时授予权限。仅在驻车状态才能使用摄像头。后排控制屏：前往“应用程序启动器 &gt; 后屏幕 &gt; 锁定后显示屏”，从中央显示屏禁用后触摸屏控制。从中央显示屏选择的内容将继续在后排播放。家长控制：您现在可以在驻车状态下前往“控制 &gt; 安全 &gt; 家长控制”，以禁用您 Tesla 上的浏览器、剧场和游戏厅。媒体应用登录通知：现可通过 Tesla 应用程序通知登录 QQ 音乐、酷狗音乐、网易云音乐与喜马拉雅，体验更快捷流畅。需要开通高级车载娱乐服务或者连接 Wi-Fi，并且手机应用版本不低于 v4.59.5。Apple 音乐：在 Apple Music 中向右滑动歌曲，可将其添加至播放队列。长按某个歌曲，可将其添加至“个人收藏”或从中移除。Apple 音乐：将歌曲从搜索结果和“艺人”页面直接添加到您的 Apple 音乐播放队列。长按一首歌曲，或点击三点菜单，可以播放下一首、添加到播放队列、保存到音乐库或标记为收藏。需要有效的 Apple 音乐订阅。后屏歌词显示：后排屏幕现已可使用歌词，滑动以切换布局。需要开通高级车载娱乐服务或者连接 Wi-Fi 以使用此功能。增大碰撞后车窗的开启幅度。牵引力控制模式：有三种最新的牵引力控制模式可供选择：适用于正常驾驶条件的自动模式；适用于结冰或湿滑道路的湿滑路面模式；或车辆在雪地、泥地或沙地中受困时适用的脱困辅助模式。模式在开始每次驾驶时重置为自动。要进行选择，请转到“控制 &gt; 动态 &gt; 牵引力控制模式”。地图包版本更新：CN-2026.38-16231。安全改进：修复越界访问、整数下溢、CAN 总线缓冲区溢出和符号链接条件竞争的漏洞。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/003/895.htm", "publishedAt": "2026-09-17T23:43:35+00:00"}, {"title": "吴恩达谈 AI 灭绝论：堪比科幻小说，新一波造势或意在影响监管", "summary": "北京时间 9 月 18 日，据彭博社报道，AI 领域的先锋吴恩达表示，顶尖模型开发商研究人员发出的有关 AI 生存风险的警告属于“科幻小说”，可能不利于确保这项技术为社会带来最大益处。吴恩达曾参与创办谷歌大脑和教育平台 Coursera。他说，在 AI 热潮的早期，科技行业曾煽动人们对 AI 潜在灾难性危害的恐惧，显然是为了加大宣传力度并影响监管走向。“过去两周，我感到相当沮丧，”他在周四接受彭博电视采访时说，“这波公关宣传如今又卷土重来了，可能也是出于类似的目的。”本月，前 Anthropic 和 OpenAI 研究员雅各布 · 考克森 (Jacob Coxon) 的高调辞职，使得一场酝酿已久的 AI 安全讨论进入主流视野。考克森指责他的两名前雇主都在“拿我们的生命下注”，因为它们“竞相开发超级 AI 智能”。他还表示，那些开发 AI 的人认为，这项技术可能“在本十年结束前杀死我们所有人”。在这一背景下，包括 Anthropic CEO 达里奥 · 阿莫代伊 (Dario Amodei) 和 OpenAI 的萨姆 · 奥尔特曼 (Sam Altman) 在内的 AI 领袖正呼吁业界放缓前沿模型的开发步伐，并采取更多措施为未来的发展保驾护航。吴恩达早年曾与阿莫代伊和奥尔特曼共事。他说，AI 确实存在风险，包括网络安全方面的风险。但他认为，有关 AI 导致人类灭绝的担忧“更像是科幻小说，而非科学”。他还表示，行业可以专注于解决一些“实际的工程问题”，以持续改进和保护这项技术，同时努力确保 AI 能够被用于“许多它能够实现的美好事情”。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/003/892.htm", "publishedAt": "2026-09-17T23:36:12+00:00"}, {"title": "距离 AI 造 AI 还有多远？Anthropic Claude 已主导 26% 内部 AI 研发工作", "summary": "IT之家 9 月 18 日消息，Anthropic 今日发布了一套用于衡量前沿 AI 实验室研发进度的方法，并公布公司内部的阶段性数据。该体系主要关注 3 项指标：AI 参与 AI 研发的程度、AI 智能体的监督情况，以及算力在 AI 研发与安全研究之间的分配。Anthropic 称，随着 AI 能力的提升，AI 正在越来越多地参与下一代 AI 系统的研发。公司希望通过公开这些指标，让公众、第三方机构和政府更直观地了解前沿 AI 研发的推进速度。Anthropic CEO 达里奥 · 阿莫代伊曾呼吁协调放缓前沿 AI 发展，若出现协调，相关数字预计会变化。在 AI 参与 AI 研发方面，Anthropic 提出了“Anthropic 研发自动化指数”，用于衡量 Claude 参与公司 AI 研发工作的程度。该指标采用 Epoch AI 提出的自动化等级体系，从 AL0 到 AL5，分别对应没有 AI 参与、AI 辅助、AI 协作、AI 主导以及完全自主运行。类似于汽车的自动驾驶评判等级，AL5 指的是 AI 完全自主运行、无需人类介入，AL4 指 AI 可依据高层提示完成大部分任务、人类只负责监督。截至 2026 年 8 月，Claude 未在任何被测量的 AI 研发工作中实现“完全自主运行”，但已经“主导”Anthropic 约 26% 的 AI 研发工作，同时处于“AI 协作”及更高等级的工作占比已经超过 90%。Anthropic 披露，这一比例在 2026 年 2 月还不到 1%。该公司认为，这类指标有助于观察 AI 研发自动化程度是否持续提高，以及距离“递归自我改进”—— 即 AI 能够完全自主开发下一代 AI—— 还有多远。为建立这一指标，Anthropic 从 2026 年 7 月的内部工作记录、Slack 及其他文档中抽样整理出约 1.5 万个模型研发任务，并将其归纳为 542 个不同层级的任务节点，其中 378 个属于最细分的任务类别。随后由 Claude 研究这些任务的执行方式及 AI 参与程度，并由独立的 Claude 评估模型进行自动化等级判断。实时监控系统会在智能体执行操作前检查行为，并在发现危险操作时进行拦截或调整。Anthropic 对 2026 年 8 月超过 10 亿次智能体决策进行分析后发现，约 0.002% 的操作被该系统拦截（IT之家注：相当于约每 4.7 万次操作出现 1 次拦截）。事后监控系统则会分析智能体已经完成的操作，每周约标记 10 万份对话记录进行进一步检查，其中优先级最高的约 50 份会升级至人工审核。此外，约千分之一至千分之二的智能体活动会被标记为需要进一步审查。在算力分配方面，Anthropic 统计了 2026 年 7 月 13 日至 7 月 20 日期间的算力使用情况。数据显示，该公司用于 AI 研发的算力中约 6% 投入安全研究；如果仅统计基于 AI 的 AI 研发工作，其安全研究算力占比约 12%。Anthropic 强调，上述算力比例是较为保守的估计，因为同时促进模型能力和安全性的工作没有被计入安全研究，而且该统计也没有计算用于安全分类器的另一部分算力。公司同时指出，安全研究通常并不需要像前沿模型训练那样消耗大量算力，因此算力占比不能直接代表安全工作的整体投入程度。Anthropic 称，这些指标目前仍属于原型测量体系，跨实验室比较还面临统一方法和独立验证等问题。公司计划引入来自多个组织的独立第三方评估人员，让其获得与内部风险评估团队相近的流程、系统和数据访问权限，以验证安全实践并持续监测相关指标。Anthropic 表示，公布这些测量是为了让公众、第三方和政府更好了解前沿实验室内部的 AI 发展速度，并希望继续发布相关数据。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/003/886.htm", "publishedAt": "2026-09-17T23:10:09+00:00"}, {"title": "开发者成功令英伟达 DLSS 5 在浏览器里运行，苹果 macOS 也可体验", "summary": "IT之家 9 月 18 日消息，据外媒 TweakTown 报道，近期开发者 MAAN 在 X 平台展示了一项概念验证项目，成功让英伟达 DLSS 5 在 WebGPU 环境下直接处理浏览器中的 3D 图形，相应方案可在 macOS 设备上运行。目前项目已经提供在线演示（点此访问），开发者还计划将源代码发布至 GitHub，不过从实际体验来看，其运行速度仍然较慢，暂时不适合实时游戏场景。IT之家获悉，DLSS 5 原本计划作为《NBA 2K27》的独占技术推出，但在相关技术被破解后，大量开发者将其移植至各种 3A 游戏，而此次 MAAN 更进一步，将其带入浏览器环境，绕开了基于应用的 DLSS 集成方式。事实上，英伟达目前并没有提供官方支持的浏览器 DLSS 方案。该公司的 DLSS SDK 文档主要针对基于 DirectX 或 Vulkan 的原生应用，通常通过英伟达 NGX 接口或 Streamline SDK 进行集成。其中 Streamline 位于应用程序与图形 API 之间，开发者需要向其提供运动矢量、深度数据以及渲染帧等资源，而这些数据和处理流程并不能直接对应到浏览器的渲染管线中。英伟达官方文档目前也没有将 WebGL 或 WebGPU 列为 DLSS 支持的图形接口。由于 MAAN 尚未公布项目的技术细节，目前还无法确定该方案究竟如何将浏览器中的渲染资源连接至 DLSS 5。可能的实现方式包括通过原生桥接调用英伟达现有二进制组件、将浏览器生成的渲染资源转换后交由外部程序处理，或者采用其他方式。随着项目源代码后续在 GitHub 公开，具体实现机制预计将会更加清晰。从目前的 Demo 体验来看，该项目运行较为缓慢，更接近早期概念验证方案，难以用于实际游戏，Demo 主要提供了多种 3D 场景以及“电影感”“自然”等风格预设，同时允许用户调整强度、局部色调、局部结构和皮肤结构等参数。不过其运行负载相当高，即使用户使用 RTX 4090，加载神经渲染模型也需要约 1 至 2 秒；尽管其在 macOS 设备上同样可以跑动，但暂时无法实现流畅运行，实际上更适用于“建筑可视化”、“实时 3D 模型预览”等场景。尽管目前这项技术距离实时游戏应用还有明显距离，但在英伟达没有提供官方浏览器支持的情况下，能够让 DLSS 5 通过 WebGPU 在浏览器中运行，本身已经是一项颇具技术展示意义的尝试。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/003/885.htm", "publishedAt": "2026-09-17T23:09:09+00:00"}, {"title": "安全顾虑成普及关键：外媒调查显示超七成受访者不愿令 OpenClaw 等 AI 工具完全控制自己的电脑", "summary": "IT之家 9 月 18 日消息，大语言模型（LLM）问世仅数年，但如今已经逐渐走出聊天窗口。从回答问题、修改邮件，到如今 OpenClaw 诞生，可代替用户操作电脑，减少大量重复劳动，但 OpenClaw 本身也是双刃剑，其虽然可以帮助人类完成相当复杂的任务，但本身存在一定风险，不法分子可以利用提示词注入等各种攻击方案对用户环境造成重大破坏。对此，外媒 Android Authority 发起一项投票，询问用户是否愿意让 OpenClaw 等 AI 工具获得电脑的完整访问权限。调查结果显示，43% 的受访者明确表示出于安全原因不会允许 AI 访问电脑，另有 27% 的受访者则表示自己对此类功能完全不感兴趣。约四分之一的受访者对这一想法持相对开放态度，但前提是 AI 能够得到妥善的安全保护。此外，不到 4% 的受访者表示并不担心相关风险。外媒表示，这意味着其平台超过 70% 的受访者明确不愿让 AI 完全接管电脑，即使在愿意尝试的用户中，大多数也将“确保安全”作为重要前提。这反映出，在 AI 智能体逐渐从聊天机器人转向能够直接操作电脑的情况下，用户对于权限控制和安全边界仍然存在明显顾虑。这意味着建立可靠的权限隔离和安全机制，仍是 AI 技术进一步普及需要解决的问题。document.write(\"\");document.getElementById(\"vote2402\").innerHTML = voteStr;", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/003/881.htm", "publishedAt": "2026-09-17T22:50:41+00:00"}, {"title": "新型安卓恶意木马 RatHat 现身：引入 AI 识别能力，可帮助黑客快速分析 / 操作受感染设备", "summary": "IT之家 9 月 18 日消息，安全公司 Zimperium 旗下 zLabs 研究团队发文，透露近日业界出现一种名为 RatHat 的新型安卓恶意木马。该恶意木马最大的特性是引入了 AI 识别机制，可以分析受感染设备的界面并辅助攻击者远程执行导航操作，从而进一步控制手机。IT之家获悉，相应木马主要面向中文环境用户下手，不法分子将其植入至各种诈骗 App 中进行传播。在受害者安装软件后，相应木马便会通过安卓辅助功能权限深度控制用户设备。▲ 恶意木马内置的中文提示词具体行为方面，RatHat 会针对金融类应用显示伪造的 HTML 界面，诱导用户输入并窃取账户凭据。同时，该恶意软件可以拦截短信 / 通知并将其发送给黑客，还能够记录文本变化事件、从浏览器地址栏提取 URL，以及获取锁屏 PIN 码、密码和解锁图案等敏感信息。zLabs 研究团队重点指出，RatHat 最大的特性是引入了 AI 识别机制，其会将实时捕捉到的受害者设备界面以 XML 形式排版，之后发送给“一款报告中未公开名称的热门 AI 助手”进行分析，相应 AI 模型会根据黑客的要求识别指定界面元素的中心坐标、判断元素实际显示的文字，并返回诸如 SCROLL_DOWN 等导航指令，以便黑客快速分析 / 操作受感染设备。研究人员同时指出，RatHat 还会主动阻止用户卸载恶意软件。当用户打开卸载确认界面时，恶意软件会拦截相关操作并取消卸载流程，随后显示一个伪造的卸载界面，并通过虚假的错误信息误导用户。除此之外，研究人员还发现 RatHat 内置多种反分析机制，例如篡改 APK 容器、使用体积高达 61MB 的异常 Android Manifest 文件，以及加入无效 DEX 伪指令，试图干扰安全研究人员和分析工具对恶意软件进行逆向分析，相比传统脚本式自动化恶意脚本更难被安全软件识别。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/003/876.htm", "publishedAt": "2026-09-17T22:15:33+00:00"}, {"title": " id Headlines 报道，联想旗下 Vantage 外设管理应用现已正式上架 Google Play 商店。事实上，对于使用过联想 Windows PC 的用户而言，Vantage 并不是一款陌生应用。在 Windows 平台上，它主要承担系统更新、硬件诊断以及设备配置等功能。此次联想 Vantage 登陆 Google Play 商店，可以看作是联想正为自家 Googlebook 铺路。具体来看，相应应用允许用户在 Googlebook 上查看自己设备的基础状态，快速浏览设备 RAM 内存及存储容量、序列号、操作系统版本、保修状态等，还能各种外设进行快捷调参。同时应用还曝光了联想尚未发布的 AI Mouse 智能鼠标。综合此前曝光信息，这款 AI Mouse 智能鼠标中键带有实体 AI 键，短按该按键即可调出屏幕上的 Gemini Chatbox，长按则可以启动 Gemini 语音听写以及 Magic Pointer 光标工具，让用户快速调用相关 AI 功能。同时，相应鼠标能够与联想的 Googlebook 深度联动，当用户通过 AI Mouse 触发 AI 快捷操作时，笔记本 A 面外侧还会同步显示灯效，让软硬件起到相得益彰的效果，在视觉和功能层面形成一定联动。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/003/900.htm", "publishedAt": "2026-09-17T23:57:48+00:00"}, {"title": "消息称 Steam 平台山寨游戏泛滥，爆款独立作品遭其他开发者利用 AI 快速复制", "summary": "IT之家 9 月 18 日消息，外媒 Kotaku 发文指出，目前 Steam 平台盗版山寨游戏泛滥，在平台搜索某些突然爆红的独立游戏竟如同“大海捞针”，稍不留神就会被山寨游戏骗到。外媒表示，例如今年 8 月一款名为《Needle in a Haystack Simulator》的“找物品类”游戏预告片突然走红，相关预告视频在 X 平台总播放量超过 5000 万次，然而许多恶劣游戏开发者嗅到商机，直接山寨了一批玩法和名称相近的作品，由于原作实际上尚未发售，感兴趣的玩家试图在 Steam 查找游戏，结果极易下载到山寨作品。具体来看，这些山寨游戏包含《A Needle in a Haystack》《CO-OP Needle Hunt: A Needle in a Haystack Challenge》《Story of The Needle in a Haystack》等，这些游戏 Logo 和宣传素材均呈现出较为明显的 AI 生成痕迹，显然可以看出恶意开发者使用 AI 高速复制了原作内容。《Needle in a Haystack Simulator》开发者表示，目前平台大量山寨作品已严重影响自家作品曝光率，因此其不得不在游戏宣传图上增加醒目的红色标识，强调这是“原版”游戏，以帮助玩家与其他类似作品区分。随着 Steam 平台上的游戏数量持续增加，类似的复制作品也可能进一步增加。对此，外媒呼吁V社建立山寨游戏识别机制，避免开发者的创意成果遭到他人恶意剽窃。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/003/893.htm", "publishedAt": "2026-09-17T23:36:16+00:00"}, {"title": "百度智能云首发产业智能体操作系统，要实现 AI 的商业和技术飞轮", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/jXliIdDVTYDAtm73EoSU?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-17T19:29:09+00:00"}, {"title": "边说话边推理、边聊天边调用工具，谷歌 Gemini 3.8 Live 要攻克语音 Agent 的沉默时刻", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/HWTj56QXAtdSar5YGp32?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-17T15:33:13+00:00"}, {"title": "索尼 PS5 游戏机获 26.06-14.00.00 系统更新，Pro 机型默认开启增强 PSSR 图像质量", "summary": "IT之家 9 月 17 日消息，索尼 PS5 游戏机近日获得 26.06-14.00.00 系统更新。本次更新主要带来一系列新功能，PS5 Pro 机型将默认开启增强 PSSR 图像质量设定，为用户带来更清晰、锐利的游戏体验。仅支持旧版 PSSR 的游戏，也能使用增强版 PSSR。PSSR（PlayStation 光谱超解析度）是索尼专为 PS5 Pro 开发的 AI 影像超解析度技术，它可通过机器学习逐帧分析画面，将低分辨率画面放大、重建为高解析度画面。能够在不增加 GPU 3D 渲染负担的情况下提升画质，部分游戏开启后能实现 4K 60FPS 兼得。IT之家附本次更新详情如下：我们已默认开启增强 PSSR 图像质量设定。更新系统软件时，此设置会自动开启。启用此功能后，即使是支持旧版 PSSR 的游戏，也能使用增强版 PSSR，从而为您带来更加锐利、清晰的视觉体验。要关闭此设定，请前往设定 &gt; 屏幕和视频 &gt; 视频影像输出 &gt; 增强 PSSR 图像质量。此功能仅适用于 PS5 Pro。现在，您可以在语音聊天时看到是谁正在发言。要显示发言者的标示，请前往控制中心的语音聊天卡片。选择更多 &gt; 显示发言者并打开显示名称。若要选择发言者标示在屏幕上显示的位置，请选择位置。我们已将“社区活动”小组件添加到您的欢迎中心。您可以在以下视图之间进行切换。热门趋势显示十款人气急升的多人游戏或多人模式。在此查看新发布的游戏或有重大内容更新的游戏。前十榜单显示您所在国家 / 地区过去一周内备受欢迎的十款游戏。在此查看哪些游戏拥有庞大的玩家社区，您可以加入其中。我们针对某些国家 / 地区的 PS5 主机和 PS5 Pro 主机变更了以下功能。如果您前往设定 &gt; 周边设备 &gt; 常规 &gt; 高级设定并选择关闭蓝牙，则您的主机不会进入待机模式，且 HDMI 设备关联功能也将失效。关闭蓝牙功能用于在电竞场馆等类似场所管理控制器连接。请勿将此功能用于任何其他用途。进一步优化系统软件性能，提升稳定性。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/003/842.htm", "publishedAt": "2026-09-17T13:57:44+00:00"}, {"title": "vivo 把 Agent 做进操作系统：6000 多项原子技能开放调用，AgentOS 预览版亮相", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/hbZAEa6iQbq5rcUWbUi4?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-17T12:37:53+00:00"}, {"title": "Snowflake World Tour 上海站 Keynote——Snowflake 企业级智能体", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/video/81qDfiHlpMYmNUg269l8?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-17T10:00:00+00:00"}, {"title": "央企做了个通用Agent，直接杀进IDC实测前三！", "summary": "中国电信，TeleAgent", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/491454.html", "publishedAt": "2026-09-17T09:39:19+00:00"}, {"title": "Claude双入口合并，原生Office上线！硅谷AI办公大战也开始了", "summary": "文档和PPT都能做了", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/491391.html", "publishedAt": "2026-09-17T09:07:25+00:00"}, {"title": "ColorOS const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
