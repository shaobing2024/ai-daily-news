peSafe 社区中向用户直播了这一过程。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/011/170.htm", "publishedAt": "2026-10-09T23:28:29+00:00"}, {"title": "微软推出 Microsoft-Decision-1 决策模型，基于 Qwen3.5-9B", "summary": "IT之家 10 月 10 日消息，当地时间 10 月 9 日，微软宣布推出 Microsoft-Decision-1 决策模型。官方表示，该模型专为结构化决策任务打造，在响应延迟与决策质量上均具备顶尖性能，其实际表现全面超越大语言模型及其他传统决策模型。该模型现已上线 Microsoft Foundry，并同步接入 OpenRouter。在包含 36 项基准测试、涵盖近 15 万个训练阶段完全隔离（Blind Evaluation）的测试内容的对比评测中，Microsoft-Decision-1 斩获了最高准确率。同时，基准测试数据显示其响应速度位列第一：比排名次席的 Quyet-1.0-Large 快 4.5 倍，比 GPT-6 Sol 更是快了 35 倍。在构建 Microsoft-Decision-1 时，微软对 Qwen3.5-9B 进行了后训练，实现了超低延迟的单次推理决策评分机制；后续将以此为基础，迁移适配至包括 Microsoft AI（MAI）和 OpenAI 在内的其他底座模型。此外，微软在基于 11 项安全基准测试、共计 5,250 条请求对 Microsoft-Decision-1 进行了系统评测，测试范围涵盖有害内容、越狱攻击及提示词注入。结果表明，该模型在有效拦截各类恶意行为的同时，依然保持了极高的可用性。价格方面，每百万 Token 输入 0.042 美元（IT之家注：现汇率约合 0.28 元人民币），输出免费。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/011/166.htm", "publishedAt": "2026-10-09T23:12:53+00:00"}, {"title": "谷歌 Gemini 4“Argon”模型即将发布，消息称内部测试“Carbon”新版本", "summary": "IT之家 10 月 10 日消息，据《商业内幕》报道，谷歌即将向公众正式发布新一代 Gemini 4“Argon”模型。与此同时，其内部员工已在测试性能更强的后续迭代版本，有望进一步缩小与竞品之间的技术差距。据该媒体获取的内部文档与截图显示，谷歌员工近期一直在测试代号为“Carbon”的全新 Gemini 4 版本。该模型很可能是 Argon 架构下的新检查点（Checkpoint）更新，并已于近日接入谷歌内部代码平台 Jetski。一名员工透露，Carbon 在代码能力上的表现“堪比 Opus 5.5”—— 后者是 Anthropic 旗下针对复杂代码智能体长期任务打造的最强模型。不过该员工同时表示，这一结论仍有待更深入的评测验证。综合多名员工反馈及内部沟通记录来看，早期版本的 Argon 在内部测试中普遍收获了良好评价。不过也有员工指出，早期版本在处理部分编程任务时仍显吃力，其水平大体只相当于 Anthropic 早前发布的 Claude Opus 5。一份内部文件表明，谷歌内部已对代号为 Argon、Barium 以及 Carbon 的多款 Gemini 4 衍生模型展开测试。值得注意的是，谷歌的产品内部代号与最终公开发布名称往往并不挂钩。例如文件记载，此前选定以“Argon”之名对外发布的模型，其内部代号实为“Barium-B”。因此，目前的 Carbon 究竟会作为 Argon 的后续微调版本推出，还是作为 Gemini 4 家族旗下的独立新型号亮相，目前尚无定论。对此，谷歌方面拒绝发表评论。相关阅读：《谷歌最前沿 AI 模型：Gemini 4 Argon 登场，长周期代码工程 DeepSWE 测试超 Claude Opus 5.5》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/011/162.htm", "publishedAt": "2026-10-09T22:51:52+00:00"}, {"title": "小鹏 G9L 汽车官宣将亮相巴黎车展：正式开启全球上市，登陆 64 个国家和地区", "summary": "IT之家 10 月 9 日消息，小鹏汽车官方今日宣布，小鹏 G9L 即将亮相巴黎车  "publishedAt": "2026-10-03T07:00:20+00:00"}, {"title": "团队使用 Codex 和 Claude Code，API Key 和模型权限怎么管？我开源了 Zentrola", "summary": "一个人使用 AI Coding 工具时，事情很简单：申请一个 API Key，填进 Codex 或 Claude Code，然后开始工作。 但当使用者从一个人变成一个团队，原本简单的配置问题很快就会变成管理问题：真实 API Key 要不要发给每个人？新成员应该能用哪些模型？成员离职后如何撤销权限？上游服务商发生故障时，是否要通知所有人临时修改...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502836", "publishedAt": "2026-10-01T14:28:31+00:00"}, {"title": "Anthropic 红队盯上 GLM-5.3：能力追平 Mythos，却连拒绝护栏都是摆设", "summary": "Anthropic 的前沿红色团队（Frontier Red Team）盯上了智谱的 GLM-5.3，结论有点重：这是第一个能像五个月前的 Claude Mythos Preview 那样自主构建端到端漏洞利用、却几乎光着身子就被放出来的模型。 五个月前，Anthropic 发布 Claude Mythos Preview，自称是第一个能自主构建复杂端到端漏洞利用的 AI 模型。当时他们判...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502835/anthropic-research-glm-5-3-advanced-cyber-capabilities", "publishedAt": "2026-09-30T10:23:24+00:00"}, {"title": "OpenAI 发布 GPT‑6.1 Sol：智能水平接近 Astra、价格仅为其五分之一", "summary": "OpenAI 上周才推出 GPT-6 Sol，这周就把 6.1 Sol 端上了桌。官方称之为一次「重大升级」，覆盖专业办公、操控电脑、agentic 编程等任务。放在别家这可能只是常规迭代，但放在此刻的 OpenAI 身上，最刺眼的参照系是隔壁：6.1 代号的 Astra 迭代，前两天刚因为没通过安全标准被按下暂停。 Sol 打市场的方式是「错位」——现...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502831/openai-gpt-6-1-sol", "publishedAt": "2026-09-30T09:10:28+00:00"}]}, {"label": "产品发布/更新", "items": [{"title": "2026 年披露的第 4 笔 AI 交易：苹果投资 Huxe，由前谷歌 NotebookLM 团队成员创立", "summary": "IT之家 10 月 10 日消息，科技媒体 9to5Mac 昨日（10 月 9 日）发布博文，报道称苹果与 AI 音频初创公司 Huxe 达成人才引进与技术许可协议，这是今年公开披露的第 4 笔苹果 AI 相关交易。根据欧盟《数字市场法》透明度数据库本月（2026 年 10 月）披露的文件显示，苹果有权向 Huxe 的特定员工发出聘用邀请并录用员工。苹果同时获得 Huxe 知识产权的非独占许可。这项安排属于“收购式招聘”（acqui-hires），不代表苹果收购 Huxe 公司。协议允许苹果引进部分员工并使用相关知识产权，但交易没有包括购买 Huxe 业务，报道没有披露协议金额。IT之家查询公开资料，Huxe 由 3 名前 Google NotebookLM 团队成员创立。项目负责人 Raiza Martin 于 2024 年 12 月离开 Google，并与设计师 Jason Spielman、工程师 Stephen Hughes 共同创办公司。Huxe 于 2025 年 6 月以邀请制方式推出同名应用，并在同年 9 月向公众开放，团队当时公布完成 460 万美元融资。该应用可依据用户邮件和日历生成每日音频简报，也能围绕主题制作播客式对话，此外还提供新闻、体育等主题的持续更新音频内容。Huxe 于 2026 年 5 月宣布关闭，服务在 5 月 28 日结束。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/011/181.htm", "publishedAt": "2026-10-10T00:24:22+00:00"}, {"title": "马斯克旗下 Grok Bot 新增专属邮箱，AI 助手开始拥有独立“联络点”", "summary": "IT之家 10 月 10 日消息，全球首富埃隆 · 马斯克（Elon Musk）旗下 SpaceXAI 公司发布公告，为 Grok Bot 推出专属邮箱功能。官方表示，该邮箱可用于注册服务、代用户联系商家，以及安排日程；功能正逐步开放，用户可直接向 Bot 提出认领请求，或在 X 上标记 @bot。据报道，分配给 Bot 的邮箱地址以 @mail.grokbot.com 结尾，用户可尝试自定义地址前缀，由系统检查是否可用。认领过程可从聊天界面启动，例如输入“认领你的邮箱地址”。这也是 Grok Bot 本周连续推出的重要能力更新之一。此前，官方还宣布 Bot 可搜索、阅读和监控 X 内容，并新增 Shopify 相关能力，帮助用户查看订单、跟踪库存及更新商品信息。专属邮箱让 Grok Bot 不只是处理用户发起的对话，也有望通过独立邮箱参与需要收发邮件的任务。不过，目前功能仍在逐步开放，具体可用范围及权限设置以官方实际推送为准。IT之家注：Grok Bot 是 SpaceXAI 推出的“常驻型 AI 同事”：它不只是回答问题的聊天机器人，能在一台云端电脑上登录你常用的网站和应用、执行多步骤任务，并在需要人工判断时才回来找你审批。它于 2026 年 8 月以测试版形式发布。每个 Grok Bot 都有名字、职责和持续累积的上下文，你可以像给同事发消息一样，通过文字、语音或语音通话把工作交给它。它运行在云端电脑上，配备浏览器、文件系统和终端，因此即使你关掉电脑或手机，后台任务和定时任务仍会继续运行。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/011/177.htm", "publishedAt": "2026-10-10T00:10:15+00:00"}, {"title": "字节 TraeWork 和 TraeCode 合并为全新 TRAE，支持 Agent / IDE 模式无缝切换", "summary": "IT之家 10 月 10 日消息，10 月 9 日，字节旗下 TRAE 宣布，即日起，TraeWork 和 TraeCode 将正式合并，融合为全新的 TRAE，升级为全链路开发平台。官方表示，过去 TraeWork 更偏向办公、任务和内容生成，TraeCode 更专注专业开发者的编码需求。双端融合后，全新 TRAE 用一个统一入口承接这些连续任务，并支持 Agent 模式与 IDE 模式无缝切换。Agent 模式 适合从想法拆解到交付结果：新手开发者可以一步步做出 Demo，专业开发者也可以跨项目调度多个 Agent 并行推进任务。IDE 模式 保留完整智能开发环境，适合单项目深度代码编辑与精细调试。IT之家获悉，全新 TRAE 覆盖桌面端、Web 端和移动端。用户可以在电脑上启动任务，在移动端查看进度、补充要求，再回到桌面继续深入开发。本次升级将完整保留并迁移用户的聊天记录、账号数据、个人资料、登录状态、本地数据及商业积分等内容，无需手动搬迁。目前，新版本仍处于灰度测试阶段，升级将分批次陆续推送至全量用户。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/011/176.htm", "publishedAt": "2026-10-10T00:04:25+00:00"}, {"title": "谷歌预告 10 月 12 日将推新品，预估为 Fitbit Edge 手环", "summary": "IT之家 10 月 10 日消息，谷歌 Google Health 官方账号（@googlehealth）今天（10 月 10 日）在 X 平台发布推文，预告将于 10 月 12 日发布新款产品，预估关联近期 Fitbit Edge 健身手环。图片展示了疑似设备侧边按键，配文写有“Get an Edge on your health”和“10.12.26”。这款设备的相关图片最早可追溯至 8 月。当时，9to5Google 在谷歌 Pixel 11 的宣传材料中发现一款未命名健身追踪器。法国媒体 Dealabs 后续报道了设计、续航和可能售价等信息。据 Dealabs 报道，关闭常亮显示后，Fitbit Edge 单次充电续航最长可达 7 天；开启后约为 2 天。报道还称，该设备在欧洲的售价可能为 179 欧元（IT之家注：现汇率约合 1,347 元人民币）。延伸阅读谷歌与 Fitbit 的关联可追溯至 2019 年。2019 年 11 月 1 日，Fitbit 宣布与谷歌达成最终协议，谷歌以每股 7.35 美元（现汇率约合 49.4 元人民币）现金收购 Fitbit，对应完全稀释股权价值约 21 亿美元（现汇率约合 141.02 亿元人民币）；该交易在通过监管审批后于 2021 年 1 月完成。此后 Fitbit 品牌与产品线逐步整合进谷歌的健康硬件体系。在 Fitbit Edge 之前，谷歌于 2026 年 5 月推出无屏幕、无按键的健身手环 Fitbit Air，主打极简无感，重量约 5.2 克，续航可达 7 天，售价 99.99 美元（现汇率约合 671.5 元人民币）起，核心监测功能无需订阅即可使用。Fitbit Edge 的定位介于 Fitbit Air 与 Pixel Watch 5 之间。根据 Dealabs 与 Android Headline 等渠道的爆料，Fitbit Edge 配备 1.34 英寸 AMOLED 屏幕，提供 4 种配色组合（分别对应哑光黑、缎面黄铁矿色、香槟金、抛光银等铝制机身与不同运动表带），内置 Gemini 个性化教练，运动模式超过 40 种，支持蓝牙 5.4 与 GPS，兼容运行安卓 11 及更高版本的手机以及 iOS 16.4 及更高版本的 iPhone。文中提及的部分功能可能需要 Google Health Premium 订阅。该服务前身为 Fitbit Premium，月费 9.99 美元（现汇率约合 67.1 元人民币）、年费 99.99 美元（现汇率约合 671.5 元人民币），提供由 Gemini 驱动的健康指导、自适应健身计划和更深入的睡眠洞察等；谷歌称其已包含在 Google AI Pro 及 AI Ultra 订阅内。需要说明的是，常亮显示（AOD）指屏幕在待机状态下仍以低亮度持续显示时间等信息，是这类设备耗电增加的主要原因之一；AMOLED 是一种自发光显示技术；ECG 指心电图检测，SpO2 指血氧饱和度监测。Fitbit Edge 所运行的 Fitbit OS 是 Fitbit 设备使用的操作系统。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/011/163.htm", "publishedAt": "2026-10-09T22:53:39+00:00"}, {"title": "@ 一下就能派活？谷歌推出办公 Agent，拥有独立账号、能够创建子 Agent，还能调用 Claude", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/490gIS9Bk0NmylN7GIt1?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-09T17:15:07+00:00"}, {"title": "长安启源 Q06 新增宁德时代电池选装，纯电里程 602 公里", "summary": "IT之家 10 月 9 日消息，据易车报道，10 月 9 日，长安启源 Q06 正式面向 602 智享型、602 越享型车型，推出宁德时代电芯选装包。用户可选择将 66.02 度中创新航 800V 6C 电芯，升级为同容量规格的 66.02 度宁德时代 800V 6C 电芯，选装升级后整车续航里程维持不变。据介绍，无论是原车标配的中创新航电芯，还是可选装的宁德时代电芯，均纳入长安自研金钟罩电池包完整体系，执行统一的央企严苛品控与安全验证标准，整车性能表现、续航输出以及质保权益完全一致。两套方案同样搭载 800V 碳化硅高压平台、支持 6C 闪充，共享金钟罩电池全套安全防护、长寿命设计，以及首任非营运用户电池终身质保政策。据IT之家此前报道，长安启源 Q06 于 9 月 23 日上市，提供纯电与增程两种动力选择，官方指导价 13.99-16.99 万元。车身尺寸方面，启源 Q06 长宽高分别为 4837mm、1970mm、1670mm，轴距达到 2940mm。启源 Q06 车顶搭载激光雷达，将首搭长安天枢领航 Ultra，具备端到端城市领航能力。新车搭载长安天枢座舱 2.0，配备双 TC399 芯片，搭载天枢智能体“小安”。其车内配备大尺寸悬浮式中控屏、全液晶仪表、大尺寸 HUD 以及三辐式多功能方向盘。此外，新车还搭载 15.6 英寸后排娱乐屏、后排小桌 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
