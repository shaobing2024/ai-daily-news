经用户明确同意的情况下，我们绝对不会自动安装 McAfee。LG Monitor App Installer 是通过微软官方 Windows 分发流程提供的，该流程中包含 McAfee 作为可选项目。只有当用户主动选择继续安装并提供同意后，McAfee 才会安装。在任何情况下，McAfee 都不会自动安装或在未经用户授权的情况下安装。LG Monitor App Installer 不会访问、收集或传输任何客户个人数据。本次最新回应补充了更多信息：LG 电子重申，McAfee 不会自动安装，也绝对不会在未经用户明确许可的情况下安装该应用。LG Monitor App Installer 主要帮助购买 LG 显示器的用户发现可提高生产力、自定义功能和显示器性能的 LG 可选应用程序。连接兼容的 LG 显示器后，LG Monitor App Installer 可以提供相关软件，帮助客户访问显示器的特定功能。在美国，曾有一段时间，McAfee 试用版作为可选推荐提供。McAfee 从未自动安装，始终需要用户单独选择和同意。在审查了客户反馈后，LG 取消了 McAfee 推荐。LG Monitor App Installer 不会从用户设备上收集任何隐私信息，其应用功能是识别兼容的显示器型号，并显示支持这些显示器型号的应用程序。延伸阅读该事件最早由 Reddit 网友于 7 月初反馈，随后 Epic Games CEO 蒂姆 · 斯威尼（Tim Sweeney）于 7 月 19 日在社交平台转发曝光，引发广泛关注。微软 Windows 及设备业务负责人帕万 · 达武鲁里（Pavan Davuluri）于 7 月 22 日在 X 平台回应，确认已联系 LG 电子，LG 同意立即从 LG Monitor App Installer 中禁用 McAfee 弹窗。据 YouTube 频道 GamersNexus 测试，涉及的具体显示器型号为 LG UltraGear 34GX900A-B，售价约 1200 美元。在连续启动 32 次设备过程中，有 31 次出现了 McAfee 试用弹窗。用户可通过组策略编辑器阻止该应用自动安装：进入 gpedit.msc，依次跳转至计算机配置 → 管理模板 → 系统 → 设备安装，启用 \" 阻止与元数据相关联的应用程序自动下载 \" 选项即可。这并非 LG 首次因强制推送软件引发争议。2025 年 12 月，LG 智能电视在升级 webOS 系统更新后自动安装微软 Copilot AI 应用，且用户无法卸载，引发大量用户强烈抵制。最终 LG 承诺在后续更新中赋予用户彻底删除 Copilot 快捷方式的权限。相关阅读：《微软回应“LG 显示器连 Win11 推广 McAfee”事件：已禁用弹窗》《LG 间接承认通过 Win11 更新，向其显示器用户推广 McAfee》《Win11 网友反馈接入 LG 显示器后弹出 McAfee 广告》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/458.htm", "publishedAt": "2026-08-01T03:10:36+00:00"}, {"title": "消息称恩智浦洽谈收购边缘 AI 芯片设计企业 Ambarella", "summary": "IT之家 8 月 1 日消息，《金融时报》当地时间昨日报道称，NXP（恩智浦）正就收购边缘 AI 芯片设计企业 Ambarella（安霸）进行谈判。这笔交易仍在讨论中，不一定会达成。Ambarella 当前市值 37.73 亿美元（IT之家注：现汇率约合 255.24 亿元人民币）。Ambarella 的业务聚焦计算机视觉领域，为汽车电子、安防监控、消费电子、工业 &amp; 机器人供应端侧 AI 芯片。其 CVflow 芯片架构内置专有视觉处理引擎，可以低功耗处理大量视觉信号信息。对于 NXP 而言，收购 Ambarella 可增强其在 SDV、雷达、电气化方面的能力，丰富和增强其车用半导体产品线。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/442.htm", "publishedAt": "2026-08-01T02:08:41+00:00"}, {"title": "高通回应“NEURA 4NE-1 人形机器人倒地”：短暂通信故障触发受控关机", "summary": "IT之家 8 月 1 日消息，科技媒体 Tom's Hardware 昨日（7 月 31 日）发布博文，报道称高通合作伙伴 NEURA Robotics 在演示其 4NE-1 Gen 3.5 人形机器人时，突发演示故障，机器人后仰倒地。IT之家援引博文介绍，4NE-1 人形机器人搭载高通 Dragonwing IQ10 机器人参考设计，具备约 700 TOPS 算力。在演示过程中，该机器人蹒跚地走到身着西装的高通公司高管面前，该高管随后从机器人送来的托盘上拿起一块高通 Dragonwing IQ10 RRD 主板，向在场观众展示。在观众掌声和欢呼声短暂平息后，该机器人突然后仰姿态倒地。现场工作人员反应迅速。多名社交媒体用户注意到，身穿黑衣的工作人员先用紫色布料遮住倒下的机器人，随后由 3 人把机器人抬下舞台，从舞台左侧离场。高通发言人向 Tom’s Hardware 发布声明称：现场演示存在风险。在台北国际电脑展上，一次短暂通信故障触发原型人形机器人的故障，并启动受控关机。机器人执行了设计中的‘安全倒塌’序列，降低对周围环境的风险，安全系统按预期工作。该事件也提供了有价值的真实世界数据，有助于进一步增强系统可靠性，并加快更安全、更具韧性机器人技术的开发。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/432.htm", "publishedAt": "2026-08-01T01:26:19+00:00"}, {"title": "Agent 成本失控背后：上下文、人工审核与维护成本正在被低估｜请回答 WAIC 2026", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/x4PTF8mgDBvtQQYa8B97?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-31T18:48:26+00:00"}, {"title": "下一个国民级 AI 产品，或许就诞生于一人之手", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/uZNH5KLzR1efgGEG0wEq?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-31T18:44:43+00:00"}, {"title": "Agent 形态一天一个样，Infra 到底该为谁而建？| 请回答 WAIC 2026", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/spxwy17ZcfM3BIctR4PL?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-31T18:39:45+00:00"}, {"title": "GitHub AI Agent 翻车：攻击者不用黑客技术，只写一句话就能窃取数据", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/u4rDqep8zVWUJsqVoQ23?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-31T12:00:00+00:00"}, {"title": "米哈游蔡浩宇AI创业生变", "summary": "多个项目暂停，九成资源押向Agent", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/464169.html", "publishedAt": "2026-07-31T07:22:37+00:00"}, {"title": "微软确认开发 Copilot AI 超级应用，整合聊天、编程与智能代理能力", "summary": "微软正在开发一款整合Copilot聊天、编码助手和智能代理能力的AI“超级应用”，微软首席执行官萨蒂亚·纳德拉在最新财报电话会议中确认，该应用计划于今年推出，并覆盖消费者与商业两类使用场景。 纳德拉表示，Copilot正在从单纯的聊天助手快速演进，扩展至协同办公和自动化执行领域。微软将在本季度推动不同Copilot体验的...", "sourceName" const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
