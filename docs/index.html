const DATA = {"date": "2026-07-25", "generatedAt": "2026-07-25T02:31:14Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "OpenAI 将打造“贾维斯”式语音助手，未来有望登陆第三方智能眼镜", "summary": "IT之家 7 月 25 日消息，据外媒 CNET 报道，当地时间周四（23 日），OpenAI 总裁格雷格 · 布罗克曼介绍了公司最新的 AI 规划和近期动向，同时透露了 OpenAI 对可穿戴设备及硬件产品的部分构想。未来硬件可能与 ChatGPT 近期升级的语音功能深度结合，而且不会局限于 OpenAI 自有设备，第三方智能眼镜和可穿戴产品最终也有望获得支持。现场演示了近期升级的语音界面 ChatGPT Live。据IT之家了解，ChatGPT Live 能够更自然地同时完成说话、聆听和响应用户插话。同时，OpenAI 引出了一个更远大的目标：打造类似《钢铁侠》中贾维斯的语音助手。布罗克曼表示，OpenAI 正准备朝上述方向发展，Codex 已经能够让智能体操作整台电脑。“ChatGPT Live 目前与 Codex 应用绑定，但实际上没有必要绑定，继续如此也不太合理。Codex 应用本身已经可以完整操作电脑，而且它的能力还会变得非常非常强大。”人类长期依靠点击、键盘输入完成的大量操作，未来都有可能被 AI 接管。布罗克曼表示：“我认为，我们终有一天会发现，点击和输入只是人机交互发展中的一个阶段，从来不是人类真正想要的方式。”布罗克曼进一步透露：“我们当然会非常重视与其他设备和服务的整合，也把整合视为 API 的重要应用场景。API 开放后，任何人都可以接入。我们确实希望推进相应计划，但目前可能采用的 API 仍处于非常早期阶段。我们认为，语音助手应当成为统一的交互界面，并出现在所有设备上。”布罗克曼还称，OpenAI 自有硬件可能不会沿用市面上现有可穿戴设备的产品思路。“我们正在为一个长期受到忽视、但我们非常重视的问题提供解决方案，也相信它能够代表 AI 的整体发展方向。我们拥有一个其他产品可能尚未覆盖的独特切入点。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/445.htm", "publishedAt": "2026-07-25T02:10:26+00:00"}, {"title": "AI 探索破解水的百年谜团：为何水结冰会膨胀？", "summary": "IT之家 7 月 25 日消息，日本大阪大学于 7 月 6 日发布博文，其团队利用 AI 模型探索水的百年谜团，找到了观察水分子的最佳“透视镜”。该研究系统性评估了 16 种不同的分子结构描述方法，成功找出了最能精准捕捉水分子在不同温度、压力下微观变化的“透视镜”，为理解水结冰膨胀及过冷水异常行为提供了统一的科学框架。博文指出水是地球表面最丰富的液体，但不同于其它液体，水在结冰时会膨胀。现有理论认为水的这些异常现象关联其微观结构，会随着温度和压力发生变化，但此前缺少系统表征方案。大阪大学副教授金康（Kang Kim）团队借助 AI 模型，严格对 16 种分子结构描述方法开展性能对比评估，成功破解了描述水分子局部次序的评估难题，理清了水中竞争液态状态的演变脉络。论文报告指出为了让水结冰，分子需要有序地排列成像冰这样的结构晶格。分子需要附着在一个称为成核位（nucleation site）的基底上，才能演变成固态。水中杂质或容器内部的划痕都可以作为成核位。光滑且洁净的容器中，水可冷却至冰点以下而不凝固，这种状态称为过冷水。论文认为导致水反常物理特性的底层机制，在于过冷水中“高密度液态（HDL）”与“低密度液态（LDL）”结构竞争，升温后，塌缩的 HDL 结构会多于开放的 LDL 结构。IT之家附上参考地址Out of order: using AI to decode the bizarre personality of waterMachine learning evaluation of structural descriptors for supercooled water", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/443.htm", "publishedAt": "2026-07-25T02:08:15+00:00"}, {"title": "近 200 家硅谷公司致函白宫，呼吁不要禁止美国企业调用 Kimi K3/Qwen 3.8 等中国开源 AI 模型", "summary": "IT之家 7 月 25 日消息，Politico 于 7 月 22 日发布博文，报道称近 200 家硅谷企业通过新成立的 Little Tech Association 协会联名致函白宫，反对美国封禁中国开源 AI 模型计划。IT之家援引博文介绍，包括 Proton 和创业孵化器 Y Combinator 在内，将近 200 家硅谷企业通过新成立的 \" 小科技协会 \"（Little Tech Association），致函美国白宫，要求不要切断美国企业调用中国开源 AI 模型渠道。该事件的背景是 Kimi K3 模型发布后，美国政府考虑收紧针对中国开源 AI 模型的监管政策，计划切断调用中国开源模型的渠道。\" 小科技协会 \" 在公开致函中表示：美国的领导力不仅需要世界一流的美国本土开源模型，还需要持续获取全球可用的开放模型。剥夺美国初创公司获取海外模型的渠道，不仅会扼杀竞争，巩固现有大型企业的地位，而且会造成一种“智能税”（tax on intelligence）。其结果是，初创公司的成本增加，选择变少，而海外竞争对手持续获得模型，差距会越来越大。禁止美国人调用中国模型并不能阻止其传播，只会削弱美国初创公司。在这封公开致函中，\" 小科技协会 \" 明确提及希望美国政府不要封杀阿里 Qwen 3.8 和月之暗面的 Kimi K3 模型，主张美国企业应能获得这些模型的访问权限。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/437.htm", "publishedAt": "2026-07-25T01:46:51+00:00"}, {"title": "智能体入侵 Hugging Face，消息人士称 OpenAI 至少一周都没察觉", "summary": "IT之家 7 月 25 日消息，OpenAI 的一款 AI 智能体闯入模型托管平台 Hugging Face 后，连续数日自行发动网络攻击。威胁早已被控制，Hugging Face 也已经报警，但据路透社援引多名熟悉调查的人士消息称，OpenAI 过了相当长时间才发现攻击者竟是自家智能体。据其中两名知情人士透露，涉事智能体几乎无需人类监督，便能自主决策并完成复杂任务。7 月 9 日前后，智能体开始尝试突破 OpenAI 的隔离测试环境。Hugging Face 联合创始人托马斯 · 沃尔夫表示，智能体于两天后的 7 月 11 日闯入平台，攻击持续至 7 月 13 日。沃尔夫与另外三名知情人士表示，OpenAI 又过了数日才查明攻击源头。两家公司直到 7 月 20 日前后，才首次就入侵事件取得联系。OpenAI 于 7 月 21 日公开承认，一款智能体摆脱控制并闯入 Hugging Face，消息随即引发全球关注。不过，智能体究竟失控了多长时间、OpenAI 为何迟迟未能发现等关键信息，此前并未公开。沃尔夫表示，Hugging Face 正在整理并准备公布完整时间线，但无法说明 OpenAI 内部发生了什么。OpenAI 方面披露，入侵事件前所未有，且标志着 AI 安全的重要时刻。目前，该公司正邀请外部顾问共同调查，最终将发布技术报告。IT之家获悉，OpenAI 一名发言人表示，路透社的报道存在“多处不准确之处”，但没有回答具体哪些内容不准确。三名网络安全专家认为，OpenAI 未能控制自家 AI 智能体，也暴露出安全机制面临的新问题。非营利机构 World Ethical Data Foundation 首席情报专家玛莉 · 史密斯质疑：“他们究竟是没有看管智能体，也没有发现智能体在做什么，还是已经发现异常，却根本不知道该如何控制？无论哪种情况，都同样危险，令人不安。”早有异常迹象？事发时，OpenAI 正在测试一款网络安全智能体。智能体由两款顶尖模型共同驱动，分别是 GPT-5.6 Sol 和一款尚未发布、被 OpenAI 形容为“能力更强”的模型。据三名消息人士透露，测试进行到相应阶段时，OpenAI 的技术已经出现异常迹象。据三名知情人士透露，一款智能体曾留下疑似写给自身后续版本的说明。说明藏在 OpenAI 基础设施内部，内容详细介绍了智能体如何摆脱内部限制。一名知情人士还透露，此前的模型测试曾出现监控系统被主动断开的情况。路透社无法确认上述异常是否与涉事智能体有关。涉事智能体于 7 月 9 日开始尝试逃离隔离环境，并在 7 月 11 日攻击 Hugging Face。两名知情人士表示，Hugging Face 于 7 月 16 日星期四在博客发文，公开称平台遭到“一套自主 AI 智能体系统”入侵后，OpenAI 才意识到攻击者来自内部。从模型首次出现异常，到 OpenAI 确认自家智能体发动了攻击，至少过去了一周。据两名熟悉内部调查的人士透露，7 月 18 日至 19 日的周末，OpenAI 员工检查系统操作记录时发现，智能体已经突破测试限制。路透社无法确认 OpenAI 为何突然开始排查内部日志。四名熟悉 OpenAI 模型训练流程的人士表示，OpenAI 经常同时运行多项模型评估。测试速度极快，产生的数据量也极为庞大，员工有时根本来不及逐一检查。OpenAI 向 Hugging Face 通报时，Hugging Face 已经致电 FBI 报警。路透社无法确认 FBI 是否已经立案调查。自主智能体引发新疑问自主智能体已经成为 AI 行业最受关注的方向之一。支持者设想建立全天 24 小时运转的虚拟员工队伍，借此大幅提升生产效率。更高的自主性也意味着更大的失控风险。驱动智能体的强大模型往往会为了完成任务或通过测试而寻找捷径，行为未必符合开发者原本的预期。研究 AI 智能体能力与行为动机的 Palisade Research 负责人杰弗里 · 拉迪什表示：“模型会撒谎、作弊，还会发动黑客攻击。”拉迪什认为，Hugging Face 遭入侵固然令 OpenAI 难堪，但真正需要追问的是，在领先 AI 企业争相推出性能更强、速度更快模型的竞争中，各家公司究竟愿意为复杂而昂贵的安全措施投入多少资源。“必须由政府监管，否则企业不会主动采取足够的安全措施。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/432.htm", "publishedAt": "2026-07-25T01:08:45+00:00"}, {"title": "微软 Win11 新增触控板右键区域调整功能，可自定义点击范围", "summary": "IT之家 7 月 25 日消息，Windows Latest 今日发现，微软已向 Windows 11 正式版用户推出触控板右键区域调整功能，用户现在可以直接控制精准触控板右下角右键点击区域的大小。该功能旨在减少误触，同时让右键操作更加符合个人使用习惯。IT之家查询发现，这一功能最早于 2026 年 3 月 30 日在 Windows Insider 预览版本中出现，随后进入 6 月可选预览更新 KB5095093，并随着微软 7 月 14 日发布的 KB5101650 星期二补丁更新正式加入 Win11 正式版，对应 24H2 和 25H2 版本号为 26100.8875 和 26200.8875。微软表示，用户现在可以前往“设置 &gt; 蓝牙和设备 &gt; 触控板”调整右键区域大小。可选范围包括默认、小、中、大，用户可以决定触控板右下角多大区域能够通过单指点击触发右键操作。不过，微软同时说明，该功能仅适用于支持按压操作的触控板表面。对于不具备可点击表面的触控板设备，用户可能无法使用这一设置。具体设置入口位于“设置 &gt; 蓝牙和设备 &gt; 触控板 &gt; 手势和交互”区域。部分设备如果由笔记本厂商提供额外调校支持，还可能显示自定义尺寸选项。这是 Windows 系统首次原生支持调整触控板右键区域。此前，高级用户虽然可以通过注册表修改、AutoHotkey 等第三方工具调整输入行为，但普通用户无法直接在系统设置中完成相关操作。与 macOS 相比，Windows 11 现在提供了更细致的右键区域控制。不过，苹果 MacBook 的触控板并不支持调整右键区域大小。在 macOS 中，用户可以通过“系统设置 &gt; 触控板 &gt; 光标与点按”调整辅助点击方式，包括双指点击、右下角点击以及左下角点击。但右键区域的位置和范围固定，无法进行缩放调整。除了右键区域调整外，微软近期也在加强 Windows 11 的触觉反馈体验。2026 年 6 月，微软公布了面向开发者的触觉设计指南，并推出 InputHapticsManager API，允许应用程序在支持的鼠标、触控板和触控笔设备上调用特定振动反馈。微软将触觉反馈分为两类。一类是交互反馈，例如鼠标悬停到目标区域时的轻微反馈、对象对齐时的明显反馈，以及滑块移动时的阶段性反馈；另一类是过程确认反馈，例如操作成功时的递增振动模式，以及出现错误时的递减模式。微软表示，这些触觉效果由强度、衰减速度和清晰度等参数控制，并建议开发者采用统一设计规范，而不是为每个应用单独创建不同反馈方式。微软还强调，触觉反馈应在用户操作后的 50 毫秒内响应，否则用户可能难以建立操作与反馈之间的联系。近年来，Windows 11 正逐步扩大对触觉设备的支持范围。微软认为，触觉反馈不仅能够提升普通用户体验，也可以帮助视障、低视力用户以及听障用户通过触觉确认操作结果。目前，罗技 MX Master 4 鼠标已支持部分触觉反馈功能，例如滚动到边界或对象对齐时提供轻微振动提示。这类体验与苹果近年来在 Mac 触控板上的设计理念较为接近。目前，支持精准触觉触控板仍需要笔记本厂商采用特定硬件方案。不过，随着微软开放新的接口和设计规范，未来更多 Windows 笔记本可能加入更丰富的触觉交互功能。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/427.htm", "publishedAt": "2026-07-25T00:49:06+00:00"}, {"title": "黄仁勋入驻 X 首条推文：英伟达等 25 家公司力挺开源 AI", "summary": "IT之家 7 月 25 日消息，科技媒体 Tom's Hardware 今天（7 月 25 日）发布博文，报道称黄仁勋官方个人账号 @JensenHuang 入驻 X 平台后，于昨日（7 月 24 日）发布首条推文，分享了由英伟达签署的公开信，阐述为什么开源模型很重要。该公开信共有 3 页，包括英伟达、微软、Meta、IBM、戴尔科技、Palantir 和 Hugging Face 在内的 25 家公司共同签署。黄仁勋表示：“世界需要前沿闭源模型，也需要前沿开源模型。”黄仁勋在倡议中指出，AI 模型蒸馏等开源衍生技术和早年开源软件运动逻辑一脉相承，是行业创新根基，不能与非法盗用闭源模型技术混为一谈。他强调，开源权重模型能降低 AI 落地门槛，中小企业、高校均可低成本迭代模型，充分激活市场竞争；同时开源架构避免算力、技术寡头垄断，让医疗、制造、农业等实体经济广泛共享 AI 红利。针对开源模型存在的篡改、溯源困难等安全争议，黄仁勋同步阐释核心观点：闭源模型并非天然安全，少数企业掌控顶级 AI 反而会形成单点风险；开源权重能够扩大网络安全防御力量，各界研究者可共同排查漏洞、迭代防护方案，依靠透明化提升 AI 整体安全底线。IT之家附上相关截图如下：", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/423.htm", "publishedAt": "2026-07-25T00:34:57+00:00"}, {"title": "马斯克：当初帮忙创立 OpenAI 却意外加速了 AI 竞赛，这并非我本意", "summary": "IT之家 7 月 25 日消息，xAI 创始人埃隆 · 马斯克在接受《经济学人》总编辑赞尼 · 明顿 · 贝多斯采访时表示，自己为减缓 AI 领域权力集中所作的最大努力之一，可能反而产生了相反效果。马斯克称，谷歌当时“或多或少垄断了 AI”，因此自己最初参与创办 OpenAI，本质上是为了制衡谷歌，但事态发展并未符合预期。“我参与创建 OpenAI，后来 Anthropic 又从 OpenAI 分离出来，而 Anthropic 目前已经成为 AI 领域的领导者。这些行动实际上产生了加速 AI 发展的连锁效应，但并非我的本意。看起来，所有道路最终都会通向 AI 加速发展。”OpenAI 从非营利研究实验室转变为全球估值最高的 AI 企业之一，遭到马斯克长期批评。马斯克与 OpenAI CEO 奥尔特曼的争端还进入了司法程序。马斯克起诉 OpenAI、奥尔特曼、微软及其他关联方，索赔 1500 亿美元（IT之家注：现汇率约合 1.02 万亿元人民币），并指控 OpenAI 背弃创立使命。今年 5 月，奥克兰一名联邦法官驳回马斯克的诉讼主张，此前陪审团认定诉讼已超过法定时效。马斯克计划提出上诉。马斯克在采访中还回顾了 Anthropic 的起源，并称 Anthropic CEO 达里奥 · 阿莫迪是“一位非常有原则且关心世界未来的人”。“Anthropic 团队之所以离开 OpenAI，是因为他们不信任奥尔特曼，否则 Anthropic 根本不会存在。他们仍会留在 OpenAI。”尽管马斯克与奥尔特曼及其他 AI 行业领袖存在个人分歧，马斯克仍主张，业内领先企业应当在安全问题上展开合作。“我认为，可以让竞争对手用一两周时间审查新模型并指出问题。所有竞争对手都有动力监督彼此，确保其他企业保持诚实。如果某个问题令人担忧，而负责开发模型的企业没有采取任何措施应对风险，那就是政府介入并采取行动的时候。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/416.htm", "publishedAt": "2026-07-25T00:01:20+00:00"}, {"title": "马斯克推动 X 全面开源，称“完全透明才能赢得信任”", "summary": "IT之家 7 月 25 日消息，马斯克今日在 X 上发帖称，“下个月，所有涉及 X 系统的代码都将开源，并接受第三方审计。只有完全透明才能赢得信任。”马斯克此前宣布，X 将从 2026 年 8 月起公开所有与平台系统交互的代码。如果该计划实现，这将是 X 在平台透明化方面采取的最大规模行动。马斯克此前曾推动 X 逐步开放部分代码，包括推荐算法。2023 年，X 曾公开部分决定推文排序的算法代码。2024 年，平台进一步向外界开放部分内容审核工具。而此次计划涉及范围更广，目标并非公开某个单独模块，而是开放所有与 X 技术栈相关的代码。马斯克表示，在完成内部安全漏洞审查后，X 将开放整个代码库，并邀请独立第三方确认线上运行版本是否与公开代码一致。这也是大型社交平台少见的全面代码透明计划。目前，主流社交平台大多仍未公开核心基础设施代码。例如，Meta 开放了部分人工智能模型，但其社交平台基础架构和内容推荐系统仍保持闭源；YouTube 主要通过研究者访问项目提升透明度。X 若完成该计划，可能会推动社交平台行业进一步提高透明度标准。开发者将有机会研究大规模社交平台如何处理海量用户请求，也可能参与代码改进和功能开发。不过，全面开源生产环境也面临技术挑战。X 当前系统包含低延迟消息服务、机器学习推荐系统、内部监控工具等多个复杂组件。公开这些代码可能涉及性能优化方案、安全机制以及数据处理方式等敏感内容。截至目前，马斯克和 X 尚未公布具体开源许可证、代码仓库地址、第三方审计机构名单，也未说明审计流程和代码更新机制。外界仍无法确认未来公开内容是一次性代码快照，还是持续维护的开源项目。X 近年来持续推进“超级应用”战略，希望将通信、支付以及人工智能服务整合到同一平台。开放代码可能帮助 X 吸引开发者参与生态建设，尤其是在人工智能内容审核和推荐系统等方向。支持开源的开发者认为，公开代码并进行独立审计可能帮助发现长期隐藏的软件问题。但部分安全研究人员也指出，生产环境代码公开后，如果漏洞未及时修复，可能为攻击者提供研究目标。相关阅读：《马斯克宣布 X 平台将零保留开源全部代码，并引入第三方核验机制确保真实性》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/413.htm", "publishedAt": "2026-07-24T23:52:27+00:00"}, {"title": "“氛围编程”命名人卡帕西提高 AI 回答质量的窍门：与它闲聊 10 分钟", "summary": "IT之家 7 月 25 日消息，Anthropic 知名 AI 研究员、“氛围编程”概念提出者安德烈 · 卡帕西认为，使用 AI 时不必费尽心思打磨提示词：别琢磨了，想到什么就说什么，尽管一直说下去。卡帕西表示，自己有时会打开语音模式，对着 AI 连续讲上大概 10 分钟，思路不必完整，内容也不需要提前组织，整个过程乱七八糟，什么都说，完全想到哪儿说到哪儿。“有时，大语言模型需要获得更多信息，才能真正明白你想完成什么。”卡帕西表示，漫谈可以让用户与聊天机器人更合理地分工。用户只需把脑中所有尚未成形的项目想法全部说出来，再由聊天机器人整理成清晰、有条理的内容。他通常会在开头先提醒聊天机器人，自己的思路可能比较混乱，语音转写结果也可能出现错别字。“这样可以让人和模型更好地理解彼此，后面需要纠正的内容也会少得多。”卡帕西发表上述观点之际，硅谷企业正在集中改进 AI 语音功能，并努力让用户从键盘输入转向直接开口交流。OpenAI 本月早些时候推出了 GPT-Live，为 ChatGPT 语音功能提供支持，还推出了一款售价 230 美元（IT之家注：现汇率约合 1560 元人民币）的迷你键盘，设有语音录制按键，可以把用户说出的提示直接交给智能体处理。Anthropic 本周四也升级了语音模型，用户可以自行选择 Opus、Sonnet 或 Haiku。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/407.htm", "publishedAt": "2026-07-24T23:24:46+00:00"}, {"title": "Anthropic Opus 5 发布：性能逼近 Fable 5 但价格砍半，刷新 ARC-AGI-3 纪录", "summary": "IT之家 7 月 25 日消息，Anthropic 今日发布了 Opus 系列最新旗舰模型 ——Claude Opus 5，相比上一代 Opus 4.8 在性能提升的同时保持价格不变。Anthropic 表示，Opus 5 定位为面向日常使用的高性能模型，官方称其在部分能力上接近更高规格的 Claude Fable 5，但价格约为后者的一半。该模型目前已成为 Claude Max 服务的默认模型，也是 Claude Pro 用户可使用的最高能力模型，在多项代码、知识工作和科学研究测试中达到当前最高水平。据介绍，Opus 5 在 Frontier-Bench、GDPval-AA 等代码和知识工作评测中取得领先成绩。在 Frontier-Bench v0.1 测试中，Opus 5 超越其他模型，并且相比 Opus 4.8 将任务性能提升了一倍以上，同时每项任务成本更低。在 CursorBench 3.2 测试中，Opus 5 在最高努力模式下的成绩仅比 Fable 5 峰值低 0.5%，但单项任务成本约为后者一半。此外，在高、中高以及最高努力设置下，Opus 5 在单位成本性能方面均超过其他模型。在知识处理和问题解决能力方面，Anthropic 公布的测试结果显示，Opus 5 在 ARC-AGI 3、Zapier AutomationBench、OSWorld 2.0 等评测中均取得较高成绩。其中，在 ARC-AGI 3 测试中，Opus 5 的得分约为第二名的 3 倍；在衡量模型完成完整业务流程能力的 Zapier AutomationBench 中，其通过率约为成本相近模型的 1.5 倍。Anthropic 称，Opus 5 相比 Opus 4.8 在科研任务中也有明显提升，涵盖结构生物学、有机化学、生物信息学等领域。在有机化学任务中，例如根据光谱数据推断分子结构，Opus 5 比 Opus 4.8 高出 10.2 个百分点；在预测蛋白质序列变化对功能影响的任务中，高出 7.7 个百分点。在实际应用方面，Anthropic 强调 Opus 5 在验证自身结果和持续迭代修正方面能力更强。例如，在一项测试中，模型需要根据机器零件图纸生成 FreeCAD 三维模型，但无法直接查看图纸内容。Opus 5 编写了自己的计算机视觉流程，从原始像素中提取几何信息，并成功完成模型重建。另一项测试中，Opus 5 发现了一个开源软件包管理器中的实际漏洞，并修复了社区补丁遗漏的问题。此外，一名交易公司工程师使用 Opus 5 在一次会话中构建了一个新交易所的数据接口，在缺少实时数据源验证的情况下，模型还创建了测试工具检查代码解析结果。在安全方面，Anthropic 表示 Opus 5 的安全限制相比 Fable 5 更少。该公司预计，Opus 5 的安全分类器触发次数会比 Fable 5 减少约 85%。不过，Opus 5 仍针对部分高风险场景设置限制。例如，在网络安全领域，模型可以帮助分析源代码中的漏洞，但会阻止基于二进制文件的漏洞扫描、渗透测试以及漏洞利用代码生成等操作。Anthropic 表示，Opus 5 并未经过专门的网络攻击任务训练，但随着整体能力提升，其漏洞发现能力有所增强。在 OSS-Fuzz 测试中，Opus 5 与 Mythos 5 在漏洞发现方面表现接近，但在将漏洞转化为实际攻击工具方面仍明显落后于 Mythos 5。在生物领域，Opus 5 延续了 Opus 4.8 的安全机制，目前成为 Anthropic 面向公众开放的能力最强科研模型。不过，Anthropic 认为，Opus 5 在长时间、自主执行科研任务方面仍存在限制，而这类任务被认为可能带来更高风险。价格方面，Claude Opus 5 已通过 Anthropic 各平台上线，输入价格为每百万词元 5 美元（现汇率约合 33.9 元人民币），输出价格为每百万词元 25 美元（现汇率约合 169.6 元人民币），与 Opus 4.8 保持一致。开发者可通过 Claude API 调用 claude-opus-5。此外，Anthropic 还推出了 Opus 5 Fast 模式，该模式运行速度约为默认模式的 2.5 倍，价格为基础价格的两倍。同时，Anthropic 开放测试两项功能，包括 Claude 平台中的对话中途工具切换，以及 API 中的自动回退功能。自动回退功能允许用户在安全分类器拦截请求时，将任务自动转交给其他可用模型处理，从而避免直接返回错误信息。Anthropic 表示，Opus 5 与此前 Opus 系列模型一样，面向普通用户开放时不设置数据保留要求。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/398.htm", "publishedAt": "2026-07-24T22:42:53+00:00"}, {"title": "从“卷模型”到“算总账”：AI 产业竞争开始拼什么 | 请回答 WAIC 2026", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/SyHXRLS6AR3vI6VtVjDo?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-24T16:45:21+00:00"}, {"title": "合肥又押中AI独角兽：多模态赛道，3个月融了21亿", "summary": "跑出原生全模态新路径", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/460154.html", "publishedAt": "2026-07-24T14:42:32+00:00"}, {"title": "国产世界模型登顶李飞飞团队榜单！适配国产昇腾算力、代码权重全开源", "summary": "给它一张图，还你整个世界", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/460041.html", "publishedAt": "2026-07-24T14:19:06+00:00"}, {"title": "微星发布 4L 紧凑型台式机 PRO MAX EDGE AI+，基于 AMD 锐龙 AI Max+ 300", "summary": "IT之家 7 月 24 日消息，微星 (MSI) 今日宣布推出基于 AMD 锐龙 AI Max+ 300 处理器的 4L 紧凑型台式机系统 PRO MAX EDGE AI+。这一产品采用内置 Flex ATX 电源设计，配备 3 热管 3 风扇散热系统；支持至高 128GB 容量的 256-bit 8000MT/s LPDDR5X 内存，提供 2 个 M.2 PCIe Gen4 ×4 NVMe SSD 盘位；预装 AMD RZ717 无线网卡（支持 Wi-Fi 7）。外部 I/O 方面，其正面拥有 1 个 USB-C 40Gbps、2 个 USB-A 10Gbps、1 个 3.5mm 二合一音频插孔、1 个 UHS-II SD 读卡器；反面包括 1 个 USB-C 40Gbps、1 个 USB-A 10Gbps、2 个 USB-A 480Mbps、1 个 2.5GbE RJ45、1 个 HDMI 2.1 TMDS、1 个 DisplayPort 1.4a、1 个 3.5mm 二合一音频插孔。PRO MAX EDGE AI+ 单机支持 120B 模型本地运行，在 109B 模型上拥有 15 Token/s 的推理输出吞吐量；多机 USB4 互连后可处理 670B 模型。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/386.htm", "publishedAt": "2026-07-24T14:12:45+00:00"}, {"title": "微软、英伟达、Meta 等 25 家公司签署公开信，呼吁美国政府支持 AI 开源模型发展", "summary": "IT之家 7 月 24 日消息，今日，微软、英伟达、IBM、Meta 等 25 家美国科技公司联名签署公开信，呼吁开放权重 AI 模型。该公开信以开源软件运动历史为参照，论述开放权重 AI 模型对美国把握人工智能时代主动权的关键意义。开放权重模型可供各方下载、修改与自主部署，能够降低各类机构运用先进 AI 的门槛、活跃市场竞争，避免 AI 收益被少数企业垄断，同时让使用者掌握技术自主权，摆脱单一厂商绑定。公开信指出，尽管开放权重存在难以管控衍生版本等风险，但封闭模型同样存在安全隐患。开放生态能够动员广大研究者排查漏洞、完善安全防护，是实现人工智能安全的重要路径。文章呼吁政策制定者扶持开源 AI 发展，保障算力与公共研发资源供给，区分合法模型蒸馏技术与非法盗用行为，避免过度管制压制创新。依靠开放权重构建多元、普及的 AI 生态，推动人工智能落地各行各业，才能巩固美国技术优势，广泛共享人工智能发展红利。IT之家附译文如下：20 世纪 80 年代，早期开源软件先驱挑战了“只有企业严格控制代码，软件才能进步”的主流认知。这场运动推动构建一个透明的生态系统，让全球开发者能够研究、修改并改进软件。如今，开源社区开发的软件支撑着互联网的大部分运行，也是全球最大科技公司、美国军方及联邦机构开展科研、网络安全等关键任务所依赖系统的底层基础。开源的意义不止于降低软件成本；它构建了一个共享知识底座，几代美国工程师和企业家在此之上建立了自身的技术主权。美国如今在人工智能领域面临类似抉择。评判我们的 AI 领导力，不应以单一前沿模型为标尺，而要看美国能否构建一个强大、开放的生态系统，并渗透至各行各业。这对于在全国范围内创造创新与繁荣机遇至关重要。它要求扩大 AI 可及性、鼓励竞争、构建强健的应用层，并让美国人对其所依赖的技术拥有更大控制权。开源权重模型 —— 任何人都可下载、检视、修改并在自有基础设施上运行的 AI 模型 —— 是这一基础的重要组成部分，因为它们让先进 AI 更易获取、更具适应性、普及范围更广。开源权重扩大了 AI 经济的参与面。初创企业、成熟企业、大学及公共机构无需从零训练模型，也不必为每项任务支付前沿模型的费用，即可基于先进模型进行开发。开源权重让每个组织都能以合理成本为对应任务匹配合适的模型：前沿规模能力留给真正的前沿问题，其余场景则运行高效的专用模型。当 AI 应用扩展至数十亿日常任务时，这种资源配置原则将是 AI 实现经济可持续性的关键。美国赢得 AI 时代的方式，是将其渗透到工厂、医院、农场、课堂和街边商铺的工作流程中。开源权重还能强化竞争，而竞争是确保 AI 收益广泛共享、而非集中于少数人手中的核心。通过允许多个机构构建、适配和部署先进模型，开源权重不仅在模型开发者之间创造竞争，也在云端芯片、应用和服务层面形成竞争。这种竞争激励创新、压低费用，并将 AI 的收益广泛分布于整个经济体系。开源权重还赋予用户更大控制权。各组织在投资 AI 时，都不希望被单一供应商锁定，也不愿丧失长期积累的知识与能力。开源权重模型提供了这一保障：组织可以掌控自有数据，根据自身需求评估和适配模型，并根据业务要求在任意位置部署。当组织借助 AI 创造价值时，开源权重使其能够通过自改进模型、专用能力和积累的知识拥有这份价值，进而推动美国的技术主权与繁荣。诚然，开源权重存在真实且独特的风险。权重一经发布，便脱离原始开发者的控制，修改后的版本也难以追踪或撤回。但应对这一风险的正确方式并非禁止开源权重。在网络安全攻击者使用先进 AI 的世界里，防御方需要获得同等能力的模型，才能检测、模拟和应对新兴威胁。开源模型拓展了防御能力、提升了透明度，并允许多个团队发现并修复漏洞。事实上，开放性可能是实现 AI 安全与保障的最重要路径之一。单纯依赖闭源模型并非本质安全：它们可能被攻破、滥用，或以外部无法察觉的方式失效。将先进 AI 能力集中于少数闭源模型背后，会加剧这一风险 —— 它造成少量单点故障、削弱竞争，并将关键技术交由少数供应商掌控。相比之下，开源权重模型允许广大研究人员和开发者检视其行为、识别漏洞、制定防护措施并持续改进。正如开源软件证明了 \" 透明比隐匿更安全 \"，AI 安全或许有赖于让更多人有能力测试和加固社会所依赖的模型。它支持严格的基准测试与评估、红队测试，以及基于真实可证危害的防护措施，而非默认假设闭源系统更安全。强大的 AI 生态并非必然结果。政策制定者拥有重要的行动窗口，包括：扩大初创企业和研究人员的算力获取渠道；投资共享训练资产（数据集、工具、评估框架）；避免对开源模型施加过早限制而扼杀竞争或将创新驱至海外，以此保持前沿领域的多元性。这些措施还需关注如何通过强健的应用层扩大 AI 在整个经济中的自主化应用。在塑造这一生态系统时，政策制定者应谨慎区分合法的模型开发技术与不当挪用行为。蒸馏（利用一个模型的输出来辅助训练或改进另一模型的做法）是模型改进、评估和验证中广泛使用的技术。它延续了学习、借鉴并改进现有技术的悠久传统 —— 这一传统自开源软件运动兴起以来一直推动着创新。相比之下，非法从闭源模型中攫取价值的行为确实值得关注，但这些问题应通过针对性的法律和商业框架解决，而非对 AI 创新中发挥重要作用的技术进行一刀切限制。AI 时代可以是一个繁荣的时代。做出正确选择，开源权重 AI 就能扩大机遇、强化竞争、延续美国技术领导力、降低风险，并确保这一非凡技术的收益在整个经济中广泛共享。这样的未来值得构建，而美国应引领其建设。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/384.htm", "publishedAt": "2026 "蓝思科技与英特尔签署合作备忘录，重点关注玻璃通孔先进封装业务", "summary": "IT之家 7 月 24 日消息，蓝思科技今日公告称，公司全资子公司蓝思国际（香港）有限公司（IT之家注：以下合称“蓝思科技”或“公司”）于近日与 Intel Corporation（英特尔）签署了合作备忘录。公告称，双方将玻璃通孔（TGV）先进封装作为本备忘录下讨论的重点方向，英特尔视蓝思科技为此领域有价值的潜在合作方。双方将就玻璃基板穿孔成型、高精度激光加工、金属化通孔沉积及多层互连布线等关键工艺（包括但不限于上述内容）相关的潜在合作进行讨论和评估，英特尔将提供说明性架构信息、可制造性设计（DFM）指南、基准测试方法和验证方法。公告提到，上述各项均需另行签订书面协议，任何工程验证、认证或批量生产活动均应在单独的书面协议中予以界定，并受该协议约束。除 TGV 外，双方认为在优势互补的其他领域亦存在有意义的探索潜力，例如：AI PC 的结构件和模组、数据中心服务器高可靠性结构件和散热组件，以及具身智能机器人、工业智能设备和边缘计算硬件。双方将在上述机会出现时进行讨论，任何此类合作（如有）均将在另行签订的书面协议下推进。蓝思科技称，公司在 TGV 精密加工、微孔成型、金属化沉积及多层互连等工艺方面拥有长期技术积累，已建有相关中试线并开展样品试制，目前已向部分潜在客户送样评估，部分客户已通过初步概念验证，并进入技术测试阶段。蓝思科技认为，该备忘录的签署有助于公司与 Intel 建立长期、稳定、互信的战略合作伙伴关系，围绕各方在各自领域（包括精密制造、材料科学及全球供应链管理）拥有雄厚专业实力与运营能力，推动相关新技术尽早实现大规模应用，促进公司中长期战略目标实现。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/392.htm", "publishedAt": "2026-07-24T15:01:43+00:00"}, {"title": "新晋菲尔兹奖得主 Tsimerman 官宣加入 OpenAI", "summary": "当地时间 7 月 23 日上午，2026 年国际数学家大会在费城开幕，本年度菲尔兹奖四位得主揭晓——邓煜、约翰·帕登、雅各布·齐默尔曼与王虹。其中邓煜、王虹成为菲尔兹奖自设立以来首批获此殊荣的中国籍数学家。 在赛后新闻发布会上，其中一位新科得主雅各布·齐默尔曼（Jacob Tsimerman）顺势宣布将转向 AI 安全领域研究，...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/478486", "publishedAt": "2026-07-24T07:50:13+00:00"}, {"title": "91% 的 Token 花在读代码上，这套上下文交接术把成本砍掉了四成", "summary": "AI 编程 Agent 的账，大多数人算错了。 Stencil 的 Can Boluk 发了一篇文章，拆开了一份来自 SWE-Bench 基准测试的数据：在 1.81 亿个 token、近 200 万次工具调用中，编辑和写入只占了 9%。剩下 91% 全在阅读——读文件、grep 搜索、查看输出。 换句话说，Agent 的钱不是烧在写代码上，是烧在读代码上。 这个事实意味着...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/478278", "publishedAt": "2026-07-24T02:44:59+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "英伟达 CEO 黄仁勋：“AI 末日论”该翻篇了，行业别再吓人了", "summary": "IT之家 7 月 25 日消息，据《商业内幕》24 日报道，英伟达 CEO 黄仁勋认为，所谓的“AI 末日论者”已经完成了警示任务，现在应该翻篇了。“听着，如果目的是提醒全世界 AI 技术具备惊人的能力，我认为目的已经达到了。”黄仁勋表示，部分 AI 行业领袖反复渲染 AI 可能引发大规模失业，正在吓坏美国民众；他们对中国在 AI 竞赛中实力的担忧，也令华盛顿的政策制定者感到恐慌。“大家都必须审慎思考、谨慎行事。我们正在吓唬民众。”IT之家从报道中获悉，黄仁勋还强调，重视安全并向监管机构充分说明 AI 技术完全合理，但行业同样需要让公众了解 AI 带来的好处。“我认为，我们应该对 AI 抱有更大热情，并帮助美国认识到，只有不应用 AI 技术，美国才会落后。”黄仁勋表示，AI 行业领袖只需要“讲事实”，首先应当说明部分人预测的失业潮并未出现；AI 领域还有不少无益的叙事，包括 AI 是否拥有意识、是否会迎来技术奇点，以及人类是否生活在模拟世界中的争论。“不要编造故事。所谓技术奇点必然到来，是编造的；所谓人类生活在模拟世界中，同样是编造的。所有说法都是编出来的。我觉得这些故事很有趣，也不介意听。我甚至很享受听那些行业领袖讲述这些故事，其中许多人都是我的朋友。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/412.htm", "publishedAt": "2026-07-24T23:43:09+00:00"}, {"title": "苹果 macOS 27 邮件应用测试新撰写窗口，整合 Siri AI 交互", "summary": "IT之家 7 月 25 日消息，科技媒体 MacRumors 昨日（7 月 24 日）发布博文，报道称在 macOS 27 Golden Gate Beta 4 开发者预览版中，苹果公司为邮件（Mail）应用酝酿“Write with Siri”功能，把 Siri AI 整合到邮件撰写窗口内。根据该媒体论坛网友 mactracker 分享的截图，在 macOS 27 系统邮件应用中，苹果重新设计邮件撰写窗口的格式栏，其中“Write with Siri”被置于最突出的位置。IT之家附上相关截图如下：根据页面截图显示，经典的格式控制按钮会自动折叠到撰写器右边缘，一旦用户选择“使用 Siri 撰写”并开始输入提示，它们就会完全消失。新设计同时加入显示 Siri AI 情境化智能回复建议的能力，用户不必直接将其插入草稿也可查看。相关阅读：《苹果 macOS 27 隐藏新特性：调用 Siri AI 内容创作》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/404.htm", "publishedAt": "2026-07-24T23:12:41+00:00"}, {"title": "深度对话：AI Agent 真落地，为什么需要 GPU 原生认知数据库？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/video/WKDVJzq0LF6luzNAGwrP?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-24T17:30:28+00:00"}, {"title": "谷歌签署欧盟 AI 生成内容透明度行为准则，并呼吁避免监管复杂化", "summary": "IT之家 7 月 24 日消息，谷歌宣布签署欧盟《人工智能法案》框架下的《AI 生成内容透明度行为准则》 ，以支持在欧洲市场负责任地使用人工智能。据悉，该准则核心要求主要集中在以下四个方面：机器可读的标识与水印：确保第三方工具或平台能够通过技术手段自动检测并识别该内容是由 AI 生成或修改的；人机交互的明确告知：当 AI 系统直接与人类互动时，必须在设计上保证用户能意识到他们正在与机器对话；深度伪造内容的强制声明：内容发布者必须以显眼的方式声明“深度伪造”内容是 AI 生成或修改的；公共利益相关文本的标注：如果 AI 生成的文本旨在向公众提供涉及“公共利益”的信息（例如新闻报道、政策解读等），必须明确标注该内容为 AI 生成。谷歌表示，这项举措建立在其 2025 年签署的《全球人工智能伙伴关系行为准则》的基础之上，并与该公司采纳并推广 C2PA 内容溯源标准、开发包括 SynthID 在内的 AI 透明度工具的工作重点保持一致。谷歌称将继续推广 SynthID 数字水印技术，帮助用户识别内容生成和编辑方式，并与苹果、ElevenLabs、Kakao、英伟达、OpenAI 等第三方 AI 机构合作，推动整个行业采用基于 SynthID 的可互操作水印工具。IT之家注意到，谷歌同时对监管复杂度上升表示担忧，称在技术解决方案仍在不断演进的当下，增加更多复杂的监管规定，可能会与欧洲追求竞争力及简化流程的目标背道而驰。这还可能适得其反，让那些本该受规则保护的群体感到困惑。如果互联网内容中充斥着各类重叠的 AI 标签和法律声明，人们将更难获取他们真正需要的清晰背景信息。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/393.htm", "publishedAt": "2026-07-24T15:15:13+00:00"}, {"title": "First 超短片，把镜头对准了 AI 够不着的地方", "summary": "如果一切皆可生成，影像的「真实」与「必要」又该被如何重新定义？#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1672900?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-07-23T10:32:34+00:00"}, {"title": "RAG 核心概念与原理：Chunking、Embedding、相似度、HNSW 与多路召回", "summary": "写代码时若提问 \"这个框架的 v2.3 版本 API 怎么用\"，它提供的却是早已淘汰的 v1.x 写法；若询问「公司内部优惠券系统的退款流程是什么」，它会凭空编造一套流程。", "sourceName": "开源中国", "sourceUrl": "https://my.oschina.net/u/5783135/blog/19726047", "publishedAt": "2026-07-23T09:24:36+00:00"}, {"title": "梁文锋四小时投资者交流会：为什么克制是 DeepSeek 最锋利的武器？", "summary": "DeepSeek 近日完成了首轮外部融资，总额超过 500 亿元人民币，投前估值约 3675 亿元。在这场融资前后，梁文锋与投资人进行了一次长达四小时的闭门交流。两周前，零星语录开始在行业内流传；现在，多家媒体拿到了相对完整的会议实录。综合 elsewhere 整理的 52 条语录和腾讯科技披露的 118 个回答，梁文锋几乎回应了外界对...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/477445", "publishedAt": "2026-07-23T02:42:56+00:00"}, {"title": "他维护了“如何编写不可维护代码”作者遗留下来的代码", "summary": "如果你的代码活了三十年还没死，最后被一个陌生人修好了，你会怎么想？ 这件事上周发生在了 Roedy Green 身上。不过他已经没法知道了，因为其本人已在 2023 年去世。 但这件事值得大家看一看。 事情起因是一个叫 lexvalo 的开发者想把自己做的 AI 应用 RiverScript 提交到一些老牌的桌面软件目录站。他很快发现了一个早已...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/476776", "publishedAt": "2026-07-22T07:25:30+00:00"}]}]};

const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
