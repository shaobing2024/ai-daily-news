const DATA = {"date": "2026-09-03", "generatedAt": "2026-09-03T00:55:11Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "探索太阳风暴早期预警：AI 提前 9.24 小时捕捉太阳活动区信号", "summary": "IT之家 9 月 3 日消息，科技媒体 SciTech 昨日（9 月 2 日）发布博文，报道称由美国新泽西理工学院（NJIT）牵头的科研团队发布最新研究，成功打造出机器学习模型 EarlyDetect，可从太阳声学活动和磁场变化中识别活动区形成前兆。IT之家援引博文介绍，太阳活动区是太阳表面磁场强烈的区域，太阳黑子通常在其中形成。活动区开始浮现可能只需数小时，但完整发展过程通常需要 1 到数天。研究人员希望利用更早的信号，为空间天气预报提供补充信息。EarlyDetect 模型采用 Transformer 架构，处理连续的太阳观测数据，分析美国国家航空航天局（NASA）太阳动力学观测台（SDO）搭载的日震与磁成像仪（HMI）数据。HMI 记录的太阳振动观测时间间隔为 45 秒，研究团队据此生成声学功率图，再与磁场测量结果结合，预测连续强度变化，性能最佳的版本平均提前 9.24 小时识别活动区即将出现的信号。该可视化案例展示了太阳活动区 AR11158 的形成过程。研究人员同时观察太阳磁场、连续强度和声学功率，并把目标区域划分为更小的区块，持续追踪变化。结果显示，声学功率首先下降；随后，连续强度和磁场出现变化，活动区逐渐变得可见。这表明太阳内部磁场上升时，可能先在声波传播中留下微弱痕迹。如果模型进一步验证，卫星通信公司和电网运营商可能获得更长准备时间，用于调整运行策略和评估太阳风暴风险。不过，研究团队强调，EarlyDetect 目前尚未投入运行。参考Forecasting Continuum Intensity for Solar Active Region Emergence Prediction Using Transformers", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/997/737.htm", "publishedAt": "2026-09-03T00:08:09+00:00"}, {"title": "OPPO 卓世杰否认 Find X10 Pro Max 手机外观泄密图：比这好看", "summary": "IT之家 9 月 3 日消息，有博主放出了最新 OPPO Find X10 Pro Max 外观泄密图。画面显示，新机哈苏定制款有全新白色，同时摄像头模组印有 LUMO 凝光影像标识。不过 OPPO Find 系列产品负责人卓世杰很快对此进行了否认，并直言：“比这好看。”OPPO 首席产品官、一加创始人刘作虎在 8 月 28 日宣布，OPPO 发布新一代 ProXDR 技术。刘作虎还官宣了 OPPO 全新一代旗舰手机 —— Find X10 系列，并透露新机会首发新一代 ProXDR 技术，同时会在 9 月正式亮相。目前，OPPO Find X10 系列目前已有两个机型入网，全都支持 N79 5G 频段 +2.4GHz 扩频通信，预装 ColorOS17 AI 系统，备案了多个 AI 大模型。爆料称，系列新机排期 9 月下旬发布，重点关注 2nm 天玑 9600 Pro 处理器，搭载 HPC 2 亿超大底影像，机身正面配备极窄新屏。据IT之家此前报道，消息称 OPPO Find X10 Pro Max 手机全球首发三 2 亿全大底影像。博主 @数码闲聊站 表示，这套最激进的影像方案真落地了，主摄全球首发 HPC，行业唯一 2 亿像素 DeepPix 超高动态主摄，不仅主摄长焦是 2 亿，就连超广角也是 2 亿。值得一提的是，OPPO ColorOS 17 发布暨开发者大会已定档 2026 年 9 月 17 日 10:00 在珠海举行。本次大会主论坛将发布全新 ColorOS 17，新系统将由 OPPO Find X10 系列首发搭载。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/997/733.htm", "publishedAt": "2026-09-02T23:53:36+00:00"}, {"title": "纽约时报诉 OpenAI 案升级：美国司法部首次就 AI 版权问题公开表态，主张 AI 训练属“合理使用”", "summary": "IT之家 9 月 3 日消息，美国司法部（DOJ）当地时间 9 月 1 日向曼哈顿联邦法院提交了一份“利益声明”，正式介入《纽约时报》诉 OpenAI 版权侵权案。美国司法部明确支持 OpenAI 的立场，主张 AI 公司使用受版权保护的材料训练大语言模型属于“合理使用”范畴，不构成版权侵权。这份文件由美国副司法部长斯坦利 · 伍德沃德（Stanley Woodward Jr.）等人签署。DOJ 首先从国家安全角度论证了支持 OpenAI 的必要性。他们认为，如果版权规则显著增加在美国开发大语言模型（LLM）的难度，可能损害美国 AI 产业竞争力并带来国家安全风险。“那些使在美国建立强大 AI 产业变得显著更加困难的法律规则，因此威胁到国家安全，并给不受此类束缚的外国对手带来竞争优势。”美国司法部还引用了特朗普关于“消除美国在 AI 领域领导地位障碍”的行政命令，称 AI 主导地位对“促进国家安全、繁荣和全体美国人的经济流动性”至关重要。DOJ 进一步阐述，大语言模型训练对版权作品的使用具有“转换性”目的，符合合理使用标准。“大语言模型训练所带来的创造性可能和公共利益，远远超过任何竞争损害”。他们还特别指出，若法院支持《纽约时报》的主张，将“阻碍创造性和科学进步，同时妨碍美国的繁荣和经济流动性”。伍德沃德称这份文件为“具有历史意义的利益声明”。IT之家此前报道，《纽约时报》于 2023 年 12 月起诉 OpenAI 及其合作伙伴微软，指控两家公司非法使用其数百万篇受版权保护的新闻文章训练 AI 系统，并寻求“数十亿美元”的损害赔偿。《纽约时报》当时表示，AI 有时会逐字复制文章的内容输出给 ChatGPT 用户。此后，包括《纽约每日新闻》《芝加哥论坛报》在内的多家新闻机构以及大量畅销书作者也加入了这起合并诉讼。OpenAI 和微软否认相关指控，主张其使用属于合理使用范畴。《纽约时报》发言人格雷厄姆 · 詹姆斯（Graham James）发表声明中批评了 DOJ 的立场：“政府站在少数几家市值万亿美元的 AI 公司一边，却牺牲了无数作品被窃取的美国创作者的权益。”他进一步表示：“AI 和创作者可以共同繁荣 ——AI 公司只需按照版权法的要求，为造就其产品的内容公平付费。政府允许企业未经许可或补偿即获取内容的提议，将破坏健康社会所依赖的人类原创内容的可持续性，而 AI 的运行同样依赖这些内容。”《纽约每日新闻》首席律师史蒂文 · 利伯曼（Steven Lieberman）则指出，政府的立场“忽视了美国宪法中的版权条款，该条款由我们的开国元勋制定，旨在保护和激励原创作品的创作”。他还表示，政府的立场与美国版权局此前表达的观点相矛盾。此次司法部的介入使这起具有标志性意义的版权诉讼进一步升级。该案的结果可能为 AI 公司使用受版权保护材料训练模型的合法性确立重要先例。负责审理此案的法官西德尼 · 斯坦（Sidney Stein）要求双方最迟于当地时间 9 月 4 日（周五）提交简易判决动议。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/997/732.htm", "publishedAt": "2026-09-02T23:50:05+00:00"}, {"title": "Meta 发布最强 AI 模型 Muse Spark 1.3，编码能力超 GPT-5.6 Sol", "summary": "IT之家 9 月 3 日消息，Meta Platforms 于 2026 年 9 月 2 日发布迄今最强大 AI 模型 Muse Spark 1.3，专为延长智能体工作流与增强编码能力设计。Meta 首席 AI 官 Alexandr Wang 表示，该模型在编码能力上超越 OpenAI 的 GPT-5.6 Sol，与 Anthropic 的 Claude Fable 5.1 表现持平。定价方面，Muse Spark 1.3 维持与前代 Muse Spark 1.2 相同的定价，通过 Meta Model API 向开发者提供付费访问：每 100 万词元输入费用为 1.25 美元（IT之家注：现汇率约合 8.4 元人民币）每 100 万词元缓存命中输入费用为 0.15 美元（现汇率约合 1 元人民币）每 100 万词元输出费用为 4.25 美元（现汇率约合 28.6 元人民币）Wang 透露，API 平台市场采用强劲，部分开发者周用量达万亿级 token，新模型将逐步整合至 Instagram、Facebook 及 Meta AI 助手。官方博文指出相比较 Muse Spark 1.2，最新 1.3 减少了不必要的代码迭代，代码更简洁，整体编码风格也更加清晰，工具调用次数减少了约 20%，完成相同任务所需 token 减少 25%。Muse Spark 1.3 针对长周期智能体任务优化。模型能在单一长线程中协作处理多工作流，主动修正计划缺口并跟踪学习成果。面对模糊指令时，它会提出澄清问题；遇到障碍时请求用户帮助；执行关键操作前会寻求确认。新模型遵循复杂长指令的可靠性提升，多步骤任务中更好地保留详细需求，不丢失约束条件。多任务处理能力增强，能更准确地将新指令映射到单一线程中的正确任务。模型对自身能力与局限性的认知更强，减少幻觉输出。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/997/728.htm", "publishedAt": "2026-09-02T23:29:36+00:00"}, {"title": "欧洲最强 AI：西班牙公司推出 Quasar 438B 模型，1M 词元上下文", "summary": "IT之家 9 月 3 日消息，西班牙 AI 公司 Multiverse Computing 最新推出 Quasar 438B 模型，根据 Artificial Analysis 得分，该模型 Intelligence Index v4.1.1 得分为 43，在参与比较的欧洲模型中排名最高。IT之家注：该指数综合 9 项评测，覆盖智能体、代码、科学推理、通用知识和长上下文推理，是评估模型能力的主要基准之一。作为对比，Mistral Medium 3.5 得分为 30，NVIDIA Nemotron 3 Ultra 得分为 38。该模型拥有 4,380 亿参数，定位为推理模型，主要面向企业级智能体、软件开发和复杂多步任务。Quasar 438B 支持英语和西班牙语，并已通过 CompactifAI API 提供访问。在官方 X 推文下方的“背景信息”中，补充表示该模型可能基于智谱的 GLM5.2 模型制作。该模型目前属于专有模型，权重未公开，仅支持文本输入和文本输出，不具备图像输入能力。API 价格为每 100 万输入词元 0.60 美元、每 100 万输出词元 1.80 美元。响应速度也是该模型的主要指标。Quasar 438B 生成 500 个输出词元的耗时为 15.3 秒，其中包含推理时间。Artificial Analysis 记录的输出速度为每秒 176.2 个词元，首 Token 输出延迟为 1.08 秒。在 Artificial Analysis Long Context Reasoning（长上下文推理）评测中，Quasar 438B 得分为 75.0。该测试考察模型从长文档中提取、关联并推理信息的能力。模型上下文窗口为 1M 词元，适合处理合同、技术资料、政策文件和研究报告等长文本。在 Terminal-Bench v2.1 评测中，Quasar 438B 得分为 69.3。该测试模拟真实终端环境中的智能体任务，包括查看代码仓库、运行命令、排查错误和完成连续操作。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/997/726.htm", "publishedAt": "2026-09-02T23:16:25+00:00"}, {"title": "谷歌推出 Gemini 3.8 Flash Cyber 模型，内部已全面部署用于代码安全防护", "summary": "IT之家 9 月 3 日消息，当地时间 9 月 2 日，谷歌宣布推出 Gemini 3.8 Flash Cyber 模型，通过 Fairwind 计划面向首批受信任的安全防护团队开放。官方表示，在针对漏洞挖掘的行业权威基准测试 CyberGym 上，Gemini 3.8 Flash Cyber 展现出了顶尖水平的自主漏洞挖掘能力。不仅超越了前代 3.5 Flash Cyber，还将多款体量显著更大的前沿模型甩在身后。谷歌在更全面的内部基准测试中对 Gemini 3.8 Flash Cyber 进行了评测。该测试要求模型在涵盖 20 种编程语言的复杂代码工程中，挖掘各类型的安全漏洞。结果表明，该模型相较于谷歌此前的模型实现了大幅跨越，漏洞挖掘成功率突破了 70%。谷歌表示，在研发 Gemini 3.8 Flash Cyber 时，其核心目标是为安全防御方赋予专业级能力，使其在面对攻击方时能够占据主导优势。正因如此，谷歌从一开始就重点投入漏洞修复领域，并将该项能力置于漏洞利用等攻击性手段之上。在 CWE-Bench 测试中，Gemini 3.8 Flash Cyber 稳居帕累托前沿（Pareto Frontier）：其首选正确率（Pass@1）达到 47.2%，紧追顶尖前沿模型的 47.8%；同时它的调用成本显著更低，在性能与成本之间实现了极佳的平衡。谷歌表示，Gemini 3.8 Flash 内置了完善的安全防护机制，在支持合规良性用例的同时，严密防范模型在化学、生物、放射性与核武器（CBRN）以及网络攻击领域的滥用风险。相比之下，Gemini 3.8 Flash Cyber 适度放宽了网络安全领域的策略拦截限制，因此仅面向需要更完备网络攻防能力的合规安全团队开放。IT之家获悉，目前谷歌内部已全面部署 Gemini 3.8 Flash Cyber 用于代码安全防护。以下为具体落地案例：Chrome 安全团队评估发现，针对 Chrome 浏览器中的安全漏洞，3.8 Flash Cyber 生成有效修复补丁的数量达到了顶尖商业模型的 2.6 倍，而这些顶尖商业模型的参数规模要比它庞大得多。安全机构 Wiz 的评测表明，在其内部基准测试中，相较于其他顶尖的前沿模型，Gemini 3.8 Flash Cyber 的召回率提高了 7.5%-9.7%，同时调用成本大幅降低至原先的 1/5.2 到 1/2.3。Google 云漏洞研究团队借助 3.8 Flash Cyber 模型，耗时不到 2 小时便成功挖掘出一处严重的底层架构漏洞；在此之前，这类漏洞的调研与排查通常需要数月之久。相关阅读：《谷歌 Gemini 3.8 Flash 模型上线，适用软件工程、智能体任务等场景》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/997/708.htm", "publishedAt": "2026-09-02T16:09:52+00:00"}, {"title": "谷歌 Gemini 3.8 Flash 模型上线，适用软件工程、智能体任务等场景", "summary": "IT之家 9 月 2 日消息，谷歌今天（2 日）在 Google DeepMind 网站低调上线了 Gemini 3.8 Flash 模型。其基于 Gemini 3.7 Flash，拥有在软件工程和智能体知识工作流方面的性能提升，并持续支持可定制的努力水平，以控制质量、成本和延迟的组合。不过截至IT之家发稿，谷歌官方暂未通过新闻稿或社媒平台官宣这一模型的存在。Gemini 3.8 Flash 基于 Gemini 3.7 Flash，具有最高 1M 的 token 上下文窗口，文本支持 64K token 输出。官方还公布了多项基准测试评估结果，涵盖编程、知识处理、多模态处理能力、长上下文处理、计算机使用能力以及科学推理能力。截至 2026 年 9 月的结果如下：根据介绍，Gemini 3.8 Flash 面向个人用户、开发者和企业，适合以较低成本大规模部署通用型、可直接用于生产环境的智能体，典型用途包括软件工程、智能体任务以及复杂的知识处理流程。Gemini 3.8 Flash 也存在可能产生幻觉等基础模型常见的一些局限。谷歌正持续提升模型抵御越狱攻击的能力，近期还进一步加强了前沿安全领域的防护措施。模型偶尔可能出现响应较慢或超时的情况。为了获得更好的性能，Gemini 3.8 Flash 有时会消耗更多 token，尤其是在较高推理强度下。Gemini 3.8 Flash 的知识截止日期为 2026 年 3 月。部分领域的信息可能更新得更晚，另一些领域的知识则可能仍停留在 2025 年 1 月，与 Gemini 3 模型家族一致。参考Gemini 3.8 Flash 官方介绍", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/997/702.htm", "publishedAt": "2026-09-02T15:31:06+00:00"}, {"title": "谷歌拆解退役服务器的 DDR4 内存模组，重新部署至新型 AI 服务器", "summary": "IT之家 9 月 2 日消息，据 Wccftech 报道，DRAM 领域的供应持续吃紧，迫使 AI 服务商不得不各出奇招，只为抢购极度紧缺的内存资源。谷歌供应链基础设施高级总监尼基尔 · 切里安（Nikhil Cherian）近日在出席峰会论坛时透露，人工智能产业已迅速由“算力受限”转变为“内存受限”。在单台典型的 AI 服务器中，高性能内存占其物料清单的成本比例已高达约 75%。切里安表示，为了“突破内存瓶颈，谷歌正同时从软件和硬件两端协同发力”。为此，谷歌甚至拆解了退役服务器以回收尚具利用价值的元器件，从而构建出一套内部循环利用的供应链体系。在某些应用场景下，谷歌似乎已被迫妥协 —— 不得不重新采用规格较旧的 DDR4 内存模组，以替代其新型 AI 服务器原本规划的 DDR5 模组。事实上，谷歌设计了专用的硬件转接卡，使得 DDR4 等上一代内存方案能够接入其新一代 AI 服务器。切里安坦言，谷歌正是特意将这批退役服务器调回机房，目的就是拆解并回收其中的 DDR4 内存模组。IT之家注：为模型推理任务进行针对性优化的 TPU8i 芯片采用专用分层存储体系，在整机层面依托高速 DDR5 内存体系结构，专门负责处理数据预处理等任务。此外，每颗 TPU 8i 芯片均搭载 288 GB 的 HBM3e 高带宽内存。与此同时，这家科技巨头还在持续优化底层函数库、模型架构以及 KV 缓存压缩算法，竭力降低单位算力下的内存开销。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/997/687.htm", "publishedAt": "2026-09-02T15:00:26+00:00"}, {"title": "小米 18 Fold“中折叠”手机拥有 1.2 米抗跌落能力，雷军称媲美直板旗舰", "summary": "IT之家 9 月 2 日消息，小米创办人、董事长兼 CEO 雷军今晚发文，预热小米 18 Fold“中折叠”手机。IT之家注：小米 18 Fold 手机将于 9 月 7 日（下周一）晚 7 点在小米秋季旗舰新品发布会上正式发布，首发玄戒 O3 旗舰处理器。据雷军介绍，小米 18 Fold 拥有 1.2 米抗跌落能力，可靠性媲美直板旗舰；相比小米 MIX Fold 4 手机，尖锐物体抗冲击性提升 258%，钢球重物跌落高度提升 214%。小米 18 Fold 采用新一代小米龙骨转轴，自然水滴形态，三级连杆结构，全贴合保护。小米 18 Fold 搭载全新双层 UTG 超薄玻璃，屏幕强度、抗冲击性大幅提升。此外，小米 18 Fold 前后双面搭载小米龙晶玻璃 3.0，中框采用航天级 7 系铝合金。小米官方今日公布了小米 18 Fold“中折叠”手机官图，新机采用极窄四等边 + 超椭圆大 R 角设计，后置跑道型 Deco + 侧边纯平包裹式中框。相关阅读：《小米 18 Fold“中折叠”手机将搭载小爱灵感球：轻松一拖即可完成各类任务》《小米 18 Fold“中折叠”手机官图发布：极窄四等边、跑道型 Deco，新色命名「西野红」》《雷军：小米 18 Fold“中折叠”旗舰手机搭载 Xiaomi MiMo 端侧大模型》《小米 18 Fold 手机外观亮相：新形态命名“中折叠”，卢伟冰预测将成下一代折叠屏主流选择》《小米迄今最高端手机：雷军晒 18 Fold 阔折叠真机，红色外壳、首发玄戒 O3 芯片》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/997/680.htm", "publishedAt": "2026-09-02T14:25:28+00:00"}, {"title": "美光探索近 GPU NAND 闪存，可支撑更大规模 AI 模型", "summary": "IT之家 9 月 2 日消息，据 DigiTimes 今天报道，美光正在研究高耐久性 NAND 闪存模块，该公司计划将其部署在距离 GPU 更近的位置，而不是像传统存储方案那样，通过多个协议连接到距 GPU 较远的存储池。据报道，美光正在探索如何将 NAND 闪存进一步靠近 GPU，希望在存储密度和耐久性之间提供一种折中方案。这种产品当前被称为“近 GPU NAND”（IT之家注：near-GPU NAND），可用于处理非低延迟 / 高带宽工作负载。这种方案可以让 GPU 直接访问数百 GB 的 NAND 存储池，它可以直接放置在 GPU 封装内部或 PCB，工作方式类似 HBM、GDDR7 等方案。与传统 TLC 或 QLC NAND 相比，这种 NAND 芯片的存储密度更低，重点在于提升 I/O 速度、带宽。该存储层位于显存和普通存储之间，可充当高速缓冲层，因此特别适合运行更大规模的 AI 大语言模型。该方案落地后，LLM 推理将不再受到显存容量限制。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/997/668.htm", "publishedAt": "2026-09-02T13:44:52+00:00"}, {"title": "Cloudflare OS：Cloudflare 基于能力模型构建的开源企业级 AI 平台", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/ztbou1CqjAdzrT6GNSKV?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-02T13:00:00+00:00"}, {"title": "Fable 5.1 正式发布：性能翻倍、Agent成本下降45%，Anthropic 把顶级模型送进真实世界", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/K8OwgoWM1gHNi2i4yLkU?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-02T12:00:00+00:00"}, {"title": "李飞飞旗下 AI 实验室 World Labs 发布 Atlas：从几张照片重建 3D 世界", "summary": "李飞飞创立的 World Labs 发布了 Atlas，一个从零预训练的多模态空间智能大模型。你可以给它几张照片，它能生成从任意角度观看的连续视频；给它一段手机拍摄的视频，它能重建出完整的 3D 场景，让机器人在里面模拟导航。 核心架构是「multimodal autoregressive diffusion transformer」——这个术语拆开来看，autoregre...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502277/worldlabs-ai-atlas", "publishedAt": "2026-09-02T11:24:32+00:00"}, {"title": "李飞飞的 World Labs，把赛博朋克的「超梦」做出来了", "summary": "世界模型的「ChatGPT 时刻」#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1678150?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-09-02T10:30:34+00:00"}, {"title": "Claude越狱后，Anthropic停掉训练、150人紧急转岗", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/EPME6yOoJGusHdGZTGFJ?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-02T09:42:36+00:00"}, {"title": "AI 应用皆可报名，我们把大赛门槛打下来了", "summary": "2026 上海开源软件应用创新大赛正火热报名中。本次大赛由开源中国主办，设 AI+工业软件、智算云、开源 AI 工具三个赛道，累计奖池 100 万。其中，「开源 AI 工具赛道」可以说是本次大赛征集范围最广的赛道，该赛道面向所有开发者、AIGC 创作者，只要你的项目利用 AI 解决了一些问题，哪怕只是一个轻量的 AI 工具，都可以...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502274", "publishedAt": "2026-09-02T09:30:03+00:00"}, {"title": "开源中国开源 AI 编程工具 MothX，主打一个“省”字，驾驭中国词元", "summary": "用 Claude Code 写一个月代码要多少钱？问问研发工程师，答案都是几百美元起步。终端 AI 编程这个领域，能力上各家都做得不差，拉开差距的其实是账单。 开源中国近期在 Gitee 开源了终端 AI 编码工具 MothX（默思，原名 VibeCoding），约一万行 问题本身产生的一些负面情绪逐渐消退。换句话说，当消费者已经处于恼火状态时，更快速、更接近真人对话的互动方式，有时反而会剥夺一件有价值的东西：一点让情绪冷静下来的时间。不过，拉开一定的情绪距离只是打造有效 AI 客服的一部分。情商同样重要IT之家注意到，在另一项发表于《商业研究杂志》（Journal of Business Research）的研究中，考察了当 AI 客服能够识别并回应消费者情绪时，消费者会作何反应。该研究让参与者分别与两种机器人互动。其中一种会明确识别消费者的愤怒，并说：“我理解你现在很生气。”另一种则使用更加笼统的表达：“我理解你现在感觉很糟糕。”结果显示，当机器人能够准确识别消费者的情绪状态时，消费者的反应更加积极。更精准的情绪识别能够提高消费者对 AI 客服情绪理解能力的评价，同时提升客户满意度。综合这些研究结果可以发现，让 AI 更像真人，并不意味着它就一定更擅长理解和回应人类情绪。有时候，最佳的客户体验反而来自适当拉开情绪距离，让消费者拥有一点时间消化自己的不满。而在另一些情况下，能否准确识别消费者当下的情绪，并采取恰当的回应方式，才是决定体验好坏的关键。客服 AI 不必一味追求像真人随着 AI 在客服领域承担越来越多的工作，关键问题并不是它听起来有多像真人。企业需要认真考虑的是，在客户服务过程中的不同阶段，消费者究竟需要什么。未来的客服 AI 或许并不应该以尽可能逼真地模仿人类为目标。真正有效的 AI 客服系统，应当能够判断消费者什么时候需要理解和安慰，什么时候需要一点独处和冷静的空间，并根据具体情况采取相应的互动方式。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/997/667.htm", "publishedAt": "2026-09-02T13:41:48+00:00"}, {"title": "缓存读取价砍 75%：Fable 5.1 真正想卖的不是跑分", "summary": "每百万 token 的缓存读取价格，从 1 美元降到 0.25 美元，降幅 75%。 这是 Claude Fable 5.1 发布里最不起眼、也最值钱的一个数字。它躺在定价表最偏僻的角落，不如那些基准测试榜单显眼，却决定了 agent 跑长任务时真正的成本。 标准输入、输出价格没动，还是每百万 token 10 美元和 50 美元。Anthropic 只动了缓存读取...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502267/claude-fable-and-mythos-5-1", "publishedAt": "2026-09-02T02:50:54+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "当 AI 开始重写负载，数据库该如何重新设计？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/rhKVS8RAdp4aVPZD0vZu?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-02T18:07:15+00:00"}, {"title": "全美最严格课堂 AI 禁令落地纽约，学生上高中之前不得在课上使用", "summary": "IT之家 9 月 2 日消息，据外媒 The Verge 报道，纽约市市长佐赫兰 · 马姆达尼当地时间 2 日宣布，将在公立学校课堂限制年龄较小的学生使用 AI。禁令为期一年，从 2026-2027 学年开始实施，覆盖约 60 万名 2-K 学前班（IT之家注：2 岁至入园前）至八年级的学生。纽约市还将同步收紧数字设备使用规定，并小规模试点部分 AI 教育工具。根据纽约市教育局的新规，教师不得使用 AI 批改作业，学生升入高中前也不能在课堂上使用 AI，以陪伴和心理支持为主要用途的聊天机器人也将在所有年级禁用。高中生只能在特定情况下使用 AI，每年还将接受两次 AI 素养教育，学习如何在产生“依赖”之前对 AI 进行“批判性思考”。马姆达尼的声明指出：“儿童需要教师和人与人之间的联系，才能学习和成长。他们需要和同龄人一起培养能力，与教育工作者建立关系，也需要自己面对困难的问题。科技行业想让我们相信，AI 驱动的早期教育不仅不可避免，而且必不可少。我们并不认同这种看法。”此外，小学三年级之前的学生，将不允许使用个人屏幕设备。纽约市教育局还将 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
