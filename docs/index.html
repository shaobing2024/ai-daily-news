作，为民间投资营造良好环境。上半年，我国人工智能自主创新步伐加快，在全产业链多环节实现快速突破。国家发展改革委政策研究室主任、新闻发言人蒋毅表示：一是算力底座夯实，首个全国产 10 万卡人工智能超集群正式投用，截至 6 月底，全国智能算力规模达到去年同期的 2.8 倍。二是模型能力跃升，深度求索、月之暗面等本土企业先后发布多个万亿级参数开源大模型，国产大模型全球总下载量突破 100 亿次，国产模型与国产算力芯片加速适配。三是要素流动活跃，建成高质量数据集超过 12 万个，算力、模型、数据互促共进的良性循环加速形成。在各方面协同带动下，人工智能成为经济增长的澎湃动力源，相关行业保持 30% 以上的高增长。IT之家注意到，工信部 5 月 30 日印发《算力互联互通行动计划》。到 2026 年，建立较为完备的算力互联互通标准、标识和规则体系。到 2028 年，基本实现全国公共算力标准化互联，逐步形成具备智能感知、实时发现、随需获取的算力互联网。工信部在重点任务中提到攻关核心技术，制定算力互联标准化指南，建立算力互联互通标准体系。制修订通用技术标准，明确通信网络互通、算力资源互联、业务调度互通、数据传输流动以及应用架构适配等关键环节要求。制修订行业应用标准，促进人工智能、科学计算等行业场景算力互联和算力服务发展。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/230.htm", "publishedAt": "2026-07-31T08:04:18+00:00"}, {"title": "最严苛 AI 交互推理测试：OpenAI 两项改进让 GPT-5.6 Sol 提分 188%", "summary": "IT之家 7 月 31 日消息，OpenAI 公司今天（7 月 31 日）发布公告，宣布通过改进框架，让 GPT-5.6 Sol 模型的 ARC-AGI-3 提高了 188%。IT之家注：ARC-AGI-3 由 ARC Prize 团队推出的全新交互式推理基准测试，是目前全球公认衡量 AI 通用智能（AGI）最严苛、最顶尖的交互式推理评测基准。该基准完全打破了传统 AI“做题”和知识问答的静态测试模式，将 AI 直接扔进一个完全陌生的“游戏环境”中，来评估其是否具备像人类一样的实时探索、学习与自适应能力。在未调整优化前，GPT-5.6 Sol 在 ARC-AGI-3 基准测试中的得分为 7.8%，而 GPT-5.5 模型的得分只有 0.4%。OpenAI 公司在复盘后发现，GPT-5.6 系列模型官方框架存在 2 个影响 GPT-5.6 Sol 表现的机制：第一，每次游戏动作后，私有推理都会被丢弃。这意味着 GPT-5.6 Sol 每执行 1 次动作后，都需要重新理解游戏。模型仍可看到过去动作记录和简短备注，但看不到促成这些动作的计划、洞察和思考过程。第二，官方框架采用滚动截断窗口。随着历史变长，较早动作会从上下文中消失。也就是说，GPT-5.6 Sol 不仅无法保留过去思考，也会丢失过去动作记忆。针对上述问题，OpenAI 提出了推理保留（inference preservation）和上下文压缩（context compression）两个解决方案。推理保留方面，OpenAI 使用 Responses API 重新实现 ARC-AGI-3 测试框架，对于 GPT-5.6，只需传入前一次 response ID，即可在工具调用和多轮交互中自动保留推理。OpenAI 表示在启用推理保留后，GPT-5.6 不必每轮重新解释游戏，从而减少每次动作前花在思考上的时间，模型保留过去想法后，更善于随时间学习，并采用更连贯的策略。在上下文压缩方面，官方 ARC-AGI-3 框架在对话上下文超过 175000 个字符后，会丢弃最早消息。OpenAI 称，滚动截断有 2 个缺点：模型会丢失早期观察和动作；模型在任务的大部分时间里会带着更满的上下文窗口运行，这可能轻微损害表现。启用上下文压缩后，GPT-5.6 Sol 在较长任务中更能保留对每个游戏的已学信息，并以更少输出 token 获得更高得分。而在使用官方 harness 后，GPT-5.6 Sol 在 ARC-AGI-3 的得分为 13.3%；在启用推理保留（inference preservation）和上下文压缩（context compression）后，GPT-5.6 Sol 在 Token 输出数量降低至六分之一的同时，得分达到 38.3%，成绩增长 188.42%。harness（常被称为驭缰工程）是指包在大模型外部、为其提供运行环境、工具集成、规则约束与反馈机制的整套系统架构。如果把强大的 AI 模型比作一匹充满力量但容易失控的烈马，那么 harness 就是它的缰绳、马鞍与骑手路线，不改变模型本身的架构，而是决定模型如何被安全、可靠地驾驭并真正完成复杂工作。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/208.htm", "publishedAt": "2026-07-31T07:35:42+00:00"}, {"title": "“小号”美国最强开源模型：Inkling-Small 登场，约 1/4 规模提供相近 AI 性能", "summary": "IT之家 7 月 31 日消息，Thinking Machines Lab 昨日（7 月 30 日）发布博文，宣布推出 Inkling-Small 模型，其性能媲美 Inkling，但规模降低至约四分之一。IT之家此前报道，Inkling 号称“美国最强开源 AI 模型”，采用混合专家（MoE）架构，总参数 975B、激活参数 41B，最长上下文 1M tokens。而本次推出的 Inkling-Small 模型同样采用混合专家（MoE）架构，总参数为 276B，激活参数为 12B，规模约为 Inkling 的 1/4，在 NVIDIA GB300 NVL72 系统上训练。与 Inkling 一样，Inkling-Small 支持音频和图像原生推理、可变思考强度、最高 1M token 上下文窗口，并在多类基准测试中保持较均衡表现。Thinking Machines 已开放 Inkling-Small 完整权重，同时将其接入 Tinker 微调服务，并在 Tinker Playground 提供文本、图像和音频聊天体验。Thinking Machines 称，Inkling-Small 以更低计算量取得接近 Inkling 的表现。在智能体工具使用、推理和指令遵循测试中，Inkling-Small 的效率高于 Inkling，并可与同等权重级别的其他模型竞争。在推理和智能体任务中，Inkling-Small 匹配或超过 Inkling。Humanity’s Last Exam 测试中，Inkling-Small 得分 31.6%，高于 Inkling 的 29.7%。Thinking Machines 称，在每个思考预算下，Inkling-Small 的测试时计算曲线均高于 Inkling。相关阅读：《美国最强开源 AI：多模态 Inkling 模型登场，前 OpenAI 首席技术官穆拉蒂打造》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/207.htm", "publishedAt": "2026-07-31T07:34:46+00:00"}, {"title": "TCL 华星 CEO 赵军：AI 终端对屏幕提出了低功耗和交互窗口化两个核心要求，已规划 44 英寸 AI 超宽屏", "summary": "7 月 31 日中午消息，近日，2026 ChinaJoy 举办。期间，TCL 华星 CEO 赵军与新浪科技等媒体展开对话。谈及在“AI”与显示结合方面的进展，赵军表示，AI 终端的发展对屏幕提出了两个最底层的核心要求：第一，低功耗；第二是交互窗口化。一方面，终端设备往往通过云端和终端来协同实现 AI 运算。终端自身要具备基本的 AI 算力，必然会带来功耗的占用。所以屏幕就要通过各种减功耗技术。另一方面，AI 应用让多任务并行成为常态，“交互窗口化”的需求愈发突出，“后续我们还规划了 44 英寸 WU 24：9 的 AI 超宽屏，可实现一屏三用，更好地适配 AI Agent 的工作空间需求。”他如是道。他也指出，从细分领域来看，AI 直接驱动了中尺寸 IT 和高端手机显示的跨越式发展，显示器不再只是单纯的画面输出设备，而是集成了 AI 画质优化、人因感知与智能场景识别的交互窗口。他强调：“车载显示也正在从“信息面板”向“人车交互核心枢纽”演进，AR / AI 眼镜等新型显示形态也在持续涌现，这些都是 AI 带来的全新增长机会。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/202.htm", "publishedAt": "2026-07-31T07:29:26+00:00"}, {"title": "腾讯混元：基于 Hy3 模型的科研智能体 Hyra 攻克加法组合学 50 年未解难题", "summary": "IT之家 7 月 31 日消息，腾讯混元今日发文宣布，基于 Hy3 模型的科研智能体 Hyra 找到了一个关键构造，为加法组合学中一个悬而未决半个多世纪的开放问题给出了完整答案。目前，论文预印本、显式构造和形式化证明均已公开：论文：https://arxiv.org/abs/2607.27199Lean 形式化证明：https://github.com/linhaowei1/sum-diff-proofIT之家附该问题如下：先取一个至少包含两个元素的有限整数集合，记作 &nbsp;A。把其中任意两个元素相加，收集所有不同的结果，得到“和集” (A+A)；把任意两个元素相减，收集所有不同的结果，得到“差集” (A-A)。由于重复结果只计算一次，一个自然的问题是：经过加法和减法之后，这个集合分别会扩张多少？数学家用两个量来衡量这种扩张：前者是和集的扩张倍数，后者是差集的扩张倍数。经典的和差集不等式告诉我们：为了衡量这个指数，可以定义于是经典不等式给出。真正的问题是：2 只是一个宽松的上界，还是能够被任意逼近的最优指数？半个多世纪以来，数学家不断构造新的集合，试图让 C (A) 尽可能大。1969 年的早期构造达到约 1.0290，1973 年提高到 1.0598，2013 年的构造进一步达到 1.1259 。近一年来，多项 AI 辅助搜索将这一数值推进到 1.1449。在论文记录的一项内部探索实验中，Codex（GPT-5.5）配合人类引导又将它提高到 1.2851。而 Hyra 与 Hy3 迈出了决定性的一步。它给出的是一族显式构造的有限整数集，满足这意味着：无论给定一个多么接近 2 的目标，都能构造出相应的集合使指数超过它。因此，2 确实是这个问题的上确界。此前，Georgiev、Gómez-Serrano、陶哲轩和 Wagner 等研究者曾借助 AlphaEvolve 优化搜索算法和候选集合。这类方法依赖对有限集合的显式枚举，随着规模增长，计算和内存成本会迅速上升，也难以自然过渡到可证明的渐近构造。据介绍，腾讯混元首先用 Hyra 在有限搜索中将最好结果从约 1.14 提高到 1.21，随后转向用自然语言提出数学构造和论证。使用 LLM judge 为探索过程提供反馈。经过约 24 小时运行，Hyra 提出了论文的核心思路：利用十二进制数字结构和一个精巧的构造控制差集，再结合循环群上的对称加法基与中国剩余定理，使和集以接近平方的速度扩张。官方独立检查并整理了完整证明，同时给出了 Lean 4 形式化证明。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/201.htm", "publishedAt": "2026-07-31T07:27:01+00:00"}, {"title": "英伟达又被开源大佬问候了，但这次不是祖师爷 Linus Torvalds", "summary": "7 月 20 日，Eric S. Raymond 在 X 上发了一条帖子，核心判断一句话：闭源驱动已死（\"binary-driver secrecy is dead\"，二进制驱动保密的产业均衡态，已经死了）。他表示自己把 Windows 驱动的二进制文件直接扔给前沿大模型，源码就出来了，连反编译都省了。 Eric S. Raymond 是开源运动的精神图腾之一。1997 年他写出“...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/483844", "publishedAt": "2026-07-31T07:23:56+00:00"}, {"title": "谷歌最新 AI 大模型 Gemini 3.5 Pro 短暂上线 Arena 竞技场，已延迟数月", "summary": "IT之家 7 月 31 日消息，X 平台上有多位用户反馈称，谷歌最新 Gemini 3.5 Pro 模型今日曾短暂出现在 Arena（IT之家注：原 LMArena）平台上。用户 Harshith（@HarshithLucky3）发布的截图显示，Gemini 3.5 Pro 在上线 30 分钟后便已被移除，自己仅完成一次 SVG 测试。同期，其他用户也发布了类似截图或说明。Arena 是基于真实用户盲测投票的 AI 模型评估平台，通过 Elo 评分等方式对文本、代码、视觉等任务进行排名。在此之前，谷歌于 2026 年 5 月 19 日正式发布 Gemini 3.5 系列，首发 3.5 Flash 模型，并表示 3.5 Pro 已在内部使用，计划于次月推出，但此后多次延迟，谷歌方面只表示正与合作伙伴进行测试。相关阅读：《谷歌发布三款新 AI 模型，含 Gemini 3.6 Flash、3.5 Flash Cyber》《消息称谷歌旗舰 AI 模型 Gemini 3.5 Pro 已延期数月，技术表现未达目标》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/155.htm", "publishedAt": "2026-07-31T07:08:17+00:00"}, {"title": "字节火山引擎：小鹏汽车、智元机器人等将率先接入 Seedance 2.5 视频生成模型", "summary": "IT之家 7 月 31 日消息，今天，字节跳动正式发布新一代视频生成模型 Seedance 2.5。针对企业用户，火山引擎将于近期上线 API 服务。据官方透露，徐工集团、小鹏汽车、智元机器人、灵初智能、微分智飞、穹彻智能、Xspark AI（无界智航）等多家企业已与火山引擎达成合作意向，将率先接入 Seedance 2.5。据介绍，从精确到螺丝孔位的工程作业指导视频，到真实复杂的智能驾驶训练环境，再到帮助机器人预测运动轨迹，Seedance 开始嵌入真实生产流程，在工业制造、能源化工、汽车、具身智能、智能驾驶等多个实体产业中落地应用。▲ Seedance 2.5 新增白模参考能力，能够将已有白模素材渲染为画面写实的汽车拼装片段徐工集团将其应用于工业操作培训与工序 SOP 视频生成，大幅降低传统实拍与 3D 动画的制作成本。小鹏汽车将 Seedance 能力集成至内部一站式 AI 设计平台，辅助产品设计环节的可视化创作。穹彻智能则借助视频生成扩充了具身智能大模型的训练数据，无需依赖实体机器人逐一采集，就能生成适配不同机型的操作数据，提升模型在多种机器人上的适配能力与通用性。此外，多家智能驾驶头部企业正在探索基于 Seedance 模型生成智能驾驶训练数据，包括暴雨、大雾、降雪、光线反射等极限工况环境，以及复杂交互与碰撞风险的 corner case 场景数据，全面提升模型训练和仿真评测能力。据IT之家此前报道，该模型面向影视、广告、教育、工业制造、具身智能和自动驾驶等场景，目标是让视频生成从“生成一个片段”转向“完成一段创作”。官方称，Seedance 2.5 延续 Seedance 2.0 统一的多模态音视频联合生成架构，重点提升长叙事、多模态参考和编辑能力。相关阅读：《字节跳动国内推出 Seedance 2.5 视频 AI 模型：单次生成时长 30 秒、突破长叙事能力》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/146.htm", "publishedAt": "2026-07-31T07:03:46+00:00"}, {"title": "铠侠 2027 财年第一财季归母净利润 8421.65 亿日元，同比增长 4506.02%", "summary": "IT之家 7 月 31 日消息，铠侠今日发布 2027 财年（2026 年 4 月 1 日～2027 年 3 月 31 日）第一财季（2026 年 4 月 1 日～2026 年 6 月 30 日）业绩快报报告：营业总收入： 1.77 万亿日元（IT之家注：现汇率约合 743.58 亿元人民币），同比增长 415.5%毛利： 1.38 万亿日元（现汇率约合 579.74 亿元人民币），同比增长 1838.87%毛利率： 78.10%，同比增长 57.33 个百分点归母净利润： 8421.65 亿日元（现汇率约合 353.79 亿元人民币），同比增长 4506.02%经营现金流： 8663.37 亿日元（现汇率约合 363.95 亿元人民币），同比增长 1317.76%基本每股收益： 1539.91 日元（现汇率约合 64.7 元人民币），同比增长 4442.51%稀释每股收益： 1525.09 日元（现汇率约合 64.1 元人民币），同比增长 4418.79%资产负债率： 49.17%，同比下降 12.91 个百分点AI 解读本次铠侠 2027 财年第一财季业绩大幅超出市场预期，营收和净利润均实现爆发式增长。财报亮点营业收入达到 1.77 万亿日元（现汇率约合 743.58 亿元人民币），同比增长 415.5%；归属于母公司股东净利润达到 8421.65 亿日元（现汇率约合 353.79 亿元人民币），同比大幅增长 4506.02%，业绩弹性极强。毛利率提升至 78.10%，同比提升 57.33 个百分点，盈利能力大幅改善，主要得益于 AI 驱动下存储产品平均售价大幅上涨。分业务来看，SSD &amp; 存储业务营收达到 1.17 万亿日元（现汇率约合 491.52 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';

    html += '<a href="#sec-' + i + '">'

}

    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
