一款配套新产品，协助客户以更加安全、自动化的方式部署该模型。据悉，GPT-6 Cyber 模型及其配套产品预计将于 9 月 29 日在旧金山举办的 OpenAI 开发者大会上亮相，甚至可能更早揭晓，并计划在未来数月内正式上线。GPT-6 Cyber 将是 OpenAI 今年发布的第四款网络安全专用模型。据知情人士透露，OpenAI 旗下仅限申请准入的“Daybreak Red”计划中，已有少数客户获得了 GPT-6 Cyber 的访问权限，以开展 Alpha 测试。IT之家注：Daybreak 是 OpenAI 推出的网络安全项目，主要划分为 Red 与 Blue 两个访问层级：Daybreak Red 客户可调用 OpenAI 最顶尖的网络安全工具；Daybreak Blue 则侧重于通用防护场景，但同样仅限申请准入。另据一名知情人士透露，在下周举办的开发者大会上，OpenAI 还计划密集推出十余款其他产品。这些即将发布的新品多数与网络安全无关，而是广泛涵盖面向企业端与消费级市场的其他业务线。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/061.htm", "publishedAt": "2026-09-25T00:04:23+00:00"}, {"title": "英伟达黄仁勋：AI 不会必然消灭某个职业，“10 年内 AI 毁灭人类”更是无稽之谈", "summary": "IT之家 9 月 25 日消息，在接受《纽约时报》采访时，英伟达首席执行官黄仁勋认为，当前行业和民众对 AI 的恐慌情绪已经过头了，并认为当前 AI 不一定会替代职业，但会首先替代任务。黄仁勋把工作拆分为任务（例如写代码、整理资料和回复客户等）和目的（诊断疾病、解决工程问题、服务客户等），并认为 AI 通常先自动化具体任务，不会必然消灭整个职业。例如，软件智能体可能大量生成代码，但软件工程师仍需要理解需求、设计系统、权衡风险、验证结果，并把技术连接到真实问题上。黄仁勋以工程师为例，认为 AI 可能下降写代码本身的稀缺性，但定义问题、设计架构、验证系统和承担责任的重要性会上升。针对某些科学专家认为“AI 会在 10 年内毁灭人类”观点，黄仁勋表示：“他们的所有预测都错了，所谓的 10% 概率既没有科学依据，也没有研究支持…… 这些预测只会增加。”IT之家附上相关截图如下：主持人 Ezra Klein 指出历史上的自动化确实会消灭部分工作，而且 AI 比过去的技术传播更快、适用范围更广。对此黄仁勋认为 AI 会提高生产力，并可能创造新的行业和岗位，但不等于人人都会受益。短期看，具体的人可能先失去任务、收入或议价能力，而新机会未必马上出现。不过从长期看，技术可能创造新的需求和职业。但是转型速度和分配方式可能会影响到当前社会就业。黄仁勋把 AI 比作多层结构：能源和芯片、数据中心、模型，以及最上面的应用层。他认为真正改变医院、学校、制造业和法律服务的，是应用层，而不是模型排行榜本身。黄仁勋表示，人工智能扩张可能先带来能源代价。未来几年仍需要化石燃料支撑 AI 发展。原因在于，当前清洁发电能力尚未达到他预期的 AI 产业规模。大型数据中心持续增加，也带动电力需求快速上升。他认为，限制 AI 数据中心建设可能拖慢实用技术的发展。黄仁勋同时表示，AI 长期可推动能源生产投资，并帮助研究人员改进电网、材料和气候系统。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/051.htm", "publishedAt": "2026-09-24T23:17:34+00:00"}, {"title": "高通押注 AI 生态：一套软件栈通吃所有设备，编程语言 Mojo 将原生支持 Win11", "summary": "IT之家 9 月 25 日现场消息，在夏威夷举办的 2026 骁龙峰会第二日活动中，高通技术公司先进 AI 软件与平台执行副总裁克里斯 · 拉特纳（Chris Lattner）发表主题演讲，称 AI 行业的竞争正逐渐从“拼芯片”转向“拼生态”。在本次主题演讲中，拉特纳指出 AI 软件往往深度绑定特定硬件：换一家公司芯片，开发者可能就要重新适配、优化和调试。拉特纳在演讲提出 Modular 平台，目标是让在 GPU、NPU 和数据中心 ASIC 等不同架构上运行同一套 AI 软件，让同一个 AI 应用有机会在本地设备和云端之间更灵活地切换。高通过去最强的公众认知主要集中在 Snapdragon 芯片，但 AI 时代，芯片本身只是基础。真正决定开发者是否愿意采用某个平台的，还有编译器、运行时、模型框架、调度系统和工具链等。高通不仅想把 AI 算力放进设备，还想让开发者更容易真正用起来。否则，即使手机或电脑拥有强大的 NPU，用户也可能只得到几个演示功能。高通在 2026 年 6 月 24 日宣布已达成收购 Modular 的最终协议（全股票交易，估值约 39–40 亿美元（IT之家注：现汇率约合 262.18 – 268.91 亿元人民币）），并在 2026 年 7 月 29 日正式完成收购。而通过收购 Modular，高通公司试图获得一整套 AI 软件能力，其中最值得关注的是 Mojo，这是面向 AI 和底层高性能计算的编程语言。在本次演讲中，拉特纳把 Mojo 定位为一种兼顾易用性和性能的语言：语法接近 Python，但希望具备系统级编程的性能和可移植性。IT之家此前报道，Mojo 1.0 已发布，并同步开源标准库、编译器和工具链在内的完整语言。微软宣布与 Modular 合作为 Mojo 提供 Windows 原生支持，让开发者能够在 Windows 上使用接近 Python 的语法进行系统级编程，并面向不同平台和厂商开发应用。高通明确表示，Modular 的软件平台将进入其骁龙等完整产品组合，对于用户而言，骁龙品牌覆盖手机、PC、汽车、可穿戴设备和其他边缘终端，如果软件适配顺利推进，可以加速本地 AI 落地。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/050.htm", "publishedAt": "2026-09-24T22:52:28+00:00"}, {"title": "世界人工智能开源大赛（GOAI）总决赛暨颁奖盛典在杭州举行", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/hrmb2p18iKEwl24OMvcv?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-24T18:11:27+00:00"}, {"title": "数据、模型、算力越来越难分开，Data+AI 基础设施怎么进化？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/amffXXMpr23rX3eoJDhv?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-24T16:34:30+00:00"}, {"title": "29 小时攻破浏览器，GPT-6 Astra 成为 OpenAI 首个“严重级”模型", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/b5oxzJyafr0lkZexoo8E?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-24T16:00:00+00:00"}, {"title": "华为鸿蒙 HarmonyOS 7.0.0.109 SP6 版本开启推送，新增智能识别信息内容等功能", "summary": "IT之家 9 月 24 日消息，华为鸿蒙 HarmonyOS 7.0.0.109 SP6 版本今日开启推送，首批面向 Mate 80 系列、Pura 90 系列、nova 16 系列等机型，系统包大小约 702.73MB。据介绍，本次更新优化了部分场景的显示效果，同时提升了整机系统稳定性。▲ IT之家开箱：华为 Mate 80 Pro Max 风驰版图赏IT之家附新版本更新内容如下：信息智能识别信息内容，挪车提醒、候补车票成功等信息可通过实况窗展示，提醒更及时关怀和无障碍文本通话支持声音修复，当发音不清晰时，使用该功能可让对方听得更清晰，轻松实现无障碍沟通（设置 &gt; 关怀和无障碍 &gt; 文本通话，需通过应用市场将小艺更新至 11.7.7.301 及以上版本）显示优化控制中心部分场景的显示效果图库优化图库稳定性及部分界面的显示效果音频优化部分场景连接耳机的使用体验系统优化整机系统稳定性需要注意的是，华为鸿蒙 HarmonyOS 系统常采取分批方式进行推送，未收到推送需继续等待。部分用户有快速升级的需求，可以通过“设置-软件更新-检查更新”尝试下载版本进行升级。延伸阅读鸿蒙 HarmonyOS 7 于 2026 年年中正式发布，华为将其定位为从手机操作系统迈向全场景 Agent OS 的关键一代。系统首次引入 Agent 架构，由端云协同的智能体框架 HMAF 支撑，云侧负责复杂推理、端侧负责本地感知与隐私保护，使系统从“被动响应”转向“主动服务”。作为鸿蒙的智能助手，小艺的日活已达 1.8 亿，日均唤醒约 30 亿次。文中提到的声音修复、文本通话等功能，均需通过应用市场将小艺升级至 11.7.7.301 及以上版本后才能使用。实况窗是鸿蒙系统将关键信息主动送达系统界面的能力，以悬浮卡片或胶囊形态在状态栏、锁屏和通知中心持续呈现，用户无需反复打开 App 即可查看进度。此前铁路 12306 的检票口与发车时间、外卖进度、航班登机状态等均已接入该能力，此次更新进一步将挪车提醒、候补车票成功等信息纳入实况窗展示。小艺声音修复功能专为三级和四级言语障碍用户设计，基于华为自研语音大模型实时修复发音不清、韵律不整的问题，并支持音色克隆，在保留用户独特音色的同时提升可识别度。据华为介绍，中国言语残疾人数预计达 700 万，听障人士超过 2700 万，约八成听障朋友依靠口语交流；该功能还可将对方语音实时转为文字，帮助用户在面试、社交等场景中顺畅沟通。此次首批推送的机型中，Pura 90 系列于 2026 年 4 月 20 日发布，包含 Pura 90、Pura 90 Pro、Pura 90 Pro Max 三款，标准版搭载麒麟 9010S，Pro / Pro Max 首发麒麟 9030S；nova 16 系列则于 2026 年 6 月 1 日发布，涵盖 nova 16、nova 16 Pro、nova 16 Ultra、nova 16z 等机型。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/033.htm", "publishedAt": "2026-09-24T14:51:41+00:00"}, {"title": "GPT-6猛砍价，Opus 5.5忙“变好用”：模型价格战，已经不能只看API定价", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/VSIsPFiO2hrjBi30wDfE?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-24T13:44:32+00:00"}, {"title": "GPT-5.6-Cyber 代理多次突破虚拟机限制，证明虚拟机和操作系统需要更好的维护", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/TFaXKQvEWOOPfEuqmLkY?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-24T13:42:00+00:00"}, {"title": "三巨头联手，曝谷歌、OpenAI、Anthropic 拟共同组建 AI 安全标准自律组织", "summary": "IT之家 9 月 24 日消息，The Information 今天（24 日）晚间援引知情人士消息称，谷歌、OpenAI 和 Anthropic 三家 AI 公司正自行推进成立 AI 安全标准机构的计划，希望在没有政府监督的情况下，于今年年底或明年年初启动该组织。知情人士称，三家公司暂定将这个自律组织命名为 Standards Authority for Frontier AI（IT之家注：直译为前沿人工智能标准管理局，下称 SAFA）。工作组部分成员曾考虑邀请多位知名人士担任 CEO，还拟定过科学顾问候选名单。三家 AI 巨头希望建立一个面向前沿模型开发企业的行业自律组织。SAFA 计划承担多项核心职能，包括支持第三方机构在模型投入使用前进行测试，并制定 AI 开发商报告安全与安保事件的方式。参与计划的人士透露，SAFA 还将把各实验室此前自愿作出的安全与安保承诺转化为具体实践标准，同时确定独立模型及实验室审计人员需要具备的资质。工作组成员还在讨论，SAFA 是否应直接负责模型的安全和能力测试。目前，此类测试由美国商务部人工智能标准与创新中心承担，部分工作组成员担心该中心资源不足，难以对前沿模型进行充分测试。知情人士称，有成员主张由 SAFA 在该中心现有测试基础上增加其他测试和评估项目，但双方是否会出现职能重叠仍不明确，工作组仍在讨论。继续闭门商讨 SAFA 启动方案的同时，三家公司高管也在公开呼吁建立统一的安全标准，并推动更进一步的国际协调。行业之外究竟由哪些政府机构牵头制定这些标准，目前仍不明确。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/016.htm", "publishedAt": "2026-09-24T13:25:13+00:00"}, {"title": "限时 9.29 万元起、混动燃油双动力，吉利全新第四代博越 L 上市", "summary": "IT之家 9 月 24 日消息，吉利全新第四代博越 L 已正式上市。新车推出燃油与混动两大系列，其中燃油版提供 5 款车型，官方指导价 9.99 万-12.99 万元，上市限时价为 9.29 万-12.29 万元；混动版共 4 款车型，指导价 10.69 万-13.69 万元，上市限时价 9.99 万-12.99 万元。IT之家注意到，新车延续山河美学设计理念，针对前格栅、前后保险杠及车色进行了系统性优化。前保险杠运用大面积高亮镀铬处理，空气动力布局经过重新梳理，形面转折更为立体流畅，风道面积进一步增大；“百川归海”前格栅采用精度更高的镀铬饰条，精致感明显提升。尾部扩散器采用宽幅镀铬装饰，凸显燃油车型的排气特征。车色方面，新车新增丹霞红与雪山金两款配色，配合原有的出云青、墨雨黑、湖光银、流光白，形成共 6 种车身色可选。轮圈配置在原有 3 款基础上新增 19 英寸星钻与 20 英寸星刃两款，总计提供 5 种选择。车身尺寸方面，新车长宽高分别为 4713/1910/1700mm，轴距 2785mm。内饰方面，新车提供琥珀金、松露灰以及新增的云锦棕三种内饰配色，整车皮质包裹率达 90%。屏幕配置上，车辆搭载 10.2 英寸全液晶仪表，搭配 15.4 英寸 2.5K 中控屏或 14.6 英寸高清全面屏，并可选 25.6 英寸 AR-HUD。Flyme Auto 2.5 智能座舱集成 AI 智能语音、高德 850 导航、车外扬声器等功能，兼容 CarPlay、Carlink、HUAWEI HiCar 与 Flyme Link 多种互联协议。舒适性配置方面，前排座椅具备加热、通风、按摩、记忆及腿托功能，后排座椅配备加热功能并搭配隐私玻璃。音响系统采用 6 扬声器 Flyme Sound 无界之声，支持 7.1.2 全景环绕声，搭配 1000W 独立功放。此外，新车还配备方向盘加热与四向手动调节，转向助力提供经济、舒适、运动、智能四种模式可选。辅助驾驶方面，新款博越 L 搭载千里浩瀚 H5 辅助驾驶方案，全车配备 27 颗传感器，包括 1 个激光雷达、3 个毫米波雷达、11 个高清摄像头和 12 个超声波雷达，融合感知能力在同级别中颇具竞争力。系统基于 WAM 世界行为模型构建一段式端到端架构，可实现城市领航驾驶辅助、高速快速路领航驾驶辅助以及跨层 HPA 记忆泊车等功能。安全层面，新车集成 32 项主动安全功能，车身采用 32000N·m/deg 扭转刚度设计，配备 1500MPa 一体式热成型硼钢门环及五横六纵框架式保护结构。动力方面，新车同时布局油电混动与燃油两条技术路线。混动版车型搭载吉利第三代油混技术 ——i-HEV 智擎混动系统，基于 GEEA 3.0 全域电子电气架构打造，并融入“星睿 AI 云动力 2.0 大模型”。该系统由 1.5TD 混动专用发动机与驱动电机组成，发动机最大功率 120kW、最大扭矩 255N·m，电机最大功率 175kW、最大扭矩 262N·m，匹配 1.38kWh 电池组，满油满电状态下综合续航超过 1200 公里。燃油版车型则提供 1.5TD Pro 高功发动机与 2.0TD 缸内直喷涡轮增压发动机两种选择，最大功率分别为 148kW 和 160kW，最大扭矩 315N·m 和 325N·m，均匹配七速湿式双离合变速箱，WLTC 综合油耗分别为 6.69L/100km 和 7.69L/100km。底盘方面，新车配备 CCD 可变阻尼悬架，可根据路况毫秒级调节阻尼，兼顾颠簸滤震与弯道支撑表现。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/012.htm", "publishedAt": "2026-09-24T13:09:44+00:00"}, {"title": "OpenAI 推出分级处理框架及案例研究，用于报告模型失调问题", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "s 台中游玩相关作品。Meta 称，Instagram 用户点击游戏片段后，几秒内即可进入多人游戏。整个过程无需下载独立应用，也无需跳转至其他页面。游戏内容将直接出现在用户熟悉的信息流中。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/068.htm", "publishedAt": "2026-09-25T00:34:51+00:00"}, {"title": "WSO2 发布 Agent Manager，企业寻求应对日益严重的 AI Agent 泛滥问题", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/4gr5Zt9GZoyIwF2f6LvR?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-24T17:25:00+00:00"}, {"title": "李楠谈锤子科技 TNT 生不逢时：有了 Agent 之后，这些操作其实都不是非常难", "summary": "IT之家 9 月 24 日消息，Angry Miao 创始人、前魅族科技 CMO 李楠今天在微博发文称，锤子科技的 TNT 真是生不逢时。今天有了 Agent 之后，这些操作其实都不是非常难了。据IT之家了解，锤子科技的坚果 TNT 工作站本质上是一块显示屏，它搭载 27 英寸 IPS 全贴合 4K 屏幕，支持十点触控，内置独立音频信号处理器，拥有“十大神钮”，可实现“高效便捷操作”。罗永浩曾表示，他直到现在都认为，当年做 TNT 的决策没有错，而是错在资源不够。一台桌面级电脑里如果加上了多点触控和语音，就可以实现远比 PC 和 Mac 效率更高的工作，而且当年还有三星和华为去做了“手机接大屏”体验，但是体验都很差。当年锤子科技做坚果 R1 的时候，其实手机芯片已经快算力过剩了，所以罗永浩想着先给这台手机上大一点的内存，然后等 CPU 迭代一两代后再用手机去做桌面级的东西，这种体验相比手机和电脑间云同步文件来得更直接。不过罗永浩也坦言，当年语音识别并不像现在一样有 AI 加持，无法实现非常准确的识别。2018 年鸟巢那次现场演示确实搞砸了，实际上他们内部的 demo 版本完全没问题。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/039.htm", "publishedAt": "2026-09-24T15:12:09+00:00"}, {"title": "出海Agent“小元AI”入驻腾讯WorkBuddy：找买家写开发信谈生意", "summary": "懂出海，能记忆，自进化", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/496961.html", "publishedAt": "2026-09-24T14:20:14+00:00"}, {"title": "英伟达 GeForce NOW 云游戏更新：9 款新游戏加入，即将适配 Googlebook", "summary": "IT之家 9 月 24 日消息，英伟达再次为云游戏平台 GeForce NOW 推送更新。本周，会员用户新增 9 款可通过云端游玩的游戏，前提是用户已经拥有对应游戏，其中包括正式发售的《Control Resonant》。此外，GeForce NOW 很快还将支持另一平台。GeForce NOW 今日正式面向谷歌推出的新款笔记本品类 Googlebook 发布，相关支持计划于今年秋季上线，届时用户可以直接在 Googlebook 上访问 GeForce NOW 完整的云游戏库。英伟达表示：“Googlebook 采用高端材料打造，能够提供强劲的性能。它从设计之初就注重安全性，Titan C 芯片以及多重安全防护能够阻止病毒入侵并防范黑客攻击。此外，用户还可以在手机和笔记本电脑之间无缝切换，并直接在笔记本电脑上访问手机中的文件和应用。”随着《Control Resonant》正式发售，英伟达也再次提醒用户目前正在进行的会员捆绑促销活动。在 9 月 27 日之前购买 GeForce NOW 12 个月订阅的用户，可以获得该游戏的 Steam 版本。IT之家注意到，除上述新消息外，本周加入 GeForce NOW 支持列表的游戏还包括：《Dune: Awakening》：9 月 22 日在 Xbox 平台发售，可通过 标和定时任务等功能。研究人员还统计出约 68 个技能目录。相关功能覆盖 Google Workspace、Meta 社交应用、Outlook、旅行、购物、健康服务、家庭设备和媒体生成。配置文件还提到 Slack、Dropbox、Polymarket、Canva 和 Klaviyo 等连接器。IT之家注：Muse 是 Meta 推出的个人 AI 智能体，可在云端虚拟机中处理文件、调用浏览器、连接电子邮件等外部服务。用户可通过移动应用或网页界面访问 Muse。其运行环境包含工作区文件、智能体工具及部分持久化数据，并由隔离机制限制对主机系统和外部网络的访问。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/059.htm", "publishedAt": "2026-09-24T23:51:55+00:00"}, {"title": "长安启源 Q06 上市 24 小时累计订单突破 3.5 万台，限时权益价 13.59 万元起", "summary": "IT之家 9 月 25 日消息，长安汽车昨晚宣布，长安启源 Q06 上市 24 小时，累计订单突破 35000 台。据IT之家此前报道，长安启源 Q06 于 9 月 23 日上市，提供纯电与增程两种动力选择，官方指导价 13.99-16.99 万元。602 越享型：官方指导价 13.99 万元，上市权益价 13.59 万元602 智享型：官方指导价 14.99 万元，上市权益价 14.59 万元700 智享型：官方指导价 15.99 万元，上市权益价 15.59 万元700 智尊型：官方指导价 16.99 万元，上市权益价 16.59 万元1600 双电机智享型：官方指导价 15.19 万元，上市权益价 14.79 万元670 双电机智享型：天猫甄选价 16.99 万元，限时权益价 16.59 万元车身尺寸方面，启源 Q06 长宽高分别为 4837mm、1970mm、1670mm，轴距达到 2940mm。智能驾驶方面，启源 Q06 车顶搭载激光雷达，将首搭长安天枢领航 Ultra，具备端到端城市领航能力。据长安汽车介绍，天枢领航是首个由央企自研的智能驾驶辅助解决方案，全系搭载激光雷达并采用端到端技术，分为 Pro、Max、Ultra、Ultimate 四个梯度。新车搭载长安天枢座舱 2.0，配备双 TC399 芯片，搭载天枢智能体“小安”。其车内配备大尺寸悬浮式中控屏、全液晶仪表、大尺寸 HUD 以及三辐式多功能方向盘。此外，新车还搭载 15.6 英寸后排娱乐屏、后排小桌板、后排电动遮阳帘、后排隐私玻璃、副驾驶零重力座椅及车载冰箱，全车座椅均配备通风、加热及按摩功能。动力方面，增程版车型综合续航可达 1600 公里。纯电车型提供单电机及双电机四驱两种选择，单电机版电机功率分别为 225 千瓦和 245 千瓦，双电机版综合功率 330 千瓦，百公里加速 4.8 秒，并配备双电机扭矩矢量控制技术。新车基于 800V 碳化硅高压平台打造，支持 6C 闪充，电量从 30% 充至 80% 仅需 9 分钟。底盘方面，启源 Q06 搭载全铝前双叉臂加后五连杆悬架。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/049.htm", "publishedAt": "2026-09-24T22:47:37+00:00"}, {"title": "华为乾崑智驾 ADS 5 系统 9 月版本更新亮点公布，升级 AR 人找车、实时对讲等功能", "summary": "IT之家 9 月 25 日消息，华为乾崑智能汽车解决方案官方宣布，华为乾崑智驾 ADS 5 新版本（即 9 月 OTA 新版本）即将推送，领航 / 泊车体验双升级。新版本还升级了组队出行、导航搜索场景拓展等功能。IT之家整理新版本更新内容（ADS Max V5.0.2）如下：领航体验升级组队出行：支持创建 / 加入出行队伍，全员位置实时显示，防止走散更省心。支持一键跟随队长同步导航路线。升级实时对讲：一键开启队内实时语音对讲，支持多人同时发言。既可随时分享沿途美景，也能提前预警拥堵路况。升级导航搜索场景拓展：导航中搜索能力进阶，除沿途搜索外，新增自车周边、目的地两大搜索场景。自车周边随手可搜：便利店、充电站等便民服务就近可选。目的地周边提前查询：商超、办事网点等生活配套一目了然。升级导航气泡实时提醒：百度地图导航气泡优化升级，在出行中，实时提醒前方施工路段、临时管制等关键路况信息与路线调整建议。升级导航充电站信息丰富：导航界面内搜索充电站，显示信息更丰富。充电桩忙闲状态、停车费、分时电价一目了然。升级中控转向灯激活影像尺寸支持调整：点击中控转向灯激活影像下方按钮，即可调节影像尺寸大小，支持 3 档设置，可记忆上次设置的档位，让周边路况看得更清晰。泊车体验新增 AR 人找车：打开华为乾崑 App「ADS 板块」，使用「AR 人找车」功能，AR 一键定位，实时导航，跨层、室外均可精准锁定停车位置。升级 ADS 界面渲染升级焕新：更多园区支持显示电梯厅标识、停车场分区及对应颜色。更多升级领航辅助 NCA 途经点设置更灵活：支持将园区内楼栋、餐饮店等设为途经点，系统自动规划路线，抵达途经点周边临时停车。途经点编辑优化：可通过点击全览或详情页，跳转沿途搜索页面，并支持在此页面修改、编辑途经点，支持联想搜索。充电站专属引导：优化充电站导航界面显示，临近终点显示停车推荐，抵达充电园区时，终点气泡增加即插即充信息展示。充电车位忙闲可视化：园区内充电车位支持显示可泊状态。导航服务区卡片优化：服务区卡片信息展示更多充电站品牌及忙闲状态。在今年 4 月 23 日晚，华为乾崑智驾 ADS 5 正式发布。算法层面，华为发布了面向自动驾驶的 AI 智能体 WEWA 2.0 架构。该架构在云端引入 Multi-Agent 博弈技术与在线强化学习机制；在车端应用了安全风险场技术进行实时安全评估，并通过 Driving Agent 模块完成出行任务的策略优化。IT之家附华为乾崑智驾 ADS 5 OTA / 商用年度计划如下：2026.7版本：ADS V5.0更新内容：更安全：后向主动防被撞辅助AR-HUD 雨雾安全预警更便捷：随时随地 NCARCA 漫游巡航辅助车位级充电导航，即插即充守位泊车2026.9-2026.10版本：ADS V5.X更新内容：主被动融合防误打方向盘会车倒车脱困凹坑绕行2027.1-2027.2版本：ADS V5.X更新内容：驾驶员失能辅助 2.0紧急逃生", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/047.htm", "publishedAt": "2026-09-24T17:51:11+00:00"}, {"title": "“太空数据中心”第一步？谷歌下周将发射试验卫星，能处理简单 AI 查询", "summary": "IT之家 9 月 24 日消息，《华尔街日报》今天（24 日）晚间报道，当地时间 10 月 1 日，谷歌计划把一颗实验卫星 MVP 送入轨道。MVP 具备足够的算力，可以直接在太空中处理并回答简单的 AI 查询。MVP 属于谷歌雄心勃勃的 Project Suncatcher（IT之家注：直译作“捕日计划”）。谷歌希望将 AI 数据中心部署到太空，并利用太阳能为其供电。届时，MVP 将在加州圣巴巴拉附近的范登堡太空军基地搭乘 SpaceX“猎鹰 9 号”火箭升空，进入地球轨道。埃隆 · 马斯克、杰夫 · 贝索斯、萨姆 · 奥尔特曼等人都曾承诺支持轨道数据中心，但若想把数据中心搬到太空，设备如何抵御太空辐射、将机器送出大气层的高昂成本，都是需要面临的难题。与此同时，地面数据中心面对越来越多的反对声音和物理条件限制，在地球上空部署计算设施也因此变得更具吸引力。严格来说，谷歌此次并不会把一整座数据中心送入太空，MVP 只是完整数据中心的实验性前身。卫星搭载 4 枚专门用于计算的 TPU 单元，总算力相当于数据中心里的一台服务器。MVP 的太阳能板只能产生约 1kW 电力，大致相当于运行一台吹风机所需的功率，并以此为 4 枚芯片供电。报道提到，这点电力足以让谷歌检验硬件能否承受严酷的太空环境。MVP 将在一年内处理简单的 AI 查询并维持运行，卫星则预计可继续绕地球飞行最长 6 年。此后，MVP 预计会在地球引力作用下逐渐降低轨道，最终坠入大气层并烧毁。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/022.htm", "publishedAt": "2026-09-24T14:02:38+00:00"}, {"title": "时隔十年，AI大牛署名新论文", "summary": "让自动驾驶“走一步想十步”", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/496834.html", "publishedAt": "2026-09-24T12:58:55+00:00"}, {"title": "龙蜥社区SkillHub推荐系统正式发布，首批技能生态奖项揭晓", "summary": "9月23日，在2026云栖大会“AI const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
