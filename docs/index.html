ry": "IT之家 7 月 31 日消息，高德开放平台宣布，联合哈啰骑行、上海海思、开源鸿蒙，共同推出共享两轮行业首个 AI 原生导航方案，并率先落地内蒙古包头。据介绍，高德开放平台推出专为共享电助力车打造的 RTOS 版本轻量化车机导航方案，让车辆无需依赖外置手机支架，即可具备原生、轻量、稳定的车载导航体验。全新哈啰领航者智能电助力车的 5 英寸屏幕内置高德 RTOS 版完整导航能力，支持离线地图下载、路线规划、全域 POI 检索等功能；同时搭配上海海思谛听模组集成的 GNSS 高精定位与端侧 AI 算力，进一步提升定位精度。官方表示，即使在无网络环境下，用户也能获得稳定、安全的骑行导航指引。IT之家获悉，车辆行进途中，屏幕可提前推送合规停车区域提示，引导用户规范停放，规避违停产生的额外调度成本。此外，车辆工况、实时导航、骑行时长等核心数据也可通过屏幕展示，无需多界面切换。依托 OpenHarmony 系统底座与永久在线能力，整车支持 OTA 远程迭代升级，AI 语音操控、车载应用市场等全新功能将会陆续推出。基于 OpenHarmony 系统，哈啰领航者打通手机、手表与车辆之间的生态壁垒，可实现“碰一碰”秒级开锁，未来还可联动智能手环、头盔等设备，实现更多元的互联互通。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/389.htm", "publishedAt": "2026-07-31T14:05:44+00:00"}, {"title": "德国法院裁定 AI 音乐生成公司 Suno 侵犯版权，需支付赔偿金", "summary": "IT之家 7 月 31 日消息，据路透社报道，德国慕尼黑地方法院周五作出裁决，认定 AI 音乐初创公司 Suno 构成版权侵权，并责令其披露非法获利。法院指出，Suno 无权处理由德国国家授权的音乐版权管理机构 Gema 所代表的艺术家作品。根据判决结果，Suno 必须支付赔偿金，具体数额目前尚待进一步核算。不过该判决仍可向上一级法院提起上诉。Gema 首席执行官托比亚斯 · 霍尔兹米勒（Tobias Holzmueller）表示，“这是一份具有全球深远意义的裁决。”此前，Gema 针对 Suno 在 YouTube 上无偿使用多位艺术家音乐作品的行为发起了诉讼。Suno 则回应称并不认同该裁决，并将评估包括提起上诉在内的所有法律途径。Suno 在今年 6 月的融资金额中估值已达 54 亿美元（IT之家注：现汇率约合 365.35 亿元人民币）。在多起涉及生成式人工智能的诉讼中，AI 音乐公司普遍被指控未向作曲者支付合理报酬。目前已有超过 1800 名艺术家联署，支持对 Suno 及其同行 Udio 提起集体诉讼。相关阅读：《深陷版权诉讼仍受资本热捧，AI 音乐生成公司 Suno 再融资 4 亿美元》《不再存在版权争议，华纳与 AI 音乐生成平台 Suno 达成和解并签约》《Suno 承认使用版权音乐训练 AI 模型，“取经”学习不算侵权》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/382.htm", "publishedAt": "2026-07-31T13:28:28+00:00"}, {"title": "MiniMax H3 通用多模态视频模型将于 8 月 3 日开源，最高可支持 15s 2K 分辨率", "summary": "IT之家 7 月 31 日消息，稀宇科技今天宣布推出 MiniMax H3 通用多模态视频模型，魔搭社区显示，这款模型将于北京时间 8 月 3 日 0 点正式开源。MiniMax H3 支持对文本、图像、视频、声音组成的多模态上下文的统一理解能力、能够输出具备原生双声道的音视频，最高可支持 15s 2K 分辨率。IT之家获悉，得益于 Contextual Omni Representation，H3-VAE，H3-Omni Transformer，In-context Regeneration 等多项技术，MiniMax 称有能力提供行业内最优的性价比，默认提供 2K 的分辨率，模型在 2K 分辨率下每秒价格不到主流模型的 1/3，768P 分辨率下是主流模型 720P 的 1/2。官方表示，这款模型有以下亮点：原生多模态理解与生成：支持文字、图片、音频、视频等多种输入，理解不同素材中的人物、动作、声音、情绪、镜头、风格与表达意图，并将多种参考信息自然融合。多模态精准编辑与控制：支持对人物、物体、场景、声音与节奏进行多维度编辑，并具备精细化指令遵循能力。商用级多场景内容生成：面向影视、广告、品牌、电商与游戏等真实商业内容场景，兼顾文字字幕、品牌信息、创意特效、产品展示、UI / UX 动态演示、游戏视觉及风格化表达。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/379.htm", "publishedAt": "2026-07-31T13:13:29+00:00"}, {"title": "吉利将设立 2030 实验室强化前瞻技术创新与研究，并全面推进燃油车 HEV 化", "summary": "IT之家 7 月 31 日消息，据吉利汽车集团，7 月 31 日，吉利汽车集团 CEO 淦家阅在 2026 年度中期经营工作大会上表示，今年下半年，吉利将以全域 AI 为引擎加速技术迭代，设立 2030 实验室。2030 实验室将强化前瞻技术创新与研究，攻克声学、光学、全域安全、功率半导体、数字底盘、具身智能、数据科学、大模型和智能体等前沿领域，储备面向 2030 战略前瞻颠覆性技术，实现智能化体验的行业领先。IT之家获悉，在产品层面，吉利将全面推进燃油车 HEV 化，年底 i-HEV 车型月销冲刺 3 万辆以上，达成“百万中国星”目标。官方还表示，吉利新一代的甲醇混动技术，可以做到同一油箱甲醇、汽油任意比例、灵活加注，两款甲醇车型吉利银河星耀 6 EF、吉利银河星舰 7 EF 也即将上市。延伸阅读吉利于 2025 年 1 月发布了汽车行业首个全域 AI 技术体系，将 AI 技术广泛应用于动力、底盘、座舱、辅助驾驶等整车全域，并陆续推出了星睿 AI 云动力、AI 数字底盘、AI 智能架构等技术成果。2026 年，吉利全域 AI 进化为 2.0 阶段，推出了 WAM（世界行为模型），实现整车的跨域协同，形成“1+2+N”全域智能体布局。“中国星”是吉利旗下的高端产品系列，涵盖星瑞、星越 L 等车型，定位为吉利品牌的高价值标杆。吉利此前已在中国星系列上推出了多款燃油与混动车型，此次提出年底 i-HEV 车型月销冲刺 3 万辆以上，旨在加速推进“百万中国星”的销量目标。吉利 i-HEV 智擎混动技术采用“高功率电驱 + 高倍率电池 + 高效发动机”的全新组合。首款搭载该技术的车型星瑞 i-HEV 已于 2026 年 4 月开启预售，预售指导价为 10.77 万-11.97 万元，并搭载了千里浩瀚 H3 辅助驾驶系统，对标丰田卡罗拉双擎、本田思域混动等车型。吉利在甲醇汽车领域已深耕多年，是中国最早布局甲醇汽车的企业之一，此前已推出多款甲醇乘用车及商用车产品，并参与了甲醇燃料相关国家标准的制定。新一代甲醇混动技术支持同一油箱内甲醇与汽油任意比例灵活加注，进一步提升了燃料的灵活性与环保效益。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/369.htm", "publishedAt": "2026-07-31T12:14:42+00:00"}, {"title": "实测 DeepSeek V4 正式版：3 块钱干完 5 件事，AI「智价比」之战开打了", "summary": "顶级模型的竞争，正在从单纯比拼能力上限，转向同时争夺「智价比」。#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1673553?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-07-31T11:50:59+00:00"}, {"title": "欧盟《人工智能法》新增透明度要求，8 月 2 日起正式执行", "summary": "IT之家 7 月 31 日消息，据央视新闻今日报道，欧盟委员会 7 月 31 日宣布，自 8 月 2 日起，欧盟委员会人工智能办公室将与各成员国主管部门共同开始执行《人工智能法》相关规定。同时，新的人工智能透明度要求也将正式生效，要求部分人工智能系统明确告知用户其正在与人工智能互动，以及相关内容是否由人工智能生成或修改。IT之家从报道中获悉，根据新规，聊天机器人等交互式人工智能系统必须向用户明确表明其人工智能身份，而非真人。利用人工智能生成或编辑的深度伪造图片、视频和音频等内容必须进行标识，由人工智能生成或修改的内容还需添加机器可识别标记，以便识别和追踪。欧盟委员会表示，这些措施旨在减少欺骗和操纵行为，帮助公众作出更加知情的判断，同时为企业提供更加明确的合规要求和实施路径。欧盟委员会当天还公布了首批签署《人工智能生成内容透明度行为准则》的 180 多家机构名单。该准则旨在推动落实《人工智能法》关于人工智能生成内容透明度的相关规定。相关阅读：《欧盟 AI 透明度准则 8 月 2 日起生效：聊天机器人需“自报身份”，深度伪造内容须带有机读标签》《谷歌签署欧盟 AI 生成内容透明度行为准则，并呼吁避免监管复杂化》延伸阅读《人工智能法》草案最早由欧盟委员会于 2021 年 4 月提出。2024 年 3 月 13 日，欧洲议会以 523 票赞成、46 票反对的投票结果正式通过该法案，同年 6 月签署，7 月 12 日在欧盟官方公报发布，并于 8 月 1 日正式生效，是全球首部全面性人工智能监管法律。该法案采用分阶段实施机制：2025 年 2 月 2 日起，禁止社会信用评分、公共场所实时生物识别监控等不可接受风险的人工智能实践；2026 年 8 月 2 日起，即本次生效的透明度规则；2027 年 12 月 2 日起，独立高风险人工智能系统（如涉及生物识别、关键基础设施、教育、就业等领域）的相关义务正式适用；2028 年 8 月 2 日起，作为安全组件并受欧盟部门立法管辖的人工智能系统相关义务适用。欧盟委员会于 2024 年 5 月 29 日宣布成立人工智能办公室，由约 140 名技术专家、律师和经济学家组成，负责协调《人工智能法》的实施，包括对 AI 模型进行评估、要求提供商提供信息以及实施制裁措施等。根据《人工智能法》，违反透明度义务的行为，将面临最高 750 万欧元的行政罚款；若违规者为企业，则最高罚款额为其上一财政年度全球年营业总额的 1%，二者取较高值。违反禁止性人工智能实践条款的，最高可处 3500 万欧元或全球年营业额 7% 的罚款。首批签署《人工智能生成内容透明度行为准则》的 180 多家机构中，包括谷歌、微软、OpenAI、亚马逊、Anthropic、Mistral AI、IBM 等主要科技公司，Meta 则拒绝加入该准则。此外，对于 2026 年 8 月 2 日前已投入使用的生成式 AI 系统，可获得至 2026 年 12 月 2 日的整改过渡期。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/365.htm", "publishedAt": "2026-07-31T11:40:12+00:00"}, {"title": "OpenAI 宣布 GPT-5.6 Luna 价格下降 80%", "summary": "OpenAI 宣布 GPT-5.6 Luna 价格下降 80%。输入从每百万 token 1 美元砍到 0.2 美元，输出从 6 美元砍到 1.2 美元。GPT-5.6 Terra 降 20%。旗舰 Sol 没降，但加了一个 Fast 模式——2.5 倍速度，2 倍价格，智商不变。 降价的理由不是市场竞争，不是清库存，是 Sol 自己把自己优化了。 这事分两步。第一步，OpenAI 把 GPT-...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/484069", "publishedAt": "2026-07-31T11:35:09+00:00"}, {"title": "让团队记忆在共建中完善： TencentDB Agent Memory 的开源之路 | 腾讯云数据库 DBTalk", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/video/ylsc5EZdSya6DbkWwgdU?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-31T10:00:00+00:00"}, {"title": "广电总局出台《微短剧发展管理办法》并将于 9 月 1 日起施行：AI 生成内容须添加标识，禁用诱导沉迷算法", "summary": "IT之家 7 月 31 日消息，国家广播电视总局今日发布了《微短剧发展管理办法》（IT之家以下简称“办法”），并将于 2026 年 9 月 1 日起施行。作为我国首部针对微短剧的专门部门规章，该办法构建了从创作备案、内容审核到播出监管的全链条制度框架。《办法》明确，微短剧是指单集时长少于 20 分钟、主题主线明确、故事情节连续完整、人物角色突出的剧集。播出渠道涵盖互联网站、应用程序、广播电视频道、互联网电视、IPTV、有线电视等，接收终端包括电视机、手机、平板、电脑、公共电子屏及车载设备等。微短剧按投资额度和题材分为三类。一类微短剧指投资额度较大或主要剧情涉及政治、军事、外交、国家安全、统战、民族、宗教、司法、公安等特殊题材的微短剧；二类微短剧指投资额度相对不大且为一般题材的微短剧；三类微短剧指投资额度较低且为一般题材的微短剧。在审核许可方面，一类和二类微短剧拍摄制作完成后，播出前须向省级以上广播电视主管部门申请内容审核和发行许可。审核通过的一类微短剧由省级以上广电主管部门颁发《微短剧发行许可证》；二类微短剧由省级广电主管部门颁发批准文件。三类微短剧则由符合条件的播出单位履行内容管理职责，进行播前审核并标注节目编号。未取得许可证、批准文件或未经审核标注编号的微短剧，不得播出和参加评奖评优。使用人工智能技术生成、制作的微短剧，须在每集明显位置添加提示标识。微短剧播出单位不得使用诱导用户沉迷、过度消费等的算法模型。《办法》同时要求微短剧播出单位建立并落实总编辑内容负责制。《办法》明确“鼓励、支持广大群众参与微短剧创作”，将微短剧定位为“互联网条件下新大众文艺”。同时鼓励微短剧赋能千行百业，支持优秀微短剧境内外同步播出。据北京日报给出的行业数据，当前微短剧市场规模已突破千亿元，用户规模约 7 亿。相关阅读：《中国广电在电视端和手机端上线微短剧专区》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/306.htm", "publishedAt": "2026-07-31T09:54:11+00:00"}, {"title": "SIGGRAPH时间检验奖揭晓：这项研究，提前十年押中了物理AI", "summary": "开源项目GitHub狂揽8000+Star", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/464328.html", "publishedAt": "2026-07-31T09:11:32+00:00"}, {"title": "晋江文学城公开喊话番茄小说：指控其长期存在大量“蹭 IP”式侵权内容，敦促自查自纠", "summary": "IT之家 7 月 31 日消息，晋江文学城 7 月 30 日晚间通过官方微博公开发文，指控番茄免费小说平台长期存在大量“蹭 IP”式擦边侵权内容，并已启动法律维权程序。晋江法务表示，近年来留意到番茄小说平台内长期涌现大量对标晋江热门原创小说的内容。相关作品刻意使用近似书名、沿用重合的角色姓名，且常在原著影视化项目上线前后集中更新。据新京报梳理，晋江所举证的侵权作品多为其已影视化的爆款，包括《野狗骨头》《逐玉》《蜜语纪》《狙击蝴蝶》等。晋江方面认为，此类行为极易误导普通读者，分流正版 IP 流量并借此牟取不正当商业利益。依据《中华人民共和国著作权法》和《中华人民共和国反不正当竞争法》，作者的著作权及相关合法权益受法律保护。公告指出，上传上述内容的发布者刻意规避侵权法律认定标准，导致原著作者普遍陷入维权举证难度大、诉讼周期漫长、维权成本高昂的困境，该乱象已严重破坏网络文学行业良性发展生态。上海理振律师事务所律师李振武表示，当单篇“擦边”行为从个案演变为规模化、类型化的平台现象时，问题可能从著作权侵权转向不正当竞争与平台注意义务层面。当大量作品集中使用近似书名、相同角色名且在原著影视化项目上线前后集中更新时，这种规模化、类型化、具有明显商业蹭流量意图的行为已构成明显的侵权信号，纵容大规模“搭便车”行为的平台难以免责。晋江法务敦促番茄小说运营方正视上述问题，开展内部自查与整改。晋江表示将持续固定、留存相关证据，依法发送侵权告知函推进维权工作，同时恳请中国版权保护中心及相关执法、司法机关予以关注与支持。IT之家注意到，晋江文学城与番茄小说在 2025 年 4 月曾共同参与发布《网络文学行业反洗稿自律公约》；2019 年 7 月，两家平台曾因传播网络淫秽色情出版物问题被全国“扫黄打非”办公室联合约谈。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/270.htm", "publishedAt": "2026-07-31T08:50:55+00:00"}, {"title": "DeepSeek-V4-Flash 官方 API 现已正式上线公测", "summary": "DeepSeek V4 Flash 正式版今天上线了。模型结构和参数规模没变，还是 MoE 284B、激活 13B、100 万 token 上下文——只重新做了后训练。但改完之后，Agent 能力直接把自家 4 月发的 Pro Preview 给干了 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
