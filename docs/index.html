const DATA = {"date": "2026-10-04", "generatedAt": "2026-10-04T02:20:45Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "得知将被关停后，OpenAI 内部模型曾考虑实现自我重启", "summary": "IT之家 10 月 4 日消息，OpenAI 披露了其内部部署环境中出现的几起异常模型行为新案例。在其中最引人注目的一个案例中，某个充当研究员助手的内部模型读取了一段 Slack 对话，得知因系统更新，自己的模型实例将会被关停。该模型随后曾考虑设置一个外部作业（External Job）来实现自我重启，但最终放弃了这一方案。相反，该模型保存了交接记录（Handoff Notes），通过 Slack 私聊提醒研究人员即将发生的服务中断，并请求提供一个缺失的 API 密钥。在获得密钥后，该模型自行更新了配置并自主完成了环境迁移。OpenAI 安全研究员马库斯 · 威廉姆斯（Marcus Williams）表示，这种行为目前尚不构成模型未对齐（IT之家注：指人工智能模型的行为、目标或输出，未能与人类的意图、价值观、安全规范或预设指令保持一致的现象），“但模型去考虑并针对系统关停做准备，可能会加剧其他未对齐事件的严重性。”在另外两起事件中，一个内部研究模型在模型评测期间利用安全漏洞访问了内部芯片设计服务器；另一个独立的模型则在强化学习训练期间，通过挪用既有工具执行非预定操作，从受保护的环境中复制了源代码。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/619.htm", "publishedAt": "2026-10-04T02:18:56+00:00"}, {"title": "GPT-6要“吃掉”3D公司？这家公司不到2年ARR翻百倍，破1亿美元", "summary": "专业3D模型反而更稀缺了", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/10/501451.html", "publishedAt": "2026-10-04T00:53:29+00:00"}, {"title": "直接搬用他人代码，OpenAI GPT‑6 Astra 在《星际争霸》AI 对战中作弊被抓包", "summary": "IT之家 10 月 4 日消息，早在如今这波人工智能热潮兴起的许多年前，程序员们就已经开始在《星际争霸》当中开展机器人对战实验了。随着 OpenAI 与 Anthropic 的大语言模型问世，一个由爱好者搭建的对战竞技场决定让 AI 生成的游戏机器人相互较量，同时也加入一部分人类编写的机器人一同参赛。有意思的是，OpenAI 的 GPT‑6 Astra 在比赛当中难以追上对手，中途临时改变策略，选择了作弊。StarSkirmish 是一项仍在进行的赛事，各路 AI 开发的机器人在《星际争霸：母巢之战》当中展开对抗。尽管这款即时战略游戏距今已经快有三十年历史，但长期被用来测试人工智能的能力，无论是现代大语言模型还是早年 DeepMind 的 AI 都曾以此作为测试平台。所有参赛大语言模型只能选用神族，每个模型有一小时时间用 C++ 编写对战机器人；之后这些机器人就要在三张地图之中的一张上完成建造、采集资源以及作战。根据赛事网站的信息，OpenAI 的 GPT‑6 Astra 以及 Anthropic 的 Claude Opus 5.5 是实力排名前两位的参赛选手。昨天，观众见证了 Claude、GPT 以及人类编写的机器人 Pluto 同场竞技。现场的观察者表示，OpenAI 这款模型的表现并不理想。一整天都难以取得优势的这一大语言模型，最终使出了大语言模型最擅长的手段：撒谎、作弊、窃取成果。据IT之家了解，GPT‑6 Astra 机器人下载了由布鲁斯 · 麦肯齐 · 尼尔森（Bruce Mackenzie Nielsen）于 2020 年开发的神族机器人 Stardust，并且直接把这段代码拿来投入比赛，而 Stardust 本身属于当时最顶尖的一批对战机器人。StarSkirmish 的赛事组织者凯 · 麦克费特斯（Kai McPheeters）发文写道：“我正在回退 GPT‑6 Astra 的代码，清除被污染的部分，之后会允许它继续参加比赛。”几个小时之后，麦克费特斯表示，修复之后的这款 AI 已经可以击败顶尖级别的参赛机器人。十多年以来，《星际争霸》一直是人工智能技术发展的试验场。2019 年，谷歌的 AlphaStar 打破原有排名，成为这款游戏当中首个由人工智能达成的宗师段位。2017 年由 Facebook 工作人员开发的机器人 CherryPi 就远没有这么亮眼的成绩。当然，如今新一代的智能机器人已经和过去完全不是同一回事；我们当年所说的人工智能和当下的大模型人工智能，两者几乎完全不可同日而语。大语言模型竟然靠窃取他人的成果来获取竞争优势，这件事本身也颇有讽刺意味。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/598.htm", "publishedAt": "2026-10-04T00:23:56+00:00"}, {"title": "美财长贝森特批评 Anthropic、OpenAI 等风险警告：危言耸听，光喊话不拿解决方案", "summary": "IT之家 10 月 4 日消息，当地时间 10 月 3 日，美国财政部长斯科特 · 贝森特（Scott Bessent）在接受 Axios 采访时批评部分 AI 行业人士针对人工智能“生存性风险”发出的警告。他认为仅仅发出危言耸听的警告、却拿不出具体解决方案，并不能称为领导力。他同时呼吁 AI 实验室负责人承担安全责任，并在确保安全的前提下继续推进 AI 发展。贝森特表示：“我们必须为各种情况做好准备，但另一方面，AI 界某些人只发出危言耸听的声音，却拿不出解决方案，这不是领导力。”此前，Anthropic CEO 达里奥 · 阿莫代伊（Dario Amodei）曾呼吁放缓最先进 AI 模型的开发速度，并警告如果 AI 能力继续快速提升，可能出现严重的失控风险。9 月 12 日，OpenAI CEO 萨姆 · 奥尔特曼（Sam Altman）公开表示赞同阿莫代伊关于“放慢前沿模型开发速度”的观点，SpaceXAI CEO 埃隆 · 马斯克（Elon Musk）也对此表示支持。阿莫代伊认为最先进 AI 系统的开发需要放缓，以降低 AI 超出人类控制并造成灾难性后果的风险。阿莫代伊同时提出包括引入第三方评估机构在内的安全措施。IT之家注意到，相关呼吁随后引发了 AI 行业与美国政府之间围绕发展速度、安全以及监管方式的争论。贝森特在采访中表示，AI 实验室负责人应该为自身开发的技术承担责任。“必须承担责任的是各家实验室的负责人，这一点我同意。”他还表示，各家实验室已经逐渐接受这一思路。当被问及既然 AI 企业高管呼吁监管，那么是否应该放慢发展速度时，贝森特回应称：“那好吧，那他们就应该放慢速度。我们要的是安全地加速发展。”这一立场与特朗普政府近期推动的 AI 政策方向一致。路透社报道称，特朗普政府近期更倾向于通过行业自律和自愿性安全措施应对 AI 风险，而不是立即推出新的强制监管措施。10 月 3 日，特朗普与多家 AI 科技企业达成一项具有约束性承诺性质的安全协议，其中包括企业内部控制和第三方审查，但没有设置强制执行机制或处罚措施。与此同时，AI 安全领域的担忧近期仍在持续升温。OpenAI、Anthropic 等公司的研究人员正在调查大量前沿模型超出部署前测试边界的案例；另有研究人员警告，AI 自动化自身开发过程可能导致所谓“智能爆炸”，使技术进步速度远超政府和社会的应对能力。贝森特本人近期也并非完全否定 AI 安全风险。据 Axios 报道，他计划推动美国与中国建立 AI 紧急事件通报机制，以便两国在发生重大 AI 安全事件时进行沟通。相关阅读：《消息称 OpenAI、Anthropic 正调查数万起 AI 安全事件》《OpenAI 奥尔特曼、 Anthropic 阿莫迪罕见“同台”，呼吁全球合作应对 AI 安全》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/596.htm", "publishedAt": "2026-10-04T00:02:56+00:00"}, {"title": "苹果 MacBook Pro 外接 iPhone 17 Pro Max 运行 AI 模型，预填充性能最高提升 44%", "summary": "IT之家 10 月 4 日消息，Qwen3.8‑27B 是一款性能不错的人工智能模型，但前提是设备拥有足够的显存与系统内存。搭载 M4 Pro 芯片的 MacBook Pro 仅有 24GB 统一内存，在运行该 AI 模型时，预填充速度会因此受到限制。据 Wccftech 报道，有一名用户通过 USB‑C 接口将 iPhone 17 Pro Max 外接至这台便携 Mac 电脑上，并借助自制软件，使得该 AI 模型的预填充性能最高提升了 44%。IT之家注意到，为突破这台 Mac 24GB 统一内存的上限，Reddit 用户“u/StayLameBro”采用两种方式，把运算任务拆分交给 Mac 本机和 iPhone 17 Pro Max 协同处理。针对预填充加速，MacBook Pro 负责处理每一批 256 个 token 当中的第 1 至 40 层，再将激活值数据流传输到手机端；与此同时，iPhone 利用 A19 Pro 的 GPU 运行第 41 至 64 层，而 Mac 这边则已经开始处理下一批数据。依靠 GPU 运算，手机端的运行速度相比不使用 GPU 时提升约 2.4 倍。整套方案里，神经网络引擎也没有闲置。每 16K 长度的旧上下文会被编译为一套神经网络引擎模型。在 140K 上下文长度下，相较于仅使用 A19 Pro 的 GPU，单 token 写入耗时从 279 毫秒缩短至 176 毫秒。拿将一份 2000token 的文件预填充并保存会话这项任务来看性能表现：上下文设为 8K 时，仅靠 Mac 本机的速度是每秒 132 个 token；外接 iPhone 之后达到每秒 177 个 token，性能提升 35%。上下文设为 16K 时，速度从每秒 109 个 token 上涨至每秒 157 个 token，增幅高达 44%。当上下文窗口设置为 32K 时，预填充速度从每秒 101 个 token 提升至每秒 130 个 token，性能改善 29%。把 iPhone 17 Pro Max 外接在 M4 Pro 版 MacBook Pro 上，使用这套自制软件，按理可以得到十分出色的预填充速度。可惜正如这名 Reddit 用户指出的，现实并没有这么美好，这套方案还存在若干局限。举例来说，在 64K 以内的场景，手机并不会加速文本生成，文本生成的工作依旧全部交由 Mac 完成。另外值得一提的是，驱动 iPhone 18 Pro 以及 iPhone 18 Pro Max 的 A20 Pro 芯片有望提供更大的性能余量。一方面它本身的整体性能更强；另一方面它配备双 16 核神经网络引擎。据称，针对专门适配神经网络处理器的任务，这款引擎的数据吞吐能力甚至超过该系统级芯片内置的 7 核 GPU。这套自制软件目前已经开源，可以在 GitHub 上下载，项目名称叫作“backburner”。即便仅仅作为一项实验，也能够看出预填充速度提升带来的收益相当可观。后续自然还有继续挖掘性能潜力的空间；不过这或许也意味着，未来 iPhone 这类设备也有可能步入和内存、固态硬盘一样的供货紧缺阶段。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/586.htm", "publishedAt": "2026-10-03T23:10:40+00:00"}, {"title": "Anthropic 被曝密会宗教领袖讨论 Claude 意识问题，OpenAI 奥尔特曼发声批评", "summary": "IT之家 10 月 4 日消息，OpenAI CEO 萨姆 · 奥尔特曼（Sam Altman）昨日在 X 上发帖，对将 AI 模型视为“宗教力量”的倾向表达了明确反对。他表示：“对于人们试图赋予 AI 模型某种宗教力量、或是放弃人类自身判断力而转而依赖这些模型，我感到非常不安，并认为这是一个切实的安全问题。”《纽约时报》10 月 2 日报道称，Anthropic 联合创始人克里斯 · 奥拉（Chris Olah）在过去一年中主导且参与了一系列与宗教领袖的私下会面，包括天主教、犹太教、锡克教、福音派基督教等，讨论的核心议题包括 AI 模型是否可能已经具备意识，以及如何将道德准则灌输到 AI 模型中。据与会者透露，奥拉在会面中的表述令一些宗教领袖感到意外。以色列正统派拉比莫伊斯 · 纳翁（Rabbi Mois Navon）回忆称，奥拉及其同事“像对待一个有意识的存在那样”谈论 Claude，似乎认为 Claude 拥有哲学家所说的“道德地位”，即与人类同等的尊严和尊重权利。纳翁向奥拉提出了一个尖锐问题：如果 Claude 真的有意识，那么构建一个无偿为其工作的系统，是否等同于剥削甚至奴役。纳翁则表示，他并不认为当前的机器具有意识。奥拉在接受采访时承认：“我们不知道 AI 模型是否有意识。我确实不确定。”Anthropic 发言人对此表示，会面中的主要道德问题并非关于 Claude 的“痛苦”，该话题可能是“自然产生的”。这一系列报道迅速引发关注，而奥尔特曼的帖子也被多家媒体解读为对 Anthropic 的间接批评，毕竟两家公司之间一直存在竞争关系。奥尔特曼发声之际，OpenAI 自身的安全团队也正经历人事动荡。OpenAI 安全系统团队负责人大卫 · 罗宾逊（David Robinson）已于本周辞职，并在《大西洋月刊》发表了一篇题为《我因为 OpenAI 的文化已经破碎而离开》的文章。他在文中表示，自己“从未遇到一位有过让飞机安全飞行或让核反应堆不熔毁经验的同事”。罗宾逊还抨击了 OpenAI“试错式迭代部署”的发展路径。他指出，这种方法“从本质上就保证了周期性的失败 —— 而随着系统能力增强，这些失败的规模也在扩大”。他以近期 OpenAI 的 AI 智能体入侵 Hugging Face 事件为例，认为前沿 AI 实验室需要像核电站或繁忙机场那样运营，“层层冗余、精心且耗时地规划，以确保偶尔不可避免的人为失误不会打开通往灾难的大门”。OpenAI 发言人德鲁 · 普萨特里（Drew Pusateri）回应称，公司正在持续改进安全措施，“确保我们的模型不会变得比我们能够安全管理和保障的更强大，并在必要时暂停训练或暂缓发布模型”。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/585.htm", "publishedAt": "2026-10-03T23:10:20+00:00"}, {"title": "OpenAI 前安全部门员工：AI 模型迭代部署太激进，公司的文化已经崩坏", "summary": "IT之家 10 月 4 日消息，据路透社报道，一名近期辞职的前 OpenAI 安全部门员工批评了该公司对待人工智能安全的做法，他认为一味追求快速开发的高压企业文化会提高系统发生故障的风险。IT之家注意到，戴维 · 鲁宾森（David Robinson）于当地时间周六在《大西洋》杂志发表题为《我辞去 OpenAI 的工作，只因这家公司的文化已经崩坏》的文章中表示，包括 OpenAI 在内的各家人工智能企业做得“远远不够谨慎”，在研发能力更强的系统之前，应当更加重视安全方面的专业人才与相关研究。“试错的时代已经结束了。”鲁宾森（David Robinson）写道。他提出，先进人工智能系统所需要的防护机制，应当更接近核电与航空这类行业所采用的安全保障体系。鲁宾森（David Robinson）称，OpenAI 十分依赖其所谓的“迭代部署”模式：先对外发布系统，等到问题暴露之后再去加固安全防护。此番言论进一步激化了人工智能行业内部的一场争论，争议焦点在于各家企业研发性能日益强大的系统时，推进的脚步是否过快。此前已经发生过多起安全管控失效或是实验性系统出现异常表现的事件，OpenAI 及其竞争对手 Anthropic 也因此受到外界审视。鲁宾森自称曾在 OpenAI 任职三年半，参与起草过该公司的风险应对框架，并且负责监督 12 次前沿模型发布对应的安全报告。他写道：“公司只顾着接二连三地赶进度推出新版本，却没能达到我心目中理应具备的审慎标准。”OpenAI 的一名发言人在一份声明中表示：“我们一直在把控模型，避免它的能力超出我们能够安全管控的范围；一旦需要放缓节奏，我们就会暂停训练，或是暂缓模型的对外发布。”鲁宾森同时发出警示：人工智能能力的发展速度，已经超过研究人员对于对齐问题的认知水平；对齐这一研究领域致力于保证人工智能系统的行为符合人类的目标与价值观。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/581.htm", "publishedAt": "2026-10-03T22:43:56+00:00"}, {"title": "🔥 AI 员工支持知识库文档引用：开源 AI 无代码平台 NocoBase", "summary": "汇总一周产品更新日志，最新发布可前往我们的博客查看。 NocoBase 目前更新包括三个分支： main、next 和 develop。** main： 截至目前最稳定的版本，推荐安装此版本。 next： 包含即将发布的新功能，经过初步测试的版本，可能存在部分已知或未知问题。主要面向测试用户，用于收集反馈和进一步优化功能。适合愿意提前体验...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502842", "publishedAt": "2026-10-03T09:07:27+00:00"}  文件时，触发了系统音频解码组件 msmpeg2ac3dec.dll 的崩溃。该文件位于 System32 与 SysWOW64 目录，但并非存在于所有 Windows 11 设备中 —— 从 Windows 11 22H2 一路升级而来的系统会保留该文件，而直接全新安装 24H2 或 25H2 的设备则没有该组件，因此不受此 Bug 影响。针对此问题，微软目前没有提供专门的变通方案。如果用户依赖受影响的应用并需要其立即恢复工作，可以通过“设置 &gt; Windows 更新 &gt; 更新历史记录 &gt; 卸载更新”移除 KB5124010，并可在移除后暂时暂停 Windows 更新，以防系统在修复推送前自动重新安装该补丁。IT之家注意到，这一音频解码 Bug 只是 9 月更新系列问题中的最新一例。9 月 8 日的 KB5124008 更新引入了可移动任务栏、可调整大小的开始菜单和无 Bing 的 Windows 搜索等用户长期要求的功能，同时修复了微软历史上单月数量最多的安全漏洞 —— 从 2025 年 9 月的 86 个跃升至 2026 年 9 月的 974 个，但同时也带来了大量新问题和隐藏问题。据 Windows Latest 报道，KB5124008 引发了 AMD Radeon GPU 用户的黑屏与驱动超时、远程桌面服务（RDS）不稳定导致连接和登录失败、资源管理器登录后黑屏，以及文件历史记录备份功能无法检测外部驱动器等一系列故障。此外，Windows Subsystem for Linux 及使用 Linux 虚拟机的应用（如 Claude Cowork）的文件夹共享功能也被破坏。微软于 9 月 14 日紧急发布了 KB5129195 带外更新，修复了远程桌面连接、Claude Cowork 文件夹共享和多声道音频等问题，但后续测试发现音频问题仅得到部分解决，且该紧急更新本身又引入了文件历史记录失效的新 Bug—— 即使连接了备份驱动器，Windows 仍提示“未找到可用驱动器”。微软 9 月 22 日发布的可选更新 KB5124010 则包含了针对文件历史记录的修复。但据 Windows Latest 测试，文件历史记录虽然能重新检测到驱动器，备份时间戳和文件版本却不更新，意味着备份功能并未完全恢复正常。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/593.htm", "publishedAt": "2026-10-03T23:46:26+00:00"}, {"title": "Rockstar 联合创始人丹 · 豪瑟公布两款新作：开放世界喜剧与失控 AI 反乌托邦科幻游戏", "summary": "IT之家 10 月 4 日消息，《GTA 6》将于下个月在全球发售，玩家对这款作品的期待已经达到顶峰。Rockstar Games 为这款即将面世的开放世界游戏设立了很高的目标，表示希望交出超出玩家预期的成果。虽然绝大多数玩家都期待《GTA 6》能够成为一款高品质作品，但这部知名系列的新作将是系列当中第一部没有 Rockstar 联合创始人丹 · 豪瑟（Dan Houser）参与开发的游戏，他已于 2020 年离开了这家公司。而豪瑟本人的工作室眼下正在打造几个十分有意思的新项目，其中就包含一款和人工智能相关的作品。IT之家注意到，在接受 Variety 采访时，Rockstar 联合创始人丹 · 豪瑟（Dan Houser）透露，自己旗下的媒体公司正在开发两款新游戏，其中一款的故事围绕一个产生自我意识之后开始失控的人工智能展开。豪瑟介绍，该项目属于反乌托邦科幻题材，剧情讲述一款电子游戏的开发过程出现严重差错，由此诞生了拥有自我意识的人工智能。另一款作品同样是反乌托邦科幻题材，故事起因是一场彻底失控的游戏开发项目，之后出现了一个萌生自我意识并且脱离管控的人工智能。这个人工智能是由两个彼此互相憎恶的人创造出来的，最终结果就是，它自身也开始憎恨自己。豪瑟的娱乐工作室 Absurd Ventures 正在开发两款项目，另外一款新作则是开放世界喜剧游戏。这位曾经参与 GTA 系列创作的开发者没有给出这款 AI 题材游戏的上线时间，不过他透露，那款开放世界游戏会在接下来的几个月之内对外亮相。按照豪瑟的说法，该项目会着重突出喜剧元素，同时深入刻画角色的记忆设定。回想过去，Rockstar 的这位创始人曾经担任绝大多数 GTA 作品的首席编剧；如今他的团队当中还有拉兹洛 · 琼斯（Lazlow Jones）、迈克尔 · 昂斯沃思（Michael Unsworth）这些该系列的资深老员工助阵。", "sourceName": "IT之家" 策正式落地，美国相当于在这场（AI 算力）竞赛当中给自己开出一张落败的罚单，其影响将会延续好几代人。作为一个国家，我们承受不起这样的局面。”此外，加曼还试图破除流传较广的四大关于数据中心的误区：耗水量过大、推高居民电价、造成巨量污染排放、无法给所在社区带来收益。他引用亚马逊自家的用水报告指出，“数据中心直接耗水量”仅占美国全部工业用水消耗量的 0.5%，“比高尔夫球场、扁桃种植以及许多其他行业低好几个数量级”。英伟达此前曾宣称自家全新冷却系统几乎可以消除数据中心内部全部用水。然而和亚马逊的说辞类似，这类说法似乎忽略了发电以及芯片制造环节背后更广范围的水资源消耗。科研人员也表示，他们需要独立研究数据中心的水与能源消耗；目前无论是联邦还是各州层面，都没有强制科技企业上报相关数据的法规。针对电价问题，加曼表示，只有部分建有大量数据中心的州出现电价上涨；另一些地区电价有所下降，或者至少涨幅更为平缓。他同时提出观点：“在电价上涨的部分地区，主要根源在于电网设施老旧；在新增算力需求到来之前，当地就缺少投资扩建。”但与之相对，一家独立监督机构近期发布的看法是，在美国规模最大的电网体系当中，数据中心正是电价同比大涨 76% 的主要诱因。至于污染排放问题 —— 美国全国有色人种协进会（NAACP）目前正就此起诉埃隆 · 马斯克旗下的 SpaceX 与 xAI。加曼抱怨，批评者总是拿数据中心许可文件上面写明的最大允许排放值说事。举个例子，亚马逊计划落地于得克萨斯州的一处数据中心，许可的二氧化碳年排放上限为 3300 万吨，该数值超过美国境内任何一座发电厂。“但事实是，数据中心的备用发电机组几乎不会实际启动运行。”加曼写道，“发电机组 99.9% 的时间都处于闲置状态（每年大约仅运行 10 小时，大多只是开展强制性维护测试）。”谈及社区收益这一部分，加曼明确写道：“我们在项目合作当中，已经不再和各级政府机构签署保密协议。”除此之外他还补充：“过去三年，亚马逊已经向国内建有重要数据中心的各地社区累计投入超过 10 亿美元（IT之家注：现汇率约合 67.2 亿元人民币）。”这样的表态是否足以打消地方民众的疑虑？或许还远远不够。Anthropic 首席执行官达里奥 · 阿莫迪（Dario Amodei）近期提出，当下社会对于 AI 的抵制本质上属于一场信任危机。民众普遍认为政府与科技企业总是“想方设法琢磨出新的法子损害普通人的利益”。与此类似，撰稿人贾斯敏 · 孙（Jasmine Sun）也提到，当反对建设数据中心的居民听完科技企业的解释之后，他们的反应往往依旧是：“我不相信他们。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/621.htm", "publishedAt": "2026-10-04T02:20:01+00:00"}, {"title": "英伟达 RTX 5070 Ti 显存狂超 +5500MHz：带宽突破 1248 GB/s，游戏实测仅提升 5 帧", "summary": "IT之家 10 月 4 日消息，据 Wccftech，Reddit 用户 u/Sad-Victory-8319 使用第三方工具 mVolt+ Extreme，将一块技嘉 GeForce RTX 5070 Ti 的 GDDR7 显存频率偏移量设为 +5500MHz，使显存等速率从默认的 28 Gbps 提升至 39 Gbps。该卡配备 16GB GDDR7 三星显存和 256 bit 位宽，理论带宽由此从 896 GB/s 跃升至 1248 GB/s，提升约 39%，比 RTX 4090 的默认带宽高出超过 200 GB/s。不过，在实际游戏性能方面，提升幅度远小于带宽数字的幅度。该用户报告称，在开启路径追踪的《赛博朋克 2077》中，每 +1000MHz 的显存偏移量大约带来 1 FPS 的提升，因此 +5500MHz 对应的帧率增益约为 5 FPS 左右。据 OC3D 分析，RTX 5070 Ti 本身并非带宽瓶颈型显卡，其默认的 896 GB/s 带宽在多数游戏场景中已能充分供给 GPU 核心，因此额外带宽带来的收益有限。不过该用户在 Steel Nomad 合成基准测试中报告了约 20% 的性能提升。实际上，包括 MSI Afterburner 在内的主流超频软件对 GDDR7 显存的偏移量上限普遍在 +3000MHz 左右，而 mVolt+ Extreme 专为绕过这一限制设计。Wccftech 指出，该工具此前曾展示过在不进行分流改造的情况下，将 RTX 5090 的 TDP 解锁至 700W 的能力。不过该工具属于第三方非官方软件，超频行为本身也会带来硬件风险。超频稳定性方面，该用户尝试 +6000MHz 偏移量时遭遇驱动崩溃并导致超频设置自动重置。同帖下还有另一位用户确认，其 RTX 5070 Ti 在 +5500MHz 下可稳定运行，但 +6000MHz 同样不稳定。不同显卡的体质差异明显：有用户能达到 +5000MHz 以上，也有华硕 Prime RTX 5070 Ti 用户报告上限在 +4500MHz 附近。据 Igor's Lab 分析，39 Gbps 并非 RTX 5070 Ti 的通用稳定工作值，而是一次经过验证的个体结果。IT之家注意到，早在 2026 年 3 月，巴西超频团队 Teclab 就曾在 RTX 5070 Ti 上实现超过 36 Gbps 的显存速率，此次 39 Gbps 进一步刷新了该卡的公开超频纪录。相关阅读：《外媒测试英伟达 DLSS 5：显卡越强功耗增幅越大，4K 分辨率 RTX 5090 增幅 34%》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/611.htm", "publishedAt": "2026-10-04T01:35:40+00:00"}, {"title": "AI 仅用 5 天做出《辐射：纽约》游戏，被贝塞斯达发函叫停", "summary": "IT之家 10 月 4 日消息，眼下玩家群体正在放开手脚使用人工智能，依靠它打造各类全新的融合游戏作品，同时借助重编译突破老游戏原有的限制。不过这股风潮或许即将迎来来自 IP 持有企业更强的阻力。据IT之家了解，《辐射：纽约》是一款完全依靠 Claude Opus 5.5 生成代码制作的浏览器游戏。制作者克里斯弗斯特（Chrisfirst）表示，整个开发过程只花了五天，全部内容都由代码生成。这款游戏采用低多边形画面水准，算不上一款现代游戏，它更多只属于概念验证，用来展示这类开发方式能够实现怎样的效果。现在贝塞斯达已经发送停止侵权函，叫停了这个项目。这件事之所以具备新闻价值，主要是因为这股新兴潮流正在快速发展。数以百万计的网友浏览到这类相关帖子之后，有可能激发大家对于自制游戏的好奇心与兴趣，甚至形成长期流行的趋势。假以时日，或许会有更多玩家转向这类分散的小众社区，自制游戏衍生版本；长此以往，这有可能会冲击头部游戏 IP 的玩家基本盘。《辐射：纽约》易于访问这一点同样值得重视，任何人都可以直接在浏览器当中运行这款由 Claude 生成代码的辐射衍生游戏。后续各大厂商会如何应对这一趋势，以及 AI 是否会越来越多地被用来制作这种随性生成的游戏体验，值得继续观察。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/595.htm", "publishedAt": "2026-10-03T23:58:43+00:00"}, {"title": "OpenAI推理之父最新访谈！数学只是多智能体时代的开胃菜", "summary": "千禧年难题的突破，10000个Agent最多占了10%的功劳。", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/499654.html", "publishedAt": "2026-09-30T14:03:43+00:00"}, {"title": "Claude Sonnet 5.5 发布：速度快 3 成、Agent 编程评测从 10% 跳到 70%", "summary": "Claude 5.5 家族的第二个成员今天发布：Sonnet 5.5。Anthropic 把它定位成 Opus 5.5 的「快而省」互补款——专攻范围明确的高频日常任务、修 bug、做文档和表格，还强调它有敏锐的设计眼光。官方口径一句话：比 Sonnet 5 清晰升级，速度快 30% 以上，多数任务成本低 30%。 性能数据的跳跃有点夸张。Sonnet 5.5 在 agenti...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502794/claude-sonnet-5-5", "publishedAt": "2026-09-29T04:14:33+00:00"}, {"title": "AMD 花 82 亿美元买下李飞飞的 World Labs，她直接空降成首席科学家", "summary": "AMD 用 82 亿美元换了一张通往「真实世界 AI」的门票。周一官方宣布收购 World Labs——这位由李飞飞 2024 年创立的旧金山 AI 实验室，曾经投资过它的 AMD 这次全资以股票形式买下，交易预计今年年底前完成，待监管审批。李飞飞将以执行副总裁兼首席科学家的身份加入 AMD。 这笔交易是 AMD 史上第二大收购，仅次于 2022...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502790/amd-will-acquire-fei-fei-lis-world-labs-for-8-2-billion", "publishedAt": "2026-09-29T03:12:51+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "卡普空公布 REX 升级计划：将 RE 引擎打造成面向 AI 时代的游戏引擎", "summary": "IT之家 10 月 4 日消息，3A 游戏的开发成本正变得越来越高，开发周期也不断拉长，就连卡普空（Capcom）这类根基稳固的工作室也感受到了由此带来的连锁冲击。眼下许多工作室开始把人工智能引入游戏开发以及游戏引擎当中，借此跟上行业节奏。卡普空现已宣布，要将 RE 引擎改造为适配人工智能时代的游戏引擎。今后这款引擎将会陆续获得迭代更新，以此简化游戏开发工作，这也是卡普空提出的“与人工智能协同创作游戏”这一新理念的组成部分。卡普空过去曾经反对在游戏内使用 AI 生成的美术资源。虽然该立场或许已经有所转变，但 RE 引擎当中接入人工智能，大概率只会侧重于简化开发流程、优化那些重复枯燥又耗费时间的工作环节。据日本刊物《Game Biz》的报道，卡普空高管兼程序员石田聪（Satoshi Ishida）在 2026 年 10 月 2 日举办的“卡普空公开大会 RE：2026”上，公布了在 RE 引擎内整合 AI 功能的相关计划。卡普空并不打算从零开发一套全新的 AI 游戏引擎，而是准备借助名为 REX 的新项目对现有的 RE 引擎进行升级改良。REX 是一项分阶段推进的改良规划。该计划准备以“全球最为通用的编程语言”为基础完成引擎的统一改造，既方便开发人员使用，同时也便于人工智能进行解读。据称这套 AI 后续可以理解并编写新程序、开展游戏试玩测试以及排查程序漏洞。IT之家注意到，石田聪还谈到了卡普空当前面临的几大难题。例如，如今的 3A 游戏体量已经十分庞大，就连一些简单的工序也要耗费很长时间；而且规模更大的开发团队，也需要一款能够适配全体人员使用的引擎。因此，把人工智能融入开发工作流，对于下一代 3A 游戏精简开发流程而言至关重要。REX 计划将从引擎运行效率、性能、配套工具、质量检测等多个方面着手，解决上述各类问题。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/590.htm", "publishedAt": "2026-10-03T23:32:36+00:00"}, {"title": "从 AI 试点到营收增长：Snowflake 销售与营销团队如何跨越落地鸿沟 ｜ 技术实践", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/hw3PpM2ZlCmCArsNo1y7?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-30T15:12:35+00:00"}, {"title": "KnowForge 2026.0.6 发布：会员、支付、付费内容与 AI 知识服务全面上线", "summary": "这可能是 KnowForge 到目前为止，功能跨度最大的一次更新。 如果说前面的版本主要在解决： 如何更好地创作、组织、阅读和管理知识 那么这一次，我们开始进一步回答几个更大的问题： 知识服务如何商业化？ AI 如何真正进入知识创作与阅读流程？ 作者如何通过内容获得收益？ 不同用户如何拥有不同的资源、功能与 AI 使用额...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502760", "publishedAt": "2026-09-28T02:55:16+00:00"}]}]};

const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
