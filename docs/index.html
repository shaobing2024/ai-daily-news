毫无预警被禁用，申诉被拒绝，理由只有一句笼统的「违反使用政策」，没有引用任何具体条款。追加申诉后，收到的回复是，「这是我们的最终决定」。更荒诞的是，一旦账号被标记，申诉页面会永久卡死在一句「Your account will remain closed」的静态提示上，没有任何表单输入框，没有任何申诉入口。发给官方支持邮箱的申诉工单，全被自动化机器人自动关闭。更离谱的是，有人注册 15 分钟就被封，号刚建好，一条消息没发，一个 API 没调，直接没了。更让人不安的是，这场大清洗可能还远未结束。Anthropic 在最新的政策更新中宣布，将于 2026 年 11 月 12 日生效新的限制条款，明确将多种情况纳入禁止使用范围。政策尚未生效，社区里已经有人预言，到时候估计又是一轮大逃杀。千万别豪赌一个 Claude有网友总结出一条血泪教训，「千万别豪赌一个 AI」。GitHub 上有人专门建了一个仓库，叫「Claude 封号自救指南」，持续追踪每一轮封号潮。仓库里，整理出一份核心防封原则。但说到底，这些只是「苟活」技巧。面对一个随时可能挥刀的自动化风控系统，没有任何账号是绝对安全的。说到底，这件事最讽刺的地方就在这里。我们每天都在惊叹 AI 又替代了多少人工、进化出了多强的逻辑，却往往忘了最原始的一件事 —— 在这个生态里，我们对自己的「生产力资产」没有任何话语权。自己熬夜喂出来的 Agent、调优的几十套工作流，在对方眼里不过是一串可以随时置为 false 的布尔值。真的，别把自己的身家性命，全押在一个 Claude 上。本文来自微信公众号：新智元（ID：AI_era），作者：ASI 启示录，原标题《离谱，Claude 半年封杀 1140 万账号！申诉后仅 4.2 万翻案》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/011/553.htm", "publishedAt": "2026-10-11T00:27:39+00:00"}, {"title": "微软 CEO 纳德拉：开发者应当默认假设 AI 模型失控，思考如何强制中断任务", "summary": "IT之家 10 月 11 日消息，微软 CEO 萨蒂亚 · 纳德拉认为，在 AI 日益蓬勃发展的时代，使用超级智能自我监控等简单策略是不够的。纳德拉在北京时间 10 月 10 日晚的一篇长文中指出，传统软件系统在过去几十年中被广泛部署，人类已经拥有追踪特定代码路径行为的工具和能力。然而，AI 模型比传统软件更强大，但却是一个黑盒子，我们部署了这些复杂的智能体系统和模型，访问我们最敏感的数据，并赋予它们代表我们执行关键任务的能力。纳德拉认为，我们应该退一步思考，重新评估这个新时代的信任架构。模型提供商根本无法将责任外包出去，不能把超级智能当作一套嵌套的黑匣子，简单地接受或拒绝它的建议、答案和行动。我们必须建立能够观察其行为、可测试极限和始终可容纳行为的封闭系统。纳德拉表示，将前沿封闭权重和开放权重模型视为内部风险，是构建此类体系的一种方式。这并不是因为 AI 模型一定是恶意的，而是任何有足够能力、能够接触重要系统的行为者都可能犯错或被攻破，而遏制和控制的架构必须考虑到这一点。纳德拉提到，开发者应当围绕可观测性原则设计这些系统，IT之家附具体原则如下：模型多样性：没有任何模型应成为重要结果的唯一依赖，也不应负责验证自身工作。观察一切：每一个有意义的模型动作都必须留下防篡改、人类可读的证据。不能观察，就不能信任。我们需要能够在不依赖模型来证明的情况下，重现结果是如何实现的。可验证性：我们需要持续测试整个系统，包括故障、攻击、边缘案例、系统变更等，而不仅仅是成功的任务。独立控制：组织应能够独立决定模型可以访问什么以及可以采取哪些行动。独立审计性：验证必须独立于被验证的智能。没有任何单一模型应同时控制系统的行为以及判断该行为是否与原始意图一致所需的证据。遏制： 我们必须假设模型已被破坏，并从一开始就将其控制。可以把它想象成紧急刹车。授权人员应始终能够在任务中暂停或关闭模型。更先进的模型将需要更先进的遏制技术，我们需要对此进行标准化。事件披露：当这些系统出现故障或被攻破时，我们需要及时向受影响者披露信息，并建立机制分享出错原因、哪些控制失效以及如何防止再次发生，并向整个行业分享经验。这应包括在运行时改变智能体行为的实现细节。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/011/545.htm", "publishedAt": "2026-10-10T23:19:46+00:00"}, {"title": "亚马逊云科技向姚明发起的姚基金捐赠 100 万美元现金及云 + AI 资源，目标培养 AI + 体育复合型人才", "summary": "IT之家 10 月 11 日消息，亚马逊云科技 10 月 10 日宣布与北京姚基金公益基金会（以下简称“姚基金”）共同推出“云上篮图”体育 × 科技育人计划。该公益计划依托姚基金覆盖全国的学校网络、体育人才培养经验，同时借助亚马逊云科技 Breaking Barriers 全球创新活动，以及云与 AI 技术、由资深解决方案架构师组成的导师团队和培训与认证学习资源，旨在培养更多兼备 AI 素养与体育专业能力的复合型人才，赋能中国体育行业在 AI 时代快速发展。本次计划中，亚马逊云科技将投入 100 万美元（IT之家注：现汇率约合 670.6 万元人民币）现金捐赠及云与 AI 技术资源，一方面支持 Breaking Barriers 在中国的落地，涵盖高校专业人才培训、黑客松实战演练以及成果部署应用三个阶段，另一方面支持姚基金篮球季的开展，为姚基金覆盖的学校提供体育教学、训练与赛事支持。在“云上篮图”体育 × 科技育人计划中，亚马逊云科技首次将 Breaking Barriers 引入中国，支持体育 AI 人才的培养，推动 AI 教学工具在基层体育教学中的实际应用。在专业人才培训阶段，亚马逊云科技将联合姚基金，支持 10 所体育类或技术类院校开展培训。亚马逊云科技将提供业界领先的云和 AI 学习资源，并组建由资深解决方案架构师构成的导师团队，通过工作坊、面对面技术指导以及技能认证支持，帮助学生系统掌握生成式 AI 与数据科学的核心技能。在黑客松实战演练阶段，前期参与培训的高校学生将化身“构建者”，围绕来自一线基层体育教学的真实挑战打造 AI 教学工具，例如结合学生体质特征与有限设施、自动生成个性化训练计划的 AI 教学助手。在成果部署应用阶段，亚马逊云科技将进一步优化黑客松中孵化出的优秀 AI 教学工具，并在姚基金所覆盖的 100 所基层学校中开展试点，为基层体育教师提供个性化训练指导和智能化教学支持。同时，亚马逊云科技还将支持“姚基金篮球季”的开展，在姚基金支持的学校中提供篮球教育与学习训练，并支持学生参加全国联赛，以此推动基层篮球运动发展，助力基层青少年乐享体育运动、促进身心健康发展。IT之家注：姚基金是由姚明于 2008 年在中国青少年发展基金会架构下发起，于 2018 年在北京市民政局注册，本着“助人自助，以体育人”的宗旨，致力于助学兴教，促进青少年健康发展的公益组织。姚基金通过支持青少年发展项目和搭建公益平台，让更多的人关注欠发达地区青少年，帮助他们在教育、体育运动、心理等多个方面的全面发展。姚基金主要项目包括姚基金篮球季、姚基金慈善赛等。截至 2025 年底，姚基金公益项目已累计覆盖全国 30 个省份 550 余个县（市、区）的 6700 余所乡村学校，派出 9200 余人次志愿者支教，培训 1600 余名乡村专、兼职体育教师。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/011/542.htm", "publishedAt": "2026-10-10T22:53:49+00:00"}, {"title": "消息称英伟达洽谈收购 / 追加投资 Reflection AI，加码开源模型", "summary": "IT之家 10 月 11 日消息，据金融时报消息，知情人士透露，英伟达正就收购美国初创公司 Reflection AI 或向其追加投资展开深入谈判。Reflection AI 专注于开发开放权重模型，于当地时间 10 月 5 日发布旗下首款开放权重 AI 模型 Beam。知情人士补充称，目前的谈判尚处初期阶段，潜在交易可能采取多种形式 —— 包括所谓“人才兼并”模式。在这一架构下，英伟达将吸纳其核心团队并获取技术授权，从而绕开全面并购通常伴随的漫长反垄断审查。英伟达目前已是 Reflection 的主要股东之一，也可能选择通过新一轮股权投资，或以提供更多芯片与算力资源的合作方案，进一步加深与该公司的绑定。英伟达此前已向 Reflection 注资 8 亿美元（IT之家注：现汇率约合 53.65 亿元人民币）。据多位知情人士透露，双方有望在未来几周内敲定方案，但各方也强调谈判仍存在破裂的可能。目前具体的交易条款尚未明确，但在今年 3 月的上一轮融资中，Reflection 的估值已达 250 亿美元（现汇率约合 1,676.62 亿元人民币）。英伟达与 Reflection 双方均对此置评请求表示拒绝。面对监管机构对 AI 领域并购的严格反垄断审视，“人才兼并”正日益成为大型科技公司的首选策略。去年 12 月，英伟达在涉及芯片设计公司 Groq 的 200 亿美元（现汇率约合 1,341.29 亿元人民币）交易中就采用了类似架构；该交易本周也刚刚引发了未获吸纳的 Groq 原员工的法律诉讼。英伟达在过去两年开启了激进的投资扩张，旨在提振整体 AI 产业生态，并巩固自身处于该算力经济核心的统治地位。尽管英伟达旗下已推出名为 Nemotron 的开放权重 AI 模型家族，但其自身仍缺少自主研发的顶尖前沿大模型。今年 7 月，英伟达首席执行官黄仁勋带头呼吁建立美国本土的开放权重“生态体系”，强调这对于“在全美范围内激发创新活力与繁荣机遇”至关重要。今年 9 月，这家市值达 5.5 万亿美元（现汇率约合 36.89 万亿元人民币）的科技巨头又以近 130 亿美元（现汇率约合 871.84 亿元人民币）将开源模型与数据集托管平台 Hugging Face 收入囊中。英伟达已向 OpenAI 等头部大模型实验室、Nebius 等新兴 GPU 云厂商以及众多中小型团队累计输送了数百亿美元资金。这些投资反向进一步推高了市场对其 AI 芯片的需求 —— 对于任何构建或运行大模型的企业而言，这些芯片始终是决定算力命脉的关键核心物资。相关阅读：《叫板 DeepSeek、Kimi，英伟达投资的 Reflection AI 发布旗下首款开放权重 AI 模型 Beam》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/011/541.htm", "publishedAt": "2026-10-10T22:46:30+00:00"}, {"title": "模型开放之后，AI能力为什么仍难以复用？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/rKRPT18fGxtjipPAeaLa?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-10T17:10:50+00:00"}, {"title": "比 Astra 还贵！GPT-6.1 Sol 极速版上线，社区吐槽：“500 美元套餐都撑不过一天”", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/soBOt9TSckGlJlBS519y?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-10T13:15:26+00:00"}, {"title": "智己 LS8 NEO 纯电官宣“马上见”：全线控大五座旗舰 SUV，全系标配宁德时代电池", "summary": "IT之家 10 月 10 日消息，智己汽车今日宣布，智己 LS8 NEO 纯电“马上见”，全线控大五座旗舰 SUV，全系标配宁德时代电池，全系标配全线控灵蜥底盘。IT之家注意到，智己 LS8 中大型增程 SUV 于今年 4 月上市，五座版本售价为 24.98 万元起，六座版本售价为 26.98 万元起。作为参考，智己 LS8 增程版搭载 27.1 英寸 5K 驾舱屏与 15.6 英寸 3K 副驾娱乐屏的组合，并内置 IM AIOS 智能座舱系统。该系统整合千问大模型与 AIOS 智舱系统，支持 IM Ultra Agent 智能体功能，可实现更自然的语义理解与任务执行。同时，智己 LS8 在辅助驾驶硬件层面标配 520 线超视域激光雷达及英伟达 Thor 芯片。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/011/499.htm", "publishedAt": "2026-10-10T11:58:53+00:00"}, {"title": "被字节索赔 800 万的实习生“出道”：20 万符号造 AI 词典，打造世界模型创业公司估值 2 亿美元", "summary": "打进字节训练集群、污染同事的模型训练，然后被辞退、被索赔 800 万、被法院判赔 50 万——两年后，同一个人的新实验室拿到近 3000 万美元融资，投后估值 2 亿美元。彭博社 10 月 8 日报道了这个名字：田柯宇，前字节跳动实习研究员，北大在读。他创办的这家还没有名字、也没有产品的隐身公司，押注的是世界模型。 把时间...", "sourceName": "开源中国", "sourceUrl": eme（金鱼 Scheme） 是一款致力于“像 Python 一样实用易用，同时保持 Lisp 优雅”的现代化 Scheme 解释器。基于轻量高效的 S7 Scheme 引擎打造，具备 R7RS 兼容、轻量快速、安装包不到 5MB 以及 AI Coding 友好等特性。 近期，Goldfish Scheme 迎来了连续 8 个版本（v18.11.31 至 v18.11.39）的高密度演进与...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502885", "publishedAt": "2026-10-08T06:09:28+00:00"}]}, {"label": "论文研究", "items": [{"title": "因违反生成式 AI 使用规定：清华大学徐宁博士被撤销尼康 2026 显微视频竞赛冠军资格", "summary": "IT之家 10 月 10 日消息，综合 BBC 报道，尼康宣布原本获得 2026 年 Small World in Motion 显微视频竞赛一等奖的作品因“不符合赛事关于生成式 AI 的相关规定”，因此取消其获奖资格。根据更新后的比赛排名，越南参赛者阮南日（Nguyen Nam Nhat）的作品现已升至第一名。IT之家获悉，原获奖视频由来自中国清华大学的徐宁博士（Dr. Ning Xu）提交，相应视频号称采用超分辨率显微成像技术，展示了一名原发性纤毛运动障碍（PCD）患儿呼吸道内纤毛的异常运动。然而后续多名显微成像及纤毛研究领域的专家在社交平台提出质疑，认为视频中的结构与真实 PCD 样本并不吻合。视频中部分紫色结构会突然出现或消失，一些绿色纤毛看起来像是凭空出现，相关结构的尺寸也与已知生物结构不符。面对质疑，徐宁博士承认在视频制作过程中使用了 AI 技术。他解释称，AI 被用于区分和可视化原始灰度显微图像中的特征，并且此前认为相关做法符合比赛规则。不过，他否认使用 AI 生成实验视频本身、纤毛结构或纤毛运动。尼康在重新调查后，最终认定徐宁的作品不符合比赛有关生成式 AI 的规则，决定撤销其冠军资格。随着徐宁博士的作品被取消资格，原本排名第二、来自越南的阮南日如今成为 2026 年 Nikon Small World in Motion 冠军。他的作品记录了一条微小线虫与单细胞生物 Dileptus 在显微世界中的互动，其他入围作品的名次也随之顺延。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/011/504.htm", "publishedAt": "2026-10-10T12:33:49+00:00"}, {"title": "我国食品安全法修订草案公开征求意见，涉及 AI 监管、校园食品安全等", "summary": "IT之家 10 月 10 日消息，据央视新闻报道，市场监管总局研究起草了《中华人民共和国食品安全法（修订草案征求意见稿）》，并向社会公开征求意见。修订的主要内容包括五个方面，IT之家附如下：一是强化智慧监管。推动“互联网 + 人工智能”监管应用，明确食品生产经营企业应当在食品生产经营关键风险环节安装监控设备，并将实时监控视频信息接入县级以上地方人民政府市场监督管理部门信息系统；赋予监管部门物联网监控、视频巡查等非现场检查权限。二是压实主体责任。规定食品生产经营企业、网络食品交易平台经营者应当按照规定配备食品安全总监、食品安全员，明确岗位职责，加强培训考核；要求食品生产企业建立食品生产过程控制记录制度；设立邮政快递企业实名收寄、收寄验视、过机安检制度；规范委托生产行为，明确委托方、受托方资质条件。三是加强重点领域监管。增设“学校食品安全”专节，确立校长（园长）负责制，建立中小学、幼儿园集中用餐陪餐制度；增设“网络食品经营”专节，实行分级备案管理，明确平台、直播间运营者、直播营销人员等各方主体责任；明确跨境电商企业承担跨境电商进口食品、食品添加剂、食品相关产品安全主体责任。四是优化食品安全管理制度。将食品安全风险监测范围拓展至食品添加剂、食品相关产品；将婴幼儿辅助食品纳入特殊食品监管，实施备案管理；规范食品标签与商业宣传，严禁虚假误导；严格食品检验管理，规范委托检验行为。五是完善法律责任体系。按违法类型分类设定差异化处罚幅度；严格落实“处罚到人”，对故意违法、性质恶劣、违法行为造成严重后果的责任人员实施处罚；补全新增义务对应的处罚条款，提高违法成本；实行食品安全信用管理制度，实施跨部门失信惩戒。下一步，市场监管总局将根据公开征求意见反馈情况完善修订草案，并推动《中华人民共和国食品安全法》尽快修改出台，为规范食品生产经营活动、防范化解风险、强化监管执法提供坚实的法治保障。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/011/500.htm", "publishedAt": "2026-10-10T12:03:26+00:00"}, {"title": "Claude 动态多 Agent 工作流开始公测，支持庞大的工作负载", "summary": "Claude 官方把动态多智能体工作流放进公开测试版了。Claude Managed Agents dynamic workflows，ClaudeDevs 的说法是一种新型多智能体编排，『为最庞大的工作负载而生』——一个主 agent 写计划，计划跨多个 agent 分阶段运行，最后合并结果。 最能说明它价值的是那个冷冰冰的对比实验。官方在一条 116k 行的代码库里埋了...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502951", "publishedAt": "2026-10-10T10:21:36+00:00"}, {"title": "Codex 和 Claude Code 都跑偏了，前 OpenAI 研究员称 Jev 出现前 AI 世界是个悲剧", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/e0iQfJNgepz7VigRdD61?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-09T17:39:38+00:00"}, {"title": "《柳叶刀》研究表明：AI 有望改善医患关系", "summary": "Google 研究成果首次登上《柳叶刀》主刊", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/10/502359.html", "publishedAt": "2026-10-09T06:28:55+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "腾讯元器将于 11 月 9 日停止服务，所创建智能体将不再可用", "summary": "IT之家 10 月 10 日消息，腾讯元器 10 月 8 日发布《关于元器平台停止服务通知》，因业务调整，元器平台将于 2026 年 11 月 9 日停止服务。在正式停止服务前，用户仍可正常登录并使用现有智能体；停服生效后，所创建智能体将不再可用，建议用户尽快完成数据导出与业务迁移。从 2026 年 10 月 29 日起，停止创建新的智能体、API key 分发功能。现有存量智能体在正式停止服务前，仍可继续正常使用。正式停止服务时间： 2026 年 11 月 9 日。届时，元器平台将关闭应用访问、数据读写、API 调用、控制台使用等所有面向公众的服务，元器平台将不支持用户访问，元器智能体页面将不支持显示。通过元器平台发布到其他渠道（包括公众号、服务号、微信客服等）的智能体将不支持响应用户对话。自公告发布期至产品停服，用户可通过元器平台的导出工具，将智能体配置、工作流、对话记录等数据备份至本地，除此之外，为便于用户完成数据导出相关事宜办理，将为用户设置一段数据保留过渡期，过渡期截至【2027 年 1 月 9 日】。具体安排如下：停服前（即日起至 2026 年 11 月 9 日）：元器平台数据导出功能可正常使用，用户可随时导出并下载备份；停服后（ 2026 年 11 月 9 日至 2027 年 1 月 9 日）：平台功能停止使用，用户仍可登录元器数据导出控制台下载备份数据；数据删除：2027 年 1 月 9 日起，除法律法规规定须留存的日志等记录外，平台将依法删除全部用户数据，请用户在此前完成备份。IT之家注意到，在 2024 年 5 月 17 日举办的腾讯云生成式 AI 产业应用峰会上，腾讯发布了新推出的智能体产品“腾讯元器”，腾讯称之为“一站式智能体创造与分发平台”。据腾讯官方介绍，腾讯元器有如下特点：具有智能体商店：可以在商店中选择并使用自己需要的智能体，以满足不同的需求低门槛创建智能体：通过提示词、插件、工作流、AI 辅助创建等能力，无需代码，低门槛创建智能体丰富的插件与知识库：预集成腾讯生态特色插件、知识库资源，将开放第三方能力，为创作者提供开箱即用的工具。腾讯全域分发：率先支持腾讯全域分发渠道，如 QQ、微信客服、腾讯云、搜索等。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/011/530.htm", "publishedAt": "2026-10-10T14:42:35+00:00"}, {"title": "10 秒视频很惊艳，为什么 AI 做一部短剧还是这么难？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/8g9tlaqJFUPrb4oGO00A?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-10T14:24:52+00:00"}, {"title": "企业AI 走向生产环境，如何避免新一轮技术锁定", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/kPhRafpM3Wr6umvUBPQV?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-10T13:08:22+00:00"}, {"title": "OpenAI 高管亲述：我们是怎么在一周内做出 Jev 竞品的", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/IRqoPz4cNONlNFBolD9V?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-09T17:24:31+00:00"}, {"title": "陶哲轩转发抵制声明，数学界和OpenAI彻底撕破脸", "summary": "数学家该怎么证明自己真的不需要 AI#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1683401?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-10-09T10:21:04+00:00"}, {"title": "记录创作历史， 而不只是代码历史 —— Libra，面向 Agent 的 AI 原生扩展版本控制系统", "summary": "Libra 是一款 AI 原生、兼容 Git 的版本控制系统，它还会记录工作是如何完成的——并把这份记忆保存在你的仓库里。", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/p/libra-vcs", "publishedAt": "2026-10-08T06:58:26+00:00"}, {"title": "KnowForge 2026.0.8 发布：协作写作、团队空间、AI 朗读，这次更新有点大", "summary": "KnowForge 2026.0.8 正式发布。 这次更新主要围绕 团队协作、阅读体验、内容管理和站点运维 进行了增强，同时修复了一批采集、翻译和交互问题。 本次更新亮点 多人协作写作 写作台现在支持更完整的多人协作： 显示正在编辑的协作者 多人同时修改时自动检测并合并冲突 新增正文批注与 @ 提及 新增「建议者」角色与修改建议...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502870", "publishedAt": "2026-10-08T01:33:24+00:00"}]}]};

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
