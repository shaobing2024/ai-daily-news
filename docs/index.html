生效，高峰时段价格翻倍》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/993/095.htm", "publishedAt": "2026-08-22T12:51:37+00:00"}, {"title": "雷鸟 iO AI 眼镜体验：全天智记是亮点，堪比随身助理", "summary": "眼下 AI 眼镜绝对是智能穿戴设备里炙手可热的赛道。IDC 预测，2026 年全球 AI 眼镜出货量将突破 2300 万台，中国市场增速更为突出，预计同比增长 77.7%。在国内，包括华为、小米、阿里、字节、理想等几乎所有大厂都在挤入这个市场。而在智能眼镜市场，雷鸟创新显然是老玩家了，目前也已经形成了包括旗舰独立计算 AR 眼镜 X 系列、AI 拍摄智能眼镜 V 系列、高端 AR 观影眼镜 GT 系列、分体式入门观影 AR 眼镜 Air 系列等不同定位的丰富产品矩阵。而就在 8 月 21 日，雷鸟创新又发布了面向 AI 场景的新系列“雷鸟 iO”，这款眼镜定位是首款“人类增强 AI 眼镜”，旨在让 AI 真正融入人的视野、感知和行动之中，成为每个人随身的智能增强伙伴。而现在，IT之家已经提前拿到了这款雷鸟 iO AI 眼镜，也使用了一段时间。今天就和大家一起分享一下它的实际体验到底怎么样。一、外观设计雷鸟 iO AI 眼镜的包装整体看起来是偏高端、精致的，包装盒外观很简洁，主体是银灰色，正面能看到烫印的亮银色“RayNeo”字样和 Logo，以及一个矩形的视窗设计，视窗延展到侧面，还有 RayNeo iO AI Glasses 的产品名称字样。整体设计很克制。打开包装盒后，眼镜被放在一个专门的皮质眼镜盒里，下层则是各种配件，包括说明书和保修卡、眼镜清洁布、螺丝刀、镜腿硅胶套、眼镜充电夹、鼻托套装。每个配件都有单独的纸盒小包装，增加了品质感。上手雷鸟 iO AI 眼镜，你第一时间可能会有点恍惚：这真的是智能眼镜吗？如果不是镜腿末端的功能模块，你可能会以为这就是一款正常的时尚眼镜了，因为它确实做到了尽可能的纤巧。带显示的智能眼镜，光引擎尺寸决定了前框的观感 —— 光机越大，镜桩就必须越鼓，“这是智能眼镜”一眼就能看出来。而光波导的纯净度决定了佩戴者本身的舒适感。雷鸟 iO AI 眼镜采用的全新萤火光引擎 Nano 体积仅 0.085 立方厘米，约等于一粒红豆大小。同时全新蓝湖光波导厚度不足 0.6 mm，重量仅 3 克，OC 区域透过率达到 93%，非显示区透过率更是高达 98% 以上，无论开机还是关机，整体观感接近普通光学镜片，这些都让雷鸟 iO AI 眼镜整体看上去确实摆脱了过去智能眼镜的厚重感和怪异感。设计上，雷鸟 iO AI 眼镜的前框采用经典皇冠框型，能够适配多种不同的脸型。根据官方介绍，前框为 AZ91D 镁铝合金材质，边缘平均宽度 2.25 mm。外倾 5 度桩头贴合不同面部轮廓，标配两套可替换鼻托兼顾不同鼻型，并配备特制镜脚硅胶套。雷鸟 iO 拥有极夜、沙丘两款配色，IT之家拿到的这款是极夜配色，属于一种磨砂质感的黑色。右镜腿的顶部有一枚 Smart Crown 旋钮，这款眼镜的核心操作交互都是通过旋钮来进行的，同时也支持头势交互，通过点头、摇头在公共场景快捷确认弹出的提醒等。镜腿的中间部分为航天级钛合金，由 β 钛 15333 与 TC4 构成双层结构，很薄，官方称最薄处仅为 1.15 mm。而其他的元器件都集成在两个镜腿的尾部，这样可以实现前后平衡配重，也不影响佩戴。雷鸟 iO AI 眼镜官标重量为 34 克，确实是十分轻巧了，加上前后平衡的配重设计，让雷鸟 iO 即便长时间佩戴也不会感到鼻子或者耳朵有明显的负重感，加上可替换的鼻托和镜脚硅胶套带来的亲肤触感，佩戴的舒适感也是能够让人满意的。除了眼镜，IT之家还收到了雷鸟 iO 配套的充电盒，2000 mAh 电池，可以给 iO 完整充电 5 次，将眼镜放入盒中就可以自动为眼镜充电。这款充电盒为绒面皮革和半透明塑料的拼接设计，盒子本身通过外侧的 USB Type-C 接口充电。盒子的整体设计和用料都有着满满的高档质感。总体来说，雷鸟 iO AI 眼镜采用简洁偏商务的设计风格，造型棱线分明，同时最大的看点是轻巧、平衡，无论是颜值还是日常佩戴的舒适感都属上乘。二、基础使用体验初次使用雷鸟 iO AI 眼镜，需要在手机上通过《雷鸟 AI 眼镜》App 和设备进行连接，配合 App 使用。连接成功后就能看到眼镜的主界面了。雷鸟 iO 的光机是萤火光引擎 Nano，可以实现等效 33 英寸屏幕，屏幕亮度则可以达到 1800 nits，所以即便是现在这样的夏天户外，也能够清楚看清屏幕内容。显示效果方面，雷鸟 iO 的蓝湖波导采用全新三层光学结构，内部遍布多层微纳纹路，色差指数可以达到行业最高的 ΔE 2.52，有效解决镜片显示区域彩虹纹、偏色等问题。另外之前的智能眼镜使用时在对面的人会看到镜片上有一块泛绿的显示区域，影响观感。这个和镜片的通透率有关，雷鸟 iO 的这块区域通透率达到 93%，非显示区透过率更是高达 98% 以上，所以当你戴着它使用时，旁边的人就基本不会看到镜片上会有泛绿的区域了，就跟普通的眼镜片没什么区别。使用时，主要通过右镜腿的旋钮进行操作，息屏时按一下旋钮就能点亮屏幕，旋转旋钮可以浏览看板组件。在看板中按下旋钮可以进入应用列表，旋转选择应用，按下则可打开应用。长按旋钮就能返回看板。另外雷鸟 iO 还支持抬头显示，在息屏状态下，抬头就可以唤醒屏幕，查看看板。大家也可以在 App 中设置抬头唤醒屏幕的角度。三、全天智记雷鸟 iO AI 眼镜的一个重要看点就是首创全天智记功能。相信很多人都有感受，就是一天里的重要信息往往不会在你准备好记录的时候出现，比如在电梯里领导随口给安排了一个临时任务，对项目提出了一个新要求，或者在吃饭的时候客户透露了预算的变化等等，这种突如其来的“待办事项”还是比较多的，有时候忙起来你可能转头就给忘了。雷鸟 iO 的全天智记就是针对这个痛点打造的功能，它能够以极低功耗持续运行，持续采集语音信息并转写为文字，再进行识别、总结和记忆，帮你记住每天值得关注和列入待办的事项，你不需要判断什么时候该按录音键，因为它一直都在。具体来说，传统大模型和智能设备只能处理数字世界里规整、人工主动输入的内容，依靠碎片化对话形成临时记忆，普遍存在记忆断裂、跟不上真实场景的问题。而雷鸟 iO 的全天智记搭载全天候记忆引擎，能够跳出这个局限，其核心是读懂物理世界大规模、不连续、非结构化的真实场景数据，通过对声音、位置等信息的处理，将记忆转化为情景、语义、行为等多种类型。这套全天候记忆引擎能够持续整理、理解和检索全天产生的不连续信息，让 AI 眼镜具备更连贯的长期记忆能力。比如在实际使用中，IT之家开启了全天智记的功能，雷鸟 iO 就在默默记录我周围的语音内容。比如我在聊天的时候说到要在 8 月 14 日前完成一篇关于智能汽车的文章，雷鸟 iO 就默默记下了，然后在大概两个小时后，当我再次点亮眼镜屏幕时，雷鸟 iO 就主动给我推送了一个弹窗，提醒我 8 月 14 日前要完成一篇智能汽车相关的文章，并询问是否将其列为待办事项。当时小编没有立即选择将其列为待办，大概一天后，这条事项自动列入了看板中的待办列表里。再比如后来有一天的聊天中，小编谈到 8 月 20 日要去药店选药的事情，雷鸟 iO 也帮我记了下来，然后在眼镜中弹窗提醒。用了一天后，《雷鸟 AI 眼镜》App 端就能够主动给我推送全天的内容总结。比如在 8 月 13 日这天，它总结我“聊了一整天，稿子一个字没写”，然后整理出当天的高光时刻，重点是准确提取出了当天聊天过程中涉及的待办事项，包括 9 月 2 日的活动、8 月 28 日小排畸以及 GTA 6 预告片。而如果你想要回顾具体这一天的内容，则可以在“日记”栏目中查看，这里更加详细地整理了当天每个时间段你做了哪些事情。小编看了一下，整体还是比较准确的，重点的信息也都提炼了出来。当全天智记使用一段时间后，记录内容会逐渐沉淀。用户可以通过雷鸟 iO 内置的 AI 助手回顾某一天的对话细节，双击旋钮或喊“小雷小雷”即可唤醒。例如，小编在一段时间后询问此前相亲时聊过的内容，雷鸟 iO 能调用历史记录并给出回答。再比如询问前一天与他人讨论 AI 行业时说过什么，眼镜也能调取相关记忆并进行总结；进一步追问当时提到的某个人从事什么工作，系统同样能够找到对应信息。四、日常实用功能体验除了全天智记，翻译、提词、录音转写也是智能眼镜的经典场景，而雷鸟 iO 针对其中每一项基础功能都用 AI 做了优化和重做。1、AI 实时翻译比如在实时翻译方面，如果经常需要与外国人交流洽谈，就可以佩戴雷鸟 iO 与对方进行沟通，它能够实时将对方的语言翻译过来，并以字幕的形式显示在眼镜画面中。具体来说，其搭载技术合作伙伴时空壶的 BabelOS 3.0 智能翻译引擎，AI 大模型全程驱动，先理解语义再生成译文，配合语义断句与润色纠错，支持 55 种语言 / 109 种口音。实际测试时，小编选择一段商务英语线上会议的音频，让雷鸟 iO 进行实时翻译。通过下面的视频可以看到，雷鸟 iO 确实能将英语对话的内容实时翻译成字幕显示在眼镜屏幕上。并且翻译的准确度还是比较高的，我能够直接通过字幕，了解这段英语线上会议讲了什么、谁说了什么。同时，翻译的时延也是比较短的，这一句说完后，大概 1 秒左右我就能看到它的翻译结果，不会出现跟不上对方说话节奏的情况。当然，现实中和外国人对话的场景可能不会都这么安静，比如在海外展会采访外国人等，因此翻译过程中的降噪效果也很重要。接下来小编又找了一段英语线上会议的外放音频，让雷鸟 iO 进行翻译，与此同时小编还在周围模拟播放了展会现场的噪音。从上面的视频能看到，小编播放的噪音还是比较大的，但是对雷鸟 iO 来说，几乎没有什么影响，它依然能够准确识别会议的声音，然后进行翻译，翻译的结果仍然是比较准确的，时延也没有受到影响。2、AI 全自动提词器除了 AI 实时翻译，雷鸟 iO 对提词器功能也进行了重做。用过传统提词器的朋友相信都了解它的痛点，提词器需要手动翻页，讲快了有时候提词器很容易跟不上，重点是一边演讲还得一边想着让提词器跟着自己的节奏来，容易分心。而雷鸟 iO 的 AI 全自动提词器，能够通过 AI 语音识别自动判断讲到哪一句，实时滚动跟随，这样眼神就能保持自然和听众交流。小编在测试的时候，可以看到眼镜画面中的提词器文本会根据你讲到的内容进行变色显示，我讲过的内容，文字就会变成浅绿色，这样讲到哪里，一目了然。这一页快要讲完了，提词器就会提前一行滚动翻页，不会出现提词器跟不上的情况。在内置骨传导传感器的加持下，雷鸟 iO 对我演讲内容的识别还是非常精准的，讲到哪里它就能跟到哪里，而且骨传导传感器不会受到外界噪音的干扰，这让我可以放心自然地进行演讲或者表达。3、AI 录音转写功能录音转写也是智能眼镜的一个高频使用场景，特别是对于小编这样的工作者来说，日常开会、参加发布会、采访或多人群访，太需要一款轻巧便携、能准确录音并转写的设备了。而雷鸟 iO 在这方面的一大看点是搭载了前面说的骨传导麦克风，它能够拾取佩戴者声带振动，不受环境噪声干扰。配合镜腿上 4 颗空气传导麦克风阵列的波束成形算法，能在多人场景中精准区分不同说话人。在实际体验测试中，小编模拟了两个方向的声源，其中一个是自己说话的声音，然后让雷鸟 iO 进行录音。从测试结果来看，雷鸟 iO 确实能准确识别出不同说话人的声音，而且能判别出哪个是我说的，哪个是其他人说的。当然，这些内容都可以在录音结束后，通过《雷鸟 AI 眼镜》App 进行查看。值得一提的是，AI 对录音内容的转写和总结做得很细致。首先，转写的原文自然流畅，语义通顺，各种专业名词都能准确识别出来，小编看了一下，基本上没有明显错误的地方。其次，AI 总结的内容也比较详细，有录音内容的摘要提炼，提炼出的要点也比较精确，AI 还会根据自己对内容的理解给出重点标记。此外，在总结中还有关键发言人金句，甚至还能给出思维导图，堪比专业的会议助理。同时雷鸟 iO 录音还有多种 AI 总结模板可选，根据对用户的了解，它能够以不同角度对交谈作出 AI 总结。比如如果是面试模板，AI 会根据用户是面试官，还是应聘者，进行区分和总结。官方表示后续还将上线关键词模式，进一步让对话式访谈不打断自由节奏。4、AI 实时提示另外比较有意思的是，雷鸟 iO 还支持 AI 实时提示的功能，开启这个功能后，AI 会进入问题模式，实时捕捉对话中出现的疑问句，只要识别到提问，眼镜上就能即时显示答案。这个功能很适合一些需要“高情商回答”的场合来避免尴尬，比如在约会时，如果对方问了一些你不太擅长回答的问题，AI 就能帮你现场救场。再比如访谈中，如果临时遇到了一些没有准备的问题，AI 也能捕捉到，给出一些高情商的回答，避免卡壳。看到上面这些功能体验和介绍，很多朋友首先可能会想到隐私安全的问题。这一点大家也不用担心，雷鸟构建了从基座到顶层的四层隐私安全体系。首先在基座层，隐私保护从产品定义阶段就被写入架构。比如全天智记产生的语音数据，在设备本地完成不可逆脱敏后才上传云端进行 AI 处理。传输全程 TLS 1.3 加密，存储使用 AES-256，密钥定期自动轮换，这是银行也在使用的金融级加密方式。关键隐私数据默认在眼镜端侧处理，只有当你明确同意后才会同步到私有云空间。所有日志在输出前必须脱敏处理，官方称连工程师排查问题时也看不到你的真实数据。其次在状态感知层面，比如隐私指示灯和硬件绑定，与录音、翻译模块物理连接，功能开启时灯亮、关闭时灯灭，软件无法绕过。此外官方表示后续还会通过 OTA 带来物理围栏和实时状态功能。接着是用户数据的主权，数据位置、权限、去向都可以由用户决定。最后是企业级合规，雷鸟信息安全管理体系已通过 ISO 27001、ISO 27701 认证，并覆盖 GDPR、CE、FCC 等合规要求。5、续航体验最后在续航方面，雷鸟 iO 搭载了 240 mAh 钢壳电池，官方表示全新封装的钢壳电池技术在大幅提升结构强度的同时带来更高能量密度。在实际测试中，小编从某天上午 10:44 开始使用眼镜，中间进行各种录音、实时翻译等功能的测试，AI 全天智记也开启，中等强度使用到当天的 23:46，剩余电量 76%，大约 13 小时的时间耗电 24%，按此推算，雷鸟 iO 正常使用强度下坚持两天不成问题。要知道，这可是全天智记一直开启的情况下，可见雷鸟 iO 的续航能力还是十分给力的。对于一款智能眼镜来说，是需要长期佩戴和实时使用的，续航是一个很影响体验的问题，雷鸟 iO 显然能够满足绝大部分用户对续航的需求。结语经过这段时间的使用体验，雷鸟 iO 给小编留下的整体印象是“轻便无感，实用可靠”。34 克的极致轻量化，与平衡配重让长时间佩戴没有负担，显示通透、操作直观。同时全天智记是它区别于其他智能眼镜的一大优势点，让雷鸟 iO 真正能够成为随时随地如影随形的贴身助理。此外实时翻译、自动提词、录音转写等基本功能在 AI 加持下也都实打实解决了记录、沟通和表达中的具体问题，隐私与续航同样没有明显短板。当然，它的短板也很明显，比如没有摄像头，做不了多模态交互，目前 AI 的调用也需要与手机 App 配合，短期内更像高效的智能助手而非独立计算终端。但这恰恰是雷鸟 iO 的聪明之处，它不试图用一块屏幕把人困在数字世界，而是以无感的信息呈现和全天候的智能交互，把数字能力悄悄织进真实生活。小编觉得，这才是 AI 眼镜当下比较务实的产品定位：不是替代手机，而是成为每个人随身的智能增强伙伴。如果你是经常开会、采访、跨语言沟通的商务人士和媒体从业者，或是希望重要信息被“默默记住”的忙碌人群，雷鸟 iO 值得认真考虑。京东雷鸟 iO AI 眼镜智能眼镜 2648 元直达链接", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/993/065.htm", "publishedAt": "2026-08-22T10:20:28+00:00"}, {"title": "从模型到生产力：星海图与产业朋友圈共探具身智能的下一站", "summary": "让具身智能技术真正落地千行万业。", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/476930.html", "publishedAt": "2026-08-22T08:41:41+00:00"}, {"title": "DeepSeek 发布多模态模型，“小鲸鱼”长出了眼睛", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/jlTfe57D4r0Juzpz8Fk5?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-21T19:34:36+00:00"}, {"title": "本地运行、支持视觉与工具调用：Meta 开源智能体模型", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/aGfkSN1YlmLrUQMPea9L?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-21T17:00:00+00:00"}, {"title": "不跟风、不堆模型，百度靠什么突围AI办公赛道？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/9x1ohAMlMpMCLdygg8Yf?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-21T16:47:55+00:00"}, {"title": "开源连接器网关 OpenConnector：让 AI Agent 安全调用 1000+ SaaS 服务", "summary": "Open-Connector 是一个面向 AI Agent 和应用开发者的开源连接器网关。项目旨在解决 AI Agent 接入外部 SaaS 服务时普遍存在的认证管理、权限控制、接口适配和运行审计等问题。 OpenConnector 可以将用户已经使用的应用账号连接到统一运行时，并向 Agent 暴露标准化的 Actions。项目目前提供覆盖 GitHub、Gmail、Notion、...", "sourceName": "开源中国", "sourceUrl": "https://www const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
