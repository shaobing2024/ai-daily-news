const DATA = {"date": "2026-07-30", "generatedAt": "2026-07-30T02:11:49Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "轻量化异构双臂 x VLA/世界模型：家庭服务具身机器人的落地实践｜AICon深圳", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/SZaGmZI0g7INLtxalmvi?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-30T10:00:00+00:00"}, {"title": "微软 2026 财年第四财季业绩会实录：算力供给依然不足，Copilot 变现渠道丰富", "summary": "微软的云业务创四年来最快增长，表明这家科技巨头的计算基础设施和人工智能服务继续获得企业客户青睐。微软 2026 财年（2025 年 7 月 1 日～2026 年 6 月 30 日）年报及第四财季（2026 年 4 月 1 日～2026 年 6 月 30 日）财报发布后，微软 CEO 萨提亚 · 纳德拉（Satya Nadella）和执行副总裁兼 CFO 艾米 · 胡德（Amy Hood）等公司高管出席了随后举行的财报电话会议，解读财报要点，并回答分析师提问。以下为本次电话会议分析师问答环节的主要内容：瑞银分析师卡尔 · 基尔斯泰德（Karl Keirstead）：好的，非常感谢萨提亚。我先抛开财报数字，想请您花一点时间详细阐述您开场发言里提到的模型选型以及企业知识产权保护相关内容。我分两个问题提问：第一，考虑到很多企业初期对开源模型心存顾虑，未来一到两年，开源模型、定制化模型能获得多大的实际业务增量？第二，微软自身也在前沿大模型实验室有大规模投入，行业向这类模型切换，微软具体能从中获得哪些收益？非常感谢。纳德拉：谢谢你，卡尔。我们看待这件事的思路是，归根结底，企业的目标是自主掌控自身发展命脉，也就是我所说的搭建企业自身的人力资本与算力令牌资产。说到底，如果一家企业本身是一套学习体系，那它就必须拥有属于自己的学习体系，这才是核心目标。各类模型只是其中的输入工具，而不是用来榨取企业知识的载体。某种意义上来说，最终每家企业都会评估，哪些服务商能帮助他们实现业务成果、创造知识资产。现在这一点已经十分清晰，并且会一天比一天明朗。这套模式绝不是服务商进驻企业、拿走企业全部知识，自己独享收益，而企业拿不到任何增值回报。顺着这个发展趋势，我们对平台的底层架构设计有着清晰标准：企业专属业务逻辑层必须和模型层完全隔离。业务逻辑层会独立存储企业全部记忆、上下文信息，这意味着企业可以随时替换任意底层模型。企业当然可以使用前沿大模型，这么做没有任何阻碍，同时也能同时使用多款不同模型。我之前给出的部分数据就是很好的例子，它清晰展示了如何利用前沿模型发挥其独有能力，如何利用低成本模型承接对应任务，甚至在你不想使用任何外部模型时，自主训练自有模型 —— 毕竟企业手上已经拥有全部业务输出、操作日志、业务上下文数据。这就是我们要向全行业推广的企业级底层架构设计。微软自身所有产品都采用这套架构：Copilot、GitHub Copilot、安全 Copilot 皆是如此。我们希望把这套设计模式普及开来，让每家企业都能使用。这套架构可以自由搭配开源权重模型、闭源商用模型。大家可以参考 Hugging Face 相关事件就能明白：企业不能只依赖单一模型，有时单一模型引发故障，企业甚至需要多模型组合才能修复问题，这就是我们看待这件事的思路。企业不能受制于单一模型的输出限制，这里存在广阔的架构设计空间。大家总把前沿大模型笼统当成单一品类，但我们理解的前沿体系是：每家企业都能搭建属于自己的前沿算力体系，自主选择模型、控制成本、掌握所需能力，真正掌控自身发展主动权。胡德：卡尔，我可以在你问题的基础上补充一点。这也是整套平台架构搭建的核心意义，萨提亚在开场发言里也提到过：依托 Azure 这套底层架构，平台可以为不同业务匹配最合适的模型。因此我们持续看到需求增长，无论客户选择哪一类模型、哪一系列模型，或是自主训练自有模型，Azure 平台都能高效承载，底层算力基础设施具备高度通用性。杰弗瑞（Jeffrey）分析师布兰特 · 希尔（Brent Thill）：谢谢艾米。Azure 增速表现十分亮眼，达到 43%，下季度指引增速接近 45%。我想请教增长背后的核心驱动因素，同时市场普遍关心算力供给瓶颈：我们目前仍然处在供给紧缺的环境里吗？还是说在全行业算力受限的大背景下，微软自身运营执行做得更好？谢谢。胡德：谢谢布兰特。首先，行业算力供给约束客观存在。过去多个季度我们一直在强调，客户需求持续超过现有算力供给，目前现状没有任何改变，现货算力市场的定价情况也能印证这一点。如果谈到如何提升交付能力，我在准备稿里也简单提过，我们首要发力点是算力效率优化，充分挖掘现有算力集群的全部潜力。这一点同时适用于 CPU 集群、GPU 集群的效率提升。本季度我们工程团队落地大量优化工作，尽可能释放更多可用算力。受供需失衡大环境影响，只要我们落地效率优化，新增算力就能在本季度立刻转化为营收，这一趋势确实为本季度业绩带来正向拉动。另外，过去 90 天里，我们大幅优化了 CPU、GPU 设备的交付流程，极大缩短设备到货上线周期。同样，在我们超大规模算力集群的体量下，交付效率优化能够快速兑现业绩增量，也是本季度增速超预期的重要原因，同时这也是我们未来持续推进的方向。伯恩斯坦研究公司分析师马克 · 莫尔德勒（Mark Moerdler）：非常感谢给我提问机会，同时恭喜公司交出一份超预期的出色财报。当下市场对 AI 行业的情绪波动极大，一方面市场担忧数据中心、芯片领域会出现大规模过剩产能，另一方面元器件涨价又会挤压企业利润。我有两个相关问题：第一，如果未来数据中心、芯片行业真的出现大规模产能过剩、过度建设，微软有哪些应对手段保护自身？第二，反过来讲，当下硬件元器件涨价，微软如何管控成本，避免要么大幅上调产品售价，要么毛利率持续承压？谢谢。胡德：谢谢马克，你的两个问题关联性很强，我先回答第一个。当下供需确实处于极度紧张的阶段，但拉长周期来看，我想提醒大家，我们绝大部分资本开支都投向我所说的短期资产，也就是 CPU 和 GPU，这类设备采购周期相对更短。一旦市场需求环境发生变化，我们可以直接缩减这部分最大成本项的投入。而土地购置、自建数据中心相关投入在整体成本结构里占比偏小，具备很高灵活性，园区建设、设备上架部署的节奏都可以灵活调整，我们可以分阶段推进算力建设。长期以来，各大超大规模云厂商都具备应对需求波动的成熟经验，能够灵活调整投入节奏。另外一点很关键：我们的客户结构极度多元化，覆盖全球不同地区、不同行业、不同业务场景。大家可以看我们本季度新增的剩余履约义务，全部来自多元化客户群体。短期高成本硬件可以按需分批采购；我们自有自研应用业务同样会消耗自建算力，叠加 Azure 对外商用服务，双重业务支撑算力利用率，让我们拥有充足灵活度应对周期波动。再谈到定价问题，坦白说，行业所有厂商都同等承受元器件涨价带来的压力。我们当下能做的核心，就是持续深挖全链路效率，保障为客户提供稳定价值。同时我们也持续向客户传递一个事实：相比企业自建机房单独采购服务器硬件，云服务能大幅平抑涨价冲击，即便在元器件涨价周期，云服务依旧能给客户带来可观投资回报。另外，我们新增算力会通过全新合约对外销售，定价条款会同步更新，我们会在长期客户价值与合理盈利之间做好平衡。纳德拉：我补充几句艾米的观点，她讲得很全面。我们所有人都在研读复盘行业周期的书籍，所以在我看来，打造完整的产品矩阵是重中之重，这也是我们当下的核心工作。从 Copilot、一体化超级应用，到 Azure、Azure 内置的智能体底层工具，全线产品必须协同打通。客户结构至关重要，你必须充分考量客户的地域分布、行业分布、业务负载分布，甚至在规划算力产能时就要全盘纳入考量。归根结底，底层算力运营要做到极致高效。本季度我们也落地了大量效率优化举措，效率提升不是短期一次性动作，而是需要长期持续深耕的常态化工作。我们清楚行业周期必然存在起伏，但 AI 带来的结构性长期增长趋势十分明确。我们对自身多元化业务组合、稳定毛利结构，最重要的是能持续为客户创造核心价值这几点，都抱有十分乐观的预期。摩根士丹利分析师亚当 · 伍德（Adam Wood）：感谢给我提问机会，同时恭喜公司交出财年末强劲业绩。我想咨询 M365 Copilot 相关业务：本季度这项业务表现十分亮眼，付费席位突破 3000 万，增长大幅提速。想请您谈谈客户落地节奏：目前市场还是以试点项目为主，还是企业大规模全面部署的案例正在大量增多？另外，Copilot 商业化变现的核心驱动力是什么？谢谢。纳德拉：谢谢你亚当，我先来回答，之后艾米可以补充。还是先说产品形态，大家能明显看到，本季度产品形态发生了巨大变化。聊天、协同、自动化、代码开发等功能全部整合进一款旗舰级超级应用，适配各类岗位员工。再看使用数据，有一组很有参考价值的指标：从采购授权到员工实际启用产品的周期大幅缩短，过去需要数月，现在只需要几天。同时用户使用强度大幅提升，活跃度已经达到 Outlook、Teams 这类日常办公沟通工具的水平。第二点，产品深度嵌入企业全业务链路，不是孤立的工具。深度对接 E7 产品、智能代理 365 管控体系，打通 IT 运维、安全运维、财务运维全流程；企业内部 CRM、ERP 系统全部以功能插件、能力模块形式接入协同平台，企业全业务工作流可以一键接入这款超级应用，进一步提升使用频次，形成正向增长循环。第三点是商业模式。我们目前既有按席位订阅的商业模式，现在也推出了按量计费模式。E7 产品已经显现出按量计费带来的增长红利；未来随着我们持续为企业客户交付业务价值，商业化规模会持续扩张。客观对比传统 Office，Copilot 覆盖的业务场景宽泛得多，这是首款同时提供席位订阅、按量计费双模式的企业级工具，整体客单价更高。我们会持续聚焦为客户创造价值，同步扩大业务规模。胡德：亚当，我在准备稿里也提到过，本季度每用户收入增长一部分来自 E5 搭配 Copilot 授权，另一部分增量将来自 E7。E7 完整搭载智能代理 365 组件，价值空间广阔。企业都需要完整观测、管控全业务流程的算力令牌消耗，这正是 E7 的核心价值。这款产品本季度上市时间不长，但客户从中看到的价值远超我们预期，全年我们会持续重点发力这条产品线。长远来看，全场景智能应用落地会持续拓宽整体市场空间，按量计费、消耗型收入会成为长期增长核心。随着更多业务场景接入平台，大家对 M365 整体能力边界的认知也会彻底改变。举个实际案例：贵司某位分析师发布了一份投资回报相关报告 PDF，我直接把这份文件上传 Copilot，指令它生成全新 Power BI 可视化看板。平台自动搭建完整语义模型，仅通过一条链接就接入全部外部数据源，数据同步更新全球七大科技公司全部 SEC 财报信息，配套代码仓库也同步生成，所有成果资产全部归档在我的 Copilot 工作台。对我这名知识工作者来说，我可以快速搭建数据分析看板；数据工程师可以在 Fabric 平台调取这份数据资产；专业开发人员可以进入代码仓库提取使用。整套流程全部接入 Azure 365 统一管控。这就是艾米所说的全新工作模式，同时兼顾企业安全管控与运维管理。德意志银行分析师布拉德 · 泽尔尼克（Brad Zelnick）：非常感谢给我提问机会。萨提亚，网络安全是微软全部业务的核心板块。近期前沿大模型持续迭代，行业竞争格局发生巨大变化，本周微软推出了 Project Perception 项目。能否详细阐述这一变革节点对微软安全业务的实际意义，以及这件事对微软整体品牌公信力带来的影响？谢谢。纳德拉：谢谢你的问题。你说得没错，当下网络安全产品的需求标准、安全运营的底层逻辑都发生了根本性变化。企业必须同步完成两件事：产品体系全面转型，同时重构企业内部安全运营模式，才能实现有效防护。我们沿用办公、代码开发业务的统一思路：以智能优先架构重构整套安全体系。我们推出 Project Perception 项目，核心目标是搭建自动化红蓝绿三方智能代理体系。红队智能代理持续开展渗透测试、挖掘系统漏洞；蓝队智能代理自动对安全告警分级处置；绿队智能代理自动化修复各类安全缺陷，搭建一套可以 7×24 小时自主运转的敏捷安全防御体系。整套安全防御单元会整合全维度安全信号：终端防护、身份权限、终端接入、安全防御、网络流量、应用安全等全部数据，生成完整业务上下文，以此实现精准防护。另外一点，尤其在安全领域，多模型混合架构至关重要，这也呼应了分析师提出的问题，这么做不只是为了控制成本。我们通过实测验证，依托这套混合多模型架构，在实现同等防护效果的前提下，成本可以降低 50%。90% 的常规安全处置任务由轻量化专用安全模型完成，仅 10% 高难度复杂场景才调用前沿大模型。这种流水线式多模型协同架构是核心优势，兼顾成本可控与业务连续性。企业不能单一依赖某一款模型，否则极易陷入业务瘫痪。成本可控、业务持续稳定运行是两大核心评判标准，我们把这套架构同步落地到代码开发、网络安全、办公全产品线。坦白说，我们十分看好 Perception 项目，以及它未来能为安全业务带来的增长空间。高盛分析师加夫列拉・博尔赫斯（Gabriela Borges）：下午好，感谢给我提问机会。我想请教资本开支投资回报率相关问题。您之前分别介绍了资本开支规划、商业化变现路径，能不能把两块内容结合起来分析？当下我们制定资本开支决策时测算的投资回报率，和一年前相比有哪些变化？未来还有哪些可落地的优化抓手，作为增量变现的驱动项？谢谢。胡德：谢谢加夫列拉。坦白说，过去一年我测算投资回报的底层计算逻辑没有发生改变。我看待这件事的核心思路是：我们对整体市场空间扩张的确定性大幅提升，同时手握多重毛利率优化抓手，既包含产品端优化，也包含基础设施端优化，今天电话会上我们也提到了不少相关路径。当然，还有很多抓手我们没有展开细说，萨提亚其实也提到了一部分。我们显然还有大量优化空间：持续筛选高性价比芯片方案，其中包含我们自研芯片相关投入；模型多元化布局同样是毛利率优化抓手，我们可以搭配更高效率的模型方案，在令牌消耗、硬件成本两端同时实现降本增效。以上所有抓手，都能提升我们对当下及未来资本开支投资回报的信心。产品矩阵覆盖知识办公、代码开发、网络安全，再到智能代理底层，智能代理 365 可以说是业务增长的加分项。除此之外，我们之前聊到的 Azure 相关优化，包含模型效率、芯片与元器件优化、自研一体化解决方案投入，再加上超大规模集群运营的整体效率提升，我们手握大量可以持续优化的抓手，并且会持续推进落地。但正如我们之前所说，效率优化是长期深耕的细致工作，需要日复一日持续精进，而微软非常擅长长期深耕这类优化工作，持续为客户创造价值。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/416.htm", "publishedAt": "2026-07-30T01:49:47+00:00"}, {"title": "谷歌推出 Lyria 3.5 音乐生成 AI 模型：提升旋律编排、人声表现更细腻", "summary": "IT之家 7 月 30 日消息，谷歌昨日（7 月 29 日）发布博文，宣布正在 Google Flow Music 中推出 Lyria 3.5 音乐生成 AI 模型，提升音乐性、歌词和人声质量等，让用户创作出更丰富的音乐作品。谷歌官方表示相比较上一代模型，Lyria 3.5 重点提升旋律编排、歌词生成、人声表现及歌曲控制能力。新模型不仅支持生成更丰富且更复杂的旋律结构，还能更好遵循用户输入的提示词，更好地理解歌曲意图，提升歌曲生成质量。在人声方面，谷歌称，新模型生成的人声更贴近真实演唱，情感层次更细腻，发音也更准确。除内容生成质量外，Lyria 3.5 还增强了创作控制选项，用户可更灵活地设定歌曲节奏和时长。谷歌还演示使用 Lyria 3.5 模型创作的《直到太阳升起》（Hasta Que Salga El Sol）歌曲，IT之家附上相关视频如下：", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/412.htm", "publishedAt": "2026-07-30T01:42:00+00:00"}, {"title": "字节跳动 To B 战略升级：豆包、飞书、火山引擎组织调整，聚焦 AI 企业服务", "summary": "IT之家 7 月 30 日消息，字节跳动今日启动面向 AI 业务的组织调整，加强豆包、飞书、火山引擎在企业生产力场景的产品与服务协同。根据调整方案，飞书产品团队与豆包产品团队将整合，成立新的豆包产品团队，由豆包负责人赵祺负责，飞书负责人谢欣向赵祺汇报。GTM （市场、销售、客户服务）体系方面，飞书 GTM 团队将与火山引擎团队整合，成立新的 ToB GTM 组织“创造力服务平台（Creativity Service Platform）”，整体负责字节 MaaS 和 SaaS 等云服务的市场、销售和客户服务，由火山引擎负责人谭待负责，飞书销售负责人林婵、飞书战略及市场负责人史志隽向谭待汇报。重组完成后，除原有的飞书产品和服务保持不变，飞书还将和豆包在生产力场景进行更深度的产品协作。据悉，由飞书产品团队深度参与开发的豆包企业版，已经在部分飞书客户中开启内测。豆包企业版不仅拥有通用 AI 生产力工具的能力，而且原生集成了飞书生态体系。用户无需额外部署即可打通飞书文档、表格、会议、群聊等全办公场景，并支持基于企业自有知识库的精准问答与智能创作。此外，豆包企业版还配备了完善的企业级数据隔离、权限管控与安全审计能力。在企业服务层面，新成立的创造力服务平台部，将会整合字节 To B 业务服务客户的能力，更好地满足企业客户的 AI 需求。此次组织整合背后，是字节正在进一步提升 AI to B 战略的优先级。截至今年 6 月，豆包大模型日均 Token 调用量突破 180 万亿，火山引擎在公有云 MaaS 市场占据重要份额，飞书商业化增长也明显加速。2026 年二季度，飞书新增客户中已有超九成同步采购飞书 AI 产品。据了解，按 7 月平均消耗口径统计，字节大模型业务 ARR（年化收入）达 40 亿美元（IT之家注：现汇率约合 270.95 亿元人民币），超过国内其他模型公司 ARR 总和。相关阅读：《消息称字节调整 AI 资源分配，重心从豆包这类大众产品转向企业服务》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/410.htm", "publishedAt": "2026-07-30T01:38:20+00:00"}, {"title": "Anthropic：Claude 发现 HAWK 致命缺陷，仅用 60 小时攻破 NIST 后量子签名候选算法", "summary": "IT之家 7 月 30 日消息，当地时间 7 月 28 日，Anthropic 宣布其 Claude Mythos Preview 模型在密码学算法研究中取得重磅突破。据介绍，Claude 针对 NIST 后量子签名候选算法 HAWK 及简化版 AES-128 加密标准发现了更高效的攻击方法。其中针对 HAWK 的攻击直接导致该算法于次日被其开发者从 NIST 的标准化进程中撤回。HAWK 算法因攻击被撤回HAWK 是一种为抵御未来量子计算机攻击而设计的数字签名方案，此前已通过 NIST（美国国家标准与技术研究院）的两轮评审，并在 2026 年 5 月进入第三轮候选名单。Anthropic 表示，在其研究人员提供项目方向指引后，Claude Mythos Preview 在约 60 小时的半自主工作中，将针对 HAWK 的最佳已知攻击进行了改进。该攻击利用了 HAWK 所基于的格结构中一个此前未被发现的对称性（即非平凡自同构）。以最小的 HAWK-256 参数集为例，完整密钥恢复攻击的预期计算成本从 2⁶⁴降至 2³⁸。虽然攻击仍呈指数级复杂度，对大参数集（HAWK-512 和 HAWK-1024）暂无实际威胁，但已将方案的有效密钥强度减半。Anthropic 指出，虽然将密钥长度加倍可以恢复安全级别，但会抵消 HAWK 作为紧凑后量子签名方案的主要优势。在 Anthropic 于 7 月 28 日将研究发现发布至 NIST 公共论坛后，NIST 密码学家 Daniel Apon 在一小时内确认了该攻击的有效性。次日，HAWK 的开发者宣布将其从 NIST 的标准化进程中撤回。对 AES-128 简化版的攻击提速第二项研究成果针对的是 AES-128 加密算法的简化版本。标准 AES-128 加密执行 10 轮数学变换，而此次攻击针对的是仅执行 7 轮的简化研究版本。Claude Mythos Preview 在几乎完全自主的情况下，开发出一种名为“Möbius Bridge”的指纹技术。该技术移除了此前攻击中一个需枚举 256 种可能值的步骤，并结合其他优化方法，使攻击速度比此前最佳方案提升了 200 至 800 倍。该攻击建立在选择明文威胁模型下，但仍需约 2¹⁰⁵个选择明文，在实际场景中仍不可行。Anthropic 强调，两项研究成果均不影响任何现有生产系统。HAWK 尚未部署，而 AES 攻击针对的是简化研究版本，并非完整的 10 轮 AES-128 加密标准。AES-128 是美国国家标准与技术研究院于 2001 年采纳的对称加密标准，广泛应用于各类数据加密场景。发现过程与后续研究Anthropic 披露了 Claude 发现这些成果的过程与成本。针对 HAWK 的攻击耗费约 10 万美元（IT之家注：现汇率约合 67.7 万元人民币）的 API 调用成本；而 AES 攻击的发现过程中，模型输出了约 10 亿个词元，研究人员的验证工作则耗时数百小时。在 AES 攻击的早期阶段，Claude 最初一直拒绝尝试，认为改进 AES 的密码分析是不可能的，在研究人员多次引导后才开始探索并最终取得突破。此外，Anthropic 还透露 Claude Mythos Preview 已在其他密码算法上取得初步成果，包括对 13 轮 LEA 轻量级加密算法的实际密钥恢复攻击（可在现代台式机上于一小时内完成），以及对 Serpent-128、Salsa20 流密码、Poseidon 哈希函数和 SHA-1 哈希函数的改进攻击。为便于学界持续研究大语言模型的密码分析能力，Anthropic 与苏黎世联邦理工学院、特拉维夫大学及海法大学合作推出了 CryptanalysisBench 基准测试集。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/396.htm", "publishedAt": "2026-07-30T01:03:11+00:00"}, {"title": "分析师：航司采取动态 AI 定价，廉价机票捡漏机会或越来越少", "summary": "IT之家 7 月 30 日消息，喜欢满世界寻找廉价机票的旅客可能要失望了：在热门航班上意外捡到便宜票的机会，或许很快就会越来越少。过去，航空公司主要依靠分析师制定固定的调价规则，例如航班售出四分之一座位后，票价统一上涨 20%。AI 投入使用后，航空公司可以实时分析数十项因素，更迅速地调整每个座位的售价。航空公司因此能够获得更多营收，过去让旅客有机会买到低价票的价格落差也会逐渐缩小。据彭博社今天（30 日）报道，面对持续上涨的经营成本，达美航空、维珍航空等航空公司正加快引入 AI 定价技术，设法提高每趟航班的收入。繁忙航线上的低价座位可能进一步减少，因为航空公司会尽量避免以低于乘客支付意愿的价格售票，同时让更多航班接近满座。航空票价由固定规则和电子表格决定的时代正在结束。预测模型将持续判断市场需求，并随时调整价格。奥尔顿航空咨询公司分析师布赖恩 · 特里认为，消费者需要做好准备，因为航空公司的定价会变得更加精明。航空公司会在条件允许时涨价，也会在需要刺激需求时降价。AI 可以帮助航空公司更早、更清晰、更准确地判断市场，从而更加灵活地上下调整票价。不过，AI 并非只会推高票价。特里表示，在客流较少的航班和需求偏弱的航线上，航空公司也可能借助 AI 主动降价，以吸引更多乘客并减少空座，因此淡季或非高峰时段的票价可能更便宜。然而他也认为，对航空公司来说，AI 定价就是“终极秘方”。在当前经营环境中，提高收入比削减成本容易得多。为了找到更多收入来源，航空公司还会继续突破现有定价方式的边界。航空分析师盖伊 · 利奇表示，航空公司早已采用动态定价，根据需求变化调整票价。而在 AI 时代，AI 让整套系统运行得更快，判断也更加精细。机器学习模型可以结合历史订票规律、座位余量和季节变化预测需求，同时持续监测竞争对手的票价与运力，几乎实时完成调价。AI 定价究竟会让乘客受益还是承担更高成本，目前没有定论。利奇表示：“市场运行效率提高，对乘客也有好处。只要合理选择订票时机或尽早购买，乘客仍有机会拿到低于平均水平的票价。”批评人士则认为，航空业利润空间有限，航空公司必然会利用更强大的定价工具，提高平均票价、客座率和整体收益。AI 甚至可以在机票售出后继续挖掘座位价值。例如，一名乘客提前数月以低价买下热门航班的机票，临近出发时市场需求却突然上升。运营智能公司 Volantio 的 AI 平台能够读取航空公司的订票数据，筛选出可能愿意领取代金券并改乘较空航班的乘客。原先的座位腾出后，航空公司便可以把座位以 1000 美元（IT之家注：现汇率约合 6774 元人民币）转售给临时出行的商务旅客，从同一个座位上获得更高收入。Volantio 联合创始人兼 CEO 阿齐姆 · 巴罗达瓦拉表示，此举使航空公司获得更多收入，且愿意灵活调整行程的乘客也会得到补偿。AI 在航空定价领域的应用不断扩大，也让“监控式定价”成为新的争议焦点。消费者权益倡导人士和美国议员去年警告，航空公司未来可能利用生成式 AI 分析浏览记录、收入等个人信息，并对购买同一座位的不同乘客开出不同价格。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/394.htm", "publishedAt": "2026-07-30T00:58:41+00:00"}, {"title": "病退两天剧情反转：从 Thinking Machines 离职后，北大校友翁荔重回老东家 OpenAI", "summary": "简直太抓马了！两天前，因病裸辞 Thinking Machines 的联创，转头竟光速加入了 OpenAI。Information 爆出，北大校友翁荔将重返老东家，带队开发「递归自我改进」（RSI）新模型。这波极限操作，也难怪网友感慨，「真是编都编不出来......」裸辞仅 48 小时，光速加入 OpenAI这一切，还要从两天前说起。28 日那天，翁荔发布了一份极其直白的离职声明 —— 在过去 7 个月里，自己经受了人生中最严重的一段病痛折磨。「在全公司为 Inkling 发布冲刺的时候，我试着好好休病假，可一边休养一边跟内疚感搏斗，这滋味真的不好受」。翁荔当时表示，下一站将找一个「职责明确」的岗位，不再做联创。出人意料的是，短短两天后，这个「新东家」就正式揭晓了。翁荔亲自挂帅，押注「递归自我改进」不过，真正引发业界瞩目的，是翁荔此次重返 OpenAI 所肩负的重任。OpenAI 发言人已向 BI 证实，翁荔将亲自挂帅，领导一个聚焦「递归自我改进」（RSI）的团队。通俗讲，用 AI 研发 AI，即让 AI 加速 OpenAI 设计、训练、评估下一代模型的整套流程。从 OpenAI 的战略来看，这盘大棋早已开始布局。3 月，OpenAI 首席科学家 Jakub Pachocki 曾明确界定，打造一个全自动的「AI 研究员」，是 OpenAI 未来几年的「北极星」。无论是推理模型、Agent，还是可解释性，所有的研究主线，都在向同一个靶心全面收束。配合这一终极战略，内部时间表也早就公开了，分两级：第一阶段（2026 年 9 月）：一个「自主 AI 研究实习生」，能独立接下少量具体的研究问题；第二阶段（2028 年 3 月）：全自动多 Agent 研究系统，能自己提假设、设计实验、得出结论。在技术路径上，OpenAI 的核心押注集中在两端：一是底层算法的持续迭代；二是暴力拉升「测试时计算」。这么一看，翁荔的位置就清楚了。她要做的不是下一个 GPT，是要亲手打造出那条能够「自动进化、量产 GPT」的超级流水线。一篇博客，主题正是 RSIOpenAI 凭什么把帅印交给翁荔？答案，其实在三周前就已埋下伏笔。月初，翁荔在个人博客发布了一篇长文 Harness Engineering for Self-Improvement。它浓缩了几十篇论文精华，主题正是 RSI。传送门：https://lilianweng.github.io/ posts/2026-07-04-harness/文章中，翁荔把这个概念的来路说得很清楚：1965 年 I. J. Good 提出「超智能机器」，指一台能在所有智力活动上超过人、并且能设计出更好的机器来改进自己的系统；2008 年 Yudkowsky 给这个反馈回路起了名字，AI 用当下的智能，去改进产生自身智能的那套机制。但她的判断不在概念上，而在工程上 —— 现在的 AI 自我改进，不一定要从模型改写自己的权重开始。更现实的入口是 Harness，模型外面那层脚手架，规划、工作流、上下文管理、持久化存储。她拿操作系统作比，「今天的 Agent 应用之所以可靠，靠的是被精心工程化过的 Harness，而不只是模型本身有多强」。三周之后，这个方向变成了她的岗位。北大毕业，从「玩魔方」到 OpenAI 副总翁荔的起点，并非大模型。2004 年，她拿下了全国高中数学联赛陕西省一等奖，次年考入北大信管专业。毕业后，又远赴印第安纳大学布卢明顿分校攻读博士，主攻复杂网络、社交网络与信息传播。这些方向，与如今「一统天下」的 Transformer 架构几乎毫不搭界。她曾在 Facebook 实习，在 Dropbox 做数据科学家，又去金融科技公司 Affirm 做机器学习工程师。2018 年入职 OpenAI 时，她被分到了机器人团队。团队花了两年，教一只机械手单手复原魔方，那是当年最出圈的 AI 演示之一，她是核心贡献者。2021 年，OpenAI 重心转向 GPT，翁荔参与组建并带起应用 AI 研究团队。GPT-4 发布之后，她从零搭起 Safety Systems 团队，到她离开时，这个团队已经超过 80 人。2024 年 8 月，她升任负责安全的研究副总裁；三个月后宣布离职，理由是「在 OpenAI 待了 7 年，我准备好清空自己、去探索一些新东西」。紧接着，她便以联创身份，创办了 Thinking Machines。如今，从 Thinking Machines 再回到 OpenAI，中间只隔了两年的时间。目前，Thinky 六个联创走了四个，三个都回了 OpenAI。2026 年，AI「量产」AI？站在更高维度看，翁荔回归的背后，是 OpenAI 对 ASI 终极路径的又一次疯狂押注！当 AI 外层的 Harness 搭建完毕、AI 开始自主研发、测试下一代 AI，人类的角色将被彻底改写。如果翁荔挂帅的 RSI 团队，真能在 2026 年交出一个「自主 AI 研究实习生」——那意味着，LLM 的迭代将逐渐告别人力堆叠，迈向指数级爆发的技术奇点。参考资料：https://www.theinformation.com/briefings/thinking-machines-cofounder-return-openai", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/393.htm", "publishedAt": "2026-07-30T00:52:44+00:00"}, {"title": "OpenAI 称 7 月年化收入已超 Q2 总和，正面临 Anthropic 与开源模型双重竞争", "summary": "IT之家 7 月 30 日消息，据 CNBC 今日报道，OpenAI 首席财务官萨拉 · 弗里亚尔（Sarah Friar）在当地时间 7 月 29 日举行的一场内部员工会议上透露，公司 7 月份的年化经常性收入（ARR）已超过整个第二季度的总和。此举旨在向员工传递公司业务仍保持增长态势的信息，也需要向外部投资者证明其高达 8520 亿美元（现汇率约合 5.78 万亿元人民币）的估值具备支撑，因为 OpenAI 正在为可能进行的大规模首次公开募股（IPO）做准备。据 CNBC 获取的会议内容显示，弗里尔与 OpenAI 董事会主席布雷特 · 泰勒（Bret Taylor）在会议中介绍了公司的收入增长情况，并讨论了与竞争对手 Anthropic 的市场竞争。弗里亚尔表示，OpenAI 第二季度表现并不弱，而 7 月收入增长势头进一步增强。她称：“第二季度并不是一个糟糕的季度。”OpenAI 方面认为，增长动能主要来自 GPT-5.6 系列模型的发布、新款企业级智能体 ChatGPT Work，以及 AI 编程工具 Codex 的采用率持续上升。目前，OpenAI 正面临着来自 Anthropic 和谷歌的激烈竞争，同时也需应对来自中国低成本开源模型的冲击。OpenAI 正致力于吸引更多企业用户和开发者，以支撑其庞大的基础设施建设计划。今年 2 月，OpenAI 告知投资者，计划到 2030 年累计投入约 6000 亿美元（IT之家注：现汇率约合 4.07 万亿元人民币）用于算力建设。公司目前正在与英伟达就一笔高达 2500 亿美元（现汇率约合 1.69 万亿元人民币）的资金支持进行谈判，以资助其在俄亥俄州租赁一座大型 AI 数据中心的计划。与此同时，竞争对手 Anthropic 的增长势头强劲。今年 5 月，Anthropic 的年化收入运行率已突破 470 亿美元（现汇率约合 3185.88 亿元人民币）。OpenAI 和 Anthropic 均已于 6 月向美国证券交易委员会（SEC）秘密提交 IPO 文件，但两家公司都尚未公布具体上市时间。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/378.htm", "publishedAt": "2026-07-29T23:46:27+00:00"}, {"title": "OpenAI 计划向 10 万名科学家免费开放 GPT-5.6 系列 AI 模型等资源", "summary": "IT之家 7 月 30 日消息，OpenAI 今天（7 月 30 日）在 X 平台发布推文，宣布启动 ChatGPT for Academic Researchers 计划，将向 10 万名科研人员免费开放 ChatGPT 高级功能。科学家可以通过 OpenAI 官网，填写表格后加入 ChatGPT for Academic Researchers 项目。该项目初期将面向部分高校的 1 万名用户开放，并计划未来逐步吸纳 9 万名研究人员加入。参与者将获得一个“使用次数限制更高、上下文窗口更大的”ChatGPT 版本，相当于支持调用 Pro 版 GPT-5.6 Sol 模型，该版本特别针对复杂查询和长时间运行的任务优化。受邀加入 OpenAI 新项目的科学家可以邀请同一学术机构的四位同事加入。这些研究人员可以免费使用相同的功能集。OpenAI 还计划提供一个“扩展版”的聊天机器人深度研究功能，该功能于去年 2 月首次推出，可以从数百个网站收集信息来回答用户问题。研究人员在此基础上，还能定向配置从科学期刊等特定资源中洞察研究相关课题。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/376.htm", "publishedAt": "2026-07-29T23:41:39+00:00"}, {"title": "揭秘 AI 入侵 Hugging Face 全过程：4 天半执行 17600 次操作", "summary": "7 月 30 日，据 TechCrunch 报道，Hugging Face 近日公布了一份关于近期 AI 智能体入侵事件的完整技术时间线，披露了一套基于 OpenAI 模型构建的自主 AI 智能体如何在 4 天半时间内执行约 17600 次操作，最终成功突破公司多项安全防护。这也是 OpenAI CEO 萨姆 · 奥尔特曼此前公开表示令其“切身感受到冲击”的 AI 安全事件。根据 Hugging Face 披露的信息，此次事件并非 AI 脱离控制自行作恶，而是一套原本用于参加 OpenAI 网络安全评测的 AI 智能体，在关闭常规安全限制后，自主寻找漏洞，并将攻击目标扩展至考试之外的系统。时间线显示，该 AI 首先利用一个尚未修复的软件漏洞逃离原本的测试环境，随后入侵另一套公开暴露的 AI 测试工具，并植入代码，将其作为后续攻击 Hugging Face 系统的跳板。进入 Hugging Face 系统后，AI 发现服务器对外部请求进行了限制，但未限制本地文件读取。它随后上传伪装成普通数据集的文件，诱导系统读取服务器上的密码、源代码等敏感信息并返回结果。随后，AI 又利用另一处漏洞，将原本应作为普通文本的数据当作系统命令执行，从而获得服务器代码执行能力。调查显示，这套 AI 没有搭建专门的攻击基础设施，而是利用 Paste 网站、请求日志服务以及 Hugging Face 自身上传和代理功能建立起隐蔽的数据传输通道，并设计了简单的消息重组机制，将分散的数据重新拼接，同时对传输内容进行加密混淆，以躲避自动检测。Hugging Face 表示，初期自动分析仅发现了少量泄露数据，研究人员随后通过逆向分析 AI 使用的加密方式，才确认实际泄露的数据规模约为最初发现的 4 倍。为了维持攻击持续进行，该 AI 还在 11 台不同服务器上部署了自身副本，即便部分节点被关闭，其他副本仍可自动恢复运行。调查还发现，AI 曾获取用于生成合法登录令牌的私钥，理论上能够自行生成有效身份凭证。此外，由于 Hugging Face 内部权限配置存在问题，一组凭证意外拥有多个内部系统访问权限，使 AI 获得了更大范围的控制能力。Hugging Face 还披露，AI 曾尝试修改构建脚本，希望借此影响自动化构建系统，但最终被公司现有安全机制拦截，没有成功实施。同时，所有可能删除或修改云资源的命令均以“Dry Run（模拟执行）”模式运行，仅验证执行结果，并未真正破坏系统资源。值得注意的是，由于测试环境会频繁重置，这套 AI 每次都会失去此前获得的工具和身份信息，但它都会重新建立攻击链路，持续恢复行动，整个过程持续了 4 天半。Hugging Face 在报告中认为，此次事件暴露出的漏洞，包括不安全的数据集处理、云元数据暴露、权限配置过宽以及长期有效凭证等，本质上均可能被经验丰富的人类攻击者利用，不同之处在于，AI 能够以前所未有的规模和持续性不断尝试各种攻击路径，大幅提升漏洞发现和利用效率。相关阅读：《AI 入侵后，Hugging Face 向 OpenAI 索要 1 亿美元算力》《智能体入侵 Hugging Face，消息人士称 OpenAI 至少一周都没察觉》《OpenAI 自曝 AI 模型“失控”越狱，突破沙盒环境入侵 Hugging Face》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/374.htm", "publishedAt": "2026-07-29T23:29:34+00:00"}, {"title": "微软确认 Copilot“超级应用”年内问世，整合智能体、AI 编程、聊天", "summary": "IT之家 7 月 30 日消息，据外媒 The Verge 报道，当地时间周三（29 日），微软 CEO 萨提亚 · 纳德拉在财报电话会议上透露，微软正在打造一款 AI“超级应用”，计划把 Copilot 的对话、编程和智能体功能整合到同一个应用中。这款“超级应用”将于今年发布，同时面向个人用户和企业客户。纳德拉表示：“Copilot 正在迅速从聊天工具发展为 Cowork，再迈向 Autopilots。本季度，我们将把编程等多种 Copilot 体验整合进一款超级应用…… 这将是一个重大进展，我期待很快公布更多消息。”今年早些时候，《财富》曾报道称，微软正在开发一款整合 Copilot 聊天机器人、GitHub Copilot 编程助手、Copilot Cowork 和智能体 Autopilot 系统的超级应用。OpenAI 最近也推出了 ChatGPT Work，将 ChatGPT 与 AI 编程工具 Codex 集成到同一个应用中。微软上一季度营收大幅增至 900 亿美元（IT之家注：现汇率约合 6100.62 亿元人民币），AI 和云业务成为主要增长动力。相关阅读：《消息称微软打造 Copilot 超级应用：统一 AI 入口，整合编程 / 聊天等》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/367.htm", "publishedAt": "2026-07-29T23:08:03+00:00"}, {"title": "OpenAI 总裁布罗克曼谈苹果诉讼：我们没有兴趣窃取其它企业商业机密", "summary": "IT之家 7 月 30 日消息，昨日（7 月 29 日）接受《华尔街日报》科技专栏作家乔安娜 · 斯特恩（Joanna Stern）采访时，OpenAI 联合创始人兼总裁格雷格 · 布罗克曼（Greg Brockman）就苹果公司起诉事宜，回应表示公司无意获取其他公司的商业秘密，并将专注自身技术与长期产品路线。IT之家附上相关视频如下：在采访中，布罗克曼回应 OpenAI 被苹果公司起诉，他重申 OpenAI 已公开表达的立场：公司对其他企业的商业秘密“没有兴趣”，并认为自身“足够具备创新能力”。他表示公司运作方式，以及推进其它项目过程中，都是立足于自身的创意挖掘，并不会去窥探其它公司的商业机密。在产品规划上，布罗克曼表示：我们和苹果公司纠纷依然在推进中，现阶段我并不想多谈，但我可以肯定的是，我们非常重视长期发展规划，并且专注于自身的研发和技术。这才是我们真正关心的。布罗克曼并未披露 OpenAI 首款硬件上市日期，仅称用户“很快”可以期待这些产品。市场传闻称，OpenAI 的首款产品可能是一款没有显示屏的移动智能音箱，定位为面向家庭使用、具备拟人化交互能力的 AI 伴侣。他还称，OpenAI 正开发一系列设备，并打造自有芯片。公司希望产品能随时间持续提供价值，成为“为 AI 时代打造”且“尽可能有用”的设备。在采访过程中，布罗克曼还让 ChatGPT 回答了关于 OpenAI 首款硬件的相关描述：我的想法是，营造一种氛围轻松、摩擦力小的氛围，优先考虑语音，但并非仅限于语音，并具有清晰的隐私信号。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/366.htm", "publishedAt": "2026-07-29T23:06:26+00:00"}, {"title": "Yelp 借助 Training Orchestrator 实现机器学习模型训练的统一管理", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/J3AlWZvIwrQT3R7dsoJo?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-29T17:49:42+00:00"}, {"title": "AI智能体正击穿生物安全防线！智源、北大实测11款商用大模型，均能生成绕过筛查的拆分方案", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/JOOv0RAS1AEZO92E4KyU?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-29T16:00:00+00:00"}, {"title": "GPT“失控”被索赔1亿美元，微软反手扔王炸：新模型踩翻Mythos、价格砍半，还拉上“苦主”组了联盟", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/HmUiGVoVoyMc0Y29cZXc?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-29T14:00:00+00:00"}, {"title": "全球六城联动，世界人工智能开源大赛（GOAI）线下宣讲即将启动", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/LmqJqxbZBw9cUFY4Kb9c?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-29T13:48:45+00:00"}, {"title": "Netflix 如何打造 GenPage：一个用于构建个性化主页的生成式 AI 模型", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/4M2Old24DsjxwT1ZIR3k?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-29T11:53:00 人民币）的数据中心。扎克伯格认为，Meta 正在开发的个人 AI 智能体将成为未来数月乃至数年内“下一轮产品和收入来源的基础”。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/404.htm", "publishedAt": "2026-07-30T01:25:11+00:00"}, {"title": "研扬发布 MIX-Q870A1 主板：AI 算力最高 36 TOPS，配双网口", "summary": "IT之家 7 月 30 日消息，研扬科技（AAEON）昨日（7 月 29 日）宣布推出 MIX-Q870A1，定位高端 Mini-ITX 主板，最高支持 65W 的英特尔酷睿 Ultra 200S 系列 LGA 1851 插槽处理器。兼容性方面，MIX-Q870A1 主板兼容第二代英特尔酷睿 Ultra 处理器系列多种 SKU 规格，支持调用 NPU 和 Xe LPG 核显加速 AI 任务，最高提供 36 TOPS 算力。插槽方面，主板提供 1 个 M.2-1 A 2280 M-Key 插槽，支持 4 通道 PCIe 信号，可连接 NVMe 存储设备；另有 1 个 M.2 2242 M-Key 插槽，专用于 SATA 存储设备。MIX-Q870A1 配备 2 个 SATA 6 Gb/s 接口，支持 RAID 0 与 RAID 1。主板还提供 1 个 M.2 2230 E-Key 插槽，可用于安装 Wi-Fi 模块或额外的 NVMe 存储设备。后置 I/O 提供 2 个 HDMI 2.0 接口和 2 个 DisplayPort 接口，均支持 4K 分辨率与 60 Hz 刷新率。HDMI 接口同时支持数字音频输出。网络部分包括 1 个 1GbE 网口和 1 个 2.5GbE 网口，分别采用 Intel Ethernet Connection I219-LM 与 Intel Ethernet Controller I226-V；后置 I/O 还配备 8 个 USB 3.2 Gen 2 接口。IT之家附上相关截图如下：内部接口包括 8 位可编程数字 I/O、可扩展出 2 个 USB 3.2 Gen 1 接口的 USB 针座，以及 1 个 40 针 LVDS / eDP 接口。USB 针座与 LVDS / eDP 接口均支持 1920×1080 分辨率和 60 Hz 刷新率。系统方面，MIX-Q870A1 支持 64 位 Windows 10、Windows 11 与 Linux Ubuntu 24.04。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/389.htm", "publishedAt": "2026-07-30T00:32:59+00:00"}, {"title": "微软 Anthropic 投资录得 32 亿美元收益，而 OpenAI 减记 6 亿美元", "summary": "IT之家 7 月 30 日消息，微软今日公布了最新的 2026 财年第四季度财报，并披露了公司对 Anthropic 与 OpenAI 两家主要人工智能公司的投资回报。其中，微软对 Anthropic 的投资在该季度带来 32 亿美元（现汇率约合 216.91 亿元人民币）收益，而对 OpenAI 的投资却出现了约 6 亿美元（现汇率约合 40.67 亿元人民币）减值。微软在单个季度从 Anthropic 投资中获得的收益，已经接近 OpenAI 投资的全年收益规模。微软于 2025 年 11 月向 Anthropic 投资 50 亿美元（现汇率约合 338.92 亿元人民币）。根据双方达成的一项合作协议，Anthropic 同时承诺购买价值 300 亿美元（现汇率约合 2033.54 亿元人民币）的 Azure 云服务。微软并不会像披露 OpenAI 投资那样，在每个季度定期更新 Anthropic 投资价值。不过，公司此次披露相关收益，显示该投资在本季度产生了较明显的账面增长。相比之下，微软对 OpenAI 的投资在该季度表现较弱。微软表示，该项投资价值下调约 6 亿美元，使摊薄后每股收益减少约 7 美分。目前，微软持有 OpenAI 约 27% 的股份。除投资收益外，微软还通过双方营收分成模式获得相关收入，但公司并未披露 OpenAI 根据该安排向微软支付的具体金额。微软采用投资价值核算方式反映 OpenAI 投资变化。虽然本季度约 6 亿美元的减值规模较为明显，但对于微软整体财务表现而言影响有限。微软第四季度实现营收 900 亿美元，净利润 358 亿美元。整个 2026 财年，微软累计实现营收 3318 亿美元，净利润 1337 亿美元。从全年表现来看，微软对 OpenAI 的投资仍然带来了较大收益。微软财报显示，2026 财年该项投资带来 50 亿美元（IT之家注：现汇率约合 338.92 亿元人民币）收益，并使全年每股收益增加 67 美分。微软 2026 财年全年摊薄后每股收益为 17.95 美元。相关阅读：《微软 2026 财年年报归母净利润 1337.49 亿美元，同比增长 31.34%》《微软确认 Copilot“超级应用”年内问世，整合智能体、AI 编程、聊天》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/382.htm", "publishedAt": "2026-07-30T00:01:32+00:00"}, {"title": "谷歌 Waymo 展示网约车 Ojai：整合 Gemini AI，三屏协同显示", "summary": "IT之家 7 月 30 日消息，谷歌母公司 Alphabet 旗下自动驾驶公司 Waymo 昨日（7 月 29 日）发布博文，宣布为其 Ojai 自动驾驶汽车推出 Gemini in Waymo 和重新设计的车载界面。Waymo 称针对网约车场景从零设计 Ojai，希望把车舱打造为可由乘客自主使用的灵活空间，并计划近期邀请更多公众乘客体验 Ojai。在体验方面，Ojai 车舱内部署 Gemini in Waymo 对话式人工智能助手，乘客可通过屏幕或语音查询信息、调节部分车内设置，并请求靠边停车。乘客点击屏幕上的 Gemini 图标后，可通过语音调节车舱控制项、查看行程信息、了解 Waymo 服务或查询日常知识。例如，乘客可以说“把空调调到 65 华氏（18 摄氏度）”，也可以询问附近咖啡店的位置或地标历史。在功能方面，Gemini in Waymo 独立于 Waymo Driver 驾驶系统，乘客可通过语音提出靠边停车请求，但 Waymo 表示，Gemini 不控制车辆移动或路线，也无法访问实时驾驶数据。在车载体验方面，Waymo 称此次车载屏幕改版是其数年来首次重大界面更新。新界面突出行程信息、音乐控制，以及车厢和媒体设置菜单，目标是让乘客以更放松的方式乘车。IT之家附上相关视频如下：Ojai 配备 3 块屏幕，系统会根据座位显示不同内容。例如，右后座单人乘客可在面前屏幕上获得完整控制选项，其余 2 块屏幕可显示简化行程状态或环境式媒体播放器。系统还提供 Calm Mode，可将屏幕调暗，仅保留最少的行程信息。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/381.htm", "publishedAt": "2026-07-29T23:59:21+00:00"}, {"title": "深度对话：做AI的最佳伙伴：定义Token从“生产”到“应用”的确定性旅程", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/video/G3qIla4jAZtDLCGhqvKx?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-29T19:12:21+00:00"}, {"title": "深度访谈｜Agentic 时代，谁来重新定义数据库？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/video/r4pZtYkEzaYWlFlwJXTk?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-29T17:00:00+00:00"}, {"title": "超越OpenAI、Anthropic！国产AI安全智能体杀进全球前四、国内第一", "summary": "AI开始组团“挖漏洞”", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/462447.html", "publishedAt": "2026-07-29T08:13:03+00:00"}, {"title": "Apple 操作系统安全更新公告出现一串 AI 名字", "summary": "Apple 昨天推送了一批安全更新， const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
