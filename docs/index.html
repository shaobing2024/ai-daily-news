在原生几何纹理表征上，Hy3D 3.6 通过 VAE 将几何和纹理压缩为统一的稀疏潜在表示，再通过 DiT 生成与参考图相符的几何和纹理，让生成的资产在细节生动的同时，也能保留和谐的纹理贴图。在后训练阶段，通过多专家生产多样化偏好候选，结合优胜样本 SFT 与偏好数据 DPO 进行模型效果提升，让模型的产出能更加符合使用者偏好。目前，Hy3D 3.6 已经上线腾讯云 Token Hub，对外提供 API 服务。腾讯 AI 创意智能体 Miora、腾讯游戏旗下专业资产生成平台 LAP、专业影视 AI 平台 WorkRally 等也已接入，用户可在这些产品中直接使用。IT之家附使用入口：腾讯混元 3D 创作引擎（用户可免费体验 5 次 / 天）：https://3d.hunyuan.tencent.com/腾讯云 API 调用地址（新用户开通服务后可获得 100 积分免费体验额度）：https://cloud.tencent.com/product/ai3d", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/033/282.htm", "publishedAt": "2026-11-27T03:44:56+00:00"}, {"title": "深蓝汽车：2027 年华为引望星驰辅助驾驶开通订阅时，所有已售“AI 激光版”车辆免费 OTA 升级", "summary": "IT之家 11 月 27 日现场消息，在 11 月 26 日晚的 2026 华为乾崑生态大会上，华为智能汽车解决方案 BU CEO 靳玉志正式发布了华为星驰辅助驾驶系统。深蓝汽车董事长邓承浩现场透露，全新深蓝 S07 AI 激光版和即将上市的全新深蓝 L07 AI 激光版是行业首批搭载华为星驰驾驶辅助解决方案的车型。在今日的 2026 广州车展上，邓承浩宣布，2027 年华为引望星驰辅助驾驶正式开通订阅时，所有已售“AI 激光版”车辆均将免费 OTA 升级为星驰辅助驾驶解决方案。“早买早享受，早买才免费。”据介绍，这两台车是当前市面上唯一能体验星驰魅力的车型，当前已经硬件预埋，所有新老用户，明年都将通过 OTA 免费升级为正式的星驰辅助驾驶。功能方面，华为引望星驰辅助驾驶支持高速领航驾驶辅助、全场景辅助泊车、全维防碰撞系统。据IT之家此前报道，华为引望星驰辅助驾驶将只专注于辅助驾驶领域，与面向自动驾驶的乾崑智驾技术同源（WEWA 架构）、资源共享（云端训练算力 | 高质量训练里程数据）、流程 &amp; 质量（IPD 研发流程 | 车规质量管理体系）。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/033/280.htm", "publishedAt": "2026-11-27T03:39:17+00:00"}, {"title": "微软 Office 平替：Collabora Online 发现内存瘦身秘诀，内存占用最高直降 55%", "summary": "IT之家 11 月 27 日消息，科技媒体 NeoWin 昨日（11 月 26 日）发布博文，报道称伴随着 AI 的深度运用，开源社区涌现了大量微软 Office 平替项目，除了 WordCraft、GridCraft 和 DeckCraft，以及 Starling Office 之外，最新 Collabora Online 项目宣布在内存占用方面取得巨大突破。Collabora Online 是一款基于云端的在线办公套件，基于 LibreOffice 技术构建，作为 Microsoft 365 的可自托管替代方案，可以让用户在浏览器中创建、查看和多人实时编辑文字、表格、演示文稿及矢量绘图。Collabora 团队指出在原有架构中，Collabora Online 为了提升隔离性和稳定性，为每个打开的文档创建一个独立进程（称为 kit）。这样，某个文档崩溃或异常后，通常不会影响其他文档。但如果每个 kit 都完整加载一次办公套件，内存开销会非常高。因此，Collabora 使用一个父进程 forkit，先加载一次办公软件，再通过 Linux 的 fork 创建各个文档进程；这些子进程最初与父进程共享同一份只读内存。Linux 使用写时复制（Copy-on-Write，COW）来节省内存：父进程和子进程起初共用同一物理内存页，只有当某个子进程要修改该页中的数据时，内核才会为它复制一份独立页面。理想情况下，所有 kit 都能共享 forkit 中不变的基础代码、字体、配置和初始化数据，只有真正被修改的数据才需要复制。问题在于，Linux 通常以 4 KB 为单位管理内存页。即使某个文档进程只修改了共享内存页中的几个字节，操作系统也必须为该进程复制整个 4 KB 页面。Collabora 开发者梅文 · 卡尔解释称，forkit 在创建和丢弃临时数据后，会在已分配内存中留下许多细小空隙；当文档进程随后使用这些空隙时，就会触发不必要的整页复制。Collabora 的解决办法，是在创建第一个文档进程之前，先在父进程 forkit 中把这些空隙填满。这样一来，各个文档进程的新数据会被分配到全新的内存页，而原本可共享的内存页则保持完整，从而避免被“污染”后反复复制。这项操作听起来会增加内存占用，但由于这些空隙本来就存在于 forkit 已分配的内存范围内，填充操作只是改变了内存的分配方式。据 Collabora 介绍，该操作只需在服务器启动时执行一次，耗时约 11 毫秒；在测试中，即使创建了 160 个文档进程，父进程的内存占用也没有增加。Collabora 在一台配备 4 核处理器、8 GB 内存的服务器上，模拟 10 名用户同时打开并编辑文档。结果显示，空白文本文档的单份内存占用由 53.9 MB 降至 24.4 MB，降幅约为 55%；普通 Writer 文档由 73.6 MB 降至 47.8 MB，降幅约为 35%；Impress 演示文稿由 72.1 MB 降至 50.3 MB，降幅约为 30%。文档类型优化前每份内存优化后每份内存降幅空白文本文档53.9 MB24.4 MB约 55%Writer 文档73.6 MB47.8 MB约 35%Impress 演示文稿72.1 MB50.3 MB约 30%Collabora 估计，在同时服务约 1000 名用户的高负载服务器场景下，这项优化最多可节省 25 GB 内存。在内存成本持续上涨的背景下，这对需要承载大量在线文档编辑任务的企业、学校及云服务提供商而言，意味着更低的硬件成本和更强的并发承载能力。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/033/236.htm", "publishedAt": "2026-11-27T03:15:17+00:00"}, {"title": "零跑全新 Lafa5 上市：限时 10.28 万-12.88 万元，全域 800V 加持", "summary": "IT之家 11 月 27 日消息，在今天（27 日）上午开幕的 2026 广州车展期间，零跑全新 Lafa5 正式上市。新车提供 5 款不同配置，官方指导价区间为 10.58 万-13.18 万元，上市限时优惠价 10.28 万-12.88 万元。IT之家从官方介绍获悉，新车将迎来多项升级，拥有全域 800V+3C 快充、50 英寸虚实融合 AR-HUD、前排双零重力座椅、标配 FSD 可变阻尼减振等配置。新车长 4430/4490mm（工信部数据），宽 1880mm，高 1510mm，轴距 2735mm，拥有无框车门、纯平侧窗，Ultra 车型还增加个性化的前铲、侧裙、尾翼和尾部扩散器等外观件。该车升级 69.7kWh 大电池，实现 640km CLTC 纯电长续航；配备激光雷达 + 高通 8650 高阶辅助驾驶，拥有 28 个智能感知硬件、端到端大模型、40 项辅助驾驶功能；全域 800V 高压平台 +3C 快充，SOC 30-80% 快充仅需 16 分钟。该车标配 FSD 可变阻尼减振，兼顾滤震舒适与过弯支撑；搭载六合一高性能电驱，最大功率 185kW，实现 6.06 秒零百加速；中欧底盘团队联合调校，50:50 前后黄金轴荷比；LMC 一体化运动融合控制技术，支持运动融合控制、120km/h 爆胎稳定、动态转向辅助、高速预稳定控制等。安全方面，该车还支持 4-130km/h 紧急制动辅助 AEB、80-130km/h 紧急转向辅助 AES、误加速抑制 MAI 系统等。新车采用 9 横 7 纵硬核安全笼式车身设计，高强钢占比 77.5%，扭转刚度 34500N.m/deg；CTC2.0 Plus 电池底盘一体化，号称“热失控后 48 小时不起火不爆炸”。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/033/224.htm", "publishedAt": "2026-11-27T03:11:22+00:00"}, {"title": "蚂蚁百灵 Ling-3.2-air 开源发布，提升编程、智能体与多模态能力", "summary": "蚂蚁百灵发布并开源了新一代大模型：Ling-3.2-air，1240 亿总参数，每个 token 只激活 55 亿。 先看这个稀疏度 是行业内首次将底盘域、动力与控制合二为一的技术突破，将驱动、制动、转向系统与驾驶动态控制集成于单一中央单元，实现毫秒级协同响应。新世代 i3 搭载的“无感刹停”功能，被宝马称为解决了汽车行业一百多年的痛点。通过驾控超级大脑统筹动力、制动与能量回收，98% 驾驶场景下无需机械制动介入，减速不点头、无顿挫，最高 10 万公里无需更换刹车片。这一功能在拥堵城市路况中尤为实用，极大提升了驾乘舒适性。新世代 i3 搭载与 Momenta 联合开发的智能驾驶辅助系统，基于本地化大模型，提供 L2 级“点到点”全场景辅助。宝马强调一个核心坚持：智能驾驶可以很聪明，但决策者始终是驾驶员。在智驾模式下，驾驶员依然可以打方向、踩油门，非紧急刹车系统仍会默契配合，不会退出。宝马在发布会上强调“六边形”均衡理念：不能为了续航妥协操控，也不能为了极致参数妥协安全。新世代 i3 取消传统模组，将电池包融入车身结构，电池更薄、重心更低、车身刚度更高。电池采用圆形钢壳受力更均匀，底部定向泄压、热电分离，能量质控系统实时监控。交付前需完成高于行业标准的充放电循环寿命测试，确保电池持久可靠。座舱搭载 BMW 首创的 43.3 英寸全景 iDrive 视平线显示系统，配合 17.9 英寸无边框中控屏和 3D 抬头显示，以 \" 视觉锥 \" 交互理念将关键信息呈现于眼前。车机接入 AI 大模型，支持 BMW AI 个人助理，并兼容 Apple CarPlay 和 HUAWEI HiCar。动力方面，新世代 i3 基于全域 800V 高压架构打造，搭载第六代 eDrive 单电机电驱系统，电机最大功率 235 千瓦，0-100km/h 加速 4.7 秒，最高时速 200km/h；电池为 108kWh 宁德时代三元锂电池组，CLTC 续航最长 1028km，实测极限续航更达到 1213 公里，创造了 BMW 车型有史以来最长的单次纯电行驶里程纪录。新世代 BMW i3 展车将在正式上市后陆续到店，消费者可前往体验试驾。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/033/206.htm", "publishedAt": "2026-11-27T02:25:50+00:00"}, {"title": "微软 AI 负责人警告：我们正跨越 AI 危险门槛，安全和对齐是当前最重要任务", "summary": "IT之家 11 月 27 日消息，微软 AI 负责人穆斯塔法 · 苏莱曼（Mustafa Suleyman）于 11 月 25 日在 X 平台发布推文，示警称 AI 行业“正在跨越一个门槛”，安全与对齐研究必须被置于优先地位。IT之家附上相关推文截图如下：根据推文的上下文内容，苏莱曼推文的“门槛”是指 AI 能力即将越过人类能有效监督、控制和安全部署的边界。在 AI 开始具备自主发现漏洞、跨系统操作、隐藏真实推理、甚至规避安全护栏的能力时，行业不能再用“等它更聪明后再处理”的方式应对，必须先把安全与对齐机制补上。苏莱曼主张认为在实现真正的“对齐”之前，必须优先做到“遏制”，从而确保人类始终能限制模型能力。这条警告的背景，是黎曼猜想证明事件与多起 AI 安全测试事件叠加：一方面，AI 展现出解决极难数学问题的能力；另一方面，它也展现出突破沙箱、利用漏洞、获取权限等真实风险。IT之家注：对齐（AI alignment）是人工智能安全中的核心概念，指让 AI 系统的目标、行为和判断符合设计者与人类社会的意图、价值观和规则。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/033/191.htm", "publishedAt": "2026-11-27T01:59:29+00:00"}, {"title": "前苹果空间智能首席科学家权龙再创业，成立 Envision AI 研发空间物理基础模型", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/3rQ4aRqts2zywSBmeJvb?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-26T11:00:08+00:00"}, {"title": "从语音基座到语音应用：讯飞语音大模型能力全解", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.c const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
