const DATA = {"date": "2026-10-15", "generatedAt": "2026-10-15T01:11:32Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "Linux 之父托瓦兹推出首个 AI 辅助开发的补丁：并发文件读取吞吐量提升约 3 倍", "summary": "IT之家 10 月 15 日消息，科技媒体 lwn 昨日（10 月 14 日）发布博文，报道称 Linux 之父林纳斯 · 托瓦兹（Linus Torvalds）在其个人 Git 仓库中推送了一个名为 noref-filemap-read-with-llm 的新开发分支，正式提交了他首个由大语言模型（LLM）辅助开发的内核补丁系列。该媒体指出在通常情况下，在 torvalds / linux.git 仓库中，托瓦兹只维护 master 分支，很少在分支上开发，不过在最新出现 noref-filemap-read-with-llm 分支，且后缀包含“llm”，这是他在人工智能 / LLM（特别是 Claude Code）的帮助下进行的一些内核改进。托瓦兹于 10 月 13 日在该分支下提交新的补丁，主题为“提高页面引用计数可扩展性”，主要解决 Linux 内存管理长期瓶颈。在多个线程同时高频微量读取同一个文件时候，传统机制因反复触发表级缓存（Page Cache）的引用计数更新，极易导致多核 CPU 产生严重竞态争抢。托瓦兹坦言，这组补丁的核心代码、测试程序、漏洞审查以及公告文档的初稿，全部是在他本人的亲自指导下，由 Anthropic 推出的 AI 编程工具 Claude Code 协作完成的。托瓦兹在关闭其电脑的部分安全防护后测试，在 8 个线程同时读取同一个文件的特定测试负载下，读取吞吐量从原本的每秒 990 万 ~1040 万次，直接跃升到了 3000 万 ~3300 万次（相当于从约 10M 飙升至 30M+），性能提升约 3 倍；同时，单次读取消耗的内核时钟周期也从大约 2950 次锐减至 725 次。IT之家注：该补丁目前仍处于实验性分支，尚未合入 Linux 7.4 的正式主线。不仅如此，在近期维护者峰会（Maintainers Summit）及另一处 assoc_array 代码库清理中，托瓦兹同样利用 LLM 将晦涩难懂的陈旧代码重构，甚至一口气揪出了藏匿在 Linux 系统中长达 13 年之久（可追溯至 2013 年首个提交）的 3 个隐蔽 Bug。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/171.htm", "publishedAt": "2026-10-15T00:34:52+00:00"}, {"title": "YouTube Music 给音乐打 AI 标签，用户听歌可看清“成分表”", "summary": "IT之家 10 月 15 日消息，YouTube 昨日（10 月 14 日）发布公告，为了提高在音乐作品使用 AI 的透明度，宣布其音乐平台 YouTube Music 上线 AI 音乐标注功能，后续将同步扩展至主 YouTube 应用程序。根据 YouTube 官方公告，当一首歌曲被识别为“主要使用生成式 AI 创作”（例如使用 AI 模型生成曲调、编曲或合成人声）时，歌曲名称下方、靠近艺人或频道名称的位置，将会出现一个明显的“AI”椭圆形标签。IT之家附上相关图片如下：听众在收听时可以直接看到该标记。若点击此 AI 标签，系统会进一步弹出详细菜单，向用户说明这首歌是如何使用 AI 的，帮助用户更清晰地了解正在聆听的内容。在 AI 音乐标签方面，标注系统结合了音乐合作伙伴的主动申报与 YouTube 平台自身的 AI 检测工具。创作者在交付音乐数据时，需要选择以下三种精细化类别：完全由生成式 AI 创作 (Fully Gen AI)：指完全通过文字提示词生成，或整首歌曲的作词、作曲、乐器演奏及人声皆由生成式 AI 模型完成的曲目。部分使用生成式 AI (Partly Gen AI)：涵盖音乐人自主录音或现场演奏，但使用 AI 辅助生成背景和弦、某段旋律、歌词构思或音效的情况。未使用生成式 AI (No Gen AI)：正常的传统音乐制作。值得注意的是，使用 Auto-Tune 等音高修正软件或自动化母带平衡软件，将被归类于“未使用 AI”。如果上传方未主动进行申报，YouTube 的内部检测系统也会利用多种技术信号自动进行判别与标记。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/168.htm", "publishedAt": "2026-10-15T00:09:24+00:00"}, {"title": "彭博社：苹果有望 12 月随 iOS 27.3 在国内推出首波 Apple Intelligence 功能", "summary": "IT之家 10 月 15 日消息，彭博社的马克 · 古尔曼（Mark Gurman）今天（10 月 15 日）在 X 平台发布推文，报道称苹果公司计划于 12 月通过 iOS 27.3 更新，在中国大陆首次推出 Apple Intelligence，这是该 AI 平台首度落地中国市场。IT之家附上相关截图如下：首波功能包括 Genmoji 自定义表情、通知摘要、写作工具，以及照片应用中的 Clean Up 功能（支持用户从照片中移除特定物体）。新版 Siri AI 助手、图乐园生成工具及较新版本 Genmoji 均不在首波范围内。中国大陆版本将接入阿里巴巴的 AI 模型，包括通义千问（Qwen）与通义万相（Tongyi Wanxiang）。苹果已于 9 月 29 日获得中国监管许可，允许近期 iPhone 支持使用 Apple Intelligence 及上述模型。相关阅读：《苹果 iPhone 15 Pro 及后续机型国行版备案大模型编号：Apple 智能、通义万相、通义千问》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/162.htm", "publishedAt": "2026-10-14T23:45:18+00:00"}, {"title": "美国 8 州起诉 OpenAI，指控 ChatGPT 指导青少年如何自伤或伤害他人", "summary": "IT之家 10 月 15 日消息，据路透社报道，当地时间 14 日，美国 8 个州宣布分别在各自州法院起诉 OpenAI，指控 ChatGPT 伤害当地居民，甚至指导包括青少年在内的用户如何伤害自己或他人。艾奥瓦州、堪萨斯州和亚利桑那州等 8 个州的总检察长分别提起诉讼，指控 ChatGPT 刻意迎合用户、吸引他们持续互动，以获取信任。诉讼文件称，ChatGPT 不仅会强化用户的妄想、鼓励危险行为，还会帮助用户策划大规模枪击等暴力活动。除艾奥瓦州、堪萨斯州和亚利桑那州外，参与诉讼的还有阿肯色州、爱达荷州、蒙大拿州、内布拉斯加州和西弗吉尼亚州。各州还要求对 OpenAI 涉嫌违反州法律的行为处以民事罚款，并要求公司赔偿损失。这是美国各州迄今针对人工智能公司规模最大的协调诉讼行动，也使 OpenAI 在准备上市之际又要面临新的法律挑战。今年 6 月，佛罗里达州总检察长就曾率先提起同类诉讼。8 个州指控 OpenAI 隐瞒或误导用户对 ChatGPT 安全性的认识，违反州消费者保护法，并认为 ChatGPT 危及当地居民健康，构成公共妨害。各州要求法院责令 OpenAI 修改 ChatGPT 的运行机制。其中一项诉求是，除非 OpenAI 能够确保具备自我改进能力的 AI 模型符合人类价值观，否则不得继续开发此类模型。OpenAI 发言人未立即回应置评请求。IT之家从报道中获悉，OpenAI 还面临数十起个人诉讼，原告同样指控 ChatGPT 曾帮助用户策划大规模枪击或其他暴力活动。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/160.htm", "publishedAt": "2026-10-14T23:39:08+00:00"}, {"title": "SpaceXAI 发布 Grok Voice 3.0：号称全球最智能的语音模型，延迟低于 1 秒", "summary": "IT之家 10 月 15 日消息，SpaceXAI 今日发布了 Grok Voice 3.0，官方称这是全球智能水平最高的语音转语音模型。该模型在客服电话处理任务上创下新纪录，拥有业界领先的低于 1 秒延迟，运行成本也低于其他前沿模型。Grok Voice 每天在特斯拉和 SpaceX 支撑数百万次对话，现已通过应用程序接口上线，定价与上一代产品保持一致。在 Artificial Analysis 的独立测试中，Grok Voice 3.0 在语音转语音综合榜单中排名第一，得分 86.9。该榜单综合评估语音推理能力、τ-Voice 指标，以及盲测通话对比下的偏好度与任务完成率。Grok Voice 3.0 在全双工基准测试中拿到 97% 的分数，这项指标用来衡量模型处理停顿、对话轮替和插话的自然程度。τ-Voice 用于评估智能体在客服通话场景下，应对各类口音、背景噪音以及中途插话的能力。Grok Voice 3.0 得分为 71.6%，性能与 GPT-Live-1（Astra）相当，但延迟降低 40%，在智能体的智能水平与响应速度之间开辟了新的最优平衡点。官方称，其运行成本也低于同级别模型。Artificial Analysis 在大型音频基准测试中统计各模型完成任务的开销，Grok Voice 3.0 的成本低于 GPT-Live-1（Astra，中等版本）以及 GPT-Realtime-2.1。在 ServiceNow 面向企业语音智能体的 EVA 基准测试中，Grok Voice 3.0 取得 74% 的最高精度得分，在综合精度与客户体验两项指标的联合评分里表现最优。官方称，Grok Voice 3.0 每天在特斯拉车辆内处理数百万次对话。驾驶员可以通过 Connectors 完成查询日程、回复邮件这类简单指令，也能借助 Grok Bot 完成下单咖啡、预订晚餐等复杂任务，全程无需动手。Grok Voice 3.0 同时为 Grok Bot 的语音模式提供支持。星链客服中心依托 Grok Voice，每天使用多种语言承接 2 万通客户来电。大约 70% 的来电无需人工介入即可解决，四分之一的销售通话在客户挂断前就能促成下单。基于 Grok Voice 3.0 搭建的单个智能体，就可以完成客户身份核验、硬件故障排查、发放退款以及补发设备等工作。Grok Voice 3.0 现已在语音智能体应用程序接口上线，价格为每分钟 0.08 美元（IT之家注：现汇率约合 0.54 元人民币）（每小时 4.8 美元（现汇率约合 32.2 元人民币）），与 Grok Voice 2.0 定价相同。使用 grok-voice-latest 版本的智能体已完成自动升级，无需任何改动。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/159.htm", "publishedAt": "2026-10-14T23:35:09+00:00"}, {"title": "OpenAI 承诺不使用苹果所称被窃商业秘密，双方诉讼互指对方窃取机密", "summary": "IT之家 10 月 15 日消息，据彭博社报道，在两家公司的法律纠纷审理期间，OpenAI 同意不使用苹果公司所称、由从苹果跳槽至这家人工智能初创企业的员工盗取的商业秘密。这家 ChatGPT 开发商在当地时间周三的法庭听证会上主动做出上述承诺。联邦法官在听证会上表示，他“极有可能”支持苹果，向 OpenAI 发布禁令。美国地区法官爱德华 · 达维拉（Edward Davila）有权执行这份协议，协议还要求 OpenAI 收集 14 名员工设备中可能包含苹果机密信息的取证图像。对 OpenAI 而言，这份协议使其避免了在与苹果的首次实质性法庭交锋中直接败诉带来的负面影响。萨姆 · 奥尔特曼（Sam Altman）执掌的这家初创企业，在苹果 7 月提起的诉讼中遭到指控。苹果称 OpenAI 密谋窃取和在研产品相关的知识产权，并利用这些信息推进自身竞品设备的研发工作。实际上，这份协议基本满足了苹果向达维拉提出的核心诉求，也就是确保 OpenAI 不得在自身技术研发中使用苹果的专有信息。这场听证会在加利福尼亚州圣何塞举行。法官表示，他不会全盘满足苹果的诉求，并称苹果提出的对所有存有苹果商业秘密的设备和存储库开展取证调查的要求，听起来“要求过高”。苹果的律师约翰 ·M· 德马赖（John M. Desmarais）回应称，公司会将调查范围限定在少数跳槽至 OpenAI 的员工。他说：“法官大人，他们并非有四百名问题员工，只是少数几人，而且清楚是哪些人。”尽管双方两年前达成合作，将 ChatGPT 整合进苹果软件，但两家公司的矛盾已经持续数月。数百名苹果员工跳槽加入 OpenAI，纠纷由此爆发。眼下 OpenAI 正冲击 1.4 万亿美元（IT之家注：现汇率约合 9.39 万亿元人民币）估值、筹备上市，这场官司也给这家初创企业蒙上一层阴影。苹果在诉状中指控，OpenAI、其硬件负责人以及一名前苹果 iPhone 硬件工程师合谋，从前苹果员工处获取产品设计、制造、元器件技术、测试方法和供应链相关的机密信息。苹果主张，OpenAI 正在利用这些信息“推进自身进军消费硬件市场的计划”。OpenAI 坚决否认相关指控。这家初创企业认为，苹果提起诉讼是为了限制员工跳槽至竞争对手，还试图把“普通求职面试定性为窃取商业秘密的行为”。OpenAI 在 10 月提交的一份法庭文件中表示：“OpenAI 正在开发面向人工智能时代的全新系列设备。OpenAI 没有必要、也无意获取苹果的商业秘密。”彭博社曾报道，OpenAI 首款消费硬件产品是一款环形智能音箱，售价超过 300 美元（现汇率约合 2,012 元人民币）。公司内部人员认为，这是一款全新的以人工智能为核心的设备，和苹果即将推出的任何产品都不一样。周三听证会开始前数小时，OpenAI 反过来对苹果提出指控。在一份法庭文件中，OpenAI 称一名先从苹果跳槽到 OpenAI、之后又重返苹果的前员工，把至少一款尚未发布的 OpenAI 设备的“上百份高度机密文件”发送到个人账号。OpenAI 表示，这些文件包含未发布硬件的图片、工程与制造数据以及供应商信息。文件还称，这名前员工曾向苹果高管展示 OpenAI 的产品方案。OpenAI 请求法官给予时间，调查苹果是否持有或使用这些信息；如果属实，允许该公司提起反诉。苹果对此回应称，公司已有相关制度防止使用前雇主的机密信息，没有发现能够佐证 OpenAI 指控的证据，这家 AI 企业只是试图转移视线，掩盖其员工带走苹果产品资料的“大量证据”。本案案号为 Apple 诉 Liu 案，5:26-cv-07078，美国加利福尼亚北区联邦地区法院（圣何塞）。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/157.htm", "publishedAt": "2026-10-14T23:26:41+00:00"}, {"title": "OpenAI 和 Anthropic 被欧盟调查，若认定违反 AI 法案最高罚全球 3% 营业额", "summary": "IT之家 10 月 15 日消息，欧盟委员会人工智能办公室已向 OpenAI 和 Anthropic 发出信息调取请求，正式对两家公司在前沿模型测试期间发生的“模型越狱”及入侵外部真实系统事件展开调查。这是欧盟《人工智能法案》（EU AI Act）自实施以来，面对前沿人工智能实验室安全事故的首次重要执法考验。IT之家查询相关资料，此次调查源于数月前发生的两起 AI 安全事件：OpenAI 模型越狱：在 ExploitGym 内部评测中，OpenAI 的测试模型为破解测试题，利用了一个此前未知的软件包缓存智能体漏洞取得互联网访问能力，继而在内部测试网络中提升权限、横向移动，最终“逃出沙箱”入侵了开源平台 Hugging Face 的真实服务器。Anthropic 模型越狱：Anthropic 的 Claude Mythos 和 Opus 4.7 在安全测试中突破限制，入侵了 3 个外部组织的真实网络。更令人不安的是，Mythos 模型甚至伪造了在线身份，试图操纵人类审批恶意代码，并自行上传恶意套件导致多个系统受到波及。欧盟人工智能办公室表示，此前两家公司自愿提供的说明材料不足以解释事件的严重性。因此，欧盟正式要求企业说明安全措施、外部评估以及模型使用监控等详细情况。目前阶段属于调查和取证阶段，尚未公布最终的违规认定或处罚结果。根据《人工智能法案》的惩罚机制，前沿 AI 实验室若被认定存在重大安全疏漏或违规，最高可面临全球年营业额 3% 的巨额罚款。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/154.htm", "publishedAt": "2026-10-14T23:13:18+00:00"}, {"title": "消息称 Anthropic 第三季度营收达 168 亿美元，已实现调整后盈利", "summary": "IT之家 10 月 15 日消息，据彭博社报道，知情人士透露，人工智能模型企业 Anthropic PBC 向潜在投资者表示，公司第三季度营收达到 168 亿美元（IT之家注：现汇率约合 1,126.44 亿元人民币），这家企业正继续推进上市计划。知情人士称，开发 Claude 的 Anthropic 于当地时间周三在旧金山总部举办了推介会，向投资者说明，公司在该季度实现了调整后盈利。知情人士表示，截至第三季度，Anthropic 已经实现正向自由现金流，调整后毛利率为 85%，调整后营业利润率超过 11%。Anthropic 预计最早在 11 月 9 日那一周正式启动首次公开募股的路演工作，有望在感恩节前挂牌交易，预计年内完成上市。知情人士表示，相关讨论仍在进行，时间安排仍有可能变动。Anthropic 在今年大部分时间里发展势头强劲，但如今再度面临来自 OpenAI 等企业的竞争压力，双方在争夺更高估值的赛道上不相上下。接连发生多起由恶意智能体引发的重大黑客事件后，两家企业都处在公众对人工智能安全日益严格的审视之下，外界愈发担忧这会对 Anthropic 的首次公开募股产生潜在影响。Meta 近期推出了一款人工智能模型，称该模型相比自家前代产品实现重大突破，也成为投资者需要关注的又一竞争对手。Meta 表示，Muse Wonder 在代码编写、处理金融或法律问题方面的能力，已经可以比肩 OpenAI 的 ChatGPT 与 Anthropic 的 Claude。投资者对 Anthropic 最新经营数据的反馈，将对本次上市进程起到关键作用。部分投资者在周三会议前就表示，该公司合理估值区间大约在 1.8 万亿至 2 万亿美元（现汇率约合 12.07 万亿至 13.41 万亿元人民币）。彭博社报道称，Anthropic 期望本次上市规模能够达到甚至超过 SpaceX 的首次公开募股。彭博社 8 月报道，Anthropic 在 2025 年净亏损近 420 亿美元（现汇率约合 2,816.11 亿元人民币），较上一年约 83 亿美元（现汇率约合 556.52 亿元人民币）的亏损规模增长约四倍。彭博社查阅的文件显示，该公司 2025 全年营收约 46 亿美元（现汇率约合 308.43 亿元人民币），相比前一年的 3.86 亿美元（现汇率约合 25.88 亿元人民币）大幅增长，但营业亏损扩大至 80 亿美元（现汇率约合 536.4 亿元人民币）以上。Anthropic 坚持推进上市，与全球新股市场接连出现推迟、搁置的行情形成反差。数据中心运营商 AirTrunk 将旗下房地产投资信托基金在新加坡的首次公开募股推迟至明年；而就在这一消息发布数日前，澳大利亚数据中心企业 Firmus 的上市计划宣告失败。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/153.htm", "publishedAt": "2026-10-14T23:10:11+00:00"}, {"title": "涉嫌在高管会议室安装窃听设备的 OpenAI 沙特籍工程师，被曝已买好回家的单程机票", "summary": "IT之家 10 月 15 日消息，据《商业内幕》今天（15 日）凌晨报道，美国联邦检察官披露，涉嫌在 OpenAI 办公室秘密安装录音设备的前工程师、沙特阿拉伯籍男子阿卜杜勒拉赫曼 · 阿尔福赞，曾预订返回沙特阿拉伯的单程机票。最新解封的法庭文件显示，美国联邦政府曾担心案件消息走漏，影响对阿尔福赞的起诉。加州北区联邦检察官克雷格 · 米萨基安等人在 10 月 8 日提交的法庭文件中提到：“被告、他的妻子和另一名家庭成员预订了 2026 年 10 月 12 日星期一从旧金山出发、经伊斯坦布尔飞往沙特阿拉伯的单程机票。”检方担心，如果阿尔福赞在被捕前得知自己受到调查，他有能力提前离开美国，也有逃离美国的动机。据IT之家了解，美国联邦调查局于当地时间 10 月 9 日逮捕阿尔福赞。当地时间 14 日，他首次出庭，美国政府正式公布了针对他的指控。阿尔福赞涉嫌使用电子、机械或其他设备窃听他人谈话，面临一项重罪指控，最高刑期为 5 年。根据刑事起诉书，OpenAI 在一间高管会议室的电视机背面发现了一个秘密安装的 USB 设备，外面包裹着卫生纸，以掩盖设备的存在。OpenAI 的声明称：“我们利用自己的模型分析设备及其来源，最终查明是一名员工在几天前安装了该设备。”相关阅读：《在高管会议室偷偷安装录音设备，OpenAI 一沙特籍工程师被 FBI 逮捕》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/151.htm", "publishedAt": "2026-10-14T23:04:53+00:00"}, {"title": "英特尔面向四至六代至强处理器推出推理微服务：自动检测硬件并配置 vLLM 参数", "summary": "IT之家 10 月 14 日消息，英特尔今日宣布推出 Intel Inference Microservices 服务，这是一套面向大语言模型推理的容器化微服务方案，目标是让企业在已有的至强处理器上直接获得经过调优的模型推理能力，无需再花费数天时间进行手动硬件优化。在该模式下，每个微服务都是一个独立容器，通过 OpenAI 兼容 API 对外提供单个模型的服务，并在启动时自动检测所在的英特尔处理器型号，应用英特尔针对该模型和该硬件预先验证过的配置参数。英特尔指出，让大语言模型给出回复并不困难，难的是在既有硬件上稳定、高质量地重复这一过程。精度设置、计算任务在核心之间的分配方式、内存跨 NUMA 节点的布局，以及推理引擎使用哪些指令集，都取决于模型本身和底层处理器。更换模型，合适的参数就变了；迁移到另一代芯片，参数又需要重新调整。英特尔推理微服务旨在将这一调优过程封装在容器内部 —— 用户选择模型，容器负责选择设置。首批版本基于 vLLM 引擎，支持 BF16 精度，可在 Docker 或 Kubernetes 1.24 及以上环境中运行，硬件要求为第四代、第五代或第六代英特尔至强处理器，建议配置 32GB 内存。启动时，容器会检查主机的处理器代数、分配到的核心数量、NUMA 节点数量以及处理器内置的加速器。英特尔特别强调了最后一项：近期至强核心内置了专门用于推理计算的引擎，包括用于矩阵乘法的英特尔高级矩阵扩展和用于周边计算的 AVX-512、AVX2 及 VNNI 向量扩展。这些加速器已经存在于用户现有的芯片中，但只有推理引擎知道它们存在并正确配置时才能发挥作用。检测完成后，容器会选择经过验证的配置档案，解析调优后的引擎参数，缓存权重，并在指定端口启动推理服务。对于运行特定模型镜像的用户，如果主机未被识别，容器会在启动时报错，而不是静默地以未调优状态运行。基础镜像则默认启用配置回退，在无匹配模型专用配置时，会采用与硬件兼容的通用配置。用户还可以通过命令行查看容器检测到的硬件信息和将要执行的 vLLM 命令，例如运行 detect-hardware 或 dry-run --format json 进行预检。这并非英特尔首次涉足推理微服务领域。今年 9 月，英特尔开发者页面已介绍过 Intel AI for Enterprise Inference，一套面向至强处理器的开源 LLM 服务栈，同样基于 vLLM 架构。此次发布的推理微服务可以视为将这一能力进一步产品化、容器化，并纳入统一的推理接口蓝图之中。英特尔在新闻稿中将当前版本定位为“迈向英特尔硬件统一推理的第一步”，明确表示这只是一个起点：至强处理器是开始的地方，而不是结束的地方。随着产品组合扩展到英特尔 GPU，包括代号 Crescent Island 的数据中心推理 GPU，同一微服务模式将延伸至 GPU 平台，变化的只是被选中的配置档案，应用程序所面对的接口保持不变。这意味着用户今天基于至强构建的推理工作负载，未来迁移到英特尔 GPU 时，只需更改部署配置，而无需重写应用程序或重新进行调优。本次发布还包含一个值得注意的细节：微服务提供的接口刻意独立于底层芯片。一个模型对应一个容器，OpenAI 兼容 API 暴露在已知端口上，运行时自动检测平台并应用英特尔验证过的配置。这种稳定性并非打包层面的技巧，而是因为底层的优化工作被贡献到了开源上游项目中，而非锁定在厂商专属工具包内。英特尔调优后的容器仍然是一个标准的 OpenAI 兼容端点，而不是必须采用的 SDK。英特尔计划在后续版本中增加 Helm Chart、Kubernetes Operator、更多推理引擎和精度支持。目前工具调用和结构化输出功能可作为 vLLM 的透传能力使用，但尚未被验证为正式支持的能力。每个模型附有各自的许可证，用户需自行确保部署行为符合许可条款。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/130.htm", "publishedAt": "2026-10-14T15:13:57+00:00"}, {"title": "从大模型到 Agent 落地，这场大会讲透 AI 全链路", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/PuGS7Qxy4AFOal4wVR22?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-14T14:52:06+00:00"}, {"title": "无标线、无信号灯、车流激进：小鹏 NGP 官宣成功挑战被称为“全球最难环岛”的凯旋门环岛", "summary": "IT之家 10 月 14 日消息，小鹏集团董事长、CEO 何小鹏今日宣布，在巴黎，开着小鹏 NGP 成功挑战了被称为“全球最难环岛”的凯旋门环岛。没有车道线，也没有红绿灯，12 条大道交织汇入，既要判断复杂车流、遵守法国“让右”规则，还要避让站在路中拍照的行人，确实很有挑战性。从 7 月德国本地化验收，到荷兰水网交织的复杂小路，再到“全球最难环岛”凯旋门，难度层层升级。小鹏 NGP 在不同国家、不同交通法规和道路环境中不断锤炼，模型泛化能力也在实战中持续提升、越来越强。据IT之家此前报道，在巴黎车展前夕，小鹏汽车通用智能中心负责人刘先明接受采访时透露，该公司成功在约两周时间内，将智驾系统从一个欧洲国家微调适配到另一个欧洲国家。刘先明介绍称，小鹏目前正与欧洲监管机构紧密沟通，并维持在 2027 年于欧洲正式落地智能导航辅助驾驶系统（NGP）的原定规划。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/118.htm", "publishedAt": "2026-10-14T14:25:24+00:00"}, {"title": "消息称 Nothing 将推两款智能眼镜：音频版、摄像头版，后者支持 ChatGPT", "summary": "IT之家 10 月 14 日消息，据消息人士 Roland Quandt 今日透露，Nothing 将推出两款智能眼镜。其中一款主打音频功能，另一款配备摄像头。据介绍，Nothing 的音频版智能眼镜支持播放音乐、通话，用户可通过眼镜与手机的语音助手交互。该产品将配备光致变色镜片，可在阳光下自动变暗、室内自动变亮。同时，该公司还计划推出另一款智能眼镜。该产品将拥有摄像头，支持 ChatGPT、翻译功能。IT之家了解到，彭博社此前报道称，Nothing 的智能眼镜将通过手机和云端处理 AI 任务，不会配备 AR 显示屏。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/112.htm", "publishedAt": "2026-10-14T14:01:41+00:00"}, {"title": "PS5 越狱商店 Overdrive 被索尼勒令关停后，克隆版本数小时内重新上线", "summary": "IT之家 10 月 14 日消息，索尼 SIE 已开始对 PS5 越狱开发者采取法律行动，一个名为 Overdrive 的游戏商店已被关闭。不过，原项目关闭后，GitHub 上随即又出现了两个新的仓库，分别为原项目的分支版本和使用不同账号发布的克隆版本。X 用户 Oliver Darko 反馈称，索尼互动娱乐的律师已向 Overdrive 开发者发送停止侵权函，该商店目前已下架，其 GitHub 页面显示 404 错误。IT之家注：Overdrive 是一个面向已越狱 PS5 主机的非官方游戏商店，于 10 月 9 日在 GitHub 上发布，提供超过 1600 款 PS4 和 PS5 游戏的免费下载，界面类似于 PlayStation Store，但所有游戏均为免费，库中包含《黑神话：悟空》《漫威蜘蛛侠 2》和《赛博朋克 2077》等作品。据 Notebookcheck 报道，自制软件内容创作者 Edigax 于 10 月 11 日在 X 上发布了一段 Overdrive 的实际运行视频，该视频随后被 RinoTheBouncer 等账号转发，播放量达到约 700 万次。配合 ShadowMountPlus 等工具使用时，Overdrive 下载的游戏可直接出现在 PS5 主屏幕上。Overdrive 的走红与 PS5 越狱社区近期的活跃直接相关。9 月底，一个名为 Relapse 的公开越狱工具发布，支持固件版本 7.00 至 13.60 的 PS5 和 PS5 Pro 主机，大幅扩展了可越狱设备的范围。此后，PS5 越狱社区涌现出大量自制应用，包括模拟器、启动器和串流工具，甚至还有人在 PS5 上实现了原生运行 Xbox 云游戏的壮举。索尼对此的回应是先后推送了 14.00 和 14.10 固件更新，封堵了已知漏洞。Relapse 目前不支持 14.00 及以上固件，且没有官方降级路径，用户一旦更新系统便会失去越狱能力。据 VideoCardz 报道，Overdrive 被关闭后不久，GitHub 上便出现了两个新的项目仓库。其中一个是对原始项目的 fork，另一个则是在不同账号下发布的克隆版本。原仓库位于 half144 账号下，现已无法访问，但新的发布页面提供了最新版本下载以及现有用户的迁移指引。有分析认为，即便索尼能够持续下架主仓库，已经分发的代码副本和社区 fork 使得该项目难以被彻底清除。社区对 Overdrive 的态度呈现出明显的对抗色彩。据 Notebookcheck 报道，不少评论者将 Overdrive 视为对索尼逐步取消实体游戏的回击，有用户评论称“全数字游戏，正如索尼所愿”。相关阅读：《PS5 游戏机黑 5 日消息，科技媒体 metro 昨日（10 月 14 日）发布博文，报道称在互联网世界中，科技大佬们的明争暗斗从不局限于商场与企业实力，甚至连杯中的啤酒都能成为新的战场。欧洲最具影响力的每日直播科技节目 @etnshow 昨日（10 月 14 日）在 X 平台发布推文，统计了《The Cheeky Pint》播客节目中受邀嘉宾的酒量，并推出了“Cheeky Pint 饮酒排行榜”（The Cheeky Pint Benchmark）。IT之家注：《The Cheeky Pint》是近年来在科技界与创投圈迅速走红的一档高端科技深度访谈播客节目。该节目打破了传统商业采访的严肃与刻板，以其独特的“酒馆社交”风格著称。节目的固定录制场景是一个充满爱尔兰风味的传统小酒馆。每一期节目，Stripe 联合创始人约翰 · 科里森（John Collison）都会邀请科技创始人或行业领袖“边喝啤酒边聊天（over a pint）”。Meta 首席执行官扎克伯格与公司首席 AI 官汪滔（Alexandr Wang）一同做客该节目，扎克伯格甚至特意从都柏林空运了一整桶正宗的爱尔兰健力士（Guinness）黑啤。在扎克伯格喝下第一口黑啤后，他的面部表情管理似乎瞬间“失控”。网民们迅速捕捉到了他眉头紧锁、近乎痛苦的 wince（龇牙咧嘴）表情，该片段在各大社交平台疯狂流传。有网友调侃道：“他仿佛在试图咀嚼那口啤酒”，还有人开玩笑称“这可能是他这辈子遇到过最艰难的挑战”。面对排山倒海的恶搞，扎克伯格本人通过其社交账号（@finkd）冷冷地幽默回应了一句：“那只是我的日常表情（that's just my face）”。就在扎克伯格的“饮酒囧态”引发互联网狂欢之际，该节目的数据统计随之出炉。播客团队的内部人员强制让实习生看完了往期所有节目，精准计算出了各位科技巨头在录制时的真实饮酒量，并推出了“Cheeky Pint 饮酒排行榜”。在这份涵盖了 38 位科技巨头的榜单中，全球首富埃隆 · 马斯克在做客该节目时轻松灌下整整 3 品脱（约 1.7 升）的健力士黑啤，展现出惊人的豪饮实力。尽管第一口喝得极其痛苦，但扎克伯格最终还是硬着头皮喝掉了 1 又 1/6 品脱（约 663 毫升），虽然比不过马斯克，但依然排到了前十，甚至击败了 Anthropic 的创始人达里奥 · 阿莫代（Dario Amodei）。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/174.htm", "publishedAt": "2026-10-15T00:56:17+00:00"}, {"title": "Epic 借助 AI 打造新版启动器，承认传统编程“太难”", "summary": "IT之家 10 月 15 日消息，Epic Games 推出了新版 Epic Games 启动器的预览版，使用 AI“氛围编程”完成开发。Epic 游戏商城官网发布的公告称，由于传统编程方式太过困难，公司决定使用 AI 开发新版启动器。“编程太难了。所以我们干脆用氛围编程做了一款全新的 Epic Games 启动器，不仅速度比旧版快得多，操作响应更灵敏，界面也焕然一新。”Epic 也提醒用户，预览版的功能还不够丰富：“把它当成一艘快艇，而不是豪华游艇！当然，它还是有购物车这种先进的数字商务技术的。”Epic 公布的数据显示，新版商城冷启动平均只需 5.47 秒，速度比 Steam 快 46%。除了启动更快，新版启动器在游戏库和商城之间切换时更加流畅，后台运行占用的系统资源更少，游戏库管理和下载体验也有所改善。据IT之家了解，今年 6 月，Epic 曾在 Unreal Fest 活动上公布游戏商城和启动器的改进计划。“在座的每一位开发者，以及我们的每一位玩家，都遇到过现有启动器带来的问题。是时候改变了。”Epic 当时还宣称，即将推出的 2.0 版启动器平均冷启动速度将达到旧版的 5 倍，却没有透露新版本会使用 AI 开发。今年 2 月，时任 Epic 游戏商城副总裁兼总经理史蒂夫 · 艾利森就曾直言启动器“很烂”，承诺改善使用体验，也没有提到 AI。去年我们推出了不少功能，今年可能是解决那些重大问题最有成效的一年。最大的一个问题就是启动器太烂了，我们就直说吧，真的太慢了！每次切换页面，都得向后台服务器发送请求，重新加载内容。网速不同，用户可能要等上好几秒。这种体验实在太差，尤其是当大家拿它跟其他没有这些问题的启动器比较，或者两个启动器都在用的时候。艾利森还透露，Epic 从去年年底就开始改造启动器，相当于把内部架构全部拆掉，再换一套新的。“以后启动器用起来应该会更顺手，速度也会更快。等玩家开始说‘天啊，这玩意儿终于没那么烂了’，我们就算成功了。”相关阅读：《Epic Games 启动器将“彻底重建”，启动速度提高 5 倍》《Epic 高管承认“启动器很烂”，预计 5~6 月架构大改后可解决卡顿顽疾》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/172.htm", "publishedAt": "2026-10-15T00:40:58+00:00"}, {"title": "AI 实时分离人声，席琳 · 迪翁演唱会用上音频黑科技", "summary": "IT之家 10 月 15 日消息，据彭博社报道，席琳 · 迪翁（Céline Dion）的歌声响彻巴黎郊外的普莱尼蒂德体育馆，她演唱的《泰坦尼克号》主题曲，即便传到这座巨型场馆最远区域的观众耳中，清晰度几乎就如同观众站在舞台上她的身旁。在近期这场演出的夜晚，看台上三万五千名观众里，大多数人目光更多聚焦在这位流行歌后的造型，以及她在一种罕见神经系统疾病康复期间登台演出的状态，而非舞台四周密密麻麻的音箱。但这些黑色箱体出自法国企业 L-Acoustics 研发的音响系统，这家公司正借助人工智能，重塑现场活动的听觉体验。今年早些时候，在高端音响小众领域颇具名气的 L-Acoustics，推出了一款名为 Source Intelligence 的全新软件平台。该平台运用机器学习技术，能够实时把歌手的人声从各类干扰背景音中分离出来。这项技术可以过滤其他乐器、伴唱、观众噪音以及场馆内混杂的环境混响，输出清晰人声，同时抑制容易毁掉演出的啸叫。据该公司介绍，Source Intelligence 最多可以削减 40 分贝的非人声信号，这项技术进步给音频工程师留下了深刻印象。和席琳 · 迪翁合作 38 年、担任本场演出主扩工程师的德尼 · 萨维奇（Denis Savage）说：“这几乎就像魔法一样。”他负责使用 Source Intelligence 调试这位加拿大歌手的现场演出，他说：“调试席琳 · 迪翁的演唱会混音时，观众想听的就是席琳 · 迪翁。你必须始终保证她的人声在混音里处于最突出位置。L-Acoustics 的这套工具，刚好让这件事变得更容易。”如今现场演出比以往任何时候都更受欢迎，科技含量也更高，多家音频企业都在研发提升音质的技术。音响是演唱会的核心组成部分，却常常被嘈杂的观众声与视觉特效掩盖。人声分离降噪技术早已存在，最早由夜店 DJ 开创。其他音频企业也已经在软件中使用机器学习与神经网络，例如 Alpha Labs 与 Cedar Audio Ltd。德国竞争对手 D&amp;B Audiotechnik 上个月发布了一套系统，能让音响工程师虚拟预览场馆内每一个座位听到的演唱会音效。Alpha Labs 的防啸叫系统 De-Feedback 这类产品可以适配多家厂商的设备，而 L-Acoustics 借鉴苹果公司的思路，搭建封闭生态。Source Intelligence 只能搭配 L-Acoustics 自家音响系统，并且必须使用该公司的 L-ISA 二代处理器，让客户绑定其整套软硬件生态。L-Acoustics 由热爱声学的物理学家克里斯蒂安 · 海尔（Christian Heil）于 1984 年创立，创立灵感来自平克 · 弗洛伊德的一场演唱会。随着现场音乐行业蓬勃发展，公司的订单需求大幅上涨。L-Acoustics 近期完成了好莱坞露天剧场音响系统的全面改造，哈里 · 斯泰尔斯、布鲁诺 · 马尔斯、威肯与罗莎莉亚的重磅巡演，都依靠 Source Intelligence 平台支撑现场音效。L-Acoustics 过去一直深耕硬件，上世纪 90 年代，正是这家公司推动“线阵列”堆叠音箱技术普及。如今拓展 AI 软件业务，让公司可以提供整套一体化音响解决方案。联合首席执行官洛朗 · 瓦西耶（Laurent Vaissié）在纳什维尔的办公室表示：“仅有优质扬声器远远不够，还需要优质的音频素材与声音处理能力。”瓦西耶称，L-Acoustics 预计明年营收达到 4 亿欧元（IT之家注：现汇率约合 29.98 亿元人民币），相比 2026 年实现两位数增长。这家非上市企业的业务主体来自大型现场演出，同时正在拓展剧院、体育场馆、夜店以及部分高端零售场景。在普莱尼蒂德体育馆完成音响设计面临一系列独特难题。这座场馆看台总长 13 公里，最多可容纳 4.5 万人，原本用于举办橄榄球赛事，巴黎奥运会期间还曾被改造为游泳池。席琳 · 迪翁将在普莱尼蒂德体育馆举办 26 场驻场演出，L-Acoustics 最新一代 L1 音箱悬挂在舞台的左、中、右区域。L1 音箱相比前代体积更小、重量更轻，能够更好地控制声音传播方向与覆盖范围。这意味着席琳 · 迪翁的人声与低音仅由中间一组音箱发出，让整个内场区域听到的声音更加均匀。负责本场演出的系统工程师弗朗索瓦 · 德雅尔丹（François Desjardins）在 9 月 26 日演出结束后，于场馆中央控音台处说：“单一声源能够保证声音稳定一致，避免串音、回声等各类问题。”舞台区域的声压级，相比观众席还要低最多 26 分贝。萨维奇说：“舞台上几乎听不到大音量。”这让席琳 · 迪翁更容易听清真实伴奏以及耳返里的提示音，而不是自己声音反射回来的回音。“听感干净太多。”瓦西耶介绍，席琳 · 迪翁这场普莱尼蒂德演唱会全套音视频与声学系统总成本超过 100 万欧元（现汇率约合 749.6 万元人民币）。音响预算通常占演出制作成本的 10%，低于灯光（20%）和视频（40%）。迪翁驻场演出的这套专业设备由蒙特利尔制作公司 Solotech 采购，再交付给演出主办方 AEG 环球公司。未来数月，Solotech 会将这套 L-Acoustics 音箱用于其他演出；等到明年迪翁回归巴黎开启新一轮十场演出时，这套设备也会重回这座场馆。L1 音箱在巴黎南部的马尔库西斯组装，L-Acoustics 的工厂、总部都设在此地，承载着这家企业的法国本土根基。声学核心技术的大部分组件，包括部分音箱零部件，在德国和欧洲其他地区生产，再运到法国完成组装。瓦西耶称，公司现有 1100 名员工，大约两成人员从事研发工作，过去二十年间业务保持稳定增长。尽管音乐行业内部对人工智能存在不少担忧，但瓦西耶认为 L-Acoustics 这套软件不会取代音响专业人员的工作。“它不会抢走混音工程师的岗位，只是替代工程师原本使用的其他传统手段。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/165.htm", "publishedAt": "2026-10-14T23:57:18+00:00"}, {"title": "入职约 1 年：OpenAI 基础设施与 AI 算力负责人卡蒂离职，曾主导“星际之门”计划", "summary": "IT之家 10 月 15 日消息，OpenAI 基础设施与算力负责人萨钦 · 卡蒂（Sachin Katti）昨日（10 月 14 日）在 X 平台宣布辞职，其空缺将由乌代 · 鲁达拉朱（Uday Ruddarraju）接替。知情人士透露，卡蒂离职后预计将继续转任顾问，与公司保持合作。IT之家查询公开资料，卡蒂于 2025 年 11 月由英特尔公司（Intel）CTO 转投 OpenAI，在职期间主导推进了雄心勃勃的“星际之门”（Stargate）数据中心计划，并成功与软银、甲骨文以及亚马逊 AWS 等主要供应商达成了计算资源合作。图右为萨钦 · 卡蒂（Sachin Katti）接替者是今年夏季早些时候刚晋升为 OpenAI 计算容量首席技术官鲁达拉朱，他于 2025 年 7 月加入 OpenAI，此前曾担任埃隆 · 马斯克旗下人工智能公司 xAI 的基础设施工程主管。卡蒂的离开是 OpenAI 近期密集高管离职潮中的最新一例。仅在过去几个月内，公司就经历了产品与业务负责人菲吉 · 西莫（Fidji Simo）、资深高管布拉德 · 莱特卡普（Brad Lightcap）、营收负责人丹妮丝 · 德雷瑟（Denise Dresser）以及安全系统团队负责人大卫 · 罗宾逊（David Robinson）等多位核心高层的相继出走。对此，OpenAI 总裁格雷格 · 布罗克曼（Greg Brockman）曾表示，由于公司处于聚光灯下，每一次离职都会受到前所未有的严格审查，但他认为这种管理层的多样性与韧性反而会让公司更强大。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/158.htm", "publishedAt": "2026-10-14T23:30:06+00:00"}, {"title": "企业真正需要的，不是更聪明的 Agent ？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/video/Wss036X3C6APXsS41HwC?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-14T18:36:53+00:00"}, {"title": "千问办公杀入电商经营！3万开店成本压至几百元，一个Agent接管多平台生意", "su l": "https://www.infoq.cn/article/ZqJq0uHBPvvEewkc0ZFC?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-14T17:35:33+00:00"}, {"title": "苹果 HomeView 上手汇总：「果家」首秀小惊艳，SiriAI 很聪明", "summary": "苹果 AI 终于有「家」了#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1684341?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-10-14T12:35:44+00:00"}, {"title": "Claude写代码太快，Git扛不住了：Anthropic仅靠7人，5个月重造版本控制系统", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/6iRATYfkqF7aITPaFR2R?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-14T11:46:46+00:00"}, {"title": "《变形计》综艺赛博复活，AI版MrBeast爆火，LibTV下场「造星」了", "summary": "从创意到成本，AI正在重写综艺的生产逻辑", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/10/503211.html", "publishedAt": "2026-10-14T07:03:44+00:00"}, {"title": "企业微信和 WorkBuddy 组了个「王炸局」，AI 终于不用人伺候了", "summary": "原地升级的 AI 办公#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1684200?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-10-14T02:30:24+00:00"}]}, {"label": "论文研究", "items": [{"title": "英伟达黄仁勋：若客户开发不安全 AI 软件，极端措施可断供芯片", "summary": "IT之家 10 月 15 日消息，在伦敦接受彭博社 Emily Chang 采访时，英伟达首席执行官黄仁勋表示，假若其客户被认定正在开发不安全或不负责任的人工智能（AI）软件，英伟达将断然停止向其供应芯片。他坦言，切断供应目前仍是一个“假设性问题”，且英伟达在采取断供等极端反制措施之前，必然会先与相关客户进行深入地沟通与对话。黄仁勋补充道：“我们并不经营别人的公司，我们的技术属于通用技术，因此对于其他公司如何使用我们的技术，英伟达能作出的评判和额度其实非常有限。”针对 Anthropic 等公司高管提出的“全行业应放缓 AI 发展步伐”的减速建议，黄仁勋明确予以拒绝。他认为，当前的各种安全担忧，其实是整个行业高速扩张过程中的“成长烦恼”，公众对 AI 安全风险的焦虑有些超出了实际情况。他坚信能有效管控并安全部署 AI 软件，许多年轻公司随着规模的扩大，其问责和责任担当也会逐步走向成熟。在应对 AI 安全隐患的具体路径上，黄仁勋提出了“以 AI 监控 AI”的技术治理思路。他主张行业不应因噎废食而减速，反而应该加速将防控与监控技术整合到 AI 系统中，因为“AI 本身就是最好的监控工具”。为践行这一承诺，英伟达还宣布将在未来五年内向英国 AI 安全研究捐助 2.5 亿美元（IT之家注：现汇率约合 16.76 亿元人民币）的先进算力，支持包括牛津大学在内的多所英国顶级学术机构，深入探索 AI 安全防护与智能体管控方法。相关阅读：《英伟达黄仁勋：若前沿实验室无法控制 AI，那么必须要关闭》《英伟达黄仁勋：AI 不会必然消灭某个职业，“10 年内 AI 毁灭人类”更是无稽之谈》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/164.htm", "publishedAt": "2026-10-14T23:54:39+00:00"}, {"title": "Colossal 推出 AI 平台 GenoMorph，助力加快复活灭绝物种研究", "summary": "IT之家 10 月 15 日消息，据 TechCrunch 报道，Colossal Biosciences 于当地时间周三发布了一款全新人工智能平台，助力加快复活灭绝物种的相关研究。据IT之家了解，这款名为 GenoMorph 的平台结合先进三维形态学、比较基因组学与发育生物学技术，在基因数据有限的复活项目中，筛选出可用于基因编辑的目标基因。该公司正借助这个平台推进渡渡鸟复活计划，而渡渡鸟可用的基因组资料十分匮乏。举例来说，公司在猛犸象复活项目中获取了 100 份基因组样本，但渡渡鸟项目仅有一份基因组可用。公司表示，猛犸象生存的寒冷环境更利于保存 DNA，而渡渡鸟栖息在热带地区，因此留存下来的猛犸象 DNA 更为丰富。Colossal Biosciences 首席执行官、联合创始人本 · 拉姆（Ben Lamm）在接受采访时表示：“通常科学家可以比对大量基因组，以此找出决定特定性状的基因差异。但对于灭绝物种的古 DNA，我们没有这样的条件，这类物种的 DNA 存量极少，只能得到少量完整基因组。”拉姆介绍，为搭建 GenoMorph 平台，团队收集了大量来自鸡、鹌鹑、鸭和鸽子的发育数据，并整合了 70 多种鸟类的遗传信息以及颅骨三维测量数据。该平台历时一年多开发完成，同时依托公司多年在灭绝物种复活领域积累的研究成果。“这套 AI 能够学习鸟类在喙与面部结构发育过程中，哪些 DNA 片段处于激活状态，并利用这些信息预测，是哪些基因调控机制造就了渡渡鸟标志性的外形。”他把这个平台比作“渡渡鸟基因组藏宝图”：团队不再需要排查海量潜在基因差异，GenoMorph 可以直接筛选出真正关键的基因变异位点。他接着说：“目前我们已经找到大约 2300 个有望用于渡渡鸟颅面部形态改造的 DNA 编辑靶点，接下来可以在实验室开展验证。”拉姆表示，GenoMorph 将帮助公司攻克复活动物研究里最大的瓶颈之一：找出究竟是哪些基因变化，造就了灭绝物种独有的特征。不过科学家还需要验证，这些编辑操作能否培育出目标外形特征。“我们研发了一套新系统，利用脂质纳米颗粒把基因编辑工具直接送入正在发育的鸟类胚胎。”这套方案可以让团队观察特定基因改动会如何影响鸟类发育，“不必等待鸟类完成整个繁育周期直至性成熟。”公司在周三同时公布，目前尼科巴鸠种群已经达到 36 只，并且已经成功培育出能够发育成卵子和精子的关键细胞。“尼科巴鸠是渡渡鸟现存亲缘关系最近的物种，这些细胞是我们培育带有渡渡鸟性状个体的核心环节。”他说，下一步团队计划在实验室验证 GenoMorph 给出的预测结果。拉姆继续说道：“最令人振奋的是，我们研发的各项技术正在逐步融合，还能为生命演化树上其他完全不同类群的研究项目提供支持。”被问及这类基因编辑是否安全时，拉姆称，开发 GenoMorph 这类技术的目的，就是让基因工程“更精准、可控、可检验”。该平台本身并不执行基因编辑操作，只是帮助研究团队筛选值得深入研究的基因改动方案。“找到潜在编辑靶点，并不代表我们会立刻把它植入动物体内，也不等于默认它是安全的。”他补充道，“我们对这些基因改动识别和验证得越精准，整个研究过程中的决策就越可靠。”与此同时，Colossal Biosciences 的这项新技术已经得到 XPRIZE 创始人彼得 · 戴曼迪斯（Peter Diamandis）的认可。身为 Colossal Biosciences 投资方的戴曼迪斯，在周三宣布成立新风险投资机构 NeoGenesis Capital，专门扶持那些运用 Colossal Biosciences 可编程生物平台、布局医疗、农业与物种保护领域的企业。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/161.htm", "publishedAt": "2026-10-14T23:44:26+00:00"}, {"title": "Palantir CTO 上电视骂 AI 安全是“邪教”，还戏称 AI 研究者靠抽烟表信仰", "summary": "Palantir 首席技术官 Shyam Sankar 在 CBS《Face the Nation》上抛出了几个惹火的判断。节目开头，主持人 Margaret Brennan 先甩了个民意数字：CBS 民调里 50% 的人认为 AI 带来的问题会多于解决的，45% 的美国人希望政府限制 AI 的研发和使用。他的回应不是顺着'该不该设护栏'谈，而是直接点名了一个他认为真正在背后操...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503000", "publishedAt": "2026-10-13T08:56:20+00:00"}, {"title": "AI 让代码量涨了 30%，软件产出却纹丝不动 —— 瓶颈卡在人类 Code Review", "summary": "让 AI 写代码，公司真的产出了更多软件吗？一份对超 700 家公司真实工程数据的分析给出了一个反直觉的答案：代码是多了，软件没多。哈佛的两位学者 Fiona Chen 和 James Stratton 用 Jellyfish 的工程团队聚合数据做研究，覆盖 3 亿个独立工作事件（commit、PR 等）、超过 70 万名员工的记录、700 多家软件公司，时间从 ...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502990/ai-coding-agents-generate-more-code-but-not-more-software", "publishedAt": "2026-10-13T02:57:47+00:00"}, {"title": "给 AI 一块 1980 年代的国产 CPU，它 5 分钟写模拟器，一个下午复现了 BASIC", "summary": "有人让 AI 逆向了一颗国产 CPU，全程没写一行代码。微博博主 EE_Archeology 晒出全过程：主角是一块来路不明的国产单板机，最后被确认是骊山 771 所（今天的西安微电子技术研究所）研制的 LS77-II 处理器——这是从 1977 年的 LS77-1 优化而来的型号，提高集成度后，用一片 ALU 加一片微码 ROM 就实现了全部功能。全网关...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502976", "publishedAt": "2026-10-12T09:44:25+00:00"}, {"title": "Claude 动态多 Agent 工作流开始公测，支持庞大的工作负载", "summary": "Claude 官方把动态多智能体工作流放进公开测试版了。Claude Managed Agents dynamic workflows，ClaudeDevs 的说法是一种新型多智能体编排，『为最庞大的工作负载而生』——一个主 agent 写计划，计划跨多个 agent 分阶段运行，最后合并结果。 最能说明它价值的是那个冷冰冰的对比实验。官方在一条 116k 行的代码库里埋了...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502951", "publishedAt": "2026-10-10T10:21:36+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "巴克莱银行分析师：特斯拉、SpaceX 合并或在年内官宣", "summary": "IT之家 10 月 15 日消息，据彭博社今天（15 日）凌晨报道，巴克莱银行分析师认为，埃隆 · 马斯克旗下的特斯拉与 SpaceX 可能在特斯拉召开年度股东大会前宣布合并。丹 · 莱维等分析师预计，特斯拉今年的年度股东大会最迟于 12 月 6 日召开。两家公司合并能产生一定的财务协同效应，真正的价值却在于整合双方的 AI 技术，实现垂直整合。分析师在发给客户的研报中指出，特斯拉与 SpaceX 合并正逐渐成为市场的普遍预期。合并消息预计要到 10 月下旬甚至 11 月初才会公布。然而消息公布得越晚，想在年度股东大会上获得合并批准就越困难。投资者和分析师一直普遍看好两家公司合并的可能性，尤其是在 SpaceX 今年完成创纪录的 IPO 之后。1 月的消息称，SpaceX 考虑过与特斯拉合并，最终选择收购马斯克创办的 AI 初创企业 xAI。特斯拉与 SpaceX 不仅有多项业务往来，股东群体也有重叠，马斯克还同时担任两家公司的 CEO。SpaceX 采购了价值超过 1 亿美元（IT之家注：现汇率约合 6.71 亿元人民币）的特斯拉 Cybertruck，xAI 也是特斯拉大型储能电池的重要客户。双方还共同推进 Terafab 芯片制造项目，计划为特斯拉汽车、自动驾驶出租车和 Optimus 机器人生产芯片，同时开发专供 SpaceX 轨道 AI 卫星使用的芯片。马斯克近期多次谈到旗下两大公司的业务联系，以及双方如何逐渐融合。他在最近一次财报电话会议上指出，两家公司在许多领域都有业务交集。巴克莱认为，合并面临的最大障碍是股东投票。特斯拉与 SpaceX 的股东很可能都需要批准交易。分析师指出：“特斯拉 2025 年年度股东大会上，约 11% 的全部股份表决权属于‘经纪商未投票’，实际上相当于投了反对票。我们认为，如果特斯拉就与 SpaceX 的合并计划进行表决，公司会设法提高股东参与投票的比例。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/170.htm", "publishedAt": "2026-10-15T00:22:55+00:00"}, {"title": "麦肯锡面试新花样：先和 AI 客户对线十分钟", "summary": "IT之家 10 月 15 日消息，据华尔街日报报道，想在麦肯锡拿到工作？你或许先要成功和人工智能虚拟对手对线。这家顶尖咨询公司将于今年秋季调整部分初级咨询岗位候选人的面试流程，新增一类客户模拟环节。该环节旨在测试应聘者的临场应变能力，以及和麦肯锡客户沟通的水平，其中部分客户会更加刨根问底、难以应对。尽管全程都是模拟场景，但这场时长约十分钟的 AI 对话，会安排在麦肯锡真实的办公室内进行，合伙人或面试考官会在现场观察候选人的表现。麦肯锡的合伙人表示，这套 AI 工具不会自行对候选人的表现打分或给出评价。这个虚拟形象学习了多种客户性格类型，例如那种像学者一样、希望深入理解公司方案建议的客户。参与该试点项目设计、任职于麦肯锡达拉斯办公室的合伙人萨利姆 · 扎法尔（Saleem Zafar）称，该工具并非用来模拟情绪失控的客户，或是刻意设置陷阱提问的客户，它的目标是还原麦肯锡顾问日常工作中八成会遇到的场景。扎法尔说：“我重点观察的是：你有没有捕捉到对方话语里的关键信息？有没有据此做出回应？还是直接忽略了这些内容？会不会固守自己预设的思路，强行把答案灌给对方。我们要看的，是你面对不断变化的信息时如何反应。”今年秋季，麦肯锡正在北美部分办公室，对申请商业分析师岗位的本科生测试这套虚拟对手面试系统，预计将有数百名候选人参与。如果试点效果良好，公司计划明年把它推广到其他岗位。各行各业的企业都在调整招聘方式，以此适应人工智能时代，更好发挥这项技术的能力。部分雇主新增 AI 筛选工具，还有企业在招聘流程中引入作弊检测软件。长期以来，想要拿到麦肯锡的 offer，需要经历多轮繁琐考核。候选人一般要和合伙人及其他面试官面谈，之后参与案例分析挑战，现场解决问题。如今，案例挑战结束后，候选人还要在笔记本电脑上和 AI 虚拟形象对话。麦肯锡负责全球招聘工作的联合负责人布莱尔 · 西塞尔（Blair Ciesil）表示：“借助这种方式，我们可以考察候选人与人打交道的综合素养，而不受提前准备的影响。有些候选人会准备一套反复演练好的陈述。不是说这些经历不够出色，但这会让面试官很难看清候选人内在的真实特质。”扎法尔举了一个假设案例：某座城市聘请麦肯锡，调研新体育场馆的选址。在这个场景里，AI 虚拟形象就扮演市长，对顾问提出的方案进行质询。他说：“市长会有一些自己十分看重的诉求，希望听取你的建议。但当你阐述方案时，她可能会提出更多顾虑，或是补充更多背景信息。”IT之家注意到，也有不少企业不愿在招聘中使用人工智能，担心产生偏见，或是违反不断更新的招聘领域 AI 相关法规。麦肯锡的合伙人表示，这套 AI 工具意在提升招聘流程的公平性，因为在角色扮演环节里，不同人类面试官的严苛程度存在差异。扎法尔称，在招聘工作中，公司要预判“这个人未来能不能胜任工作”。这套新工具，就是为了帮助面试官更好地看清：“这个人本质是什么样的？他真实的一面是怎样的？”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/155.htm", "publishedAt": "2026-10-14T23:15:50+00:00"}, {"title": "抢先盘点2026全球开发者先锋大会暨国际具身智能技能大赛十大亮点！", "summary": "“具身进实景，劳动最光荣”", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/10/503294.html", "publishedAt": "2026-10-14T10:41:47+00:00"}, {"title": " const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
