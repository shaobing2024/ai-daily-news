const DATA = {"date": "2026-09-11", "generatedAt": "2026-09-11T00:48:07Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "OpenAI 扩大实时语音模型能力：GPT-Live-1 上线 API，支持打断处理、工具调用和电话语音智能体", "summary": "IT之家 9 月 11 日消息，OpenAI 今日宣布将 GPT-Live-1 引入 API，开发者可据此打造支持实时语音交互的应用和业务流程。该模型支持全双工对话，能够同时听取和输出语音，并在对话过程中处理打断、停顿及背景噪声。GPT-Live-1 还支持电话场景，可用于预订餐厅、客户服务等全双工语音智能体。OpenAI 表示，开发者可以将其与 Codex 等工具连接，也可以通过 OpenAI Presence 开发能够查询企业系统、执行获批操作并在必要时转交人工的语音工作。据介绍，GPT-Live-1 将语音理解与语音输出整合在同一模型中，减少传统“语音转文字 — 大语言模型 — 文字转语音”的多次衔接，从而降低延迟。模型还支持将复杂推理和工具调用交由后端文本模型处理。开发者可以通过系统提示词调整其语气、语速和对话风格，也可以配置后端模型、工具及智能体框架。OpenAI 表示，GPT-Live-1 支持原生语音识别转写和回复文本，并具备字母数字理解、关键词偏置及轮次检测能力。在早期评估中，语言学习平台 Speak 使用 GPT-Live-1 后，学习者思考停顿期间的误打断次数较此前基于轮次的系统减少近 80%。医疗服务平台的联合创始人兼首席技术官 Tony Stoyanov 表示，其团队将代码量减少了 80%，删除约 2.3 万行代码。OpenAI 公布的评测结果显示，GPT-Live-1 在 Full Duplex Bench 测试中的表现比 GPT-Realtime-2.1 高出 30 个百分点，在搭配 GPT-6 Astra 中等推理强度时，Tau3 端到端语音智能体任务测试排名第一。目前，GPT-Live-1 已在 API 中提供，前端语音层价格为每分钟 0.05 美元。按每小时 60 分钟计算，单纯前端语音层的费用约为 3 美元（IT之家注：现汇率约合 20.2 元人民币），后端模型和智能体工具的费用另行计算。OpenAI 同时扩大了实时语音选项，新增 Quartz、Ripple、Vesper、Willow、Stone、Gleam、Meridian、Bossa、Tempo、Beacon、Delta 和 Cinder 等声音，并计划在未来数月继续增加语音和语言支持。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/091.htm", "publishedAt": "2026-09-11T00:28:22+00:00"}, {"title": "商汤科技 AI 办公智能体“小浣熊”移动端 App 上线，提供苹果 iOS / 安卓版本", "summary": "IT之家 9 月 11 日消息，商汤科技宣布 AI 办公智能体“小浣熊”移动端 App 正式上线，提供苹果 iOS 和安卓版本，用户提交 App 反馈问卷，可获 1000 积分。官方表示，移动端“小浣熊”支持使用自然语音快速对话操作，用户长按说出需求，松手即可发送，离开工位，也能随时查看、分享和接续成果。实现“手机发指令，电脑持续执行”。公开信息显示，商汤科技 AI 办公智能体“小浣熊”搭载“多模态智能体创作引擎”，能够从用户原始的碎片化信息中理解整理意图，同时拥有“长链条思考”能力及企业内外部信息融合能力。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/079.htm", "publishedAt": "2026-09-10T23:51:32+00:00"}, {"title": "“AI 教父”辛顿：AI 灾难越来越近，10% 概率灭掉人类不是危言耸听", "summary": "北京时间 9 月 11 日，据《商业内幕》报道，“AI 教父”杰弗里 · 辛顿 (Geoffrey Hinton) 表示，很难估计 AI 将人类全部灭绝的概率，但这个概率并非为零。辛顿周三在接受 BBC《新闻之夜》采访时说：“在我看来，10% 的概率似乎是一个不算离谱的估计，但实际上没人知道该如何给出一个合理的估计。”《新闻之夜》主持人维多利亚 · 德比希尔 (Victoria Derbyshire) 对此表示惊讶，因为辛顿基本认同了 Anthropic 顶级 AI 安全研究人员雅各布 · 考克森 (Jacob Coxon) 的判断。该研究员表示，未来 10 年内，AI“有超过 10% 的概率杀死全人类”。“哇，”德比希尔说，“我的天哪。”辛顿表示，很难估计具体概率，因为人类社会从未见过一种“很快就可能比我们更聪明”的技术。“如果说只有 1% 的概率，那就太愚蠢了，”他说，“没有人知道该如何估算。”这位诺贝尔奖得主表示，可以确定的是，这种灾难可能发生的时间窗口已经缩短了。“我以前认为是 30 到 50 年，后来缩短到 10 到 20 年，”他表示，“现在，我觉得可能是 10 年，甚至更短。而其他人认为比这还要快得多。”至于这种情况可能如何发生，辛顿提到了从网络攻击到 AI 研发出致命病毒等各种风险。尽管辛顿没有说明为什么这一时间表被大幅缩短，但包括 Anthropic 和 OpenAI 在内的领先 AI 公司已经投入数十亿美元来扩大模型规模，而它们最近发布的产品相比数月前的模型已展现出显著提升。在辛顿发表上述言论之前，Anthropic 研究员考克森在该公司备受期待的 IPO 前夕宣布辞职。考克森此前曾在 OpenAI 工作，他说这些 AI 巨头正在“拿我们的生命赌博”。“那些开发 AI 的人真心相信，AI 可能在这个十年结束前杀死我们所有人，”考克森在 X 上写道，“这不是营销噱头。如果说有什么不同，那就是许多高管和资深研究员在媒体上会措辞谨慎，让自己听起来理性，但我在私下听到的是同一批人表达恐惧。”辛顿表示，人类可能走上自我毁灭的道路，也可能在实现 AI 潜力的同时，找到“如何应对 AI 所带来危险”的办法。他再次呼吁加强全球监管，并指出尽管各国可能无法在所有问题上达成一致，但它们都有维护人类生存的共同愿望。“对于防止 AI 取代人类这类问题，各国的利益是一致的。因此，它们最终会展开合作。问题在于，他们能及时采取行动吗？”他表示。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/076.htm", "publishedAt": "2026-09-10T23:43:14+00:00"}, {"title": "OpenAI Agents API 开放公测：支持代码执行、工具调用和跨上下文任务运行，为开发者提供云端智能体基础设施", "summary": "IT之家 9 月 11 日消息，OpenAI 于当地时间 9 月 10 日宣布推出 Agents API 公测版，允许开发者通过 API 调用由 OpenAI 管理的云端 AI 智能体运行环境。该服务复用了 Codex 背后的智能体执行框架和基础设施，开发者可以指定任务、模型、工具及运行环境，打造能够执行多步骤任务的 AI 应用。OpenAI 表示，开发者只需一次 API 调用即可创建生产环境级别的智能体。智能体可以在云端运行代码、处理文件、保存中间结果，并持续执行跨越数小时甚至数天的任务。OpenAI 负责维护智能体执行框架，开发者则可以专注于自身应用所需的工具、知识和工作流程。Agents API 支持 OpenAI 托管的沙盒环境，也支持部署在开发者自有基础设施或合作伙伴提供的沙盒中。OpenAI 已与 Blaxel、Cloudflare、Daytona、DigitalOcean、E2B、Modal、Oracle、Runloop 和 Vercel 等服务商合作，提供不同的 CPU、GPU、内存及存储配置。IT之家注意到，OpenAI 同时还推出了 OpenAI Hosted Sandbox 服务，开发者无需自行搭建沙盒基础设施，即可为智能体配置文件、软件包、技能和插件。该环境用于运行代码、处理文件和生成产物，并采用与 Codex 和 ChatGPT 相同的沙盒基础设施。在长时间运行方面，Agents API 提供上下文管理能力，可在会话接近上下文限制时自动压缩早期信息，帮助智能体跨越多个上下文窗口继续执行任务。该 API 还支持工具搜索和程序化工具调用，智能体可以按需加载工具定义，并行运行调用、串联操作或筛选结果，以减少不必要的上下文占用。多智能体支持是 Agents API 的另一项能力。开发者可以将复杂任务拆分为多个独立子任务，由子智能体并行处理，再由主智能体协调和汇总结果。OpenAI 提供的示例中，开发者可配置最多 3 个并发子智能体。Agents API 基于开源 Codex 执行框架打造。OpenAI 表示，开发者可以查看公开代码库，了解协调模型调用、工具和上下文的核心逻辑，而 OpenAI 将负责维护该框架，并随模型更新持续改进智能体能力。目前 Agents API 已向所有开发者开放公测，不额外收取 API 使用费用，用户仅需按照所使用的模型 Token 和工具付费。OpenAI 表示，公测期间将根据开发者反馈持续迭代，并逐步推进正式发布。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/072.htm", "publishedAt": "2026-09-10T23:31:21+00:00"}, {"title": "GPT-6 Astra 需求空前：OpenAI 宣布暂停 200 美元 Pro 20X 新增订阅，已订用户及 API 不受影响", "summary": "IT之家 9 月 11 日消息，OpenAI 首席产品官 Tibo（@thsottiaux）今早在 X 上发文称，为确保现有用户获得良好体验并流畅访问 GPT-6 Astra，将暂停接受 200 美元档 Pro 20X 订阅服务的新增订阅。截至IT之家发稿，200 美元（现汇率约合 1,345 元人民币）档 Pro 20X 订阅服务已不可选，Pro 订阅仅剩每月 100 美元的 5X 档位。Tibo 解释称，Pro 订阅对系统压力最大，暂停新增订阅是“影响最小的办法”，以便尽可能扩大访问范围。另外，已获得 ChatGPT 订阅的账户不受影响，OpenAI 正以尽可能快的速度增加容量。据介绍，此次调整只涉及 200 美元 Pro 计划的新订阅，OpenAI 其他订阅层级和 API 服务继续开放。相关阅读：《AI 智能体出现失控行为，OpenAI 呼吁美国出台强制性全国 AI 安全法规》《GPT-6 Astra 需求空前，OpenAI 称必要时会暂停 Pro 新增订阅》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/069.htm", "publishedAt": "2026-09-10T23:21:08+00:00"}, {"title": "OpenAI 推出金融服务版 ChatGPT：集成 GPT-6 Astra 内置金融数据与细粒度引用，支持估值模型与研究报告", "summary": "IT之家 9 月 11 日消息，OpenAI 于当地时间 9 月 10 日宣布推出 ChatGPT for Financial Services。这是一款面向金融服务团队的定制化 ChatGPT 服务，结合内置金融数据与 GPT-6 Astra 推理能力，旨在帮助金融团队开展研究、财务建模并制作定制客户材料。该产品目前已向符合条件的金融机构开放。据介绍，该产品由 OpenAI 与摩根士丹利、Evercore 联合开发，初期重点面向投资银行和股票研究场景。OpenAI 表示，合作过程中发现，金融团队面临的主要问题包括可靠获取数据，以及将分析结果制作成高质量工作材料。该服务内置 Daloopa、PitchBook、LSEG News 和 Crunchbase 等数据提供商的金融数据，涵盖财报电话会、财务报表、公司基本面及私营企业信息。相关数据由 OpenAI 索引并托管，用户可在分析过程中追溯具体数据和结论的来源。OpenAI 还计划与 S&amp;P Global、LSEG、MSCI、道琼斯 Factiva 和穆迪等机构合作，支持用户通过现有金融数据订阅直接访问已获授权的内容。IT之家注意到，OpenAI 同时优化了金融数据提供商的 MCP 连接器，并支持包括 Datasite、Box、Preqin 和 Intapp 在内的 50 多个连接器。在模型能力方面，该服务集成 GPT-6 Astra，可处理财务文档中的数字、表格和附注，并据此开展分析、生成结论及制作文档、电子表格和演示文稿。产品支持跨多个数据源研究信息、追踪不同时期的数据变化，以及生成交互式图表。金融机构还可以通过专用管理页面发布 Excel、Word 和 PowerPoint 模板。管理员设置企业模板及格式规范后，团队可将分析结果制作成符合机构要求的估值模型、研究报告和路演材料。安全与管理方面，该产品基于 ChatGPT Enterprise 的 SAML 单点登录、SCIM 用户配置和基于角色的访问控制。OpenAI 表示，企业业务数据默认不会用于训练模型，数据在传输和静态存储时均会加密，管理员还可设置工作区数据保留期限。OpenAI 同时表示，合规团队可以通过 OpenAI Compliance Platform 导出支持的工作区日志，用于现有审计和调查流程。企业还能够按角色管理技能和应用的读写权限，并通过创建多个工作区实施信息隔离。ChatGPT for Financial Services 目前仅面向符合条件的金融机构提供。OpenAI 表示，金融机构及开发者也可以通过 API 构建面向特定金融业务的应用。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/063.htm", "publishedAt": "2026-09-10T23:10:35+00:00"}, {"title": "谷歌为 Win10/11 推出 Gemini 独立客户端，支持“Alt + Space”快捷键快捷唤起", "summary": "IT之家 9 月 11 日消息，谷歌现已正式推出 Windows 版 Gemini 独立客户端，支持 Windows10/11 系统，用户在安装应用后即可通过“Alt + Space”快捷键在任何界面快速唤起 Gemini，相应快捷键支持自定义修改。相应应用主界面设计简洁，中间提供提示词输入框、模型选择器和麦克风按钮，侧边栏则可以展开查看历史对话以及账户相关选项，整体风格和网页版大致相同，同样支持生成图像 / 视频、快捷调用连接的应用等功能。此外，谷歌还为 Windows 版 Gemini 加入了独立的设置菜单，用户可以管理麦克风、摄像头和位置权限，同时查看使用统计信息以及崩溃报告。用户亦可在其中设置“登录 Windows 时自动启动 Gemini”。值得一提的是，谷歌今年 4 月已经面向全球 Windows 用户推出了独立的桌面版 Google Search 应用，不过这款应用的核心定位为搜索，而非完整 Gemini 客户端。用户可以利用它搜索互联网、本地文件、已安装应用以及 Google Drive 中的内容，同时还支持 AI Mode、Google Lens 和屏幕共享等功能。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/059.htm", "publishedAt": "2026-09-10T22:57:27+00:00"}, {"title": "参数几乎翻倍，推理反而更省：DeepSeek V4.1-Flash 重构 KV Cache", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/sbaJrAa8VTIRKIPCpKlo?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-10T17:06:25+00:00"}, {"title": "智谱启动杭州全城 Coding 计划，个人用户购季卡减免 44%、年卡减免 51%", "summary": "IT之家 9 月 10 日消息，智谱今天（10 日）通过 Bigmodel 开放平台宣布启动“智谱 · 杭州全城 Coding 计划”，该计划是智谱联合杭州市、上城区推出的城市级 AI 编程普惠行动，全国首创城区级 AI 模型调用支持。该计划旨在降低人工智能编程工具使用门槛，支持创业者、开发者、企业研发团队和青年人才更便捷、更稳定、更低成本地使用高质量国产大模型能力，活动时间为 9 月 10 日至 12 月 9 日。IT之家附官方公布的活动规则如下：个人用户谁能申请：在杭工作人员 / 杭州高校在校生减免标准：个人用户购买季卡可享受 44% 综合减免，购买年卡可享受 51% 综合减免数量限制：每人仅限享受 1 次，季卡和年卡二选一，不可重复购买，整体的减免金额达到上限后，不再发放。个人版的 Coding 套餐具体的减免政策：套餐付费周期及原价综合减免比例减免后实付价Lite 版季卡 354 元 / 季减免 44%198.24 元 / 季Pro 版季卡 1614 元 / 季减免 44%903.84 元 / 季Max 版季卡 3234 元 / 季减免 44%1811.04 元 / 季Lite 版年卡 1416 元 / 年减免 51%693.84 元 / 年Pro 版年卡 6456 元 /年减免 51%3163.44 元 / 年Max 版年卡 12936 元 /年减免 51%6338.64 元 / 年申请流程：BigModel 平台进行「个人实名认证」 &gt; 提交表单申请 &gt; 平台进行资质审核 &gt; 审核通过， htm", "publishedAt": "2026-09-10T14:25:54+00:00"}, {"title": "ECCV上，顶尖学者们开始研究如何让AI做生意了", "summary": "多模态AI大牛轮番登台，全球64支团队组团解题", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/486934.html", "publishedAt": "2026-09-10T10:17:46+00:00"}, {"title": "全球首个3D原生城市世界模型ABot-Earth 0.7发布，构建AI理解真实世界的入口", "summary": "9月10日，阿里巴巴集团旗下高德正式发布全球首个3D原生城市世界模型ABot-Earth 0.7。", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/486900.html", "publishedAt": "2026-09-10T08:17:05+00:00"}, {"title": "AGI时代的第一个生图模型，ChatGPT Images 2.5上线", "summary": "主打生成更快，细节更好，改图也终于越来越像“真·修图”了。", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/486684.html", "publishedAt": "2026-09-10T07:25:39+00:00"}, {"title": "DeepSeek V4.1 Flash 正式发布：更强、更快、更普惠", "summary": "DeepSeek V4.1 Flash 模型已正式发布，据称是 DeepSeek 全新模型结构系列中的最小尺寸模型，具备原生多模态视觉理解能力。新模型结构的设计初衷是：能力上限更高、推理速度更快、吞吐更大、可扩展到更大参数模型。 非对称模型结构，小成本大智能 DeepSeek V4.1 Flash 为 552B 参数的 MoE 模型，采用了全新的 Causal-Enc...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502405/deepseek-v4-1-flash-ga", "publishedAt": "2026-09-10T07:18:45+00:00"}, {"title": "一周连发6个模型！这家公司把具身智能的闭环跑通了", "summary": "模型可以开源，部署经验不能", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/486625.html", "publishedAt": "2026-09-10T04:55:38+00:00"}, {"title": ":fire: 对话即是开发—— ApiGo 智能数据服务平台", "summary": "AI 大模型时代环境下，把数据库变成安全、受治理、可被 AI 调用的数据服务，需要多久？ ApiGo 的答案是：一句话的时间。 一、我们面对的现实 每一个成长中的组织，几乎都会撞上同一堵墙： 数据躺在库里，服务长在代码里。 业务部门要一个查询接口，开发排期两周；接口上线后，鉴权、限流、文档、监控又要从头搭一遍。 信...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502402", "publishedAt": "2026-09-10T03:30:35+00:00"}, {"title": "Raschka 万字拆解 GPT-6 Astra：循环架构和隐藏的推理链", "summary": "Sebastian Raschka 试完 GPT-6 Astra 之后，给了一个在他嘴里算很高的评价：「可能是我用过的最好的模型」。 但这篇长文真正的重心不在夸 Astra 有多强，而在追一个未证实的传闻：The Information 说 Astra 用了「循环深度」——也就是 looped transformer。Raschka 花了几千字把这门技术从头到尾拆了一遍，然后给出自己...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502401/gpt-6-astra-looped-transform hropic 正在“直奔自我改进型超级智能，并拿我们的生命赌博”。他警告称，未来可能出现具备超人能力的 AI 系统，能够攻破任何系统、在一夜之间改变整个行业，并获取现实世界中的权力和资源。公开资料显示，迈克尔曾任 Uber 高管，目前负责推动美国军方加快采用人工智能。他表示，AI 可能带来的危害并非无法控制，除了市场机制，还可以通过行业协作及政府参与降低风险。此次言论发生在美国国防部与 Anthropic 的长期争议背景下。国防部此前要求该公司允许军方在不受额外限制的情况下使用 AI 工具，Anthropic 则坚持为军事用途设置额外安全保障。双方谈判破裂后，美国政府直接将其列为供应链风险企业。Anthropic 已分别在加利福尼亚州和华盛顿特区的联邦法院提起诉讼，要求撤销国防部的相关认定。加州案件的法官已作出有利于 Anthropic 的裁决，但华盛顿联邦上诉法院尚未作出最终决定。迈克尔称，华盛顿特区巡回上诉法院的案件“更加重要”，并坚持认为，在法院未颁布初步禁令的情况下，Anthropic 仍构成供应链风险。迈克尔还指责 Anthropic 为诉讼“挑选法院”，称该公司选择了政治立场较为自由的加州北区联邦法院。他认为，华盛顿特区巡回上诉法院更具国家安全审查属性，预计未来几个月将作出裁决。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/080.htm", "publishedAt": "2026-09-10T23:55:21+00:00"}, {"title": "办公协作平台 Slack 升级 Slackbot AI 助手，可快速创建交互式报告 / 网站等内容", "summary": "IT之家 9 月 11 日消息，办公协作平台 Slack 发布公告，宣布为旗下 Slackbot AI 助手引入一项 Slackforce Surfaces 功能，用户只需告诉 Slackbot AI 助手自己的需求，即可利用自己先前的对话记录以及连接的 App 创建交互式报告、投票、仪表盘、演示文稿、微型网站等内容，之后用户可以将这些内容快速分享给同事。Slack 展示的一个案例中，用户要求 Slackbot 制作一份街机游戏主题的 AI Token 使用量可视化内容，AI 助手随后生成了交互式仪表盘，并按照销售、设计、工程等不同部门展示 Token 使用情况。Slack 近期对旗下 Slackbot AI 助手进行大规模功能提升，目前其已支持跨频道汇总信息、整理聊天消息、智能安排日程、协作式 Vibe Coding 等功能，用户无需订阅，可直接免费使用。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/070.htm", "publishedAt": "2026-09-10T23:22:05+00:00"}, {"title": "Snowflake 落地中国两年：迈向智能体企业时代，关键在上下文", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/RCa5y6tvZXbjGKeLSGZt?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-10T19:57:48+00:00"}, {"title": "推理成为新中心、Agent把生产级问题提前：AI Infra 的边界正在被重写", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/YBvKfhWu90StYj4SJVIV?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-10T17:15:13+00:00"}, {"title": "高通全球副总裁夏权：个人 AI 时代，每个人都拥有自己的智能体", "summary": "IT之家 9 月 10 日消息，据新浪科技今日消息，高通公司全球副总裁夏权在 2026 服贸会表示，随着 AI 能力不断提升，人机交互正在发生新的变化。过去人类需要依靠应用完成工作，未来人们将越来越多地与智能体协同工作。夏权指出，真正有用的个人 AI，不仅要理解用户需求，还要能够实时响应，并在不同设备和场景之间保持连续协同，意味着未来的 AI 能力需要在不同层级之间协同运行。在这种趋势下，个人 AI 终将诞生。IT之家从原报道获悉，个人 AI 不局限于单一设备，而是能够跨手机、PC、可穿戴设备、汽车等终端协同运行，提供更加自然、连续和个性化的智能体验，在这个时代，每个人都能够拥有自己的智能体。同时，计算任务未来将不再固定在某一设备上，而是可以根据具体需求，在终端、边缘和云端之间灵活分配、无缝协同。夏权进一步指出，当个人 AI 与智能体能力不断成熟，并运行于端、边、云协同的分布式架构之上，其价值将不再局限于单个设备或个人体验，而是开始为企业和产业创造新的可能。随着 AI 能力进一步融入业务流程，越来越多服务将以智能化方式交付，越来越多企业将围绕 AI 构建新的产品、服务和商业模式。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/040.htm", "publishedAt": "2026-09-10T15:22:16+00:00"}, {"title": "AI XPU 企业 d-Matrix 宣布加入英伟达 NVLink Fusion 生态系统", "summary": "IT之家 9 月 10 日消息，AI 推理芯片制造商 d-Matrix 美国加州当地时间 10 日宣布加入 NVIDIA（英伟达） NVLink Fusion 生态系统。d-Matrix 的机架级 XPU 系统将采用 NVIDIA 的 MGX 通用机架参考架构。具体来看，d-Matrix 自 \"Raptor\" 起的下一代推理 XPU 将与 NVIDIA Vera CPU、NVLink 交换机、BlueField-4 DPU、ConnectX-9 SuperNIC、Spectrum-X 以太网网络相整合，实现纵向 (Scale-up) 与横向 (Scale-out) 的扩展。NVIDIA 另一 NVLink Fusion 合作伙伴将为 d-Matrix XPU 提供定制连接解决方案。基于 MGX 平台的 d-Matrix 机架将采用模块化无线缆托盘。加入 NVLink Fusion 生态意味着 d-Matrix 无需进行复杂的选型设计即可享受到机架级解决方案带来的更大扩展域，能将更多的精力放在 AI XPU 本身的开发上。相关阅读：《联发科将基于英伟达 NVLink Fusion 为客户开发定制 XPU，另获英伟达 35 亿美元投资》《英伟达围绕 NVLink Fusion 与 Marvell 展开合作，并向后者投资 20 亿美元》《SiFive 加入 NVLink Fusion 生态，为数据中心级 RISC-V 导入英伟达高速互联》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/000/998.htm", "publishedAt": "2026-09-10T13:07:03+00:00"}, {"title": "Copilot 代码审查功能已登陆 Azure Repos，按审查次数计费", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/kB15qdDc6NFLdaUbCbqo?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-10T11:00:00+00:00"}, {"title": "边创作，边评估：纳逗 PRO·剧本空间的多 Agent 实践｜QCon上海", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/I0qWiIGTkCqG8H1hAoJb?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-10T10:00:00+00:00"}, {"title": "营销科技巨头蓝色光标与全球达人营销AI平台AhaCreator达成深度合作，让品牌更高效连接全球500万创作者", "summary": "从一次投放到一套增长系统，AI 让海外达人营销可规模化复制", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/486651.html", "publishedAt": "2026-09-10T06:25:22+00:00"}, {"title": "dee const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';

    html += '<a href="#sec-' + i + '">'

  nav.innerHTML = html;
}

      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
