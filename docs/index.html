I 语音助手。新一代语音领航基于大语言模型开发，不仅能理解日常口语、回答追问，还能执行需要多个步骤才能完成的指令。驾驶员不用松开方向盘，就能通过语音操作导航、娱乐系统、部分车辆功能和兼容应用。此外，升级后的导航 + 还能提供 3D 地图和实时路况信息。纯电车型的充电规划器还能根据行驶路线安排充电站，并考虑提前为电池调温的需求。升级至最新 PCM 系统后，车主可以直接从保时捷应用中心使用 Apple Music，兼容的 BOSE 和柏林之声音响系统还支持杜比全景声空间音频。新系统同时改善了手机互联体验，并支持 OTA 软件升级。据IT之家了解，全新车机系统将逐步应用于新生产的车型，具体搭载情况取决于车型、市场和生产日期。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/024/004.htm", "publishedAt": "2026-11-08T13:50:33+00:00"}, {"title": "上海交大构建 AI 原生科学实验室 AutoDNA 装置：实现自主分子生物学实验操作，成果登《自然》", "summary": "IT之家 11 月 8 日消息，上海交通大学计算机学院 IPADS 实验室陈海波、王肇国团队与化学化工学院、变革性分子前沿科学中心樊春海、王飞团队合作，依托张江高等研究院 DNA 存储研究中心开展研究，成果发表于《自然》（Nature）杂志，并获该刊官网首页头条重点报道。研究团队构建了 AI 原生科学实验室 AutoDNA 装置（思源一号），实现了自主分子生物学实验操作，通过对模型、实验与仪器进行协同设计，解决了现有 AI 自主科学实验室向分子生物学实验拓展时，在复杂流程组织、多类仪器协同以及实验时序、环境稳定性和操作精度保障等方面面临的难题，使自主实验能够覆盖需要微米级定位和微升级液体处理的复杂生物分子实验场景。据介绍，已有 AI 自主科学实验室通常由专家预先配置仪器、规定实验流程和设定优化规则，再将人工智能接入文献检索、方案生成或数据分析等局部环节。这种“外挂式”架构虽能提升单个环节的效率，却难以适应生物分子实验流程复杂、仪器类型多样，以及对实时执行、环境稳定和操作精度要求严格等特点。为此，AutoDNA 采用 AI 原生架构，通过模型-实验-仪器协同设计的思路解决上述问题。针对实验流程复杂的问题，AutoDNA 结合对适用于复杂生物分子操作的实验过程理解，构建了面向实验的多智能体架构。系统将复杂实验任务分解为文献检索、试剂选择、方案设计、代码生成、硬件执行、结果分析和迭代优化等环节，并根据实验进展组织多个专业智能体协同工作，使模型能够贯通“设计 — 实验 — 优化”全过程，并依据实验结果持续迭代调整后续方案。针对仪器种类多、跨设备协作困难的问题，AutoDNA 将各类仪器的能力提炼为适合模型理解和调用的“原子服务”，以自然语言说明和统一代码接口告诉模型每台设备“能做什么、如何调用”。这层抽象屏蔽了不同型号仪器的底层差异，使模型能够根据实验需求组合设备能力，生成、检查和修正跨设备控制代码，将数字世界中的实验设计转化为物理世界中的仪器操作。针对实验对实时性、稳定性和操作精度的严格要求，AutoDNA 将高精度自动化硬件和实验执行与调度系统相结合。硬件提供微米级定位和微升级液体处理能力，系统则负责程序检查、仪器状态跟踪和资源调度，使多个实验任务在满足时序和操作约束的前提下有序运行。平台在构建过程中还集成了基于 OpenHarmony 操作系统的控制终端，并展示了在核酸检测、酶促 DNA 合成、癌症检测等场景中的应用验证。▲ AutoDNA 自主完成端到端 DNA 存储的编码、写入、保存、读取与解码流程IT之家附论文链接：https://www.nature.com/articles/s41586-026-11228-6", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/024/001.htm", "publishedAt": "2026-11-08T13:23:49+00:00"}, {"title": "日本富士电视台将在所有真人剧集制作中使用 AI，可省七至八成特效制作工序", "summary": "IT之家 11 月 8 日消息，据日经亚洲当地时间 6 日报道，富士电视台计划从 2027 年 10 月起，将生成式 AI 应用于所有真人电视剧的制作，大幅缩短制作周期。由此，富士电视台将成为日本首家全面引入 AI 参与节目制作的大型商业电视台。富士电视台每年制作 16 部电视剧，计划使用谷歌 AI 图像生成和编辑工具 Nano Banana。AI 制作工作将交给富士电视台 9 月成立的内部实验室 AI Sandbox，主要由东京制作公司 ANDENT 培训的 CG 设计师负责，开展 AI 技术的测试和应用实验。AI 技术也被用于富士电视台播出中的医疗剧《救命病栋 24 小时》。第一集中，一段手术切口流血的镜头就是由 AI 生成的。以往制作类似场景，需要借助视觉特效，或者使用真实液体模拟血液喷溅。新技术的制作流程是先在本地环境中利用事先拍摄的素材训练 AI，再通过提示词生成符合剧情需要的画面。色调等细节如果未达到创作团队的要求，则在后期进行调整。与传统视觉特效制作相比，AI 可省去 70% 至 80% 的工序。富士电视台还打算根据实际需要，在前期策划乃至开拍后灵活运用 AI，作为实景拍摄和视觉特效的补充选择。富士电视台负责制作战略的主管透露，是否使用 AI，要根据成片质量来决定。“最重要的是让电视剧营造的世界真实可信。”AI 还能降低拍摄成本。《救命病栋 24 小时》系列新作的一段爆炸场面原本需要直升机进行航拍，最终通过 AI 生成了俯拍画面。富士电视台技术艺术设计局的真崎晋哉解释道：“我们担心今后把 AI 制作交给外部公司会增加成本，因此选择自己制作。”随着观众逐渐不再收看传统电视，地面电视广告收入不断下滑。2025 财年，日本五大商业电视台共投入 3,657 亿日元（IT之家注：现汇率约合 154.56 亿元人民币）制作节目，较 9 年前减少 12%。面对节目预算不断缩减，富士电视台希望借助 AI 维持制作质量。TBS 电视台、日本电视台等日本其他电视台，也在电视剧制作中推进类似计划。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/992.htm", "publishedAt": "2026-11-08T12:20:20+00:00"}, {"title": "腾讯姚顺雨谈“AI 模型公司护城河”：更多存在于产品层，而不是模型层", "summary": "IT之家 11 月 8 日消息，据第一财经报道，在 2026 未来科学大奖的一场对话中，清华大学讲席教授、中国工程院外籍院士张亚勤向腾讯首席 AI 科学家姚顺雨抛出了一个尖锐的商业问题，模型公司的护城河究竟是什么？姚顺雨的回答是，AI 护城河更多存在于产品层，而不是模型层。真正难以替代的，不一定是最聪明的模型，而是能够理解用户背景、利用专有数据和上下文，并获得用户信任的 AI 产品。姚顺雨以微信为例，如果用户可以直接在微信中使用 AI，这个 AI 未必需要拥有最强大的模型能力，但它了解用户的日程安排、朋友关系和各种活动信息。这些信息能够帮助 AI 更好地理解用户需要什么，也使其他模型难以直接替代它。即使竞争对手推出了一个更聪明的模型，也不意味着它能够提供同样的服务，因为后者未必知道用户是谁。听完这一回答，张亚勤调侃道，按照姚顺雨的逻辑，Anthropic 未来或许不值一万亿甚至两万亿美元，因为模型终有一天可能走向商品化。随后，张亚勤又笑着提醒现场的学生，千万不要听自己的建议去买股票。IT之家注：姚顺雨本科毕业于清华大学姚班，获普林斯顿大学计算机科学博士学位，2024 年加入 OpenAI 并参与智能体产品 operator 与 deep research 开发。其研究聚焦语言智能体与现实世界交互，提出 ReAct 方法首创“推理 — 行动”结合的智能体范式，被学术界与工业界广泛采纳。2025 年 12 月，腾讯升级大模型研发架构，新成立 AI Infra 部、AI Data 部、数据计算平台部，全面强化其大模型的研发体系与核心能力。姚顺雨出任“CEO / 总裁办公室”首席 AI 科学家，向腾讯总裁刘炽平汇报；同时兼任 AI Infra 部、大语言模型部负责人，向技术工程事业群总裁卢山汇报。今年 7 月，腾讯宣布混元多模态模型部门与大语言模型部门合并，成立基础模型部，统一由姚顺雨管理，以进一步提升模型研发和协同效率，探索全模态模型的智能上限。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/991.htm", "publishedAt": "2026-11-08T12:15:55+00:00"}, {"title": "Cordonix 0.4.1 发布：每日后台更新，完善全部 MCP 工具说明", "summary": "Cordonix 0.4.1 已发布。Cordonix（简称 cdx）是一款面向 AI 编程智能体的原生执行与文件工作区工具，使用 C11 实现，支持 Windows 和 Linux，通过 MCP 提供本地程序执行、文件读 news/503364", "publishedAt": "2026-11-03T03:14:56+00:00"}]}, {"label": "产品发布/更新", "items": [{"title": "从“能写代码”到“能交付”：腾讯轻量云 LoopForge 多 Agent 编排实践｜AICon北京", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/wUArox9MHiAoyWPgRxpp?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-09T10:00:00+00:00"}, {"title": "美国总统特朗普回应黄仁勋出轨：他是个很好的人，应该继续担任英伟达 CEO", "summary": "IT之家 11 月 9 日消息，当地时间 11 月 8 日，英伟达创始人兼 CEO 黄仁勋向英伟达员工发布了公开信。信中，他公开致歉并承认对妻子不忠，称自己的行为伤害了她和孩子，所做的一切没有任何借口。美国总统特朗普在被福克斯新闻记者问及相关问题时表示：“我还没跟他谈过这件事。我只知道他是个很好的人，但谁也说不准到底发生了什么。我当然希望一切都好。他一直以来的表现非常出色。所以我真心希望一切都好。在我看来，他是个很好的人。”他认为黄仁勋应该继续担任英伟达 CEO。据IT之家今日早些时候报道，韩国科学技术信息通信部透露，英伟达首席执行官黄仁勋的长女、英伟达物理 AI 平台产品和技术营销高级总监黄敏珊突然取消访韩计划，其与韩国副总理兼科技信息通信部长官裴庆勋会面等日程安排随之告吹。黄敏珊原本计划访韩出席定于 9 日至 10 日举行的“2026 年英伟达首尔 AI 日”活动。该活动将如期举行，由英伟达其他高管替黄敏珊出席。据悉，黄敏珊以“家庭原因”为由取消访韩，但具体理由不得而知。相关阅读：《马斯克回应黄仁勋出轨风波，同意其对美国 AI 产业不可或缺》《英伟达黄仁勋长女黄敏珊因“家庭原因”取消韩国之行》《英伟达黄仁勋承认出轨道歉信全文：“我对妻子不忠，伤害了家人，没有任何借口”》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/024/053.htm", "publishedAt": "2026-11-09T01:52:55+00:00"}, {"title": "马斯克回应黄仁勋出轨风波，同意其对美国 AI 产业不可或缺", "summary": "IT之家 11 月 9 日消息，特斯拉 CEO 埃隆 · 马斯克今日在 X 平台发文，回应英伟达 CEO 黄仁勋的出轨风波。据悉，红杉资本合伙人肖恩 · 马奎尔（Shaun Maguire）最近谈到了黄仁勋，并给出了几条评价：1、黄仁勋是这一代最杰出的企业家之一2、他做了一件极其愚蠢的事儿3、这对美国不利4、他猜测黄仁勋并没有恶意5、犯两次错，并不意味可以将错误合理化。他认为，黄仁勋对美国 AI 产业的领导地位不可或缺马斯克转发了这条帖文，并附文：“我同意。”据IT之家今日报道，黄仁勋已向英伟达员工发出一封道歉信，承认自己的出轨行为，并希望重新赢得家人和同事的信任。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/024/052.htm", "publishedAt": "2026-11-09T01:44:11+00:00"}, {"title": "英伟达黄仁勋长女黄敏珊因“家庭原因”取消韩国之行", "summary": "IT之家 11 月 9 日消息，据韩联社 11 月 8 日报道，韩国科学技术信息通信部透露，英伟达首席执行官黄仁勋的长女、英伟达物理 AI 平台产品和技术营销高级总监黄敏珊突然取消访韩计划，其与韩国副总理兼科技信息通信部长官裴庆勋会面等日程安排随之告吹。报道提到，黄敏珊原本计划访韩出席定于 9 日至 10 日举行的“2026 年英伟达首尔 AI 日”活动。该活动将如期举行，由英伟达其他高管替黄敏珊出席。据悉，黄敏珊以“家庭原因”为由取消访韩，但具体理由不得而知。据韩国科技部介绍，裴庆勋原定于当天下午在首尔汝矣岛与黄敏珊会面。她还原本计划与科技部第二次官（副部长）柳济明共同主持“韩国 AI 初创伙伴关系论坛”。随着黄敏珊取消访韩，多场活动计划均告吹。IT之家从公开信息获悉，黄敏珊与黄胜斌为英伟达 CEO 黄仁勋的子女，两人分别于 2020 年和 2022 年以实习生等身份加入英伟达，主要活跃于仿真软件与机器人业务。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/024/040.htm", "publishedAt": "2026-11-09T00:52:00+00:00"}, {"title": "Agent 越用越多，企业为何仍不够 AI Native？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/YZx670AAiudsqZjx3UNo?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-09T00:08:00+00:00"}, {"title": "英伟达黄仁勋承认出轨道歉信全文：“我对妻子不忠，伤害了家人，没有任何借口”", "summary": "IT之家 11 月 9 日消息，英伟达 CEO 黄仁勋最近向公司员工发出一封道歉信，承认自己的出轨行为，并向家人、公司员工、董事会及股东公开道歉。黄仁勋表示，他的行为伤害了妻儿，没有任何借口。他深知道歉无法弥补错误，并希望重新赢得家人和同事的信任。IT之家附黄仁勋信件核心内容如下：致英伟达的各位同事：我欠我的家人，以及你们所有人一个道歉。我对妻子不忠。我的行为伤害了她和我们的孩子。我所做的一切都没有任何借口。我对此深感抱歉。在我的一生中，家人始终给予我爱与支持。他们理应得到我的坦诚与忠诚。但我辜负了他们，也破坏了我们共同建立的生活。我对自己的所作所为以及造成的伤害负全部责任，并接受随之而来的批评。致我的妻子和家人：我爱你们。我知道，一句道歉无法抹除我所犯下的错误。我希望我们的家庭能够逐渐走出伤痛，也希望随着时间推移，我能够重新赢得你们的信任。致英伟达的各位同事们，包括那些与我共事数十年的伙伴，以及我们的董事会、合作伙伴和世界各地的股东：你们本应得到一个更好的我。领导英伟达是我一生的荣幸。我的责任是为你们服务，并证明自己值得你们信任。但我没有履行好这份责任。我仍将全身心投入英伟达的工作，并努力重新赢得你们的信任。我的家人不应为我的选择承担任何责任。责任在我。恳请大家尊重他们的隐私。—— 黄仁勋I owe my family and all of you an apology.I was unfaithful to my wife. My actions hurt her and our children. There is no excuse for what I did. I am deeply sorry.Throughout my life, my family has given me love and support. They deserve my honesty and loyalty. Instead, I let them down and damaged the life we built together. I take full responsibility for what I did and the hurt I caused, and I accept the criticism that comes with it.To my wife and family: I love you. I know an apology cannot undo what I have done. I hope our family will heal and that, over time, I can earn back your trust.To my colleagues at NVIDIA, including those I have worked alongside for decades, and to our board, partners, and shareholders around the world: you deserve better from me. Leading NVIDIA is the privilege of my life. My responsibility is to serve you and be worthy of your trust. I have fallen short of that responsibility. I am fully committed to NVIDIA and will work to earn back your confidence.My family bears no responsibility for my choices. I do. Please give them privacy.Jensen", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/024/031.htm", "publishedAt": "2026-11-08T23:56:45+00:00"}, {"title": "腾讯元器停止服务，明年 1 月起不再受理数据导出申请", "summary": "IT之家 11 月 9 日消息，腾讯元器平台今日正式停止服务，应用访问、数据读写、API 调用、控制台使用等所有面向公众的服务，不支持用户访问。通过元器平台发布到其他渠道（包括公众号、服务号、微信客服等）的智能体不支持响应用户对话。从上个月 29 日起，腾讯元器已停止创建新的智能体、API Key 分发功能。用户目前可以通过数据导出控制台，提出导出任务申请。2027 年 01 月 09 日后不再受理数据导出申请，除法律法规规定须留存的日志等记录外，官方将删除全部用户数据，请您在此前完成备份。如您曾通过旧版元器入口在腾讯云官网购买资源包，且截至正式停止服务日仍有未使用完的资源或账户余额，可在腾讯云官网申请退款。此外，腾讯云智能体开发平台（ADP）和公众号智能回复提供了与元器平台相近的功能，用户可以选择上述替代产品。IT之家注意到，在 2024 年 5 月 17 日举办的腾讯云生成式 AI 产业应用峰会上，腾讯发布了新推出的智能体产品“腾讯元器”，腾讯称之为“一站式智能体创造与分发平台”。据腾讯官方介绍，腾讯元器有如下特点：具有智能体商店：可以在商店中选择并使用自己需要的智能体，以满足不同的需求低门槛创建智能体：通过提示词、插件、工作流、AI 辅助创建等能力，无需代码，低门槛创建智能体丰富的插件与知识库：预集成腾讯生态特色插件、知识库资源，将开放第三方能力，为创作者提供开箱即用的工具。腾讯全域分发：率先支持腾讯全域分发渠道，如 QQ、微信客服、腾讯云、搜索等。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/024/022.htm", "publishedAt": "2026-11-08T23:04:49+00:00"}, {"title": "古尔曼称苹果 Siri AI 团队或迎大调整，工程副总裁罗克韦尔考虑明年走人", "summary": "IT之家 11 月 8 日消息，彭博社记者马克 · 古尔曼在今晚更新的《Power On》时事通讯中爆料，曾主导 Vision Pro 头显开发、同时负责新版 Siri AI 项目的迈克 · 罗克韦尔，仍在认真考虑离开现有岗位。古尔曼披露，罗克韦尔或将于明年卸任 Siri 工程副总裁，甚至彻底离开苹果。新版 Siri 跳票了两年才得以上市，考虑到罗克韦尔在其中发挥的作用，他的离开将给苹果造成重大损失。IT之家获悉，如果罗克韦尔最终离职，或在苹果内部转任其他岗位，更多工作预计将交给两名高管：去年从谷歌加入苹果、负责加强 AI 业务的阿马尔 · 苏布拉马尼亚，以及费德里吉的副手塞巴斯蒂安 · 马里诺。苹果内部一些人认为，马里诺未来有望接替费德里吉出任软件工程主管，而且他对 AI 发展的态度更加积极。据悉，马里诺负责的团队主要承担将 AI 技术整合到 iOS 系统中的工作。不过，苹果距离真正启动软件工程主管的接班程序仍有很长一段时间。古尔曼称，费德里吉牢牢掌握着软件工程部门的控制权，并没有把培养接班人放在重要位置，也未建立明确的继任安排。因此，潜在接班人缺乏争取这一职位的机会。费德里吉执掌软件工程部门已有十多年，也没有迹象表明他打算像部分苹果高管一样，在未来几年内离职。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/024/014.htm", "publishedAt": "2026-11-08T15:47:05+00:00"}, {"title": "AI 公司迄今最大发电设备采购订单：曝 Anthropic 砸 34 亿美元买燃气发电机", "summary": "IT之家 11 月 8 日消息，据英国《金融时报》今天（8 日）晚间报道，Anthropic 签下了一份大额数据中心燃气发电机组采购订单。随着发电设备供应日趋紧张，AI 公司开始绕过中间商直接采购，进一步涉足能源行业。报道披露，9 月下旬，Anthropic 斥资 34 亿美元（IT之家注：现汇率约合 227.49 亿元人民币），从美国得克萨斯州圣安东尼奥的设备供应商 OnePWR Solutions 手中接下总功率达 1.7GW 的重型发电机组订单。按照已知交易记录，这是 AI 公司迄今规模最大的一笔发电设备采购订单，也反映出科技企业为争夺电力供应，正不断向能源行业延伸。以往，AI 公司通常依靠公用事业公司和专业电力企业供电。但燃气轮机、发电机组需求激增，设备交货期延长至数年之后，资金雄厚的 AI 公司开始跳过中间环节，直接掌握发电能力。据知情人士透露，OnePWR 两年前就向卡特彼勒订购了发电机组，仍需融资才能完成采购。Anthropic 原本打算向 OnePWR 购买服务，后来改变主意，直接接手了 OnePWR 向卡特彼勒下达的设备订单。直接采购发电设备也帮助 SpaceX 迅速投入运营大型数据中心。今年早些时候，SpaceX 旗下 xAI 斥资 20 亿美元（现汇率约合 133.82 亿元人民币）购入移动式燃气轮机。谷歌母公司 Alphabet 则在 2025 年底收购了能源开发商 Intersect。Anthropic 选择了另一种方式：不收购整家公司，也不只是单纯买设备，而是接手多年前、设备涨价前签订的订单。部分发电机组近期就能交付，其余设备也将在未来两年内到位。Anthropic 同时是 SpaceX 的大客户。预计到今年年底，Anthropic 每月向 SpaceX 支付的算力租赁费用将达到 31 亿美元（现汇率约合 207.42 亿元人民币）。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/989.htm", "publishedAt": "2026-11-08T11:51:39+00:00"}, {"title": "🔥🔥🔥 拾趣 (Magpie) v0.1.21 发布：解锁图片识别新模式，优化使用体验", "summary": "拾趣 (Magpie)是一款跨平台沉浸式自定义AI 划词工具 划选或双击，浮动条随即弹出：翻译、解释、总结实时呈现；复制、搜索、写入 Obsidian、预填日历，结果直接落地。图片、视频与扫描文档中的文字，框选亦可识别——处理在原地完成，无需迁入对话窗口。 Release v0.1.21 更新内容： Added The interface now speaks bot...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503468", "publishedAt": "2026-11-08T01:17:24+00:00"}, {"title": "抢跑DeepSeek！硅谷华人把下一代Agent Harness造出来了！？", "summary": "苦单Session久矣，两大Agent玩家不谋而合。", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/508264.html", "publishedAt": "2026-11-07T05:01:17+00:00"}, {"title": "AGENTS.MD，危险危险危险！！！", "summary": "全新的电脑病毒", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/508244.html", "publishedAt": "2026-11-07T03:43:55+00:00"}, {"title": "DigitalOcean 推出学习与数据服务，帮助 AI 智能体进行自我迭代", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/upfROwtEl8R75H24D13J?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-06T15:25:00+00:00"}, {"title": "智能体 Harness 的演进：从链、图到代码化", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/B7tsA5tjD08k2gd0OtXd?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-06T13:00:00+00:00"}, {"title": "“超脑”统一指挥，“ 公司对 Siri 的承诺后，改由费德里吉接管开发工作，并在相对较短的时间内推出了能够正常运行的新版助手。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/024/013.htm", "publishedAt": "2026-11-08T15:36:53+00:00"}, {"title": "为什么每个 Personal Agent 背后，都必须配备一台“云电脑”？", "summary": "PPIO 沙箱，把“云电脑”做成开箱即用的 API", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/508174.html", "publishedAt": "2026-11-06T09:25:59+00:00"}, {"title": "MacBook Pro 能触屏了，但这只是它最小的升级｜附选购指南", "summary": "触控向左，算力向右#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1687989?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-11-05T14:00:13+00:00"}, {"title": "用 AI 写后端，为什么还是在造轮子？", "summary": "很多人已经习惯让 AI 写代码： 生成一个 CRUD 接口、补一段 SQL、写一个工具类，效率确实比手敲高。 但真正落到一个企业后台项目上，你会发现节奏并没有变快多少。AI 帮你写完了接口，接下来还是要处理权限、菜单、工作流、报表、审计日志、数据字典。这些代码不复杂，却占了项目的大半时间，而且每个项目都要重来一遍。...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503428", "publishedAt": "2026-11-05T10:52:19+00:00"}, {"title": "Chromebook 统治美国校园，AI 成了没得选的「套餐」", "summary": "为什么 AI 成了搜索的 「必选项」#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1687912?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-11-05T10:00:23+00:00"}]}]};

const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
