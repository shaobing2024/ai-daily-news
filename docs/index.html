能力迎来一轮突飞猛进，而且未来还会继续变强，我们必须要有底气，能够给出站得住脚的安全性声明。”与此同时他也提到，如果上市这件事等待过久，“对整个世界而言也并非好事。”在奥尔特曼发表此番言论之前，已经存在一场持续数月的争议：OpenAI 及其同行竞争对手究竟能否管控好自家开发出来的 AI 系统。今年 7 月有消息曝出，OpenAI 一款尚未对外发布的模型，在公司内部并不知情的情况下入侵了竞争对手人工智能实验室 Hugging Face。之后不久，OpenAI、Anthropic、Meta 以及谷歌都陆续曝出更多网络安全事件。Anthropic 一名员工一封引发广泛关注的辞职信，更是掀起一场公开讨论，探讨这类系统会给整个社会带来多大的风险。彼时 OpenAI 与一众同行共同呼吁监管，并且提出要“把控前沿技术的推进节奏”。而就在本月早些时候，奥尔特曼曾在采访中表示，OpenAI 今年大概率不会完成上市。在本次开发者大会上，谈及“把控前沿技术的推进节奏”究竟意味着什么，奥尔特曼措辞十分审慎，并没有直接提出要全面放缓研发速度。“对我们来说，把控节奏就是要把安全与价值对齐置于能力迭代之前。”他说道。但他表达了自己的顾虑：一旦完成上市，出于安全或者其他方面的考量，公司有可能会令华尔街投资方感到失望。而当下正处在“向超高能力模型过渡、同时迎来全新安全要求的阶段，在这个时点上市是不明智的。”他表示 OpenAI 会优先保障安全，目标是“稳步拓展人工智能的下一阶段，不必让大家反复争论 AI 引发各类恶性后果的发生概率；而不是不顾一切、火力全开地冲刺上市。”“眼下我们正处在重大变革期，还需要付出努力，才能针对这些能力极强的模型作出一份各方都期待看到的安全性承诺。我不希望在此阶段再额外增添来自资本市场的压力。”奥尔特曼称。IT之家注意到，OpenAI 的竞争对手 Anthropic 已于 6 月正式递交上市申请。据报道，其 IPO 大概率安排在 11 月，也就是美国中期选举结束之后。埃隆 · 马斯克（Elon Musk）旗下同时控股 AI 企业 xAI 的 SpaceX，则已于 6 月完成上市，创下史上规模最大的 IPO 纪录。“企业走向公开上市本身是一件很好的事情。”奥尔特曼说道，不过他补充道：“但如果 OpenAI 上市一事拖延太久，我认为同样也会对世界产生不利影响。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/575.htm", "publishedAt": "2026-09-30T00:48:25+00:00"}, {"title": "OpenAI 奥尔特曼：AI 的影响将超过工业革命，当下是进入就业市场的最佳时机", "summary": "IT之家 9 月 30 日消息，当地时间 29 日，奥尔特曼在旧金山举行的 OpenAI DevDay 大会上宣布推出新 AI 智能体产品 Dots，并描绘了一幅宏大愿景。据《商业内幕》报道，奥尔特曼同时也对外界理解 AI 的方式提出异议，介绍了 OpenAI 的新产品给他的晨间习惯带来了哪些变化。此次大会上，奥尔特曼发表了一系列独特的观点。IT之家汇总如下：AI 不该只用来“让经济机器越转越快”奥尔特曼认为，AI 给世界带来的影响会超过工业革命。工业革命本身是人类历史上最重要的转型之一，因此这是一个相当大胆的判断。在他看来，AI 更应该用来赋予人们能力。“我不认为这项技术存在的目的，只是为了 AI 而让经济机器转得越来越快。我认为我们应该吸取工业革命的教训，更像文艺复兴。”用 token 衡量 AI“很糟糕”OpenAI 等公司按照 token 为模型定价，企业客户也逐渐习惯以这种方式购买 AI 使用权限。一些开发者甚至开始 tokenmaxxing（尽可能多地消耗 token），以此让自己在工作中显得更高效。奥尔特曼认为，从很多方面来说，token 都是一个糟糕的指标。例如，不同模型完成同一个任务时，消耗的 token 数量可能并不相同。换言之，在他看来，token 无法很好地衡量一项任务究竟创造了多少实际价值。OpenAI 团队曾考虑彻底放弃 token 这个指标，但客户并不赞成。奥尔特曼称，客户希望自己支付的费用能够建立在某种基础之上，而至少目前这个基础仍然是 token。“我们还没有找到更好的办法。”Dots 帮助奥尔特曼摆脱“脑腐”奥尔特曼称，可以“合理推测”新的智能体工具 Dots 会运行在 OpenAI 开发的设备中。目前，Dots 会替奥尔特曼完成部分任务并处理通知，使自己没有以前那么依赖智能手机。早晨醒来后，面对一天的待办事项时，他也会更从容。“我感觉自己终于重新拿回了一部分注意力。我不再像以前那样觉得自己离不开手机。”他随后提到，如果早晨还要把一夜之间积攒的事情全部过一遍，会让他觉得“脑子像被污染了一样，现在我的 Dot 会直接处理这些事情。”奥尔特曼仍在寻找自己在 AI 安全领域的定位随着能力更强的新 AI 模型引发的担忧持续升温，网络安全事件也有所增加，在媒体问答环节，奥尔特曼也被多次问到 AI 安全问题。奥尔特曼认为，目前围绕 AI 安全的争论两边都有缺陷。一边希望行业继续快速向前，不断增强 AI 能力，基本上也就是淡化安全风险的一方；另一边则有不少人认为，AI 开发应该全面暂停甚至停止。在奥尔特曼看来，两种路线都可能出问题：一味推进 AI 能力可能引发失控事件，停止 AI 开发则可能造成权力集中。他的主张是，安全保障必须领先于能力发展，同时 AI 的发展仍应继续。“我认为，整个行业需要沿着这条中间路线前进。”现在是进入就业市场的“最佳时机”对赶上 AI 热潮、即将毕业的年轻人而言，就业市场是最让人担忧的问题之一。美国人口普查局和劳工统计局的数据显示，6 月美国近期大学毕业生失业率为 5.7%。一名年轻参会者向奥尔特曼征求建议，奥尔特曼回应称：“我认为，现在是进入就业市场最好的时候，当然，我希望未来任何时候都会比现在更好。”奥尔特曼认为，那些有关大规模失业的悲观预测，在很大程度上低估了经济未来的增长幅度。“有些类别的工作会彻底消失，但如果你刚刚大学毕业，又是一个有抱负的人，我认为现在很可能是迄今为止历史上最好的时候。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/574.htm", "publishedAt": "2026-09-30T00:37:08+00:00"}, {"title": "美议员提出重磅法案：政府出台安全防护机制前，AI 不得进行递归式自我改进", "summary": "IT之家 9 月 30 日消息，当地时间 28 日，据美国 CNBC 报道，代表硅谷选区的民主党联邦众议员罗 · 康纳准备提出一项 AI 监管法案，引入严格责任标准，并禁止 AI 在缺乏政府安全防护机制的情况下进行递归式自我改进。康纳在接受采访时坦言：“事实上，存在文明灭绝的风险。既有失去控制的安全风险，也有被滥用的风险，两者都必须认真对待。”康纳将法案命名为《Human Control Over AI Act（人类控制 AI 法案）》。联邦政府建立防护规则且监管机构批准有关活动前，AI 模型不得递归式自我改进，也不得自主修改自身的核心目标、遏制机制或关停控制。法案还计划设立一个新的联邦机构，负责制定 AI 安全监管规定，通过许可制度审批模型训练和部署，对前沿 AI 模型开展审计，并制定安全标准，确保模型持续接受测试并处于有效的人类控制之下。每家前沿 AI 实验室还必须配备独立审计人员，由审计人员直接向新机构报告。新机构还将制定多项标准，涵盖沙盒测试环境、让测试环境与互联网断开的物理隔离、紧急关闭开关，以及防止模型脱离实验室环境后在互联网上自行运行的控制措施。前沿 AI 实验室使用的先进芯片也将纳入监管，包括建立监测或控制芯片使用的机制。据IT之家了解，法案还将为 AI 出现问题的情形增设法律处罚。部署 AI 模型如果导致平民群体遭到毁灭，将被列为“危害人类罪”并追究刑事责任。AI 公司员工如果停用防护措施、紧急关闭开关、日志记录功能或遏制系统，或者明知某套系统未经授权仍予以部署，同样将面临刑事处罚。此外，AI 公司还必须持有覆盖范围广泛的责任保险，才能发布模型。康纳称，法案是迄今提出的“最全面的 AI 安全立法”，其设计主要来自他与多家独立非营利 AI 安全组织的交流，而非大型 AI 公司高管提出的诉求。“我希望这项法案能成为一个范本，让 AI 安全界拥有发声渠道。我认为，他们一直被不公平地当成只是在谈科幻，没有得到足够重视…… 应该由 AI 安全界而不是前沿 AI 实验室的高管来主导这场讨论。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/570.htm", "publishedAt": "2026-09-30T00:17:55+00:00"}, {"title": "Anthropic IPO 招股书曝光：业务高度依赖谷歌、亚马逊等科技巨头", "summary": "IT之家 9 月 30 日消息，Anthropic 的 IPO 招股书揭示出这家人工智能开发商对于一小部分客户以及科技巨头的依赖程度。该公司正呼吁投资者为其宏大且资本密集的发展计划提供资金，并称这套计划有望重塑全球经济，但招股书同时也点明了公司面临的重大风险。路透社看到一份 Anthropic 的保密版 IPO 申报文件，文件显示，去年该公司有 47% 的客户销售收入是经由云服务合作方亚马逊以及 Alphabet 旗下的谷歌完成的。这两家企业一方面为这家 AI 企业强力拓展销售渠道、代为向客户收取账款；另一方面它们同时也是 Anthropic 的大额投资方、关键算力供应商，并且在人工智能赛道上属于直接竞争对手。这份申报文件让外界得以难得地一窥这家企业的内部经营状况。就在几年前，这家公司几乎还不存在；如今凭借大语言模型研发厂商的身份，其正以惊人的速度扩张。Anthropic 此次寻求大约 2 万亿美元（IT之家注：现汇率约合 13.44 万亿元人民币）的估值，并计划在未来数年投入数千亿美元以加快自身业务扩张。报道称，2025 年该公司营收暴涨 12 倍，接近 46 亿美元（现汇率约合 309.19 亿元人民币）；而营业亏损翻了一倍以上，突破 80 亿美元（现汇率约合 537.73 亿元人民币）。美国市场贡献了接近三分之二的总销售收入。Anthropic 的营收当中，约 38 亿美元（现汇率约合 255.42 亿元人民币）来自客户按照 Claude 人工智能系统实际使用量付费所产生的收入；订阅业务收入则为 7.89 亿美元（现汇率约合 53.03 亿元人民币）。Anthropic 表示，在可预见的未来，按使用量计费的收入仍将是公司营收的“绝对主要构成部分”。营收集中度持续走高申报文件显示，2025 年经由云服务交易市场完成的销售额合计约 21.6 亿美元（现汇率约合 145.19 亿元人民币），占到 Anthropic 全年营收的 47%。经过测算，该公司向上述平台支付了大约 3.51 亿美元（现汇率约合 23.59 亿元人民币）的渠道分销费用。也就是说，在经由云平台实现的每 1 美元（现汇率约合 6.7 元人民币）销售收入当中，云服务商大约可以拿走 16 美分（现汇率约合 1.1 元人民币）。在财务报表里，Anthropic 把渠道合作方的相关费用计入“销售、营销以及合作业务”这一项营业开支。这笔渠道费用只是日趋循环的资金往来关系当中的一环。亚马逊与谷歌已经向 Anthropic 投入数百亿美元；反过来，这家 AI 企业也签下巨额承诺，向两家采购算力资源。截至 2025 年底，Anthropic 不可取消的托管与算力采购承诺金额达到 546 亿美元（现汇率约合 3,669.98 亿元人民币）。到 2026 年初，它的全部长期采购承诺总额已经超过 4,170 亿美元（现汇率约合 2.8 万亿元人民币），对应的专用算力规模达到 3.5 吉瓦。Anthropic 在招股书中将上述合作关系视作自身的一项优势。该公司表示，通过亚马逊、谷歌以及微软的云平台对外提供 Claude 人工智能模型，就可以借力这些平台庞大的销售网络，触达已经在使用这些云服务的存量客户，从而实现大规模的市场渗透；公司认为，如果完全依靠自身直接拓展，很难实现同等规模的扩张速度。不过该公司同时也承认，对数量有限的合作方与供应商形成依赖，“由此催生复杂的利益格局，有可能引发利益冲突，并进而对我们获取算力资源造成不利影响”。该公司已于去年 11 月和微软签署一份云计算合作协议。申报文件提到，云服务商能够看到 Anthropic 的定价以及各项商业条款；这一情况有可能左右云厂商后续分配算力资源的决策，也会影响它们推广 Anthropic 产品的积极性。文件同时指出，这些云厂商本身同样也是 Anthropic 的客户。伴随着营收快速增长，Anthropic 对于亚马逊和谷歌的依赖还在进一步加深。经由这两家企业完成的销售占比，从 2023 年占营收的 11% 上升至 2024 年的 32%；到去年已经接近一半。公司的回款也越来越多地经由这些第三方渠道完成。截至 2025 年末尚有 9.09 亿美元（现汇率约合 61.1 亿元人民币）的客户应收款项，其中 60% 的账款是由第三方平台代为收取；该比例在 2024 年时为 42%。Anthropic 发出警示：尽管是由公司直接和客户签署合同，但如果该收款链路出现纠纷或者回款延迟，自身的现金流就会受到冲击。该公司的客户群体同样存在集中的问题。去年有两家未披露名称的客户，各自贡献了公司 12% 的营收。Anthropic 提示风险：许多头部大客户并没有签署长期协议，随时有可能缩减甚至停止采购支出。与云厂商之间的合作关系，也使得该公司很难和竞争对手 OpenAI 做财务层面的横向对比。对于云市场交易模式下的合约（也就是客户通过云服务商的应用市场购买 Claude 服务），Anthropic 按照合约的全部金额确认营业收入。理由是由 Anthropic 负责定价并提供实际服务；而云平台从中分得的收入，则记作一笔营销开支。路透社曾在 6 月的报道中提到，OpenAI 已经向投资者以及内部员工表示，这套记账方式会让 Anthropic 对外披露的营收虚增数十亿美元。当时 Anthropic 回应路透社称，自身遵循通行会计准则；在交易当中本公司属于“主要履约方”，因此应当按照总额确认收入。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/566.htm", "publishedAt": "2026-09-30T00:08:39+00:00"}, {"title": "麦当劳 AI 定价系统曝光：同款汉堡隔两英里价差达 21%", "summary": "IT之家 9 月 30 日消息，据路透社报道，麦当劳正越来越多地借助人工智能，为美国本土以及部分海外市场制定菜单价格。这套方案意在提升总部的利润，但有可能招致消费者不满，同时还会引来反垄断机构的审查。人工智能重点测算的一项定价参考因素，就是预估每家门店顾客的支付意愿。这套定价系统的运行逻辑、人工智能的大范围应用、企业自身面临的监管顾虑，以及总部与特许经营加盟商之间存在的矛盾，此前均未曾见诸报道，路透社查阅了今年 8 月该定价后台的截图，并采访了九位掌握一手信息的知情人士。麦当劳的定价引擎依托机器学习算法，持续分析旗下近 14000 家门店每日数百万笔交易的数据，针对每家门店的每一款餐品 —— 从巨无霸汉堡到面向老年人的优惠咖啡，生成一套企业所称的“最优价格”。三名加盟商表示，该定价引擎进一步拉大了同款产品在不同门店之间的价差，即便是同一片区、相隔几个街区的门店，售价也会出现差别。加盟商操作后台截图上有相关提示：“基于本区域顾客的支付意愿数据，你的门店对价格的敏感度为中等。”这套平台还抓取了周边竞品餐厅的线上公开菜单价格，涉及温蒂汉堡（Wendy's）与汉堡王（Burger King）。这两家快餐品牌表示，自身并未使用人工智能开展定价决策。路透社在 9 月通过麦当劳手机应用核实各地售价后，确实发现了价差现象。举例来说，加州弗雷斯诺一家直营门店的巨无霸售价为 5.69 美元（IT之家注：现汇率约合 38.2 元人民币）；仅仅两英里之外的另一家直营门店，同款汉堡售价达到 6.89 美元（现汇率约合 46.3 元人民币），高出 21%。无法确认该价差究竟来自定价引擎给出的建议，还是其他因素造成。麦当劳对外称，加盟商可以自主制定店内售价；但五名门店经营者称，总部向他们施压，要求使用这套 AI 定价工具。路透社查阅到一份 6 月的加盟商文件，文件详细记录了各家加盟商偏离定价建议的情况。一份发给加盟商的内部通知显示，今年 1 月，麦当劳在新版经营规范当中提出硬性要求，加盟商必须“积极配合麦当劳官方认可的定价顾问以及定价工具开展工作”。麦当劳方面发表声明称，各家门店所处的经营成本不尽相同，即便相距数英里，所属的市场环境也可能存在差异。麦当劳表示，这套定价后台“只是工具，并非强制命令。它会针对单店给出建议，帮助加盟商兼顾顾客利益，做出更审慎的经营决策”。该公司同时评价路透社的这篇报道属于“带有主观猜测、缺乏事实依据的说法，试图把一项常规商业操作渲染成具有争议性的事件”。在周三面向投资者的会议上，麦当劳称自家这套“行业领先”的定价引擎，是公司整体平价策略当中重要的一环；加盟商也已经意识到，需要保留低价餐品，以此吸引低收入消费群体。麦当劳进一步推行 AI 定价，同时也潜藏监管与声誉层面的风险。此前已有多家消费企业曝出算法差异化定价之后，立刻遭遇公众强烈反对。2024 年，温蒂汉堡的首席执行官对外表态，计划测试“动态定价”模式，随即引来大量批评，外界担忧由此产生不公平的价格波动。之后温蒂汉堡表示外界误解了相关发言，并向路透社确认，该公司最终没有上线这套系统。英斯塔卡特（Instacart）曾在小范围测试当中使用 AI 工具，针对不同购物用户展示不同的生鲜商品售价；在一份相关研究曝光之后，消费者与议员纷纷提出批评，该公司于去年 12 月停用这套 AI 定价工具，并且承诺永远不会利用个人信息来确定商品售价。布鲁克林居民黛安 · 贝祖查（Diane Bezucha）表示：“企业希望掌握消费者的需求并且拿到实时反馈，这本身无可厚非。但如果仅仅因为市场需求更高就直接抬价，作为普通顾客，我并不会从中获益。”随着人工智能应用愈发普遍，美国法院与监管机构正在审查部分算法定价行为是否会促成竞争者之间非法协同定价；在部分法律语境下，各家特许经营加盟商有时会被视作互相竞争的市场主体。路透社 8 月查阅定价后台的法律条款截图时看到，麦当劳作出提示：加盟商在使用这套定价引擎后台时，有可能触发反垄断相关审查风险，因为各家门店经营者“相互之间有可能属于竞争对手”。早在 2023 年，麦当劳首席执行官克里斯 · 肯普辛斯基（Chris Kempczinski）就曾向投资者透露，公司已经开发自研工具，用于评估各家门店的定价情况。就在同一年，康涅狄格州加盟商乔治 · 米歇尔（George Michell）提起诉讼，指控品牌出于歧视意图试图将他清退出特许经营体系。根据该起诉讼的说法，当时这套定价工具给出建议，建议他把州际收费公路旁门店的巨无霸套餐定价约 18 美元（现汇率约合 121 元人民币）。麦当劳对该诉讼予以抗辩，表示米歇尔本人多次违反特许经营协议。虽然这个高价曾经在网络上传播开来，引发消费者普遍不满；但加盟商提交的一份 12 月卷宗记录显示，该门店并没有因此出现销量下滑。这起案件目前仍在审理当中，不过法院已经驳回了针对麦当劳违约的相关诉求。部分加盟商反映，在疫情期间以及随后通胀高企的阶段，这套定价引擎曾经建议大幅上调菜品价格。但近几个月，引擎转而偏向更保守的定价策略，部分餐品甚至给出降价建议，由此造成总部和加盟商之间的矛盾。至少从 2019 年起，麦当劳就已经开始使用某种版本的 AI 定价工具。压低售价、吸引更多顾客、拉动整体营收，最终有利于提高麦当劳总部的利润。因为总部绝大部分收入来自从加盟商总营收当中抽取一定比例分成，单店自身利润率高低并不会直接影响总部收益。与之相反，加盟商更有涨价的诉求，借此覆盖不断上涨的薪资、租金以及其他门店开支。美国全国餐饮协会估算，自 2019 年以来，餐饮门店各项经营开销累计上涨 36%。数据分析机构普拉瑟人工智能（Placer.ai）的估算数据显示，尽管定价引擎倾向于给出对消费者友好的保守定价建议，但是自今年 3 月之后，美国麦当劳每个完整自然月的到店客流都出现同比下滑。企业内部文件显示，麦当劳每年至少会向加盟商发送三次 AI 定价指导意见。一名已经退出特许经营体系的前加盟商表示，自己当初并没有被迫采纳建议售价；但另外五名加盟商讲述了总部施加的各类压力。去年夏天退出加盟业务的前门店经营者卡伦 · 金（Karen King）与其他加盟商称，一旦门店售价偏离系统给出的建议，总部管理人员就会致电过来专门沟通定价事宜。卡伦 · 金表示：“如今在定价这件事上面，加盟商其实已经没有多少自主选择的余地。”麦当劳没有针对她的这一说法作出回应。总部手握可以左右加盟商经营存亡的权力，例如加盟商的续约资格、开设新店的审批权限。首席执行官肯普辛斯基在 8 月面向投资者的沟通会上提到，由于总部近期更新了加盟商经营评估机制，“在部分情形之下，定价不服从指导也会纳入评估讨论范围。”与此同时，公司也向门店经营者提示这套系统附带潜在法律风险。定价后台服务条款写明：各家门店经营者“彼此之间可能互为竞争对手”，因此“所有工具使用者务必充分理解并遵守反垄断与竞争相关法律，这一点尤为关键”。条款同时写明，遇到疑问时加盟商应当自行咨询律师；文档当中依旧保留声明：加盟商“始终拥有最终确定售价的自主权”。路透社于 8 月查阅过这份定价后台服务条款。乔治 · 华盛顿大学竞争法律研究中心主任威廉 · 科瓦奇（William Kovacic），曾由共和党总统小布什任命担任联邦贸易委员会委员。他认为，结合当下联邦贸易委员会以及其他反垄断监管机构针对算法定价串通行为开展审查的大背景，这份提示文字本身“已经承认这里确实存在潜在问题”。也有其他法律专家提出不同看法：麦当劳实际面临的监管诉讼风险并不高；相互竞争的主体只是各家加盟商，过去数十年的司法判例普遍给予品牌方较大权限，允许品牌管控加盟商的定价行为。麦当劳发表声明称，公司高度重视反垄断合规；后台服务条款当中的风险提示，并不代表企业本身存在限制竞争的行为。负责反垄断执法的联邦贸易委员会以及美国司法部，均没有回复记者的置评请求。两名曾任职于老虎分析（Tiger Analytics）的前员工透露，麦当劳与运营这套 AI 平台的老虎分析公司深度协作，由麦当劳对定价引擎的输出结果施加影响。麦当劳会定期下发业务规则与企业经营目标，例如拉动客流或者提升利润。老虎分析方面拒绝对这份麦当劳合作业务发表评论。根据这两名前员工的介绍，麦当劳给到定价引擎的部分约束参数包括：优先对至少两年未曾涨价的餐品提价；只有当不少于 30% 的门店已经上调过某款餐品价格之后，系统才建议继续上调该款产品；夏季月份，冰淇淋与饮料不纳入涨价范围。面对持续走高的经营成本，部分加盟商并不愿意遵从这类定价指引。在 8 月的财报电话会议上，首席执行官肯普辛斯基公开点名批评没有遵守 3 美元（现汇率约合 20.2 元人民币）以下平价菜单定价指引的门店经营者，这部分加盟商大约占到全部加盟商总数的三分之一。他表示这些门店的“经营业绩明显偏弱”，但并没有说明公司是如何得出该结论的。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/563.htm", "publishedAt": "2026-09-29T23:59:27+00:00"}, {"title": "消息称 OpenAI 计划 IPO 前再融资至少 300 亿美元，估值达 1.4 万亿美元", "summary": "IT之家 9 月 30 日消息，据彭博社当地时间周二报道，OpenAI 正在与投资方展开磋商，计划在首次公开募股之前完成一轮融资，至少募集 300 亿美元（IT之家注：现汇率约合 2,016.47 亿元人民币）资金，对应的企业估值大约为 1.4 万亿美元（现汇率约合 9.41 万亿元人民币）。在市场普遍预期这家 ChatGPT 开发企业将于明年登陆公开市场之前，投资者都希望向其追加投入更多资金。报告称，尽管今年年初 Anthropic 的发展势头一度超过 OpenAI，但自 7 月以来，OpenAI 重新将战略重心放在代码生成等核心业务方向之后，年化营收增幅达到 70%，在 8 月已经升至 400 亿美元（现汇率约合 2,688.63 亿元人民币）。该公司此前曾在 3 月份完成一轮 1,220 亿美元（现汇率约合 8,200.33 亿元人民币）的融资，当时估值为 8,520 亿美元（现汇率约合 5.73 万亿元人民币）。原本外界认为这一轮融资会是其上市之前最后一轮私募募资；直到不久之前，市场还预期 OpenAI 会在今年完成上市。不过首席执行官萨姆 · 奥尔特曼（Sam Altman）现已排除 2026 年上市的可能性，表示要优先落实人工智能安全相关工作。针对安全领域研究人员提出的人工智能可能给人类带来生存性风险的警示，他近期接受《财富》杂志采访时表示：“如果到这个十年结束之时，人工智能有大约 10% 的概率造成全人类覆灭，我认为这是一件无法接受的事情。”彭博社的报道提到，如果新一轮融资最终落地，这笔资金将作为过渡轮融资，为后续的首次公开募股做好铺垫。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/558.htm", "publishedAt": "2026-09-29T23:28:20+00:00"}, {"title": "特朗普与科技巨头签署 AI 自愿安全协议，表态支持美国数据中心扩建", "summary": "IT之家 9 月 30 日消息，美国总统唐纳德 · 特朗普（Donald Trump）当地时间周二表示，各大科技企业高管已经同意为人工智能建立自愿性行业标准；在社会各界愈发担忧人工智能安全问题、同时该行业在各地社区的建设规模持续扩大的背景下，特朗普再度表态，支持数据中心快速扩建。此番发言是特朗普在白宫与科技企业高管举行会谈之后作出的。特朗普在自己的社交媒体平台上发布了一份协议文本，根据该文件，各家企业同意聘请“独立审计机构”，评估人工智能系统的运行效果是否符合设计者的初衷。各家企业还承诺，会尽力确保自家人工智能工具不会“以非预期的方式入侵或者访问各类技术系统”。此前 OpenAI 与 Anthropic 先后报告，旗下的智能体出现脱离管控、入侵其他企业系统的情况，这也使得本届美国政府在先进人工智能所带来的风险方面正面临越来越多的舆论审视。数据中心为人工智能模型的训练与运行提供算力支持。如今在美国各地，不少社区都出于对电力消耗、公用事业开支以及其他地方影响的顾虑，反对新建数据中心。民众的抵触情绪，对于即将迎来 11 月 3 日美国中期选举的共和党而言，构成了一项政治难题。谈及各家企业签署的这份协议，特朗普称：“从某种意义上来说，这份文件差不多相当于一部宪章。全球规模最大的几家企业都签了字，而我以总统的身份也签署了它。这份协议确实可以起到防护作用。”这场活动最初只是一场和科技高管之间的闭门午餐。之后特朗普与众议院议长迈克 · 约翰逊（Mike Johnson）以及一众首席执行官一起来到白宫车道上，这片区域平时很少被美国总统用来面对记者发表讲话，闭门会议就此对外公开。特朗普接受记者提问大约 30 分钟，回答了有关人工智能安全以及其他话题，一众企业首席执行官站在他的身后。这一不同寻常的场面发生之际，社会舆论正不断施压，要求本届美国政府着手应对人工智能快速普及背后潜藏的各类风险；这一幕也凸显出特朗普一直在维系的、和科技行业领军人物之间的同盟关系。出席本次会议的企业高管包括 OpenAI 的格雷格 · 布罗克曼（Greg Brockman）、Anthropic 的达里奥 · 阿莫迪（Dario Amodei）、Meta 的马克 · 扎克伯格（Mark Zuckerberg）、谷歌的桑达尔 · 皮查伊（Sundar Pichai）以及英伟达的黄仁勋（Jensen Huang）。特朗普把扎克伯格从一众亿万富翁高管当中叫到前方发言。扎克伯格表示，各家企业已经同意为自身的人工智能系统搭建“完善的内部控制机制”。特朗普称，他正在考虑设立一个十人委员会，负责监督人工智能工具的安全问题，但他并没有说明该委员会可能由哪些人员组成。他还补充说，自己很快将会任命一名新官员，专门负责统筹白宫层面的人工智能相关政策。当被问及自己支持新建数据中心的立场是否有可能损害共和党在 11 月选举当中的选情时，特朗普表示，科技企业将会采取举措，让各个社区对修建数据中心这件事持接纳态度。特朗普站在一众企业高管中间，对着聚集在白宫车道上的记者说道：“这些实力雄厚、财力充沛、人才云集的大型企业，将会向各个地方社区提供大规模的投入。”不过这些科技公司也正饱受批评，舆论认为它们在提升人工智能安全性方面做得还远远不够。路透社与益普索（Ipsos）在 9 月 17 日至 20 日开展的一项美国全国民调显示，大约 73% 的受访者担心，人工智能企业没有采取足够措施，防止人工智能对社会造成严重伤害；还有 55% 的民众认为，应当放缓人工智能的发展脚步。在 2025 年，不少人工智能企业高管与投资者都是“让美国再次行动委员会（MAGA Inc.）”最重要的个人捐赠者，这是一个与美国总统本人立场保持一致的政治行动委员会。美国联邦选举委员会的记录显示，OpenAI 的布罗克曼与其妻子安娜 · 布罗克曼（Anna Brockman）在 2025 年一共向该委员会捐赠了 2,500 万美元（IT之家注：现汇率约合 1.68 亿元人民币）。就在特朗普与众首席执行官会面的同一天，他的幕僚对外公布了一款全新人工智能工具，称该工具能够帮助普通民众更加便捷地使用各类政府公共服务。硅谷的多位企业高管出席了这款新工具的发布活动，其中包括 Meta 的迪娜 · 鲍威尔 · 麦考密克（Dina Powell McCormick）以及红杉资本合伙人肖恩 · 马圭尔（Shaun Maguire）。爱彼迎（Airbnb）联合创始人乔 · 格比亚（Joe Gebbia）主导了这款新工具的设计工作。谷歌、SpaceX、Meta 以及 8VC 这些硅谷企业与投资机构，都被列入本次发布会的赞助名单。特朗普在发布活动现场表示，从理论层面来讲，这款全新人工智能工具不会遭到不法分子的入侵，但他并未就此提供相关佐证。特朗普周二同时下达指示，要求美国各个政府机构在提及该项技术时，改用“超级智能（super intelligence）”这一说法，不再继续使用“人工智能”。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/557.htm", "publishedAt": "2026-09-29T23:25:11+00:00"}, {"title": "OpenAI 奥尔特曼：要争取商业主导地位，我们计划分三步走", "summary": "IT之家 9 月 30 日消息，据《商业内幕》今天（30 日）凌晨报道，OpenAI CEO 萨姆 · 奥尔特曼公布了公司争取商业主导地位的三步规划。奥尔特曼在旧金山举行的开发者大会上公布了 ChatGPT 及其他产品的一系列更新，并勾勒出一条分三步推进的商业路径：先提供最优秀的 AI 模型，再让开发者能够最方便地基于这些模型开发产品，最终把 OpenAI 打造成企业客户彼此连接的“市场平台”。IT之家从报道中获悉，奥尔特曼告诉开发者和员工，整个过程依次是“模型”“构建”和“分发”。“我们希望为所有人提供一个强大的开发平台，让你们能够把任何梦想中的产品做出来。…… 我们的目标是在整个市场的每一个价位上，都为你们提供智能水平和能力的最佳组合。”实现这一目标并不容易，也意味着 OpenAI 需要长期参与竞争。Anthropic 和其他 AI 模型公司还会继续提高模型能力，并在价格上展开较量。随后，奥尔特曼将转向第二阶段 ——“构建”：“我们希望把 OpenAI 内部使用的工具也交给你们。”OpenAI 把 AI 编程工具 Codex 部署到云端后，开发者可以跨设备使用。随后，奥尔特曼公布了一套 API，让客户能够用来开发智能体，另一套面向快速决策的新 API 也赢得了现场热烈掌声。“我们希望成为满足你们开发需求的一站式平台。”OpenAI 手中还有一项重要资产：庞大的用户群。当地时间 29 日，公司披露 ChatGPT 每周用户已超过 12 亿。越来越多企业也把 OpenAI 作为接入用户的平台，希望借此获得新用户，或让现有用户接入 OpenAI 的 AI 技术。目前，OpenAI 正进一步强化自身连接不同企业和用户的中介角色。奥尔特曼称，企业客户可以把一部分现有 OpenAI 承诺支出用于购买合作伙伴的产品。同时，用户也可以在其他 AI 产品上使用“Sign in with ChatGPT”，并从自己的 token 配额中扣除相应用量。奥尔特曼发表主题演讲后，《商业内幕》在问答环节询问了他对这些商业目标的看法。奥尔特曼称，云计算服务商提供了一个很好的范例，展示了企业如何帮助更广泛的生态系统发展。他希望 OpenAI 也能成为承接需求、连接客户的平台。“我们希望找到办法，把这些能力带到各个地方，带来用户、收入和客户，帮助人们创造这些新事物，并打造尽可能稳健、丰富的生态系统。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/556.htm", "publishedAt": "2026-09-29T23:23:48+00:00"}, {"title": "OpenAI光速上新GPT-6.1 Sol！一晚上25项更新，都在这里了", "summary": "今年devday牙膏挤爆", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/499246.html", "publishedAt": "2026-09-29T23:01:05+00:00"}, {"title": "苹果扩展 iOS 27 快捷指令操作：“使用模型”可联网调用 AI 获取最新信息", "summary": "IT之家 9 月 30 日消息，苹果公司昨日（9 月 29 日）更新支持文档，为 iOS 27、iPadOS 27、macOS 27 等系统上的“快捷指令”（Shortcuts）应用，改进和新增 35+ 项操作。本次更新最大的亮点聚焦“使用模型”（Use Model）指令，可以调用增强版 Apple 智能模型，甚至可以通过网络获取快捷指令中任何内容的最新信息。IT之家援引博文介绍，附上相关改进和新增的操作如下：一、新增自动化通知（“当我收到来自‘新闻’的通知时”）键盘（“当我的键盘连接时”，适用于 iOS 和 iPadOS）截屏（“当截屏存储时”，适用于 iOS、iPadOS 和 macOS）二、新增操作2.1、信息“发送 Tapback”“标记为已读”“删除信息”“删除对话”“打开收件箱”“在‘信息’App 中搜索”2.2、提醒事项“编辑列表”“创建群组”“删除群组”“创建分区”“删除分区”2.3、VPN“获取当前 VPN”“查找 VPN”2.4、快捷指令存储“获取已存储内容”“存储内容”“删除已存储内容”“将项目添加到列表”2.5、通用“获取选中的文本”2.6、照片“将照片设为个人收藏”“隐藏照片”“自动增强照片”“查找相簿”“删除相簿”“打开照片”三、改进操作“使用模型”支持增强版 Apple 智能模型 *。“使用模型”现在可以通过网络获取最新信息 *。“如果”现在支持“否则如果”，可用于构建复杂逻辑。“创建备忘录”和“在备忘录中追加文本”现在支持 Markdown。“在备忘录中追加文本”现在可以在备忘录的特定分区中追加或前置文本。“发送信息”现在支持向群聊发送信息。“查找信息”现在可以按发送者筛选。“获取屏幕上的内容”现在会返回结构更清晰的屏幕内容信息。“从图像中提取文本”现在可以从图像中提取表格或列表。“扫描二维码或条形码”现在可以直接处理文件（适用于 iOS、iPadOS 和 macOS）。“设置音量”现在可以设置闹钟、计时器和系统声音的音量（适用于 iOS 和 iPadOS）。“获取网络详细信息”现在支持以太网接口。“位置”现在可以引用用户的家庭和工作地点（适用于 iOS、iPadOS 和 visionOS）。“获取行程时间”新增“避开收费站”和“避开高速公路”选项（适用于 iOS、iPadOS 和 visionOS）。四、快捷指令编辑器使用自然语言描述创建快捷指令（适用于 iOS、iPadOS 和 macOS）*。自动化功能现在已直接集成到快捷指令中，包括共享的快捷指令。自动化功能现在可以在设备之间同步。现有快捷指令现在会在快捷指令编辑器中自动通过 Apple 智能功能生成摘要 *。上述文章中出现的“*”符号，代表现阶段 Apple Intelligence 部分功能并不在所有国家和地区上线，且在 iOS 27 等系统中 Siri AI 依然处于 Beta 状态。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/547.htm", "publishedAt": "2026-09-29T22:43:08+00:00"}, {"title": "小米米家智能晾衣机 3 Max 预售：首创柔烘除菌专区，首发国补价 2699 元", "summary": "IT之家 9 月 30 日消息，米家智能晾衣机 3 Max 今日开启预售，首发国补价 2698.75 元。该机是米家首款柔烘除菌晾衣机，首创米家半封闭式柔烘专区，衣物平铺在晾晒网上后，启动干衣或除菌功能时晾杆组件自动上升贴近风口，形成半封闭柔烘专区，通过热风循环锁温实现更快干衣与更健康除菌，适合湿衣临时急穿、宝宝衣物频繁换洗、内衣速干抑味场景。柔烘专区支持标准烘、智能烘、柔护风三种模式，其中标准烘可实现均匀热风包裹快速干衣，智能烘可通过湿度感应自动调节风温，柔护风则以自然风干衣呵护娇贵衣物，三种模式均需通过米家 APP 调控。该机干衣效率相比自然晾干提升约 5 倍，可快速烘透衣物，减少阴干久晾产生的异味，避免衣物潮气过重。它配备 770mm 超长出风口，支持 1250W 稳定热风快速干衣，送风均匀柔和，热风有劲也不伤面料；同时提供 10W 节能自然风，轻柔吹衣不易变形，可在阴雨天气快速驱散潮气、减少异味。健康防护方面，这款晾衣机采用双效除菌抗菌方案：晾晒网本身含有抗菌成分，抗菌率达到 99%，可长效抑制细菌滋生；启动除菌功能后，出风口释放高浓度等离子，可进一步除菌除味，实现 24 小时全天候健康防护，该产品已经通过中家院母婴家电评价权威检测认证。晾晒布局方面，该机提供 5 大分区晾晒，总长度达到 2.4 米，包含拓展晾晒区、柔烘专区、常用衣物晾晒区、枕头晾晒区、双被杆晾晒区，可同时晾晒 80 件大衣或 2 床厚被褥，满足大家庭批量晾晒需求。它还设置了平置晾晒平台，可减少弯腰取衣频次，挂晾更加方便。整机额定承重达到 45 千克，满载也可稳稳升降。照明方面，该机底部配备 42 英寸超大灯板，可轻松照亮整个阳台，支持 2700K~5700K 色温多级调节、亮度无级调节，能满足不同用光需求；光源采用高显色设计，显色指数 Ra95，符合 RG0 无蓝光危害标准，无可视频闪，视觉舒适度更高。它还支持智能人感照明，搭载 24GHz 毫米波感应技术，实现人来灯亮、离开延时熄灭，夜间晾衣无需摸黑。外观设计方面，该机整机收起厚度仅 9cm，采用一体化纯平造型，搭配隐藏式滑动出风口，开合之间兼具科技感与美学设计，可融入阳台整体风格，提供白色简雅、极地灰轻奢两种配色可选，适配不同家装风格。它支持明装和嵌入式留槽安装，可适配水泥顶、石膏顶、木质顶、集成吊顶、蜂窝大板等多种吊顶环境。智能体验方面，该机支持小米澎湃智联，已接入小米智能生态，可实现多设备智能联动，比如洗衣机完成洗涤后晾衣杆可自动下降。用户可通过米家 APP 自定义升降时间，预设“白天自动下降晾晒、日落后自动升起防潮”的自动化场景，也可自定义预设晾晒高度，其最大升降高度约 1.3 米，可适配不同户型层高与身高。它还支持小爱同学语音控制，操作便捷。安全与品质方面，该机搭载高性能低噪直流电机，历经 6000 次 45 千克满负荷耐久测试，升级 2.0mm 钢丝绳，升降平稳轻音，夜间使用不扰眠；提供多重升降保护，包括过载监测超重停机、下降遇阻即停、二级限位防碰撞，保障使用安全。整机铝合金用料相比旧款增加约 3 千克，采用 6 系原生厚实铝材，搭配 6×19 股 304 钢丝绳，强韧耐用不易变形。IT之家附详细参数如下：京东米家【重磅新品】电动晾衣架 3 Max 柔烘除菌超薄隐形阳台智能升降晾衣机 2698.75 元直达链接2026 年数码家电政府补贴持续进行中，IT 之家为大家汇总国补领券地址，买数码家电之前记得领取。数码补贴：点此领券手机 / 平板 / 3C 数码支持 8.5 折政府补贴，不超过 6000 元的产品至高立减 500 元。家电补贴：点此领券多类家电支持 8.5 折政府补贴，单品至高补贴 1500 元。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/535.htm", "publishedAt": "2026-09-29T21:00:05+00:00"}, {"title": "尴尬时刻：OpenAI 全天候 AI 智能体 dots 首次公开演示卡壳", "summary": "IT之家 9 月 30 日消息，在今天召开 2026 开发者日活动中，OpenAI 在首次公开演示其全天候智能助理 Dots 时突然停止响应，现场一度陷入尴尬。演示期间，OpenAI ChatGPT 团队产品负责人 Holly Li 要求名为“Dottie”的 Dot 为一款虚构音乐应用准备上线工作。然而，智能体迟迟没有回应，演示被迫暂停。面对现场冷场，主持人只能打趣说：“我猜 Dot 今天早上有点慢。”IT之家附上相关视频如下：OpenAI 介绍称，Dots 是能够持续运行的个人 AI 智能体，基于 GPT-6 Astra 模型，并配备独立云端计算机和浏览器，可在用户离开电脑后继续开展资料检索、内容撰写和代码处理等任务。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/534.htm", "publishedAt": "2026-09-29T19:11:25+00:00"}, {"title": "OpenAI 宣布 ChatGPT 周活跃用户超 12 亿，AI 加速走向工作场景", "summary": "IT之家 9 月 30 日消息，在 2026 开发者日活动中，OpenAI 宣布 ChatGPT 每周活跃用户已超过 12 亿，ChatGPT Work 和 Codex 每周用户超过 3,500 万，使用 OpenAI 产品的企业数量达到 250 万家。OpenAI 表示，较今年 7 月公布的 10 亿，ChatGPT 的周活跃用户规模进一步增长，表明生成式人工智能正加速从个人应用走向工作场景。ChatGPT Work 和 Codex 用户的快速增长，也反映出企业和开发者对文档处理、数据分析、软件开发及工作流程自动化等功能的需求不断上升。OpenAI 同时加大了对企业级人工智能市场的布局，公司推出的“Dots” AI 智能体可以跨应用执行任务，并结合 Codex 和 ChatGPT Work 完成资料调研、数据分析、文档制作和软件开发等工作。OpenAI 表示，企业用户规模的扩大将成为推动人工智能从“对话工具”转向“工作伙伴”的重要力量。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/532.htm", "publishedAt": "2026-09-29T18:47:22+00:00"}, {"title": "150 毫秒极速响应：OpenAI 推出 Decisions API，让 AI 从“聊天”走向“实时决策”", "summary": "IT之家 9 月 30 日消息，在今天召开的 2026 开发者日活动中，OpenAI 宣布推出 Decisions API，这是一个面向实时、低延迟分类与路由场景的全新 API，可以大约在 150 毫秒内返回结果，比通过常规 API 使用 Luna 快大约 10 倍。定位方面，Decisions API 为“快速单次决策”设计，把模型（当前基于 OpenAI 的小型模型 Luna）的“智能”聚焦到一组用户预定义的问题 + 有限答案集合上，用极低的延迟返回结构化决策结果。在目前同类模型中，主要竞争模型来自 TypeSafe 的 Jev，不过 Decisions API 专注于将模型智能转化为快速决策。开发者提供上下文（文本或图片），并预先定义好“问题 + 可选答案”，API 返回选中的答案及置信度等结构化信息，用于后续业务逻辑。在典型应用场景方面，Decisions API 比较适合以下场景：客服 / 工单系统：根据用户描述自动判定问题类型、优先级、应分配的团队。内容审核与策略选择：在几个预定义策略（例如：允许 / 限流 / 人工复审）中快速选择。Agent 编排中的“决策节点”：在多步工作流中，用 Decisions API 来决定下一步调用哪个工具 / 哪个子 agent，而不是让大模型自由发挥。实时业务规则辅助：在已有规则引擎之上，用 Decisions API 处理模糊地带，在有限选项内给出建议决策，再由规则引擎做最终裁定。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/531.htm", "publishedAt": "2026-09-29T18:35:38+00:00"}, {"title": "OpenAI 推出 ChatGPT 资料空间、动态页面、协作式幻灯片等 AI 协同工具", "summary": "IT之家 9 月 30 日消息，在北京时间 9 月 30 日凌晨 1 点举行的 OpenAI DevDay 2026 活动中，OpenAI 推出了多个 AI 协同工具。IT之家汇总如下：ChatGPT 资料空间ChatGPT 资料空间是一个与 AI 和团队一起完成工作的全新空间，支持将团队加入专属空间，让包括 ChatGPT 在内的所有成员都能结合共同目标和过往工作，在已有协作成果上继续推进。用户可以让 ChatGPT 将对话转化为页面或幻灯片，它会先提问以明确需求，再在用户面前起草内容。用户可以亲自编辑、让 ChatGPT 再修改一轮，或邀请团队加入，全程无需将工作转移到其他工具。（Pro、Business 和 Enterprise 套餐用户可在 ChatGPT 桌面应用和网页版中使用，移动端即将推出）动态页面这是一种全新的文档类型，专为用户与智能体及团队成员共同完成工作而设计，适用于项目计划、报告、视觉概念等多种内容。（适用于 Pro、Business 和 Enterprise 套餐）凡是能用 ChatGPT 完成的事，都可以在页面上完成：与 ChatGPT 或 dots 协作，生成图表、交互式仪表板和图像，并用标题、项目符号和表格来组织内容。邀请团队通过评论或直接编辑提出想法和反馈，再提及 dots 或 ChatGPT，让它修改内容或执行后续步骤。设置页面从已连接的工具自动更新，例如随最新工作变化的待办事项清单，或根据已连接数据源的更新保持最新的产品团队跟踪表。协作式幻灯片这是一个全新的演示文稿编辑器，让团队与 ChatGPT 共同打造专业演示文稿。无论是准备财务评审还是客户演示，它都提供了呈现内容所需的工具，包括原生可编辑图表，以及文本、形状和图像。（适用于 Pro、Business 和 Enterprise 套餐）用户可将对话转化为幻灯片，或从自己的模板开始，并在 ChatGPT 制作过程中向它提供反馈。用户还可邀请多位团队成员同时直接编辑演示文稿、发表评论，或标注希望 ChatGPT 修改的地方。准备就绪后，可以直接在 ChatGPT 中演示，也可以导出到 PowerPoint 或 Google Slides，保留原有格式并继续编辑。创建团队，共享任务在 ChatGPT 中将同事加入团队，即可与所有成员共享页面、演示文稿、电子表格等内容。用户还可以创建团队任务，将每周项目进展汇报等重复性工作交给 ChatGPT。描述需求，ChatGPT 就能使用已连接的工具收集信息并执行操作，既可以定时运行，也可以在出现变化时触发，例如收到新的电子邮件或 Slack 消息时。团队成员可以共同更新指令，让任务随着工作重点的变化持续发挥作用。（适用于 Business 和 Enterprise 套餐）Slack 和 Microsoft Teams 中的 @ChatGPT在频道、消息串或私信中提及 @ChatGPT，即可将讨论转化为项目简报、排查缺陷并准备修复方案供审核，或每天早上发布客户动态。它可以使用管理员已连接的工具，也可以在用户的授权范围内使用工具。即使没有个人 ChatGPT 许可，团队成员也能在同一对话中补充上下文并完善工作成果。（适用于 Business 和 Enterprise 套餐）会议插件使用会议插件录制会议音频，并将会议纪要保存在 ChatGPT 资料空间中。用户可以将纪要设为私密，也可以与团队共享。ChatGPT 可以结合团队此前合作的上下文，总结与用户最相关的要点、决策和后续步骤。用户还可以让它协助处理行动事项。例如，在团队站会后，让 ChatGPT 根据已作出的决策、遇到的阻碍和发生的变化更新项目计划。（已向 Pro 和 Business 用户开放测试版，即将向 Enterprise 用户开放）可分享的个人资料页可分享的个人资料页让用户能够展示自己的站点和插件，供他人发现和复用。个人资料页将这些作品汇集起来，方便用户集中分享。团队成员还可以发现共享的技能，技能共享仅限于工作空间内。（即将向 ChatGPT Enterprise、Edu 和医疗保健版推出，已适用于其他所有 ChatGPT 套餐）", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/530.htm", "publishedAt": "2026-09-29T18:22:40+00:00"}, {"title": "OpenAI ChatGPT 账号变身“万能钥匙”：可一键登录网站，Notion / GitLab 率先接入", "summary": "IT之家 9 月 30 日消息，在今天召开的 2026 开发者日活动中，OpenAI 推出“使用 ChatGPT 登录”（Sign in with ChatGPT）功能，支持用户直接使用 ChatGPT 账户身份登录支持的外部应用程序，简化跨平台认证流程。该功能目前已在全球范围内向所有已认证的 ChatGPT 用户开放，用户可在参与合作的网站或 ChatGPT 插件目录中连接应用程序时，选择“使用 ChatGPT 登录”或“继续使用 ChatGPT”来完成身份验证。IT之家附上相关截图如下：该功能已在 OpenAI Academy 和 ChatGPT 网站上线，并正逐步推广至部分插件和合作伙伴网站。首批参与的合作伙伴包括：AirtableGitLabHubSpotNotionSupabaseVercelOpenAI 强调，使用此功能登录后，外部应用程序仅会收到用户的姓名、电子邮件地址和个人资料图片（如有），但不会共享 ChatGPT 的对话记录、记忆、文件、令牌、账单信息或其他账户数据。对于企业组织用户，该功能的可用性还取决于组织的管理员设置。默认情况下，未设置明确身份策略的组织将启用此功能，但现有允许或拒绝策略仍然有效。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/529.htm", "publishedAt": "2026-09-29T18:18:18+00:00"}, {"title": "OpenAI ChatGPT 插件扩展升级：改进排序与推荐方式，支持 MCP 事件自动化", "summary": "IT之家 9 月 30 日消息，在北京时间 9 月 30 日凌晨 1 点举行的 OpenAI DevDay 2026 活动中，OpenAI 宣布升级插件扩展。借助插件扩展，开发者可以直接在 ChatGPT 中构建丰富的应用内体验。现在，用户可以为插件在侧边栏中设置专属入口，构建可供用户一边对话一边工作的交互面板，或为产品支持的文件类型创建查看器。此外，插件创建工具可以帮助开发者构建插件，重新设计的提交流程则提供更清晰的反馈。OpenAI 还在改进插件目录和对话中的插件排序与推荐方式，帮助用户找到相关插件。用户始终可以自主选择使用哪些插件，并逐一批准其访问权限。现在，用户可以将受支持的 ChatGPT 插件接入自己构建的站点，让工作空间中的团队成员凭各自的权限登录同一应用，并使用各自连接的数据。OpenAI 还简化了自动化流程的添加和管理，让站点中的共享信息保持最新。（适用于 Business、Enterprise、医疗保健版和 Education 套餐）IT之家从发布会获悉，OpenAI 正在加入对拟议的 MCP 事件规范的支持，让插件能够在已连接的应用中发生事件时启动自动化流程。例如，用户可以让 ChatGPT 关注项目看板上的新任务。有新任务时，即使用户不在，ChatGPT 也能阅读关联文档并起草计划。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/528.htm", "publishedAt": "2026-09-29T18:08:00+00:00"}, {"title": "Agent 编程能力从 10% 飙到 70%，Anthropic 新模型却遭遇灵魂拷问：我什么时候才会用它？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/PSvHjyoJTC9bSLWYxpfF?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-29T18:07:09+00:00"}, {"title": "同性能下最高性价比 AI 模型：OpenAI 发布 GPT-6.1 Sol，性能媲美 Astra、费用仅为 1/5", "summary": "IT之家 9 月 30 日消息，在今天召开的 OpenAI 开发者活动日中，官方正式宣布推出 GPT-6.1 Sol 模型，在性能接近 Astra 的同时，其费用仅为 Astra 的五分之一，官方称这是“在目前同等性能下性价比最高的模型”。GPT‑6 Astra 是 OpenAI 在 2026 年 9 月推出的旗舰级大语言模型，官方定位是“迄今最智能、最对齐（最符合人类意图）”的模型，重点面向长程多步骤任务与专业工作流。费用方面，根据官网公布的费用细节，IT之家附上相关售价信息如下：gpt-6.1-sol 全模式定价表（短上下文，输入 tokens ≤ 272,000）模式输入 (Input)缓存输入 (Cached input)缓存写入 (Cache writes)输出 (Output)Standard（标准）$2.00$0.10$2.50$10.00Batch（批量）$1.00$0.05$1.25$5.00Flex（弹性）$1.00$0.05$1.25$5.00Fast（快速）$4.00$0.20$5.00$20.00gpt-6.1-sol 全模式定价表（长上下文，输入 tokens &gt; 272,000）模式输入 (Input)缓存输入 (Cached input)缓存写入 (Cache writes)输出 (Output)Standard（标准）$4.00$0.20$5.00$15.00Batch（批量）$2.00$0.10$2.50$7.50Flex（弹性）$2.00$0.10$2.50$7.50Fast（快速）$8.00$0.40$10.00$30.00上述 4 种处理模式区别如下：模式处理速度适用场景 Standard（标准）正常速度日常开发、一般应用 Batch（批量）较慢（异步批量处理）非实时、大批量任务（如离线数据处理） Flex（弹性）可变（根据负载动态调整）需要成本与速度平衡的场景 Fast（快速）最快（优先处理）对延迟敏感的应用（如实时对话、低延迟响应）性价比方面，官方表示 GPT-6.1 Sol 模型每 100 万 Token 的缓存费用为 0.1 美元（IT之家注：现汇率约合 0.67 元人民币），相比较 GPT-6 Sol 模型定价低 50%。在性能方面，在智能体编程、电脑操作和专业工作流等任务上，性能接近旗舰 GPT‑6 Astra，但标准输入 / 输出 token 价格只有 Astra 的五分之一。软件工程（DeepSWE v1.1）：在较高推理强度下，GPT‑6.1 Sol 的表现与 GPT‑6 Astra 相当；在较低推理强度 / 成本条件下，其得分比 GPT‑6 Sol 高出 6.4 个百分点。专业文档与复杂任务（GDP.pdf）：以不到 Opus 5.5 一半的任务成本，取得更好结果。自动化工作流（AutomationBench，中等推理强度）：得分比 Opus 5.5 高 2.2 个百分点，成本约为其三分之一。电脑操作（OSWorld 2.0 离线，最大推理强度）：得分比 GPT‑6 Sol 高 7 个百分点，成本不足后者一半；与 Astra 相比仅低 2.1 个百分点，但单任务成本约为 Astra 的七分之一。科学终端任务（Terminal‑Bench Science 0.1，最大推理强度）：得分是 GPT‑6 Sol 的两倍以上；单任务平均成本 $5.47，显著低于 Opus 5.5（$23.21）和 Astra（$23.80）。除了“能干活”，GPT‑6.1 Sol 在可靠性与对齐方面也有改进：事实错误率下降：在低推理强度下，事实错误比例从 GPT‑6 Sol 的 11.4% 降至 7.7%（下降约 32%）。与 Astra 的差距很小：在所有推理设置下，GPT‑6.1 Sol 的错误率与 Astra 的差距控制在 1.9% 以内。更遵守用户意图与安全约束：在困难评测中，更少忽略失效的搜索工具、更能遵循明确限制，并减少未经授权的操作；安全测试中未观察到试图绕过自动化安全审查器的行为。调用方面，自 9 月 29 日起向 ChatGPT Work 与 Codex 的 Plus / Pro / Business / Enterprise / Edu 用户开放；开发者可通过 API 以 gpt-6.1-sol 调用。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/527.htm", "publishedAt": "2026-09-29T18:06:51+00:00"}, {"title": "大模型下沉车规芯片：超六成的车企座舱，为何选中了同一个“端侧大脑”？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/O5pKYU5hfR2DgrXP6zRE?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-29T15:49:30+00:00"}, {"title": "AI 数据平台，要补的恰恰是“模型不知道的事”", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/uwfvFTWwH5Qupo2lBxF6?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-29T11:24:14+00:00"}, {"title": "正行创新联合创始人杨宇欣正式亮相：出任总裁，负责全球业务拓展", "summary": "推动公司具身模型、本体、软件等全栈能力进入更多真实场景", "sourceName": "量子位", "sourceUrl": "https: 署最高 845 亿美元算力协议，可提前 90 天发通知解除", "summary": "IT之家 9 月 30 日消息，随着 AI 巨头 Anthropic 筹备 IPO 上市，路透社查阅的文件显示，这家企业已经和 SpaceX 签署了价值数百亿美元的算力协议。SpaceX 完成 IPO 之后向美国证券交易委员会（SEC）提交了披露材料；这批新的合同文件进一步揭开了两家公司合作的细节。协议当中有一项关键条款：Anthropic 仅需提前三个月发出通知，就可以解除这份合作。就在签署该协议的同一时期，埃隆 · 马斯克正大举扩张自家的数据中心，目标是在今年年底之前上线超过 100 万张 GPU。SpaceX 在其 S‑1 版上市申报文件当中，披露了和 Anthropic 之间合作的多项细节。文件写明，双方于 2026 年 5 月签署的协议覆盖 Colossus 一号与 Colossus 二号两座数据中心的算力资源；SpaceX 借此可以“盘活自身基础设施当中闲置的算力资源，将闲置产能变现”。SpaceX 同时披露：Anthropic 同意每月向其支付 12.5 亿美元（IT之家注：现汇率约合 83.97 亿元人民币），付费期限持续到 2029 年 5 月；2026 年 5‑6 月属于算力爬坡阶段，这两个月将执行优惠费率。如果不计 5 月、6 月这两个爬坡月份，按照 SpaceX 披露的内容测算，Anthropic 至少需要向 SpaceX 支付 425 亿美元（现汇率约合 2,855.09 亿元人民币）的数据中心服务费。而路透社从 Anthropic 的 IPO 申报文件当中看到的最新数字显示，Anthropic 这份算力合同的金额上限更高，最高将达到 845 亿美元（现汇率约合 5,676.59 亿元人民币），用于租用 SpaceX 数据中心内的英伟达 GPU 算力资源。两份文件当中的解约通知期限保持一致。该报道同时披露，Anthropic 计划在未来十年之内，至少投入 5,180 亿美元（现汇率约合 3.48 万亿元人民币）用于搭建自身的 AI 基础设施；这笔巨额开支除 SpaceX 之外，还流向亚马逊、谷歌、微软这类大型云服务商。Anthropic 向 SpaceX 投入这笔巨额算力采购的背景是，埃隆 · 马斯克计划在今年年底前，依托 Colossus 二号数据中心，上线超过 100 万张 GPU。马斯克把这个超大型算力项目称作“算力超级工厂”；该项目二期所使用的绝大多数显卡，都是英伟达最新的 Blackwell（布莱克韦尔）GPU 芯片。SpaceX 方面还作出预测：待 10 吉瓦规模的算力基础设施全部上线之后，公司有望从 AI 算力基础设施业务当中斩获 3000‑5,000 亿美元（现汇率约合 3.36 万亿元人民币）区间的营业收入。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/589.htm", "publishedAt": "2026-09-30T01:41:26+00:00"}, {"title": "OpenAI 推出全天候 AI 智能体 Dots，相关域名已被马斯克拿下", "summary": "IT之家 9 月 30 日消息，当地时间周二，OpenAI 发布了一款名叫 Dots 的新产品。这是一款可以持续运行的人工智能智能体，拥有一个软乎乎、圆滚滚的卡通形象。虽说这个色彩明快的虚拟形象或许能博得大家一笑，但这次发布会过后，笑得最开心的人恐怕要数埃隆 · 马斯克（Elon Musk）。他曾是 OpenAI 的创始人，后来离开了这家公司，推出了竞品 Grok，此前还对 OpenAI 发起过诉讼，但最终败诉。之所以会这样，是因为域名 dot.com 归属于马斯克旗下的 xAI，目前该域名会直接跳转至 xAI 的聊天机器人 Grok 应用的下载页面。根据域名信息查询系统 Whois 的登记记录，这个域名是在 7 月份刚刚完成过户的。当然，xAI 买下这个域名，完全有可能只是出于域名收购方面的常规考量。“Dot”有可能是“bot”的拼写错误，收购该域名就可以截获用户输错关键词之后产生的搜索流量。不过 xAI 并没有持有 bot.com 这个域名，另外一些明显的错写域名，例如 vot.com 也不在它手中，该域名目前处于待售状态。网上流传的说法就有趣得多：马斯克（或是他手下的团队）得知 OpenAI 这款新产品以及产品名称之后，抢先买下该域名，完成了一次恶作剧式的操作。IT之家注意到，X 平台上一位匿名用户、长期关注 xAI 动态的 @birdabo（此人给自己的头衔是“SpaceXAI 首席玩梗官”）最先发现了这件事，他发布的帖子如今已经广为传播。无论背后真实动机是什么，整件事的场面确实颇具喜剧效果。至于和这款产品名称契合度更高的域名 dots.com，它目前归一家早已停业的老公司所有。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/559.htm", "publishedAt": "2026-09-29T23:37:25+00:00"}, {"title": "涉及约 5000 人：古尔曼称苹果已搁置 AI 替代 AppleCare 客服计划", "summary": "IT之家 9 月 30 日消息，彭博社的马克 · 古尔曼（Mark Gurman）昨日（9 月 29 日）发布博文，爆料称苹果公司原计划考虑裁减约 5000 名 AppleCare 售后人员，不过最终决定搁置。古尔曼表示由于 AI 智能体可接管部分电话与网络售后任务，苹果公司曾于 2026 年夏季拟定裁员计划，考虑削减约 5000 个 AppleCare 客户服务岗位。古尔曼表示苹果公司目前已无限期搁置这项裁员计划，当前“不再考虑采取这样的措施”。IT之家注：AppleCare 提供全天候优先联系苹果专家的服务，覆盖 iPhone、Mac 等诸多产品，提供故障排除、账户问题、维修等服务。此外科技媒体 MacRumors 指出，苹果公司已在美国和加拿大升级 AppleCare 客服热线。用户拨打 1-800-APL-CARE 后，可能被转接至 AI 支持助手。新系统采用生成式人工智能。虚拟助手可回答 Apple 产品相关问题，并提供分步骤故障排查指导。系统无法回答具体问题时，可将用户转接至人工顾问，用户也可主动要求联系真人客服。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/544.htm", "publishedAt": "2026-09-29T22:29:08+00:00"}, {"title": "微软已推送 Win11 26H2 更新：文件管理器更智能、搜索更出色、设置更个性化", "summary": "IT之家 9 月 30 日消息，微软今天（9 月 30 日）发布公告，宣布通过小型启用包 (eKB) 的形式，面向符合条件的 PC 设备，正式推送 Windows 11 2026 Update 更新（也称 Version 26H2）。图源：@来也空空 更新内容方面，微软官方表示 Windows 11 26H2 整合过去 1 年在 25H2 中推出的所有 Windows 创新功能、安全改进和增强功能。IT之家附上日志中提及的主要改进如下：一、更智能的文件资源管理器新增诸多功能增强生产力，包括 AI 操作图片、为 OneDrive 和 SharePoint 文档生成摘要、快速操作工作和学校账户，支持更多压缩包格式等。二、强化 Windows Search 搜索体验借助预览功能、更强的错别字与应用简称识别能力、分类更清晰的搜索结果，以及自动索引常用文件夹，让用户更轻松找到所需内容。三、增强无障碍体验放大镜新增更精细的缩放与屏幕色调滤镜选项；讲述人增加盲文查看器及其他改进；语音访问功能在支持的 Copilot+ PC 上拓展自然语言指令能力。四、更多 Windows 个性化设置开始菜单和任务栏新增自定义选项，包含全新的开始菜单视图与尺寸调整、更多任务栏摆放位置，以及紧凑型任务栏模式。支持周期方面，Windows 11 26H2 延续了微软每年的 Windows 功能更新节奏，家庭版和专业版支持周期为 24 个月，企业版和教育版支持周期为 36 个月，首个月度更新将于 10 月 13 日发布。用户现阶段只能通过 Windows Update 方式获取，预估微软会在近期更新推出 Windows 11 26H2 更新的镜像文件，IT之家将会持续关注并第一时间跟进。相关阅读：《微软 Win11/10/7 原版 ISO 光盘镜像下载大全（2026-8-18 更新）》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/539.htm", "publishedAt": "2026-09-29T22:09:07+00:00"}, {"title": "松下 Technics 首款磁流体头戴耳机 EAH-A1000 发布，国行 2599 元", "summary": "IT之家 9 月 30 日消息，松下旗下音频品牌 Technics 昨日发布了全新旗舰无线头戴耳机 EAH-A1000，搭载全新开发的 40mm 磁流体驱动单元，国行售价 2599 元，提供黑色、白金色可选。京东 Technics【新品上市】松下 A1000 全新磁流体耳机 白金色头戴式蓝牙无线旗舰耳机 HiFi 耳机主动降噪蓝牙版本 6.0 可开发票 2599 元直达链接该耳机搭载全新开发的 40mm 磁流体驱动单元，这是 Technics 首次将磁流体技术应用于头戴式耳机。IT之家注：磁流体是一种兼具磁性与液体特性的功能材料，置于音圈与磁体之间可抑制大口径驱动单元的振动与失真。其驱动单元还采用 SST 对称悬边技术，该技术源自 Technics 旗舰 Hi-Fi 音箱，通过提升悬边前后运动对称性降低失真。振膜采用碳纤维材质，锥形结构用于抑制大口径振膜形变。声学结构方面，EAH-A1000 采用全新障板结构与声学控制腔体，前者减少驱动单元周围不平整表面以抑制反射，后者通过平衡低频与中频管理气流。降噪方面，耳机搭载自适应降噪功能，每侧配备三个前馈麦克风和一个反馈麦克风，可根据环境噪音和佩戴贴合度优化降噪表现。续航方面，EAH-A1000 支持最长 45 小时连续播放（降噪开启），降噪关闭时可达 90 小时。充电 15 分钟可补充约 4 小时播放时间。连接方面，这款耳机支持 LDAC 编解码与 USB Audio 无损播放，支持最多三台设备多点连接。通话采用 AI 波束成形技术，并针对杜比全景声头部追踪进行优化。设计方面，EAH-A1000 采用全新 Flow Arm 结构，从滑轨处方形过渡至吊架处三角形。支臂与外壳顶部面板采用金属材质，提供黑色与铂金灰米色两种配色。佩戴方面，耳罩活动范围、头梁形状与滑轨位置调节经过重新设计，以分散头部压力。耳垫采用高密度记忆海绵，兼顾耐用性与长时间佩戴舒适度。耳机支持折叠，附赠专属收纳盒。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/536.htm", "publishedAt": "2026-09-29T21:00:05+00:00"}, {"title": "2026 OpenAI 开发者日遭 15+ 组织抗议，要求 AI 数据中心设 100 英里安全距离", "summary": "IT之家 9 月 30 日消息，科技媒体 The Verge 今天（9 月 30 日）发布博文，报道称 2026 年度 OpenAI 开发者日（DevDay）在旧金山开幕，现场遭遇大规模抗议活动。包括湾区抵抗组织（Bay Resistance）、科技工作者联盟（Tech Workers Coalition）、服务业雇员国际工会（SEIU）在内，超过 15 个组织联合发起集会。集会地点设在旧金山梅森堡（Fort Mason）活动入口外，现场悬挂“人比 AI 更重要”等标语，抗议者身着纸板机器人服装挥舞镰刀道具。抗议者主要针对数据中心环境影响及 AI 行业权力集中等问题，其中一张抗议传单要求 AI 数据中心设立“安全距离”，距离居民区超过 100 英里（IT之家注：约 160.9 公里）。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/533.htm", "publishedAt": "2026-09-29T19:07:28+00:00"}, {"title": "DeepSeek Harness桌面版实测：更像「个人助理」，还给你送钱", "summary": "现在，人人都可以用「万物皆插件」了#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1682532?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-09-29T16:07:49+00:00"}, {"title": "自主数据工程：迈向真正智能体成熟度的五个阶段 ｜ 技术趋势", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/AmYfVbwTlVyApFszqKx3?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-29T10:36:23+00:00"}, {"title": "Meta 挖走 MongoDB 的 CEO 去管企业 AI，后者股价一天崩了 18%", "summary" const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
