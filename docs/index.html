"title": "SK 海力士与闪迪将在 FMS 2026 发布 HBF 首个标准规范，展示面向 AI 的存储解决方案", "summary": "IT之家 8 月 4 日消息，SK 海力士宣布联合闪迪（Sandisk），将在美国加州举办的闪存峰会 2026（FMS 2026）期间共同发布下一代存储技术高带宽闪存（HBF，High Bandwidth Flash）的首个标准规范。IT之家注：HBF 是介于 HBM 和固态硬盘之间的新型存储层级，不仅具备与 HBM 类似的高速数据传输能力，还可基于 NAND 闪存大幅提升容量。在 AI 推理普及、数据处理需求激增的背景下，其高带宽与可扩展容量特性优势受到业界关注。此次发布的标准规范，是继 SK 海力士去年 8 月与闪迪启动 HBF 标准化合作，并于今年 2 月成立联盟后，历时约 6 个月推出的首项成果。该规范定义了两种容量配置，分别采用 8 层和 16 层 NAND 芯片堆叠，最高支持 512GB 容量；并按三个等级（Grade 1~3）设定带宽标准，数据传输能力覆盖约 0.4TB/s 至 3.0TB/s。值得关注的是，HBF 与处理器之间采用行业标准 UCIe 互联，为 HBF 与 GPU、CPU 等不同类型的处理器灵活连接奠定了基础。该规范由全球最大的开放式数据中心技术合作组织 OCP（Open Compute Project）正式发布，成为行业通用开放标准，而非企业私有标准。SK 海力士表示，以此为契机，公司计划加快 HBF 在 AI 存储市场的规模化落地，并加速构建生态体系。目前，HBF 联盟已汇聚谷歌与 Tenstorrent。未来，公司将继续依托开放合作，不断扩大生态体系，同时提升技术成熟度与市场接受度。与此同时，SK 海力士将在 FMS 2026 设立展台，首次公开目前开发进展顺利的第十代（V10）375 层 4D NAND 闪存晶圆和产品。较上一代，其性能功耗比提升 2.5 倍，特别适用于对性能与能效要求极高的 AI 基础设施环境（例如数据中心）。公司计划于明年初启动基于此 NAND 闪存的高性能、大容量企业级固态硬盘（eSSD）量产。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/985/289.htm", "publishedAt": "2026-08-03T23:45:46+00:00"}, {"title": "谷歌 Pixel 11 Pro 手机官方渲染图流出，外观细节抢先看", "summary": "IT之家 8 月 4 日消息，继知名爆料人埃文 · 布拉斯（Evan Blass）此前曝光据称为 Google Pixel 11 和 Pixel 11 Pro Fold 的官方宣传图后，如今 Google Pixel 11 Pro 的官方渲染图也随之流出。最新图片展示了这款旗舰手机的 Dune（沙丘色）和 Sterling（银色）两种配色，并提前揭示了新机的外观细节。与 Pixel 10 Pro 相比，Pixel 11 Pro 在设计上的最大变化来自后置相机模组。新机采用了全黑配色的相机区域，同时 LED 闪光灯加入了 RGB 灯效，不仅可以在收到通知时充当提示灯，还能在与 Google Gemini AI 助手交互时提供可视化反馈。此外，黑色版本的 Pixel 11 Pro 预计还将采用全新的全哑光机身处理工艺。从宣传图来看，Pixel 11 Pro 将搭载全新的 Google Tensor G6 处理器，并继续深度整合 Google Gemini AI。不过，根据目前的爆料，除了处理器升级之外，新机整体硬件变化并不算大。据悉，Pixel 11 Pro 的电池容量与上一代相比几乎没有变化，依旧支持最高 30W USB-C 有线快充和最高 15W 无线充电。至于前置摄像头，目前传闻存在分歧，有消息称将沿用 Pixel 10 Pro 配备的 4200 万像素、f/2.2 自拍镜头，也有消息认为谷歌可能改为采用一颗 1300 万像素前置摄像头。后置影像系统方面，谷歌预计仍将沿用三摄方案，包括一颗 5000 万像素、f/1.7 光圈、1/1.31 英寸传感器的主摄，一颗 4800 万像素、f/1.7 光圈的超广角镜头，以及一颗支持 5 倍光学变焦的 4800 万像素、f/2.8 潜望式长焦镜头。不过IT之家注意到，宣传图显示，Pixel 11 Pro 的最高混合变焦能力将从上一代宣传的 100 倍提升至 120 倍。这一效果通过 5 倍光学变焦配合最高 24 倍数字变焦实现。为了保证超高倍率变焦下的成像质量，谷歌预计会借助 AI 对照片进行智能放大和优化。宣传图中的一张月亮样张展示了 120 倍混合变焦下的细节表现，但目前尚不清楚 AI 是否会对画面细节进行较大程度的重建。另一张样张则展示了升级后的夜景模式成像效果。关于 Pixel 11 系列的更多信息，预计将在 8 月 12 日新品发布会上得到官方确认。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/985/273.htm", "publishedAt": "2026-08-03T23:14:41+00:00"}, {"title": "GitHub Copilot CLI在重新设计的终端UI中新增选项卡与免配置文件的工具设置", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/wybFeXucFGaobN7wQjev?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-03T18:00:00+00:00"}, {"title": "苹果曝出数据管理漏洞：部分员工离职后仍可通过个人 iCloud 访问公司机密文件", "summary": "IT之家 8 月 3 日消息，苹果公司起诉 OpenAI 窃取商业机密一案持续发酵。据 The Information 报道，多名前苹果员工透露，即便苹果已切断他们的企业内网权限，他们仍能访问在职期间的共享文档。部分员工甚至在文件更新时，还能继续收到通知。这些文档包含产品发布会计划等机密资料。前员工们表示，他们并未刻意保留这些访问权限，而是意外发现工作文件与个人的 iCloud 数据混在了一起。据悉，该问题的根源在于苹果长期鼓励员工将个人 Apple ID 与公司提供的 iCloud 存储空间绑定。苹果为员工提供了 2TB 的 iCloud 空间，并允许其与现有的个人存储套餐合并。这种安排导致部分工作文件存放在了苹果无法完全掌控的账户中。只要文档未被存放在苹果统一管理的“工作”文件夹内，员工在归还公司设备并离职后，依然能够访问。苹果曾推出 Apple Work 文件夹以加强对工作文件的管控，但存放在该文件夹之外的内部文件，仍可能与个人照片等数据混合，并在员工离职后继续同步。IT之家从报道获悉，在 2019 年左右全面引入 Slack 之前，苹果在工作沟通和文件共享方面高度依赖 iMessage。员工离职时，苹果虽能随时切断其 Slack 权限，但前员工往往能保留以往的 iMessage 聊天记录及附件。报道还指出，高管离职时，苹果会对他们的设备进行严格审查。相比之下，普通员工接受的审查往往不够彻底，这进一步增加了脱离苹果管理系统的文件被遗留在个人设备上的风险。相关阅读：《苹果起诉 OpenAI，指控其挖角前员工窃取未发布产品、供应链资料等商业机密》《OpenAI 首度回应苹果诉讼：相信公平竞争，未发现任何证据》《苹果和 OpenAI 商业纠纷细节：2 封关键邮件、13 分钟间隔与 1 次姓名混淆》《OpenAI 总裁布罗克曼谈苹果诉讼：我们没有兴趣窃取其它企业商业机密》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/985/254.htm", "publishedAt": "2026-08-03T15:59:50+00:00"}, {"title": "国际刑警组织：AI 已成非洲网络犯罪核心驱动力", "summary": "IT之家 8 月 3 日消息，国际刑警组织今日发布博文称，人工智能已参与非洲 55% 网络犯罪案件，使攻击速度更快、规模更大，也让受害者越来越难防范和追查。非洲正在加快推进数字化转型，2025 年非洲移动网络用户数已超过 11 亿。然而该地区各国的网络犯罪法律仍然较为繁杂，执法机构无法有效应对 AI 犯罪现象。来自 36 个非洲成员国的调查数据显示，网络犯罪已经从过去孤立发生的事件，变成工业化、跨国生态系统。其中，东非地区已经成为移动支付诈骗和勒索攻击的中心；中非和西非地区频繁出现商业电子邮件诈骗和“杀猪盘”诈骗；南非地区由于互联网水平较高，正成为全球威胁行为者的集火之地。自 2024 年以来，网络犯罪给非洲带来的经济损失已经由 1.92 亿美元（IT之家注：现汇率约合 12.98 亿元人民币）飙升至 4.84 亿美元（现汇率约合 32.72 亿元人民币）。国际刑警组织认为，这主要受 AI 工具和自动化工具推动。2025 年，网络诈骗仍是非洲报告数量最多的犯罪类型，攻击者利用移动支付平台、AI 技术和社交媒体扩大范围并寻找更多目标。令人触目惊心的是，接受调查的非洲国家中，有 72% 国家境内存在诈骗中心，南非和西非地区尤甚。此外，犯罪分子的诈骗手段也在升级。他们利用 AI 生成技术，从窃取的真人照片中伪造视频，用虚假身份开设银行账户、SIM 卡并申请贷款。不过非洲各国正在联合打击网络犯罪。2025 年共有 17 个国家制定或修订网络犯罪法律，塞内加尔推出在线举报平台，打击涉及儿童的网络违法行为。国际刑警组织已在四项行动中逮捕超 1500 名犯罪嫌疑人，查扣数百台电子设备，并追回超 1 亿美元（现汇率约合 6.76 亿元人民币）资产。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/985/252.htm", "publishedAt": "2026-08-03T15:32:02+00:00"}, {"title": "搜索引擎公司 DuckDuckGo“整活”推出 Paso Robles 太阳镜，号称无 AI、无摄像头、永不发送数据", "summary": "IT之家 8 月 3 日消息，谷歌、三星、Meta 等科技巨头正在争相布局 AI 智能眼镜市场，镜框内置的微型摄像头，则逐渐让智能眼镜成为公众的隐私“噩梦”，利用其导致的偷拍和其他滥用事件呈增加趋势。注重隐私的搜索引擎公司 DuckDuckGo 上月末（7 月 30 日）宣布推出 Paso Robles 太阳眼镜，宣传语是“普通得不能再普通的太阳镜”（Normal F***ing Sunglasses）。据介绍，这款太阳镜联合 Knockaround 出品，主打无摄像头、无麦克风、无 AI、无电池，没有任何电子元件，也不会向云端发送任何数据，起售价 5700 日元（IT之家注：现汇率约合 243.7 元人民币）。当然从本质角度说，这款产品就是个普通的黑色太阳镜，只不过镜腿上有 DuckDuckGo 标志。同时，这款产品的卖点是“无限续航”“永无消息通知”“永远离线”，这些玩味十足的语气表明，DuckDuckGo 希望通过这款眼镜反讽一下同行们。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/985/236.htm", "publishedAt": "2026-08-03T14:14:36+00:00"}, {"title": "阿里Qwen3.8正式发布：2.4T规模，自主编程16天搓出一个Hermes Agent", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/XG7GeBthC6eKO5Rejf02?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-03T11:52:22+00:00"}, {"title": "Zadig v5.0 发布：AI 发布专员与 AI 审查专员上线", "summary": "我们团队这几天最大的卡点不是 AI 写得不够好，是 AI 写得太好了。 好到审查排期从两天的活儿拖成了五天。PR 一堆起来没人敢合，发布窗口推了又推。好到合进 main 分支的代码，我们自己都没看完。 这事不是个例。GitLab 调研过 1528 名开发者，85% 说 AI 把瓶颈从写代码转移到了审代码。 写代码有人替你干了。但审代码、...", "sourceName": "开源中国", "sourceUrl": "https://my.oschina.net/koderover/blog/19732505", "publishedAt": "2026-08-03T10:45:48+00:00"}, {"title": "浙江大学软件学院教授周经森博士确认出席AICon深圳，将分享人工智能时代的性能工程", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/amvXR0j31a7NMB4F5Z3Z?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-03T10:00:00+00:00"}, {"title": "Elastic 的 AI agent 为你编写自动化流程", "summary": "Elastic Workflows 接受纯文本提示词，并生成你可以检查、版本控制和针对 Elasticsearch 数 function fmtBeijing(iso, withDay){

  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
