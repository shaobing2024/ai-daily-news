8-30T14:02:09+00:00"}, {"title": "消息称字节跳动豆包大模型 2.2 将推迟发布，原计划 8 月推出", "summary": "IT之家 8 月 30 日消息，据白鲸实验室消息，字节跳动原计划于 8 月推出的豆包大模型 2.2 将推迟面世。多位接近字节的人士称，延期的原因是，字节内部希望通过更充分的预训练和后训练，把编程、工具调用和 Agent 能力拉上去。用更长的研发周期换一次更明显的能力提升。Seed 现在同时面对两件事，一边要推进下一代超大模型，一边又不能停止现有模型的正常迭代。所以，2.2 更像是夹在两代模型之间的一次关键补强。它既不能等到下一代超大模型完成再解决 Coding，也不能再用过去的方式简单迭代一次。Coding 能力跻身第一梯队，是 Seed 团队在 2026 年的主要目标之一。报道称字节希望 Seed 模型的 Coding 能力在年底之前能产生类似智谱 GLM-5.2 和 Kimi-K3 的行业冲击力。据 The Information 8 月 5 日报道，字节跳动创始人张一鸣在上个月的 Seed 团队全体会议上明确表示，即使意味着暂时落后于竞争对手，公司也不会依赖 AI 蒸馏技术来改进其模型。IT之家注意到，8 月 6 日，字节跳动 CEO 梁汝波在 2026 年度年中全员会上表示，在大语言模型上，接下来字节跳动还是会坚持自研，做好基本功，接受短期落后，坚持优化长期。相关阅读：《为 5 万亿参数超大模型“铺路”？消息称字节跳动调整 Seed 基模团队组织架构》《国内已知最大规模！消息称字节跳动正讨论训练超 5 万亿参数模型》《字节豆包 Seed 2.1 Pro 和 Turbo 深度思考模型发布，三大能力比肩 GPT-5.5》《字节跳动豆包大模型 2.0 发布：专家模式上线，多数基准达 SOTA 水平》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/996/239.htm", "publishedAt": "2026-08-30T13:42:41+00:00"}, {"title": "QFO v1.0.1：面向量化新手的本地 A 股研究与回测平台", "summary": "QFO v1.0.1 已发布。 QFO 是一个免费开源、本地运行的 A 股量化研究与回测平台，面向希望系统学习量化投资的新手。项目以 Windows 本地环境为主，将数据同步、资产筛选、因子研究、策略回测、组合优化、风险分析和可视化整合为一套可操作流程。 本版本主要包含 数据中台：统一管理股票、ETF、可转债、指数、资金流和财务...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502202", "publishedAt": "2026-08-30T11:44:35+00:00"}, {"title": "消息称 Meta 正测试数据中心机器人，可完成插拔线缆、重启服务器等运维工作", "summary": "IT之家 8 月 30 日消息，据 Wired 报道，多位了解相关项目的 Meta 现任及前员工透露，Meta 正在测试能够在数据中心内插接线缆、重启服务器以及执行其他任务的机器人。这项此前未被报道的工作仍在进行中，未来可能让 Meta 以更少的人力运营不断扩张的数据中心，从而在人工智能基础设施投入不断飙升的情况下控制劳动力成本。上述知情人士表示，Meta 正在使用多家厂商的机器人及相关硬件，包括 Watney Robotics、Kinova 和 ABB。由于这些员工没有获得对外发声的授权，他们要求匿名。Kinova 和 ABB 拒绝置评，Watney 则没有回应置评请求。在一项实验中，Meta 正在评估 Kinova Gen3 机械臂能否用于服务器的电源循环，也就是切断服务器电源后再重新通电。Meta 还在测试另一种机器人，用来更换网络线缆。一名 Meta 数据中心员工估计，如果测试成功，这种机器人可能取代部分员工高达 80% 的工作量。“我们原以为，负责这些体力工作的员工至少暂时还是安全的，但现在已经不是这样了。”这名员工说，“很遗憾，它最终会影响我们所有人。”在一些数据中心，Meta 还悄悄部署了另一种相对简单的机器人。它看起来像一根手指，或者一根尖头的小棍子，可以在人类远程发出指令后，按下 Mac Mini 或其他设备上的电源按钮，将设备重新启动。Meta 拒绝就本文描述的机器人测试置评。公司发言人 Francis Brennan 在一份声明中表示，Meta 正在大力投资培训和招聘员工，以建设和运营数据中心。他表示：“美国正处于二战以来最大规模的基础设施建设热潮之中，而能够填补这些岗位的技术工人严重短缺；我们需要更多工人，而不是更少。”不过，Meta 机器人部门高级经理 Eric Xu 去年在一次会议上表示，将机器人部署到数据中心是公司的“长期目标”。他认为，机器人可以加快故障响应速度、监控环境并执行预防性维护。他说：“我们认为还需要开展更多合作和研究，但必须迈出第一步，否则我们根本没有机会实现这一目标。”直到最近，机器人都不太适合承担数据中心里的精细工作。一位了解相关测试的人士表示，过去机器人不仅价格昂贵，行业早期测试中还曾在执行简单任务时把服务器压坏。但如今，机器人硬件的成本已经下降，为机器人提供动力的 AI 模型能力也比几年前强大得多。目前已经有多家初创公司在开发能够组装服务器、更换零部件以及替换线缆的商用机器人。与人工相比，机器人有望以更低的成本提供更加稳定的工作成果，尤其是在数据中心密集、但合格工人稀缺的人口较少地区。支持者还从“帮助工人”的角度为机器人辩护。他们认为，就像 AI 智能体有望帮助知识型员工一样，机器人可以承担数据中心技术人员最重复、最危险的工作，让人类把精力放在更加复杂的问题上。从更长远来看，如果数据中心能够摆脱对人类工作人员的依赖，那么将数据中心部署到海底、太空或者其他不适合人类长期生存的环境中，也可能变得更加可行。芯片制造商 Analog Devices 负责所谓“物理智能”业务的 Paul Golding 表示：“越来越多客户告诉我们，‘我们希望使用人形机器人来运营数据中心’，因为这样一来，机器人可以在更高的温度下工作，可以在黑暗环境中工作，还有很多类似的优势。”机器人进入数据中心，却很少成为抗议焦点机器人的日益普及并没有引起反对数据中心建设的环保及社区活动人士太多关注。IT之家注意到，目前，美国各地正在形成一场声势强劲的反数据中心运动。科技公司经常把创造就业岗位作为数据中心建设的一项重要好处，并以此为理由争取税收优惠。在爱荷华州 Altoona，Meta 运营着目前规模最大的一个数据中心园区，拥有数百名员工。该园区于 2014 年启用，当地政府给予的房产税优惠还将持续数年，每年可为 Meta 节省数千万美元。Altoona 市政府认为，这是值得的交换，因为 Meta 带来的就业岗位也提升了当地的知名度。不过，在 Altoona，Meta 员工的群聊已经开始弥漫着一种低落的情绪。一位了解相关讨论的人士表示，员工经常说：“反正几年之后我们都会因为机器人而失业。”即使机器人最终普及的速度低于预期，一些员工仍担心现有岗位的质量正在下降。两名员工表示，Meta 正在开发 AI 软件和其他技术，他们认为这些技术将帮助公司雇佣技能水平更低、因而薪资也更低的员工，同时把部分岗位集中到科罗拉多州丹佛等对公司而言成本更加有利的地区。一名 Meta 数据中心员工说：“他们现在不再需要那些能够独立思考、提出创造性解决方案或者处理复杂故障的人。他们想要的是‘智能双手’，也就是只需要具备足够的能力按照 AI 的指令工作，并且别把事情搞砸的人。”Meta 则强调，公司对技术工人的需求依然非常旺盛。今年，Meta 启动了一项长期培训计划，每年免费培训数千名来自不同背景的人，让他们学习电气、机械和管道方面的技能。对于完成培训的人，Meta 甚至承诺在路易斯安那州、俄亥俄州、印第安纳州和得克萨斯州等地提供就业机会。Meta 还与建筑行业工会合作，为学徒培训项目提供资金支持。不过，随着各地社区重新审视给予数据中心的税收优惠，并考虑针对这一行业制定新的监管规定，机器人至少取代部分工作岗位的可能性或许需要得到更多关注。Altoona 市长 Dean O’Connor 告诉 WIRED，他还没有认真考虑过机器人可能取代 Meta 数据中心工作岗位的问题。不过，在他看来，自动化是不可避免的。他说：“事情来了，我们就应对。”线缆难题Meta 曾在 2023 年的一段 YouTube 视频中展示，公司正在使用自动驾驶牵引机器人，在数据中心内部运输沉重的服务器机架。同时，Meta 还展示了一款内部研发的轮式机器人，该机器人能够读取条形码，用于追踪库存。第二年，微软和谷歌分别公布了对数据中心机器人领域的投资；亚马逊去年也讨论过利用机器人帮助其设施回收零部件。微软研究加速器部门董事总经理 Ashley Llorens 告诉 WIRED，微软“绝对正在研究”将机器人用于“更换故障服务器机架”等具有“经济价值的任务”。据知情人士透露，Meta 的牵引机器人和库存机器人目前已经在公司的多个数据中心运行，包括爱荷华州和弗吉尼亚州的数据中心。他们表示，这些机器人总体运行良好，但仍存在一些限制。库存机器人目前还被用于检查设备故障，但由于它的摄像头只能识别灰度图像，无法区分设备上的绿色和红色指示灯，因此部分故障仍需要人工检查。这种机器人在转弯以及跨越经常出现在行驶路径上的线缆时也表现不佳。由于目前部署的机器人数量不多，它们需要在不同建筑之间移动，而这一过程仍需要人工开门，并通过遥控器操控机器人通过。另外两名消息人士表示，库存机器人的运行速度也太慢。其中一人透露，Meta 此前曾考虑使用无人机作为更快的替代方案，但最终没有继续推进这一想法。Altoona 成为机器人测试场Altoona 数据中心园区经常被 Meta 用来测试新技术。Altoona 市长 O’Connor 说：“他们在 Altoona 这里做的事情，会带到其他园区，并在那里部署。”据一位熟悉 Meta 相关项目的人士透露，自去年 6 月以来，Meta 一直在旗下 Altoona 一座数据中心大楼中测试两台双臂 Watney 机器人，用于执行部分布线工作。这些机器人由人类监督，目前工作速度还比不上人类，但已经展现出一定潜力。Watney 于 2023 年成立后，曾展示过一款能够折叠衣物的机器人，并宣称这款机器人还可以承担企业内部的清洁工作。不过，根据该公司网站的历史存档，这家总部位于旧金山的初创公司在去年年初悄然转向了数据中心机器人领域。Meta 还在俄亥俄州 New Albany 的新数据中心园区 Prometheus 测试更多机器人。一位熟悉该产品的人士表示，自动化巨头 ABB 制造的四轮机器人已经在那里投入使用。这些机器人配备类似剪式升降机的升降机构，顶部安装一条六轴机械臂，目前用于重新安装和固定部件。未来，它们可能承担更多任务，而且所需的人类监督也会逐渐减少。不过，机器人最终能否战胜人类，目前仍没有定论。Exclaim Robotics 首席执行官 Helen Oleynikova 表示，该公司正在开发能够更换损坏部件、重新整理数据中心线缆的机器人原型，但“已经进行了很多试点和演示，却还没有一个经过验证、真正能够稳定工作的解决方案”。据知情人士透露，在 Meta 的数据中心，一些员工曾抱怨机器人需要花费大量时间停下来给电池充电，由此造成不少停机时间。Meta 内部也承认，机器人目前无法胜任某些任务，例如运行 Nvidia GB300 超级计算机所需的高强度布线工作。一名前 Meta 员工说：“这些设备一直都是按照人类双手来设计的，目的就是让每项维修都能在五分钟内完成。重新设计所有东西需要时间。”但机器人也正在为承担更多工作做好准备。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/996/222.htm", "publishedAt": "2026-08-30T11:26:34+00:00"}, {"title": "Claude开始训练Claude！4美元一小时，跑赢150美元人类研究员", "summary": "AI「自进化」，越来越近了", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/481223.html", "publishedAt": "2026-08-29T12:50:31+00:00"}, {"title": "「中国词元」：芯片、模型、绿电的算术题", "summary": "8 月 28 日周五晚，天际资本创始人张倩和开源中国 CEO 徐勇做了一场直播，聊的是英伟达收购 Hugging Face。直播后半段，徐勇提了一个概念，叫「中国词元」。 这个词是开源中国董事长马越提出来的，还在区块链上做了存证。公式很简单，中国词元=中国芯片+中国模型+中国绿电，这是一笔清晰的成本账。 徐勇讲了他在美国的见...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502199", "publishedAt": "2026-08-29T10:14:00+00:00"}, {"title": "中国版 Hugging Face 是怎么造出来的", "summary": "Hugging Face 以 129 亿美金被英伟达收购之后，很多人在问同一个问题，中国有没有自己的开源模型平台？ 有，叫模力方舟（Moark）。 8 月 28 日周五晚，天际资本创始人张倩和开源中国 CEO 徐勇做了一场直播，聊的正是英伟达收购 Hugging Face。直播里徐勇讲了模力方舟是怎么做出来的，过程比想象中硬核得多。 2022 年 11...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502197", 员可抢先看 3 集，VIP 会员可抢先看 2 集。据介绍，神话题材季播剧《后西游记》改编自明末清初匿名作者所著的同名神魔小说，其第一季共 30 集，每集 40 分钟。作为《西游记》三大续书之一，《后西游记》原著讲述了因世间众人误解真经，“西游二代”因缘际会再次集结取经的故事。剧集将四十回原书框架与《西游记》原著中的相关伏笔与线索深度融合、相互补充，构建出完整的“西游后传”叙事体系。故事始于孙悟空封圣一千零八十年之后，长到当年取回的真经变得缺失、引人误读，也长到让诞生过齐天大圣的仙山，再次诞生出一只小石猴（孙小圣）。然而，曾在“生死簿”上被划掉过名字的“十长老”，竟在庆典上当众消失，花果山迎来重重危机。这一切逼着新一代猴王孙小圣成长与觉醒，他追查“生死簿失效”的真相，历地府天宫诸劫，最终与唐半偈、猪一戒、沙弥等人结缘，踏上补取真经的二次西行之路。IT之家注意到，该剧为“广电 21 条”发布后首部“边审边播”剧集，采取边制作、边审核、边播出的创新模式。既缩短内容创作播出周期，也便于创作端根据审核意见、观众反馈动态优化剧情细节。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/996/265.htm", "publishedAt": "2026-08-30T23:28:36+00:00"}, {"title": "消息称苹果曾为折叠屏 iPhone 测试触控笔：可磁吸在手机侧面，但量产机可能无缘", "summary": "IT之家 8 月 30 日消息，据彭博社记者马克 · 古尔曼今日爆料，苹果曾为折叠屏 iPhone 手机测试过 Apple Pencil 触控笔，但最终的市售产品不太可能支持。古尔曼透露，苹果至少探索过一款更短的 Apple Pencil 原型，它可以通过磁吸方式吸附在手机侧面。但公司在测试过程中发现，磁吸笔和折叠屏手机形态并不是很协调。如果这款 Apple Pencil 在屏幕折叠时吸附，会和机身较长的一侧对齐。这时用户如果想再次展开手机，就必须把笔拿下来。同时，折叠屏本身的结构并不是非常硬，因此苹果担心 Apple Pencil 会给内屏留下不雅观的痕迹。虽然苹果可能在未来推出支持 Apple Pencil 的折叠屏手机。但从目前进度来看，第一代折叠屏 iPhone 不会配备手写笔。IT之家注意到，苹果创始人、前首席执行官史蒂夫 · 乔布斯曾在第一代 iPhone 发布时公开嘲讽触控笔，并留下名言：“谁想要触控笔啊？你还得拿出来、收起来，而且还容易弄丢。呸！根本没人想要触控笔。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/996/246.htm", "publishedAt": "2026-08-30T14:36:25+00:00"}, {"title": "AI 开发的一个安全优先的编程工具", "summary": "一个被忽视的安全隐患 2024 年，AI 编程工具已经从\"尝鲜玩具\"变成了开发者的日常生产力引擎。Cursor、Copilot、Windsurf……越来越多的开发者把整段代码、配置文件、甚至 .env 丢给 AI 来分析和修改。 但你有没有想过： 那些包含 API Key、数据库密码、SSH 私钥的文件，正随着你的每一次对话被发送到云端？ 大多数 AI 编...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502201", "publishedAt": "2026-08-30T11:37:16+00:00"}, {"title": "AI本地部署不如官方版的元凶找到了：734个依赖包，每一个都可能坑", "summary": "推理软件栈的微小差异，就能改变输出token", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/481372.html", "publishedAt": "2026-08-29T13:11:08+00:00"}, {"title": "规模化 AI 代码审查：LinkedIn 的多智能体方案", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/A0CMcU7UVsMQreKPcKOw?utm_source=rss&amp;utm_medium=article", "publishedAt": "202 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
