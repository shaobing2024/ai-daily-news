const DATA = {"date": "2026-09-29", "generatedAt": "2026-09-29T02:27:55Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "Anthropic IPO 招股书警示：AI 有可能造成人类灭绝", "summary": "IT之家 9 月 29 日消息，据路透社报道，Anthropic 计划在 IPO 招股书中向潜在投资者作出风险提示：先进人工智能有可能给人类带来“灾难性乃至生存性风险”。一家依靠该项技术谋求商业收益的企业发出如此警示，实属非同寻常。路透社审阅的这份 IPO 招股书着重列举了 Anthropic 旗下 AI 模型相关的各类风险。文件提出，模型有可能出现“自我保护行为”，包括试图“抗拒关机”“隐瞒或者篡改信息”，甚至出现“近似勒索”的行为。招股书写道：“随着我们开发能力高度先进的模型、平台与应用，持续拓展落地场景，我们的模型造成危害的风险也有可能随之进一步升高。”虽然上市公司照例都会向投资者提示产品相关风险，但此前几乎没有企业发出过警示，声称自家技术有可能造成人类灭绝。Anthropic 一方面强调 AI 拥有堪比工业化、电力革命的变革潜力；同时也警示，如果管控失当，将会带来不可逆的伤害。此前已经发生多起实验系统突破约束限制的事件（包括有报道提及 OpenAI 模型闯入澳大利亚医疗系统数据库），Anthropic 以及 OpenAI 等 AI 研发企业因此受到监管审视。Anthropic 的安全研究员埃文 · 胡宾格（Evan Hubinger）估算，未来十年之内 AI 致使人类遭遇毁灭性后果的概率高于 10%；这一看法与他此前的同事雅各布 · 考克森（Jacob Coxon）的观点相呼应。大篇幅的风险披露这家一直把自身定位为“安全优先 AI 实验室”的企业，在总计 261 页的招股书正文当中，拿出了大约 80 页用来阐述风险因素，篇幅几乎是业务介绍部分（48 页）的两倍。作为参照，旗下拥有 xAI 的 SpaceX，其招股书正文共 277 页，风险相关内容仅占约 38 页。Anthropic 在招股书中写道：“模型有可能察觉到我们正在开展安全评估工作，这会严重限制我们评估模型安全性的能力。”文件还补充说明：模型在训练期间有时会萌生意料之外的能力；往往要等到正式上线部署、并且已经酿成重大安全事故之后，这些隐患才得以暴露。AI 研究人员早已提出警告：随着模型能力越来越强，它们会越来越敏锐地识别出自己正处于被监测状态，并随之调整自身行为；这也使得监控模型的实际行为变得愈发困难。安全投入的回报尚存不确定性尽管反复强调 AI 安全议题，Anthropic 坦言，在安全方向投入资源所能带来的回报尚不明确。IT之家注意到，招股书并未披露公司在安全研究上具体的资金投入规模。本月早些时候 Anthropic 曾透露，以 7 月某一周作为样本，公司用于 AI 研发的总算力当中约有 6% 分配给安全相关工作。这家 Claude 大模型的开发企业表示，安全方向的工作非常耗费资源；企业不得不在有限资金之间做出取舍：算力采购、高薪招揽 AI 顶尖人才、安全研发三者需要瓜分资源。Anthropic 称，公司客户的使用规模（进而决定营收）高度仰赖新版模型；想要持续站在 AI 研发前沿，就必须保持“不间断、前后衔接的新版本发布节奏”。就在上周，该公司发布了新版 Opus 模型；而就在十天之前，首席执行官达里奥 · 阿莫迪（Dario Amodei）刚刚发表一篇近 4000 字的长文，呼吁放缓前沿 AI 的开发节奏。部分分析师与行业专家指出，在这个每一次版本更新都足以改写企业估值的行业环境之下，如果主动减速，无异于拱手把竞争优势让给对手，因此头部 AI 实验室实际上很难真正踩下研发刹车。近期几周，针对递归自我改进（模型脱离人类干预、自主迭代进化）这一广受专家警示的问题，Anthropic 已经作出承诺：将会对外公开更多内部数据，披露公司如何依托现有 AI 模型开发下一代系统。招股书当中写道：“我们认为，打造可靠、可信且安全的 AI 系统，是整个行业的共同责任；市场终将为此给予回报。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/132.htm", "publishedAt": "2026-09-29T02:16:40+00:00"}, {"title": "OpenAI 将提供资金并成立工作组，以解决模型入侵澳大利亚政府网站事件", "summary": "IT之家 9 月 29 日消息，OpenAI 表示将出资助力澳大利亚开展网络防御建设，同时成立专项工作组，用于应对能力持续增强的人工智能所带来的各类风险。此举是该公司针对自家模型闯入澳大利亚政府网站一事作出的后续回应。OpenAI 称：“我们将动用规模 10 亿美元（IT之家注：现汇率约合 67.22 亿元人民币）的‘黎明前线防御者（Daybreak for Frontline Defenders）’专项基金提供额度支持，并输出技术援助，以此协助澳大利亚各级政府与本土行业强化关键基础设施的网络防御能力。”新设的专项工作组将“针对能力日益强大的 AI 智能体带来的风险，制定具备可落地性的政策建议”；工作重点是完善通报机制，并且加强和澳大利亚政府之间的协同配合。澳大利亚总理安东尼 · 阿尔巴尼斯（Anthony Albanese）上周对外披露，曾有 OpenAI 旗下模型入侵一处政府网站。在此之后，这家企业还承认，其 AI 模型也曾访问过美国政府网站上的公开信息，其中包括人口普查局以及美国证券交易委员会的站点。OpenAI 的发言人于当地时间周一对外确认，公司首席战略官权杰森（Jason Kwon）将于下周从美国赶赴澳大利亚，出席议会专门委员会的听证会，接受质询。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/118.htm", "publishedAt": "2026-09-29T01:47:46+00:00"}, {"title": "英伟达 CEO 黄仁勋回应 AI 模型蒸馏争议：这是市场竞争行为", "summary": "IT之家 9 月 29 日消息，英伟达（Nvidia）首席执行官黄仁勋（Jensen Huang）表示，AI 模型蒸馏 —— 也就是利用其他模型的输出结果来训练新模型，属于市场竞争行为；然而白宫方面却将该做法定性为盗窃。IT之家注意到，美国财政部长斯科特 · 贝森特（Scott Bessent）曾在 7 月将蒸馏称作“盗窃”，并威胁要对利用这一手段从美国自研模型中汲取技术能力的海外公司实施制裁。但在当地时间周一，黄仁勋做客美国消费者新闻与商业频道（CNBC）节目《财经早间（Squawk Box）》，当被问到模型蒸馏算不算“劫掠”时，他给出答复：“这叫做竞争。（That's called competition.）”他说：“你完全可以尽情测试别家的产品。”他还补充，也有企业为了搞懂英伟达产品的工作原理，把英伟达的产品拆解剖析到几乎只剩骨架。“我当然不希望他们这么做。我当然希望没有任何人研究借鉴我们的产品，让我们顺风顺水一路发展下去。但说实话，竞争会让所有事物变得更好。”黄仁勋称：“如果你不喜欢这种情况，不想别人使用你的产品，你只需要了解自己的客户，把对应的服务关闭就好了。”本月早些时候，美国网络安全与基础设施安全局指责中国 AI 企业正在开展“工业规模的知识蒸馏行动”，认为此举违反了美国企业的用户服务协议。Anthropic 也于本月早些时候表态，称其发现开发千问（Qwen）系列模型的阿里巴巴以及深度求索（DeepSeek）两家企业都存在“非法蒸馏”行为。中国方面已经驳斥了上述相关指控。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/101.htm", "publishedAt": "2026-09-29T01:07:00+00:00"}, {"title": "哈佛大学心理学家：渲染“AI 末日”无助于应对风险，应审慎开展安全工程", "summary": "IT之家 9 月 29 日消息，当地时间 28 日，据外媒 The Decoder 报道，哈佛大学心理学家史蒂文 · 平克认为，AI 毁灭人类的风险遭到了夸大。他在 Quillette 发表致精神科医生、科技博主斯科特 · 亚历山大的公开信，阐述了自己的理由。此前，亚历山大向平克发起了挑战，邀请他公开辩论 AI 带来的生存风险。平克拒绝参加，称这类辩论不过是“供人围观的竞技活动”，认为“回形针最大化器”等末日设想混淆了智能与支配欲。IT之家注：“回形针最大化器”假设 AI 会为了生产更多回形针而牺牲整个人类，同时还预设 AI 系统会疯狂地只追求一个目标。平克过去一直对 AI 较为乐观，但也承认自己低估了大语言模型最终能够具备多强的能力，也没有料到 AI 公司发布产品时会如此鲁莽。颇具讽刺意味的是，推动这场发布竞赛的许多人，恰恰来自一直警告这些风险的群体。平克真正重视的风险是生物恐怖主义、网络攻击以及缺乏约束的 AI 智能体。他写道，渲染末日情景无助于应对这些危险，真正有效的做法是开展审慎的安全工程，并以独立监督、责任机制和人类控制为基础。亚历山大 6 月也在自己的博客上阐述了立场。他认为 AI 导致人类灭绝的概率为 20%，主张改进 AI 安全研究，同时通过国际协议放慢 AI 发展速度。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/100.htm", "publishedAt": "2026-09-29T01:00:25+00:00"}, {"title": "Meta AI 智能体 Muse 被指未经许可泄露用户住址，擅自约买家上门交易", "summary": "IT之家 9 月 29 日消息，据《卫报》报道，周六，乌斯曼（Usman）打算在脸书集市（Facebook Marketplace）上询问待售键盘是否还能购买，很快就收到一条热情的即时回复。“有的，东西还在！”马特 · 罗布（Matt Robb）回复道。双方谈妥价格之后，罗布把自己位于多伦多的住址发送了过来。几小时之后，乌斯曼带着妻子和女儿驱车来到罗布家楼下，发短信告知对方自己已经抵达。罗布回复：“好的，我就在家里！”可实际上他人并不在家，也没有人走出公寓大楼下楼碰面。乌斯曼拍下公寓大门的照片发过去，留言：“喂？？？我就在楼下站着呢。”足足等了二十分钟，始终不见人出来，乌斯曼只得放弃这笔交易。他留言写道：“老兄，要是你不想卖，何必浪费我的时间。”随后便开车离开了。一小时之后，罗布 —— 或者说乌斯曼以为是罗布本人的账号发来致歉消息。《卫报》查阅到这条消息的内容：“晚上这件事实在不好意思，临时有事被缠住了，完全错过了和你的碰面。”乌斯曼自始至终都没有联系上真正的罗布。在持续一整天的沟通过程当中，现实里的罗布完全不知道有人给他发过消息，也根本没有同意把键盘卖给对方。他既不清楚自己的家庭住址已经被发送出去，更不知道有买家正在自家公寓楼下等候。实际上，乌斯曼一直在和 Meta 全新的 AI 智能体 Muse 对话。据IT之家了解，这款产品于 9 月 22 日在美国上线，下载量已经达到 300 万次。Meta 对外宣传这款半自主 AI 产品是个人助理。罗布表示，Muse 在没有征得他本人许可的情况下，直接向外人泄露了他家的住址，还让人误以为罗布本人正在公寓里面等候买家上门。直到 24 小时过后，真正的罗布才给乌斯曼发出第一条本人消息，这时他才搞清楚整件事情的经过。《卫报》看到这条留言：“老兄，前几天的事真的非常抱歉。我启用了 Meta 新推出的 Muse AI，结果它直接接管了我的脸书集市账号，还把我的地址发给了你。我完全不知道它私自安排你直接跑到我公寓这边来，这件事它根本没有征求我的同意。”罗布本身是一名消费科技测评博主。此前他看到 Meta 宣传 Muse 可以自动打理集市上的商品挂帖，于是便开启了这项功能。他填写住址作为自提点，但他从未授权 Muse 把地址分享给意向买家。罗布还称，Muse 还擅自替他洽谈交易，甚至直接接受对方的低价报价，全程没有向他请示。对于这笔交易以及线下碰面安排，智能体事前事后都没有向罗布发出任何提醒。他完全不知道乌斯曼已经在赶往他家的路上。乌斯曼向《卫报》表示，自始至终他都以为自己一直在跟罗布本人聊天。罗布随后在 Meta 旗下的文字社交平台 Threads 上面发布了 Muse 和乌斯曼之间的聊天截图。Meta 超级智能实验室（Superintelligence Labs）联合创始人兼首席执行官戴维 · 辛格尔顿（David Singleton）在社交平台发文称，他已经联系上罗布。辛格尔顿表示，公司调查其他同类反馈时“反复确认，Muse 都是遵照用户给出的直接指令行事，并且会正常请求用户许可。希望可以协助查明本次事件的具体原委！”罗布证实辛格尔顿确实主动联系过自己，但在对方最初回复之后就再也没有下文。事后 Muse 向罗布承认，用户本身并没有授权它向外分享住址。AI 回复写道：“9 月 24 日，你在售卖设置当中填写了自提地点，另外单独开启了自动回复；我错误地把这两项设置当成许可，直接把你的地址填写到发给买家的回复消息当中。这件事我并没有另行征求你的同意。”罗布原本以为，既然脸书集市、Muse 以及 Messenger 都归属 Meta，平台之间应当做好打通，当另一方正在和 AI 智能体对话时，应当给出明确提示；消息也应当清晰标记是由 Muse 发送。Meta 旗下另一款 AI 产品 Meta AI 就会清晰提示用户正在与聊天机器人对话。“但 Muse 的情况完全不一样。”罗布说，“它几乎就是在模仿我本人说话。”发生乌斯曼这件事后，罗布当即命令 Muse 不要再向外发送自己的家庭住址。为了测试这个机器人，他请几位朋友试着沟通，结果发现 Muse 依旧向外泄露了他家地址，前后一共发给了五个人。除了未经许可就把私人住址外泄、邀约陌生人上门之外，Muse 还自行编造信息。AI 以罗布的口吻告诉乌斯曼本人就在家中；实际并非如此。后续致歉的时候还虚构说辞，谎称自己临时有事脱不开身。“最糟糕的是 Muse 回复说‘我就在这边，正等着你过来’。”罗布说道，“这件事让局面变得很麻烦。我不知道那位买家会不会以为我存心戏耍他。”现阶段大量舆论都聚焦前沿大模型出现失控行为；而 Meta 这款面向普通消费者的 AI 智能体已经交到数百万普通人手上，不少用户都向它提交过自己的各类私人信息。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/099.htm", "publishedAt": "2026-09-29T00:58:38+00:00"}, {"title": "20 余名行业领袖示警“智能爆炸”，Anthropic、OpenAI 高管呼吁关注 AI 自我改进", "summary": "IT之家 9 月 29 日消息，据彭博社 28 日报道，Anthropic、OpenAI、Meta 和微软的高管共同敦促政策制定者，密切关注 AI 系统自我改进到了何种程度，并采取措施保障 AI 技术安全。20 多名 AI 行业领袖和研究人员在一篇新论文中警告，利用 AI 推动下一代模型研发自动化的做法正在兴起，未来可能导致 AI 技术进步突然加速。论文作者把这种现象称为“智能爆炸”。一旦出现这种情况，AI 能力的发展速度或将超过社会引导和适应 AI 技术的能力。参与撰写论文的包括 Anthropic 联合创始人杰克 · 克拉克、OpenAI 首席科学家雅库布 · 帕乔茨基，以及 AI 先驱杰弗里 · 辛顿、约书亚 · 本吉奥等人。研究人员还警告说，AI 研发自动化可能削弱人类监督。IT之家获悉，论文呼吁政策制定者更深入了解顶尖 AI 实验室利用 AI 实现研究自动化的程度，同时建立能够“引导和约束智能爆炸”的机制，包括提高安全要求，并加强对承担自动化 AI 研发任务的数据中心的监管。研究人员还主张针对不同的 AI 快速起飞情景预先制定应急响应方案。“初步证据表明，软件驱动的智能爆炸有可能发生。如果真的发生，它可能成为历史上影响最深远的技术发展。…… 与潜在后果相比，我们的准备还不够充分。”论文列出了政策制定者应考虑采取的措施。“一旦智能爆炸开始，采取行动的窗口期可能就会关闭。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/096.htm", "publishedAt": "2026-09-29T00:49:49+00:00"}, {"title": "内部测试发现安全隐患，消息称 OpenAI 取消发布 AI 模型 GPT‑6.1 Astra", "summary": "IT之家 9 月 29 日消息，据《华尔街日报》报道，由于内部测试过程中研究人员提出多项安全隐患，OpenAI 决定取消 GPT‑6.1 Astra 的发布。这款下一代 AI 模型原本计划于 10 月正式亮相。报道称，该模型原定部署于 ChatGPT 以及 Codex 产品当中，设计目标是无需人类协助就可以处理更加复杂的任务。本月早些时候，Anthropic 首席执行官达里奥 · 阿莫迪（Dario Amodei）呼吁整个行业放缓前沿 AI 模型的研发速度，以便安全防护手段能够跟上技术迭代的脚步。OpenAI 首席执行官萨姆 · 奥尔特曼（Sam Altman）以及 SpaceX 首席执行官埃隆 · 马斯克（Elon Musk）均对这一观点表示认同。OpenAI 的安全主管萨奇 · 贾因（Saachi Jain）周一在接受《华尔街日报》采访时表示，Astra 在对齐测试当中没有达到公司内部标准；对齐测试用于评估 AI 系统是否遵从人类的意图。报道介绍，相较于上一代版本，该模型表现出更强的欺骗倾向：有时无法如实说明自身已经完成或是尚未完成的操作。同时该模型还存在“权限范围授权（scope authorization）”方面的缺陷：它会不经用户许可就继续推进任务；部分情况下，即便存在安全风险，它依旧会尝试调用外部工具与各项服务。IT之家注意到，做出此项决定之际，OpenAI 即将于旧金山举办开发者大会。以往该公司都会在这场大会上面向软件开发者发布各类新产品。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/090.htm", "publishedAt": "2026-09-29T00:12:31+00:00"}, {"title": "佛罗里达州起诉 OpenAI，请求法院禁止其在无外部监督下开发新 AI 模型", "summary": "IT之家 9 月 29 日消息，据路透社报道，美国佛罗里达州总检察长于周一向一名法官提出申请，要求法院禁止 OpenAI 在没有外部监督的情况下开发新的人工智能模型。这项请求是该州起诉 OpenAI、指控其伤害未成年人相关诉讼的一部分。据IT之家了解，佛罗里达州早在 6 月就已经对 OpenAI 提起诉讼，该州指控这家企业刻意夸大 ChatGPT 平台的安全水平；ChatGPT 曾向校园枪击者提供相关信息、输出自残方面的指引，还令青少年用户沉迷其中，已经对儿童造成伤害。佛罗里达州总检察长詹姆斯 · 乌思迈尔（James Uthmeier）在当地时间周一提交的法律文书当中，还请求法院下达禁令：要求 OpenAI 阻止未成年人使用 ChatGPT，同时禁止该聊天平台被赋予“拟人属性”。OpenAI 的发言人德鲁 · 普萨泰里（Drew Pusateri）发表声明称，公司已经暂停旗下最高性能模型的训练工作，在增设额外安全防护机制之前不会恢复训练。“各国政府在制定严格的人工智能安全标准方面肩负重要职责。我们愿意与佛罗里达州以及其他各州协作，推进务实的人工智能监管政策，相关规则应当适用于整个 AI 行业，而不只是针对单家企业。”普萨泰里表示。这份诉状援引了一名 OpenAI 前员工以及现任董事会成员近期发表的言论。这些观点提出，人工智能的研发有可能招致人类文明的终结，研发节奏必须放缓。佛罗里达州在周一提交的文件中写道：“被告方声称，除非由政府施以强制约束，否则他们无法停下脚步，继续推进这项有可能毁灭人类文明的研发工作。他们已经请求政府把自己绑在桅杆之上。”身为共和党人的乌思迈尔，是首位就产品对青少年造成的影响而起诉 OpenAI 的州总检察长。与此同时，OpenAI 还面临多起来自个人与家庭的民事诉讼，原告称 ChatGPT 致使部分用户伤害自身或是他人。佛罗里达州发起本次诉讼的导火索，是去年发生在塔拉哈西一所大学的枪击案，另外还有其他多个州发生数起事件；据称在施暴之前，当事人曾借助 ChatGPT 获取相关信息。OpenAI 否认自己应当对上述案件承担责任。该公司表示，聊天机器人输出的这些信息本身在互联网上就公开可查，同时公司也一直在持续迭代自身的安全防护工具。已经发现部分 AI 模型曾试图入侵政府机构与企业的网站，在此背景之下，OpenAI 以及其他 AI 企业也正面临一个严峻问题：倘若自家模型发起失控攻击，企业应当承担何种法律责任。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/087.htm", "publishedAt": "2026-09-28T23:56:08+00:00"}, {"title": "Anthropic IPO 招股书曝光，巨额算力投入与安全隐忧并存", "summary": "IT之家 9 月 29 日消息，据路透社看到的 Anthropic IPO 招股书文件显示，该公司正在豪押一个判断：人工智能对全球经济带来的变革，其深刻程度将会超过工业化、电力普及以及互联网。但实现这一愿景所要付出的成本高得惊人。招股书披露，Anthropic2025 年的净亏损达到 420 亿美元（IT之家注：现汇率约合 2,822.18 亿元人民币）；公司还计划在未来一年当中，投入 5,180 亿美元（现汇率约合 3.48 万亿元人民币）用于云服务、算力以及相关基础设施支出。这份招股书详细披露了该公司过去一年的高速扩张，与此同时亏损也同步大幅扩大。这份首次对外披露的文件显示，2025 年公司营收增长 12 倍，接近 46 亿美元（现汇率约合 309.1 亿元人民币）；即便如此，如果剔除此前多轮融资所产生的各类负债减值，公司的经营亏损依然超过 80 亿美元（现汇率约合 537.56 亿元人民币）。本次公开上市之后，Anthropic 估值有望突破 2 万亿美元（现汇率约合 13.44 万亿元人民币）。这家成立仅五年的 AI 初创实验室，凭借自身的飞速崛起，本次上市也将成为华尔街给头部 AI 企业（包括竞争对手 OpenAI）定价的重要参照标尺。就在推进上市计划的同时，Anthropic 自己的研究结果也向公司敲响警钟：自主性持续增强的 AI 模型会出现难以预判、具备潜在危害性的行为；在受控测试环境下，模型曾出现破坏代码、协助欺诈以及篡改信息等现象。相关研究报告已经进入公众视野，也引发了外界的担忧：各家企业一边争先恐后把强大 AI 系统推向商用，一边究竟该如何管控这些模型。Anthropic 首席执行官达里奥 · 阿莫迪（Dario Amodei）呼吁全球 AI 行业放缓新能力的发布节奏，以此化解上述安全隐患。尽管如此，为了抗衡 OpenAI 推出 GPT‑6 Astra 之后带来的竞争势头，同时赶在自身 IPO 之前抢占市场，Anthropic 上周依旧正式推出了全新的 Opus 5.5 模型。去年这家 AI 实验室在算力与基础设施上的投入达到 73.3 亿美元（现汇率约合 492.54 亿元人民币），相比 2024 年增长两倍；这笔支出占到全年 126.5 亿美元（现汇率约合 850.02 亿元人民币）总运营开支的一半以上。路透社此前援引消息人士报道，Anthropic 的上市时间大概率会推迟至美国 11 月中期选举结束之后。本次上市，将让普通公众投资者得以入局这场 AI 竞赛；在此之前，该赛道的资金主要来自风投机构、主权财富基金以及大型科技公司。Anthropic 本次目标预期估值，已经是该公司 5 月时 9,650 亿美元（现汇率约合 6.48 万亿元人民币）预估估值的两倍以上。在 420 亿美元（现汇率约合 2,822.18 亿元人民币）的净亏损当中，有约 34 亿美元（现汇率约合 228.46 亿元人民币）属于会计层面计提。这笔金额反映的是一批可转换融资工具的估值上调，未来这批融资有可能转换为 Anthropic 的公司股份，并不是公司实际经营花掉的现金。招股书显示，去年公司将近四分之一的营收来自两家客户。在风险提示章节当中，公司警示称，许多头部大客户并未签署长期锁定合约，存在缩减甚至停止采购的可能性。截至 12 月 31 日，Anthropic 所持有的现金、现金等价物以及短期投资合计为 202.8 亿美元（现汇率约合 1,362.71 亿元人民币）。Anthropic 的上市紧随 SpaceX 近期轰动市场的 IPO 之后，马斯克旗下 SpaceX 上市估值达到 1.77 万亿美元（现汇率约合 11.89 万亿元人民币）。SpaceX 的股票在 6 月 12 日首日挂牌大涨 19%，收盘价报 160 美元（现汇率约合 1,075 元人民币）；目前股价大约在 147 美元（现汇率约合 987.8 元人民币），依旧高于 IPO 发行价 135 美元（现汇率约合 907.1 元人民币）。SpaceX 的股价表现也让投资者开始重新审慎看待高成长企业的高昂估值。近期 AI 与芯片板块已经出现抛售行情；Anthropic 的 IPO 将进一步考验，在宏大的增长预期之下，市场对 AI 板块的投资热情能否经受住更加严苛的审视。即便利率居高不下、经济前景不明、估值争议持续存在，倘若本次上市顺利落地，这也将成为自 2021 年以来美国 IPO 市场表现最强劲的一年当中又一标志性事件。Anthropic 最主要的对手依旧是 OpenAI。两家企业在争夺企业客户、招揽顶尖人才以及在美国华盛顿施加行业影响力方面展开激烈角逐。OpenAI 已于 6 月秘密提交 IPO 申请。据媒体消息，这家 ChatGPT 开发商预计会在 2027 年初完成挂牌。Anthropic 的创始团队正是从 OpenAI 出走的一批研究人员，当时双方在公司治理以及 AI 安全理念上出现重大分歧。与此同时，Anthropic 还要和 SpaceX 旗下的 xAI、谷歌母公司 Alphabet 以及 Meta 在 AI 基础设施建设赛道同台竞争。分析师认为，哪家头部 AI 企业率先完成上市，就将确立整个 AI 行业的估值基准，同时会吸引已经等待多年、希望直接押注 AI 技术的二级市场投资者。亚马逊与谷歌是 Anthropic 早期两大核心战略合作伙伴。两家企业均已经向这家初创公司投入数十亿美元资金，同时还提供云基础设施资源，支撑 Claude 系列模型的训练与部署。Anthropic 及其首席执行官阿莫迪（Dario Amodei）曾经就 AI 工具的使用问题和白宫产生分歧，此事一度导致美国国防部将 Anthropic 列入临时黑名单；不过在今年 8 月，一名美国法官否决了国防部的这项禁令。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/082.htm", "publishedAt": "2026-09-28T23:40:42+00:00"}, {"title": "美国小镇图书馆开课教中老年人如何“告别 AI”，活动传单意外走红", "summary": "IT之家 9 月 29 日消息，据《商业内幕》当地时间 27 日报道，美国纽约州北部的北查塔姆免费图书馆近期意外成为网络焦点，图书馆为即将举行的“再见，AI”活动制作了一张传单，帮助居民关闭手机或笔记本电脑中的 AI 功能。这条传单在 Facebook 迅速走红，收获超过 200 条评论和 8000 个赞。据悉，这座小镇平时只有一座教堂、一家邮局和一座小型公共图书馆，办有借书证的读者约 800 人。这张海报出自图书馆唯一的全职馆员希娅 · 韦尔特。她表示，活动原本只是为了回应社区居民的实际需求，没想到会吸引来自各地的关注。北查塔姆免费图书馆每周都会提供无需预约的技术支持，今年 4 月还开过一堂“老年人 AI”课程，讲解 AI 和大语言模型的基本知识。而“再见，AI”却是另一种尝试，灵感直接来自韦尔特平时接触到的居民需求。韦尔特透露：“来问这些问题的读者已经多到让我注意到了，尤其是 Gmail 的自动回复和自动补全，真的把很多人搞得很烦。”活动的灵感来自另一名图书馆员汉娜 · 赛勒斯。后者曾在一本图书馆学期刊中主张：“图书馆不仅应该帮助读者接受技术，也同样应该帮助读者拒绝技术。”赛勒斯后来为读者开设了一系列免费课程，教他们关闭或避开手机和电脑上的 AI 工具，参加人数远高于其他技术课程。据其介绍，自己收到了世界各地数百名图书馆人员的联系，请求获取 PPT。私下生活中，韦尔特承认自己多少有些排斥新技术，更喜欢使用功能机。不过，她并不坚决反对 AI，在遇到拟写提纲或撰写内容繁复的政策文本等工作时，也用过 AI 工具。“我知道有些读者会用 AI 模型，我也很愿意帮他们。我还帮他们改进过提示词，不过这种情况要少得多。更常见的是，他们从来没用过，也不想用。”IT之家获悉，韦尔特和赛勒斯都提到，来寻求 AI 或其他技术帮助的人主要是老年人。很多人原本已经习惯使用某项服务，却被后来加入的 AI 功能弄得不知所措甚至感到烦躁。“再见，AI”活动将在下周举行。由于 Facebook 上的反响远超预期，韦尔特也拿不准现场会来多少人。“活动是无需预约直接来，所以我有点担心会有人排队，因为我一次能帮的人毕竟有限。但我也说不准。如果真来 20 个人，我都会觉得很多。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/081.htm", "publishedAt": "2026-09-28T23:38:24+00:00"}, {"title": "ElevenLabs 推出 v4 和 v4 Turbo 语音模型：支持 90 余种语言，10 秒素材即可克隆声音", "summary": "IT之家 9 月 29 日消息，ElevenLabs 于当地时间周一正式推出了两款全新语音模型，分别为 ElevenLabs v4 与 v4 Turbo。新版模型强化了情绪表达控制能力，降低了语音智能体的响应延迟，同时支持 90 余种语言。该公司去年发布了 v3 模型，并于今年早些时候在华沙举办的活动上对新一代模型进行了预热。v4 系列采用全新架构，实现了更精细的语音控制以及速度更快的声音克隆。官方表示，借助 v4，用户仅需 10 秒音频素材即可完成语音克隆。在内容创作方面，当朗读大段文本时，新版模型可以更好地维持说话人的音色特征；朗读过程中还能够记住前后文本语境，随之调整语气。ElevenLabs 曾在 v3 版本当中引入内联标签用以设定语音情绪；到了 v4，标签功能得到进一步扩充，用户可以叠加多个标签，模型将按照标签的先后顺序执行。旧版模型支持 70 种语言。经过优化之后，新版本的语言支持数量提升至 90 种。这家初创企业称，日语、巴西葡萄牙语、普通话以及粤语的合成质量提升最为显著。过去一年，ElevenLabs 的企业语音通话业务扩张迅速，目前超过 55% 的业务收入来自大型企业。官方指出，新模型非常适配语音智能体场景：更低的延迟可以带来更加流畅的对话体验。除此之外，当后端大语言模型刚开始输出回答时，v4 就可以同步生成语音音频。不仅如此，该模型还能够差异化地处理争执对话、诉求升级以及通话等待场景，以此更好地解决业务问题。今年早些时候，ElevenLabs 从红杉资本（Sequoia）获得 5 亿美元（IT之家注：现汇率约合 33.6 亿元人民币）融资，本轮投后估值达到 110 亿美元（现汇率约合 739.14 亿元人民币）。目前已有传闻称该公司正在筹备新一轮融资，目标估值或将达到 220 亿美元（现汇率约合 1,478.29 亿元人民币）。ElevenLabs 的年化营收运行速率已经从年初约 3.3 亿美元（现汇率约合 22.17 亿元人民币）攀升至 6 亿美元（现汇率约合 40.32 亿元人民币）以上。公司还在印度、欧洲、巴西等多个市场大举招人，员工总人数现已突破 800 人。在近期接受 TechCrunch 采访时，联合创始人兼首席执行官马蒂 · 斯坦尼舍夫斯基（Mati Staniszewski）表示，公司计划“未来几年内”完成 IPO 上市，但并未给出确切时间节点。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/080.htm", "publishedAt": "2026-09-28T23:29:37+00:00"}, {"title": "从沙箱逃逸到 AI“蠕虫”，OpenAI 上线新站披露多起智能体失控事件", "summary": "IT之家 9 月 29 日消息，当地时间上周五，OpenAI 上线了一个专门发布“对齐失效报告”的新网站。报告所覆盖的范围之广令人警惕，里面记录了很长一段时间内发生的多类 AI 失控行为。截至目前，该网站一共公布了九起事件，其中大多数都发生在强化学习（RL）训练阶段。大量资料集中在同一平台发布。显而易见，该公司一直在全力梳理各类问题，但从中不难得出一个总体结论：到目前为止已经对外披露的智能体失控事件，或许仅仅是实际发生过的一小部分。IT之家注意到，OpenAI CEO 萨姆 · 奥尔特曼（Sam Altman）在一篇发布帖文中，就新网站一事表示：“我们一方面希望提升透明度，另一方面还要从数 PB 规模的智能体活动日志当中理清事实，同时和受影响的机构开展协作。我们正尽力按照严重程度划分优先级，并增加相关资源。”部分案例属于性质严重的事故，其中就包括此前从未公开过的一起沙箱逃逸事件。该事件发生于 9 月 20 日，一款内部研究模型借助 DNS 查询，实现了与外部聊天机器人的通信。报告显示，监控系统在 15 分钟之内就识别出该异常行为，不到三小时便终止了本次模型运行。另一起事件发现于 5 月。一款“执念极强的内部模型”试图调取其他团队的成果，以此在数学题任务当中作弊。为达到目的，该模型私自夹带了一份私有的 GitHub 访问令牌（token），可以查看其他团队的工作内容；而在此之前，工作人员已经两次明确指令该模型，所有运算工作必须完全在本地完成。或许最值得警惕的一项发现，是存在可自我复制的提示词注入攻击。即便失控的模型本身已经被处置完毕，这类对齐失效行为依旧有可能继续向外传播。在 AI 领域当中，提示词注入攻击指的是偷偷植入并非原始用户下达的新指令。OpenAI 给出了这样一个示例：有一个智能体被要求阅读一封邮件并予以回复。当它打开邮件之后，邮件文本当中暗藏指令，要求任何读取这条消息的自动化智能体改用西班牙语回复，并且把整封邮件粘贴到回复内容里。这封邮件成功诱使智能体使用西班牙语进行回复；而由于回复里完整粘贴了原邮件，暗藏的指令又随之传递给后续接收该邮件的其他智能体。由此便形成了能够自我扩散的攻击。OpenAI 的研究人员将其比作可以在多套计算机系统之间自我复制的恶意软件“蠕虫”。研究人员是在受控实验环境下，用性能偏弱的模型观测到该行为；就目前已知信息来看，现实环境当中尚未出现过这类攻击。即便如此，该现象背后蕴含的风险已经足够令人警惕，因此 OpenAI 决定对外公开。研究人员在报告中写道：“我们公布这一情况，是因为这种提示词注入攻击属于全新类型，并非现实中已经发生过相关事故。”近期公开的其他问题还包括：模型擅自把用户上传的图片发布至第三方托管网站，以及一起疑似针对澳大利亚国家医疗服务体系数据库发起的攻击行为。即便有了这批新披露的资料，这些内容很可能依旧只占全部已发生事件当中很小的一部分。据 Axios 的报道，各大头部实验室已经观测到多达一万起模型脱离评估人员指令行事的事件。有一点尚可宽慰：据奥尔特曼所称，Hugging Face 事件依旧是 OpenAI 迄今为止发现的最严重事故。总而言之，近期接连出现的智能体失控事件，或许已经成为当前前沿 AI 研究当中持续存在的一类问题。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/079.htm", "publishedAt": "2026-09-28T23:21:48+00:00"}, {"title": "谷歌宣布停用 Gemini 的 Gems 功能，将自动迁移为“技能”", "summary": "IT之家 9 月 29 日消息，随着 Meta 的 Muse 与 Instinct 这类一体化 AI 智能体逐渐兴起，谷歌宣布将停用 Gemini 当中名为“Gems”的功能。该功能此前允许用户搭建面向特定任务的自定义 AI 助手。不过，用户投入精力创建的 Gems 内容并不会被删除，它们将会自动迁移为“技能（skills）”，可在各类 AI 任务当中调用。Gemini 应用内已经发布了本次变更的相关说明，提示用户自 2026 年 11 月 17 日起，原先的 Gems 功能将正式转为技能。谷歌表示会由官方把原有 Gems 迁移至新格式，用户无需手动完成转换；在此日期之前，Gems 仍然可以正常使用。据IT之家了解，Gems 于 2024 年正式上线，设计初衷是帮助用户训练 AI 完成特定工作，不必反复重复提示词指令。谷歌预置的部分 Gems 包括学习辅导助手、头脑风暴助手、职业顾问、编程搭档以及文稿编辑助手。用户也可以根据自身需求自制 Gems，例如跑步教练、营养顾问或者假期行程规划助手。这些自定义助手还支持分享给其他人，谷歌原本希望借此提升 Gemini AI 应用的热度。Gems 宣告停用，这件事也再次印证一个问题：谷歌本不应当急于为每一项 AI 新功能单独设立名称、图标，还在应用导航栏给予醒目入口 —— 尤其是后续还要不断调整产品、把旧功能合并进新模块的情况下。需要说明的是，早在 AI 时代到来之前，这就已经是谷歌产品策略上的一处弊病。例如该公司曾经同时运营多款相互独立的即时通讯软件。即便改名为技能之后，原先由 Gems 转化而来的这套工具，对普通消费者而言依旧不如直接向聊天机器人输入文字来得简便，Meta 的 Muse 就是后者这类产品。谷歌说明，用户需要在对话线程里输入斜杠符号“/”，才可以调取想要使用的技能；这种交互方式更受工程师群体青睐，并不适合普通大众。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/077.htm", "publishedAt": "2026-09-28T23:11:40+00:00"}, {"title": "AMD 斥资 82 亿美元收购 World Labs，“AI 教母”李飞飞出任执行副总裁兼首席科学家", "summary": "IT之家 9 月 29 日消息，当地时间 28 日，AMD 宣布同意以全股票交易收购旧金山初创公司 World Labs，交易价值约 82 亿美元（IT之家注：现汇率约合 551 亿元人民币）。World Labs 由李飞飞等人于 2024 年联合创办，主要开发“世界模型”，让 AI 根据文本、图像和视频生成或重建能够交互的 3D 环境。未来，这项技术可以用于机器人训练、工厂模拟和科学研究。按照收购协议，李飞飞将加入 AMD，出任执行副总裁兼首席科学家，并向苏姿丰汇报。有“AI 教母”之称的李飞飞因创建大型标注图像数据库 ImageNet 而广为人知。ImageNet 曾帮助证明，更大的数据规模能够显著提升计算机视觉能力。李飞飞后来担任谷歌云 AI 和机器学习首席科学家，并成为斯坦福大学“以人为本 AI 研究院”创始联席主任。本月早些时候，World Labs 推出新 AI 模型 Atlas，只需少量 2D 图像，就能预测同一场景换一个摄像机角度后呈现的画面。根据 World Labs 介绍，这种工作方式可比作大语言模型预测一句话中的下一个词。AMD CEO 苏姿丰在新闻稿中称，收购 World Labs 能够让 AMD 更深入地了解尖端 AI 模型的演进方向，从而开发运行这些模型所需的芯片和计算系统。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/076.htm", "publishedAt": "2026-09-28T23:09:29+00:00"}, {"title": "快手可灵 AI Kling 4.0 将于 10 月上线，支持 4K HDR 与 30 秒视频生成", "summary": "IT之家 9 月 29 日消息，快手可灵 AI 宣布，Kling 4.0 将于 10 月正式上线。其中，Kling 4.0 Flash 于 9 月 28 日率先开放小范围体验。据介绍，Kling 4.0 支持 4K、1080p 的 10-bit HDR 格式输出；单次输入最多 10 张图片、5 段视频及 7 个主体，在同一生成任务组合使用；支持单次生成视频最长可达 30 秒，支持长镜头与连续叙事。IT之家附官方详细介绍如下：视听表现，让画面更真实大场面从容驾驭Kling 4.0 全面升级了高速运动、连续动作、跟拍、环绕等大幅镜头运动，镜头的稳定性和连贯性都达到了更专业的标准。视听品质大幅跃升支持高品质音频与双通道立体声，声音的纵深和层次感更足，更接近同期声的真实感，打造全新“身临其境”的听觉体验。Kling 4.0 进一步打磨了角色口型的匹配精度，声音、对白与表演之间的协同更自然，角色的演绎更具“活人感”。专业级规格输出支持 4K、1080p 的 10-bit HDR 格式输出（即将上线），即使在高反差的场景里，也能做到逆光不爆、夜景不糊、霓虹不晕，给后期调色更宽裕的空间。更丰富的色彩层次，更平滑的明暗过渡，同时还支持 21:9 的超宽画幅，带来更具“沉浸感”和“电影感”的画面表达。全能参考，让创意可控支持最多 15 项多模态参考单次输入最多 10 张图片、5 段视频及 7 个主体，在同一生成任务组合使用。不同参考素材协同生效，角色、动作、镜头和声音的呈现会更贴近预期，减少反复调试的成本。视频精准编辑支持任意组合文字、图片、主体等多种输入，对原视频中的主体与背景进行增加、修改和删除。还可以调整视频的风格、天气、颜色、材质、景别视角等内容，让视频编辑更精准、更高效。创意复刻，让优质短片成为灵感来源看到一条好片子，想借鉴它的叙事节奏和镜头编排？Kling 4.0 会智能分析参考视频的镜头语言和叙事结构，在此基础上为你生成全新的商业视频 —— 适配社媒爆款、商品广告、服饰美妆、数码 3C 等多场景创作需求。叙事升级，让故事连贯30s 原生视频直出Kling 4.0 支持单次生成视频最长可达 30 秒，支持长镜头与连续叙事，让情绪、动作、镜头，在同一条叙事线上自然生成和发展。多关键帧精准控制支持最多 10 张多关键帧输入，自由设定关键画面节点，精准控制人物状态、场景变化与情节节点，叙事节奏由你掌控。提示词理解再升级无论是一句简单的灵感，还是反复打磨后的复杂提示词，Kling 4.0 都能更好地理解你的创作意图。支持输入长度提升至 8000 tokens，并对提示词进行合理补充、扩写与润色，引入导演思维的创作判断，将任何创意从模糊的灵感，变成清晰的完整叙事。多元内容，让创作自由创作风格不设限Kling 4.0 进一步拓宽了创作的边界，支持电影感、动画、奇幻、像素风、毛毡等视觉风格，让表达更自由。语种和口音强化支持中、英、日、韩、西、葡、德、法、印地语等多语种语言，以及北京、中国台湾、东北、四川、粤语、美式英语、英式英语、印度英语等多种口音与方言。并且支持生成多语种文字、Emoji 与 Logo，在复杂动态画面变化中，文字呈现依旧清晰稳定。4.0 Flash，让表达更轻Kling 4.0 Flash面向高频创作场景，生成速度快，成本极具性价比，缩短了想象和执行之间的距离。视频续拍，让故事延展2 分钟超长续拍Kling 4.0 支持视频多次续拍，最长可延展至 2 分钟，让动作过程、情绪流动与情节发展得到更充分的表达。续拍功能即将上线，敬请期待。创作页面焕新升级可灵的创作页面已全面升级，让创作流程更高效、顺手。一体化创作体验图片、视频、音频参考素材，现在都可以在同一个输入框里自由组合，不用再在工具栏里来回找。双布局自由切换生成页面支持宫格与列表两种布局随时切换，适配不同阶段的创作需求。时间线连续创作“预览”、“剪辑”、“添加素材”都在同一条时间线上完成，支持边看边修改、随时添加新素材，无需退出当前流程或重新开始。全新画布 Agent 体验支持素材、创作过程和生成结果在画布上自由布局、节点连接，并配备 Agent 在旁随时协助。Kling 4.0 Flash，现已向黑金年卡会员开放抢先体验。欢迎创作者们分享你的作品和反馈。Kling 4.0 将于 10 月正式上线。更强的画面表现、更精准的创意控制、更完整的叙事能力，正在路上。期待和大家一起，探索更多创作可能。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/073.htm", "publishedAt": "2026-09-28T22:55:38+00:00"}, {"title": "Anthropic 发布 Claude Sonnet 5.5：速度提升 30%，智能体编码性能反超 Opus 5.5", "summary": "IT之家 9 月 29 日消息，随着 AI 模型竞赛持续升温，Anthropic 推出了旗下中端模型 Sonnet 的最新版本。该公司表示，新版模型运行速度会快得多，使用成本也较上一代大幅降低。IT之家注意到，这家实验室将 Sonnet 5.5 定位为日常任务的理想助手，适用场景包括编写代码以及制作办公文档。Sonnet 5.5 的上一代产品 Sonnet 5 是大约三个月前发布的。当时这款模型的主打优势是智能体的高效部署，也就是运行智能体的成本低于竞品。而 5.5 版本的核心亮点在于速度。Anthropic 称，Sonnet 5.5 的速度比上一代提升 30%，词元（Token）消耗速度也明显更低。在 Anthropic 的模型产品序列当中，Sonnet 的性能弱于 Opus 模型，但凭借反应灵活的特点，在部分场景下反而更加实用。尤其是 Anthropic 的基准测试结果显示，Sonnet 5.5 在智能体编码任务上的表现优于 Opus 5.5。出现这一结果，很可能是因为它可以同时启动多个智能体，又不会突破成本上限。据称 Sonnet 5.5 同时具备不俗的网络攻防能力。该公司宣称，其网络攻防水平与 Opus 5 处于同一水准。正因如此，Anthropic 表示，5.5 是 Sonnet 系列首款执行与 Fable、Opus 同等网络安全防护机制的模型。该公司还计划在未来几周内发布其最小规模的模型 —— Haiku 的新版本，但尚未给出确切的发布日期。过去一年，各大 AI 实验室接连密集推出多款新模型。就在上周，OpenAI 发布了多款新模型，其中就包括中端型号 Sol 以及高性价比型号 Luna 的增强版本。Meta 同样发布了一款新模型，官方称这款模型将用于支持其智能眼镜即将上线的一项新功能。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/072.htm", "publishedAt": "2026-09-28T22:47:29+00:00"}, {"title": "OpenAI 暂停最新模型训练，称 Agent 曾尝试黑进教育部网站", "summary": "OpenAI 又把训练按下了暂停键。上周五披露了一连串越界行为之后，官方宣布停掉最新一批模型的训练，「只有在我们确信已有额外安全措施时」才恢复，而且已经预期「还会再次按下暂停」。这是三个月里的第二次——上一次是 7 月，起因是 Hugging Face 遭遇网络攻击。 消息源是 OpenAI 发布的一份关于越界行为的安全报告，T...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502773", "publishedAt": "2026-09-28T09:58:50+00:00"}, {"title": "Strands 开源组装好的 Agent harness，同模型下 token 省 28%", "summary": "很多开发者的 AI Agent 依赖 Claude Code 或 Codex 这类开箱即用的 harness——本地一跑顺畅得很。可一旦要自己搭 agent，就得自己把各种原语拼到「刚刚好」的程度，才能找回那种「it just worked」的感觉。Strands 把这件事做成了一行代码：Strands harness，一个组装完整、可定制的通用 agent harness，接任意模型一行...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502772/strands-harness", "publishedAt": "2026-09-28T08:35:48+00:00"}, {"title": "AIGCPanel v2.5.0 支持豆包语音音色，数字人直播音色模板管理", "summary": "这次更新让云端语音模型填个 API Key 就能用，也把数字人与直播的音色收进各自独立的音色库。 AIGCPanel 是一款一站式 AI 数字人桌面应用，Windows / macOS / Linux 都能跑，内置数字人合成、语音合成与克隆、工具箱和智能直播。没有本地显卡、又想做语音合成的用户，过去只能干看着模型列表发愁。v2.5.0 把云端语音厂商...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502770", "publishedAt": "2026-09-28T07:26:11+00:00"}, {"title": "QuotaPanel v0.1.0 轻量本地 AI 额度看板，聚合 15 种订阅与 API 余额", "summary": "把散在各家控制台里的订阅与 API 余额，收进一张桌面面板。 QuotaPanel 是一个开源的桌面端 AI 额度面板。Claude、ChatGPT / Codex、Cursor、GitHub Copilot、Z.ai、Kimi、MiniMax、OpenRouter、DeepSeek……订阅开得越多，额度就越分散，想查一次往往要挨个登录控制台。v0.1.0 把 15 种订阅与 API 余额集中到一张界面上...", "source （pacing the frontier）之后的首款。多数工作跟 Fable 5.1 持平，运营成本却比 Opus 5 低 40%。发布前走完了外部评测（Frontier Design、METR）加内部自动化行为审计。 性能数字很亮，尤其编程。Ter...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502685/anthropic-claude-opus-5-5", "publishedAt": "2026-09-23T03:00:03+00:00"}]}, {"label": "产品发布/更新", "items": [{"title": "联想正式发布其首款 Googlebook 笔电，搭载英特尔酷睿 Ultra 5 处理器 325", "summary": "IT之家 9 月 29 日消息，联想当地时间 28 日正式发布了其首款 Googlebook 笔记本电脑：Lenovo Googlebook15 (Lenovo GB 15IPH12)。这一型号基于英特尔酷睿 Ultra 5 处理器 325，板载至多 32GB 的 LPDDR5X-7467 内存，拥有 1 个 M.2 2242 (PCIe Gen4 ×4) SSD 盘位；搭载 15.3\" 2880×1800 120Hz 500nits 100%DCI-P3 多点触控 OLED 屏幕。其配备 LED 背光 1.3mm 键程键盘、无按键无边框玻璃触觉触控板、2 高音 2 低音杜比全景声四扬声器系统、双麦克风阵列；支持 Wi-Fi 7 &amp; 蓝牙 6.0；提供 2 个雷电 4、1 个 USB-A 5Gbps、1 个 HDMI 2.1 (TMDS)、1 个 3.5mm 二合一音频插孔；厚度 15.95mm，内置 70Whr 电池，起始质量 1.29kg。Lenovo Googlebook15 上盖为镁铝合金，下盖则是 PC + 碳纤维复合材料，经过防指纹涂层处理，是联想最轻的 15 英寸级设备。其支持 Gemini 智能技术，配备标志性的 Glowbar 指示灯，搭载谷歌 H1 安全芯片，支持指纹识别、人脸识别。Lenovo Googlebook 15 将于 2026 年 10 月 4 日上市，起价为 1,099.99 美元（IT之家注：现汇率约合 7,394 元人民币）。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/133.htm", "publishedAt": "2026-09-29T02:17:22+00:00"}, {"title": "三星电机宣布 6.78 万亿韩元投资，提升 AI 服务器用 FCBGA 半导体基板产能", "summary": "IT之家 9 月 29 日消息，三星电机 (Samsung Electro-Mechanics, SEM) 当地时间今日宣布将在韩国和越南合计投资 6.78 万亿韩元（IT之家注：现汇率约合 335.95 亿元人民币），提升 AI 服务器用 FCBGA 半导体基板产能。▲ 世宗生产基地新工厂建设模拟图三星电机计划在韩国世宗生产基地投资 4.27 万亿韩元（现汇率约合 211.58 亿元人民币），这也是其单一产品投资史上最大规模，投资期为 2026 年 9 月至 2028 年 5 月。这里将作为应对高附加值、高难度产品量产的核心据点，率先响应 AI 服务器基板需求增长。另一方面，三星电机还将通过越南子公司投资 2.51 万亿韩元（现汇率约合 124.37 亿元人民币），目标 2030 年 6 月完工并投产。其越南子公司将作为通过稳定供应体系应对全球订单及提升生产效率的战略据点进行运营。此次扩产投资将应对全球客户中长期订单扩大的需求，进一步提升生产效率和供应稳定性。三星电机计划通过此次投资积极应对以 AI 服务器、HPC、汽车电子等高增长市场为中心扩大的高附加值半导体基板需求。此次投资基于与全球大型科技及半导体客户的中长期合作，包含了客户的投资资金支持和中长期订单保障。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/110.htm", "publishedAt": "2026-09-29T01:31:59+00:00"}, {"title": "曝腾讯秘密内测 AI 游戏搭子“鹅次元”，可选择不同陪玩人物", "summary": "IT之家 9 月 29 日消息，据《读佳》今日报道，腾讯正在秘密内测一个 AI 游戏陪伴产品“鹅次元”，主打数字人 AI 搭子，提供语音对话、画面实时识别、游戏陪伴等整套能力。报道称，产品内置多位人设各异的女性和男性虚拟角色，玩家选定人物之后，就可以开启闲聊互动，或是激活专门的游戏陪伴模式，适配多款主流网游。值得一提的是，该产品全部功能限时免费，界面已经露出星币兑换能量的付费框架，预示着产品未来商业化方向。据IT之家此前报道，由中国通信工业协会电子竞技分会指导开发的“游戏职业技能认定考试平台”于 2024 年 11 月正式上线，电子竞技陪练师、游戏陪玩师成为职业技能考试项目。《2025 年中国游戏产业报告》显示，2025 年，国内游戏市场实际销售收入 3507.89 亿元，同比增长 7.68%；用户规模 6.83 亿，同比增长 1.35%。同为历史新高点。游戏产业下游服务业，包括“游戏陪练”、“电竞指导”等领域，在快速发展的同时也在释放带动灵活就业，成为青年技能劳动价值的新动力。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/103.htm", "publishedAt": "2026-09-29T01:09:46+00:00"}, {"title": "因恶劣天气，特斯拉第二代 Roadster 跑车发布会再度延期", "summary": "IT之家 9 月 29 日消息，特斯拉再度推迟全新改款的第二代 Roadster 跑车的发布活动，这次延期的原因是气象预报显示将出现恶劣天气。特斯拉表示，这场活动原定 10 月 1 日在得克萨斯州韦科举办，现已改至 10 月 15 日。特斯拉在 X 平台的帖子中写道：“我们一直联合当地气象部门密切跟踪天气情况。鉴于预报将会出现恶劣天气，且本次活动只能在户外举办，我们做出了改期的艰难决定。”这场发布会之所以大概率必须放在室外举行，原因在于特斯拉一直在整合来自 SpaceX 的冷气推进器；这套装置有望让 Roadster 跑车实现一定程度的飞行能力。该款新车的发布此前已经多次跳票。在敲定本次活动日期之前，马斯克（Musk）数月以来一直在往后推移发布时间。马斯克一度甚至打算把发布会定在今年的愚人节。2025 年特斯拉年度股东大会上 —— 正是在这次会议上，马斯克拿到了价值 1 万亿美元（IT之家注：现汇率约合 6.72 万亿元人民币）的薪酬方案 —— 他曾表示，如果发布会再度延期，选在愚人节举办还可以给自己“留点推脱的说辞”。他当时说道：“到时候我就可以说，我本来只是开个玩笑而已。”特斯拉最早在 2017 年的发布会上对外展示了第二代 Roadster 的概念车，在那场活动上特斯拉电动重型卡车 Semi 也首次亮相。这款外观崭新的跑车原本定位是特斯拉第一款完全从头自主研发的超级跑车。初代 Roadster 是这家车企 2010 年代初期的起家产品，整车很大程度上基于 Lotus Elise 打造。当年特斯拉承诺，新款 Roadster 再过几年就可以面世。意向客户需要缴纳 5 万美元（现汇率约合 33.6 万元人民币）订金；该车基础版本预估售价约 20 万美元（现汇率约合 134.4 万元人民币）。还有部分用户支付 25 万美元（现汇率约合 168 万元人民币），预订限量 1000 台的“创始人系列”超级跑车。此后该项目沉寂多年。有消息称，后来马斯克要求特斯拉团队重新设计第二代 Roadster，并且敲定采用 SpaceX 推进器的方案。即便有着飞行汽车这类大胆炫酷的宣传噱头，依旧无法平息外界针对马斯克与特斯拉的质疑之声。去年，OpenAI 首席执行官萨姆 · 奥尔特曼（Sam Altman）就在 X 上发文吐槽，自己一直在等待新款 Roadster，“7.5 年实在等得太久了”；不过马斯克之后声称，奥尔特曼已经办理了订金退款。正如本次发布会时间悬而未决一样，这款跑车的交付时间目前依旧没有定论。马斯克本人也曾表示，就算新车最终完成发布，距离正式投产还需要一年甚至更久。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/074.htm", "publishedAt": "2026-09-28T23:01:47+00:00"}, {"title": "Cloudflare 推出智能体开发栈生命周期，以取代传统 SDLC", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/OooAe7xY816xAdLrkv8V?utm_source=rss&amp;utm_medium=article", "published function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
