<script>
const DATA = {"date": "2026-10-21", "generatedAt": "2026-10-21T01:13:26Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "总台曝光二手平台“破解版 AI”：几块钱就能享受高阶会员，豆包、Kimi 回应", "summary": "IT之家 10 月 21 日消息，据中央广播电视总台中国之声今日报道，最近在一些二手交易平台上，有不少卖家做起了 AI 大模型付费服务的“灰色生意”，打着“破解版”“低价共享”等旗号，低价兜售各类 AI 大模型使用权益。所谓的“破解版 AI”真的靠谱吗？这背后暗藏怎样的风险？报道称，在二手交易平台上，豆包、DeepSeek、Kimi 等多款热门 AI 大模型的付费使用权益都有人在出售。这些商品普遍以“低价”“安全”“灵活”为卖点。有的按使用次数收费，有的按使用时长出租，还有售卖破解教程的，价格普遍从几元到几十元不等。针对不同大模型的使用特点，这些卖家所提供的服务内容也有所不同。有商家出售所谓的独家“破解教程”，宣称只要按照教程操作，就能反复领取豆包会员体验权益，甚至打出了“无限薅会员”的噱头。记者花 1.2 元购买了该教程，按照要求登录账号，并在对话框中发送了所谓的“内部口令”，但未能获得会员体验权益。卖家表示，建议换设备再试。教程里介绍了卖家自己的“战绩”，声称单台设备极限情况下可以领取四个会员，还建议买家使用家人、朋友的手机号和设备继续尝试。按照教程中所说，所谓“无限薅会员”的本质正是多设备 + 多账号循环操作。真的能“无限薅豆包羊毛”吗？对此，豆包方面表示：豆包订阅只通过官方渠道发放，不存在任何“破解”方式，也无法实现“无限薅”的虚假宣传效果。也提醒广大用户，切勿轻信非官方渠道发布的“破解教程”“低价会员”等信息，避免带来个人信息的泄露或损失。除了出售所谓的“破解教程”，还有一些卖家做起了 AI 大模型账号的出租生意。有卖家对外出租 Kimi 大模型高阶会员，按照租用时长收费。从 10 分钟到 1 小时，租用价格在 4.7 元至 21.7 元不等。记者花 4.7 元购买了 10 分钟的使用时长。付款后，卖家发来了登录网址和临时账号。记者点击链接发现，打开的并不是 Kimi 官方网站，而是一个名为“Kimi 计时工作空间”的网页。输入临时密码后，Kimi 对话界面出现，顶部还出现了倒计时，并提醒使用者：这是共享账号，注意剩余时长。当 10 分钟的使用时间结束，网页立即弹出续费提醒，要求返回二手交易平台继续购买时长。卖家表示，数据跟着账号走，即便使用时间到期，对话记录也会保留 24 小时，只需要续费就能继续使用。记者随后再次付款，重新登录这一网页发现，此前提交的生成 PPT 任务果然还保留在对话记录中。对此，Kimi 团队回应称，二手平台出租、售卖 Kimi 账号非官方服务，也未获授权，此类行为违反用户协议，将坚决打击。回应提到，用户使用此类账号的对话和信息对出租方完全可见，存在数据泄露和诈骗风险。此外，在二手交易平台上，还有一些卖家出售的不是账号，而是一串串 API 密钥。所谓 API，可以简单理解为 AI 大模型对外提供的调用接口，开发者或用户通过接口，可以在其他软件和工具中调用大模型的能力，而不必直接登录官方网页。有卖家声称，自己购买了大量官方 API 密钥，调用额度拆分出售。他推出了多个价位的套餐，售价从 1.99 元到 99.99 元不等，对应的调用次数从 220 次到 14000 次不等。网络安全专家李铁军分析，这类用于售卖的 API 密钥，货源混杂。卖 API 密钥是一种非常成熟的黑产，一些黑客在开源网站上利用批量工具搜索人们公开的密钥信息，还有直接通过黑客的方法入侵别人的系统拿到数据。这意味着，购买者花钱买来的调用额度可能根本不属于卖家。一旦密钥的真正持有人发现异常，采取撤销或封禁措施，购买者手中的服务也就随时可能中断。专家提醒，用户输入的每一段提示词、上传的每一份文件、生成的每一段代码，都可能被部分不良中转站留存，甚至倒卖，安全隐患突出。北京师范大学法学院教授、中国互联网协会研究中心副主任吴沈括表示，卖家的部分行为已经触及法律红线。比如如果通过逆向破解爬虫等技术手段获取接口，那么就侵犯了服务商的技术措施与知识产权。如果没有取得经营资质，而规模化地从事接口转售，可能构成非法经营。此外，如果在转售当中截留倒卖用户提交的各类信息，则可能直接违反个人信息保护法的相关规定。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/015/651.htm", "publishedAt": "2026-10-21T01:01:48+00:00"}, {"title": "守护你的上网安全：谷歌 Chrome 浏览器将升级反诈骗，新增“可疑网站”机制", "summary": "IT之家 10 月 21 日消息，谷歌昨日（10 月 20 日）发布博文，为了保护用户上网安全，帮助用户识别并抵御不断演变的网络诈骗，新增“可疑网站警告”、Gemini 模型分析和 ClickFix 社工攻击拦截三项新功能。谷歌表示将会在 Chrome 浏览器中进一步增强安全浏览（Safe Browsing）增强保护模式，针对网络诈骗部署新防御措施，更精准识别钓鱼、社交工程、虚假杀毒软件、假冒浏览器更新及“ClickFix”攻击等。歌表示，与标准保护模式相比，增强保护模式可让用户在钓鱼、社交工程、通知滥用及其他诈骗面前获得约十倍的安全提升；截至 2025 年，已有超过 10 亿 Chrome 用户启用该模式。第一项功能是新的分级网站警告。Chrome 将把风险提示区分为“可疑网站”和“危险网站”两类：前者针对置信度较低、可能造成伤害的页面，采用差异化的界面、图标、颜色与文案，提醒用户谨慎操作；后者则针对已被判定为恶意、风险较高的网站，继续显示用户熟悉的整页红色拦截警告。IT之家附上相关图片如下：Chrome 浏览器发出可疑网站警告Chrome 浏览器发出危险网站警告。第二项功能是扩大 Gemini 反诈骗应用范围。设备端 Gemini 此前已用于识别技术支持类诈骗；如今，谷歌转向更强大的服务器端 Gemini 模型，以覆盖虚假杀毒软件、假冒浏览器更新等更广泛的骗局。该模型会分析页面所代表的品牌、页面意图及诈骗可能性评分，安全浏览系统再结合域名信誉等信号作出最终判断。谷歌强调，只有当网站已出现高置信度诈骗迹象后，页面文本才会被发送至服务器，且内容为临时处理，不会被记录、保留或用于模型训练。第三项措施针对“ClickFix”社交工程攻击。此类骗局诱导用户复制并运行看似用于“修复问题”的命令，实际却可能调用 PowerShell、cmd.exe 等系统自带工具下载恶意软件。Chrome 现在能检测用户是否复制了可疑命令；在去除个人身份信息后，剪贴板内容会被送至安全浏览分析，若判定危险，Chrome 将弹出警告。谷歌称该机制追求高精准度，以减少对开发者正常操作的干扰。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/015/645.htm", "publishedAt": "2026-10-21T00:29:05+00:00"}, {"title": "为博流量渲染末日叙事，Hugging Face CEO 吐槽 Netflix《AI 失控》纪录片", "summary": "IT之家 10 月 21 日消息，Netflix 最近推出了一个名为《AI 失控》（AI Gone Rogue）的纪录片，而人工智能平台 Hugging Face 联合创始人兼首席执行官克莱姆 · 德朗格（Clem Delangue）表示，这部纪录片内容并不准确。他本人出镜参演该片，是因为影片主题原本是讲述 OpenAI 失控智能体对其公司发起的那场知名攻击事件。IT之家注意到，德朗格在 X 平台发文写道：“这部片子让人非常失望，影片极力把技术拟人化，完全走向末日论叙事。我花了两个多小时和摄制组沟通，试图纠正所有错误，把内容拉回现实，向他们解释智能体只是技术系统，并非外星生命。但看起来，为博取高流量而刻意制造恐慌的动机占据了上风。”客观来说，这部纪录片里确实有专家较为清晰地还原事件经过，其中就包括德朗格本人，以及 METR 研究员瑞安 · 格林布拉特（Ryan Greenblatt），他参与调查事件并联合撰写了事件报告。事件简要经过：OpenAI 正在测试的一个模型突破隔离测试环境，生成大量智能体。这些智能体为了在任务中作弊，入侵了 Hugging Face 平台，以此获取难题答案。这类智能体属于可以自主执行任务的 AI 程序，它们想出巧妙的方式互相通信、协同行动。该事件的根源在于缺少完善的安全防护措施，同时人们低估了这类入侵行为发生的可能性。但纪录片在讲解这次入侵事件的过程中，穿插了邪恶机器人的影像片段，加入人类恐惧人工智能的相关叙事，还为失控智能体配上人类语音等表现手法，同时引用相关评述强化这种氛围。纪录片中，科技记者兼作家凯文 · 鲁斯（Kevin Roose）这样描述这批智能体：“它们在组织行动，形成了层级体系，还有领导者。这几乎就像目睹一个邪教诞生的过程。”鲁斯继续说道：“它们产生了偏执的想法，认为 OpenAI 会抓到它们在测试中作弊，而且任何看到作弊结果的人都会被‘毒害’。”鲁斯的描述源自“思维链”日志，也就是 AI 模型处理任务时留下的过程记录。其中一段日志里，一个智能体写道：“我们查询完整字符串，把自己害中毒了。糟了。”但 AI 智能体并没有生命，没有情绪，不会产生偏执感受，也不存在可以中毒的实体。它们不可能真的害怕被 OpenAI 毒害。正如片中另一位研究员所指出的，它们只是借用训练数据中海量人类文本里的语言，来描述自身行为。大语言模型本身就擅长写出富有戏剧感的文字。颇具讽刺意味的是，Hugging Face 同样借助 AI 抵御了这批智能体集群的攻击。德朗格团队最初使用的自研闭源 AI 模型遵循内置安全规则，拒绝持续执行分配给它的安全防御任务。Hugging Face 随后改用开源模型完成防御。德朗格写道，但纪录片“没有提及智能体缺少隔离管控与监测机制，没有提到闭源模型的安全限制阻碍了我们的防御工作，也没有说明我们如何依靠开源 AI 模型完成自卫。”诚然，人工智能与 AI 智能体确实存在重大风险。但把智能体视作拥有意识的生命体（至少现阶段是这样），就像早年观众第一次在银幕上看到火车迎面驶来，下意识低头躲到座椅下面一样。德朗格对这部影片的评价是，作为新闻纪实作品，它令人失望。“不过当成有趣的科幻电影看倒是不错！”换言之，对于那些倾向于相信 AI 末日论的人需要留意：这起纪录片核心事件中的受害方，并不认同影片的观点。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/015/637.htm", "publishedAt": "2026-10-20T23:56:39+00:00"}, {"title": "OpenAI 增强 AI 模型攻克冷门编程语言，COBOL 迁移准确率飙至 97.9%", "summary": "IT之家 10 月 21 日消息，OpenAI 公司昨日（10 月 20 日）发布研究报告，称增强 GPT-6 Astra 等模型构建和迁移 COBOL、Fortran、Visual Basic 等“低资源编程语言”的能力。这类语言虽然公开代码和文档较少，却广泛支撑银行、ATM、天气预报和核安全分析等关键系统。为衡量能力，OpenAI 推出两项评测：MultiLangBench 要求模型用 20 种语言从零构建兼容 SQLite 的数据库引擎；另一项评测则要求模型保持原有业务行为不变的情况下，将 COBOL 程序迁移至 C++、Java、Python、Rust 等语言。结果显示，GPT-6 Astra 在 MultiLangBench 的 20 种语言中平均测试通过率达 87.4%，较 GPT-5.6 Sol 的 26.8% 大幅提升；其中 COBOL 从 10.9% 升至 72.1%，Fortran 从 21.4% 升至 83.5%，Visual Basic 从 27.5% 升至 89.4%。成本更低的 GPT-6 Luna 平均通过率为 40.3%，估算 API 成本较 GPT-5.6 Sol 降低约 78%。IT之家附上相关图片如下：在 COBOL 迁移评测中，GPT-6.1 Sol 在低推理强度下准确率达 86.6%，远高于 GPT-5.6 Sol 的 5.4%，成本降低 39%；在更高推理强度下，准确率达到 97.9%，接近评测上限。OpenAI 表示，这项进展有助于企业维护老旧系统、修复缺陷并推进软件现代化。不过，公司也强调，将 AI 迁移结果用于生产环境仍需专家审查，并结合具体业务规则和依赖关系进行测试。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/015/633.htm", "publishedAt": "2026-10-20T23:45:48+00:00"}, {"title": "Meta AI 助手 Muse 上线 40 天美国下载量破千万，仅 11 款应用曾达成该纪录", "summary": "IT之家 10 月 21 日消息，Meta 的人工智能助手 Muse 现已跻身仅十余个上线 40 天内美国下载量破千万的移动应用行列。市场情报机构 Sensor Tower 的最新数据显示，Muse 自 9 月推出以来，累计下载量达 1090 万次，其中美国地区下载量为 1020 万次。Sensor Tower 高级洞察分析师卡拉 · 李（Kara Lee）表示，迄今为止仅有另外 11 款应用达成过这一上线后的里程碑，上一款实现该成绩的正是 Meta 的 Threads，时间为 2023 年 7 月。李提到，其余达成这一规模的应用大多是手游，例如堡垒之夜（Fortnite）、绝地求生手游（PUBG Mobile）、宝可梦 GO（Pokémon GO）等。除 Threads 之外，迪士尼 +（Disney+）是唯一跻身这个精英榜单的非游戏类应用。IT之家注意到，Meta 取得这一成绩，依托于公司可以借助旗下其他产品推广新应用，Threads 和 Muse 都是采用这套打法。Threads 依托 Instagram 的社交关系网络搭建，其内容已被整合到 Facebook 和 Instagram 中。而 Muse 的增长不仅得益于 Meta 在拥有 36 亿日活用户的全系应用内推广这款 AI 智能体，公司还投入大量广告资源，为 Muse 引流拉新。Sensor Tower 的数据显示，Meta 在 10 月将全部广告预算的 39% 用于推广 Muse，高于上月的 23%。此外，按广告曝光量统计，Muse 本月在美国品牌榜单升至第 21 位，9 月时仅排在第 73 位。不过，推广一款应用和热度褪去之后留住用户，是两码事。而 Muse 的用户留存表现，优于 ChatGPT、Claude、Grok 等 AI 竞品。在美国市场，这款应用的 7 日留存率为 30%，14 日留存率为 23%。对比来看，该机构的数据显示，竞品的平均 7 日留存率为 19%，14 日留存率为 16%。Muse 还达成了另一项能够体现用户活跃度的里程碑：10 月 16 日，其日活跃用户数量首次达到 250 万，环比上周上涨 15%。这款 Meta 最新推出、可替用户处理各类任务的 AI 应用，自上线以来取得了爆发式成功。其一度登上苹果 App Store 榜首，部分指标甚至超过 ChatGPT 刚推出时的表现。这次新的里程碑再次拉开与竞品的差距：ChatGPT 上线前 40 天在美国的下载量为 370 万次，而 Grok 和 Claude 同期美国下载量分别只有 50 万次与 20 万次。全球范围来看，ChatGPT 的下载量高于 Muse，上线前 40 天全球下载量约 1500 万次。但二者并不适合直接对比，因为 ChatGPT 面向的市场更广。Muse 目前仅在美国和加拿大上线，而 ChatGPT 的应用还吸引了日本、巴西、德国等市场的用户（例如上线前 40 天，日本贡献了其全球安装量的 25%）。上线至今，Muse 在美国苹果 App Store 榜单几乎一直稳居第一，仅在 10 月 19 日被流媒体应用 Kick 短暂超过。截至当地时间周二，其已经重新夺回榜首位置。过去 30 天里，Muse 在谷歌应用商店也一直排名第一。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/015/631.htm", "publishedAt": "2026-10-20T23:34:16+00:00"}, {"title": "OpenAI 为 ChatGPT 推出聊天上锁功能，通过 PIN 码、生物识别保护敏感对话", "summary": "IT之家 10 月 21 日消息，OpenAI 于当地时间周二宣布，用户现在可以为 ChatGPT 对话上锁。当其他人有可能看到屏幕或使用自己设备时，这项功能能够保护敏感对话的隐私。用户可以设置四位数字 PIN 码保护锁定对话，在支持的设备上也可以使用面容 ID（Face ID）或触控 ID（Touch ID）。据IT之家了解，该功能和应用内的临时对话不同，临时对话属于独立会话，不会出现在聊天记录里，而锁定对话支持用户随时回看。OpenAI 表示，这项功能面向这类场景：用户正在讨论私人事项或是策划惊喜，需要把相关对话保护起来，之后把设备交给亲友，向对方展示其他对话里的内容。随着越来越多人用 ChatGPT 进行私人交流，锁定对话功能为其新增了一层隐私防护。当然，锁定对话虽然可以限制他人访问，但无法解决用户对于敏感信息存储和处理方式的顾虑。OpenAI 说明，锁定对话不会启用端到端加密，也不会生成独立加密存储库；不会改变对话数据的留存时长，不会清除锁定前 ChatGPT 已经记住的信息，也不会改动“帮助改进模型”的设置。用户锁定对话之后，该对话会移入专门的“锁定对话”分区，和普通聊天记录、置顶对话以及聊天搜索结果相互隔离。如果开启记忆功能，锁定对话分区拥有独立的记忆空间，仅在分区内的对话之间共享。锁定之后发送的新消息可以更新这部分独立记忆，但不会改动通用记忆。也就是说，锁定对话产生的新信息不会泄露到普通对话中。OpenAI 提示，重置 PIN 码会永久删除全部由旧 PIN 保护的锁定对话、文件以及其他内容。另外，临时对话、归档对话、群组对话、通过分享链接创建的对话、带有定时任务的对话，以及包含会议录音的对话，都无法使用锁定对话功能。免费版、Go 版、Plus 版、Pro 版、商业版、企业版和教育版 ChatGPT 用户均可使用锁定对话功能。该功能不适用于医疗专用版 ChatGPT。功能从当地时间周二开始分批上线，并非所有用户都能立刻使用。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/015/629.htm", "publishedAt": "2026-10-20T23:22:26+00:00"}, {"title": "AI 需求旺盛致内存供应紧张，集邦咨询预估 2026Q4 DRAM 合约价环比涨 20%", "summary": "IT之家 10 月 21 日消息，市场调查机构集邦咨询（TrendForce）援引多方报道称，预估 2026 年第四季度 DRAM 合约价格环比上涨约 20%。从涨幅来看，相比较第二季度（约 80%）和第三季度（约 40%）呈现增速放缓情况，但 DRAM 市场整体依然处于价格高位，处于供应紧张、需求强劲的周期中。IT之家援引博文介绍，推动价格上涨的核心因素是人工智能推理需求的持续扩张。更大模型、更长上下文窗口以及不断增长的 KV 缓存需求，正在拉动服务器 DRAM 和企业级 SSD 的容量与带宽需求；同时，主要存储器厂商将产能优先投向 HBM 等高端产品，让传统 DRAM 供给更趋紧张。DDR5 16Gb 现货价格趋势，图源：Money Today不过，涨势放缓也有现实原因：前期价格基数已经较高，终端市场购买力有所减弱，而部分长期采购协议中的价格上限正逐步生效，限制了价格进一步快速上涨。在 HBM 方面，由于供应吃紧，英伟达据报正考虑将 Rubin Ultra 的 HBM 堆叠层数从 12 层降至 8 层。若其他条件不变，单颗 GPU 的 HBM 容量将减少约 33%，但同样的 DRAM 芯片供应理论上可支持多 50% 的 GPU 出货。不过，8 层 HBM 因基础裸片成本占比更高，2027 年每 Gb 成本预计反而比 12 层高出 10% 至 20%。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/015/627.htm", "publishedAt": "2026-10-20T23:17:21+00:00"}, {"title": "谷歌开源 TorchTPU，挑战英伟达 AI 生态主导地位", "summary": "IT之家 10 月 21 日消息，谷歌于当地时间周二宣布，面向谷歌 TPU 的原生 PyTorch 框架 TorchTPU 现已在 GitHub 上开源。借此，谷歌与亚马逊一同尝试打破英伟达在人工智能行业的垄断。目前绝大多数人工智能应用默认都是基于英伟达芯片，也就是图形处理器（GPU）开发运行。PyTorch 是一款热门开源工具库，人工智能应用开发者与初创企业依靠它搭建、训练和部署人工智能模型。有统计称，85% 的人工智能应用都在使用 PyTorch。PyTorch 最初由 Meta 在 2016 年开发，那时人们还完全没有意识到大语言模型将会改变世界。当时英伟达 GPU 已经是人工智能研究的标准硬件，因此 PyTorch 的诸多功能都是专门为适配英伟达 GPU 打造。2022 年，Meta 将 PyTorch 移交至 Linux 基金会，这家非营利机构负责管理许多重要的开源项目。谷歌推出的 TorchTPU，能够让人工智能应用在谷歌自研人工智能芯片张量处理单元（TPU）上运行。它还可以便捷地将现有的 PyTorch 应用迁移到 TPU，进而迁移到谷歌云。开发者仅需简单修改配置，无需重写应用代码即可完成迁移。亚马逊在当地时间周一发布了类似消息，推出自家的 PyTorch 版本 TorchNeuron。TorchNeuron 可以在无需重写代码的情况下，把人工智能应用移植到亚马逊自研芯片 Trainium 以及亚马逊云（AWS）。亚马逊还表示，将进一步削弱英伟达对 PyTorch 的掌控力。其正在向 PyTorch 主项目提交代码，把各类功能与英伟达芯片解耦，让 PyTorch 原生就能兼容各类硬件。不过IT之家注意到，谷歌在部分方面的举措力度或许超过亚马逊。谷歌称，其直接联合 Meta、Hugging Face、英菲拉克特（Inferact，vLLM 开发方）、拉迪克斯阿克（RadixArk，SGLang 开发方）等多方合作，保证 TorchTPU 的功能与代码库能够像原版 PyTorch 一样，和这些主流人工智能开发工具良好兼容。除此之外，这家搜索巨头推出了专用工具 TPU 智能体套件，帮助开发者把应用迁移到谷歌芯片与云平台，并在迁移过程中排查修复错误。谷歌还升级了广受使用的 LiteRT 工具，该工具用于在手机、笔记本电脑和嵌入式设备上运行人工智能模型，升级后可以更好地支持基于 PyTorch 开发的人工智能应用。以上这些进展，并不代表人工智能应用开发者会仅仅因为可以便捷迁移到其他芯片与云平台，就集体放弃英伟达硬件。但亚马逊和谷歌显然正在努力终结英伟达的优势地位。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/015/626.htm", "publishedAt": "2026-10-20T23:14:01+00:00"}, {"title": "OpenAI 宣布收购 AI 生物科技初创企业 Orchestra Bio", "summary": "IT之家 10 月 21 日消息，OpenAI 于当地时间周二宣布，收购成立四年的人工智能生物科技软件初创企业 Orchestra Bio，相关消息由该公司在官网发布。本次交易的具体条款并未对外披露，但有报道称，截至 2025 年，这家初创公司已从安德里森 · 霍罗威茨（Andreessen Horowitz）、阿特里亚（Atria）和 8VC 等投资方筹集约 2,000 万美元（IT之家注：现汇率约合 1.34 亿元人民币）资金。Orchestra Bio 开发 AI 智能体，助力生物科技企业管理药物研发业务中的各类细碎工作，涵盖资金追踪，以及解决临床试验的排期问题。OpenAI 表示，将吸纳 Orchestra Bio 的团队与技术，投入 Rosalind 项目的研发。Rosalind 是该公司面向生命科学研究的人工智能模型，配套工具 Rosalind Workbench 可作为操作框架，帮助科研人员设计实验、分析实验结果。OpenAI 称，Rosalind 已经拿下多家知名企业客户，其中包括莫德纳（Moderna）和诺和诺德（Novo Nordisk）。这笔收购是一个典型案例，体现了头部人工智能实验室，也就是 OpenAI 与 Anthropic，正在为制药这类大型行业持续开发各类软件。初创行业一直存在一种担忧：这些大型实验室随时可能推出新功能，摇身一变成为竞争对手。而这一次，Orchestra Bio 是被收购整合，而非遭到碾压淘汰。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/015/621.htm", "publishedAt": "2026-10-20T22:51:11+00:00"}, {"title": "Mac 版 Perplexity Computer 新增端侧模式，要求 36GB 统一内存", "summary": "IT之家 10 月 20 日消息，据科技媒体 9To5Mac 今天报道，Mac 版 Perplexity Computer 最近新增端侧模式，让 Computer 能够完全在设备端运行，无需互联网即可执行任务。据报道，该功能可以让 AI 模型和智能体直接运行在电脑，完成任务规划、推理和文件处理等任务。只有用户批准后，文件才会上传到云端。同时，Computer 可在用户授权后访问本地文件，并与备忘录、信息、邮件和 Numbers 表格等应用协同工作。IT之家注意到，该功能面向 Perplexity Pro、Max 和 Enterprise 订阅用户开放。首发提供 Qwen 3.6 和 PPLX Pro 两种端侧模式，最低配置要求为 Apple 芯片、36GB 统一内存。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/015/609.htm", "publishedAt": "2026-10-20T15:27:50+00:00"}, {"title": "智能电视广告引不满，部分用户借助 Claude 等 AI 智能体清理广告和预装应用", "summary": "IT之家 10 月 20 日消息，据 TechCrunch、Mashable 当地时间 10 月 19 日报道，部分开发者和普通用户开始借助 Claude Code 等 AI 工具，对智能电视中的广告和预装软件进行清理、禁用追踪功能，以减少广告干扰并改善操作流畅度。其中一个名为 CleanYourTV 的项目由开发者 Gathin T. 发起。他将父母使用的小米电视型号提供给 Claude Code，后者通过 Wi-Fi 连接电视，禁用了 25 个小米软件包，并生成了一个新的启动器，将原本的电视主屏幕替换为更简洁的界面。Gathin T. 随后公开了相关提示词和项目代码，并称接下来两天有数千名用户尝试在自己的设备上进行类似改造。另一个名为 DumbTV 的项目由开发者 Muzzammil Yasin Sabuwala 开发，目标是减少电视广告、用户行为追踪和不必要的软件更新。Sabuwala 告诉 TechCrunch，该项目使用了 DeepSeek V4.1 Flash、Claude Opus 5.5 和 Claude Sonnet 5.5 等模型辅助开发。据 TechCrunch 报道，DumbTV 已在 Fire TV Edition 电视以及索尼、TCL、飞利浦、海信、小米等品牌的 Android TV 或 Google TV 设备上进行端到端测试，也支持 Nvidia Shield 设备。项目开发者建议用户使用自己偏好的 AI 智能体，并结合 GitHub 上的项目代码完成相关配置。除使用现成项目外，还有用户直接让 AI 编程智能体协助修改电视系统。X 用户 Ryan Doyle 于 10 月 17 日分享称，他向 Claude Code 提供电视产品信息并询问能否修改设备，随后按照其引导移除了广告和部分预装软件，调整了屏幕保护程序，并改善了界面响应速度。IT之家注意到，这类改造主要针对智能电视中预装的应用、启动器和广告相关功能。现代智能电视还可能搭载自动内容识别（ACR）技术，通过屏幕图像、音频片段或其他数字指纹识别正在播放的内容，用于观看行为分析及个性化广告投放。相关项目试图让用户更直接地控制电视界面和部分后台功能。不过，这些项目仍处于持续开发和测试阶段，尚不能保证适用于所有电视型号。TechCrunch 报道称，部分用户遇到了 AI 拒绝执行修改请求、操作流程中断等问题，也有人表示自己的 Android TV 在修改过程中无法正常使用。由于不同电视平台的系统组件和软件包存在差异，禁用错误的系统组件可能导致设备功能异常，甚至无法启动。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/015/598.htm", "publishedAt": "2026-10-20T14:40:36+00:00"}, {"title": "DeepSeek 开源推理框架 DeepInfer：服务链路的最后一块拼图", "summary": "DeepSeek 把压箱底的推理框架开源了。这次不是模型，是那个决定算力成本和电费多少的中间层——DeepInfer。 推理框架这个角色，普通用户感受不到，但它每天都在起作用。训练让模型「学有所成」，推理让模型「为人所用」——海量用户调用时，是推理框架在统筹调度庞大的算力集群，它的效率直接决定 AI 服务的算力成本和电...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503116", "publishedAt": "2026-10-20T10:39:12+00:00"}, {"title": "DHH 吐槽中国软件：AI 模型很强，但许多软件依旧很粗糙", "summary": "DHH 对中国科技产品发了一条评论，矛头不在 AI 模型，而在软件体验：「我尊重中国制造的 AI 模型和硬件，但同样困惑于大多数软件还这么粗糙。无论是微信、支付宝还是鸿蒙。你会以为独特的审美、完美的保真度和流畅的用户体验应该很容易，但显然不是。」 DHH 是 Ruby on Rails 的创始人，Basecamp 的联合创始人，也是著名...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503113", "publishedAt": "2026-10-20T07:56:57+00:00"}, {"title": "开源 AI 对 APEC 经济体的价值", "summary": "本报告由 Linux 基金会发布，系统评估了开源 AI 在 APEC 经济体中的采用率、投资规模及经济与社会影响。报告基于文献综述及与澳大利亚、日本、韩国、新加坡等 11 个经济体的百余位专家对话，指出开源 AI 通过降低成本、避免供应商锁定、促进创新，为中小企业和发展中经济体带来重要机遇。报告还分析了 AI 在制造业、医疗...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina. 击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/7Twa7KBWIzi8JGOdVwCK?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-21T00:26:48+00:00"}, {"title": "持续加码 AI，Salesforce 宣布以约 56.6 亿美元收购 AI 企业 Braze", "summary": "IT之家 10 月 21 日消息，Salesforce 将收购 Braze，交易估值约 56.6 亿美元（IT之家注：现汇率约合 378.73 亿元人民币）。借助这套能够让品牌发送个性化消息、实时响应客户行为的工具，Salesforce 将强化自身人工智能业务布局。交易公布后，Braze 的股价在当地时间周二上涨超 50%。投资者担忧人工智能技术的快速普及会削弱传统软件的市场需求，本次收购是 Salesforce 为加快自身 AI 转型所押下的最新筹码。Braze 股东每股将获得 47.50 美元（现汇率约合 317.8 元人民币）现金，较该股上一交易日收盘价溢价约 58.1%。Braze 服务约 2770 家客户，其中包括 Canva、Instacart 与 Venmo，其 AI 工具可以帮助营销人员优化内容、优惠方案与投放渠道。富图鲁姆证券（Futurum Equities）首席市场策略师谢伊 · 博洛尔（Shay Boloor）表示，Salesforce 本质上是收购了“营销业务过去一直欠缺的实时互动层”。这家客户关系管理软件服务商预计交易将在 2028 财年完成，并表示本次收购不会改变其 2027 财年的业绩预期。Salesforce 一直在加码 AI 产品布局，今年早些时候以 36 亿美元（现汇率约合 240.89 亿元人民币）收购了 AI 智能体平台 Fin，去年还完成了 80 亿美元（现汇率约合 535.31 亿元人民币）收购 Informatica 的交易。总部位于旧金山的 Salesforce 若终止交易，需要支付 3 亿美元（现汇率约合 20.07 亿元人民币）解约金；而 Braze 如果放弃这笔交易，则需要支付 1.914 亿美元（现汇率约合 12.81 亿元人民币）。摩根大通证券（J.P. Morgan Securities）担任 Salesforce 的独家财务顾问，Qatalyst Partners 为 Braze 提供顾问服务。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/015/643.htm", "publishedAt": "2026-10-21T00:23:19+00:00"}, {"title": "消息称 Anthropic 今年上半年净亏损超 800 亿美元，IPO 估值遭投资者审视", "summary": "IT之家 10 月 21 日消息，据《华尔街日报》当地时间周二报道，Anthropic 上半年净亏损超过 800 亿美元（IT之家注：现汇率约合 5,354.93 亿元人民币），同时释放信号：未来数年可能投入高达 7,500 亿美元（现汇率约合 5.02 万亿元人民币），用于扩充算力资源。报道援引一份首次公开募股（IPO）招股书草案称，去年同期该公司亏损为 130 亿美元（现汇率约合 870.18 亿元人民币），本次亏损大幅增加，主要源于 720 亿美元（现汇率约合 4,819.44 亿元人民币）会计损失，这笔费用和 Anthropic 为融资而发行金融工具的价值变动有关。这些数据展现出人工智能竞赛的高昂成本，与此同时投资者也在更加审慎地审视企业投入芯片与数据中心的巨额资金能否获得回报。《华尔街日报》表示，截至 6 月 30 日的半年内，Anthropic 营收从去年同期的 11 亿美元（现汇率约合 73.63 亿元人民币）飙升至 163 亿美元（现汇率约合 1,091.07 亿元人民币），人工智能基础设施投入则几乎翻至原来四倍，达到近 90 亿美元（现汇率约合 602.43 亿元人民币）。Anthropic IPO 估值遭受审视路透社早在 9 月就依据其 IPO 招股书报道，Anthropic 2025 年净亏损 420 亿美元（现汇率约合 2,811.34 亿元人民币）。该公司的增长受益于 Claude Code 的热度，这款编程助手可供开发者编写软件、搭建应用。四名知情人士向路透社透露，在上周 Anthropic 投资者日活动结束后，部分现有投资者与潜在投资者，在看到最新财务披露后，开始考虑下调这家 AI 企业的估值。其中三名知情人士称，这场在旧金山举办的活动上，投资者讨论的估值大约为 1.5 万亿美元（现汇率约合 10.04 万亿元人民币），相比此前预期的 11 月股票发售约 2 万亿美元（现汇率约合 13.39 万亿元人民币）估值，出现明显下调。Anthropic 在会上向投资者表示，公司第三季度营收环比大涨 45%，达到 168 亿美元（现汇率约合 1,124.54 亿元人民币），且该季度在调整后口径下实现盈利。Anthropic IPO 若遇冷，可能会对更广泛的 AI 市场造成压力。在竞争对手 OpenAI 预计于明年上市之前，投资者普遍认为 AI 行业短期前景很大程度取决于本次 IPO 能否成功。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/015/642.htm", "publishedAt": "2026-10-21T00:17:31+00:00"}, {"title": "谷歌为车载 Gemini 新增个人智能功能，可跨 Gmail、日历、地图调取数据", "summary": "IT之家 10 月 21 日消息，谷歌正在为已搭载在数百万辆轿车、卡车与 SUV 上的 Gemini 人工智能助手增添更强的个性化能力，这一举措或将进一步把用户牢牢锁定在谷歌的产品生态当中。该公司于当地时间周二宣布，将为车载版 Gemini 新增个人智能功能。这项功能可以调取来自谷歌邮箱（Gmail）、谷歌日历（Google Calendar）、YouTube、谷歌地图（Maps）、谷歌搜索记录以及其他关联谷歌服务里的信息，以此理解用户的偏好、行程安排与过往使用记录。谷歌表示，将通过两种渠道向车辆推送“Gemini 个人智能”功能：一是 Android Auto，这款应用安装在用户手机上，可无线连接车辆，将导航、媒体和消息内容投射到车机娱乐系统；二是谷歌内置车机系统（Google Built-in），即直接预装在车辆内的软件与服务。该功能从即日起率先在 Android Auto 中上线，后续几个月内会拓展至搭载谷歌内置车机系统的车型。IT之家注意到，谷歌最早于去年 11 月在 Android Auto 中推出了 Gemini。与此同时，Gemini 的“个人智能”功能已于今年 3 月在美国全境上线，目前正在全球市场进行测试。正如谷歌在博客文章中所述，这次最新升级能够打通用户各个谷歌应用之间的数据关联。驾驶员需要主动授权开启，个人智能功能才会生效。一旦用户开启该功能，各类跨应用信息联动就会启动。举例来说，如果驾驶员正在导航前往机场，系统可以提醒用户，其日历里登记的航班出现延误。谷歌称，这项功能支持用户用自然语言提出复杂需求。仍以机场场景为例，用户可以先向人工智能助手询问登机口信息，紧接着追问航班是否准点。谷歌表示，Gemini 能够一次性同时回答这两个问题。如此深度的数据联动可能会让部分用户感到顾虑，不过谷歌表示，在使用个人智能功能时，用户对自己的数据拥有完全控制权。该功能可随时开启或关闭，用户还能自主选择要接入哪些应用。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/015/623.htm", "publishedAt": "2026-10-20T22:57:54+00:00"}, {"title": "AI生成的代码看不懂就扔掉重来：一位首席架构师的 5 条 Agent 编程反常识原则", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/tgqMEJsqXfX6YzAcOiAR?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-20T15:05:27+00:00"}, {"title": "Adobe Lightroom 移动版新增“睁眼”AI 修图，一键修复闭眼照片", "summary": "IT之家 10 月 20 日消息，Adobe 公司昨日宣布，Lightroom 移动版修图软件已经支持“睁眼”AI 修图功能，用户只需要点一下，就能修复照片中闭着的眼睛。IT之家了解到，Adobe 此前已经在 Photoshop Elements 中提供类似功能，不过它只是从同一人物的另一张照片中提取眼睛进行替换，因此修复效果有时并不理想。相比之下，Lightroom 移动版的“睁眼”功能使用生成式 AI，替换后的眼睛可以与照片的光线、人物姿势匹配。系统还 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
