tra 7 355 处理器，提供 16GB 或 32GB LPDDR5X RAM 内存配置，并搭配 256GB 或 512GB PCIe NVMe 固态硬盘。同时该机搭载 Titan C2 安全芯片，支持 Wi-Fi 7 和蓝牙 5.4", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/988/074.htm", "publishedAt": "2026-08-10T22:56:40+00:00"}, {"title": "iOS 27 代码显示苹果正开发 Apple Reference Image 认证功能，用于检测 iPhone 拍摄照片真实性", "summary": "IT之家 8 月 11 日消息，外媒 9to5Mac 在挖掘苹果 iOS 27 开发者预览版 Beta 5 代码信息时发现苹果正在开发一项名为 Apple Reference Image 的新功能，用于认证 iPhone 拍摄照片的来源真实性。随着生成式 AI 图像技术快速发展，AI 生成或经过深度修改的图片越来越容易伪装成真实照片，过去需要专业摄影后期人员花费数小时的图像修改，如今只需输入简单提示词，几秒钟内即可生成高度逼真的内容。因此这推动了苹果开发 Apple Reference Image 图像认证功能，帮助用户直接判断图像是否来自真实 iPhone 拍摄。据介绍，Apple Reference Image 并不会让苹果直接访问用户的原始照片。系统会将 iPhone 拍摄的照片发送至云端安全环境进行认证。认证完成后，苹果会为该照片分配一个唯一 ID。如果苹果检测到某个摄像头传感器可能遭到篡改或被破坏，系统可能会撤销此前与该传感器相关的认证记录。相应功能还包含一系列隐私保护机制。例如经过认证的照片可以分享给其他用户，而接收方的苹果设备能够在本地检查照片是否仍然保持认证状态，无需向苹果透露用户正在查看哪些图片。同时，据分享方式不同（例如 AirDrop、信息等），传输的数据内容可能有所区别，同时也会根据照片类型变化，例如原始照片、编辑后照片或已认证版本。如果用户选择共享“所有照片数据”，传输内容可能还包括唯一硬件标识符以及与照片相关的未裁剪原始视频片段。此外，苹果还计划为 USB 传输加入“Transfer with Provenance（携带来源信息传输）”选项。启用后，通过 USB 传输至 Mac 或 PC 的已认证照片将保留来源数据，方便用户查看设备上图片原始来源。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/988/068.htm", "publishedAt": "2026-08-10T22:33:41+00:00"}, {"title": "当 human in the loop 变成“闭着眼睛点确认”，企业Agent 安全还能靠谁？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/5qWsLD6JV8N2zDgGuhK9?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-10T17:29:12+00:00"}, {"title": "微软正式发布 Agent Framework Harness 和 Hosted Agents", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/aDEJegvNSKwvue2JZ0yI?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-10T17:14:00+00:00"}, {"title": "马斯克超级芯片工厂 TeraFab 将用天然气供电，而非特斯拉太阳能", "summary": "IT之家 8 月 10 日消息，据外媒 Electrek 今天（10 日）报道，SpaceX 确认将依靠自建天然气电厂和“超大型电池阵列”为超级工厂 Terafab 供电，特斯拉太阳能则完全不在计划之中。特斯拉和 SpaceX 上周正式确认 Terafab 项目。工厂位于得州格赖姆斯县，距离休斯敦西北约一小时车程，两家公司宣称其将成为全球最大的芯片制造工厂。第一阶段投资 168 亿美元（IT之家注：现汇率约合 1,134.39 亿元人民币），按照规划，每年生产的芯片将支撑超过 1 太瓦的算力，主要供应 SpaceX 和 xAI 数据中心，未来还将用于特斯拉 Optimus 人形机器人和 Cybercab。即使特斯拉共同参与项目，供电方案也完全没有提到自家的太阳能业务。今年 7 月，马斯克以约 10 亿美元（现汇率约合 67.52 亿元人民币）买下燃气轮机企业 APR Energy，一举获得超过 1 吉瓦的燃气轮机发电能力。SpaceX 也单独承诺投入超过 28 亿美元（现汇率约合 189.06 亿元人民币）采购燃气轮机，为数据中心供电。然而另一边，特斯拉自己就销售太阳能产品、Powerwall 和 Megapack，xAI 今年早些时候还花费 2.69 亿美元（现汇率约合 18.16 亿元人民币）采购特斯拉 Megapack。今年 6 月，特斯拉又与 Sunrun 推出规模达 16 吉瓦的虚拟电厂，并直接把数据中心作为目标客户。换言之，特斯拉正在公开推销“太阳能 + 储能”解决 AI 用电需求，但马斯克旗下最庞大的新项目却依旧选择天然气。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/988/039.htm", "publishedAt": "2026-08-10T14:03:32+00:00"}, {"title": "因使用 AI 维护办案记录，英国一高级警探接受调查", "summary": "IT之家 8 月 10 日消息，据英国《金融时报》今天（10 日）报道，英国德比郡警察局一名高级警探因涉嫌违规使用 AI，正接受严重不当行为调查。英国警察行为独立办公室（IOPC）透露，德比郡警察局内部审查发现，该警员使用 AI 的方式可能违反警队规定，因此主动将案件交由 IOPC 调查。《金融时报》援引知情人士的话称，涉事警员是一名刑侦总督察，被指利用 AI 维护案件决策记录。办案过程中，高级调查人员会通过决策记录说明每一步调查行动的理由。案件进入庭审后，辩方律师也可能获准查阅这些记录，检查调查决策是否存在问题。两个月前，德比郡警察局刚刚对另一名刑警展开刑事调查，后者被指利用 AI 在多起案件中“制作证据材料”。据IT之家了解，今年 6 月，德比郡警察局曾对另一名刑警启动一项无关的刑事调查。该警员涉嫌利用 AI 在多起案件中“制作证据材料”，目前已被调离一线岗位，等待调查结果。警方怀疑该警员涉嫌妨碍司法公正，但目前尚未实施逮捕。不仅如此，英国格洛斯特郡警察局一名工作人员因“多次”绕过安全限制，使用 AI 聊天机器人处理警务工作，最终遭到解雇。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/988/037.htm", "publishedAt": "2026-08-10T13:47:00+00:00"}, {"title": "消息称微软 Maia 300 AI 芯片最快下月亮相，目标 2027 年交付至少 30 万颗", "summary": "IT之家 8 月 10 日消息，据外媒 The Information 今日援引知情人士消息，微软计划今年秋季推出全新 Maia 300 人工智能芯片，最快可能 9 月亮相。IT之家从原报道了解到，微软最初于 2023 年 11 月推出 Maia 系列 AI 芯片，支持大规模云 AI 服务等用途，但该公司的芯片在大规模部署方面落后于竞争对手。同时，微软正在与台积电进行洽谈，为 Maia 300 争取产能，目标 2027 年交付至少 30 万颗芯片。微软希望通过自研 AI 芯片减少英伟达芯片依赖，并提升自身 AI 领域竞争力。此外，微软希望 Maia 芯片的产量大幅提升，并希望 Anthropic 等企业采用自家芯片产品。截止发稿，微软暂未回应置评请求。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/988/036.htm", "publishedAt": "2026-08-10T13:43:01+00:00"}, {"title": "奕境 X9 鸿蒙座舱 HarmonySpace 6 首秀，支持“哈蒙蒙”AI 陪伴机器人", "summary": "IT之家 8 月 10 日消息，奕境 X9 汽车鸿蒙座舱 HarmonySpace6 全球首秀活动今日举行，新车主打家庭旗舰大六座 SUV 定位，支持华为乾崑智驾 ADS 5。据介绍，这款汽车的座舱将搭载双 17.2 英寸蝶羽双联屏，采用柔光技术，支持多屏流转。小艺智能助手升级 MoLA 2.0 架构，支持多轮连续对话，可识别模糊口语。同时  "技巧与观点", "items": [{"title": "苹果 iOS / iPadOS 27 Beta 5 更新汇总：Safari 等启用新图标，Siri AI 支持定制语音等", "summary": "IT之家 8 月 11 日消息，科技媒体 MacRumors 今天（8 月 11 日）发布博文，介绍下了在 iOS / iPadOS 27 Beta 5 更新中，苹果公司带来的新功能 / 新特性。IT之家援引博文内容，汇总摘要如下：一、为 Siri、Safari、设置等带来全新图标在 iOS 27 Beta 5 更新中，苹果调整 Safari、Siri 应用、“设置”、“遥控器”（Remote）、“App Store”和“预览”（Preview）的图标。从对比图片来看，Safari 的图标颜色更亮，呈蓝色，指南针线条和箭头也更加细致；Siri 的图标则更接近 Siri 激活后显示的 Siri 气泡。App Store 的图标更加透明，可以更清晰地看到组成字母“A”的每一条线条；“设置”图标也采用了更高的透明度；“预览”图标采用了彩色背景上的放大镜效果。遥控器图标的细节也更加丰富，并且背景由黑色改为了灰色。二、Siri AI 语音定制在 iOS 27 Beta 5 更新中，苹果公司扩展 Siri AI 的语音自定义功能，用户可以调整所有 7 种美国语音和 4 种英国语音的语速和表现力。Siri AI 语音定制是在设备上完成的，因此该功能仅限于 iPhone 17 Pro、iPhone 17 Pro Max 或 iPhone Air。三、联系人用户创建的联系人关联公司后，公司名称将显示在联系人列表的联系人姓名下方以及搜索结果中。这样，无需点击联系人卡片即可轻松查看联系人的更多信息。四、创建通行证苹果在美国以外的地区，推出 Apple Wallet 的“创建通行证”功能。五、启动画面苹果为照片、钱包和音乐应用添加了启动画面，解释了 iOS 27 的新功能。六、搜索和提问苹果调整搜索和提问（Search and Ask）的动画效果，建议界面会与搜索栏同时出现。搜索界面现在在搜索结果底部增加了一个“搜索网络”选项。七、搜索结果中的应用用户可以决定搜索结果是否显示应用，以及显示多少个应用。用户可以关闭应用结果显示，也可以设置显示四个或八个应用。此外，还有一个开关可以控制是否显示应用快捷方式。八、控制中心连接到 Wi-Fi 后，控制中心不再显示蜂窝网络连接信息。九、5G苹果在西班牙推出 5G+ 显示。十、系统更新用户在“设置”&gt;“常规”&gt;“关于”中查看系统版本后，它会显示上次更新的安装时间。十一、时钟时钟应用的闹钟和计时器部分使用了更粗的字体。十二、液态玻璃相比较此前 Beta 版本，液态玻璃的“最清晰”滑块设置后画面更加清晰。十三、邮件现在邮件应用中新增了“个性化智能回复”功能的开关。该功能默认关闭，可以在“设置”应用的“邮件”部分中开启。十四、电池“设置”应用的“电池”部分新增提示，如果蜂窝网络连接不良，可能导致设备耗电加快并会发出通知。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/988/076.htm", "publishedAt": "2026-08-10T23:05:50+00:00"}, {"title": "苹果 macOS 27.0 开发者预览版 Beta 5 发布", "summary": "IT之家 8 月 11 日消息，苹果今日向 Mac 电脑用户推送了 macOS 27.0 开发者预览版 Beta 5 更新（内部版本号：26A5406e），本次更新距离上次发布 Beta / RC 间隔 21 天。 如何升级 iOS / iPadOS / watchOS / macOS 开发版和公测版？• 公开测试版：需注册&nbsp;Apple Beta 版软件计划，之后通过【设置】【通用】【软件更新】【Beta 版更新】来升级；• 开发预览版：需登录注册苹果开发者计划，之后通过【设置】【通用】【软件更新】来升级。附苹果 iOS 历史固件下载大全：《苹果 iOS / iPadOS / macOS 固件下载 / 更新日志大全》本次 Beta 5 版本主要以 Bug 修复为主。作为参考，macOS 27 Golden Gate 主要带来了全新的 Siri 应用，同时搭载升级后的 Siri AI 功能。新系统还加入了基于人工智能的快捷指令（Shortcuts）应用，用户可以通过自然语言提示直接创建快捷指令。此外，Safari 也新增了基于提示词的扩展创建工具，让用户能够通过描述需求生成浏览器扩展。除了 AI 功能升级外，macOS 27 Golden Gate 还加入了一系列以 Golden Gate 为主题的新壁纸和屏幕保护程序，为系统界面带来新的视觉元素。在界面设计方面，macOS 27 Golden Gate 回归了固定圆角半径的窗口和应用设计。此前，macOS 26 曾调整窗口圆角机制，根据每个窗口或应用菜单栏内容动态改变圆角大小，而新版系统取消了这一变化，重新采用统一的圆角设计。附 macOS 27 发布历史：2026-07-21：macOS 27.0 Beta 4 (26A5388g)2026-07-07：macOS 27.0 Beta 3 (26A5378j)2026-06-23：macOS 27.0 Beta 2 (26A5368g)2026-06-09：macOS 27 Beta (26A5353q)IT之家小伙伴如果找到更多新内容，可以在投稿或评论区中提出你的发现 ~[微笑]", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/988/062.htm", "publishedAt": "2026-08-10T17:58:11+00:00"}, {"title": "为什么要开发又一个 AI 浏览器插件", "summary": "说实话，每次有人问我\"市面上已经有 Monica、Sider、Copilot for Chrome 这些 AI 浏览器插件了，你为什么还要再做一个\"，我都觉得这个问题问得好。 因为我自己也是从用户变成开发者的。 现有产品的天花板 我用过不少 AI 浏览器插件。刚开始觉得都挺好——选中一段文字，弹出解释；写邮件时帮你润色；看英文网页给你翻译摘...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/490838", "publishedAt": "2026-08-08T11:56:38+00:00"}, {"title": "解读｜OpenAI 音箱：果味设计，但比苹果多走一步", "summary": "甜甜圈真好吃#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1674363?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-08-07T04:00:19+00:00"}]}]};

const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
