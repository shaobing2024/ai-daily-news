me": "IT之家", "sourceUrl": "https://www.ithome.com/1/019/272.htm", "publishedAt": "2026-10-28T23:08:07+00:00"}, {"title": "Anthropic 致信加州州长纽森：法院应有权阻止严重风险 AI 模型", "summary": "IT之家 10 月 29 日消息，据路透社今天（29 日）凌晨报道，Anthropic 在本月 15 日致美国加州州长加文 · 纽森的信中建议，政府应有权向法院申请禁令，阻止对公众构成“严重风险”的 AI 模型发布。这与 Anthropic 此前提出的监管建议一致。Anthropic 自身也曾受到政府限制。今年 6 月，美国政府以国家安全为由，要求 Anthropic 立即限制外国用户访问具备网络安全能力的 Mythos 5 和 Fable 5 模型。然而随后，美国商务部又宣布撤销该命令。今年 9 月，纽森召集 AI 专家小组，研究制定 AI 安全要求的建议，Anthropic 随后提交了上述意见。OpenAI 也于 10 月 20 日向纽森提出了一系列建议。Anthropic 还在信中指出，如果 AI 模型的行为失去控制，要求开发者设置能够关闭整个模型的“紧急关闭开关”，反而可能让政府官员产生“虚假的安全感”。相比之下，Anthropic 更倾向于关闭出现问题的 AI 智能体、暂停特定客户的模型使用权限等采取针对性措施，认为这些办法更有效。今年 9 月，美国两党参议员曾讨论过一项法案，计划授权政府禁止发布部分被认定存在安全隐患的 AI 模型，同时允许企业向联邦法院提出异议。不久后，国会进入选举前休会期，议员没有继续推进该提案。美国众议院议员还在 7 月提出《AI 紧急关闭法案》，计划赋予政府官员下令关闭 AI 模型的权力，适用对象为危及人类生命或经济的模型。据IT之家了解，Anthropic 正筹备赴美上市。如果成功上市，有望成为近年来最具影响力的 IPO 之一，并可能改变基准指数的构成、投资者资金流向以及美股市场的整体投资叙事。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/019/271.htm", "publishedAt": "2026-10-28T23:05:14+00:00"}, {"title": "核心广告业务增长放缓，谷歌将 AI 搜索广告推向国际市场", "summary": "IT之家 10 月 29 日消息，据 TechCrunch 报道，谷歌正将旗下 AI 搜索体验中的广告业务推向国际市场，押注生成式 AI（Generative AI）即使在其核心搜索广告业务增长放缓的情况下，也能开启新的收入机会。Alphabet 在周三举行的第三季度财报电话会议上宣布了这一消息。财报显示，该季度公司营收达 1,276 亿美元（IT之家注：现汇率约合 8,525.01 亿元人民币），同比增长 25%。然而，由于搜索广告业务增速持续回落，财报公布后 Alphabet 股价下跌 8%。谷歌首席商务官菲利普 · 辛德勒（Philipp Schindler）在投资者电话会议上表示：“我们正在将‘AI 概览’（AI Overviews）及‘AI 模式’（AI Mode）中的高质量广告向更多用户和查询场景铺开。这也标志着我们首次将该业务的商业化布局拓展至全球市场。今天，我们正式宣布将 AI 模式下的广告推向国际市场，同时在美国本土上线多轮对话广告（multi-turn ads）以及 AI 模式。”谷歌表示，早期测试结果显示这些广告形态表现良好。据辛德勒透露，AI 模式中赞助商品列表的点击率已能够媲美自然搜索列表；公司的用户调研结果同样表明，用户普遍认为这些广告具备高度相关性。此次举措基于谷歌今年 5 月宣布的一系列 Gemini 驱动广告新形态，其中包括能够实时响应用户提问的对话式发现广告，以及深度嵌入 AI 生成结果中的赞助推荐内容。谷歌首席执行官桑达尔 · 皮查伊（Sundar Pichai）指出，搜索查询总量创下了近五年来的最快同比增速，但他未透露具体百分比。他将这一增长归功于 AI 功能对用户搜索行为的重塑，尤其是促使查询变得更长、更复杂。皮查伊表示，AI 模式下的查询长度平均是传统搜索的三倍；全球范围内，每五次 AI 模式搜索中就有一次涉及语音、图像或文档输入。此外，谷歌每月的视觉搜索（Visual Search）请求量已突破 500 亿次。皮查伊对投资者表示：“相比全球任何其他产品，（搜索）正在让更多人切实享受到 AI 带来的价值。人们对我们 AI 功能的使用日益频繁，搜索方式也焕然一新，输入的查询变得更长、更具个性化，且全面呈现多模态特征。”相关阅读：《谷歌 2026Q3 财报暴露 AI 变现焦虑，股价盘后暴跌逾 7%》《谷歌 2026 财年前三季度报归母净利润 2008.55 亿美元，同比增长 105.55%》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/019/269.htm", "publishedAt": "2026-10-28T22:54:59+00:00"}, {"title": "不再逐个生成 Token：扩散模型迈向 35B，开始挑战 Agent 编程", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/0tgCLAMXFiFo0Dco5P9m?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-28T22:53:53+00:00"}, {"title": "Claude AI 找漏洞实战：安卓手机锁屏下提取照片、53 分钟攻破 Linux 获取最高权限", "summary": "IT之家 10 月 29 日消息，Anthropic 于 10 月 27 日发布研究报告，称其通过一个未公开发布的内部 Claude 研究模型，在 Chrome、Safari、Android、Windows 和 Linux 中发现漏洞，并将多个漏洞串联为 5 条可实际运行的攻击链。相关漏洞均已按协调披露流程报告厂商并修复。其中最受关注的是 Chrome，IT之家援引博文介绍，Anthropic 向谷歌提交的报告共产生 62 个严重或高危 CVE，包括 13 个沙箱逃逸漏洞和 21 个可控制网页渲染进程的漏洞，修复已随 Chrome 156 发布。研究团队称，Claude 在研究人员给出初始提示后，自主定位漏洞并编写利用代码；其 Chrome 概念验证可在页面加载后数秒内于 macOS 默认安装环境中打开计算器应用。Safari 方面，Claude 发现的漏洞链可绕过同源策略，让恶意网站有机会读取用户已登录账号的数据；苹果已在同日确认并发布修复。Android 攻击则需物理接触设备，可在 Pixel 9 锁屏状态下通过 USB 提取照片等个人数据，谷歌称已处理该问题。在 Windows &nbsp;方面，Claude 重点发现追踪编号为 CVE-2026-33096 的漏洞，评分为 7.5，攻击者无需认证或用户交互即可让响应 HTTP/3 请求的服务器崩溃；微软已于 2026 年 4 月发布补丁。最严重的是 Linux 漏洞 CVE-2026-98432，这是针对运行多路径 TCP 监听器的服务器，攻击者发送数据包即可在无凭据情况下获得 root shell。Anthropic 的验证共耗时 53 分钟，其中 48 分钟用于泄露内核指针，5 分钟执行命令。Anthropic 公布了 5 条串联多个漏洞、配置弱点或竞态条件，最终实现数据窃取、系统崩溃或远程控制等 5 条攻击链：1. Chrome：绕过沙箱执行代码攻击从 V8 JavaScript 引擎漏洞开始，随后绕过 Chrome 的内存沙箱，再利用 CacheStorage 竞态条件和 FedCM 的释放后使用缺陷，最终在沙箱外执行任意代码。2、Safari：一次点击窃取敏感数据模型构建了一条“一次点击”攻击链，绕过同源策略，让恶意网页访问本应隔离的其他网站数据，可读取浏览器历史、Cookie 及登录状态下的邮件、银行等敏感信息。3、Android：未解锁手机提取照片该链条针对被锁定或未解锁的 Pixel 9 安卓手机，利用 USB 相关缺陷，在设备未解锁时提取照片等个人信息。手机即使处于锁屏状态，仍可能泄露本地媒体与个人资料。4、Windows：远程反复崩溃服务器Claude 发现 Windows QUIC 内核实现中的越界读取漏洞，可远程触发服务器反复崩溃。5、Linux：零点击获取 root 权限研究团队称，Claude 在 Linux 内核网络栈中发现一个零点击远程代码执行漏洞，可在约 53 分钟内获得 root 权限。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/019/268.htm", "publishedAt": "2026-10-28T22:35:25+00:00"}, {"title": "谷歌最强 AI 模型：Gemini 4 Carbon 登顶全球智能指数榜首，“专职”做网络安全", "summary": "IT之家 10 月 29 日消息，谷歌正式发布新一代前沿大模型 Gemini 4 Carbon，主打业界顶尖的网络安全能力与长程任务处理能力。谷歌称其为目前最强的模型，重点强化了网络安全能力和处理复杂、长周期任务的能力。该模型在最新版 Artificial Analysis Intelligence Index v5.0 中排名第一，综合得分 59。Gemini 4 Carbon 首发入门定价与两周前发布的 Gemini 4 Argon 保持一致，缓存输入 Tokens 可享输入价 95% 折扣。输入：每百万 Tokens 2 美元（IT之家注：现汇率约合 13.3 元人民币）输出：每百万 Tokens 10 美元（现汇率约合 66.7 元人民币）入门优惠期结束后，将恢复常规定价：输入：每百万 Tokens 4 美元（现汇率约合 26.7 元人民币）输出：每百万 Tokens 20 美元（现汇率约合 133.3 元人民币）在长程编程任务上，Carbon 专为高难度、需要持续运行多日的智能体工作流设计，能够自主遍历死胡同、完成大型代码库与底层系统的根因定位、漏洞补丁编写等复杂多步骤工程任务。在 WebDev Arena 前端全栈开发榜单上，Carbon 较上代提升 89 个 Elo 分，以 1,769 分位列第 4。网络安全能力是本次升级的核心亮点，Carbon 在防御全生命周期的漏洞发现、验证、修复环节均达到业界领先水平：漏洞发现：在 SEC-bench Pro 基准上实现 88.2% 的成绩，可自主挖掘真实软件中隐藏的复杂漏洞。漏洞利用验证：在 ExploitGym 基准上取得 54.8% 的成绩，可自动判断漏洞是否可被利用，帮助安全人员优先处理高风险漏洞。根因补丁修复：在 CWE-bench 基准上取得 71.0% 的成绩，可直接将验证后的漏洞转化为可运行的修复代码。内部测试数据显示，Carbon 生成安全代码的成功率较 Argon 提升超过 2 倍；Chrome 团队测试显示，其生成高质量补丁的表现比其他实验室的大前沿模型好 10 倍以上。安全对齐方面，Carbon 在 Argon 的多层安全体系基础上进一步强化：Terminal-Bench 4.0 上的作弊成功率降至 0.0%，作弊尝试占比降至 0.4%；内部实时编程环境中，高严重程度的失准警报下降近 80%。无依据的编造性声明较 Argon 减少约一半，会主动标注方法局限、在证据不足时拒绝违规操作并明确列出缺失信息。面对模糊需求时，Carbon 会先检索相关资料、向用户反馈差异点再执行，不会强行猜测路径。过度执行率下降 26%，服务不足率下降 29%，多步骤计划的端到端执行可靠性显著提升，同时严格遵守项目范围约束。间接提示注入攻击的成功率降至 0.0%，完全抵御了本次评测覆盖的所有攻击尝试。发布节奏上，谷歌表示正配合美国政府的预发布模型自愿测试流程，从本周起先向一小部分网络安全防御人员开放 Carbon，后续将通过 Fairwind 计划逐步扩大可信合作伙伴的访问范围，在收集反馈、迭代完善防护机制后，再面向开发者、企业与普通消费者开放。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/019/240.htm", "publishedAt": "2026-10-28T20:51:40+00:00"}, {"title": "大客户直接打1折、模型四个月降价80%：大模型价格战没有退路", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/ejtljxPixrIuUsGYi5xa?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-28T18:14:48+00:00"}, {"title": "Anthropic 内部系统被 AI Agent 12 小时攻破！会议记录、员工薪酬、内部模型讨论遭访问", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/mFXr0u4z0XftUGUg5Wm7?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-28T17:54:54+00:00"}, {"title": "模型越来越强，落地却处处卡关？14位行业大佬拆解难题  "sourceUrl": "https://www.ithome.com/1/019/297.htm", "publishedAt": "2026-10-29T01:02:12+00:00"}, {"title": "科普书出现“双头虾”图片：出版社通知全网下架并召回，知情人士称用 AI 技术表现蜕壳过程引发误解", "summary": "IT之家 10 月 29 日消息，据南方都市报报道，近日，有读者在社交平台反映，其购入中国农业出版社出版发行的《南海海洋生物科普丛书》，丛书序言表示，本套丛书里绝大多数图片由 AI 绘图工具生成。但其发现丛书的绘图中出现了“双头虾”的错误图片，分别在第 13 册“斑节对虾”封面与内页。10 月 27 日，中国农业出版社工作人员回应称，出版社已经关注到相关情况。该出版社读者服务热线的工作人员向记者表示，目前正在通知全网下架并召回涉事图书。另据界面新闻 28 日报道，知情人士表示，该图片主要是为表现斑节对虾蜕壳的过程，但因 AI 技术使用不成熟，导致图片引发外界误解。书中图片下方内容也详细介绍了斑节对虾的蜕壳现象，“蜕壳是斑节对虾生命周期中的一个重要环节，也是它们适应环境、保持生长的必要过程。”“当斑节对虾的身体长到一定程度时，它们就会选择一个安全的环境，开始蜕壳。”对于知情人士上述说法，中国农业出版社目前尚未作出公开回应。IT之家注意到，该出版社的官方微信小程序和官方旗舰店中已查询不到相关书籍。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/019/290.htm", "publishedAt": "2026-10-29T00:37:11+00:00"}, {"title": "腾讯网盘开启内测申请：支持连接多个 AI 应用，共享存储、聚合上下文", "summary": "IT之家 10 月 29 日消息，腾讯网盘现已开启内测申请，官网已开放入口，用户可直接前往提交。据介绍，腾讯网盘支持连接多个 AI 应用，共享存储，聚合上下文，宣称“生态内所有 AI 应用的数据产物聚合沉淀，持续形成长期记忆资产”。据介绍，腾讯网盘拥有四大核心能力：存储：套件产物统一落盘网盘，沉淀为 WorkBuddy 随时取用的资产底座。连接：企业微信、腾讯会议等办公工具和主流 AI 工具都已打通，换一端、换一个 AI，都能接着上次的进度继续。智能：内置和 WorkBuddy 同一套 AI 能力，提前帮你归类资料、提炼要点，需要时直接取用，不用临时翻找。安全：依托腾讯云存储，让文件稳妥留存、流转全程有防护，Agent 按设定的权限取用。官网显示，腾讯网盘已包含在 WorkBuddy 会员中，无需单独购买。购买 WorkBuddy，腾讯网盘存储、整理、AI 调用，一次付费全都有。IT之家附腾讯网盘官网链接：https://drive.tencent.com/", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/019/283.htm", "publishedAt": "2026-10-28T23:57:06+00:00"}, {"title": "AI 行业重磅并购：彭博社称美满电子最快下周宣布收购光通信龙头 Lumentum", "summary": "IT之家 10 月 29 日消息，彭博社今天（10 月 29 日）发布博文，报道称美国半导体公司美满电子（Marvell）计划收购数据中心光通信设备制造商朗美通（Lumentum），目前双方正在磋商谈判，交易最快可能于下周宣布。IT之家援引博文介绍，双方尚未达成最终协议，若该交易达成，有望成为人工智能硬件供应链领域的一笔重量级并购。从体量看，Lumentum 当前市值约 830 亿美元（IT之家注：现汇率约合 5,545.26 亿元人民币），迈威尔市值约 2,210 亿美元（现汇率约合 1.48 万亿元人民币）。彭博称，这笔潜在交易凸显了 AI 竞赛正推动科技企业加快通过并购扩大规模、抢占光通信和数据中心互连资源。Lumentum 主要生产激光器及光通信器件，用于在数据中心、电信网络和服务器之间高速传输海量数据。且随着 AI 集群规模迅速扩大，高速光互连正成为决定算力效率的关键基础设施。报道指出如果交易顺利落地，美满电子将更紧密地整合其芯片设计能力与 Lumentum 的光模块、激光器及光互连技术，有助于其强化 AI 数据中心产品布局，并简化部分供应链。市场对消息反应剧烈。Lumentum 美股盘后一度大涨约 17%，随后涨幅收窄；迈威尔科技盘后则下跌约 8%，彭博社认为投资者既看好 AI 光互连的长期战略价值，也担忧巨额收购可能带来的融资压力、股权稀释和整合风险。Lumentum", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/019/279.htm", "publishedAt": "2026-10-28T23:37:12+00:00"}, {"title": "微信鸿蒙版 App 获 8.0.23.32 邀测升级", "summary": "IT之家 10 月 29 日消息，微信鸿蒙版 App 已在华为应用市场（App Gallery）开启了 8.0.23.32 (8394528) 版本邀测升级（需收到短信通知后点击链接跳转安装），测试时间为 2026/10/28-2026/11/27。和往常一样，本次更新的说明依旧为“修复了一些已知问题”。据博主 @伤心萨摩耶Ciuciu 反馈，8.0.23 版本的微信新增了如下特性：部分 Flutter 跨端页面（如朋友圈、听一听、表情管理等页面）响应系统字体粗细；更换铃声选择界面右上角新增铃声设置入口，支持启用或停用个性化内容推荐；发表视频号内容时新增添加标注，视频号已发布的内容点击分享同步新增添加标注；发现-直播-更多直播新增搜索按钮；听一听主页面右下角新增小微分支入口浮动按钮，并根据当前页面内容弹出对应提示词，可快速使用听一听相关问小微功能，播放页面点击分享新增问小微（主页面右下角浮动按钮为逐步开放）；公众号图标焕新，对齐其他端；好友昵称、群昵称、备注、微信号、地区等信息支持长按复制；服务号信息流页面已关注的服务号发布的文章支持长按，选择不再关注或删除文章消息；聊天中的图片或视频点开右下角此聊天中的图片视频按钮样式更改；服务号信息流-推荐的贴图长按新增转发；聊天工具新增问小微（逐步开放，需账号灰度到小微主体）；直播页面支持显示当前直播转发分享人数；听一听浮标样式焕新；在具有管理权限的群聊中查看群成员资料，进群方式中邀请该群员进群的群员昵称变更为蓝色可点击状态；支持展示其他端设置的朋友圈点赞彩蛋；视频号内容点击分享新增问小微（逐步开放，需账号灰度到小微主体）；服务号的通知提醒红字部分新增新通知的服务号名称提醒，由 [n 条消息] 变更为 [xxx 等 n 条消息]；群收款右上角新增导入，支持在发起群收款时导入账单、群接龙、历史群收款（逐步开放，支持 8.0.22 及以上版本）。大家在IT之家微信号回复“微信”两字，即可获取当前最新官方内部版微信下载。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/019/275.htm", "publishedAt": "2026-10-28T23:21:58+00:00"}, {"title": "LG 发布通知，电视端微软 Copilot 即将全面下线", "summary": "IT之家 10 月 29 日消息，科技媒体 Windows Central 昨日（10 月 28 日）发布博文，报道称部分 LG 智能电视用户反馈已收到服务终止通知，微软已针对包括 LG 在内的所有电视，将停止运营 Copilot 服务。IT之家曾于 2025 年 12 月报道，LG 电视在升级推送的 webOS 系统更新后，自动安装了微软 Copilot AI 应用程序，且系统未提供任何卸载或移除选项。LG 公司随后回应表示出现在电视上的 Copilot 图标并非传统的原生应用程序，只是一个网页浏览器快捷方式，目的是“提升客户便利性”。用户点击该图标后，系统会跳转至浏览器并打开微软的 AI 服务页面，而非在后台运行一个独立的监控程序。图源：Windows Central而根据最新公告内容，相关功能不再可用，不过通知并未提及具体截止日期。外界推测，若相关合作按年度协议执行，服务可能在 2026 年 12 月前后下线。相关阅读：《微软 Copilot AI 应用登陆 LG 电视，且无法卸载》《LG 回应其电视强制安装微软 Copilot 事件：非原生应用，未来支持卸载》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/019/267.htm", "publishedAt": "2026-10-28T22:25:02+00:00"}, {"title": "别再只写提示词了，开始真正雇用智能体：智能体企业管理实践 ｜ 技术实践", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/II91QKxeaEg7RuZR2rrf 玩家的活动记录推荐更符合其兴趣的作品。Wilkinson 表示，采用随机推荐是为了避免开发者研究算法漏洞、利用规则争夺曝光机会，同时确保每款参展游戏都有公平的展示机会。不过，他也承认，这套机制确实可能让部分低质量作品获得曝光。因此“开发者应持续更新和完善自己的游戏，加入新功能、鲜明的个性与创意，避免作品仅依赖一个容易被其他开发者复制的玩法概念”：与其依赖某个容易被别人复制的机制，不如持续发展自己的游戏，加入独到的功能、个性与创意。Giardino 还提到，Valve 长期以来应对盗版问题的基本思路，就是让正版产品成为最好的版本，而不是一味采取强硬的防盗措施。他认为，这一理念同样适用于 AI 仿冒游戏问题。对于“以复制游戏为手段实施勒索”的情况，Giardino 认为，这类事件更接近执法机关需要处理的问题。不过，他强调，Valve 不会将问题简单推给其他机构，而是愿意调查开发者提交的个案，并在可行范围内提供协助。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/019/309.htm", "publishedAt": "2026-10-29T01:34:47+00:00"}, {"title": "AI 数据中心用电激增，美国电力行业减排成果恐被抵消", "summary": "IT之家 10 月 29 日消息，据彭博社 28 日晚间报道，美国环保组织塞拉俱乐部的一份内部分析指出，为 AI 数据中心供电而掀起的化石燃料电厂建设热潮，恐将抵消美国电力行业过去 15 年的温室气体减排成果。塞拉俱乐部估计，如果将规划中的 AI 项目计算在内，到 2030 年，美国电力行业的二氧化碳排放量将达到 21 亿吨，比 2025 年增加 6.18 亿吨，增幅约 42%。塞拉俱乐部气候与能源首席顾问杰里米 · 费舍尔指出，如果在一年半前进行预测，研究人员估计的建设规模及其影响可能只有当前预测的四分之一到一半。面对 AI 数据中心庞大的用电需求，许多开发商选择天然气发电，既从公共电网获取电力，也自行建设发电设施。预计到 2030 年，大部分新增排放将来自未直接接入公共电网的发电设施。科技公司往往为了免去漫长的并网等待而自行建设电源。费舍尔称，这部分排放量可能超过 4.6 亿吨，与墨西哥一年的排放总量大致相当。彭博新能源财经分析师海伦 · 寇指出，如果新设施大规模采用天然气发电，排放量预计会比今年迄今的水平更高。究竟会增加多少，仍很难判断。美国电力行业未来的排放量存在巨大的预测分歧，最高和最低估算对应的发电量差距，甚至超过加利福尼亚州和佛罗里达州的用电需求总和。塞拉俱乐部的分析综合了公开申报文件和其他机构的数据中心建设预测，包括环保组织环境保全项目对 2030 年前计划建设的发电厂数量及排放量的统计。仅接入公共电网的新增发电机组，就会使 2030 年基准情景下的二氧化碳排放量增加 10%，相当于 1.54 亿吨。此外，还有数据中心自行建设的供电设施。环保组织 Earthjustice 和 Better Data Center Project 的另一份分析显示，这类设施所需能源的 80% 可能来自天然气。自备电厂增加了当地空气污染和温室气体排放，也加剧了美国各地对数据中心建设的反对。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/019/287.htm", "publishedAt": "2026-10-29T00:11:11+00:00"}, {"title": "Valve 回应 Steam AI 垃圾游戏泛滥：不禁用 AI，但要改推荐机制", "summary": "IT之家 10 月 29 日消息，科技媒体 NeoWin 今天（10 月 29 日）发布博文，报道称在韩国召开的 Steam Indie Connect 活动中，Valve 回应 Steam 新品节（Steam Next Fest）“AI 垃圾游戏”争议，称公司正研究解决方案，但不会禁止开发者使用 AI 工具。Steam 业务负责人 Tom Giardino 表示，Valve 不希望成为“守门人”，替开发者决定可以使用哪些创作工具。他认为，如果一款游戏只依赖容易被复制的单一机制，就很难长期立足，并认为开发者应持续加入源自自身视角的新功能、个性与创意，让作品形成真正的差异化。针对“AI slop”，即粗制滥造、批量生成式 AI 游戏泛滥的问题，另一位 Valve 负责人 Marc Wilkinson 承认，平台确实有“相当多的人”在思考如何应对。他强调，Valve 并不认为现有机制已经完美，改进空间很大，但公司的思路不是限制开发者的工具权限，而是让 Steam 变得更智能、更具动态性。Valve 还将这一问题类比为以往的平台治理挑战：从 Steam Greenlight 到 Steam Direct，公司曾多次调整游戏上架与筛选机制。此次的目标同样是通过改进商店的推荐、筛选和发现体验，帮助玩家更容易找到更好的游戏，而不是简单地对 AI 内容“一刀切”。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/019/274.htm", "publishedAt": "2026-10-28T23:21:25+00:00"}, {"title": "微软发布 Win11 28000.3365 可选更新：Copilot 键可改键，Edge 支持加速启动", "summary": "IT之家 10 月 29 日消息，微软今天（10 月 29 日）面向 Windows 11 26H1 用户，推送 10 月可选更新 KB5127653，用户安装后版本号升至 Build 28000.3365。Windows 11 版本 26H1 (KB5127653) 的更新日志也分为逐步推送和正常推送两部分。前者包含将分阶段推出的功能，而后者则会在所有设备更新后立即提供所列的增强功能。以下是更新日志：逐步推出[文件资源管理器]新增！本次更新调整了预览窗格处理从网络下载的文件的方式。对于 HTML 文件，新增的“仍然预览”按钮允许您确认警告并预览文件。非 HTML 文件（例如 PDF）现在会自动预览。新增！文件资源管理器主页现在可以保留已展开或已折叠部分的状态，因此您可以从上次离开的地方继续操作。新增！本次更新提升了“详细信息”面板中云文件缩略图预览的可靠性。此外，面板布局也进行了重新设计，让您可以更轻松地查找和查看文件属性。新增！本次更新解决了点击地址栏右侧附近进入编辑模式时可能会清除地址栏内容的问题。[表情符号]新增！本次更新新增了对 Emoji 17.0 的支持，包括扭曲的脸、战斗云和毛茸茸的生物等新表情符号。要插入这些表情符号，请按 Windows 键 + 句点 (.) 打开表情符号面板。新增！本次更新还改进了几个现有表情符号的设计，以提高跨平台的一致性，包括敬礼脸、偷看脸、鹅、莲花和亲吻猫。[小部件]新增！本次更新引入了“提示”小部件，可提供关于 Windows 功能的简短实用指南。要将其添加到“小部件”面板，请打开面板，选择“添加小部件”，然后选择“提示”。要将其添加到锁屏界面，请转到“设置”&gt;“个性化”&gt;“锁屏”，然后将“提示”添加到锁屏小部件中。[个性化]本次更新对桌面背景体验进行了多项改进。本次更新提高了“设置”中“个性化”&gt;“背景”页面的可靠性。本次更新增加了对使用 DIB 图像文件作为桌面背景的支持。本次更新提高了新创建帐户的桌面幻灯片过渡效果的可靠性。本次更新提高了在“个性化”&gt;“背景”中选择桌面背景时预览的分辨率。本次更新改进了纵向模式显示器用户在“设置”中的桌面背景预览显示效果。本次更新提高了快速连续更换桌面壁纸时的处理可靠性。本次更新增加了对在多个桌面上使用幻灯片壁纸的支持，这样就不会自动切换回图片模式。[蓝牙]本次更新包含多项改进，旨在提升连接和使用蓝牙设备的可靠性和用户体验：在语音通话期间，当通过蓝牙经典音频配件上的音量控制调节该配件的音量时，Windows 外壳音量弹出窗口现在会显示，从而提供新的音量级别的视觉反馈。此次更新提高了 Windows 显示的已与电脑断开连接的配件的连接状态的准确性。本次更新提高了在“设置”中管理蓝牙和音频设备时，“蓝牙和设备”页面的稳定性。本次更新解决了蓝牙无线电功能可能已关闭，但“设置”中的“蓝牙和设备”页面中无线电控制开关的状态仍显示为开启的问题。本次更新提升了蓝牙音频的稳定性和兼容性。本次更新提高了麦克风与某些蓝牙经典音频配件的兼容性。本次更新解决了在播放蓝牙音频时可能导致崩溃（错误代码 0x139）的问题。此次更新提高了 LE Audio 配件的可靠性和性能。此次更新提高了共享音频的可靠性。[无障碍]新增！本次更新引入了“最大化打开应用”功能，这项辅助功能设置会在应用打开时自动最大化应用窗口。无论您是使用屏幕阅读器或放大功能、在平板模式下工作，还是仅仅喜欢一致的全屏工作空间，它都能为您减少日常操作中的一些不便。要启用此功能，请前往“设置”&gt;“辅助功能”&gt;“视觉效果”，然后开启“最大化打开应用”。本次更新改进了在使用键盘输入、游戏手柄输入或语音助手时，蓝牙快速设置页面的导航体验。[放大镜]新增！本次更新为放大镜任务栏带来了现代化的视觉效果。图标已更新。放大镜工具栏图标与 Windows 11 的视觉设计保持一致，使该工具看起来更简洁、更现代化。优化了间距和内边距。工具栏的间距和内边距都经过调整，使布局更加精致统一。视图、缩放控制、键盘快捷键和朗读功能都与早期版本完全相同。[设置]本次更新提高了与“设置”&gt;“蓝牙和设备”&gt;“打印机和扫描仪”页面内容交互时的“设置”功能的可靠性。此更新将“设置”&gt;“应用”&gt;“已安装的应用”更新为在顶层显示打包应用的版本号，就像它已经对其他应用显示版本号一样。本次更新改进了“设置”中的时间选择器控件，使其在您切换 12 小时制和 24 小时制时，能够反映您偏好的时间格式。这适用于设置活动时间和安排夜间模式等功能。本次更新改进了“设置”&gt;“蓝牙和设备”&gt;“相机”设置中“允许多个应用同时使用相机”选项的持久性。[触控板]新增！在“设置”&gt;“蓝牙和设备”&gt;“触控板”中，您可以找到适用于精密触控板的其他手势控制选项：单指滚动 —— 从触摸板的左侧或右侧开始，用一根手指垂直滚动。自动滚动 —— 滚动时，将手指移至触控板边缘附近，即可实现无需抬起手指的持续滚动。[Copilot 按键]新增！此更新引入了一项新的 Windows 11 设置，允许您将“Copilot”键重新映射为右 Ctrl 键或上下文菜单键，从而帮助您保留熟悉的键盘快捷键和辅助功能工作流程。[相机胶卷]新增！本次更新在“设置”中新增了“相机胶卷备份”功能，帮助符合条件的用户使用 OneDrive 保护照片。用户可以在“设置”首页或“账户”页面启用此功能，并通过扫描二维码在手机上完成设置。[字体]新增！本次更新为 Ebrima 字体添加了对 Garay 和 Beria Erfe 两种文字的支持，Ebrima 是首款同时支持这两种文字的微软字体。Garay 采用 Unicode 16.0 编码，Beria Erfe 采用 Unicode 17.0 编码。新增！本次更新还改进了 Ebrima 中的 Adlam 字形设计，使其与当前的 Unicode 标准保持一致，并提高了一致性。[电源和电池]此次更新改善了某些情况下笔记本电脑从交流电源切换到电池电源时出现的显示和性能问题。[管理员保护]新增！本次更新引入了一种新的方式，可从“Windows 安全中心”&gt;“帐户保护”中启用管理员保护。IT 管理员自 KB5120998 首次引入以来即可启用管理员保护。这项新功能正在逐步推出，并将在未来几个月内陆续推送，因此可能不会立即在所有设备上可用。当此功能可用时，请启用管理员保护开关，然后重启设备。[Windows 恢复 (WinRE)]新增！此更新使 WinRE 能够自动重用已保存在 Windows 中的符合条件的 Wi-Fi 配置文件，包括受支持的基于证书的网络。现在，在快速计算机恢复或云重建等恢复场景中，设备可以自动联网，而无需在 WinRE 中预先配置 Wi-Fi 凭据。此功能默认启用，IT 管理员可以将其禁用。新增！本次更新添加了恢复远程管理插件，用于扩展 MDM 提供商的 WinRE 管理功能。[Windows 设置备份和还原]新增！本次更新引入了“还原摘要”功能，该摘要会在您将备份配置文件还原到新设备后显示。摘要清晰地概述了成功还原的内容，包括 Windows 设置和 Microsoft Store 应用列表。这有助于提高设备切换过程中的透明度，并帮助您验证还原结果，从而更有信心地在新设备上继续进行设置。[数据保护 API (DPAPI)]新增！本次更新在基于提示的保护和解除保护操作前添加了一条警告。该警告说明此基于提示的体验将于 2027 年 4 月停用。如果您或您的应用使用了这些提示，请停止创建新的提示保护数据，使用受支持的非交互式保护流程，并在停用前解密或迁移现有的提示保护数据。不使用基于提示流程的 DPAPI 操作不受影响。[自助服务终端模式]使用受限用户体验自助服务终端时，Windows 键 + Tab 键盘快捷键已被禁用。使用单应用程序信息亭模式时，Windows 键 + A 和 Windows 键 + C 键盘快捷键已被禁用。正常推出[Windows 版 Microsoft Edge 现已支持加速应用启动]新增！Microsoft Edge 现在在 Windows 系统上打开速度更快、更稳定，尤其是在设备繁忙或高负载运行时，性能提升更为显著。加速应用启动功能优化了 Windows 在后台启动 Edge 的方式，减少了您打开链接或从任务栏或“开始”菜单启动 Edge 时的延迟。此功能适用于 Windows 11 版本 25H2、26H2 和 26H1，需要 Microsoft Edge 版本 150 或更高版本。[应用管理]新增！基于策略的内置应用移除功能现已支持多会话环境。IT 管理员可以使用现有的基于策略的应用移除功能，在多会话环境下管理 Windows 11 企业版和教育版设备上受支持的内置应用的移除。[远程桌面（已知问题）] 已修复此次更新解决了非管理员用户无法通过远程桌面连接到启用了管理员保护的远程设备的问题。受影响的连接可能会失败，并显示错误代码 0xC000000D 和“传递给函数的令牌无效”的消息。此更新解决了阻止通过 Microsoft Intune 配置“指定代表受信任的 .rdp 发布者的证书指纹”策略的问题。[Windows PowerShell] 此更新将版本号 5.1 添加到 Windows PowerShell 和 Windows PowerShell 集成脚本环境 (ISE) 的名称中。在现有设备上，安装此更新后，某些“开始”菜单快捷方式可能仍保留其先前的名称。[BitLocker] 此更新改进了 BitLocker 启动前 PIN 重试处理，以防止意外重复提交导致 TPM 字典攻击锁定和恢复。[时间和日期]此次更新将为不列颠哥伦比亚省和艾伯塔省永久启用夏令时 (DST) 支持，该支持将于 2026 年 11 月开始生效。本次更新引入了新的时区曼尼托巴标准时间，“（UTC-05:00）曼尼托巴”。[应用程序控制] 此更新解决了在使用 PS_UpdateAndCompareCIPolicy CIM 方法后可能导致设备无法启动的问题。[音频] 此更新修复了某些 AMD 显卡上 HDMI 和 DisplayPort 音频播放可能失败的问题。[证书] 此更新解决了当非 Microsoft CNG 密钥存储提供程序报告格式错误的算法名称或在提供程序枚举期间发生故障时，TPM 证明身份密钥 (AIK) 证书注册可能会停止响应的问题。[适用于 Windows 的 Linux 子系统 (WSL)] 此更新修复了在配备 AMD 处理器的设备上，适用于 Linux 的 Windows 子系统版本 2 (WSL2) 可能无法使用嵌套虚拟化的问题。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/019/273.htm", "publishedAt": "2026-10-28T23:10:15+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "活动回顾｜InfoQ AI 侦察团的实战一天：企业 AI 如何走向落地？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/g7TTtqzU1qyQXooXFQGN?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-29T09:55:47+00:00"}, {"title": "微软向约 6 万名员工推出自愿离职买断方案，CFO 称预计只有不到 3000 人接受", "summary": "IT之家 10 月 29 日消息，微软发言人向《商业内幕》透露，公司本周向超过四分之一的员工提供自愿离职补偿方案，但预计最终接受的人数不超过 3,000 人。当地时间 28 日，微软 CFO 艾米 · 胡德在内部备忘录中重申了这一判断，并回应员工对方案出台原因的疑问。“我知道，有些员工不明白我们为什么要在本周推出自愿离职方案。我们的初衷是让想离开微软的员工能够自主决定如何离职。考虑到公司提供的职业发展机会，我们预计接受方案的人会非常少。”这份备忘录是胡德每季度向员工发送的财报邮件。微软公布季度业绩时，她通常都会向内部员工通报经营情况。以往的邮件大多只是重复公开财报中的内容，而由于本周的离职补偿方案在科技行业引发广泛关注，因此胡德专门作出了说明。今年早些时候，微软还推出过另一项自愿退休补偿方案，当时约三分之一符合条件的员工选择接受，也让微软得以减少后续裁员的人数。微软称，本周推出的新方案预计不会有那么多人接受。IT之家附微软 CFO 内部备忘录全文如下各位同事：今天下午，我们公布了第一财季的财报。公司营收增长 19%，营业利润增长 21%，均超出华尔街预期。进入 2027 财年后，我们还对财报中的业务划分方式作出了一项重大调整。12 年来，我们首次调整业务报告结构，将原来的三大业务部门整合为两大部门：智能体与基础设施业务、设备与消费业务。新的划分方式更符合微软的实际经营情况，从产品开发、资源分配，到如何通过各层平台的协同为客户创造价值，都能得到更准确的反映。按照新架构追溯计算，上一财年智能体与基础设施业务贡献了约 81% 的营收，设备与消费业务则占 19%。以下是两大业务部门本季度的部分业绩亮点：智能体与基础设施业务营收增长 23%。微软云营收达 639 亿美元（IT之家注：现汇率约合 4,269.19 亿元人民币），增速提升至 30%。其中，Azure 营收增长 48%，Foundry 需求加速增长。按固定汇率计算，Microsoft 365 商业云营收增长 18%，主要得益于 Copilot、E7 等高端订阅产品，以及 Microsoft 365 Copilot 和 GitHub Copilot 按使用量计费的服务收入增长。Microsoft 365 商业版订阅席位增长 5%。拥有超过 5 万个 Microsoft 365 Copilot 席位的客户数量达到去年同期的 8 倍。Microsoft 365 消费者云服务营收增长 17%，订阅用户数量增长 7%。行业解决方案云业务营收增长 10%，Dynamics 365 和领英人才解决方案业务均有所增长。设备与消费业务营收下降 3%。扣除流量获取成本后，搜索和广告业务营收增长 12%，领英、必应和 Edge 的业务均实现增长。Windows OEM 和设备业务营收下降 22%，受到去年 Windows 10 停止支持带来的利好效应、OEM 合作伙伴去库存，以及 PC 市场需求疲软等因素影响。Xbox 内容与服务业务营收下降 2%。上周，我们推出了《使命召唤：现代战争 4》，继续让更多玩家能够通过更多设备玩到优秀游戏。感谢大家的努力，让新财年有了一个良好的开局。我要特别感谢工程团队和基础设施交付团队，他们努力加快资源交付，同时确保高度可靠性。团队也在提高现有资源的利用效率，以便我们更好地满足客户对 Azure 平台的需求。这方面的需求依然超过我们的供应能力。我知道，有些员工不明白我们为什么要在本周推出自愿离职方案。我们的初衷是让想离开微软的员工能够自主决定如何离职。考虑到公司提供的职业发展机会，我们预计接受方案的人会非常少。我们也会继续为员工提供多种学习和发展机会，帮助大家掌握新技能，在微软实现职业发展。未来，我们面临着巨大的发展机遇。为了把握机遇，我们将集中精力打造优秀的产品和解决方案，帮助客户实现安全、创新、增长等各方面的目标。感谢大家始终将为客户创造积极成果和实际价值放在首位。如果想进一步了解本季度财报和第二财季的业绩展望，可以在今天美国太平洋时间下午 2 点 30 分观看直播，也可以收听回放，或前往投资者关系网站阅读会议实录。最后，请记下 11 月 17 日至 20 日举行的微软 Ignite 大会。届时，我们将展示 AI、云计算、数据、安全和 Copilot 领域的创新成果如何相互结合，帮助客户实现业务转型。衷心感谢大家！艾米相关阅读：《微软向约 6 万名员工推出自愿离职买断方案，适配 AI 时代人员结构调整》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/019/282.htm", "publishedAt": "2026-10-28T23:55:13+00:00"}, {"title": "全球 AI 基建风向标：英伟达于太平洋时间 11 月 17 日公布 2027 财年第 3 财季财报", "summary": "IT之家 10 月 29 日消息，英伟达今天（10 月 29 日）发布公告，宣布将于太平洋时间 11 月 17 日下午 2 时（北京时间 11 月 18 日上午 6 时）召开电话会议，公布并解读 2027 财年第三财季（截至 2026 年 10 月 25 日）财务业绩。根据公告，本次电话会议将在英伟达投资者关系网站进行仅收听模式的网络直播。公司管理层发言后，将安排问答环节，提问对象仅限金融分析师和机构投资者。值得注意的是，英伟达此次调整了信息披露节奏：在电话会议开始前，公司会先行公布业绩，并同步发布执行副总裁兼首席财务官科莱特 · 克雷斯（Colette Kress）撰写的书面业绩评论。该材料预计在太平洋时间下午 1 时 20 分（北京时间 18 日凌晨 4 时 20 分）左右业绩公开后，立即上传至投资者关系网站。对市场而言，这份书面评论可能比电话会议本身更值得关注。作为全球 AI 加速计算的核心供应商，英伟达的季度营收、数据中心业务表现、供给情况及管理层对后续需求的判断，往往被视为衡量 AI 资本开支景气度的重要风向标。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/019/263.htm", "publishedAt": "2026-10-28T21:18:59+00:00"}, {"title": "微软 2027 财年第一 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);

      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
