术布局，为 AI 智能体普及的时代做好准备。这套技术将同时支持沃尔玛及其折扣仓储门店山姆会员店的智能体购物。核心是沃尔玛推出的智能体网关，这是该公司全新的 MCP 服务器，目的是让经过审核的智能体通过模型上下文协议（MCP）接入沃尔玛平台。该协议最初由 Anthropic 开发，能够让 AI 智能体对接外部数据源、工具和各类工作流程。在本次场景中，AI 智能体可以检索沃尔玛线上库存，并替用户完成下单。此外，这家零售商称，通过智能体网关，消费者选购常用品牌或商品时，无需把个人信息和购买记录直接交给 AI 智能体。沃尔玛还开发了新技术，区分智能体下单和用户本人直接发起的订单，让购物者能够管控智能体的操作权限。下月即将上线的智能体档案功能，支持用户在账户内为每一个使用的 AI 智能体单独创建授权档案，可以单独查看智能体生成的订单。用户还能自主设置订单审批规则：可以要求每一笔交易都需要手动确认，或是设定一个消费额度，额度内的订单自动授权。沃尔玛介绍，这套权限管控机制类似于信用卡添加授权使用者，相关交易可被识别，同时能设置消费上限。公司说明，用户第一次通过沃尔玛智能体网关使用某个智能体购物时，系统就会生成对应的智能体档案。使用流程为先授权，将智能体档案绑定至沃尔玛账户，再设置权限或消费限额，用户也可以随时删除智能体档案。拥有沃尔玛账户即可使用智能体相关功能，无需开通 Walmart+ 会员。除上述技术之外，沃尔玛专门出台了面向 AI 智能体的使用条款，明确智能体的操作规范以及在平台进行交易的权限。值得一提的是，沃尔玛表示，即便智能体执行操作时出现偏差，平台的退货政策依然适用。这项对消费者友好的条款，有望打消早期尝试智能体电商用户的顾虑，不必担心因为智能体出错，收到自己并不想要的商品。沃尔玛同时规定，智能体不得做出超出用户本意的操作，无法获取用户的支付信息，仅能获取完成当前任务所必需的信息。不遵守条款的智能体，将会被禁止访问沃尔玛网站。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/016/172.htm", "publishedAt": "2026-10-21T23:04:54+00:00"}, {"title": "英伟达 DGX Spark 支持 8 台集群：128GB 版本统一内存最高达 1TB，RTX PRO 6000 Blackwell 相关任务提速 40%", "summary": "IT之家 10 月 21 日消息，英伟达今日在柏林 GTC 2026 大会上宣布，DGX Spark 此前支持最多 4 台设备组建集群，目前已开放手动配置最多 8 台设备组建集群。如果是以 128GB 版本组建，其统一内存容量最高可达 1TB。同时，英伟达还发布了本地 AI 平台更新，并宣布与 llama.cpp、vLLM 开源社区合作优化 AI 推理性能，在特定工作负载下，RTX PRO 6000 Blackwell 的推理性能最高提升 40%，DGX Spark 和 DGX Station 也分别获得最高 30% 和 20% 的性能提升。英伟达表示，4,999 美元（IT之家注：现汇率约合 33,450 元人民币）的 DGX Spark 的 64GB 版本将于 10 月 23 日开始通过合作伙伴陆续发售。针对集群部署，英伟达 Sync Model Launcher 计划于本月晚些时候上线，用户可通过该工具下载与硬件配置相匹配的模型和容器，并将模型连接至 OpenCode。工具还将自动加载 DGX Spark Skills，为设备故障排查、维护及工作流程提供指导。软件更新方面，10 月版 DGX Spark 更新加入 Wi-Fi 助手，允许设备在 appliance mode 下切换无线网络；DGX Spark Skills 也将通过 OpenCode 集成至英伟达 Sync，为日常维护和故障排查提供支持。模型方面，英伟达宣布支持更多可在本地运行的 AI 模型，包括 Nemotron、GLM、DeepSeek、Qwen、MiniMax 以及 FLUX.3 Klein 等，覆盖智能体、编程、图像生成和编辑等任务。英伟达还推出针对本地 AI 硬件优化的 Recursive Flint 编程模型。该模型采用混合专家（MoE）架构，总参数量为 400 亿，激活参数量为 25 亿。英伟达称，该模型在配备 64GB 内存的 RTX Spark 上推理速度超过每秒 220 个词元。针对本地运行大型模型时的内存压力，英伟达还发布了一组优化内存使用的模型检查点，通过量化降低内存占用，同时尽可能保持接近全精度模型的准确性。其中，Qwen3.8-Flash-Next-FP4-Local 可在单台 128GB DGX Spark 或 RTX PRO 6000 上运行；GLM-5.3-Flash-FP4-Local 则面向两台系统的配置。推理性能优化是此次更新的另一项重点。根据英伟达公布的数据，在 llama.cpp 中，针对 Qwen 3.8 Flash Next 的多 token 预测（MTP）推测解码优化，可使 RTX PRO 6000 Blackwell 上的端到端智能体任务提速最高 1.4 倍；在 vLLM 中，针对 Qwen3.8 27B 的推测解码和 FlashInfer 预填充内核优化，可使 DGX Spark 上的相关任务提速最高 1.3 倍；DGX Station 运行 GLM 5.3 Flash 时，吞吐量最高提升至原来的 1.2 倍。英伟达还公布了 DGX Station 的企业管理与应用扩展计划，包括新增 Absolute Security、思科旗下 Splunk、Microsoft Intune、Tanium 等七项管理集成，帮助企业部署和管理本地 AI 基础设施。DGX Station 的 Windows 版本预计于 12 月推出，将支持制造业相关应用，以及设计、仿真、验证和工程自动化工作流。此外，英伟达计划为 DGX Station 推出开放源代码机器人参考工作流，并以早期访问形式提供 NVIDIA Cloud Functions，让团队通过统一接口共享本地模型服务。相关阅读：《英伟达黄仁勋：已测超 1200 款应用，RTX Spark 是全球唯一本地原生运行所有应用的电脑》《桌面 AI 超算新选择：英伟达 NVIDIA DGX Spark 64GB 内存版正式发布，4999 美元》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/016/148.htm", "publishedAt": "2026-10-21T15:25:18+00:00"}, {"title": "腾讯内测 AI 互动社区“懂了鸭”：一句话生成可玩的动态课件与 3D 演示", "summary": "IT之家 10 月 21 日消息，今日有用户反馈，腾讯正在内测一款面向少儿与青少年的 AI 互动内容社区“懂了鸭”，官方网站（dongleya.qq.com）与微信小程序均已上线，目前向亲子用户和一线教师开放小范围测试。该产品的核心载体是“奇妙卡”，一种可拖拽、可模拟、可操作的交互式内容单元，家长、教师或知识创作者输入自然语言描述，即可借助内置 AI 智能体生成 3D 演示、动态课件、互动绘本、轻量游戏或记忆卡等作品，无需编程基础。用户既可以浏览社区中已有的奇妙卡作品，也可以对他人作品进行二次改编。从公开信息看，懂了鸭在产品形态上尝试将“内容消费”与“内容生产”放在同一个社区内完成。首页按学前、小学、初中、高中四个学段以及健康、语言、数学、科学、艺术、信息科技等学科领域组织内容。在创作侧，聊天机器人接受文字或语音输入，将想法转化为作品后发布到社区，形成“AI 降低制作门槛、社区承接分发”的循环。网经社的报道将这一机制概括为“输入创意想法，借助内置 AI Agent，无需代码即可一键生成”，并指出平台同时覆盖亲子互动、K12 课堂和课外探索三类场景。IT之家注意到，懂了鸭在模型列表中列出的可选模型包括 DeepSeek-V4.1-Flash、DeepSeek V4 Pro、DeepSeek V4 Flash、Hy3、Hy4 preview、MiniMax M3、Kimi K3 和 GLM-5.3 等。对于一款面向未成年人的教育类产品，多模型策略的意义可能不止于“给用户更多选择”：不同模型在生成 3D 演示、动态课件或叙事绘本时的能力侧重不同，按任务类型路由到合适的模型，是提升生成质量与稳定性的现实路径。在此之前，腾讯已在 AI 助手、AI 编程、AI 搜索等方向有多条产品线在推进，而面向 K12 与亲子场景的互动内容社区尚属空白。与字节“豆包爱学”聚焦拍照答疑、作业批改、错题分析等“解题 — 批改 — 答疑”闭环不同，懂了鸭的重心在“造内容”：让教师和家长成为互动学习材料的制作者，让孩子在可操作、可模拟的环境中接触知识，而非直接给出答案。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/016/145.htm", "publishedAt": "2026-10-21T15:10:22+00:00"}, {"title": "2026 上海开源大赛「智算云赛道」决赛名单公布", "summary": "2026 上海开源软件应用创新大赛「智算云赛道」决赛入围名单今日公布，以下 10 支队伍成功晋级，将于 10 月 29 日在上海张江人工智能创新小镇参加总决赛。 现将入围名单按报名时间顺序公示如下： 项目名称 团队负责人 代码仓库地址 ShannonBase 李浩 https://github.com/Shannon-Data/ShannonBase 女娲 Nuwax AIOS 邱超 ...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503144", "publishedAt": "2026-10-21T14:16:01+00:00"}, {"title": "英伟达联合思灵推出人形机器人参考平台 Agile ONE SN，计划 2027 年初上市", "summary": "IT之家 10 月 21 日消息，英伟达当地时间 10 月 21 日在 GTC 柏林大会上宣布扩展 Isaac 开放机器人开发平台，新增人形机器人参考平台、运行框架、仿真资产和数据集，并更新机器人学习工具，覆盖从训练数据生成、仿真训练到实体机器人部署的开发流程。硬件方面，英伟达联合思灵机器人（Agile Robots）发布了人形机器人参考平台 Agile ONE SN，计划于 2027 年初推出。该平台预配置英伟达 Isaac GR00T，并搭载 Jetson Thor 计算平台，主要面向机器人研究与开发。通过整合仿真、训练和部署工具，Agile Robots 表示，该平台可将相关环境的前期配置时间从数周缩短至数天。英伟达创始人兼 CEO 黄仁勋表示，通用机器人技术正在快速发展，机器人领域的“ChatGPT 时刻”正加速到来。英伟达称，此次更新旨在为开发者提供模型、数据、仿真工具和计算系统，帮助他们将通用机器人技术应用于实际产业场景。思灵机器人 Agile ONE SN 采用 Agile ONE S 人形机器人本体，身高 1.4 米、重量 40 公斤，具有 31 个自由度，单臂负载为 3 公斤。其配备两只 WUJI Hand 2 五指灵巧手，每只手具有 20 个自由度，支持 1kHz 力控制和触觉感知。需要注意的是，路透社报道该机器人重量约为 34 公斤，与英伟达官方公布的 40 公斤数据存在差异，现有信息尚不足以确认差异原因。计算方面，Agile ONE SN 搭载英伟达 Jetson Thor，提供 2070 TFLOPS 的 FP4 算力和 128GB 统一内存。传感器包括头部及腕部摄像头、激光雷达和惯性测量单元，用于感知周围环境并支持机器人与外部环境交互。安全方面，该平台计划将机器人端安全协议与英伟达 Halos 全栈安全系统集成，目前这项集成仍待完成。英伟达表示，斯坦福大学、苏黎世联邦理工学院等研究机构已对 Agile ONE SN 表示兴趣。路透社另报道称，Agile Robots 计划于 2027 年与英伟达合作生产最多 2000 台人形机器人，面向大学和企业研究实验室等客户。软件方面，英伟达 Isaac Lab 3.0 已正式发布，作为开源机器人学习框架，支持多 GPU 训练工作流，并可使用 Newton、PhysX 等物理引擎。该框架旨在帮助开发者训练和优化机器人策略，覆盖从桌面工作站到数据中心的不同计算环境。IT之家注意到，英伟达还推出开源运行框架 Isaac OS。该框架基于 Holoscan 构建，用于连接 AI 模型、传感器、控制系统和机器人硬件，支持从仿真环境迁移至实体机器人，并提供确定性实时运行能力。针对 DGX Station，英伟达同时发布了三套开源参考工作流。第一套通过强化学习优化 GR00T 1.7 模型；第二套利用 Isaac Lab 训练灵巧操作技能；第三套则借助 ChatGPT Astra 对 Cosmos 世界模型进行后训练，以生成合成训练数据。这些工作流旨在帮助开发者整合机器人学习、仿真和数据生成环节。数据方面，SimReady Central Library 提供超过 2000 项可用于仿真的机器人和工厂资产，涵盖多种机器人设备及工业场景资源。Human 1M 数据集则包含多种人类活动、同步三视角视频和三维手部追踪数据，可用于机器人学习与动作理解。两项资源均通过 Hugging Face 提供，其中完整版本的 Human 1M 数据集仅向 Cosmos Coalition 合作伙伴开放。英伟达还介绍了多家采用其机器人开发工具的企业。ABB Robotics 将 Omniverse 库整合至 RobotStudio HyperReality，用于机器人系统安装前的仿真和虚拟调试；NEURA Robotics 则利用 Isaac Sim 和 Isaac Lab 生成合成训练数据，并在仿真环境中训练机器人技能。英伟达表示，KUKA、Humanoid、Sereact 和 Universal Robots 等企业也在采用其开放机器人平台相关技术。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/016/128.htm", "publishedAt": "2026-10-21T13:49:39+00:00"}, {"title": "Cloudflare 开源面向 AI 智能体的决策模型 Clef", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/iqCrZLLizNkRTpfo2Jrb?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-21T13:47:00+00:00"}, {"title": "黄仁勋 GTC 柏林反驳 AI 终结软件论：工具公司将迎来更多使用者", "summary": "北京时间 10 月 21 日，英伟达创始人兼 CEO 黄仁勋在 GTC 柏林大会上表示，AI 的发展将增加软件工具的使用者，工具公司也将向 AI 公司和智能体公司转型。黄仁勋在演讲中提到，有人认为 AI 的到来意味着软件和工具公司的终结，他对此持相反看法。他认为，随着 AI 智能体承担更多工作，过去开发的软件工具将迎来更多使用者。支撑这一判断的原因是，AI 要完成实际工作，仍然需要调用专业工具。黄仁勋以科学家和工程师的工作为例说明，即使具备很强的智能，也需要实验室、模拟器和求解工具。AI 智能体同样需要借助工具开展实验、仿真和数据处理。他表示，编程是智能体较早落地的领域，编译器或 Python 环境就能支持其中一些任务。随着智能体进入更多行业，需要调用的工具也将更加丰富，包括流体力学、量子化学和工业设计软件。大会播放的一段演示展示了这种工作方式。在达索系统相关演示中，AI 智能体根据工程要求，将大众高尔夫的车门设计调整用于途观，并调用设计与仿真工具测试方案。仿真发现振动问题后，设计智能体继续修改，最终由工程师审核并选择方案。按照黄仁勋的判断，工具公司未来将同时提供软件，以及经过专门优化、擅长使用这些软件的智能体。这一判断也是英伟达拓展业务的重要依据。黄仁勋在演讲中反复介绍其模型、计算平台和软件库，希望为智能体调用专业工具提供计算支持。现场演示呈现了这种技术路径，但并未给出其大规模部署后的成本与效率数据。相关阅读：《英伟达黄仁勋劝诫欧洲各国：别再对 AI 过度犹疑，否则将被时代甩在身后》《英伟达黄仁勋：AI 不会必然消灭某个职业，“10 年内 AI 毁灭人类”更是无稽之谈》《黄仁勋对 AI 公司放话：要求监管就不应获得反垄断豁免》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/016/125.htm", "publishedAt": "2026-10-21T13:43:08+00:00"}, {"title": "DeepSeek开源最新推理框架：单集群日吞吐155万亿Token，KVCache可保存7天", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/NBXP966Bz3eqr6Qidvaf?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-21T12:06:48+00:00"}, {"title": "从开源创新到全球增长 | 2026 上海开源软件应用创新大赛颁奖典礼暨创新增长大会", "summary": "10 月 30 日，以“从开源创新到全球增长”为主题的 2026 上海开源软件应用创新大赛颁奖典礼暨创新增长大会，将落地上海张江人工智能创新小镇。 2026上海开源软件应用创新大赛由开源中国主办，以“开源向实（Open Source, Real Impact）”为主题，面向全国征集优秀开源项目。自大赛启动报名以来，累计已收到报名项目 700 ...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503142", "publishedAt": "2026-10-21T11:45:10+00:00"}, {"title": "Mistral 发布 「图片形象」，传一张高清正脸自拍就能继续。 先说清楚边界...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503072", "publishedAt": "2026-10-18T02:07:54+00:00"}, {"title": "Jync v1.7.5 AI 配置接入本地模型（Ollama 预设 + 深度思考档位）", "summary": "Jync 捷同 是一个异构数据库实时同步工具。在异构数据库之间实时同步结构与数据的开箱即用 Web 应用：单个 jar 启动，浏览器点几下即可在内置 17 种数据库（另支持自定义类型）之间任意两种建立持续同步链路。增量检测默认轮询（零侵入），MySQL / Oracle / PostgreSQL / SQL Server 源库可切换日志 CDC 做到秒级延迟。S...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503068/jync-1-7-5-released", "publishedAt": "2026-10-16T15:54:00+00:00"}, {"title": "🔥 优化及缺陷修复：开源 AI 无代码平台 NocoBase", "summary": "汇总一周产品更新日志，最新发布可前往我们的博客查看。 NocoBase 目前更新包括三个分支： main、next 和 develop。** main： 截至目前最稳定的版本，推荐安装此版本。 next： 包含即将发布的新功能，经过初步测试的版本，可能存在部分已知或未知问题。主要面向测试用户，用于收集反馈和进一步优化功能。适合愿意提前体验...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503066/nocobase-updated", "publishedAt": "2026-10-16T14:09:13+00:00"}]}, {"label": "产品发布/更新", "items": [{"title": "通用汽车押注 AI、新型电池，目标令电动汽车研发周期减半", "summary": "IT之家 10 月 22 日消息，美国电动汽车市场经历剧烈调整之际，通用汽车再次强调仍看好电动汽车的未来。当地时间 21 日，通用汽车总裁马可 · 睿思在纽约举行的 GM Forward 活动上重申，公司不会放弃电动汽车业务，计划推出更符合美国市场需求的产品，进一步提升竞争力。睿思指出：“我们是一家全球性企业。全球每卖出四辆车，就有一辆是电动汽车，而且这一比例还会继续增长。我们不会退出电动汽车市场，而是会积极拥抱这一趋势。我们将继续研发电动汽车，努力降低电池成本。等到美国市场能够大规模接受电动汽车时，我们就能满足消费者的需求。我们在电池技术、电动汽车平台、软件、能源管理和先进制造领域的投入，都是在为电动化的未来投资。虽然我们眼下仍为消费者提供不同的动力选择，但这些投资证明，通用汽车发展电动汽车的长期承诺没有改变。”据IT之家了解，在当天的活动上，通用汽车公布了未来发展规划，既包括全面升级的电动汽车，也包括技术更加先进的燃油车。通用汽车计划缩短新车研发周期，开发采用更强计算架构的软件定义汽车，并推出用于多款跨界车型的第四代平台。借助 AI 和虚拟化技术，通用汽车有望将原本需要 4 至 5 年的新车研发周期缩短一半。该平台主要面向主流市场，将采用成本更低的富锂锰基电池。按照通用汽车的预期，富锂锰基电池有望同时降低制造成本和购车成本，价格与磷酸铁锂电池接近，能量密度则可媲美高镍电池。新一代车型所需的电池容量将比上一代减少 20%，车重也会进一步降低，同时采用集中式计算架构。今年 9 月，电动汽车占欧洲汽车销量的比例约为 30%，部分欧洲国家的电动汽车新车销量甚至超过燃油车。通用汽车在中国的经营经历也让公司看到了相同的趋势：中国市场对电动化车型的需求远超燃油车。尽管美国电动汽车市场暂时面临波动，通用汽车仍认为，电动汽车未来的重要性会不断提高。睿思透露，新车有望在“不久后”推出。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/016/180.htm", "publishedAt": "2026-10-21T23:47:52+00:00"}, {"title": "通用汽车安吉星服务将全面升级：引入 AI 助手，还能帮你控车、排障", "summary": "IT之家 10 月 22 日消息，据外媒 motor1 今天（22 日）凌晨报道，通用汽车将对旗下安吉星车联网服务进行全面升级，引入 AI 助手，让车主能够直接询问车辆信息、通过语音控制部分功能，还能借助 AI 排查车辆故障。全新的安吉星 AI 助手将在未来几个月通过 OTA 升级率先登陆 2027 款凯迪拉克锐歌（IT之家注：预计为海外市场），随后逐步覆盖凯迪拉克、雪佛兰、别克和 GMC 旗下的更多车型。通用汽车称，与通常用于导航、播放音乐和回答一般问题的传统语音助手不同，安吉星 AI 助手可以直接获取车辆信息。驾驶员只需用日常语言提问，不必再翻阅车主手册查找答案。安吉星 AI 助手还能通过语音控制车辆。例如，觉得车内太热时，驾驶员只需说一句“车里有点热了”，系统便会自动调节空调。此外，驾驶员还可以通过语音打开车内顶灯、电控手套箱，甚至电动车的充电口盖。电动车车主也可以利用安吉星 AI 助手规划充电。除了询问剩余续航里程能否支持车辆抵达目的地，驾驶员还可以让系统安排沿途的充电站停靠计划。通用汽车尚未打算让机器人包办所有事情。如果 AI 助手无法解决问题，驾驶员仍可转接安吉星人工顾问寻求帮助。通用汽车还计划在 2027 年推出新版安吉星手机应用，将旗下车联网服务集中到同一平台。雪佛兰、凯迪拉克、别克和 GMC 车主届时将不再需要各自的独立应用，现有的 OnStar Guardian 应用也将被取代。新版应用还将支持联网摄像头功能，并提供更灵活的隐私设置，让车主自行管理摄像头、麦克风和位置信息的访问权限。安吉星升级也是通用汽车整合数字服务计划的一部分。通用汽车希望让安吉星从原本以紧急救援为主的服务平台，发展成能够提供更多车辆管理功能的综合工具。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/016/175.htm", "publishedAt": "2026-10-21T23:17:09+00:00"}, {"title": "确认延期：华为鸿蒙 HarmonyOS 7 小艺 AI 快捷栏功能预计 11 月初分批推送", "summary": "IT之家 10 月 21 日消息，在今年 9 月 7 日的 HarmonyOS 7 | HUAWEI Mate XT 2 及全场景新品发布会上，鸿蒙 7 操作系统正式发布。在发布会现场，华为还剧透了全新功能 —— 小艺 AI 快捷栏。官方 PPT 页面显示，该功能开启后，小艺将在手机桌面底部的 Dock 栏常驻。本月早些时候，华为客户服务透露该功能预计在 10 月底逐步和大家见面。IT之家今日再次就该功能的上线时间进行了询问，对方表示：该功能预计将在 11 月初逐步和大家见面。届时会根据机型分批推送，请您留意系统更新提示。据华为客户服务介绍，小艺 AI 快捷栏是 HarmonyOS 7 的新功能，开启 AI 快捷栏后 AI 将在快捷栏显示，点击可探索更多 AI 服务。相关阅读：《华为鸿蒙 HarmonyOS 7 操作系统正式发布：全新空间美学设计语言，搭载系统智能体小艺》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/016/144.htm", "publishedAt": "2026-10-21T15:10:07+00:00"}, {"title": "黄仁勋发布 AI“预制工厂”DSX POD：最快 14 天部署投产，英伟达计划 2027 年初全球交付", "summary": "IT之家 10 月 21 日消息，英伟达 CEO 黄仁勋今日在德国柏林举行的 GTC 大会上宣布推出模块化 AI 工厂参考设计 DSX POD，面向以 Vera Rubin 平台为核心的完整 AI 工厂系统。英伟达表示，该方案将计算、网络、布线、机架供电、液冷管路安装及功能验证等工作提前转移至工厂完成，计划于 2027 年初通过合作伙伴在全球交付。DSX POD 的核心思路是将 AI 基础设施预先集成到“模块化集装箱”中，并在发货前完成系统集成与验证。设备抵达部署现场后，客户只需将其接入已经准备就绪的电力、冷却、网络等配套设施，即可开展后续部署。英伟达称，这种方式能够减少传统数据中心建设过程中复杂的现场施工、专业人员协调和物流工作，并降低现场安装错误及零部件交付延误带来的影响。英伟达表示，在部署场地及配套基础设施已经准备就绪的情况下，DSX POD 可将基础设施部署周期从传统方式的约 6 个月缩短至最短 14 天。黄仁勋表示，AI 工厂只有在开始产生 token 时才能创造价值，而不仅仅是在建设完成时。英伟达称，DSX POD 旨在缩短基础设施从现场准备就绪到开始运行生产级 AI 工作负载的时间，使运营商能够更早提供推理服务并获得收入。合作伙伴方面，英伟达正在与戴尔科技、惠普企业、联想、技嘉、鸿海旗下工业富联、和硕、广达旗下云达科技（QCT）、纬创、施耐德电气、维谛技术等企业合作，推动 DSX POD 的制造、集成和交付。英伟达表示，全球合作伙伴计划于 2027 年初开始交付相关 AI 工厂系统。相关阅读：《英伟达联合思灵推出人形机器人参考平台 Agile ONE SN，计划 2027 年初上市》《英伟达黄仁勋称未来电信运营商都将提供 AI 算力，电信基站有望发展成分布式 AI 网络》《奔驰与英伟达合作开发城市辅助驾驶系统 MB.DRIVE ASSIST PRO，计划年底在德国向部分用户开放》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/016/138.htm", "publishedAt": "2026-10-21T14:36:19+00:00"}, {"title": "谷歌 CEO 桑达尔 · 皮查伊：公司正牺牲云业务短期收入支持前沿 AI 研发，2027 年算力难以锁定", "summary": "IT之家 10 月 21 日消息，谷歌首席执行官桑达尔 · 皮查伊今日表示，公司正将部分算力从云业务转向前沿 AI 研发，以全力支持前沿 AI 发展。对谷歌而言，开发前沿 AI 成本高昂，需要耗费大量计算资源和芯片，但这些资源原本可以拿给云业务高价出售。皮查伊对此表示，将资源投入前沿人工智能研发是谷歌的“根本所在”。这名 CEO 还表示，若客户目前寻求锁定 2027 年算力，将面临极大困难，原因包括数据中心从决策到投运需两至三年，以及智能体任务需求激增。他解释称：“我们的云业务在任何特定时刻都能放弃短期收入，因为我们正做出计算方面的权衡，以支持前沿 AI 发展。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/016/137.htm", "publishedAt": "2026-10-21T14:31:01+00:00"}, {"title": "Agent 删库频频发生，几十年前就有的数据库防呆机制不管用了？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/2Z056Q54wWa6vAIQKsqJ?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-21T12:10:15+00:00"}, {"title": "Anthropic几乎停招初级员工！占比一年半骤降33%：Agent工时已是员工6倍", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/bTVDaYaUJy2OvNlyuHgz?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-21T12:01:59+00:00"}, {"title": "Meta Muse 分享对话可被陌生人找到：标题写进 URL、一次 DNS 查询全暴露", "summary": "Meta 的 AI 助手 Muse 刚上线就撞上隐私问题：用户分享的对话，能被陌生人轻易找到。Meta 已经暂停了分享功能，理由正是安全公司 Claroc 的报告——他们枚举出了 6,800 个 Muse 用户创建的分享链接，打开其中几百个就看到了个人和商业机密。 问题出在一个看似细节的设计决策上。Muse 的分享链接域名是 cf.metaaiusercon...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503140/meta-muse-exposes-users-personal-when-they-share-conversations", "publishedAt": "2026-10-21T10:35:57+00:00"}, {"title": "美团企业级 Agent 的平台化应用实践｜QCon上海", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/BQJltkL1FJ9AG3 I硬件出海，别当“背景板”，GTC2026 Shanghai「AI硬件专区」邀你占位", "summary": "2026 年 11 月 4 日至 5 日，GTC2026 全球流量大会（上海）将在上海世博展览馆 H3 馆举办", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/10/504372.html", "publishedAt": "2026-10-20T04:08:15+00:00"}, {"title": "我向新版 DeepSeek 许了个愿，4 块钱让特斯拉飞起来", "summary": "好用到原地「起飞」#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1684880?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-10-19T09:21:16+00:00"}, {"title": "实测 Lovart 2.0 ，设计 AI 进入个人助理时代", "summary": "你下班了，Arti 还能继续工作#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1684840?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-10-19T02:53:15+00:00"}]}, {"label": "论文研究", "items": [{"title": "苹果首款折叠 iPhone Duo 海外媒体评价汇总：外屏处理琐事，内屏留给沉浸", "summary": "IT之家 10 月 22 日消息，苹果首款折叠 iPhone Duo 将于明日（10 月 23 日）正式发售，相关媒体评论已于昨日解禁，IT之家简要汇总这些媒体和头部自媒体的评价和反馈。相比较 9 月发布会后的现场初步体验，本次评价更加深入拍照、续航等方面。一、The Verge：不够成熟，却让人看见未来评测编辑：Nilay Patel 和 Allison Johnson简要评语：它价格昂贵、功能妥协，而且用起来有时会让人恼火。用完 Duo 后，换回我们常用的平板手机完成一些工作，常常感觉如释重负。有时候，你对 iPhone 的要求很简单：该做什么，就好好做什么。苹果这些年不敢轻易改动 iPhone，道理也在这里。但 Duo 的冒险和古怪，也恰恰带来了乐趣。那些最值得尝鲜的新设备，总有这种吸引力。作为产品，它还没打磨到位；作为一个构想，它却已经足够清晰，让人看见接下来的方向。这让人想起初代 MacBook Air。它刚问世时，根本没掀起什么风浪。苹果后来推倒重来，才终于找准方向。再后来，它席卷了整个行业。二、Gizmodo：折叠了机身，没有折损性能评测编辑：Raymond Wong简要评语：我上个月刚评测过 iPhone 18 Pro 和 18 Pro Max。换到 iPhone Duo 之后，整体性能并没有明显下滑。它搭载同一款 A20 Pro 芯片：同样的 6 核 CPU、7 核 GPU，以及双 16 核神经网络引擎。它没有重演 iPhone Air（对比 iPhone 17 Pro）的那种妥协。Air 少了一颗 GPU 核心，机身又太薄，还缺少均热板帮忙散热。持续高负载运行时，热量一上来，性能就得往下收。Duo 则用均热板稳住了散热。它的均热板虽然没有 iPhone 18 Pro 系列那么大，但应用一旦调动全部 CPU 和 GPU 核心，它依然能有效压住温度，避免卡顿和降速。苹果称，这套散热设计可帮助 Duo 将持续性能提升至比 iPhone 17 Pro 高出最多 35%。跑分也印证了这种流畅感。我使用 Geekbench 7 测试 CPU 和 GPU 性能，取三次测试的平均值。iPhone Duo 与 iPhone 18 Pro 的成绩几乎一致：单核约 4,002 分，多核约 10,728 分。GPU 成绩也基本相同，约为 60,608 分。我又给 Duo 最直接的安卓对手 Galaxy Z Fold 8 跑了同样的测试。它搭载 Galaxy 专属版骁龙 8 Elite Gen 5，单核只跑出 3,112 分；多核倒是咬得很紧，拿下 10,438 分。GPU 就逊色得多，只得到 17,331 分。按这些成绩计算，Z Fold 8 的单核性能落后 22%，GPU 性能更落后了足足 71%。三、WIRED：屏幕展开了，应用还没跟上评测编辑：Julian Chokkattu简要评语：过去一周，我总在琢磨同一个问题：这么多屏幕空间，怎么就白白浪费了？有时候，我真想问问苹果：为什么要把 iOS 的导航控件全搬到右侧边栏？有些应用留下的空白，实在太多了。可一旦打开真正用足这片空间的应用，我又觉得满意了。这大概就是我的结论：想尝试苹果的第一款折叠屏手机，不妨再等几个月。给开发者一点时间，先把应用适配做好。四、CNET：外屏处理琐事，内屏让人沉浸评测编辑：Abrar Al-Heeti简要评语：Duo 的外屏只有 5.4 英寸，小巧归小巧，用起来却不局促。直板手机能做的事，我在这里几乎都能轻松完成，只不过画面缩小了一号。键盘占了外屏大约一半的面积，按键排得足够宽，打字顺手又轻松。输错字的次数，也没比平时多。查看一封邮件、发条消息、叫辆 Uber，或者随手拍张照 —— 这些不太费神的事，我通常直接用外屏解决。遇到需要多花些时间、投入些精力的任务，我就展开 Duo，切换到 7.6 英寸的内屏。比如在 Google 文档里处理文件、看 YouTube 视频、播放流媒体、翻看相册，或同时处理几件事。用 Duo 的哑光屏幕阅读，确实是一种享受。眼睛看着更舒服，到了户外也是如此。屏下 FaceTime 摄像头也帮了忙：不用它通话或拍照时，它几乎隐去踪迹。画面不再被一个醒目的黑洞打断，内容也就更容易让人沉浸其中。五、9to5Mac：指纹解锁依然可靠，却得重新适应评测编辑：Chance Miller简要评语：用上 iPhone Duo，最难适应的，恐怕就是从 Face ID 换回 Touch ID。我早已习惯看一眼 iPhone 就解锁。如今却得特意伸手去找侧边按钮，难免觉得退了一步 —— 哪怕 Touch ID 识别得又快又准。不过，它也有一个让我喜欢的优势：手机平放在桌上时，Touch ID 好用多了。不必拿起手机，让 Face ID 识别人脸；把手指搭上传感器，就能直接查看锁屏上原本隐藏的通知内容。Duo 也支持通过 Apple Watch 解锁。开启后，只要戴着的 Apple Watch 已设置密码、并处于解锁状态，在 Duo 的锁屏上向上一滑，手机就会自动解锁。刚开始的几天，我刻意没开这个功能。毕竟，近十年没再用过配备 Touch ID 的 iPhone，我想重新体会一下。最后，我还是打开了 Apple Watch 解锁。体验确实顺畅了不少。六、Tom's Guide：续航超过三星折叠屏，仍不及 Pro Max评测编辑：Mark Spoonauer简要评语：Spoonauer 将屏幕亮度固定在 150 尼特，让手机通过 5G 网络持续浏览网页，直到电量耗尽。iPhone Duo 坚持了 13 小时 20 分钟，超过 Galaxy Z Fold8，但仍追不上 iPhone 18 Pro Max。机型测试续航iPhone 18 Pro Max17 小时 31 分钟iPhone Duo13 小时 20 分钟三星 Galaxy Z Fold810 小时 6 分钟七、PetaPixel评测编辑：Jaron Schneider简要评语：iPhone Duo 是一款做工精良的设备，尤其对于第一代产品而言更是如此。但我认为它并没有解决 iPad 尚未解决的任何问题，反而重新拾起了 iPhone 早已克服的旧问题。画质是妥协项，4800 万像素主摄和超广角能满足日常记录，但主摄经不起细看，弱光表现平平；超广角也缺乏惊喜，整体不及 Pro 系列。没有独立长焦，不支持 ProRAW 和 ProRes Log；不过追踪对焦可靠，评测中迎面跑来的狗也能张张合焦。修图比拍照更讨喜，合上拍握持别扭，展开拍又像举着小平板，最好双手操作；反而大内屏运行 Lightroom、Afterlight 时，查看细节和调整照片的体验尤其出色。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/016/184.htm", "publishedAt": "2026-10-22T00:08:01+00:00"}, {"title": "SpaceX 与特斯拉若合并，马斯克财富有望增加 1100 亿美元", "summary": "IT之家 10 月 22 日消息，埃隆 · 马斯克（Elon Musk）在昨日 SpaceX 财报电话会议上引发舆论关注，他证实 SpaceX 与特斯拉公司已各自成立特别委员会，研究两家企业合并的可能性。马斯克表示：“我们差不多正处在超级智能奇点阶段，双方合作能收获巨大价值。”如果合并落地，马斯克本人也可能获得可观收益。彭博亿万富豪指数测算，若合并交易达成，特斯拉部分股份的归属期限将会提前，可为马斯克的财富增加逾 1,100 亿美元（IT之家注：现汇率约合 7,360.45 亿元人民币），这批股份原本要到 2028 年才完成归属。同时，根据交易中特斯拉的估值，他 2025 年的薪酬方案还能解锁更多价值数十亿美元的权益，而无需达成原本要求的经营目标才能拿到这笔报酬。受合并谈判消息以及 SpaceX 亮眼的季度财报推动，两家公司股价上涨，马斯克的个人财富在周三暴涨超 600 亿美元（现汇率约合 4,014.79 亿元人民币）。宏大目标现年 55 岁的马斯克去年在特斯拉拿到了一份创纪录薪酬方案，如果全部兑现，价值接近 1 万亿美元（现汇率约合 6.69 万亿元人民币）。这份为期十年的方案设定了极具挑战性的业绩目标，包括交付 100 万台擎天柱机器人、投放 100 万台自动驾驶出租车投入商业运营、整车年销量达到 2000 万辆。配套目标还包括市值区间，目标设定在 2 万亿至 8.5 万亿美元（现汇率约合 13.38 万亿至 56.88 万亿元人民币）之间。目前所有经营指标与市值目标均未完成。和大多数高管薪酬计划一样，马斯克的这份方案设有控制权变更条款。如果合并后，特斯拉原有股东在存续主体或母公司中拥有的投票权不足 50%，该条款就会被触发。目前 SpaceX 估值大约比特斯拉高出三分之一，因此该结果存在可能性，但最终取决于交易架构。一旦条款触发，原定的经营考核目标将不再生效，马斯克的报酬将按照交易中特斯拉的市值核算。这意味着，若合并交易中将特斯拉估值定为 2 万亿美元（现汇率约合 13.38 万亿元人民币），也就是首个市值目标线，马斯克就能解锁净值超 60 亿美元（现汇率约合 401.48 亿元人民币）的股份。特斯拉当前市值约 1.5 万亿美元（现汇率约合 10.04 万亿元人民币）。乔治城大学麦克多诺商学院会计学副教授杰森 · 施洛策（Jason Schloetzer）表示：“控制权变更条款在技术层面是否触发，取决于交易如何设计。但双方股东应当意识到，马斯克的激励诉求会倾向于推高交易的名义估值，股东需要关注特别委员会会如何应对这一点。”按照现有方案，马斯克拿到奖励股份后五年内不得出售，但控制权变更事件也存在例外情形。股份加速归属马斯克更大的收益可能来自其 2018 年特斯拉薪酬奖励的股份加速归属。马斯克最初这份“登月级”薪酬方案授予他约 3.04 亿份期权，需要特斯拉达成相应市值和经营目标，而这些目标当时都已完成。今年早些时候，马斯克与董事会协商敲定了执行方案，允许他以净额结算期权，降低行权缴税所需的现金压力。作为交换，他最终获得的约 2.86 亿股股份要等到 2028 年 1 月才完成归属，以此激励他继续留在公司。但一旦发生控制权变更，这批股份将立刻完成归属。除此之外，股份归属后还有五年锁定期。不过协议写明，控制权变更事件存在例外，马斯克也有望提前出售。这批股份当前价值超过 1,100 亿美元（现汇率约合 7,360.45 亿元人民币），由于尚未归属，彭博富豪指数在计算马斯克当前净资产时并未计入这部分资产。SpaceX 薪酬安排马斯克在 SpaceX 还有两套薪酬方案，受本次交易影响的可能性相对较低。这家火箭与人工智能企业授予他最高 13 亿股限制性股份，兑现条件包含市值目标，以及和火星人类聚居地、规划中的太空数据中心算力相关的运营指标。董事会可以根据并购情况调整市值考核目标，此前 SpaceX 收购马斯克旗下 AI 初创企业 xAI 后，董事会就做过相应调整。这说明，如果和特斯拉合并，董事会很可能再次调整目标，避免这笔交易人为降低考核难度。但考虑到马斯克大部分特斯拉薪酬权益可能失效，且没有和特斯拉传统业务绑定的明确考核目标，SpaceX 董事会或将面临压力，需要为这位创始人设计新的薪酬方案。施洛策称：“从两家公司过往发放巨额股权奖励的历史来看，这件事几乎是必然。合并后的公司董事会将再次面对一个熟悉的理由：需要授予新的股权奖励，留住马斯克，让他持续投入工作。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/016/183.htm", "publishedAt": "2026-10-22T00:02:39+00:00"}, {"title": "24 小时为你在线打工：Anthropic 推出 Claude Duet AI 智能体，迎战 Meta 和 OpenAI", "summary": "IT之家 10 月 22 日消息，Anthropic 昨日（10 月 21 日）宣布以研究预览版形式，推出全新应用 Claude Duet，定位为可主动工作的 AI 智能体（agent），加入由 Meta 的 Muse、以及 OpenAI 的 Dots 领衔的“全天候主动型 AI 助理”大战。技能方面，该应用会每天整理跨应用的重要事项、主动提醒需要处理的问题，并在用户离开后继续在后台完成被委托的任务。IT之家附上演示视频如下：Claude Duet 基于 Claude Opus 5.5 构建，提供 iOS、Android 独立应用及 claude.ai 网页版。首批面向美国 Pro 和 Max 订阅用户开放候补名单；预览阶段与 Claude 其他功能共享套餐用量限制。不同于普通聊天机器人，Claude Duet 拥有独立虚拟机和浏览器，可在用户设备关闭时持续运行。用户可用文字或语音下达任务，例如安排会议、整理未读邮件、追踪发票、制作财务或销售预测、搭建仪表盘、开发网页应用等；任务完成后，它会通知用户或请求审核。在工具生态方面，Claude Duet 可调用 Claude Marketplace 中超过 6,000 个连接器和插件，覆盖 Gmail、Slack、QuickBooks、Stripe、Gusto、LinkedIn、HubSpot、Canva、Shopify、DocuSign 等常见办公与商业服务。它还能通过 Link 或 Shop Pay 完成经用户确认的线上支付，并使用虚拟卡避免泄露真实卡号。安全设计方面，Anthropic 表示，Claude Duet 不会直接接触用户密码或登录 tokens；发送消息、付款、签署文件或删除内容前，必须获得用户批准。系统还配备专门分类器，拦截信用卡号、政府身份证件等高敏感信息的泄露请求。不过，Anthropic 也坦承这仍是早期版本：Claude Duet 可能误读对话、误判事项紧急程度；个人事务处理能力相对较弱，且暂不能向用户展示其浏览器操作过程。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/016/169.htm", "publishedAt": "2026-10-21T22:44:18+00:00"}, {"title": "17岁Kimi前研究员陈广宇被曝投奔Jeff Dean创业团队，新公司正寻求500亿美元估值", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/yH0DHL8Nil26ES43TeF1?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-21T14:39:11+00:00"}, {"title": "OpenAI 联手 PerturbAI：让近 2000 个 AI 智能体一起搞科研，加速新药研发", "summary": "北京时间 10 月 21 日，生物技术公司 PerturbAI 宣布与 OpenAI 合作的最新进展。双方联合斯克里普斯研究所（Scripps Research）开发了一套 AI 推理框架，通过近 2000 个 AI 智能体并行工作，帮助科学家分析复杂生物实验数据、检索文献，并提出可供后续实验检验的假说。据 PerturbAI 介绍，这套系统在分析其全脑基因组图谱时，用 32 分钟完成数据分析与研究发现整合。公司估计，如果由人类按串行方式开展分析和文献审阅，相关工作可能需要数月至一年。这一时间对比来自公司估算，并非与人类团队开展的同期对照测试。在具体流程中，AI 智能体分别分析细胞反应、搜索科学文献，将实验结果与已有生物学知识联系起来，再汇总形成“推理图谱”，串联基因、细胞反应、既有研究及可能的生物学机制，为科学家提供进一步调查的线索。研究团队还邀请生物学专家，从新颖性、证据支持程度、后续研究优先级和置信度等方面评估报告。在与单个 AI 智能体生成报告的盲评比较中，专家有 75% 的时候更偏好多智能体系统给出的解释。这一结果反映的是专家对报告的偏好，不能直接理解为研究结论的准确率。此次分析使用的数据来自 PerturbAI 今年 3 月公布的全脑 CRISPR 图谱，涵盖约 800 万个细胞。公司称，该图谱在数月内生成，目前下载量已超过 4 万次。此后，PerturbAI 还构建了覆盖代谢疾病和衰老研究的专有图谱。双方的合作已持续约一年，接下来将利用 PerturbAI 在活体系统中生成的因果生物学数据，联合开展新药靶点发现。相关成果已通过联合预印本和博客公布，目前披露的结果主要涉及数据解读及研究假说生成，所提出线索仍需后续实验验证。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/016/134.htm", "publishedAt": "2026-10-21T14:16:44+00:00"}, {"title": "AI时代，神话并未消失：人类正在创造新的“数字神明”", "summary": "一、引言：当算法开始回答神谕式问题 在过去的几年里，一个越来越常见的场景开始出现：当人们面对复杂的人生问题或难以理解的世界变化时，他们不再首先询问宗教、哲学家或传统专家，而是打开一个人工智能系统。 他们向 AI 提问： 我应该选择什么职业？ 这个研究方向是否值得继续？ 未来社会会变成什么样？ 人类意识究竟是...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503123", "publishedAt": "2026-10-21T01:59:21+00:00"}, {"title": "DeepSeek V4.1 Flash 更新：“许愿式编程”成真 + 搜索 API 开放", "summary": "DeepSeek 更新了 V4.1 Flash，版本号 1017。这次的更新有两个看点：「许愿式编程」从零建项目的能力提升，以及自研搜索 API 正式开放——后者对用 DeepSeek API 做应用的开发者影响更直接。 先看性能。官方说这是「性能-费用的帕累托改进」：基准测试全面提升的同时，缩短了任务运行时间和输出长度——也就是跑得更快、输...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503080", "publishedAt": "2026-10-19T02:37:42+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "从试点到规模化落地：制造业领导者如何推动 AI 应用并赢得高管层支持 ｜ 技术趋势", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/Ms3bMt5OcUyYMHwfaXgM?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-21T18:00:00+00:00"}, {"title": "推动 AI 规模化落地的三大经验：来自公共部门领导者的实践洞察 ｜ 技术趋势", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/GVcxHscrQqv9HXGRowJh?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-21T15:19:41+00:00"}]}]};

const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
