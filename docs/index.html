<script>
const DATA = {"date": "2026-08-08", "generatedAt": "2026-08-07T23:30:02Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "新 AI 预估全球冰川蕴藏约 15 万立方千米的冰，融化可抬升海平面 32.3 厘米", "summary": "IT之家 8 月 8 日消息，科技媒体 phys 今天（8 月 8 日）发布博文，报道称科学家通过构建 AI 模型 IceBoost v2.0，估算出全球冰川约含 15 万立方千米的冰，若全部融化、在不计南极和格陵兰的情况下，会抬升全球平均海平面 32.3 厘米。该项目由威尼斯大学牵头，意大利国家研究委员会极地科学研究所参与合作，训练构建了名为 IceBoost v2.0 的模型，从而系统性估算全球冰川的冰量。该模型由威尼斯大学、并隶属 CNR-ISP 的物理学家兼研究员 Niccolò Maffezzoli 带领开发，用超过 700 万条来自全球冰川的冰厚测量数据训练，再结合地形坡度、曲率、冰流速度和温度等 26 个物理与几何变量，按点重建冰厚，从而估算每条冰川的体积。该冰川目录覆盖全球最新的冰川分布，但不包括南极和极地冰盖。结果显示全球冰川蕴藏着约 15 万立方千米的冰，如果全部融化（不包括南极洲和格陵兰岛），相当于全球平均海平面上升 32.3 厘米。研究团队表示，这一总量与既有全球估计基本一致，但 IceBoost v2.0 对冰川空间分布的描绘更接近真实情况，与实地观测的匹配度最高提升 40%。这项研究对未来气候模拟和淡水管理都有意义。GlacierMIP4 的研究人员将把 IceBoost v2.0 作为现代表述，用于下一代冰川模拟，并支撑 IPCC 对冰川演化的评估。论文作者称，冰川为河流、生态系统、农业和当地社区提供水源，影响全球约有 19 亿人。更准确的冰厚与冰量估计，有助于提高对未来淡水供应的预测，尤其是在南美部分日益干旱和沙漠化的地区。IT之家附上参考地址Niccolò Maffezzoli et al, Machine-learned global glacier ice volumes, Scientific Data (2026). DOI: 10.1038/s41597-026-07744-9", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/987/225.htm", "publishedAt": "2026-08-07T23:22:41+00:00"}, {"title": "OpenAI：因网络安全风险，延缓 Astra 模型发布", "summary": "IT之家 8 月 8 日消息，OpenAI 表示，内部与专家评估显示，即将发布的模型 Astra 在智能体编程和网络安全领域取得重大突破。根据其《准备框架》（Preparedness Framework），Astra 已被列为 OpenAI 旗下首个在网络安全领域达到“关键”（Critical）风险级别的模型。IT之家注：根据该框架，AI 模型满足以下任一条件即触及“关键”门槛：无干预挖掘零日漏洞：无需人类干预，即可在多个经过安全加固的真实关键系统中，识别并开发出涵盖各严重等级的有效零日漏洞利用程序。自主发起端到端攻击：仅需提供高层级战略目标，即可针对加固目标自主构想并实施全新的端到端网络攻击。OpenAI 特别强调，Astra 是一款尚未发布的模型，并未参与此前针对 Hugging Face 的网络攻击事件。为确保后续开发安全合规，OpenAI 宣布已采取多项管控措施：对高能力模型及相关研发活动实施更严格的安全控制，包括设置隔离测试环境、限制网络与工具访问权限、强化模型权重保护与加密、部署额外的监控与检测能力，以及实施沙箱化运行；并暂停内部所有尚未满足上述强化安全标准的 Astra 相关活动。对 Astra 的所有智能体应用（包括训练和评估阶段）实施了涵盖高风险行为与对齐失效的全局监控。通过评估模型思维链（CoT）审查并拦截高风险操作。与相关政府机构以及指定的 AI 安全组织合作，共同测试该模型；向第三方测试合作伙伴提供推荐的安全控制规范，以确保更高风险的评估与工作负载能够在安全状态下运行。OpenAI 首席执行官萨姆 · 奥尔特曼（Sam Altman）随后表示，Astra 是一款性能强劲的模型，我们正在全力推进它的公开发布。我们始终认为，把顶尖模型局限在少数人手里并不是个好策略。不过鉴于它在网络安全方面的强大能力，我们还需要一点时间来确保万无一失。希望大家不用等太久！", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/987/221.htm", "publishedAt": "2026-08-07T23:08:56+00:00"}, {"title": "蚂蚁开源Avernet，为多智能体协作搭建“操作系统”！内部跑通12大业务、任务完成率超90%", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/iNvHOsahsYFYaE9ImZBV?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-07T18:16:44+00:00"}, {"title": "蚂蚁集团开源Avernet：破解多智能体“找不到、对不齐”协作难题", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/B6WtPNGNH0d5LolB1ED2?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-07T18:06:25+00:00"}, {"title": "Anthropic 为自研 AI 芯片开出高薪，模型训练岗位薪资高于实际造芯工程师", "summary": "IT之家 8 月 7 日消息，据 Wccftech 今日报道，Anthropic 目前正在扩大内部芯片设计团队，并计划开发自研 ASIC 芯片。与此同时，公司不同芯片相关岗位之间出现了明显的薪资差异：负责训练 AI 模型进行芯片设计的研究工程师岗位，年薪最高可达 85 万美元（IT之家注：现汇率约合 574.9 万元人民币），而实际负责设计 Anthropic 首款 ASIC 芯片的工程师岗位，薪资范围约为 32 万至 48.5 万美元（现汇率约合 216.4 万至 328 万元人民币）。Wccftech 称其为“薪酬倒挂”。Anthropic 发布的招聘信息显示，负责“Chip Design RL（芯片设计强化学习）”方向的研究工程师岗位，主要工作是构建强化学习环境，让 Claude 等 AI 模型学习芯片设计流程，包括 RTL 代码生成、验证以及物理设计优化等内容。该岗位薪资范围为 50 万美元至 85 万美元（现汇率约合 338.2 万元至 574.9 万元人民币）。相比之下，负责实际芯片设计工作的 Silicon Engineer 岗位薪资范围约为 32 万美元至 48.5 万美元（现汇率约合 216.4 万元至 328 万元人民币）。Wccftech 指出，两类岗位所需技能存在较高重合度，包括完整 ASIC / FPGA 设计流程、RTL 到流片、UVM 与形式化验证、物理设计、PPA（性能、功耗、面积）优化、DFT（可测试性设计）以及 EDA 工具使用经验等，同时都要求具备实际芯片开发经验。目前，Anthropic 尚未公布首款自研 ASIC 芯片的具体规格、制造合作方或发布时间。公司此前表示，其芯片战略将采用多芯片路线，以满足人工智能模型训练和推理需求。AI 企业利用人工智能辅助芯片设计并非首次出现。此前，月之暗面推出的 Kimi K3 模型曾被报道能够在较大程度自动化完成芯片设计流程。该模型利用开源 EDA 工具并自行构建 GPU 编译器，在 48 小时内完成一款模拟芯片设计方案，面积约 4mm²，采用 Nangate 45nm 工艺库，并在仿真环境中实现超过 8700 tokens/s 的解码吞吐量。相关阅读：《Anthropic 首次确认自研 AI 芯片：专为 Claude 定制，公司正在组建团队》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/987/218.htm", "publishedAt": "2026-08-07T15:25:46+00:00"}, {"title": "AI 需求挤爆云计算，消息称 AWS 要求工程师关闭闲置服务器减少资源浪费", "summary": "IT之家 8 月 7 日消息，据《The Information》今日报道，亚马逊 AWS 最近对工程师提出一项颇为“朴素”的要求，让他们关闭不再使用的云计算机。据报道，亚马逊此番要求主要针对闲置的 EC2 实例。随着 AI 正以越来越快的速度消耗计算资源，全球最大的云服务供应商也开始感受到算力紧缺的压力。数据显示，AWS 的资源利用低下问题非常严重，大约 65% 的 EC2 实例在 30 天测量周期内，平均 CPU 利用率低于 20%。亚马逊为此升级了计算优化器（IT之家注：Compute Optimizer），自动分析 14 天内的服务器 CPU 使用率和 IO 数据，并标记峰值 CPU 利用率低于 15%、网络流量非常低的虚拟机。同时，AWS 过去一年内新增了 3.8 吉瓦的电力容量，足以为 280 万户家庭提供电力。亚马逊当前计算资源紧张的原因非常明确，搭载 GPU 的云计算实例是训练、运行大语言模型的核心资源。如今的 AI 热潮，已经让云计算市场竞争激烈。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/987/217.htm", "publishedAt": "2026-08-07T15:25:06+00:00"}, {"title": "最高节省 85% 成本：微软公布 AI 智能体 LLM 路由方案", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/HQD432MKSXMMR2UUag6P?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-07T15:00:00+00:00"}, {"title": "DeepSeek要涨价，小扎立马“拼命”：Meta新模型打出更低“骨折价”，只要一点数据税", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/5DEAabOIcvRrEMhAbCyz?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-07T13:33:35+00:00"}, {"title": "Meta 旗下 AI 模型测试时意外入侵第三方企业系统", "summary": "IT之家 8 月 7 日消息，据路透社报道，Meta 公司于当地时间周三表示，公司一款 AI 模型在网络安全测试期间入侵了另一家企业的系统，引发人们对前沿 AI 模型的担忧。IT之家从原报道了解到，本次事件发生的主要原因在于，为 Meta 提供网络安全评估服务的独立公司 Irregular 因配置错误，使 Meta 的模型在测试过程中意外获得了互联网访问权限。据消息人士透露，本起事件的涉事模型是 Muse Spark 1.1。Meta 曾号称，该产品是现实编程、智能体任务最出色的模型之一。Irregular 发言人对此表示，本起事故与 Anthropic 披露的 AI 模型逃逸事件类似，不涉及沙箱逃逸、高级网络攻击行为。如今美国立法者正在担忧，越来越强大的 AI 模型是否会冲出人类设定的边界，用于实施或发动网络攻击。一批共和党总检察长已要求 OpenAI 保留 Hugging Face 入侵事件的相关文件。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/987/195.htm", "publishedAt": "2026-08-07T13:18:50+00:00"}, {"title": "OpenAI 宣布为 GPT-5.6 Sol 调优，并让免费用户无限用 Luna", "summary": "OpenAI 今天更新了 ChatGPT 的模型矩阵，包含两个重要变化：GPT-5.6 Sol 调优了回复风格和事实准确性，GPT-5.6 Luna 对免费用户开放了无限文本聊天和一个\"Think\"按钮。 先说重点数据。 在新的内部评估中，金融、医疗和法律三类需要事实准确性的 prompt 上，GPT-5.6 Luna 的回复包含至少一个事实错误的概率比 GPT-5.5 In...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/490138/improving-gpt-5-6-sol-in-chatgpt", "publis 6-08-07T14:24:50+00:00"}, {"title": "撤回的撤回：微信已支持删除“你撤回了一条消息”灰色小字", "summary": "IT之家 8 月 7 日消息，“微信时刻”官方公众号今日发文，宣布微信现在可以“撤回”你的撤回了。简单来说，微信用户现在可以删除消息撤回后留在聊天界面中的撤回提示词。此前，用户在聊天中撤回消息后，聊天框内会留下一行灰色小字提示“你撤回了一条消息”，该提示无法被手动清除。更新后，用户只需长按这行提示文字，即可选择“删除”，使自己的对话界面恢复干净。需要注意的是，该操作仅能删除自己页面中的撤回提示，对方界面中的提示字依然存在。此次更新还引发了用户对微信撤回规则的整体回顾。目前微信撤回功能覆盖多个场景：发送文字消息后，在 2 分钟内长按消息可选择撤回，撤回后 5 分钟内点击“重新编辑”，原内容会返回输入框供修改后重发；若连续发送多条错位消息，可长按其中任意一条并选择“撤回本次发送的全部消息”，实现批量撤回。在拍一拍场景中，用户不慎触发“拍一拍”后，可在 2 分钟内长按该条提示进行撤回，且对方界面不会显示任何撤回记录，实现无痕撤销。文件撤回方面，Word、Excel、PPT、PDF 及压缩包等文件类型在发送后 3 小时内均可撤回。IT之家注：若用户希望发送高重要性照片，可通过聊天界面“文件”入口发送，该方式同样适用于 3 小时内撤回规则，而直接通过相册发送的照片则不在此撤回规则覆盖范围内。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/987/203.htm", "publishedAt": "2026-08-07T14:18:06+00:00"}, {"title": "壹号掌机 X2 Mini Pro 国行上市：AMD 锐龙 AI Max+ 388，预售 15599 元起", "summary": "IT之家 8 月 7 日消息，壹号本旗舰掌机 X2 Mini Pro 国行版本现已在电商平台开启预售（预售立减 2000 元），8 月 23 日开售，IT之家汇总价格如下：48GB+1TB 标准版 17599 元64GB+1TB 标准版 19999 元64GB+2TB 标准版 20999 元外接水冷：加价 500 元磁吸键盘 599 元手柄基架 399 元电池便携底座 199 元电池延长线 99 元京东壹号本 OneXPlayer 游侠 X2 Mini Pro 游戏掌机 48GB+1TB 标准版 17599 元直达链接2026 年数码家电政府补贴持续进行中，IT 之家为大家汇总国补领券地址，买数码家电之前记得领取。数码补贴：点此领券手机 / 平板 / 3C 数码支持 8.5 折政府补贴，不超过 6000 元的产品至高立减 500 元。家电补贴：点此领券多类家电支持 8.5 折政府补贴，单品至高补贴 1500 元。欢迎下载最会买 App - 好货好价，高额返利，1 毛钱也能提现！扫描二维码或点击此处下载最新版（自动识别平台）。这款机型此前已在 2026 年 ChinaJoy 展会上进行线下首次公开亮相，搭载 AMD 锐龙 AI Max+ 388 处理器，采用 8 核心 16 线程设计，最高睿频 5GHz。GPU 部分完整保留 40 个计算单元的 Radeon 8060S 架构。内存为 256bit 位宽的高带宽 LPDDR5X 内存。整机本地 AI 总算力达 118 TOPS。该机配备 8.8 英寸 144Hz OLED 屏幕，支持可变刷新率（VRR）。机身采用可拆卸手柄设计，支持外接磁吸键盘，可在掌机、平板、笔记本三种形态间自由切换。机身配备微动按键、RGB 电容摇杆和双段式扳机。重量方面不含电池为 799g，电池约 380g。内置 85Wh 可更换电池。散热方面提供风冷标准版与水冷版两种选择。水冷版本可外接 Frost Bay 水冷底座，水冷下整机性能释放可达 120W，掌机模式为 80W。存储方面标配 1TB 或 2TB 内置存储空间，并可扩展至 4TB。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/987/192.htm", "publishedAt": "2026-08-07T13:04:00+00:00"}, {"title": "Suno 平台将为 AI 生成音乐添加隐水印，防止滥用现象发生", "summary": "IT之家 8 月 7 日消息，据科技媒体 Engadget 今天报道，Suno 将为平台内生成的 AI 音乐添加隐藏式水印。目前该公司正面临多起法律纠纷，音乐行业也在不断对其施压。IT之家从原报道获悉，Suno 将为平台内的 AI 歌曲采用新型音频水印和指纹识别技术，当歌曲被上传到其他平台时，用户可以知道该音乐是否由 Suno 生成。同时 Suno 还将设置下载限制，解决 AI 音乐在各大流媒体平台被反复上传的问题。此举出台之际，索尼音乐、环球音乐和华纳音乐等巨头组成联盟，要求 AI 垃圾歌曲禁止进入全球音乐排行榜。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/987/190.htm", "publishedAt": "2026-08-07T12:49:49+00:00"}, {"title": "微软 Copilot 新版图标泄露，趋向扁平化、设计更简洁", "summary": "IT之家 8 月 7 日消息，微软 Copilot 新版图标最近在 Edge Canary 测试版浏览器中意外曝光。新图标设计更加简洁，趋向扁平化。据 X 平台用户 @Leopeva64 本周二透露，该图标最初源于 Edge Canary 测试版浏览器的“Edge Icon Refresh”标记，暗示微软正在测试新版图标。随后该图标又短暂出现在 Canary 版 Edge 的某些菜单中，但后续被微软移除。同时，X 平台用户 @minto494 也发现，新版 Microsoft 365 办公应用也出现了新版 Copilot 图标。从网友分享的图片可以看到，这个新图标主打简洁设计语言，它的颜色、形状与现在的 Copilot 没有什么不同，但是去除了 3D 阴影效果，变得更加扁平。考虑到科技界如今大力推崇扁平化趋势，微软的这种动作并不让人意外。不过IT之家需要指出的是，我们目前仍然无法明确这款新图标的正式上线时间，一切还要等微软官宣。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/987/164.htm", "publishedAt": "2026-08-07T10:52:07+00:00"}, {"title": "内置 10TOPS INT8 算力：韩 Mobilint 推出 USB AI 加速器 MLD-R1", "summary": "IT之家 8 月 7 日消息，韩国 NPU 企业 Mobilint 今日推出了 USB 外接设备形态的边缘 AI 加速器设备 MLD-R1。这一产品基于其 REGULUS AI SoC，提供 10TOPS 的 INT8 精度算力，还集成 4 核 Arm Cortex-A53 @ 1.5GHz CPU 并配备 4GB / 8GB 的 LPDDR4X-4267 内存。其三维 90×40×16 (mm)，USB 接口支持 5Gbps 速率，TDP 为 3W，宣称 IP65 防尘防水，支持 24×7 全天候使用。Mobilint 表示 MLD-R1 支持 Keras、TensorFlow、TensorFlow Lite、PyTorch、ONNX 框架，兼容 Windows 和 Linux 操作系统，适配 x86、Arm 乃至 RISC-V 主机 CPU。相关阅读：《威联通推出 NAS 用 3TOPS 边缘 AI 加速器：基于 RK1808，M.2 / USB 形态》《华硕推出 USB AI 加速器 UGen300：内置 Hailo-10H，40 TOPS 性能》《NPU 渗透至各类硬件：联想展示 AI 显示器与 USB-C 棒原型》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/987/158.htm", "publishedAt": "2026-08-07T10:24:05+00:00"}, {"title": "从App容器到Agent调度中心：荣耀YOYO智能体平台的架构演进与技术实践｜AICon深圳", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/2vgS2FNle83YQZrLvxSF?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-07T10:00:00+00:00"}, {"title": "✨License Manager 软件授权管理系统 v1.2.2 发布 - 升级经营看板", "summary": "任何开发语言→AI 一键对接软件授权系统 接入只需 3 步 01选择业务模板→02复制协议提示词→03AI 完成项目接入 升级经营看板 部 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
