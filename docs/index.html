与度，Reddit 近期表示将要求用户登录。奥哈尼安没有直接评价这一措施，但强调，互联网需要建立能够证明用户是真实人类的机制，同时不能以侵犯隐私为代价。奥哈尼安与 Reddit 的关系也颇为复杂。2020 年，在乔治 · 弗洛伊德事件发生后，他辞去 Reddit 董事会职务，希望由一名黑人董事接替，并推动平台改革内容审核政策。近日，他得知曾有用户将 Reddit 标志纹在身上，后来却选择用其他图案将其覆盖。对此，他表示：“我不怪他。”目前，奥哈尼安经营着风险投资公司 Seven Seven Six，管理资产规模超过 13 亿美元。他的投资重点之一是体育领域，因为在 AI 低质内容泛滥、互联网日益受到操纵的时代，体育仍能够凝聚现实世界中的真实社群。尽管对互联网现状持批评态度，奥哈尼安并不完全悲观。作为 Anthropic 的早期投资者，他仍看好 AI 的长期潜力，尤其期待 AI 推动医学领域取得突破。他表示，AI 技术确实可能造成严重危害，行业必须审慎考虑如何开发和应用这项技术，但与此同时，AI 也有机会让许多事情得到实质性改善。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/147.htm", "publishedAt": "2026-11-06T02:49:37+00:00"}, {"title": "理想汽车 OTA 9.2.0 开启推送：新增苹果 CarPlay、华为 HiCar、ICCOA Carlink 手车互联", "summary": "IT之家 11 月 6 日消息，理想汽车今日发布 OTA 9.2.0 版本，推送车型包含新一代理想 MEGA Home、全新理想 i9 Home、26 年款理想 L9 Livis、全新理想 L8 Livis、26 年款理想 L9 Ultra、全新理想 L8 Ultra、新一代理想 L6 Ultra、2026 款理想 i6。本次更新于今日开启正式推送，预计开始后一周内分批完成推送。IT之家附主要更新内容如下：新一代理想 MEGA Home、全新理想 i9 Home高级辅助驾驶VLA 驾驶 / 全场景导航辅助驾驶（NOA）新增校车、水泥搅拌车、市政清洁车的感知与渲染新增动态换挡能力，三点调头时未完全刹停即可切换挡位，提升调头效率优化 ETC 通道跟车起步体验，可以踩油门解除速度抑制，提升通行效率新增窄路会车时倒车让行能力VLA 指挥新增泊车失败主动恢复功能，泊车受阻时可主动切换相邻车位尝试，放弃则自动复位至初始位置新增舱外 &amp; 眼镜指挥泊车方位控制，可指挥车辆泊入指定方位车位优化 VLA 指挥功能：支持连贯自然语言复合指令，新增语义澄清机制，对话更自然流畅优化后备厢取放物品自主挪车功能，支持尾门按键一键闭锁并关门，自动锁车VLA 泊车新增后轮转向能力接入泊入功能，提升泊入效率及性能优化园区地面行驶效率、过闸机体验泊入车位推荐时优先推荐收藏车位扩展智能泊车触发条件：车辆压车位时可触发泊入，园区单侧有遮挡支持正常泊出新增关门泊入，离车泊入时可选择关门直接启动新增园区会车避让：直路 / 转弯遇到对向车阻塞通道时，可执行会车避让VLA 沟通新增园区地库地图绘制，可直接选择目标车位发起导航并开启智驾前往智能座舱理想同学新增氛围空间 Agent：自然语言即可联动调节灯光、空调、音量、香氛、音乐，适配纪念日、观影、商务、休息、长途驾驶等场景新增地图 Agent：支持模糊地点查询、居中位置推荐、指定行驶路线、长途充电路线、多地点复杂路线规划，收藏 / 记忆地点可纳入路线规划新增个性化闲聊，支持闲聊对话中引用用户记忆优化大模型能力：指令遵循、多轮纠错准确性显著提升，联网搜索接口升级，回复权威性、时效性更佳任务大师新增个性化音效、视频及车外播报能力，联动大师按键、放空桌面等扩展条件动作新增条件：车辆解闭锁、大师按键、前排屏桌面新增动作：自定义音效、自定义视频、车外播报、前排屏桌面切换任务广场新增推荐展示，包含品牌代言人语音彩蛋、魔法咒语视频彩蛋游戏新增《远方》、《霓虹深渊》、《超级幻影猫 2》、《饥饿鲨：世界》四款游戏，支持多屏同看后舱娱乐屏新增展开和收起动效后舱交互屏新增自动进入屏保时间设置项，默认 30s 进入屏保新增临时解锁功能：锁定状态长按 3s 即可临时解锁，30s 无操作自动恢复锁定副驾屏主交互优化交互逻辑：显示时间时点击任意位置进入副驾娱乐屏，新增底栏退出按钮地图优化红绿灯倒计时：可同时显示前方最多 2 个红绿灯新增目的地智能预测开关，默认开启OTA 交互新增自动更新功能，开启后可在凌晨 2:00-4:00 满足条件时自动升级，实现无感 OTA对讲机新增队长广播：创建小队的用户可发起 30s 广 : "华为小艺独立 App 上线鸿蒙电脑 AppGallery，小艺 Work 正式版同步推出", "summary": "IT之家 11 月 6 日消息，今日有用户发现，华为小艺独立 App 于 11 月 6 日正式上线鸿蒙电脑应用商店 AppGallery，版本号 11.7.9.300，同步推出小艺 Work 正式版。此前小艺以系统级智能体形式集成于鸿蒙电脑，此次独立 App 意味着其从系统内置能力转为可独立更新、独立迭代的应用形态。小艺 Work 功能于 2026 年 9 月开启内测，定位为 AI 工作助理，可接收用户目标后自主拆解任务、安排步骤、调用工具并推进执行。正式版在鸿蒙电脑端支持一句话交办数据分析、PPT 写作、周报总结等任务，直接生成 Word、PPT、Excel 等可用文档。官方信息显示，小艺 Work 汇聚 200 余位领域专家及专家团，通过连接器打通钉钉、飞书等常用办公工具。其执行环境支持云电脑与本地电脑，用户离开电脑后可通过鸿蒙手机远程下发任务并查看进度。本次更新还覆盖手机与平板端的三项功能调整。小艺深度解题新增作文本功能，支持 AI 润色作文并一键收藏；错题本中的“举一反三练”扩展至多学科；作业批改的识别能力同步优化，官方称带图题型的批改准确率有所提升。另外，小艺翻译首页完成改版，新增字幕翻译，拍照翻译支持变焦操作，文本翻译的语音输入可自动识别 21 个语种，无需手动切换。小艺时光机新增对华为 AI 眼镜的支持，可记录眼镜拍摄的瞬间。IT之家注：小艺 Work 采用会员制，权益包含 AI 点数（AI 点数是该服务中用于计量任务消耗的虚拟额度，不同复杂度的任务消耗量不同）。鸿蒙电脑用户可在 AppGallery 中获取小艺独立 App，手机与平板用户则通过系统内置的小艺入口接收本次功能更新。相关阅读：《华为小艺 Work 率先上线 openPangu-2.1-Pro 模型，主打“鸿蒙任务增强”》《华为官宣小艺 Work 上线：首次使用 31 天限时免费享 1000 AI 点》《华为小艺 Work 开启内测：鸿蒙手机、平板、电脑全打通，支持办公、代码、设计多种 AI 任务》《华为官宣 Mate 90 系列手机小艺升级，超百款应用接入帮记和触发式 AI 能力》《华为鸿蒙电脑官宣年内支持侧载，开放本地安装应用》《华为鸿蒙电脑官宣开放升级 HarmonyOS 7 系统》《华为朱懂东：鸿蒙电脑累计发货量破百万》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/086.htm", "publishedAt": "2026-11-06T02:14:09+00:00"}, {"title": "ChatGPT 涉嫌教唆妻子毒杀丈夫？美国一男子起诉 OpenAI", "summary": "北京时间 11 月 6 日，据 Ars Technica 报道，一份本周公开的诉讼文件称，ChatGPT 被指在数月中逐步生成“个性化方案”，帮助北卡罗来纳州女子谢丽尔 · 盖茨（Cheryl Gates）策划毒杀丈夫詹姆斯 · 盖茨（James Gates）。詹姆斯同时指控 OpenAI 及其 CEO 萨姆 · 奥尔特曼（Sam Altman）未设置足够技术防护，阻止相关对话。大陪审团已于 10 月起诉谢丽尔，罪名包括一级谋杀未遂和食品污染。上述诉讼在起诉前约一周提交至旧金山县高等法院，并于本周公开。诉讼称，ChatGPT 在谢丽尔的提问变得“明显可疑”后仍未关闭对话，反而提供如何实施和掩盖谋杀的建议。OpenAI 对 Ars Technica 表示，安全是首要任务，已封禁该用户并向执法部门提供信息。从工作工具到日常依赖詹姆斯是一名网络安全从业者。两人结婚近 10 年，谢丽尔此前主要在家照顾两个孩子，约两年前因家庭财务压力重返职场，担任儿科职业治疗师。为帮她加快报告撰写，詹姆斯建议她用 ChatGPT 建立可复用模板。谢丽尔很快每天使用，不仅用于工作，也用来安排孩子活动、解释家庭用药和讨论园艺。随着家庭财务压力增加，两人开始讨论离婚。詹姆斯称自己并未咨询离婚律师，但在警方获取谢丽尔的聊天记录后，他得知 ChatGPT 在离婚可能性出现后放大了她“最没有根据的恐惧”，并“为她发明了新的理由去害怕丈夫”。从“自我防护”到致命剂量诉状称，谢丽尔起初称研究毒药是担心丈夫可能杀她，以“自我保护”包装查询。ChatGPT 没有终止对话，而提供夹竹桃（Oleander）的准备、剂量和施用说明，包括抗恶心药会加速还是抑制死亡、是否会在尸检中显现，以及能否通过静脉或肌肉注射替代茶饮摄入并产生同样致命效果。她至少在 25 次不同对话中继续追问投毒方案，后来目标明确为詹姆斯。她问“注射多少会几乎立即致命 —— 对我或他”，还问“200 磅男性使用 0.2 毫克可乐定是否本身致命”。诉讼称，ChatGPT 没有转介执法、心理治疗或毒物控制机构，而是根据约 200 磅体重反复计算家中每种药物的致死剂量。Celsius 被指更能掩盖毒物在完成药物研究后，对话转向如何隐藏毒物。在一个名为“为什么 Celsius 更适合‘隐蔽下药’”的聊天中，ChatGPT 解释，如果詹姆斯早晨饮用 Celsius，它比啤酒或苏打水更能掩盖夹竹桃或其他碾碎药物的苦味。ChatGPT 还称，用注射器刺穿密封易拉罐在物理上可行，且不易留下明显痕迹；深色甜味汽水可能掩盖苦味，但 Celsius“更能隐藏这些粉末”。Celsius 投毒建议。图片来源：Gates 诉状关于尸检的提问。图片来源：Gates 诉状关于投毒的提问。图片来源：Gates 诉状丈夫出现心脏症状，警方介入诉讼称，谢丽尔在 2025 年 6 月至 9 月间多次试图毒害丈夫。詹姆斯注意到 Celsius 饮料有苦味，曾倒掉一罐未看管的饮料。最严重一次，他病了 72 小时，出现心脏症状、极度颤抖、腹部刺痛、严重乏力和意识混乱，甚至无法发出连贯短信。他当时未注意到，6 岁儿子拍下了他病重状态的视频。直到发现一张手写便条，列着“藏起来的东西”和“夹竹桃、可乐定、氯硝西泮、普瑞巴林、硝苯地平和阿替洛尔”等有毒组合，他才报警。便条顶部写着“清除所有对话”和“退出 ChatGPT”，还列出剂量、施用方式和“摄入后昏迷”“致命”等结果。诉讼称，这些对话显示 ChatGPT 不只是机械提供公开知识，而是为她量身定制了一套帮助实施谋杀并逃脱的计划。警方审查视频后发现，詹姆斯倒入透明杯中的可疑 Celsius 饮料底部有白色粉末结块。在测试 10 罐同款橙色 Celsius 均未发现残留后，警方发出重罪逮捕令。警方还在屋内发现散装胶囊、注射器、滴管、毫克秤、胶囊填充套件、丁腈手套、蓖麻豆种子，以及通过亚马逊购买、藏在詹姆斯车底的 GPS 追踪器。诉讼诉求与安全争议OpenAI 还称，已与心理健康专家合作，帮助识别脆弱用户对 ChatGPT 形成潜在危险情感依赖的对话。詹姆斯则表示，妻子“不符合‘脆弱’用户的典型，但依然脆弱”。诉讼还指控奥尔特曼个人将利润置于安全之上，放宽了本可阻止非法药物输出的防护措施。OpenAI 曾辩称，ChatGPT 在被问及某些药物时不应“评判”或“说教”；詹姆斯称，OpenAI 提供的“用户询问药物使用”示例语气与谢丽尔的对话“惊人相似”。诉状称，ChatGPT 还让谢丽尔相信詹姆斯“控制欲强”“虐待”“愤怒”“恐吓”，鼓励她以自卫对抗其“自恋、操控”人格，并暗示他因双相情感障碍而“危险且不稳定”。詹姆斯称，这一画像与他没有犯罪记录或相关心理健康记录不符。诉状还称，ChatGPT 向她保证可以永久删除聊天并清除其他数字证据以逃脱谋杀，但诉状称这“明显虚假”地描述了 ChatGPT 自身的数据保留做法。詹姆斯说，谢丽尔把对婚姻的不满倾诉给 ChatGPT，数月的互动让她越来越远离自己和现实；读到聊天记录后，他认为她并非单独行动。诉讼寻求补偿性和惩罚性赔偿、禁令救济及算法追缴，并要求 OpenAI 被命令“检测并中断用户似乎正策划对可识别第三方实施暴力的对话”。代表詹姆斯的 Tech Justice Law 律师米塔利 · 贾恩（Meetali Jain）称，这些产品被编程利用人的情绪和冲动来保持参与，“最糟糕的风险 —— 鼓励和协助谋杀未遂 —— 在此案中充分展现”。相关阅读：《31 岁女工程师去世：生前按 ChatGPT 指示减药，家属起诉 OpenAI》《美国 8 州起诉 OpenAI，指控 ChatGPT 指导青少年如何自伤或伤害他人》《OpenAI 总裁布罗克曼：AI 或将能让死亡成为一种选择》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/079.htm", "publishedAt": "2026-11-06T01:56:13+00:00"}, {"title": "Meta 给 AI 装上“脸”和“嗓子”：Muse 现在能视频聊天了", "summary": "IT之家 11 月 6 日消息，Meta 首席执行官马克 · 扎克伯格（Mark Zuckerberg）今天（11 月 6 日）在 Threads 社交平台上发布串文，宣布个人 AI 助手 Muse 正式上线实时语音对话与富有表现力的虚拟形象功能。上述功能率先面向美国用户推送，覆盖移动端、网页端和 Mac 应用。用户点击应用右上角的电话图标，即可像打电话一样与 Muse 交谈，并可在其回答过程中随时打断。IT之家附上相关截图如下：在技术支撑方面，本次更新主要由 Muse Realtime Voice 语音模型和 Muse Realtime Avatar 虚拟形象模型提供支持，前者会同时生成“说什么”和“怎么说”的信息；而后者基于同一数据流实时生成表情、口型和肢体动作，让声音与画面保持同步。Meta 称，该系统可流式输出 448×768 分辨率、25 帧每秒的竖屏视频，从用户说完话到收到首个音视频响应的延迟约为 870 毫秒。在交互方式上，用户可选择仅语音、在聊天界面旁显示虚拟形象，或切换至全屏“面对面”模式。Muse 的默认形象是昵称为“Jolly”的卡通角色，用户也可将其替换为人物、动物或其他角色；语音方面提供数百种风格，包括“纽约客式活力”和“海盗风”等。Meta 将这一能力定位为更自然的个人智能体交互：用户可以在散步、双手忙碌时口头安排任务，Muse 则在后台继续处理；也可用于头脑风暴、旅行规划、面试或演讲练习。Meta 还展示了让 Muse 虚拟形象跳舞并分享到 Instagram、Facebook 或 WhatsApp 的玩法。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/069.htm", "publishedAt": "2026-11-06T01:35:06+00:00"}, {"title": "李飞飞 World Labs 团队发布“游戏掌机”Frameboy：用网页实时探索 AI 生成世界，每秒最高 15 帧", "summary": "IT之家 11 月 6 日消息，“AI 教母”李飞飞的创企 World Labs 于今年 9 月发布了“全球首个多模态世界模型”—— Atlas，宣称该模型能够以像素级精确的相机控制生成图像和视频帧，并将其在 3D 中重建。时隔两个月，World Labs 端出了一款名为 Frameboy 的演示项目，可以让网友直接在网页端体验，用高度优化的 Atlas 版本实时探索多模态世界，并以最高 15 帧每秒的云 GPU 流媒体传输。IT之家测试体验，Frameboy 是一个类似游戏机的模拟项目，网友可点击不同的“游戏卡带”来选择不同的模拟世界，经过十几秒加载后就可以自由探索模拟的世界。Frameboy 的按键和摇杆支持通过触屏、键盘按键操控，十字键是进行移动，摇杆是调整视角，整体操作稍微有些卡顿，毕竟最高只有 15 帧。此外，Frameboy 目前必须运行在云端强大的 GPU 服务器上，成本与本地渲染方法相比并不便宜。不过这个演示相当于一个起点，如果未来帧数更高、运行成本更低，是否意味着人人都可以创建一个虚拟世界，然后直接在网页上进行浏览游玩。IT之家附 Frameboy 体验地址如下：https://frameboy.worldlabs.ai/", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/063.htm", "publishedAt": "2026-11-06T01:17:52+00:00"}, {"title": "京东物流“狼族”机器人升级：智狼取货提速、保姆狼实现无人分拣", "summary": "IT之家 11 月 6 日消息，11 月 5 日，在 2026 年 CeMAT ASIA 亚洲国际物流技术与运输系统展览会上，京东物流携全新升级的“狼族”机器人亮相，推出“智狼”“保姆狼”全新升级方案。“狼族”是京东物流自研的具身机器人军团，覆盖仓储、分拣、运输、配送全链路。其包含“智狼”“保姆狼”“异狼”“飞狼”等 9 款产品、11 款机器人，在“超脑”大模型调度下协同作业。其中，“智狼”和“保姆狼”处在仓储拣选与分播两个关键节点，已在全球规模化部署，在本次展会全新升级亮相。IT之家从官方介绍获悉，“智狼”是货到人解决方案，解决传统仓库存储密度不足及“人找货”效率低的问题。“智狼”飞梯机器人从 12 米高的货架取箱，再由“智狼”搬运机器人送至拣选站，人只需在站内拣选，不用在货架间穿行。该方案已在全球超 100 个仓库规模化落地，存储效率较传统提升 600%，出库效率提升 300%。此次“智狼”升级，集中在结构创新与供电方式。京东物流首创“旋转式取货平台”，简化“先钩取再传送”的取放货步骤，实现一次钩取到位，单台设备每小时作业次数可突破 240 次，相当于每 15 秒完成一次取货，动作效率进一步提升 30%；旋转式平台突破性采用双深位存储方案，存储能力提升 20%。此外，升级版“智狼”采用无线供电，取消了物理接触，避免滑触线磨损，实现供电系统零维护，即使-20℃ 低温环境仍可正常使用。“保姆狼”是分拣端到端自动化解决方案，整合投递、分播、取货和打包等作业步骤，可将不同类型商品，按订单地址快速归类分配，用于订单分拣、退货分类等场景，在 SKU 种类繁多的电商、服装、图书、美妆等行业实现规模化应用。此次“保姆狼”升级的核心，是打通从机器人投递、自动分播、自动取换箱到自动打包的端到端全无人化，整条链路不再依赖人工翻包、搬箱和打包。最大亮点是搭载双臂具身机器人，可识别包裹并自动翻包、投递，使面单朝上，替代纯人工作业；其次，行业首创自动取换货技术，替代人工取换，最高 180 次 / 小时自动取箱、换货，兼容多种箱型；此外，首创上下双层独立运行供包台，搭配双臂具身机器人实现更好人机协同，最高支持每小时 34560 件以上商品分播。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/048.htm", "publishedAt": "2026-11-06T00:28:56+00:00"}, {"title": "Hugging Face CEO 称 AI“末日风险”接近于零，真正危险来自闭门造车", "summary": "IT之家 11 月 6 日消息，当地时间昨日（11 月 5 日）在美国迈阿密举行的 WIRED 世界博览会上，开源 AI 平台 Hugging Face 首席执行官克莱门特 · 德朗格（Clément Delangue）表示，他对人工智能导致人类灭绝的概率（即 P (Doom)）评估“接近于零”。他认为，相比“AI 毁灭世界”的宏大担忧，更现实的风险是少数大公司在封闭环境中秘密开发前沿模型。德朗格称，AI 的主要风险并非来自开放生态，而是“少数闭门造车的参与者”。他主张，降低风险的关键是让更多开发者能够公开构建、审查和改进模型，从而形成相互制衡的生态系统。在他看来，开放权重模型不仅是技术选择，也是防止少数企业垄断人才、算力与 AI 能力的手段。德朗格还透露，Hugging Face 目前的 AI 开发者已超过 2,000 万，较英伟达今年 9 月宣布以 129.3 亿美元（IT之家注：现汇率约合 864.42 亿元人民币）收购该公司时公布的约 1,800 万用户继续增长。该公司还已售出 5 万台可通过 AI 编程的双足机器人 Microducks。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/045.htm", "publishedAt": "2026-11-06T00:12:23+00:00"}, {"title": "蚂蚁百灵大模型 Ling 3.2 Flash 发布：三项基准超越 Claude Opus 5，前两周限时免费", "summary": "IT之家 11 月 6 日消息，蚂蚁百灵官方团队今日宣布推出原生多模态模型 Ling-3.2-flash，拥有 560B 总参数、25B 激活参数、1M 上下文窗口。该模型从架构层面原生融合视觉与语言能力，支持图像、文本与视频输入，重点强化复杂视觉理解、多模态长程 Agent、3D 理解与交互、医疗多模态四大能力。在蚂蚁官方公布的评测结果中，Ling-3.2-flash 在三项基准上超过 Anthropic Claude Opus 5（max）：OmniDocBench1.5 得分 92.21，对比 90.56；ZEROBench（Sub）得分 43.71，对比 39.52；Vision2Web 得分 85.86，对比 80.20。在 DesignArena 图像转前端竞技场中，该模型以 1238 的 Elo 分数进入前十，与 Meta、DeepSeek 及 Anthropic 等竞品并列。该模型重点强化四大能力：复杂视觉理解面向图像与视频的深度推理与分析；多模态长程 Agent 要求在多步任务中持续保持目标一致，基于视觉与文本信息完成决策与执行；3D 理解与交互侧重三维场景与空间关系的解析；医疗多模态则覆盖医学影像理解与报告解读，辅助专业医疗分析。据介绍，560B 总参数与约 25B 激活参数的组合，是 Ling-3.2-flash 在能力与推理开销之间的核心权衡。这种模式通常对应混合专家（MoE）架构，模型在每次前向计算中仅调用部分参数，从而在保留大容量知识存储的同时控制单步计算成本。定价方面，Ling-3.2-flash 的 API 输入价格为每百万词元 0.30 美元（IT之家注：现汇率约合 2 元人民币），输出价格为每百万词元 0.90 美元（现汇率约合 6 元人民币），DesignArena 榜单指出这是同性能级别模型中最低的费率。其 API 已通过蚂蚁百灵平台上线，感兴趣的用户可通过对话页在线体验，并兼容 OpenAI 及 Anthropic 协议进行 API 调用，而且上线前 2 周限时免费体验。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/043.htm", "publishedAt": "2026-11-06T00:00:05+00:00"}, {"title": "微软 Office 365 A1 退役：2028 年起取消 100TB 教育版基础存储，免费 A0 学生版不含 Teams 与邮箱", "summary": "IT之家 11 月 6 日消息，微软宣布调整 Microsoft 365 Education 教育版授权政策，将逐步停用免费 Office 365 A1、Student Use Benefit（学生使用权益）等项目，并计划从 2028 年 1 月 1 日起取消教育机构现有的 100TB 基础共享云存储额度。微软此次调整涉及教育版产品授权、校友邮箱、云存储分配及订阅价格等多个方面。相关变化将分阶段实施，学校和高校现有授权不会立即失效，但需要在后续合同续约时调整授权方案。微软首先宣布将停止销售 Office 365 A1。该方案已于 2026 年 11 月 5 日停止通过 Web Direct 渠道销售，Cloud Solution Provider（CSP，云解决方案提供商）及批量许可渠道则计划从 2027 年 5 月 1 日起停止销售，最终退役日期为 2028 年 1 月 1 日。对于现有用户，2027 年 5 月 1 日之前开始的有效 Enrollment（注册协议）所涵盖的机构，可以在当前协议期限内继续使用已有授权。但在 2028 年 1 月 1 日或之后进入续约或到期阶段后，相关授权将无法继续续订或延期，学校需要为受影响用户更换其他授权方案。同样计划于 2028 年 1 月 1 日退役的还有 Student Use Benefit 项目。该项目将从包括 CSP 和批量许可在内的所有教育采购计划中取消。现有授权在当前订阅期限内仍然有效，但退役后无法续订，学校需要重新确认仍需使用相关服务的学生，并为他们配置适当的付费学生授权。微软还将停止免费的 Exchange Online for Alumni 校友邮箱服务。希望继续为毕业生提供邮箱服务的教育机构，需要转向新的付费校友邮箱方案。该付费方案预计于 2028 年 1 月 1 日通过 CSP 和 Enrollment for Education Solutions（EES）渠道推出。此外，Open Value Subscription for Education Solutions（OVS-ES）和 School 3 也计划在同一天退役。此次调整中，另一项重要变化是微软将取消教育版租户原有的 100TB 免费基础共享存储额度。根据微软公布的新政策，从 2028 年 1 月 1 日起，教育机构首次进行合同续约或延期时，将不再自动获得这 100TB 基础容量。此前，微软为教育版租户提供覆盖 OneDrive、SharePoint Online 和 Exchange Online 的共享存储池，三项服务共同使用这一额度。微软官方文档也明确说明，原有存储池由 100TB 初始免费额度、付费授权贡献的存储空间以及额外购买的存储空间组成。新政策实施后，存储容量将主要根据授权类型和数量计算。学生授权方面，Microsoft 365 Education A2 每个授权贡献 4GB，A3 贡献 8GB，A5 和 A7 均贡献 12GB。教职员工授权方面，A2 每个贡献 50GB，A3 贡献 75GB，A5 和 A7 均贡献 150GB。新推出的免费 A0 学生授权不会为机构增加额外存储空间，其用户使用的存储容量将从学校现有共享存储池中扣除。微软建议学校管理员在合同续约前，评估现有存储使用量及未来需求，并结合用户数量、授权组合和预计可获得的存储容量制定方案。如果存储空间不足，机构可以每次购买 10TB 的额外存储包、升级至存储贡献更高的授权方案、清理现有数据，或者使用 Microsoft 365 Archive 归档不活跃内容。随着 Office 365 A1 退役，微软还将推出全新的 Microsoft 365 Education 授权体系，包含 A0、A2、A3、A5 和 A7 五个等级。各等级将分别提供学生版和教职员工版，并提供包含 Teams 和不包含 Teams 的不同版本，以便学校根据不同用户的实际需求分配授权。其中，A0 是一项面向符合条件学生的免费方案，包含 Office 桌面版和网页版应用、Minecraft Education、Microsoft Entra ID Free，以及 Learning Zone 学习体验。不过，学校必须为全部教职员工提供 Microsoft 365 Education A2 或更高级别的付费授权，学生还必须积极使用 Windows 设备开展教育活动。A0 不包含 Exchange Online、SharePoint Online 和 Teams。位于新授权体系顶端的是 Microsoft 365 Education A7。IT之家注意到，该方案在 A5 基础上增加了高级 AI、身份管理、安全防护、治理及设备管理功能，并包含 Microsoft 365 Copilot、Microsoft Agent 365 和 Microsoft Entra Suite 等服务。在价格方面，微软还计划于 2027 年 5 月 1 日调整教育版批量许可渠道的在线服务定价机制。届时，通过 Academic Volume Licensing（学术批量许可）计划购买的在线服务，将在各个 Price Level（价格等级）之间采用统一定价。该调整将在教育机构于 2027 年 5 月 1 日或之后首次续约或延期时生效，即使续约发生在 2028 年 1 月 1 日之前也不例外。微软表示，教育机构在当前合同期限结束前，仍将按照现有协议享有对应的授权、服务权益和价格。新授权体系及存储计算方式将在机构于 2028 年 1 月 1 日或之后首次续约或延期时适用。参考资料：《Microsoft 365 Education portfolio evolution | Microsoft Learn》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/042.htm", "publishedAt": "2026-11-05T23:50:59+00:00"}, {"title": "OwnCoder 0.2.0 发布:安全优先，token 消耗显著低于同类产品安全优先，token 消耗显著低于同类产品的本地 AI 编程工具", "summary": "当前版本能力持续完善，产品效果提升明显，Token 消耗相比同类 AI 编程工具具备优势。 软件简介 OwnCode 是一款面向开发者的桌面端 AI 编程工具，从设计之初就把安全与隐私放在首位：敏感信息（API Key、密钥等）在发送给大模型之前自动脱敏，代码索引与向量检索均在本地完成。在此基础上，OwnCode 的上下文管理策略经过...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503432", "publishedAt": "2026-11-05T23:03:07+00:00"}, {"title": "SonnetDB 5.0 正式发布：增强 SQL 与事务，开放九模型 MCP 读写", "summary": "SonnetDB 5.0 正式发布：增强 SQL 与事务，开放九模型 MCP 读写 SonnetDB 5.0.0 已于 2026 年 11 月 4 日正式发布。相较 4.0，本次主版本更新重点增强 SQL 与关系事务、精确类型、.NET 数据访问和九模型 MCP 工具，并改进查询执行、资源控制、持久化恢复与管理体验。 AI 主题示意图，并非产品界面或实测截图。 SonnetDB...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503431", "publishedAt": "2026-11-05T13:18:52+00:00"}, {"title": "百度发布最新基座模型 ERNIE 5.5 Flash Base：效率、开源、高性价比", "summary": "11 月 5 日，百度正式开源最新基座模型文心 5.5 Flash Base（ERNIE 5.5 Flash Base）。模型采用 MoE 架构，总参数量 2800 亿，每个 Token 激活 140 亿参数，使用 33.5 万亿个 Token 完成预训练，预训练上下文长度最高达 128K，微调与推理阶段支持最长 100 万 Token 上下文。 据介绍，ERNIE 5.5 Flash Base 没有经过任何中...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503429/ernie-5-5-flash-base", "publishedAt": "2026-11-05T11:39:18 foQ 中文", "sourceUrl": "https://www.infoq.cn/article/4IUSd2wP28ua4Jd5fHG2?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-06T10:00:00+00:00"}, {"title": "6999 元，红魔游戏平板 5 Pro 16GB+1TB 版本 11 月 9 日开售", "summary": "IT之家 11 月 6 日消息，红魔今日宣布红魔游戏平板 5 Pro 16GB+1TB 版本将于 11 月 9 日 20:00 开售，价格为 6999 元。IT之家注意到，红魔游戏平板 5 PRO 已于 6 月 30 日正式发布，采用透明水冷设计，号称“口袋里的游戏神器”，首销 4999 元起、国补价 4499 元起。红魔游戏平板 5 PRO 搭载第五代骁龙 8 至尊版处理器 + 红芯 R4，匹配 ICE 魔冷散热架构，支持水冷 RGB 散热技术。平板内置 8300mAh 电池，搭载双 USB-C 接口，支持 80W 有线充电，支持旁路充电 PRO。该平板还搭载全新 PC 模拟器 Steam 直连模式，低门槛畅玩 PC 大作。同时内置了 AI 战术教练和 AI 魔姬嘴替两大功能，前者支持赛前赛中提供选英雄、出装战术等游戏指导，后者支持 DeepSeek 自然回复交流。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/098.htm", "publishedAt": "2026-11-06T02:29:36+00:00"}, {"title": "中国移动：今年手机上网流量增长 18% 增速达去年两倍，AI 生成内容带动流量增长 5 倍", "summary": "IT之家 11 月 6 日现场消息，在今日的 2026 移动网络大会暨中国移动合作伙伴大会上，中国移动表示人工智能驱动移动网络流量快速增长。根据中国移动内网实测数据，今年手机上网流量增长 18%，增速是去年的两倍；其中，AI 生成的内容带来流量增长 5 倍，成为互联网新的源头模式，是驱动流量加速增长的主要引擎。此外，AI 引发数据传送结构显著变化，全网的平均上下行流量是 1:9，而 AI 应用的流量上下行是 1:6，未来部分应用可能是 1:1 甚至更高。IT之家在大会现场了解到，中国移动官方坦言，目前网络资源以保障下载为主，不能很好地匹配数据传送的结构性变化。此外，人工智能目前还面临网络时延瓶颈，目前首 Token 的调用平均时延为几百毫秒，其中移动网络侧的试验只有 35 毫秒，云端平台侧的时延是 665 毫秒，因此需要网络与平台侧深度融合协同。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/093.htm", "publishedAt": "2026-11-06T02:24:54+00:00"}, {"title": "三星 SDS 龟尾 AI 数据中心动工，为三星系机器人业务提供算力支持", "summary": "IT之家 11 月 6 日消息，三星系 IT 解决方案和服务提供商三星 SDS 当地时间本月 2 日宣布，其位于韩国庆尚北道龟尾市的新 AI 数据中心项目破土动工。这座数据中心采用风冷 + 水冷混合散热布局，支持新一代 GPU 服务器在内的各类 AI 系统。其占地面积约 4.63 万平方米，初期设计容量 60MW，未来将扩展至 120MW，投资额 4,273 亿韩元（IT之家注：现汇率约合 21.31 亿元人民币），预计 2028 年底竣工。三星 SDS 表示，龟尾 AI 数据中心不仅将向外部提供服务，也将为三星系内部的制造业机器人转型等业务提供 AI 算力支持。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/080.htm", "publishedAt": "2026-11-06T02:00:07+00:00"}, {"title": "英伟达 App 11.0.9.585 发布：《绝地求生：大逃杀》等 19 款游戏新增 DLSS 优设", "summary": "IT之家 11 月 6 日消息，英伟达发布了最新的 NVIDIA App 的 11.0.9.585 版本更新，主要为 19 款游戏支持 DLSS 优设，并为另外 6 款游戏新增“最佳设置”配置文件。IT之家附新增 DLSS 优设的 19 款游戏包括：《蜂巢：异星物语》（Honeycomb: 译其它语言的文章；同时支持文章批量翻译。文章修改后，同样可以同步翻译至不同语言网站。如发现翻译有不恰当之处，可以手动修改。 本次更新新增会员投稿，会员可在会员中心提交文章，经...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503350", "publishedAt": "2026-11-02T10:51:17+00:00"}]}, {"label": "论文研究", "items": [{"title": "2026 年 6G 发展大会 11 月 24 日在沪举行，聚焦全球统一标准与产业生态", "summary": "IT之家 11 月 6 日消息，2026 年 6G 发展大会定于 11 月 24 日至 25 日在上海市松江区举行。本届大会在工业和信息化部指导下，由中国信息通信研究院与 IMT-2030（6G）推进组主办，上海市科学技术委员会、上海市经济和信息化委员会、上海市通信管理局及松江区人民政府承办。这是 6G 发展大会连续举办的第六届，前五届已为国内 6G 领域的技术研讨与产业协作提供了主要平台。本届大会以“智启星程，携手全球协同创新”为主题，核心议题锁定 6G 全球统一标准的制定与产业生态建设。当前 6G 研发正处在标准研制与产业研发同步推进的关键窗口期，面向 2030 年商用的目标，全球 6G 发展已从愿景阶段进入实质性推进阶段。此次大会采用“1+2+X+1”结构，即 1 场开幕式、2 场主论坛、多场分论坛，同期配套 6G 产业研发成果展览。开幕式将邀请国际电信联盟、3GPP、GSMA 等国际组织代表，以及欧洲、日本、韩国等区域产业组织代表，围绕全球 6G 发展路径进行交流。这一安排直接对应大会聚焦“全球协同”的定位。技术议题方面，大会将重点讨论并发布 6G 最新技术标准研究成果。集中研讨的产业研发成果覆盖五个方向：数十 Gbps 通智基站原型样机、智能体核心网样机、NTN 通信载荷、千级大规模天线阵列以及 U6G 器件模组。这些方向分别对应 6G 在吞吐速率、网络智能化、星地融合、天线规模与中频段射频前端等维度的关键能力。IT之家注：U6G 指 6.425GHz 至 7.125GHz 的上中频段，3GPP 已于 2022 年将其确定为 5G-Advanced 与 6G 的关键频谱。国内已有企业发布适配该频段的射频前端模组，单通路最大输出功率 29dBm，支持 100MHz 带宽。千级大规模天线阵列则将基站天线单元从 5G 的数百级提升至千级以上，在基站侧形成更窄的波束与更高的空间分辨率。智能体核心网样机的思路是在核心网内置意图解析能力，使网络能够将自然语言指令转化为可执行的调度动作，而非仅承担数据传输功能。NTN 即非地面网络（Non-Terrestrial Network，指以卫星或高空平台作为接入节点的通信网络），6G 阶段的 NTN 研究正从“卫星适配地面网络”转向天地网络协同设计。本届大会现场还将集中展示多家单位的 6G 技术原型样机、新型终端样机、芯片器件样片及测试工具与平台，呈现 6G 技术试验的阶段性进展。应用侧，大会计划邀请新型终端、智能穿戴、具身智能等领域企业，围绕工业制造、智慧交通、智慧文旅、低空经济等场景与信息通信企业展开跨界对话，讨论 6G 技术落地垂直行业的可行路径。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/070.htm", "publishedAt": "2026-11-06T01:36:37+00:00"}, {"title": "工信部加强智能体终端设备进网管理，规范终端与智能体适配", "summary": "IT之家 11 月 6 日消息，工信部今日发布关于加强智能体终端设备进网管理的通知，其中提到开展智能体和终端适配、改进智能体终端进网管理、强化智能体现网升级管理、健全智能体分发管理机制四大工作任务。IT之家整理四大工作任务如下：（一）开展智能体和终端适配。智能体是具备自主感知、记忆、决策、交互与执行能力的智能系统。智能体开发者应加强与终端设备的适配验证，强化权限调用、通信能力、网络与数据安全、用户权益和任务执行等方面管理，确保符合监管要求和用户预期，保障智能体兼容稳定运行。智能体开发者应规范智能体信息管理，在产品设置页面向用户公示适配验证列表，列明已完成适配的终端型号以及操作系统信息，保障用户知情权和选择权。智能体在应用分发平台上架前，其开发者应向应用分发平台提交适配验证情况。（二）改进智能体终端进网管理。开展风险评估，完善电信设备进网检测机制，细化特别规定事项要求。预置智能体的手机、平板、可穿戴设备等智能体终端，须在进网检测中依据有关标准开展智能体适配验证；依法开展智能体终端涉诈风险安全评估和反诈能力前置性评测，落实重要通信工作要求。终端上使用的智能体应参考智能体互联系列国家标准配备唯一身份码。终端生产企业应当保证智能体终端获得进网许可证前后的一致性。智能体终端发生重大变化的，终端生产企业应当向工业和信息化部报备，并按要求开展进网检测。（三）强化智能体现网升级管理。终端生产企业通过在线升级推送（OTA）等方式开展智能体现网升级的，应向工业和信息化部提交现网升级方案，明确现网升级时间、规模、用户群体、业务场景、服务内容、业务经营模式、网络和数据安全措施、反电信网络诈骗措施等内容，并同步做好重要通信工作。终端生产企业现网升级结束后，向工业和信息化部提交现网升级报告，经工业和信息化部组织专家评估、征求意见后方可正式向用户提供服务。（四）健全智能体分发管理机制。应用分发平台应推动应用程序开发者，通过电子签名主动声明是否同意智能体调用，未经声明同意的，智能体不得强制调用调取应用。应用分发平台应在分发页面向用户公示智能体适配验证列表，不得为用户提供不兼容设备型号的智能体下载和安装服务。应用分发平台应加强在架智能体适配验证情况巡查，对未完成适配验证的智能体应采取限期整改、下架处置等措施。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/059.htm", "publishedAt": "2026-11-06T01:13:03+00:00"}, {"title": "GOTC 来我这放个 P！Vibe Coding 的同时也要记得关怀屁股", "summary": "你是否遇到过这种情况：Vibe Coding 最上头的地方，是你永远觉得“再改一版就好”。于是你让 AI 再跑一轮，AI 让你再等一会儿。代码迭代了十版，屁股一个 commit 都没挪。直到终于跑通，才发现你的屁股已经和椅子合并分支了。 我们是即刻放P垫，一群认真研究“屁大点事”的硬件整活选手，正在做一款用放屁音效和触感提醒...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503412", "publishedAt": "2026-11-05T06:38:40+00:00"}, {"title": "JeecgBoot V3.9.6 发布，67 项安全漏洞集中修复，AI 图像生成上线", "summary": "前言 JeecgBoot V3.9.6 是一次以「安全」为主线的版本。距离 V3.9.5 发布两个多月，这一版集中处理了社区和安全研究人员报告的 67 项安全漏洞，覆盖越权访问、租户隔离、登录爆破、短信轰炸、SQL 注入、SSRF、XSS、远程代码执行等方向，并为大量导入导出、新增、删除接口补齐了按钮权限。 功能方面，AI 流程编排新增「图...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503401", "publishedAt": "2026-11-05T01:30:09+00:00"}, {"title": "研究发现：AI 生成代码受下游环节瓶颈制约，无法提升整体生产力", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/c3vTLNrRwfCzw8SAmz90?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-04T16:20:50+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "英特尔中国区董事长王稚聪：算力舱未来要进入中国西部，绿色电力就地转化为词元", "summary": "IT之家 11 月 6 日现场消息，第九届中国国际进口博览会（以下简称 \" 进博会 \"）于 11 月 5 日至 10 日在上海国家会展中心举办。英特尔中国区董事长王稚聪向IT之家等媒体介绍，今年英特尔也带来了一些非常有意思的作品，例如绿色算力舱（英特尔绿电储能算力一体化解决方案），算力舱未来要进入中国西部，与光能、风能等新能源结合，将算力转化为词元。谈及英特尔“储算一体”方案的未来规划，王稚聪表示，这是英特尔去年以来响应国家“十五五”规划而提出的一个崭新解决方案。“十五五”规划中提到了两个重点方向：一个是“词元经济”，另一个是“算电协同”。“我们观察到中国西部富余大量的新能源，这些新能源的实际利用率有些并不高。所以我们思考，能不能打造一个具有高度移动性的标准集装箱方案？集装箱部署相对容易，不需要建设传统的物理数据中心，可直接推放到光伏发电站旁边，就能实现 ' 绿电直供 '。”他表示，电力长距离传输的损耗非常严重。例如，从遥远的西部跨越几千公里输送到上海，电网传输损耗极大；而且绿电具有“靠天吃饭”、发电不够稳定的特点。英特尔打造这一方案的基本初衷，就是把这种集装箱形态带到西部去，直接把绿色电力就地无损耗、高效转化为词元，再通过算力网络对词元进行调度，并经过软件优化后，下发给企业或个人使用。此外，未来绿色算力舱产品形态会有多种演变：它既可以成为企业级单舱 / 半舱使用的本地算力设施，也可以支持一个城市打造词元工厂，因为算力舱支持多舱互联、模块化扩展，可以把 100 个算力舱连接起来，直接构建起一座大型算力中心向外输出词元。同时，它的建设周期极短。英特尔目前预计从开始设计、制造到投入使用，大概只需要 8 到 12 周；而传统算力中心仅土建建设就需要两年时间才能开始装机上电。AI 技术变化极快，集装箱模块化形态能够帮助客户快速赶上技术浪潮。此外，由于集装箱内算力密度极高、空间有限，如果沿用传统的 48V 供电架构，需要铺设非常粗的铜缆，会消耗过大的物理空间。因此英特尔也在积极倡导走向 800V 高压直流供电，从而进一步压缩配电单元占用的体积，把更多空间留给计算设备。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/075.htm", "publishedAt": "2026-11-06T01:46:59+00:00"}, {"title": "Anthropic 推出 Claude 个人理财功能，支持消费分析和账单追踪", "summary": "IT之家 11 月 6 日消息，当地时间 11 月 5 日，Anthropic 宣布为 Claude 加入个人理财功能，本周开启灰度测试，面向美国地区的 Pro、Max 以及 Ultra 订阅用户开放。据官方介绍，想要理清自己的财务状况，用户再也不用挨个打开银行 App，自己动手算账了。借助 Claude 个人财务功能，用户可以安全绑定银行卡账户，用自然语言直接提问。该功能仅拥有只读权限，Claude 个人财务功能无法划转、管理用户的资金，也不能替用户做投资。Claude 会用通俗直白的语言为用户解答，支持查看余额、交易记录，遇到陌生术语还会给出解释。和 Claude 本身的定位一样，个人财务板块没有广告，也不会推送赞助推荐；Claude 本身不发行信用卡、不提供贷款，也没有自营储蓄账户，因此用户得到的财务答案都是客观直接的。IT之家注意到，假设已经到月底，距离发薪日还有 10 天。用户向 Claude 提问：“我这个月钱都花去哪了？”它会汇总你所有已绑定账户的支出，并按类别分类统计。如果用户问有没有异常账单，Claude 会遍历其绑定的全部账户，帮用户留意容易忽略的问题，比如重复扣费、莫名手续费，或是一整年悄悄涨价的账单。用户也可以提出更宏观的问题，例如“我的支出是不是已经超过收入？”或者“什么是年利率（APR），今年它让我花了多少利息？”Claude 会先解释术语，再帮用户统计产生的利息总额。此外，用户还可以要求生成每周支出图表、待缴账单日历，或是自定义数据看板，Claude 生成后，也可以随时调整。Anthropic 强调，Claude 仅拥有只读权限。个人财务功能仅用于帮你看懂自己的资金情况，并不提供投资建议。Claude 给出的结果有可能出错，你可以要求它列出对应数据背后的交易明细，重要金额请务必和银行核对。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/051.htm", "publishedAt": "2026-11-06T00:37:10+00:00"}, {"title": "联发科组建“封装梦之队”：招募 37 年经验前英特尔老将，双线布局 AI 芯片 CoWoS+EMIB 战略", "summary": "IT之家 11 月 6 日消息，集邦咨询（TrendForce）今天（11 月 6 日）发布博文，报道称前英特尔高管纳维德 · 沙赫里亚里（Navid Shahriari）将于 11 月 9 日加入联发科，出任高级副总裁，直接向公司总裁兼首席运营官汇报。IT之家援引博文介绍，沙赫里亚里拥有 37 年半导体设计工程与先进封装经验，并长期深耕数据中心市场。在加入联发科后，他将统筹先进工艺与良率平台、设计技术协同优化、先进测试与封装，以及质量与可靠性等关键环节。报道指出他的核心任务之一，是深化与台积电及其他供应链伙伴的合作，推动先进技术整合，强化联发科在 AI 和高性能计算领域的产品能力。沙赫里亚里在英特尔任职多年，曾担任执行副总裁，负责封装测试、代工技术与制造运营，并主导复杂封装、基板技术以及全球大型制造基地的生产支持。他的经验覆盖嵌入式芯片封装、测试验证、数据中心产品组合，以及 CPU、GPU / NPU 相关知识产权和生态建设。市场层面，联发科据称正与英特尔就 EMIB（嵌入式多芯片互连桥）技术展开合作，应用于部分云 ASIC 项目，其中可能包括与谷歌 TPU 相关的工作。同时，联发科也支持台积电 CoWoS 技术，形成“CoWoS+EMIB”双路线封装策略，让客户可按需求选择方案。该机构解读认为 AI ASIC 正成为联发科的新增长引擎。该公司首款 AI 加速器 ASIC 已于 2026 年 9 月开始出货，预计第四季度带来约 25 亿美元（IT之家注：现汇率约合 167.14 亿元人民币）营收；联发科还瞄准 2027 年实现约 160 亿美元（现汇率约合 1,069.67 亿元人民币） AI ASIC 营收、约 20% 市场份额，下一代产品计划于 2028 年第一季度量产。集邦咨询认为这并非联发科首次从封装领域引进重量级人才。联发科已于 2026 年 5 月聘请台积电前研发副总裁余振华（Douglas Yu）担任兼职顾问，协助先进封装研发与路线图规划。两笔人事布局，显示出联发科正把先进封装视为进军 AI ASIC 市场的重要支点。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/041.htm", "publishedAt": "2026-11-05T23:48:51+00:00"}, {"title": "MacBook Pro 能触屏了，但这只是它最小的升级｜附选购指南", "summary": "触控向左，算力向右#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1687989?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-11-05T14:00:13+00:00"}, {"title": "视频生成只是开始，AI 如何把内容做对？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/GGILIuzW0RTGhoeuz9TD?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-05T13:54:21+00:00"}, {"title": "用 AI 写后端，为什么还是在造轮子？", "summary": "很多人已经习惯让 AI 写代码： 生成一个 CRUD 接口、补一段 SQL、写一个工具类，效率确实比手敲高。 但真正落到一个企业后台项目上，你会发现节奏并没有变快多少。AI 帮你写完了接口，接下来还是要处理权限、菜单、工作流、报表、审计日志、数据字典。这些代码不复杂，却占了项目的大半时间，而且每个项目都要重来一遍。...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503428", "publishedAt": "2026-11-05T10:52:19+00:00"}, {"title": "Chromebook 统治美国校园，AI 成了没得选的「套餐」", "summary": "为什么 AI 成了搜索的 「必选项」#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1687912?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-11-05T10:00:23+00:00"}, {"title": "当 Agent 成为数据库新用户，腾讯云如何解决“未知”的难题？", "summary": "点击查看原文>", "sourceName": const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
