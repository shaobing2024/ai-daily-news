const DATA = {"date": "2026-10-09", "generatedAt": "2026-10-09T02:43:12Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "Kimi 现代高速开源治理的 AI Native 实践｜QCon上海", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/832RV3o8ireEdJpO9H4v?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-09T10:00:00+00:00"}, {"title": "微软升级 Win11 的 AI 框架，实验性支持 GGUF 与 ONNX 原生本地推理", "summary": "IT之家 10 月 9 日消息，科技媒体 NeoWin 昨日（10 月 8 日）发布博文，报道称微软正与 llama.cpp 和 GGUF 开源社区合作，在 Windows 11 系统上升级 Windows ML，实验性原生支持 GGUF 与 ONNX 格式模型推理，并推出 Windows ML Runtime API。在 Windows 与 Surface 十月活动中，微软介绍了 Windows ML 的最新进展。Windows ML 是微软面向 Windows 11 的本地 AI 推理框架，开发者可在设备端运行 AI 模型，构建文本生成、语音识别等应用，并减少对特定硬件优化的依赖。微软表示通过社区合作，开发者现可通过 llama.cpp 的实验性集成，从 Hugging Face 导入 GGUF 模型并直接在本地运行。在性能方面，微软还携手英伟达公司，向 llama.cpp 及相关性能优化贡献代码。Windows ML 新增实验性 Windows 原生推理路径，可运行 ONNX 与 GGUF 两类模型。该路径正式名称为 Windows ML Runtime API，微软称其具备更高性能、更深的系统集成及更细粒度的控制能力。IT之家注：GGUF 是一种常用于本地运行大语言模型的模型文件格式。开发者可从 Hugging Face 等平台获取 GGUF 模型，并通过 llama.cpp 等工具在个人电脑上加载与推理。而 ONNX 是开放神经网络交换格式，用于在不同框架和硬件间迁移 AI 模型。ONNX Runtime 是其常用运行环境，可支持模型在 Windows 设备上的推理部署。在 Windows ML Runtime API 支持下，微软同时推出 Text Generation API 与 Speech Recognition API，开发者可使用这两组接口构建文本生成与语音识别功能。微软表示，ONNX Runtime API 仍获完整支持；未来针对 Windows 的优化将优先投向 Windows ML Runtime API。两种运行时均已包含在当前版本中，开发者可按熟悉程度选择迁移时机。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/825.htm", "publishedAt": "2026-10-09T02:21:34+00:00"}, {"title": "跳出 AI 试点陷阱：SUSE 企业级私有 AI 战略，用开源基础设施打通生产级落地", "summary": "AI 发展正在经历一个非常明显的分水岭：大量企业已经跑完概念验证，做过 Demo 试点，但卡在 “从实验环境迈向生产部署” 这道鸿沟上。很多团队会遇到相似的困境：POC 阶段效果惊艳，一旦迁移到本地数据中心、离线隔离环境、多云混合架构，就会暴露出数据安全、厂商锁定、运维复杂度飙升、算力资源浪费等一系列现实难题。...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502904", "publishedAt": "2026-10-09T01:55:35+00:00"}, {"title": "陶哲轩质疑 OpenAI 公司：719 篇 AI 数学证明，人类真的理解了吗？", "summary": "IT之家 10 月 9 日消息，OpenAI 于 10 月公布 719 份 AI 数学解答，涵盖 372 个数学结果族，涉及数百项开放研究问题，不过发布后被指尚未完全达到“数学与人工智能顾问小组”（AGMAI）提出的标准。IT之家此前报道，OpenAI 于 10 月 6 日最初在 GitHub 发布 722 份 AI 生成数学手稿总数，涉及 372 个结果族及多项开放研究问题。不过于 10 月 7 日因一处符号错误及其连锁影响撤回 3 份，现公开目录为 719 份。OpenAI 表示，发布前曾咨询普林斯顿高等研究院主持的“数学与人工智能顾问小组”（AGMAI），并参考其公开建议。然而，从公开信息看，此次发布尚未完全达到该小组提出的标准。AGMAI 此前建议前沿 AI 实验室停止在专有、外界无法访问的模型上测试高难度数学问题，并要求披露模型名称、提示词、推理链、耗时及计算成本等信息；但 OpenAI 此次仍使用专有模型，且仅 10 份手稿附有模型推理链。在人类可理解性方面，顾问小组强调 AI 生成证明应便于数学家审查和学习；但据报道，OpenAI 发布的证明中约 42% 未经形式化处理，也未提供将自然语言证明与形式化产物关联的机器可读元数据。AGMAI 同时声明，其咨询角色不构成对 OpenAI 获取或发布这些结果的认可，最终仍需由数学界评估相关建议是否得到充分执行。该事件再度引发关于 AI 生成数学成果的透明度、形式化验证、同行审查及学术研究自主性的争议。陶哲轩于 10 月 7 日在 mathstodon 上发布帖子，表示他并不反对 AI 做数学，甚至一直是 AI 辅助研究的积极使用者；但他强烈反对把“用 AI 快速攻克著名难题”当成主要目标或产品展示。他认为这会破坏数学共同体赖以运转的理解、教学、合作与开放探索机制。陶哲轩指出，传统数学中，一个长期猜想的突破并不只是“得到答案”：作者会做报告、参加研讨、与同行交流，随后证明会被简化、解释、纳入教材，并催生后续问题、合作者和新的研究方向。而 OpenAI 等公司当前的做法，往往是由提示者驱动 AI 自主解题；目标一旦“解决”，后续的理解、报告、同行讨论和领域建设却很少发生。陶哲轩认为，发布者甚至可能不足以解释 AI 的输出、回答问题或与领域互动。他把这种状况称为数学界的“证明消化不良”：AI 能高速生成命题、证明和反例，但人类来不及验证、理解、写作、教学和吸收，结果出现大量“无人能消化的证明”。他尤其担心的是，OpenAI 把纳维–斯托克斯方程等千禧年难题当作模型能力基准来攻克。在他看来，这把“解出多少题、多快解出”当成了衡量“理解与洞见”的指标；但速度和数量本身并不等于数学理解。陶哲轩强调，问题一旦被公开“解决”，就几乎无法恢复为“未解决”状态。即使人们后来想寻找不同路径、从中提炼新方法，仅仅知道答案存在，也会“污染”这一探索过程。因此，他批评这是一种不可持续的大规模“收割”：把开放问题当作可批量消耗的资源，最终会让整个数学领域变得不如传统研究方式下那样肥沃。IT之家注：陶哲轩是当代最负盛名的数学家之一、加州大学洛杉矶分校（UCLA）数学教授，也是 2006 年菲尔兹奖得主；常被称为“数学界的莫扎特”。相关阅读：《OpenAI 发布又一批 AI 数学研究成果，攻破数百个悬而未决难题》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/795.htm", "publishedAt": "2026-10-09T01:40:55+00:00"}, {"title": "《Artificial》奥尔特曼扮演者加菲尔德：演了这部戏，我开始怀疑 AI", "summary": "IT之家 10 月 9 日消息，当地时间 8 日，据《商业内幕》报道，安德鲁 · 加菲尔德在即将上映的电影《Artificial》中饰演 OpenAI CEO 萨姆 · 奥尔特曼，可这段表演经历并没有让他更加看好 AI。相反，出演这部电影让他对 AI 产生了疑虑。“我有点害怕，也不太信任这项技术。那些开发 AI、鼓励大家使用 AI 的人，似乎连自己都不完全清楚它能做到什么。所以我个人觉得，这有点不负责任。”加菲尔德曾使用 ChatGPT 查资料，也会把它当成“高级版谷歌”，但自己并不需要依靠 AI 开展演艺工作。“幸运的是，我是演员，不像其他行业的一些人那样，需要在生活中依赖 AI。”《Artificial》由卢卡 · 瓜达尼诺执导，聚焦奥尔特曼 2023 年短暂遭 OpenAI 罢免的风波。影片演员阵容涵盖多位硅谷知名人物：尤拉 · 鲍里索夫饰演伊利亚 · 苏茨克维，莫妮卡 · 巴巴罗饰演米拉 · 穆拉蒂，伊克 · 巴里霍尔兹饰演埃隆 · 马斯克，库珀 · 霍夫曼则饰演格雷格 · 布罗克曼。影片定于 12 月 25 日在部分影院上映。奥尔特曼也曾在采访中表达对这部电影的顾虑。他本周接受 Politico 的《Decoded》节目采访时说：“我敢肯定电影不会准确还原事实，但希望它拍得有趣，让人看得开心。”奥尔特曼还在接受《名利场》采访时透露，他看过电影预告片，加菲尔德甚至模仿出了他的一些习惯动作。他回忆起一次在家附近遇到剧组的经历：“他们就在我家门口拍戏。我们那条街上贴了通知，说要拍摄什么的。我也不知道怎么回事，根本没在意。有天早上，我出门买咖啡，走在街上发现周围全是摄像机，还有个人穿得跟我一模一样，背着和我一样的背包，在那里走着。我当时简直觉得自己遇到了模拟世界里的什么奇怪故障。”奥尔特曼形容当时的感觉“非常奇怪”。“后来我马上就明白是怎么回事了。我们互相挥了挥手，然后就各走各的。但那种感觉真的很怪。你想想，看到有人把你那些古怪的小动作都模仿得那么像，实在是件奇怪的事。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/786.htm", "publishedAt": "2026-10-09T01:14:02+00:00"}, {"title": "字节 Seed 团队发现 DeepSeek“抽风”原因，长上下文可能性能漂移", "summary": "IT之家 10 月 9 日消息，字节 Seed 团队今年 9 月底在预印本平台 arXiv 提交了一篇论文，谈到分块 KV 缓存压缩带来的相位敏感性，直指 DeepSeek“抽风”原因。该研究评估了基础版和后训练版的 DeepSeek-V4-Flash 和 DeepSeek-V4-Pro，以及后训练后的 DeepSeek-V4.1-Flash。模型通过分块 KV 缓存压缩以固定步幅将连续标记的窗口压缩为更少的缓存条目，能够减少长上下文推理的内存和注意力成本。然而，这种压缩还引入了一个新的位置坐标：Token 的相位，或其相对于压缩窗口边界的位置。该团队发现使用这种压缩的模型中存在系统性不对称性：相同的信息在一个阶段很容易检索，但在另一个阶段很难检索。团队将这种检索性能的周期性变化称为相位敏感性（phase sensitivity）。在采用此类压缩的大型开放权重模型中，长上下文检索准确度在各个阶段之间可能相差高达 40 个百分点，从而揭示了平均基准分数可能掩盖的周期性弱点。IT之家附论文链接：https://arxiv.org/abs/2609.36322", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/780.htm", "publishedAt": "2026-10-09T00:49:58+00:00"}, {"title": "新思科技拟寻求与中国 AI 实验室合作，在华加速芯片设计", "summary": "IT之家 10 月 9 日消息，据日经亚洲报道，芯片设计软件龙头企业新思科技（Synopsys）表示，尽管美国政府收紧了对人工智能与半导体的出口管制，但公司计划通过与中国的大语言模型（LLM）构建者合作，利用其工具的 AI 版本，协助中国本土企业加速芯片研发进程。当地时间 9 月 30 日，新思科技宣布与 OpenAI 签署多年期合作协议，双方将联手打造专用 AI 模型 GPT-Synopsys，旨在实现芯片设计流程的自动化并大幅缩短开发周期。新思科技首席产品管理官拉维 · 苏布拉马尼亚姆（Ravi Subramanian）在接受采访时透露，公司正着手探索与中国 AI 实验室建立合作关系，以便为中国市场量身定制类似的设计工具。近年来，新思科技面临着不小的压力。外界普遍认为，新兴的 AI 技术有可能颠覆并取代作为其立身之本的 EDA 软件。但在 9 月 30 日举行的年度投资者日活动上，新思科技称得益于将 AI 技术深度集成到自有工具中，预计 2027 财年公司营收将同比增长 15%，达到 111.5 亿美元（IT之家注：现汇率约合 748.75 亿元人民币）。苏布拉马尼亚姆指出，随着各界对 AI 模型训练和推理部署的需求激增，芯片迭代至更高性能的节奏显著加快，芯片制造商亟需诸如新思科技与 OpenAI 联合研发的新一代 AI 赋能设计工具来跟上市场步伐。我们看到芯片研发的迭代节奏正在急剧提速，这意味着一款芯片的完整设计流程必须压缩至一年以内…… 同时，设计中的芯片项目数量也在与日俱增。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/777.htm", "publishedAt": "2026-10-09T00:43:53+00:00"}, {"title": "消息称苹果并购业务换帅：Steve Smith 接任，团队时隔 7 年重回财务体系", "summary": "IT之家 10 月 9 日消息，彭博社今天（10 月 9 日）发布博文，报道称新任首席执行官约翰 · 特努斯（John Ternus）再次推动苹果公司人事变动，任命 Steve Smith 接替 Adrian Perica 出任并购主管，并将并购团队时隔 7 年重新纳入财务部门。Steve Smith，图源：LinkedInIT之家援引博文介绍，本次人事变动来自内部知情人士，苹果公司尚未对外正式宣布：人员新职务 / 职责汇报对象原职务或背景Steve Smith并购（M&amp;A）主管首席财务官 Kevan ParekhAdrian Perica 的长期副手，接手并购及企业发展业务。Adrian Perica继续负责 iCloud、Fitness+、News服务业务主管 Eddy Cue原并购及企业发展主管，任职超过 10 年。Carson OliverApp Store 副总裁服务业务主管 Eddy Cue接管 App Store 日常管理，此前已承担相关职责。Eddy Cue服务业务主管，职权扩大—新增 App Store、健康及健身团队的管理职责。在并购体系方面，Steve Smith 将接替 Adrian Perica，出任苹果并购主管。Smith 将向 CFO Kevan Parekh 汇报，这意味着苹果并购团队自 2019 年以来首次重新归入财务部门。此前，Perica 曾直接向时任 CEO Tim Cook 汇报。此次调整后，并购业务从 CEO 直属体系转入 CFO 管辖体系。上图人物为 Adrian Perica苹果并购及企业发展团队除收购公司外，也负责与外部企业谈判战略合作。该团队曾参与 2024 年苹果与 OpenAI 的协议，将 ChatGPT 集成至苹果产品，并涉及谷歌搜索在苹果设备上的长期默认安排。在服务业务方面，Adrian Perica 卸任并购主管后，继续负责 iCloud、Fitness+ 和 News 业务。他自 2023 年起管理这些服务，今后向服务业务主管 Eddy Cue 汇报。Eddy Cue 的管理范围扩大，新增 App Store、健康及健身团队，让服务业务的核心管理权进一步集中到 Cue 管辖范围。Carson Oliver 升任 App Store 副总裁，接管该平台的日常管理。长期负责 App Store 及苹果发布活动的 Phil Schiller 近几个月逐步退出日常管理。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/771.htm", "publishedAt": "2026-10-09T00:18:14+00:00"}, {"title": "OpenAI 推出 GPT-6.1 Sol Ultrafast 版：6 倍价格、最高 8 倍速度", "summary": "IT之家 10 月 9 日消息，OpenAI Developers 官方宣布，OpenAI 正式在 API、Codex 和 ChatGPT Work 中推出 GPT-6.1 Sol 的 Ultrafast 版本。该版本运行速度最高可达 Sol 标准版（Sol Standard）的 8 倍，定价为标准版的 6 倍（每百万 tokens 输入 12 美元（IT之家注：现汇率约合 80.5 元人民币），每百万 tokens 输出 60 美元（现汇率约合 402.7 元人民币））。在 Codex 和 ChatGPT Work 中，该功能现已面向 Pro 500、符合条件的按量付费企业版 (usage-based Enterprise) 以及采用配额计费的教育版 (credit-based Edu) 方案开放；企业用户需由管理员主动开启权限。面向 GPT-6.1 Sol 的 Ultrafast 版已在所有支持的区域上线，并全面支持美国和欧盟境内的数据驻留合规服务。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/768.htm", "publishedAt": "2026-10-09T00:04:37+00:00"}, {"title": "阿里巴巴蔡崇信：五年后 AI 将如今天的互联网，融入社会的每个环节", "summary": "北京时间 10 月 7 日晚，阿里巴巴集团主席蔡崇信在意大利都灵出席国际科技与投资盛会 Wave by Vento 2026，围绕 AI 的应用价值、阿里巴巴的全栈 AI 布局，以及未来 AI 的发展前景展开交流。蔡崇信预判，未来 AI 将从显性话题转为隐性基础设施。“五年后，人们可能不再单独讨论 AI，因为它将像今天的互联网一样，融入业务的每个环节。相关术语可能会随技术普及程度而演变，但 AI 作为根本性的技术突破，将持续影响商业与社会。”在交流中，蔡崇信重点分享了阿里巴巴的 AI 发展战略，他以 2023 年为分界，将公司发展划分为两个阶段。蔡崇信将阿里巴巴创业的 1999 年至 2023 年称为公司发展的“公元前”时期”（BC 时期）；这一阶段的阿里巴巴，业务规模持续扩大；2023 年起，公司进入“公元后”时期”（AD 时期），明确聚焦电商与全栈 AI 两大核心业务，并将 AI 视为面向未来的关键方向，决定全力投入。在他看来，AI 开启了发展的新纪元，并且刚拉开序幕。蔡崇信还进一步从算力、模型与应用层面对阿里全栈 AI 作出阐释：在算力层，依托阿里云 17 年的积累及其在中国市场的领先地位，构建计算能力；在模型层，自主开发大模型，形成智能能力；在应用层，将 AI 应用于面向消费者和企业客户的产品与服务。对于 AI 当前的能力边界，蔡崇信认为，AI 擅长帮助人们“省时间”，但在帮助人们“花时间”上，尚未取得同样的突破，还有巨大的发展潜力。在他看来，提升知识工作者的生产力，是 AI 最确定的应用场景。他估算，相关的总潜在市场规模（TAM）约为 50 万亿美元。在医疗、科研等领域，AI 也可以成为加速创新的工具。蔡崇信还阐述了以阿里为代表的中国公司的 AI 开源路径。“就像一所顶尖大学会向全世界开放、为学生提供助学金一样，AI 也应该把进展开源，让更多人受益。这也源于中国公司在哲学层面的选择。”蔡崇信非常看好欧洲正在涌现出来的几家“新云”（Neo Cloud）公司。他认为，开源路径是欧洲的机会。欧洲有大量的工业企业，可以把这些数据真正利用起来，利用开源模型改进业务运营。欧洲需要做的，是搭建算力基础设施，让开源模型能跑在自己的基础设施上。在被问及中国 AI 产业的发展时，蔡崇信表示，中国目前占全球工业生产总量的约 30%，中国工厂积累了大量高价值的制造过程数据，可以用于训练 AI 模型，帮助企业提升产品良率、优化产品设计；此外，中国在电动汽车、机器人等 AI 领域拥有完整的硬件供应链，未来在 AI 与物理世界结合的发展阶段，这一供应链优势将转化为显著竞争力。原标题：《蔡崇信：五年后 AI 将如今天的互联网，融入社会的每个环节》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/763.htm", "publishedAt": "2026-10-08T23:52:08+00:00"}, {"title": "3 名遭解雇 OpenAI 研究员发公开信，称公司做法或引发“寒蝉效应”", "summary": "IT之家 10 月 9 日消息，上周突然被解雇的 OpenAI 三名前研究人员米基塔 · 巴莱斯尼、托梅克 · 科尔巴克和贾斯敏 · 王今天（9 日）发表公开信。信中提到，担心此举会让其他员工不敢公开表达意见，对 OpenAI 的企业文化产生“寒蝉效应”。三人在题为《OpenAI 无法独自确保 AI 安全》的公开信中指出，OpenAI“不是一家普通公司”，员工能够放心地与外部机构合作解决安全问题，是 OpenAI 工作文化的重要组成部分。公开信由此前从事 AI 对齐研究的巴莱斯尼发布在社交媒体上，收信人为 OpenAI 的各安全委员会。另外两名署名者科尔巴克和贾斯敏 · 王此前均从事 AI 安全研究，同样遭到解雇。据《商业内幕》报道，OpenAI 发言人回应称，公司经过内部调查，认定三人违反了敏感信息访问和处理规定。三名研究人员则分别在社交媒体上称，公司只口头告知了他们解雇原因，而他们此前的行为均属于各自的工作职责范围。贾斯敏 · 王被指访问了一位高管的电子邮件，对此回应称：“公司给出的解雇理由根本站不住脚。”巴莱斯尼发帖称，公司告诉他，因为他“与第三方安全机构交流过多”，所以不再信任他。“我从未对外泄露公司的知识产权信息。我的工作一直与直属上级、研究部门管理层和董事会保持协调。”科尔巴克也发帖称，公司曾口头告知他，解雇原因是他“与 METR 沟通的方式”。“我要说清楚，与 METR 沟通本来就是我的工作。”IT之家注：METR 是一家负责评估 AI 模型及其安全风险的非营利研究机构。、三人在公开信中担忧，其他员工今后可能不敢再像以前那样发表意见、开展工作，而这些直到上周都是 OpenAI 工作中不可缺少的一部分。“像我们这样突然解雇员工，又如此仓促地通知当事人，让 OpenAI 过去引以为傲的开放文化受到了寒蝉效应的冲击。”三人还向 OpenAI 提出三项建议：允许第三方安全审计人员进驻公司，确保前沿 AI 模型仍可受到有效监测，并支持安全研究人员与 AI 安全领域其他机构和人员保持“公开、透明的交流”。OpenAI 一名研究部门负责人在发给员工的内部备忘录中，对三项建议表达了强烈支持。“我们非常感谢他们对 AI 安全工作的贡献，也感谢他们敢于直言、质疑现有观点。我们重视他们的意见，支持他们的工作，对他们给予了极大的信任。我必须明确一点，解雇决定与他们提出安全问题或公开发声无关。我们始终鼓励员工表达意见，今后也会如此。我们不会因为员工提出担忧就解雇他们。”科尔巴克还在社交媒体上写道，他担心 OpenAI 会以三人遭解雇为“借口”，减少与 METR 的合作。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/760.htm", "publishedAt": "2026-10-08T23:36:32+00:00"}, {"title": "Anthropic 修订使用政策，首次禁止用户虐待 Claude AI 模型", "summary": "IT之家 10 月 9 日消息，科技媒体 The Verge 今天（10 月 9 日）发布博文，报道称 Anthropic 修订 Claude 使用政策，将于 2026 年 11 月 12 日生效，首次加入禁止“持续且不必要的虐待或残忍行为”条款。该规则适用于用户反复、无明显目的地对模型实施残忍行为的情况。执行机制方面，Anthropic 表示主要方式为终止对话，但并未明确时候会引入用户封禁等进一步措施，并强调该条款不适用于常见抱怨、质疑、黑暗创作主题及模型测试与研究。IT之家附上相关截图如下：Anthropic 扩大武器禁令范围，涵盖使武器运转的软件与组件，以及武装无人机和其他自主车辆等行为。公司称已发现多起利用 Claude 开发武器指导或控制软件的尝试。监控条款明确禁止未经同意追踪个人，无论实时追踪还是分析既有数据。Claude 不得用于决定或建议执法与刑事司法程序中的调查、逮捕或起诉对象，也不得用于构建或改进监控工具。Anthropic 还规定，当 AI 连接至可能造成伤害的自主物理硬件时，必须由合格操作者观察设备并在必要时停止。对于特定政府客户，公司可在合同限制与安全措施充分时调整规则。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/759.htm", "publishedAt": "2026-10-08T23:31:17+00:00"}, {"title": "2万亿美元估值靠什么撑？Anthropic 核心技术负责人：蒸馏会毁掉前沿研发，中美 AI 竞赛不会单边暂停", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/dS754RhjExrwFP6tWD9d?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-08T14:10:29+00:00"}, {"title": "德国搜索引擎 Ecosia 甩了 Mistral：性能落后一整年，换中国开源模型省一半钱", "summary": "一个德国环保搜索引擎，当着整个欧洲的面说：你们的 AI 旗舰不行了，我用中国的。Ecosia，总部在柏林的搜索引擎和浏览器运营商，决定结束与法国 Mistral 的合作，改用中国开源模型为主。CEO Christian Kroll 的话半点没留情面：「我们对 Mistral 的质量感到失望，该模型如今已落后竞争对手一整年。」 今年 5 月 Ecosia 才...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502897/germany-ecosia-search-engine-mistral-china-open-source-ai", "publishedAt": "2026-10-08T10:59:30+00:00"}, {"title": "海外开源模型重新提速：“美版 DeepSeek”第一次交卷，Mistral同时亮牌", "summary": "点击查看原文>", "sourceNa 1+00:00"}, {"title": "速腾聚创第三季度激光雷达总销量 59.56 万台同比增长 220.9%，创单季历史新高", "summary": "IT之家 10 月 9 日消息，RoboSense 速腾聚创今日宣布，2026 年第三季度激光雷达总销量 595,600 台，同比增长 220.9%，创单季历史新高。ADAS 领域激光雷达销量 450,400 台，同比增长 200.1%机器人领域激光雷达销量 145,200 台，同比增长 309.0%IT之家获悉，2026 年前三季度，RoboSense 激光雷达总销量达 1,314,800 台，其中 ADAS 领域激光雷达销量为 887,000 台，机器人领域激光雷达销量为 427,800 台。延伸阅读速腾聚创科技有限公司英文名为 RoboSense，成立于 2014 年，总部位于深圳，是一家激光雷达及感知解决方案提供商，已在港交所上市。从环比看，速腾聚创 2026 年第三季度总销量较第二季度增长约 53.1%。其 2026 年前三季度累计销量 131.48 万台，已超过 2025 年全年的 91.20 万台。根据速腾聚创 2026 年 8 月发布的中期业绩公告，2026 年上半年公司实现营业收入 10.20 亿元，同比增长 30.2%；激光雷达总销量 71.92 万台，同比增长 169.6%。其中机器人领域激光雷达销量达 28.26 万台，同比增长 510.4%，机器人业务收入占公司产品收入近半，并成为产品毛利润的主要来源。速腾聚创 2025 年全年营收 19.41 亿元，同比增长 17.7%；激光雷达销量 91.2 万台，同比增长 67.6%。其中 2025 年第四季度公司实现营收 7.5 亿元，净利润 1.04 亿元，为其 2014 年成立以来首次实现单季盈利。在机器人领域，速腾聚创的数字化激光雷达产品已应用于具身智能、智能割草、工业搬运、商业清洁等多元场景。据其披露，公司已覆盖超 90% 的无人配送头部客户，产品在新石器、九识、白犀牛、京东等企业的新一代无人配送车上批量搭载，并与宇树、智元、众擎、越疆等超过 20 家机器人企业展开合作。在车载 ADAS 领域，截至 2025 年 12 月 31 日，速腾聚创已累计获得 34 家车企及一级供应商的 163 款车型定点，并已实现其中 16 家客户、57 款车型的 SOP；其产品包括面向中长距的 M 平台激光雷达（M1、M1 Plus、M2 等）以及面向补盲场景的全固态激光雷达 E1 等。面向 2026 年，速腾聚创表示已完成 400 万台的年产能布局，以匹配 ADAS 和机器人业务的放量需求。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/781.htm", "publishedAt": "2026-10-09T00:50:53+00:00"}, {"title": "OpenAI刚把多Agent做成产品，o1奠基人却说：1万个Agent解出世界级难题，多Agent贡献不到10%", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/3MSU3CcJuh0XjHDyjhXj?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-08T14:11:21+00:00"}, {"title": "苹果筑起的权限高墙，被 Meta AI 助手“借道”绕过", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/s2Rt9t0yqUFk6VYV33Mh?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-08T11:43:00+00:00"}, {"title": "Personal Agent 的终点不该是一个更聪明的命令行", "summary": "Qoni 是 Cognitive（认知）的延伸，是一个 Personal Agent 的托管基础设施，让企业开发者都能开发属于自己的 Muse。", "sourceName": "开源中国", "sourceUrl": "https://my.oschina.net/u/9765709/blog/19774529", "publishedAt": "2026-10-08T11:39: 创立。2024 年，谷歌取得了 Character.AI 的技术使用许可，并重新聘用两名创始人开发生成式 AI 产品。谷歌发言人称，谷歌并未参与开发 Character.AI 的产品。今年 1 月，Character.AI 和谷歌就另一起 2024 年提起的诉讼达成和解。佛罗里达州 14 岁少年休厄尔 · 塞策三世在受到 Character.AI 聊天机器人据称实施的自杀怂恿后身亡，其母随后起诉了两家公司。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/769.htm", "publishedAt": "2026-10-09T00:05:12+00:00"}, {"title": "iPhone 间谍软件 P7 DarkSword 曝光：每 15 秒通信外传照片等用户数据", "summary": "IT之家 10 月 9 日消息，网络安全公司 iVerify 昨日（10 月 8 日）发布博文，披露名为 P7 DarkSword 的 iOS 间谍软件变种，针对苹果 iPhone（原文并未披露具体影响机型），在降低设备痕迹的同时，每 15 秒一次的双向远程控制通信，可外传照片、备忘录、应用数据及任意文件。本次发现源于 8 月调查一起 DarkSword 感染事件，通过深入分析确认攻击者使用一种此前未见的变种，并将其命名为 P7 DarkSword，该名称源自攻击者在修改原始代码时使用的 p7_ 变量前缀，主要升级隐蔽性、稳定性与功能三方面。IT之家援引博文介绍，它移除 HTTP 请求与 syslog 中的调试日志，减少进程注入次数，并利用浏览器 localStorage 防止设备被重复利用。该植入程序注入 iPhone 的 SpringBoard 进程，通过 /beacon 端点每 15 秒向攻击者服务器发送一次请求。攻击者可远程调整间隔，并下发文件读取、照片上传、应用枚举、磁盘扫描及 JavaScript 执行等指令。P7 DarkSword 可将设备钥匙串数据转为 JSON 后外传，并扫描已安装的加密钱包应用。研究样本显示，其 wallet_extract 指令可提取 imToken 钱包相关数据。该变种还能上传照片、Apple Notes 数据库、应用沙盒文件及指定路径下的匹配文件。其 /war 端点用于外传钥匙串与钱包数据，/p 端点用于照片外传，/nb 端点用于备忘录外传。iVerify 表示，P7 DarkSword 显示 DarkSword 运营者仍在持续迭代植入程序。与许多 AI 辅助变种相比，该变种的作者对代码改动投入更多精力，在缩小设备痕迹的同时扩展了窃密能力。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/761.htm", "publishedAt": "2026-10-08T23:41:55+00:00"}, {"title": "Meta 首席 AI 官汪滔：不要指望 Muse 会自动帮你赚 1 万美元", "summary": "IT之家 10 月 9 日消息，据《商业内幕》今天（9 日）凌晨报道，Meta 首席 AI 官汪滔（Alexandr Wang）将会继续改进 Muse。他同时提醒，用户想让智能体帮忙赚钱，自己也得付出一点努力。“我们一直在想办法提升智能体的能力，让它们能不断处理更复杂的任务。”汪滔谈到了网上流行的一类提示词：一些用户要求智能体帮自己赚到指定金额。“我觉得挺有意思，很多人直接跟自己的 Muse 说：‘帮我赚 1 万美元（IT之家注：现汇率约合 67,125 元人民币）。’当然，不是谁提个要求，Muse 就能帮他赚到 1 万美元。想赚 1 万美元，你自己也得出力。”汪滔曾在#musemoneychallenge 挑战中鼓励用户用 Muse 寻找省钱的办法。但让 Muse 赚钱，要求又高了一层。Meta 希望不断改善 Muse 的记忆能力，让它帮助用户处理更复杂的任务。“智能体的记忆跟人的记忆不同。有时感觉很像，实际上差别很大。所以，记忆能力是我们一直努力改进的方向之一。”Muse 大受欢迎，成为汪滔领导的超级智能实验室团队的一款热门产品。上线一个月后，Muse 仍位居苹果 App Store 免费应用榜首。汪滔谈到，开发者使用智能体时能感受到它的神奇，Meta 希望让普通用户也更容易获得同样的体验。“行业大多把精力放在不断提升智能体的编程能力上。但我们觉得，存在很大的空白，因为世界上大多数人不会编程，恐怕也根本不想编程。”Meta 还要为 Muse 探索可持续的商业模式。汪滔提到，Meta 提供了不同档位的订阅服务。外界猜测，公司是否也会在智能体服务中引入广告，或许效仿 OpenAI 在免费版和 Go 套餐中的做法。对于广告，他的回应是，Meta 并未花太多时间讨论。“我们眼下并没有花很多时间考虑广告。”其他商业模式，可能就与用户要求 Muse 帮忙赚取的 1 万美元有关。“用户用 Muse 购物，或者 Muse 帮用户省钱、赚钱，我们可以想办法从这些交易中收一点费用。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/754.htm", "publishedAt": "2026-10-08T23:21:05+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "不等Gemini 4了！谷歌发布办公Agent，支持调用Claude", "summary": "新的“缝合怪”已经出现，怎么能够停滞不前", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/10/502083.html", "publishedAt": "2026-10-09T00:16:56+00:00"}, {"title": "记录创作历史， 而不只是代码历史 —— Libra，面向 Agent 的 AI 原生扩展版本控制系统", "summary": "Libra 是一款 AI 原生、兼容 Git 的版本控制系统，它还会记录工作是如何完成的——并把这份记忆保存在你的仓库里。", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/p/libra-vcs", "publishedAt": "2026-10-08T06:58:26+00:00"}, {"title": "KnowForge 2026.0.8 发布：协作写作、团队空间、AI 朗读，这次更新有点大", "summary": "KnowForge 2026.0.8 正式发布。 这次更新主要围绕 团队协作、阅读体验、内容管理和站点运维 进行了增强，同时修复了一批采集、翻译和交互问题。 本次更新亮点 多人协作写作 写作台现在支持更完整的多人协作： 显示正在编辑的协作者 多人同时修改时自动检测并合并冲突 新增正文批注与 @ 提及 新增「建议者」角色与修改建议...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502870", "publishedAt": "2026-10-08T01:33:24+00:00"}, {"title": "DLSS 5 正式版体验：十年没进步的游戏画面，英伟达怎么让它以假乱真？", "summary": "不只改变画面，更改变画面的生产流程#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1682974?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-10-07T07:44:32+00:00"}, {"title": "AI + SRE ≠ AISRE：AI 如何真正进入生产运维闭环｜QCon上海", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/u70P77XPmsXmRBciu6fL?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-06T10:00:00+00:00"}]}]};

const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
