的芯片阵容：标准版搭载麒麟 9030，Mate 90 Pro 搭载麒麟 9035，Mate 90 Pro Max 典藏版与 Mate 90 RS 非凡大师搭载麒麟 9050 Pro。详情可见IT之家此前报道。据华为发布会上公布的数据，Mate 90 Pro Max 整机性能较上代提升 31%，Mate 90 Pro 提升 20%，Mate 90 标准版提升 27%。麒麟 9050 Pro 集成灵犀 CPU、马良 GPU 和达芬奇架构 NPU，其中马良 GPU 计算单元与缓存翻倍，NPU 支持在端侧部署 30B 参数的混合专家架构大模型。值得注意的是，麒麟 9050 Pro 早在 9 月 7 日已随 Mate XT 2 三折叠手机首发亮相，当时华为时隔六年在旗舰发布会上推出全新麒麟芯片。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/011/756.htm", "publishedAt": "2026-10-12T01:28:57+00:00"}, {"title": "纸质书《终焉路独行》出现 AI 提示词，策划团队致歉称系误将校对软件提示词当正文处理所致", "summary": "IT之家 10 月 12 日消息，有读者近日在社交平台分享，称自己在阅读《终焉路独行》这本书时，正文内容横插了一句话：“需要我再微调部分语句，让整体文风更贴合悬疑灵异的氛围吗？”在与实体书相同内容的位置上，网络版第 80 章的段落之间并没有这句 AI 提示词。天津知语时光文化传媒有限公司、《终焉路独行》策划团队就此事发布致歉函，称经核查，原稿并无该内容，此错误系策划团队在文字精减处理过程中，误将校对软件所提供的提示词当正文处理所导致。IT之家附致歉函原文如下：另外，此前江苏凤凰文艺出版社方面回应称：稿子在编辑、校对等环节经手的人比较多，并非是作者的问题，已发出的书籍会回收后全部销毁，重新修订。相关阅读：《网文实体书籍内曝出“AI 回复内容”，出版社回应“将回收销毁已发出书籍，重新修订”》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/011/740.htm", "publishedAt": "2026-10-12T00:46:27+00:00"}, {"title": "OpenAI 宣布 GPT-6.1 Sol 默认上下文长度从 272k 提升至 500k，增加约 80%", "summary": "IT之家 10 月 12 日消息，OpenAI 的 Thibault Sottiaux（Tibo）今日宣布，已将 Codex 和 Work 环境下 GPT-6.1 Sol 的默认上下文长度提升至 500k，相比此前的 272k 增加了约 80%。Tibo 表示，尽管 OpenAI 未来还会继续提高上限，但这一调整已能显著降低上下文压缩的触发频率，并能更从容地处理那些需要长期保留大量上下文与复杂细节的任务。该数值经过充分测试，对绝大多数用户而言都是体验与性能的最佳平衡点（sweet spot）。当然，如果您希望调高或调低，依然支持手动设置，GPT-6.1 Sol 支持的最大上下文长度上限为 1M。IT之家注意到，配合本次调整，当从订阅中扣除使用量时，OpenAI 将不会对 GPT-6.1 Sol 收取长上下文费用。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/011/736.htm", "publishedAt": "2026-10-12T00:23:08+00:00"}, {"title": "小鹏智驾出海欧洲：两周微调适配一个国家，计划 2027 年落地 NGP", "summary": "IT之家 10 月 12 日消息，据彭博社报道，在巴黎车展前夕，小鹏汽车通用智能中心负责人刘先明接受采访时透露，该公司成功在约两周时间内，将智驾系统从一个欧洲国家微调适配到另一个欧洲国家。刘先明指出，这一适配过程所需的数据量，仅为训练底层人工智能基础模型所需数据的万分之一。我们只需利用非常少量的本地数据，就能完成模型在当地的对齐（即适配当地的道路环境）。据刘先明介绍，小鹏目前正与欧洲监管机构紧密沟通，并维持在 2027 年于欧洲正式落地智能导航辅助驾驶系统（NGP）的原定规划。刘先明强调，小鹏汽车致力于将全功能版智驾系统带入欧洲，而非妥协推出“阉割版”。除基础的车道保持与自适应巡航外，该技术能应对复杂的城市与高速路况，涵盖交通标识识别、避让骑行者，以及顺应欧洲城市特有的驾驶习惯。据IT之家此前报道，小鹏集团将携物理 AI 全品类产品亮相巴黎车展，届时将展出小鹏 G9L、MONA L03、小鹏 P7+、小鹏 G6、小鹏 G9、小鹏 X9 车型，以及陆地航母、IRON 机器人。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/011/732.htm", "publishedAt": "2026-10-12T00:06:28+00:00"}, {"title": "英国将加强网络防御，AI 国务大臣呼吁人工智能企业加大安全保障力度", "summary": "IT之家 10 月 12 日消息，据《卫报》报道，英国将加强其网络防御，同时呼吁顶尖人工智能研发企业在系统安全治理上采取更积极的举措。英国 AI 国务大臣卡尼什卡 · 纳拉扬（Kanishka Narayan）预计将在西伦敦发表的专题演讲中正式宣布上述政策主张。纳拉扬将呼吁前沿人工智能研发企业采取更多切实举措保障系统安全。IT之家获悉，纳拉扬表示，英国绝不能完全依赖科技巨头对其模型进行“自我监管”，并强调英国本土必须构建更多自主可控的 AI 基础设施。延伸阅读据英国政府官网资料，卡尼什卡 · 纳拉扬于 2026 年 7 月 20 日被任命为人工智能国务大臣，同时在英国内阁办公室以及商业、创新、科学与贸易部（BIST）任职。他此前于 2025 年 9 月 7 日至 2026 年 7 月 20 日担任科学、创新与技术部（DSIT）的议会副国务大臣，并于 2024 年 7 月当选威尔士格拉摩根谷选区议员。纳拉扬分管的内阁办公室职责中包括人工智能安全研究院（AI Security Institute，AISI）。该机构旨在构建人工智能风险的证据基础，为政府决策提供参考。据英国议会 2026 年 4 月披露的信息，AISI 已与 OpenAI、谷歌 DeepMind、Anthropic 等领先 AI 公司合作测试了超过 30 个模型，其发现会在模型部署前促成实际改动。2025 年 12 月 18 日，AISI 发布首份《前沿人工智能趋势报告》。报告显示 AI 系统能力提升迅速：在网络安全领域，模型完成学徒级任务的成功率从 2023 年的不足 9% 升至 2025 年的约 50%，2025 年首次有模型完成需要长达 10 年经验的专家级网络任务；在软件工程领域，模型完成时长约 1 小时的编程任务的成功率从两年前的不足 5% 提升至超过 40%；部分网络任务中，AI 无需人工指导即可完成的时长大约每 8 个月翻一番。报告同时指出，用于确保 AI 按预期运行的防护措施正在改善，红队找到“通用越狱”方法所需时间从几分钟延长至数小时，约提升 40 倍。在强化本土 AI 基础设施方面，英国政府此前已推出一系列举措：设立规模 5 亿英镑的主权 AI（Sovereign AI）风投基金，首笔股权投资投向 AI 基础设施公司 Callosum；发布《AI 硬件计划》，扶持研发 AI 芯片与半导体技术的英国企业；发布《网络增长行动计划》（Cyber Growth Action Plan）以提振本国网络安全产业，并扩大国家安全战略投资基金规模。英国政府认为，绝大多数 AI 系统应在使用环节受到监管。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/011/727.htm", "publishedAt": "2026-10-11T23:39:12+00:00"}, {"title": "SmartCall v1.0.8 发布，新增坐席可配置手机接听", "summary": ":book: 项目简介 SmartCall 是一套基于 AI 大模型 + Asterisk 通信引擎构建的新一代智能客服呼叫中心系统。系统深度融合了 AI 语音机器人、智能 IVR 流程编排、端到端双工对话模型、实时语音识别（ASR）、语音合成（TTS）、大模型意图识别 等核心能力，为企业提供从呼入智能应答到智能外呼的全链路 AI 客服解决方案。 无...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502959", "publishedAt": "2026-10-11T07:56:04+00:00"}, {"title": "全能 Go Agent 框架 covonaut v1.1.5 发布：改进检查点、Token用量与缓存", "summary": "covonaut 是一款面向 Go 的生产级 Agent 框架，提供完整的 LLM-工具循环、上下文压缩、重试与故障转移、生命周期钩子、分布式追踪，以及文件系统、 屏、灵盾防窥屏、麒麟芯片、XMAGE 华为睿影、昆仑玻璃、玄武架构、小艺、华为悦彰、方舟引擎、静谧通话、星迹定位、星闪、鸿蒙星河互联、鸿蒙星盾安全、鸿蒙空间计算、TruSense 玄玑感知系统、巨鲸电池等技术。现场还展示了 HUAWEI 睿影 Z10 模块相机的拆解图。该模块相机在今年 10 月 1 日举行的华为 Mate 90 系列及全场景新品发布会上正式亮相，有 H1、H2 两个卡口版本，分别适配 Mate 90 Pro Max 典藏版和 Mate 90 RS 非凡大师，定价 5999 元。延伸阅读此次沟通会的举办地上海练秋湖研发中心，是华为全球面积最大的研发基地。该研发中心总用地面积约 2400 亩，建筑面积约 220 万平方米，北侧毗邻淀山湖，南侧紧邻北横港，园区以青浦特有的水系为中心打造了 8 个各具特色的建筑组团，约可容纳 3 万人办公，于 2024 年启用。2026 年 5 月，央视《新闻联播》曾罕见播出华为芯片基础技术研究实验室画面，创始人任正非现身上海练秋湖研发中心与研发团队交流。这也是华为核心芯片研发阵地的首次公开亮相，该实验室支撑华为麒麟手机芯片、鲲鹏服务器 CPU、昇腾 AI 芯片等全线产品的源头创新。文中提到的 HUAWEI 睿影 Z10 是一套完整独立的影像系统，自带 1 英寸 5000 万像素传感器，可实现 24-240mm 的 10 倍连续光学变焦，并非简单的增距镜，内部配齐整套光学组件，装上手机即可完成成像，照片视频可直接在鸿蒙图库内处理分享。其 H1、H2 两款卡口依靠可拆卸转接环实现互换，全程徒手操作、无需借助任何工具；相机镜头本体接口完全一样，差别仅在于转接环。华为终端 BG CTO 李小龙曾对外解释，即便后续新款手机机身外形、开孔发生改变，只要官方推出对应的全新转接环，老的睿影 Z10 就能继续使用。在 2026 年 10 月 1 日举行的华为 Mate 90 系列及全场景新品发布会上，华为常务董事、产品投资评审委员会主任、终端 BG 董事长余承东宣布华为影像品牌 XMAGE 全新升级为华为睿影 XMAGE，并提出“睿观万象，聚光成影”的全新主张。首款逻辑折叠 τ 芯片麒麟 9050 Pro 为智慧影像构筑起端侧算力底座，其搭载第十代 ISP 与全新达芬奇架构 NPU。同一场发布会上，Mate 90 系列的芯片配置也同步公布：Mate 90 Pro Max 搭载逻辑折叠 τ 芯片，Mate 90 Pro Max 典藏版与 Mate 90 RS 非凡大师搭载麒麟 9050 Pro，Mate 90 Pro 搭载麒麟 9035，Mate 90 标准版搭载麒麟 9030。此外，Mate 90 系列全系配备第三代红枫原色摄像头，首次全焦段采用红外光学镀膜。关于文中的可靠性与电池技术：华为“全昆仑玄武架构”指机身玻璃均采用昆仑玻璃，整机采用玄武架构，其中 Mate 90 Pro Max 典藏版屏幕采用玄武昆仑玻璃，Mate 90 Pro Max 屏幕采用第三代昆仑玻璃，Mate 90 RS 非凡大师首发动态光栅昆仑玻璃；巨鲸电池为华为大容量电池技术品牌，例如此前机型曾搭载 8500mAh 华为巨鲸电池（额定值 8320mAh）。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/011/754.htm", "publishedAt": "2026-10-12T01:15:52+00:00"}, {"title": "Anthropic 放弃后，消息称亚马逊洽谈收购初创公司 Decart、看中 AI 芯片切换软件", "summary": "IT之家 10 月 12 日消息，据华尔街日报消息，据知情人士透露，亚马逊正就收购人工智能初创公司 Decart 展开谈判，该笔交易的潜在估值约为 70 亿美元（IT之家注：现汇率约合 469.48 亿元人民币）。总部位于旧金山的 Decart 专注于研发跨芯片适配软件，能够帮助开发者在不同 AI 芯片之间无缝切换。随着各大科技巨头纷纷竞逐算力资源，这一底层软件能力正变得愈发关键。知情人士指出，若谈判进展顺利且未出现新的竞购方，该交易或将很快达成。研究机构 PitchBook 的数据显示，Decart 此前已从红杉资本、Benchmark 以及 Radical Ventures 等知名风投机构累计筹集逾 4 亿美元（现汇率约合 26.83 亿元人民币）。在今年 5 月的一轮融资中，其估值已接近 40 亿美元（现汇率约合 268.27 亿元人民币）。IT之家注意到，据彭博社 8 月报道，Anthropic 曾洽谈收购 Decart，交易金额约为 60 亿美元（现汇率约合 402.41 亿元人民币）。今年 9 月，报道称 Anthropic 已放弃收购 Decart。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/011/720.htm", "publishedAt": "2026-10-11T23:01:49+00:00"}, {"title": "Scale AI 创始人汪滔谈创业管理：从亲自决定细节到学会放手，在 Meta 的任务是招揽人才", "summary": "IT之家 10 月 12 日消息，Scale AI 创始人、现任 Meta 首席 AI 官汪滔（Alexandr Wang）当地时间 10 月 11 日在做客 David Senra 播客节目时谈到了对首次创业者的建议：创办第一家公司时，创始人应亲自承担各项工作，深入掌握每个细节，之后再逐步学会放权。他认为，创始人需要对业务的每个细节形成明确判断，并亲自把控执行过程。Scale AI 的发展便采用了这种方式，创始人对各项工作的直接控制是公司取得成功的重要因素之一。不过，这种管理方式也带来了代价：所有决策都要经过他本人，使他逐渐成为业务推进的瓶颈。在加入 Meta 后，他采取了不同的管理方式。据介绍，Meta 超级智能实验室需要在很短的时间内完成大量工作，而他本人既非 AI 研究员，也不是产品设计师，无法亲自承担实验室所需的所有关键工作。因此，他将工作重点转向人才招聘，希望在各个专业领域招募顶尖人才，并为他们创造能够发挥专长的工作环境。相比亲自决定每项工作的具体做法，他更注重组建一支优秀的团队，让专业人员参与塑造产品和研究方向。汪滔于 2025 年 6 月出任 Meta 首席 AI 官，负责新成立的 Meta 超级智能实验室，Meta 同期向 Scale AI 投资 143 亿美元（IT之家注：现汇率约合 959.08 亿元人民币），获得其 49% 的无投票权股份。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/011/717.htm", "publishedAt": "2026-10-11T22:47:29+00:00"}, {"title": "Claude 动态多 Agent 工作流开始公测，支持庞大的工作负载", "summary": "Claude 官方把动态多智能体工作流放进公开测试版了。Claude Managed Agents dynamic workflows，ClaudeDevs 的说法是一种新型多智能体编排，『为最庞大的工作负载而生』——一个主 agent 写计划，计划跨多个 agent 分阶段运行，最后合并结果。 最能说明它价值的是那个冷冰冰的对比实验。官方在一条 116k 行的代码库里埋了...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502951", "publishedAt": "2026-10-10T10:21:36+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "百目 JArgus v2.0.6 — 静态检查器误报治理版本", "summary": "百目 JArgus v2.0.6 静态检查器误报治理专项版本：注解修饰的代码、编译器生成方法与框架反射调用点不再被误判，死代码检测理解 lambda 与方法引用，多个检查器的豁免规则对齐业界惯例。 github: https://github.com/vfaner/jargus/releases/tag/v2.0.6 Gitee: https://gitee.com/super_rgh/jargus/releases/tag/v2.0.6...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502961", "publishedAt": "2026-10-11T10:16:36+00:00"}, {"title": "利用 AI 代码智能体优化软件架构的五种方法", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/soRObi5sjdTTUM95zLJK?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-11T10:04:31+00:00"}, {"title": " const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
