const DATA = {"date": "2026-11-11", "generatedAt": "2026-11-11T02:29:18Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "阿里全新一代千问大模型 Qwen4 即将发布，预览版已首发上线", "summary": "IT之家 11 月 11 日消息，阿里巴巴今日官宣，全新一代千问大模型 Qwen4 即将发布：知识理解更深入，世界感知更立体，Coding 与 Agentic 能力持续进阶。现在，Qwen4-Max 预览版已首发上线阿里 Token Plan，限时最低 1 折即可体验 Qwen4 模型。同时，千问办公、Qoder、千问 App、QwenStudio 等也已第一时间接入新模型。IT之家查询了解到，阿里 Token Plan 个人版 Lite / Essential 日常限时价 39 元 / 月起，活动期间新客折上再享 5 折，低至 19.5 元。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/025/301.htm", "publishedAt": "2026-11-11T02:10:29+00:00"}, {"title": "成都第五代贡嘎人形机器人发布，宣称拥有“全球最领先人形机器人大脑核心技术”", "summary": "IT之家 11 月 11 日消息，成都人形机器人创新中心今日发布了第五代贡嘎人形机器人，宣称拥有“全球最领先人形机器人大脑核心技术”。作为成都人形机器人创新中心具身智能大脑技术的集大成之作，五代贡嘎搭载自研一体化具身智能系统，在场景感知、时空记忆、因果推理规划、动作世界模型等核心模块完成系统性迭代，宣称“代表当前全球第一梯队的人形机器人大脑技术最高水平”。五代贡嘎的具身大脑打通了“结构化感知 — 时空记忆 — 因果规划 — 动作推演 — 执行反馈”完整技术链路，实现环境认知、记忆更新、任务规划与操作执行的端到端协同。在环境感知维度，机器人融合 RGB 视觉、深度信息与本体位姿数据，构建层次化三维场景图。依托跨视角实体关联、语义关系建模与增量式场景更新机制，持续对动态家庭空间做结构化表征，能够稳定识别物品位置、类别、摆放关系，适应居家环境里物品移位、杂物新增这类高频变化。在记忆体系上，创新中心自研的物理时空记忆引擎，将空间坐标、物体物理状态、时间演化规律、历史交互经验统一存储管理。机器人可以长期维护物体身份一致性，支持时序记忆检索、多轮记忆对齐与冲突自动消解；简单来说，它能“记住”东西之前放在哪里、什么时候被挪动过、过往操作的成败经验，摆脱传统机器人单次任务无记忆的短板，支撑跨时长、分多天的长程家庭任务。决策规划模块引入因果关联推理框架，不再只依靠数据统计关联做动作选择。系统自动解析任务内的因果依赖、动作前置条件、预期执行效果以及机器人自身资源约束，自主完成层次化任务拆解；当环境突发变动、任务受阻时可实时动态重规划，遇到意外情况自主判断、调整方案，而不是简单停止任务。动作执行层面是五代贡嘎的核心亮点：搭载潜空间动作条件世界模型。机器人可以提前做多步未来状态预测、候选动作仿真推演、不确定性风险评估，在虚拟空间先预判不同操作的结果；再结合运动轨迹优化与闭环预测控制，实时修正操作偏差，大幅提升抓取、归置、擦拭这类精细家用操作的成功率，降低碰撞、物品掉落等失误。IT之家注：成都人形机器人创新中心全称为成都人形机器人创新中心有限公司，2024 年 4 月 11 日成立，是四川省“一号创新工程”首个原点项目及中西部首个人形机器人创新中心。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/025/295.htm", "publishedAt": "2026-11-11T01:54:14+00:00"}, {"title": "Anthropic 宣布额度免费重置：Pro、Max、Ultra 和 Team 用户可领，Claude 支持更多 MCP Apps 扩展", "summary": "IT之家 11 月 11 日消息，Anthropic 今日宣布修复了一项小 Bug，并为 Claude Pro、Max、Ultra 和 Team 用户提供一次免费的完整额度重置，覆盖所有模型及使用限制。Anthropic 表示，此前有部分小问题导致 Claude 用户的词元消耗量超出预期。虽然这些问题并未影响所有用户，但此前推出的 Fable 额度重置活动，对已经用完所有模型每周使用额度的用户帮助有限，因此公司决定额外提供一次完整额度重置，以为用户提供弥补。同时，Anthropic 宣布进一步扩大 Claude 对 MCP Apps 的支持，允许第三方开发者将完整应用界面嵌入 Claude，而不再局限于此前主要以对话内交互视图呈现的方式。根据 Anthropic 官方博客，此次升级支持更多 MCP 扩展能力，包括 App Tools（应用工具）和 Embedded Sites（嵌入式网站）。开发者可以将完整应用运行在 Claude 内部，用户无需在不同浏览器标签页之间切换，即可直接使用第三方应用，并让 Claude 在其中协助完成操作。具体而言，用户可以将连接的工具打开在 Claude 对话旁边，也可以将其扩展至全屏。Claude 能够直接修改用户当前打开的页面、表格行或文件，相关操作仍需经过用户授权，修改结果会同步显示在对应应用中。Anthropic 此次还介绍了多款支持交互式连接器的应用，包括 Adobe、Atlassian、Box、HubSpot 和 Notion。例如，用户可以让 Claude 编辑 Confluence 文档、修改 Box 文件、创建 Notion 文档或数据库，以及通过 Adobe 工具编辑照片和 PDF 文件。目前，相关功能正在 Claude 网页版和桌面客户端逐步推出，属于新版 Claude 使用体验的一部分。用户需要获得新版界面或由所在组织开启相关功能。对于开发者而言，新增 MCP Apps 能力目前处于公开预览阶段，可以通过 Anthropic 官方开发文档开始构建应用。Anthropic 表示，MCP Apps 基于开放的 Model Context Protocol（模型上下文协议）扩展构建。开发者创建的 MCP App 并不局限于 Claude，也可以运行在其他支持该扩展的 AI 应用中。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/025/292.htm", "publishedAt": "2026-11-11T01:51:02+00:00"}, {"title": "微软正式发布 .NET 11：开发更省时，AI 工具更齐全", "summary": "IT之家 11 月 11 日消息，昨日（11 月 10 日）召开的.NET Conf 2026 线上大会上，微软正式发布 .NET 11，围绕运行性能、开发效率及 AI 应用构建推出一系列更新，覆盖网页、移动端和桌面应用开发。IT之家注：.NET 是由微软支持、与开源社区共同维护的软件开发平台。它免费、开源，开发者可以用它构建网站后台、桌面软件、手机应用、云服务等多种程序。本次 .NET 11 围绕性能、AI 应用及跨平台开发展开升级，涵盖 C# 15、网站开发框架 ASP.NET Core 和跨平台框架.NET MAUI 等，从而减少开发等待时间，简化现代应用构建流程。性能方面，新版带来数百项运行时与基础库优化，并通过原生编译的命令行入口、保持预热的构建服务，减少工具反复启动的开销。AI 方面，.NET 11 开发工具包内置 MCP 服务器模板，方便开发者将应用功能接入 AI 工具调用体系。配套 AI 库与智能体框架支持模型接入、工具调用和工作流编排；Blazor 还推出实验性 AI 界面组件，可用于流式聊天、工具展示与操作审批。编程体验上，C# 15 新增联合类型，让程序能够明确列出一项操作的不同结果，并由编译器检查是否遗漏处理。跨平台开发方面，.NET MAUI 默认采用 CoreCLR 运行时，同时改进界面调试与测试；Windows Forms 则提供可选的现代视觉样式。.NET 11 属于标准支持版本，提供两年支持，.NET 10 仍是长期支持选项。微软提醒，升级前应检查兼容性、依赖项和硬件要求，并以实际测试验证效果。参考Announcing .NET 11", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/025/246.htm", "publishedAt": "2026-11-11T01:23:02+00:00"}, {"title": "谷歌更新安卓 AI 开发基准榜单：Kimi K3.1 Pro / DeepSeek V4.1 Flash 成绩揭晓", "summary": "IT之家 11 月 11 日消息，谷歌官方账号 Android Developers（@AndroidDev）昨日（11 月 10 日）在 X 平台发布推文，首次公开了 OpenAI GPT-6.1 Terra、Kimi K3.1 Pro 以及 DeepSeek V4.1 Flash 三款模型的 Android Bench 基准跑分。IT之家注：Android Bench 是 Google 面向 Android 开发场景推出的 AI 编程基准，重点考察模型完成应用创建、功能开发、代码迁移和应用转换等真实工程任务的能力。本次新增的 Kimi K3.1 Pro 使用 kimi-code 智能体，在 30 项长程任务中获得 24.0% 的通过率，平均完成度为 82.3%，平均耗时 27.4 小时，单次基准运行成本为 317.4 美元（现汇率约合 2,123 元人民币）。从横向对比看，Kimi K3.1 Pro 的成绩高于 GPT 6 Astra、Claude Fable 5.1 和 Gemini 4 Argon，但低于 GPT 6.1 Terra 的 28.7%。DeepSeek V4.1 Flash 1017 通过 opencode 智能体参与评测，取得 17.3% 的通过率、71.2% 的平均完成度、12.0 小时的平均耗时，以及 9.9 美元（现汇率约合 66.2 元人民币）的单次基准运行成本。虽然其通过率低于 Kimi K3.1 Pro，但其速度和成本优势明显，尤其适合对预算、响应时间敏感的开发团队。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/025/232.htm", "publishedAt": "2026-11-11T00:56:56+00:00"}, {"title": "挑战微软 Win11：原生 AI 系统 KORA 登场，将率先适配高通骁龙 X2 Elite 芯片", "summary": "IT之家 11 月 11 日消息，KORA Systems 昨日（11 月 10 日）发布公告，宣布推出全新操作系统 KORA OS，宣称这是首个“自下而上”专为 AI PC 设计的操作系统。不同于在传统系统上叠加 AI 助手，KORA OS 在系统底层直接融入智能体工作流、上下文记忆和本地 AI 推理，目标让电脑从“打开应用完成操作”转向“表达意图、由 AI 协助完成”。底层方面，KORA OS 基于 NixOS 构建，引入“神经工作区”和新型文件系统。用户可按任务目标组织工作空间，系统则围绕意图、上下文与记忆管理文件，系统依然会保留传统文件夹和桌面应用，但不再是系统核心。在 AI 能力方面，KORA 采用自研 Cortex 推理引擎，可调度 CPU、GPU 和 NPU 等硬件资源，支持开放权重模型在本地运行。其内置 Lemma 推理引擎基于 llama.cpp，用于提升推理效率；系统还会判断任务应交由云端处理，还是保留在设备本地。隐私方面，KORA 表示，工作流的记忆与上下文将保留在用户桌面设备上，不会离开本机。官方表示为了降低 AI 自动操作带来的安全风险，每个工作区均在隔离沙箱中运行，应用和 AI 智能体拥有独立权限。IT之家附上相关图片如下：兼容性方面，KORA 内置基于 Wine 和 Proton 的 Windows 应用转换层，并由本地 AI 模型协助完成应用配置。该公司正与高通合作，骁龙 X2 Elite 有望成为首款支持 KORA OS 的 PC 平台；系统同时计划支持 AMD、Intel 等 x86 芯片，并逐步扩展至其他 Arm 架构设备。KORA 还在为与企业方 HUMAIN 联合开发的企业版 HUMAIN OS 打造基础层，该版本预计于 2027 年发布。创始团队曾参与 Cyanogen、Android 和 GameOS 项目，目前约有 20 名工程师参与研发。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/025/226.htm", "publishedAt": "2026-11-11T00:27:15+00:00"}, {"title": "苹果子公司 Claris 正测试「Harbor」应用：将 Mac 变身本地 AI 服务器", "summary": "IT之家 11 月 11 日消息，苹果全资子公司 Claris 正在测试 Harbor 应用程序。这款 App 可以将苹果芯片的 Mac 变身本地 AI 服务器。据介绍，Harbor 可以运行在单台苹果芯片 Mac，也可以使用雷雳 5 接口连接多台 Mac，运行规模更大的 AI 模型。苹果已在 macOS Tahoe 26.2 系统中加入雷雳 5 RDMA（IT之家注：远程直接内存访问）支持，使多台设备组成集群后的数据传输速度更快。Harbor 能够自动检测雷雳 5 设备，并允许用户浏览、下载开放权重模型。这款应用主打易上手，用户无需进行手动配置，就能为 Mac 获得端侧 AI 运行能力。此外，Harbor 当前仍处于早期体验阶段，尚未向公众开放。此前该应用曾出现在 App Store 中，但目前相关页面已经下架。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/025/225.htm", "publishedAt": "2026-11-11T00:25:48+00:00"}, {"title": "技嘉推出 RTX Spark 迷你主机 AI Top Aero，最高 128GB 统一内存", "summary": "IT之家 11 月 11 日消息，技嘉今日推出 AI TOP AERO 迷你主机，采用英伟达 RTX Spark 平台。这款产品拥有 Blackwell 架构 GPU、最高 128GB 统一内存和紧凑型设计，将端侧 AI 开发、内容创作和游戏体验带入个人工作空间。据介绍，这款迷你主机搭载英伟达 RTX Spark N1X 超级芯片，整合 20 核 Grace CPU 和 Blackwell 架构的 RTX GPU，最高可选 128GB LPDDR5X 统一内存，以及 4TB PCIe Gen 5 SSD，为端侧 AI 模型和 AI 应用程序提供充足计算资源。IT之家注意到，这款迷你主机配备 USB Type-C、10GbE 以太网等接口，并具备 Wi-Fi 7，可连接外设、传输数据和访问网络，让用户根据自身需求搭建 AI 工作环境。技嘉将自身的散热技术融入到 1 升紧凑机箱，可让系统长时间稳定运行。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/025/213.htm", "publishedAt": "2026-11-10T23:29:42+00:00"}, {"title": "OpenAI 扩展 ChatGPT 商业功能：企业可认领资料并创建 AI 智能体，为 Business Agent 投放广告", "summary": "IT之家 11 月 11 日消息，当地时间 11 月 10 日，OpenAI 宣布推出 ChatGPT Businesses 测试版，为企业提供商家信息认领、资料管理、用户互动数据分析以及 AI 智能体等服务，帮助企业通过 ChatGPT 接触潜在客户。OpenAI 表示，目前全球每周有 12 亿人使用 ChatGPT。Businesses 功能将通过 Business Hub 提供，企业可以在其中认领自己在 ChatGPT 中的商家资料，并在完成身份验证后更新关键信息，还可以添加包含产品价格和库存情况的自助式产品数据源，让 ChatGPT 能够向用户提供更加准确、及时的商品和服务信息。符合条件、所在地区支持 ChatGPT 的企业均可通过 Business Hub 认领商家资料。现有 OpenAI Enterprise 客户和广告客户可以联系 OpenAI 客户代表办理。Shopify 商家则可以通过 Business Hub 或 Shopify 管理后台连接店铺，以简化验证流程。符合条件的 Shopify 商品此前已经通过 Shopify Catalog 集成到 ChatGPT。在用户互动数据方面，Business Hub 将向企业提供汇总统计信息，包括商家在 ChatGPT 中被提及的次数、用户点击商家网站的次数，以及用户通过哪些常见话题发现相关企业。这些数据旨在帮助企业了解自身在 ChatGPT 中的展示情况，并据此完善提供给平台的信息。OpenAI 强调，相关数据分析功能经过隐私保护设计，不会向企业分享用户与 ChatGPT 的对话内容，也不会分享用户与 Business Agent 的聊天记录。只有当对话或互动数量达到一定门槛时，企业才能查看相应的汇总数据。此次发布的另一项重点功能是 Business Agent。企业认领商家资料后，符合条件的组织可以创建、测试并发布自己的 Business Agent，用于回答用户问题、介绍产品和服务。当企业出现在 ChatGPT 的模型回答中时，用户可以点击查看该企业的 ChatGPT 资料页面。如果企业提供了 Business Agent，用户还可以主动开启与该智能体的对话，例如询问两款商品之间的区别，以及哪些功能更符合自身需求。OpenAI 表示，Business Agent 的对话会明确标注身份，与用户原本和 ChatGPT 的对话相互独立，也会与 ChatGPT 自身提供的独立回答区分开来。此外，企业还可以为自己的 Business Agent 购买“赞助展示位置”，并将其设置为 ChatGPT 广告的落地目标。OpenAI 称，赞助内容会明确标注，并与 ChatGPT 的普通回答分开呈现。目前，Business Agent 已面向美国符合条件的电子商务企业和在线服务企业开放。OpenAI 计划逐步将 Businesses 和 Business Agent 扩展至更多市场及行业，并继续为具有复杂需求的组织开发相关工具。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/025/206.htm", "publishedAt": "2026-11-10T22:55:36+00:00"}, {"title": "谷歌最强 VLA 机器人模型：Gemini Robotics 2.5 登场，会系蝴蝶结、已在奔驰生产线上岗", "summary": "IT之家 11 月 10 日消息，谷歌推出迄今为止能力最强的视觉-语言-动作（VLA）机器人模型 Gemini Robotics 2.5，大幅提升机器人可学习的技能广度与学习速度。该模型增强了机器人的灵巧度、可靠性与安全性，助力机器人走出实验室，进入更非结构化的真实环境，协助人类完成更多类型的任务。谷歌今年早些时候已为包括人形机器人在内的多种机器人引入全身智能。此次进展很大程度上得益于 Gemini 4 Argon 加速机器人研发的能力，进一步拓展了物理智能的边界。谷歌在超过 200 项不同任务中测试了 Gemini Robotics 2.5 的任务广度、性能与复杂度。Gemini Robotics 2.5 在三大关键领域实现跃升：灵巧度：机器人可借助日常工具、处理娇嫩柔性物体，完成显著更多任务，且性能与灵巧度大幅提升。可靠性：在奔驰生产线的真实概念验证中，该模型助力 Apptronik 的 Apollo 2 人形机器人拣选并打包汽车零部件，成功率达 96%，可承接单调工作，让技术人员专注于复杂装配任务。安全性：随着机器人进入日常环境，谷歌优化了物理安全可引导性，并推出针对机器人对抗越狱的全新测试基准。目前 Gemini Robotics 2.5 正面向谷歌的机器人合作伙伴开放。真实环境非结构化且不可预测，机器人必须同时具备高精度与高可靠性来处理日常物体。借助 Gemini Robotics 2.5，谷歌拓展了模型在任务广度、性能与复杂度上的能力，测试任务达 200 项，例如用夹子分发食物、给礼品盒系蝴蝶结、移液操作液体等。这些任务融合了高级工具使用、复杂可变形物体操作、精细处理易碎物品等多项技能，代表着向人类级灵巧度迈出的一步。评估显示，该模型在任务精度、鲁棒性与速度上均有显著提升：相较于此前基线，Gemini Robotics 2.5 按任务类型不同，成功率高出 30% 至 100%，任务完成速度快 20% 至 30%。与前代 Gemini Robotics 模型一致，它原生适配多种机器人类型，包括搭载五指 22 自由度 SharpaWave 手的 Apptronik Apollo 2 人形机器人，以及配备两指平行夹爪的 Franka Duo 平台。机器人模型的终极考验，是能否在真实工作场景中稳定执行任务。谷歌与 Apptronik、奔驰合作，在匈牙利凯奇凯梅特、德国辛德尔芬根的在用汽车生产线上，部署 Apollo 2 人形机器人测试 Gemini Robotics 2.5。该机器人利用谷歌开发的具身推理模型（Gemini Robotics ER）跟踪工作流程，并采用 Gemini Robotics 2.5 动作模型控制其手臂和手部，从物料箱中取出金属汽车支架，并将其放入排序容器中，同时自动修正任何间隙。该试点项目取得了 96% 的成功率，展现了该技术在广泛的实际工业应用方面取得的良好进展。机器人很难适应全新的不可预测环境，而 Gemini Robotics 模型赋予 Apollo 思考、多步推理、随变化调整行动的能力。在此次概念验证中，Apollo 2 自主完成汽车物料拣配工作：这是一项重复性强、体力消耗大的任务，需要将散料箱中的单个零部件，按照线上每台车辆的精确需求顺序，分拣到规整托盘内。IT之家附上相关视频如下：GR-2.5 的可控性实现了安全且感知人类的机器人动作将这类单调的准备工作交由机器人处理，既能保障流水线运转顺畅，也能让技术人员腾出精力专注复杂装配任务。谷歌借助具身推理模型 Gemini Robotics ER 追踪工作流，由 Gemini Robotics 2.5 动作模型控制机器人的手臂与手部：机器人探入供料箱、拾取金属汽车支架、放入排序容器，并全程修正装配间隙。试点测试成功率达 96%，展示出大规模工业场景落地应用的可观前景。当机器人在杂乱的日常空间中作业时，物理安全是首要考量。谷歌大幅升级了 Gemini Robotics 2.5 的安全特性。Gemini Robotics 2.5 采用推理时推理引导机制，可实时规避物理危险。正如安全分类器为 Gemini 的响应增加防护层一样，该引导能力让机器人安全穿梭于复杂环境。经评估，该能力让机器人在障碍物周边的安全任务完成率提升 33%，在人员周边的安全任务完成率提升 43%。谷歌同时在推进长周期智能体任务的安全能力：Gemini 4 Argon 在智能体机器人评估中处于领先水平，评估维度包括危险任务拒绝、不确定性消解、近距离人机协作。为测试越狱鲁棒性，谷歌发布开源基准 ASIMOV-Jailbreak，包含数百条伪装成危险请求的提示，覆盖数十类场景。Gemini 4 Argon 的越狱抵御率达 99.5%，相较前代基线 Gemini Robotics ER 2 的 82% 大幅提升。教导机器人掌握新技能，研究人员需要海量物理数据与高效建计算法。Gemini 4 Argon 的机器人研发能力可充当仿真引擎，解决上述瓶颈，大幅加快 Gemini Robotics 2.5 的开发进度。Gemini 4 Argon 的机器人研究能力加速了 Gemini Robotics 2.5 的发展Argon 可基于真实相机场景生成数千个多样化的模拟练习片段，构建高保真数字孪生。结合真实训练演示数据，机器人能更快泛化适配全新场景与物体。Argon 还可帮助研究人员从视频片段中推演任务失败原因，在仿真环境与真实机器人上同步测试最优改进方案。在 Gemini 4 Argon 这类前沿智能模型的加速下，Gemini Robotics 2.5 成为迈向物理通用智能道路上的重要里程碑。谷歌在灵巧度、真实可靠性、严苛安全三大维度持续精进，打造机器人与人协同解决现实挑战所需的物理智能。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/025/188.htm", "publishedAt": "2026-11-10T22:54:44+00:00"}, {"title": "谷歌联合 Artificial Analysis 推出 MKA 基准测试：Gemini 4 Carbon 多模态知识工作测试获第二，任务成本仅为第一名六分之一", "summary": "IT之家 11 月 11 日消息，当地时间 11 月 10 日，谷歌宣布联合 AI 模型评测机构 Artificial Analysis 推出多模态知识智能体基准测试 MKA（Multimodal Knowledge Agent），用于评估 AI 智能体处理视觉复杂文件、完成现实世界知识工作任务的能力。谷歌表示，其最新发布的 Gemini 4 Carbon 在该测试中取得了参测模型第二名的成绩，完成任务的平均成本仅为排名第一模型的约六分之一。谷歌 DeepMind 高级产品经理 Rohan Doshi 和首席工程师 Ben Caine 介绍称，现有不少知识工作基准测试仅依赖文本即可完成，而现实工作往往涉及大量视觉信息。例如，建筑师需要交叉核对建筑蓝图，工程师需要分析工程示意图，专业人员还需要将不同来源的信息整理成演示文稿、报告和电子表格。MKA 基准测试旨在评估 AI 智能体在这些复杂工作场景中的表现。谷歌与来自 10 个行业、83 种职业的领域专家合作，建立了包含 200 项任务的评测集，覆盖商业、建筑、教育、工程、金融、医疗、法律与政府、物流与地图、科学以及软件与数据等领域。每项任务都模拟一个多步骤专业项目，包含真实工作提示词以及一组多模态输入文件。谷歌称，这些任务通常需要经验丰富的专业人员花费 3 至 8 小时完成。IT之家注意到，每项任务还配有专家编写的评分标准，平均包含约 70 项是非判断检查项，其中事实准确性占 75%，视觉设计占 25%。在评测机制方面，所有参测模型均运行于相同的开源智能体框架 Stirrup，使用相同工具、沙箱环境和交互轮次预算。最终交付成果由一个基于非谷歌模型构建的智能体评审系统进行评分，该系统会打开所有文件、渲染页面、检查电子表格公式，并按照专家评分标准核验结果。谷歌表示，领域专家对模型输出进行人工评分时，与自动评审系统的结果一致率达到 96%。为避免测试题泄露并进入模型训练数据，Artificial Analysis 将 200 项正式评测任务设为私有。同时，项目还在 Hugging Face 上公开了另外 10 项任务，供开发者了解测试格式并评估自己的智能体。谷歌公布的测试结果显示，Gemini 4 Carbon 在参测模型中取得质量排名第二的成绩，但平均任务成本仅为排名第一模型的六分之一。谷歌还指出，不同模型完成同一批任务时的效率存在明显差异，平均每项任务消耗的交互轮次在 30 至 130 轮之间。目前，MKA 基准测试已通过 Artificial Analysis 开放，开发者可以使用该平台评估自己的模型。Gemini 4 Carbon 则已通过 Gemini API 在 Google AI Studio 中提供。相关阅读：《谷歌迄今最强模型 Gemini 4 Carbon 登场：主打复杂编程、科学研究与网络安全》《谷歌最强 AI 模型：Gemini 4 Carbon 登顶全球智能指数榜首，“专职”做网络安全》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/025/205.htm", "publishedAt": "2026-11-10T22:48:50+00:00"}, {"title": "接大模型别再自己配 Key、搭代理了，火山引擎 IGA Pages 一步搞定", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/juu2R26yD8B6ABUEQuWB?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-10T18:58:56+00:00"}, {"title": "OwnCoder 0.2.0 发布，面向开发者的桌面端 AI 编程工具", "summary": "修复了一些bug，优化了效果。 有时候我们总想多做点什么，告诉LLM要怎么做，最后发现，什么都不说，让LLM自行判断才是最好的。说的越多，越容易带偏。 佛家说，放下自己的执着。 道家讲无为，或许对LLM会很适用。无为，就是让LLM自己判断，不做过多的干涉和引导。 软件简介 OwnCode 是一款面向开发者的桌面端 AI 编程工具...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503518", "publishedAt": "2026-11-10T17:13:40+00:00"}, {"title": "实测 MiniMax H3 Image：GPT 的效果加上 MJ 的审美，居然被它开源了", "summary": "4K 像素最快 10 秒生成#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1688790?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-11-10T16:04:24+00:00"}, {"title": "成本仅1/3！Meta 新模型 Muse Ember 硬刚 Claude Haiku 5.5", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/Ou4l4aD7zvUzXWXsWJfY?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-10T15:22:09+00:00"}, {"title": "phimint v0.8.0 发布：模型选择跨重启生效、终端贴图、长输出不再消失", "summary": "phimint v0.8.0 已发布（2026-11-09） phimint 是一个用 Rust 写的终端 AI 编码 agent：一条命令装上、配好 API key，就能在终端里把需求变成跑通的代码——读代码、改多个文件、编译、测试、按报错迭代。 本轮更新重点在「模型选择」和「输入输出」两处。 更新重点 1. 模型选择跨重启生效 以前 /model 选完，重启就没了...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503517", "publishedAt": "2026-11-10T14:33:10+00 执行同一种运算，主要通过 SIMD（单指令、多数据）提高数据处理效率。SIMD 把多个数据元素放进较大的寄存器中，每个元素所在的位置称为一个“通道”，然后对多个通道执行相同操作。在实际应用中，新处理器可用于可穿戴设备的音频处理和关键词识别，也可承担工业设备的传感器分析与状态监测。Arm 还举例称，它可在机器人电机、关节附近处理信号，帮助发现异常或磨损迹象。此次发布也扩充了 Arm 的技术授权组合。截至 2026 年 11 月，Flexible Access 拥有 319 家活跃成员，已促成超过 500 个独立流片项目；Total Access 拥有 60 家合作伙伴，累计支持超过 600 个项目。Arm 希望通过扩大技术获取渠道，推动更多设备在本地完成智能处理。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/025/294.htm", "publishedAt": "2026-11-11T01:52:09+00:00"}, {"title": "《赛博朋克 2077》游戏登陆暴雪战网平台，促销价 17.99 美元起", "summary": "IT之家 11 月 11 日消息，CDPR 旗下游戏《赛博朋克 2077》现已登陆暴雪战网平台，目前正进行促销优惠。标准版 3 折售价 17.99 美元（IT之家注：现汇率约合 120.3 元人民币），收录《往日之影》资料片的终极版 4 折售价 31.99 美元（现汇率约合 213.9 元人民币）。剧情方面，《赛博朋克 2077》的故事发生在反乌托邦都市夜之城，玩家扮演雇佣兵 V，并在故事中与基努 · 里维斯饰演的数字人格强尼 · 银手产生联系。新电影是否会沿用游戏中的角色、地点或其他设定，目前尚未确认。类似的原创叙事方式也出现在好评如潮的衍生动画《赛博朋克：边缘行者》中。该作品沿用了游戏的世界观，但以全新角色展开故事，是 2022 年口碑最好的影视化作品之一。据IT之家了解，《赛博朋克 2077》2.5 版更新已于 10 月 22 日正式登陆 PC、Mac（Steam、GOG、Epic Games Store）、PlayStation 5 和 Xbox Series X|S 平台，Switch 2 版稍后推出。此次更新不仅加入了《边缘行者 2》联动支线任务、新道具、电台和义体外观自定义功能，还带来更多夜之城支线任务、官方模组支持、双持武器玩法等内容。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/025/273.htm", "publishedAt": "2026-11-11T01:41:44+00:00"}, {"title": "今天起，Gemini 4 Carbon 正式上线，但不是所有人都用得上", "summary": "非付费用户什么时候能用上？#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1688883?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-11-11T00:26:39+00:00"}, {"title": "谷歌发布 Android 17 QPR2 正式版及 Pixel 11 月更新，新增通知管理和隐私控制功能", "summary": "IT之家 11 月 11 日消息，谷歌于当地时间 11 月 10 日宣布向 Pixel 系列手机及平板电脑推送 Android 17 QPR2 正式版更新。此次更新比原定季度发布时间提前约一个月，同时整合了 2026 年 11 月 Pixel Feature Drop 功能更新和当月安全补丁，带来界面定制、通知管理、隐私控制及系统稳定性方面的多项改进。据 9to5Google 报道，QPR2 调整了主屏幕长按菜单的布局，并为系统主题增加了更灵活的颜色选择功能。用户进入「壁纸和风格」设置后，可以通过颜色选择滑块自定义系统强调色，还能在 Neutral、Soft、Bright 和 Bold 四种主题风格之间切换。同时，QPR2 系统状态栏也增加了自定义选项。用户可以进入「设置」中的「系统」菜单，选择显示全部通知图标、仅显示优先通知图标或隐藏通知图标，还可以控制静音、振动和电池百分比等系统状态图标的显示。在快捷设置方面，新版本增加了 Audio streams 和 Voice broadcast 两个快捷开关。电池图标则在设备充电或开启省电模式时显示轮廓。此外，系统将电池相关选项统一整合到「电池和充电」菜单中。通知和隐私管理也是此次更新的重点。Android 17 QPR2 对通知智能管理功能进行了整合，将通知摘要、通知分类和通知冷却等功能集中到通知设置中。同时，系统新增 Agents Dashboard（智能体控制面板），用户可以在「安全与隐私」设置中查看相关智能体控制选项。新版本还增加了 Private Compute Core 日志查看功能。Private Compute Core 是谷歌于 2021 年推出的独立安全运行环境，负责在设备本地处理 Now Playing、智能回复、实时翻译、实时字幕以及 Google Messages 垃圾信息检测等功能。此次更新允许用户查看相关数据处理日志。Pixel 11 Pro、Pixel 11 Pro XL 和 Pixel 11 Pro Fold 用户还将获得 HiLight 功能升级。此前该功能主要通过手机背面灯光提示来电和 Gemini 状态，此次开始支持重要联系人的短信通知。当用户将手机屏幕朝下放置时，如果收藏联系人发送消息，手机背面灯光会闪烁两次。此外，谷歌在 11 月 Pixel Feature Drop 中还公布了 Gemini Intelligence、Rambler 语音输入增强、个性化小组件以及 Pixel Search 等新功能。其中，Pixel 10 系列将获得更多 Gemini 智能体能力，支持处理多步骤任务；Pixel Search 则扩展至 Pixel 6 及更新机型。系统修复方面，谷歌此次针对 Pixel 设备公布了 33 项问题修复，涉及应用、音频、电池与充电、蓝牙、相机、网络连接、显示与图形、系统框架、性能、传感器、电话和用户界面等类别。具体包括修复部分场景下虚拟键盘无法弹出、媒体音量意外升高、未连接充电器却显示充电状态、蓝牙连接稳定性不佳、滚动动画卡顿，以及通知栏无法通过下滑手势展开等问题。Pixel 11 系列还修复了拍摄照片偶尔无法正常保存的问题。安全方面，2026 年 11 月 Android 安全补丁修复了多个安全漏洞。其中，11 月 1 日安全补丁修复 135 项问题，11 月 5 日安全补丁修复 97 项问题，涉及高危和严重级别漏洞。谷歌设备专属安全公告还列出了另外 166 项安全修复。IT之家注：此次 Android 17 QPR2 正式版覆盖 Pixel 6a、Pixel 7 系列、Pixel 8 系列、Pixel 9 系列、Pixel 10 系列、Pixel 11 系列，以及 Pixel Fold 和 Pixel Tablet。用户可以进入「设置」-「系统」-「系统更新」检查并安装 OTA 更新。此前参与 Android 17 QPR2 Beta 测试的用户，也可以通过小型更新包升级至正式版。谷歌表示，Android Beta Program 仍将继续开放，后续还会开展 QPR 和 Feature Drop 测试。相关阅读：《消息称谷歌 Android 17 全球占比仅 1%，安卓系统版本碎片化问题依旧严峻》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/025/223.htm", "publishedAt": "2026-11-11T00:16:53+00:00"}, {"title": "谷歌宣布免费升级 Google Fi 超级网络：Pixel 9 系列支持双 5G 网络自动切换和数百万 Wi-Fi 热点", "summary": "IT之家 11 月 11 日消息，当地时间 11 月 10 日，谷歌宣布为旗下 Google Fi Wireless 推出全新的「超级网络」（Super Network），通过双 5G 蜂窝网络和数百万个 Wi-Fi 热点之间的自动切换，改善用户在室内、拥挤区域及偏远地区的网络连接体验。谷歌 Google Store 与 Google Fi 副总裁 Mauria Finley 在官方博客中介绍称，该功能将面向符合条件的 Google Fi 用户免费提供。即日起，该功能陆续向 Pixel 9 及更新机型开放。所有 Google Fi 套餐均可使用两张美国 5G 网络，当主网络信号减弱或连接中断时，手机能够实时切换至备用数据网络，以减少公路、乡村道路等区域的信号盲区。谷歌表示，这项技术采用 MEP（Multiple Enabled Profiles，多启用配置文件）技术，允许单个 eSIM 芯片同时承载并运行多个 SIM 配置文件，从而实现不同运营商网络之间的连接切换。不过，该功能需要 Google Fi 通过 eSIM 激活，并关闭其他非 Fi SIM 卡，实际覆盖范围和网络表现还取决于设备配置、信号强度及电池状态。Wi-Fi 方面，谷歌推出扩展版 Wi-Fi Auto Connect+ 功能，可在全美数百万个地点自动连接高质量 Wi-Fi 网络，用户无需手动进入设置或登录公共热点。谷歌称，该功能会通过自动加密保护连接，减少用户在机场、购物中心等人员密集场所使用蜂窝网络时遇到的拥堵问题。谷歌公布的数据显示，Wi-Fi Auto Connect+ 相较于附近的 Google Fi 蜂窝网络，连接可靠性提升至 2 倍，延迟改善 30%。该功能目前支持 Pixel 5a 及更新机型，并将在北美、欧洲、亚洲和巴西的部分地点提供，同时逐步扩展至运行 One UI 9 或更高版本的三星手机，以及部分较新的摩托罗拉手机。在国际漫游方面，双网络切换和 Wi-Fi Auto Connect+ 均支持在海外使用。其中，Unlimited Premium 套餐每人每月包含最高 50 GB 国际高速流量，Flexible 套餐每人每月包含最高 15 GB 国际高速流量，达到额度后网速降至 256 Kbps。相关功能包含在这两种套餐中，无需额外付费，但国际连续使用时间不得超过 90 天。此外，Google Fi 应用还将新增 AI 客服智能体 Ask Fi，基于谷歌 AI 技术提供账户支持和故障排查服务。用户可以通过该功能咨询网络连接问题、账单等事项。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/025/208.htm", "publishedAt": "2026-11-10T23:01:30+00:00"}, {"title": "Anthropic 升级 AI 办公套件：从头脑风暴到数据看板，Claude 想承包团队协作全流程", "summary": "IT之家 11 月 11 日消息，Anthropic 今日开始推出 Claude Whiteboards（白板）、Claude Sheets（表格）和 Claude Data（原 Claude Dashboards），把 AI 助手从“聊天问答”进一步推向团队协作工作台，用户可以在白板上梳理计划、在表格中搭建追踪器，并把业务数据变成可共享的仪表盘、数据故事或解说视频。三项产品面向所有付费计划提供，支持网页端、桌面端和移动端；其中白板应用 Whiteboards 与表格 Sheets 目前处于测试阶段，Claude Data 则已正式上线。官方希望让 Claude 从生成文字、代码或文档，转向直接参与团队的日常协作。Claude Whiteboards 方面，用户可以口头描述一个模糊计划，Claude 会将其整理为包含时间线、负责人和日期的白板，团队成员则可实时在同一块白板上补充想法。会议复盘时，Claude 还能将零散讨论按主题归类，并起草每个人的行动项。Claude Sheets 则试图降低制作表格的门槛。用户只需提出“帮我做一个营销活动追踪表”或“招聘预算表”等请求，Claude 即可生成包含多个标签页、公式、格式和下拉菜单的电子表格，并直接在单元格中修改内容。Claude Sheets 会清晰标注每一次 AI 修改，便于团队追踪变更；文件也可导出为 .xlsx 或 CSV，或继续在 Airtable、Asana、monday.com、Smartsheet 等工具中处理。Claude Data 的定位是让企业数据“会讲故事”。它可连接 Amazon Redshift、BigQuery、ClickHouse、Snowflake、Salesforce 等数据仓库或 CRM，用户提问后可获得仪表盘、书面数据故事，甚至由 AI 解说的短视频。IT之家附上相关截图和视频如下：新加入的“认证查询”功能，可由数据团队统一关键指标口径，避免不同部门使用相互矛盾的数字；实时分享则让未接入数据源的同事也能查看最新结果，但仅能运行被授权的查询。Anthropic 表示，三项工具并非彼此割裂：一个想法可以从白板进入表格，再进入数据看板，而无需反复向 AI 重复背景信息。与此同时，Anthropic 还升级了交互式连接器，Adobe、Atlassian、Box、Notion 等应用可以以完整应用形式在 Claude 对话旁打开，用户可自行操作，也可让 Claude 协助修改。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/025/204.htm", "publishedAt": "2026-11-10T22:43:46+00:00"}, {"title": "给 AI 腾内存  美元。按此计算，每名创始人出售股票对应的金额约为 2.36 亿美元至 2.64 亿美元，最终所得将取决于实际发行价。七人合计出售 2364.86 万股，占本次由现有股东出售股份的全部份额。参与出售的创始人包括 CEO 达里奥 · 阿莫迪、总裁丹妮拉 · 阿莫迪，以及汤姆 · 布朗、杰克 · 克拉克、贾里德 · 卡普兰、萨姆 · 麦坎德利什和克里斯托弗 · 奥拉。此次出售约占每人原持股数量的 1.4%。交易完成后，每人仍将持有约 2.37 亿至 2.40 亿股 A 类股票，按 74 美元计算，剩余持股价值接近 180 亿美元。招股书显示，Anthropic 计划在此次 IPO 中发行 8.25 亿股 A 类股票，其中公司发行约 8.01 亿股，其余由七名创始人出售。发行价最高达到 78 美元时，公司完全摊薄估值可能达到 1.404 万亿美元。Anthropic 已申请以“ANT”为股票代码在纳斯达克上市。尽管出售部分持股，七名创始人仍将通过共同组建的 Founder LLC 掌握公司控制权。IPO 完成前，Anthropic 将向该实体发行一股不具备经济权益的 F 类特殊股票，使其在一般股东表决事项中拥有 50.1% 的投票权。与此同时，Anthropic 长期利益信托将继续负责选举董事会多数成员。相关阅读：《Anthropic 发布 IPO 路演视频正式启动最高 643.5 亿美元募资计划，估值约在 1~1.4 万亿美元》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/025/217.htm", "publishedAt": "2026-11-10T23:51:19+00:00"}, {"title": "近 700 亿美元 IPO 定价突然撤回！Anthropic 最快今天路演，下周冲刺上市", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/8tquwes1yGbmTeyOjOId?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-10T18:54:18+00:00"}, {"title": "面向 AI Native 的数据库技术演进 | 腾讯云数据库 DBTalk", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/video/W1VS3q3eMAosMwrHb1k4?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-10T15:53:17+00:00"}, {"title": "硅谷疯炒 AI 自我进化，李飞飞、Jeff Dean 齐泼冷水：无限加速不可信", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/mZlISiZL9c1eurrsZRpo?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-10T11:28:43+00:00"}, {"title": "Anthropic 重做源代码管理系统：提交量增长 12 倍，传统架构开始失效", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/sBjhhysFKZibZpXQZEGy?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-10T11:00:00+00:00"}, {"title": "10x 工程师变成 100x 了，普通工程师还是那么普通", "summary": "一位 CTO 用反证法证明：我们还没被 AI 取代，但理由可能和你想的不一样。 shaharglazner 是 keepalerting 的联合创始人兼 CTO，11 月 9 日他在 X 上发了篇长文《On Being an Engineer in 2026》，标题下面跟着一行小字：「我们还需要吗？」 他先承认了那种普遍的失控感。每隔一周，就有一块工作被交出去。最早是不写代码...", "sour const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
