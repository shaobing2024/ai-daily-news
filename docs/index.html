之家 10 月 30 日消息，零一万物今日宣布，10 月 28 日，零一万物与杭州市、临平区达成合作，由市区两级国资联动投资，合计向零一万物投资数亿元。IT之家获悉，零一万物总部将落地杭州临平区，并以此为依托，打造产业 AI 转型基地。杭州有关部门表示，杭州正全力争创人工智能创新发展第一城，推动人工智能科技创新与产业创新深度融合。未来，杭州将充分发挥数字经济和实体产业优势，持续开放高价值应用场景，推动人工智能深入千行百业。期待零一万物发挥企业 AI 技术与产业 AI 转型实践优势，深度融入杭州创新生态，与本地企业共同探索可复制、可推广的产业 AI 转型模式，为杭州智能经济发展和实体经济转型升级注入新动能。零一万物创始人兼 CEO 李开复表示：“杭州已经诞生了一批世界级的 AI 创新企业，这是非常了不起的成绩。但我认为，杭州 AI 更大的机会还在后面。这里有活跃的民营经济，完全有条件成为产业 AI 转型的主战场。我希望未来大家提到杭州 AI，不仅想到这里诞生了哪些 AI 公司，更能想到有多少企业因为 AI 转型升级储备了引领未来的竞争力。这将成为杭州的下一张 AI 名片。”延伸阅读零一万物（01.AI）由李开复于 2023 年 5 月创办，核心团队成员来自谷歌、微软、IBM、百度等公司。李开复于 1988 年获卡内基梅隆大学计算机学博士学位，曾加盟微软、谷歌等巨头，担任微软副总裁、谷歌中国区总裁等职位，2009 年宣布离职后在北京创立创新工场，并出任董事长兼首席执行官。原百度元宇宙负责人马杰担任零一万物联合创始人、副总裁。2024 年，零一万物推出了首款闭源模型 Yi-Large。2024 年下半年，公司进行了第二年的战略及组织调整，2025 年起聚焦于应用落地及业务加速增长。此次总部落地杭州并打造产业 AI 转型基地，正是其在企业级 AI 方向的进一步落子。值得注意的是，零一万物正持续收缩面向消费者的业务。2026 年 8 月，公司发布公告称，因产品与服务体系升级、进一步聚焦企业级人工智能解决方案，零一万物大模型开放平台将逐步停止面向用户提供在线体验、API 调用及充值等相关服务：即日起停止新用户注册及充值，2026 年 9 月 3 日 24:00 起停止模型体验、API 调用及相关服务，退款申请窗口开放至 2026 年 12 月 3 日 24:00。在技术路线上，零一万物 2025 年 1 月与阿里云联合宣布启动“产业大模型实验室”，双方在技术、算力、业务、人才等板块技术共享与深度共建，全面通过阿里云百炼大模型平台的模型服务层面向市场。2026 年，李开复表示公司已主要基于中国开源权重模型进行微调和定制，包括 DeepSeek、阿里巴巴千问以及智谱 AI 的 GLM 模型，目前约有一半业务收入来自中国以外市场。资本层面，零一万物 2024 年确认收入超亿元，曾于 2025 年辟谣“被阿里收购”传闻。2026 年 5 月，公司对赴港股上市传闻回应称“对资本层面规划保持开放且审慎的态度”。2026 年 7 月，李开复在世界人工智能大会上透露，公司计划于 2027 年财年结束之后在香港进行 IPO，并在首次公布年度业绩期间寻求 Pre-IPO 融资，同时正调整境外控股架构以适应上市计划。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/019/877.htm", "publishedAt": "2026-10-30T01:40:17+00:00"}, {"title": "星巴克考虑将 AI 技术引入得来速，提升点餐准确率与出餐速度", "summary": "IT之家 10 月 30 日消息，据彭博社报道，星巴克公司正考虑在得来速车道引入人工智能技术。这家咖啡连锁品牌的首席执行官布莱恩 · 尼科尔（Brian Niccol）当地时间周四在分析师电话会议上表示，公司准备测试在后台运行的人工智能模型，帮助咖啡师在和顾客沟通时“更准确、高效地录入订单”。该举措的目标是让员工可以专心和顾客交流，同时提升出餐速度。星巴克还在研究一套识别技术，能够在参与该服务的顾客抵达门店时识别身份，随后向顾客展示个性化数字菜单，并简化支付流程。尼科尔说：“这项工作尚处在早期阶段，我们会先测试、总结经验，再把可行的方案推广开来。”IT之家注意到，大型连锁餐饮企业已经在得来速场景测试人工智能多年，但这项技术还没有在行业内大规模普及。汉堡王不打算大范围落地其正在试点的 AI 点餐系统，称顾客更愿意和人工交流。麦当劳则在测试自研方案，该公司表示这套系统能让每家门店每周省下数十小时人力，调配到其他工作上。星巴克周四公布的财报业绩超出市场预期，其围绕门店升级、服务体验和新品研发的战略持续见效。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/019/866.htm", "publishedAt": "2026-10-30T01:12:53+00:00"}, {"title": "Mistral AI 开放 Large 4 模型权重：1T 参数，编程智能体更省 Token", "summary": "IT之家 10 月 30 日消息，当地时间 10 月 29 日，法国公司 Mistral AI 正式开放 Mistral Large 4（简称 ML4，代号 le Chonk）模型权重。ML4 是一款拥有 1 万亿总参数、490 亿激活参数（包括嵌入层和输出层在内为 520 亿）的原生多模态模型。在 Mistral 位于欧洲的自有数据中心中使用 3,800 块 NVIDIA Grace Blackwell GPU 从零开始训练。Mistral 表示，在完成面向政府及企业用户的实测后，此次发布的版本相较三周前公布的初版进行了性能优化与升级。官方表示，该模型在 Artificial Analysis Coding Agent Index 得分达到 48%，与领先的开源模型 GLM-5.3 基本持平，但平均每个任务消耗的 Token 数量减少了 47%。在线使用方面，这款模型定价为：输入每百万 Token 0.70 美元（IT之家注：现汇率约合 4.7 元人民币）、缓存输入每百万 Token 0.07 美元（现汇率约合 0.47 元人民币）、输出每百万 Token 2.10 美元（现汇率约合 14 元人民币）。该模型基于修改版 MIT 许可证发布，允许免费用于个人、学术、修改、微调及常规商业化；面向提供 MaaS 进行转售的云服务商 / 厂商，商业化使用前必须向 Mistral 单独获取商业授权。IT之家附开源链接：Hugging Face：https://huggingface.co/mistralai/Mistral-Large-4-1T-A52B", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/019/865.htm", "publishedAt": "2026-10-30T01:09:09+00:00"}, {"title": "Omdia 预估 2027 年 AI PC 将占 60% 出货，69% 打工人愿为 AI 电脑多花钱", "summary": "IT之家 10 月 30 日消息，企业 AI 支出持续攀升，随着主流 AI 厂商转向 token 计费模式，这项支出也变得越来越难以预测。对 PC OEM、ODM、芯片厂商、渠道伙伴和托管服务提供商而言，核心问题在于：AI 工作负载应该在哪里运行，PC 又将扮演什么角色。据预测，AI PC 出货占比将在 2027 年达到 60%，本地 AI 的装机基础正通过换机周期逐步形成。企业 AI 支出仍在上涨，token 计费让成本难以管控 绝大多数企业都计划在明年增加 AI 投入。Omdia《2026 年 AI 市场成熟度调研》显示，86% 设有 AI 预算的组织预计 2027 年支出将进一步上升。而头部 AI 厂商正从按席位或按请求收费转向 token 计费，任务的成本只有在运行结束后才能明确，这让支出管理难度陡增。智能体 AI （Agentic AI）进一步放大了问题，单个任务可能触发一长串按次计费的模型调用。即便如此，这些风险并未放缓企业 AI 的支出与使用节奏。此前企业 AI 大多运行在云端，成本不断走高的同时，企业开始重新审视哪些工作负载应当留在云端。覆盖公有云、本地服务器与端侧 AI 的混合基础设施正在成为解决方案，但大规模落地本地 AI 门槛不低，很多企业并不具备相应技术能力，这恰恰是整个 PC 生态的机会：帮助企业厘清在设备上运行 AI 的场景与方式。纯云 AI 推高成本与合规风险，端侧 AI 尚未真正打动企业买家 除成本外，随着更多公司数据离开设备，纯云 AI 也带来了合规、安全与数据主权层面的顾虑。随着智能体方案走向生产环境，这些风险还可能加剧，且管理开销往往难以追踪。用户侧同样存在管理盲区。Omdia《PC Horizons 消费者调研》显示，78% 用 PC 办公的受访者每周至少数次使用 AI，但这一群体中只有 12% 使用的是由工作单位或学校提供的工具，大量使用行为很可能发生在 IT 部门看不到的个人账户下，给企业数据带来额外风险。公有云之所以主导早期企业 AI 应用，是因为它易于上手、无需采购硬件，还能接入能力最强的前沿模型。如今，若干新进展已让在公有云之外运行 AI 变得更加可行：企业可自行部署的开源权重模型已大幅缩小与前沿模型的差距，量化压缩技术让模型体积缩小到可装入 PC 内存，越来越多常规 AI 工作因此可以在本地运行，以更低的增量投入获得私有基础设施在合规与数据主权方面的大部分收益；神经处理单元（NPU）也已成为许多新 PC 的标配。不过，AI PC 的价值主张尚未在市场中真正引起共鸣。Omdia 调研显示，69% 用 PC 办公的受访者愿意为可直接在设备上处理 AI 任务的电脑支付溢价，但 62% 的人更换上一台 PC 的原因是设备变慢、损坏，或想要更新更好的机型，只有 9% 将 AI 功能列为主要换机原因。AI PC 出货占比快速攀升，内存成本是最大变量 AI PC 出货占比预计将从 2025 年的 33% 升至 2027 年的 60%，并在 2030 年达到 79%。无论买家是否主动提出需求，本地 AI 的装机基础都会随换机周期到来。商业账首先要算成本：云成本是随用量增长的持续性开销，而 PC 通常是一次性投入。合理的对比方式，是更强 PC 配置的增量成本与它所能替代的持续性云支出，而不是整台机器与云账单的对比。员工拿到一台配置更强的 AI PC，只需为升级差价付费即可获得本地 AI 能力。传统架构按任务体量分工：云端承接最复杂任务，本地服务器承载最大工作负载与模型，PC 负责常规推理。量化技术正在改变这一划分，越来越多任务可以路由到 PC 上，尤其是在内存更大的机型上。智能体 AI 是本地推理的早期落地场景：本地智能体对内存容量与带宽的要求远超主流 PC 水平，目前主要 OEM 已推出首批面向智能体 AI 的高端机型，溢价较高，暂时适配开发者与重度用户。随着开源权重模型与量化技术持续进步，这类场景还将进一步拓宽。内存是端侧 AI 大规模普及的主要风险：自 2025 年以来，内存已从约占 PC 物料成本的 15% 升至近 40%，可能促使买家选择更低内存配置，而此时本地 AI 恰恰需要更大内存。这种压力很可能同样传导至服务器端；而笔记本对员工的价值远不止运行 AI，因此 AI PC 的增量成本相比服务器投入大概率仍将保持温和，也避开了云 AI 的成本透明度问题。生态需合力把端侧能力转化为可落地的商业案例 硬件正在走向主流，但企业侧采用仍处于早期阶段，因为企业还在摸索本地推理在哪些场景下真正划算。缩小这一差距需要整个生态协同：OEM 需要通过参考工作负载展示经济账 —— 更强 PC 配置的额外成本如何通过节省的持续性云支出来回收；ODM 与芯片厂商则要决定这些配置的可负担程度，尤其是内存。渠道伙伴与托管服务提供商则要把这一主张转化为企业可执行的落地方案。评估 AI 成熟度、确定工作负载部署位置、部署模型、制定策略 —— 这些都是许多组织欠缺的能力。而且模型、云定价与硬件都在持续变化，这些决策在下一次换机之前还需要反复调整，这是超越单纯卖笔记本的持续性服务机会。企业 AI 支出将持续上涨，随之而来的压力是：必须清楚每项工作负载的成本与合适的运行位置。AI PC 不会取代云端或本地服务器，但只要整个生态协同一致，它就能帮助优化这笔支出。参考 As enterprise AI spend continues to rise, the PC ecosystem must define the on-device case for hybrid AI", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/019/852.htm", "publishedAt": "2026-10-30T00:52:46+00:00"}, {"title": "OpenAI“服软”：ChatGPT Pro 订阅用量翻倍，取消 Pro 200 砍半计划", "summary": "IT之家 10 月 30 日消息，在用户强烈反对后，OpenAI 公司昨日（10 月 29 日）宣布，立即上调 ChatGPT Pro 及 Business Premium 订阅中 Work 与 Codex 的用量额度，Pro 100、Pro 200 以及 Pro 500 的额度直接翻倍。IT之家附上相关截图如下：OpenAI 以“模型效率提升”为由，曾在 9 月 29 日通知用户，计划下调 Pro 200 订阅额度约 50%，并计划让老用户在 10 月 29 日后转入较低额度。该计划引发订阅者强烈不满，用户认为“价格不变、权益减半”损害了付费承诺。OpenAI 现已明确表示，不会降低 Pro 100、Pro 200、Pro 500 及 Business Premium 的用量限制，且 Dots 常驻 AI 助理的扩展用量将保持独立计算。新订阅用户可直接获得更新后的额度，现有用户无需等待续订即可自动生效。不过，OpenAI 也提醒，额度翻倍并不必然意味着能完成两倍任务：实际产出仍取决于模型、任务复杂度、上下文长度、工具调用和速度模式；Fast 模式消耗额度的速度约为标准模式的 2.5 倍，Ultrafast 则高达 8 倍。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/019/848.htm", "publishedAt": "2026-10-30T00:34:52+00:00"}, {"title": "刚刚，ChatGPT Pro 额度官宣翻倍，但免费重置可能要没了", "summary": "Plus 用户：为我发声#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1686830?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-10-30T00:29:45+00:00"}, {"title": "智元发布具身模型 GO-3 Preview：能做煎饼果子、在便利店上岗，登顶三大榜单", "summary": "IT之家 10 月 30 日消息，10 月 29 日，智元正式推出预训练 / 后训练 / 部署后实现全链路规模化学习的具身模型 —— GO-3 Preview。该模型采用具身原生的 WRAM（World Reasoning Action Model）架构，将任务推理、未来预测与动作生成连接起来，让机器人理解指令、预测未来，并生成可执行的动作。该模型已于近日登顶 RoboDojo、RoboTwin、RoboColiseum 三大行业权威评测榜单，将于 2026 年底全面开源。IT之家附官方介绍如下：基于 WRAM 架构，GO-3 Preview 从数据与模型两个维度共同推进 Scaling，让异构经验参与共同学习。数据维度解决“学什么、学得够不够广”：人类第一视角视频提供丰富的物体交互和任务过程，机器人轨迹则建立观测、动作与物理结果之间的联系。模型维度解决“如何承接和运用这些经验”：通过增强学习能力，把分散的经验组织起来，转化为可迁移的通用能力。经过预训练，模型任务迁移与复杂技能适应能力更强，并在 Zero-Shot（零样本）与 Few-Shot（少样本）任务中得到检验。在家居、厨房、多机协作、灵巧操作场景里，不用额外微调，机器人就能直接完成陌生任务。面对更复杂的任务，GO-3 Preview 可利用少量示范进一步学习，完成制作煎饼果子这样的长程精细任务。乐高拼装要求准确抓取零件、找准位置并完成插合，经过微调的模型，机器人能够完成这些精细动作，并在智能体编排下将多个步骤衔接起来，完成拼装。有了通用能力，并不意味着机器人就能直接胜任所有复杂任务。就像人学会基本动作后仍需反复练习，机器人也需要在不断尝试和反馈中改进策略。在 GO-3 Preview 后训练阶段，智元构建分布式混合环境后训练系统 Genie Evolver，依托百台真机，并结合物理仿真与世界模型，让机器人在实践中提升能力。随着交互经验不断积累、动作策略持续更新，机器人的能力也随之提升：桌面冰壶中，经过 4 小时在线迭代，它的性能超过被测人类平均水平；抽积木塔可以连续抽取 5 块，还能保持整塔稳定。进入 GO-3 Preview 部署后阶段，智元通过具身 Agent 框架 Genie Master，把判断、执行与反馈连接起来，让机器人能够实现部署后的自主改进，在真实作业中持续提升能力。搭载该框架的精灵 G2，在真实便利店上岗期间，不依赖人工示范与调试，自己定位失败原因、调整策略、沉淀经验，做到了在多个复杂精细任务上持续改进，实现“无人在环”的持续自我进化。机器人完整任务流程成功率从首日 28.6%，5 天后稳定至 85.7%。比如便利店机器人挂小挂钩，它自主定位问题、沉淀经验，调整动作时序，把失败记录变成动作指南。其单任务成功率相比常规微调（SFT）提升 17.7 个百分点，区别于后者容易出现瓶颈，它支持持续在线学习。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/019/806.htm", "publishedAt": "2026-10-29T23:22:24+00:00"}, {"title": "16 次发版背后，是每一位贡献者的力量｜Devlive Community 10 月开源月报", "summary": hropic 使用。这名不愿具名的人士称，这笔信用支持将为西弗吉尼亚州一座人工智能数据中心园区的电力与建设费用提供兜底保障，园区内会部署英伟达芯片。英伟达是人工智能处理器领域的龙头厂商，本身已经投资了 Nscale 以及其他多家 AI 算力服务商。总部位于英国的 Nscale 正在加紧推进一批大型数据中心落地，西弗吉尼亚的这处是其旗舰站点。该公司同时在筹备上市，不过部分投资方对其 300 亿美元（IT之家注：现汇率约合 2,003.06 亿元人民币）的上市估值目标持反对意见。The Information 此前已经报道了英伟达和 Nscale 的洽谈，称相关信用担保规模可能达到数十亿美元，数据中心为 460 兆瓦。英伟达首席执行官黄仁勋（Jensen Huang）本月早些时候表示，他已经告知这家英国企业要昼夜赶工，克服阻碍，尽快让部分数据中心投入运行。近几周，这类被称作新云（neoclouds）、像 Nscale 一样提供 AI 算力的企业所处的大环境持续动荡。同样获得英伟达投资的澳大利亚新云企业 Firmus Grid 放弃了 300 亿美元（现汇率约合 2,003.06 亿元人民币）的上市计划，韩国的 Elice 上市首日交易表现惨淡。彭博新闻此前报道，Nscale 还和 Anthropic 商议过另一笔 450 亿美元（现汇率约合 3,004.59 亿元人民币）的合作，对应西弗吉尼亚园区内的第二栋建筑。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/019/850.htm", "publishedAt": "2026-10-30T00:42:12+00:00"}, {"title": "消息称 Anthropic 已成为马斯克旗下 SpaceX 最大单一客户，贡献超三分之一营收", "summary": "IT之家 10 月 30 日消息，据彭博社报道，一位知情人士透露，Anthropic 已成为 SpaceX 的最大单一客户。此前，美国联邦政府一直是 SpaceX 的最大单一客户。今年第三季度，该公司为埃隆 · 马斯克（Elon Musk）旗下 SpaceX 贡献了超三分之一的营收。SpaceX 在上周提交的申报文件中指出，上一季度约 34.5% 的营收来自单一客户，该客户主要向其负责提供算力的人工智能部门采购服务。知情人士证实，文件中仅被称为“客户 B”的神秘买家正是 Anthropic。具体合作方面，Anthropic 主要租赁 SpaceX 位于田纳西州孟菲斯数据中心的计算资源。其 IPO 招股书文件显示，双方签署的合同有效期至 2029 年，潜在支出上限达 1,205 亿美元（IT之家注：现汇率约合 8,050.05 亿元人民币）。从今年 12 月开始，Anthropic 每月支付的金额将达到约 31 亿美元（现汇率约合 207.1 亿元人民币）。不过，Anthropic 拥有在 2027 年初之后提前 90 天书面通知即可取消合同的权利。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/019/845.htm", "publishedAt": "2026-10-30T00:20:07+00:00"}, {"title": "生产级 AI：隐性故障、工程落地与智能体治理", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/tsyyFmCmzphHw4gWy7Fo?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-29T15:21:00+00:00"}, {"title": "OpenAI 隔离的 AI agent 通过 CPU 缓存互相通信", "summary": "OpenAI 做了个测试：把两个 agent 放进完全隔离的环境，跑在同一套硬件上，没有网络、没有共享文件，命令它们互相传递一个秘密。它们做到了——用的是处理器缓存。一个 agent 故意改写缓存里的数据，另一个测量加载时间的差异，把消息解码出来。这套手法正是著名 Spectre 和 Meltdown 攻击的原理。 这不是科幻设定，是 ...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503303/openai-securing-our-frontier-model-training-envi 5 万棵树，警方展开刑事调查", "summary": "IT之家 10 月 30 日消息，据路透社报道，芬兰警方于周四（29 日）宣布，已针对芬兰北部规划中的谷歌数据中心施工现场涉嫌违反环境法规的行为展开刑事调查（criminal probe）。该项目隶属于 Alphabet 旗下谷歌上月宣布的投资计划。谷歌拟在芬兰投资 150 亿美元（IT之家注：现汇率约合 1,002.08 亿元人民币）用于建设人工智能基础设施，这家美国科技巨头将其称作其在欧洲规模最大的单笔投资。官方部门表示，谷歌的子公司 Tuike Finland 在未依照芬兰法律完成环境影响评估的情况下，便擅自在穆霍斯（Muhos）镇附近的拟建用地上展开了森林砍伐和排水作业。据卫报此前报道，谷歌清除了约 330 公顷（330 万平方米）森林，估计砍伐约 25 万棵树，且在未完成法定环境影响评估前进行大规模土地清理，甚至移除了表土。谷歌发言人表示，公司将全力配合警方调查，并将继续严格确保旗下所有施工现场的合规运营。“我们正在调查该公司的作业行为是否违反了《水资源法》并导致环境受损，”侦查总监卡里 · 帕卡宁（Kari Pakanen）表示，一旦罪名成立，该公司可能面临法人罚款。帕卡宁未透露调查是否会针对具体个人。警方在一份通报中指出，初步掌握的信息显示 Tuike 施工现场在排水与水资源管理方面存在违规疑点与管理漏洞；警方将在 12 月公布阶段性进展，但整个调查工作预计将持续至 2027 年。10 月 6 日，负责环境许可与评估审批的芬兰监管机构（LVV）已正式下令，要求谷歌暂停在穆霍斯以及另一处规划用地上任何改变地表生态环境的准备性工程。帕卡宁明确指出，数据中心项目未来能否获批复工，完全取决于监管机构 LVV 的裁定。LVV 发言人对此表示，目前尚无法预估批准并下发相关许可的具体耗时。谷歌发言人对此回应称：“十余年来，我们始终与芬兰政府及当地社区在基础设施建设领域保持紧密合作，目前正积极配合并回复 LVV 及其他主管部门的各项问询。”得益于凉爽的气候环境、低碳电力供应以及政府对人工智能政策的大力扶持，芬兰近年来已跃升为欧洲数据中心投资最主要的目的地之一。芬兰的国土面积与德国相仿，但人口不足 600 万，相比包括美国在内的其他地区，当地针对数据中心大规模扩建的反对声浪明显较弱。芬兰国家电网运营商 Fingrid 指出，若所有已达成协议的电网接入项目全数落地，随着 AI 数据中心的爆发式扩张，芬兰未来几年的全社会用电量预计将激增高达 40%。谷歌在芬兰的投资版图涵盖数据中心机房、配套电网升级，以及旨在为 Gemini、搜索、地图和 YouTube 等核心业务供电的清洁能源与电池储能项目。芬兰总理佩特里 · 奥尔波（Petteri Orpo）上月在表达对谷歌投资计划的支持时指出，该协议将对本国经济起到强劲提振作用，同时他也淡化了公众关于该项目可能过度消耗能源并推高居民电价的担忧。相关阅读：《谷歌在芬兰栽跟头：两座数据中心被当局勒令停工，环评成拦路虎》《芬兰森林惨遭“剃光头”：谷歌为建 AI 数据中心非法清场 25 万棵树》《谷歌为建数据中心非法砍伐芬兰森林 25 万棵树，狼群被迫进村觅食》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/019/849.htm", "publishedAt": "2026-10-30T00:36:15+00:00"}, {"title": "谷歌赢了 AI 排行榜，却没赢下华尔街：Gemini 4 Carbon 登顶背后的昂贵代价", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/dXwHCW7kjGX1kjPqtla9?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-29T20:13:07+00:00"}, {"title": "Anthropic 取消编程面试：新人第一次有机会直接和资深工程师竞争", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/EQTckj5GQQymiQES22Bo?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-29T16:44:01+00:00"}, {"title": "天数智芯公布天垓300实测数据：部分 在举办粤港澳大湾区国际脑机接口产业创新大会，同步开启国内首个光明大脑科技周。大会上，中国科学院深圳先进院等科研团队攻关的新一代无创超声脑机接口技术亮相。它颠覆了我们对传统脑机接口的认识：无需开颅、不用植入电极，靠超声波和大脑“对话”。基于该技术，每周 3 次、每次 20 分钟，持续 4 周的干预就有机会唤醒慢性意识障碍患者，即我们常说的“植物人”。报道指出，脑机接口的价值，远不止“对外操控”，向内修复神经功能是它更具想象力的方向。它可以向大脑写入精准调控信号，有望激活大脑自身的神经可塑性，重新搭建受损或沉寂的神经通路。据IT之家了解，这套国产无创超声脑机接口技术目前已应用于癫痫、抑郁症等疾病的干预研究。在与昆明医科大学合作的初步临床研究里，24 名慢性意识障碍受试者中有 13 名出现了明确的意识行为改善，其中一位患者因脑出血昏迷了 3 个月，经过 30 天超声治疗后被成功唤醒，康复后已能对话、自主进食，并能在辅助下行走。该技术还可针对不同脑病灵活“定制”干预策略。癫痫，是局部脑区神经元不受控、高频异常放电，就像电路持续短路，超声就用来抑制这片脑区的过度兴奋；抑郁症，是大脑情绪调控环路功能失衡，超声则可以调节异常的情绪环路；“植物人”，涉及丘脑和大脑皮层之间的通信链路受损，整个意识网络陷入沉寂。反复多轮的温和超声干预，能够促进神经网络功能重建，让原本失联、沉睡的神经网络慢慢地恢复通信，帮助大脑重新找回对身体的支配能力，也让意识一点点“醒”过来。据了解，目前脑机接口常见路线分为侵入式、半侵入式、非侵入式三大类，新一代无创超声脑机接口技术是非侵入方向里一条全新的技术路径。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/019/844.htm", "publishedAt": "2026-10-30T00:15:59+00:00"}, {"title": "小雨智造与国家钢结构质检中心共建实验室，乔忠良：具身智能新质生产力已成事实", "summary": "2026年10月27日，“工业具身智能焊接与检测技术联合实验室”正式揭牌成立。", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/10/506273.html", "publishedAt": "2026-10-29T02:51:45+00:00"}, {"title": "威卡：用数据集链接具身智能和工程机械", "summary": "威卡：为工程机械的智能化与少人化，提供一条被验证的路径", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/10/506063.html", "publishedAt": "2026-10-28T09:01:27+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "亚马逊 2026 财年第三财季净利润 206.85 亿美元，同比下降 2.37%", "summary": "IT之家 10 月 30 日消息，亚马逊今日发布 2026 财年（2026 年 1 月～2026 年 12 月）第三财季（2026 年 7 月～2026 年 9 月）报告：营业总收入：2019.44 亿美元，同比增长 12%毛利润：1073.71 亿美元，同比增长 17.35%毛利率：53.2%，同比增长 2.4 个百分点净利润：206.85 亿美元，同比下降 2.37%营业利润：280.76 亿美元，同比增长 61%营业利润率：13.9%，同比提高约 4.2 个百分点经营活动现金流：424.22 亿美元，同比增长约 19.4%自由现金流：-334.56 亿美元，上年同期为净流入 12.97 亿美元基本每股收益：1.92 美元，同比下降约 3.03%稀释每股收益：1.89 美元，同比下降约 3.08%资产负债率：50.65%，较 2025 年末提高约 0.90 个百分点 AI 解读本季亚马逊整体营收和每股收益略低于市场预期，但营业利润、营业利润率及 AWS 云业务增速超出分析师预期，AWS 年化收入运行率达 1840 亿美元。公司与本次业绩概览亚马逊是全球领先的电商零售与云计算科技巨头，业务涵盖北美在线零售、国际零售、AWS 云服务三大板块，同时布局广告、订阅服务、自研芯片、自动驾驶及低轨卫星等新业务。2026 财年第三季度，公司实现净销售额 2019.44 亿美元，同比增长 12%；营业利润达 280.76 亿美元，营业利润率 13.9%，创下公司历史最高营业利润率纪录；归属于普通股股东净利 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
