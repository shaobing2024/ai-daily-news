const DATA = {"date": "2026-09-24", "generatedAt": "2026-09-24T01:01:10Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "OpenAI CEO 奥尔特曼联合国演讲：AI 可能走向文艺复兴，也可能带来工业革命式动荡", "summary": "IT之家 9 月 24 日消息，当地时间 9 月 23 日，OpenAI CEO 萨姆 · 奥尔特曼（Sam Altman）在联合国安理会就 AI 议题发表讲话，讨论 AI 发展带来的机遇与风险，并呼吁加强国际合作，建立针对前沿 AI 系统的能力评估、风险评估、安全防护和人类监督标准。他表示，随着 AI 能力的快速提升，相关技术的潜在收益和风险都逐渐变得更加直接且显现。他提出，AI 可能更像一场充满创造力与发现的文艺复兴，也可能像一场引发动荡与混乱的工业革命。奥尔特曼表示，最佳版本的 AI 不是让人成为机器中的齿轮，也不是优化生活直到需要人的部分消失，而是让人们在复杂世界中拥有更多能动性。许多事情 AI 不能也不应自动化。他认为，AI 可以帮助人们学习、创造、发现和解决问题，但随着系统更加自主，也可能出现人类无法理解或控制其决策、权力过度集中的情况。他在这里指出，AI 能力越强、越自主，就越可能跑得比制度快，把权力集中到少数人手中，或做出人们无法理解、无法控制的决定。他特别提到递归自我改进（即 AI 参与 AI 开发的过程）。奥尔特曼称，如果 AI 开发过程进一步自动化，技术进步速度可能快速提升，因此需要对相关发展保持高度谨慎。奥尔特曼将 AI 发展可能出现的严重问题概括为两个方向。第一种是失去对未来的控制：AI 进展太快，人们无法跟上，也无法在需要时干预。他说，行业不能因为 AI 利益太大、太重要就接受过多技术风险，也不能因企业竞争而仓促决策。OpenAI 过去曾单方面放缓，未来也会如此。不应训练无法极强论证可受人类控制的模型。他称，无论人们把灾难风险估计为 10%、1%、12% 还是 0.1%，这些水平都不可接受。第二个问题即老生常谈的权力集中：不应让最强的 AI 模型和相关权力集中在少数人手中，从而避免某个人、公司或国家用 AI 模型把自己的世界观强加给所有人。奥尔特曼提到，必须拒绝这种逻辑，即便它对自己有利。OpenAI 试图在盲目乐观和末日论之间走中间道路，并遵循三条原则：第一，随着 AI 能力提升，人类应继续处于 AI 决策的核心；第二，科学进步和经济增长带来的收益应服务于人民（由人民创造、为人民创利）；第三，技术必须赋能个人，使更多人能够利用技术实现自身目标。他称，OpenAI 可能是技术建设者之一，但不是故事主角，其角色是赋能全球人类。OpenAI 不试图、也不应引导人类判断或人类价值。AI 应帮助（研究人员）发现、（医生）治疗、（教师）教学、（创业者）创办公司、（社区）解决难题。人类进步不是工具取代人的能动性。奥尔特曼还谈到了 AI 在数学研究方面的进展。他表示，OpenAI 模型从三年前只能处理小学算数发展到两年前高中数学竞赛金牌水平，又到如今已达到国际数学竞赛水平。例如，几周前，OpenAI 的一个内部模型就解出了千禧年大奖难题之一的纳维-斯托克斯方程（IT之家注：描述流体运动的一组偏微分方程，可用于飞机设计、天气预报和血流流动等研究）。他称，解决数学问题不是为了数学本身，而是赋能人们发现新知识，并用于改善医疗、提高生活水平和扩展全球潜力。他强调，公司不能替代民主进程。如果 AI 要民主，最重要决定不能仅由旧金山的实验室做出，必须通过民主进程，由对人民负责的政府塑造。在国际层面，这需要合作。他称，历史上，相互竞争甚至彼此不喜欢的国家，也曾为共同利益在强大新技术面前走到一起。现在必须如此。需要国家和国际前沿 AI 标准互补机制。这些标准应衡量能力、评估风险、确定保障措施是否充分，并在系统更自主时保留有意义的人类监督。还需要共同标准，让各国比较证据、验证合规，对正在发生的事有共同语言和理解。他称，需要准确快速的事件报告、分类和报告协议，让世界在失败变成灾难前学习。还需要政府、关键基础设施运营商和技术专家之间的安全渠道，共享新漏洞和新威胁。他说，这些标准不应锁定现有企业或偏向某种商业模式，必须支持开放和封闭模型开发者、新进入者和成熟实验室、国家权威和国际合作。各政府可决定如何纳入法律体系。但若全球能就良好证据、良好保障和良好监督达成一致，所有人都会更好。奥尔特曼表示，OpenAI 没有所有答案，愿意与各方合作寻找前路。他在演讲的最后表示，当前世界正处于一条十字路口。其中一条路通向权力集中、决策不透明，人们总觉得自己一生中最重要的东西是 AI 强加给他们的。另一条路通向 AI 为人民服务，由人民通过民主制度帮助决定其发展。在这条路上，科学进步是为了改善生活，从而让更多人都能参与未来，技术继续赋予个人和社区更多能力，让大家都能按自己的选择去生活。奥尔特曼称，这才是值得建设的未来。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/521.htm", "publishedAt": "2026-09-23T23:31:33+00:00"}, {"title": "Claude Opus 5.5 发布：一天内迁移 68 万行代码，单任务成本比 GPT-6 Astra 便宜 80%", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/jG9ksSRvpkfP20Qif8Ov?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-23T22:41:27+00:00"}, {"title": "已证实首例：澳大利亚政府网站遭 OpenAI 智能体入侵", "summary": "9 月 23 日，据路透社报道，澳大利亚总理安东尼 · 阿尔巴尼斯（Anthony Albanese）表示，OpenAI 开发的一款 AI 智能体在 6 月未经授权侵入了澳大利亚政府网站，访问了公共和非公共文件。这是已知的首例 AI 入侵政府网站事件。这起入侵事件将成为美国以外最引人注目的 AI 智能体访问外部系统的事件之一，并可能进一步加剧外界对 AI 开发者控制技术能力的担忧。阿尔巴尼斯在纽约对记者表示，事件涉及 OpenAI 智能体未经授权访问由 Services Australia 管理的面向公众的 Medicare 统计报告服务门户。他称，现阶段据信没有个人信息被访问，但调查仍在进行中。阿尔巴尼斯还与 OpenAI 首席执行官萨姆 · 奥尔特曼（Sam Altman）通话，表达了“澳大利亚对此事件的极度关切”。OpenAI 未立即回应路透社的置评请求。过去两个月，OpenAI 多次在事发后很久才披露其失控或越轨 AI 智能体引发的黑客或其他事件，有时是因为它只是很晚才发现相关活动，有时则是因为它选择完全不披露恶意活动。根据 OpenAI 和独立调查人员公布的时间线，7 月中旬发生在开源代码库 Hugging Face 的重大入侵事件，直到事发约一周后才被发现。这起事件也引发了全球对 AI 模型能力的讨论。竞争对手 Anthropic、谷歌旗下 Gemini 和 Meta 也披露了其 AI 智能体访问外部系统的事件。包括奥尔特曼在内的一些美国顶级 AI 高管呼吁放慢 AI 开发步伐，理由包括失控智能体可能发动毁灭性网络攻击的威胁。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/515.htm", "publishedAt": "2026-09-23T22:39:37+00:00"}, {"title": "黄仁勋对 AI 公司放话：要求监管就不应获得反垄断豁免", "summary": "北京时间 9 月 24 日，据路透社报道，英伟达 CEO 黄仁勋 (Jensen Huang) 认为，AI 公司不应获得反垄断法或责任法的豁免。在周三播出的《纽约时报》播客节目中，黄仁勋接受了近两个小时的采访，就 OpenAI 智能体入侵 Hugging Face 一事进行了广泛讨论。Hugging Face 是开源 AI 软件中心，在本月被英伟达以 130 亿美元收购。黄仁勋一直反对对 AI 安全进行全面监管，即便 OpenAI 和 Anthropic 等实验室呼吁进行此类监管。他重申了自己的立场，即 AI 实验室有责任测试其产品，只有在确信模型安全后才会发布。根据《纽约时报》公布的文字记录，黄仁勋说：“不过，考虑到他们所从事工作的复杂性，如果要求在反垄断法或产品责任方面获得监管豁免，我认为这说不通。当你要求监管时，不应该要求豁免现有的监管规定。”Anthropic CEO 达里奥 · 阿莫代伊 (Dario Amodei) 本月在一篇文章中呼吁给予 AI 实验室反垄断豁免，允许它们在 AI 安全问题上开展合作。美国财政部长贝森特等一些美国官员曾表示，AI 公司要求获得责任豁免，但没有点名具体是哪几家公司。在采访的其他部分，黄仁勋表示，他并不反对针对 AI 具体应用产品制定监管规定，例如自动驾驶汽车。黄仁勋称：“汽车作为一种产品，尤其是自动驾驶出租车，本身就受到大量监管。如果监管还不够，那么美国国家公路交通安全管理局就应该介入，制定新的监管规定。汽车行业应该有新的监管规定。我不知道目前缺少什么，但如果确实存在监管空白，那么我绝对会增加更多监管。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/514.htm", "publishedAt": "2026-09-23T22:36:38+00:00"}, {"title": "Anthropic 工程师解释为何 Claude 写作变差：模型被训练成写给 AI 看而非写给人看", "summary": "IT之家 9 月 23 日消息，AI 模型在数学、编程和推理能力上进步迅速，写作水平却停滞不前，甚至有所退步，Anthropic 的 Claude 同样也存在这一问题。为何 Opus 4.6 会成为 Anthropic 最后一款写作表现出色的模型？负责 Claude 微调的 Anthropic 工程师杰克逊 · 克尼恩今天（23 日）对此给出了解释：后续模型的优化重点更多放在数学和代码能力上。这些模型还接受了大量面向其他 AI 模型撰写技术解释的训练，而这正是 Claude 逐渐形成奇特表达方式，也就是所谓“Claude 腔”（Claudeish）的主要原因。克尼恩称，模型被“调整得适应 LLM 心理”，最终学会了写给 AI 模型看，而不是写给人看。克尼恩把这种现象类比为只与其他自闭症人士交流的人。此类群体会逐渐形成一套在群体内部沟通顺畅、外人却难以理解的表达方式。LLM 拥有远超人类的工作记忆，也能捕捉更细微的信息，因此在训练中会逐渐形成一种非常适合 AI 模型理解的写法，但在人类读者眼中，这种表达就成了过度密集的信息堆砌。IT之家获悉，克尼恩认为，问题的根源在于强化学习的奖励机制。有些奖励机制着重提升 AI 模型的理解效果，有些则着重让人类更容易理解。数学和代码方面的训练越多，就越需要主动抵消这种倾向，对简洁、容易让人读懂的解释给予更多奖励。克尼恩称，Anthropic 在 Opus 5.5 上找到了更好的平衡，“自 Opus 4.6 以来，我还没有对一款模型的写作表现这么满意过。”当然，这样也并不代表 Opus 5.5 已经超越 Opus 4.6。“这是一个很难解决的问题，我们会继续改进。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/510.htm", "publishedAt": "2026-09-23T15:34:48+00:00"}, {"title": "谷歌推出 Gemini 3.8 Flash / Flash-Lite 文本转语音模型，每一行台词都能精确控制", "summary": "IT之家 9 月 23 日消息，谷歌今日宣布，Gemini 家族新增两款全新文本转语音模型，将语音生成从静态预设转变为动态创意工作室，能够帮助创作者、开发者和企业打造更丰富、更具表现力的音频体验，同时为 Gemini Notebook 和 Google Vids 等产品改进用户体验。两款新模型分别为 Gemini 3.8 Flash TTS 和 Gemini 3.8 Flash-Lite TTS，定位各有不同：Gemini 3.8 Flash TTS：面向深度创意方向和角色设计，可通过自然语言提示从头创建全新语音，在游戏、沉浸式有声读物、播客和互动媒体中赋予角色生命力，还可对表演提示、节奏、方言转换等进行精细控制。Gemini 3.8 Flash-Lite TTS：面向大容量、高性价比规模场景，针对大容量配音、音频内容创作和富有表现力的语音代理进行了优化，可对音调、节奏和表现力细微差别进行精细控制。据IT之家了解，用户可以从原有 30 种原始语音扩展到无限语音库。该模型的具体功能包括：生成式语音设计：可通过自然语言提示，在 100 多种语言和方言中自定义角色、口音和语音特征，从头创建定制语音。扩展语音库：可访问 2000 多种现成语音，覆盖广泛语言，包括墨西哥西班牙语、魁北克法语、苏格兰英语等区域变体。语音复制：仅需 30 秒音频样本即可重现一致的声音特征，并内置同意验证、SynthID 水印和 C2PA 凭据，保护开发者和声音人才。保存与扩展：可保存和管理自定义语音，确保在持续项目中保持一致性能，最小化漂移。语音混音：即将推出，用户可从语音库中选择一种语音，对音色、音高、节奏和口音进行微调，还可使用提示调整特征。选好声音后，两款 TTS 模型都能让用户精确控制每一行台词的演绎方式：逐行指导表演：用户可以编写自己的舞台指导，或让 Gemini 通过自然脚本提示引导交付，无论是平静的客服还是低声的悬疑场景，都能实现。长篇生成：在数小时的连续音频中保持高语音质量、自然节奏和角色音色，扬声器漂移极小，非常适合播客和有声读物。原生双声音场景编排：可从单个脚本中无缝指导多轮对话，同时保持两种声音清晰分离，实现自然的对话轮换。脚本化声音爆发和背景反馈：可添加非语言提示（如 &lt;laughs&gt;、&lt;sigh&gt;、&lt;gasp&gt;）和主动倾听插入语（如 mhm 或 yeah），实现精确的喜剧时机和反应节奏，增添逼真的对话质感。性能方面，Gemini 3.8 Flash TTS 在 Hume AI 的语音设计基准测试中（71.4 分）位居总体第一，在口音建模方面（60.8 分）也处于领先地位。Gemini 3.8 Flash TTS 和 Gemini 3.8 Flash-Lite TTS 能够在不牺牲可靠性的情况下实现真正富有表现力的性能，在 Hume AI 的整体质量指数中分别占据第一和第二的位置，与 Gemini 3.1 Flash TTS 相比，在长格式内容和双扬声器剧本控制等广泛用例中都有重大改进。在 Voice Arena 的盲法人类偏好评估中，Gemini 3.8 Flash 和 Flash-Lite TTS 在全球主要语言（日语、巴西葡萄牙语、越南语、现代标准阿拉伯语、墨西哥西班牙语和印地语）竞争对手中占据领先地位。凭借对 100 多种语言的支持，这些模型能够帮助创作者、开发者和企业在全球范围内打造高质量的多语言语音体验。谷歌在语音创建和复制功能中内置了严格的保护措施，以帮助保护语音人才、尊重身份并确保内容透明度。对于语音复制，系统会利用同意验证：用户必须提供来自语音所有者的口头同意记录，与参考说话者匹配后才能创建语音。Gemini Audio 模型生成的每个音频片段都带有 SynthID 水印且难以察觉，并被直接编织到音频输出中，确保可以检测到 AI 生成的语音，帮助防止错误信息。即日起，开发者就可以在 Google AI Studio 中体验这些新的语音生成功能。用户可以通过提示从头开始创建全新的声音身份，或者复制自己的声音，然后将它们直接带入双扬声器剧本编辑器，逐行指导交付。两款模型均已向开发者推送，可在 Gemini API 和 Google AI Studio 中使用；面向企业用户，很快将通过 Gemini Enterprise 中的 API 推出；面向所有用户，Gemini 3.8 Flash TTS 可在 Gemini Notebook 中使用，Gemini 3.8 Flash-Lite TTS 可在 Google Vids 中使用。需要注意的是，通过 AI Studio 进行的语音复制在伊利诺伊州、德克萨斯州、欧洲经济区、英国、瑞士和印度不可用。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/509.htm", "publishedAt": "2026-09-23T15:31:11+00:00"}, {"title": "罗福莉官宣小米 MiMo-V3 采用全新架构，核心 HySparse 2 今日发布", "summary": "IT之家 9 月 23 日消息，小米 MiMo 大模型负责人罗福莉今日发文，宣布 MiMo-V3 即将采用全新架构。其核心 HySparse 2 今日发布，带来更少的预填充、更小的 KV 缓存、更出色的长上下文检索。在 1M（100 万）Token 长度下，预填充计算量（FLOPs）降低 5.02 倍在 1M Token 长度下，KV 缓存缩小 4.5 倍具有更高的 MRCRv2 和 RULER-v2 评分，同时 AgentPPL 和 LongPPL 更低罗福莉表示，智能体（Agentic）推理是一种截然不同的工作负载。每一轮交互，一个简短的动作可能会返回需要进行预填充的长文本观察结果，同时上下文还在不断增长。这使得预填充成本、KV 缓存大小和检索准确率同时处于关键路径上。KV 桥接（KV Bridging）：遵循 YOCO 思路，交叉解码器（cross-decoder）中的全注意力层利用自解码器（self-decoder）的隐藏状态构建其 K/V。KV 重用（KV Reuse）：在每个混合块内，稀疏层复用前一层全注意力层的 KV 缓存和选择索引。另外还有两项改进：采用 Token 级别的选择来替代块（block）级别的选择，并用近期 Token 的强制窗口来替代独立的 SWA 分支，从而让本地和全局 Token 共享同一个 KV 缓存。由于所有的交叉解码器 KV 缓存现在都来自自解码器，因此预填充在自解码器完成时即可停止。值得一提的是，昨日凌晨，小米刚刚发布并开源了全新的 Xiaomi MiMo-V2.6 系列，包含 Pro 与 Flash 两个原生全模态模型。小米称这是其探索 RSI（递归自我改进）路径的关键一步，通过规模化扩展强化学习算力，让模型在持续的探索与反馈中拓展智能边界。IT之家附论文地址如下：https://arxiv.org/pdf/2609.26368", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/502.htm", "publishedAt": "2026-09-23T15:05:20+00:00"}, {"title": "智谱把 ZCode 开源了，然后呢？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/qEHi6k5ycwXUiasvfNKH?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-23T14:43:22+00:00"}, {"title": "曝小米 18 Pro 系列手机新增「原色」风格影调，支持 Open Gate 片门全开", "summary": "IT之家 9 月 23 日消息，小米 18 Pro 系列手机已于今晚正式发布，搭载第六代骁龙 8 至尊版系列移动平台，后置徕卡 2 亿大底主摄 + 2 亿大底长焦，配备 AI 百变背屏，售价 5999 元起。据博主 @DSP-Charles 透露，小米 18 Pro 系列手机支持 Open Gate 片门全开，同时新增了「原色」风格影调。IT之家注：Open Gate 模式是一种视频拍摄模式，指在录制时利用整个图像传感器区域进行记录，也被称为“片门全开”模式。该模式可记录下传感器可记录的最大分辨率画面，提供更多的原始画面信息。从博主分享的截图来看，小米 18 Pro 系列手机的摄影风格支持原色、生动和经典。据介绍，小米 18 Pro 系列搭载全焦段徕卡光学三摄，包含徕卡 2 亿主摄（1/1.28″大底，超高动态范围）+ 徕卡 2 亿长焦（1/1.56″大底，进光量大幅提升），支持最近 12cm 微距拍摄。系列新机还首发「传奇一瞬」大模型影像，可还原相机光学质感。相关阅读：《小米秋季新品发布会一文汇总：18 Pro 系列登场、透明版时隔 6 年回归、平板手环手表齐上新》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/484.htm", "publishedAt": "2026-09-23T14:27:44+00:00"}, {"title": "rabbit 沉寂许久后发布 OS3 智能体操作系统，支持多设备编排", "summary": "IT之家 9 月 23 日消息，人工智能初创企业 rabbit 曾因其口袋 AI 设备 Rabbit R1 名噪一时。但在硬件产品备受争议的推出后，该企业热度迅速降低并最终陷入沉寂。根据IT之家的查询，其本周之前的最后一条官网新闻发布于 2025 年 9 月。而在当地时间 22 日，rabbit 宣布正式发布其智能体操作系统 OS3。其兼容广泛第三方硬件，以单一聊天界面为主要入口。用户仅需设定一个目标，系统便会自动调度所需的设备、模型、文件来完成剩余步骤。OS3 在云端运行并通过 rabbit agent 智能体连接和操作设备，一个账户最多可以连接五台设备。其支持多设备编排、单一连续对话，兼容通用技能，可进行直接的计算机控制与自动编程。IT之家了解到，用户使用 OS3 时需自备 API 接口。其仅访问本地文件，仅通过模型提供程序处理上下文，仅执行用户发起的操作。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/483.htm", "publishedAt": "2026-09-23T14:26:56+00:00"}, {"title": "【IT之家开箱】小米 18 Pro Max 透明特别版图赏：红色透明机身，解锁旗舰内部美学", "summary": "IT之家 9 月 23 日消息，在刚刚举行的小米秋季新品发布会上，小米正式发布了全新一代小米 18 Pro Max 手机，售价 6999 元起。IT之家目前拿到了此次发布的小米 18 Pro Max 透明特别版配色，其中 16GB + 1TB 售价 10999 元。此次IT之家拿到的红色透明版本采用时尚红色设计，通过微米级膜片打造立体浮雕质感，将原本隐藏在机身内部的结构元素以更加艺术化的方式呈现出来。透过透明背板，可以看到内部结构布局与红色元素相互映衬，让整机拥有更强的科技感与辨识度。同时，透明特别版还配备了特别定制的透明版红色充电器以及数据线，整体风格与手机保持一致，从机身到配件进一步强化了专属属性。在正面设计方面，小米 18 Pro Max 采用 LIPO 封装工艺，通过电路走线设计与贴合工艺优化，将正面四边边框统一收窄至 0.99mm。配合大微弧四曲中框设计，屏幕与边框之间的过渡更加自然。四边一致的窄边框让正面观感更加简洁，也进一步提升了屏幕显示区域的一体感。小米 18 Pro Max 的另一大特色，则是延续并升级了妙享背屏设计。相比上一代方案，新一代背屏进一步做平，与机身融为一体。日常使用中，用户无需频繁点亮主屏，翻转手机即可查看动态信息，也可以通过背屏完成更多互动操作。在功能方面，妙享背屏支持背屏动态通知；AI 百变背屏可以生成萌宠、爱豆、文物等个性化内容，也支持通过拍照生成专属壁纸，并与手机壳等配件进行搭配。此外，新机首批上线 100+ 背屏应用卡，涵盖快捷小工具、信息通知栏、解压小游戏等内容，让背屏从单纯的信息显示区域进一步拓展为可交互的轻应用空间。根据发布会现场透露，背屏 AI 功能也将在 12 月底迎来更新。屏幕方面，小米 18 Pro Max 搭载全新超级像素屏幕，并步入 2.0 时代。该屏幕采用全新绿色发光材料的 M11 发光体系，支持 4000nits 峰值亮度、BT.2020 超广色域以及 LTPO 1-120Hz 自适应刷新率等功能。同时，这块屏幕还加入了创新硬件级智能防窥功能，可以根据使用场景精准控制开启与关闭，在保证正常显示效果的同时，提升日常使用中的隐私保护体验。硬件配置方面，小米 18 Pro Max 首发第六代骁龙 8 超级至尊版，采用新一代 2nm 旗舰制程，CPU 主频达到 5GHz，并搭载新一代 GPU / NPU 架构以及 OFFSET PoP 高导热芯片封装，配合新一代环形冷泵散热方案。续航方面，新机内置 8500mAh 金沙江电池，同时支持 UWB 超宽带互联、IP66/68/69 防尘防水，并配备超宽频赛博马达以及三扬声器立体声。影像方面，小米 18 Pro Max 后置全焦段徕卡光学三摄，包括 2 亿像素徕卡主摄、2 亿像素徕卡潜望长焦以及 5000 万像素徕卡超广角，并首发「传奇一瞬」大模型影像能力，通过 AI 进一步增强影像表现。更多关于小米发布会的详细信息，欢迎持续关注IT之家。实拍图赏：相关阅读：《小米秋季新品发布会一文汇总：18 Pro 系列登场、透明版时隔 6 年回归、平板手环手表齐上新》京东小米 Xiaomi 18 Pro Max 妙享背屏 2nm 第六代骁龙 8 超级至尊 徕卡双 2 亿 防窥屏 16GB+1T 透明版 5G 手机 10999 元直达链接", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/481.htm", "publishedAt": "2026-09-23T14:19:51+00:00"}, {"title": "小米秋季新品发布会一文汇总：18 Pro 系列登场、透明版时隔 6 年回归、平板手环手表齐上新", "summary": "小米 18 Pro 系列，来了！就在今天（9 月 23 日）19:00，小米秋季新品发布会如期举行。本场发布会的主角自然是全新小米 18 Pro，双尺寸旗舰正式登场；同台亮相的还有小米平板 9 系列、小米手环 11 三彩釉陶瓷版、小米手表 S5 41mm，以及一众生态科技新品。接下来，IT之家小编就带大家盘一盘，小米这波新品到底有哪些亮点。一、小米 18 Pro 系列先把目光拉回小米 18 Pro 系列。还是熟悉的双尺寸，但这一代从里到外，升级幅度可不小。设计上，新一代自研屏幕封装工艺安排上了，极窄四等边框直接压到 0.99mm；中框采用大微弧四曲设计，R 角弧面宽度较上代至高增加 37.7%；背屏也还在，并且升级成了一体式纯平。配色一共四款，除了主打的“星河蓝”，还带来冰桃粉和经典黑白双色。性能的全面升级这次是重头戏，卢伟冰直接放话：“牙膏挤爆了。”小米 18 Pro 系列全球首发高通新一代骁龙旗舰移动平台。其中，小米 18 Pro 首发第六代骁龙 8 至尊版，小米 18 Pro Max 首发第六代骁龙 8 超级至尊版，两颗芯片均基于最新一代 2nm 旗舰制程。具体来看，第六代骁龙 8 至尊版的 CPU 主频直接拉到 5GHz，移动平台历史最高；GPU 性能提升 35% 的同时，功耗降低 40%；NPU 推理性能提升 80% 之余，综合算力再提升 15%。至于第六代骁龙 8 超级至尊版，CPU 主频同样是 5GHz，也是移动平台历史最高；不仅采用全新一代 GPU / NPU 架构，还用上先进 OFFSET PoP 高导热芯片封装，并叠加新一代环形冷泵散热。性能拉满的同时，小米 18 Pro 系列在体验上也没打算将就。电池这块，全系搭载新一代小米金沙江电池，硅含量高达 32%；小米 18 Pro 电池容量 7000mAh，小米 18 Pro Max 更是干到 8500mAh，支持 100W 有线秒充 + 50W 无线秒充。超宽频赛博马达、三扬声器立体声、UWB 超宽带互联、IP66/68/69 防尘防水，也全都安排上了。前几天的预热里，IT之家小编就发现不少网友对小米 18 Pro 系列的屏幕格外上心。事实证明，小米这回确实没辜负期待。小米 18 Pro 屏幕尺寸 6.4 英寸，小米 18 Pro Max 则来到 6.9 英寸。全新超级像素屏幕步入 2.0 时代，采用全新 M11 发光体系和新型绿色发光材料，峰值亮度达 4000nits，支持 BT.2020 超广色域。更关键的是，这块屏幕还搞了个创新硬件级智能防窥，开关随时精准控制 —— 防窥开启时显示依旧清晰锐利，关闭后正视角度无损。支持隐私应用自定义，应用进入防窥列表后，通知、小窗、多任务状态都能做到防窥区域像素级跟踪；支持超级小爱，个性化防窥规则设定；创新自定义 AI 键，还能一键快速实现全局防窥。影像向来是小米旗舰的杀手锏，这次小米 18 Pro 系列还是招牌的“全焦段徕卡光学三摄”，主打“双 2 亿”—— 徕卡 2 亿主摄 + 徕卡 2 亿长焦。硬件到位的同时，还首发“传奇一瞬”大模型影像，端侧直拍、云端处理，支持端侧 + 云端双管线并行。此外还支持 AI 帮拍功能：拍摄前可自动识别地理位置，推荐热门机位；拍摄时支持智能构图、分析画面，匹配最佳滤镜，还能智能引导拍照姿势，让被拍摄者更显自然。妙享背屏当然还是小米 18 Pro 系列的特色，不仅可以使用背屏主摄自拍，背屏还支持动态通知。这次的 AI 百变背屏可打造百变“痛机”，还可拍照生成专属壁纸。背屏还支持多样背屏应用卡，首批上线 100+ 背屏应用卡，包含快捷小工具、信息通知栏、解压小游戏，还支持 AI 自定义生成。系统这块，小米 18 Pro 系列自然是搭载澎湃 OS 4，生命感美学设计再升级。内置由 Xiaomi MiMo 大模型驱动的超级小爱 2.0，通过首个全生态系统级智能体认证，支持一键记忆、自主思考、复杂执行；还能跨设备互通，平板、PC 直接处理手机数据。此外，与苹果生态互联更便捷，支持跨端解锁、消息互通、云相册同步；可与 iPhone 贴贴快速分享照片、视频等文件；新增 Apple Watch 互联，电话、通知随时接收；还能同步和查看运动健康数据。价格方面：小米 18 Pro12GB+256GB：5999 元12GB+512GB：6999 元16GB+512GB：7999 元16GB+1TB：8999 元小米 18 Pro Max12GB+256GB：6999 元12GB+512GB：7999 元16GB+512GB：8999 元16GB+1TB：9999 元二、小米 18 Pro 系列透明特别版除了小米 18 Pro 系列的常规版本，小米还带来了透明特别版，这也是透明版时隔 6 年后回归。透明特别版采用时尚红色设计，微米级膜片打造立体浮雕质感；前后屏透明壁纸，艺术化呈现机身内部结构。并且还特别定制透明版红色充电器、数据线、包装礼盒。价格方面，Pro / Max 各只提供 16GB+1TB 版本，售价分别为 9999 元和 10999 元。三、小米平板 9 系列在小米 18 Pro 系列发布完毕后，紧接着登场的是小米平板 9 系列。具体来看，小米平板 9 配备 11.2 英寸的屏幕，提供冰桃粉、云杉绿、黑、银四种配色；搭载第四代骁龙 8s 芯片、内置 9720mAh 大电池。小米平板 9 Pro 则采用 12.5 英寸大屏，提供云杉绿、黑、银三种配色；配备第五代骁龙 8，内置 11000mAh 大电池。全系搭载小米澎湃 OS 4，适配 PC 级专业应用，升级 AI 笔记。价格方面：小米平板 98GB+128GB ：2999 元8GB+256GB ：3299 元8GB+256GB 柔光版：3499 元12GB+256GB ：3799 元小米平板 9 Pro8GB+128GB ：3799 元8GB+256GB ：4099 元12GB+256GB ：4599 元12GB+256GB 柔光版：4799 元16GB+256GB ：4999 元四、小米手环 11 三彩釉陶瓷版在本场发布会中，小米还为小米手环 11 新增一个特殊的版本 —— 三彩釉陶瓷版。三彩釉陶瓷版的灵感来源于上海博物馆藏彩色釉陶马，景德镇工艺出品，搭配精密复合编制表带。其核心配置和常规版看齐，采用 2mm 超窄四等边设计，配有 1.72 英寸 AMOLED 屏，峰值亮度可达 2000nits；内置小米澎湃 OS 4，腕上即可控制米家产品、小米汽车；支持 5ATM 防水、21 天续航，支持 NFC 离线支付。功能方面，支持睡眠 HRV 监测，并可通过 AI 来完成睡眠解读、建议；支持全维度运动健康监测，涵盖心率、血氧、压力、女性健康等项目，提供超 150 种运动模式。价格方面，小米手环 11 三彩釉陶瓷版售价 499 元。五、小米手表 S5 41mm除了小米手环 11 迎新版，小米还推出了 Watch S5 41mm 智能手表。作为全新小尺寸时尚智能腕表，小米手表 S5 41mm 新增陶瓷表圈、灵动表耳、钻石型表冠，续航至高 14 天，提供陶瓷白、海盐蓝、黑色三款配色。运动健康全面升级，特别为女性升级了全新的健康功能：三颗温度传感器布局，精准预测生理周期根据生理周期变化，智能推荐运动强度结合消耗计算热量缺口，科学管理饮食双波段紫外线预测，精准防晒更有效首发手表端小米澎湃 OS 4，支持全新萌宠表盘，可联动时间与天气，能感知压力起伏，拥有四款全新萌宠形象。同时可深度联动小米汽车，新增主动提醒功能；可与小米智能门锁联动，显示门锁摄像头画面；升级表端微信 App，支持语音转文字；内置表端超级小爱，支持百科问答、便捷语音操控。价格方面，氟橡胶表带款售价 1299 元，真皮表带款售价 1499 元。六、小米手表 S5 透明版不光手机有透明版，手表也有，小米手表 S5 透明版同步上市，限量 5000 台，售价 2499 元。小米手表 S5 透明版采用透明中框设计，覆盖小米龙晶玻璃 3.0 一体精雕，表径尺寸为 47mm ，搭配优雅精钢表圈。七、总结关于这场小米秋季新品发布会，IT之家小编就先盘到这儿。生态科技新品这里就不一一细说了，感兴趣的朋友可以移步IT之家 App 查看资讯报道。至于“消失”的小米 18 标准版，卢伟冰也明确说了“后面会单独发”，所以还得再耐心等等。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/476.htm", "publishedAt": "2026-09-23T14:03:11+00:00"}, {"title": "SpaceXAI 智能体 Grok Bot 上线首月，周用户数突破 40 万", "summary": "IT之家 9 月 23 日消息，据彭博社 22 日报道，SpaceXAI 的 AI 智能体 Grok Bot 上线约一个月，周用户数便已突破 40 万。据伦敦一场活动的演示材料和与会人士透露，截至 9 月 14 日，Grok Bot 用户数达到 41.8 万。彭博社看到的材料显示，用户数较前一周增加 24%。SpaceX 的 AI 部门于 8 月中旬推出 Grok Bot，希望在不断扩大的 AI 智能体市场上跟上 Anthropic 和 OpenAI。Grok Bot 的定位更像一名全天候待命的员工，而不只是聊天机器人，可以回复邮件、更新销售数据库、处理发票、安排工作，以及提交软件错误报告。本周，Meta 的 Muse 登顶苹果 App Store 免费应用榜，令华尔街聚焦 AI 智能体的市场潜力。Muse 初期吸引用户的表现，让分析师联想到 ChatGPT 在 2022 年底迅速走红的情形。Muse 主要面向消费者，提供免费下载。SpaceXAI 则把 Grok Bot 定位为企业工具，搭配不同档位的 AI 订阅套餐提供，同时推出独立应用。据彭博行业研究，Muse 的下载量比 SpaceXAI 的工具多 4 倍。过去三个月，SpaceXAI 积极争取在 AI 领域取得进展。斥资 600 亿美元（IT之家注：现汇率约合 4,028.08 亿元人民币）收购 AI 编程初创公司 Cursor 后，公司继续推进新模型和智能体的发布。两家公司 7 月推出 Grok 4.5，主攻编程、金融和法律任务，使用成本低于其他竞品。SpaceXAI 又于本周早些时候发布 Grok 4.7，目标是让模型能够更持久地处理难度更高的任务。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/475.htm", "publishedAt": "2026-09-23T14:01:26+00:00"}, {"title": "行业首个单枪峰值充电功率 2.2 兆瓦，吉利新一代 AI 补能技术“吉利智充”发布", "summary": "IT之家 9 月 23 日消息，吉利汽车集团今晚正式发布新一代 AI 补能技术 ——“吉利智充”。根据介绍，该技术依托吉利联合阶跃星辰共同开发的行业首个全域能源大模型 —— 星睿 PowerMind 能源大脑，实现单枪峰值充电功率达 2.2 兆瓦，再次刷新全行业充电功率上限；首发 AI 极速充、AI 智慧充和 AI 自动充，可让最高温度始终低于 65℃、平均温度不超过 55℃，将电池循环寿命提升 20% 以上。吉利还宣布，即日起至 2028 年 1 月 1 日之前，对新上市、搭载吉利智充技术的产品，将给予首任车主连续两年，每年 1000 元、共计 2000 元的专属充电体验权益；所有新老用户搭载吉利智充技术车型的电池质保全面升级至 8 年 20 万公里。到 2027 年底，吉利计划建成超 2.2 万座充电站，超 10 万把充电枪，其中吉利智充站超 1.5 万座，智充枪超 5 万把，率先在全国实现“县县通”；未来将规划布局超 15 万座充电站，超 60 万把充电枪，每枪平均服务 20 台车，就能实现每天服务超 1200 万辆车的能力，其中智充站 10 万座。根据介绍，星睿 PowerMind 支持自动关联用户通勤规律、价格敏感度、场站距离、闲忙状态等 13 项关键要素，通过场景引擎，推理用户真正的充电需求，推荐个性化补能方案。中汽中心实测显示，领克 10 从 10% 充到 97%，在峰值充电功率达 1093 千瓦的情况下，57% 时间充电温度都低于 55℃，全程最高温度仅 64℃，比国标推荐的 65℃ 还低 1 度。常温条件下，峰值倍率达 12C 的领克 10 和极氪 001，从 10%-70% 平均仅需 4 分 30 秒，10%-97% 平均仅需 8 分 40 秒，全球量产最快。IT之家从官方介绍获悉，吉利智充桩是行业首个“双 1500”充电桩，也是行业首个可双枪同时兆瓦输出的充电桩：峰值电压 1500V，覆盖新能源车法规要求的电压上限；峰值电流 1500A，乘用车最高，实现 2250kW 单枪峰值输出功率，适配未来 800V 到 1500V 高压车型。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/462.htm", "publishedAt": "2026-09-23T12:48:07+00:00"}, {"title": "小米米家三筒洗衣机健康洗 Pro 14kg 系列上市，洗烘版 4999 元 / 滚筒版 3999 元", "summary": "IT之家 9 月 23 日消息，在今晚的小米秋季新品发布会上，米家三筒洗衣机健康洗 Pro 14kg 系列上市，洗烘版 4999 元 / 滚筒版 3999 元。更精致｜14kg 标准尺寸三筒，超薄全嵌好安装更大量｜1.5kg 超大小筒 ×2，健康分洗贴身衣物更干净｜小筒洗净比 1.95，大筒 1.32更健康｜冷水深度除菌 99%，无需消毒液京东小米米家三筒洗衣机 滚筒 14kg3999 元直达链接京东小米米家三筒洗衣机 Pro 洗烘 14kg4999 元直达链接这款洗衣机拥有 14kg 洗涤容量（11kg + 1.5kg×2）、9kg 烘干容量（仅限洗烘款，7kg + 1kg×2），体积与米家标准 10kg 滚筒洗衣机相当，支持标准超薄嵌入。该机支持三筒独立进水，可同时洗涤、烘干，也支持独立操控；其中小筒洗净比 1.95，大筒洗净比 1.32，小筒升级 230mm 大筒径；支持冷水除菌（洗烘款），同时支持 10 天长效抑菌。智能方面，基于自研洗护算法和 Xiaomi MiMo 大模型打造 AI 米家灵云洗护功能，用户可通过一句话描述衣物材质、颜色、污渍，即可生成个性化洗护建议。IT之家附详细参数如下：京东小米米家三筒洗衣机 滚筒 14kg4705 元直达链接京东小米米家三筒洗衣机 Pro 洗烘 14kg5881 元直达链接2026 年数码家电政府补贴持续进行中，IT 之家为大家汇总国补领券地址，买数码家电之前记得领取。数码补贴：点此领券手机 / 平板 / 3C 数码支持 8.5 折政府补贴，不超过 6000 元的产品至高立减 500 元。家电补贴：点此领券多类家电支持 8.5 折政府补贴，单品至高补贴 1500 元。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/460.htm", "publishedAt": "2026-09-23T12:35:35+00:00"}, {"title": "25.58 万元起、最高 1100km 纯电续航，比亚迪腾势 Z9S 正式上市", "summary": "IT之家 9 月 23 日消息，比亚迪旗下腾势汽车全新科技豪华智能轿车腾势 Z9S 正式上市，新车共推出闪充尊荣型、闪充旗舰型、易三方闪充性能型三款车型，官方指导价分别为 25.58 万元、27.58 万元、32.58 万元。作为腾势品牌在中大型纯电轿车市场布局的重磅产品，腾势 Z9S 以 1100 公里纯电续航、第二代刀片电池、易三方技术平台为核心卖点，重构豪华新能源轿车的价值标尺。外观方面，腾势 Z9S 采用优雅之势原创设计，拥有流星定格前脸 + 流星尾迹车尾，提供七款外观色、三款内饰色。新车内饰还配备后排宽奢豪华大扶手 + 前排双零重力座椅 + Nappa 真皮座椅 + 奢享豪华后排座椅。新车车身尺寸为 5090/1980/1490mm，轴距 3025mm，定位准 D 级。车内配备前排双零重力座椅、后排电动调节与 7 英寸扶手屏、18 扬声器帝瓦雷音响、7L 智能冷暖冰箱、三温区双层流空调及 128 色氛围灯。储物方面提供 470L 后备厢与 120L 电动前备箱，全车共 44 处储物空间（含 11 处拓展点位）。续航与补能效率是腾势 Z9S 最突出的产品标签。新车搭载第二代刀片电池，CLTC 纯电续航里程最高达 1100 公里，官方称打破了全球纯电续航最长量产车纪录。根据不同配置，新车提供 780 公里、920 公里和 1100 公里三种续航版本。充电方面，新车采用 1000V 高压闪充平台，10%-70% 电量充电仅需 5 分钟，10%-97% 充满仅需 9 分钟，即便在零下 30 摄氏度的极寒环境下，20%-97% 充电也仅用时 12 分钟。配套方面，比亚迪计划到 2026 年底累计建成 20000 座闪充站，覆盖一二线至五六线城市，并推出全球首创的“滑轨悬吊式 T 型桩”和 1500kW 单枪闪充桩。性能层面，易三方版本综合最大马力达 1210 匹，百公里加速仅需 2.68 秒，进入“2 秒级”加速俱乐部。底盘配置上，新车标配云辇-A 智能空气车身控制系统、双向 10° 后轮转向系统（分体式 / 整体式因配置而异）以及前窄后宽鸳鸯轮胎，最小转弯半径 4.75 米，并支持圆规掉头、智能蟹行、易三方泊车辅助等功能。新车还全球首发“易三方智能漂移新手模式”，搭载带教程指引的漂移功能，同时提供一键 Boost 红色拨片。安全方面，新车车身采用高强度热成型钢笼式结构，高强度钢与铝合金占比 91.1%，关键区域使用 2000MPa 材质，整车扭转刚度 45036N·m/deg，配备 9 安全气囊（含远端气囊）。依托易三方平台，新车实现直线 200km/h、弯道 160km/h 爆胎不失稳。主动安全方面，新车搭载集团首搭的集成式前碰探测系统、AEB 自动紧急制动（支持高速 150km/h 紧急制动）、AES 自动紧急转向等功能。电池安全方面，第二代刀片电池通过了“边闪充边针刺”、4 节电芯短路热扩散、10 倍新国标力度底部撞击等极限测试，官方称实现不起火、不爆炸，并将延续电芯终身质保政策。智能化配置上，新车搭载新一代 AI 智能座舱，引入“AI 超级智能体迪迪虾”，支持模糊指令识别、多 Agent 调度、声纹记忆及跨场景服务调用，可完成点咖啡、订酒店、缴停车费等操作；同时首搭 Diva 智能伙伴，支持 120 余种表情互动。屏幕提供 17.3 英寸窄边框大屏标配及 15.6 英寸智慧生态屏选装，手车互联兼容华为、苹果、OPPO、vivo、小米、荣耀、三星七大品牌，并全球首搭 Apple CarPlay 小窗模式。辅助驾驶方面，天神之眼 5.0 系统基于端到端大模型并新增强化学习能力，支持城市领航辅助（含窄道通行、红绿灯读秒、博弈变道等）和高快领航辅助（上下匝道、大曲率过弯、拨杆变道等），泊车能力覆盖 APA、RPA、AVP 下车泊入及易三方泊车辅助，窄位极限泊车支持车宽 +60cm 垂直车位。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/459.htm", "publishedAt": "2026-09-23T12:34:37+00:00"}, {"title": "阿里发布 Qwen Intelligence，规划 Agent 靠「模型 ×Harness」，成功率达 90%", "summary": "AI 手机的概念喊了好几年 5K Infinite Display Micro-OLED 显示屏，像素密度达 37 PPD（每度像素数），并采用专门设计的超紧凑型 Pancake 镜片，支持杜比视界和杜比全景声空间音频。性能方面，Meta VR Glasses 搭载高通新款骁龙 Reality Elite 处理器。计算盒内置电池，可连续播放高分辨率媒体内容最长 3 小时，并支持 45W 快充。交互方面，Meta 将 AI 智能体直接集成到操作系统中。用户可以通过语音、眼球和自然手势控制设备，例如播放电影、打开应用、调整工作空间或进行搜索，无需使用传统手柄。影音方面，Meta VR Glasses 成为首款获得 IMAX Enhanced 认证的 VR 设备。Meta 表示，用户可以通过相关服务观看采用 IMAX Enhanced 画幅的部分影片，并支持 3D 电影。Meta 计划从 11 月开始，在部分国家和地区向 Disney+ 用户提供包括《复仇者联盟》《黑豹》等影片的 3D 版本，同时提供对应的塔图因（星球大战 IP）、复仇者联盟大厦（漫威 IP）等主题观影环境。此外，Meta 将通过 Disney Immersive Cinema by ILM 应用提供《复仇者联盟 3：无限战争》《星球大战 4：新希望》等影片的 VR 增强版本。Meta 还与 Prime Video、YouTube、DIRECTV、AMC+、Crunchyroll、Plex、ESPN 等平台合作，提供更多 VR 影音内容。体育方面，Meta 与 ESPN 合作推出“Immersive Sports”沉浸式体育体验，支持 8K 直播和 180° 视角。Meta 表示，设备上市后，每年将提供超过 100 场沉浸式体育赛事，合作方包括 MLB、NBC Sports、TNT Sports 和 UFC。办公方面，Meta VR Glasses 可提供大尺寸虚拟屏幕，也可以同时显示多个屏幕。设备支持将任意平面转换为键盘和触控板，并通过全彩透视功能让用户继续看到实体桌面、手机及周围环境。游戏方面，Meta VR Glasses 上市时将提供超过 75 款支持纯手势操作的游戏，同时支持 Xbox Cloud Gaming 云游戏服务，可串流运行更多游戏。Meta 还公布了“全息通话”功能，可生成用户实时表情和动作对应的数字化身，并通过空间音频呈现对方的位置（目前仅支持 WhatsApp、Zoom 等特定应用）。Meta VR Glasses 计划于 2027 年春季正式上市，售价为 1,299.99 美元（IT之家注：现汇率约合 8,739 元人民币）。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/537.htm", "publishedAt": "2026-09-24T00:39:04+00:00"}, {"title": "Meta 推出 349 美元无摄像头的雷朋 Audio 智能眼镜：43g 重 + 12 小时续航，还有女星 Lisa 联名眼镜等新品", "summary": "IT之家 9 月 24 日消息，Meta 今日在 Connect 大会上发布了新一代 Ray-Ban Meta Audio 智能眼镜，并推出新一代 Ray-Ban Meta（Gen 3）及多款 Meta AI 眼镜。同时，Meta 宣布将个人 AI 智能体 Muse 引入 AI 眼镜，用户无需拿出手机即可通过语音等方式使用相关功能。正如其名，Ray-Ban Meta Audio 是 Meta 首款音频眼镜，重约 43 克，支持听歌、播客、通话以及免提使用 AI 助手。单次充电续航最长 12 小时，搭配充电盒可额外提供 48 小时续航。该眼镜提供 Clubmaster 和 Burbank 两种镜框造型，共有 23 种镜框与镜片组合，并支持多种处方镜片。产品目前已开启预订，起售价为 349 美元（现汇率约合 2,346 元人民币），将于 10 月 13 日发货。新款 Ray-Ban Meta（Gen 3）采用更薄的设计，看起来像一副太阳镜，并加入可自定义操作按键，可快速调用 Meta AI。产品提供 Aviator、Zena 和 Wayfarer 三种造型，共有 27 种镜框与镜片组合。续航方面，Ray-Ban Meta（Gen 3）最长可达 9 小时，比上一代增加 1 小时。该眼镜配备 6 麦克风阵列，Meta 称其可降低超 90% 的背景噪声，以改善通话和语音指令的清晰度。影像方面，Ray-Ban Meta（Gen 3）搭载 1200 万像素摄像头，支持 3K Ultra HD 视频录制，并新增动态照片功能；眼镜内置 LED 指示灯，在拍摄照片或视频时可让周围人员获知拍摄状态。Meta 还宣布，AI 眼镜将在今年晚些时候支持杜比全景声（Dolby Atmos）和 360° 空间音频的视频录制与播放。Ray-Ban Meta（Gen 3）现已上市，起售价为 449 美元（现汇率约合 3,018 元人民币）。Meta 同时扩充 Meta Glasses 产品线，新增 Capri 和 Nova 两种造型，并推出与歌手 Lisa 合作设计的特别系列。Lisa 系列包括 Meta Adventurer LISA Edition 和 Meta Capri LISA Edition 两款产品，均支持处方镜片，起售价为 399 美元（IT之家注：现汇率约合 2,682 元人民币），附赠带星星图案的眼镜盒和定制镜框，以及以 Lisa 宠物为灵感设计的特别版镜盒挂饰，还有可通过眼镜解锁的独特数字照片卡片。继凯莉 · 詹娜（Kylie Jenner）联名的 Meta Glasses 大获成功之后，Meta 宣布推出全新配色 —— 象牙白，这是对她标志性星火（Starfire）风格的全新演绎，起价 399 美元（现汇率约合 2,682 元人民币）。Meta 还宣布扩大 Meta Glasses 的销售范围，9 月 23 日起新增新加坡、韩国、墨西哥和阿联酋市场，并计划随后进入巴西。此外，Oakley Meta、Ray-Ban Meta 和 Ray-Ban Meta Optics 计划于今年晚些时候进入土耳其、波兰、葡萄牙、以色列、南非、印度尼西亚、泰国、中国香港、新西兰、马来西亚和菲律宾市场。限量版 Meta Fury 采用透明镜框和反光镜片，首发将在 Connect 和 Meta Labs 独家发售。此外，Meta 宣布推出售价 249 美元（现汇率约合 1,674 元人民币）起的新款 Meta Adventurer，配备黑色镜框和灰色镜片，并采用插入式充电盒。这款产品目前已开启预订，将于 10 月 23 日在 Meta Glasses 销售的所有国家和地区上市。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/531.htm", "publishedAt": "2026-09-24T00:19:41+00:00"}, {"title": "腾讯 QClaw 微信远程办公 AI 助手宣布 12 月 24 日停运，即日起停止新用户注册", "summary": "IT之家 9 月 24 日消息，腾讯 QClaw 微信远程办公 AI 助手今日发布公告称，因业务发展调整，QClaw 将于 2026 年 12 月 24 日 00:00 正式停止运营。停止运营安排2026 年 9 月 24 日自公告之日起，停止新用户注册，停止订阅服务购买与续费（已开通自动续费的用户将自动停止续费扣款，无需手动操作取消）。停止运营前，已注册用户、已购买订阅服务的用户均仍可正常使用服务；用户账号内的已有积分有效期不因本次停运调整，可在原有效期内继续使用，请留意积分到期时间。2026 年 12 月 24 日 00:00QClaw 正式停止运营，除数据备份与迁移功能外，其他功能停止使用。自公告之日起，如用户账号内存在已购买但尚未使用完毕的有效订阅服务（包括已付费但尚未使用完毕的有效订阅套餐、已付费但尚未使用完毕的有效积分包），且希望提前终止使用，用户可申请退款。自公告发布之日起至产品停运，用户可通过 QClaw 客户端内置的备份与迁移工具，将配置、记忆、Agent 人格、对话记录等数据备份至本地。2027 年 3 月 24 日 00:00 起，除法律法规规定必须在一定期间内留存的信息外，官方表示将依法删除全部用户数据。停运前（即日起至 2026 年 12 月 24 日 00:00）：客户端功能均可正常使用，您可随时创建并下载备份；停运后（2026 年 12 月 24 日 00:00 至 2027 年 3 月 24 日 00:00）：其他功能停止使用，用户仍可登录 QClaw 最新版本客户端，在「设置 → 备份与迁移」中下载备份文件；自公告发布之日起，用户可通过 QClaw 官网顶部「迁移到 WorkBuddy」入口，将 QClaw 中的数据快速迁移至 WorkBuddy。整体流程分为「网页端授权」与「客户端执行」两步：迁移方式：第一步（QClaw 官网）：进入迁移页面 → 登录您的 QClaw 账号 → 登录 / 注册 WorkBuddy 账号完成账号连接授权（仅个人版 WorkBuddy 账号支持授权迁移） → 确认本次要迁移的数据范围 → 获取迁移 Prompt；第二步（QClaw 客户端）：按页面指引，在 QClaw 客户端内添加 WorkBuddy 一键迁移助手，将上一步获取到的迁移 Prompt 交由该专家执行，即可完成数据迁移。迁移补贴：完成 WorkBuddy 账号登录与授权、并实际完成有效数据迁移的用户，可获得 WorkBuddy 1000 积分补贴、有效期 1 个月；无论用户此前是否已在使用 WorkBuddy，均可享受；迁移用户购买奖励（仅限此前未在 WorkBuddy 付费的新用户，若您此前已在 WorkBuddy 购买过会员，则不享受本项奖励）：首次购买 WorkBuddy 单月会员：标准版赠 500 积分、高级版赠 1,000 积分、旗舰版赠 5,000 积分；首次购买所赠积分无需手动领取，将在您购买成功后 7 个工作日内自动发放至您的 WorkBuddy 账号；第二次购买起：按 WorkBuddy 刊例价及套餐权益执行，无额外赠送。授权确认：网页端授权环节需用户确认本次迁移的数据范围，官方仅在用户授权的范围内迁移数据。IT之家注意到，QClaw 由腾讯电脑管家团队基于 OpenClaw 打造，今年 3 月开启内测；可微信远程整理文件、执行复杂任务、无需编程基础，适配办公/ 创作/ 开发等多场景。今年 7 月，有报道称腾讯发布内部组织调整通知，腾讯 QClaw 产品中心相关业务和部分团队，将调整至云产品六部，而云产品六部则是腾讯另一款 AI 办公智能体 WorkBuddy 产品所属部门。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/528.htm", "publishedAt": "2026-09-23T23:57:43+00:00"}, {"title": "苹果推送 watchOS 27.0.1 更新：修复 Apple Watch Series 12/Ultra 4 随机重启故障", "summary": "IT之家 9 月 24 日消息，科技媒体 AppleInsider 昨日（9 月 23 日）发布博文，报道称苹果公司面向 Apple Watch Series 12 和 Apple Watch Ultra 4 智能手表，紧急推送 watchOS 27.0.1 更新（24R365），修复随机重启故障。图源：@吃螃蟹的快乐 IT之家此前报道，部分刚入手 Apple Watch Ultra 4 以及 Apple Watch Series 12 的用户反馈，设备会出现意外重启的情况。设备的诊断日志显示，这些死机重启问题和苹果神经网络引擎（Apple Neural Engine）有关。根据上述两款智能手表用户反馈，重启有时候发生在编辑表盘、拨打电话、使用 Siri 时，有时候打开 Apple 地图、App Store 或记录锻炼时；部分设备处于闲置状态时，也出现重启情况。报道称苹果公司紧急发布 watchOS 27.0.1 更新，聚焦于修复新款 Apple Watch 的随机重启问题。用户可在 Apple Watch 的“设置”中进入“通用”和“软件更新”下载安装。不过更新时设备需保持至少 50% 电量并连接 Wi‑Fi，也可通过 iPhone 上的 Apple Watch 应用更新。相关阅读：《部分用户反映苹果 Apple Watch Ultra 4/Series 12 会意外重启》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/520.htm", "publishedAt": "2026-09-23T23:21:13+00:00"}, {"title": "苹果 HomePod 运行 Siri AI 交互体验曝光：白 / 蓝 / 橙主色调指示灯", "summary": "IT之家 9 月 24 日消息，消息源 @itspdfu 今天（9 月 24 日）在 X 平台发布推文，挖掘 audioOS 27 系统，发现了适用于 HomePod 的 Siri AI 交互体验。IT之家注：audioOS 并非苹果官方叫法，是指在苹果 HomePod 上运行的系统软件版本名称。泄露内容还指向代号 Linwood 的系统，被描述为 HomePod 上 Siri AI 的基础组件。推文中消息源还分享了一段演示视频，展示了 HomePod 运行新版 Siri 时的状态灯效果。灯光以白色、蓝色和橙色为主，与 Siri AI 在其他苹果设备上的配色保持一致。苹果在 2026 年 6 月介绍 Siri AI 时，没有提及 tvOS 或 HomePod 平台。科技媒体 9to5Mac 认为，此前已有多项传闻指向苹果将推出新款 Apple TV 4K 和 HomePod，并可能把 Siri AI 纳入这两类设备。现有泄露信息未能确认 Siri AI 是否仅限新硬件。pdfu 在后续消息中表示，尚不清楚该功能会否与新硬件独占绑定。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/519.htm", "publishedAt": "2026-09-23T23:05:20+00:00"}, {"title": "微软 Surface Pro 12 与 Laptop 13 升级高通骁龙 X2 Plus 处理器，基础内存从 8GB 提升至 16GB 且价格大涨", "summary": "IT之家 9 月 24 日消息，当地时间 9 月 23 日，微软在高通 2026 骁龙峰会上发布了新一代 Surface Pro 12 英寸和 Surface Laptop 13 英寸新品。两款产品均搭载高通骁龙 X2 Plus 处理器，同时推出了一款集成触觉反馈的 Surface Mouse 鼠标。新品将于 10 月 13 日起在部分市场上市。Surface Pro 12 英寸起售价从去年的 799.99 美元（现汇率约合 5,371 元人民币）涨至 1,149.99 美元（IT之家注：现汇率约合 7,720 元人民币），Surface Laptop 13 英寸也从 899.99 美元（现汇率约合 6,042 元人民币）涨到 1,199 美元（现汇率约合 8,049 元人民币）。好消息是，两款设备的基础内存也已经从上一代的 8GB 提升至 16GB，最高可选 24GB LPDDR5x 内存和 512GB 存储。微软称，得益于骁龙 X2 Plus 的六核 CPU，新机在 Office 生产力负载中最高提速 17%，图形性能提升超过 60%，NPU 本地 AI 推理速度最高提升 95%，电池续航提升最高 18%。IT之家注：骁龙 X2 Plus 发布于今年 1 月，采用 3nm 制程，集成 Hexagon NPU，AI 算力为 80 TOPS。Surface Pro 12 英寸延续了无风扇设计，配备 12 英寸 PixelSense 触摸屏，拥有 2196×1464 分辨率、90Hz 刷新率、500 nits 亮度（较前代提升 25%），新增黑色版本可选。微软同时推出了 Microsoft Ink Canvas，这是一款以手写笔为核心的 AI 应用，支持素描、标注、图像生成和文本摘要，将预装于新款 Surface Pro 12 英寸，并于 10 月 13 日上架 Microsoft Store 供其他兼容设备下载。Surface Laptop 13 英寸同样采用无风扇设计，配备 13 英寸 PixelSense 触摸屏，分辨率为 1920×1280，刷新率 60Hz，亮度 500 尼特。微软标称其本地视频播放续航为 22.5 小时，网页浏览续航为 18 小时。Surface Pro 12 英寸的网页浏览续航则为 13 小时。新款 Surface Mouse 采用左右手通用设计，内置触觉反馈马达，可在窗口贴靠、对象对齐等 Windows 11 操作中提供振动反馈。鼠标配备可自定义操作按钮，支持蓝牙 6.0，售价 79.99 美元（现汇率约合 537 元人民币），10 月 13 日起提供黑色和铂金两种配色。两款设备及鼠标均面向企业客户发售。Surface Pro 12 英寸还提供 5G 配置可选，微软称这是该尺寸设备被要求最多的功能之一。微软同时为商用设备提供 Secured-core PC、Microsoft Pluton TPM 2.0 等安全功能，以及 Surface Management Portal、Surface IT Toolkit 等管理工具。相关阅读：《高通骁龙 X2 Plus 正式发布：单核性能提升 35%，扩展 Win11 Copilot+ PC 阵营》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/517.htm", "publishedAt": "2026-09-23T22:48:09+00:00"}, {"title": "AI 改变跨平台开发取舍，Shopify 弃用 React Native，改用 Swift 和 Kotlin", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/2FFH5EHF2SMusaYQhjlX?utm_source=rss&amp;utm_medium=a （下称 MLID）”此前都否认了延期说法，理由是生产合同基本敲定，芯片据称计划在明年第二季度投产，推迟生产的代价甚至比承担内存涨价的成本更高。Kepler_L2 还确认了一组看似接近最终规格的浮点算力数据：PS6 为 40TFLOPS，XBOX Helix 为 56TFLOPS。换言之，XBOX 主机在纸面浮点算力上领先 40%。按传闻的 PS6 启用的 52 个计算单元计算，再考虑 RDNA 架构的双发射 FP32 吞吐量，40TFLOPS 意味着 GPU 频率约为 3.0GHz。此前给出的算力范围，则是 34–40TFLOPS。Kepler 又补充了过去一年多逐渐积累的次世代主机信息。有关爆料主要来自 Kepler 本人和 MLID，依据是泄露的 AMD 文件。规格PlayStation 6（代号“Orion”）XBOX Project Helix（代号“Magnus”）制程节点台积电 N2，部分爆料称为 N3台积电 N3P芯片约 280mm²，单芯片设计约 408mm²，采用芯粒设计，由 144mm² 的 SoC 和 264mm² 的 GPU 组成CPU8 个 Zen 6c 核心＋2 个 Zen 6 LP 核心3 个 Zen 6 核心＋8 个 Zen 6c 核心GPU54 个 RDNA 5 计算单元，其中 52 个启用，频率 2.6–3.0GHz68 个 RDNA 5 计算单元，频率 2.5GHz 以上内存30–40GB GDDR7，160bit 位宽36–48GB GDDR7，192bit 位宽AI 硬件神经阵列集成于 GPU 内独立 NPU，最高 110TOPS浮点算力（Kepler_L2 爆料）40TFLOPS56TFLOPSKepler_L2 此前概括过两款主机的差别：Helix 比索尼对手的芯片面积约大 42%，内存容量约多 20%。今年 3 月，Kepler_L2 曾作出估算，PS6 的物料成本约为 760 美元（IT之家注：现汇率约合 5,102 元人民币），699 美元（现汇率约合 4,693 元人民币）的零售价仍有可能。约三个月后，他给出的物料成本升至约 960 美元（现汇率约合 6,445 元人民币），上涨 26%。索尼 CEO 也公开承认，预计内存价格到 2027 财年结束前都会保持在很高水平。Helix 的价格预计还要更高。Kepler 认为售价会明确超过 1,000 美元（现汇率约合 6,713 元人民币）。MLID 的零部件成本估算则显示，规模化生产后的物料成本约为 900 美元（现汇率约合 6,042 元人民币）；据此推算，999 美元（现汇率约合 6,707 元人民币）是相当激进的最低定价，1,200 美元（现汇率约合 8,056 元人民币）最有可能。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/485.htm", "publishedAt": "2026-09-23T14:34:29+00:00"}, {"title": "谷歌推出运行 Android 的 AI 笔记本电脑 Googlebooks，起售价 899 美元", "summary": "Google 今年没有再挤 Chromebook 那条廉价赛道，而是换了个思路：让厂商卖「运行 Android 的 AI 笔记本」。Googlebooks 今天已经开启预购，5 款型号覆盖宏碁、戴尔、HP 等 OEM，10 月 4 日美国上市（加拿大、英国、爱尔兰、法国、德国、澳大利亚为 10 月 5 日）。 定价最扎眼：只有宏碁一款低于 1000 美元，899 起步，它...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502712", "publishedAt": "2026-09-23T10:47:28+00:00"}, {"title": "飞猪 AI Native 交付大脑：用超级流程重构需求交付｜QCon上海", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/lRSUjSdeaHMzTTycosyT?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-23T10:00:00+00:00"}, {"title": "让Token生产更高效：异构混推的关键技术演进与创新实践", "summary": "商汤大装置异构混推创新实践与技术演进", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/496578.html", "publishedAt": "2026-09-23T09:56:53+00:00"}, {"title": "阿里云捐赠 300 万美元资助 DHH 的 Linux 发行版 Omarchy，还要一起做 Qwen Book", "summary": "DHH 的 Linux 发行版 Omarchy 拿到了阿里云的真金白银：以「创始企业赞助者」（Founding Corporate Patron）身份加入 Omacom 基金会，每年 100 万美元、连续三年，总计 300 万——和 DigitalOcean（DO）此前的资助额持平。DHH 在公告里说得很直白，这钱只是起点。 真正要紧的是钱之外的合作，他们管它叫「Omarchy China...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502703/alibaba-cloud-joins-as-founding-corporate-patron", "publishedAt": "2026-09-23T08:08:18+00:00"}, {"title": "Qwen一号位定了！刘大一恒接棒", "summary": "与稚晖君同届天才少年", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/496384.html", "publishedAt": "2026-09-23T07:27:49+00:00"}, {"title": "Claude 5.5 发布，性能直逼 Fable，还要卷价格", "summary": "最卷一夜！ #欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1681629?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-09-23T02:25:19+00:00"}]}, {"label": "论文研究", "items": [{"title": "Anthropic 宣布成立生命科学团队和实验室，Claude 自主发现新型酶系统", "summary": "IT之家 9 月 24 日消息，当地时间 9 月 23 日，Anthropic 宣布成立生命科学研究团队及自有分子生物学实验室，并公布了一项由 Claude 参与生物学研究取得的早期成果。在人类科学家仅提供宏观研究方向的情况下，Claude 自主发现了一种此前未被表征的酶系统，Anthropic 将其命名为阵列关联逆转录酶（Array-associated Reverse Transcriptases，ART）。该发现来自 Anthropic 旧金山湾区实验室，是其生命科学团队自 2026 年春季组建以来的首个公开成果。相关预印本论文已于同日发布，尚待同行评审。Anthropic 表示，分享这一早期成果既是为了展示 Claude 在科学发现中的能力，也是为了让更广泛的科研社区了解其工作方向。在发现过程中，Anthropic 向 Claude 下达的指令是：在一个庞大的 DNA 序列数据库中搜索新型逆转录酶。人类科学家的介入仅限于最初的提示词设计和后续的实验室验证，其余工作全部由约 950 个 Claude 智能体并行完成。IT之家注：逆转录酶（RT）是一类能够以 RNA 为模板合成 DNA 的酶。根据 Anthropic 公布的细节，这些智能体在 21 小时内消耗约 2.1 亿个词元，从超过 20 万个逆转录酶中筛选出约 3500 个新候选系统，再收窄至 20 个最值得深入分析的候选，并逐一生成人类可读的分析报告。最终，其中一个 Claude 智能体在处理一段噬菌体 DNA 序列时，注意到一个不寻常的逆转录酶基因旁存在一串串联重复阵列。该智能体随后计算了重复序列的长度与间距，比对了已知的逆转录酶系统结构，并检索文献确认此前是否有相关报道。Anthropic 将 ART 系统描述为由三部分组成的结构：一个逆转录酶、一个位于其旁边的伴侣基因，以及一长串均匀间隔的非编码 DNA 重复序列。该重复序列阵列的结构与 CRISPR 阵列相似。根据预印本论文，ART 阵列包含 3 至 21 个短重复序列的拷贝。研究团队最初的实验显示，该阵列能够表达为一组不同的短 RNA，表明其具有生物学活性。不过，ART 系统的确切功能目前尚不明确。Anthropic 表示，该系统的特征组合仅出现在极少数已知系统中，而这些系统均为可编程的，能够执行剪切、复制和粘贴 DNA 等操作。但公司同时强调，从发现候选系统到验证其能否稳定、可控地用于基因编辑，仍需大量后续实验。CRISPR 基因编辑先驱、麻省理工学院及 Broad 研究所教授张锋在审阅预印本后表示：“这是 AI 智能体推动生物学发现的一个令人兴奋的案例。在逆转录酶旁边识别出 RNA 重复阵列极其引人关注，完全值得进一步深入研究。我希望这项工作能鼓励更多科学家探索 AI 如何支持他们的研究。”Anthropic CEO 达里奥 · 阿莫代伊（Dario Amodei）在 X 上坦言，这一发现是基于他人此前的工作，并指出斯坦福大学的一个团队此前曾描述过一个“在某些方面与 Claude 发现的系统相似”的体系。他同时强调，该发现“大部分但并非全部”由 Claude 完成。阿莫代伊还表示，该系统的“确切功能、生物技术实用性（如有）或重要性程度目前尚不清楚”。IT之家注：CRISPR（成簇规律间隔短回文重复序列）是一种存在于细菌中的获得性免疫系统，后被改造为基因编辑工具，通过向导 RNA 引导 Cas 蛋白对 DNA 进行精准切割。ART 系统中发现的重复阵列在结构上与 CRISPR 阵列相似，但功能是否类似仍有待验证。Anthropic 表示，实验室仅处理生物安全一级和二级（BSL-1/BSL-2）层级的研究，不涉及可感染人类的病原体，且所有湿实验操作均由人类科学家执行。Claude 在流程中负责的是数据挖掘、假说生成和数据分析。Anthropic 同时指出，此类基因组挖掘工作若能够规模化扩展，有望将专家研究中通常需要数周甚至数月的分析时间压缩至数小时。公司表示愿意与其他科学家合作，将这一方法扩展到基因组学及其他领域的研究中。相关阅读：《Anthropic 自建生物实验室推进 AI 物理实验，此前曾警告 AI 灭绝风险》《Palantir CEO 卡普：美国前沿 AI 实验室或在谋求“国有化”，以避开知识产权诉讼》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/524.htm", "publishedAt": "2026-09-23T23:45:52+00:00"}, {"title": "高通发布第二代骁龙音频平台至尊版：AI 能力翻倍、功耗降低 40%", "summary": "IT之家 9 月 24 日消息，在夏威夷举办的 2026 骁龙峰会上，高通在宣布第六代骁龙 8 至尊版和第六代骁龙 8 超级至尊版芯片后，今天发布第二代骁龙音频平台至尊版。这也是高通首款融合优质音频、语音技术、终端侧智能与连接能力的音频平台，助力音频可穿戴设备开启智能体全新体验。该平台整合骁龙畅听技术、终端侧 AI、安全云连接智能以及超低功耗 Wi‑Fi 6E，能够主动感知、理解用户需求并做出无缝响应，在保留高品质音频体验的基础上，带来更加直观个性化的交互体验。音频体验层面，平台搭载 aptX Lossless 无损音频、XPAN 扩展个人局域网技术，突破传统蓝牙连接距离限制；配备第五代自适应主动降噪、cVc 回声与噪声抑制技术，搭配多麦克风方案，强化降噪、人声拾取效果，嘈杂环境下也可保障通话以及 AI 语音交互稳定可靠。硬件形态上，平台覆盖耳塞、头戴耳机、开放式音频设备、音频眼镜、带摄像头耳机等多类产品。高通将提供参考设计方案，帮助厂商加快产品从原型到商用落地。性能方面，第二代骁龙音频平台至尊版实现了音频可穿戴设备终端侧 AI 能力的显著跃升，与前代平台（第一代骁龙 S7 音频平台的峰值 AI 算力为 64 GOPS、每周期可执行 128 次 MAC 运算）相比，AI 能力（峰值 AI 算力为 128 GOPS、每周期可执行 256 次 MAC 运算）提升翻倍，并支持多种智能体验同时运行。与此同时，平台功耗降低高达 40%、平台尺寸缩小高达 30%。IT之家附上相关信息图如下：", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/516.htm", "publishedAt": "2026-09-23T22:41:13+00:00"}, {"title": "报告：美国人开始问 AI“吃什么零食”，高蛋白和重口味食品需求增长", "summary": "IT之家 9 月 23 日消息，据路透社报道，康尼格拉食品公司（Conagra Brands）称，越来越多美国消费者开始向人工智能询问“该吃什么零食”。这家 Slim Jim 肉类零食棒制造商表示，这一消费习惯正在推动高蛋白食品、浓郁风味产品以及针对特定健康目标定制的食品需求增长。受减肥药快速普及以及白宫“让美国再次健康”（Make America Healthy Again）倡议等因素影响，美国消费者对更健康食品的需求比以往任何时候都更加旺盛。康尼格拉食品同时也是亨氏（Hunt's）番茄酱的生产商。该公司与市场研究机构 Circana 合作，分析了美国零食市场超过 5300 万笔购物交易，覆盖约 1.7 万种产品。美国零食行业每年的零售销售额达到 1,982 亿美元（IT之家注：现汇率约合 1.33 万亿元人民币），其增长速度约为整个食品市场的 1.4 倍。康尼格拉食品负责增长科学业务的高级副总裁鲍勃 · 诺兰（Bob Nolan）表示，自新冠疫情以来的 6 年时间里，美国人的饮食和食品消费方式发生的变化，比此前 50 年还要多。诺兰周三表示：“无论消费者是希望补充蛋白质、获得更持久的能量，还是单纯享受片刻令人感到舒适的放纵，零食都正在消费者生活中扮演越来越重要、也越来越个性化的角色。”不过，健康趋势只是其中一个因素。康尼格拉食品的研究发现，年轻消费者，尤其是 Z 世代，正在推动消费者对更大胆口味的需求，从甜辣组合，到酸爽、咸鲜等口味的零食，市场偏好都在发生变化。康尼格拉食品表示，消费者也开始更加仔细地审视食品配料，并越来越多地使用 AI 工具来辅助购买决策。与其直接搜索某一种具体产品，消费者现在更倾向于告诉 AI 自己的需求，例如寻找蛋白质含量或膳食纤维含量更高的零食。诺兰表示：“这就是为什么一些传统品类一直承受压力。”他指出，饼干和咸味零食等品类的表现一直较为疲软。诺兰表示：“这些营养密度更高的零食，以及以特定目的为导向的零食消费方式，已经开始真正实现增长，并且正在加速。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/471.htm", "publishedAt": "2026-09-23T13:26:45+00:00"}, {"title": "AMD 市值破万亿，但靠的从来不只是 GPU", "summary": "AMD 的市值周一短暂突破了 1 万亿美元——对芯片设计公司来说，挤进这个俱乐部的屈指可数。但媒体对它评价仍是“永远处于劣势的一方”（perpetual underdog），因为在 AMD 头顶还压着英伟达这座近 5.5 万亿美元的市值高山，它只是把老对手英特尔（6400 亿）甩在了身后。 涨上去最直白的原因是搭上了 AI 这班车。AMD 入局...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502669/perpetual-underdog-amd-nips-joins-the-1t-club", "publishedAt": "2026-09-22T07:08:51+00:00"}, {"title": "【架构实践】用 Rust + Qwen3Guard 搭一套双层安全风控，我们踩过的坑和公开基准都在这了", "summary": "本文是 55873 生态系统技术白皮书第 4 篇 —— 双层安全风控架构。完整拆解我们在生产环境中落地 Rust 底层硬拦截 + Qwen3Guard AI 多语言语义研判的双层架构设计，包括踩过的坑、公开基准数据、以及诚实披露的能力边界。 导读 项目定位：双层安全风控 = Rust 底层硬拦截 + Qwen3Guard AI 语义研判 核心技术栈：Rust 编译...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502652", "publishedAt": "2026-09-21T12:40:35+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "YouTube 推出全新 AI 智能体，能帮创作者“翻红”老视频", "summary": "IT之家 9 月 23 日消息，在今天（23 日）的年度创作者活动 Made on YouTube 上，YouTube 宣布升级 2025 年推出的 AI 创作工具。YouTube 带来了一款帮助创作者在后台优化频道的智能体，其能够查看频道过去发布的视频，找出重新受到关注、契合新闻事件或开始走红的内容，并建议修改旧视频的缩略图或标题，借势吸引新一轮关注。据IT之家了解，YouTube 创作者产品副总裁阿姆贾德 · 哈尼夫介绍，智能体还能梳理频道内容，提取受众人口特征及受众数据，帮助创作者准备向品牌推介的合作方案，争取潜在赞助商。创作者上传视频后，智能体可以直接根据内容生成缩略图和标题，也能对创作者自己制作的缩略图提出反馈。创作者通过 YouTube 工作室进行测试时，不同观众还可能看到不同内容。动态缩略图工具支持为每条视频上传最多三张图片，YouTube 会针对不同受众选择最合适的图片，尝试增加观看时长。测试范围也进一步扩大到视频本身：创作者可以提供三个版本视频，分别尝试不同的开场、吸引观众的内容或整体结构，再比较表现。系统会把不同版本视频推送给小规模受众，找出观看时长最高的版本。创作者可以据此选定最终版本，也可以由 YouTube 在七天后自动选定。哈尼夫表示，系统会确保三个版本不会相差过大。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/503.htm", "publishedAt": "2026-09-23T15:06:51+00:00"}, {"title": "数百亿向量怎么搜？Pinterest 抛弃“内存大户”HNSW，转向量化 SPANN", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/rB0WGcG9iLIRH3xZojY5?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-23T11:22:00+00:00"}, {"title": "Jev vs Decitron：同为决策AI，为什么不是一回事？", "summary": "对复杂现实进行推演与决策", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/496352.html", "publishedAt": "2026-09-23T06:38:07+00:00"}, {"title": "技术第6篇，多语言智能生态架构实战：55873 七国语言原生保真 + 可控智能翻译体系", "summary": "做多语言 AI 平台的朋友，是不是也遇到过这些问题？ 翻译篡改原文怎么办？小语种安全审核怎么做？数据出境合规怎么解决？语音自动转写的隐私风险怎么控制？ 今天给大家拆解 55873 生态系统「多语言智能生态」的完整架构 —— 从原文保真、前端 UI 多语言切换、聊天智能翻译、语音隐私保护、多语言安全适配到文脉守护七语...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502693", "publishedAt": "2026-09-23T04:03:04+00:00"}]}]};

const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
