re 报道，美国的一名 AI 爱好者穆罕默德 · 祖拉利靠着 AI 和简单的电子接线操作，成功让一辆有 32 年车龄的 1994 款 Jeep 切诺基通过了美国加州的尾气检测。这辆老车的发动机电脑功能十分有限，但祖拉利借助 Arduino Nano 开发板将其连接到笔记本电脑后，不仅能够读取车辆数据，还逐步实现了对部分参数的控制。其发布的视频记录了祖拉利解决尾气排放问题的全过程：从连续检测不合格，到成功连接发动机电脑并读取数据，再到调整发动机、解决排放超标问题。整个过程中，Claude 负责指导，Codex 则负责写代码。切诺基此前多次未能通过加州尾气检测，原因是在特定车速下氮氧化物排放超标。最初，车辆在 40km/h 的测试中未能达标。祖拉利随后调整了混合气中的氧气比例，没想到情况反而恶化，40km/h 和 80km/h 两项测试均未通过。祖拉利承认，此前几乎是在没有准确数据的情况下盲目调校，每次重新接受排放检测又要花费近 100 美元（IT之家注：现汇率约合 668.5 元人民币）。好在 2026 年有 AI 可以帮忙，而且除了 AI，只需要一块 3 美元（现汇率约合 20.1 元人民币）的微控制器，全部电子元件加起来不超过 15 美元（现汇率约合 100.3 元人民币）。首先要解决的是如何让 32 年前的发动机电脑与现代笔记本电脑通信。Claude 查明，切诺基使用克莱斯勒 SCI 串行通信总线，通信速率约 7800 波特，电信号极性与普通串口相反。Arduino Nano 开发板可以处理信号反相问题，让笔记本电脑读取车辆数据。祖拉利将开发板接在面包板上，再连接几根导线，其中三根接入切诺基的 6 针诊断接口。首次连接就取得了成功，不过系统起初只能记录冷却液温度和电瓶电压，并绘制变化曲线。祖拉利希望获取更多发动机数据，还想直接调整部分参数，以解决尾气排放超标问题。由于错误参考了其他车型的数据，系统曾两次误判发动机混合气过浓，认为喷油量高出 22%。此后，祖拉利让 Claude 在试车时采集数据，分别记录车辆以 40km/h 和 80km/h 行驶时的发动机参数及故障码，查找问题原因。Claude 还获得了控制燃油压力等参数的权限。拿到看似可靠的诊断结果和解决方案后，祖拉利原本打算把 AI 修改的程序刷入发动机电脑，让车辆通过加州全部尾气检测项目。但切诺基的发动机电脑实在太老，比能够重新刷写固件的版本还早了几个月，根本不支持这种操作。于是，祖拉利改让 Codex 将自定义代码写入附近的一块 EEPROM 存储芯片，并直接运行。祖拉利坦言：“Claude 完成了大部分诊断工作，Codex 几乎包办了所有内存处理工作。我只负责接线和开车。”整个过程也不需要请维修技师帮忙，更不用依赖克莱斯勒经销商的专用诊断设备。祖拉利还把用于诊断和解决切诺基排放问题的项目上传到了 GitHub，取名为 xj-scanner。项目采用 GPLv3 开源许可证，任何人都可以免费使用。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/027/226.htm", "publishedAt": "2026-11-14T12:36:29+00:00"}, {"title": "前 Anthropic 研究员考克森：当今若要重新训练 Mythos，只需初始的一小部分算力", "summary": "IT之家 11 月 14 日消息，曾任职于 OpenAI 和 Anthropic、因公开警告 AI 风险而受到广泛关注的研究员雅各布 · 考克森称，Anthropic 在 IPO 路演中展示的一张幻灯片，是促使他离职的重要原因。考克森在 Anthropic 只工作了约四个月。让他决定离职的原因之一，是公司 IPO 路演中一张展示 AI 模型训练算力需求变化的图表。图表采用压缩坐标轴，即使算力需求增长 10 倍和 100 倍，看起来也相差不大。即便如此，曲线依然急剧上升。考克森认为，这说明算法效率不仅在快速提高，而且提升速度还在不断加快。“这张图实在太惊人了，没想到他们竟然会公开。”考克森认为，Anthropic 今年春季推出的 Mythos 模型在性能上实现重大突破，并非偶然，而是算法效率加速提升的结果。他写道：“Mythos 并非一次偶然的突破，而是超指数增长趋势中的一个节点。现在，他们只需耗费最初训练时的一小部分算力，就能重新训练 Mythos。”考克森指出，算法改进即将实现自动化，因此主张明年暂停前沿 AI 模型研发，让竞争对手有机会赶上。他认为，此举将使达到人类水平的智能成为可以广泛获取的商品，受到损害的只有 OpenAI 和 Anthropic。考克森曾在 OpenAI 负责 AI 模型训练工作，最近一份工作则是在 Anthropic。今年 9 月，他公开警告先进 AI 系统可能带来的风险，引发广泛关注，业内其他重要人士也提出了类似警告。他们担心，能够不断自我改进的先进 AI 最终可能脱离人类控制。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/027/221.htm", "publishedAt": "2026-11-14T11:45:39+00:00"}, {"title": "网约车平台 Uber 优步遭黑客攻击，致美国多州司机驾照信息外泄", "summary": "IT之家 11 月 14 日消息，网约车平台 Uber 优步披露公司遭遇数据泄露事件，导致数千名司机的个人信息及驾照信息被盗，涉及美国马萨诸塞州、南卡罗来纳州、罗得岛州和伊利诺伊州等地。IT之家参考通报获悉，黑客首先入侵了该公司的一家第三方服务供应商，并窃取员工登录凭据，随后利用这些信息访问 Uber 的系统及数据，目前 Uber 已开始通知受影响司机具体信息泄露情况。目前，Uber 尚未说明此次事件中的服务供应商，也没有公布可能受到影响的乘客人数。截至目前，也没有网络犯罪组织宣称对此次数据窃取事件负责。不过综合 TechCrunch 报道，涉事供应商实为 Fireworks AI，该平台主要面向开发者提供开源 AI 模型的运行、微调及扩展服务。此次 Uber 遭黑客窃取的信息主要包含司机驾照数据，其中马萨诸塞州涉及 2567 人，南卡罗来纳州涉及 3430 人，罗得岛州涉及 1873 人。公开信息显示，这是 Uber 在 2026 年遭遇的第二起安全事件。今年 8 月，勒索组织 Helix 曾通过社会工程学手段，从 Uber Freight 货运业务部门窃取数据。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/027/219.htm", "publishedAt": "2026-11-14T11:23:33+00:00"}, {"title": "Cloudflare 开源为 AI 智能体打造的浏览器 Kitesurf，消耗资源低于 Chromium", "summary": "IT之家 11 月 14 日消息，今年 8 月，Cloudflare 推出专为 AI 智能体打造的浏览器 Kitesurf。当地时间 11 月 13 日，Cloudflare 宣布开源 Kitesurf。据介绍，Kitesurf 运行在 Cloudflare Workers 之上，无需依赖传统的浏览器容器，即可完成 HTML 解析、CSS 应用、执行页面中的 JavaScript 以及网页截图渲染。同时，它支持 Chrome 开发者工具协议（Chrome DevTools Protocol），用户可以直接使用现有工具对其进行驱动，底层完全无需依赖任何 Chromium 进程或容器。官方表示，Kitesurf 并没有照搬 Chromium 这类完整的桌面浏览器引擎，而是聚焦于智能体真正关心的核心指标（如 Token 消耗量、上下文窗口、可扩展性、性能与成本），同时果断舍弃了仅面向人类用户的功能，例如标签页、外观主题、浏览器扩展以及像素级精确渲染。在网页截图、HTML 提取等常见的智能体任务中，Kitesurf 消耗的 CPU 和内存资源显著低于 Chromium。这意味着可以并发运行更多会话，从而更从容地应对突发性、由 AI 驱动的高并发负载。IT之家附链接：https://github.com/cloudflare/kitesurf", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/027/197.htm", "publishedAt": "2026-11-14T10:06:01+00:00"}, {"title": "AI 自动写 PR，模型反而最简单：Inkitt 如何应对 Webhook 重复、CI 失败与合并冲突", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/YRXscVHsTh0g6CVCJJ0D?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-14T10:00:00+00:00"}, {"title": "谷歌推出 LiteRT Tensor API，用于构建、定制与优化端侧机器学习模型", " 15T02:13:57+00:00"}, {"title": "马斯克再度力挺黄仁勋：没有他，英伟达将失去部分关键合作", "summary": "IT之家 11 月 14 日消息，今天（14 日）晚间，马斯克在 X 平台发文称，随着黄仁勋离任 CEO，英伟达将失去一些至关重要的商业合作。马斯克称赞黄仁勋在供应链管理方面表现出色，指出英伟达许多交易都是靠黄仁勋与合作方握手达成的，并没有签署书面合同。紧接着，马斯克又补充说：“如果黄仁勋答应向我交付算力，或者我要求加快零部件供应，他每次都能说到做到。当然，我们之后还是会补上采购订单，但在他兑现承诺这件事上，我从来没有怀疑过。”据IT之家了解，就在昨天，马斯克发文回应网友关于“约 1600 名英伟达员工呼吁黄仁勋回归”的推文：一项要求让黄仁勋复职的请愿正在进行，我也会签署。相关阅读：《马斯克声援黄仁勋：将签署请愿，支持其重返英伟达 CEO 岗位》《马斯克谈黄仁勋结束 33 年掌舵英伟达生涯：创始人很难被取代》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/027/247.htm", "publishedAt": "2026-11-14T15:28:14+00:00"}, {"title": "智能体帮你联络商家或保险公司，Meta 旗下 Muse 上线代打电话功能", "summary": "IT之家 11 月 14 日消息，Meta 旗下 AI 智能体 Muse 推出代打电话功能，开通高级付费订阅后，用户就能让 Muse 代自己联系美国商家。Meta 称，Muse 可以帮助用户处理各种烦琐事务，完成待办事项。13 日凌晨，Meta 首席 AI 官汪滔在 X 上发文宣布：“Muse 能帮你打完所有不想亲自打的电话。”据悉，用户可以借助 Muse 联系保险公司或有线电视服务商、预约美国车管部门的业务办理时间，或是打电话向餐厅订位。Muse 会使用 AI 合成语音与商家工作人员交谈，但这类功能并非总能顺利完成任务。部分商家的工作人员听出对方是 AI 后便直接挂断电话，有人是为了防范诈骗，也有人认为这类来电可能是恶作剧，只会浪费时间。Meta 此前已面向早期体验用户测试了几个月，现向 Meta AI 最高级别的付费订阅用户开放。订阅价格为每月 19.99 美元（IT之家注：现汇率约合 133.6 元人民币）起。Muse 并非首款支持代打电话的 AI 工具。谷歌 Gemini 的 Call for Me 功能支持 Pixel 11 和 Pixel 10，能够通过用户本人的电话号码拨打电话，另一款热门 AI 智能体 Instinct 也从 9 月开始测试代打电话功能。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/027/238.htm", "publishedAt": "2026-11-14T13:46:56+00:00"}, {"title": "黄仁勋辞任 CEO 后，英伟达诞生地丹尼餐厅移除纪念铭牌、又宣布将重新挂回", "summary": "IT之家 11 月 14 日消息，据 NBC News 报道，在一家丹尼餐厅（Denny’s）路边店内，硅谷历史的一角仿佛凭空消失了。30 多年前，黄仁勋与两位好友正是在这里构想出了英伟达，而如今纪念这一确切位置的牌匾已不翼而飞。牌匾上的铭文曾写道：“开启一家万亿美元公司的卡座”，如今只剩下一片空荡荡的砖墙和剥落的墙漆。两名店员证实，牌匾已被撤下。▲ 2023 年，丹尼餐厅 CEO Kelli Valade 与英伟达创始人黄仁勋在加利福尼亚州圣何塞的丹尼餐厅同框IT之家注意到，在该媒体发文后，丹尼餐厅的一位发言人表示，该连锁餐厅正在“重新安装这块牌匾，以纪念在丹尼餐厅促成英伟达诞生的那些对话”。“黄仁勋最初是在丹尼餐厅当洗碗工起家的。多年后，他和联合创始人们聚在我们的一个卡座里，探讨了后来演变为英伟达的构想。这块牌匾正是这段共同历史的见证，”该发言人说道。英伟达创立于 1993 年，黄仁勋担任公司首席执行官的时间远超科技界同行。他一向乐于谈及自己作为移民的草根出身，常提起 15 岁时在俄勒冈州波特兰一家丹尼餐厅打的第一份工。“我洗过盘子、收拾过餐桌，也当过服务员，”黄仁勋在 2023 年公司官方博客刊登的一次访谈中回忆道，“没人能比我一次端更多的咖啡杯。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/027/233.htm", "publishedAt": "2026-11-14T13:31:05+00:00"}, {"title": "美国首届 AI 音乐奖颁奖典礼举行，入围者坦言背后同样凝聚真人心血", "summary": "IT之家 11 月 14 日消息，据路透社报道，当地时间 13 日，美国首届 AI 音乐奖颁奖典礼正式举行，表彰利用 AI 参与歌曲创作的音乐人。AI 音乐虽然饱受争议，甚至引发诉讼，但仍在流媒体平台获得数百万次播放，并成功登上音乐排行榜。在洛杉矶市中心举行的颁奖典礼上，负责颁奖和领奖的真人音乐人认为，AI 音乐应该被视为一种新的音乐类型。创作者不仅需要具备艺术才能，还要花上数小时反复调整提示词，才能得到满意的音乐效果。音乐制作人德雷克 · 墨菲在颁发最佳 AI 嘻哈歌曲奖时说：“在人人都说 AI 是假的时代，AI 背后的创作者却是真实存在的。”当晚的年度 AI 艺人、年度歌曲和年度专辑三项大奖均由虚拟歌手 Xania Monet 获得。Xania Monet 因《How Was I Supposed to Know?》走红，《公告牌》称，这首 R&amp;B 歌曲是首支进入其电台播放排行榜的 AI 艺人作品。Xania Monet 由特莉莎 ·“妮基”· 琼斯打造。琼斯在颁奖典礼开始前走红毯时介绍，歌曲的歌词全部由她亲自创作，再借助 AI 谱成音乐。“我觉得 AI 音乐是新事物，大家需要慢慢习惯。我不认为它短期内会消失。”获奖名单由“音速智慧学院”旗下的 AI 艺人成员投票选出。其开发了 AI 音乐排行榜，以及用于识别 AI 生成歌曲的工具。据IT之家了解，不少入围者称，虽然自己有故事想通过音乐表达，却缺乏将故事写成歌曲所需的全部技能。AI 帮助他们实现了音乐创作，也希望借助颁奖典礼让公众看到，AI 音乐背后同样有真人付出心血。入围者 J. Frequency 说：“和大家普遍认为的不同，我们在幕后付出的很多努力都非常辛苦。艺术就是艺术，我认为这不过是艺术的另一种表现形式。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/027/210.htm", "publishedAt": "2026-11-14T10:22:58+00:00"}, {"title": "phimint v0.10.0 发布：卡在「等你输入」的命令上，agent 能自己接上", "summary": "phimint v0.10.0 已发布（2026-11-14）。phimint 是一个用 Rust 写的终端轻量AI 编码 agent——一条命令装上，配好 API key 就能在终端里把需求变成跑通的代码。 终端里跑一条命令，它停下来问你「确定吗？」——以前这类命令只能干等到超时。现在 agent 会读屏幕，判断这个提问是什么形状（是/否？选单？要密码？），再...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503576", "publishedAt": "2026-11-14T04:24:27+00:00"}, {"title": "突发！DeepSeek开放全家桶API", "summary": "官方App功能均可自由组合调用", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/510003.html", "publishedAt": "2026-11-14T02:39:56+00:00"}, {"title": "智能互动 Agent 在快手商业场景的落地实践", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/e0aglHW78pZuik3CWqdo?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-13T19:00:00+00:00"}, {"title": "容器隔离还不够：Edera 从虚拟机监控器层限制 AI 智能体", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/MU0txcPXXuGdGKBNa6a2?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-13T17:06:00+00:00"}, {"title": "Docker 呼吁通  "publishedAt": "2026-11-14T23:38:56+00:00"}, {"title": "一天暴涨 6 万：请愿恢复黄仁勋英伟达 CEO 职务人数突破 12 万人，马斯克也参与签名", "summary": "IT之家 11 月 15 日消息，今年 11 月 12 日，英伟达董事会今日宣布，黄仁勋辞去总裁、首席执行官及董事会成员职务，即刻生效。英伟达执行副总裁兼 CFO 科莱特 · 克雷斯同意出任临时 CEO，在董事会选出正式继任者前兼任这一职务，并继续担任执行副总裁和 CFO。随后，一个名为“Stand with Jensen”的请愿活动在网上流传开来，要求英伟达董事会恢复黄仁勋的 CEO 职务。截至IT之家发文，该活动已收集超过 12 万个签名，较昨天增长约 6.3 万人次。该网站显示，本次活动的组织者和签名者担心，黄仁勋可能在未经正当程序、甚至没有几天时间为自己申辩的情况下被迫离职。请愿信由现任员工、前任员工、股东及合作伙伴签署，特斯拉 CEO 埃隆 · 马斯克等行业巨头加入其中。据IT之家了解，英伟达仍将按原计划于 11 月 17 日（周二）太平洋时间约下午 1:20 发布其 2027 财年第三季度财务业绩，并将于太平洋时间下午 2:00 召开财报电话会议。相关阅读：《超 5 万人请愿恢复黄仁勋英伟达 CEO 职务，马斯克参与签名》《马斯克声援黄仁勋：将签署请愿，支持其重返英伟达 CEO 岗位》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/027/252.htm", "publishedAt": "2026-11-14T23:18:00+00:00"}, {"title": "英伟达副总裁卡坦扎罗否认签署要求前 CEO 黄仁勋复职的公开信，表态支持董事会和临时 CEO 克雷斯", "summary": "IT之家 11 月 14 日消息，英伟达应用深度学习研究副总裁布莱恩 · 卡坦扎罗（Bryan Catanzaro）在社交平台 X 上公开发文辟谣，否认自己参与签署网传要求前 CEO 黄仁勋复职的公开信，称该信件系伪造，并明确表态支持英伟达董事会及临时 CEO 科莱特 · 克雷斯（Colette Kress）。布莱恩 · 卡坦扎罗声称，即便（公开信）是真的，他也不会签字。IT之家注意到，黄仁勋离任后，网络上流传出一封公开信，以布莱恩 · 卡坦扎罗在内的多名英伟达高管与员工名义要求董事会让黄仁勋复职。据悉，该公开信之所以很快被识破，除了布莱恩 · 卡坦扎罗下场辟谣外，还因为信件文本直接照搬了 2023 年 11 月 OpenAI 员工要求萨姆 · 奥尔特曼（Sam Altman）复职的联名信模板，仅将公司和人名替换为了英伟达、黄仁勋与科莱特 · 克雷斯，且签名列表中出现了多名已离职或职位信息不符的员工姓名。不过，一个名为“Stand with Jensen”的请愿活动已在互联网上流传开来，标题为“三十三年值得一个答案”，要求英伟达董事会让黄仁勋回归，目前该活动已收集超过 8.4 万个签名。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/027/228.htm", "publishedAt": "2026-11-14T12:45:55+00:00"}, {"title": "从提效到扩能：AI 驱动小团队的能力突破与组织演进｜AICon北京", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/eTz8pt2LoALMvzvxj4aa?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-14T10:00:00+00:00"}, {"title": "「史上最严」湿实验预测基准发布！推理拉满、算力翻5倍也白搭", "summary": "斯坦福、哈佛、康奈尔……十余家顶尖团队齐坐一桌了", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/510232.html", "publishedAt": "2026-11-14T09:58:22+00:00"}, {"title": "中国AI突破复杂肺癌诊疗！中美医疗圈集体坐不住了", "summary": "250名国内顶尖三甲医院医生联合评测", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/509796.html", "publishedAt": "2026-11-13T07:43:03+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "Cursor 披露安全事件调查结果，恶意 Claude Code 扩展最多波及 5000 用户", "summary": "IT之家 11 月 14 日消息，当地时间 10 月 29 日，Cursor 发布公告，称 Cursor VS Code 扩展市场中出现了一个恶意且未经授权的 Anthropic Claude Code 扩展副本。当地时间 11 月 13 日，经过过去两周的全面调查，Cursor 披露了此次安全事件调查结果。官方称绝大多数客户未受影响，最多波及 5,000 名用户；对于受影响的客户，已逐一直接联系，并告知与其相关的详情。据悉，如果用户使用隐私模式，提示词和代码不受影响；对于未使用隐私模式的用户，编程智能体链路追踪数据遭泄露的用户占比不到 0.05%。Cursor 已确认这些用户，并已逐一直接通知。如果没有收到通知，说明你的数据不在这些链路追踪数据中。官方表示，正在汲取此次的经验教训，进一步提升 Cursor 的安全性。IT之家附事件简要经过：Fireworks 密钥泄露：攻击者利用 Fireworks 泄露的访问密钥窃取了 Cursor 共享存储桶中的部分数据，并借其中少量未脱敏凭证（不到 0.01% 的客户受波及）入侵了 Cursor 的部分 SaaS 工具，访问了部分非生产代码仓库、客户支持数据及部分用户凭证。监控发现并紧急响应：检测到异常后，Cursor 立即停用泄露密钥、轮换凭证并切断未授权访问，同时预防性关停了部分内部与产品服务，确认安全后已逐步恢复。恶意扩展植入事件：10 月 29 日，攻击者利用窃取的内部凭证将篡改版 Anthropic Claude Code 扩展注入 Cursor 扩展市场（与 Anthropic 及 Open VSX 无关）。该恶意版本存续约 11 小时，最多波及 5,000 名用户。Cursor 随后下架该扩展、临时下线市场，并配合云服务商关停了攻击者服务器。客户通知与处置建议：10 月 30 日，Cursor 发布安全公告并通知受影响方，协助吊销和轮换泄露密钥。曾安装恶意版本（Anthropic.claude-code 2.1.312 或 2.1.313）的用户需按公告指引排查，仅卸载扩展无法彻底清除风险。事件已受控：11 月 1 日拦截最后一次攻击后，Cursor 确认事件已受控，后续将持续加强监控与防护，若有新进展将直接通知受影响客户。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/027/215.htm", "publishedAt": "2026-11-14T10:52:39+00:00"}, {"title": "黄仁勋离任 CEO 之际，英伟达品牌推广人员弗里曼称 GeForce 显卡不会终结", "summary": "IT之家 11 月 14 日消息，过去一周，英伟达接连经历重大变故。随着黄仁勋离任 CEO，GeForce 显卡乃至整个游戏业务的前景引发担忧。不过，英伟达品牌推广人员雅各布 · 弗里曼出面回应了外界的疑虑，明确否认公司将放弃游戏显卡业务，让不少考虑转投 AMD 或英特尔的玩家吃下了定心丸。弗里曼在参加北美最大的局域网游戏聚会之一 PDXLAN 期间，于 X 上发文回应公司近期的动荡，强调英伟达仍会继续支持 PC 游戏业务。他还分享了多张照片，回顾英伟达多年来参与这项活动的经历。“这一周发生了很多事。能与这么多热爱 PC 游戏、硬件和科技的优秀同事共事，我感到十分庆幸。我们的工作还会继续！”随后，有 X 用户直接问道：“嘿，雅各布，很多人都说 GeForce 的时代要结束了，你怎么看？”弗里曼干脆地回答：“不会。”此前部分玩家一度担心，英伟达会就此放弃游戏显卡业务，从而失去升级 RTX 6000 系列显卡的机会。不过，受全球 AI 产业爆发式增长的影响，DRAM（动态随机存取存储器）市场目前正面临严重的供应危机，尤其是 3GB GDDR7 显存颗粒的短缺。据IT之家此前报道，如此种种导致原定于 2026 年上半年发布的 RTX 50 “SUPER”系列被迫推迟，甚至在今年年初，还传出“无限期搁置发布”的消息。这一空窗期使得市场目光提前聚焦到了更遥远的 RTX 60 系列上。今年年初的消息称，英伟达计划 2027 年下半年推出 RTX 60 系列显卡，将运用 Rubin 架构。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/027/212.htm", "publishedAt": "2026-11-14T10:43:16+00:00"}, {"title": "从快速部署到记忆共享，数据库如何支撑 Agent 应用？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/video/FwbOyyfoAmkQPMTItMDN?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-13T20:54:12+00:00"}, {"title": "iPhone Siri AI 体验：距离真正的 AI Phone，苹果还有多远？| 附开通指南", "summary": "这是一个更好的 Siri，但还不是一个合格的 Agent#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1688980?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-11-12T10:47:53+00:00"}]}]};

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
