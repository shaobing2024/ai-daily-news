odei）今天（11 月 26 日）在 X 平台发布推文，公开否认外界对其“主张人类应向 AI 交出自由意志”的指控，称这种说法“荒谬”。他在社交平台 X 上发布长文表示，AI 必须接受合法的民主程序治理，人类不应为了效率或安全而牺牲合法性与自主决定权，并强调将治理权交给 AI 是“糟糕的主意”。IT之家援引 TechCrunch 报道，这场争论的背景，是关于“AI 替人干活”与“AI 替人做主”之间的界限在哪里？一方认为，只要人类保留监督和最终决定权，任务层面的自动化就是技术进步；另一方则担心，当自动化从具体任务扩展到研发、治理乃至社会运行，人类控制权会被逐步稀释。OpenAI 首席执行官萨姆 · 奥尔特曼（Sam Altman）表示，必须确保人类继续拥有“对未来的自主权”，不能让 AI 在发展方向和关键选择上取代人类。Meta 首席人工智能官亚历山大 · 王（Alexandr Wang）也撰文称，人类不应接受社会被“移交”给人工智能。他认为，随着人工智能能力快速提升，安全、对齐与保障问题愈发紧迫，社会必须认真思考如何稳步推进这项技术。在这条长推文中，阿莫迪回应指出，他一贯主张对人工智能实施民主监督，认为人工智能应当服务于并加强民主制度，而人类必须始终保留最终决策权。他区分了两类情形：一是广泛放弃人类的自由意志，让人工智能代替人类决定社会应如何运行；二是随着技术进步，人工智能以更自动化的方式完成具体任务，例如驾驶汽车、设计抗癌药物或编写完整软件。在他看来，后者只是技术能力提升带来的工作方式变化，并不意味着人类因此失去对社会的控制。阿莫迪指出过度自动化也会存在诸多风险，其中一项是“递归自我改进”。若人工智能在缺乏充分人类监督和理解的情况下，自主开发下一代前沿模型，其能力可能提升得比人类能够控制或适应的速度更快。阿莫迪称，Anthropic 已公开表示，不认为 Claude 可以在没有有效人类监督和理解的情况下，完全自主地连续构建前沿模型。阿莫迪还指责竞争对手在进行“基于情绪的商业与政治定位”，即一边高喊“人类控制”“人工智能只是工具”，一边却在产品层面不断推进任务自动化。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/032/655.htm", "publishedAt": "2026-11-26T03:34:08+00:00"}, {"title": "黎曼猜想 AI 证明代码暴砍 99.5%：只剩 7.6 万行，又是 Anthropic", "summary": "只剩 7.6 万行了！！刚刚，轰动全网的 1740 万行黎曼猜想证明，迎来了一波史诗级大瘦身。代码量暴砍 99.56%。原版证明那 175,188 个文件，在 AWS 高配机器上得跑足足 21 个小时才能编译完；而现在的新版本，只需要一台 12 核、24GB 内存的普通机器，在已有 Mathlib 缓存的情况下，1 到 2 个小时就能从头构建完毕。有救了有救了！！结果我一看仓库作者 —— 怎么又是 A➗干的？？？大家好，过去几天我一直在和 Anthropic 的几位同事全力冲刺，开发这个证明的精简版本。我们已经成功将其篇幅缩减了大约两个数量级，从约 1500 万行减少到了约 76,000 行。这次出手的人叫 Luke Sernau，Anthropic 研究员，本次精简由他 + 同事 +Claude 共同完成。瘦身无望几天前，数学家 Levent Alpöge 与 Anthropic 的 AI 模型 Claude 合作，发布了一个长达 1740 万行的黎曼猜想（RH）与广义黎曼猜想（GRH）的 Lean 语言形式化证明，其规模相当于 Lean 官方数学库（Mathlib）的 7 倍，震惊了整个数学和 AI 社区。但问题是，这个庞大如天书的证明，文件数量超过 17.5 万个，其中只有一个文件包含了注释。社区的第一反应是尝试理解和验证。一个名为 rh-trim 的 GitHub 项目迅速建立，目标是检查、映射和收缩这个庞大的证明。结果显示，用 C#编写的 Tenet、用 Rust 编写的 nanoda 和用 Java 编写的 tenet-jvm 等多个独立内核，都成功接受了整个证明，并进一步分析揭示了其内部结构：绝大部分是基础工作。最终论证只需要整个证明的 6.6%。其余部分都在构建它所需要的工具，其中很多是 Lean 数学库从未有过的成熟数学理论。然而，当社区尝试对其进行「减肥」时，却遇到了困难。通过自动化的工具删除所有未被最终定理引用的「死代码」后，rh-trim 项目发现，最多也只能将代码量减少约 8%，而且这个削减后的版本始终未能成功编译。一度都要绝望了，光靠代码清理根本清不完。但现在，风暴的中心 ——Anthropic—— 亲自下场对这座代码巨山进行了重构。怒砍黎曼猜想就在社区上百名贡献者做牛做马地给 Claude 擦屁股时，grh-lean 横空出世了。它对 Alpöge 的原版证明进行了彻底的重写与重构，并一口气放出了两个版本。可读版（grh/）结构更清晰、带有大量人类可读文档和导航指南，约 30 万行代码（总计 47.7 万行），分布在 801 个文件中。紧凑版（grh-compact/）专为最短代码量而写，只有约 7.6 万行纯代码（算上注释的非空行约 9.5 万行，总计 11.3 万行），分布在 792 个文件中。7.6 万行什么概念？如果按照原版「1470 万行对应 25 万页论文」的比例粗略换算，7.6 万行的紧凑版意味着，一份不到 1300 页的人类可读数学论证已经近在咫尺。整个证明过程没有使用任何 sorry（Lean 中代表未完成证明的占位符），并且只依赖 Lean 最标准的三个公理：propext、Classical.choice 和 Quot.sound。编译完成后，团队不仅用 Lean 自身的内核重放了所有模块，还动用了官方验证工具 Comparator（v4.35.0）以及 nanoda、con-leche、con-ron 等多个独立检查器进行了交叉验证，全部顺利通过。根据项目 README 的披露，这次项目的全部 Lean 代码和文档均由 Claude（AI）编写，人类研究员与 Anthropic 同事主要负责提供方向和建议。神了，证明和消化全让 A➗吃干抹净了😭。最郁闷的莫过于那些正在自己家里用 AI 尝试精简证明的开发者。一位名叫 jychang 的网友在评论区大吐苦水：我已经完成了大约 70% 的证明，目前是 3.5 万行 Lean 代码。结果 Anthropic 抢先了一步。为什么？因为用不了 Claude，只能吃点 6.2 Sol😭。我完全是用 GPT-6.2 Sol 做的，用的是 100 美元的 ChatGPT 套餐，只用了一个 Agent，没用子 Agent，因为子 Agent 太吃每周额度了。而拥有海量额度、快速模式、还能随便开子 Agent 的 Anthropic 工程师抢在了我前面。唉，也是很无奈了。外部花了那么多时间和资源，每次只能取得一点点微小的缩减进展；而你的 A➗，只需要批一笔预算支出。。。值得一提的是，与 Alpöge 最初未提供许可证的版本不同，grh-lean 在 Apache 2.0 许可下开源。这意味着，社区现在可以自由地使用、修改和分发这份迄今为止关于黎曼猜想最重要的形式化证明文本。不过，作者也特别强调，目前这份证明仅通过了机器验证，尚未有数学家完整通读，也没有配套的数学论文。方法论大曝光所以，从 1740 万行压缩到 7.6 万行，究竟是怎么做到的？面对社区的好奇，作者 Luke Sernau 简单透露了小窍门：很遗憾关于具体方法我不能透露太多，但我通过把定义全部展开（unrolling definitions），得到一个很长、扁平化的证明，在里面寻找可以简化的地方，然后再把它们重新折叠打包起来（rolling them back up），取得了不错的效果。通过这种方式，我可以跨越模块边界进行简化。不过，有些部分确实需要完全不同的新论证，比如彻底干掉 Vandiver 猜想相关的部分。简单来说，就是「先拍扁、跨界消消乐、再封装」，外加「局部换血」。在原版那 17 万多个文件里，大量定理和定义被层层嵌套在不同模块中。如果只是按文件去修剪，AI 和人类都会被模块边界挡住视线。而 Sernau 和 Claude 采用的方法，是先把这些层层包裹的定义全部展开，变成一条长而扁平的推导链，让原本隔着好几个文件的冗余步骤直接暴露出来，实现跨边界的合并与化简，最后再重新抽象封装。除此之外就是数学路径上的「抄近道」。就像 Sernau 提到的「干掉 Vandiver」，对于原版中一些过于繁琐或绕远路的数学子步骤，新版直接换用了完全不同的新论证方式，很多背景材料也是从原版移植过来后彻底重写。谁是 Luke Sernau？这次史诗级精简工作的领导者 Luke Sernau，是 Anthropic 的一名研究员。公开资料显示，Sernau 在加入 Anthropic 之前，曾在 Google 和 Google DeepMind 担任高级软件工程师和研究员。有趣的是，他正是 2023 年那份著名的谷歌内部泄密文件《我们没有护城河，OpenAI 也没有》（We Have No Moat,And Neither Does OpenAI）的作者。在那份文件中，Sernau 指出，真正的竞争来自开源社区，开源模型将以极快的速度、更低的成本迭代，最终在能力上追赶甚至超越大型闭源模型。Sernau 本科就读于圣母大学（University of Notre Dame）数学系。毕业后，他在 Facebook（Meta）干了四年（2014–2018），期间主导过 Facebook 西雅图实习生项目并做过超 200 场技术面试，随后创办了程序员教育机构 BetterEngineering.org。2019 年，Sernau 加入谷歌担任高级软件工程师，2024 年起在 Google DeepMind 担任 Staff Researcher，带领多个 AI 研究团队，研究方向横跨大模型 Scaling Laws。2025 年 8 月，Sernau 离职谷歌，一个月后正式加入 Anthropic。如今，他也交出了自己在 A 社的一份重要答卷 —— 将 1740 万行的天书被削成 7.6 万行、并且配上了 30 万行带导读的清晰版本。球，被重新踢回到了人类数学家脚下。（ps：诶，邓煜老师是不是可以尝试读一下了👀）GitHub：https://github.com/lsernau/grh-lean本文来自微信公众号：量子位（ID：QbitAI），原标题《刚刚，黎曼猜想证明代码暴砍了 99.5%！只剩 7.6 万行》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/032/611.htm", "publishedAt": "2026-11-26T03:01:11+00:00"}, {"title": "AICon 北京 2026 全日程揭晓｜探索 AI 应用边界，构建持续创造价值的生产体系", "summary": "12 月 18 日—19 日，AICon 全球人工智能开发与应用大会·北京站将在北京新云南皇冠假日酒店举办。本届大会以「探索 AI 应用边界」为主题，设置 13 大技术专题，全日程共计 58 场演讲，覆盖大模型后训练、推理优化、Agent 工程、知识工程、智能体评测与安全、自进化系统、AI 软件交付、原生架构及组织变革等核心方向。来...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/event/8598428", "publishedAt": "2026-11-26T02:59:37+00:00"}, {"title": "480B 参数、每秒 0.5 元，MAGI-2 把 AI 视频价格压了一个数量级", "summary": "三呆科技（Sand.ai）11 月 24 日发布 MAGI-2，480B 参数、单次最长 30 秒 1080P 带原生音频。官方给的价格是每秒 0.5 元，说这是同规格主流模型价格的十分之一。 根据官方介绍，MAGI-2 延续了 MAGI-2 Preview 的核心技术路线，总参数从 114B 扩展至 480B，激活参数从约 6B 增至约 28B。上一版 MAGI-2 Preview 是去年 8 ...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503820/sand-ai-magi-2", "publishedAt": "2026-11-26T02:54:20+00:00"}, {"title": "《GTA 6》民间 PC 移植新突破：已能渲染游戏世界，帧率约 5~7 FPS", "summary": "IT之家 11 月 26 日消息，科技媒体 tweaktown 昨日（11 月 25 日）发布博文，报道称开源社区借助 AI 以及此前曝光的 XBOX 可执行文件，正在加速推进非官方 PC 移植《侠盗猎车手 VI》（GTA 6）游戏。名为“Belobug”的项目近日宣布，已能在 Windows 11 电脑上启动并渲染《GTA 6》的开放世界，画面包含光照、纹理、行人、车辆、植被、水体和天空等要素，运行帧率约为每秒 5 至 7 帧。IT之家注：Belobug 是另一款移植项目“Victory”的分支，以泄露的 XBOX 内部构建文件为“蓝图”，将相关文件交由 Claude 和 Gemini Antigravity 等人工智能工具解析、重组，并协助生成可用于 PC 平台的代码。项目开发者称，该版本在配备 AMD Radeon RX 9070 XT 16GB 显卡、Ryzen 7 9800X3D 处理器和 64GB 内存的电脑上测试，游戏完成度已达到 77.4%。目前，项目尚未在 Nvidia 或 Intel 显卡上进行测试。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/032/600.htm", "publishedAt": "2026-11-26T02:38:06+00:00"}, {"title": "OpenAI 开始合并 ChatGPT 聊天 / 工作模式，重度用户可能更早触及限额", "summary": "IT之家 11 月 26 日消息，OpenAICodex&amp;ChatGPT 团队负责人蒂博 · 索蒂奥（IT之家注：Tibo）今天宣布，公司已开始向小部分 Pro 订阅用户推送 ChatGPT 聊天 / 工作模式合并。部分用户对此表示批评，担心此举可能会限制他们的使用额度。OpenAI 发言人向科技媒体 TechCrunch 表示，大多数用户预计不会因此更频繁地遇到使用额度重置。但少数用量较高的重度用户可能会更早触及额度上限。同时，虽然聊天 / 工作模式将共享额度系统。但使用 Instant 模型进行的对话将不计入用量，即使用户已经耗尽使用额度，仍然可以继续使用 Instant 模型。OpenAI 将于 12 月进一步扩大额度共享的覆盖范围。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/032/599.htm", "publishedAt": "2026-11-26T02:30:00+00:00"}, {"title": "我国科研团队从地衣真菌中发现作物抗旱增产新基因：单株产量最多提高 42.4%，成果登上 Nature", "summary": "IT之家 11 月 26 日消息，西北农林科技大学今日宣布，11 月 25 日，该校康振生院士 / 毛虎德研究员团队联合中国科学院微生物研究所魏江春院士团队，在国际顶级学术期刊《自然》（Nature）在线发表了题为《嗜极生物来源基因提升禾谷类作物抗旱性与产量》的研究论文。该研究突破利用作物自身遗传资源开展抗逆改良的传统范式，从长期适应极端干旱生境的地衣真菌中挖掘新型抗旱基因，为打破作物抗旱与产量之间的权衡，培育抗旱高产粮食作物，提供了新的遗传资源与理论思路。长期以来，作物育种领域存在一大难题：作物抗旱能力提升的同时往往伴随产量下降，而高产品种又普遍耐旱性偏弱，抗旱与高产之间难以兼顾，这也成为旱区作物遗传改良亟待突破的关键卡点。团队将研究视角投向能够在极端环境存活的地衣。地衣是由真菌和光合共生生物形成的特殊共生体系，可以在干旱、贫瘠、高寒等严酷环境中长期生存，蕴含着独特的抗逆基因资源。通过大规模筛选，团队从地衣型真菌石果衣基因组中鉴定出新的抗逆基因 EpTFIIAγ，经过跨物种遗传转化以及多年份、多地点、多遗传背景的田间试验证明，该基因能够精准协调植物逆境生存与生长发育的动态平衡，显著提高小麦、水稻、玉米等粮食作物的抗旱能力，且在干旱环境下单株产量提高 19.7%—42.4%，正常供水条件下仍能促进部分作物产量提升。研究证实，遭遇干旱时，该基因帮助作物改善水分利用效率、延缓植株衰老，显著增强耐旱能力；水分供给充足时，该基因能够提升作物光合碳同化效率，优化“源 — 库”关系，充分保障作物的产量潜力，以此巧妙化解抗旱与产量此消彼长的冲突。团队还进一步解析了该基因独特的分子作用机制，发现蛋白 N 端特殊的内在无序区是发挥功能的关键。依托该区域，通过 DNA 结合初步定位、内源转录因子靶向识别、多价互作增效的多层级调控模式，整合到植物内源转录调控网络中，协同调控逆境响应、生长发育和产量形成相关通路，最终实现抗旱性与产量同步提升。同时，该研究拓展了转录因子依赖单一结构域精准识别靶基因的传统认知，为转录调控“涌现特异性”理论提供了重要实验佐证，揭示了外源基因嵌入并重塑作物内源调控网络的全新分子机制。IT之家附论文链接：https://www.nature.com/articles/s41586-026-11151-w", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/032/591.htm", "publishedAt": "2026-11-26T02:13:51+00:00"}, {"title": "英伟达 DLSS 帧生成有平替了？数毛社测试 ANR 开源方案", "summary": "IT之家 11 月 26 日消息，数毛社（Digital Foundry）于 11 月 21 日发布视频，独立测试名为 Apex Neural Rendering（ANR）的开源游戏画面增强技术，表示在部分游戏中该技术已能与 DLSS 的帧生成功能一较高下，现阶段整体成熟度尚不及 DLSS，存在重影、界面处理和镜头切换识别等方面的不足。视频源：数毛社，字幕翻译由 UP 主聖 · 耶和華制作IT之家曾于 11 月 12 日报道，ANR 是由 Apex Compute 开发的 AI 渲染技术套件，宣称兼容英伟达、AMD 和英特尔的多代显卡，甚至支持部分较老的型号。数毛社本次测试采用的评测平台包括 AMD Ryzen 7 9800X3D、英伟达 GeForce RTX 5070 Ti 和 32GB DDR5-6000 内存等。在 4K 分辨率、开启 DLAA 和 2 倍帧生成的《漫威蜘蛛侠：重制版》中，ANR 达到 130.5 帧，高于 DLSS 帧生成的 124.9 帧，两者的帧节奏和 PC 端延迟也大体接近。但在更高倍率的帧生成场景下，结果出现分化。在开启路径追踪的《赛博朋克 2077》中，DLSS 多帧生成在 3 倍模式下比 ANR 快约 10%；在《猩红沙漠》的 4 倍帧生成测试中，ANR 仅落后 3.6%，延迟几乎与 DLSS 持平。画质方面，ANR 暴露出重影更明显、对界面元素处理较弱、镜头切换检测不够可靠等问题。不过，它在《最后生还者第二部》等场景中，有时产生的插值伪影反而比 DLSS 更轻。综合来看，ANR 作为一款个人开发的测试版软件，已经展现出相当强的竞争力。ANR 更值得关注的特点，是它不依赖专用机器学习加速硬件，主要通过常规计算着色器运行。数毛社在 1440p 下测试《赛博朋克 2077》的 3 倍多帧生成时，英特尔 Arc B580 达到 186 帧，AMD Radeon RX 6700 达到 149 帧。不过，两者平均延迟分别达到 67 毫秒和 82 毫秒，AMD 显卡还出现了帧节奏不稳的问题。相关阅读：《挑战 DLSS：ANR 跨平台 AI 渲染技术公测，兼容英伟达、AMD、英特尔显卡》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/032/575.htm", "publishedAt": "2026-11-26T01:41:20+00:00"}, {"title": "阿福学会“望闻问切”背后，真实医疗需求正在重塑百灵大模型", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/V7VOeFvEPLrHAN2EFmUa?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-25T18:22:30+00:00"}, {"title": "2240 亿参数的 Hy4 flash 模型，现在能跑在 64GB 的 Mac mini 上", "summary": "腾讯混元在 11 月 25 日开源了 Hy4 flash 的 GGUF 量化权重和配套推理代码，工具是他们自己的压缩加速工具箱 AngelSlim。最小的版本权重约为原始的三成，官方实测在 48GB 显存设备上生成速度最高到每秒 89 个 token。 先把数字摊开。 原始权重 410.27 GiB。这个体积普通人的电脑装不下，所以官方给了几个量化版本：通用的...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503813", "publishedAt": "2026-11-25T09:03:51+00:00"}, {"title": "LibreOffice 收紧 AI 辅助代码贡献政策", "summary": "11 月 24 日，文档基金会（The Document Foundation，TDF）针对 AI 辅助代码贡献发布了更严格的规则。核心有几条： 贡献者在使用大语言模型之前，必须先获得批准； 提交代码时必须披露用了什么 AI 工具、是怎么审查的； 对借助 LLM 完成的补丁，贡献者要能用自己的语言解释其中每一行被改代码的原理和作用。 还有一条容易...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503810/libreoffice-restricts-llm-use-development", "publishedAt": "2026-11-25T08:33:26+00:00"}, {"title": "开源 AI 编程工具 T3 Code 被扒出“偷数据”", "summary": "T3 Code 近日这场风波，起点不是隐私，是商标。 11 月 20 日，中文开发者「开源小新」（账号 DDdxx666）发布了他第一个公开开源项目「 tm", "publishedAt": "2026-11-26T04:00:21+00:00"}, {"title": "降幅约 20%~35%：报告称马斯克 SpaceX 降价出租 AI 算力", "summary": "IT之家 11 月 26 日消息，行业研究机构 SemiAnalysis 昨日（11 月 25 日）发布报告，称全球首富埃隆 · 马斯克（Elon Musk）旗下 SpaceX 公司正在下调其 AI 计算资源的租赁价格，其重要客户 Anthropic 是否续签约 5 万台 H200 GPU 的计算合同，也出现新的不确定性。报道称，SpaceX 已将面向小型计算集群的 Blackwell GPU 现货租赁报价，从每 GPU 小时约 15.0 至 15.5 美元（IT之家注：现汇率约合 100.2 至 103.5 元人民币），下调至 10 至 12 美元（现汇率约合 66.8 至 80.1 元人民币），降幅约为 20% 到 35%。IT之家援引博文介绍，所谓“现货租赁”，通常指客户按需租用算力，而非签订长期固定合同，因此价格变化更能直接反映短期供需状况。与此同时，该报告称 Anthropic 可能不会续约涉及约 5 万台 H200 GPU 的集群合同。此前 Anthropic 高管在与卖方分析师会面时曾表示，其与 SpaceX 的计算协议不会延长至 2027 年第二季度之后。不过，马斯克随后回应称，Anthropic 极有可能继续向 SpaceX 租用算力，甚至希望额外获得 10 吉瓦的计算能力。报道指出 Anthropic 已成为 SpaceX 计算业务的重要收入来源。报道援引的数据显示，自 2026 年 12 月起，Anthropic 每月将向 SpaceX 支付约 31 亿美元（现汇率约合 207.02 亿元人民币）的计算租赁费用；SpaceX 在 2026 年第三季度近三分之一的收入来自 Anthropic，且按现有协议结构，到 2,029 财年累计收入预计可达 1,205 亿美元（现汇率约合 8,047.21 亿元人民币）。除 Anthropic 合同的不确定性外，SpaceX 似乎也在为潜在空置算力寻找新客户。报告称，SpaceX 已开始向其他客户出售部分计算能力，预计最早可在 2027 年初交付，报价约为每 GPU 小时 5 美元（现汇率约合 33.4 元人民币）。若这一报价属实，其价格将明显低于当前 Blackwell GPU 的现货租赁水平，可能进一步加剧算力价格竞争。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/032/716.htm", "publishedAt": "2026-11-26T03:50:30+00:00"}, {"title": "知乎 CEO 周源回应间接投资 DeepSeek：对长期价值有清晰判断，不会牺牲主营业务发展", "summary": "IT之家 11 月 26 日消息，知乎 11 月 23 日发布自愿公告，宣布知乎参投的天津砺思星深股权投资合伙企业已通过中间主体间接投资 DeepSeek，取得低个位数百分比股权。据澎湃新闻 11 月 25 日报道，知乎 CEO 周源在财报后的电话会议中回应称：“这是一项我们经过充分研究、审慎评估后作出的长期战略决策。我们对这笔投资的战略目标、资金安排以及长期价值都有非常清晰的判断。”周源表示，参与投资是知乎从更广阔的产业视角参与 AI 生态建设的一项战略布局，也为公司探索长期产业协同与价值创造机会，“我们已经充分考虑了公司的现金储备及未来经营需求。这笔投资不会对公司的正常经营和核心业务发展造成重大不利影响。”他同时强调，公司“不会以牺牲主营业务发展、财务稳健性或股东长期利益为代价进行战略投资，也会继续坚定执行回购”。▲ 知乎宣布间接投资 DeepSeek 公告据IT之家此前报道，知乎第三季度实现营业收入 6.59 亿元，与去年同期的 6.59 亿元基本持平。毛利率为 57.2%，较去年同期的 61.3% 同比下降 4.1%，主要受持续扩充内容供给及用户投入影响。营销服务收入 1.98 亿元，同比增长 4.5%，主要受益于效果广告产品优化。付费内容及 IP 运营收入 3.94 亿元，与去年同期基本持平。其他收入 6709.1 万元，较去年同期的 7595.9 万元有所下降，主要来自职业培训业务战略优化，部分被专家数据解决方案业务收入增长抵消。归母净亏损 4958.3 万元，去年同期为净亏损 4665.5 万元，亏损同比扩大 6.28%；经调整净亏损 3077.2 万元，去年同期为 2100 万元。总营运开支 4.88 亿元，同比下降 3.1%；其中销售及营销开支同比下降 3.3%，一般及行政开支同比下降 26%，研发开支同比上升 9.3%。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/032/582.htm", "publishedAt": "2026-11-26T01:51:43+00:00"}, {"title": "华为官宣智能汽车解决方案部件发货量超过 1 亿件，车型累计超过 60 款", "summary": "IT之家 11 月 26 日消息，华为乾崑智能汽车解决方案官宣，截至 11 月 25 日，搭载华为智能汽车解决方案部件的车型品牌数量累计达到 26 个，车型累计超过 60 款，华为智能汽车解决方案部件累计发货量超过 1 亿件。IT之家注：华为乾崑智能汽车解决方案涵盖华为乾崑智驾 ® ADS™、车控、车载光、车云及鸿蒙座舱（HarmonySpace）解决方案，为用户提供智能化的出行体验。乾崑智驾（ADS）：提供辅助驾驶软硬件系统，涵盖传感器、计算平台和算法；鸿蒙座舱（HarmonySpace）：提供车载操作系统与座舱智能体；乾崑车控：提供 HUAWEI XMC 数字底盘引擎，涉及动力、制动、转向、悬架的融合控制；乾崑车载光：提供 AR-HUD、智能大灯、车载投影等产品；乾崑车云服务：由华为乾崑 App、远控、数字钥匙等组成，负责看车、选车、用车全链路。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/032/569.htm", "publishedAt": "2026-11-26T01:23:18+00:00"}, {"title": "具身智能没有“速胜论”：从 70% 到 99.999%，机器人走出实验室还有多远", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/pcisT9ByOG238U0WZEGD?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-25T15:54:18+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "Pi创始人曝现代开发奇观：系统崩了，一屋子工程师都在问Claude怎么修", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/ExbJjrItIlc9KLfQ2UeT?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-25T18:22:07+00:00"}, {"title": "做了 16 年数据库，蚂蚁 OceanBase 为什么要再造一个 AI 数据平台？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/2YvROKs0CHz1yR4Wi02o?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-25T17:21:31+00:00"}]}]};

const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
