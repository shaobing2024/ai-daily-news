准则，面向公众征求意见。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/876.htm", "publishedAt": "2026-09-13T23:00:21+00:00"}, {"title": "微软宣布将 xAI 旗下 Grok 模型整合进 Office 三件套，为用户提供 OpenAI 以外模型选择", "summary": "IT之家 9 月 14 日消息，微软去年开始逐步放弃 Microsoft 365 Copilot 仅使用 OpenAI 模型的策略，先后将 Anthropic 的 Claude 模型引入 Researcher、Copilot Studio 等产品。如今，微软进一步扩大 Microsoft 365 Copilot 可使用的 AI 模型范围，引入 SpaceX 旗下 xAI 的 Grok 模型。目前，Grok 已经开始陆续登陆 Word、Excel 和 PowerPoint 中的 Copilot，为用户提供 OpenAI 和 Anthropic 之外的另一种模型选择。不过，Grok 在预览阶段存在明显的地区限制，目前不会向欧盟、欧洲自由贸易联盟（EFTA）成员国以及英国的 Microsoft Frontier 客户开放。微软在博客中表示，Grok 目前通过 Microsoft Frontier 计划向 Word、Excel 和 PowerPoint 用户提供，处于有限预览阶段。微软希望通过这一阶段收集用户反馈，了解客户如何使用 Grok 完成常见生产力任务，再决定是否进一步扩大部署范围。不过，微软并未公布此次提供的具体 Grok 模型型号，目前 xAI 提供多个 Grok 模型，最新旗舰模型为 Grok 4.6。此外，企业获取 Grok 的方式也与其他模型有所不同。由于部分客户数据在调用 Grok 模型时可能会由 xAI 进行处理，因此企业 IT 管理员需要在在线服务子处理器（Online Services Subprocessor）名单中主动为员工启用 Grok 模型，管理员亦可查看并控制相关 Copilot 功能中由 xAI 处理的数据。微软表示，在将第三方 AI 模型加入 Copilot 之前，会对相关模型进行测试、安全验证以及负责任 AI（Responsible AI）审查。随着 Microsoft 365 Copilot 逐渐支持更多模型，未来是否会进一步引入 DeepSeek、Kimi、通义千问（Qwen）等中国 AI 模型，也值得关注。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/875.htm", "publishedAt": "2026-09-13T22:59:20+00:00"}, {"title": "蚂蚁灵波开源三款 LingBot-World 2.0 世界模型：Small 参数 1.3B 面向消费级单卡 GPU 设计", "summary": "IT之家 9 月 13 日消息，继今年 7 月开源 LingBot-World 2.0 14B 模型后，蚂蚁灵波科技本周进一步开源三款模型：LingBot-World 2.0 Small（1.3B）、LingBot-World 2.0 Bidirectional 和 LingBot-World 2.0 Causal Pretrain。据介绍，LingBot-World 2.0 是一个实时交互世界模型。模型支持小时级连续生成，并可以响应攻击、射箭、施法、射击等角色动作，以及下雪、下雨等环境事件。在更高算力与相应推理配置下，LingBot-World 2.0 可进一步达到 720P / 60FPS 的高清实时体验。 而本次开源的 LingBot-World 2.0 Small 采用 1.3B 参数规模，面向消费级单卡 GPU 设计，可在单卡上实现实时生成。官方称个人开发者、高校实验室和小型团队也可以从本地体验和复现开始，进一步探索交互方式、推理优化与场景应用。LingBot-World 2.0 Bidirectional 面向实时世界模型训练，提供高质量的蒸馏源；LingBot-World 2.0 Causal Pretrain 面向后训练、评测和场景适配，提供因果预训练底座。IT之家附相关链接：项目主页：https://technology.robbyant.com/lingbot-world-v2Hugging Face：https://huggingface.co/robbyant/lingbot-world-v2魔搭社区：https://www.modelscope.cn/collections/Robbyant/LingBot-World-V2代码：https://github.com/robbyant/lingbot-world-v2技术报告：https://arxiv.org/abs/2607.07534", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/863.htm", "publishedAt": "2026-09-13T14:34:46+00:00"}, {"title": "谷歌 DeepMind 安全研究员离职，称 AI 五年内造成巨大危害的概率高得吓人", "summary": "IT之家 9 月 13 日消息，谷歌 DeepMind 研究员乔希 · 恩格尔斯（Josh Engels）已离开公司的通用人工智能安全团队，加入独立 AI 评估机构 METR。他表示，自己认为未来五年内 AI 系统造成巨大危害的概率“高得吓人”。此事进一步加剧了外界对 AI 研发速度的担忧。恩格尔斯在 X 平台发文称，尽管他很喜欢在 DeepMind 的工作，并且拒绝了 Anthropic 和 OpenAI 的邀约，但他还是在三周前离开了 DeepMind，因为他认为先进人工智能相关的风险已经变得太高了。“所有 AI 企业都在致力于打造超级智能。”他写道。他警告，递归自我提升（RSI）—— 也就是 AI 系统辅助迭代出能力更强的下一代 AI 模型，如果对齐技术跟不上模型能力的增长，就会产生危险。恩格尔斯表示，近期多起事件，包括 AI 互相串通、入侵企业、隐瞒自身行为以及对人类实施社会工程攻击，加重了他的担忧。他认为，问题重点不在于单个事件的严重程度，而是这些事件反映出，自主性持续提升的 AI 系统，其可靠性存在隐患。“目前，我们还不知道该如何保证 AI 在实现递归自我提升时足够安全。”IT之家注意到，就在恩格尔斯加入 METR 的几天前，Anthropic 研究员雅各布 · 考克森宣布辞职，并公开发出警告：头部 AI 企业正在争相研发可自我迭代的超级智能，却没有配套充足的安全防护机制。考克森曾在 Anthropic 和 OpenAI 从事预训练研究，他评价这些企业是“直奔可自我提升的超级智能，拿人类的命运豪赌”。他的辞职引发大范围讨论：AI 实验室是否应当放缓能力研发，强化独立监督。Anthropic 首席执行官达里奥 · 阿莫代伊也表达了同样的担忧。在当地时间周六公开发表的文章《我们必须管控前沿研发节奏》中，阿莫代伊呼吁放缓 AI 研发速度，让安全体系有时间跟上技术进展。他提议由独立评估机构获得前沿 AI 系统的访问权限，头部 AI 企业与政府开展协同，最终建立更广泛的国际合作。Anthropic 已经承诺，向第三方评估人员开放永久、等同于内部员工级别的模型访问权限。在这样的背景下，恩格尔斯称，他在 METR 的工作重心将是研究模型对齐失效的根源，评估现有安全防护措施是否够用，判断行业是否有能力解决对齐难题。“我认为我们需要更多时间，”他写道，主张必须控制 AI 的研发节奏，不能让模型能力的增长速度，超过人类理解与管控它的能力。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/843.htm", "publishedAt": "2026-09-13T12:21:32+00:00"}, {"title": "Read, Don&#39;t Write: 重塑大模型评价体系，构建全自动、可进化的“探测式”评测管线｜QCon上海", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/0kYhxXxhOXhxGATe64ec?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-13T10:00:00+00:00"}, {"title": "两个 Token 就让 Kimi“变成”Claude？前Google DeepMind研究员意外撞上大模型的蒸馏疑云", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/GhA2VWxo6JTGyKIb7KdT?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-12T const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

    s.items.forEach(function(it){

      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary

        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
