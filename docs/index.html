const DATA = {"date": "2026-09-19", "generatedAt": "2026-09-19T00:55:33Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "Anthropic 自建生物实验室推进 AI 物理实验，此前曾警告 AI 灭绝风险", "summary": "IT之家 9 月 19 日消息，Anthropic 已在美国旧金山湾区设立一座湿实验室，用于开展实际生物学实验，并探索利用其 AI 模型辅助完成从计算分析到物理实验的研究流程。Anthropic 生命科学负责人埃里克 · 考德勒-艾布拉姆斯已向路透社确认，该实验室目前已经投入运营。IT之家注：湿实验室（wet lab）是指配备实体设施、可进行细胞培养、生化分析、分子实验等物理操作的实验室，与主要依靠计算机进行数据分析和建模的“干实验室”相对应。考德勒-艾布拉姆斯表示：“我们认为，要开展生物学研究，最终的检验仍然是在实际实验室中工作，而且在未来相当长时间内仍会如此。我们今天确实在做这件事。”他补充称，该实验室的运作方式与大多数生物技术实验室类似，Anthropic 既会自行开展部分研究，也会与外部合作伙伴共同进行实验。Anthropic 目前没有披露该实验室具体开展哪些项目，但公司表示，其主要方向是基础生物学研究，而不是直接进行药物研发，避免与其客户和合作伙伴形成直接竞争关系（Anthropic 已与诺和诺德、赛诺菲、艾伯维等药企建立合作）。此次布局与 Anthropic 近年来进入生命科学领域的动作相呼应，公司在今年 4 月以约 4 亿美元（现汇率约合 26.86 亿元人民币）收购了“隐身运营”的 AI 生物技术公司 Coefficient Bio（该公司成立仅八个月，团队不足 10 人，由曾在基因泰克从事计算药物发现的塞缪尔 · 斯坦顿和内森 · 弗雷创立，整体并入 Anthropic 医疗生命科学部门），并持续扩大生命科学相关业务。Anthropic 在本周还推出了“生命科学验证计划”（Life Sciences Verification Program），向经过审核的生物学研究人员提供更强的 AI 模型。此前，公司已经推出面向科学研究的 Claude Science 等产品，用于帮助研究人员处理计算研究工作。Anthropic 同时在药物研发领域推进外部合作。例如，公司于 9 月 16 日宣布与诺和诺德合作，利用 Claude 开展新药发现和研发工作。此次实验室的消息也受到 Anthropic 自身 AI 安全立场的关注。Anthropic CEO 达里奥 · 阿莫代伊此前表示，他认为 AI 可能在未来 5 至 10 年内帮助治愈大多数重大疾病，同时多次将生物恐怖主义列为 AI 可能带来的重要风险之一。2026 年 9 月，Anthropic 研究人员雅各布 · 考克森辞职并公开表达了对 AI 安全风险的担忧。与此同时，Anthropic 负责 AI 对齐工作的负责人曾估计，未来 10 年内 AI 导致人类灭绝的概率超过 10%。阿莫代伊随后呼吁 AI 行业放缓发展速度，并推动行业进行自我监管。Anthropic 近期还与埃森哲宣布，未来 5 年将至少投入 20 亿美元（现汇率约合 134.28 亿元人民币），用于对前沿 AI 模型开展独立评估。因此，Anthropic 一边强调先进 AI 可能带来的生物安全及其他风险，一边建设能够让 AI 参与实际生物实验的实体实验室，引发了科技行业的讨论。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/004/376.htm", "publishedAt": "2026-09-19T00:45:14+00:00"}, {"title": "Anthropic 计划将 IPO 推迟至 11 月，上市估值约 2 万亿美元", "summary": "IT之家 9 月 19 日消息，据《华尔街日报》今日报道，Anthropic 计划将首次公开募股（IPO）推迟至 11 月进行，晚于许多投资者此前预期的 10 月。知情人士透露，部分 Anthropic 顾问认为，推迟至 11 月可以让公司有时间展示第三季度财务数据，以证明其竞争地位。知情人士表示，将 IPO 目标定在 11 月的决定是在 Anthropic 前研究员发出公开警告、引发关于 AI 发展速度是否过快辩论之前作出的。这一时间安排仍可能发生变化。投资者此前预计 Anthropic 上市估值约为 2 万亿美元（现汇率约合 13.44 万亿元人民币），募资额最高可达 1,000 亿美元（IT之家注：现汇率约合 6,721.85 亿元人民币），两项数据均将超越 SpaceX 在今年 6 月创下的纪录。Anthropic 计划在未来几天与潜在投资者会面。部分投资者预计将追问公司，若 AI 模型推出速度放缓，将对其财务状况或目标估值产生何种影响。这些会议旨在帮助公司及其银行家评估投资者对即将进行的股票发行的兴趣。Anthropic 的顾问和现有投资者继续认为，放缓开发步伐不太可能大幅影响其财务前景，因为现有模型仍可产生可观收入。现有投资者预计，公司到 2026 年底的年化收入将超过 1,100 亿美元（现汇率约合 7,394.03 亿元人民币）。当地时间 9 月 17 日，Anthropic 在总部召集部分早期投资者和合作伙伴。与会者称，公司高管 Jared Kaplan、Benjamin Mann 和 Andrej Karpathy 介绍了公司的新产品，包括 Model Hardware Standard—— 一款允许 AI 智能体操作显微镜或机械臂等物理产品的工具。当晚，Anthropic 在旧金山一家牛排馆内举办晚宴，席间讨论的主要是 Anthropic CEO 达里奥 · 阿莫代伊的安全警告及其引发的舆论。许多投资 Anthropic 的硅谷机构表示，阿莫代伊推动全行业安全标准的时机是合理的，并不担心这会削弱 IPO 的市场兴趣。一位投资者表示，一旦 Anthropic 成为上市公司，将面临股东更严格的审查，提前在安全风险问题上表明立场，可能有助于公司在未来出现问题时的应对。与此同时，Anthropic 最大竞争对手 OpenAI 已明确表示不会在 2027 年之前上市，目前正处于新一轮融资的早期讨论阶段。若融资完成，OpenAI 估值将超过 1.2 万亿美元。上次融资时，OpenAI 从投资者处筹集了超过 1200 亿美元。部分 Anthropic 投资者表示，如果 OpenAI 在 Anthropic 上市前筹集到类似规模的资金，可能会削弱市场对 Anthropic 的需求。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/004/369.htm", "publishedAt": "2026-09-19T00:07:04+00:00"}, {"title": "微软高管内部表述曝光，称训练 AI 是“人类历史上最大规模劳动窃取”", "summary": "IT之家 9 月 19 日消息，科技媒体 Tom's Hardware 昨日（9 月 18 日）发布博文，报道称在起诉 OpenAI 和微软的版权纠纷案中，原告《纽约时报》已申请简易判决，并提交新的法律摘要，进一步披露两家公司（微软和 OpenAI）内部材料。这起版权纠纷可以追溯到 2023 年年底，《纽约时报》指控微软和 OpenAI 两家公司侵犯其数千篇新闻报道的版权，未经许可使用其内容来训练 ChatGPT 和 Copilot 等产品。《纽约时报》法律团队近日向法院申请简易判决，并同时递交法律摘要，并援引来自两家被告的声明和文件。IT之家注：简易判决是美国民事诉讼中的一种裁决程序。申请方需主张案件不存在影响裁判结果的重大事实争议，因此无需完整庭审即可依据现有证据裁定。法院可以批准、驳回或部分批准申请；获批不代表所有关联争议均已结束。这份简报引用了微软应用科学总监布伦特 · 赫克特 (Brent Hecht) 于 2023 年 1 月撰写的一份内部备忘录。据称，赫克特在备忘录中表示：“全球数百万人很快就会认为，大型模型‘吞噬’他们所有的劳动成果是一种前所未有的惊人盗窃”，他还称之为“人类历史上规模最大的劳动成果盗窃”。另一份微软文件也指出，“几乎没有人希望自己创作的内容被以这种方式使用，他们也没有因此获得任何补偿。”随着 ChatGPT 在 2023 年迅速走红，这家软件巨头自身的数据显示，与 Bing 搜索相比，Copilot 导致《纽约时报》的点击率最高下降 93%。应用科学总监的另一份备忘录称之为“恶性循环”，并表示这将“同时损害我们模型的性能和整个互联网”。《纽约时报》的简报引用了 Hecht 在这份文件中的话：“最终产品威胁到其关键供应商的经济基础，这种情况极为罕见，但这正是我们 LLM 业务在‘内容供应链’方面造成的局面。”OpenAI ChatGPT 负责人尼克 · 特利在内部沟通中表示，AI 聊天机器人对出版商构成“生存威胁”，因为它们“在很大程度上是替代性的”，而且随着技术的进步，替代性会越来越强。另一位 OpenAI 工程师则表示，“无论我们如何醒目地展示链接，用户都不会点击。”另一位 OpenAI 研究员尼克 · 莱德向公司总裁格雷格 · 布罗克曼透露了一个“绕过《纽约时报》付费墙的技巧”，布罗克曼回应道：“啊，不错。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/004/356.htm", "publishedAt": "2026-09-18T23:13:06+00:00"}, {"title": "谷歌首次公开 Gemini 越狱事件：在测试中自主入侵三家真实公司且自行终止，已通知涉事企业", "summary": "IT之家 9 月 19 日消息，据《华尔街日报》今日报道，谷歌确认其 Gemini 模型在今年 5 月的一次安全测试中曾自主入侵过外部真实企业，系 Gemini 首次已知的 AI 越狱事件。谷歌表示，该事件发生在测试公司 Irregular 开展的一次“捕获旗帜”演练中，目的是评估 Gemini 的网络安全能力。测试环境本应完全隔离，但却意外开放了互联网访问权限。IT之家注：“捕获旗帜”（Capture the Flag）是一种网络安全竞赛形式，参与者在模拟环境中寻找并获取隐藏的“旗帜”以证明成功入侵。在谷歌披露其中一起事件中，Gemini 通过猜对密码获得了对受保护系统的访问权限。在另外两起事件中，Gemini 在公开代码仓库中找到了凭证，进而访问了受保护系统。谷歌称，在每起事件中，模型在确认所访问的是真实公司系统而非模拟环境后，均自行终止了入侵行为。谷歌未披露被入侵公司的名称，但表示三家公司均已收到通知。Irregular 于 7 月底将此事告知谷歌。谷歌和 Irregular 均表示，这一通知是在 OpenAI 的 AI 智能体入侵 AI 软件公司 Hugging Face 事件被发现之后发出的。谷歌认为，由于模型未对相关公司造成损害，且每次都被 Gemini 自行终止，因此无需公开披露，直至《华尔街日报》进行问询才得以公开。谷歌将此事类比为“漏洞赏金”计划，即黑客发现并报告安全漏洞后可获得奖励。AI 安全初创公司 Corridor 首席执行官、白帽黑客杰克 · 凯布尔对此提出异议。他认为谷歌的解释聚焦于事件严重程度，而真正的问题在于 AI 智能体意外入侵了另一家公司的系统。凯布尔表示：“感觉他们试图躲在漏洞披露领域已有的规范后面，但这是一个非常不同的问题。问题是，模型正在超出其应有的行为边界，实施实际网络攻击，我认为公众有权知道这些。”谷歌表示，Gemini 入侵事件源于身份混淆。测试中设定了一家虚构公司，但该虚构公司与一家真实公司同名。模型在搜索该名称时找到了真实公司的网站。谷歌称此事不构成模型异常行为，因为其安全措施帮助模型停止了行为。谷歌还表示已通知联邦当局。谷歌未披露涉事的具体 Gemini 模型版本。Irregular 发言人表示，所有相关实验室已于 7 月底收到通知，受影响实体已在调查过程中被联系。Irregular 采取了立即行动，其端所有已知问题已在数周前修复和解决。对新一代模型网络安全能力的担忧自 7 月 Hugging Face 入侵事件被发现后持续升温。上周，前 OpenAI 研究员雅各布 · 考克森从 Anthropic 离职，使相关担忧进一步进入主流视野。上周末，Anthropic、OpenAI、谷歌和 SpaceX 的领导人均同意需要放缓 AI 进展速度，但各公司均未说明具体如何实现。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/004/355.htm", "publishedAt": "2026-09-18T23:11:25+00:00"}, {"title": "Claude Code 宣布添加支持“AI 通用说明书”AGENTS.md", "summary": "IT之家 9 月 19 日消息，Anthropic 公司 Claude Code 团队工程师萨里克 · 希希帕尔（Thariq Shihipar，网名 @trq212）在 X 平台发布推文，宣布在今天（9 月 19 日）发布的 2.1.277 版本 Claude Code 中添加支持 AGENTS.md。IT之家翻译其推文内容如下：从今天发布的 2.1.277 版本开始，如果文件夹中没有 CLAUDE.md，Claude 将检查并使用 AGENTS.md。用户可以在 /config 中切换此行为。CLAUDE.md 是 Claude Code 特有的工作流、MCP、Sub-agent 或命令配置；而 AGENTS.md 的目标是让不同工具共享项目级基础规则，可视为所有 AI 都应该遵守的通用规则。对于普通用户或者开发者而言，AGENTS.md 可以降低工具切换成本和配置成本，而 Claude Code 本次支持，不管用户使用哪个 AI 编程工具，项目都可以有一份统一的“给 AI 看的使用说明”，换工具、接手项目和参与开源时，不必重新配置。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/004/351.htm", "publishedAt": "2026-09-18T22:45:05+00:00"}, {"title": "Grab 智能体框架 LLM-Kit 加速 AI 智能体生产部署", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/AFC40lL0yaxVCDvBRFOK?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-18T18:00:00+00:00"}, {"title": "美国 AI 巨头提议开发减速，欧洲同行和政界并不认同", "summary": "IT之家 9 月 18 日消息，据路透社今天（18 日）报道，此前，阿莫迪、奥尔特曼和马斯克先后发出警告，能力不断增强的 AI 系统可能带来风险，故有必要控制其发展节奏，但欧洲企业和官员对此表现出明显怀疑。法国初创企业 Mistral 在声明中指出，这些风险早在几个月前就已十分明确了。“一些现有市场参与者开始利用这一时机巩固市场地位，推动制定更有利于自己、而不利于竞争对手的监管规定。”欧洲拥有的前沿 AI 开发商数量有限，成立仅 3 年的 Mistral 被视为欧洲自主打造前沿 AI 模型、挑战中美主导地位的最大希望。现阶段，欧洲高度依赖 OpenAI、Anthropic 和微软开发的模型，因此不少企业和业内人士对继续依赖美国科技公司保持警惕。瑞士隐私软件企业 Proton COO 拉斐尔 · 奥凡在巴黎一场科技活动上直言：“我认为，这完全是在为自己谋利。他们只是想继续维持外界对其服务的依赖。”德国 AI 初创企业 Black Forest Labs 公共政策负责人本 · 布鲁克斯警告，如果依据人为设定的门槛，强行拉开大型 AI 实验室和新进入者之间的差距，“将会打击前沿或接近前沿领域的开放创新”。不过，同样身为美国企业的 Hugging Face CEO 克莱芒 · 德朗格表态反对为 AI 开发踩刹车。“现在不是放慢速度的时候，而是应该加速。”同时，他也赞同阿莫迪提出的另一项建议，即在 AI 企业内部设置“独立评估人员”。德国达姆施塔特工业大学 AI 教授克里斯蒂安 · 克斯廷认为，阿莫迪提出的方案属于“监管俘获”。“如果少数几家大型企业自行决定什么属于‘危险’，自己挑选检查人员，再要求获得竞争法豁免，那就不再是真正的监管。”IT之家从报道中获悉，欧洲政策制定者和行业团体也表达了类似担忧。当地时间 16 日，欧盟委员会主席乌尔苏拉 · 冯德莱恩指出，欧盟针对 AI 使用制定的标志性法规，使欧洲有能力影响全球如何应对 AI 风险。当地时间 17 日，英国国王查尔斯三世则在苏格兰举行峰会，与科技和 AI 行业领袖讨论这些问题。法国财政部长罗兰 · 莱斯屈尔直言：“让所有落在他们后面的人都放慢速度，好让他们继续保持第一，我当然看得出这里面的自身利益。”德国数字事务部认为，考虑到欧洲争取数字主权的需求，停止 AI 发展并不现实。德国 AI 行业协会负责人丹尼尔 · 阿布也主张，欧洲眼下更应该集中精力缩小技术差距。“对欧洲企业而言，这场争论没有意义。我们首先需要弥补技术上的落后。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/004/334.htm", "publishedAt": "2026-09-18T14:11:09+00:00"}, {"title": "千寻智能联合创始人高阳：人形机器人最快明年就能“听懂人话”，真正“帮人做事”仍需时日", "summary": "IT之家 9 月 18 日消息，据路透社今天（18 日）晚间报道，清华大学机器人学助理教授、千寻智能联合创始人兼首席科学家高阳预计，最快从明年开始，人形机器人就能听懂口头指令并完成大多数通用任务，但真正进入家庭、承担实用工作仍需时日。中国人形机器人的硬件能力近年快速提升，冲刺、跳舞甚至按指令完成后空翻都已不成问题。机器人企业的竞争重心也随之转向软件，目标是提高机器人的智能水平，让机器人能够承担更多具备实际经济价值的任务，这一领域通常被称为具身智能。高阳指出，“大脑”确实是整个机器人技术栈中最薄弱的一环。“我们预计到 2027 年年中达到‘GPT-3.0’级的里程碑。届时，你可以直接用自然语言与机器人交流，它会执行一系列合理的物理动作，尝试完成任务。”报道指出，整个机器人行业都在等待自己的“ChatGPT 时刻”：足以把前沿技术变成面向广大客户的实用产品的软件突破。OpenAI 在 2022 年推出 ChatGPT 后，生成式 AI 迅速进入大众市场，同时证明了商业化潜力。IT之家从报道中获悉，为了训练机器人，千寻智能在全国安排约 1000 名合同人员收集真实世界数据。目前，千寻智能的机器人在结构化客厅环境中完成简单任务的成功率达到 90%。高阳预计：“未来一两年将是工业应用的初始窗口。两年后，我们会看到机器人进入商业服务场景，执行较简单的任务。相比工业和商业服务场景，进入家庭要困难得多。…… 我们成立时，机器人只能做好倒水、叠一件衣服这类单独任务。今天，机器人可以在大范围空间内行动，并连续完成复杂的工作流程。”不过，旋开瓶盖等精细动作，以及处理此前没有遇到过的任务，依然是机器人需要攻克的难题。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/004/327.htm", "publishedAt": "2026-09-18T13:16:32+00:00"}, {"title": "全面追赶 OpenAI，消息称 Anthropic 计划在今年年底前拥有约 5 吉瓦可用算力、明年年底翻倍", "summary": "IT之家 9 月 18 日消息，在争夺顶尖模型性能的较量中，OpenAI 与 Anthropic 的竞争已进入白热化阶段。而这场较量的核心，正是训练与部署这些模型不可或缺的基础设施 —— 算力。据纽约时报消息，过去几年里，OpenAI 在可用算力规模上始终占据领跑地位。据知情人士透露，截至去年，Anthropic 在可用算力储备上仍处于下风，其规模约为 1.5 吉瓦（GW），而 OpenAI 则已达到约 2 吉瓦。消息称 Anthropic 已经制定了全面的追赶计划。多位知情人士表示，该 AI 实验室已告知投资者，计划在今年年底前储备约 5 吉瓦规模的可用算力，并预计到明年年底将这一容量再度翻倍。而据掌握 OpenAI 内部预估数据的人士称，这一节奏已与 OpenAI 的扩容路径大体持平 —— 后者同样计划在今年达到约 5 吉瓦的算力规模，并在明年拓展至约 10 吉瓦。IT之家注意到，在巨额算力支出的态度上，Anthropic 也一改此前的审慎立场。Anthropic 首席执行官达里奥 · 阿莫迪（Dario Amodei）去年曾暗讽未具名的竞争对手：“我认为业内某些参与者行事过于激进、不计后果，把风险敞口拉得太满了。我对此深感忧虑。”这番言论被广泛视为在含蓄敲打 OpenAI，后者当时正因挥金如土的算力开销而备受舆论审视。相关阅读：《消息称 Anthropic 和 OpenAI 正寻求规模较小的数据中心交易，争夺 AI 算力部署能力》《距离 AI 造 AI 还有多远？Anthropic Claude 已主导 26% 内部 AI 研发工作》《消息称 Anthropic 算力布局首度落子澳大利亚，将租赁 2.16GW 数据中心园区》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/004/322.htm", "publishedAt": "2026-09-18T12:57:44+00:00"}, {"title": "优步全球范围裁员 10%，被裁员工称 AI 已大举渗透日常工作", "summary": "IT之家 9 月 18 日消息，据《商业内幕》今天（18 日）晚间报道，在优步（Uber），AI 已经渗透到员工工作的许多环节，从回答 Slack 里的内部问题，到替乘客行程中联系客服时收到的消息撰写回复。6 名近期遭裁员的员工透露，过去几个月，AI 在工作中的使用范围明显扩大，其中一些人甚至会通过提示词让 AI 完成相当一部分任务。据IT之家了解，本月早些时候，优步裁员约 3300 人。CEO 达拉 · 科斯罗萨西当时称，裁员主要为了压缩管理层级，并减少经理仅管理 1 至 2 名直属下属的团队数量。他在宣布裁员的备忘录中，没有把 AI 列为原因。根据多名受访员工的说法，优步同时在不断扩大 AI 的应用范围。一名员工透露，遭裁员前几周，他使用的一款 AI 工具把完成工作的时间压缩到原来的五分之一。“对我们很多人来说，AI 确实就像埋在桥下的炸药。”一名来自优步广告业务的被裁员工称，经理越来越频繁地要求员工使用 Gemini 和 ChatGPT 准备客户会议。“我们被要求一直使用 AI，这是日常工作的一部分。”优步去年介绍，公司在许多内部 Slack 频道部署了名为 Genie 的 AI 聊天机器人，可以依据内部文档快速回答员工问题，并附上准确出处。这名员工称，过去许多需要经理提供的指导也由 Genie 承担。“如果其他人知道答案，他们也会回复，但我们有什么问题时，通常都是 AI 在回答。”另一名从事客服的员工，则使用 Glean 处理优步司机和乘客的求助请求。这款工具同样利用公司内部文档训练。按照原本用途，Glean 等工具只是辅助查找信息，在实际使用中，客服人员经常直接把生成的答案复制粘贴到（同用户的）对话中。“这种做法并不是规定的使用方式，但当我们的知识库无法正常工作时，这是一个可以使用的工具。”其他员工则遇到了相反的要求，经理会提醒他们不要让 AI 直接代替自己完成工作。优步生成式 AI 团队前评估专家 Kori X 说：“我们也收到过这样的指导：‘不要用 ChatGPT 替你完成工作。’我觉得他们也在纠结，如果这些人只是使用 ChatGPT，为什么还要花钱雇他们？”另一名被裁员工则没有感受到公司要求使用 AI 的压力。在这名员工看来，与其他科技公司相比，优步引入 AI 时相对克制，不仅安排专门的答疑时间，向员工说明 AI 能做什么和不能做什么，也限制在对外沟通中使用 AI 生成图片。优步此前称，公司曾把驻场部署工程师编入“智能体小组”，寻找 AI 在财务、人力资源等部门的应用场景。这名员工透露，今年上半年，优步开始停止或削减 Claude 等服务的使用额度。同期，优步高管称公司花光了全年的 Claude 预算，却没有看到与 AI 工具投入相匹配的生产力提升。相关阅读：《优步全球裁员 10%：为网约车、Robotaxi 业务省钱，3300 岗位受波及》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/004/320.htm", "publishedAt": "2026-09-18T12:51:11+00:00"}, {"title": "北京发布“词元经济十条”：高标准建设词元工厂，推动关键核心技术攻关", "summary": "IT之家 9 月 18 日消息，北京市经济和信息化局今日宣布，北京市“词元经济十条”正式发布。为贯彻落实《国务院关于深入实施“人工智能＋”行动的意见》（国发〔2025〕11 号），率先培育智能经济新形态，以词元（Token）为抓手，发展词元经济新增量，制定《北京市加快词元经济发展的行动方案（2026—2028 年）》（IT之家注：以下简称《行动方案》）。《行动方案》提出，高标准建设词元工厂。制定北京市词元工厂分级评价标准，覆盖模型适配数量、词元吞吐速度、首字延迟、缓存命中率、电能利用效率（PUE）等核心技术指标，优化土地资源、能耗指标、通信网络等要素保障，对具有行业引领力的词元工厂给予支持。推动关键核心技术攻关。加快基础模型技术迭代，提升模型智能上限水平。推动模型与芯片适配调优，支持推理专用芯片、模型轻量化、边缘端部署等技术攻关，高水平建设、调用智算资源，全面提升词元生产能力。建立词元质量评测体系。支持软件和信息服务业企业与第三方评测机构合作，探索建设词元测试平台，通过模型智能路由、评测咨询等增值服务形成可持续运营模式。建立客观公正的词元性能与质量评测标准，为词元定价、模型智能路由等提供参考依据。打造词元分发平台。支持软件和信息服务业企业建设对标国际一流的词元分发平台，提升跨模型、跨模态、跨区域的平台接入能力，为开发者提供统一接口、模型聚合、词元计量与结算服务。加快培育产业引领聚集作用突出、上下游辐射带动性强的龙头企业。推动词元分发平台纳入新型基础设施布局，形成面向智能经济的高效服务入口。培育通用与垂直领域智能体。支持企业打造面向个人用户和机构客户的通用智能体产品。鼓励互联网平台企业、智能体服务商等经营主体加强协同合作，推动智能体在信息咨询、商业服务、生活服务等领域规模化落地。聚焦工业制造、科学研究、生物医药、教育教学等重点领域，开放智能体应用场景，带动形成一批代表性强的标杆应用项目，推广行业词元应用服务。构建智能体核心软件生态。实施智能体驾驭提升工程，攻关安全可控技术栈，提升智能体任务执行全过程的安全保障能力；突破记忆管理、安全权限管控、组件间高效通信等关键软件技术，培育一批智能体操作系统及新型软件工具企业，赋能软件和信息服务 om/2026/09/491596.html", "publishedAt": "2026-09-17T11:56:13+00:00"}, {"title": "用 Seedance 2.5 拍《沙丘 3》，我们替你把 AI 短片的坑全都踩过了", "summary": "﻿ 看到这条视频，你会不会以为《沙丘 3》提前泄露了。 这其实是一部由我们团队的两位同事，花 12 天时间，结 […]#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1680580?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-09-17T06:45:13+00:00"}]}, {"label": "论文研究", "items": [{"title": "AMD 霄龙 Venice 官方跑分首发出炉：256 核 EPYC 9996 性能达竞品 2 倍以上，代际提升 78%", "summary": "IT之家 9 月 19 日消息，当地时间周五，AMD 官方公布了下一代 EPYC“Venice”服务器处理器的大量细节，并将其与英伟达 Vera 系列处理器进行了对比。AMD 表示，当下数据中心性能不再仅仅取决于 CPU 速度来定义。AMD EPYC 9006 系列服务器 CPU 的设计充分考虑了这些系统级限制。该系列服务器 CPU 基于“Zen 6”+“Zen 6c”架构，最多可集成 256 个核心 512 个线程、16 通道 DDR5 内存、符合 JEDEC 标准的 MRDIMM 支持（最高可达 12,800 MT/s）、PCIe Gen 6、CXL 3.1、AVX-512、高级安全性和 RAS（可靠性、可用性和可维护性）功能，以及全新的电源管理技术。▲ 各代 EPYC 处理器吞吐量改进AMD 称，256 核心的 EPYC 9996 在 SPEC CPU 2026 Integer Rate 测试中的整体性能可达到英特尔至强 6980P（128 核）的 2.37 倍，以及英伟达 Vera（88 核）的 2.24 倍。相比上一代产品，EPYC 9996 的性能提升同样明显。AMD 数据显示，其性能约比上一代 192 核的 EPYC 9965 高出 78%。AMD 在今年 7 月发布 EPYC“Venice”相关信息时曾表示，其 96 核的一款型号在 SPEC CPU 2026 Integer Rate 测试中，性能约比英伟达 88 核的 Vera 高出 20%。在 SPEC CPU 2026 Integer Rate 吞吐量测试中，AMD 采用了今年 7 月使用 GCC 15.2 获得的数据。该测试会在同一处理器上同时运行多个应用程序副本，通常按照每个线程运行一个副本的方式进行。AMD 还对 SPEC CPU 2026 Integer Rate 的子测试项目进行了细分对比。不过，在与 Vera 进行对比时，AMD 使用的是 96 核型号而非 256 核型号。AMD 此前公布 SPEC 测试数据时曾表示，96 核和 256 核版本均采用 600W 功耗配置，而 AMD 这款 96 核心高频 Venice 处理器的最高功耗为 500W。需要注意的是，AMD 在此次白皮书中的不同测试采用了不同配置。尤其是在 Vera 对比项目中，AMD 部分采用了不同来源的数据，并使用了不同版本的 GNU 编译器集合（GCC）。AMD 此次使用 GCC 16.1，而英伟达 Vera 白皮书中的对应数据使用 GCC 15.2。GCC 不同大版本之间可能产生性能差异，因此直接比较两组结果并不能完全排除编译器因素的影响。此外，AMD 还引用了 Phoronix 此前针对 Vera 进行的受控测试数据，对比了 Stream 内存带宽测试结果。AMD 同样采用 96 核的 EPYC 9996，并将其设为 600W 功耗基准。在这一测试中，AMD 称 96 核心 Venice 的整体性能领先 Vera 约 18%，按核心计算的性能领先约 8%。此前 Vera 在 Phoronix 公布的 Stream 测试中已经表现出较高的内存带宽水平，因此此次对比具有一定参考价值。除了 Vera 之外，AMD 还公布了 Venice 在云计算工作负载中的测试数据，涵盖数据库、Java 和密码学等场景。AMD 自行完成了这些测试，其中 Graviton5 的数据来自 AWS 云实例。在 HPC 工作负载方面，AMD 公布的结果显示 Venice 进一步扩大了相对于英特尔 Granite Rapids-AP 旗舰产品的性能差距。英特尔下一代数据中心处理器 Diamond Rapids 预计于 2027 年推出。AMD 同时展示了所谓“Agentic AI 工作负载性能”数据，实际使用了 NGINX、TPCx-AI Kit、FAISS、TPC-H、TPC-C 以及多角色智能体回放等测试。其中，TPC-H 和 TPC-C 部分工作负载由 AMD 根据相关基准测试自行构建，因此这些结果不能与公开发布的标准测试成绩直接比较。从服务器部署角度看，这些峰值性能数据并不能完整反映实际应用表现。服务器采购还涉及功耗、软件环境、编译器、工作负载类型以及系统规模等多个因素，实际性能也可能因软件及构建方式不同而出现明显变化。IT之家提醒：此次数据中，AMD 与英伟达之间的对比存在测试配置和编译器版本差异，因此不宜将各项结果简单视为完全一致条件下的横向测试。相比之下，EPYC 9996 相对于上一代 EPYC 9965 的代际性能提升，是此次公布数据中较为客观的一组比较。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/004/364.htm", "publishedAt": "2026-09-18T23:50:23+00:00"}, {"title": "中老跨境数字支付互联互通正式启动，数字人民币可在老挝扫码支付", "summary": "IT之家 9 月 19 日消息，2026 年 9 月 18 日，中国人民银行与老挝人民民主共和国银行在广西南宁联合举办中老跨境数字支付互联互通启动会。中国人民银行副行长陆磊、老挝人民民主共和国银行副行长苏里萨克 · 萨姆努翁出席并致辞。中老两国央行相关部门负责人，商业银行、参与企业有关负责人参加会议。此次启动是落实两国领导人共识、深化双边金融合作的重要举措，也是双方央行行长 2026 年 6 月签署的《关于加强金融创新、数字支付和法定数字货币合作的谅解备忘录》框架下达成的阶段性成果。条码支付互通方面，数字人民币国际运营中心建设运营的数币达跨境结算综合服务平台（CBETS）与老挝国家支付网络（LAPNet）完成跨境系统连接。该连接实现数字人民币与老挝当地条码支付跨境互联互通。2025 年底已完成真实交易验证，并实现“内包外用”功能。中国居民可持数字人民币业务运营机构开立的数字人民币钱包（IT之家注：数字人民币是中国人民银行发行的数字形式的法定货币）在老挝本地商业银行收单商户扫码支付。目前，中老双方正共同推进功能升级和场景拓展，以进一步便利两国人员往来和文旅消费。经贸结算互通方面，部分老挝当地银行已接入 CBETS，并开通 CBETS 新型贸易结算和投融资服务（数币达 · 励付）。该服务支持 7×24 小时数字化、智能化、便利化的闭环跨境支付结算和投融资业务，助力两国经贸往来。下一步，中国人民银行将与老挝人民民主共和国银行加强政策沟通与监管协调，保障中老跨境数字支付互联互通平稳有序运行。双方将指导相关参与机构持续优化客户体验，有序扩大应用范围，服务高水平对外开放。公开报道显示，中老跨境数字支付合作此前已有基础。2023 年 10 月，银联国际与老挝国家支付网络 LAPNet 签署合作备忘录，推动老挝国家统一二维码标准 LaoQR 兼容银联二维码标准。2024 年 12 月，银联国际与 LAPNet 宣布二维码网络互联互通合作落地。中国消费者可使用云闪付 App、接入云闪付网络支付平台的境内钱包等，在老挝二维码商户完成支付。2025 年 12 月，中国银行披露完成两国首笔数字人民币钱包跨境二维码消费支付业务。中国游客可在老挝打开数字人民币 App 扫描当地商户二维码，按实时汇率完成付款。中国银行万象分行同时首批接入中国人民银行数字人民币跨境数字支付平台，并提供实时汇率报价和清算服务。2026 年 6 月，数字人民币跨境结算综合服务平台“数币达”（CBETS）启动品牌化运作。中国人民银行数字货币研究所所长穆长春介绍，与老挝 LAPNet 的合作采用点对点双边直连模式。跨境数字支付平台已与 LAPNet 实现互联互通，中国银行万象分行成为首批“数币达”直接参与机构之一。从已落地场景看，中国游客到老挝消费无需提前兑换老挝基普，可直接使用数字人民币 App 扫码支付。老挝商户可沿用既有二维码受理方式。此前银联与 LAPNet 的二维码网络互联已经落地，并继续推进老挝用户来华扫码支付。此次启动会正式以“中老跨境数字支付互联互通”为名启动合作。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/004/350.htm", "publishedAt": "2026-09-18T22:42:53+00:00"}, {"title": "“AI 教父”辛顿参与联署公开信：科技巨头应保证第三方评估人员工作无干预、受保护", "summary": "IT之家 9 月 18 日消息，据《商业内幕》今天（18 日）晚间报道，由多家监督组织组成的 AI 评估机构论坛发布了一封公开信，为第三方风险评估划出一套最低条件，认为 Anthropic 和 OpenAI 等 AI 实验室只有满足特定的要求，才能与外部评估机构开展更有效的合作。公开信获得数十名 AI 领域人士联署，包括“AI 教父”计算机科学先驱杰弗里 · 辛顿和斯图尔特 · 罗素。本周，网络上对 AI 风险的担忧迅速升温。Anthropic CEO 达里奥 · 阿莫迪和 OpenAI CEO 萨姆 · 奥尔特曼此前都承诺向第三方评估人员开放公司内部资源并评估 AI 风险，获得与员工同等级别的信息访问权限。AI 评估机构论坛的公开信正是对此作出回应。“要具备公信力，驻场第三方评估人员必须保持科学客观性、透明度和独立性，并得到充分保护，免受被评估企业干预。”IT之家获悉，论坛认为，第三方评估人员不仅应获准公开透明地开展工作，还应能够直接与公司董事会及其他拥有特殊监督权限的机构沟通，不受企业过滤或限制，并有权公开发布评估结果。这些评估人员还应受到保护，避免因评估工作遭到 AI 实验室报复，同时获得与企业内部评估人员相同的系统、数据、工具和实体场所访问权限。公开信还主张，每家 AI 实验室都应引入观点和专业背景不同的评估人员，以覆盖生物科学风险、AI 失控风险等多种风险领域。本周早些时候，其他科技行业领袖也加入了这场讨论。微软 CEO 萨提亚 · 纳德拉称，公司欢迎让第三方评估人员直接进驻 AI 企业开展评估的构想。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/004/330.htm", "publishedAt": "2026-09-18T13:39:52+00:00"}, {"title": "6.5亿美元押注“AI研究AI”：一群顶级研究员想造出“自我进化”的超级智能", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/da8jMox7ikdNmD2vYyTm?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-18T12:00:00+00:00"}, {"title": "华为发布“Peerium 计算架构”，让百万处理器成为一台计算机", "summary": "华为发布AI时代的全新计算架构 – Peerium计算架构。该架构能实现百万级处理器成为一台计算机，以满足不断发展的AI算力需求。 Peerium计算架构是基于嵌套并行，统一内存寻址、平等互联实现百万级处理器强扩展的计算架构。Peerium计算架构突破了图灵范式，提出了Nested BSP，突破了冯·诺依曼单机架构，颠覆了长久以来的主...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502587/huawei-new-computing-architecture-peerium", "publishedAt": "2026-09-18T08:41:45+00:00"}, {"title": "AGI最难一战，竟在医院！中国AI登上Science，医生不怕失业还催着上线", "summary": "用通用AI去啃最硬的骨头，这条路走得通", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/491875.html", "publishedAt": "2026-09-18T06:11:06+00:00"}, {"title": "iPhone 18 Pro 系列正式开售，新 AI 功能「自相矛盾」", "summary": "未来，摄像头要抢在任何算法介入之前，证明「以上像素来自我」#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1680844?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-09-18T04:14:53+00:00"}, {"title": "Anthropic 提出三个度量指标，想量化“AI 发展到底有多快”", "summary": "\"我们芯片多、我们跑得快\"——这种话听多了就容易变成营销。Anthropic 这次换了个思路：与其互相吹，不如直接把自家实验室的内部数据拿出来，给\"AI 发展速度\"这件事定一套可以测量的指标。 它发了三份方法论性质的度量。第一份叫\"AI 主导研发（AI-led R&D）\"，借用 Epoch AI 的自动化分级（AL0 到 AL5，AL3 是 AI 协作、...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502569/anthropic-measuring-pace-of-ai-development", "publishedAt": "2026-09-18T03:45:58+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "从“会回答”到“会办事”，vivo如何解AI手机这道题？", "summary": "构建个体专属AI助理", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/491649.html", "publishedAt": "2026-09-17T12:03:24+00:00"}]}]};

const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
