文介绍，相关文件定位如下：plugin.json 文件标识插件及其目标 Agent 插件版本。skills/ 包含 Agent Skills，其格式由 Agent Skills 规范定义。mcp.json 描述了 stdio、Streamable HTTP 或传统 HTTP+SSE MCP 服务器。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/986/816.htm", "publishedAt": "2026-08-07T01:33:50+00:00"}, {"title": "AI 设计病毒问世：首次设计完整基因组，16 种新型噬菌体可杀死大肠杆菌", "summary": "IT之家 8 月 7 日消息，英国 BBC 今天（8 月 7 日）发布博文，报道称美国斯坦福大学研究人员使用 AI 技术，在实验室环境下设计出可复现、具备完整功能的全新病毒。研究人员表示，这是 AI 首次成功设计完整基因组，此次产出的 16 种新型病毒用于感染细菌，不会对人类构成威胁。在接受 BBC 采访时，斯坦福大学助理教授布莱恩 · 希（Brian Hie）表示，AI 此前已用于设计新型抗生素，不过从技术上衡量，从零开始设计可存活病毒难度更高。科研团队表示工作方式类似于 ChatGPT 等大语言模型，只不过大语言模型预测文本序列，而团队开发使用的 Evo1 和 Evo2 模型用于预测“生命语言”。在模型训练方面，科研团队表示相关数据来自病毒、细菌、植物和人类的遗传代码；团队随后通过微调（Fine-tuning）模型，让其设计产出噬菌体（bacteriophage，只感染特定细菌物种的病毒）IT之家注：在大语言模型中，是指使用任务特有的数据集，进一步训练经过预训练的大语言模型。预训练模型已经学习了很多一般信息，而微调有助于使它专精于特定领域。为验证 AI 设计是否有效，斯坦福研究人员挑选了 302 个最有潜力的 AI 设计，并在实验室合成。结果显示，其中 16 个设计能有效杀死大肠杆菌（E. coli）。开发新型噬菌体可能为抗生素耐药感染提供新治疗路径。报道指出，噬菌体疗法（phage therapy）被视为应对细菌感染上升趋势的潜在方案，尤其适用于无法用抗生素治疗的感染。这项突破也显示 AI 已具备设计自然界之外新生物系统的能力，Hie 认为，这项能力可能通过开发新药物和新疗法，大幅改善人类健康。此次研究中的噬菌体遗传代码长度约为 5,400 个碱基对（base pairs）。相比之下，最小活细胞基因组约为 500,000 个碱基对，人类基因组为 3,000,000,000 个碱基对。Hie 表示，尝试设计一些简单生物“可能需要大量工作，但并非不可能”。他还称，团队“确实有兴趣朝这个方向努力”。西班牙庞培法布拉大学合成生物学实验室教授 Marc Güell 表示，这项研究是“非常重要的转折点”，因为“历史上首次，人类开始在计算机上设计生物学”。他称，这让人们可以想象更多应对人类重大挑战的可能性，包括开发用于治疗疾病的噬菌体、治疗遗传疾病的酶，以及可用于免疫疗法的抗体。参考Generative design of bacteriophages with genome language models", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/986/809.htm", "publishedAt": "2026-08-07T01:18:50+00:00"}, {"title": "Show me《指环王》！卡帕西强推大模型评测新基准", "summary": "指环王成为大模型新基准", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/467663.html", "publishedAt": "2026-08-07T01:15:42+00:00"}, {"title": "DeepSeek 参与宇树科技上市配售，金额约 1.41 亿元", "summary": "IT之家 8 月 7 日消息，宇树科技 8 月 6 日晚发布公告称，公司首次公开发行股票并在科创板上市，发行价格为 150.80 元 / 股。本次发行数量为 4044.6434 万股，占发行后总股本 10%。根据发行公告中给出的最终战略配售数量结果，DeepSeek 开发商杭州深度求索人工智能基础技术研究有限公司出现在战略配售名单中，获配股数为 93.339 万股，金额约 1.41 亿元。宇树科技在公告中表示，在遴选大型企业或其下属企业作为战略配售投资者时，重点考量其与发行人业务发展的协同效应，若引入大模型相关龙头企业，可聚焦 AI 大模型与具身智能相关技术研发与产品开发，旨在整合双方技术优势，提升具身智能机器人对复杂场景的理解能力、泛化能力，共同推动通用人工智能的科技发展。IT之家注意到，杭州深度求索人工智能基础技术研究有限公司承诺，获得本次配售的股票限售期为自发行人首次公开发行并上市之日起 36 个月。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/986/801.htm", "publishedAt": "2026-08-07T00:58:24+00:00"}, {"title": "冲刺全球首个100万小时具身数据！三家国产公司，联手了", "summary": "采集、仿真、训练和评测，闭环了", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/467486.html", "publishedAt": "2026-08-07T00:55:47+00:00"}, {"title": "DeepSeek豪掷1.4亿护航宇树IPO，杭州绝代双骄战略合体", "summary": "此后模型、算力、数据中心都在合作范围内", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/467487.html", "publishedAt": "2026-08-07T00:25:07+00:00"}, {"title": "AMD 宣布计划收购 Taalas 公司，补强 AI 推理芯片路线图", "summary": "IT之家 8 月 7 日消息，AMD 今天（8 月 7 日）发布公告，宣布计划收购 Taalas 芯片初创公司。Taalas 面向 AI 推理设计加速器，针对单一 AI 模型定制芯片，主要牺牲通用性，换取更低成本和更高输出速度。在技术方面，Taalas 公司目前展示的 AI 推理芯片基于 Meta 公司的 Llama 3.1 模型，采用台积电成熟（较旧）工艺打造，并在芯片本体上使用高速 SRAM。这种方案的优势在于推理速度更快，特定型号的输出速度比传统 GPU 快数千倍，且时成本更低，但是该芯片绑定某个 AI 模型，没有办法后续升级。Taalas 首席执行官 Ljubisa Bajic 在公司网站称，Taalas 已开发出“把任何 AI 模型转化为定制硅片的平台”。他还表示，收到此前未适配的模型后，仅需 2 个月就能把它落实到硬件上。在交易规模方面，AMD 在博文中并未披露相关信息。不过根据公开资料，自 2023 年成立以来，Taalas 已累计获得 2.19 亿美元（IT之家注：现汇率约合 14.81 亿元人民币）的风险投资。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/986/791.htm", "publishedAt": "2026-08-07T00:16:59+00:00"}, {"title": "GPT-4.5 以来训练的最大模型，曝 OpenAI 最快下周推出 Astra AI 模型", "summary": "IT之家 8 月 7 日消息，消息源 @synthwavedd 昨日（8 月 6 日）在 X 平台发布推文，爆料称 OpenAI 目标下周发布 Astra 模型，内部代号为 mewfour。消息源称该模型是 OpenAI 公司全新预训练模型，也是 OpenAI 自 GPT-4.5 以来训练的最大模型。IT之家曾于 8 月 1 日报道，Astra 的一个内部版本已经解出 10 个重要开放数学问题，若按 Sol API 的费率计算，寻找这些问题解决方案所需消耗的总词元 (tokens) 成本约为 2,000 美元（IT之家注：现汇率约合 13,524 元人民币）。在能力方面，Bleeping Computer 爆料称该模型可以组织和协同 AI 智能体，适合应对长周期、高难度任务，面向更强的推理和协作型工作流。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/986/789.htm", "publishedAt": "2026-08-07T00:03:25+00:00"}, {"title": "减少游戏卡顿：消息称英伟达研发 SSD 当额外显存技术", "summary": "IT之家 8 月 7 日消息，科技媒体 siliconangle 于 8 月 5 日发布博文，报道称英伟达正在研发新技术，未来可以让 SSD 固态硬盘充当额外显存，从而在游戏或者 AI 场景下改善运行表现。在美国拉斯维加斯举办的 2026 年黑帽网络安全大会（8 月 1 日 ~6 日）上，英伟达宣布开源 cuFile API 及其底层存储软件栈。IT之家注：cuFile API 是 NVIDIA GPUDirect Storage 技术中的接口组件，用于让应用访问 GPU 直连存储能力，目标是让存储数据在毫秒级抵达 GPU。而 GPUDirect Storage 是一种让存储设备与 GPU 直接传输数据的技术。传统路径需要先把数据读入主内存临时缓冲区，再复制到 GPU 内存；该技术旨在减少主内存中转，降低延迟并提升数据访问速度。cuFile 于 2021 年 7 月随 CUDA Toolkit 11.4 发布，该技术让本地分布式存储与 GPU 内存直接交换数据，绕过中央处理器与系统主内存，从而降低内存访问延迟。在数据路径上，cuFile 依托 DMA（直接内存访问），可将 NVMe（非易失性内存高速接口）硬盘等存储设备中的数据直接送入 GPU 内存。AI 推理主要依赖 GPU 与专用加速卡，若数据带宽受阻，分布式 GPU 阵列中的部分 GPU 会因等待数据而闲置，形成“GPU starvation”（GPU 饥饿）问题。英伟达称，毫秒级低延迟可帮助检索增强生成与智能体 AI 更快读取深层存储中的大型数据集。英伟达还发布 Storage-Next &nbsp;存储-下一个（下一代存储）行业倡议。该倡议覆盖 40 家领先存储与闪存厂商，包括 DataDirect Networks、铠侠（Kioxia）和美光科技（Micron Technology）。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/986/777.htm", "publishedAt": "2026-08-06T23:07:10+00:00"}, {"title": "OpenAI：ChatGPT 免费用户默认模型升级为 GPT-5.6 Luna，Plus 和 Pro 用户更新聊天界面 GPT-5.6 Sol", "summary": "IT之家 8 月 7 日消息，OpenAI 宣布对 ChatGPT 进行更新，在提升日常对话体验的同时，为免费用户开放更多功能权限。对于 Plus 和 Pro 用户，OpenAI 更新了聊天界面中的 GPT-5.6 Sol 模型，使其回答的事实准确性更高、重点更突出；新增的滑动条可以自由调节 ChatGPT 在生成每条回复时的思考深度。IT之家获悉，由于该版本的 GPT-5.6 Sol 专门针对日常对话进行了优化，它将仅限在 ChatGPT 的常规对话界面中使用。本次发布不会改变驱动 Work 和 Codex 功能的 GPT-5.6 Sol 版本。对于免费和 Go 用户，OpenAI 已将默认模型升级为 GPT-5.6 Luna。下周起，官方还将全面开放无限次文本聊天权限；对于需要深入思考的复杂问题，用户将可以通过全新的“思考”按钮，随时调用更高阶的推理能力（该功能受防滥用安全机制约束）。文件上传、图像生成及其他工具的使用限制依然适用。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/986/776.htm", "publishedAt": "2026-08-06T22:52:20+00:00"}, {"title": "古尔曼爆料 OpenAI 首款 AI 硬件：甜甜圈造型、冰球大小，先进语音交互等", "summary": "IT之家 8 月 7 日消息，彭博社的马克 · 古尔曼（Mark Gurman）今天（8 月 7 日）发布 Power On 实时通讯，爆料称 OpenAI 的首款 AI 硬件为冰球（Hockey Puck，约 115.8 立方厘米）大小，售价预估在 300 美元到 400 美元（IT之家注：现汇率约合 2,029 元到 2,705 元人民币）之间，有望 2027 年发布。IT之家注：该产品是 OpenAI 首款自家 AI 硬件，此前曾联名推出 AI 编程键盘。定位方面，这款 AI 硬件本质上是“没有显示屏的智能音箱”，面向家庭场景设计，用户可用单手在家中携带它移动，由 OpenAI 公司和前苹果设计师乔纳森 · 伊夫（Jony Ive）合作开发。外观方面，消息称这款 AI 硬件外形呈“甜甜圈形”，大小约等于冰球。IT之家查询公开资料，标准冰球（Hockey Puck）直径约为 7.62 厘米，体积约为 115.8 立方厘米。硬件方面，古尔曼透露这款硬件配备可移动部件，其中部分部件可自动移动，用于提示设备正在响应或与用户互动。设备还将配备灯光、摄像头系统和其他传感器。交互方式上，古尔曼透露该设备的运行机制，类似于手机端的 ChatGPT 语音模式，会使用更先进的模型，以支持更接近人类交流的互动。科技媒体 @PatentlyApple 制作的渲染图", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/986/775.htm", "publishedAt": "2026-08-06T22:47:09+00:00"}, {"title": "即日起，ChatGPT 可以调用 Adobe Photoshop、Lightroom 来修图、设计了", "summary": "IT之家 8 月 6 日消息，Adobe 去年底借助 OpenAI 的 Apps SDK，把 Photoshop、Acrobat 和 Adobe Express 带入 ChatGPT。时间来到今天（6 日），合作范围得到进一步扩大，新推出的 Adobe 插件几乎涵盖旗下整套创意软件。用户安装插件后，可以直接在 ChatGPT 中调用 Photoshop、Premiere、Acrobat、Lightroom、Illustrator 和 InDesign 等 70 多款 Adobe 工具。IT之家测试发现，用户可以打开 ChatGPT 设置菜单，在插件页面中添加 Adobe 插件。完成设置后，只需在提示词输入框中输入“@Adobe”和具体任务，便可调用相应工具。Adobe 称，插件与 OpenAI 的 Codex 编程应用及近期发布的 Work 套件配合使用时效果最佳，用户不登录 Creative Cloud 账户也能使用基本功能，登录后则可保存不同会话中的工作进度，并直接访问云端文件。此外，Creative Cloud 账户还可用于调用 Adobe Firefly 提供的生成式 AI 模型。Adobe 希望用户通过新插件完成照片编辑、营销视频制作和 PDF 生成等任务，同时也不会打算用 ChatGPT 取代现有专业软件。Adobe Firefly 及智能体 AI 副总裁福雷斯特 · 基表示：“我们希望，无论人们在哪里工作，都能使用 Adobe 的专业级创意和生产力工具。ChatGPT 中的 Adobe 插件并不是创意专业人士每天依赖的旗舰应用的替代品。需要精确操作和充分掌控创作过程时，旗舰应用仍能提供更深入的功能。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/986/769.htm", "publishedAt": "2026-08-06T15:28:31+00:00"}, {"title": "Claude Code之父：每半年清空一次claude.md、skills和hooks，模型自己会想办法", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/hUTEb0LSzFUTyib1AJ4W?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-06T14:07:53+00:00"}, {"title": "英伟达低调组建 AI 安全与网络工程团队，自称秉持“坚定信念”", "summary": "IT之家 8 月 6 日消息，据《商业内幕》今天（6 日）报道，英伟达正在低调组建一支新的 AI 安全与网络安全工程团队。上月底集中发布的一批招聘信息首次披露了团队的存在。英伟达计划招聘一名杰出工程师，出任新团队的创始技术负责人，其他岗位包括安全研究工程师、评估工程师和高级经理。团队将对尚未部署的 AI 智能体进行安全评估，还会开发利用 AI 自动修复软件漏洞的工具。报道认为，此举说明英伟达在押注开放权重模型和 AI 智能体的同时，也在把 AI 安全提升到更重要的位置。开放权重模型会公开决定模型如何运行的训练参数，但训练数据和源代码仍可保持封闭。英伟达在一则招聘信息中称，团队秉持一项“坚定信念”：开放权重模型、技术透明度和广泛的科学审查，是美国维持 AI 领先地位及增强网络安全防御能力的基础。据IT之家了解，近几个月来，英伟达越来越频繁地公开支持开放权重 AI 模型，立场与 OpenAI 和 Anthropic 等企业采用的封闭模型路线形成鲜明对照。英伟达创始人兼 CEO 黄仁勋上个月首次在 X 平台发文，转发了一封呼吁美国政策制定者支持开放模型的公开信。他指出，开放模型能够提高 AI 安全性并加强网络安全。随着 AI 从只能对话的聊天机器人转向能够读取企业敏感数据、调用工具并执行现实任务的智能体，企业能否信任 AI 系统，很可能成为决定普及速度的关键。相关阅读：《英伟达、微软、IBM 等 37 家企业成立开放安全 AI 联盟：构建和共享开源工具、推动 AI 安全与保障》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/986/742.htm", "publishedAt": "2026-08-06T14:02:09+00:00"}, {"title": "国内已知最大规模！消息称字节跳动正讨论训练超 5 万亿参数模型", "summary": "IT之家 8 月 6 日消息，晚点 LatePost 今天（6 日）晚间爆料称，字节跳动正在讨论训练一个参数规模超 5 万亿的模型，超过阿里的 Qwen 3.8-Max（2.4 万亿参数）和月之暗面的 K3（2.8 万亿参数），也是目前国内已知参数规模最大的模型。通常而言，模型规模越大，智能水平往往越高，不过该计划仍处于早期阶段。消息称该模型将由 Seed Foundation 负责人项亮主导，与大语言模型预训练数据负责人沈科合作。二人均是字节跳动 AI 及大模型研发体系内的核心骨干，并出自字节的“搜广推”体系。项亮本科毕业于中国科学技术大学，博士就读于中国科学院自动化研究所，2016 年加入字节，曾负责机器学习中台 AML 团队，后调任豆包大模型 Foundation 团队任负责人。沈科 2018 年清华毕业，同年加入字节，现主要负责 LLM 预训练数据。IT之家从报道中获悉，多名字节跳动人士透露，上半年多个 Seed 团队已开始不断反思，而这也是字节讨论训练超 5 万亿参数模型的原因之一。其中一人直言，把参数规模一次推到同行的数倍来争取领先位置的举措“像一场赌博”。两周前的 Seed 全员会上，字节跳动创始人张一鸣安抚了 Seed 的成员。他认为，训大模型本就是一件很难的事，团队不必过度焦虑。他明确一段时间内可接受模型落后于行业，希望大家以追求智能上限为目标，期待 Seed 模型能力能跻身世界第一梯队。张一鸣认为编程是当前的关键方向，并表态自己反对蒸馏。在其看来，蒸馏能在短期内改善模型表现，但本质上仍是在复制 Claude 已有的能力。沿着这条路走，最多只能不断逼近对方，很难真正实现超越。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/986/739.htm", "publishedAt": "2026-08-06T13:42:47+00:00"}, {"title": "张一鸣的三次否决：字节跳动为什么不蒸馏", "summary": "2026年7月，张一鸣在字节Seed团队全员会上做了一个决定：禁止蒸馏任何外部模型，无论闭源还是开放权重。 The Information 8月5日报道了这个消息，并将其动机归结为对TikTok命运的担忧——担心蒸馏美国前沿模型会引发华盛顿报复。但据知情人士了解，TikTok在这个决策中的权重\"几乎为零\"。 张一鸣的解释是：\"为了实现长远目...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/489199/bytedances-founder-rules-distillation-ai-models", "publishedAt": "2026-08-06T11:32:50+00:00"}, {"title": "Cloudflare 开源内部企业 AI 平台 Cloudflare OS", "summary": "Cloudflare 发布了一个开源项目 Cloudflare OS。如果你只看官方博客，你会觉得这是又一个\"AI 知识库 + 聊天机器人\"——每个大厂都在做，没什么新鲜的。 但 Kenton Varda 在 Twitter 上把事情说清楚了： 今天我们发布了 Cloudflare OS，一个带连接器的聊天机器人，跟其他所有科技公司做的一样。只不过，实际上它不一样。这...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/489139/cloudflare-os", "publishedAt": "2026-08-06T10:16:20+00:00"}, {"title": "小米正式开源自研具身基座模型 Xiaomi-Ro const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
