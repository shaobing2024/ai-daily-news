、难”场景，通过人工智能解决行业痛点问题，树立更多应用样板和标杆。“线”上以行业为切口，持续推动制造、能源、交通、医疗等国家人工智能应用中试基地建设，针对行业应用共性问题，统筹算力、模型、数据等要素资源供给，加快标准制定和应用推广，降低人工智能行业落地门槛。“面”上以制度为重点，健全“人工智能 +”政策体系，细化落实重点行业实施方案，制定应用场景分类指引，为“人工智能 +”深化拓展提供更有力的制度支撑。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/021/475.htm", "publishedAt": "2026-11-03T03:23:36+00:00"}, {"title": "高通：高通 AI Hub 现已面向中国开发者开放", "summary": "IT之家 11 月 3 日消息，Qualcomm（高通）今日宣布，其高通 AI Hub 现已面向中国开发者开放。合作伙伴与开发者可借助该平台加速打造终端侧生成式 AI 和智能体 AI。高通 AI Hub 集成 Models、Workbench、Apps 以及 GenieX 端侧推理框架，为开发者提供了一系列的趁手工具。高通 AI Hub Models 提供超过 230 个并持续扩展的预优化模型库；AI Hub Workbench 允许开发者在真实的云托管设备上进行模型调优；AI Hub Apps 提供示例应用和参考代码，助力开发者学习如何将高通 AI Hub Models 集成至应用中。高通 AI Hub 中国版还通过官网、高通终端云中国设备农场和开发者论坛等方式提供各类资源与支持。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/021/453.htm", "publishedAt": "2026-11-03T03:12:52+00:00"}, {"title": "苹果 CEO 特努斯：Siri 每日处理超过 25 亿次请求，部分高级 AI 功能将收费", "summary": "IT之家 11 月 3 日消息，科技媒体 AppleInsider 今天（11 月 3 日）发布博文，报道称在最新财报电话会议上，苹果首席执行官约翰 · 特努斯（John Ternus）重申 Siri 每天处理超过 25 亿次请求，部分高级 AI 功能将收费。IT之家注：这并非苹果公司首次宣布该数据，在 9 月召开的 iPhone 18 Pro 系列以及其首款折叠 iPhone Duo 发布活动中，苹果公司人工智能产品营销副总裁莉莲 · 林孔（Lilian Rincon）首次披露了该数据。相比 2024 年 WWDC 公布的“每天 15 亿次语音请求”，最新数字高出逾 10 亿次，不过苹果并未说明两次统计口径是否一致。苹果正借这一庞大用户基础推进 Siri 的 AI 化改造。新版 Siri 已随 iOS 27 于 9 月起逐步推出，能够结合个人上下文理解更复杂的问题，并跨应用执行操作；它还可从信息、邮件和照片中检索内容，帮助用户不必记住信息具体存放在哪个应用或对话中。但新体验尚未全面开放。Siri AI 仍处于测试阶段，符合条件的用户需加入等候名单；部分依赖服务器端 AI 模型的功能设有每日使用上限，而未来用户如果想要更频繁使用，需要支付一定的费用。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/021/400.htm", "publishedAt": "2026-11-03T03:05:16+00:00"}, {"title": "美国“最年轻”前陆军部长德里斯科尔加入 OpenAI，出任国家安全与现代化事务高级顾问", "summary": "IT之家 11 月 3 日消息，OpenAI 聘请美国前陆军部长丹尼尔 · 德里斯科尔担任顾问，协助推动人工智能在国家安全和网络安全领域的应用。德里斯科尔今年 8 月辞去陆军部长职务，此前曾与美国国防部长皮特 · 赫格塞思多次发生冲突。他将在 OpenAI 担任国家安全与现代化事务高级顾问。当地时间 2 日，OpenAI 通过声明宣布，德里斯科尔将与公司及政府、学术界、产业界等各方负责人合作，推动具体的现代化改革措施，促进符合民主原则的 AI 技术发展。OpenAI CEO 萨姆 · 奥尔特曼在文章中说：“美国迎来了难得的机遇，可以与其他国家携手，推动符合民主原则的 AI 技术得到更广泛的应用。”根据 OpenAI 的介绍，德里斯科尔还将为公司在公共和私营领域的合作伙伴提供咨询，辅助利用 AI 提升国家安全能力，并推动全球开发“符合民主原则”的 AI 技术。2025 年，德里斯科尔以 38 岁的年龄出任美国第 26 任陆军部长，成为美国历史上最年轻的陆军部长。他与美国副总统 JD· 万斯是耶鲁大学法学院时期的好友。德里斯科尔在辞职前与赫格塞思关系紧张，两人在人事安排和领导层决策上存在分歧。OpenAI 最初以非营利组织的形式成立，去年转型为更传统的营利性企业。公司原本禁止旗下技术用于军事领域，2024 年修改政策后才允许军事应用。今年 2 月，OpenAI 与美国国防部达成协议，同意在国防部机密网络中部署自家 AI 模型。此前，竞争对手 Anthropic 因监控及自主武器问题与五角大楼发生严重分歧，双方合作关系破裂，为 OpenAI 达成这笔协议创造了条件。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/021/382.htm", "publishedAt": "2026-11-03T02:57:51+00:00"}, {"title": "OpenAI 下一代 GPT-6.2 Astra 正灰度测试，Codex 用量统计中已单独列出", "summary": "IT之家 11 月 3 日消息，经大量用户反馈，OpenAI 下一代模型 GPT-6.2 Astra 疑似已进入小范围测试，部分 Codex 用户的使用量统计中已经出现独立模型标识「gpt-6.2-astra」。不过，截至目前，OpenAI 官方 API 模型目录、更新日志及公开公告均未确认这一型号，OpenAI 也没有确认其发布时间。据科技媒体 TestingCatalog 昨日报道，多个 Codex 用户在使用量分析页面发现了这一新模型标识。不同用户分享的截图显示，GPT-6.2 Astra 已经占据部分账户的模型调用量，IT之家注意到其中一个账户的占比达到 19.8%（相关记录主要出现在 10 月 31 日的使用统计中）。TestingCatalog 认为，这些记录可能意味着 OpenAI 正在进行灰度测试或 A/B 测试，即让部分用户的请求在后台转发至新模型，同时暂时保留原有的界面名称。作为背景，OpenAI 于 2026 年 9 月 3 日发布 GPT-6 Astra。根据 Terminal-Bench 4.0 测试成绩，GPT-6 Astra 得分为 57.9%，Claude Fable 5.1 为 55.8%，但 Terminal-Bench 官方排行榜目前列出的数据分别为 58.2% 和 57.9%，两者差距较小，具体成绩还会受到推理强度和测试配置影响。此次传闻也与 Anthropic 下一代模型的消息同时出现。上周有部分用户称 Claude Opus 5.5 的请求可能被转发至尚未公布的 Fable 5.5；Anthropic 官网代码中也曾出现过 Mythos 5.5 的隐藏标识。与此同时，还有部分 Codex 用户反馈 GPT-6 Astra 额度消耗变快，不排除与 GPT-6.2 Astra 灰度测试有关的可能。因此，除了推理能力和编程表现之外，GPT-6.2 Astra 实际调用成本、Token 消耗效率以及订阅额度使用情况，也将成为用户关注的重点。相关阅读：《OpenAI：12 月起，ChatGPT 将与 Codex 共享额度》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/021/352.htm", "publishedAt": "2026-11-03T02:32:47+00:00"}, {"title": "OpenAI Tibo“28 天更新挑战”以两次重置收尾，共 14 天发放 Codex / ChatGPT Work 额度重置", "summary": "IT之家 11 月 3 日消息，OpenAI Codex 与 ChatGPT Work 团队负责人 Thibault Sottiaux（Tibo）发起的「28 天更新挑战」已于 11 月 2 日正式结束。这项挑战最终以 11 月 1 日、11 月 2 日连续两天发放“额度重置卡”收尾，分别对应挑战第 27 天和第 28 天。Tibo 于北京时间 10 月 5 日在 X 上宣布开启“28 天挑战”，在未来 28 天内每天推出一项对大多数 Codex / ChatGPT Work 用户而言具有实际意义的明显改进，否则就向用户发放一次完整额度重置。IT之家注：最后两天重置并不代表整个 28 天挑战期间只发放过两次额度重置。第三方追踪网站 Did Codex Reset 显示此期间有 14 天提供重置（部分天数里同时提供功能更新和重置），其中第 27 天和第 28 天均属于预存重置。这项挑战主要围绕产品功能、运行效率、使用额度和模型更新展开。期间，OpenAI 陆续推出多项改进，也多次向用户发放完整额度重置。根据第三方追踪网站的记录，Tibo 在第 26 天（10 月 30 日）时提前宣布接下来的两天将发放预存额度重置（Banked Reset）。随后，第 27 天和第 28 天分别兑现一次，完成最后两次重置。Tibo 此次挑战的核心承诺并非每天无条件增加使用额度，而是要求团队持续交付用户能够感知的产品改进，否则以完整额度重置作为一种补偿方式。随着 28 天期限结束，这项挑战也正式告一段落。相关阅读：《OpenAI：12 月起，ChatGPT 将与 Codex 共享额度》《OpenAI 宣布“28 天计划”：Codex、Work 日进一步或“重置”》《OpenAI“服软”：ChatGPT Pro 订阅用量翻倍，取消 Pro 200 砍半计划》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/021/343.htm", "publishedAt": "2026-11-03T02:15:40+00:00"}, {"title": "MIT 研究者提出「权重空间编程」：GPT-6 Astra 仅修改 Qwen3.5-0.8B 约 0.016% 权重，数学成绩提升至原来 6 倍", "summary": "IT之家 11 月 3 日消息，麻省理工学院计算机科学与人工智能实验室（MIT CSAIL）的研究人员提出了一种名为「权重空间编程」（Weight-Space Programming）的新方法。他们让 OpenAI 的 GPT-6 Astra 直接分析并修改阿里云通义千问热门模型 Qwen3.5-0.8B 的神经网络权重，仅调整约 0.016% 的参数，就将该模型在 MATH-500 数学基准测试中的成绩从 7.9% 提升至 48.1%，达到原来的约 6.1 倍。据称，整个过程没有使用梯度下降或传统训练循环。这项研究由 Rikiya Takehi、Jayden Teoh、Alex Zhang 和 Omar Khattab 共同完成。Takehi 于当地时间 11 月 2 日在博客上发布了这项研究，将其称为「权重空间编程」，核心思路是让大语言模型直接读取、理解和修改另一个神经网络的权重，而不是通过常规训练流程调整模型参数。在具体实验中，GPT-6 Astra 并不是简单地随机调整少量参数，而是先定位 Qwen3.5-0.8B 的推理循环问题。研究人员发现，该模型容易在回答数学问题时反复生成相同内容，导致大量回答耗尽 32768 个 Token 的长度限制。在最初的 96 次测试回答中，有 85 次触及这一上限。研究团队为 GPT-6 Astra 提供了一个可以读取和修改模型权重的 Python 环境，并允许其使用 GSM8K 和 MATH 训练集中的练习题进行有限次数的前向推理。Astra 随后定位到第 15 层和第 19 层 MLP（多层感知机）写入的一种重复方向，通过修改这两层的部分权重，削弱了导致推理循环的信号。最终，Astra 修改了 131072 个权重，占 Qwen3.5-0.8B 约 8 亿个参数的 0.016%。在允许进行 50 轮前向推理的实验中，模型在 MATH-500 上的成绩从 7.9% 提升至 48.1%，在 GSM8K 上从 13.8% 提升至 67.1%。同时，修改后的模型指令遵循能力也有所改善。在衡量模型指令遵循表现的 IFEval 测试中，修改后的模型成绩从 21.0% 提升至 62.3%，约为原来的 3 倍。与此同时，数学测试中因生成长度达到上限而未能完成回答的比例，从原来的 93% 降至 33.1%。需要注意的是，这项实验并非完全没有计算过程。GPT-6 Astra 使用了 Python 环境分析和修改权重，也进行了最多 50 轮前向推理，只是没有使用梯度下降、反向传播或传统训练循环来更新参数。研究人员还使用 Gemma 3 270M 进行了对照实验。由于该模型原本很少出现推理循环，Astra 无法通过类似的局部权重修改显著提升其数学能力，MATH-500 成绩最多仅从 6.8% 提升至 7.7%。研究团队据此指出，权重空间编程可以消除模型已有能力发挥过程中遇到的障碍，但不一定能够凭空创造模型原本不具备的能力。这项研究还包括其他实验，例如让 GPT-6 Astra 仅通过读取神经网络权重识别模型训练过的游戏、判断小型语言模型的训练语言，以及直接编写能够运行游戏的神经网络。研究人员认为，这种方法有望为神经网络可解释性研究和模型优化提供新的思路。参考资料：《Sparks of Weight-Space Programming: LLMs can natively read &amp; write neural network weights》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/021/337.htm", "publishedAt": "2026-11-03T02:00:55+00:00"}, {"title": "MIT：GPT-6 Astra能直接修改Qwen权重，数学能力暴涨6倍", "summary": "指令执行能力也同步提升", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/507322.html", "publishedAt": "2026-11-03T01:57:30+00:00"}, {"title": "OpenAI 发布 LifeVal 基准：从选幼儿园到报税，测试 AI 的“人间烟火”技能", "summary": "IT之家 11 月 3 日消息，OpenAI 于 11 月 2 日发布名为 LifeVal 的新基准，用来衡量 AI 模型能否真正帮助普通人完成日常事务，该公司称这一评估旨在让通用 AI 更贴近“对人类最有用的日常帮助”。在 LifeVal 的任务设计上，OpenAI 首先参考了美国的“美国人时间使用调查”和跨国“多国时间使用调查”，随后又对 3,995 名具有人口代表性受访者开展调查，询问他们最希望个人 AI 助手在哪些事务上提供帮助。据此，LifeVal 覆盖照护、健康、教育、家庭行政、个人财务、购物以及获取政府服务等场景。典型任务包括：搬家后为孩子挑选并报名合适的幼儿园、为患糖尿病的家人制定饮食与照护计划、在预算内采购食材、整理政府表格、安排社区防洪志愿者等。与传统基准不同，LifeVal 更关注任务是否能被推进到“可执行、可交付”的状态。例如，AI 不只是列出幼儿园名单，而要结合地点、预算、通勤和家庭需求筛选；处理财务时，也要兼顾账单、收入和风险。OpenAI 表示，模型可能需要理解聊天记录、浏览网页、整合多方信息，并给出符合个人处境的建议。OpenAI 称，过去一年已将 LifeVal 用于追踪和推动模型在日常任务上的改进。公开示例显示，部分任务表现较高：为孩子找幼儿园得分 93.1%，组织防洪志愿者为 98.0%，为糖尿病家长准备膳食计划为 90.4%。IT之家附上相关截图如下：不过，LifeVal 目前仍主要是 OpenAI 的内部评估。外界尚未获得完整任务集、评分代码、误差范围或可独立复现的排行榜，因此其结果仍需谨慎解读。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/021/336.htm", "publishedAt": "2026-11-03T01:54:54+00:00"}, {"title": "爱诗科技PixVerse 与 OpenAI 共同推出产品集成和创作者教育计划，高效打通 AI 创意全流程", "summary": "近日，爱诗科技（AIsphere）旗下模型和开放平台PixVerse 与 OpenAI 宣布开启深度合作", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/507313.html", "publishedAt": "2026-11-03T01:46:55+00:00"}, {"title": "ChatGPT Classic 官宣“退役”，2027 年 1 月底正式停服", "summary": "IT之家 11 月 3 日消息，OpenAI 公司昨日（11 月 2 日）发布公告，已通知仍在使用 ChatGPT Classic 的用户，该旧版桌面应用将于 2027 年 1 月 30 日停止服务。OpenAI 公司表示用户打开 ChatGPT Classic 应用后，会收到停用提示，点击横幅即可前往新版 ChatGPT 下载页面；官方称完整聊天记录会随账号迁移，用户可在新应用中继续原有对话。IT之家曾于今年 7 月报道，OpenAI 宣布推出全新桌面应用程序，将整合 Codex 和 ChatGPT 体验，增强 AI 编程体验的同时，扩展覆盖更多非开发者群体。桌面版 Codex 在更新后，将会变成全新的 ChatGPT 桌面应用，包括 Chat（聊天）、ChatGPT Work（工作）和 Codex 三个组成部分，更新后应用会保留现有的 Codex 任务和项目，也可以在设置中选择 Codex 应用图标。此前的 ChatGPT 应用变为 ChatGPT Classic 应用。与此同时，OpenAI 正准备进一步简化产品结构：未来数周将向小部分用户开放 Chat 与 Work 合并测试。合并后，用户可在同一界面内完成从提出想法到让 ChatGPT 执行任务的流程，例如导入文件或插件，让其制作网站、生成演示文稿，或在网页上完成操作，并随时审查和指导其工作。Codex 则仍将作为独立体验保留在 ChatGPT 桌面应用中。在权益方面，OpenAI 计划将 ChatGPT 与 Codex 的使用额度合并为共享配额，取代目前各自独立计算的限制。公司表示，多数用户不会比现在更频繁地等待额度重置；实际消耗将取决于所用模型和任务复杂度，高级模型与复杂任务会占用更多额度，而套餐内的“无限即时”使用不会消耗共享配额。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/021/330.htm", "publishedAt": "2026-11-03T01:46:14+00:00"}, {"title": "爱信开发全球首款 16nm STT-MRAM AI SoC，实现 50 倍目标检测能效", "summary": "IT之家 11 月 3 日消息，丰田系汽车零组件供应商 Aisin（爱信）当地时间昨日宣布与日本东北大学合作成功开发了全球首款集成 STT-MRAM（IT之家注：自旋转移矩-磁随机存储器）的 16nm 工艺 AI SoC。这一芯片采用近内存计算 (NMC) 设计概念，直接集成 32MB 嵌入式 MRAM，可直接在本地存储 AI 模型权重和操作系统启动数据，开机时无需调用外部 DRAM 缓存或 SSD 存储。该 SoC 通过 8/16 位混合乘法架构和权重共享技术，利用 Tiny YOLOv3 在有限的片上 STT-MRAM 容量内实现了目标检测。其从开机到操作系统启动的时间缩短至 65.7ms，速度提升 38.59 倍；AI 处理速度提升 10.16 倍；整体运行速度提升 25.2 倍。其进行目标检测所需的能量也仅有 50.7mJ / 帧，是传统解决方案的 1/50。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/021/326.htm", "publishedAt": "2026-11-03T01:30:09+00:00"}, {"title": "搭载百度文心大模型：小度 AI 手表 Fit 国补 138 元探底，轻薄大屏无感佩戴", "summary": "7 月 27 日小度 AI 智能手表 Fit 正式发布，定价为 198 元，国补价 159.8 元。天猫双 11 狂促报价 233 元，叠加以下多重优惠，到手仅需 138.04 元。官方立减 15% 省 35 元 + 领券立减 10 元；可用淘金币抵扣 25.6 元；App 商品价格下方可领 15% 政府补贴。天猫小度 AI 智能手表 Fit25.6 元淘金币 + 国补 8.5 折券后 138.04 元领 10 元券IT之家从商品页面获悉，这款产品搭载百度 AI 文心大模型，轻触表盘后通过语音提问即可获得智能作答，日常查询天气、穿搭建议、健康饮食方案都能快速得到响应。它支持 AI 生成精美表盘，用户可以通过语音输入实现个性化定制，轻松生成海底世界、萌宠、国风山水画等多种风格的专属表盘。小度 AI 智能手表 Fit 配备 1.95 英寸超清全面屏，采用 320*386 分辨率的 IPS 广视角面板搭配弧面玻璃，显示效果清晰顺滑，抬腕即可浏览丰富内容。整机设计轻薄，薄至 8.8mm、轻至 42g，搭配金属质感中框与表冠，线条流畅兼顾佩戴舒适度与精致感，实现近乎无感的佩戴体验。该手表内置 100+ 种运动模式，覆盖跑步、骑行、羽毛球、瑜伽等常见运动场景，可以精准记录卡路里消耗与运动时长，相当于将专业运动教练随身携带。依托百度 AI 算法，它可以对多种运动数据进行专业分析，同步展示运动时长、心率、热量、步数、配速、距离等核心信息，帮助用户全面掌握自身运动状态。它支持 24 小时全维度健康监测，内置生物追踪光学传感器，可实时监测情绪、压力、心率、血氧等数据，还能自动识别并记录睡眠状态，完整还原整晚睡眠结构。续航方面，这款手表搭载 300mAh 大容量电池搭配超低功耗芯片，常规使用场景下续航可达 5 天，极限使用场景下最长可以坚持 7 天，无需频繁充电。京东 11.11 无门槛红包 面额至高 26888 元，每天抽 3 次：点此抽红包。淘宝 11.11 无门槛红包 面额至高 26888 元，每天抽 1 次：点此抽红包。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/021/316.htm", "publishedAt": "2026-11-03T00:57:03+00:00"}, {"title": "从英伟达到 Pika，硅谷巨头为何“反向借力”这个国产模型？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/h1310kHD9CWD1mO8aTAc?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-02T22:48:56+00:00"}, {"title": "ChatGPT Pro 额度翻倍：是让步，不是福利？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/WpTNht7guarWEyejJFV6?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-02T09:16:03+00:00"}, {"title": "ChatGPT 正在偷偷给你画像，用这段提示词让它交出来", "summary": "或许《Her》描绘的世界已经到来了#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1686832?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-11-02T07:37:27+00:00"}, {"title": "OpenAI重写大模型法则，第一条：忠于人类！！", "summary": "新版“机器人三定律”。", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/507225.html", "publishedAt": "2026-11-02T07:27:54+00:00"}, {"title": "央视严选「中国AI创业十骏」：唯一AI制药公司是清华系", "summary": "模型管线双驱动", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/507150.html", "publishedAt": "2026-11-02T06:28:07+00:00"}, {"title": "小米开源了个150元的AI小玩意，火到配件都涨价了", "summary": "能指挥Agent干活，还能控制智能家居", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/507107.html", "publishedAt": "2026-11-02T06:08:04+00:00"}, {"title": "Go 语言重构 Java 项目会提升了多少", "summary": "把Java项目ApiGo使用Go语言重构为ApiGoo，提升了哪些 背景: ApiGo 是一个gitee上开源的 SQL2API 平台——在线写 SQL，AI对话即可快速发布成 REST 接口。Java版是 Spring Boot 4 + Mybatis，实现MySQL/Oracle/SQLServer/达梦/ClickHouse 等十几种数据库的 JDBC 驱动全打进一个 fat jar。ApiGoo 现在用 Go(Gin + database/...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503342", "publishedAt": "2026-11-02T05:32:35+00:00"}, {"title": "GPT-6.2 Astra开启灰测！Claude Mythos 5.5同日曝光", "summary": "HuggingFace疑似泄露权重已被下5000次", "sourceName": "量子位", "sourceUrl": ，但监管政策和法律变化冲击了部分市场的 App Store 佣金收入。IT之家从报道中获悉，第三方机构 8 月的估算显示，苹果在美国市场的佣金收入下降 18%，巴西和日本出台新规后，当地佣金收入也出现下滑。苹果过去一直严格控制 App Store 内的支付渠道，对所有交易抽取佣金。然而，Epic Games 发起的诉讼最终迫使苹果允许开发者将用户引导至外部支付系统。其他国家和地区的法律诉讼也给 App Store 业务造成了进一步影响。帕雷克在财报电话会议上谈及 App Store 的经营压力时，再次提到服务业务开拓新领域的机会。“我们注意到，一些因素影响了 App Store 的表现。9 月财季，App Store 的业绩与去年同期基本持平，第三方应用的付费订阅数量创下新高，增长达到两位数。与此同时，手游业务仍面临此前提到的不利因素，我们预计这种情况会延续到夏季财季。展望未来，12 月财季服务业务预计增长 8% 至 9%。这一预期考虑了我们对环比增长阻力的评估，主要来自第三方授权业务，以及刚才提到的汇率因素额外造成的 0.5 个百分点影响。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/021/344.htm", "publishedAt": "2026-11-03T02:17:47+00:00"}, {"title": "苹果为第四代 Apple TV 4K 推送专属 24K154 更新，可启用 Siri AI", "summary": "IT之家 11 月 3 日消息，科技媒体 9to5Mac 昨日（11 月 2 日）发布博文，报道称在 Apple TV 4K（第四代）11 月 13 日上市开售之前，苹果悄然为其推送专属 tvOS 27.2 更新。版本号方面，该版本内部代号为 24K154，而上周面向现有 Apple TV 设备推出的 tvOS 27.2 版本号为 24K122，意味着新款 Apple TV 4K 上市后将预装更新的系统版本。在更新内容方面，苹果公司尚未单独公布 24K154 内容，不过开发者 @itspdfu 指出，在该版本中，苹果为新款 Apple TV 4K 适配启用 Siri AI。在模拟 Apple TV 4K（第四代）的 Siri 设置中，相关说明写道：“Siri 比以往任何时候都更加强大，它结合了个人背景和世界知识，可以帮助你找到完美的节目，只需提问即可获取更多信息等等”。IT之家附上相关截图如下：", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/021/342.htm", "publishedAt": "2026-11-03T02:07:03+00:00"}, {"title": "AI+办公：Agent都有“工位”了，云电脑既让它接手业务、也管住权限 ｜ 阿里云智能集团研发副总裁 张献涛分享", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/Vryq1f3C0f5uZHOlmIp4?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-02T18:08:42+00:00"}, {"title": "InfoQ AI 侦察团现场手记：工具之外，企业 AI 落地还要跨过哪些关？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/ORJZPCwM2XXNcdRYf8de?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-02T17:39:48+00:00"}, {"title": "别再迷信 Agent 的自主性了", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/UMvAAwoFByxvWLLVVJYY?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-02T16:50:26+00:00"}, {"title": "Cordonix 0.0.5 发布：新增原生手机工具与 Windows 进程查询", "sum const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
