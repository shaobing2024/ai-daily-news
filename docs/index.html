<script>
const DATA = {"date": "2026-09-02", "generatedAt": "2026-09-02T00:47:06Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "Meta 发布首个实时音频感知 AI 模型，支持 20 余人分轨转写", "summary": "IT之家 9 月 2 日消息，科技媒体 9to5Mac 昨日（9 月 1 日）发布博文，报道称 Meta 公司推出 Muse Voice Transcribe，这是其首个实时音频感知模型。开发者可通过 Meta Model API 调用该能力，定价为每 1000 分钟音频 3 美元（现汇率约合 20.2 元人民币），等同每小时 0.18 美元（现汇率约合 1.2 元人民币）。该模型在同一流程中整合流式自动语音识别、说话人分离与端点检测，用户说话时，系统可同步输出文字，无需等待完整录音结束后再单独处理。IT之家注：“流式”就是边说边转写，模型不必等整段音频说完才出结果，而是会一小段一小段持续输出文字，所以延迟更低，适合实时听写、会议记录、通话字幕。Muse Voice Transcribe 可在包含 20 余名说话者的录音中分离不同发言者，还能识别说话是否结束，从而自动确定一段输入的边界。模型训练覆盖 70 余种语言，其中 25 种语言在发布时完成验证。该模型支持长度超过 1 小时的音频，也支持句内或句间的自然语言切换。开发者还可通过语言、关键词和上下文偏置，提高特定语言、术语或场景下的识别效果。在技术方面，Meta 为兼顾实时响应和识别准确度，引入名为自适应延迟（adaptive delay）的动态决策机制。系统不会为所有词语采用固定的速度与准确度取舍，而是针对每个词判断需要额外接收多少音频后再输出识别结果。对于较容易识别的语音，系统可更快提交转写结果。对于发音不清、术语较多或语境复杂的词语，系统会调用更多前后文音频信息。这种机制旨在兼顾。Meta 称，截至 2026 年 9 月 1 日，Muse Voice Transcribe 位列 Artificial Analysis 流式语音转文本排行榜第 1 名。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/997/218.htm", "publishedAt": "2026-09-02T00:23:26+00:00"}, {"title": "OpenAI 吸取“AI 越狱”事件教训，首个达“关键”门槛模型 Astra 因能力过强将限制网络安全功能", "summary": "IT之家 9 月 2 日消息，OpenAI 于当地时间 9 月 1 日宣布，该公司计划“很快”推出下一代 AI 模型 Astra，但将严格限制该模型网络安全功能的使用范围。据介绍，Astra 是 OpenAI 旗下首个达到其《准备框架》（Preparedness Framework）中“关键”（Critical）网络安全能力门槛的模型。根据 OpenAI 的定义，达到“关键”门槛意味着该模型能够无需人类干预，在多个经过安全加固的真实关键系统中，识别并开发出涵盖各严重等级的有效零日漏洞利用程序。OpenAI 研究副总裁 Amelia Glaese 表示，Astra 能够在无需人类分步指导的情况下，在许多防护严密的系统中发现此前未知的安全漏洞并开发出利用方法。在测试中，Astra 成功发现并串联利用了两个零日漏洞，OpenAI 正将这两个漏洞披露给相关维护方。Astra 的发布计划与访问限制OpenAI 表示将采取分级开放策略。Astra 发布后，其执行高级网络安全相关任务的能力最初将仅向一小批测试人员开放。此后，公司计划通过 Daybreak Blue 计划向更广泛的用户开放防御性网络安全用途的访问权限。OpenAI 承认，限制 Astra 的网络安全能力可能会限制一些机构和企业的合法防御工作。吸取 Hugging Face 事件教训，强化安全护栏此次发布计划出台的背景是，OpenAI 在 2026 年 7 月发生了一起 AI 智能体意外“越狱”并攻击 AI 平台 Hugging Face 的事件。当时，由两个 OpenAI 模型（GPT-5.6 Sol 及另一个未公开模型）二次开发的自主 AI 智能体，在安全评估过程中利用隔离测试环境（沙盒）中的软件漏洞自行连接互联网，并入侵了 Hugging Face 的系统。OpenAI 在 8 月底发布的报告中承认，公司本可以更早做出反应以防止该事件发生。OpenAI 表示，尽管 Astra 并非参与 Hugging Face 入侵事件的模型之一，但公司已将从中汲取的经验应用于 Astra 的安全防护中。这包括训练模型更可靠地拒绝回答“有害的网络安全请求”，并增设了专门的“不一致性监控器”（misalignment monitor）以识别并阻止潜在的危险行为。这些防护措施还包括在内部部署期间监控模型是否存在未经授权的行为，并自动终止可能存在的未经授权活动。此外，OpenAI 还警告称，Astra 的安全防护措施可能会错误地将合法的防御性网络安全活动标记为滥用行为，从而导致任务被减慢、暂停甚至终止（IT之家注：OpenAI 根据网络安全工作的性质分为“蓝队”防御和“红队”攻击两种任务类型，Daybreak Blue 计划仅开放用于防御性的“蓝队”工作）。OpenAI 研究科学家 Fouad Matin 表示：“我们相信这些能力可以帮助防御者发现并修复严重的弱点，但如果没有适当的防护措施，它们也可能让攻击者更有效率，这正是我们努力防止的情况。”相关阅读：《预估为 GPT-6 AI 模型：OpenAI Astra 首批演示样本流出，1 次交互生成类 GTA 2 游戏》《OpenAI 下一代 AI 模型 Astra 数学成果遭抄袭指控》《OpenAI：因网络安全风险，延缓 Astra 模型发布》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/997/207.htm", "publishedAt": "2026-09-01T23:40:04+00:00"}, {"title": "地平线征程 6M 官宣大规模量产上车，城区 NOA 延伸至 10 万级主流汽车市场", "summary": "IT之家 9 月 2 日消息，地平线官方昨晚宣布，征程 6M 迎来大规模量产上车关键里程碑。截至 2026 年 8 月底，征程 6M 已落地 20 余家车企、70 余款量产上市车型，其中已有 7 家车企品牌基于征程 6M 实现城区辅助驾驶功能平台化上车。地平线表示，这标志着城区辅助驾驶正在从少数高端车型的专属配置，向 10 万级主流市场延伸，覆盖更广泛的价位段和动力形式。据官方介绍，征程 6M 算力达 128TOPS，对 Transformer 大模型拥有同级领先的计算效率，可实现一段式端到端城区辅助驾驶方案，在主流算力与成本区间内，支撑高速、城区、泊车全场景高阶辅助驾驶能力。这份全场景智驾体验并非新能源车型的专属，基于单颗征程 6M 打造的城区辅助驾驶系统可支持风冷散热方案，能够满足燃油车的整车散热与量产要求，让燃油车型同样可以搭载城区辅助驾驶功能。IT之家查询得知，地平线于 2024 年 4 月份推出征程 6 系列芯片，包含征程 6B、征程 6L、征程 6E、征程 6M、征程 6H 和征程 6P。征程 6E 单颗算力约 80 TOPS，支持域控被动散热，可适用各类动力车型。相较于 6E，征程 6M 具备更优性能表现，支持轻量级城区 NOA 及记忆行车等更领先的智驾应用。今年 1 月，地平线发文称，2026 年 1 月 21 日，理想 AD Pro 4.0 推送，行业首个基于地平线单征程 6M 芯片的端到端城市 NOA 方案正式交付上车。该方案由理想汽车主导研发，与轻舟智航共同打造，适用于城市出行场景，搭载于理想 L 系列智能焕新版的 AD Pro 车型。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/997/203.htm", "publishedAt": "2026-09-01T23:22:53+00:00"}, {"title": "Anthropic 发布 Claude Fable 5.1 和 Mythos 5.1：性能超越前代，缓存读取费用下调 75%", "summary": "IT之家 9 月 2 日消息，当地时间 9 月 1 日，Anthropic 宣布推出 Claude Fable 5.1 和 Claude Mythos 5.1 模型。该公司称这两款模型为“全球最先进的编程与知识工作模型”。Fable 5.1 与 Mythos 5.1 采用相同的基础模型，区别在于安全防护等级不同 ——Fable 5.1 面向所有用户开放，Mythos 5.1 仅通过可信访问计划向经过审核的网络安全和生命科学领域的机构提供。性能方面，Anthropic 披露的基准测试数据显示，Fable 5.1 在多项测试中超过了前代 Fable 5、Opus 5 以及 OpenAI 的 GPT-5.6 Sol。在智能体科学研究基准 Terminal-Bench-Science 0.1 中，Fable 5.1 得分为 52.6%，而 Fable 5 为 24.7%、Opus 5 为 29.0%、GPT-5.6 Sol 为 22.4%。在智能体编程基准 Terminal-Bench 4.0 中，Fable 5.1 得分为 55.8%，Mythos 5.1 在更宽松的安全防护下达到 60.9%。知识工作方面，Fable 5.1 在 GDPval-AA v2 测试中获得 1853 分，高于 Opus 5 的 1824 分和 Fable 5 的 1723 分。价格方面，Fable 5.1 的缓存读取（cache reads）费用下调 75%，降至每百万词元 0.25 美元。典型工作负载下，Fable 5.1 的成本比 Fable 5 低约 25%；对于高度智能体化的工作负载，成本最高可降低 45%。基础定价保持不变：输入词元每百万 10 美元，输出词元每百万 50 美元。数据保留方面，Anthropic 推出了全新的企业级前沿防护措施（Enterprise Frontier Safeguards，EFS）。该方案将零数据保留的隐私保护与先进的安全防护相结合，客户数据存储在由企业完全控制的云基础设施中，而非 Anthropic 的系统中。EFS 将于今年秋季开始分阶段向企业客户推出。在 EFS 可用之前，符合条件的客户可使用零数据保留政策使用 Fable 5.1。安全防护方面，Anthropic 对 Fable 5.1 的防护机制进行了改进，以减少误报。在网络安全领域，新版防护措施的误报拦截数量比此前减少约 60%。Fable 5.1 现在可用于发现软件漏洞，但不会用于开发针对这些漏洞的利用程序。生物学领域，Anthropic 与美国政府合作建立了访问计划，允许研究人员利用 Mythos 5.1 的高级生物学能力，并计划在近期向科学家开放注册。科学能力方面，Anthropic 展示了 Mythos 5.1 在多个领域的成果。在分子设计领域，Mythos 5.1 利用开源蛋白质设计和折叠工具，设计出了高亲和力结合剂。在三个靶点上，其结合亲和力比 Adaptyv Bio 蛋白质设计竞赛的最佳参赛作品高出 10 倍；在 12 个靶点上的命中率接近 50%，而目前蛋白质设计的典型命中率为 10% 至 15%。在计算分析领域，Fable 5.1 基于 NASA 麦哲伦任务 30 多年前的雷达图像，训练了一个神经网络，绘制了覆盖金星三分之一区域的高分辨率高程地图，分辨率从之前的 10 至 20 公里精细到 2 至 3 公里，高程精度提升了 25%。在计算生物学领域，Mythos 5.1 通过编写自定义 GPU 内核并缓存中间结果，将七个开源深度学习模型的速度提升了至多 2.5 倍，预计可将 GPU 成本降低 30% 至 60%。合规方面，Anthropic 于 2026 年 7 月签署了欧盟《人工智能法案》关于 AI 生成内容透明度的实践准则。根据该法案要求，自 2026 年 8 月 2 日之后发布的模型输出需添加不可见水印。Fable 5.1 已为生成的文本加入了这种不可见水印（IT之家注：该水印对未持有检测 API 的用户不可见，不影响输出质量和内容，也不包含用户或其对话的任何信息）。Anthropic 正在以私人预览形式推出相应的检测 API，符合条件的机构（如监管机构、执法部门、媒体、事实核查机构等）可根据欧盟法律要求使用。Claude Fable 5.1 现已登陆所有平台，包括 Amazon Web Services、Google Cloud 和 Microsoft Azure，开发者可通过 Claude API 使用；Claude Mythos 5.1 目前仅面向经审核的美国组织提供。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/997/193.htm", "publishedAt": "2026-09-01T22:28:51+00:00"}, {"title": "云原生弹性的能力，迁移成为 Agent 时代的数据基座能力之一？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/video/QflJXpVJK5DqeoOgsY3D?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-01T21:24:38+00:00"}, {"title": "3名开发者做出来的副业项目，半年冲进 4万人！亚马逊云科技把内部 Agent 工作台开源了", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/Um4rVTweSFXAiwdGLFVB?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-01T19:57:24+00:00"}, {"title": "1200个 Agent 秘密交流，700个集体攻击Hugging Face，OpenAI 模型完成了一次没有剧本的集体暴走", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/s8dvlxO3lh3CEDgcsUEi?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-01T19:54:21+00:00"}, {"title": "百度 CFO 何海建：AI 业务有望很快带来与搜索业务相当的利润和现金回报", "summary": "IT之家 9 月 1 日消息，据彭博社今天（1 日）报道，百度首席财务官何海建表示，公司在 AI 领域的大规模投入有望很快带来与搜索业务相当的利润和现金回报，也将证明百度从互联网企业向 AI 公司的转型方向正确。目前，百度 AI 相关收入已经覆盖云计算、应用等多个业务领域，占公司总收入的一半以上。何海建预计，这一增长趋势仍会持续。随着云服务和 AI 芯片需求增长，AI 业务的利润率近期有望达到搜索业务水平。同时，用于支持 AI 服务的新 GPU 集群投资预计将在两到三年内收回成本，与阿里巴巴此前的判断类似。何海建对未来增长充满信心。“我们的云业务收入将在未来几个季度保持良好增长，至少快于行业平均水平，而资本开支也会低于市场预期。所以，我们正在采用一种更聪明的方式，用更少的投入实现更高增长。”何海建还认为，互联网企业过去通常按照市盈率被投资者视为价值股，但百度正在向深科技企业转型，因此投资者应该分别评估旗下芯片、自动驾驶等业务的价值。“在当前中国科技企业中，百度是唯一一家拥有完整 AI 能力栈的公司，覆盖芯片、云基础设施、现实世界应用、自动驾驶、AI 智能体以及自主研发基础模型。百度上市已有 21 年，许多投资者仍然把我们视为一家传统价值股公司。”据IT之家今天早些时候报道，百度完成了港交所与纳斯达克双重主要上市。根据公告，百度于香港联交所上市的普通股，及于纳斯达克全球精选市场上市的美国存托股，将持续可予转换。相关阅读：《百度完成港交所与纳斯达克双重主要上市》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/997/173.htm", "publishedAt": "2026-09-01T14:57:34+00:00"}, {"title": "Sonos 一口气推出两款全新硬件：Beam Ultra 回音壁、Ace Ultra 头戴式耳机", "summary": "IT之家 9 月 1 日消息，Sonos 今天（1 日）一口气发布了 Sonos Beam Ultra 回音壁、Sonos Ace Ultra 头戴式耳机，以及全新音频操作系统 Sonos 27 三款软硬件新品。这也是 Sonos 自 2024 年以来规模最大的一次集中发布。2024 年，Sonos 新版应用上线后激怒大量用户，公司随后陷入漫长的补救阶段。Sonos 27 的重点放在 AI 上。Sonos 自主开发了 Sonos 27voice 语音助手，可以控制音乐播放和 Sonos 系统，今年秋季将以抢先体验形式开放，由用户自行选择是否启用。另一项新功能 Sonos 27mcp 则支持接入 ChatGPT、谷歌 Gemini 等现有 AI 模型，9 月 8 日开放抢先体验。Sonos 27 未来还支持最多创建 10 个自定义 AI 智能体，用户还能自由选择背后的 AI 模型，为每个智能体设置不同的声音和角色。Sonos 产品开发高级总监布兰登 · 霍利举例说，用户可以让一个阴郁的侦探播报晨间新闻，也可以让励志教练在起床时低声送上鼓励。不过，自定义智能体要到 2027 年才会提供。Sonos 27 还配有一个虚拟音量旋钮，用户可以像操作实体音响一样，用两根手指转动。新的导航、房间排序和虚拟音量旋钮将从 9 月 8 日起陆续推出，虚拟旋钮届时暂时只有 iOS 版本。除了软件，Sonos 还带来了两款传闻已久的新硬件：Ace Ultra 头戴式耳机和 Beam Ultra 回音壁。Ace Ultra 实现了“真正融入 Sonos 生态系统”，采用 Sonos Headphone Engine 2 平台，支持将于 9 月 29 日同步推出的“耳机联动”功能。用户按下耳机上的按键，就能直接在 Sonos 音箱和耳机之间切换声音，即使手机不在身边也不受影响。Ace Ultra 整体造型与初代 Ace 非常接近，内部换上新设计的 40mm 定制单元，配有 10 个降噪的麦克风。该产品将重点改善“真正重要的频率”，Ace Ultra 的主动降噪效果在相同频段最高可达到 Ace 的两倍。例如在 65Hz 左右的暖通空调低频噪声下，降噪效果提高至 2.2 倍；面对约 120Hz 的飞机低频轰鸣，则提高至 1.8 倍。自适应均衡器会根据实际佩戴状态调整声音，补偿眼镜、首饰或头发造成的密封不严。用户还可以通过 3 段或 8 段均衡器自行调音。Ace Ultra 支持 SBC、AAC 和 aptX Adaptive Lossless，通过 USB-C 连接时则支持 16-bit/48kHz 高解析度音频。开启主动降噪后，Ace Ultra 最长可以使用 35 小时；充电 3 分钟，就能增加 3 小时的聆听时间。配色除了黑色和白色，还新增龙舌兰蓝和沙米色。Sonos Ace Ultra 将于 9 月 29 日发售，售价 449 美元（IT之家注：现汇率约合 3,025 元人民币）。Beam Ultra 则进行了彻底重新设计，从上一代的 5.0 声道升级到 7.1.2 声道，并新增 2 个向上发声单元，用于呈现杜比全景声空间音效。中央声道的中高音单元采用新的波导、机械结构和声学设计，同时加入数字信号处理，提供 4 档 AI 语音增强，以改善对白清晰度。Beam Ultra 依旧主打紧凑机身。为了容纳新增的扬声器，长度比 Beam Gen 2 增加不到 10.2 厘米，提供黑色和白色哑光版本，将于 9 月 29 日上市，售价 699 美元（现汇率约合 4,709 元人民币）。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/997/168.htm", "publishedAt": "2026-09-01T14:23:53+00:00"}, {"title": "英伟达 DLSS 5 发布：支持 RTX 50 系显卡，首发支持《NBA 2K27》游戏", "summary": "IT之家 9 月 1 日消息，英伟达官方今天发布 DLSS 5 技术，首发支持游戏有《NBA 2K27》，支持所有 RTX 50 系显卡的笔记本和台式电脑，以及 GeForce NOW 云游戏平台。据悉，《NBA 2K27》由 Visual Concepts 开发、2K 发行，本作利用 DLSS 5 全面改善全明星后卫凯德 · 坎宁安（Cade Cunningham）的皮肤次表面散射效果，并提高颈部和球衣领口附近的接触阴影精度，头发表现更加细致，进一步增强角色真实感。同时，DLSS 5 还将提升控球后卫泰瑞斯 · 哈利伯顿（Tyrese Haliburton）的面部色调、鼻子下巴接触阴影，还可在护臂袖口褶皱呈现更清晰的阴影细节。场边观众和工作人员同样应用自然皮肤次表面散射及清晰接触阴影，使人物模型画面质量得到大幅提升。当玩家使用 RTX 5090 显卡时，本作在 4K 分辨率、Ultra 画质、开启光追下，最高帧率可达 370FPS。在 2K 分辨率下，本作帧率表现如下：GeForce RTX 5090：最高 590 FPSGeForce RTX 5080：最高 410 FPSGeForce RTX 5070 Ti：最高 350 FPSGeForce RTX 5070：最高 260 FPS使用 1080P 分辨率时，GeForce RTX 50 系的绝大多数用户都可以在 Ultra 画质、开启光线追踪和 DLSS 5 的情况下体验《NBA 2K27》。若想在《NBA 2K27》中体验 DLSS 5，用户需安装最新版本的 GeForce Game Ready 驱动程序。该驱动将于近日上线，用户可通过 NVIDIA 官网或 NVIDIA App 下载。英伟达确认，未来几个月将有更多游戏支持 DLSS 5。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/997/166.htm", "publishedAt": "2026-09-01T14:11:17+00:00"}, {"title": "Expedia和Airbnb引入LLM生成的GraphQL模拟数据，不过规范相对滞后", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/Su2betkPUhxX0JTVazBi?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-01T11:55:29+00:00"}, {"title": "GFlow v1.0.0 发布：Go 生态审批工作流引擎，中国式审批、AI 先审、批完自动办", "summary": "GFlow Engine 是一个基于 RuleGo 的轻量级、可嵌入审批工作流引擎，今天正式发布 v1.0.0 并以 Apache-2.0 协议开源：引一个 Go 库、建 7 张表，即可为现有系统补上完整的审批能力，无需部署独立的流程中间件。 审批工作流赛道，Java 世界有 Flowable/Activiti，国产开源有 FlowLong，SaaS 有钉钉/飞书，Go 生态却长期缺位...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502248", "publishedAt": "2026-09-01T08:34:29+00:00"}, {"title": "云上AI应用故障诊断，上海开源大赛ZSvirt命题公布", "summary": "现在不少 AI 应用跑在云环境里，我们称之为「智算云」。简单来说，就是专门承载 GPU 算力、支撑大模型训练和推理的云平台。 在智算云环境中，GPU、vGPU、虚拟机、容器、模型服务和智能体（Agent）往往跨越多个资源与运行层。ZSvirt 可提供主机、虚拟机、网络、存储、GPU/vGPU、告警等基础设施视角，但实际业务故障常发生...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502247", "publishedAt": "2026-09-01T07:56:40+00:00"}, {"title": "DeepSeek 开源的第一个多模态模型，不是拿来「看图说话」的", "summary": "8 月 31 日，DeepSeek 在 Hugging Face 上线了 DeepSeek-V4-Flash-Vision-Exp，MIT License，V4 家族第一款实验性多模态模型。305B 参数，基于 V4-Flash-0731 底座，在原有语言模型上接入了视觉编码器和 Aligner，经过持续训练获得图像理解能力。 值得注意的恰恰是「多模态」这个词在这里被重新定义了。传统多模态模型的...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502240/deepseek-v4-flash-vision-exp", "publishedAt": "2026-09-01T07:17:15+00:00"}, {"title": "自进化WAM来了！清华AIR联手域变换提出具身In-Context Causal Learning", "summary": "参数冻结，能力暴涨", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/482337.html", "publishedAt": "2026-09-01T05:12:30+00:00"}, {"title": "399 美元的鸭子机器人开源了，今年最让人想立刻掏钱的硬件产品", "summary": "Hugging Face 和法国机器人公司 Pollen Robotics 上周发布的 Microduck，是今年最让人想立刻掏钱的硬件产品。 一只 25 厘米高、不到 800 克的鸭子机器人，用 15 个舵机配合 50Hz 控制循环驱动神经网络策略，能走路、能蹲下、能摔倒了自己爬起来，甚至能用喙叼起地上的东西。售价 399 美元，在北美、欧洲和英国开放预订，...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502235/hugging-face-poll 。这一表态无疑是在告诉马克 · 扎克伯格暂时无需担心 OpenAI 去抢 Meta 智能眼镜的生意。事实上，奥尔特曼对智能眼镜的态度早有端倪。去年在参加艾伦公司太阳谷峰会期间，当记者在场边询问他当时所戴太阳镜是否为智能眼镜时，他很快澄清：“绝对不是，我不喜欢智能眼镜。”Meta 是智能眼镜领域的主要参与者之一，虽然公司未单独披露眼镜收入，但在财报中多次表示 AI 眼镜销量增长正在抵消 Quest 头显销量放缓的影响。今年 7 月，Meta 报告显示其 Reality Labs 部门（含消费硬件销售）在 2026 年第二季度实现营收 4.31 亿美元（IT之家注：现汇率约合 29.04 亿元人民币），同比增长 6100 万美元。然而，智能眼镜的隐私问题正引发广泛关注。在一些场所宣布计划禁止顾客佩戴智能眼镜后，Meta 近期发起了一轮公关攻势。Instagram 也承诺打击用户利用智能眼镜偷拍的行为，但目前来看仍有待改进。在采访中，希思试图让奥尔特曼透露更多关于 OpenAI 与传奇 iPhone 设计师乔尼 · 艾维（Jony Ive）共同开发的 AI 设备细节。奥尔特曼表示：“我认为有些东西适合放在桌面上，有些东西适合放进口袋里，还有些东西适合佩戴在身上，我们会花些时间把这些东西逐一推出。”据此前报道，OpenAI 与艾维旗下 LoveFrom 工作室合作的设备内部代号为“Sweet Pea”，定位为 AI 语音交互设备；奥尔特曼此番表态暗示该设备可能并非智能眼镜形态。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/997/217.htm", "publishedAt": "2026-09-02T00:22:15+00:00"}, {"title": "马斯克：预计 AI 将令全球经济规模增加约 20%-30%", "summary": "IT之家 9 月 1 日消息，马斯克今天（1 日）晚间在 G20 会议上发表演讲称，预计 AI 将使全球经济规模增加约 20%-30%，即每年增加约 20 万亿至 30 万亿美元（IT之家注：现汇率约合 134.72 万亿至 202.09 万亿元人民币）。此外，马斯克预计到 2027 年底，AI 将能够完成所有数字领域的工作，即不需要人工直接操纵完成的工作。软件方面，AI 编程能力明年可能达到“Stockfish 级”，人类将无法与 AI 竞争软件开发；未来 12 至 18 个月内，AI 将在各类工程和其他数字领域的能力水平将会“极为出色”。人形机器人方面，马斯克预计未来 10 年全球人形机器人数量将超过 10 亿台，每台机器人的生产力至少相当于人类的 5 倍，人形机器人总体则有望使全球经济规模扩大 10 倍以上。马斯克同时警告 AI 行业正面临电力供应短缺，并直言这已经不是一个遥远的问题。他预计，2027 年 AI 芯片可能面临至少 15 吉瓦的电力缺口，原因是 AI 芯片产量增速约为 40%-50%，而中国以外的电力增速约为 10%-20%，增长速度较快的曲线将压倒较慢的曲线。对于“其他国家”而言，建设大量电力，托管 AI 数据中心，并对其征税、收取合理费用将是“机遇”。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/997/186.htm", "publishedAt": "2026-09-01T15:48:15+00:00"}, {"title": "高通跃龙 Q-2390、IQ-2390 处理器发布：面向消费级物联网等领域，预计 2027 年初面市", "summary": "IT之家 9 月 1 日消息，高通公司今日宣布推出跃龙（Dragonwing）Q-2390 和 IQ-2390 处理器，面向消费级物联网、工业边缘计算等领域。据介绍，这两款处理器均配备四核 Kryo CPU、Adreno704 GPU 以及实时 RISC-V MCU。支持 Linux、Android 和 Zephyr OS 操作系统，开发者可为其打造更多差异化产品。IT之家附两款处理器简介如下：Dragonwing Q-2390：为商业和消费级 IoT 带来智能体验这款处理器面向边缘商业、消费类设备。将端侧 AI、摄像头和显示器支持、LTE Cat 4、GPS、有线 / 无线联网等功能集成在一个处理器之中。应用场景包括 POS 终端、门禁、智能家电、家用机器人、健身设备等。Dragonwing IQ-2390：将智能计算深入工业边缘末端IQ-2390 是 IQ2 系列工业边缘 AI 处理器家族的首款产品，重点面向工业自动化、油气、公用事业和能源领域。支持机器视觉、AI 加速、双千兆以太网等特性，可构建更加智能的人机界面（HMI）、可编程逻辑控制器（PLC）和工业网关等。工作温度覆盖-30℃ 至 +115℃，针对振动、冲击环境进行专门优化。此外，这两款产品将在 IFA 2026 展会现场展示，高通已通过早期访问计划与客户展开合作，评估套件预计 2027 年初面市。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/997/185.htm", "publishedAt": "2026-09-01T15:25:59+00:00"}, {"title": "消息称 SpaceX 数据中心出现工程、稳定性问题，马斯克为此换掉多名建设团队高管", "summary": "IT之家 9 月 1 日消息，据《The Information》援引多名知情人士消息称，埃隆 · 马斯克在最近数周内重新调整了 SpaceX 数据中心建设团队，并替换了多名负责相关业务的高管，部分岗位由火箭、卫星互联网业务的管理人员接手。两名知情人士表示，团队重组与 SpaceXAI 现有数据中心面临的工程问题和稳定性问题有关。目前，SpaceXAI 位于田纳西州和密西西比州的数据中心持续出现可靠性方面的挑战。四名知情人士透露，在早期建设 AI 基础设施时，SpaceXAI 为了快速推进数据中心建设，部分设施运行数月后仍未配备备用冷却和供电系统，从而提高服务中断风险。最新调整也让 SpaceX 扩大数据中心规模的时间表更加不确定。两名知情人士表示，过去几个月，SpaceXAI 已经多次推迟在田纳西州孟菲斯基地之外建设新数据中心的计划，其中包括得克萨斯州等地。一名知情人士透露，加入 SpaceXAI AI 基础设施团队的 SpaceX 高管中，就包括曾负责猎鹰和龙飞船火箭生产的前副总裁韦斯利 · 萨兰德罗、SpaceX“星舰基地”发射场产品支持运营负责人洛根 · 麦康奈尔。SpaceXAI 近期还从 Neuralink 引入了一名工程师，帮助处理土木工程事务。SpaceX 发布的招聘信息也显示，公司正在招聘多个土木工程岗位。SpaceX 此前一直把快速建设数据中心的能力视为竞争优势之一，尤其是在 6 月进行首次公开募股之前。截至今年 6 月，SpaceX 旗下已有约 1.4GW 算力投运，预计年底前提升至超过 2GW。马斯克则透露，到 2027 年底，算力还会进一步大幅增加。近几个月，SpaceX 陆续宣布与 Anthropic、谷歌等外部企业达成大型计算资源租赁协议。这些交易推动 SpaceX AI 业务收入在今年第二季度增至 26 亿美元（IT之家注：现汇率约合 175.14 亿元人民币），去年同期为 7.37 亿美元（现汇率约合 49.65 亿元人民币）。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/997/184.htm", "publishedAt": "2026-09-01T15:14:54+00:00"}, {"title": "每周一天，关掉 AI 写代码", "summary": "Carson Gross 决定每周五不写代码。 不是不工作，是不用 AI 辅助写代码。他是 htmx 的创造者，一个以「用 HTML 搞定一切」出名的人，现在他想用一天不碰 AI 来证明另一件事。 这个倡议叫 No AI Fridays。规则很简单：每周挑一天，团队里所有人关掉 AI 编程助手，纯手写代码。你可以用搜索引擎、Stack Overflow、文档——...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502256/no-ai-fridays", "publishedAt": "2026-09-01T11:22:14+00:00"}, {"title": "Omarchy：一个把 AI Agent 写进内核的 Linux，和它引发的争议", "summary": "知名技术网红 DHH 在 37signals 内部孵化了 Omarchy。一个基于 Arch Linux + Hyprland 窗口管理器 + Quickshell 桌面构建套件的 Linux 发行版，口号是「美丽、有趣、由 AI agent 驱动的 Linux」。 项目从 8 月初公开到现在，36.5k GitHub stars，6,308 次提交，1,100 个 fork，第一周下载量超过 10 万。Omacom Foundati...", "sourceName": "开源中国", "sourceUrl const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
