const DATA = {"date": "2026-07-26", "generatedAt": "2026-07-26T02:38:35Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "AI 入侵后，Hugging Face 向 OpenAI 索要 1 亿美元算力", "summary": "IT之家 7 月 26 日消息，当地时间 7 月 21 日，OpenAI 称其内部一款 AI 模型在测试环节中突破沙盒环境，入侵开源 AI 平台 Hugging Face（抱抱脸）的基础设施。随后 Hugging Face 首席执行官克莱门特 · 德朗格（Clem Delangue）决定前往旧金山，与 OpenAI 进行会面。这名 CEO 今天披露了自己向 OpenAI 提出的要求：公开该 AI 模型的全部运行痕迹，并要求 OpenAI 提供价值 1 亿美元（IT之家注：现汇率约合 6.79 亿元人民币）的算力资源，帮助 Hugging Face 加强网络安全防御能力。值得注意的是，德朗格昨天还在旧金山组织了一场小型游行，呼吁外界接受开源权重 AI 模型。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/641.htm", "publishedAt": "2026-07-26T02:25:43+00:00"}, {"title": "因担忧准确性问题，欧美多所高校停用 AI 检测工具", "summary": "IT之家 7 月 26 日消息，据英国《金融时报》报道，美国阿德尔菲大学学生奥赖恩 · 纽比（Orion Newby）因被校方误指控使用 AI 生成论文、违反学术诚信原则，不得不经历一场漫长的维权过程，才最终证明自己的清白。今年 1 月，纽约一家法院判决纽比胜诉。判决书显示，学校采用的 Turnitin AI 检测工具认定其论文“AI 生成概率为 100%”，但纽比提交了其他多款 AI 检测工具的结果，均显示论文由 AI 生成的概率为 0%。尽管如此，校方仍维持学术不端的认定。法院认为，学校未遵循自身的纪律处分程序，也没有给予纽比真正意义上的申诉机会。据IT之家了解，Turnitin 所给出的结果本质上是一个概率评分，意味着系统认为该论文极有可能由 AI 生成。这一判决也再次引发了外界对高校广泛使用的 AI 检测工具可靠性的担忧，并进一步质疑当前整个学术评价体系。随着越来越多学生私下使用 AI 完成作业，高校正面临两难局面。爱丁堡纳皮尔大学研究人员近期针对英国 7 所高校 6600 多名学生开展的一项调查显示，32% 的受访者承认曾在考试或作业中不同程度地违规使用 AI。自 OpenAI 于 2022 年推出 ChatGPT 后，为维护学术诚信，全球众多高校开始引入带有 AI 检测功能的工具，包括 GPTZero、Copyleaks 和 Turnitin。这些工具主要通过分析文章结构、语言节奏等特征，识别是否存在非人类写作模式。然而，它们的准确性，尤其是假阳性率和潜在偏见，正受到越来越多的质疑。因此，包括美国范德堡大学、耶鲁大学、约翰斯 · 霍普金斯大学、西北大学，以及加拿大滑铁卢大学、南非开普敦大学和澳大利亚科廷大学在内的多所高校，已经限制或停止了 AI 检测工具的使用。美国高校协会（AAC&amp;U）数字创新副主席爱德华 · 沃森（Edward Watson）表示，最大的问题在于误判风险。他说：“AI 检测工具在学术诚信调查中最多只能作为辅助参考，教师绝不能把 AI 检测结果当作决定性证据或所谓的‘铁证’。”Turnitin 首席产品官安妮 · 切奇泰利（Annie Chechitelli）则表示，公司始终将 AI 检测结果定位为“调查起点”和“一项参考数据”，而非最终证据。她称，Turnitin 一直与高校合作，帮助解决“过度使用或误用”AI 检测工具的问题。去年，公司还推出了一项新功能，让教师能够查看学生写作过程的演变，而不是仅依据最终提交的论文进行判断。在整个高等教育领域，对 AI 检测工具可靠性的担忧，正推动高校重新设计考核方式。不过，爱丁堡纳皮尔大学“AI 批判性素养”教授萨姆 · 伊林沃思（Sam Illingworth）指出，虽然部分高校已开始增加口头答辩、写作过程记录等考核形式，但仍有不少学校继续依赖 AI 检测工具。英国贝尔法斯特女王大学负责教育事务的副校长朱迪 · 威廉姆斯（Judy Williams）表示：“AI 检测工具并不是解决方案。相关技术仍在发展，误判率可能高得难以接受，而且 AI 生成的内容经过简单修改后就很难再被识别，因此检测结果并不可靠。”她认为：“如果真正希望维护学术诚信，关键在于设计更合理的考核方式。真正应该思考的问题不是‘如何阻止学生使用 AI’，而是‘我们究竟想评估学生的什么能力’。”尽管贝尔法斯特女王大学等高校的态度已经发生变化，但整个行业的政策仍缺乏统一标准。伊林沃思对英国 163 所高校进行的一项研究发现，超过 40% 的学校没有公开可查询的 AI 使用政策。政策不透明也加剧了学生的焦虑。英国高等教育政策研究所（HEPI）2025 年 12 月发布的一项调查显示，在 1054 名受访学生中，有 42% 表示，因为担心被误判为作弊，他们反而减少了 AI 工具的使用。英国高等教育独立裁决办公室（OIA）表示，虽然正式投诉数量仍然不多，但高校内部涉及 AI 学术不端的案件正持续增加。该机构幕僚长亚当 · 沃丁厄姆（Adam Waddingham）表示：“AI 检测工具可以作为证据的一部分，但通常不应单独作为最终裁定依据。”欧洲学生联盟（European Students’ Union）执行委员会成员乌尔舒拉 · 利斯（Urszula Lis）则担心，目前很多 AI 检测系统都是“黑箱”，学生无法知道工具是如何得出结论的。她表示：“更大的问题在于，高等教育是否应该继续依赖这种以检测为核心的模式。我们不希望学术诚信演变成一种监控机制，其唯一目的只是抓学生犯错。”此外，还有研究指出，这类检测工具对英语非母语学生更容易产生误判。斯坦福大学 2023 年的一项广受引用的研究就发现，AI 检测工具更容易将非英语母语者的文章误判为 AI 生成。专门从事科技诉讼的 Crowell &amp; Moring 律师事务所律师约阿希姆 · 施泰因贝格（Joachim Steinberg）表示：“最大的挑战在于，高校的管理规定和纪律处分流程，难以跟上 AI 技术快速发展的步伐。AI 能力不断提升，但许多高校仍在摸索如何建立清晰、一致且公平的政策，这让学生和教师都处于充满不确定性的环境中。”从全球来看，各国和各高校的指导原则仍十分零散。伊林沃思表示：“目前更多取决于具体学校的规定，这令人沮丧，因为行业并没有形成一套公认的最佳实践。”利斯补充说，在欧洲，由于缺乏国家层面的统一指导，也带来了公平性问题：“两名学生即便采用完全相同的方式使用 AI，只因身处不同国家，其中一人可能受到处罚，而另一人却不会。”伊林沃思在研究报告中指出，许多高校的 AI 政策实际上更像是一种合规工具，“它们宣称鼓励批判性思维，却最终变成了审计和留痕机制；口头上说提供支持，实际上却更像是在加强监控。”他说：“真正长久有效的解决方案，是围绕我们希望学生展现的思考能力来设计考核，而不是一味依赖检测工具。”随着 AI 应用日益普及，高校未来面临的真正挑战，或许不是继续强化监督，而是重新界定什么样的 AI 使用方式才属于合理、可接受的范围。帮助学生申请大学的 AI 工具 GradPilot 首席执行官尼尔马尔 · 塔克（Nirmal Thacker）对此表示认同：“我希望大学能够重新思考考核方式，鼓励学生主动披露 AI 使用情况，并制定更加公开透明的相关政策。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/635.htm", "publishedAt": "2026-07-26T01:57:34+00:00"}, {"title": "近 20 亿美元神秘交易落地，特斯拉重金收购 AI 硬件企业", "summary": "IT之家 7 月 26 日消息，特斯拉一笔备受关注的 AI 领域神秘收购终于尘埃落定。在今年早些时候释放出一些暗示之后，公司已正式完成对一家未公开名称的人工智能硬件公司的收购，交易规模接近 20 亿美元。这一消息来自最新披露的监管文件。根据特斯拉最新提交的 10-Q 季度报告，公司已于第二季度完成这笔交易，收购对价为价值 19.5 亿美元（IT之家注：现汇率约合 132.25 亿元人民币）的普通股和股权奖励。特斯拉最初于今年 4 月宣布了这项收购计划，当时披露的交易规模最高可达 20 亿美元。最终完成的 19.5 亿美元交易中，有 17.3 亿美元与业绩目标及服务条件挂钩，另有 2.22 亿美元用于收购一项特定的“专利及相关已开发技术”资产。文件显示，随着相关技术部署达到既定阶段，剩余价值将逐步确认。对于特斯拉而言，收购外部科技公司并不常见。长期以来，特斯拉一直坚持高度垂直整合的发展模式，更倾向于自主研发核心技术。这其中也包括自研 AI 芯片，例如与 SpaceX、英特尔等合作推进的 TERAFAB 项目。纵观公司历史，特斯拉累计收购的企业仅约 10 家，大多数交易都围绕电池技术或制造自动化展开。而此次一次性支付 2.22 亿美元购买专利资产，意味着这家神秘公司掌握着特斯拉无法自行研发，或无法从埃隆 · 马斯克旗下其他企业（包括 SpaceXAI，即原 xAI）获得的关键知识产权。由于监管文件并未披露被收购公司的名称，科技行业对此展开了大量猜测。目前较受关注的一种说法是，这家公司可能是 DensityAI。这是一家由特斯拉 Dojo 超级计算机团队前成员创办的初创企业，专注于开发面向大语言模型推理的专用 AI 加速器和全栈计算系统。另一家被频繁提及的公司是 Atomic Semi。这是一家专注于半导体制造工具和小型晶圆厂技术的初创企业，由知名芯片架构师吉姆 · 凯勒（Jim Keller）联合创立。特斯拉此次选择通过外部收购获取技术，而不是依赖内部研发体系或马斯克旗下其他公司的资源，说明公司可能存在一项非常明确且迫切的硬件需求。这些新获得的知识产权未来可能用于打造 Optimus 人形机器人的定制 AI 芯片，为机器人提供实现实时计算所需的处理能力，从而支撑特斯拉对 Optimus 的长期规划。另一种可能是，这项技术将被应用于下一代 FSD 系统，为实现真正的无人监督自动驾驶提供更强大的计算硬件支持。无论最终收购对象究竟是谁，特斯拉此次不仅获得了关键硬件专利，还将相关技术团队收入麾下，都意味着公司在 AI 战略上的布局正在明显提速。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/625.htm", "publishedAt": "2026-07-26T00:40:51+00:00"}, {"title": "Debian 项目发起议案，讨论是否允许 AI 大模型参与开发", "summary": "IT之家 7 月 26 日消息，Debian 项目开发者本周（7 月 24 日）发起议案，讨论未来是否允许 AI 大语言模型（LLM）开发 Debian。据悉，本次议案共有三个选项：完全禁止大语言模型或其他 AI 工具、允许项目贡献者使用 AI 辅助工作、尽可能拒绝大语言模型和生成式 AI。IT之家附三项提案详情如下：提案 A：完全禁止使用大语言模型提交官方软件代码、文档、公告该提案主张完全禁用大语言模型和生成式 AI 工具，即使是 AI 修改、开发者人工确认也不可行。提案认为，LLM 输出的代码无法确认版权归属，且 AI 大模型训练的数据来源存在争议，很多时候开发者也无法保证 AI 生成代码中完全没有复制版权内容。同时，AI 可能会在生成的代码中使用过时 API、引入废弃写法，不符合 Debian 开发规范。并且 LLM 并不能真正理解代码，它只能根据训练数据预测可能出现的代码组合，因此无法保证生成的结果完全正确。提案 B：允许使用 AI 辅助开发，但开发者必须全权负责该提案将允许开发者使用 AI 工具辅助开发，但必须确保提交的内容可以按照 Debian 许可证进行分发。开发者还需要确保 AI 输出的内容完全符合开源许可证要求，如果包含第三方代码也需要独立确认。此外，即使使用 AI 工具，最终的责任仍将由按下提交按钮的人负责。提交者必须保证代码质量、版权符合标准，不能以 AI 为由免责，并做好“AI 生成”标记。提案 C：在实际可行范围内尽可能拒绝大语言模型该提案认为，大语言模型存在大量问题，不应成为 Debian 的一部分，也不应取代人类。但由于大量开发者已经使用 AI 辅助编程，且大量上游项目可能已经使用 LLM，因此完全禁止 AI 工具和大语言模型已经不可行。该提案要求所有 Debian 贡献者尽可能在工作中避免使用 AI 或 LLM，但如果某些情况下需要妥协，则具体情况具体判断。同时所有内部邮件交流、Bug 报告、文章撰写必须完全由人类完成，不得使用 AI 工具辅助。即使工作需要使用了 AI 工具，该提案也要求开发者披露。项目维护者可自行决定某软件包是否允许 AI 代码，所有人必须遵守，如果违反则可能被处以警告、社区处分等。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/612.htm", "publishedAt": "2026-07-25T23:29:36+00:00"}, {"title": "100%开源！吴恩达做了个个人桌面Agent", "summary": "开源、隐私 et 公布 Q2 财报，上调全年资本支出至最高 2050 亿美元", "summary": "美东时间周三盘后，谷歌母公司Alphabet公布第二季度财报。财报显示，公司第二季度营收、盈利表现均好于预期，其中谷歌云部门实现了近几个季度以来最强劲的增长。 但是，谷歌进一步大幅上调了全年支出预期，预计在强劲的人工智能需求推动下，今年资本支出将在1950亿美元-2050亿美元之间。更令市场担忧的是，该公司历史上首...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/477500", "publishedAt": "2026-07-23T03:48:03+00:00"}]}, {"label": "论文研究", "items": [{"title": "消息称梁文锋不满会谈纪要外流，DeepSeek 暂停第二轮融资", "summary": "IT之家 7 月 26 日消息，彭博社周六援引知情人士消息报道称，DeepSeek（深度求索）已通知第二轮融资的部分潜在投资者，决定暂时中止本轮融资交易，相关融资计划已按下暂停键。报道称，DeepSeek 已口头告知部分潜在投资者，未来几天不会签署投资协议。知情人士表示，DeepSeek 不排除未来重新启动本轮融资流程的可能。DeepSeek 原计划启动新一轮融资，公司估值约为 5000 亿元人民币。此前，公司已顺利完成首轮融资，融资金额约 74 亿美元。报道称，此次暂停融资的部分原因，在于 DeepSeek 创始人梁文锋对网络上传播的一些消息感到不满，这些消息涉及他在公司首轮融资期间与投资者交流时发表的相关言论。IT之家注意到，路透社上周还报道称，DeepSeek 已开始初步研究在科创板上市（IPO）的可行性。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/637.htm", "publishedAt": "2026-07-26T02:11:39+00:00"}, {"title": "特斯拉在智利、哥伦比亚招聘 AI 安全员，为 Robotaxi 出海铺路", "summary": "IT之家 7 月 26 日消息，特斯拉似乎正在悄然为 Robotaxi（自动驾驶出租车）服务走向国际市场做准备。最新发布的招聘信息显示，南美洲有望成为继美国之后，首批上线特斯拉自动驾驶网约车服务的海外地区之一。长期关注特斯拉动态的 X 用户 @tslaming 发现，特斯拉目前正在哥伦比亚和智利招聘 AI 安全运营专员（AI Safety Operator）。这些岗位的主要职责是监督自动驾驶网约车网络的日常运营，同时开展动态数据采集工作。从招聘信息来看，特斯拉正在哥伦比亚波哥大、麦德林埃尔波夫拉多（El Poblado）以及智利圣地亚哥拉斯孔德斯（Las Condes）招聘全职工程岗位。根据职位描述，AI 安全运营专员每天需要驾驶工程测试车辆 6 至 8 小时，采集摄像头和音频数据，撰写驾驶报告，并对软件和设备进行调试。值得注意的是，招聘信息在岗位职责中明确写道，运营人员需要“监督网约车服务的日常运营，包括司机和乘客管理”。尽管这些岗位主要服务于特斯拉 FSD（监督版）团队，重点工作仍是车辆测试和数据采集，但招聘内容中提到的“网约车运营管理”，意味着特斯拉已经开始为当地自动驾驶车队的运营搭建基础架构。IT之家注意到，这一发现恰逢特斯拉在 2026 年第二季度财报电话会议上宣布，其 Robotaxi 车队累计无人监督行驶里程已突破 38 万英里（约 61 万公里）。不过，在公布下一阶段扩张计划时，特斯拉仅提到美国内华达州拉斯维加斯和亚利桑那州菲尼克斯是下一批即将上线 Robotaxi 服务的城市，并未正式公布任何南美市场的计划。这表明，特斯拉在南美的布局仍处于非常早期的验证阶段，目前重点是道路测绘和数据采集，而非即将向公众开放服务。尽管如此，这些招聘信息仍然是 Robotaxi 服务迈向美国以外市场的首个实质性信号。过去一个月，特斯拉持续加快 Robotaxi 在美国的扩张步伐。本月早些时候，公司率先在迈阿密推出无人监督 Robotaxi 服务，随后又将服务扩展至奥兰多和坦帕。与此同时，特斯拉已确认，目前运营中的 Robotaxi 已经开始运行 FSD v15 的早期版本，而公司此前曾表示，大规模扩张 Robotaxi 服务需要等待 FSD v15 准备就绪。随着这一目标已经达成，Robotaxi 网络预计将进一步加速扩张。不过，海外市场的大规模落地仍需要更多时间。随着没有方向盘和踏板的 Cybercab 持续进行公开测试，这款专为自动驾驶网约车打造的新车型未来将逐步取代目前使用的 Model Y Robotaxi，帮助特斯拉更快地在美国乃至全球范围内扩大车队规模。在此之前，特斯拉通过在智利和哥伦比亚采集本地道路数据，可以让 Robotaxi 系统提前学习当地的道路布局、交通规则和驾驶习惯，为未来正式上线服务做好准备。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/621.htm", "publishedAt": "2026-07-26T00:10:17+00:00"}, {"title": "华为 AI 眼镜推送 6.0.0.157 SP2 版本更新，支持“看一下支付宝小蓝环”支付功能", "summary": "IT之家 7 月 25 日消息，华为 AI 眼镜今日推送 6.0.0.157 SP2 版本更新，安装包体积 208.69 MB，带来多项全新功能。IT之家整理如下：【看一下支付】新增支持“看一下支付宝小蓝环”支付功能，看一下设备蓝环轻松付；【AI】AI 快捷键新增“拍照识图”功能，按键即可获取小艺解答（设置路径：华为眼镜 App- 通用设置）；【录像】新增“开始录像”、“结束录像”人声提醒功能；【拍摄】优化视频导入体验；【续航】优化部分场景下的续航；【稳定性】提升系统稳定性；华为 AI 眼镜于今年 4 月发布，售价 2499 元起，该产品采用了全新的轻量化新型材料和精密堆叠技术，镜腿薄至 6.25 毫米，镜架轻至 35.5 克，接近一副普通眼镜的重量。该眼镜内置华为自研 AI 眼镜芯片，号称秒级响应、即问即答，支持语音唤醒、AI 快捷键一键唤醒。功能上，其支持小艺看世界、支付宝看一下支付等。拍摄方面，这款眼镜配备 1/2.8'' 大底传感器，具备 AI RAW 域多帧融合算法，且支持 AI 构图智能矫正、第一人称视角视频直播。同时官宣的还有华为眼镜 App，支持快速配对连接、智慧播报、自动导入、手表协同等功能。续航方面，这款眼镜的综合续航可达 12 小时，支持连续 8 小时语音通话、连续 9 小时音乐播放。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/595.htm", "publishedAt": "2026-07-25T14:25:57+00:00"}, {"title": "“因为AI不再招研究生了！”菲尔兹奖得主转身加盟OpenAI：数学家这份工作很难维持", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/7rHl2bfzSq4kNVPQ9219?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-24T19:30:52+00:00"}, {"title": "新晋菲尔兹奖得主 Tsimerman 官宣加入 OpenAI", "summary": "当地时间 7 月 23 日上午，2026 年国际数学家大会在费城开幕，本年度菲尔兹奖四位得主揭晓——邓煜、约翰·帕登、雅各布·齐默尔曼与王虹。其中邓煜、王虹成为菲尔兹奖自设立以来首批获此殊荣的中国籍数学家。 在赛后新闻发布会上，其中一位新科得主雅各布·齐默尔曼（Jacob Tsimerman）顺势宣布将转向 AI 安全领域研究，...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/478486", "publishedAt": "2026-07-24T07:50:13+00:00"}, {"title": "91% 的 Token 花在读代码上，这套上下文交接术把成本砍掉了四成", "summary": "AI 编程 Agent 的账，大多数人算错了。 Stencil 的 Can Boluk 发了一篇文章，拆开了一份来自 SWE-Bench 基准测试的数据：在 1.81 亿个 token、近 200 万次工具调用中，编辑和写入只占了 9%。剩下 91% 全在阅读——读文件、grep 搜索、查看输出。 换句话说，Agent 的钱不是烧在写代码上，是烧在读代码上。 这个事实意味着...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/478278", "publishedAt": "2026-07-24T02:44:59+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "Agentic-Native 增长：Zilliz 如何用 AI Agent 支撑超线性业务扩张｜AICon深圳", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/w9Xu1REwNa9kLUkjdBJA?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-26T10:00:00+00:00"}, {"title": "维修数据库信息暗示，特斯拉 Model Y 或将新增后置摄像头清洗装置", "summary": "IT之家 7 月 26 日消息，本周，尚未发布的特斯拉焕新版 Model Y 部分硬件组件意外出现在官方维修数据库中。特斯拉官方零件目录新增了与摄像头清洁系统相关的硬件信息，这或许暗示未来车辆将迎来新的升级。“Project Halo”相关零部件意外曝光此次新增的信息出现在特斯拉焕新版（Juniper）Model Y 的电子零件目录（EPC）中。该目录主要供特斯拉官方服务中心、授权钣喷维修中心以及独立维修机构订购车辆维修零部件使用。在新增的“HALO”分类下，目录中出现了一套用于外部摄像头的清洁系统，包括专用雨刷和清洗泵。此外，还新增了“尾门组件、锁扣和灯组”等相关零部件。据IT之家了解，“HALO”这一名称与特斯拉内部的“Project Halo”项目直接相关。该项目旨在将普通版 Model Y 升级，使其能够加入 Robotaxi 自动驾驶出租车网络。根据此前曝光的信息，这项升级包括为后置摄像头增加独立清洗装置，并在后挡风玻璃附近安装一套通信硬件。而此次 EPC 中出现的“尾门组件”，很可能涉及后置摄像头清洗系统所需的内部线束和安装结构，以便与车辆现有系统完成整合。值得注意的是，在相关消息公开后不久，特斯拉便悄悄将加拿大 EPC 数据库中的“HALO”分类及相关零部件全部移除。Robotaxi 扩张，还是普通版 Model Y 即将升级？目前，焕新版 Model Y 已经配备前保险杠摄像头清洗系统，部分新车型甚至还加入了侧面摄像头清洗装置。不过，专门针对后置摄像头的清洗系统，则一直被视为 Robotaxi 车型的重要配置之一。目前，特斯拉用于 Robotaxi 服务的 Model Y 共配备四套摄像头清洗系统，分别对应前保险杠摄像头、后置摄像头、B 柱摄像头以及侧后方（Repeater）摄像头。而即将推出的 Cybercab Robotaxi 更进一步，为每一个外部摄像头都配备了独立喷水装置。由于 EPC 主要面向普通消费者车辆的维修管理，此次这些零部件出现在加拿大数据库中，引发了多种猜测。一种可能是，特斯拉计划在未来一次中期改款中，将摄像头清洗系统作为 Model Y 的标准配置，或提供选装升级方案。另一种可能则是，特斯拉正在为 Robotaxi 服务进入加拿大市场做准备。尽管此前已有一些迹象表明 Robotaxi 将逐步拓展至海外市场，但特斯拉至今尚未公布任何明确的国际化计划。当然，也不能排除这只是特斯拉内部零件目录录入失误。无论原因如何，原本仅出现在 Robotaxi 车队上的摄像头清洁硬件，如今出现在普通消费者车型的官方零件数据库中，都显示出特斯拉正不断将 Robotaxi 技术向量产车型推进。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/615.htm", "publishedAt": "2026-07-25T23:47:42+00:00"}, {"title": "深度对话：AI Agent 真落地，为什么需要 GPU 原生认知数据库？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/video/WKDVJzq0LF6luzNAGwrP?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-24T17:30:28+00:00"}, {"title": "First 超短片，把镜头对准了 AI 够不着的地方", "summary": "如果一切皆可生成，影像的「真实」与「必要」又该被如何重新定义？#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "s const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
