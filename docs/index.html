 "2026-09-22T23:52:22+00:00"}, {"title": "李飞飞谈 AI 安全：不能只让开发者评估自己的系统", "summary": "北京时间 9 月 23 日，据彭博社报道，AI 先锋李飞飞呼吁由独立机构和公共部门对 AI 进行更多监督。她认为，对于能力日益强大的 AI 系统，其安全评估不应完全交由开发这些系统的公司负责。作为斯坦福大学教授、World Labs 联合创始人，李飞飞周二表示，尽管 AI 公司的内部研究人员可以评估单个模型的能力和安全性，但这无法替代由政府、行业和学术机构共同制定的更广泛标准。“我仍然认为，由独立机构以及学术界等公共部门制定基准非常重要。同时，行业和政府也应该共同承担责任。”李飞飞在接受彭博电视采访时表示。随着 AI 系统的能力不断增强，人们对其潜在风险的担忧也在加剧。硅谷一些领导人警告称，这项技术发展速度过快，可能最终超出人类的控制。最近几周，Anthropic CEO 达里奥 · 阿莫代伊 (Dario Amodei) 和 OpenAI CEO 萨姆 · 奥特曼 (Sam Altman) 都呼吁放缓前沿模型的开发速度。两人将于周三在联合国安全理事会讨论 AI 安全问题。李飞飞表示，AI 可能带来的生存性风险，最终取决于人类选择如何开发、治理和使用这项技术。她说，这一原则同样适用于 AI 以外的技术，从电力、蒸汽机到现代交通工具，人类社会同样需要在技术可能带来的益处与人身安全之间寻求平衡。她指出，人类“掌握着技术的力量”。“我们必须掌握控制权。AI 关乎的不是 AI，而是人类。它关乎我们共同以及个人的尊严和自主权，也关乎我们的责任。”李飞飞称。李飞飞的言论，为政策制定者和 AI 行业领袖之间日益激烈的辩论增添了新的声音。这场辩论的焦点是：应如何严肃对待有关这项技术最极端风险的警告。周二早些时候，美国总统特朗普在纽约联合国大会发表讲话时，驳斥了对 AI 生存威胁的担忧，称其为“一场骗局”，并强调有必要继续全速发展这项技术。李飞飞称，关于 AI 系统行为的讨论，已经超出了推动当前 AI 热潮的所谓前沿模型。她创办的 World Labs 公司正在开发所谓的“世界模型”，能够生成和重建三维环境。她表示，这项技术可用于训练和评估机器人，并赋能设计、医疗及其他行业的应用。她表示，随着这些系统走向现实世界应用，行业面临同一个根本性问题：如何评估能力日益强大的 AI，并判断其是否按预期运行。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/026.htm", "publishedAt": "2026-09-22T23:19:32+00:00"}, {"title": "微软推送 Win11 26H1 九月可选更新：任务栏可四边贴靠 / 开始菜单支持“小”尺寸", "summary": "IT之家 9 月 23 日消息，微软今天（9 月 23 日）面向 Windows 11 26H1 推送可选累积预览更新 KB5124006，用户安装后版本号升至 Build 28000.3086。IT之家附上更新日志内容如下：一、任务栏新增任务栏自定义选项，适配不同使用习惯，充分利用屏幕空间。支持自定义任务栏屏幕位置：路径：设置 → 个性化 → 任务栏 → 任务栏行为，可将任务栏放置在底部、顶部、左侧、右侧。切换位置后，悬浮提示、菜单、动画效果会跟随任务栏；小图标、“永不合并任务栏按钮”等绝大多数个性化设置均可正常生效。小型任务栏模式：适合小屏设备，最大化可用显示空间。开始菜单、搜索、系统托盘等组件会同步缩放，保证布局对齐统一。开启路径：设置 → 个性化 → 任务栏 → 任务栏行为 → 显示小型任务栏按钮；设置为“始终”即可缩小图标尺寸与任务栏高度。任务栏设置页的「任务栏行为」分组默认展开，方便快速查找配置项。提升非触控屏设备任务栏系统托盘区域的加载稳定性。二、开始菜单本次更新新增多项设置，优化开始菜单个性化体验：在原有「自动（默认）」之外，新增小 / 大两种开始菜单布局。配置路径：设置 → 个性化 → 开始 → 开始菜单大小。开始菜单以及系统设置页面内，原“推荐”板块正式更名为「最近」。支持隐藏开始菜单内的用户名与头像。开关路径：设置 → 个性化 → 开始 → 在“开始”菜单隐藏我的姓名和个人资料图片。为各个板块增加独立开关，可分别控制「固定」「最近」「所有应用」板块的显示或隐藏。三、搜索简化搜索主页面界面，减少视觉干扰，便于快速访问历史搜索记录。优化搜索结果来源标识（区分应用、设置、本地文件、网页结果、微软商店内容），让用户清楚点击后跳转目标。新增设置项：设置 → 隐私和安全性 → 搜索，可控制本地结果是否同步展示网页、微软商店建议内容。Windows 将自动对高频访问文件夹建立索引，提升文件搜索命中率。可在「设置‑隐私和安全性‑搜索‑自动查找更多匹配位置」中管理该功能。四、文件资源管理器资源管理器主页加载速度提升，整体交互响应更流畅。主页的精选内容轮播区域支持触摸滑动手势，浏览轮播文件更加便捷。五、系统 UI 设计统一更新全系统进度条样式，覆盖开机、登录、重启、关机、系统更新等场景，界面风格更加现代统一。六、共享对话框使用工作 / 学校账户登录的用户，可直接在共享窗口查找并安装应用。可通过设置 → 系统 → 共享 → 在共享体验中显示建议应用控制该功能开关。七、管理员保护（Admin Guard）Windows11 全新平台安全功能，用于保护管理员账户，采用即时按需提权机制，保留完整管理员操作能力。该功能默认关闭；可在 Windows 安全中心的账户保护板块、Intune 的 OMA‑URI 配置或者组策略中启用，完整部署需要多步配置流程。八、虚拟桌面优化虚拟桌面之间切换动画，切换更加流畅迅速。九、显示与图形提升设置‑系统‑显示页面的浏览与交互稳定性。修复关闭省电模式后，屏幕亮度设置无法保留的问题。十、任务管理器优化任务管理器中应用日志信息展示的稳定性。十一、Windows 安装流程Windows 安装阶段，若不需要额外键盘布局，现在可以直接跳过键盘选择步骤。优化「入门」应用，新增「安装应用」「固定网站」「主题」页面，帮助用户完成设备个性化设置，了解系统新特性。十二、Windows 更新设备手动进入睡眠状态后，完成系统更新会自动回到睡眠状态，即便系统自动睡眠选项被设置为“永不”也可生效。十三、应用更新该版本支持通过 Windows 更新推送应用更新；兼容的应用可享受更智能调度、更精简的更新流程，底层依托 Windows 更新编排平台（UOP）实现。十四、Microsoft 微软商店支持具备管理员权限的 WinUI3 打包应用实现应用内购买，开发者可以借助微软统一商务平台提供付费购买能力。十五、Windows Autopilot 设备预准备面向企业组织：设备正式注册入网前即可完成可信设备识别，支持设备专属策略、企业设备自动注册，以及开箱体验（OOBE）阶段的深度自定义。十六、Microsoft 执行容器（MXC）新增进程隔离能力。MXC 是一套轻量高速安全框架，面向 AI 编码智能体、模型生成代码这类业务负载。十七、智能体进程平台层面新增智能体进程标签预览支持。授权组件可向进程 Token 写入不透明智能体标识符；Windows 会保护该标签，并自动向下传递给子进程。十八、密码学除已有的混合密钥交换组外，用户现在可以将后量子加密算法 ML‑KEM 单独用于 TLS 密钥交换流程。十九、网络优化日语环境下，netsh wlan show wlanreport 命令输出内容的展示效果。二十、输入提升日语输入法文本输入可靠性，降低卡顿概率。修复语音输入的自动标点、启动器相关设置无法保存的问题。二十一、WMIC（Windows 管理规范命令行工具）自 2026 年 8 月起，Windows11 24H2、25H2 将不再内置 WMIC 工具。全新安装系统中已经默认移除 WMIC，也不再作为按需功能（Feature on Demand）提供。本次变更仅针对 WMIC，底层 WMI 服务不受影响，仍可正常使用。二十二、辅助功能与本地化优化智能裁切（Intelligent Carveout）界面的无障碍访问与易用性，同时完善全部支持语言与地区的翻译质量。二十三、文件历史记录修复文件历史记录无法向外置驱动器、网络位置备份 / 还原文件的问题；即便备份驱动器正常连接，系统也会错误弹出「重新连接驱动器」提示的故障已得到修复。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/023.htm", "publishedAt": "2026-09-22T23:02:56+00:00"}, {"title": "微软推送 9 月 Win11 24H2/25H2 可选更新：支持 Emoji 17 等", "summary": "IT之家 9 月 23 日消息，微软昨日（9 月 22 日）发布博文，面向 Windows 11 24H2 和 &nbsp;25H2 系统，推送 9 月可选更新 KB5124010，用户安装后版本号升至 26100.9550 和 26200.9550。更新内容方面，包含功能调整、稳定性修复和兼容性改进。微软官方提醒 24H2 家庭版及专业版用户，将于 2026 年 10 月 13 日结束支持；企业版和教育版支持持续至 2027 年 10 月 12 日。IT之家附上更新日志如下：一、文件资源管理器调整互联网下载文件的预览窗格行为：HTML 文件预览会弹出风险提示，新增「仍然预览」按钮，确认警告后即可查看；PDF 等非 HTML 格式文件可直接在预览窗格自动打开。资源管理器主页现在可以记忆各个板块的折叠 / 展开状态，再次打开会保留上次浏览布局。提升详情窗格内云文件缩略图预览的可靠性；同时重新排布详情窗格布局，方便查找、浏览文件属性。修复点击地址栏右侧边缘进入编辑模式时，地址栏内容被意外清空的故障。二、Emoji 表情完整支持 Emoji 17.0，新增扭曲脸、扬尘特效、毛茸茸生物等全新表情；按下快捷键 Win + . 调出表情面板即可选用。对部分已有表情做细节设计微调，提升跨平台显示一致性。三、小组件新增「使用技巧」小组件，提供 Windows 实用功能快速指引。添加方式：打开小组件面板 → 添加小组件 → 选择「使用技巧」；锁屏显示：设置 → 个性化 → 锁屏界面，将「使用技巧」添加至锁屏小组件列表。四、个性化设置优化「设置‑个性化‑背景」页面运行稳定性。桌面壁纸新增支持 DIB 格式图像。改善新建账户下桌面幻灯片切换的稳定性。调高个性化背景选择界面的缩略图分辨率。修复竖屏显示器设备下，设置内桌面背景预览显示异常问题。快速切换多张壁纸时，系统处理壁纸变更的可靠性得到提升。支持多桌面共用幻灯片壁纸，避免系统自动强制切回单张图片模式。五、蓝牙蓝牙经典音频配件通话过程中，直接操作配件本体音量按键，电脑会弹出音量弹窗，直观反馈当前音量变化。优化外设断开后的连接状态上报准确度。修复管理蓝牙、音频设备时，「设置‑蓝牙和设备」页面崩溃问题，提升页面稳定性。解决蓝牙硬件模块实际已关闭，但设置内开关仍显示为开启的 bug。提升蓝牙音频整体稳定性、兼容性；改善部分经典蓝牙音频配件麦克风适配表现。修复蓝牙音频流播放时触发错误代码 0x139 的系统崩溃故障。增强 LE Audio（低功耗蓝牙音频）设备使用可靠性；优化「共享音频」功能稳定性。六、辅助功能新增设置项打开应用时自动最大化，开启后程序启动会直接最大化窗口，无需手动调整。该功能适用于讲述人、放大镜、平板模式，也适合习惯全屏工作的用户。开启路径：设置 → 辅助功能 → 视觉效果，打开「打开应用时自动最大化」开关。七、放大镜工具更新放大镜工具栏 UI，图标适配 Windows 11 设计语言，界面更加简洁现代；调整内边距、行间距，布局规整度提升；原有全部功能不变：视图模式、缩放控制、快捷键、朗读功能均保留原有逻辑。八、设置优化「设置‑蓝牙和设备‑打印机和扫描仪」页面交互稳定性。更新「设置‑应用‑已安装应用」界面：打包应用会在列表顶部显示版本号，与其他应用展示逻辑统一。设置内时间选择控件适配 12/24 小时制切换，主动跟随系统时间格式，适用场景包含活动时间配置、夜间模式定时等。修复「允许多个应用同时使用相机」设置无法保存的问题。九、触控板单指滚动：可沿触控板左右边缘单指滑动实现垂直滚动。自动滚动：手指靠近触控板边缘滚动，或加大按压力度按住不放，即可持续滚动无需抬起手指（需要硬件支持）。2026 年 7 月更新已同步上线滚动速度、缩放、加速滚动相关调节选项。十、Copilot 快捷键新增按键重映射选项，可将 Copilot 按键改设为右 Ctrl 键或者上下文菜单键，保留传统键盘快捷键操作习惯，适配辅助使用场景。十一、照片库备份在「设置‑主页」与「账户」页面新增照片库备份配置项，可将手机拍摄的照片、视频自动备份至 OneDrive 云端。十二、字体Ebrima 字体新增对 Garay、Beria Erfe 文字体系支持，Garay 来自 Unicode 16.0，Beria Erfe 来自 Unicode 17.0；持续扩充 Windows 非洲文字书写系统支持能力。优化 Ebrima 字体中 Adlam 文字字形，对齐最新 Unicode 标准，视觉一致性更好。十三、Windows 恢复环境（WinRE）新增网络能力：WinRE 可自动复用主系统已保存的 Wi‑Fi 配置文件，包含证书认证 Wi‑Fi 网络。此前恢复环境仅可自动连接有线无认证以太网、预配置 Wi‑Fi；WPA2/3 Wi‑Fi 需要手动输入密码，更新后恢复流程可直接调用本机保存的 Wi‑Fi 信息。新增远程恢复管理插件，面向 MDM 设备管理服务商扩展 WinRE 管控能力。十四、自助服务终端（Kiosk）模式受限 UI 自助终端模式下，禁用快捷键 Win + Tab。单应用自助终端模式下，禁用 Win + A、Win + C 快捷键。十五、Windows 备份移除电脑到电脑直接迁移数据功能：该功能用于新电脑初始化时，直接从旧电脑迁移文件与配置。迁移新设备请改用 Windows 备份应用完成文件、设置备份还原。十六、电源与电池修复笔记本接通电源状态下，系统误判从交流电切换至电池供电，带来的显示与性能异常问题。十七、通用问题修复（面向全部用户）相机：修复内置相机在相机应用及其他调用相机程序中停止工作的故障。文件历史记录：修复文件历史记录无法向外置驱动器、网络位置备份 / 还原文件；驱动器正常连接却错误提示「重新连接驱动器」的问题。十八、系统监控 Sysmon修复可执行文件头部校验缺陷：残缺、损坏文件会造成内存异常占用，篡改检测结果不可靠。修复 Sysmon 文件系统过滤驱动缺陷：监控文件时若归档目录无法打开，关闭未初始化句柄会引发绿色死机（GSOD）。修复进程篡改检测误报：Sysmon 错误对 Windows 会话管理器 smss.exe 生成 ID 25 告警事件。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/021.htm", "publishedAt": "2026-09-22T22:48:51+00:00"}, {"title": "“超级”在哪里？高通第六代骁龙 8 超级至尊版 / 至尊版芯片规格对比", "summary": "IT之家 9 月 23 日消息，夏威夷时间 9 月 22 日 9 点（北京时间 9 月 23 日 3 点）召开的 2026 骁龙峰会上，高通正式宣布推出第六代骁龙 8 超级至尊版和第六代骁龙 8 至尊版两款芯片。IT之家查询高通官网规格资料，附上两款芯片的差异如下：项目第六代骁龙 8 至尊版Snapdragon 8 Elite Gen 6第六代骁龙 8 超级至尊版Snapdragon 8 Elite Extreme Gen 6CPU定制 Oryon CPU，64 位，2 个主核最高 5 GHz；官方称 CPU 性能提升 10%、能效提升 37%。定制 Oryon CPU，64 位，2 个主核最高 5 GHz；官方称 CPU 性能提升 13%。GPU 性能与能效Adreno GPU；官方称性能提升 35%、能效提升 40%。Adreno GPU；官方称性能提升 44%、能效提升 40%。GPU 架构特性支持硬件光追与 Lumen 全局光照、Nanite 虚拟几何；未列出 Matrix Cores 和 Neural Fusion。增加 Adreno Matrix Cores、Adreno Neural Fusion、MegaLights，并支持 AI 超分、帧生成及图像重建。NPU / 生成式 AI重构 Hexagon NPU，官方称性能提升 14%；AI Engine 每瓦性能最高提升 20%。Hexagon NPU 官方称速度提升 35%、每瓦性能最高提升 33%；增强型 Sensing Hub 的设备端 AI 学习性能最高提升 85%。Sensing Hub双核 AI 处理器、双常开摄像头、双 Micro NPU、Personal Scribe。规格页列出的 Sensing Hub 基础功能相同，但官方额外宣称其性能更高。视频拍摄Elite Color Engine、Motion Intelligence 与 Intelligent Pixel Control，强调降噪、稳定与像素级优化。Elite Color Engine、Intelligent Pixel Control，并明确支持 8K60、4K240，以及三颗 6400 万像素摄像头。游戏体验支持 Snapdragon Elite Gaming 特性、Game Quick Touch 3.0，以及 12 GB Adreno High Performance Memory。以 Neural Fusion、矩阵核心、AI 超分和帧生成作为重点，面向更接近主机级的画质与能耗表现。音频Snapdragon Sound，最高 24-bit/96 kHz 无损流媒体，支持 XDT 高带宽传输。增加 AI Voice Bubble（人声与环境声分离）、AI 音频分离实时混音 / 编辑、Spatial Audio Renderer 与更低延迟头部追踪。5G 基带X105 5G Modem-RF；下行最高 14.8 Gbps、上行最高 4.2 Gbps；支持 NTN 卫星通信、4x4 Sub-6 MIMO。同为 X105；下行最高 14.8 Gbps、上行最高 4.2 Gbps；支持 NTN，4x4 Sub-6 MIMO。Wi-Fi / 近距连接FastConnect 8800，Wi‑Fi 8/7/6，4x4 Wi‑Fi，320 MHz、4K QAM，峰值约 11.65 Gbps。FastConnect 8800，Wi‑Fi 8/7/6，4x4 Wi‑Fi，320 MHz、4K QAM，峰值约 11.6 Gbps。开发图形 APIOpenCL 3.0 FP、OpenGL ES 3.2、Vulkan 1.4。OpenCL 3.0 FP、OpenGL ES 3.2、Vulkan 1.4。第六代骁龙 8 超级至尊版和第六代骁龙 8 至尊版两款芯片在日常使用性能方面差别不大，两款芯片的 CPU 最高频率、X105 5G 基带、蜂窝制式、Wi‑Fi 8/7/6 支持、FastConnect 8800、无线峰值速率和图形 API 均相近或相同。相比较至尊版，第六代骁龙 8 超级至尊版主要增强 AI 性能，在 Adreno GPU 方面增加 Matrix Cores 和 Neural Fusion，从而增强 AI 超分辨率、帧生成、图像重建等，并能在本地运行 300 亿参数的 AI 模型。影像方面，第六代骁龙 8 超级至尊版还支持 8K 60fps 视频录制和 4K 240p 超高清慢动作拍摄，并支持全新的高级专业视频（APV）编解码器，实现专业级录制效果。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/016.htm", "publishedAt": "2026-09-22T22:07:09+00:00"}, {"title": "手游画质将迎新突破，高通第六代骁龙 8 超级至尊版强化支持虚幻引擎 5", "summary": "IT之家 9 月 23 日消息，夏威夷时间 9 月 22 日 9 点（北京时间 9 月 23 日 3 点）召开的 2026 骁龙峰会上，高通公司宣布在其第六代骁龙 8 超级至尊版芯片上，强化支持虚幻引擎 5（Unreal Engine 5）支持。高通为了提升 AI 渲染、超级分辨率与帧生成效果，为第六代骁龙 8 超级至尊版芯片的 Adreno GPU 配备了专用 Adreno Matrix Cores，并推出 Adreno Neural Fusion 技术。IT之家附上相关截图如下：Adreno Neural Fusion 可以认为是适配第六代骁龙 8 超级至尊版芯片的“DLSS 4”画质增强技术，在同一条图形渲染管线中整合神经网络处理、AI 超级分辨率和 AI 帧生成，目标是在提升画质和帧率的同时，降低渲染负载与功耗。游戏不必始终以最高分辨率渲染，而是先以较低分辨率生成画面，再利用 AI 恢复细节、提升清晰度，并生成额外帧，从而兼顾画质与流畅度。Adreno Neural Fusion 的硬件基础是 Adreno Matrix Cores，这是首次在 Adreno GPU 内加入面向 AI 计算的专用核心，用于直接运行图形相关的神经网络模型。对于手游玩家而言，未来可以在搭载骁龙芯片的旗舰手机上，进一步增强 Nanite 虚拟化几何体、Lumen 全局光照、实时阴影以及高分辨率材质等特性。高通称，Adreno Neural Fusion 已支持 Unity 和 Unreal Engine 5，开发者不必完全从零构建自己的 AI 超分辨率方案。对虚幻引擎 5 游戏而言，在高通新款旗舰芯片上，可能带来三方面价值：更高画质：在较低内部渲染分辨率下，尽量保持纹理、光照和几何细节。更高帧率：通过 AI 超分辨率减少原生渲染压力，并利用帧生成提高视觉流畅度。更低功耗：减少 GPU 像素处理和系统内存访问，延长移动游戏续航。虚幻引擎 5（Unreal Engine 5，简称 UE5）是 Epic Games 开发的实时 3D 引擎，提供了一套完整工具，让开发者能够创建、渲染和交互式运行三维世界：从模型、材质、光照，到角色动画、物理、音频、人工智能和多人网络，都可以在同一个引擎中完成。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/012.htm", "publishedAt": "2026-09-22T21:18:13+00:00"}, {"title": "预填充吞吐超 330 Token/s：高通携手阶跃等为第六代骁龙 8 超级至尊版端侧适配 300 亿参数 AI 模型", "summary": "IT之家 9 月 23 日消息，夏威夷时间 9 月 22 日 9 点（北京时间 9 月 23 日 3 点）召开的 2026 骁龙峰会上，高通宣布携手阶跃、无量火及江波龙，基于第六代骁龙 8 超级至尊版移动平台，端侧适配与推理优化阶跃 StepEdge-Omni 30B-MoE 模型，并现场演示相关智能体助手。该模型拥有 300 亿参数，依托混合专家架构，仅根据任务需要激活部分专家模块，以降低计算量和内存带宽需求。合作方通过推理引擎、异构调度及存储方案优化，让模型运行内存需求较行业常规方案降低超过 50%，并支持在智能手机上稳定运行。高通表示，该方案无需调用云端服务，可以在本地完成邮件理解、行程规划、日历同步、航班及酒店推荐、行程分享和邮件草拟等任务。测试数据显示，模型预填充吞吐性能超过每秒 330 个 Token，解码吞吐性能超过每秒 28 个 Token。IT之家注：“模型预填充吞吐性能是指大语言模型在推理的预填充（prefill）阶段，每秒能够处理的输入词元（token）数量，是衡量系统处理长提示词（prompt）和批量请求能力的关键指标。业内人士认为，大参数 MoE 模型在手机端的部署，有助于推动低时延和隐私保护型智能体应用发展。不过，实际规模化应用仍取决于终端成本、功耗、模型可靠性及用户接受度等因素。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/008.htm", "publishedAt": "2026-09-22T20:40:27+00:00"}, {"title": "从生成内容到创造体验，多模态大模型如何改变内容生产？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/rNHK14OsBl5CgSpMoTPq?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-22T20:12:00+00:00"}, {"title": "高通骁龙芯片将整合 HBC 架构：手机本地运行 AI 更快、更省电", "summary": "IT之家 9 月 23 日消息，夏威夷时间 9 月 22 日 9 点（北京时间 9 月 23 日 3 点）召开的 2026 骁龙峰会上，IT之家带来前方现场报道，高通宣布将会向骁龙芯片下放 HBC 技术。IT之家注：HBC 全称为 High Bandwidth Compute，直译为“高带宽计算”，于 2026 年 6 月召开的投资者日上公开，最初面向数据中心产品，在本次活动中宣布未来将会应用于骁龙芯片。该架构是一种近内存计算（near-memory computing）架构，将计算芯片放置在堆叠式 LPDDR DRAM 下方，通过 3D 集成和硅通孔（TSV）缩短数据传输距离，目标是缓解 AI 推理中的“内存墙”问题。对于普通用户而言，高通骁龙芯片未来如果整合 HBC 架构，手机能够更快、更省电地运行更大的端侧 AI 模型，而且可以在本地运行更多 AI 功能。目前限制手机端 AI 的瓶颈，不再仅是 NPU 的乘加计算能力，还考验模型参数和中间数据在内存与处理器之间搬运的速度。HBC 通过把部分计算放到内存附近，减少数据来回移动，有望降低延迟和内存功耗。高带宽内存本身不等于更大容量，但如果 HBC 同时提高有效带宽、减少数据搬运，并改善每瓦性能，手机就有机会运行参数量更大、上下文更长的模型。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/003.htm", "publishedAt": "2026-09-22T19:56:20+00:00"}, {"title": "OpenAI 发布 GPT-6 Sol 和 Luna 模型，API 价格大降 50%", "summary": "IT之家 9 月 23 日消息，OpenAI 今日发布 GPT-6 系列模型的最新成员 GPT-6 Sol 和 GPT-6 Luna。OpenAI 官方表示，两款模型采用与 GPT-6 Astra 类似的方法进行训练，将 Astra 在专业工作、事实性、编码、计算机使用和对齐等方面最先进的性能带入更快、更经济的模型。GPT-6 Sol 和 Luna 模型的 API 价格相比 GPT-5.6 促销价降低 50%。不过 OpenAI 官方也表示，GPT-6 Astra 依然是其整体上最优秀的模型，如果你想要最佳效果和无妥协的体验，还是建议选择 GPT-6 Astra。性能方面，在 AutomationBench 的跨应用业务流程测试中，GPT-6 Sol 在 xhigh 强度下表现优于 Claude Opus 5，成本仅为 Opus 5 每任务成本的 9%。在 high 强度下，GPT-6 Luna 比前代提升了 5.4%，且每项任务成本降低了 58%。在评估智能体的 Last Exam 测试中，GPT-6 Sol 在 max effort 状态下得分为 56.4%，高于 Claude Opus 5 在评估中的最高分，每任务成本也降低 60%。在事实可靠性方面，GPT-6 Sol 和 Luna 模型也取得进展。在 OpenAI 基于去标识化的真实世界对话中，GPT-6 Sol 的错误率约为前代的一半，接近 Astra 级可靠性且成本更低。GPT-6 Luna 的事实可靠性也迎来大幅提升，同时成本更低。编程方面，GPT-6 Sol 和 Luna 均针对 AI Coding Agent 工作负载进行了优化。在 FrontierCode 1.1 Main 测试中，GPT-6 Sol 相比 GPT-5.6 Sol 有明显提升，并以更低成本达到与 Claude Fable 5.1 xhigh 相当的水平。在 DeepSWE v1.1 软件工程测试中，GPT-6 Sol 在 max effort 下取得 68.8% 的成绩，距离 Claude Fable 5 的最高成绩 69.9% 仅差 1.1 个百分点，而单任务成本低约 80%。GPT-6 Luna 在 max effort 下取得 66.6%，表现接近 Opus 5 和 Fable 5 的 medium effort，同时单任务成本分别低约 93% 和 96%。计算机操作能力方面，OpenAI 表示 GPT-6 Astra 仍然是其在计算机操作方面最强的模型，但 Sol 和 Luna 相比上一代模型能够以更低成本完成相关任务。在 OSWorld 2.0 offline 测试中，GPT-6 Sol 在 xhigh effort 下取得 60.5% 的成绩，与 Claude Opus 5 medium effort 的 60.3% 接近，而单任务成本约低 80%。GPT-6 Luna max effort 则超过 GPT-5.6 Sol medium effort，同时成本约为后者的十分之一。OpenAI 还将 GPT-6 Astra 改进后的沟通风格带到了 Sol 和 Luna。官方认为新模型在技术和编程对话中会更清晰、使用更少的术语、更少奇怪的措辞、更少的低价值细节，以及缩短整体回答，同时不会失去实质内容。除了价格降低，OpenAI 还帮助基于 GPT-6 的开发者在应用重复利用的上下文部分节省更多费用。官方改进了 GPT-6 的提示缓存，默认提供更高的缓存命中率，帮助智能体重用更多上下文，实现更快响应。此外，GPT-6 Sol 和 Luna 在价值对齐方面也有提升，在 OpenAI 官方的对齐评估中，Sol 和 Luna 都相较于 GPT-5.6 版本有所改进，包括关于其编码工作的误导性声明发生率降低。IT之家从 OpenAI 公告获悉，GPT-6 Sol 和 GPT-6 Luna 自今日起已在 ChatGPT Work 和 Codex 中向所有 Plus、Pro、Business、Enterprise 和 Edu 用户开放。免费用户和 Go 用户可以在桌面应用中使用 GPT-6 Luna。这些模型目前还没有在 Chat 中提供。在 OpenAI API 中，它们以 gpt-6-sol 和 gpt-6-luna 的形式提供。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/001.htm", "publishedAt": "2026-09-22T19:25:16+00:00"}, {"title": "Anthropic 发布 Claude Opus 5.5 模型：性能媲美 Fable 5.1，运行成本比 Opus 5 低 40%", "summary": "IT之家 9 月 23 日消息，Anthropic 今日正式发布了 Claude Opus 5.5 模型，这是其全新 Claude 5.5 家族的首个模型，宣称在大多数工作上表现可媲美 Claude Fable 5.1，运行成本比 Opus 5 低 40%。IT之家从 Anthropic 公告获悉，具体来看，Claude Opus 5.5 模型有以下提升：性能方面，Opus 5.5 比 Opus 5 有了很大提升，官方宣传早期测试者在最复杂的工作中看到性能大幅提升。一名测试人员在不到一天内完成了 68 万行代码迁移 —— 这一任务本应耗时数周。Opus 5.5 擅长发现并修复软件中的低效程序 —— 当官方要求它将网页应用的每个页面缩短加载时间时，Opus 5.5 在 40 次尝试中成功了 39 次，而 Opus 5 仅仅做了一些小改进，也改变了应用的行为。另一位测试者让多个 Claude 模型根据单一提示构建游戏，Opus 5.5 凭借其画面和精致度获得了高于其他任何模型的评分。安全方面，Opus 5.5 在 Anthropic 的自动化行为审计中取得了迄今为止所有模型中最高的分数，该套件在数千个模拟场景中测试 Claude。它比其他最近发布的模型采取难以逆转的行动或超出既定界限的概率更低，且比 Opus 5 更能抵抗被提示注入。官方还扩大了对齐测试范围，涵盖更长的任务、不可能完成的任务以及基于真实事件的场景。由于 Opus 5.5 在生物学和网络安全领域与 Claude Mythos 5.1 相当，官方部署时采取了类似于 Claude Fable 5.1 的防护措施。经过审核的机构今天就可以申请生命科学验证项目，使用 Opus 5.5 进行生物学研究。未来几周，Anthropic 还将扩大对网络验证项目的访问，认证的网络安全从业者将能够使用 Opus 5.5 进行工作。成本和速度方面，Opus 5.5 所需的计算量比 Opus 5 少，其定价也反映了这一点。官方测试显示，默认设置下，Opus 5.5 在典型工作负载下的成本比 Opus 5 低 40%。Opus 5.5 的输出速度也比 Opus 5 快 30% 以上。输入和输出 Token 的价格分别为 4 美元 / 百万 Token 和 20 美元 / 百万 Token，比 Opus 5 低 20%。缓存命中的价格为 0.20 美元 / 百万 Token，比 Opus 5 低 60%。除了降价外，Anthropic 还放宽了 Pro、Max、Team 等企业套餐的使用时间限制，还为订阅用户提供速率限制重置功能，现在客户可以随时保存和使用。沟通交流能力上，Opus 5.5 的沟通比之前的模型更自然。早期测试者发现其文字更清晰易懂，它把最重要的信息放在最前面，在长时间训练中成为更好的工作伙伴。正如一位早期测试者所说：“它的写作方式和我一样。”Claude Sonnet 5.5 和 Claude Haiku 5.5 将在未来几周推出，性能、效率和安全性方面也有许多相同的改进。在 Anthropic 官方的基准测试中，Claude Opus 5.5 在智能编码、计算机使用和知识工作方面保持领先。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/005/998.htm", "publishedAt": "2026-09-22T18:55:08+00:00"}, {"title": "Meta 开源 Astryx：面向 Agent 的 React 设计系统", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/He6bUhlNIuPEa99GGRYC?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-22T15:12:00+00:00"}, {"title": "华为云码道面向鸿蒙开发者升级：上线鸿蒙编码大模型，覆盖开发到编译全流程", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/jCdqhiUJHJlVgOYGfWGx?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-22T11:22:09+00:00"}, {"title": "让 gzip 当语言模型？压得最小的地方，就是它“觉得”最像原文的地方", "summary": "Nathan Barry 提出了一个脑洞实验：能不能让 gzip 当语言模型？不要神经网络、不要训练参数，就用你操作系统里那个现成的压缩器——拿语料喂进它的滑动窗口，给个正常提示词，让它在\"怎么压最省\"的驱动下继续往下生成。结果真的能出字符，虽然远谈不上通顺，但它确实\"知道\"语料里的一些东西，比作者预期的多得多。 理论根...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502676/gzip-lm", "publishedAt": "2026-09-22T11:04:27+00:00"}, {"title": "基元律动韩凯：从多模型调度到反馈闭环，探索Agent持续进化", "summary": "9月22日，在2026杭州云栖大会企业级Agent实践峰会上，基元律动联合创始人兼CTO韩凯发表演讲《从Harness到R ，据日经新闻报道，三菱重工美国公司董事长兼 CEO Takao Tsukui 9 月 21 日在纽约接受采访时表示，受美国人工智能数据中心建设需求推动，从 2026 年 1 至 6 月的订单进度看，全球燃气轮机需求预计与 2025 年持平或更高，全年有望再次超过 100 吉瓦。他预计，这一强劲需求将延续至 2027 年。报道称，三菱重工是全球三大发电用燃气轮机制造商之一，与 GE Vernova、西门子能源并列。其主力产品是用于燃气轮机联合循环（GTCC）电厂的高效超大型 J 型涡轮机。据三菱重工统计，2025 年全球燃气轮机需求达到 2000 年以来最高水平。由于全球减碳趋势，火电设备曾被视为夕阳业务，但 AI 普及推高电力需求，燃气轮机订单正在三菱重工积压。Tsukui 表示，目前的订单积压量“异常庞大，处于历史最高水平”，尤其是 2029 至 2030 年交货的产品，排期相当紧张。与此同时，燃气轮机合同价格同比上涨约 20%。他解释，劳动力成本和原材料价格变化迫使价格上涨，供应链影响显著，利率上升也是一个因素。竞争对手同样受益。川崎重工董事长 Yoshinori Kanehana 告诉日经新闻，中小型涡轮机的订单已积压到约 5 年后。数据中心和氢能产生的强劲需求增加了新客户问询，川崎重工难以跟上订单节奏。为满足持续增长的需求，制造商正在加速资本投资。三菱重工计划到 2030 财年将大型燃气轮机产能较 2024 财年翻倍，将在日本和美国的生产基地投入超过 1000 亿日元（合 6.35 亿美元）。高盛估计，美国数据中心电力需求预计将在 2027 年增至 66 吉瓦，是 2025 年 31 吉瓦的两倍以上。但报道也指出，数据中心建设在一些州遭遇反对，并已成为美国中期选举的议题，施工计划的修订和延迟也频繁出现。Tsukui 表示：“需要社会接受，才能让人们理解 AI 将对他们的生活产生多大的积极影响。”针对一些 AI 开发公司呼吁更严格监管和安全措施，Tsukui 称，所有公司都清楚 AI 必须是安全的产品，行业正在增长，短期内对投资没有担忧。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/032.htm", "publishedAt": "2026-09-23T00:04:57+00:00"}, {"title": "小米推出米家筒灯 / 射灯 3 Pro 新品：国补价 129.2~169.2 元", "summary": "IT之家 9 月 23 日消息，小米新上架了三款米家灯具新品。IT之家汇总如下：米家筒灯 3 Pro，首发价 152 元，国补价 129.2 元米家射灯 3 Pro，首发价 176 元，国补价 149.6 元米家筒灯 3 Pro 人在感应版，首发价 199 元，国补价 169.2 元活动期间晒单评价满足要求可返 10 元京东红包，预约且前 3 名购买用户还可获赠筒灯 3 Pro。米家筒灯 3 Pro 采用弧面一体设计，无缝贴合天花板，简约隐于无形；采用米家定制全光谱灯珠，显色指数高达 Ra97，通过光生物安全豁免级测试，无可视频闪。米家筒灯 3 Pro 升级为 12W 大功率，光通量相较上一代提升 65% 达到 660lm，全系亮度大幅提升，空间照明更明亮清晰；同时支持色温亮度无极调节，色温覆盖 2700K~5700K，满足多场景照明需求，还采用缓开缓灭设计，避免瞬时强光刺激，呵护用眼健康。这款产品采用深杯防眩设计，光源深藏 45mm，能够有效遮挡光源，减轻用眼疲劳；同时筒灯升级 80° 大光束角，减少暗区与阴影，全屋照亮更通透，满足日常多场景照明需求。散热方面，米家筒灯 3 Pro 采用优质铝材散热器，搭配鳍片式散热结构，大幅增加散热面积，实现高效散热，保障产品长久运行稳定可靠。智能体验方面，该产品搭载全新升级小米 Mesh 2.0 模组，相较小米 Mesh 1.0 连接性大幅提升，组网规模更大，多设备响应更快、更稳定，支持灵活分组控制、快速配网及远程自动 OTA 升级。用户可通过米家 App 对多灯进行分组控制，一键操控开关、切换情景模式。米家筒灯 3 Pro 系列支持贴心夜灯模式，低亮光线柔和舒适，晚上起夜不摸黑，也不会打扰家人睡眠，使用更安心。同时支持小米澎湃智联，可通过蓝牙 Mesh 网关与多个设备互联，定制专属智能联动场景，支持语音控制，打造全屋智能生活。人在感应版额外搭载 24G 雷达光感检测，可实现人来自动亮灯、人走自动关灯，搭配灯组同开同灭功能，可实现整组灯光同时响应，更加省心节能，适合安装在玄关、过道、衣帽间等位置。京东米家小米筒灯 3 PRO 全光谱护眼 嵌入式超薄 家用客厅走廊过道孔灯 129.2 元直达链接2026 年数码家电政府补贴持续进行中，IT 之家为大家汇总国补领券地址，买数码家电之前记得领取。数码补贴：点此领券手机 / 平板 / 3C 数码支持 8.5 折政府补贴，不超过 6000 元的产品至高立减 500 元。家电补贴：点此领券多类家电支持 8.5 折政府补贴，单品至高补贴 1500 元。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/031.htm", "publishedAt": "2026-09-22T23:59:56+00:00"}, {"title": "全球最快移动 CPU：高通官宣小米、vivo、红魔、REDMI 等率先适配第六代骁龙 8 超级至尊版", "summary": "IT之家 9 月 23 日消息，夏威夷时间 9 月 22 日 9 点（北京时间 9 月 23 日 3 点）召开的 2026 骁龙峰会上，高通宣布小米、vivo、红魔、REDMI、OPPO 等（按官方新闻稿排序）手机品牌将率先适配第六代骁龙 8 超级至尊版 / 至尊版芯片。高通官方表示小米、vivo、红魔、REDMI、OPPO、一加、Motorola、iQOO、荣耀等（按照官方新闻稿排序）全球领先 OEM 厂商和智能手机品牌，将率先在其旗舰产品中采用第六代骁龙 8 超级至尊版和第六代骁龙 8 至尊版移动平台，其中第六代骁龙 8 超级至尊版官方宣传为“全球最快移动 CPU”。IT之家援引新闻稿内容，高通技术公司高级副总裁兼手机业务总经理 Chris Patrick 表示：今天我们迎来了重要里程碑，发布两款而非一款全新旗舰移动平台，带来即时、个性化且具备自适应能力的智能体 AI 体验。随着智能体 AI 时代持续演进，我们的多旗舰策略有助于扩展移动体验的边界，同时将最新的 AI 创新技术引入更广泛的旗舰终端中。通过打造两款创新的平台，我们为 OEM 厂商提供更丰富的选择，并共同塑造下一代智能、个性化移动体验的能力上限。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/014.htm", "publishedAt": "2026-09-22T21:43:35+00:00"}, {"title": "全球最快移动 CPU：高通发布第六代骁龙 8 超级至尊版芯片，CPU 行业首超 5GHz、GPU 性能提升 44%", "summary": "IT之家 9 月 23 日消息，夏威夷时间 9 月 22 日 9 点（北京时间 9 月 23 日 3 点）召开的 2026 骁龙峰会上，高通公司宣布推出第六代骁龙 8 超级至尊版移动平台和第六代骁龙 8 至尊版移动平台，官方表示这是“全球最快移动 CPU”。高通称两款产品面向“智能体人工智能”时代的移动终端需求，主要应用于下一代旗舰智能手机。IT之家援引博文介绍，第六代骁龙 8 超级至尊版定位为其性能最强的移动平台之一，重点提升终端侧人工智能、移动游戏和影像处理能力。其中，平台搭载的 Adreno Neural Fusion 技术可利用人工智能辅助图形渲染；结合高级专业视频编解码器和智能像素控制技术，平台还可支持更复杂的场景理解及影像处理。第六代骁龙 8 至尊版同样采用 2 纳米制程工艺，并配备定制版 Qualcomm Oryon 中央处理器、Adreno 图形处理器和 Hexagon 神经网络处理器。高通表示，该平台将在更广泛的旗舰机型中支持人工智能、游戏、影像和连接等功能。CPU 方面，高通宣布第六代骁龙 8 超级至尊版的最高主频超过 5.0GHz，性能提升 13%、能效提升 37%、响应速度提升 15%。GPU 方面，高通宣布 Adreno GPU 性能提升 44%，能效提升 40%。高通技术公司高级副总裁兼手机业务总经理 Chris Patrick 表示，公司此次同时推出两款旗舰移动平台，旨在为手机制造商提供更多产品选择，并推动个性化、自适应的智能体人工智能体验进入更多旗舰终端。小米、vivo、红魔、REDMI、OPPO、一加、Motorola、iQOO 和荣耀等手机品牌将率先在相关旗舰产品中采用上述平台。高通表示，两款移动平台将陆续进入相关终端产品。具体机型、上市时间及市场售价，仍由各手机厂商另行公布。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/004.htm", "publishedAt": "2026-09-22T20:14:43+00:00"}, {"title": "阿里千问平板 Qwen Book 现身 2026 骁龙峰会，定位原生 AI 智能体电脑", "summary": "IT之家 9 月 23 日消息，夏威夷时间 9 月 22 日 9 点（北京时间 9 月 23 日 3 点）召开的 2026 骁龙峰会上，IT之家带来前方现场报道，在活动的宣传视频中，高通展示了阿里千问平板 Qwen Book。根据目前曝光的细节，Qwen Book 是一款智能体原生电脑，外观方面更接近于平板，项目仍处于早期阶段，主要侧重于办公室工作，集成 Qwen3.8-Max 和 Qwen3.8-Flash。IT之家此前报道，这款产品确定名称为 QwenBook，宣传语为“你的第一台‘原生智能体电脑’”，形态为平板 + 键盘触摸板的组合设计，组成类似笔记本的使用体验。QwenBook 平板机身部分配备 Type-C 接口，可外接扩展坞，下方键盘部分配备大面积触摸板。QwenBook 的整体系统界面类似苹果 macOS，有一行 App 底栏，应用窗口位置随意可调，还能随时唤醒千问对话，应用中心包含钉钉、阿里云盘等阿里旗下 App。官方人员向IT之家确认新机系统基于安卓打造。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/002.htm", "publishedAt": "2026-09-22T19:39:12+00:00"}, {"title": "不受控的 Agent ，凭什么上生产系统？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/3TjH8fZziNB50Qzz9tJx?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-22T18:58:07+00:00"}, {"title": "Agent时代，CPU的价值该重估了", "summary": "CPU与GPU趋近1∶1", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/494430.html", "publishedAt": "2026-09-22T15:46:54+00:00"}, {"title": "从 AI 工具到经营智能体：快手分销增长 Agent 实践", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/7suOC8BJWYA4yx6dvZXa?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-22T14:32:17+00:00"}, {"title": "直播预告：未来两三年，哪些工业AI场景会率先爆发？", "summary": "从真实工厂到产品复制，再到生态和下一批机会，两位嘉宾会把工业AI从「能用」走向「规模化」的关键问题一层层拆开。", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/494420.html", "publishedAt": "2026-09-22T14:28:59+00:00"}, {"title": "光帆携手韶音，以 AI OS 破局单点功能内卷", "summary": "好 AI，不必自己造。#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1681475?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-09-22T10:10:26+00:00"}, {"title": "复杂业务 Agent 的持续进化：快手电商导购的 Harness Loop 实践｜QCon上海", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/jeG84GGVYvIHaQKQfIo2?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026- /www.infoq.cn/article/ihH1ltOG7d2YCelYKJYe?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-21T18:21:03+00:00"}, {"title": "森海塞尔 MOMENTUM 5 体验：AI 时代的稳重选择", "summary": "耳机依旧是耳机，只是如今一副好耳机既要足够好听，也要能够接住你的声音。#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1681181?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-09-21T02:24:43+00:00"}, {"title": "Termexo v0.10.4 发布：集成 Grok Build，修复会话 Git 变更归零", "summary": "Termexo v0.10.4 已发布。新版将 Grok Build 纳入现有 AI 编程终端工作台，并修复长时间使用后会话代码变更显示为 0、Git 面板变空的问题。 Grok Build 加入工作台 安装并登录 Grok Build CLI 后，Termexo 可以检测它、在工作区中启动终端、列出并恢复会话，也可以在任务看板中选择 Grok Build 执行任务。它与 Claude C...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502594", "publishedAt": "2026-09-19T17:18:46+00:00"}]}, {"label": "论文研究", "items": [{"title": "谷歌前安全负责人：AI 对儿童的伤害恐超社交媒体", "summary": "北京时间 9 月 23 日，据路透社报道，谷歌信任与安全团队的创始人汤姆 · 西格尔 (Tom Siegel) 在本周呼吁放缓 AI 发展，并警告称，科技行业正在重蹈社交媒体时代的覆辙，可能对儿童造成更大的伤害。目前，社交媒体公司正因为被指控伤害年轻用户而支付巨额赔偿并面临数千起诉讼。与此同时，世界各国政府正努力限制未成年人访问社交媒体平台。路透社去年曾独家报道了 Meta 的一份内部政策文件。文件称，其聊天机器人可以“与儿童进行浪漫或情色对话”，由此引发了国会调查。即便如此，监管措施仍未能跟上 AI 飞速发展的步伐。西格尔曾担任谷歌信任与安全副总裁，他对路透社表示：“就 AI 正在对儿童造成的影响而言，我们目前的处境非常糟糕。那种认为行业能够在没有外部帮助的情况下自行解决问题的想法，是不现实的。”他的担忧，反映了一些科技行业人士和学术研究者日益加深的恐惧：AI 对儿童构成的威胁比社交媒体更为深层。而当下，整个行业正竞相为聊天机器人添加越来越先进的功能，而数百万年轻人已经在日常使用这些机器人。西格尔周二宣布，他已加入儿童网络安全倡导组织 Common Sense Media。这家成立于 2003 年的非营利组织致力于开展研究，并评估各类媒体对儿童的适宜性。今年 5 月，该组织成立了青少年 AI 安全研究所，这是一个旨在评估儿童使用 AI 情况的研究机构，西格尔将担任该研究所的首任执行主任。Anthropic 以及控制 OpenAI 的非营利组织 OpenAI 基金会，都是该研究所的支持方。西格尔表示，他计划制定相关标准，以此对 AI 公司进行问责，并希望与这些公司及第三方组织合作来实现这一目标。他此前于 2004 年至 2019 年在谷歌工作，但后来认为科技行业在为消费者打造安全网络空间方面的能力已经“陷入瓶颈”，于是离开谷歌。随后，他共同创办了 TrustLab，这是一家开发工具帮助企业发现安全威胁的创业公司。本月早些时候，他卸任 CEO 一职，转而担任新职务。西格尔表示，目前，各大 AI 公司正在向儿童推出各种功能，却没有建立足够的安全防护措施。“我认为，我们正在面临非常、非常严重的伤害风险。”他说。西格尔称，AI 公司可以立即采取一些措施，更好地保护年轻人，并列举了从自杀、精神错乱到“认知卸载”等一系列风险。所谓认知卸载，是指因依赖 AI 来回答问题而导致批判性思维能力下降。他说，Anthropic 和 OpenAI 可以实施更严格的年龄验证措施，阻止未成年人使用其聊天机器人。他还表示，他的前雇主谷歌完全可以在其搜索引擎中增加关闭 AI 概览和 AI 模式的选项，就像目前已经提供开关，让用户过滤色情内容一样。西格尔补充称，虽然这些措施短期内可能会影响使用量或利润，但不采取行动的 AI 公司将面临诉讼和监管的风险，这可能对其业务造成更严重的打击。对于西格尔的上述言论，谷歌发言人回应称，家长可以通过相关控制功能，完全关闭孩子使用搜索引擎的权限。这名发言人说：“我们的 AI 搜索功能对儿童和青少年来说是一种非常有用的方式，可以帮助他们学习、探索并理解信息和这个世界。”OpenAI 发言人表示，除了用户自报年龄外，该公司还使用“账户和行为信号”来识别未成年用户。“虽然没有任何单一的年龄验证方法是完美的，但我们会持续测试并改进这些系统，包括防范绕过安全防护的尝试。”该发言人称。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/036.htm", "publishedAt": "2026-09-23T00:12:56+00:00"}, {"title": "2799 元起，华为 WATCH 6 系列鸿蒙 AI 手表今日开售", "summary": "IT之家 9 月 23 日消息，华为 WATCH 6 系列鸿蒙 AI 手表今日 10:08 正式开售，售价 2799 元起。IT之家汇总如下：华为 WATCH 642mm 版：2799 元起（国补价 2379.15 元起）46mm 版：2899 元起（国补价 2464.15 元起）华为 WATCH 6 Pro43mm 版：3499 元起（国补价 2999 元起）46mm 版：3599 元起（国补价 3099 元起）华为 WATCH 6 46mm 版本提供天青蓝、苍穹黑配色，采用球面蓝宝石玻璃、316L 不锈钢材质；42mm 版本提供凝霜白、晨曦金、幻月黑配色，采用航空级铝合金材质。华为 WATCH 6 系列搭载 HarmonyOS7，带来腕上鸿蒙 AI 助手。小艺建议适配鸿蒙手机，支持重要短信识别及排序。健康方面，新品联合上海交通大学医学院附属瑞金医院上海市高血压研究所，带来更灵活的 24 小时高血压风险评估；AI 健康解读，支持多维数据综合解读、异常变化精准洞悉、个性化改善建议。华为还带来全新的华为 WATCH 6 Pro 46mm，提供太空探索、木星棕、钛空银配色，43mm 版本则提供陶瓷白、星芒白配色。京东 HUAWEI WATCH 6 系列 2799 元起（国补价 2379.15 元起）直达链接", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/006/019.htm", "publishedAt": "2026-09-22T22:41:29+00:00"}, {"title": "摩托罗拉 Signature 27 旗舰真机首秀，搭载高通第六代骁龙 8 超级至尊版芯片", "summary": "IT之家 9 月 23 日消息，在北京时间 9 月 23 日凌晨的 2026 高通骁龙峰会现场，高通公司宣布推出第六代骁龙 8 超级至尊版移动平台和第六代骁龙 8 至尊版移动平台，官方表示这是“全球最快移动 CPU”。摩托罗拉移动全球产品营销负责人兼执行总监 Nicole Hagen 宣布：“摩托罗拉很高兴进一步拓展与高通技术公司的合作，并首次在旗舰产品系列中采用第六代骁龙 8 超级至尊版。这一重要里程碑将帮助我们为全球消费者带来更强大的终端侧 AI 能力、更出色的性能以及更高品质的用户体验。凭借第六代骁龙 8 超级至尊版，我们将打造面向未来的新一代智能手机，更好地满足用户不断变化的需求。”IT之家在 2026 高通骁龙峰会现场获悉，摩托罗拉 Signature 27 旗舰手机将搭载第六代骁龙 8 超级至尊版芯片，Nicole Hagen 在现场展示了 Signature 27 真机。摩托罗拉 Signature 27 采用了斜坡过渡的机身后盖设计，背部镜头模组部分可以看到 5 个圆圈，其中 4 个为摄像头、1 个为闪光灯，Signature 27 将搭载 2 亿像素影像传感器。软件方面，Signature 27 将支持 7 年系统升级，还配备了谷歌 Gemini。除此之外，Signature 27 网页的源代码中可以找到一段 \"Crystals by Swarovski logo\" 的注释，这意味着该机很可能会引入施华洛世奇水晶装饰版本。作为参考，2026 款 Signature（Signature 26）手机配备 6.8 英寸屏幕，基于高通第五代骁龙 8 处理器，配备 5200mAh 电池，质量 186g，规格类似国内市场发售的 moto X70 Air Pro。" const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
