const DATA = {"date": "2026-08-27", "generatedAt": "2026-08-27T04:12:06Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "黄仁勋驳斥“循环融资”质疑：AI 行业需要巨额资金，英伟达投资风险很低", "summary": "IT之家 8 月 27 日消息，英伟达 CEO 黄仁勋当地时间周三为公司日益深入参与人工智能行业融资进行了辩护。他反驳了外界关于英伟达向其他 AI 公司提供资金支持，是为了人为推高自身营收增长的批评。在英伟达公布好于预期的季度业绩后不久，黄仁勋在 CNBC《Mad Money》节目中表示：“我认为他们忽略了一个非常重要的问题。”“这是第一代需要数百亿美元融资才能发展起来的初创公司。”黄仁勋继续说道，“上一次有人听说一家初创公司需要数十亿美元才能起步、还需要数百亿美元才能实现盈利，是什么时候？这种情况过去从来没有发生过。但这正是 AI 行业的特点。开发 AI 的成本、部署 AI 的成本都非常高，这是一个高度资本密集型行业。”凭借在 AI 热潮中的核心地位，英伟达目前积累了大量现金。作为 ChatGPT 等大型语言模型背后所需 AI 芯片的主要供应商，英伟达从这轮 AI 浪潮中获得了巨额收入。公司随后利用这些资金投资 AI 产业链上的多家公司，从 OpenAI、Anthropic 等 AI 模型开发商，到向客户出租英伟达芯片算力的“新型云”（neocloud）服务商，均有涉及。不过，英伟达近年来越来越多地利用自身强大的资产负债表，为数据中心项目提供资金支持。其中包括为美国俄亥俄州一座正在建设的大型算力园区提供 1,050 亿美元（IT之家注：现汇率约合 7,074.71 亿元人民币）资金支持，OpenAI 将成为该园区的租户。英伟达近期还宣布与华尔街多家大型金融机构合作，为数据中心筹集最高 5,000 亿美元（现汇率约合 3.37 万亿元人民币）融资。尤其是最新一轮交易，引发了市场对英伟达为 AI 产业提供金融支持的更多担忧。批评者认为，这种做法越来越像一种“循环融资”，并将其与互联网泡沫时期一些最终失败的融资安排相提并论。所谓“循环交易”，是指一家公司向客户提供资金，而客户随后又使用其中一部分资金购买这家公司的产品。这种安排容易引发外界质疑，即相关融资是否人为支撑了市场需求和销售额。在接受 CNBC 主持人吉姆 · 克莱默（Jim Cramer）采访时，黄仁勋表示，这些融资安排反映的是打造前沿 AI 公司所需要的前所未有的巨额资本。黄仁勋表示，英伟达希望成为这些顶尖 AI 公司的股权投资者，同时也愿意在必要时提供更广泛的支持。“有几家公司，也就是这些前沿 AI 实验室，是一代人才能遇到一次的公司，我们希望成为它们的投资者。我们希望支持它们，希望成为它们的合作伙伴。当然，我们也非常希望它们能够建立在我们的技术之上构建自己的生态系统，并与我们一起扩大业务。因此，在它们早期阶段获得投资机会，是一个非常好的机会。”与此同时，黄仁勋表示，在当前 AI 基础设施建设阶段，这些公司自身的财务状况并不足以让它们通过借贷获得所需的额外资金来购买算力。“它们还没有达到投资级别。它们没有足够的经营记录、资本记录和财务记录，因此无法以较低成本获得或锁定资金。而这正是英伟达能够提供帮助的地方。”黄仁勋说。对于英伟达可能因为被投企业经营困难而最终承担损失的担忧，黄仁勋也予以反驳。他表示，英伟达的计算基础设施可以在不同客户和不同工作负载之间重新部署，因此公司对任何单一投资的风险敞口都是有限的。“我们投入的资金将带来非常可观的回报。”黄仁勋补充道，“我认为风险很低。”英伟达周三公布的最新业绩进一步增强了黄仁勋对市场基础需求的信心。在 2027 财年第二季度，英伟达实现季度营收 962 亿美元（现汇率约合 6,481.78 亿元人民币），同比翻番以上；其中数据中心业务营收同比增长 117%，达到 890 亿美元（现汇率约合 5,996.66 亿元人民币）。英伟达同时预计，2028 财年营收将增长约 70%。财报公布后，英伟达股价在盘后交易中上涨约 4%。不过，今年以来该股累计涨幅仅约 12%，反映出投资者对 AI 交易整体前景的担忧正在增加。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/994/943.htm", "publishedAt": "2026-08-27T03:47:34+00:00"}, {"title": "Qwen3.8-Flash 发布：125B MoE，激活 6B，训练成本仅前代的 1/9", "summary": "阿里通义千问团队正式发布 Qwen3.8-Flash。 发布公告有一组让人需要停下来看两眼的数据： 125B 总参数 + 51B N-gram Embedding，每 token 只激活 6B 参数。原生支持 262K 上下文，可通过 YaRN 扩展到 1M。相比 Qwen3.7-Plus，训练开销仅为其 1/9，编码和办公任务上却有更强能力。 这代模型在架构上有四个值得关注的变化：...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502145/qwen3-8-flash-next", "publishedAt": "2026-08-27T03:39:05+00:00"}, {"title": "智谱正式上线并开源 GLM-5.3-Flash：320B 模型打到 Opus 4.8 水平，定价只要 1/40", "summary": "「前沿智能」这四个字长期以来只跟一个词绑定在一起：贵。 不是没有便宜的大模型。但便宜往往意味着降级——参数小一号、能力差一截、在某些任务上能省则省。而智谱今天开源的 GLM-5.3-Flash（320B-A18B），正在挑战这个假设。 这是一组关键数据：320B 总参数，18B 激活参数，在 Artificial Analysis 的 AA 综合智能指数...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502144", "publishedAt": "2026-08-27T03:06:36+00:00"}, {"title": "黄仁勋回应 OpenAI 首款自研 AI 芯片挑战：英伟达提供“截然不同”服务", "summary": "IT之家 8 月 27 日消息，金融媒体 marketwatch 今天（8 月 27 日）发布博文，报道称在英伟达最新财报电话会议上，公司 CEO 黄仁勋回应 OpenAI 首款自研推理芯片 Jalapeño，表示英伟达正在打造的东西与 OpenAI 的自研芯片“截然不同”。IT之家此前报道，OpenAI 公开首款定制 AI 推理芯片 Jalapeño 的测试结果，DeepSeek R1 每瓦 AI 吞吐量是 GB300 的 1.7 倍。数据显示，该芯片在单位功耗处理的工作量（能效比）以及响应速度两项关键指标上，均超越了英伟达现有的 GB300 处理器。在美国当地时间 2026 年 8 月 26 日的第二季度财报电话会议上，黄仁勋回应表示：我们正在打造一种截然不同的东西。英伟达提供的不仅是单一芯片，更是一个覆盖整个 AI 生命周期的完整 AI 工厂平台。用户可以在任何云环境中使用这一平台，这与专门针对单一模型、特定推理场景的定制化 ASIC 芯片有本质区别。我有 100% 的信心，我们的技术对他们（OpenAI）而言将继续是卓越的。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/994/904.htm", "publishedAt": "2026-08-27T02:57:38+00:00"}, {"title": "谷歌 AI 责任团队将被移出 DeepMind，员工担忧安全评估独立性受损", "summary": "IT之家 8 月 27 日消息，据《华尔街日报》看到的一封内部邮件，谷歌正在将一支专门研究人工智能风险及其社会影响的团队从谷歌 DeepMind 调离。谷歌 DeepMind 是该公司负责开发前沿 AI 模型的研究机构。两名现任 DeepMind 员工表示，这次汇报关系的调整引发了团队部分成员的担忧，他们认为此举可能对团队的研究工作产生负面影响。这次调整发生在谷歌 DeepMind 近期重组之后，在此次重组中，DeepMind 联合创始人兼首席执行官德米斯 · 哈萨比斯（Demis Hassabis）卸任 CEO，转而担任新设立的董事长一职。从下周开始，这支约有 90 人的“AI 责任”团队将并入谷歌的全球事务部门，该部门负责代表整个公司开展游说以及公共政策事务。IT之家注意到，此次人员调整是谷歌更大范围组织架构变化的一部分，此举旨在让谷歌 DeepMind 与谷歌其他部门实现更紧密的整合。谷歌于 2014 年收购了 DeepMind，此后 DeepMind 一直以半自主的方式运营。哈萨比斯在新职位上将主要负责对外事务以及 AI 领域的宏观议题，而接替他担任 DeepMind 负责人的是科拉伊 · 卡武库库奥卢（Koray Kavukcuoglu）。不过，卡武库库奥卢的职位名称将是高级副总裁，而不再是 CEO。“GDM 正在转向一种更典型的 PA 架构，也就是将中央团队放到谷歌的中央部门中。”负责 AI 责任团队的谷歌 DeepMind 副总裁海伦 · 金（Helen King）在发给团队成员的内部邮件中写道。这里的 PA 指的是“产品领域”（Product Area），谷歌用这个词来称呼谷歌搜索等业务部门。包括人力资源和政策事务在内的其他团队也将从 DeepMind 转移到谷歌的中央部门。《时代》杂志此前曾报道称，谷歌正在考虑重组 DeepMind 的部分安全团队。随着外界对 AI 影响的审视不断加强，以及围绕这项技术的反弹情绪日益升温，AI 责任团队的一些员工已经在内部留言板讨论和会议中向管理层表达担忧。他们认为，这次调整可能会削弱团队开展独立研究的能力。据知情人士透露，AI 责任团队包括多个研究小组，其中一些负责测试谷歌 AI 模型在化学、生物、放射性和核领域可能存在的风险，另一些则研究人们与 AI 互动的方式，以及聊天机器人可能产生的心理影响。员工担心，团队离开 DeepMind 后，将无法像过去那样深入了解开发 Gemini AI 模型的团队正在进行哪些工作，也可能减少与这些团队的接触机会，从而影响他们发现和确定相关研究课题的能力。谷歌发言人在一份声明中表示：“谷歌内部有多个团队都在开展 AI 安全和 AI 责任方面的工作。通过让 AI 责任团队更加紧密地协作，我们正在进一步增强这些团队为模型和产品安全提供支持的能力。”谷歌的全球事务部门还包括公司中央的信任与安全团队。其他 AI 安全团队仍将留在谷歌 DeepMind 内部，其中包括负责模型行为、隐私和安全等领域的团队。海伦 · 金一直在努力向员工保证，此次调整不会影响团队日常工作的开展，也不会改变团队的使命。她在邮件中表示，团队仍将重点关注负责任 AI 领域的新兴议题和前沿问题，同时，通过论文和活动等方式对外分享研究成果“仍将得到支持，并且依然十分重要”。她还表示，团队将继续获得 DeepMind 的访问权限，并保留现有的计算资源和人员编制。“德米斯仍然非常重视负责任 AI，也仍计划参与相关工作。”金在邮件中写道。知情人士表示，此次重组预计将于 9 月初正式生效。在调整正式实施之前，一些员工曾希望转入那些仍将留在 DeepMind 的研究团队，但遭到了拒绝。知情人士还透露，在讨论此次调整的会议上，管理层已经承认，此举可能导致部分 DeepMind 员工转而寻求其他 AI 实验室的职位。过去几个月，DeepMind 已经有多名顶尖研究人员离职。与此同时，该公司的旗舰 AI 模型在编程等能力方面已经落后于 Anthropic 和 OpenAI 的模型。本月早些时候，自谷歌 AI 项目早期阶段起就一直担任核心人物的杰夫 · 迪恩（Jeff Dean）离开公司，并与另外三名 DeepMind 资深研究人员共同创办了一家初创公司。今年夏初，DeepMind 两名最知名的研究人员诺姆 · 沙泽尔（Noam Shazeer）和约翰 · 朱姆珀（John Jumper）也分别离开公司，前者加入 OpenAI，后者加入 Anthropic。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/994/901.htm", "publishedAt": "2026-08-27T02:56:05+00:00"}, {"title": "JeecgBoot V3.9.5 重磅发布：AI Flow、Online 全面升级，安全与性能再进阶", "summary": "前言 JeecgBoot V3.9.3 刚刚完成 Spring Boot 4 架构大升级，不到一周，V3.9.5 又接踵而至。这次并非简单修补，而是一次集中升级：Online 表单新增多数据源和外部填报，代码生成器模板大幅增强，AI 应用与 AI Flow 在模型接入、知识库、流程编排、分享 Token 和访问限流等方面全面提升，同时新增飞书集成和 OpenAPI 日志...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502143", "publishedAt": "2026-08-27T02:48:58+00:00"}, {"title": "工业Agent不是“套壳”大模型！西门子百年经验灌进工业AI", "summary": "西门子Xcelerator与普通软件货架最本质的区别。货架解决的是「把产品卖出去」，西门子Xcelerator要解决的是「让产品在真实工业场景中持续生长」。", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/480005.html", "publishedAt": "2026-08-27T02:46:35+00:00"}, {"title": "Perplexity AI 推出 Portable Computer 本地智能体应用", "summary": "IT之家 8 月 27 日消息，Perplexity AI 当地时间 25 日宣布推出 Portable Computer。这是其 Perplexity Computer 多模型编排智能体数字员工的本地化版本，可实现私密的工作流，仅在需要时才调用云端算力。IT之家了解到，Portable Computer 搭载 Qwen 3.8 27B 或经 Perplexity AI 后训练 PPLX 27B 模型。Perplexity 正在开发经过微调的 Nemotron 3.5 Lightning 变体，以实现超快速响应。Portable Computer 将率先支持运行 Linux 操作系统的 DGX Spark，对于 Windows 操作系统和 GeForce RTX / RTX Pro 独立显卡 PC 的支持将很快到来。相关阅读：《Perplexity Computer 下月将拆分 AI 任务，隐私和算力各走一边》《Perplexity Computer 上线：多模型协同自动完成工作流，月费 200 美元》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/994/885.htm", "publishedAt": "2026-08-27T02:36:00+00:00"}, {"title": "OpenAI 前研究员巴雷特 · 佐夫重返谷歌，助力 Gemini 研发", "summary": "IT之家 8 月 27 日消息，巴雷特 · 佐夫（Barret Zoph）今年曾因与 Thinking Machines Lab 首席执行官米拉 · 穆拉蒂（Mira Murati）发生分歧而突然离职，并转投 OpenAI。如今，这位 Thinking Machines Lab 联合创始人再次换了东家。Alphabet 旗下谷歌宣布，佐夫将加入公司，出任研究副总裁。佐夫本科毕业于南加州大学信息科学研究所自然语言小组，2016 年入职 Google Brain 从事大语言模型研究，2022 年 8 月加入 OpenAI 参与 ChatGPT 研发，负责后训练团队日常管理及基础模型产品化部署。2024 年 9 月 26 日宣布从谷歌离职，加入 Thinking Machines Lab，担任联合创始人及首席技术官。2026 年 1 月，佐夫从 Thinking Machines Lab 离职，回归 OpenAI。“我们期待巴雷特回到谷歌，并将他在强化学习（RL）和后训练方面的专业经验带到 Gemini 团队。”谷歌发言人托马斯 · 舍恩菲尔德（Thomas Schoenfelder）在一份声明中表示。佐夫于今年 1 月离开 Thinking Machines Lab，当时与他一同离职的还有联合创始人卢克 · 梅茨（Luke Metz）以及另一名员工萨姆 · 舍恩霍尔茨（Sam Schoenholz）。三人随后都加入了 OpenAI，在加入 Thinking Machines Lab 创业之前，他们三人都曾在 OpenAI 工作。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/994/859.htm", "publishedAt": "2026-08-27T02:18:05+00:00"}, {"title": "小鹏图灵 AI 第三颗芯片点亮，超级智能体上车", "summary": "IT之家 8 月 27 日消息，小鹏汽车宣布图灵 AI 第三颗芯片正式点亮，超级智能体上车。今天 15:00，小鹏将举行物理 AI 分享暨第二代 VLA 全新版本体验日。据介绍，小鹏第二代 VLA+VLM 跨域融合，拥有跨域总调度、原生多模态、端侧大模型；座舱语音架构重构，支持语音靠边停车、就近泊入、模糊导航和复杂行程规划，能听会看，善推理、会表达。一个大脑管理全车，一句话就能控车。IT之家注意到，小鹏汽车于 2024 年 8 月宣布自研图灵芯片流片成功，40 核心可运行 30B 参数 AI 大模型。小鹏汽车还表示，经过深度定制，图灵芯片算力可达到 100% 极致利用，未来 AI 汽车将搭载至少 3 颗图灵芯片。今年 3 月，小鹏汽车董事长、CEO 何小鹏在财报电话会议上透露，自 2025 年三季度量产上车以来，图灵芯片累计出货量已超过 20 万片。公司预计，今年二季度起全系车型（IT之家注：含 Max 版本）将切换至自研图灵芯片，全年出货量目标接近 100 万片。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/994/838.htm", "publishedAt": "2026-08-27T01:38:46+00:00"}, {"title": "亚马逊 AWS 宣布 2027~2028 年额外部署 200 万块 NVIDIA GPU", "summary": "IT之家 8 月 27 日消息，Amazon AWS（亚马逊云科技）在与 NVIDIA 的联合新闻稿中宣布，计划在 2027~2028 年期间向其全球基础设施额外部署 200 万块 NVIDIA GPU。AWS 此前已在今年 3 月的 GTC 2026 承诺了 100 万块的 NVIDIA GPU 部署规模。新公告使得总 GPU 部署规模提升到 300 万块。AWS 还将导入 NVIDIA Groq LPU。AWS 还将在自有云服务中提供基于 NVIDIA Vera CPU 的基础设施、将自有芯片与 NVIDIA NVLink Fusion 和 NVHBM 集成。双方还围绕人工智能在工厂、网络互连、模型、物理领域存在合作关系。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/994/836.htm", "publishedAt": "2026-08-27T01:36:20+00:00"}, {"title": "豆包输入法新增超级互传，可在设备间互传复制的文本和图片", "summary": "IT之家 8 月 27 日消息，豆包输入法近日迎来安卓 1.4.2 和苹果 iOS1.5.2 版本更新，带来超级互传、智能文字整理等多项功能，并更换全新品牌 Logo。IT之家整理更新内容如下：新增「超级互传」，登录同一账号后可在设备间互传复制的文字和图片；新增「智能文字整理」功能，可对输入内容做智能排版、精炼、润色、纠错；更换品牌 Logo，视觉焕新；修复 Obsidian 中语音时偶现的内容丢失问题。豆包输入法于去年 11 月上线，支持豆包同款语音输入。IT之家附官方功能说明：语音输入：使用豆包同款语音大模型，语音输入又快又准，支持多方言、英语及中英混输；快速说话、轻声说话均可精准识别，无网弱网环境下也能流畅使用，同时提供点击输入、长按输入等多种操作方式。可以选择麦克风一直保持，保持后使用语音不用跳转，支持空格“按住说话”，在不跳转时可“一键发送”。提供了 9 键、26 键、26 键双拼、手写的键盘输入方式。有强大的纠错和简拼能力。常用输入工具：支持了剪贴板、常用语、键盘调节等常用工具，助力提升输入效率。智能联想：有文字、标点符号、emoji、公式、日期的联想能力。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/994/830.htm", "publishedAt": "2026-08-27T01:23:57+00:00"}, {"title": "0day同步！商汤小浣熊 Linux 版首发支持 openKylin", "summary": "2026年8月26日，OpenAtom openKylin（简称“openKylin”）社区完成商汤科技旗下AI办公助手 商汤小浣熊桌面端全新版本适配工作，商汤小浣熊正式登陆 openKylin ，此次首发也标志着 openKylin 正式成为商汤小浣熊桌面端的首选开源操作系统底座，进一步丰富 openKylin 生态下 AI 办公工具矩阵，为广大开源系统用户带来完整的...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502139", "publishedAt": "2026-08-27T01:15:32+00:00"}, {"title": "曝英伟达洽谈超 130 亿美元收购 Hugging Face，微软也想插一脚", "summary": "IT之家 8 月 27 日消息，据 Business Insider 今日报道，英伟达一直在洽谈收购 Hugging Face，可能达成英伟达迄今为止最大的交易之一。据一位知情人士透露，近几周两方就收购交易进行了严肃的讨论，该交易将 Hugging Face 估值超过 130 亿美元（IT之家注：现汇率约合 875.92 亿元人民币）。该人士表示，两家公司尚未达成协议，谈判仍有可能破裂。英伟达和 Hugging Face 未回应置评请求。报道还称，微软也与 Hugging Face 进行了会面，但知情人士表示谈判尚未进行。据英国《金融时报》此前报道，去年年底，Hugging Face 拒绝了英伟达 5 亿美元（现汇率约合 33.69 亿元人民币）的投资报价，该投资报价将使该公司估值达到 70 亿美元（现汇率约合 471.65 亿元人民币）。Hugging Face 当时表示，它不希望出现一个可以影响决策的主导投资者。Hugging Face 托管着数百万个可供开发人员构建的 AI 模型和数据集。拥有该平台可以让英伟达在这些开发人员中获得更大的立足点，并有可能将更多的工作负载转移到其芯片上。但英伟达的所有权也可能威胁到 Hugging Face 的优势之一 —— 中立。该平台支持整个行业的模型和硬件，包括 AMD 和英特尔等英伟达竞争对手。另据 The Information 本周报道，Hugging Face 正在悄然成为人工智能界的 GitHub 平台，其年化营收增长率在短短两个月内增长了 50%，突破了 1.5 亿美元（现汇率约合 10.11 亿元人民币）。报道称，Hugging Face 在 2023 年的营收大约达到 7,000 万美元（现汇率约合 4.72 亿元人民币），2024 年收入约为 1.3 亿美元（现汇率约合 8.76 亿元人民币），现在已经超过 1.5 亿美元（现汇率约合 10.11 亿元人民币），这意味着公司在不到两年的时间里几乎将营收翻了一番。Hugging Face 采用免费 + 增值商业模式，大约有 3-5% 的用户转为付费套餐。付费套餐为高使用场景和企业功能提供了增强的能力。该平台托管数十万模型，服务数万个组织，付费客户已增至 2,000 多。相关阅读：《消息称 AI 初创公司 Hugging Face 探索出售，估值达 130 亿美元》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/994/818.htm", "publishedAt": "2026-08-27T00:57:08+00:00"}, {"title": "神秘「牛来」模型果然是智谱！GLM首个原生多模态，还用的国产卡", "summary": "GLM-5.3 Flash", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/479919.html", "publishedAt": "2026-08-26T16:48:12+00:00"}, {"title": "DeepSeek 开源 Harness：AI 智能体基础设施开始“拆分”", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/vS7tpsLPdevZhMKdtxei?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-26T16:26:00+00:00"}, {"title": "535B 大模型“直播”训练三个月：代码、数据、Loss全公开，吴恩达公开力挺", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/y7KTOS9YbBz0OcoyiweQ?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-26T14:51:50+00:00"}, {"title": "AI 开始给自己造芯了，OpenAI 只用了九个月", "summary": "造芯片，是大模型公司的必备素养#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1676824?utm_source=rss&amp;utm_medium=rss& sApp、录音电话和 AI 语音电话骗取设备所有者的锁屏密码、Apple ID 与 2FA 验证码，以解除激活锁并转售设备。该平台采用按额度计费模式，订阅者输入被盗设备的型号、机主信息、电话号码、定位链接与 Find My 状态后，可通过邮件、短信、WhatsApp、预录语音与 AI 语音共 5 个渠道投放诱饵。受害者一旦访问钓鱼页面，平台会依次收集 4 位或 6 位设备密码、Apple ID 凭据及 6 位双因素认证码，并将数据回传至运营面板和 Telegram Webhook。SOCRadar 指出，AnonyMousKIT 关联了 506 个域名，并运营着一个由 168 个店铺品牌组成的庞大网络，这些店铺品牌充当转售商。邮件是该平台记录最完整的渠道。AnonyMousKIT 自 2026 年 3 月至 7 月 &nbsp;2026 年 3 月至 7 月记录 691 次发送尝试，其中 603 次诱饵邮件抵达收件箱。此外 AnonyMousKIT 平台通过 AI 语音钓鱼，200 次呼叫成本为 19.24 美元（IT之家注：现汇率约合 129.6 元人民币），约合每次尝试 9.6 美分（现汇率约合 0.65 元人民币）。通话时长中位数为 22 秒，最长为 20 分钟。这些 AI 语音钓鱼话术统一冒充苹果客服的“Alice Dias”，以协助找回丢失设备为由，诱导受害者口述设备密码并打开短信中的钓鱼链接。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/994/942.htm", "publishedAt": "2026-08-27T03:47:17+00:00"}, {"title": "消息称英伟达调整 HBM4 内存需求，8Hi 低堆叠占比提升", "summary": "IT之家 8 月 27 日消息，韩媒 ZDNET Korea 当地时间 26 日援引消息人士报道称，NVIDIA（英伟达）已要求上游 HBM 内存供应商调整 HBM4 内存的供应规划，提升 8 层堆叠 (8Hi) 产品占比，更高堆叠的 12Hi HBM4 比例相应减少。全球内存市场当前处于供不应求的状态，降低堆叠高度能以等量的 HBM4 DRAM Die 生产更多的 HBM4 堆栈，最终提升 Rubin GPU 交付数量。另一方面，12Hi 堆叠意味着更大的发热（和更高的热密度），这对于包含大量 I/O 的 HBM4E 来说带来了更大的良率压力，8Hi HBM 也能从这个侧面减少 DRAM Die 在加工中的损耗。此外，近来有更多风声指出 NVIDIA 考虑降级下调 Rubin Ultra 的 HBM 内存配置，也是出于类似的考虑。相关阅读：《为应对 HBM 短缺，消息称英伟达 Rubin Ultra 测试 192GB/256GB HBM4 版本》《为缓解 HBM 供应短缺，消息称英伟达考虑降低 Rubin Ultra GPU 配置》《NVIDIA 评估下调 Rubin Ultra HBM 配置，或将不限于 12Hi HBM4E》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/994/908.htm", "publishedAt": "2026-08-27T03:03:50+00:00"}, {"title": "MiniMax 违背「祖训」，企业收入暴涨 700%，偷偷变成了「卖铲子」的", "summary": "8 亿美元 ARR 背后，MiniMax 的 Agent 基建与效率暗战.#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1676874?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-08-27T02:48:30+00:00"}, {"title": "WhatsApp 测试 AI 反诈：消息无需上传云端", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/wAVlMqVg7fqPjXAyFDjC?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-26T15:00:00+00:00"}, {"title": "企  iPad）官方认证，实现了 iOS 原生级设备互联，即使在锁屏状态下仍可稳定调用各项功能。针对 iPhone 长期缺乏原生通话录音功能的痛点，OpenPods 支持“一键通话录音”，用户无需等待、无录制提示音，即可实现系统级录制，同时覆盖线上会议等场景，无需录屏或复杂权限申请。OpenPods 配备独立智能耳机舱，兼具“随身录音卡”与“便携翻译机”双重身份。耳机舱搭载高灵敏拾音麦克风，支持实体按键一键录音，可远距离清晰收录多人对话，拾音距离约 5-8 米；内置扬声器，双击实体按键即可实现实时翻译声音外放，满足跨语言面对面沟通需求。耳机舱内置 256MB 存储空间，为离线场景提供硬件支撑。在办公场景，OpenPods 搭载 AI 智能会议助手，支持会议内容结构化输出，可智能区分不同发言人，并对专业术语进行精准识别校正，生成会议摘要、待办事项及思维导图，实现“Agent 办公闭环”。其 AI 语音智能体支持“Ask AI”深度咨询，用户可基于录音、文档内容进行提问交流，回答附来源标注，确保可验证、无幻觉。此外，系统内置快捷办公指令，可一键完成总结重点、生成待办、撰写邮件等操作，并支持个性化知识库管理，所有录音与文稿自动存入本地资料库，支持自定义标签与灵活导出。翻译能力是有道 OpenPods 的另一大核心优势。产品支持通话 / 会议双向同声传译、音视频实时翻译（涵盖播客、直播、演讲等场景）以及面对面双向互译，转写与翻译覆盖 20 余种常用语种。值得注意的是，耳机翻译功能可独立使用，当前版本优先支持中英互译，更多语种与方言将通过后续 OTA 持续更新。在音质与佩戴体验方面，OpenPods 采用开放式轻盈设计，半入耳音腔结构配合人体工学耳廓弧形设计，单耳仅重 7 克，耳挂连接处最细处仅 3.2mm，兼顾长时间佩戴的舒适性。声学配置上，产品搭载 10.8mm 动圈单元，配备高弹性镀钛复合振膜与动态低音增强算法，并采用高精度三麦阵列结构结合骨传导麦克风，实现超清通话降噪与人声增强。OpenPods 支持蓝牙 5.4 与 2.4G/5G 双频 Wi-Fi，可同时连接两台设备实现“一拖二”无缝切换。续航方面，耳机单次最长可使用 8 小时，配合充电舱总续航达 32 小时；录音或翻译场景下，单次连续使用 3 小时，配合充电舱可达 12 小时。产品支持 Type-C 充电，具备 IP55 防尘防水等级（仅耳机机身），并提供黑色、白色两种配色选择。OpenPods 采用“硬件 + 服务”模式，标准会员可免费使用通话 / 会议录制（Beta）、每月 300 分钟转写时长、智能区分说话人、20+ 语种转写翻译、耳机舱录音、智能摘要、待办提取、思维导图、每月 50 次 Ask AI（Beta）、知识库管理及每月 60 分钟同传时长等核心功能。高级会员（59 元 / 月或 599 元 / 年）则将转写时长提升至 3000 分钟 / 月，Ask AI 次数提升至 1000 次 / 月，同传时长提升至 1200 分钟 / 月，并解锁全场景录制等进阶权益。据悉，OpenPods 的核心 AI 功能目前仅支持 iOS 系统，安卓与鸿蒙版本正在开发中；AI 语音智能体的语音交互功能也将在后续 OTA 更新中上线。有道方面表示，产品相关功能将持续迭代，以实际使用版本为准。京东有道 AI 翻译耳机 OpenPods1499 元直达链接", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/994/911.htm", "publishedAt": "2026-08-27T03:17:24+00:00"}, {"title": "绿源集团 2026 上半年归母净利润 7508.2 万元，同比下降 31.8%", "summary": "IT之家 8 月 27 日消息，绿源集团今日发布 2026 财年（2026 年 1 月～2026 年 12 月）半年报（2026 年 1 月～2026 年 6 月）报告：营业总收入：24.63 亿元，同比下降 20.4%毛利润：3.4 亿元毛利率：13.8%归母净利润：7,508.2 万元，同比下降 31.8%基本每股收益：0.2 元稀释每股收益：0.19 元 AI 解读本次绿源集团控股 2026 财年上半年业绩，营收低于市场预期区间下限，归母净利润降幅大于预期。财报亮点尽管电动两轮车行业面临周期性需求调整，公司仍保持稳健运营质量，毛利率同比提升 0.2% 个百分点至 13.8%核心产品持续更新带动电动摩托车销量显著增长，截至 2026 年 6 月 30 日止期间，销量同比增长约 78.2% 至约 402,000 辆，在中国市场电动摩托车销量位居榜首加速拓展液冷电机及智 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
