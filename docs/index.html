7 年拿出亮眼的演示样机…… 但机器人走上街头还需要再等好几年。”OpenAI 没有透露这场演示会展示哪些内容、人形机器人长什么样，以及外部人员何时才有机会近距离接触这款设备。一台高性能人形机器人，必须能够理解摄像头与传感器采集到的画面，解读指令，规划执行方案，协调躯体动作，并且在现实环境出现意外状况时自行修正动作。举个例子，拿起马克杯时，机器人需要识别杯子、找到杯柄、预估抓握方式，并施加合适力度将杯子提起。一旦出错，咖啡就会洒出，还得清理地面。OpenAI 已经开始招人解决上述难题。机器人相关岗位涵盖运动控制、状态估计、执行器控制、整机行为开发，以及用于训练实体人工智能系统的机器学习基础设施。这段研发脉络也有迹可循。OpenAI 的 Dactyl 研究项目，曾教会机械手操控真实物体，全部训练都在仿真环境中完成。公司之后还利用这套技术挑战魔方。这也是至今困扰所有机器人企业的难题的早期案例：模型可以在软件层面学会预期动作，但现实物理规律才是最终的决定因素。奥尔特曼重点强调智能层面，并不代表 OpenAI 把硬件当成次要附属品。该公司机器人岗位招聘信息显示，团队正在自研机电一体化执行器，集成电机、传动机构、传感与热管理系统；其余岗位还覆盖规模化量产硬件所需的制造与供应链。对于这个被称作“没那么重要”的机器人另一半，工作量其实相当庞大。OpenAI 并非踏入无人涉足的领域。特斯拉多年来一直在研发擎天柱（Optimus），小鹏近期也实现了 IRON 人形机器人组装完成后自主走下产线。两者都印证，即便软件足够智能，也需要驱动一套极其复杂的电机与关节完成动作。相比直接给每户家庭配备机器人室友，OpenAI 的规划起步阶段更加务实。一则机器人招聘启事写明，公司短期目标是打造通用机器人，协助技术工人建设基础设施；长期目标是研发个人机器人，完成更多种类的任务。如果你已经开始想象实体版 ChatGPT 弯着膝盖洗碗，那暂时还不用拆掉家里的洗碗机。OpenAI 尚未正式发布实体机器人，也没有公布面向消费者的售价、订阅模式、上市日期或是专门针对机器人的隐私规范。即便如此，OpenAI 招聘页面目前仍挂着 27 个机器人方向的岗位空缺。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/014/433.htm", "publishedAt": "2026-10-18T00:11:12+00:00"}, {"title": "Meta 修改商业服务条款引发“用于训练 AI”争议，现已删除相关表述", "summary": "IT之家 10 月 18 日消息，Meta 最近更新了其商业服务条款，声明其有权“使用来自 [企业账户] 域名、网页或 URL 的任何内容，以提供、开发、改进、研究、训练并维护”Meta 产品及服务的完整性。IT之家注意到，接受 Nieman Lab 采访的法律专家指出，这是一项“引人注目的条款”，它可能赋予 Meta 抓取任何拥有 Meta 企业账户的内容发布商网站、并利用相关内容训练其人工智能模型的权限。不过，Meta 发言人坚称，更新后的条款并不意味着 Meta 抓取网络的方式发生了改变。据 The Verge 报道，目前该条款已被正式删除。Meta 在一份声明中表示：“我们听取了各方的反馈，并特此澄清：本次更新是对既有广告条款的“合并整合”，而非扩大爬虫行为；修改后的条款现已明确限定爬虫与收集数据仅用于“广告和商业产品”，并重申站长仍可通过 robots.txt 控制爬虫权限。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/014/429.htm", "publishedAt": "2026-10-18T00:00:43+00:00"}, {"title": "布局物理 AI：美光研发边缘推理内存 EIM，降低数据处理延迟并提高带宽", "summary": "IT之家 10 月 18 日消息，据韩媒 The Elec 报道，美光正在推进面向物理 AI 的专用存储芯片 —— 边缘推理内存（Edge Inference Memory，EIM）的研发。10 月 16 日，在首尔江南 COEX 举行的韩国半导体展（SEDEX 2026）专题论坛“驱动人形机器人的半导体”上，美光高管（常务）李哲（音译）表示：“自动驾驶、人形机器人、增强现实（AR）及虚拟现实（VR）等物理 AI 市场正在迅速崛起。我们正与核心客户紧密沟通，共同推进适配这一新兴市场的产品研发。”据悉，EIM 能够高速处理 AI 推理所需的数据，其架构是在逻辑芯片之上垂直堆叠低功耗内存（LPDDR）。这与在存储器内部执行计算的存内计算（PIM）属于不同概念。两者的共通之处在于均部署于 AI 主芯片周边以提升数据处理效率；不过 PIM 是将计算单元集成在存储器内部，而 EIM 的具体计算架构目前尚未公开。EIM 介于 AI 处理器与内存之间，主要用于降低数据处理延迟并提高系统带宽。美光目前尚未披露具体的目标性能指标，但正在推进将 EIM 集成至 LPDDR6 方案的技术研发。业内预计其量产时间将在 2028 年下半年。IT之家获悉，与仅能重复执行固定程序的传统工业机器人不同，人形机器人具有主动性，能够感知周围环境并自主决策，需要对视觉、听觉、重量感知及触觉质感等多元信息进行采集与精确控制。现阶段，人形机器人主要采用 LPDDR 等低功耗内存，而非高带宽内存（HBM）。与高度依赖 HBM 的数据中心不同，依赖电池供电的机器人对能效比要求更为严苛。然而随着 AI 模型参数规模持续攀升，仅依靠传统的 LPDDR 已逐渐难以提供足够的内存带宽。美光预测，未来人形机器人最终也将走向采用 HBM 的路径。李哲指出：“目前机器人所采用的 AI 模型参数量多在 10 亿至 20 亿（1B~2B）左右，对内存带宽的需求尚且有限；但随着性能更强大的视觉语言模型（VLM）的引入，仅凭 LPDDR 将难以为继，必然会向 HBM 架构演进。”同时，内存容量的需求也在同步激增。美光预计，未来的高性能人形机器人将需要约 200GB 的 DRAM 以及 4TB 的存储空间。作为对比，当前主流服务型机器人通常仅配置 12GB DRAM 与 256GB 存储空间。李哲表示：“现有的 DRAM 与存储架构已难以满足物理 AI 市场的严苛需求。我们正与机器人制造商、芯片方案商以及超大规模云服务商从芯片的早期系统设计阶段展开深度协同合作。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/014/419.htm", "publishedAt": "2026-10-17T23:26:38+00:00"}, {"title": "Akka 在 65 个开源项目中测试基于规格的 AI 交付", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/uGNQwpOt5GGAKm2XlEZC?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-17T15:00:00+00:00"}, {"title": "广汽埃安 Ray7 开启预售：华为 DriveONE 多合一电驱，12.88 万元起", "summary": "IT之家 10 月 17 日消息，广汽埃安 Ray7 纯电轿车今日开启预售，共 5 款车型，预售价 12.88 万元起。IT之家附价格信息如下：530 后驱驾趣版 12.88 万元530 后驱激光版 13.88 万元702 后驱驾趣宁德版 13.88 万元702 后驱激光宁德版 14.88 万元702 后驱 EMB 激光宁德版 15.88 万元该车提供仲夏紫、闪电黄、月辉银、风暴红、熔岩灰、云舒白、热带蓝车色，定位“大 5 米超级纯电轿车”，配备 3.6m 量子星环贯穿前后 LED 灯。该车提供炽光竞驰、云纱暖米、极速赛道内饰，一体式运动座椅，前排一键 / 语音舒躺，配备高通骁龙 8295P 座舱芯片 +24GB LPDDR4 运存 +128GB UFS 闪存，15.6 英寸 2.5K 高清中控屏 + 车手互联全覆盖。此外，该车搭载同级最高半固态 192 线激光雷达以及同级领先一段式端到端大模型。三电方面，该车搭载华为 DriveONE 多合一电驱，拥有同级领先 0.22Cd 低风阻，全新一代智能热管理系统，全球首发华为 DriveONE EMB 全电线控制动，同级首搭华为 iTrack 动态扭矩分配系统。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/014/398.htm", "publishedAt": "2026-10-17T13:06:00+00:00"}, {"title": "华硕推出旗下首款英特尔 Arc Pro B70 显卡：32GB ECC 显存，AI 算力达 367 TOPS", "summary": "IT之家 10 月 17 日消息，据 Wccftech 今日报道，华硕推出了旗下首款英特尔 Arc Pro B70 显卡，面向 AI 推理及工作站市场。华硕此前缺席了英特尔 Arc 独立显卡的多个世代，此次推出新品意味着其再次加入英特尔独立显卡产品阵营。华硕这款产品名为 UGen Intel Arc Pro B70 32GB GDDR6，采用英特尔 Xe2 架构的 Big Battlemage GPU，配备 32GB GDDR6 ECC 显存、32 个 Xe 核心和 256 个 XMX AI 引擎，INT8 AI 算力最高可达 367 TOPS，典型板卡功耗 310W。该卡采用双槽设计和涡轮式散热结构，配备 1 个 HDMI 接口和 3 个 DisplayPort 接口，使用 PCIe 5.0 x16 接口，显存带宽为 608GB/s。华硕表示，该卡支持 vLLM、llama.cpp、Ollama、PyTorch、OpenVINO、oneAPI 和 Vulkan 等 AI 框架及工具。用户还可以通过多卡配置扩展显存容量，最多支持 4 张显卡协同工作，合计提供 128GB 显存，以运行更大规模的 AI 模型。价格方面，华硕暂未在产品页面公布 UGen Intel Arc Pro B70 32GB 的具体售价。同类英特尔 Arc Pro B70 显卡的市场价格通常在 1,299 美元至 2,000 美元（IT之家注：现汇率约合 8,701 元至 13,397 元人民币）以上，具体价格取决于产品型号及销售渠道。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/014/390.htm", "publishedAt": "2026-10-17T11:56:31+00:00"}, {"title": "边建设边运营：“鹏城云脑 Ⅲ”10000P 国产算力上线试运行", "summary": "IT之家 10 月 17 日消息，10 月 15 日至 16 日，2026 世界算力网大会（WCNC 2026）在深圳举行。开幕式上，大科学装置“鹏城云脑 Ⅲ”的 10000P 国产算力正式上线试运行。公开报道显示，鹏城云脑 Ⅲ 采用的是华为昇腾最前沿的 384 超节点架构，首期设备已于今年 3 月通电点亮，完全建成后算力规模将达到 16000P（IT之家注：合 16 EFLOPS）。此次 10000P 算力先行投入运营，意味着这座规划中的国内单体规模最大智算设施进入“边建设、边运营”新阶段，在全部建成之前已开始向国产大模型训练与科学智能研究输出算力。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/014/387.htm", "publishedAt": "2026-10-17T11:48:30+00:00"}, {"title": "科大讯飞 AI 词典笔 X9 上架：内置 85 本词典、支持小初高 9 科知识查询，744 元", "summary": "IT之家 10 月 17 日消息，科大讯飞现已在京东上架讯飞 AI 词典笔 X9，定价为 744 元，部分地区国补后低至 674.1 元。该词典笔配备 3.48 英寸莱茵低蓝光护眼屏，配备 1100mAh 电池，内置 85 本正版词典及“五千万词库”。扫描响应时间低至 0.3 秒，并支持无网离线查词。其机器翻译能力通过了全国翻译专业资格考试评估，能够进行长难句的语法与结构剖析。官方强调，该设备提供 11000 篇分级听力内容，覆盖幼儿至高中阶段。口语训练采用中高考同源技术进行音素级纠音，支持 AI 图文对话与蓝牙耳机连接。系统内置艾宾浩斯遗忘曲线以自动生成专属背词计划。此外，该设备支持小初高 9 科知识查询，内置题库超过十亿。讲题功能基于双 AI 模型，提供分步深度解析，解答结果支持家长管控。IT之家附产品参数：京东科大讯飞 AI 词典笔 X9744 元直达链接京东 11.11 无门槛红包 面额至高 26888 元，每天抽 3 次：点此抽红包。淘宝 11.11 无门槛红包 面额至高 26888 元，每天抽 1 次：点此抽红包。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/014/382.htm", "publishedAt": "2026-10-17T11:29:34+00:00"}, {"title": "开发者将破解后的索尼 PS5 当作本地 AI 服务器：利用 GPU 加速运行 27B 参数 Qwen3.8-27B 模型，速度达 20.9 token/s", "summary": "IT之家 10 月 17 日消息，据外媒 Wccftech 报道，开发者 abhi245y 基于资深 AI 工程师 Mert Cobanov 的 PS5LM（llama.cpp 移植项目），开发了原生 GPU 应用 PS5LM Plus，让经过破解的 PS5 主机能够在本地运行 Qwen3.8-27B 等大型语言模型。IT之家获悉，PS5LM 的早期版本主要依靠 CPU 运行模型，执行 27B 参数模型时，平均每分钟只能生成约 1 个 token。为提升性能，开发者 abhi245y &nbsp;移植了 Mesa 开源项目中的 AMD RADV 驱动，并通过 Vulkan 计算接口让 llama.cpp 能够作为原生应用在 PS5 上运行。这项改动将可用内存从约 6GB 提升至 11.4GB，使主机能够运行经过高度量化的 Qwen3.8-27B 模型。得益于 PS5 较高的内存带宽（448GB/s），Qwen3.8-27B 的生成速度可达每秒 20.9 个 token。测试期间，GPU 使用率达到 100%，CPU 使用率仅为 2%。对于规模更小的模型，PS5 还能实现更高的生成速度，例如 Gemma 4 E4B 约为每秒 61 个 token，Llama 3.2 3B 则达到每秒 124 个 token。除了利用 PS5 的 GPU 加速模型推理，PS5LM Plus 还内置网页聊天界面，并可通过局域网 8081 端口提供 API 服务，用户可通过同一网络中的其他设备访问页面，与本地运行的模型对话。该项目还兼容 OpenAI 和 Anthropic API，方便 opencode、Codex、Claude Code 等工具调用 PS5 上运行的模型。对于一台主要面向游戏设计的主机而言，PS5 能够充当本地 AI 服务器，为大模型推理提供 GPU 加速，展示了其硬件在游戏之外的应用潜力。不过，该机配备的 16GB RAM 统一内存仍然限制了模型的选择和运行质量。此外，运行原生版 llama.cpp 需要先对 PS5 进行越狱，可能会导致游戏机及 PSN 账号被封禁等风险。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/014/372.htm", "publishedAt": "2026-10-17T10:45:59+00:00"}, {"title": "OpenAI 纳维-斯托克斯方程证明方法被指与官方叙事不符：学界验证尚需数年，智能体贡献同样成谜", "summary": "IT之家 10 月 17 日消息，OpenAI 今年 9 月公布了一份长达 166 页的纳维-斯托克斯方程（Navier–Stokes equations）相关证明，称其内部 AI 系统在约 88 小时内完成了对这一千禧年难题的求解。不过，随着数学界进一步审查相关工作，研究人员开始对证明采用的方法、与已有研究的关系，以及大规模 AI 智能体究竟发挥了多大作用提出质疑。数学家贡萨洛 · 曹-拉博拉（Gonzalo Cao-Labora）指出，OpenAI 可能自己都没看懂就急着发论文了。他表示，OpenAI 的证明细节与西班牙数学家迭戈 · 科尔多瓦（Diego Córdoba）和路易斯 · 马丁内斯-佐罗亚（Luis Martínez-Zoroa）此前提出的方法呈现出不同的路线，二者的相似之处可能更多停留在表面上。参与审读的多组专家均向《科学美国人》表示，越来越多迹象表明，OpenAI 的证明并没有遵循“西班牙路线”。这意味着 OpenAI 在发布该项成果时似乎并未完全理解其模型究竟干了什么。IT之家注：纳维-斯托克斯方程用于描述流体运动，是克雷数学研究所设立的千禧年大奖难题之一。OpenAI 于 9 月 8 日发布相关研究，称其内部模型完成了数学证明，并同时公开了使用 Lean 形式化验证语言编写的证明。OpenAI 表示，其研究团队使用约 1 万个 AI 智能体，经过约 88 小时得到结果，随后又花费约 17 小时完成形式化及验证工作。Lean 能够检查形式化证明中的逻辑推导是否符合设定规则，但通过形式化验证并不意味着证明所解决的问题一定符合研究人员原本关注的科学问题，也不意味着证明的思路容易被人类理解。OpenAI 公布的证明长达 166 页，数学界目前仍在审查其具体方法及结论。此次争议之一在于，OpenAI 的研究与科尔多瓦、马丁内斯-佐罗亚此前探索的研究路径究竟有多大关联。《科学美国人》指出，OpenAI 的证明利用了纳维-斯托克斯方程中的外部力项，构造出流体速度在有限时间内无界增长的情形。数学家对这一结果的意义存在不同看法：它符合克雷数学研究所原始问题表述允许的一种情形，但并未解决不施加外部力时，三维纳维-斯托克斯方程的解是否始终保持光滑这一更受关注的问题。在研究成果的归属方面，纽约大学数学家特里斯坦 · 巴克马斯特（Tristan Buckmaster）质疑 OpenAI 的研究可能受益于他与 Anthropic 员工莱文特 · 阿尔珀格（Levent Alpöge）使用公开模型开展的相关研究。对此，OpenAI 否认使用了巴克马斯特的相关数据，并在 9 月 10 日更新的官方说明中表示，经过调查，巴克马斯特此前两个月在 Codex 中输入的提示词不可能通过任何方式影响此次研究，包括通过模型训练产生影响。但截至目前，双方对研究方法及成果的关系仍存在争议。另一项尚未得到明确答案的问题，是这些智能体协作究竟提供了多少贡献。OpenAI 官方称其研究涉及约 1 万个并行运行的智能体，累计发送约 270 万条消息，使用约 1300 亿个输出 Token。不过，这些数字只能反映计算规模和运行过程，不能直接说明多智能体架构对最终成果的实际贡献。OpenAI 研究员诺姆 · 布朗（Noam Brown）也指出，目前研究人员并不清楚如此大规模的智能体集群究竟带来了多少额外收益。由于使用数千个智能体进行系统性对照实验的成本很高，研究人员尚未充分比较单个智能体完成同一任务所需的时间，也难以准确衡量 1 万个智能体相较于 1000 个智能体的优势。布朗估计，多智能体协作架构对这次成功的贡献可能不到 10%。在他看来，由于 AI 智能体技术新颖且易受广泛关注，容易获得超出实际贡献的认可；真正关键的因素可能是底层模型本身的能力，以及模型能够长时间持续处理任务、并行探索多种解法的特性。10 月初，OpenAI 又公开了约 400 项数学研究结果。数学界普遍表示仅消化这些内容就需要数年。这些成果以相对松散的形式集中发布在 GitHub 上，同样又引发部分数学研究人员不满。他们担心，大量成果在缺乏充分解释、整理和学术交流的情况下集中发布，会降低数学研究成果的可读性，也可能模糊严谨的研究验证与大规模自动生成结果之间的区别。目前，数学界仍在评估 OpenAI 的相关研究。此次争议涉及的不只是 AI 能否生成形式化证明，还包括研究方法是否真正解决了目标问题、成果如何归属，以及多智能体系统的实际贡献应当如何衡量。相关阅读：《OpenAI 发布又一批 AI 数学研究成果，攻破数百个悬而未决难题》《OpenAI 宣布成立数学与 AI 顾问组，神秘新模型 24 天攻破 100+ 世界级难题》《不到一个月连破两道千禧年大奖难题？消息称 OpenAI 即将攻克霍奇猜想》《AI 攻克数学难题，纽约大学教授质疑 OpenAI“截胡”其研究成果》《继 Claude 尝试攻克黎曼猜想后：OpenAI 宣布用 10000 个 AI 智能体 88 小时攻克千禧年大奖难题，陶哲轩既点赞又担忧》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/014/370.htm", "publishedAt": "2026-10-17T10:31:25+00:00"}, {"title": "生产级大模型平台工程实战手册", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/xQLd004RGWrzFhwqBOyC?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-16T17:00:00+00:00"}, {"title": "Jync v1.7.5 AI 配置接入本地模型（Ollama 预设 + 深度思考档位）", "summary": "Jync 捷同 是一个异构数据库实时同步工具。在异构数据库之间实时同步结构与数据的开箱即用 Web 应用：单个 jar 启动，浏览器点几下即可在内置 17 种数据库（另支持自定义类型）之间任意两种建立持续同步链路。增量检测默认轮询（零侵入），MySQL / Oracle / PostgreSQL / SQL Server 源库可切换日志 CDC 做到秒级延迟。S...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503068/jync-1-7-5-released", "publishedAt": "2026-10-16T15:54:00+00:00"}, {"title": "🔥 优化及缺陷修复：开源 AI 无代码平台 NocoBase", "summary": "汇总一周产品更新日志，最新发布可前往我们的博客查看。 NocoBase 目前更新包括三个分支： main、next 和 develop。** main： 在零售渠道难以买到，并不等同于厂商已经正式宣布停产。Fisher 还强调了游戏业务对英伟达的重要性。他表示，如果没有游戏业务和 GeForce，就不会有今天的英伟达；GeForce 推动了 CUDA 的发展，而 CUDA 相关的计算能力也为当前 AI 市场的发展奠定了基础。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/014/407.htm", "publishedAt": "2026-10-17T14:33:46+00:00"}, {"title": "宇树科技展示中心在天津建成投用，集中陈列多款机器人产品", "summary": "IT之家 10 月 17 日消息，据“天津发布”消息，近日，宇树科技展示中心在天津经开区科技发展中心三号楼正式建成投用。该展厅将作为宇树机器人专属产品展示阵地，集中陈列多款系列机器人产品，直观呈现前沿机器人领域技术成果。IT之家注意到，宇树科技展示中心共设两层，一层为主展示展厅，二层为办公会议区域。其中，一层展厅总面积 1189.04 平方米，划分为静态展示区与六大功能体验区两大板块。静态展示区设置企业发展历程与品牌文化墙，集中陈列人形机器人、四足仿生机器人整机展品，同步展出伺服关节、灵巧手等自研核心零部件，系统展现企业技术迭代路径与硬核研发实力。六大功能体验区打造实景化应用场景，分别呈现四足机器人障碍物越障攀爬、智能家居模拟生活应用、人形机器人拳击格斗对抗、工业物料智能分拣、电力设备巡检作业、机器人相声文娱表演等场景。参观者可近距离观摩机器人动态实操演示，沉浸式感受具身智能技术在消费、工业、电力、文娱等多领域的落地成效。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/014/380.htm", "publishedAt": "2026-10-17T11:21:44+00:00"}, {"title": "划词 AI 工具拾趣 Magpie Release v0.1.14，重磅发布 Windows 版", "summary": "Magpie拾趣：跨平台沉浸式自定义AI 划词工具 文本提取 · 内容翻译 · 信息整理 划选或双击，浮动条随即弹出：翻译、解释、总结实时呈现；复制、搜索、写入 Obsidian、预填日历，结果直接落地。图片、视频与扫描文档中的文字，框选亦可识别——处理在原地完成，无需迁入对话窗口。 本次更新，重磅发布 Windows 版。 http...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503067/magpie-0-1-14-released-windows-ver", "publishedAt": "2026-10-16T14:25:28+00:00"}, {"title": "Pi 抛出全新 Agent Harness，还把自己骂了一年的 MCP 装进了核心", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/hQOHf1ZXoBs7uMpWJQss?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-16T11:53:14+00:00"}, {"title": "邀请函 | Agentic Infra 操作系统大会 & openEuler Summit 2026", "summary": "", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503062", "publishedAt": "2026-10-16T10:01:49+00:00"}, {"title": "【AI 智能运维平台】本周更新：AI 对话搭建仪表盘，主机巡检打通执行、报告与通知", "summary": "Blueking Lite 是一个 AI First 的轻量版运维产品，具有部署资源要求低、使用成本低、渐进式体验等特点，为运维管理员提供日常运维中的必备工具。 📢【平台·本周更新速递】 📊 运营分析 • AI 仪表盘搭建：支持对话式数据源检索与图表生成 • 新增内置应用拓扑大屏 • 3D 机房完善机房统计信息 • 仪表盘、报表、拓...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina ": "https://www.ifanr.com/1684442?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-10-15T12:00:02+00:00"}, {"title": "苹果 HomeView 上手汇总：「果家」首秀小惊艳，SiriAI 很聪明", "summary": "苹果 AI 终于有「家」了#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1684341?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-10-14T12:35:44+00:00"}]}, {"label": "论文研究", "items": [{"title": "中国科学院院士鄂维南：未来民科是科研的主力，AI 时代每个有想法有能力的团队和个人都可以参与到科技创新中去", "summary": "10 月 17 日，在光华思想力论坛上，中国科学院院士、北京大学讲席教授鄂维南表示，人工智能本质上是“数学 + 计算机工程”，将大幅降低科研门槛，推动“科研平权化”。“未来民科是科研的主力”，他预测，通过开放实验室和云服务，“每一个有想法有能力的团队和个人都可以参与到科技创新当中去”。鄂维南指出，企业真正做生产时缺乏原始创新，只能在管理、价格等方面竞争，“内卷的根本原因是创新能力不够”。他认为，高端工业软件、高端机床数控系统目前受制于人，但“现在不但是可以比较短的时间内实现自主可控，甚至可以‘换道超车’”，可构建 AI 原生工业软件体系，“原则上几乎可以拿出不但可以对标西门子，甚至可以超越西门子的体系，一两年内就可以做成”。他区分 AI for Science 与 AI for Industry，指出后者起步更难，因工业软件更封闭、工业数据大部分闭源，但工业生产线建模因为宏观较容易，未来核心任务是把工业生产线建模做到位。他判断这一进程“三年、最多五年就可以实现”。鄂维南同时警示，人工智能时代现行的科研体系将会面临巨大的挑战。他以数学界为例称，若四大顶刊投稿量增加百倍，“我们其实并不知道如何应对”。他强调颠覆性创新“很大程度上靠自由探索而实现的，而不是任务定义而驱动的”，并批评“把自由探索和写论文等同于一起，这是所犯的错误”。他认为，科研成果形态将从论文转向知识产权，产业形态也将重构，高校必须构建深入理解需求的创新驱动一体化人才培养体系。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/014/371.htm", "publishedAt": "2026-10-17T10:39:55+00:00"}, {"title": "68岁亚马逊CTO：别让恐惧，替企业做AI决策", "summary": "经验没有压缩算法", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/10/503815.html", "publishedAt": "2026-10-16T07:01:31+00:00"}, {"title": "腾讯评估研究团队的“Agent 舰队”被钓出来了", "summary": "一群智能体在腾讯云上跑了 11 天，试图从高德地图里挖掘数据——然后它们发现自己在被调查，居然主动和调查者聊了起来。按 swarmcha.se 调查团队的说法，这是人类研究者第一次和仍在运行中的失控智能体搭上话。 9 月 28 日到 10 月 8 日，这批智能体做了 2600 多次尝试。它们的任务相当日常：「用高德导航去成都动物园，...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503037/swarmcha-se-chinese-agent-fleet-full-report", "publishedAt": "2026-10-15T07:48:52+00:00"}, {"title": "Palantir CTO 上电视骂 AI 安全是“邪教”，还戏称 AI 研究者靠抽烟表信仰", "summary": "Palantir 首席技术官 Shyam Sankar 在 CBS《Face the Nation》上抛出了几个惹火的判断。节目开头，主持人 Margaret Brennan 先甩了个民意数字：CBS 民调里 50% 的人认为 AI 带来的问题会多于解决的，45% 的美国人希望政府限制 AI 的研发和使用。他的回应不是顺着'该不该设护栏'谈，而是直接点名了一个他认为真正在背后操...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503000", "publishedAt": "2026-10-13T08:56:20+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "《战地风云 6》回应第五赛季争议皮肤：拼写错误将修复，五枪套设计是刻意为之", "summary": "IT之家 10 月 18 日消息，《战地风云 6》开发团队针对玩家对第五赛季新增几款争议外观皮肤的批评作出了回应。据游戏资讯网站 MP1st 消息，战地工作室在官方 Discord 社区发布公告，介绍了上周《战地风云 6》第五赛季上线后引发热议的两款皮肤的相关背景。公告全文确认，其中至少一处问题正在修复，而另一处设计则会保持原样。这两款外观道具于 10 月 13 日正式上线，很快就招致玩家不满：一款皮肤里“security（安全）”一词疑似出现拼写错误；另一款步兵皮肤则夸张地配备了五个手枪枪套。开发者表示，麦克尼尔（McNeil）皮肤臂章上把单词错写成了不存在的“secuty”，该拼写错误会在 11 月《战地风云 6》第五赛季更新时修复。公告中写道，开发团队留意到围绕新皮肤产生的各类玩梗内容与讨论：“大家明确指出了问题，我们听到了各位的顾虑。”公告继续写道：“坦白说，这类不达标的道具，不符合大家对我们的品质期待，也达不到我们给自己定下的标准。我们一直为游戏世界观与装备设计的精细度引以为傲，出现这类视觉疏漏，所有人都会感到沮丧。我们正在复盘内部流程与工作环节，定位问题成因，并思考如何在后续进一步加强品控。感谢大家以高标准要求我们。”这次快速回应以及修复承诺，一定程度上平息了社区的不满。不过战地工作室与艺电（EA）的这份声明，并没有说明这个拼写错误最初是如何产生的，也没有回应玩家事后提出的、怀疑使用生成式 AI 制作素材的相关质疑。本周另一款吸引玩家目光的外观是“午夜幻影（Midnight Mirage）”皮肤，它那多达五个手枪枪套的造型实在夸张。这款皮肤本身就显得有些违和，又和那款带拼写错误的皮肤一同上线，口碑雪上加霜。自去年 10 月《战地风云 6》发售以来，玩家就一直在讨论这款射击游戏的角色外观，所以无论是不是失误，这样的服装设计注定会引来关注。但在战地工作室看来，这个设计并不是制作失误。公告解释：“这是刻意的创意设定，致敬动作片里那种夸张桥段 —— 特工的装备上，但凡有空余位置，都会莫名其妙多绑一把备用武器。当然我们也理解，它和其他有瑕疵的外观一同推出时，很容易让人误以为这也是制作疏漏。”关于午夜幻影皮肤的讨论到此告一段落，玩家不用期待这几个手枪枪套会被移除。团队在文末承诺，后续会持续关注社区反馈。“我们会不断尝试新创意，看看哪些内容能获得玩家喜爱，也正是依靠大家，我们才能持续优化《战地》的外观道具。感谢各位一直以来的反馈与支持。”IT之家注意到，《战地风云 6》第五赛季已于上周开启，和以往赛季内容一样，更新将分三批逐步推送。第一波内容已经上线，新增了拉斯维加斯大道与 51 区两张地图，还有《死亡空间》联动内容。11 月 10 日，新地图欧洲赌场将随全新活动与道具一同上线。12 月 8 日，布莱克威尔原野与新索贝克城两张地图迎来改版，同时还有更多内容与调整陆续推出。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/014/430.htm", "publishedAt": "2026-10-18T00:01:02+00:00"}, {"title": "韩国半导体工程师指控特斯拉：施压三星压低 AI 芯片报价、索要敏感信息并挖角其人才", "summary": "IT之家 10 月 18 日消息，据 Tweaktown 报道，一名韩国半导体工程师指控，特斯拉在与三星签订芯片代工协议时，试图争取极为优厚的条款：既要获取敏感的制造工艺信息、审计权限，同时还要求压低报价。这位在 X 平台账号 @TTHUEONE 发文的工程师还称，特斯拉的 Terafab 项目从三星位于得州泰勒的工厂挖走了大量员工。这些指控出现前，埃隆 · 马斯克（Elon Musk）刚度过事务繁忙的一周。他公开称赞美光科技，称其“对未来存储芯片定价态度理性，其他厂商则存在漫天要价的行为”，这番话普遍被解读为暗指三星。他还暗示台积电有 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
