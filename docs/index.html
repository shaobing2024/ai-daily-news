const DATA = {"date": "2026-10-01", "generatedAt": "2026-10-01T01:46:54Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "生物安全领域里程碑：谷歌 DeepMind 首创 AI 蛋白质水印技术", "summary": "IT之家 9 月 30 日消息，谷歌今日推出 SynthID Bio，将数字水印技术引入合成生物学领域。该技术可将不可感知的签名直接嵌入生物编码，不仅能在数字模型上验证，还可在合成的物理蛋白质上完成验证，同时在实验室测试中保持蛋白质的生物学功能。生成式 AI 正在帮助科学家解决关键生物学挑战，从预测蛋白质结构到设计全新蛋白质，再到开发新型噬菌体。但这类工具也带来了新挑战：新型 AI 设计可能绕过传统 DNA 合成筛选，而标记错误的合成 3D 结构会污染公共数据库，误导后续研究。SynthID Bio 是专门为合成生物学开发的水印方法系列，旨在加强生物安全和科学诚信。它会根据数据类型调整方法，对序列的氨基酸选择进行 subtle 引导，对预测的 3D 结构调整原子坐标，从而创建可靠的检测信号。实验表明，这些调整不会损害蛋白质的生物学功能，这对于有效治疗疾病和推进科学研究至关重要。在针对 VEGF-A、SARS-CoV-2 刺突蛋白 RBD 和 PD-L1 这三种靶蛋白的湿实验室测试中，带水印的设计在命中率、结合亲和力和自然序列多样性方面，与未带水印的版本表现一致，成功创造了首个带有水印且具备生物学功能的蛋白质结合剂。对于蛋白质折叠，SynthID Bio 对 AlphaFold 3 扩散网络的一小部分进行微调，将水印能力直接构建到模型权重中。这确保预测的 3D 坐标本身就带有可检测的特征，无论由谁运行模型，SynthID Bio 都能保持 AlphaFold 3 的预测准确性，同时提供近乎完美的可检测性，维持关键结构特征分布，还能抵御数字噪声或微小坐标变化。生物安全依赖分层防御，SynthID Bio 的水印方法可作为嵌入生物设计本身的重要验证层。这一层对于 DNA 合成筛选尤其重要，当前 AI 可以创造与已知危害几乎不相似的全新序列，筛选人员无法再沿用旧假设，而 SynthID Bio 可以提供自动验证信号，证明订单来自带有内置安全措施的可信模型。类似地，SynthID Bio 还可以帮助维护蛋白质数据库、UniProt、GenBank 等数据库的完整性，确保合成条目得到正确标记或标记，供进一步审查。谷歌表示，虽然没有单一的生物安全干预措施是万能灵药，但 SynthID Bio 把经过验证的水印工具 SynthID 带入了合成生物学，是可靠识别和跟踪 AI 生成生物序列和结构的重要第一步。未来的关键挑战包括让水印对故意篡改具备更强的鲁棒性。SynthID Bio 还可以与来源元数据方法或 AI 生成生物数据的中央存储库配合使用，更好地识别和跟踪 AI 生成的蛋白质。谷歌目前正研究如何将水印技术应用于更复杂的生物物体，在与斯坦福大学 Hie 实验室和 Arc Institute 的合作研究中，已经将 SynthID Bio 集成到先进基因组模型 Evo 2 中，为 Evo 2 设计的噬菌体基因组添加水印，早期实验室测试已经确认这些带水印的噬菌体具备功能。IT之家附上参考Function-preserving watermarking of AI-generated proteins", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/940.htm", "publishedAt": "2026-10-01T01:28:53+00:00"}, {"title": "华境 S 大六座 SUV 9 月交付 7416 台：连续 5 个月增长，标配华为乾崑智驾 ADS 5 Pro", "summary": "IT之家 10 月 1 日消息，华境汽车官方今日宣布，旗下华境 S 大六座 SUV 9 月交付 7416 台。该车标配华为乾崑智驾 ADS 5 Pro，实现连续 5 个月稳步增长。目前，华境 S 累计交付已突破 3 万台，销量创新高。据IT之家了解，华境 S 是上汽通用五菱与华为合作的首款搭载华为乾崑科技旗舰大六座 SUV，2026 年 8 月交付 7306 台、7 月交付 7203 台、6 月交付 5689 台。华境 S 全系标配华为乾崑智驾 ADS Pro 增强版与鸿蒙座舱。该车已于 5 月 8 日正式上市。本月中旬（9 月 12 日），华境 S 新增 4 款配置，全系超级置换价 14.98 万元-19.68 万元。新增的 4 款配置主要在鸿蒙座舱方面迎来升级，搭载 MoLA 2.0 混合大模型架构，支持方言交流识别，车机 UI 迎来焕新。200km 乾崑悦享版：官方指导价 16.98 万元，超级置换价 14.98 万元。200km 乾崑悦享鸿蒙 +：官方指导价 16.28 万元，超级置换价 15.28 万元。255km 乾崑臻享版：官方指导价 17.58 万元，超级置换价 16.58 万元。255km 乾崑臻享鸿蒙 +：官方指导价 17.88 万元，超级置换价 16.88 万元。255km 乾崑尊享版：官方指导价 18.58 万元，超级置换价 17.58 万元。255km 乾崑尊享鸿蒙 +：官方指导价 18.88 万元，超级置换价 17.88 万元。235km 四驱乾崑尊享版：官方指导价 20.38 万元，超级置换价 19.38 万元。235km 四驱乾崑尊享鸿蒙 +：官方指导价 20.68 万元，超级置换价 19.68 万元。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/985.htm", "publishedAt": "2026-10-01T01:19:59+00:00"}, {"title": "谷歌推出 Gemini 4 Argon 旗舰 AI 模型，消息称其实战性能遭员工质疑", "summary": "IT之家 10 月 1 日消息，据彭博社报道，Alphabet 公司旗下的谷歌已经开始逐步推出备受期待的旗舰人工智能模型 Gemini 4 Argon，但这家企业内部对于该模型在代码编写等核心领域的实际表现尚存质疑。谷歌于当地时间周三向一小批经过筛选、值得信任的网络安全合作伙伴开放了这款模型，并表示会在完成更多测试之后扩大开放范围，优先面向付费订阅用户。谷歌称，Gemini 4 在多项基准测试当中取得了靠前的得分，其中一项衡量安全能力的测试成绩甚至超越了 OpenAI 的 Astra 模型。不过部分内部员工表示，这些评测指标并不能反映全部情况。几位直接参与该项目的知情人士透露，尽管 Gemini 4 在广为使用的模型效果基准测试上成绩不错，但当谷歌员工实际拿它开展工作时，表现却不尽如人意。这些不愿具名、谈论内部事务的人士称，该模型处理部分代码任务时会遇到困难。谷歌发布上述消息之后，Alphabet 公司的盘后股价上涨约 1.7%。而在常规交易日临近收盘时，随着彭博社报道出员工对该模型的质疑，周三早些时候的涨幅又出现回落。近期谷歌一直在努力研发模型，希望能够同 OpenAI 以及 Anthropic 展开竞争。知情人士称，该公司原本计划在六月份发布另一款版本，即 Gemini 3.5 Pro，但之后放弃了这一开发工作。谷歌方面表示，所谓 Gemini 4 在代码等领域表现不佳的说法并不准确。公司将彭博社的问询引向谷歌 DeepMind 负责人科拉伊 · 卡武库奥卢（Koray Kavukcuoglu）上周发表的表态；他当时称自己对这款模型的性能感到鼓舞。“我对这支团队抱有十足的信心。”卡武库奥卢在科技新闻网站《The Information》主办的一场会议上说，“在我看来，我们必将持续站在技术最前沿，这是确定无疑的。”谷歌内部对此的看法存在分歧。一部分员工认为，Anthropic 的 Fable 与 OpenAI 的 Astra 模型迭代提升的速度已经超过 Gemini。在这些人看来，就算 Gemini 4 发挥出最佳水准，依旧会在部分领域落后于竞品。另有一部分员工则认为，这款即将上线的新版本已经追上领先的人工智能实验室。一名熟悉模型研发工作的谷歌员工表示，公司内部已经“形成广泛共识”，认为 Gemini 4 处于行业前沿水平。这名人士称谷歌已经针对该模型开展了严苛测试，否认该模型难以应对现实当中杂乱复杂的编码任务。谷歌迫切需要 Gemini 4 取得成功。几乎谷歌旗下所有产品都以该系列模型作为底层支撑：既包括谷歌最主要的盈利业务搜索页面顶部给出的人工智能回答，也涵盖地图、邮箱以及浏览器 Chrome。上述每一款产品的用户规模都超过十亿，这是不少竞争对手并不具备的分发优势。但 OpenAI 与 Anthropic 已经不再仅仅售卖模型，转而着手打造自有产品，其中就包括编程智能体。如果谷歌拿不出一款顶尖的新一代模型，竞争对手就会获得更多机会，去说服普通消费者、开发者以及各类企业，让他们相信未来的搜索与软件应当搭建在对手的平台之上。在回复彭博社的提问时谷歌表示，尽管上一代 Pro 模型还是在二月份发布，但此后谷歌旗下人工智能相关产品依旧保持增长，其中包括面向企业版本的 Gemini、面向普通用户的聊天机器人应用，以及谷歌搜索当中的人工智能模式；后两项产品的用户数量都已经突破十亿。Gemini 3去年 11 月，谷歌正式推出了 Gemini 3。这款模型收获不错的评价，外界普遍认为这是谷歌奋力追赶 OpenAI 与 Anthropic 过程当中的一个转折点。谷歌在五月份的开发者大会 I/O 上对外公布新一代迭代版本 Gemini 3.5 Pro，并承诺于次月正式发布。然而原定的发布期限已经过去，知情人士称谷歌后续直接搁置了 Gemini 3.5 Pro 项目。放弃该项目不光阻碍谷歌的人工智能发展规划，还很可能让公司付出高昂的时间与资金代价。彭博行业研究分析师曼迪普 · 辛格（Mandeep Singh）提出，训练开发这一级别的大模型单次训练运行开销最高可达 4 亿美元（IT之家注：现汇率约合 26.87 亿元人民币）；再加上高薪人工智能研究人员的人力投入，整体成本还会进一步走高。如今 Gemini 4 的研发又接连遇到各类难题。熟悉内部评估工作的人士透露，该模型的代码编写能力参差不齐。其中一位知情人员表示，Gemini 并不擅长前端设计，也就是决定应用程序与网页外观和交互体验的相关工作。这有可能成为一次严重挫折，因为谷歌在竞争激烈的人工智能代码工具赛道本就处于追赶位置。除此之外，知情研发人员称它本身属于体量非常庞大的模型。大型模型的运行成本通常居高不下，这或许会给谷歌的利润空间带来压力。“基准跑分内卷（Benchmaxxing）”业内专家表示，谷歌或许正陷入整个行业的通病：过度看重基准测试得分，也就是所谓的“基准跑分内卷”现象。工程师会投入更多精力刷出好看的测试分数，而非开发一款可以切实把任务做好的产品。各家人工智能实验室容易出现这种倾向，毕竟客户往往依靠基准分数评判模型优劣。两位熟悉该模型的人士表示，Gemini 4 似乎也受到这一问题的影响。人工智能初创企业 Surge AI 创始人埃德温 · 陈（Edwin Chen）提出，如果一味依赖基准测试，实验室就会倾向于专门针对特定编程语言优化模型的代码能力，而不是去开发体验良好、设计完善的应用。“可以打个比方：‘没错，我的孩子 SAT 考试分数很高。’可是 SAT 高分并不等同于现实当中的实际能力。”埃德温 · 陈说，“这是一个危害极大的问题。”知情人士同时也指出，Gemini 4 本身依然具备优势。该模型擅长解析文本以外形式的输入内容，例如从视频当中提取元数据；另外它在安全防护、网络安全方面表现突出，输出内容的沟通表达清晰自然。谷歌内部的挫败情绪已经十分明显。此前彭博社一篇报道在采访研究人员时，对方就批评公司体系庞大、层级繁杂，试图把人工智能技术强行嵌入谷歌几乎全部产品线；不断变动的任务目标与优先级调整，导致企业很难落实一套连贯统一的发展策略。与此同时，一批顶尖人工智能研究人员相继离开谷歌，其中包括传奇工程师杰夫 · 迪恩（Jeff Dean）、诺贝尔奖得主约翰 · 江珀（John Jumper），还有诺阿姆 · 沙泽尔（Noam Shazeer）—— 他参与发明的底层技术，正是本轮人工智能热潮的重要基石。今年八月，长期主管谷歌人工智能研究工作的德米斯 · 哈萨比斯（Demis Hassabis）转任董事长一职，将 DeepMind 部门的日常运营工作移交给他长期的副手科拉伊 · 卡武库奥卢。谷歌于周三对外说明，Gemini 4 面向软件工程、金融、法律以及网络安全领域时长较长、复杂度高的工作任务而设计。该模型相比前代版本可以生成更长的回复，单次输出最高可达一百万词元（token），大约相当于七十五万个单词。就在谷歌奋力追赶的同时，竞争对手依旧在高速向前推进。尽管接连发生多起 AI 智能体入侵外部机构的事件，已经有观点认为部分前沿模型的研发速度会有所放缓；就在本月早些时候，Meta 平台公司发布了 Muse 这款 AI 智能体产品，官方称它可以独立完成网购、预约等日常事务。这款应用上线之后迅速登上应用下载榜单前列。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/982.htm", "publishedAt": "2026-10-01T01:14:56+00:00"}, {"title": "Gemini 4 正式发布，我们终于有了一个写作强于代码的前沿模型", "summary": "跑分不可思议，能力谨慎怀疑#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1682765?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-10-01T00:31:33+00:00"}, {"title": "OpenAI 同新思达成合作，共同开发 GPT-Synopsys 芯片设计模型", "summary": "IT之家 10 月 1 日消息，Synopsys（新思科技）当地时间 30 日宣布与 OpenAI 建立战略合作伙伴关系。两家公司签署了一份范围广泛的多年期协议，共同开发 GPT-Synopsys 模型。GPT-Synopsys 结合了 OpenAI 的先进人工智能能力、Synopsys 的 EDA 工具和代理式人工智能能力，可利用 Synopsys 的 EDA 工具执行半导体设计工作流程。此次集成将使模型成为 EDA 工具的原生专家用户，并使工程师能够探索更多设计方案，优化 PPA（功耗、性能、面积），从而快速交付更复杂的设计。工程师可以将设计目标委托给运行工具的智能体，这些智能体负责解读结果、实施更改并迭代，最终生成可供工程师审核的验证结果。为开发这一专用模型，OpenAI 将获得 Synopsys 可信 EDA 工具的授权。两家企业将在研发和联合市场推广计划方面密切合作，并采用共享收益框架。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/968.htm", "publishedAt": "2026-10-01T00:24:51+00:00"}, {"title": "仅用 22 天：Meta Muse 超越 ChatGPT，成美国下载量破 500 万次最快 AI 应用", "summary": "IT之家 10 月 1 日消息，根据市场调查机构 Sensor Tower 公布数据，Meta 的 AI 助手 Muse 上线约三周，下载量突破 500 万次，成为美国 App Store 免费榜榜首，并连续 12 天保持榜首位置。Sensor Tower 高级洞察分析师 Kara Lee 预测 Muse 下载量在 9 月 30 日（耗时 22 天）突破 500 万次，达到这一规模所用时间明显短于 ChatGPT（56 天）、Grok（103 天）与 Claude（492 天）。IT之家附上相关图表如下：Sensor Tower 统计显示，美国市场仅有 23 款应用在上线 22 天内下载量超过 500 万次。其中约 85% 为移动游戏，如《Fortnite》《Pokémon GO》《Candy Crush》。非游戏类仅 3 款：Disney+、HBO Max 与 Threads，同期下载量分别约 2000 万、1800 万与 1400 万。Muse 被定义为“智能体 AI 助手”，可代表用户执行多步骤任务。其能力包括浏览网页、发送电子邮件、在线购物、填写表单以及预订旅行行程。Meta 自 9 月 16 日起加大 Muse 的广告投放力度，当日下载量环比增长 73%。过去两周，Muse 占 Meta 自有广告展示量的最高 50%，Facebook 与 WhatsApp 的展示份额相应下降。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/959.htm", "publishedAt": "2026-09-30T23:45:52+00:00"}, {"title": "谷歌最前沿 AI 模型：Gemini 4 Argon 登场，长周期代码工程 DeepSWE 测试超 Claude Opus 5.5", "summary": "IT之家 10 月 1 日消息，谷歌昨日（9 月 30 日）发布 Gemini 4 Argon，称其为公司迄今最先进的 AI 模型，但目前并未面向公众全面开放。定位方面，Gemini 4 Argon 是谷歌当前“最先进”模型，重点是长流程软件工程、企业知识工作和网络安全防御。官方称其在真实世界软件工程测试创纪录，网络安全基准并列第一，并在金融、法律等专业任务基准领先。模型特性方面，Gemini 4 Argon 单次输出上限达到约 100 万 tokens，高于此前的 64,000 tokens，适合处理大型代码库、长文档和多阶段任务。谷歌 DeepMind Gemini 产品负责人 Tulsee Doshi 表示：“Argon 是一个功能全面的模型，在多个领域都具备前沿能力。”在新模型在某些编码和知识工作基准测试中处于最先进水平，在多个方面都优于竞争对手 OpenAI 的前沿模型 GPT-6 Astra。性能方面，谷歌宣称其 DeepSWE v1.1 得分为 77.9%。Claude Opus 5.5 的得分为 74.2%，GPT-6 Astra 的得分为 74.1%。安全防御性能方面，谷歌对 Gemini 4 Argon 进行了训练，使其“在网络安全防御方面能力超群”，比 3.8 Flash Cyber 有了显著提升。在评估模型修复安全漏洞能力的 CWE-bench v1 测试中，Argon 以 68% 的最高分并列第一。评测项目Gemini 4 Argon对比 / 排名主要考察能力 DeepSWE v1.177.9%第 1；Claude Opus 5.5 为 74.2%，GPT-6 Astra 为 74.1%长周期、真实软件工程任务 Vibe Code Bench91.9%领先竞争模型自然语言到代码、应用构建 CWE-bench v168%并列第 1自动发现并修复软件安全漏洞 AutomationBench51.3%第 1跨业务软件的端到端自动执行 LVBench91.7%当前最佳 / State of the art长视频理解 GraphWalks，0–128K99.7%极高水平长上下文图结构推理 GraphWalks，256K–1M84.2%明显领先超长上下文推理 Agent’s Last Exam39.5%高于 GPT-6 Astra 的 34.2%综合代理与知识推理 Vals Index68.9%高于 GPT-6 Astra 的 63.1%、Claude Opus 5.5 的 67.0%金融、编程、法律、税务等经济任务 Artificial Analysis Intelligence Index53与 GPT-6 Astra 持平多项综合智能与代理能力分发方面，谷歌表示会分阶段发布，第一阶段通过名为 Fairwind Program 的计划，提供给受信任的网络安全防御者，并参与美国政府的自愿预发布模型访问流程。费用方面，谷歌计划先向付费 API 客户和 Google AI Ultra 用户开放，之后再扩大到企业和普通消费者：项目初始价格后续价格输入 tokens每百万 2 美元（IT之家注：现汇率约合 13.4 元人民币）每百万 4 美元（现汇率约合 26.9 元人民币）输出 tokens每百万 10 美元（现汇率约合 67.2 元人民币）每百万 20 美元（现汇率约合 134.4 元人民币）缓存输入 tokens输入价格的约 95% 折扣—", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/953.htm", "publishedAt": "2026-09-30T22:57:36+00:00"}, {"title": "谷歌开源面向自主 AI 代理的 Kubernetes 风格编排器 AX", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/M6BRTrsyJvUg8y0M0kyh?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-30T20:40:07+00:00"}, {"title": "DeepSeek 开源昇腾平台基础设施组件，覆盖 TileLang、计算库与分布式通信库", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/t5i2Yv2z0LwIbK36lteR?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-30T19:40:16+00:00"}, {"title": "OpenAI Dot 虚拟机配置曝光：AMD 霄龙 9V74 处理器 + 9.73GB 内存，Geekbench 7 多核 9435 分", "summary": "IT之家 9 月 30 日消息，OpenAI 今日凌晨在 DevDay 活动上发布了 Dot 智能体，而每个 Dot 运行在独立的云端虚拟机中。Dot 虚拟机现已出现在 Geekbench 基准测试平台中，显示其搭载了 AMD EPYC 9V74 服务器处理器，每个 Dot 虚拟机实例分配 9 个核心，单核得分 1667，多核得分 9435。另外，该实例配备 9.73GB 内存和 32GB 存储空间。该处理器基于 Zen 4 架构，基础频率约 2.6GHz，加速频率可达 3.7GHz。虚拟机运行 Ubuntu 24.04.3 系统，但也有用户截图显示部分实例运行 Debian Linux。每个 Dot 虚拟机均预装了丰富的 Linux 软件环境，包括 Chromium 浏览器、终端和文件管理器，用户还可让 AI 智能体安装其他工具。预装软件涵盖多个领域：创意类包括 Blender、GIMP 和 Inkscape；视频剪辑为 Kdenlive；游戏开发为 Godot。工程工具包括 FreeCAD、OpenCAD 和 KiCAD；科学计算则包含 QGIS、ParaView 和 3D Slicer。OpenAI Dot 智能体基于 GPT-6 Astra 模型，可通过插件连接到超过 4000 款应用。用户可在 ChatGPT 桌面端、网页端和移动端与 Dot 互动，也可通过 Slack 和 Teams 与 Dot 通信。每个 Dot 都拥有独立的云端虚拟机，所有保存的凭证对 AI 模型保持隐藏。企业还可设置拥有专属身份和权限的专用 Dot。与 Meta 的 Muse 虚拟机相比，Dot 在核心数和内存上占优。Muse 每个虚拟机仅配置 2 个 vCPU 和 8GB 内存，但提供 100GB 存储空间，远高于 Dot 的 32GB。目前，Dot 已向 ChatGPT Pro 和 Business Premium 用户逐步开放，但围绕该产品的域名争议也已出现（IT之家注：dot.com 域名目前归属马斯克旗下 xAI，该域名直接跳转至 Grok Bot 下载页面）。相关阅读：《OpenAI 推出全天候 AI 智能体 Dots，相关域名已被马斯克拿下》《尴尬时刻：OpenAI 全天候 AI 智能体 dots 首次公开演示卡壳》《OpenAI 发布 dots 全天候智能助理：可爱卡通形象，Astra 模型加持》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/936.htm", "publishedAt": "2026-09-30T15:03:39+00:00"}, {"title": "曝美国联邦贸易委员会对 Anthropic、OpenAI 及其他 AI 实验室加大调查力度", "summary": "IT之家 9 月 30 日消息，据纽约邮报消息，政府官员透露，美国联邦贸易委员会 FTC 正在加大对 Anthropic、OpenAI 及其他前沿人工智能实验室的全面调查力度，旨在彻查其技术可能对消费者造成的潜在风险。FTC 计划向这些科技巨头下达类似于传票的正式要求，强制其提交相关信息。2026 年 7 月，Hugging Face 的人工智能开源社区遭遇 OpenAI 智能体入侵。据悉，FTC 主席安德鲁 · 弗格森（Andrew N. Ferguson）早在此次事件发生前就已启动相关调查，目前该机构正进一步起草民事调查传令，拟依法强制传唤各头部 AI 企业的高管提供证词。一位 FTC 高级官员表示：“FTC 计划依法强制传唤这些企业的高管，要求其就自身产品情况，以及此前各方指称其产品可能对广大消费者乃至全美公众构成的潜在威胁，如实提供证言。”据IT之家此前报道，本周二，多家顶尖 AI 企业的掌门人 —— 包括 Anthropic 的达里奥 · 阿莫迪 (Dario Amodei)、OpenAI 的萨姆 · 奥尔特曼 (Sam Altman)、谷歌的桑达尔 · 皮查伊 (Sundar Pichai) 以及 xAI 的埃隆 · 马斯克 (Elon Musk)—— 齐聚白宫共同签署协议，承诺将对各自的人工智能模型实施自主监管与安全自律。弗格森此前曾多次公开表态，坚称人工智能企业必须对其旗下智能体的行为承担法律追责；作为该监管立场的鲜明代表，他也出席了此次白宫签署仪式。另据华尔街日报本月早些时候披露，在发起此次全面审查之前，FTC 就已要求 OpenAI 等多家前沿 AI 企业提交相关内部记录，以调查评估 AI 聊天机器人对儿童及青少年心理健康所产生的潜在影响。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/924.htm", "publishedAt": "2026-09-30T14:13:22+00:00"}, {"title": "8899 元起：三星 Galaxy Tab S12+/S12 Ultra 平板发布，天玑 9500 芯片、12.6/14.6 008/984.htm", "publishedAt": "2026-10-01T01:16:27+00:00"}, {"title": "美国加州《反机器人老板》法案生效，禁止完全依赖 AI 解雇或惩戒员工", "summary": "IT之家 10 月 1 日消息，IT之家 9 月 11 日消息，美国加利福尼亚州州长 Gavin Newsom（加文 · 纽森）当地时间昨日签署《2026 年反机器人老板法案》(SB 947)，对人工智能在人力资源领域的应用作出规制。该法案禁止加州雇主完全依赖基于人工智能的自动化决策系统来解雇或惩戒员工；要求雇主在使用自动化决策系统做出解雇和惩戒决定时，必须进行人工监督和核实；要求雇主向员工披露解雇和惩戒决定中的自动化决策系统使用情况。提出这一法案的州参议院 Jerry McNerney 表示：任何员工都不应该被机器人老板解雇或处分。人工智能系统有潜力提高生产力，但它们也容易出错、产生偏见和判断失误。州长签署 SB 947 法案，确保了工作场所中人工智能的人工监管。人工智能必须始终是人类控制的工具，而不是反过来。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/965.htm", "publishedAt": "2026-10-01T00:14:48+00:00"}, {"title": "初探安卓 7.0 测试版苹果 Apple Music：首迎液态玻璃设计", "summary": "IT之家 10 月 1 日消息，科技媒体 9to5Google 昨日（9 月 30 日）发布博文，报道称苹果已面向安卓平台，推出 7.0 测试版 Apple Music 应用，在 iOS 平台推出一年后首次在安卓上引入“液态玻璃”设计语言。外观方面，安卓 7.0 测试版 Apple Music 现在采用悬浮式底部栏，让用户可同时看到上方、下方和两侧内容。导航栏带有少量半透明效果，用户能够看到下方的纯色背景。与 iOS 版不同，滚动屏幕不会将底部栏折叠成更紧凑版本，所有内容保留原位。上方小播放器采用相同处理方式，不再与底部栏对齐。应用顶部栏已更新，页面标题和溢出菜单位于同一行。三点图标不再是红色，改为放置在圆形容器中。“库”标签页更新最为显著，“编辑固定项”（Edit Pins）和“编辑分类”（Edit Categories）现在调整到溢出菜单（指界面右上角的 \"⋮\" 图标，点击后展开更多选项的菜单）。新版还改进艺术家页面，背景根据封面图片进行主题化处理。这与 iOS 设计风格更加一致，播放按钮更加醒目，信息页面不再位于页面底部。分享按钮移至右上角。IT之家附上相关图片如下：设置页面进行现代化改造，分组更加合理。正在播放功能没有重大变化，iOS 版也未进行重大更新。Apple Music 7.0 的状态栏和导航栏现在采用边缘到边缘设计。以上左侧为现有版本，右侧为 7.0 测试版", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/008/962.htm", "publishedAt": "2026-09-30T23:56:30+00:00"}, {"title": "突发！苹果全新产品线曝光，Siri AI 进家门", "summary": "致敬 2002，面向 2030#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1682750?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-09-30T15:04:28+00:00"}, {"title": "一个忘关的开关，与企业Agent的全栈技术账单", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/z9VP6ZQ3vCxTrk1VdU5D?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-30T12:10:15+00:00"}, {"title": "Manus 2.0回来了！给AI配手机号和钱包，还能拉群干活", "summary": "给Agent配上手机号，再拉个群", "sourceName": "量子位", "sourc const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
