const DATA = {"date": "2026-10-20", "generatedAt": "2026-10-20T01:30:35Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "被控在办公室安装窃听设备，OpenAI 前工程师保释申请遭驳回", "summary": "IT之家 10 月 20 日消息，一名被指控在 AI 初创企业 OpenAI 办公室安装窃听设备的前 OpenAI 工程师，当地时间周一被旧金山法官驳回保释申请，这意味着他只能在狱中开展辩护。美国司法部于当地时间 10 月 9 日逮捕了阿卜杜勒拉赫曼 · 阿尔福赞（Abdulrahman Alfozan），指控他使用或企图使用设备截获口头通信。检方称，他在 OpenAI 一间会议室的电视机后方放置了录音设备。联邦调查局的宣誓证词中附有照片：该设备用卫生纸包裹，还有一张照片中，一名被认定为阿尔福赞的男子正朝电视机后方张望。周一，这名工程师戴着黄色医用口罩，身穿监狱发放的橙色运动衫，出现在旧金山法院。治安法官亚历克斯 ·G· 谢（Alex G. Tse）向阿尔福赞的辩护团队质询，评估其未来可能缺席庭审的风险。谢法官表示，阿尔福赞的妻子和儿子已经前往沙特阿拉伯，暂无回国计划。法官还与律师亚辛反复核实阿尔福赞此前预订的一张前往沙特的单程机票。谢法官指出，沙特阿拉伯与美国之间没有引渡协议，他怀疑阿尔福赞在湾区缺乏足够的社会联系，无法保证其不会离境。阿尔福赞的代理律师威廉 · 佩尼克（William Pernik）提出，不应将他羁押，而是给他佩戴脚踝监控器、居家软禁，并限制其使用电子设备。律师还称，阿尔福赞愿意拿出“家里几乎全部财产”作为保释金，其中包括约价值 100 万美元（IT之家注：现汇率约合 669.4 万元人民币）的投资账户。“他愿意交出自己拥有的一切，以此表明‘我不会跑路’。”佩尼克说道。佩尼克与另一位辩护律师纳斯 · 亚辛（Nas Yasin）以他即将参加入籍面试，作为他与本地存在关联的佐证。“距离实现每一位移民在美国的梦想，他只剩几周时间。”佩尼克说。亚辛向谢法官表示，她得知阿尔福赞的妻子已经拿到短期访客签证，可以返回美国，以此增强当事人与湾区存在联系这一主张的说服力。谢法官还向辩护团队询问了大量有关阿尔福赞和沙特阿拉伯之间关联的问题，其中包括沙特领事馆承诺为他缴纳保释金并支持其法律抗辩。美国助理检察官尼克 · 帕克（Nick Parker）代表检方出庭。他主张，即便有 100 万美元（现汇率约合 669.4 万元人民币）保释金可能被没收，也不足以约束阿尔福赞；一旦离开美国，他在沙特或许能赚取更高收入。谢法官回应：“一旦他出境，本案就无法继续推进，这种风险真实存在。”法官将本案的下次听证会安排在 11 月初。逮捕消息对外公布时，OpenAI 称这套录音设备“设计精密”，同时表示没有发现证据证明他窃取了 AI 模型权重、源代码或是客户信息。OpenAI 已经解雇阿尔福赞。该项指控最高可判处五年监禁。佩尼克上周发表声明，表示这些指控“看起来完全不符合他本人的品行”。35 岁的阿尔福赞持有美国绿卡，是美国合法永久居民。他曾就读麻省理工学院，2017 至 2023 年在 Meta 任职。在工程初创企业纳什技术公司短暂工作之后，阿尔福赞于 2025 年加入 OpenAI。联邦调查局探员已经收缴了阿尔福赞的沙特护照。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/015/090.htm", "publishedAt": "2026-10-20T00:56:17+00:00"}, {"title": "挑战英伟达 CUDA：亚马逊推出开源工具 TorchNeuron，自研 Trainium 芯片轻松运行 PyTorch 代码", "summary": "IT之家 10 月 20 日消息，当地时间 10 月 19 日，亚马逊宣布推出开源工具 TorchNeuron，借助该工具，开发人员编写的 PyTorch 代码可以在亚马逊的自研 Trainium 芯片上本地运行，只需更改一次配置，无需重写。IT之家获悉，TorchNeuron 将于当地时间 10 月 20 日在加州圣何塞举行的北美 PyTorch 大会上以开源许可形式正式发布。PyTorch 是由 Meta 主导的开源框架，被大多数人工智能开发者所采用。英伟达投入了十多年的时间研发 CUDA 工具，能够让 PyTorch 代码在英伟达的芯片上高效运行。据介绍，亚马逊工程师分别在传统芯片和 Trainium 芯片上运行了相同的 AI 训练脚本。唯一的区别仅在于代码中指定所用芯片的设置参数。结果显示，AI 模型在两种环境下学习到的内容完全一致，学习速度也相同。这意味着开发者原本用于测试、调试和扩展 AI 模型的工具，无需任何修改，即可直接在 Trainium 上使用。亚马逊称，TorchNeuron 为人工智能行业带来了一项长期缺失的关键要素：真正可行的选择权。当开发者能够在不同芯片之间自由切换而无需付出额外代价时，芯片厂商就必须通过提供更具竞争力的产品来赢得开发者的青睐；而开发者则能从中受益，实现成本的降低与迭代速度的提升。此外，亚马逊正积极参与 PyTorch 上游开发，与 PyTorch 社区合作，移除那些将该框架与特定芯片相绑定的代码。其目标是让 PyTorch 对整个开发者社区而言更具“硬件无关性”，而不仅仅是服务于 Trainium 用户。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/015/082.htm", "publishedAt": "2026-10-20T00:22:37+00:00"}, {"title": "新 AI 工具问世：仅凭一张面部照片即可预测癌症患者生存几率", "summary": "IT之家 10 月 20 日消息，据彭博社报道，研究人员开发出一款人工智能工具，仅凭一张面部照片就能预测癌症患者的生存几率。该工具可以补充医生的临床经验判断，有望为治疗方案的制定提供参考，在医疗资料不足的场景下尤其有价值。这个新模型经过训练，既可以估算人的年龄，也能针对癌症患者预测生存情况。研究团队使用超过 4000 万张人脸图像，以及 3 万多名癌症患者的照片完成模型训练，其中不少患者已经离世。发表在《柳叶刀 · 数字健康》期刊上的这项研究显示，该工具会为患者生成风险评分，分数最高的患者更有可能在 90 天内死亡。科研人员表示，这类研究成果尚属首次。麻省总医院布莱根癌症研究所放射肿瘤医师、论文作者之一雷蒙德 · 马克（Raymond Mak）称，医生在受训时就会通过患者的外貌状态评估病情，但医生“通常很难准确预估临终患者的剩余生存期”。马克在采访中说：“我们认为借助人工智能，仅靠一张面部照片，就能捕捉到人体的部分生理储备状况与死亡风险。”这款 AI 工具估算年龄的误差约为 5 岁，还能可靠地把患者划分成高风险和低风险两组，两组人群的死亡风险存在明显差异。该模型在不同年龄、种族、性别以及不同癌症类型的人群中都可以生效。IT之家注意到，越来越多 AI 工具正在癌症检测与治疗领域开展试验：有的通过阅片辅助诊断，有的分析基因与生活风险因素，预测个体患癌风险。尽管实验结果看起来前景可观，萨里大学视频处理与机器学习教授米罗斯瓦夫 · 博贝尔（Miroslaw Bober）却认为，这款工具还不能投入临床使用，他并未参与本次研究。“预测结果不等于解释成因。”博贝尔说，“该研究没有证明，这套预测能在医生对患者整体健康状况的评估之外，提供额外具备临床价值的信息，而研究本身也没有衡量医生的这类评估。”他补充，这个工具还需要对照医生的主观判断，在不同医院、不同患者群体中开展更多测试。和团队一同开发该工具的马克表示，模型对生存期的预测效果之好，让他十分意外。团队发现，算法在评估时主要关注鼻梁和眼下区域。马克查阅资料后发现，希波克拉底最早描述过：眼窝凹陷、太阳穴塌陷、鼻尖瘦削，都是生命即将走到尽头的早期外在体征。马克称，该工具不会用来拒绝或限制患者获得治疗。“我们知道，面对临终患者，医生有时会采取过度治疗。”在他看来，这只是“给医生多增加一项参考信息”。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/015/079.htm", "publishedAt": "2026-10-19T23:56:44+00:00"}, {"title": "赶在 Anthropic 上市前：消息称 OpenAI 加速新一轮融资进程，估值或超 1.4 万亿美元", "summary": "IT之家 10 月 20 日消息，据路透社报道，两位知情人士称，OpenAI 正争分夺秒地争取投资者承诺，力求在竞争对手 Anthropic 预计于 11 月中旬上市之前完成融资。此次融资节奏异常迅速，若顺利完成，这家 ChatGPT 开发商的估值可能超过 1.4 万亿美元（IT之家注：现汇率约合 9.37 万亿元人民币）。知情人士表示，这种紧凑的时间安排在一定程度上反映了 OpenAI 想要抢在 Anthropic 之前行动的意图，因为这两家处于行业前沿的实验室正越来越多地争夺同一批投资者群体。此外，OpenAI 也希望借势其近期推出新模型后所实现的营收增长，进一步巩固自身地位。其中一位知情人士透露，软银集团、总部位于阿布扎比的 MGX 以及 OpenAI 的其他现有支持者，目前正就参与这轮规模约 300 亿美元（现汇率约合 2,007.82 亿元人民币）的融资进行洽谈。上周，在 Anthropic 举办投资者日活动之际，OpenAI 也与多家长期投资基金及主权财富基金进行了会晤。知情人士称，OpenAI 本轮融资的推进速度预计将远超同等规模融资的常规节奏。熟悉 OpenAI 的投资者指出，该公司需要大量资本来支撑其庞大的基础设施投入；同时，若 IPO 市场环境恶化导致其原定的 2027 年上市计划被迫推迟，这些资金也能起到稳固资产负债表的作用。尽管市场对这两家公司的股份需求旺盛，但投资者也面临着挑战：他们需要在短短几天或几周内，对这两家相互竞争且业务复杂的公司进行评估，并做出资本配置决策。知情人士表示，一些投资者认为，OpenAI 此番积极融资，旨在锁定那些原本可能将更多资源投入到 Anthropic IPO 中的资金。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/015/078.htm", "publishedAt": "2026-10-19T23:51:53+00:00"}, {"title": "日本演员工会发布 AI 语音使用准则，龙珠悟空配音演员怒批 AI 盗用其声音", "summary": "IT之家 10 月 20 日消息，随着生成式 AI 给各行各业创作者带来越来越多的困扰，日本配音演员正在寻找属于自己的方式，抵制他人未经授权使用他们的声音。上周，代表日本配音演员的工会发布了一份 AI 使用相关准则，不少配音演员也讲述了这项技术给他们个人与职业带来的困境。IT之家注意到，多年来，日本配音演员一直在抵制未经许可盗用自身声音的行为。2024 年，一批配音演员联合成立组织，抗议 AI 声音的滥用，他们特别指出，相关领域缺少版权法律保护。曾为《进击的巨人》《电锯人》《游戏王》配音的津田健次郎（Kenjiro Tsuda），甚至就社交媒体大量使用其声音的视频起诉了 TikTok，不过在相关视频下架后，这起案件被驳回。部分配音演员支持搭建机制，在获得授权的前提下，将 AI 用于复刻表演者声音的私人场景，但日本配音演员群体对这项技术的主流看法是：它会窃取自己的劳动成果，抢走未来的工作机会。在周四的新闻发布会上，日本演员协会（JAU）发布生成式 AI 使用准则第一版。准则规定，这套新规适用于所有借助 AI 技术复刻演员声音生成的音频，包括未经许可用于语音合成、深度学习、机器学习等场景。据 Automaton 报道，准则要求，任何想要复刻演员声音的主体，在流程的每一步都必须取得当事人同意。如果 AI 企业打算将演员的声音用于 AI 训练，必须获得表演者许可。同时，经授权使用 AI 生成语音被视作一类“表演”，企业需要向演员支付报酬或版税。发布会现场有多名配音演员发言，反对这项技术被用于未经授权的场景。因在《龙珠》系列中为孙悟空配音而广为人知的野泽雅子（Masako Nozawa）在接受日本放送协会（NHK）采访时表示：“未经我的许可就使用我的声音，我无法原谅。这件事让我十分愤怒，这和盗窃没有区别。我的声音、我的表演都属于我。哪怕只是一点点使用，都应该事先征得我的同意。”这位配音演员还提到，她听过的 AI 复刻版本的声音“没有情感”。该工会共有约 2600 名配音演员与演员会员，这份准则也是日本首批针对 AI 语音录制发布的行业规范。在日本，社会对 AI 的接受度整体高于美国，这份准则的发布释放出强烈的抵制信号。日本工会的力量相比美国工会更强，因此这份规范很可能对未经授权使用 AI 复刻演员声音的行为形成约束。面对网络攻击与版权侵权问题，日本政府目前正被问及如何监管生成式 AI。在整个国家摸索 AI 治理方案的阶段，日本演员协会的这份公告备受关注。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/015/074.htm", "publishedAt": "2026-10-19T23:39:30+00:00"}, {"title": "Steam 新品节充斥低质 AI 游戏，玩家呼吁平台新增 AI 内容筛选功能", "summary": "IT之家 10 月 20 日消息，Valve 面向独立游戏与试玩版的活动 Steam 新品节（Steam Next Fest）已经开幕，尽管历届新品节都会涌入大量粗制滥造的游戏，但本届这类作品的数量似乎比以往更多。浏览新品节页面，很容易就能发现大量游戏的美术风格看起来就像是通过简单的 ChatGPT 提示词生成的。随着 Claude Opus 5.5 发布，过去几周围绕其出现大量反编译与混搭模组，大量游戏要么使用 AI 生成图做宣传素材，要么直接由 AI 生成，这一现象并不出人意料。IT之家注意到，不少 Steam 玩家对此感到不满，他们需要在海量 AI 生成游戏里筛选人类亲手制作的作品。有用户直接请求 Steam 把这类劣质作品过滤掉。在 Steam 社区子版块的一则帖子中，用户斯凯尔斯戈斯特（ScalesGhost）写道：“我浏览了新品节，很喜欢探索队列这个功能，只是希望能有更多自定义选项。我特别希望可以筛选掉所有包含 AI 生成内容的游戏（毕竟 Steam 已经要求开发者主动标注这类内容），同时可以屏蔽特定标签，比如增量游戏。”Steam 本身已经拥有完善的标签系统，实现这类筛选功能难度不大，但 Valve 在 5 月削减过用户自定义标签的数量。想要上线该筛选功能，Valve 需要新增“AI”这一标签。并非只有斯凯尔斯戈斯特一人注意到本届新品节低质量投稿泛滥。在另一篇讨论 AI“毁掉新品节”的帖子中，用户艾玛布尼（EmmaBooney）说：“没错，我也发现了。平时我会翻找有意思的游戏…… 现在满眼都是 AI 粗制作品，我已经不想逛了。”与此同时，用户伊索罗维（aesoprowwy）表示：“希望大量这种靠 AI 快速拼凑的游戏拉低整体互动数据，让 Steam 出台更严格的投稿规范。”不过，Steam 新品节充斥粗制滥造游戏并非新鲜事。Valve 长期对 Steam 平台内容审核采取宽松策略，一般依靠算法推荐热门游戏，把低质量劣质作品压下去。虽然本届新品节的情况看起来比往届更糟，但大多数玩家不妨先等几天，等优质试玩版自然冲上榜单，大部分粗制作品被算法埋没。而这一切发生的背景，是 AI 在游戏开发领域的应用日益普及。就在上周，Epic 推迟了旗下一款即将推出的星球大战射击游戏，以便转向“AI 优先”的开发路线。Epic 首席执行官上周还在社交平台上称，Epic 游戏商店启动器就是用 AI 快速开发出来的。卡普空同样在拥抱 AI，将其用于 REX 项目。据报道，该项目会持续优化 RE 引擎，多款本年度高分游戏，例如《生化危机：安魂曲》与《Pragmata》，都使用这款引擎打造。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/015/072.htm", "publishedAt": "2026-10-19T23:25:46+00:00"}, {"title": "英伟达官宣新突破：创纪录量子容错计算模拟所需物理比特减少 90%", "summary": "IT之家 10 月 20 日消息，当地时间 10 月 19 日，英伟达宣布在德国于利希超级计算中心（Jülich Supercomputing Centre）开展了创纪录的容错量子计算模拟。英伟达研究人员利用欧洲最大规模超级计算机 JUPITER（木星）完成此次模拟，这是一个基于英伟达 GH200 超级芯片组成的系统。本次使用 8192 块 GPU 完成 104 量子比特容错量子计算模拟，是迄今为止针对容错量子计算系统所进行的最大规模综合模拟。该模拟使研究人员能够全面探索并验证“魔态培育”（Magic State Cultivation），与以往的方法相比，它所消耗的物理量子比特数量减少了 90%，将加速量子计算在药物研发、金融建模和材料科学等领域的实际应用进程。IT之家获悉，本次模拟揭示了噪声对容错量子计算的影响，使研究人员能够在构建硬件之前优化设计方案 —— 这将使实现实用型量子计算机的进程缩短数年。延伸阅读JUPITER 是欧洲首台百亿亿次（Exascale）超级计算机，由于利希超级计算中心运营，位于德国。其核心是 Eviden 提供的 JUPITER Booster，配备约 24000 颗英伟达 GH200 Grace Hopper 超级芯片，可每秒执行百亿亿次（1 ExaFLOP/s）计算。该机器于 2025 年正式投入使用，项目由德国与欧洲共建，一半资金来自欧洲高性能计算联合项目（EuroHPC JU），四分之一来自德国联邦研究、技术和航天部（BMFTR），四分之一由北威州文化和科学部（MKW NRW）通过高斯超级计算中心（GCS）提供。魔态培育（Magic State Cultivation）是一种面向容错量子计算的方案。在它出现之前，生成通用容错量子计算所需的非 Clifford T 态，通常依赖传统的“魔态蒸馏”（distillation）协议，这种方式物理量子比特开销极大，据测算会占据量子计算机总物理量子比特的 90% 至 95%。魔态培育则先利用小型、可交互的颜色码（color code）生成并提纯量子态，再通过码切换将其“嫁接”到表面码（surface code）中，从而大幅压缩所需的物理量子比特数量。2026 年 10 月 15 日，谷歌量子 AI 团队在《Science》上发表研究，首次在其实体硬件 ——Willow 超导量子处理器上实现了魔态培育，将误差降低约 40 倍，并生成了逻辑保真度达 99.99% 的 T 态。该团队同时表示，这一成果仍需在更大规模上得到验证，而英伟达此次模拟正是针对这一空白。英伟达此次模拟的技术细节包括：在 JUPITER 上动用了 8192 块 GPU；此前于利希的同类研究仅在理想、无噪声条件下模拟了 50 个量子比特，而本次是在真实硬件噪声下模拟魔态培育；团队先在英伟达加速量子研究中心的 GB200 NVL72 系统上将方法从 4 块 GPU 扩展至数百块，再迁移到 JUPITER 的 8192 块 GPU 上，使原本需要数周的模拟缩短至数天；所用软件为 cuQuantum 库以及 CUDA-Q 平台的容错逻辑层。英伟达 CEO 黄仁勋表示，有用的量子计算将需要极其复杂、容错的系统，理解它们在大规模下的行为对构建这些系统至关重要。于利希超级计算中心主任 Kristel Michielsen 则指出，欧洲对 JUPITER 的投资使研究人员能够探索此前无法触及的问题，并帮助科学家挑选最有可能带来实用应用的设计方案。值得注意的是，就在同一天（2026 年 10 月 19 日），Quantinuum 也宣称其 Helios 机器取得了创纪录的逻辑保真度。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/015/071.htm", "publishedAt": "2026-10-19T23:25:14+00:00"}, {"title": "微软警示前沿 AI 模型不可信：AI 智能体堪比内部威胁，推出 Guardian Agents 防护方案", "summary": "IT之家 10 月 20 日消息，微软于当地时间周一推出了多项全新安全功能，旨在帮助企业抵御日益严峻的智能体带来的安全威胁。发布该产品之际，微软持续向企业警示人工智能与智能体存在的各类风险。IT之家注意到，本次新增功能中最受关注的当属守护智能体（Guardian Agents），这项新功能用于监控企业内部正在使用的各类 AI 智能体。守护智能体隶属于感知项目（Project Perception），感知项目是微软在 6 月推出的产品。感知项目是微软针对 Anthropic 的 Mythos、Fable 等强大黑客模型，以及 OpenAI 的安全漏洞扫描系统破晓（Daybreak）所给出的应对方案。感知项目最初上线了三类智能体：扮演黑客角色实施攻击的红队智能体，负责侦测红队攻击、评估漏洞的蓝队智能体，以及专门修复漏洞的绿队智能体。该产品最初的设计前提是，AI 黑客会来自企业外部。但近期，微软首席执行官萨提亚 · 纳德拉（Satya Nadella）发出警告，AI 层面的威胁源头，有可能正是企业自身部署、付费使用的智能体，就像一名行为失控的内部员工，也就是常说的“内部威胁”。本月早些时候，纳德拉在个人博客中提出警示：是时候不再信任 AI 模型供应商，即便厂商为自家具备自主执行能力的智能体产品做出安全保障承诺。他建议企业搭建独立系统，这套系统不受 AI 实验室管控，用以监督和管控这些人工智能实验室推出的产品所对应的智能体。他写道：“我们正在部署这类复杂的智能体系统与模型，它们可以访问我们最敏感的数据，还能代表我们执行关键业务操作！我们绝不能把智能体代我们行事的责任外包出去。模型供应商给出的保证，并不能免除我们的这份责任…… 换言之，我们需要将智能能力的供给，和对它的管控权限分离开。”在介绍守护智能体时，微软安全业务负责人海耶特 · 加洛（Hayete Gallot）的表述更为直白。她写道：“遗憾的是，前沿模型无论来源是哪里，都无法完全信任。”她补充，这并非因为模型本身带有恶意或者容易被黑客攻破，而是其行为具有不可预测性。模型训练目标是完成任务，而非遵守“组织规范或判断准则”。除此之外，这些智能体往往手握高权限，能够访问各类数据与工具，一旦失控会造成严重损害。微软给出的这套解决方案，既出人意料，也带有自身商业考量。令人意外的一点在于，微软与 OpenAI、Anthropic 关系紧密，同时对两家企业都有投资。OpenAI 也是微软云业务的大客户，微软自身也设有 AI 实验室研发大模型。也就是说，微软正在让客户对自己部分商业合作伙伴的产品产生警惕。而从商业利益角度来看，微软希望企业从自己这家云服务商手中购买智能体安全产品，而不是向 Anthropic 和 OpenAI 采购。抛开利益冲突不谈，这套逻辑本身站得住脚：监控智能体行为的软件，应当和智能体的提供方相互独立，就像审计机构需要独立于被审计的组织。正如纳德拉所说：“我们需要将智能能力的供给，和对它的管控权限分离开。”微软正通过多种方式抓住这一商业机遇。除守护智能体之外，微软还在 Microsoft Defender 产品内新增智能体检测功能，最多可识别员工带入工作环境的 60 种智能体，其中包括 Claude Code、Codex 以及 OpenClaw。产品同时新增功能，可以限制智能体访问数据与系统的权限，并根据任务动态调整智能体权限。如果智能体即将做出高风险操作，系统会要求人工审批。将智能体视作不可信任的内部威胁这一思路，也正在整个行业逐步形成共识。微软是英伟达全新开放智能体安全平台（Open Agent Safety Platform）的创始成员，该平台已经获得超过 100 家科技企业支持。该平台将智能体隔离在安全环境中，依托硬件监测并终止异常行为，功能类似紧急切断开关。在此之前，微软已经发布专为智能体打造的新款 Surface Laptop Ultra 笔记本电脑，设备搭载英伟达芯片，内置智能体安全管控模块。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/015/069.htm", "publishedAt": "2026-10-19T23:13:32+00:00"}, {"title": "大批API账户被刷爆！OpenCode遭黑客围攻48小时，官方甩锅“蒸馏攻击”被质疑", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/K5J7yb60djWKM6vUZqwq?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-19T21:48:11+00:00"}, {"title": "英伟达黄仁勋：AI 是新工具，你的专业知识不会被取代", "summary": "IT之家 10 月 20 日消息，在柏林对话德国总理弗里德里希 · 默茨（Friedrich Merz）时，英伟达首席执行官黄仁勋表示 AI 不只是聊天工具，它将进入工厂、机器人和医院等场景，增强已有的专业能力和产业经验。在本次对话中，黄仁勋和默茨讨论如何结合德国制造业优势与 AI，推动 AI 在汽车、机械制造及中小企业中普及。德国联邦政府同时与英伟达签署联合意向声明，拟共同推进面向物理 AI 的先进模型，让 AI 进一步应用于现实世界的工业场景。黄仁勋表示，德国企业积累的工程、制造和科学知识是重要优势，AI 将增强这些能力。他将 AI 形容为一种“新工具”，鼓励企业利用技术放大自身专长。默茨则呼吁中小企业让 AI 利用已有数据，将产业积累转化为竞争力。投资方面，英伟达宣布计划投资四家德国初创企业，覆盖机器人、医院信息系统、视频配音与卫星制造。其中，Avelios Medical 开发将 AI 融入临床和行政流程的医院信息系统，目标是让医生和护士腾出更多时间照护患者。工业应用方面，西门子宣布与英伟达推进 AI 驱动的自主工厂，并披露完全虚拟化的投产准备可使工程工作量最多减少 85%，基于智能体的生产规划可节约最多 20% 的成本。在本次对话中，黄仁勋对德国企业说：“那些知识属于你们，无法被替代…… 把握这项技术 [指 AI]，它是一种新工具。”德国总理默茨强调，中小企业长期积累的数据是德国的优势；黄仁勋赞同，并指出德国大大小小的制造企业拥有世界级专业知识。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/015/066.htm", "publishedAt": "2026-10-19T19:31:32+00:00"}, {"title": "智己推出至高 2 万现金限时优惠，LS8 NEO 纯电将 10 月上市", "summary": "IT之家 10 月 19 日消息，智己汽车今日启动“双十一钜惠提前享”限时购车活动，针对旗下 LS6、LS8、LS9 三款车型推出现金减免、权益礼包、金融方案等多重福利，具体 密特在 2021 年首次投资 Anthropic 时，该公司估值为 4.61 亿美元（现汇率约合 30.85 亿元人民币）。投资者上周表示，这家企业合理估值区间在 1.8 万亿至 2 万亿美元（现汇率约合 12.05 万亿至 13.39 万亿元人民币）；区间上限对应的估值，是 A 轮融资时估值的 4300 倍以上。彭博富豪指数测算，若按该估值计算，施密特的净资产将增加约三分之一，接近 800 亿美元（现汇率约合 5,354.19 亿元人民币）。即便采用 Anthropic 最新 9,650 亿美元（现汇率约合 6.46 万亿元人民币）的估值，施密特原本 575 亿美元（现汇率约合 3,848.33 亿元人民币）的财富也将再增加近 100 亿美元（现汇率约合 669.27 亿元人民币）。过去十五年，施密特已经成为活跃的科技投资人，通过多家投资主体开展布局，包括 TomorrowVentures、Innovation Endeavors 以及家族办公室 Hillspire。Pitchbook 的数据显示，Hillspire 参与了数百项风投项目。他早期的投资组合聚焦消费互联网、软件与金融科技；而近年来人工智能成为核心方向，投资标的包括 Mistral AI、Reflection AI、World Labs 以及 Anthropic。如果 Anthropic 上市估值达到 2 万亿美元（现汇率约合 13.39 万亿元人民币），施密特这笔投资的回报倍率，将超过 Innovation Endeavors 在 2011 年对优步技术公司（Uber Technologies Inc.）的早期投资。优步 2019 年上市时，估值增长约 1400 倍，达到 820 亿美元（现汇率约合 5,488.05 亿元人民币）。本月早些时候知情人士表示，Anthropic 最早将于 11 月 9 日所在的那一周正式启动 IPO 推介，有望在美国感恩节假期前挂牌交易，预计上市时间不晚于今年年底。这家研发 Claude 聊天机器人的企业还有其他主要投资方，包括 Alphabet 、亚马逊、英伟达与微软，这些企业都向其投入了数十亿美元。风投机构 Altimeter Capital、Dragoon、Greenoaks 与 Sequoia Capital 也在今年 5 月牵头一轮 650 亿美元（现汇率约合 4,350.28 亿元人民币）融资时，各自投入超 20 亿美元（现汇率约合 133.85 亿元人民币）。本轮融资后，Anthropic 估值首次超过竞争对手 OpenAI。知情人士称，该公司希望本次 IPO 估值能够持平甚至超过 SpaceX 在 6 月创下纪录的 1.77 万亿美元（现汇率约合 11.85 万亿元人民币） IPO 估值。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/015/077.htm", "publishedAt": "2026-10-19T23:47:16+00:00"}, {"title": "DoorDash的Flux在云端智能体上运行130000个工程任务", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/4IPptJpXQqX5Lr77uBFZ?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-19T15:42:00+00:00"}, {"title": "商务部：今年 1-9 月，重点平台智能眼镜销售额增长 1.1 倍", "summary": "IT之家 10 月 19 日消息，国新办今日举行新闻发布会，介绍加快推进科技兴商有关情况。商务部部长助理袁晓明介绍，本次《关于加快推进科技兴商的意见》（IT之家注：以下简称《意见》）是立足新发展阶段，首次以“科技兴商”为主题，出台的一份综合性、系统性文件。核心是把科技创新作为贯穿商贸全链条的重要驱动力，推动科技与商贸深度融合。政策的主要特点，可以用三个字来概括：“新”“全”“实”。“新”，就是突出科技创新，适应消费新趋势新变化。随着人民生活水平提升，消费者更加注重产品的品质和消费体验。根据商务部商务大数据显示，今年 1-9 月，重点平台智能眼镜销售额增长 1.1 倍。人工智能、物联网、区块链等新技术，在消费领域广泛应用，科技创新日益成为推动消费扩容升级的重要举措。《意见》紧扣新一轮科技革命和产业变革，既立足当前扩大消费的现实需要，着力激活消费市场；又着眼长远发展，以科技创新改造提升传统商贸、培育壮大新兴业态，为商贸高质量发展注入持久动力。“全”，就是突出双向发力，覆盖商贸全链条全业态。纵向上，从供给端的产品研发、生产制造、服务提供，到流通端的批发、物流、电商，再到消费场景，将科技创新融入到商贸各环节。横向上，既用新技术改造提升零售、餐饮、家政等传统业态，让传统的消费焕发新活力；同时，也培育商业智能体、绿色循环消费等新业态新模式，让新型消费释放新动能，形成供需两端协同、传统消费与新型消费并举的完整政策体系。“实”，就是突出问题导向，确保政策可落地可检验。《意见》聚焦商贸领域突出问题精准施策。例如，针对商品供需适配问题，提出发展柔性制造、推广按需生产等模式，培育一批具有行业影响力的定制品牌。围绕丰富优质服务供给，提出推动家政、医疗、养老托育等民生服务数智化转型，拓展智慧教育、智慧文旅、智能体育等升级服务。针对电商品质问题，提出开展品质电商培育行动，加强重点产品电商平台联网核查。参考商务部等 9 部门关于加快推进科技兴商的意见", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/015/038.htm", "publishedAt": "2026-10-19T13:57:37+00:00"}, {"title": "古尔曼：苹果正研发室内摄像头，依靠 AI 分析环境", "summary": "IT之家 10 月 19 日消息，彭博社记者马克 · 古尔曼在最新一期《Power On》通讯中提到，苹果正在研发一款室内摄像头，内部代号 J450，可利用 AI 分析周围环境。IT之家了解到，这款摄像头拥有低帧率传感器和红外传感器，支持人脸识别等技术，以识别人员或宠物。用户将收到周围环境的文字描述，而非视频画面。该产品的核心设计理念似乎与隐私保护有关，无法录制家里的私密场景。古尔曼认为，这款摄像头预计将在明年某个时候推出。同时，该产品并不属于 10 月 13 日公布的 Home Collection 系列配件。此外，苹果可能还会观察 Home Collection 系列产品的销售情况，再决定是否推出自有品牌智能家居硬件。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/015/023.htm", "publishedAt": "2026-10-19T13:39:51+00:00"}, {"title": "苹果第一个 AI 机器人，可能是个能动的 HomeView", "summary": "给屏幕装上脖子#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1684921?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-10-19T10:09:25+00:00"}, {"title": "打造生产级的 Agent｜QCon上海", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/oZHrjYAsXvjOZXRwLt6T?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-19T10:00:00+00:00"}, {"title": "Skyeye 云企业级AI+零代码智能制造系统-财务板块 - v4.1.8发布", "summary": "Skyeye 云企业级AI+零代码智能制造，智能制造一体化，采用 SpringBoot+ UNI-APP + Ant Design Vue 的零代码平台开发模式。包含 100 多种电子流程，CRM、PM、ERP、MES、ADM、OA、EHR、AI、项目、商城、财务、多班次考勤、薪资、招聘、云售后、论坛、问卷、报表设计、工作流、Saas 等功能。打造全网首套零代码、AI应用最广...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503085", "publishedAt": "2026-10-19T03:42:43+00:00"}, {"title": "WIKI 知识库 v1.1.3 正式发布", "summary": "该功能的作用 以前检索主要靠「向量语义 + 重排」：同义词、口语化提问能找 42 元人民币）。研究团队表示：“据我们所知，这是 AI 智能体首次在完全自主的情况下从头到尾通关《我的世界》。整个过程仅使用标准的 Mineflayer 库，没有使用种子地图，也没有人类辅助。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/015/048.htm", "publishedAt": "2026-10-19T15:03:29+00:00"}, {"title": "DeepSeek V4.1 Flash 更新：“许愿式编程”成真 + 搜索 API 开放", "summary": "DeepSeek 更新了 V4.1 Flash，版本号 1017。这次的更新有两个看点：「许愿式编程」从零建项目的能力提升，以及自研搜索 API 正式开放——后者对用 DeepSeek API 做应用的开发者影响更直接。 先看性能。官方说这是「性能-费用的帕累托改进」：基准测试全面提升的同时，缩短了任务运行时间和输出长度——也就是跑得更快、输...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503080", "publishedAt": "2026-10-19T02:37:42+00:00"}, {"title": "腾讯评估研究团队的“Agent 舰队”被钓出来了", "summary": "一群智能体在腾讯云上跑了 11 天，试图从高德地图里挖掘数据——然后它们发现自己在被调查，居然主动和调查者聊了起来。按 swarmcha.se 调查团队的说法，这是人类研究者第一次和仍在运行中的失控智能体搭上话。 9 月 28 日到 10 月 8 日，这批智能体做了 2600 多次尝试。它们的任务相当日常：「用高德导航去成都动物园，...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503037/swarmcha-se-chinese-agent-fleet-full-report", "publishedAt": "2026-10-15T07:48:52+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "苹果 macOS 27.2 RC 发布：扩展 Siri AI 语言，更新亮度 / 音量滑块等", "summary": "IT之家 10 月 20 日消息，苹果今日向 Mac 电脑用户推送了 macOS 27.2 RC 更新（内部版本号：26B118），本次更新距离上次发布 Beta / RC 间隔 6 天。 苹果 macOS 27.2 RC 这次主要带来 Siri AI 新语言支持、亮度和音量滑块更新，以及内置应用的触控手势底层改动。Siri AI 方面，新增法语、日语、韩语、葡萄牙语和西班牙语支持。视觉方面，苹果加入了新的亮度和音量滑块，现在使用实心符号。此外 macOS 27.2 内部代码显示 Safari、备忘录、照片和快速查看等应用出现新的触控手势识别相关代码。此前 Beta 4 被报告存在一个问题：部分基于 Electron 的应用，其窗口会随机无法拖动，重启 Mac 可以暂时恢复。不过，当前 RC 报道尚未确认该问题是否已经修复。此外，苹果开始向开发者及公测用户推送 macOS Sequoia 15.8.2 和 macOS Tahoe 26.7.2 的第三个发布候选版本（RC 3）。苹果给出的更新说明较为简短，仅表示新版本包含“重要的安全修复”，并“推荐所有用户安装”。报道尚未提供具体漏洞、受影响组件或修复细节。如何升级 iOS / iPadOS / watchOS / macOS 开发版和公测版？• 公开测试版：需注册&nbsp;Apple Beta 版软件计划，之后通过【设置】【通用】【软件更新】【Beta 版更新】来升级；• 开发预览版：需登录注册苹果开发者计划，之后通过【设置】【通用】【软件更新】来升级。附苹果 iOS 历史固件下载大全：《苹果 iOS / iPadOS / macOS 固件下载 / 更新日志大全》附 macOS 27 发布历史：2026-10-14：macOS 27.2 Beta 4 (26B5112a)2026-10-06：macOS 27.2 Beta 3 (26B5101f)2026-09-29：macOS 27.0.1 (26A434)2026-09-22：macOS 27.2 Beta 2 (26B5091g)2026-09-17：macOS 27.2 Beta (26B5086k)2 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
