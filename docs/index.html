Robotics，机器人基础模型开发商 Skild AI，以及自动驾驶软件公司 Wayve 和自动驾驶卡车初创公司 Waabi 等。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/028/660.htm", "publishedAt": "2026-11-18T02:14:48+00:00"}, {"title": "Claude 关联计费测试上线，第三方应用 AI 消费能“按需结算”", "summary": "IT之家 11 月 18 日消息，Anthropic 昨日（11 月 17 日）更新 Claude 平台文档，宣布引入名为“关联计费”（Linked Billing）的 OAuth 测试版功能。用户未来使用某个第三方 AI 应用时，可以直接使用自己的 Claude 账户支付背后真实的 AI 调用费用。以往企业或开发者若在编码助手、工作流自动化等第三方工具中调用 Claude，往往需要共享 API 密钥。密钥一旦泄露，可能被他人用于调用并产生费用。而“关联计费”不再由开发者统一承担模型使用成本，开发者可将自家应用与客户的 Claude Platform 组织关联，让客户直接为其在应用中产生的 Claude API 调用付费。在控制与安全方面，用户须拥有其 Claude 组织的 Admin 或 Billing 角色才能完成授权。用户可在 Claude Console 的“已关联平台”页面查看应用费用、设置每月支出上限，或随时解除关联；处于测试阶段的应用，用户必须设置不超过 50 美元（IT之家注：现汇率约合 334 元人民币）的月度限额。对中小型 AI 应用团队而言，这项功能有望改变传统“平台先垫付、再向客户转售”的商业模式。客户只需在应用内点击“链接你的 Claude 组织”，登录 Claude 并完成授权，即可将组织与该应用绑定；此后，开发者可在每次 Claude API 请求中自行选择由客户或自己付费。在数据与合规方面，Anthropic 明确表示，请求实际运行在开发者自己的组织中，因此开发者的速率限制、模型访问权限、服务层级、数据保留策略和加密密钥均会生效；客户自身的零数据保留、业务关联协议或客户管理加密密钥等安排并不自动适用于这些请求。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/028/637.htm", "publishedAt": "2026-11-18T02:05:41+00:00"}, {"title": "韩国总统李在明公布防 AI 作弊新招：考试期间发送最高级别灾难警报，让藏匿的手机无处遁形", "summary": "IT之家 11 月 18 日消息，韩国总统李在明昨日在 X 平台发文，公布韩国政府正在进行和计划的防止考试作弊政策，其中包括考试期间发送最高级别灾难警报、奖励举报者等。李在明表示，他在现有应对方案的基础上追加了以下指示：1、研究在考试开始前和考试期间，不定时发送最高级别的灾难警报。即使考生将手机声音调低或静音，这类警报仍会发出响声。（胆子再肥的考生，总不至于在考试期间让藏着的通信设备响起来，把自己送进去吧？）2、我们已经和 AI 公司达成协议，将获取考试期间所有用户拍摄试题、向 AI 提问的记录。我还指示制定相关法律，只要政府提出要求，AI 公司就必须提交用户非法索要考试答案的记录。（在考试期间向 AI 询问答案，属于妨碍公务执行罪或业务妨害罪，最高可判 5 年有期徒刑）3、在事后应对措施方面，我还指示增加一项制度：对于举报使用尖端设备实施考试作弊的人，每查实一起作弊行为，至少奖励 1 亿韩元（IT之家注：现汇率约合 50 万元人民币）（奖金根据作弊人数叠加）；如果举报的是共同作弊行为，则对举报者减轻处罚或免除制裁，以此鼓励公众举报作弊。IT之家注意到，李在明还劝诫了想要考试作弊的人，称“请不要为了碰运气而毁掉自己的人生，为了你自己，也为了所有人，请放弃这种念头。”相关阅读：《韩国税务师考试头名 AI 作弊曝光后，政府全面调查今年国家资格考试》《韩国税务师考试榜一考生自首，承认用微型摄像头与 AI 作弊》《韩国拟采购无线电探测设备，防范国家资格考试“AI 作弊”》《韩国 2026 年高考开考在即：将有专人查 AI 眼镜，任何电子设备禁止进入考场》《韩国首次查获 AI 智能眼镜考试作弊案，两名 TOEIC 考生成绩作废》《线上考试疑用 AI，韩国首尔大学曝集体作弊丑闻》《韩国延世大学曝大规模 AI 作弊丑闻，数百学生涉嫌用 ChatGPT 等参加考试》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/028/629.htm", "publishedAt": "2026-11-18T01:49:00+00:00"}, {"title": "微软 CEO 纳德拉称自己是“AGI 信徒”，但否认 AI 具有意识", "summary": "IT之家 11 月 18 日消息，据科技媒体 The Verge 今天报道，微软 CEO 萨提亚 · 纳德拉在一场圆桌讨论中表示，自己如今已成为“AGI 信徒”（AGI-pilled）。IT之家从原报道获悉，纳德拉表示：“我之所以相信 AGI，是因为我们需要在经济层面思考，围绕 AGI，政治经济体系将会形成怎样的组织结构？”不过这名 CEO 认为，Claude 这类前沿 AI 模型并没有意识。他认同微软 AI 负责人苏莱曼的观点，即企业不应为 AI 模型赋予权利，也不应该将它们视为可能具有道德地位的存在。苏莱曼此前曾表示，Anthropic 团队已经陷入“自我催眠”状态，并警告称这种做法非常危险。纳德拉对此没有那么笃定，他认为 AI 行业现在最重要的是社会问题，需确保经济体系能广泛普及 AI。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/028/609.htm", "publishedAt": "2026-11-18T00:52:57+00:00"}, {"title": "GPT-6.2 Astra和Sol王炸双发！3D又危了", "summary": "Sol逼近旗舰性能", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/510707.html", "publishedAt": "2026-11-18T00:49:14+00:00"}, {"title": "欧洲机器人行业规模最大融资之一：Genesis AI 完成 5 亿美元 A 轮融资，估值 35 亿美元", "summary": "IT之家 11 月 18 日消息，据路透社报道，法国通用机器人公司 Genesis AI 现已完成 5 亿美元（IT之家注：现汇率约合 33.4 亿元人民币）A 轮融资，估值达 35 亿美元（现汇率约合 233.8 亿元人民币）。这是欧洲机器人行业规模最大的融资项目之一。据报道，参与融资的机构和个人有谷歌前 CEO 施密特、硅谷风投公司 Khosla Ventures、法国科技企业家泽维尔 · 尼尔，以及英伟达和法国政府支持的投资机构 Bpifrance。Khosla Ventures、Premji Invest 和 Eclipse。Genesis 首席执行官 Zhou Xian 表示，公司将利用融资资金提高通用机器人 Eno 的产量，扩大数据采集和 AI 训练规模。外观方面，Eno 机器人的设计类似三个放大的扑克牌，安装在一个可旋转的轮式底座上。这种设计使 Eno 能够折叠得非常紧凑，工作时再像弹簧玩具一样展开。Genesis 表示，公司特别重视灵巧操作手的研发，因为这是机器人制造商面临的最具挑战性的技术难题之一。Genesis 由前 Mistral AI 研究人员 Théophile Gervet 联合创立，是欧洲估值超过 10 亿美元（现汇率约合 66.8 亿元人民币）、瞄准工业应用的机器人企业之一。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/028/605.htm", "publishedAt": "2026-11-18T00:44:11+00:00"}, {"title": "微软联合埃森哲、Adobe、万事达卡、沃尔沃等 40 多家组织推进 AI 标准：强调观察、验证和控制，覆盖闭源和开放权重模型", "summary": "IT之家 11 月 18 日消息，微软今日在 Ignite 大会上宣布启动 AI 透明度计划（AI Transparency Initiative），与埃森哲、Adobe、毕马威、万事达卡、沃尔沃汽车等 40 多家组织合作，共同推动制定适用于不同 AI 模型和服务提供商的开放标准，以加强 AI 系统的透明度、安全性和治理能力。微软董事长兼 CEO 萨提亚・纳德拉宣布，公司将与客户及合作伙伴展开合作，推动建立一套开放、通用的 AI 安全与治理框架。微软表示，随着企业将 AI 模型接入内部数据、工具、凭据和基础设施，AI 智能体（Agent）已经能够在不需要人类逐步审批的情况下自主执行任务。但现有安全管理机制通常只能观察 AI 活动的部分信息，难以还原模型从接收请求到产生结果之间的完整过程，也无法独立验证模型对自身行为的描述。这给企业的安全管理、合规审计和责任追溯带来了新的挑战。此次计划主要包含三个方面。首先，微软将扩大对美国国家标准与技术研究院（NIST）AI Agent Standards Initiative（AI 智能体标准计划）的参与，并利用相关研究推动制定覆盖 AI 透明度、安全性和治理的行业开放标准。其次，微软将与 40 多家组织合作，推动建立适用于不同模型和服务提供商的开放标准，使 AI 系统具备可问责性、独立验证能力，并在设计阶段纳入安全机制。微软强调，这套标准将同时适用于闭源模型和开放权重模型，企业更换或升级底层模型时，也能够继续使用现有 IT 安全管理和合规审计机制。第三，微软计划将相关成果整合到 Microsoft AI、Microsoft Foundry 和 Microsoft Copilot 产品及服务中，让企业客户能够将 AI 活动产生的证据接入微软或其他供应商提供的安全与合规工具。在具体实施方面，微软将计划概括为三个环节：观察、验证和控制。IT之家总结如下：观察环节要求企业能够了解 AI 接收了什么指令、获得了哪些授权、使用了什么模型和运行环境、访问了哪些数据与工具，以及实际执行了哪些操作，同时持续监控智能体活动和风险信号。验证环节强调，AI 智能体不能成为证明自身行为的唯一信息来源。企业需要结合模型、运行环境以及身份认证和策略管理等独立系统提供的记录，对 AI 的身份、授权意图和实际操作进行交叉验证，而不能仅依赖模型服务提供商对其行为的描述。控制环节则要求企业保留对 AI 权限的管理能力，包括限制智能体可以访问的数据、执行的操作以及获得的授权。当发生安全事件时，企业还应能够利用相关记录还原事件经过，并用于调查、风险控制、恢复和审计。微软安全业务执行副总裁 Hayete Gallot 表示，为了让安全控制真正发挥作用，企业需要提高对模型内部运行情况的透明度。Adobe 首席安全官 Aanchal Gupta 和毕马威国际全球首席信息安全官 John Israel 也分别表示，企业需要更清晰地了解 AI 智能体访问了哪些资源、执行了哪些操作，以及如何独立验证这些行为。微软称，随着 AI 智能体进一步融入企业运营，组织必须继续对其行为承担责任，不能将 AI 本身作为规避责任的理由。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/028/603.htm", "publishedAt": "2026-11-18T00:37:36+00:00"}, {"title": "微软自研芯片 Maia 200 投入生产：每瓦 token 性能提升 1.7 倍", "summary": "IT之家 11 月 18 日消息，昨日（11 月 17 日）召开的 Ignite 2026 活动中，微软宣布旗下第二代自研人工智能加速器 Maia 200 现已正式投入规模化生产，并开始在数据中心运行微软最大规模的前沿 AI 大模型。与“领先 GPU 基础设施”相比，该加速器在 Microsoft Teams、Copilot 和 Cowork 等内置 AI 功能中，每瓦 token 处理量最高提升 1.7 倍。IT之家注：Maia 200 是微软面向 AI 推理设计的定制芯片，采用台积电 3 纳米工艺，具备 FP4 与 FP8 张量核心、216GB HBM3e 内存及 272MB 片上 SRAM；单颗芯片在 FP4 精度下可提供超过 10 petaFLOPS 算力，并通过以太网扩展至最多 6,144 颗加速器组成的集群。微软表示，该芯片已部署于美国、欧洲和澳大利亚，服务 Microsoft Copilot 等生产工作负载，并将逐步支持 GitHub Copilot 与 Microsoft Foundry。公司还计划在 2027 年将 Azure Maia 系统扩展至多吉瓦级部署，让其成为微软产品与服务的主要推理基础设施。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/028/597.htm", "publishedAt": "2026-11-17T23:51:16+00:00"}, {"title": "英伟达 Q3 电话会议：公司业务一切照常，不会急于寻找黄仁勋继任者", "summary": "北京时间 11 月 18 日，AI 芯片巨头英伟达公司今天发布了 2027 财年第三季度财报。财报发布后，英伟达临时 CEO 科莱特 · 克雷斯 (Colette Kress)、新任董事会主席哈维 · 琼斯 (Harvey Jones) 出席了电话会议，回答分析师提问。这是黄仁勋辞去 CEO 后，英伟达首次举行财报电话会议，许多问题正等待解答。以下是第三财季财报和电话会议要点：—— 英伟达第三财季营收为 1158.44 亿美元，较上年同期的 570.06 亿美元增长 103%；净利润为 652.87 亿美元，较上年同期的 319.10 亿美元增长 105%。—— 琼斯发表了开场讲话。他表示，黄仁勋在披露其个人行为后自愿辞去了 CEO 职务，这些行为“与公司的行为准则、标准和文化规范不符”，“英伟达董事会一致接受了他的辞职，并无意让黄仁勋重新出任 CEO”。—— 琼斯表示，公司不会在此次电话会议上就黄仁勋离职的具体情况或相关调查作出回应，也不会回答有关这些问题的提问。—— 琼斯称，“这次 CEO 遴选将是全面而深入的”，在“找到合适的人选”之前，公司不会仓促推进这一进程。—— 琼斯表示，新成立的国家安全与出口管制监督委员会将加强英伟达与美国政府所有相关部门的沟通与合作。—— 克雷斯表示，2028 财年公司营收预计增长 75%，高于上季度预计的 70%。—— 克雷斯称：“我们对创新的热情不会改变，我们对客户、合作伙伴和股东的承诺也不会改变。”—— 克雷斯表示，英伟达致力于培养充满活力的开放模型生态系统。此前，开放模型的支持者们一直担心，英伟达的动荡可能会损害此类 AI 模型的发展。—— 英伟达表示，对 Hugging Face 的收购仍在按计划推进。—— 克雷斯透露，今年，顶尖模型开发商预计将为英伟达数据中心业务贡献 15% 的收入。她强调，开放模型正日益兴起，意在表明英伟达的财务前景并不完全依赖于 OpenAI 和 Anthropic。—— 英伟达表示，在支持新型云计算服务商 (Neocloud) 客户方面，公司将采取“审慎且有选择性的”策略。这一新表述表明，英伟达计划在为客户提供资金支持时更加谨慎。—— 克雷斯强调，Vera CPU 的需求强劲，并表示 2028 财年 CPU 总收入将增长一倍以上。对于一个刚刚进入独立 CPU 市场的厂商而言，这一表现相当出色。—— 她表示，公司的业绩展望中不包含任何获得出口许可的 Hopper 系列产品，这意味着英伟达可能放弃了美国政府此前已经批准出口的相关产品的销售。—— 克雷斯回应公司动荡称，目前最关心员工，公司员工都恪尽职守，并表示：“在这一过渡时期，我们会照顾好员工。”—— 谈及上周的领导层变动，克雷斯表示：“我们的领导团队坚强有力。我们拥有全球最优秀的技术人才。”—— 克雷斯称，公司业务“一切照常”。—— 在回应有关美国出口限制的问题时，克雷斯表示，英伟达将花一些时间研究美国周一公布的新出口管制措施所带来的影响。尽管如此，公司仍有信心实现明年收入增长 75% 的业绩预期。—— 琼斯表示，董事会认识到，先进芯片和国家安全因素正在推动“我们的市场发生重大变化。我们的新任 CEO 必须非常谨慎地应对这一复杂局面”。—— 英伟达股价盘后一度上涨 5%。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/028/594.htm", "publishedAt": "2026-11-17T23:42:46+00:00"}, {"title": "微软决策模型 Microsoft-Decision-1.1 登场，跑赢 GPT-6 Luna 与 Gemini", "summary": "IT之家 11 月 18 日消息，微软昨日（11 月 17 日）宣布正式推出 Microsoft-Decision-1.1 决策 AI 模型，目前已在 Microsoft Foundry、OpenRouter 和 Vercel 平台上线。该模型面向企业级软件中的高频决策场景，可帮助应用在路由、分类、优先级排序、内容核验和工作流控制等任务中快速做出结构化判断。价格方面，Microsoft Foundry 的全球标准版输入 token 定价为每百万 token 0.042 美元（IT之家注：现汇率约合 0.28 元人民币），输出 token 免费；美国数据区、欧盟及亚太数据区价格分别为每百万 token 0.046 美元（现汇率约合 0.31 元人民币）和 0.05 美元（现汇率约合 0.33 元人民币）。与传统通用大语言模型不同，Microsoft-Decision-1.1 专注于在开发者设定的规则和约束内，从允许的操作中作出选择。它还会输出校准后的置信度分数，当信息不足或不确定性较高时，可选择“弃权”或提示人工介入，从而降低 AI 在关键业务流程中误操作的风险。微软称，新版本在智能水平、校准能力上均有提升，在保持低成本的同时，速度较上一代 Microsoft-Decision-1 提升超过两倍。在 Artificial Analysis Decision Index v2.1 基准中，该模型得分为 68，较上一代提高 6 分，并领先于 Jev 1.14、Google Gemini Decision 1 及 OpenAI GPT-6 Luna（Decisions）等模型。Microsoft-Decision-1.1 是决策模型排行中位列第八。在人工分析决策指数中，Microsoft-Decision-1.1 比 Elephant 9B 和 Jev 1.14 高出 2 分，但比 d1.2 低 1 分。IT之家附上相关截图如下：为兼顾实时性和成本，微软为该模型定制了推理引擎，并基于中型混合专家模型 Gemma 4 26B A4B 进行优化。模型可在 A100、H100/200、GB200/300 等多种 GPU 硬件上运行，并通过智能调度请求降低推理成本。微软还表示，模型训练结合了监督微调与强化学习，使用覆盖数万种任务类型的合成及授权数据集，以提升其在真实业务中的泛化能力。该模型已支持多模态输入，可接收照片、截图等图像信息。自公开预览发布以来，已有超过 4,000 名客户使用，应用场景包括模型路由、客服工单分流、业务流程自动化、内容打标和分类等；早期客户包括 Epic、Equinor、Atos Group 和 Raiffeisen Bank。在微软内部，该模型已被用于 Copilot 的请求路由：其判断准确率可与大型语言模型相当，但速度快 2.2 倍、成本低 4.4 倍。它还被用于 Cowork 的任务推理强度动态调节，以及 Foundry Evaluations 中的质量与安全评估。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/028/593.htm", "publishedAt": "2026-11-17T23:40:07+00:00"}, {"title": "面向多智能体应用的大模型推理调度与缓存优化｜AICon北京", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/X8xujm6xovp7z2YzWbpM?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-17T18:53:07+00:00"}, {"title": "“AI生成的代码必须开源！”开发者吵翻了，被开源代码喂大的Anthropic怕是第一个不同意", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/m5arrx8021zHVI0ybFtI?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-17T15:09:45+00:00"}, {"title": "李沐加盟的Aimotion，是一家什么AI公司？", "summary": "瞄准「产业级世界模型」", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/510688.html", "publishedAt": "2026-11-17T11:40:37+00:00"}, {"title": "qOntology 开源版 v1.1.3 发布：长文档抽取支持分窗重试与阶段续跑，完善候选校验", "summary": "随着本体建模逐步引入 AI 辅助抽取，抽取任务的执行稳定性、候选数据的规范性，以及后续审核操作的完整性，都成为影响建模流程的重要环节。 本次 qOntology 开源版 v1.1.3 围绕 AI 辅助建模流程进行了多项完善，重点优化分窗抽取、异常窗口重试与任务续跑机制，同时调整四轮抽取提示词和候选数据校验规则。 此外，本次更...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503620", "publishedAt": "2026-11-17T08:11:29+00:00"}, {"title": "材料科学智能体MatOS正式开源！大幅提高材料研发任务成功率", "summary": "筛材料、找配方、开发新模型…拿下多项科研任务", "sourceName": "量子位", "sourceUrl": "http 勋已经辞职，但公司主要客户依然高度支持英伟达。克雷斯强调，主要客户持续对英伟达的产品表达了兴趣。“有很多这些客户联系我，说‘看到一切都完好无损，真好。很高兴看到供应更多了。我需要更多产能’”。然而，客户需求并不是英伟达面临的唯一问题。黄仁勋的离职也引发了外界质疑，即英伟达是否能留住那些帮助其在 AI 领域建立主导地位的工程师和其他员工。克雷斯否认了对潜在员工流失的担忧，并向 CNBC 强调：“公司是在员工视英伟达为毕生事业的理念下建立的，许多人在这里工作了数十年，从技术角度或业务运营角度与我们合作。”“我们高度相信员工们肯定仍在努力工作，仍在与我们共事，并且享受在英伟达的工作。”综合IT之家此前报道，英伟达董事会于北京时间 11 月 12 日晚宣布，黄仁勋辞去总裁、首席执行官及董事会成员职务，即刻生效。英伟达执行副总裁兼 CFO 科莱特 · 克雷斯同意出任临时 CEO，在董事会选出正式继任者前兼任这一职务，并继续担任执行副总裁和 CFO。英伟达今日发布最新财报，2027 财年第三财季营收为 1158.44 亿美元，较上年同期的 570.06 亿美元增长 103%；净利润为 652.87 亿美元，较上年同期的 319.10 亿美元增长 105%。尽管黄仁勋公开表态“若董事会允许，愿重返英伟达担任 CEO”，但英伟达新任董事会主席哈维 · 琼斯（Harvey C. Jones）在今日的财报电话会议上表示，董事会无意让黄仁勋（Jensen Huang）回归、重新担任公司 CEO。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/028/626.htm", "publishedAt": "2026-11-18T01:39:53+00:00"}, {"title": "小米雷军 APEC 现场挨个发名片，参会时给台下朋友拍合影", "summary": "IT之家 11 月 18 日消息，据广东广播电视台报道，小米创办人、董事长兼 CEO 雷军 11 月 17 日出席 APEC 工商领导人峰会，现场社交发名片。网友调侃“不管身价多少亿，该发名片还得发！”雷军还在峰会上发言，表示具身智能机器人肯定是一个巨大的产业机会，它的想象力会超过汽车产业。小米特别看好 AI 走向物理世界以后带来的空间和想象力，这给整个亚太经济会带来巨大的机会。IT之家注意到，雷军个人微博还晒出了一张照片，是他在台上参加峰会时，给台下朋友们拍的一张合影。IT之家注：2026 年 APEC 工商领导人峰会 11 月 17 日至 18 日在深圳举办，主题为“共促繁荣，共赢未来”。来自亚太经合组织（APEC）21 个经济体和英国、法国、德国、瑞士等 13 个域外经济体的 2000 余位政商界代表齐聚深圳。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/028/617.htm", "publishedAt": "2026-11-18T01:15:59+00:00"}, {"title": "英伟达加码供应链，向 ABF 基板制造商景硕投资超 10 亿美元", "summary": "IT之家 11 月 18 日消息，NVIDIA（英伟达）当地时间昨日宣布在今年 10 月宣布的合作基础上进一步深化同供应链伙伴的关系，支持人工智能基础设施建设。根据最新公告，英伟达将向中国台湾地区半导体封装基板制造商景硕 (Kinsus) 投资超 10 亿美元（IT之家注：现汇率约合 66.8 亿元人民币）现金，购买设备支持景硕桃园幼狮厂的扩产计划，目标将该厂的先进 ABF 封装基板扩大 3.5 倍以上。景硕幼狮厂新产能预计 2027 年下半年开出，2028Q3 达产。如果仍然不足，英伟达计划继续参与景硕后续的产能扩充计划，目标至少在 2030 年前掌握稳定产能。英伟达还修改了与三星电机 (SEM) 的现有基板供应协议，以提高现有工厂的运营能力，从而支持 NVIDIA 加速计算平台的增产。此外，鸿海董事长刘扬伟表示：“鸿海将继续深化与英伟达在下一代 GPU 和网络平台方面的合作。凭借其覆盖亚洲、北美、欧洲的全球一体化生产网络，鸿海完全有能力支持下一代人工智能基础设施的量产。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/028/608.htm", "publishedAt": "2026-11-18T00:51:54+00:00"}, {"title": "9 MB，一个文件，一个编程 Agent：连 TUI、沙箱和 TLS 都塞进去了", "summary":  日宣布，联合创始人黄仁勋辞去 CEO 职务。CFO 科莱特·克雷斯（Colette Kress）出任临时 CEO。 一家 4 万亿美元的公司，在 AI 投资周期最关键的节点上，暂时由一位财务背景的高管掌舵。 这是一个 33 年的句号。黄仁勋 1993 年参与创办英伟达，把它从做游戏显卡的公司带成了市值 4 万亿美元的 AI 算力中枢...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503568/nvidia-announces-ceo-transition", "publishedAt": "2026-11-13T08:39:45+00:00"}, {"title": "10x 工程师变成 100x 了，普通工程师还是那么普通", "summary": "一位 CTO 用反证法证明：我们还没被 AI 取代，但理由可能和你想的不一样。 shaharglazner 是 keepalerting 的联合创始人兼 CTO，11 月 9 日他在 X 上发了篇长文《On Being an Engineer in 2026》，标题下面跟着一行小字：「我们还需要吗？」 他先承认了那种普遍的失控感。每隔一周，就有一块工作被交出去。最早是不写代码...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503514", "publishedAt": "2026-11-10T10:08:13+00:00"}]}, {"label": "论文研究", "items": [{"title": "美国科技服务接连出现故障：微软、苹果、AWS、银行、空管系统之后，国家安全局机密通信网络也受影响", "summary": "IT之家 11 月 18 日消息，美国多家科技企业近日接连遭遇技术故障，受影响范围从苹果消费者服务延伸至美国国家安全局（NSA）的机密通信网络。从航空出行和银行交易，到美国国家安全局的机密工作，一连串技术故障正在扰乱美国社会的日常运转，令公众对老化技术基础设施愈发不信任。今日凌晨，苹果因内部软件更新引发大范围服务中断，导致部分用户无法正常使用 iCloud、App Store、Apple Pay 等服务。与此同时，美国国家安全局内部用于传输机密信息的网络 NSANet 也出现故障。据美国有线电视新闻网（CNN）和 CBS 新闻报道，美国国家安全局用于内部传输和共享机密信息的网络 NSANet 于当地时间 11 月 17 日出现故障。多名知情人士称，该网络一度无法正常运行，导致部分内部系统受到影响。美国国防部一名官员向美联社表示，此次问题发生在例行维护期间，国家安全局经历了临时性系统性能下降。另一名知情人士则称，故障与网络例行补丁更新有关。美国国家安全局随后表示，虽然部分内部系统受到影响，但任务关键能力仍然保持正常，机构执行国家安全任务的能力没有受到影响。为缓解系统恢复期间的登录压力，国家安全局还调整了部分员工的到岗时间，采取错峰安排，避免数万名员工同时登录计算机系统。根据 CBS 新闻报道，部分工作还被转移至该机构位于美国其他地区的设施处理。此外，美国国家安全局拥有多个备用设施，以便在主要系统出现问题时维持必要业务运行。目前，受影响网络的具体故障原因及全面恢复时间尚未明确。实际上，此次故障发生前，美国多项关键数字基础设施已经接连出现技术问题，例如亚马逊 AWS 服务、微软 365 服务、航空交通管理系统、联合航空内部系统以及摩根大通等银行服务在近日均出现过不同程度的技术故障，影响了办公通信、航空运行和金融服务。亚马逊 AWS：11 月 15 日，US-EAST-1（北弗吉尼亚）区域出现连接问题、IAM Identity Center 身份验证失败、账户注册错误及部分网络连通性问题，影响多项服务（如 CloudWatch、Connect 等），持续约 2–3 小时后恢复。此前 11 月也有其他区域小规模事件。微软 365 服务：11 月 12 日开始全球性中断（持续至 13 日 / 14 日），影响 Outlook、Exchange Online、Teams、Copilot 等。根因是 7 月引入的潜伏软件缺陷，叠加流量增加和服务器容量问题，导致网络网关服务器大面积无响应（峰值超过 80%）。影响全球多国企业和机构，是近年来较长的一次。航空交通管理系统（FAA）：11 月 13 日，因通信 / 雷达系统不稳定（与承包商更换路由器、从铜线升级到光纤相关，导致数据过载），FAA 下令全国性地面停飞（nationwide ground stop），持续约 4–5 小时。影响约 1.2 万架次航班取消，是 911 事件后最长的一次全国停飞，且后续多日的航班仍受余波影响。联合航空（United Airlines）内部系统：11 月 16 日，出现广泛系统故障，影响飞行员使用的应用程序（包括最终飞机重量计算、机组通信等），导致部分离港航班延误（约 30 分钟至 1 小时多，影响不到 150 架次）。已恢复，官方表示无网络安全迹象，也与 FAA 事件无关。摩根大通等银行服务：11 月 16 日，摩根大通因本地硬件系统中的软件 bug 导致交易处理变慢，客户报告账户访问、余额查询、转账等问题。问题波及与之有交易往来的其他银行（如 Bank of America、Wells Fargo 等）及 Zelle 支付，但并非系统性崩溃，其他银行自身系统大多正常。当日晚间恢复，官方确认非网络攻击。目前没有证据表明此次网络故障由网络攻击引起，而且也没有可靠证据表明上述事件之间存在共同原因，也没有证据证明这些故障属于协调一致的网络攻击。尽管没有迹象表明这些事件彼此相关或出自恶意行为方之手，猜疑和不安仍在蔓延。过去一周的系统故障造成严重混乱，甚至引发美国消费者恐慌性抢购。开市客耐储食品、饮用水和电池等物资的销量激增，分析师也将该公司的目标股价从 1100 美元上调至 1,150 美元（IT之家注：现汇率约合 7,682 元人民币）。截至周日，开市客网上销售的大部分高价发电机已经售罄。风险情报公司 Dataminr 威胁研究与网络工程总监 Joe Slowik 表示，如此多引人关注的事件在短时间内密集发生，既不寻常，也令人担忧。“我们已经过度依赖那些摇摇欲坠的基础设施，却高估其可靠程度。”尽管没有公开迹象显示这些计算机故障相互关联或由黑客造成，但综合来看，它们触动了围绕 AI 的更广泛焦虑，包括 AI 工具可能让恶意行为方更容易瘫痪关键服务，或大规模实施网络犯罪。相关阅读：《Steam 突发大规模服务故障：游戏下载、好友列表、云存档均受影响》《苹果回应服务大规模中断：内部系统更新引发故障，Apple Pay、iCloud、App Store 均受影响》《微软苹果接连宕机，谷歌紧急回应 Gmail 故障传闻“服务运行正常”》《微软 2026 最大宕机事件余波：部分用户反馈 Microsoft 365 服务再次出现故障》《摩根大通发生重大系统故障，回应称并非网络攻击所致》《（更新：已解决）美联航遭遇大范围系统故障，航班起飞受影响》《又双叒来了：日本电信运营商 NTT Docomo 本月第三次发生全国性 5G SA 通信故障》《堪比蓝屏“灭霸”事件：微软 2026 最严重宕机重创全球金融业，交易员被迫改用传真》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/028/601.htm", "publishedAt": "2026-11-18T00:21:34+00:00"}, {"title": "从 SDLC 到 ADLC：宝洁的 AI 原生组织实验", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/prRYMYmhOvSY9EaMz8Oc?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-17T10:15:13+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "贝索斯谈英伟达 CEO 人选：公司业务太复杂，若黄仁勋不回归应优先内部选拔", "summary": "IT之家 11 月 18 日消息，亚马逊创始人杰夫・贝索斯于当地时间 11 月 17 日在 Semafor「硅谷与世界」（Silicon Valley &amp; The World）大会上接受采访时谈到了英伟达的情况。贝索斯建议英伟达董事会，在寻找黄仁勋的正式继任者时，优先考虑公司内部人选。他表示，如果英伟达不让黄仁勋回归，就不应该从外部聘请新 CEO，因为英伟达的业务过于复杂，外部高管接手后成功的机会非常小。贝索斯表示，如果英伟达不重新聘请黄仁勋，他不会建议董事会从外部寻找继任者。他认为，复杂企业的外部 CEO 成功概率微乎其微，因此从外部引进高管应该是最后的选择。在此之前，贝索斯曾长期担任亚马逊 CEO，2021 年卸任，结束了近 30 年的公司领导工作。他表示，亚马逊当年的管理层交接与英伟达目前的情况不同，自己卸任 CEO 是经过多年精心规划的过渡安排，而英伟达目前需要应对的是创始人突然离任后的继任问题。贝索斯还拒绝直接 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
