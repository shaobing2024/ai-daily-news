ps://www.ithome.com/1/030/745.htm", "publishedAt": "2026-11-23T01:00:23+00:00"}, {"title": "🔥 拾趣 Magpie v0.2.0 发布：模型视图更准确，词典功能上新，多项细节优化", "summary": "🔥 拾趣 Magpie v0.2.0 发布：模型视图更准确，多项细节优化 拾趣 (Magpie)是一款跨平台沉浸式自定义AI 划词工具 划选或双击，浮动条随即弹出：翻译、解释、总结实时呈现；复制、搜索、写入 Obsidian、Anki 、预填日历，结果直接落地。图片、视频与扫描文档中的文字，框选亦可识别——处理在原地完成，无需迁入对话窗口...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503729", "publishedAt": "2026-11-23T00:17:07+00:00"}, {"title": "微软 CEO 纳德拉感叹：Claude Code 仅半年动摇 VS Code 地位", "summary": "IT之家 11 月 23 日消息，据科技媒体 Windows Latest 今天报道，这几天，不少开发者炫耀自己已经好几个月没打开过 VS Code。如今微软 CEO 萨提亚 · 纳德拉表示，他完全了解这一现象。Anthropic 推出 Claude Code 后，VS Code 等传统代码编辑器、IDE 大概六个月就失去了存在感。IT之家注：VS Code 是微软推出的免费开源跨平台代码编辑器，不是 IDE。该软件内置对语法高亮、智能代码补全、代码重构、代码调试以及 Git 版本控制的支持，并可通过庞大的扩展生态拓展软件功能。纳德拉认为，过去十多年，微软一直努力将 VS Code 打造成开发者的默认工作台。Claude Code 赢得开发者喜爱标志着软件开发方式发生了重大转变，而微软并没有立刻拿出应对方案。同时他表示，VS Code 的成功并非偶然。他特别肯定团队坚持开放式开发的做法，即产品经理每天都阅读社区反馈，根据用户意见改进产品。在 AI 掀起浪花前，VS Code 已经支持代码补全功能。当 Cursor 基于 VS Code 开发分支版本并打造出强大的智能体模式后，微软也迅速跟进，补上了智能体模式方面的能力。然而纳德拉表示，Anthropic 在模型方面做得实在太出色，还让开发者真正接受了命令行形态，写程序从输入变成了输出，大约六个月，传统 IDE 就失去了存在感。他从中得出的重要教训是：不要迷恋自己打造的东西。不过纳德拉认为，这种转变并不代表着微软没有机会。随着微软推出新一代决策模型，IDE 甚至有可能迎来一次复兴。按照他的说法，未来 IDE 的核心将不再是手搓程序，而是“写出真正的 MD 说明文档”。微软目前的调整方向似乎与这一趋势相符。11 月 11 日发布的 VS Code 1.146 加入了智能体收件箱和模型对比功能。一周后发布的 VS Code 1.147 又带来了模型路由功能，可以根据不同任务从用户偏好的模型中选择合适的模型，同时还支持定时提交智能体请求以及浏览器集成。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/030/733.htm", "publishedAt": "2026-11-23T00:10:21+00:00"}, {"title": "古尔曼：苹果若想在 AI 时代生存下去，需进行结构和文化层面的全面改革", "summary": "IT之家 11 月 23 日消息，彭博社记者马克 · 古尔曼昨日在新一期《Power On》通讯中认为，苹果传统的软件开发方式可能阻碍其进入 AI 时代。僵化的发布周期、集中化的决策和缓慢的开发流程，让苹果很难和 AI 领域竞争对手抗衡。▲ 苹果首席执行官约翰 · 特努斯（John Ternus）古尔曼警告称，虽然苹果在软硬件和生态领域仍然优势明显，但现有的组织架构拖累了公司在 AI 领域的发展。他说道：“简单来说，苹果作为一家企业，其组织架构和运作方式很难在 AI 时代取得成功。这家公司需要在组织结构和企业文化层面进行全面改革。”例如，苹果通常会在新系统正式发布前一年就确认主要功能。在软件主管克雷格 · 费德里吉（IT之家注：Craig Federighi）的领导下，工程团队严格按照时间表推进开发，确保 iPhone、Mac 及其他设备的软件开发周期相互协调。几十年来，这种开发方式帮苹果铸造了一批充分打磨的软件、硬件产品。但这种缓慢的开发节奏，也导致苹果在 AI 公司面前 "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/030/769.htm", "publishedAt": "2026-11-23T02:01:37+00:00"}, {"title": "中科宇航力箭二号运载火箭进入多发并行总装阶段，批量化生产体系迈上新台阶", "summary": "IT之家 11 月 23 日消息，中科宇航宣布，近日，该公司力箭二号遥三、遥四运载火箭按计划并行开展总装工作，各工序流转顺畅、推进有序。型号从单发研制攻关转向多箭并行组织阶段，标志着力箭二号运载火箭批量化生产体系迈上新台阶，生产组织模式、履约交付能力持续提升。官方介绍称，力箭二号在设计阶段即面向量产优化，采用“通用助推器核心”构型，大部分零组件支持采用工业化思路组批生产，以“搭积木”式思路实现火箭快速集成。火箭各子级直径均为 3.35 米，贮箱、箱间段等各部段设计相似，可实现产品互换互用、滚动备份，为我国后续高密度发射任务提供支撑。据官方公布信息，目前力箭二号舱段、贮箱、导管等产品采用自主生产与社会化协作并举的模式，部段制造、总装集成与全箭测试链路已打通。IT之家注：力箭二号为中科宇航自主研制的中型液体运载火箭，采用 CBC 构型，通用芯级直径 3.35 米，总长 52 米，起飞重量 625 吨，起飞推力 766 吨，500 公里太阳同步轨道运载能力 8 吨，200 公里近地轨道运载能力 12 吨。3 月 30 日 19 时 00 分，力箭二号遥一运载火箭在东风商业航天创新试验区首飞成功；11 月 3 日 8 时 15 分，遥二以“一箭 18 星”方式将千帆极轨 21 组共 18 颗卫星送入预定轨道，为力箭二号首次执行卫星互联网大规模组网任务。官方称，上述任务支撑了我国低轨星座建设，并探索形成适配我国工业体系的高频次、低成本发射方案。截至发稿，中科宇航尚未公布遥三、遥四的具体发射时间与搭载载荷。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/030/742.htm", "publishedAt": "2026-11-23T00:55:09+00:00"}, {"title": "苹果 Siri AI 集体诉讼案和解：符合条件的 iPhone 预计每台可获赔至少 61 美元", "summary": "IT之家 11 月 23 日消息，苹果今年 5 月同意支付 2.5 亿美元（IT之家注：现汇率约合 16.73 亿元人民币），以和解一起涉及 Siri AI 功能延迟上线的美国集体诉讼。根据 MacRumors 当地时间 11 月 21 日的报道，代表消费者的律师于 11 月 16 日提交法庭文件，预计符合条件的用户每台 iPhone 可获赔至少 61 美元（现汇率约合 408.3 元人民币），最高赔偿金额为 95 美元（现汇率约合 635.9 元人民币）。根据和解条款，每台符合条件的设备基础赔偿金额为 25 美元，最终金额将根据有效申报总量按比例调整，最高不超过 95 美元，也可能因申报情况而低于 25 美元。律师目前预计至少可达到 61 美元，但如果后续申报数量明显增加，实际赔偿金额也可能下降。此次诉讼源于苹果在 2024 年 6 月展示的 Siri AI 新功能，包括个人上下文理解、屏幕感知以及更深入的应用控制能力。苹果当时还通过产品发布会、官方网站和电视广告等渠道宣传这些功能。2025 年 3 月，苹果宣布推迟个性化 Siri 功能的推出，随后遭到消费者集体诉讼，被指控存在虚假宣传。苹果否认诉讼中的所有指控，并表示同意和解是为了避免继续诉讼产生的成本和风险。根据和解方案，符合条件的消费者必须是美国居民，并在 2024 年 6 月 10 日至 2025 年 3 月 29 日期间，于美国境内购买指定 iPhone，且设备并非用于转售。涉及机型共七款，包括 iPhone 15 Pro、iPhone 15 Pro Max、iPhone 16、iPhone 16e、iPhone 16 Plus、iPhone 16 Pro 和 iPhone 16 Pro Max。申报截止日期为 2026 年 12 月 21 日。最终批准听证会定于 2027 年 2 月 24 日举行，赔偿预计将于 2027 年开始发放。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/030/729.htm", "publishedAt": "2026-11-22T23:37:54+00:00"}, {"title": "智能体企业新前沿：驱动高效智能", 果支付 200 亿美元（IT之家注：现汇率约合 1,336.27 亿元人民币），让 iPhone、Mac 等设备的 Safari 浏览器默认搜索引擎为谷歌，并且谷歌需要将 Safari 搜索广告所产生的 36% 收入支付给苹果。如今双方的合作关系开始出现疲软迹象。用户的搜索习惯已经发生改变，遇到问题不是打开浏览器搜东西，而是直接打开 AI 软件搜索，谷歌难以从这种变化中获得与传统搜索相当的商业利益。这种趋势已经反映在苹果的季度财务业绩中。苹果服务业务的同比增长率从 12% 放缓至 10%。苹果高管还表示，预计下一季度的增长势头将进一步减弱。与此同时，谷歌公布搜索广告收入增长放缓后股价累计下跌 18%。Rosenblatt Securities 高级研究分析师 Barton Crockett 表示，谷歌无法像传统搜索结果那样，从“AI 模式”中获得同等水平的商业收益。尽管搜索查询量仍保持同比增长，但谷歌 AI 模式的搜索广告变现能力低于传统搜索。其搜索广告收入增长率已从上一季度的 17% 放缓至 12%。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/030/783.htm", "publishedAt": "2026-11-23T02:44:11+00:00"}, {"title": "华为OSTA星芒 O1 Pro 评测：一台真正为 AI 而生的鸿蒙手机", "summary": "面向 AI，面向世界，面向未来#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1690613?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-11-23T00:57:34+00:00"}, {"title": "8万条群聊消息做成考卷：腾讯元宝×KCL发布首个基于群聊构建的Agent记忆基准", "summary": "", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/511841.html", "publishedAt": "2026-11-21T11:40:11+00:00"}, {"title": "哈佛大学研究人员：AI 编程目前的瓶颈是“Code Review”", "summary": "哈佛大学两位博士候选人做了一份工作论文，把 AI 编程 Agent 的真实效果算了一遍。样本是 718 家公司、725938 名员工。 结论不太好看。 用上 AI 编程 Agent 之后，人均每月新增代码行数从 5017 涨到 6511，多了约 30%。提交数增长 20%，Pull Request 增长 23%。该有的增长都出现了。 但活干完了吗？没有。 论文用 Jira i...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503706/harvard-researchers-find-ai-coding-agents-shifted", "publishedAt": "2026-11-20T09:00:13+00:00"}, {"title": "Google「AI Overviews」让网站的搜索流量下降四成", "summary": "Google 搜索引擎「AI Overviews」服务正在抢走网站的流量。 根据一项随机实验的测试，AI Overview 导致从 Google 搜索结果指向外部网站的点击量下降了四成。 这是随机实验做出来的数字，不是相关性推测。研究者对一部分美国桌面用户隐藏了 AI Overviews，然后和仍能看到的那组做对比。 这个数字背后有一个更直观的画面：...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503698", "publishedAt": "2026-11-20T03:57:08+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "韩国防 AI 作弊新招：要求考生穿围裙考试、时隔 6 年重新收缴手机", "summary": "IT之家 11 月 23 日消息，据韩媒报道，韩国第 28 届警卫指导师考试前日开考。据考生所述，本次考试加强了作弊防范力度， const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
