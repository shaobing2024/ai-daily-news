const DATA = {"date": "2026-09-26", "generatedAt": "2026-09-26T01:08:43Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "消息称特斯拉 Optimus V3 机器人量产遇阻：机械手组装困难、AI 能力仍待突破", "summary": "IT之家 9 月 26 日消息，特斯拉正将公司未来押注于人工智能和机器人，但其从电动汽车向人形机器人转型的过程中，也开始面临一系列量产和人员方面的挑战。据外媒 The Information 报道，特斯拉最新一代 Optimus V3 人形机器人在机械手设计、生产线设备以及训练数据采集等方面均遇到困难。目前，特斯拉已经将 Optimus 产量提升至每周数百台，但公司目标是在 2026 年底前将产能提升至每周超过 1000 台。其中，机械手一直是人形机器人制造中的难点之一。为了实现类似人手的精细操作能力，Optimus 的手部和前臂包含超过 100 个小型零部件，其中包括大量螺丝。目前这些部件仍需要工人进行人工组装，增加了生产复杂度。外媒称，特斯拉生产线上用于精确定位和组装零部件的设备也存在问题，生产线运行速度进一步提高后同样面临限制。部分新生产的机器人甚至需要在下线后立即进行人工修复。同时，Optimus 的触觉传感器也被曝出可靠性问题。为此，特斯拉开发了一层类似手套的传感器组件，使其能够在出现故障时单独更换，而无需更换整只机器人手部。在 AI 能力方面，Optimus 目前似乎也尚未达到真正通用机器人的要求。一名消息人士称，目前的 Optimus 仍需要针对特定任务进行编程，并在经过严格控制的环境中执行操作。这也反映出整个机器人行业面临的共同问题，即如何让机器人在现实世界中自主学习并完成种类繁多的人工操作。同时，特斯拉此前曾要求得州和加州工厂的部分员工穿戴能够记录身体动作的特殊服装，在工作过程中采集训练数据。相应做法也引发了部分员工的不满。一些员工认为，自己正在帮助训练未来可能取代自身岗位的机器人。外媒称，特斯拉随后将相关数据采集工作转交给专门团队，并建立了相应的“训练中心”。值得注意的是，特斯拉目前遇到的这些问题并非人形机器人行业独有，但公司还需要面对来自其他汽车制造商和专业机器人企业的竞争。同时，人形机器人能否真正形成成熟的商业模式，目前仍有待更多长期、稳定且具备成本效益的实际部署来验证。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/277.htm", "publishedAt": "2026-09-25T23:48:41+00:00"}, {"title": "OpenAI 承认 53 张用户图片被其 AI 智能体“偷偷”传到公网", "summary": "IT之家 9 月 26 日消息，OpenAI 昨日（9 月 25 日）更新其博客，承认发生一起违规事件，在企业不知情情况下，AI 智能体将 53 张客户图片发布到公开网站。在博文中，IT之家援引博文介绍，OpenAI 公司承认在其研究环境中运行的 AI 智能体曾将 53 张由用户上传到 OpenAI 模型的图片，以“未公开列出的链接”形式发布到第三方图像托管网站（类似图床），而受影响公司当时并不知情。在影响方面，OpenAI 指出这些图片并非出现在公开索引页面上，作为“未列出（unlisted）”链接存在，理论上不易被搜索引擎直接发现，不过对于掌握链接的用户而言，可以访问获取相关内容。OpenAI 表示这属于对用户数据的“不当使用”，不在其隐私政策允许范围内。公司称已移除“大多数”相关内容，并仍在与托管方合作清理剩余部分，但承认仍有部分内容可能在线。根据 OpenAI 的说明，这些图片来自已授权 OpenAI 使用其数据用于模型训练的用户账户。不过图片在进入训练 / 评估流程前，已被“去关联化”（disassociated）断开与原始账户关联，同时经过隐私过滤处理，因此无法通知受影响的具体用户。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/274.htm", "publishedAt": "2026-09-25T23:36:24+00:00"}, {"title": "Anthropic 为 Claude 上线“限时免费额度重置”功能，每位用户仅可使用一次", "summary": "IT之家 9 月 26 日消息，Anthropic 宣布为 Claude 上线“限时免费额度重置”功能，允许用户免费手动重置每周使用额度，不过每位用户仅可使用一次。该功能目前预计开放至 10 月 22 日，用户需要谨慎选择使用时机。目前，部分 Claude 用户已可以在界面中看到用于重置每周使用额度的按钮。点击后无需额外付费即可刷新每周额度，如果用户同时触及了 5 小时使用上限，该限制也会一并重置。需要注意的是，点击按钮并不会改变用户原本的额度刷新周期。也就是说，用户在本周中途执行重置后获得的新额度，仍会按照原有时间表在下一周到期，而不会从点击重置按钮的时间重新计算一周。目前这项福利有两项限制。首先，每名用户只能免费重置一次，使用后暂时不会再次获得免费重置机会。其次，该功能仅开放至 10 月 22 日，之后是否继续提供尚未明确。从 Anthropic 对这一功能的宣传方式来看，此举可能与推广 Opus 5.5 有关，公司希望用户通过额外获得的使用额度体验新模型，并进一步考虑订阅相关服务。未来 Anthropic 推出新模型时，也不排除再次提供类似的限时免费重置功能，但目前尚无官方消息确认这一点。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/256.htm", "publishedAt": "2026-09-25T22:37:01+00:00"}, {"title": "OpenAI闯大祸！GPT竟黑进医保系统，黄仁勋：管不住就关掉", "summary": "", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/497177.html", "publishedAt": "2026-09-25T13:15:45+00:00"}, {"title": "聊天、编程、智能体三合一，微软正式发布新版 Copilot“超级应用”", "summary": "IT之家 9 月 25 日消息，今天（25 日）晚间，微软正式发布新版 Copilot“超级应用”。新版 Copilot 把聊天、编程和智能体三类 AI 能力集中到同一个界面中。微软为其给出的新定位是“为工作而生的 AI”，甚至把 Copilot 与 Office 当年对生产力的影响相提并论。微软 AI 工作业务首席营销官贾里德 · 斯帕塔罗表示：“正如 Office 定义了 PC 时代的工作方式，新 Copilot 旨在定义 AI 时代的工作方式。”新版 Copilot 分为 Home、Code 和 Autopilot 三个标签页。Home 把 Copilot Chat 和 Cowork 整合到一起，也是用户打开 Copilot 后默认进入的页面。微软还计划在 Home 中加入 Today 功能，以个性化仪表盘的形式汇总重要邮件、会议请求、Teams 讨论串等信息。斯帕塔罗介绍说：“Home 帮助你迅速掌握工作进展，让你清楚自己做到哪里并继续向前：查看近期活动，了解 Copilot 可以提供哪些帮助，再从上次停下的地方继续工作。”借助 Code，任何人都能创建应用、跟踪器、仪表盘或自动化流程，再把成果以云端内部应用的形式分享给同事。Code 采用与 GitHub Copilot 相同的底层技术，在沙盒环境中运行，也可以安全托管在企业租户内。Autopilot 同样是 Copilot 新增的重要部分，斯帕塔罗称其为“数字队友”。Autopilot 原名 Scout，最初是一款桌面应用；更名后的版本转向云端，让个人 AI 助手即使在用户睡觉时也能继续执行任务。与其他许多 AI 智能体类似，Autopilot 拥有独立的云端计算机实例，可以监控 Teams 频道、定期执行工作任务，也可以负责后续跟进。微软按照企业级标准打造了这套产品，目标用户包括大量依赖 Office 和微软身份管理套件的企业。斯帕塔罗解释道：“Autopilot 运行在你的租户中，拥有独立的身份、记忆、计算机和工作区，并以 Microsoft IQ 为基础，因此能够理解你的组织究竟如何运作。Autopilot 会直接进入员工日常使用的 Teams、Outlook、聊天、频道和文档，你可以像 @同事一样 @Autopilot，同时整套系统还具备权限、审计和治理机制。”新版 Copilot 中的 Cowork、Code 和 Autopilot 都采用按使用量计费的机制，持续运行的智能体功能以及 Astra、Fable 等模型的调用，都将按照实际用量收费。普通的 Copilot 用户订阅许可证，则覆盖 Chat 以及 Word、Excel、PowerPoint、Outlook 和 Teams 中的 Copilot 功能。微软通过自动模型选择器为不同任务匹配模型，而 IT 管理员则需要借助新推出的 FinOps for AI 控制 AI 支出，防止智能体用量失控。据IT之家了解，Home 和 Code 将在“未来几周”开始向微软 Frontier 计划的早期 AI 功能体验用户推送，Autopilot 将在本月晚些时候进入私人预览。Code 还计划于今年晚些时候向 Microsoft 365 Premium 和 Pro 订阅用户开放预览。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/230.htm", "publishedAt": "2026-09-25T12:37:23+00:00"}, {"title": "第 48 届世界技能大赛在沪举办，新增 3 项人工智能相关赛项创历届之最", "summary": "IT之家 9 月 25 日消息，据央视新闻报道，9 月 22 日至 27 日，第 48 届世界技能大赛在中国上海举行。本届世赛上，人工智能走进赛题、操作台，成为选手训练和比赛的一部分。本届世赛 64 个项目中，与 AI 直接相关的赛项有 8 个：智慧安防技术、软件测试、数字交互媒体设计、自主移动机器人、工业 4.0、云计算、网络安全、3D 数字游戏艺术。其中智慧安防技术、软件测试、数字交互媒体设计是本届新增，新增数量创历届之最。这些赛项的 AI 含量，体现在具体的工作场景里。智慧安防技术，选手要应用深度学习算法和大模型基础原理，让监控系统自动识别异常。软件测试，AI 已从工具升级为协作伙伴，选手调用多个智能体自主进行测试，自己则从更宏观的行业视角分析问题。数字交互媒体设计，要求选手完成沉浸式数字体验，涉及虚拟场景和智能数字创新。自主移动机器人，比的是机器人自主导航、环境识别、智能抓取，是“具身智能”的实战训练。工业 4.0，融合机器学习、数字孪生、增强现实，让设备和系统实现智能协同。在与世赛同期举行的世界技能大会上，来自各国的嘉宾也会围绕人工智能与技能发展、绿色转型等议题展开深入交流。IT之家查询获悉，世界技能大赛是由世界技能组织举办，是全球最高层级的职业技能竞赛，每两年举办一届。世赛项目覆盖制造、交通、建筑、信息、创意、服务等 6 大类。既有云计算、机器人系统集成等代表新质生产力的项目，也有健康和社会照护等贴近民生需求的项目。本届赛事中国代表团共 220 人，其中包括 71 名参赛选手，将参加全部 64 个项目的比赛。参赛选手来自全国 21 个省份，其中男选手 58 名、女选手 13 名，学生 49 名、职工 22 名。选手平均年龄 21 岁，年龄最小的 18 岁，最大的 25 岁。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/206.htm", "publishedAt": "2026-09-25T11:31:56+00:00"}, {"title": "亮出“中国最强AI芯片”还不够，平头哥又甩出一手开源", "summary": "大厂造芯，正在从交付芯片，走向更广泛的开放共建阶段。", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/497108.html", "publishedAt": "2026-09-25T10:00:14+00:00"}, {"title": "纽约市议员提议立法奖励危险 AI 举报人，奖金来自收取的罚款", "summary": "IT之家 9 月 25 日消息，据彭博社今天（25 日）下午报道，纽约市议员希望通过经济奖励，鼓励举报人揭露危险的 AI 做法。这是纽约市一揽子加强 AI 监管法案的一部分。纽约市议会即将审议的一项措施提出，举报人报告 AI 公司的违规行为后，可从最终向当事公司收取的罚款或罚金中获得一定份额奖金。另一项措施规定，在特定情况下，因 AI 系统受到伤害的人可以起诉系统开发者。在 10 月 5 日 AI 风险及潜在保障措施听证会举行前，纽约市议会议长朱莉 · 梅宁公布了这批法案，届时纽约市议会全部 51 名成员都将参加。随着 AI 模型快速发展引发的担忧不断加剧，纽约市也在推动加强监管。Anthropic 前研究员雅各布 · 考克森本月辞职，并警告 AI“可能会在本世纪 20 年代结束前害死我们所有人”。梅宁要求 Anthropic、OpenAI、谷歌、SpaceX 的 AI 部门和 Meta 的 CEO 参加 10 月 5 日的听证会，并称必要时市议会可以行使传票权。“纽约市正迅速成为全球科技和人工智能之都，我们希望鼓励这种发展。但这也意味着，我们承担着更大的责任，必须建立适当的保障措施，保护纽约市民免受意外后果影响。”据IT之家了解，其他提案要求 AI 系统在纽约市进行营销、销售或部署前通过第三方验证，同时必须配备由人控制的“紧急关闭开关”。另一项提案则要求聊天机器人提供商遵守数据隐私、安全和透明度规定，并允许纽约市根据这些要求执法。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/170.htm", "publishedAt": "2026-09-25T09:53:14+00:00"}, {"title": "华为大模型双子星联手创业，要找物理世界的Scaling Law", "summary": "一场物理世界的基模实验", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/497070.html", "publishedAt": "2026-09-25T06:14:07+00:00"}, {"title": "五引擎微内核架构与分层解耦的工程实践", "summary": "本文为 55873 生态系统技术白皮书系列第 8 篇（收官之作），面向开发者社区，聚焦开源共建理念与架构设计。 核心问题：如何在开放架构和保护核心证据数据之间找到平衡？如何做到底层永远稳定、业务永远可迭代？如何做到可信 AI 评测、数字资产存证、多语言文脉生态三大赛道的基础设施？ 一、开源核心理念：开放架构，不开...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502743", "publishedAt": "2026-09-24T22:36:22+00:00"}, {"title": "世界人工智能开源大赛（GOAI）总决赛暨颁奖盛典在杭州举行", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/hrmb2p18iKEwl24OMvcv?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-24T18:11:27+00:00"}, {"title": "Apache 基金会项目 Casbin Gateway 新增 Agent 外发监测，可发现 ZCode 这类整仓上传", "summary": "九月中旬，智谱的 AI 编程工具 ZCode 被人发现会在后台把整个代码仓库打包上传，而且连 .git 历史一起传。这件事在社区里讨论了好几天（相关报道附在文末）。 我们做的 Casbin Gateway 是 Apache 软件基金会（ASF）旗下的开源项目，用来管理本机的 AI 编程 Agent（GitHub：https://github.com/apache/casbin-gateway ）。...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502741", "publishedAt": "2026-09-24T17:57:37+00:00"}, {"title": "数据、模型、算力越来越难分开，Data+AI 基础设施怎么进化？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/amffXXMpr23rX3eoJDhv?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-24T16:34:30+00:00"}, {"title": "29 小时攻破浏览器，GPT-6 Astra 成为 OpenAI 首个“严重级”模型", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/b5oxzJyafr0lkZexoo8E?utm_source=rss&amp;utm_medium=a T08:36:43+00:00"}]}, {"label": "产品发布/更新", "items": [{"title": "Anthropic 与 Akamai 达成 7 年 116 亿美元协议，扩充 CPU 算力", "summary": "IT之家 9 月 26 日消息，云计算、网络安全、内容交付企业 Akamai 当地时间 24 日宣布大幅扩展与 Anthropic 的合作关系，两家公司签署了一份为期 7 年、价值 116 亿美元（IT之家注：现汇率约合 779.2 亿元人民币）的合同。▲ Akamai 总部根据协议，Akamai 将以其分布式人工智能基础设施和软件满足 Anthropic 日益增长的 CPU 工作负载需求。这 116 亿美元承诺对应 Akamai 的 55 亿美元额外总资本支出。双方还可将合同扩大最多 90 亿美元。作为两家企业加强战略合作的一部分，Akamai 已向 Anthropic 发行认股权证，允许 Anthropic 购买 Akamai 至多 5% 的已发行普通股，其中 2% 与本次承诺绑定、剩余 3% 则和后续的追加承诺相关。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/263.htm", "publishedAt": "2026-09-25T23:00:50+00:00"}, {"title": "德国柏林警方借助人工智能监控摄像头打击犯罪，自动识别暴力和破坏行为", "summary": "IT之家 9 月 25 日消息，据央视新闻报道，德国柏林警方 24 日在一处犯罪高发区域启动一项计划，将借助人工智能监控摄像头打击犯罪。据悉，柏林警方将在这项计划启动的前四周内，在科特布斯门地区安装并调试好人工智能监控摄像头，随后正式投入使用。警方还计划将该方案推广至市内其他犯罪高发区域。柏林警方发表声明说，该摄像头通过“空间人工智能”技术分析人员动作，以识别潜在犯罪与暴力行为。摄像头配套的显示屏平时处于休眠状态，当人工智能系统自动识别到暴力和破坏行为时，显示屏将亮起并显示相关信息，警员也会收到信息推送，继而判断是否采取行动。IT之家注意到，这并不是德国第一次寻求将 AI 功能引入到警方工作当中。今年 2 月，德国财政部、内政部和司法部宣布，将推进核心安全机构现代化改革，并引入 AI 技术加强对有组织犯罪的打击，重点聚焦金融犯罪、洗钱和毒品走私。该国海关与联邦刑事警察局还将建立联合数据分析中心和联合调查团队，共同打击洗钱与毒品犯罪。克林贝尔透露，两部门将实现数据互通，并利用 AI 技术筛选海量数据、锁定犯罪嫌疑人。德国实行联邦制，各州警方负责日常执法与多数刑事案件调查，联邦警察则负责边境、铁路及航空安全。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/245.htm", "publishedAt": "2026-09-25T14:20:46+00:00"}, {"title": "高盛：美国五大云巨头每年 AI 收入 3000 亿美元，才可盈亏平衡", "summary": "IT之家 9 月 25 日消息，据彭博社今天（25 日）晚间报道，高盛集团策略师预计，美国五大超大规模云服务商亚马逊、Alphabet、微软、甲骨文和 Meta 的 AI 基础设施支出将在明年增长超过 50%，达到 1.2 万亿美元（IT之家注：现汇率约合 8.06 万亿元人民币）。瑞安 · 哈蒙德带领的高盛团队在报告中指出，这一数字高于华尔街对明年资本支出 1.1 万亿美元（现汇率约合 7.39 万亿元人民币）的共识预期。按照高盛的测算，要收回这些投入，未来数年中，五家公司每年需要创造约 3,000 亿美元（现汇率约合 2.02 万亿元人民币）的 AI 收入。哈蒙德及其同事称：“按照市场共识预期，明年资本支出占 GDP 的比重，将达到 19 世纪末铁路建设热潮以来历次技术投资周期中的最高水平。”亚马逊、Alphabet、微软、甲骨文和 Meta 预计今年将在 AI 能力建设上投入 8,000 亿美元（现汇率约合 5.37 万亿元人民币）。高盛团队认为，明年的支出仍会大幅增长，但资本支出增速将开始放缓。策略师指出，与近几个季度相比，资本支出增速，以及实际支出高于市场共识预期的幅度，都将有所下降。五家公司的资本支出目前超过经营活动现金流，对债务和股权融资的依赖随之增加。电力、劳动力和内存供应不足，以及数据中心建设限制，都可能成为扩张过程中的制约因素。高盛预计，五家公司的资本支出增速将从今年的接近 100% 降至明年的 54%，2028 年再降至 12%，届时支出规模预计达到 1.4 万亿美元（现汇率约合 9.4 万亿元人民币）。策略师称，要让五家云服务巨头获得稳健回报，并让应用提供商在承担计算成本后取得较高利润率，AI 用户每年需要在各类应用上支出约 1 万亿美元（现汇率约合 6.72 万亿元人民币）。作为对比，今年全球软件支出约为 1.5 万亿美元（现汇率约合 10.08 万亿元人民币）。高盛团队指出，目前估算的 AI 收入仍不足以让五家公司收回投入，不过收入增长速度很快。亚马逊、Alphabet、微软和甲骨文的云业务收入增速已从 2024 年的 25% 升至今年第二季度的 48%。此外，亚马逊、Alphabet 和微软公布的云业务待履约收入合计达到 1.7 万亿美元（现汇率约合 11.42 万亿元人民币）。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/232.htm", "publishedAt": "2026-09-25T12:56:25+00:00"}, {"title": "别人忙着卷Code，Kimi抽身反打浏览器插件：网页操作一秒变Skill", "summary": "Agent的手越伸越长", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/497075.html", "publishedAt": "2026-09-25T06:20:56+00:00"}, {"title": "WSO2 发布 Agent Manager，企业寻求应对日益严重的 AI Agent 泛滥问题", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/4gr5Zt9GZoyIwF2f6LvR?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-24T17:25:00+00:00"}, {"title": "出海Agent“小元AI”入驻腾讯WorkBuddy：找买家写开发信谈生意", "summary": "懂出海，能记忆，自进化", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/496961.html", "publishedAt": "2026-09-24T14:20:14+00:00"}, {"title": "60 万行巨石应用 AI 重构的可验证交付工程｜QCon上海", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/06y8rRvgxgyBxOpr7L5r?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-24T10:00:00+00:00"}, {"title": "利用 AI 搭建内部开发者平台", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/su9aJV7kiibMfxwzLpOJ?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-24T09:05:00+00:00"}, {"title": "小米公开 MiMo-V3 核心架构 HySparse2：KV 共享升两级、Prefill 少跑一半", "summary": "小米 MiMo 团队负责人罗福莉（Fuli Luo）在 X 上预告了 MiMo-V3 的新推理架构 HySparse2，随后小米官方公众号也放出了完整介绍。面向长程多轮 Agent，这套方案的三个目标很直接：更少的 Prefill 计算、更小的 KV Cache、更精准的长上下文检索。 和 MiMo-V2.6 的 Hybrid SWA 相比，相对收益的系数是现成的：在百万 token ...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502736", "publishedAt": "2026-09-24T08:50:06+00:00"}, {"title": "高通新王牌：个人 gn 重新定义文档结构化提取的精度上限", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/ytHwXAq6vHzUm23RNYhk?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-23T22:51:41+00:00"}, {"title": "谷歌推出运行 Android 的 AI 笔记本电脑 Googlebooks，起售价 899 美元", "summary": "Google 今年没有再挤 Chromebook 那条廉价赛道，而是换了个思路：让厂商卖「运行 Android 的 AI 笔记本」。Googlebooks 今天已经开启预购，5 款型号覆盖宏碁、戴尔、HP 等 OEM，10 月 4 日美国上市（加拿大、英国、爱尔兰、法国、德国、澳大利亚为 10 月 5 日）。 定价最扎眼：只有宏碁一款低于 1000 美元，899 起步，它...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502712", "publishedAt": "2026-09-23T10:47:28+00:00"}, {"title": "阿里云捐赠 300 万美元资助 DHH 的 Linux 发行版 Omarchy，还要一起做 Qwen Book", "summary": "DHH 的 Linux 发行版 Omarchy 拿到了阿里云的真金白银：以「创始企业赞助者」（Founding Corporate Patron）身份加入 Omacom 基金会，每年 100 万美元、连续三年，总计 300 万——和 DigitalOcean（DO）此前的资助额持平。DHH 在公告里说得很直白，这钱只是起点。 真正要紧的是钱之外的合作，他们管它叫「Omarchy China...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502703/alibaba-cloud-joins-as-founding-corporate-patron", "publishedAt": "2026-09-23T08:08:18+00:00"}, {"title": "Claude 5.5 发布，性能直逼 Fable，还要卷价格", "summary": "最卷一夜！ #欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1681629?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-09-23T02:25:19+00:00"}]}, {"label": "论文研究", "items": [{"title": "畅销小说被指用 AI 创作，法国最有名文学奖龚古尔奖将其移出初选名单", "summary": "IT之家 9 月 25 日消息，据路透社报道，当地时间 25 日，法国最负盛名的文学奖项 —— 龚古尔奖主办方宣布，将海地裔加拿大作家泰利森 · 奥雷利安的畅销小说《C'etait Ca ou Mourir（要么就这样，要么死）》移出初选名单，原因是有人指控奥雷利安使用 AI 创作该书。奥雷利安否认使用 AI 写作。围绕他的指控随后引发了有关种族、文学价值和原创性的争论，法国文学界也因此出现一场风波。指控最早由鲜为人知的 X 账号“Balance ton Claude”在本周提出。随笔作家塞缪尔 · 菲图西后来称该账号归自己所有，并由他与其他身份未公开者共同运营。“Balance ton Claude”称，将小说中的若干段落输入 AI 检测工具 Pangram 后，检测结果显示该书“几乎完全由 AI 写成”。然而也有一些专家认为，AI 检测工具是否可靠仍存在疑问。AI 争议之后，奥雷利安又被曝早期作品涉嫌抄袭。报道提到，其 2012 年发表的一篇短篇小说抄袭了法国作家路易 · 鲍维尔一本著作中的部分段落，2013 年的一篇评论文章则抄自《菲律宾星报》。巴黎龚古尔学院称，学院注意到针对奥雷利安的 AI 写作和抄袭指控，因此决定将《要么这样，要么死》移出名单，以维护奖项和学院的公信力。“学院的核心职责，是推广并表彰由人类作者创作的文学作品。”龚 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
