大力投入 AI 的原因。投入很大，是因为 AI 发展还在早期，当前所有基建和算力都需要自建，而且在所有人都投入的情况下，价格飞涨。但如果现在不投，以后可能连参与的机会也没有。但我们也非常务实，不仅看长期和全局，也要在能力范围看投入产出比，看到底能创造多少价值。某种程度上，可以说我们过去 28 年的存在就为了今天可以投入这样一个改变世界的技术潮流。不是每家公司都有机会加入，能够投入、参与这场巨大的科技变革，并且站在前沿，这是我们的荣幸。在这场全球变革里，我们相信这些投入肯定有回报。这个回报可能是我们 AI 原生业务不断发展，创造新的价值，也有可能是现有业务向 AI 时代更快再创业带来的增值。我们扎根于中国，我们拥有在性价比上竞争力很强的模型，如果我们让地球上各个地方的人都能用上 AI，同时深刻改变各个行业，这将创造巨大的价值。3、我们的 AI 金字塔初见雏形，智能应用的开发刚刚开始我们的 AI 业务要一层层看。金字塔的核心是模型，现在我们已经进入国内第一梯队，接下来不断迭代，推动智能的成本指数级下降。小微是每个人的私人 AI 助理，随着能力的迅速增长，它的目标是让大家实现“token 自由”。而元宝未来可以成为每个人决策和资讯的参谋。WorkBuddy 就是你的员工，它在短短 8 个月内成为中国提供最多 token 的单一 AI 产品，展示了 AI 时代的生长速度。这些 AI 产品，可以覆盖用户每天的需求。WorkBuddy 是我们 AI native 第一个跑出来的产品，也希望之后我们内部更多团队可以和 AI 有乘数效应，创造出更多新的 AI native 产品。现在 AI 在应用层面的开发才刚刚开始，如同工业化早期刚刚发明用电力来照明，还没有出现各种电器和把电力用于生产。未来更大的智能应用将发生在生产中，跟千行百业结合，还有很多机会值得我们投入。这个过程中，资源有限，注意力也有限，所以一定要找准定位，发挥我们的优势。4、心态归零，加快速度，提升要求，打破山头心态归零，所有核心业务每一个团队都要面向 AI 时代再创业，抛掉身上的包袱，拥抱 AI 新时代。所有人都要动手做事，整个组织有机化。每个人快速提升能力，每个组织重新变化、扁平化，以小团队为作战单元。打破过去的管理流程。整个管理方式以及做事方式都要通过 AI 重新设计，在现有业务上再延伸竞争力，让成本、效率可以再优化，获取更多的商业化能力，甚至创造出新的需求 —— 它也许是现有路径上的新需求，也许是一个全新的 AI 产品。我们要加快速度，马上反馈，马上决策，马上行动；我们要提升对所有人的要求。重新组建混元团队的时候，一个重要的体会就是：人才密度的定义不只是你有多少特别有能耐的人，还取决于团队所有人的能力能否向上拉齐。组织变革要加快，未来不一定要那么多管理岗位，不要让中间传话的不想动还霸占地盘的干部成为阻碍，山头主义、地盘意识都要完全打破。很多基层同事很有动力和激情利用 AI 发挥自己的聪明才智，他们有机会成为一个非常好的贡献者，但是受制于很多旧有的架构和组织。我们要对此做更大的调整，让更多有机的小团队做大事，组织更灵敏地变化。5、所有人先动起来，在新的时代同努力，再出发先动起来才能找到机会。不动不改，走出第一步的勇气都没有的话，就没有未来了；什么都要问清楚才动身，也没机会。过去 28 年我们经历很多，很多次变革都非常惊险，是自上而下和自下而上合力的结果。这次也是一样。我们给更好的土壤、更好的机制，让有想法的员工能够从下面冒上来，一旦新业务培育成功，我们全力以赴支持，兄弟部门也全力支持，最终平台和用户大家都受益。只要我们真正动起来，全面拥抱这个新的时代变革，把腾讯的价值观做到极致，就可以克服困难，产生巨大的生产力。首先是我们的正直，“用户为本、科技向善”已经在腾讯扎根；第二很多团队都有很强的自下而上、由内而外的创造力和意愿，我们一定要把这种创造力发挥出来；第三是协作，公司很大，有部门墙，但在生死之战中，你帮我挡住后面，我帮你看住前面，协作自然就会出来。游戏、金融、安全等团队都把他们的能力跟模型进行了 Co-Design，带来了 Hy 能力的提升，我们可以进行更多这样的参与和推动，同时再把混元的能力拉进自己的业务里，让业务有质的提升，创造新的场景；在进取这块，我们还可以更加进取。期待所有小伙伴们可以把焦虑转为兴奋，把等待和观望的情绪转换为全情投入，核心业务面向 AI 时代再创业，同时支持 AI native 模型、业务的发展，让我们腾讯的价值观在 AI 时代闪闪发光。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/027/509.htm", "publishedAt": "2026-11-16T02:03:09+00:00"}, {"title": "不调用图像模型，Anthropic Claude Fable 5.2 用 Python 代码模拟真实画笔作画", "summary": "IT之家 11 月 16 日消息，Anthropic 于当地时间 11 月 9 日发布了最新的 Claude Fable 5.2 和 Claude Mythos 5.2 模型。其中，Fable 5.2 不仅面向复杂编程、科学研究和工程任务，还展示了一种异类的“AI 生图”功能（IT之家注：Anthropic 目前仍无传统意义上的文生图模型，大家常见的 DeepSeek 和 Claude 表情包均由其他模型生成）。不同于传统图像生成模型的绘画方式：Fable 5.2 可通过编写代码模拟画笔、颜料和画布，逐笔完成绘画，而不是直接调用图像生成模型输出成品。Fable 5.2 不直接生成图像，而是通过编写代码，在虚拟画布上模拟真实画笔的运动，逐笔完成绘画，甚至能够模拟笔刷纹理、颜料湿润程度以及画布质感，并在发现错误后通过新的笔触进行修正。目前 Midjourney 等主流 AI 图像生成工具通常采用扩散模型，通过逐步处理随机噪声生成图像。Fable 5.2 则采用另一种思路，将绘画过程拆解成大量独立的笔触指令，由模型自行规划和执行。Anthropic 员工 Jake Eaton 在 X 上展示了这一能力。他要求 Fable 5.2 创作一幅尽可能达到照片级真实感的作品，而 Claude 最终绘制了一辆位于停车场内的购物车，使用了约 70 万次模拟笔触。据 Eaton 介绍，这些作品不依赖外部图像模型，也没有使用预先渲染或描摹的底图。每幅画实际上都是一段由 Claude 编写的 Python 程序，代码通常有 1000 至 2000 行，通过模拟绘画引擎控制不同类型的画笔完成创作。这种方式也让模型能够发展出相对独立的艺术风格。此前，Claude Opus 5.5 的部分绘画作品曾因过于模仿现有艺术风格受到批评。对此，Eaton 开始让 Fable 5.2 自行设计具有虚构经历和稳定创作风格的艺术家人格，再根据作品效果通过文字反馈引导模型调整画笔和绘画引擎。Anthropic 工程师 Michael Graczyk 也分享了另一组实验。他要求 Fable 5.2 绘制一只日出时的鸟，并限制模型只能通过代码模拟画笔物理特性、湿润颜料和画布纹理。这意味着，模型必须将每一笔单独输出为坐标指令，而且笔触落在画布上之后不能撤销。最终，一段 21 秒的视频记录了模型从空白画布完成这幅作品的过程，总计使用 111 笔。第一笔使用了 #30346a 色号，笔刷宽度为 90 像素，并包含 5 个略微晃动的路径点。模型表示，这种约 7 像素的摆动是刻意设计的，因为人类手臂也无法画出绝对笔直的线条。在多轮绘制过程中，模型会观察画布并检查自己的错误。例如，当鸟背画得过于纤细、线条显得杂乱时，它会使用更粗的笔触覆盖原有区域，使边缘残留的刷毛痕迹看起来更像蓬松的羽毛。在另一幅使用 280 笔完成的黄昏场景作品中，模型绘制了两个人物共同作画的画面。由于后期添加光照效果时意外模糊了桌面上的颜料管和杯子，Claude 又通过新的笔触重新绘制了这些物品。此外，模型还让两个人物分别使用身体外侧的手作画，使两人的内侧肩膀能够按照提示词要求相互接触。这种逐步规划、观察结果并自行修正的能力，也被认为与机器人控制等物理任务存在关联。Anthropic 表示，Fable 5.2 面向复杂、持续时间较长的技术任务，能够在执行过程中协调多个子智能体，并通过反复验证改进结果。根据 Anthropic 公布的内部测试结果，Fable 5.2 曾解决两个黑洞物理学领域的开放问题，与电路板制造商 Diode 合作设计了三款可工作的电子设备，还曾协调超过 1000 个子智能体，在 8 天内编写出一套运行于笔记本电脑上的操作系统。AI 研究人员 Aris Zhu 还对 Fable 5.2 的实际机器人控制能力进行了测试。他让 Fable 5.2 与 OpenAI 的 GPT-6 Astra 分别控制实体机械臂，尝试绘制梵高的《星月夜》。在 Anthropic 公布的内部 RoboDojo Sim 模拟机器人基准测试中，Fable 5.2 得分为 64.9%，GPT-6 Astra 得分为 29.8%。Anthropic 称，该测试评估了模型对模拟双臂机器人的控制能力。不过，实际机械臂测试也显示出 Fable 5.2 在精细动作控制方面仍有不足。根据 Zhu 分享的实验记录，GPT-6 Astra 的绘画速度更快，而截至目前，只有 OpenAI 的模型成功让一枚多米诺骨牌竖直站立。其采用的方法是缓慢松开机械夹爪，让骨牌以夹爪为支点，借助重力完成旋转并最终竖立。相关阅读：《全球最强 AI 模型：Claude Fable 5.2 登场，编程超 GPT-6 Astra、登顶多项基准》《8 天从零搓出操作系统：Anthropic 最强 Claude Fable / Mythos 5.2 AI 模型登场，API 调用费下降 20%》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/027/490.htm", "publishedAt": "2026-11-16T01:01:05+00:00"}, {"title": "腾讯 WorkBuddy 国际版上线 Gemini 4 Carbon 大模型：支持百万 Token 上下文，暂仅限 Pro 用户使用", "summary": "IT之家 11 月 16 日消息，腾讯 WorkBuddy 国际版昨日宣布，已正式上线谷歌 Gemini 4 Carbon 模型，主要面向需要更深入推理和处理更长任务的使用场景。官方将其定位为适合处理复杂问题的模型，目前仅面向 Pro 计划用户开放。IT之家此前报道，谷歌称 Gemini 4 Carbon 模型主要面向长周期智能体工作流，适用于复杂知识工作、软件工程、网络安全和科学推理等任务。模型支持文本、图像、音频和视频输入，输入与输出合计上下文窗口最高可达 100 万 Token。此次接入意味着 WorkBuddy Pro 用户可以在该平台内调用 Gemini 4 Carbon，无需仅通过谷歌自有产品使用。不过，WorkBuddy 官方目前尚未公布该模型在平台内的具体调用额度及使用限制。相关阅读：《腾讯 Workbuddy 致歉：未及时公告优惠活动调整，DeepSeek-V4.1 Flash 积分消耗 5 折结算返还》《腾讯汤道生：WorkBuddy 已覆盖中国企业 500 强中的 50%》《腾讯 WorkBuddy 接入模型 Kimi-K3.1-Pro，支持 100 万上下文》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/027/487.htm", "publishedAt": "2026-11-16T00:44:37+00:00"}, {"title": "韦布望远镜发现迄今最古老类星体双星，现有黑洞成长理论难以解释", "summary": "IT之家 11 月 15 日消息，利用詹姆斯 · 韦布空间望远镜（JWST），天文学家发现了迄今观测到的最古老的一对由超大质量黑洞驱动的类星体。不过，这项发现也带来了一个难题：按照现有理论，它们本不应该如此早就存在。这对紧密相邻的类星体借助双子座北望远镜（Gemini North）得到确认，编号为 J1602+4228AB，昵称为 Nāpōwawāʻenakaulua。这个名称意为“在热量中重生、将能量注入宇宙的无尽强大黑暗中的两个天体”。天文学家观测到的，是这对类星体在宇宙大爆炸后约 9 亿年时的模样。当时宇宙还处于极其早期的阶段，按照现有理论，超大质量黑洞本应没有足够时间增长到如此惊人的质量。Nāpōwawāʻenakaulua 不仅是迄今发现的最古老、距离最遥远的类星体双星，两颗超大质量黑洞之间的距离也只有约 1.81 万光年，大约相当于银河系直径的五分之一。它们的质量分别约为太阳的 15 亿倍和 4 亿倍。这使得 Nāpōwawāʻenakaulua 成为宇宙黎明时期发现的距离最近的一对类星体。宇宙黎明是宇宙诞生最初阶段，第一批恒星、星系和黑洞开始出现的时期。研究团队负责人、美国国家科学基金会国家光学红外天文学研究实验室（NOIRLab）的西尔维娅 · 奥诺拉托（Silvia Onorato）在一份声明中表示：“目前还没有明确的理论能够解释，为什么宇宙诞生如此早期就已经存在一颗这样的巨型类星体，更不用说同时存在两颗了。”“我们观测到 Nāpōwawāʻenakaulua 时，宇宙的年龄还不到如今的十三分之一。令人惊讶的是，这两颗超大质量黑洞的质量竟然已经与今天观测到的黑洞相当。”宇宙黎明时期的超大质量黑洞，如何获得如此多物质？据IT之家了解，类星体是宇宙中最明亮的天体之一。当大型星系中心的超大质量黑洞被一团扁平、不断旋转的气体和尘埃云包围时，就可能形成类星体。这团物质被称为“吸积盘”，黑洞通过吸积盘不断吞噬物质。黑洞强大的引力会使吸积盘中的物质高速运动并产生摩擦，进而释放大量热量，使吸积盘发出极其明亮的光芒，其亮度甚至可能超过周围星系中所有恒星的总和。天文学家观测到的这种强烈光芒，就是类星体。在宇宙诞生至今约 138 亿年的漫长历史中，发现类星体并不算特别令人意外。不过，发现两颗距离如此接近的类星体仍然极为罕见。事实上，这类双星系统理论上应该并不少见。星系之间经常发生合并，两个星系中心的超大质量黑洞也会因此逐渐靠近。这一过程理应产生大量彼此距离小于典型星系尺寸的类星体双星。但天文学家在寻找它们时面临三大困难。首先，超大质量黑洞处于类星体活跃阶段的时间，在宇宙尺度上相对短暂。其次，即使两颗类星体距离比较近，只要它们位于极其遥远的宇宙深处，从地面观测也会显得十分暗淡，难以探测。最后，当两颗超大质量黑洞距离很近、同时又处于极远距离时，望远镜很难将它们分别分辨出来。尽管如此，天文学家仍然陆续发现了类星体双星。有时，这些双星出现的时间和距离甚至会让研究人员感到棘手，因为它们可能挑战现有的黑洞成长理论。问题在于宇宙诞生后不到 10 亿年的时期。根据当前模型，黑洞至少需要 10 亿年时间，通过不断吸积物质和相互合并，才能成长到太阳质量数百万倍乃至数十亿倍的规模。然而，自 2022 年开始投入运行以来，韦布望远镜已经多次发现由超大质量黑洞驱动的类星体，其中一些出现于宇宙大爆炸后仅约 4 亿年。如果说这些发现已经让现有理论面临挑战，那么 Nāpōwawāʻenakaulua 的出现可能会进一步冲击当前模型。这是天文学家在宇宙黎明时期发现的第三对类星体双星。研究团队是在韦布望远镜的 Aether 巡天项目数据中发现这对天体的。该项目旨在对早期宇宙中的天体进行系统普查。借助韦布望远镜搭载的近红外光谱仪（NIRSpec）积分视场单元，研究人员已经发现约 200 个类星体，数量略低于目前已知早期宇宙类星体总数的一半。研究人员在浏览 Aether 项目的数据时发现，编号为 J1602+4228A 的类星体并非孤立存在，它还有一颗伴星，编号为 J1602+4228B。从地面望远镜观测来看，要将这两颗类星体分别分辨出来几乎是不可能的。不过，双子座北望远镜最终成功完成了这一任务。关键在于观测时机恰到好处，同时夏威夷莫纳克亚山（Maunakea）上空的天气条件也十分理想。这座休眠火山正是望远镜的所在地。尽管 Nāpōwawāʻenakaulua 的形成机制目前仍是一个谜，但它可能帮助科学家更深入地理解宇宙黎明时期星系如何逐渐聚集、合并，以及早期宇宙结构如何形成。这是宇宙演化过程中的关键阶段。奥诺拉托表示：“Nāpōwawāʻenakaulua 是一个非常独特的环境。它为天文学家提供了一个天然实验室，让我们能够研究在宇宙早期，第一批大质量星系及其中心黑洞如何通过星系之间的直接相互作用逐渐组装起来。”研究团队已于 11 月 10 日将相关成果发表于《天体物理学杂志快报》（The Astrophysical Journal Letters）。参考资料：https://iopscience.iop.org/article/10.3847/2041-8213/aeb11f", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/027/457.htm", "publishedAt": "2026-11-15T14:37:13+00:00"}, {"title": "开源盘古模型 openPangu-2.1-Pro 上线华为云，围绕 Agent 开发、AI 编码、推理优化方向能力升级", "summary": "IT之家 11 月 15 日消息，华为云今日宣布，华为云 MaaS 模型即服务平台正式上线开源盘古模型 openPangu-2.1-Pro。该模型围绕 Agent 开发、AI 编码和推理优化三大方向进行能力升级，在深度研究、鸿蒙系统操控、鸿蒙 App 开发、昇腾算子生成及推理链路优化等场景实现增强。在 Agent 能力方面，openPangu-2.1-Pro 基于 10 万余条专项数据优化 Skills 触发、工具选择与调用能力，提升复杂任务规划和执行效果，在深度研究及鸿蒙系统操控等场景实现能力增强。在代码能力方面，新模型重点面向鸿蒙 App 开发和昇腾算子生成进行优化适配。围绕鸿蒙 ArkTS 语言及相关开发任务，持续提升代码生成的准确性和应用可用性；针对昇腾算子开发流程进行专项优化，增强专业代码生成能力，为开发者降低开发门槛、提升研发效率提供支持。openPangu-2.1-Pro 通过关键算子和推理链路优化，在典型部署场景下实现吞吐效率大幅提升，以更高的资源利用效率支撑高并发应用。同时，通过华为云 MaaS 提供的预置模型 API、调用限流、用量统计及性能监控能力，用户可以实现快速接入和运营。openPangu-2.1-Pro 还将接入华为云智果 AgentArts、码道 CodeArts、果办 OfficeAce 等核心产品，覆盖智能体开发，AI 编码和企业办公，加速模型能力向实际业务场景延伸。IT之家附价格如下：推理输入：0.8 元 / 百万 tokens推理输出：3.2 元 / 百万 tokens缓存命中输入：0.016 元 / 百万 tokens", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/027/450.htm", "publishedAt": "2026-11-15T13:16:54+00:00"}, {"title": "闭环 AI 自我进化：从 Skill、Harness 到模型训练与评估｜AICon北京", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/fZSEkDatL9xajG8PVi7G?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-15T10:00:00+00:00"}, {"title": "AI 自动写 PR，模型反而最简单：Inkitt 如何应对 Webhook 重复、CI 失败与合并冲突", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/YRXscVHsTh0g6CVCJJ0D?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-14T10:00:00+00:00"}, {"title": "谷歌推出 LiteRT Tensor API，用于构建、定制与优化端侧机器学习模型", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/joYjCTbwWFSkbACK5lje?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-13T09:17:00+00:00"}, {"title": "刚刚，Gemini 4 新模型叒来了，终于人人可用", "summary": "更快更便宜还更聪明#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1689267?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-11-12T23:11:11+00:00"}, {"title": "刚刚，豆包工作官宣接入 Kimi、DeepSeek，AI 模型自由来了", "summary": "国产大模型开始组团办公#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1689176?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-11-12T04:50:05+00:00"}, {"title": "苹果正在开发一个把 Mac 变成私有 AI 推理服务器的应用", "summary": "爆料人 Aaron Perris 在 11 月 10 日发现了苹果内部的一个新 Mac 应用，名字叫 Harbor。它的定位写在功能描述第一句：把你的 Mac 变成私有 AI 推理服务器。 这件事有意思的地方在于，苹果过去的 AI 叙事一直围绕着云和端侧的小模型转，Harbor 换了个思路——拿你自己买的 Mac 硬件跑开源权重模型，数据不出你的机器。 按...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503540/apple-new-mac-app-coming-to-make-running-local-ai-models-easy", "publishedAt": "2026-11-12T02:58:12+00:00"}, {"title": "Casvisor 开源： mony Intelligence），并升级鸿蒙智能体框架 HMAF，向开发者开放超过 20 项系统级 AI 能力。据 Counterpoint 数据，HarmonyOS 在 2025 年第三季度全球手机操作系统份额为 4%，位列全球第三；2026 年第一季度在中国市场份额达 19%，超过 iOS 的 17%。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/027/498.htm", "publishedAt": "2026-11-16T01:25:27+00:00"}, {"title": "消息称黄仁勋考虑重返英伟达担任 CEO，其硅谷盟友正施压董事会", "summary": "IT之家 11 月 16 日消息，据英国《金融时报》昨天报道，黄仁勋正考虑重返英伟达担任首席执行官。如今他在硅谷的多位盟友正向英伟达董事会施压，要求公司重新任命他。据多名知情人士透露，黄仁勋已经和亲信讨论了重返公司的可能性。与此同时，英伟达董事会还在开展独立调查。一位黄仁勋的盟友表示，他们正在组建一个由硅谷高管构成的“作战室”，游说黄仁勋重返英伟达，并计划争取白宫方面支持。该人士透露：“除了那些前沿 AI 实验室外，科技界所有大腕都爱戴黄仁勋。”；他还补充称，这些行动得到了黄仁勋本人的支持。周末以来，一场要求黄仁勋重新担任英伟达 CEO 的公开行动逐渐升温。特斯拉和 SpaceX CEO 埃隆 · 马斯克（Elon Musk）、Epic Games CEO 蒂姆 · 斯威尼（IT之家注：Tim Sweeney）等高管均公开支持一封联名信，要求英伟达董事会让黄仁勋回来。黄仁勋在英伟达员工中声誉显赫。辞职后的几天里，多名员工公开呼吁他回归。不过问题在于，这场复职行动可能遭到华盛顿政策制定者反对。美国财政部长斯科特 · 贝森特周日表示，黄仁勋离职后，英伟达需要进行一次彻底的领导层改组。与其他创始人、CEO 不同，黄仁勋并没有英伟达的控股股份，因此无法推翻董事会任何决定。即便是支持黄仁勋回归的盟友，也不确定应该如何修复他的声誉。一名参与黄仁勋复职行动的人士承认：“与下属发生婚外情是足以被解雇的行为。”英伟达股东、Altimeter Capital 创始人布拉德 · 格斯特纳和 Atreides Management 首席投资官加文 · 贝克周五向董事会发布公开信，敦促英伟达保留所有可能的选择，包括让黄仁勋回归。他们认为，黄仁勋长期领导英伟达取得了非凡成就，董事会应该给他一次机会。英伟达发言人和黄仁勋的发言人均拒绝置评。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/027/470.htm", "publishedAt": "2026-11-15T23:26:25+00:00"}, {"title": "从提效到扩能：AI 驱动小团队的能力突破与组织演进｜AICon北京", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/eTz8pt2LoALMvzvxj4aa?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-14T10:00:00+00:00"}, {"title": "「史上最严」湿实验预测基准发布！推理拉满、算力翻5倍也白搭", "summary": "斯坦福、哈佛、康奈尔……十余家顶尖团队齐坐一桌了", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/510232.html", "publishedAt": "2026-11-14T09:58:22+00:00"}, {"title": "中国AI突破复杂肺癌诊疗！中美医疗圈集体坐不住了", "summary": "250名国内顶尖三甲医院医生联合评测", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/509796.html", "publishedAt": "2026-11-13T07:43:03+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "Anthropic CEO 阿莫迪：算力是最深层的商业难题", "summary": "IT之家 11 月 16 日消息，Anthropic 联合创始人兼 CEO 达里 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
