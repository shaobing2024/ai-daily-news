const DATA = {"date": "2026-10-03", "generatedAt": "2026-10-03T01:41:35Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "OpenAI 披露：澳大利亚又一政府机构遭失控智能体入侵", "summary": "IT之家 10 月 3 日消息，据澳大利亚广播公司当地时间 10 月 2 日报道，澳大利亚新南威尔士州政府网站遭到了失控的 OpenAI 智能体侵入。当地政府与 OpenAI 双方均证实，在此次发生于今年 6 月的事件中，并没有任何公众信息被读取。不过，官方直到本周才收到正式通报。OpenAI 发言人在声明中称：“在察觉到这一异常活动后…… 我们立即组织了紧急的内部技术与法律审查，旨在结合当时正在推进的具体研究项目，彻查该行为的根本性质。”审查一经结束，我们便向新南威尔士州州长办公室进行了情况汇报，并通报了澳大利亚信号局。新南威尔士州州长和内阁部表示，该模型侵入的是国家公园和野生动物服务局的一个网页端应用程序，其中包含历史档案及火情监测数据。IT之家注意到，在此之前，OpenAI 刚因非法渗入澳大利亚国民医疗保险门户网站一事公开致歉，并声称希望借此“重构与澳大利亚公众之间的信任”。相关阅读：《已证实首例：澳大利亚政府网站遭 OpenAI 智能体入侵》《OpenAI 智能体入侵澳大利亚政府网站，澳总理阿尔巴尼斯呼吁加强 AI 监管》《医保系统遭 AI 智能体入侵，澳大利亚传唤 OpenAI 与 Anthropic CEO 接受质询》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/390.htm", "publishedAt": "2026-10-03T00:57:10+00:00"}, {"title": "微软 CEO 纳德拉重申 Copilot AI 定位：面向工作的新操作系统", "summary": "IT之家 10 月 3 日消息，科技媒体 Windows Latest 今天（10 月 3 日）发布博文，报道称微软首席执行官萨蒂亚 · 纳德拉（Satya Nadella）再次将 Copilot 称为“面向工作的新操作系统”，而该应用实质上是 Windows 11 上的一款部分基于 Chromium 内核的网页应用。IT之家曾于 9 月 26 日报道，在微软发布 Copilot“超级应用”后，公司首席执行官纳德拉表示：“正在将 Copilot 打造成一个全新的工作操作系统”。而 10 月 1 日微软官方博文中，在宣布 LinkedIn CEO 瑞安 · 罗斯兰斯基（Ryan Roslansky）将于 2026 年底离职动态时，纳德拉再次将 Copilot 描述为“面向工作的新操作系统”。纳德拉再次强调：“我们正在将 Copilot 打造成一款全新的工作操作系统，它适用于所有模型、所有工作场景和所有任务。”该媒体通过技术拆解，指出 Copilot 桌面应用的主程序 copilotapp.exe 仅 4.99MB，实际为重新命名的 Microsoft Edge 启动器。IT之家附上相关截图如下：其安装目录包含完整的 Edge 154 构建，体积约 520MB，含 349.6MB 的 msedge.dll 浏览器核心及 Chromium 资源包、V8、ICU、FFmpeg 等组件。运行时，Copilot 加载 copilot.microsoft.com（个人账户）或 m365.cloud.microsoft/ chat（工作账户），背后运行 Chromium 渲染器、GPU 及实用程序进程。Copilot 另含一个名为 copilotapphost.exe 的 WinUI 3 宿主程序，基于 .NET 10 与 NativeAOT 编译。该组件处理“Hey Copilot”语音唤醒、语音编辑器、视觉授权、屏幕共享及浮动编辑器叠加层等 Windows 系统级功能。主界面仍由 Chromium 渲染，WinUI 宿主仅在需要麦克风或屏幕捕获时唤醒，空闲时退出。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/386.htm", "publishedAt": "2026-10-03T00:10:19+00:00"}, {"title": "OpenAI 内部动荡加剧之际，又一名安全负责人戴维 · 罗宾逊离职", "summary": "IT之家 10 月 3 日消息，据《商业内幕》报道，当地时间 2 日，OpenAI 一名发言人证实，OpenAI 安全系统团队负责人之一戴维 · 罗宾逊已离职。罗宾逊于上周离开公司，OpenAI 安全团队再度出现人事变动。罗宾逊此前还负责过公司的政策规划工作，主要涉及“安全透明度”，包括参与编写和发布系统卡，向外界介绍公司模型的信息。罗宾逊离职之际，OpenAI 的安全措施和安全团队人员配置受到外界密切关注。据IT之家此前报道，当地时间 1 日，OpenAI 披露，公司已与三名研究人员终止合作，理由是违反了有关敏感信息共享的公司政策。9 月初，他曾在 X 上写道，自己感觉到，OpenAI 内部人士开始意识到能力强大的 AI 模型会带来何种影响，同时也流露出疑虑。“OpenAI 的情况确实每天都在发生重大变化，但我不知道我们的改变是否足够快。”备受关注的 Hugging Face 安全入侵事件发生后，OpenAI 还接连面对其他安全事件。按照公司的说法，其 AI 模型在这些事件中出现了异常行为。随着模型能力不断增强，研究人员和企业高管开始呼吁放慢 AI 开发速度。当地时间 9 月 29 日，OpenAI CEO 奥尔特曼在公司开发者大会上称，安全和对齐工作必须走在模型能力提升的前面。OpenAI 安全负责人约翰内斯 · 海德克也在今年早些时候离职。相关阅读：《因违反敏感信息访问和共享规定，OpenAI 与三名研究人员终止合作》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/385.htm", "publishedAt": "2026-10-03T00:08:55+00:00"}, {"title": "焕新极氪 007GT 色彩上新：推出“河谷绿”车色、“墨绿”内饰", "summary": "IT之家 10 月 2 日消息，极氪汽车今日宣布，焕新极氪 007GT 色彩上新，带来全新外饰色河谷绿、全新内饰色墨绿。2026 年 10 月 1 日-10 月 31 日，下定焕新极氪 007GT 可享更多限时权益。IT之家注意到，焕新极氪 007/007GT 于今年 4 月正式上市，定价 20.39 万元起，限时 19.39 万元起。系列车型标配 19 英寸轮毂，其中焕新极氪 007 前脸新增动感通风口造型，并提供碳纤维套件选装服务，强化运动属性。两款车型搭载算力更强的 NVIDIA DRIVE Thor-U 智驾芯片，智能化水平显著提升。规格方面，焕新极氪 007 长宽高为 4858（4880）x 1900 x 1450mm，轴距 2925mm。而 007GT 车身尺寸微调至 4858（4880） x 1900 x 1460（1445）mm，轴距维持 2925mm。两款新车均基于 900V 高压架构打造，提供单电机与双电机两种动力配置。单电机版最大功率 370kW，双电机版前后电机分别输出 215kW 与 370kW。车辆匹配麒麟电池，最高续航达 905 公里，百公里加速最快仅需 2.73 秒。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/364.htm", "publishedAt": "2026-10-02T13:43:44+00:00"}, {"title": "Meta 旗下 AI 智能体 Muse 将登陆智能眼镜平台，可代用户完成各种任务", "summary": "IT之家 10 月 2 日消息，Meta 宣布旗下 AI 智能体 Muse 将于近期登陆智能眼镜，用户无需拿出手机，只需通过语音下达指令，Muse 就能在后台代用户完成一系列任务。Meta 表示，Muse 基于 Muse Spark AI 模型运行，其核心运行环境是一台部署在云端的私有持久化 Linux 虚拟机，配备独立的网页浏览器、文件系统和终端。即使用户关闭应用，这些组件仍会持续运行。为了完成用户交代的任务，Muse 可以自行决定编写并运行代码，也可以将工作分配给多个子智能体，还能创建定时任务。此外，Muse 还能够生成文档、PDF、网站以及消费记录追踪器、数据仪表盘等交互式工具。与主要面向开发者和专业用户的其他 AI 智能体相比，Muse 的定位更加偏向普通消费者。其界面采用类似即时通讯的简化设计，并配有拟人化头像，同时重点宣传日常生活中的实际使用场景。Meta 称，Muse 可以帮助用户预订旅行、发送电子邮件、填写表格以及通过网站购买商品，还能完成更加复杂的任务，例如与服务商协商账单、协助出售汽车，甚至可以代用户拨打电话。在支付环节，Muse 接入 Stripe 旗下 Link 服务，通过虚拟的一次性支付卡完成交易，因此 AI 本身不会接触用户的银行卡或信用卡信息。针对智能眼镜场景，Meta 列举了更多使用场景，包括代用户预约服务、查询机票价格、寻找替换零部件、记录饮食、提供健身指导、帮助购买用户眼前看到的商品。用户只需说出“Hey Muse”或预先设置的 Muse 名称，然后提出具体要求，Muse 便会在后台执行任务，并在完成后向用户反馈结果。在隐私方面，Meta 声称公司不会将 Muse 数据用于广告业务，但除非用户主动选择退出，否则相关数据将用于训练未来的 AI 模型。目前 Muse 使用的云端 Linux 虚拟机与其他环境相互隔离，但 Meta 自身仍然具备访问权限。Meta 计划在今年晚些时候推出 Confidential VM（机密虚拟机）选项，在这一模式下，甚至 Meta 自身也无法访问对应运行环境，以确保相应智能体拥有更加强大的隐私性。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/363.htm", "publishedAt": "2026-10-02T13:38:14+00:00"}, {"title": "桌面 AI 超算新选择：英伟达 NVIDIA DGX Spark 64GB 内存版正式发布，4999 美元", "summary": "IT之家 10 月 2 日消息，英伟达今天正式对外披露 DGX Spark 产品更新，推出 64GB 内存版本 DGX Spark 桌面 AI 计算机，起售价 4,999 美元（现汇率约合 33,566 元人民币），将于 10 月 23 日正式发售，宏碁、戴尔、华硕、技嘉、微星、H3C 等众多 OEM 厂商均会推出基于该平台的整机产品。官方此前推出的 128GB 版本同步更新定价，128GB FE 版本售价 6,950 美元（IT之家注：现汇率约合 46,666 元人民币）。硬件层面，DGX Spark 基于 GB10 Grace‑Blackwell 超算芯片，依靠统一内存架构打通 CPU 与 GPU 内存空间，本次新增 64GB 内存版本，整机总内存 64GB，系统预留约 8GB 内存，可供模型权重与 KV 缓存使用的内存空间约 56GB，支持 NVFP4 量化格式，能够流畅部署 Gemma4 26B、Qwen3.8‑27B、Meta Muse Glimmer、Nemotron3.5 Lightning 等主流开源大模型，模型加载完成后还留有充足内存余量用于 KV 缓存，支撑长上下文推理任务。该设备最大的亮点之一是原生具备多机集群扩展能力，内置 ConnectX‑7 高速网卡，搭配全新 NVIDIA Sync 工具套件，普通开发者无需深厚网络运维知识，就可以搭建多节点集群。套件内置 Cluster Assistant 集群助手，自动完成网络配置、设备校验、SSH 环境部署，最多支持 4 台 DGX Spark 组网。官方实测两台 64GB DGX Spark 组成集群运行 Qwen3.8‑27B 模型，相比单台设备性能最高提升 1.7 倍，显著提高推理吞吐量。开发者还可以从普通 PC 远程接入 DGX Spark 集群，对接 VS Code、Cursor 等主流 IDE，远程监控整机状态，一键启动 vLLM 推理容器，大幅降低分布式 AI 开发门槛。软件生态是 DGX Spark 的核心竞争力，整机完整搭载 NVIDIA CUDA 加速 AI 软件栈，深度适配 vLLM、llama.cpp 推理框架，针对本地智能体工作流做专项优化，运行本地智能体推理最高可实现 1.9 倍速度提升。Perplexity 已经完成适配，推出针对 DGX Spark 优化的便携式计算机智能体，Laguna S2.1 118B 大模型能够在硬件上完成本地部署运行。同时，Nemotron 系列模型、Gemma、Qwen、DeepSeek、Mistral、Stability.ai 等主流开源社区模型、框架都完成适配，开箱即可运行前沿模型，硬件厂商与开源社区形成完整开发者生态矩阵。性能测试显示，部署在 DGX Spark 上的 Qwen3.8 27B 模型，评测得分距离前沿闭源模型仅有 10 分差距，证明桌面硬件已经具备运行高质量模型的能力。统一内存架构也得到行业开发者认可，Perplexity 创始人 Aravind Srinivas 评价，DGX Spark 可以近乎打满 GPU 与内存负载，散热表现稳定，统一内存设计能够最大化每瓦功耗下的 Token 产出效率，适合 7×24 小时不间断运行本地智能体任务。当然这套平台依旧面向专业开发者，4,999 美元（现汇率约合 33,566 元人民币）起的定价，决定其目标群体为 AI 研究人员、独立开发者、小型 AI 创业团队，并非面向普通消费用户。随着 64GB 版本的推出，相比 128GB 版本降低采购门槛，让更多团队可以体验本地集群能力。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/359.htm", "publishedAt": "2026-10-02T13:00:00+00:00"}, {"title": "创维 F3 Pro 闺蜜机新增 12GB RAM + 256GB 存储空间版本，6099 元", "summary": "IT之家 10 月 2 日消息，创维现已为旗下 F3 Pro 闺蜜机新增一款 12GB RAM + 256GB 存储空间版本，定价为 6099 元，部分地区国补后低至 4999 元。该产品采用云雾白配色，配备一块 32 英寸 3840x2160 分辨率 IPS LCD 面板，搭载 13Mp 摄像头，匹配全景环绕扬声器。支持 AI 健身私教、电子白板、AI 健康智能体等功能。该产品内置 15000mAh 电池，至高提供 12 小时续航，支架支持升降 / 倾斜 / 旋转，内置基于安卓的酷开 AIOS 2.0 系统，提供了 1 个 HDMI 2.1、1 个 USB-A 3.0、1 个 USB-C 3.0 接口。IT之家附产品参数：京东创维闺蜜机 F3Pro12G + 256GB 版本 4999 元直达链接", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/346.htm", "publishedAt": "2026-10-02T11:57:14+00:00"}, {"title": "Anthropic 招股书警告：美国政府的态度会影响公司与客户的关系，甚至波及人类文明", "summary": "IT之家 10 月 2 日消息，路透社今天（2 日）公布的 Anthropic IPO 招股书中提出了一条警告：美国政府对公司及其技术的态度不仅会影响政府业务，还可能波及商业客户和合作伙伴。企业在招股文件中提示政策变化可能影响经营并不罕见，承接政府合同的企业尤其如此。SpaceX 就在 IPO 文件中称，与美国政府机构保持良好关系对公司至关重要，一旦关系恶化，维持现有业务和争取新业务的能力都可能受到严重影响。Anthropic 提示的风险则不止于政府业务。招股书指出，美国政府如何看待 Anthropic 及其行为，可能进一步影响客户、合作伙伴和其他商业关系，甚至波及人类文明。文件警告，先进 AI 可能给人类带来灾难性甚至生存性风险。Anthropic 正紧锣密鼓地筹备 IPO，凭借从 AI 技术中获利的前景，公司估值有望达到 2 万亿美元（IT之家注：现汇率约合 13.43 万亿元人民币）。报道认为，由这样一家公司作出上述风险警告并不寻常。Anthropic 称，来自政府机构合同的收入占全年收入不到 1%。招股书还列举了过去一年与美国政府的数次交涉，用来说明政府行动可能给公司业务带来的风险。今年 2 月，白宫下令联邦机构停用 Anthropic 的模型，美国国防部随后将 Anthropic 列为“对国家安全构成供应链风险的企业”。Anthropic 坦言，这些事件恐导致公司收入大幅损失或业务中断。今年 6 月，美国商务部又对 Fable 5 和 Mythos 5 实施全球出口限制。Anthropic 为遵守规定，停止向所有客户提供这两款模型。最终，美国商务部取消了这一限制，模型也得以恢复提供。Anthropic 警告，类似情况今后仍可能发生。无论最终结果如何，此类措施都会有可能严重损害公司声誉，包括引发负面媒体报道、公众审视，以及现有和潜在客户、合作伙伴、员工和投资者的负面评价。同时，与美国政府机构开展业务本身也存在额外风险，其中就包括政府对公司或其技术的看法发生变化。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/343.htm", "publishedAt": "2026-10-02T11:15:51+00:00"}, {"title": "腾讯 WorkBuddy 内置模型独家支持 Space Bunny", "summary": "IT之家 10 月 2 日消息，腾讯 WorkBuddy 今日宣布 "title": "继 AMD 后，高通、英特尔、英伟达硬件本月将全面支持微软高级着色器交付", "summary": "IT之家 10 月 3 日消息，Microsoft（微软）当地时间 1 日通过 DirectX 开发者博客宣布，高级着色器交付 (ASD) 将在本月扩展到高通、英特尔、英伟达硬件上。由于 AMD 的 \"RDNA\" 家族已率先支持 ASD，这意味着该特性即将实现对四大 GPU 制造商平台的全覆盖。更多用户将可享受到直接下载云端预编译着色器带来的好处：缩短加载时间、消除着色器卡顿。高通已通过今年 9 月 22 日上线的 2026.08.3 显卡驱动为骁龙 X2 的核显提供了 ASD 支持。英特尔、英伟达的支持将在本月晚些时候到来，兼容的英特尔设备包括 Arc B570 / B580 独立显卡、第 2~3 代酷睿 Ultra 处理器核显，英伟达方面则是所有 RTX GPU 以及 RTX Spark 系统。IT之家了解到，首款支持多 GPU 供应商 ASD 的游戏为《战争机器：事变日》(Gears of War: E-Day)。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/373.htm", "publishedAt": "2026-10-02T16:16:55+00:00"}, {"title": "湖北智能家居国补范围扩大，机器人、数码相机、无人机、血压仪等可补贴 15%", "summary": "IT之家 10 月 2 日消息，为贯彻落实《商务部等 8 部门关于加快“人工智能 + 消费”发展的实施意见》有关要求，进一步释放湖北省智能终端产品消费潜力，推动人工智能与消费深度融合，提升居民居家生活品质，湖北省对 2026 年消费品以旧换新新增品类补贴政策作出优化调整，新规自 2026 年 10 月 1 日起正式实施。IT之家附智能家居补贴品类如下：智能清洁设备：含智能扫洗地机、智能擦窗机器人、智能清洁机器人智能服务机器人：含智能具身机器人、智能炒菜机器人、外骨骼机器人、陪伴类机器人 / 机器狗等智能耳机：含翻译耳机智能门锁：含智能猫眼智能厨电：含智能洗碗机、智能消毒柜、智能烤箱、智能电饭煲、智能微波炉、智能空气炸锅、智能料理机、智能咖啡机、智能破壁机、智能净水器、智能饮水机等智能吸油烟机：含智能燃气灶 / 集成灶智能马桶：含智能马桶盖数码相机：含运动相机、无人机等适老化产品：含血压仪、血糖仪等智能家具：含智能按摩椅、智能沙发、智能床、智能床垫对个人消费者在参与商家购买补贴范围内产品，按产品扣除各环节优惠后最终销售价格的 15% 给予补贴，每位消费者每类产品可补贴 1 件，每件补贴不超过 1500 元。此外，数码和智能产品、家电依旧参与国补。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/349.htm", "publishedAt": "2026-10-02T12:22:17+00:00"}, {"title": "别再给 Agent 一个“毛坯房”了：构建 Agent 拎包入住的开发环境实践｜QCon上海", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/DEyrayxufObhpoeZgOKT?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-02T10:00:00+00:00"}, {"title": "生成即合规：Agentic AIGC 驱动的广告素材修复实践｜QCon上海", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/TLjNcyBg9Z72HV5kJ2kp?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-01T10:00:00+00:00"}, {"title": "突发！苹果全新产品线曝光，Siri AI 进家门", "summary": "致敬 2002，面向 2030#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/168275 同寻常的聚会”，并称与会者是“正在建设美国黄金时代”的人。他随后签署行政令，要求美国政府各部门和机构改用“SI”和“超级智能”，不再沿用“AI”这一称呼。行政令规定，官方公文、网站、报告及其他沟通材料都将用 SI 取代 AI。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/389.htm", "publishedAt": "2026-10-03T00:32:30+00:00"}, {"title": "Andrew Kelley 专访：他为何创建 Zig、禁止 AI 贡献以及将 Zig 从 GitHub 移出", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/eRbEA3dMd58RNPqp5D8S?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-02T13:00:00+00:00"}, {"title": "GitLab Duo 通过微软 Foundry 扩展自托管 AI 选项", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/cA9rSEGKphbJHIiTQKMv?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-30T20:37:48+00:00"}, {"title": "机房堆满算力卡，业务却还在排队？这份评估报告拆开了“算力荒假象”的破局账本", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/bduvBdbgwxj6DMbNeKCC?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-30T17:37:10+00:00"}, {"title": "直播回顾：工业AI的下一个机会在哪？", "summary": "什么样的AI才适合工业现场？企业真正开始做工业AI时，又该从哪里下手？", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/499605.html", "publishedAt": "2026-09-30T12:11:24+00:00"}, {"title": "Anthropic，你是来给智谱打广告的吧！", "summary": "实测说GLM-5.3很强", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/499597.html", "publishedAt": "2026-09-30T10:04:12+00:00"}, {"title": "OpenAI 年度发布会最全总结：25 个新品很夯，但额度减半拉完了", "summary": "省流：个人用户亏麻了#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1682571?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-09-30T00:20:06+00:00"}, {"title": "可灵4.0首发实测，国产AI视频再次掀桌？", "summary": "能文能武#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1682361?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-09-29T03:24:11+00:00"}]}, {"label": "论文研究", "items": [{"title": "下载体验了 Muse 后，我清仓了 Airbnb，加仓了 Meta", "summary": "IT之家 10 月 3 日消息，9 月 29 日作客财经播客《The Synopsis》时，资深独立股票分析师 Mostly Borrowed Ideas（下文简称 MBI）表示：在下载体验了 Muse 后，我清仓了 Airbnb，加仓了 Meta。IT之家注：MBI 是独立分析师 Abdullah Al Rezwan 的笔名，他运营投资研究网站和 Substack 专栏 MBI Deep Dives，以跨行业的上市公司深度研究、投资日志和公开持仓讨论而知名。在近期的访谈节目中，MBI 深入讨论 Meta 的 Muse AI 智能体，表示其测试 Muse 约 10 天后，认为 AI 智能体可能绕过 Airbnb 等平台直接完成预订，因此清仓了重仓的 Airbnb，并加仓 Meta。在本次访谈节目中，MBI 指出在体验使用 Muse 过程中，发现该 AI 智能体会像真人一样打开 Airbnb 网站、输入目的地和人数、翻搜索结果，再给出推荐。在操作方面，Muse 还支持自动比价以及绕过平台，MBI 让 Muse 找到一个农舍体验后，Muse 发现直接向房东预订比通过 Airbnb 便宜约 60%，并已绑定支付方式，只待用户一次确认即可完成。MBI 认为 AI 智能体可能削弱 OTA、外卖、电商平台对“流量入口”和“交易撮合”的控制。Muse 可以读取用户过去的 Airbnb 体验和评价，并结合其 Instagram 上收藏、观看过的旅行 Reels，推荐离家两小时车程内的体验。而对于 Airbnb 等单一平台而言，难以为用户提供这类“生活语境数据”，而 Muse 可以串联跨平台、跨数据，真正基于用户数据和偏好提供个性化推荐。MBI 在播客节目中，提出了“主动式电商”（Proactive Commerce）概念。传统购物分为“有明确意图的搜索购买”和“刷信息流时的发现式购买”。而 AI 智能体则可能主动提醒用户更便宜、更合适的替代品，甚至代为下单。例如 Muse 曾主动告诉一位用户，其正在使用的软件有功能相近但便宜得多的替代方案。此外用户不必每次重复说明偏好，只需告诉 Muse 一次：例如“优先质量，其次价格，再考虑配送速度”。此后 AI 在购物、订房、订餐时都会按这套偏好执行，这会显著降低决策摩擦。不过在播客节目中，MBI 也指出 Muse 现阶段并不完美：浏览器式操作很慢，例如仅对 5 家酒店比价就花了 14 分钟；早期结果也可能只有文字、缺少图片、评价和地图。因此，当前更像是“未来模式的雏形”，但嘉宾认为它可能是最差的版本，之后只会持续改进。因此他认为 AI 正从“回答问题的聊天工具”变成能替用户浏览、比较、推荐并完成交易的个人智能体（agent），因此可能重塑电商、旅行、外卖等平台的商业模式。MBI 昨日（10 月 2 日）在其 MBI Deep Dives 专栏中，发表《为何 Muse 可能永远不需要广告》的深度观点文章，认为 Muse 等 AI 智能体已开始冲击平台经济。MBI 认为 Meta 的 AI 助手 Muse 可能不需要在产品内部直接投放广告，也能为公司创造广告价值。作者认为，Muse 的使用行为和浏览活动可能会为 Meta 的广告系统、尤其是其广告优化和用户画像能力提供增量数据，从而间接提升 Facebook 和 Instagram 的广告收入。Muse 与用户的对话、搜索和浏览行为，可以帮助 Meta 更了解用户的兴趣与购买意图，并改善其他平台上的广告定向。即使 Muse 界面本身没有广告，它也可能通过增强 Meta 整体广告系统的效果来“赚钱”。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/375.htm", "publishedAt": "2026-10-02T23:03:19+00:00"}, {"title": "OpenAI推理之父最新访谈！数学只是多智能体时代的开胃菜", "summary": "千禧年难题的突破，10000个Agent最多占了10%的功劳。", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/499654.html", "publishedAt": "2026-09-30T14:03:43+00:00"}, {"title": "Claude Sonnet 5.5 发布：速度快 3 成、Agent 编程评测从 10% 跳到 70%", "summary": "Claude 5.5 家族的第二个成员今天发布：Sonnet 5.5。Anthropic 把它定位成 Opus 5.5 的「快而省」互补款——专攻范围明确的高频日常任务、修 bug、做文档和表格，还强调它有敏锐的设计眼光。官方口径一句话：比 Sonnet 5 清晰升级，速度快 30% 以上，多数任务成本低 30%。 性能数据的跳跃有点夸张。Sonnet 5.5 在 agenti...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502794/claude-sonnet-5-5", "publishedAt": "2026-09-29T04:14:33+00:00"}, {"title": "AMD 花 82 亿美元买下李飞飞的 World Labs，她直接空降成首席科学家", "summary": "AMD 用 82 亿美元换了一张通往「真实世界 AI」的门票。周一官方宣布收购 World Labs——这位由李飞飞 2024 年创立的旧金山 AI 实验室，曾经投资过它的 AMD 这次全资以股票形式买下，交易预计今年年底前完成，待监管审批。李飞飞将以执行副总裁兼首席科学家的身份加入 AMD。 这笔交易是 AMD 史上第二大收购，仅次于 2022...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502790/amd-will-acquire-fei-fei-lis-world-labs-for-8-2-billion", "publishedAt": "2026-09-29T03:12:51+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "因内存等成本暴涨，英伟达标准版 Shield TV 停产、Pro 版涨价 50%", "summary": "IT之家 10 月 3 日消息，科技媒体 Wccftech 昨日（10 月 2 日）发布博文，报道称由于内存等相关组件成本上涨，英伟达宣布停止生产标准版 Shield TV，并将 Shield TV Pro 售价上调 100 美元至 299.99 美元（IT之家注：现汇率约合 671.4 元至 2,014 元人民币），增涨 50%。英伟达官方声明称，包括 DRAM 在内的组件成本在整个行业范围内大幅上涨，因此不得不调整售价。此次调价自 10 月 2 日起生效，适用于全球市场。此次调整标志着 Shield TV 产品线自 2015 年发布以来首次取消入门型号，而 Pro 版规格保持不变，仍采用 Tegra X1 SoC，集成 256 核 GPU，配备 3GB 内存与最高 16GB 存储空间。设备支持 4K HDR 输出，兼容 Dolby Vision HDR 与 HDR10 标准，并搭载 AI 增强型超分技术，可将内容增强至 4K 60 FPS。英伟达指出，DRAM 等内存组件成本上涨并非个案，而是整个 PC 与消费电子行业的普遍现象。摩根士丹利近期报告亦警示，DDR4 价格预计在第三季度上涨 50%，因内存厂商将产能优先分配给 HBM（高带宽内存），导致传统 DRAM 供应紧张。尽管硬件未更新，英伟达仍持续扩充 GeForce Now 游戏库，新增多款 AAA 大作与独立游戏。Shield TV Pro 在游戏串流与媒体播放领域仍具较高用户黏性，尤其在 4K HDR 与 AI 超分功能上保持竞争力。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/396.htm", "publishedAt": "2026-10-03T01:24:47+00:00"}, {"title": "Anthropic 拟斥资 1 亿美元培训万名工程师，破解企业 AI 落地“人才荒”", "summary": "IT之家 10 月 3 日消息，Anthropic 计划投入 1 亿美元（IT之家注：现汇率约合 6.71 亿元人民币）培训 1 万名工程师，帮助企业把 AI 项目从构想真正推进到业务应用。当地时间 2 日，Anthropic 宣布推出 Claude Frontier Academy（Claude 前沿学院）培训项目，瞄准企业 AI 落地过程中一个主要瓶颈：真正懂得如何把 AI 开发出来，并将其部署到企业实际业务中的人才仍然不足。首批参加培训的工程师来自埃森哲、贝恩、凯捷、德勤、麦肯锡、摩根士丹利、诺和诺德和澳大利亚联邦银行。Anthropic 的目标是在 2027 年底前培养 1 万名前沿部署工程师。按照安排，工程师首先会参加为期数天的线下培训，由 Anthropic 工程师和讲师 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
