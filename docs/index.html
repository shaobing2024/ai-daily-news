++ 编写的开源 AI 推理项目，核心作用是让大语言模型在个人电脑、服务器等不同硬件上运行。它既可以用于本地部署，也可以用于云端服务，目标是降低部署复杂度，并充分利用设备的计算能力。本次更新最大的亮点就是明确接口兼容性规则：项目库定位llama.cpplibllamaC/C++ 大模型推理库ggmllibggml底层机器学习张量库两者今后都会通过主版本号升级，明确标记 API 或 ABI 不兼容的变化，让依赖这些库的应用能够识别升级边界。对于开发者而言，可以从版本号上，更容易判断某次升级是否可能要求自己的应用同步修改。官方给出的版本规则是：版本位什么情况下更新MAJOR，例如 1.x.x → 2.0.0./include 中公共 C API 出现破坏性变更；公告同时明确，API / ABI 不兼容会通过主版本升级体现MINOR，例如 1.0.x → 1.1.0向后兼容的功能、后端更新、模型支持或 API 新增PATCH，例如 1.0.0 → 1.0.1不改变 API 的 bug 修复在工程质量方面，官方公告称为了支撑持续加快的开发节奏，团队强调了三项投入：使用 Hugging Face 的 HF Buckets、HF Jobs 扩展 CI 基础设施。在 NVIDIA、AMD、Qualcomm、Arm、IBM、Intel 的硬件支持下，持续增加覆盖主要硬件平台的自托管测试运行器。在开发流程中审慎使用 LLM，同时继续把代码质量、架构控制和对实现细节的理解放在首位。在后端与模型支持方面，ggml 通过专用后端支持不同硬件；每个后端都可以编译为动态库，并按需在运行时加载。llama.cpp 已支持超过 150 种模型架构变体及主流推测解码方法。团队还将继续加强自动化测试基础设施，并借助英伟达、AMD、高通、Arm、IBM 和英特尔提供的硬件支持，扩大跨平台测试覆盖。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/027/019.htm", "publishedAt": "2026-11-14T00:14:06+00:00"}, {"title": "马克龙宣布 12 月 2 日在法国巴黎召开科技企业会议，推动欧洲科技自主", "summary": "IT之家 11 月 14 日消息，据央视新闻今日报道，法国总统埃马纽埃尔 · 马克龙宣布将于 12 月 2 日与荷兰首相罗布 · 耶滕（Rob Jetten）共同在巴黎召集科技企业负责人举行会议，推动欧洲政府与科技行业加强合作，提升欧洲科技自主能力。据英国《卫报》报道，马克龙是在爱尔兰首都都柏林出席欧盟领导人非正式会议后作出上述表态的。他还在 X 上发文并强调“我们的独立自主不能外包，必须在欧洲本土建立起来”。此次欧盟领导人非正式会议的重要议题之一是人工智能。欧盟领导人与法国人工智能企业 Mistral AI 首席执行官阿瑟 · 门施（Arthur Mensch）等人士讨论了欧洲人工智能产业的发展，以及如何提升欧洲在全球人工智能领域的竞争力。马克龙为欧洲 AI 企业开出的条件清单相当具体：训练模型所需的算力、支持成长的资本，以及部署模型所需的客户。马克龙表示，欧洲具备参与人工智能竞争所需的人才、能源和技术基础，接下来需要加大投资、加快决策，尤其要加强欧洲各国之间的协同行动。他说：“如果我们希望企业在这里成长，就应当让它们在这里获得首批大额合同。”在马克龙看来，欧洲并不缺参与竞争的基础条件 —— 人才、能源和技术都已具备，缺的是投资规模与决策速度，“必须加大投资、加快决策，尤其是共同行动”。另外，欧盟委员会主席冯德莱恩在会上表示，欧洲推进更广泛的技术主权目标至少需要 5,000 亿欧元（IT之家注：现汇率约合 3.7 万亿元人民币）投资，她计划在下次会议上提出融资方案。冯德莱恩同时透露，欧盟计划建设 7 座 AI 超级工厂，预计调动约 300 亿欧元用于发展支撑 AI 模型的算力基础设施。马克龙还特别强调，欧洲企业即使开发出具有竞争力的人工智能模型，也必须能够在欧洲获得训练模型所需的算力、支持企业发展的资本，以及部署模型所需的客户。他表示，如果欧洲希望本土科技企业成长，就应该让这些企业能够在欧洲市场获得首批大额合同。马克龙与耶滕的联手并非临时起意。法国与荷兰此前已在半导体、人工智能和量子技术领域表达了深化合作的意向，ASML 与法国 AI 公司 Mistral AI 之间的投资关系也被双方视为法荷科技合作的支点之一。Mistral AI 联合创始人兼 CEO Arthur Mensch 当天在都柏林向欧盟领导人作了发言，巴黎正是 Mistral 的总部所在地。欧盟理事会公布的会议总结显示，欧盟领导人当天重点讨论了如何扩大公共和私人投资、完善人工智能基础设施、增强欧洲人工智能能力，以及减少对外部技术供应商的关键依赖。会议还讨论了清洁能源供应、人工智能在欧洲企业和公共部门的应用，以及人工智能对就业、社会安全和基本权利的影响。此次巴黎会议将进一步推动欧洲政府与科技企业之间的合作。马克龙希望通过投资、算力基础设施、资本支持和政府采购等方式，为欧洲人工智能企业提供发展条件，减少欧洲在关键技术领域对外部供应商的依赖。欧盟此前已将提升人工智能自主能力列为重要战略议题。此次都柏林会议是欧盟领导人首次专门围绕人工智能开展深入战略讨论，欧洲科技自主和人工智能产业竞争力成为重点议题。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/027/009.htm", "publishedAt": "2026-11-13T23:36:30+00:00"}, {"title": "要让 GPT-6 Astra 等通用 AI 当机器人“大脑”：OpenAI 宣布重组具身智能团队", "summary": "IT之家 11 月 14 日消息，《财富》昨日（11 月 13 日）发布博文，爆料称 OpenAI 已解散独立机器人团队，并将相关人员调至公司其他部门。OpenAI 向该媒体确认了此次组织调整，只是强调本次调整并非退出机器人领域，机器人仍是其长期愿景的核心，重组旨在加快研发。在架构调整方面，机器人研究人员并入核心研究团队，向首席研究官马克 · 陈（Mark Chen）汇报；应用机器人与硬件团队则转入规模更大的应用部门，该部门由公司总裁格雷格 · 布罗克曼（Greg Brockman）负责。IT之家附上相关截图如下;d对于本次架构调整的根源，OpenAI 官方回应称包括 GPT-6 Astra 在内，通用模型已能直接用于部分机器人任务，因此决定将相关研究进一步整合到通用模型研发中。OpenAI 希望让能理解文字、图像和代码的 AI，也成为机器人的“大脑”，而不再完全依赖专门为机器人开发的模型。报道援引英伟达一项研究称，Astra 驱动的智能体在一项模拟操作测试中取得 74.8% 的成功率，高于该榜单领先专用模型的 51.0%。通用模型能否全面接手机器人，仍有现实难题。受访学者指出，大模型运行速度和云端联网需求构成限制，机器人企业积累的现场经验与数据也仍有价值。据报道，OpenAI 正研发自有人形机器人，目标于 2027 年首次公开演示。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/027/004.htm", "publishedAt": "2026-11-13T23:17:38+00:00"}, {"title": "让智能体帮你购物，OpenAI 推出支付功能 ChatGPT Wallet", "summary": "IT之家 11 月 13 日消息，OpenAI 今天（13 日）宣布推出支付功能 ChatGPT Wallet，让旗下 dot AI 智能体代替用户购物。ChatGPT Wallet 由 OpenAI 与美国运通、万事达卡和 Visa 合作开发，用户使用现有信用卡付款时，仍可享受原有的积分奖励和权益保障。符合条件的用户只需录入一次银行卡信息，随后便可让 dot 智能体帮忙寻找商品，每笔交易都需要通过安全验证才能完成。OpenAI 强调，dot 智能体不会接触用户的真实银行卡信息。支付网络会为每笔交易生成专用的支付令牌，其中包含限定用途的卡号、安全码和有效期，供智能体完成付款。当今，越来越多消费者开始尝试用个人 AI 智能体管理日程、预订旅行和处理其他日常事务，ChatGPT Wallet 在这样的背景下应运而生。ChatGPT Wallet 未来有望成为 OpenAI 新的收入来源。初期不会向交易收取佣金，OpenAI 当前的目标是更希望与商家建立合作关系，让消费者逐渐将 ChatGPT 视为购物平台，尤其是在商家也开始探索个人 AI 智能体的用途之际。ChatGPT Wallet 初期仅向美国年满 18 岁的 OpenAI Pro 订阅用户开放。据IT之家了解，截至今年第三季度末，ChatGPT 每周活跃用户超过 12 亿，付费用户接近 1 亿。OpenAI 指出，利用 AI 智能体购物仍处于起步阶段。公司在发布 ChatGPT Wallet 的同时，还推出了面向企业的工具和指南，帮助商家适应这种变化，其中就包括如何检查网站是否误拦截了 OpenAI 的智能体。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/026/994.htm", "publishedAt": "2026-11-13T15:49:08+00:00"}, {"title": "谷歌推出 LiteRT Tensor API，用于构建、定制与优化端侧机器学习模型", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/joYjCTbwWFSkbACK5lje?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-13T09:17:00+00:00"}, {"title": "高难盲测超越GPT-6-Astra与Opus-5！无界前沿开源Fx-Bio-1031，把RSI带进生命科学", "summary": "数据不出域、本地可部署", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/509663.html", "publishedAt": "2026-11-13T07:06:32+00:00"}, {"title": "刚刚，Gemini 4 新模型叒来了，终于人人可用", "summary": "更快更便宜还更聪明#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1689267?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-11-12T23:11:11+00:00"}, {"title": "谷歌发布首款决策模型 Gemini Decision 1：9 项测试拿下 7 项第一，准确率最高92.2%", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/E7QKIMUz3h0G0IE5Paii?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-12T11:00:00+00:00"}, {"title": "刚刚，豆包工作官宣接入 Kimi、DeepSeek，AI 模型自由来了", "summary": "国产大模型开始组团办公#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1689176?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-11-12T04:50:05+00:00"}, {"title": "苹果正在开发一个把 Mac 变成私有 AI 推理服务器的应用", "summary": "爆料人 Aaron Perris 在 11 月 10 日发现了苹果内部的一个新 Mac 应用，名字叫 Harbor。它的定位写在功能描述第一句：把你的 Mac 变成私有 AI 推理服务器。 这件事有意思的地方在于，苹果过去的 AI 叙事一直围绕着云和端侧的小模型转，Harbor 换了个思路——拿你自己买的 Mac 硬件跑开源权重模型，数据不出你的机器。 按...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503540/apple-new-mac-app-coming-to-make-running-local-ai-models-easy", "publishedAt": "2026-11-12T02:58:12+00:00"}, {"title": "Casvisor 开源：Apache-2.0 的堡垒机，一个 Go 二进制支持 SSH、RDP、VNC、Telnet 与会话录像", "summary": "Casvisor 是一个 Apache-2.0 协议的开源堡垒机（jump server），后端用 Go、前端用 React 编写，把 SSH、RDP、VNC、Telnet 四种远程协议的接入、权限和审计做在了同一个二进制里，被管理的服务器上不需要安装任何 agent。 主要功能 ，编辑图片时新增 AI 处理（逐步开放）；38.服务通知右上角新增通知设置，可设置消息免打扰和播放语音提醒开关（逐步开放）；39.部分文章或贴图内容滑动阅读时或打开后停留 3 秒，右下角出现关键词搜索或问小微悬浮按钮（8.0.23.35 及以上版本支持）；40.群公告消息支持通知提醒（热更新）；41.支持邀请好友体验小微（小范围逐步开放，需账号已灰度到小微主体）；42.服务＞钱包＞身份信息界面焕新重构（热更新）；43.群聊中选择提醒的人新增最常提醒，支持显示最近艾特过的群员（逐步开放，灰度到艾特一次后出现）；44.发现＞游戏＞圈子选择手游对应的圈子，支持启动对应已适配鸿蒙版本的游戏；45.修复了一些已知问题。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/027/063.htm", "publishedAt": "2026-11-14T02:42:54+00:00"}, {"title": "苹果推送 tvOS 27.2.1 更新，第二 / 第三代 Apple TV 4K 新增 Siri AI 支持", "summary": "IT之家 11 月 14 日消息，科技媒体 MacRumors 今天（11 月 14 日）发布博文，报道称苹果已推送 tvOS 27.2.1 以及 HomePod Software 27.2.1，内部开发代号均为 24K157。本次 tvOS 27.2.1 更新最大的亮点，是苹果面向第二代和第三代 Apple TV 4K 推送 Siri AI 支持。对这些设备的用户而言，无须更换新款硬件，即可获得此次语音助手升级。IT之家附上更新日志内容如下：此次更新为 Apple TV 4K 带来了更强大且更具对话性的 Siri AI。它还增加了最多四个 HomePod 扬声器连接到 Apple TV 4K（第四代）的功能，并提供了漏洞修复和安全更新。Siri AI一个更强大、更能对话的 Siri 版本，帮助你找到所需内容并完成更多事情。改进的搜索功能帮助你在 Apple TV 应用中发现完美的电影或电视剧，带来全新丰富、全屏的体验。个人情境理解借助你支持苹果智能的 iPhone，帮你找到想要的东西。广博的世界知识让你几乎可以就任何话题提问，并获得详细的答案。屏幕上的意识功能会回答你在 Apple TV 上看什么的疑问，所以在你最喜欢的剧集播放时，你可以问下一季什么时候播出。Apple TV 4K 上的 Siri AI 提供英文版本，需要支持苹果智能功能的 iPhone 或 iPad 来设置。Home 家庭影院家庭影院环绕声支持连接四个 HomePod 扬声器，带来沉浸式、多维度的聆听体验。Whole Room Audio 将声音均匀分布到四个扬声器，非常适合派对或比赛日。需要 Apple TV 4K（第四代）以及前后配对的 HomePod mini 2 或 HomePod（第二代）。消息源相比之下，HomePod 27.2.1 的更新内容较为有限。苹果发布说明仅表示，本次更新提供错误修复，并未加入 Siri AI。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/027/052.htm", "publishedAt": "2026-11-14T02:11:43+00:00"}, {"title": "微软就全球服务中断致歉：底层问题已解决，与网络攻击无关", "summary": "IT之家 11 月 14 日消息，微软北京时间今日凌晨在 X 上发布声明，就此次全球性服务中断向客户和合作伙伴致歉，称故障由一次网络容量升级引发，与网络攻击及人工智能 / 智能体无关。官方称，对本次事件给客户和合作伙伴造成的服务中断“深表歉意”。微软表示，公司清楚客户对其服务寄予的信任，并高度重视这一责任；目前各项服务已出现大范围恢复，并趋于稳定。官方介绍称，此次事件由一次更早的网络容量升级中的问题引入，在近期一次网络变更后暴露。微软强调，这属于技术故障，与网络攻击或人工智能 / 智能体无关。微软表示，底层问题已经解决，公司仍在为剩余受影响的客户和地区恢复服务。官方称，鉴于需求规模，恢复工作采取了逐步推进的方式，并在每个阶段验证稳定性；这一过程耗时更长，但有助于确保服务稳定恢复。IT之家此前报道，当地时间 11 月 12 日，微软旗下 Microsoft 365 多项核心云服务发生大规模故障，影响 Outlook、Exchange Online、Microsoft Teams、OneDrive、SharePoint、Microsoft 365 等产品，OpenAI 与 Anthropic 人工智能服务所使用的连接组件也受到波及。据故障监测网站 Downdetector 数据，Outlook 的问题报告量一度接近 138058 条。微软表示，待审查完成后将发布“完整的事后报告”。截至发稿，官方尚未公布报告发布时间。相关阅读：《微软 365 核心服务全球性大规模瘫痪：Outlook、OneDrive、Teams 均受影响，正逐步重启恢复》《微软 365 大规模宕机超 10 小时，日本政府不得不改用电话维持工作》《微软高管回应 Outlook 等服务中断：深感遗憾，正全力修复》《微软 Outlook 等服务今日大范围故障，受影响企业可申请费用抵扣》《Anthropic 连发多条故障通报：微软服务中断波及 Claude》《大规模故障殃及全球多地多行业，微软确认主要软件服务恢复工作已取得进展》《微软称 Outlook 等服务陆续恢复并趋稳，部分用户仍待恢复》《微软：没有迹象表明全美国航班停飞与 M365 服务宕机有关》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/027/005.htm", "publishedAt": "2026-11-13T23:21:39+00:00"}, {"title": "路透社：Arm 掌门人哈斯进入接棒黄仁勋候选视野，曾在英伟达工作 7 年", "summary": "IT之家 11 月 14 日消息，金融时报昨日（11 月 13 日）发布博文，报道称英伟达董事会已聘请外部机构物色新 CEO 候选人，除了苹果芯片负责人约翰尼 · 斯鲁吉（Johny Srouji）外，Arm 首席执行官雷内 · 哈斯（Rene Haas）也被列为潜在考虑对象。路透社表示英伟达董事会有意向接触哈斯，但目前哈斯只是英伟达董事会考虑的多名人选之一，是否会获得邀约、是否愿意接受，均未确定。图源：Arm 官网IT之家援引博文介绍，哈斯曾在该公司工作七年，担任计算产品业务副总裁兼总经理，2013 年加入 Arm，2022 年出任首席执行官，并带领 Arm 于 2023 年登陆纳斯达克。这段横跨两家芯片企业的经历，让他成为此次接班讨论中受到关注的人物。与此同时，路透社援引《连线》报道，英伟达内部一则呼吁董事会考虑员工意见的帖子获得逾 1600 条评论，其中部分评论要求黄仁勋回归。对于选帅进展，英伟达董事会表示，正在挑选猎头机构，尚未正式接洽潜在候选人，并强调现在讨论具体人选为时过早。Arm 拒绝置评。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/027/002.htm", "publishedAt": "2026-11-13T23:07:34+00:00"}, {"title": "微软称 Outlook 等服务陆续恢复并趋稳，部分用户仍待恢复", "summary": "IT之家 11 月 14 日消息，微软官方账号 @MSFT365Status 于北京时间 11 月 14 日发布的推文，微软宣布其 Outlook 等各项服务均呈现全面恢复和稳定态势。不过，微软公开声明同时表示，仍在为剩余受影响客户和地区恢复服务。根据微软官方 MO1550821 公告内容，本次 Microsoft 365 服务故障从美国东部时间 2026 年 11 月 12 日 13:25 左右（IT之家注：北京时间 11 月 13 日凌晨 2:25 左右）开始，影响 Outlook、Teams、Copilot、OneDrive 等多项微软服务。此次故障最初涉及 Teams，随后微软确认 Exchange Online 和 Outlook 也受到影响。故障还波及邮件之外的办公功能。Teams、SharePoint Online、Microsoft 365 Copilot 等服务中，部分依赖 Exchange 的功能受到牵连。微软解释，故障源于此前一次网络容量升级中引入的问题，该问题在近期网络变更后暴露，导致基础设施负载升高。公司表示，底层问题已经解决，此次事件属于技术故障，与网络攻击或 AI、智能体无关，并就服务中断向客户及合作伙伴致歉。恢复过程中，微软采取分阶段恢复服务、逐步引入流量的方式，并在各阶段验证系统稳定性。公司称，这一过程耗时较长，但有助于确保服务稳定恢复。随着修复推进，邮箱访问和延迟邮件处理等场景已有改善。不过，恢复期间部分用户仍可能遇到间歇性访问异常或邮件延迟，剩余受影响环境的恢复工作仍在继续。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/027/001.htm", "publishe const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
