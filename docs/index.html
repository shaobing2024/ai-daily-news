const DATA = {"date": "2026-09-04", "generatedAt": "2026-09-04T00:41:28Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "黄仁勋：拟收购 Hugging Face，不是为了把 AI 关进英伟达", "summary": "IT之家 9 月 4 日消息，英伟达（NVIDIA）昨日（9 月 3 日）宣布，已同意以 129.303 亿美元（IT之家注：现汇率约合 870.92 亿元人民币）收购开源人工智能平台 Hugging Face，黄仁勋随后在博文中解释了收购该平台的原因。黄仁勋表示，Hugging Face 是开放模型开发者社区的重要“家园”，已有逾 1,800 万开发者、研究人员和创作者在平台上共享超过 300 万个模型、50 万个数据集和 100 万个应用；逾 20 万家公司用它寻找、评估、定制和部署 AI。黄仁勋透露英伟达是 Hugging Face 开放模型和数据的最大贡献者，而且其贡献还在不断增长，该公司已在 Hugging Face 平台上发布了 500 多个模型和 250 多个开放数据集。IT之家附上相关图片如下：黄仁勋解释收购原因时，称希望在借助英伟达的基础设施、工程能力和全球覆盖面，把 Hugging Face 的开放式 AI 平台扩展到前所未有的规模，并承诺 Hugging Face 会维持开放平台属性，继续支持各类开源及开放权重模型、多云和多加速器环境。黄仁勋指出开放权重，能让初创公司、企业、大学和公共机构无需从零训练模型，也能使用先进 AI 能力；这有助于在更多企业、机构和社区之间分布 AI 领导力。开放模型可帮助组织为不同任务选择合适模型，并使 AI 更快进入工厂、医院、农场、课堂和中小企业等真实场景。而在本次收购后，英伟达可以帮助改善 Hugging Face 的平台可靠性、安全性、模型评估、推理和部署能力。对于本次计划收购，黄仁勋强调不会把 Hugging Face 变成只服务英伟达硬件的封闭入口，希望通过英伟达的规模化能力，进一步增强开放 AI 生态。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/248.htm", "publishedAt": "2026-09-04T00:38:47+00:00"}, {"title": "GPT-6 Astra 正式发布：性能 AGI，贵到要负债", "summary": "一次成功，才是最大的优惠#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1678409?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-09-04T00:36:58+00:00"}, {"title": "摩托罗拉 IFA 2026 发布 edge 70 plus 手机：骁龙 7s Gen 3，200MP 主摄 + 6500mAh 电池", "summary": "IT之家 9 月 4 日消息，摩托罗拉当地时间 9 月 3 日在德国柏林举办的 IFA 2026 期间发布多款新品，包括 edge 70 plus 手机、Watch Ultra 智能手表、moto snap 无线充电器，以及与施华洛世奇联名的 Razr 70（美国版为 Razr 2026）手机。其中，摩托罗拉 edge 70 plus 搭载 200MP 主摄，Watch Ultra 首次加入 LTE eSIM 功能，moto snap 无线充电器支持最高 25W 的 Qi 无线充电。摩托罗拉 edge 70 plus 采用四曲面设计，配备 6.78 英寸 Extreme AMOLED 显示屏，支持最高 144Hz 刷新率，并通过彩通认证；覆盖康宁 Gorilla Glass 7i 玻璃，机身通过 MIL-STD-810H 相关测试。影像方面，该机配备 200MP 主摄，支持 OIS 光学防抖、彩通色彩和肤色验证、最高 10 倍 Super Zoom 以及 4K 视频录制，同时提供独立微距摄像头。前置摄像头为 3200 万像素，支持 AI 影像优化和 4K 视频录制。据介绍，摩托罗拉 edge 70 plus 的 200MP 主摄会将 16 个像素合并为 1 个像素，因此默认输出照片的有效分辨率为 1250 万像素。性能方面，摩托罗拉 edge 70 plus 搭载高通骁龙 7s Gen 3 移动平台，配备 8GB LPDDR5X 内存以及 128GB 或 256GB 存储空间，并支持 AI RAM Boost；采用 VC 均热板在内的散热方案。续航方面，edge 70 plus 配备 6500mAh 电池，在特定测试条件下最长可实现 42 小时通话、34 小时视频播放或 23 小时社交媒体浏览。此外，这款手机支持 45W TurboPower 快充，并提供旁路充电功能，可在游戏过程中直接利用充电器供电。摩托罗拉 Watch Ultra 配备 1.5 英寸 OLED 显示屏，峰值亮度最高 2700 尼特，采用 46mm 不锈钢表壳，支持全天候显示。这款手表搭载高通骁龙 W5+ Gen 1 芯片，运行 Wear OS by Google，并可通过 Google Play 安装 YouTube Music、Google Maps、Google Messages 和 Google Gemini 等应用。健康功能方面，Watch Ultra 与 Polar 合作，提供压力管理、睡眠分析、运动和热量追踪等功能，并加入 Serene 呼吸训练、Energy Sources 能量来源分析以及 Running Coach 跑步指导等功能。连接方面，Watch Ultra 是摩托罗拉首款支持 LTE 功能的智能手表。用户无需携带手机即可通过手表接打电话、发送短信和管理通知，同时支持双频 GPS 以及通过 Google Wallet 进行非接触式支付。该手表还首次在摩托罗拉可穿戴设备中内置 Motorola Qira。在兼容的摩托罗拉和联想设备上，用户可以抬起手腕或说“Hey Qira”调用相关功能，例如询问信息或调取设备间保存的数据。续航方面，在关闭全天候显示的条件下，Watch Ultra 单次充电最长可使用 2 天；充电 15 分钟最多补充 24 小时续航。手表支持 IP68 防护和 5ATM 防水，并采用康宁 Gorilla Glass 3 保护玻璃。此外，摩托罗拉还推出 moto snap 无线充电器。该产品在兼容 Qi2.2 的设备上支持最高 25W 无线充电，在支持摩托罗拉自有充电协议的兼容设备上则可实现最高 30W 充电。moto snap 无线充电器配备 1.5 米 USB Type-C 编织线，支持磁吸保护壳，并采用磁力对齐设计。产品还具备过热和过充保护，待机功耗为零。售价和上市时间方面，motorola edge 70 plus 将在未来数周陆续登陆欧洲和中东部分市场，官方尚未公布统一售价。Watch Ultra 起售价为 429 欧元（IT之家注：现汇率约合 3,352 元人民币），将在未来数周于欧洲、中东、拉丁美洲、北美和亚太部分市场上市。moto snap 无线充电器起售价为 39 欧元（现汇率约合 304.7 元人民币），同样将在未来数周登陆欧洲、中东、拉丁美洲和亚太部分市场。具体售价及上市情况将根据当地市场有所不同。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/247.htm", "publishedAt": "2026-09-04T00:36:42+00:00"}, {"title": "微软最强转录 AI 模型：MAI-Transcribe-2 登场，60 语种平均词错误率 5.2%", "summary": "IT之家 9 月 4 日消息，微软昨日（9 月 3 日）发布博文，宣布推出 MAI-Transcribe-2，宣称是其最快、最准确、最便宜的 AI 语音转文字模型。在定价方面，MAI-Transcribe-2 上市时限时收费 0.10 美元（IT之家注：现汇率约合 0.67 元人民币） / 小时，优惠持续至 2026 年年底。性能方面，MAI-Transcribe-2 是微软最强的转录模型，相比较市场上其它主流模型，在准确率、速度和价格方面存在优势。在 FLEURS 测试集中，MAI-Transcribe-2 支持强制指定语言和自动推断语言两种模式，平均词错误率均为 5.2%。同一测试中，Gemini 3.1 Pro 的两项结果分别为 5.3% 和 5.8%；GPT-Transcribe 为 10.4% 和 10.6%；Whisper v3-Large 为 22.8% 和 23.5%。速度方面，微软援引 Artificial Analysis 评测称，MAI-Transcribe-2 比 GPT-Transcribe 快 10 倍，比 Scribe v2 快 7 倍，比 Gemini 3.5 Transcribe 快 5 倍。功能方面，MAI-Transcribe-2 新增说话人分离功能，可在一段录音内区分不同发言者，并将文字归属到对应说话人。逐词时间戳可为每个词标注精确位置，便于音频检索、导航、编辑和字幕对齐。风格方面，模型提供可配置转写风格。verbatim 模式保留语气词和口误，面向合规与分析工作；clean 模式删除语气词，以生成更易读的字幕、笔记和发布文本。模型还支持关键词偏置、自动语言识别、语言切换和噪声环境转写。模型支持 60 种语言，并支持自然混用语言的对话，用户无需预先指定语言，模型可自动检测录音语言。目前，开发者可在 Microsoft Foundry、MAI Playground 和 OpenRouter 调用或试用该模型。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/241.htm", "publishedAt": "2026-09-04T00:11:05+00:00"}, {"title": "铭凡确认 AI 迷你工作站 MS-S1 MAX-P495 九月开售", "summary": "IT之家 9 月 4 日消息，MINISFORUM（铭凡）今日确认，其基于 AMD 锐龙 AI Max+ PRO 495 处理器的新款 AI 迷你工作站 MS-S1 MAX-P495 即将在本月内开售。MS-S1 MAX-P495 配备 192GB LPDDR5X-8533 统一内存，支持将至多 160GB 分配为显存。其在实际本地 AI 部署中的表现如下：以 Q4 量化运行 DeepSeek V4 Flash 284B，推理输出速率 15 Token/s；以 Q8 量化运行 122B 模型，推理输出速率 27 Token/s；支持 Q8 高精度量化 + 131K 完整上下文常驻。▲ MS-S1 MAX-395铭凡此前已推出过基于 AMD 锐龙 AI Max+ 395 的 MS-S1 MAX-395。这两款产品的其它配置应基本一致。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/236.htm", "publishedAt": "2026-09-03T23:52:34+00:00"}, {"title": "HTC 为旗下 AI 智能眼镜 VIVE Eagle 新增全新圆框款式，系列产品同步升级支持 3K 分辨率录像等功能", "summary": "IT之家 9 月 4 日消息，HTC 宣布为旗下 AI 智能眼镜 VIVE Eagle 新增全新圆框款式，同步升级多项软件功能，将录像分辨率从 2K 提升至 3K，并新增慢动作拍摄、第一视角直播、AI 实时翻译对话模式、点头接听、摇头拒接电话等功能，同时进一步扩展 VIVE AI Notes 的语言支持。全新 VIVE Eagle 圆框版本定价为 15,600 新台币（IT之家注：现汇率约合 3,307 元人民币），该版本机型提供炭黑色、茶色和蓝色 3 种配色，搭配防滑鼻托，可选 ZEISS 蔡司透明镜片、太阳镜片以及变色镜片等，用户可以根据通勤、户外活动和日常穿搭需求进行搭配。在软件方面，VIVE Eagle 的录像分辨率由原来的 2K 提升至 3K，并新增慢动作录像功能，同时结合电子防抖和 AI 图像优化，进一步提升移动拍摄时的画面稳定性。此外，VIVE Eagle 新增 Live Streaming 直播功能，用户可以直接以第一视角分享旅行、运动、活动及日常生活内容，最长直播时间约为 1.2 小时。除了影像功能，VIVE Eagle 此次也进一步强化 AI 能力。AI 实时翻译新增“聆听模式”和“对话模式”；VIVE AI Notes 则扩展至支持 96 种语言，并结合录音、语音转文字、说话人识别及 AI 摘要等功能，可用于会议、学习以及日常记录。VIVE Eagle 继续采用开放式 AI 架构，用户可以根据需求选择 Google Gemini 或 OpenAI GPT，同时提供数据加密、拍摄提示及佩戴检测等隐私保护机制。续航方面，眼镜内置 235mAh 电池，充电约 10 分钟即可达到 50% 电量；此外官方还推出重量约 8 克、容量 120mAh 的专属磁吸充电器，进一步提升外出使用的便利性。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/232.htm", "publishedAt": "2026-09-03T23:46:34+00:00"}, {"title": "智谱 GLM-5.3-Flash 夜间免费用：9 月 3 日至 20 日、每天 23 时至次日 9 时额度全免", "summary": "IT之家 9 月 4 日消息，智谱 AI 昨日宣布，旗下 GLM Coding Plan 正式推出“Flash × ZCode”夜间畅用活动。即日起至 9 月 20 日，每晚 23:00 至次日 9:00，所有付费套餐用户无需手动开启，系统将自动生效优惠。活动期间，GLM Coding Plan 套餐中的 GLM-5.3-Flash 模型额度消耗规则如下：通过智谱官方编程工具 ZCode 使用时，额度消耗为 0，实现完全免费畅用。通过套餐支持的其他 Agent 使用时，可用额度翻倍（×2）。IT之家提醒：本次活动仅针对 GLM-5.3-Flash 模型，错峰时段内若选用 GLM-5.3，仍按套餐标准规则消耗额度。活动时间以北京时间（UTC+8）为准，含周末及公共假日。GLM-5.3-Flash 是 GLM-5 系列的首个原生多模态模型，支持 100 万 token 上下文窗口及文本、图像与视频多模态输入。该模型一度以“Ox Alpha”的匿名身份现身 OpenRouter 平台，揭晓后已跃居 OpenRouter 排行榜首位，使用量超过 DeepSeek 一倍以上。在 Artificial Analysis Intelligence Index（AA 综合智能指数）中取得 57 分，进入全球前沿模型能力区间，适合代码生成、代码理解、问题修复等代码任务，同时在 Office 与文档类任务，金融、法律等专业任务方面亦有显著提升。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/231.htm", "publishedAt": "2026-09-03T23:43:37+00:00"}, {"title": "英伟达开源发布 PAIR：本地跑 AI 新方案，调度 Mac / RTX PC 跨设备推理", "summary": "IT之家 9 月 4 日消息，科技媒体 AppleInsider 昨日（9 月 3 日）发布博文，报道称英伟达以开源测试版状态，推出 Personal AI Router（PAIR）软件，用于在局域网内为本地 AI 请求选择可用计算机，类似把任务分派给空闲工位的调度员。在兼容设备上，该软件可以在 M4 以及更高的 Mac 设备、英伟达 RTX PC 和 DGX Spark 设备上运行，为 Ollama、LM Studio 等本地 AI 工具提供统一请求入口。用户可在家庭或办公局域网内，将多个独立 AI 请求调度至空闲设备处理。IT之家附上相关截图如下：产品定位方面，英伟达将 PAIR 定位为局域网内的本地 AI 请求调度软件，能自动发现已加入的电脑，并将每项请求分配给可用设备。模型仍由目标设备上的 Ollama 或 LM Studio 运行，因此用户不必为每款 AI 应用分别配置每一台机器。在某台设备繁忙或不可用后，PAIR 可把新请求转向其他已配对设备。例如，AI 智能体同时审阅多份文档时，可将彼此独立的任务分别交给不同计算机处理。该机制面向并发负载分担，并不意味着单个 AI 回复会因加入更多电脑而自动变快。英伟达演示显示，在 Hermes 中使用 Ollama 与 Qwen 3.6 35B A3B 模型，将任务拆分给 5 个 AI 子智能体后，RTX Spark 笔记本单机平均完成时间为 18 分钟；加入 DGX Spark 和 RTX 5090 后，平均时间为 8 分 48 秒。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/229.htm", "publishedAt": "2026-09-03T23:36:43+00:00"}, {"title": "研究显示：用户过度依赖 ChatGPT 等 AI 产品可能导致独立思考能力下降", "summary": "IT之家 9 月 4 日消息，外媒 notebookcheck 援引《应用认知心理学》（Applied Cognitive Psychology）期刊一项小型研究，认为用户过度依赖 ChatGPT 等 AI 产品可能会导致用户独立思考能力下降、自我怀疑增加以及社交孤立加剧。IT之家参考报道获悉，来自法国巴黎 ISC 商学院的研究人员 Zeineb Farhat 采访了 45 名年龄在 18 至 25 岁、每天使用 ChatGPT 的人士，了解这款工具对他们学习习惯、工作以及情绪生活产生的影响。研究结果显示，一些受访者在习惯通过 ChatGPT 即时获得答案后，独立思考能力出现下降。他们表示自己的注意力持续时间缩短，对信息的记忆能力减弱，同时在处理日常事务和做出决定时，也越来越容易怀疑自己的判断。一些参与者甚至表示，当 ChatGPT 暂时无法使用时，会产生明显的不安和困扰。研究人员将这一现象与“认知卸载”（cognitive offloading）联系起来，即人们借助外部工具存储和处理信息，从而减少对自身记忆和认知能力的依赖。随着使用程度加深，部分重度用户甚至开始优先与聊天机器人交流，而不是与朋友、老师或同事互动，在部分情况下进一步产生了社交孤立感。不过，ChatGPT 并非只会带来负面影响。研究发现，那些有选择地使用 ChatGPT、将其视为头脑风暴伙伴而不是替代自身思考的人，反而表示自己的自信心和创造力有所提升。研究人员同时强调，这项研究的样本仅有 45 人，且参与者均来自法国、年龄集中在 18 至 25 岁，因此研究结果不能直接推广到其他人群。研究团队呼吁开展更大规模、覆盖不同年龄和地区，并持续更长时间的研究，以进一步评估 AI 工具对人类认知能力和社会行为的长期影响。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/217.htm", "publishedAt": "2026-09-03T23:08:50+00:00"}, {"title": "智能戒指厂商 Oura 正式提交 IPO 文件赴美上市：近 9 个月营收 12 亿美元同比增长约 72%，付费会员约 500 万", "summary": "IT之家 9 月 4 日消息，当地时间 9 月 3 日，智能戒指厂商 Oura 向美国证券交易委员会（SEC）提交 S-1 注册文件，正式启动首次公开募股（IPO）流程。公司计划申请在纳斯达克全球精选市场上市，股票代码为“OURA”，但目前尚未公布发行股份数量和 IPO 价格区间。从最新提交的文件来看，Oura 的营收在过去一年大幅增长。截至 2026 年 6 月 30 日的 9 个月内，公司营收达到 12 亿美元（IT之家注：现汇率约合 80.84 亿元人民币），相比上年同期的 6.97 亿美元同比增长约 72%。Oura 此前披露，公司 2024 年营收约为 5 亿美元，2025 年约为 10 亿美元，并预计 2026 年全年营收接近 20 亿美元。此次公开提交上市文件后，外界将获得更多有关公司财务状况和业务构成的信息。截至目前，Oura 过去一年共售出 360 万枚智能戒指，并拥有约 500 万名付费会员（这里的付费会员是指订阅 Oura 服务、以获取更多健康数据和功能的用户）。Oura 披露，其付费会员加权平均 12 个月留存率约为 85%，即按照不同月份会员规模加权计算后，每月新加入的付费会员中，约 85% 在 12 个月后仍保持订阅状态。Oura 智能戒指售价主要在 350 至 400 美元（现汇率约合 2,358 至 2,695 元人民币）之间，核心功能是持续采集用户的生理数据，包括代谢、心率、压力水平和睡眠模式等，并通过配套应用进行分析。Oura 在文件中表示，其业务未来的覆盖范围将不局限于传统的活动和健身追踪。公司认为，随着健康数据获取渠道扩大、临床证据积累，以及与医疗保险计划、雇主和医疗服务机构的整合加深，其平台可以服务更广泛的人群。数据也成为 Oura 进一步开发 AI 功能的重要基础。公司称，目前已经积累了消费健康领域规模较大的纵向生物特征数据集之一，覆盖 50 多项健康和健康管理指标，总计约 420 亿小时的生理数据。Oura 表示，这些数据被用于训练和驱动公司的 AI 及机器学习模型，用于识别复杂的生理模式。随着会员历史数据不断增加，公司认为相关模型的准确性、个性化程度和预测能力也会进一步提高。Oura 此次 IPO 此前已有迹象。2026 年 5 月，公司曾向 SEC 秘密提交 S-1 文件；2026 年 8 月 24 日，彭博报道称 Oura 可能通过 IPO 筹集最多 30 亿美元（现汇率约合 202.09 亿元人民币），并寻求超过 160 亿美元（现汇率约合 1,077.83 亿元人民币）的估值。Oura 成立于 2013 年，总部位于美国旧金山，并在全球设有办公地点。公司今年 3 月 31 日完成重组，从芬兰迁册至美国，由特拉华州注册成立的 Oura Inc.成为集团母公司。此次上市文件公布之际，Oura 还面临一宗拟议集体诉讼。2026 年 8 月，一名原告在旧金山提起诉讼，指控 Oura 在睡眠追踪准确性方面误导消费者，并质疑其戒指是否能够直接检测用于判断睡眠阶段的相关生理信号。诉讼称，Oura 戒指实际上依靠 AI 生成的估算结果判断睡眠阶段，而不是直接检测相关生理信号。原告还援引 Oura 此前的宣传内容，认为公司对睡眠追踪准确性的描述存在误导。Oura 则否认相关指控。公司此前回应称，Oura Ring 会结合心率、心率变异性、运动、呼吸模式和体温等多种生理信号估算睡眠阶段，并表示其睡眠分期功能已经通过多项研究与多导睡眠监测进行了验证。Oura 同时强调，Oura Ring 并非医疗器械，也不能替代临床睡眠检查。针对这起诉讼，公司表示将通过适当的法律程序进行抗辩。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/215.htm", "publishedAt": "2026-09-03T23:04:07+00:00"}, {"title": "刚刚，GPT-6 震撼发布！人类进入 AGI 大分工时代", "summary": "OpenAI：欢迎来到 AGI 时代#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1678196?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-09-03T23:03:17+00:00"}, {"title": "OpenAI 宣布将向全球投入 10 亿美元扩大 AI 网络安全能力，优先覆盖供水、电力等关键服务", "summary": "IT之家 9 月 4 日消息，OpenAI 今日宣布推出“Daybreak for Frontline Defenders”计划，承诺投入 10 亿美元（现汇率约合 67.36 亿元人民币），为资源有限的网络安全防御团队提供 Daybreak 访问权限、培训、技术支持及合作服务，帮助其利用前沿 AI 保护供水、电力、地方政府和金融等关键服务。IT之家注：Daybreak Access 是 OpenAI 的网络安全可信访问计划。Daybreak Blue 和 Daybreak Red 是两个访问级别。OpenAI 表示，这项全球计划首先在美国展开，并计划在未来数周扩展至合作国家。10 亿美元资金预计将在未来 6 个月内用于相关 Daybreak 服务，重点面向缺乏大型企业级安全资源的机构。“Daybreak for America”将整合 OpenAI 在美国保护关键系统方面的相关工作，服务对象包括供水及污水处理系统、电网运营商、州和地方政府、社区及地区银行、非营利组织、开源项目维护者等。OpenAI 称，这些机构往往需要在人员、预算和专业安全能力有限的情况下维护复杂且老旧的系统。Daybreak 可用于审查遗留代码、分析可疑活动、发现并验证漏洞、确定高风险问题优先级，以及开发和测试修复方案。此次计划也延续了 OpenAI 此前针对美国供水系统的支持。在美国供水系统遭遇近期攻击后，OpenAI 曾向受影响的州和公用事业机构提供最高 100 万美元的免费 API 额度、Daybreak 访问权限及技术支持，帮助相关团队检查代码和系统配置、验证漏洞、开发补丁并确认修复效果。OpenAI 于 2026 年早些时候推出 Daybreak，使经过验证的公共部门和私营部门网络安全防御人员能够使用 AI 开展获授权的网络防御工作。其中，Daybreak Blue 主要通过 OpenAI 主力模型支持常见防御任务，Daybreak Red 则面向获批准机构提供专业网络安全模型，用于更敏感且技术要求更高的工作。目前已有超过 2000 家获批准的机构和工作空间、数千名网络安全防御人员使用 Daybreak，涵盖网络安全企业、国防机构和执法机构等。OpenAI 还表示，将继续与公用事业企业、州和地方政府、社区银行等一线防御团队开展交流，为其提供实际使用工具方面的支持。据介绍，OpenAI 本周举行的第二次公用事业企业交流活动共有来自美国 40 个州及哥伦比亚特区的参与者参加，这些机构合计为超过一半的美国人口提供关键服务。在合作方面，OpenAI 宣布与多州信息共享与分析中心（MS-ISAC）开展面向公共部门和供水领域的试点项目，为州、地方、部落及领地网络安全防御人员提供培训和支持。首批参与者将获得 Daybreak 访问权限以及指导培训和实际技术协助。MS-ISAC 为数千家公共部门机构提供网络威胁情报、事件响应支持和实时信息共享等服务，成员包括公用事业、公共医院、中小学及执法机构。此次试点旨在形成一套可重复使用的工作模式，未来进一步覆盖相关公共部门机构。OpenAI 还宣布，Daybreak Defense Network 合作伙伴目前将推出超过 35 款企业产品及合作运营服务，把 Daybreak 网络安全模型整合进企业防御人员现有的工具、服务和工作流程中。OpenAI 本周公布了“Defense Factory”的构建方法。这是一种以 AI 智能体为核心的持续运行模式，利用现有安全和工程工具发现并验证漏洞，并准备经过测试、供人工审核的修复方案。OpenAI 表示将分享其架构和实践经验，供其他防御团队参考。OpenAI 称，此次计划的目标不仅是让防御人员发现更多漏洞，还包括缩短从发现漏洞到完成修复的时间，并让前沿 AI 网络安全能力覆盖大型企业之外的公共事业、社区银行、医疗系统和地方政府等机构。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/212.htm", "publishedAt": "2026-09-03T22:56:43+00:00"}, {"title": "OpenAI GPT-6 Astra 发布：首次达到“关键”级网络安全能力门槛，布罗克曼认为 AGI 时代已经到来", "summary": "IT之家 9 月 4 日消息，当地时间 9 月 3 日，OpenAI 宣布推出新一代 GPT-6 Astra 模型，这是该公司迄今为止最强大、部署最广泛的大语言模型。据介绍，Astra 是 OpenAI 旗下首个达到其“准备框架”（Preparedness Framework）中“关键”（Critical）网络安全能力门槛的模型。格雷格 · 布罗克曼（Greg Brockman）声称，随着 Astra 的发布，世界已经进入了通用人工智能的新时代。据 OpenAI 介绍，Astra 在网络安全能力上实现了显著跃升。在提供适当工具和访问权限的情况下，该模型能够在无人指导的条件下，发现许多防护严密的系统中此前未知的安全漏洞，并开发新的利用方式。针对网络安全能力提升，OpenAI 进一步加强了 GPT-6 Astra 的安全防护，包括强化内部开发和部署环境隔离、加密模型检查点，以及对完整运行轨迹进行统一监控。OpenAI 还引入了在内部使用前必须通过的阻断式对齐评估流程，并针对模型可能因滥用或自身偏差采取有害网络操作的风险增加防护措施。与 GPT-5.6 Sol 相比，GPT-6 Astra 的抗越狱能力也有所提升。OpenAI 称，该模型通过新的鲁棒性（指模型在面对被破坏的、异常的、有恶意的输入时，能否做到“临危不乱”）安全训练技术，在较长运行轨迹中的表现同样更加稳定。在具体应用场景中，Astra 在面对提示词注入攻击的鲁棒性显著优于 GPT-5.6 Sol，在真实浏览和专业计算机环境中的不对齐及潜在破坏性行为（如未经授权的交易、数据丢失、过度访问或规避控制）也大幅减少。此外，Astra 在高风险场景中的响应更为安全，且在 18 岁以下用户的年龄适配安全边界应用上更为一致。IT之家注：提示词注入攻击（Prompt Injection）是指通过特定输入诱导 AI 系统偏离原有指令或安全约束的攻击方式。OpenAI 表示，公司通过离线测试，以及内部和外部越狱测试与修复计划，对 GPT-6 Astra 进行了验证。针对被标记为潜在高风险的用户，模型还接受了更保守拒答边界方面的训练。此外，OpenAI 采用回归测试确保 GPT-6 Astra 能够抵御此前测试阶段发现的越狱方式，并使用最新的内部自动化红队攻击模型进行了新一轮测试。在模型对齐方面，OpenAI 称 GPT-6 Astra 相较 GPT-5.6 Sol 也有所改进，涉及预训练数据构成以及强化学习阶段的评估机制。根据 OpenAI 公布的一组对齐评估结果，GPT-6 Astra 在遵守安全与安全边界、以及保持在获授权范围内执行任务方面表现更好。OpenAI 还利用超过 5.4 万项内部 Codex 任务开展部署模拟。在这项测试中，GPT-6 Astra 被标记为高严重程度失配行为的次数约为 GPT-5.6 Sol 的一半。OpenAI 同时扩大了失配监控系统的部署范围，将其加入 GPT-6 Astra 对外部署过程中涉及工具调用的推理流程。该监控系统需要消耗大量计算资源，其架构与 OpenAI 内部使用的监控方案相似。不过，OpenAI 也指出，GPT-6 Astra 的可监控性较 GPT-5.6 Sol 有所下降。相关研究显示，Astra 更有能力控制自身思维链（CoT），并且更不容易在其中留下可能暴露问题的信息。在对抗性测试中，OpenAI 要求模型主动规避监控，发现 GPT-6 Astra 在评估中故意降低表现时可以保持不被发现；在执行部分破坏性任务时，它有时也能够规避内部监控。OpenAI 称，目前尚未发现 GPT-6 Astra 存在思维链隐写推理的证据，即通过普通且看似无关的文本隐藏推理信息。因此，现阶段观察到的规避风险可能主要局限于较低难度的推理任务。OpenAI 强调，这些结果主要来自要求模型主动规避监控的对抗性评估，而整体对齐测试仍显示，GPT-6 Astra 违反安全限制的可能性低于 GPT-5.6 Sol。OpenAI 表示，公司将继续研究上述趋势及其对模型可监控性的影响，并把保持和利用思维链监控能力作为相关研究计划的核心目标。同时，公司认为，仅依靠检查模型思维链并不足以完成对齐审计，还需要发展其他审计技术。在浏览和办公环境中，GPT-6 Astra 同样针对提示注入进行了强化。OpenAI 在真实浏览及专业计算机环境中测试发现，该模型执行未授权交易、造成数据丢失、过度访问权限或绕过控制措施等潜在破坏性行为的可能性低于 GPT-5.6 Sol。在智能体场景中，GPT-6 Astra 处理高风险请求时也更加谨慎。例如，对于涉及暴力攻击策划或实施欺诈的请求，其行为安全性均有所提升。OpenAI 最后表示，GPT-6 Astra 在来自实际生产环境及人工红队测试的高风险请求中，相较 GPT-5.6 Sol 能够更安全地完成允许处理的任务，同时减少对无害请求的不必要拒答。OpenAI 首席科学家 Jakub Pachocki 在 9 月 3 日上午的简报会上表示：“随着模型能力增强，准确理解它们能做什么变得更困难了。这并不保证随着智能持续提升，我们的方法仍然足够有效，因为智能的进步并不能保证对齐的进步。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/208.htm", "publishedAt": "2026-09-03T22:28:07+00:00"}, {"title": "新版GPT Image 2.5已经能伪造GPT-6发布会了", "summary": "改进GPT Image 2的噪点问题", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/483948.html", "publishedAt": "2026-09-03T21:57:08+00:00"}, {"title": "刚刚，GPT-6正式发布！OpenAI：欢迎来到AGI时代", "summary": "全球最强C", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/483898.html", "publishedAt": "2026-09-03T21:50:07+00:00"}, {"title": "李飞飞首个多模态世界模型 Atlas 正式发布：从零开始预训练，几张图就能构建世界", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/9YiEhb3hAFtUlxOpMdGC?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-03T16:49:43+00:00"}, {"title": "英伟达 RTX Spark 紧凑型 Win PC 主机下月上市，含宏碁、联想等 6 家 OEM 厂商产品", "summary": "IT之家 9 月 4 日消息，英伟达今天宣布，全新 RTX Spark Windows PC 将于 10 月上市，为 AI 发烧友、开发者提供更多创作方式。据介绍，英伟达合作伙伴已在 IFA 2026 大会上展示相关硬件。全新发布的产品设计将与现有 6 家 OEM 厂商的产品一同于 10 月出货。例如宏碁本次展示了 RTX Spark 高能效桌面主机的概念设计，联想则发布了 Yoga Pro 9n 和 Yoga 9n 二合一设备。据官方介绍，RTX Spark 将搭载高能效 20 核 Grace CPU 以及至高 128GB 统一内存，还带有 RTX Blackwell GPU，算力可达 1 Petaflop（IT之家注：千万亿次浮点运算）。RTX Spark 这款超级芯片可为高性能、轻薄且具备全天续航的笔记本电脑，以及小巧、高能效的桌面主机提供动力，支持始终在线的智能体。搭配全新 Windows Agent 框架，智能体可在操作系统级管控下安全地在后台运行。除此之外，英伟达今天还宣布推出免费开源的 Personal AI Router（PAIR）技术，可在本地网络的多台电脑之间智能分配 AI 推理任务。智能体工作流通常会将复杂任务拆分为可并行执行的小任务，但当所有推理请求都在争用同一块 GPU 时，性能可能会下降。NVIDIA PAIR 可自动发现本地网络的兼容 PC，将相互独立的推理请求路由至具备可用算力的系统。它可以和 Ollama、LM Studio 配合使用，并随设备加入或离开网络自动调整。该技术将兼容 Windows、macOS 和 Linux，兼容 RTX 20 系列及更新 GPU、RTX PRO 桌面端 GPU（图灵架构及更新）、DGX Spark，以及苹果 M4 或更新款芯片。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/202.htm", "publishedAt": "2026-09-03T16:00:06+00:00"}, {"title": "谷歌 DeepMind 发布 WeatherNext 3：分辨率最高 5 公里，号称全球最先进、精准 AI 天气预报模型", "summary": "IT之家 9 月 3 日消息，谷歌 DeepMind 和 Google Research 今天宣布推出 WeatherNext 3 ，号称是目前最先进、最准确的全球气象模型。该模型可直接从实时观测中学习，能够为影响人类的天气事件提供更及时、更本地化的预测。该模型可以原始卫星数据为基础，每小时生成一次高分辨率预报，为全球谷歌产品提供可靠的天气预报。根据介绍，天气预报的实用性往往取决于细节，以及时间和空间的分辨率。WeatherNext 3 可生成多种空间分辨率的每小时预报，从广阔的全球风型到局部地形都能保持物理一致性。借助 WeatherNext 3，谷歌能够以 5 公里分辨率呈现温度、湿度等关键地表变量，其他地表变量分辨率为 10 公里，风速等大气变量分辨率为 25 公里。WeatherNext 3 通过接入实时全球地球静止卫星数据拼图，让模型能够获得丰富、持续更新的大气视图，使模型可以每小时生成一次新预报，每次预报都基于最新的卫星观测数据，最高分辨率可达 5 公里。这一点至关重要，因为极端天气往往发展迅速。当风暴、锋面或降水系统突然出现时，快速更新周期和更高分辨率能够提供更早、更详细的洞察，帮助人们采取有效应对措施。WeatherNext 3 采用稀疏气象站观测数据训练，这使得模型能够在 5 公里网格上生成全球预报，并充分考虑地形等区域细节。这一突破对于拉美、非洲、亚太地区尤其重要。由于传统区域模型需要高昂的超级计算成本，这些地区历史上一直缺乏高分辨率天气预报。该模型将为这些地区数十亿人和本地企业带来本地化、高保真天气预报。除了提升分辨率和预报频率，该模型还专门针对可再生能源生产引入了针对性预测。模型可以预测 100 米高度（IT之家注：大致对应风力涡轮机高度）的风速，从而精准预测风电产量，同时还能提供高分辨率云量和太阳辐射数据，帮助太阳能电场估算地面接收到的光照。这些数据对于全球清洁能源规划至关重要，能够帮助电网运营商和可再生能源开发商准确预测清洁能源资产的发电量，并匹配用户需求。即日起，WeatherNext 3 将正式为谷歌搜索、Gemini 应用、谷歌地图、谷歌地图平台气象 API 和谷歌 Earth Engine 提供气象能力支持。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/198.htm", "publishedAt": "2026-09-03T15:15:52+00:00"}, {"title": "（更新：已恢复正常）ChatGPT、Grok、Claude、Cursor 集体突发故障", "summary": "【9 月 4 日 1:13 更新】目前文中提到的模型 / AI 工具官网“Status”主页均显示已经恢复正常。IT之家 9 月 3 日消息，据IT之家网友投稿反馈，ChatGPT、Grok、Claude、Cursor 等多款 AI 模型今晚突发故障。此外，用户请求 Codex 会出现“404 Not Found”错误。IT之家查询 Downdetector 报告获悉，美国用户使用 OpenAI、Claude、Grok、Cursor 服务时均出现问题。目前已有超过 12,000 份用户报告指出 OpenAI 存在问题，关于 Claude 的问题报告约有 1,200 份，关于 Grok 的问题报告约有 1,000 份。各方回应：OpenAI：ChatGPT 和 Codex 目前正出现问题。Anthropic：正在调查 Claude 出现的错误，将致力于修复工作。SpaceXAI：Grok 目前出现故障，正在调查服务中断。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/195.htm", "publishedAt": "2026-09-03T15:07:21+00:00"}, {"title": "沙特 HUMAIN 公布前沿阿语模型 humain-m3，由 MiniMax 受托开发", "summary": "IT之家 9 月 3 日消息，沙特阿拉伯主权财富基金 PIF 旗下人工智能企业 HUMAIN 当地时间今日公布了前沿阿拉伯语模型 humain-m3。该模型由 MiniMax 受托开发。humain-m3 基于 MiniMax 自家 MiniMax-M3 构建，并进行了 T 级阿拉伯语原生文本 Token（词元）规模的预训练。其在 7 个公开的阿拉伯语基准测试中取得了参测前沿模型中的最高平均分。humain-m3 率先在 HUMAIN Node 平台以研究和评估预览版本提供。HUMAIN 后续将发布开放权重版本。HUMAIN 首席执行官 Tareq Amin 表示：阿拉伯语的使用人口达数亿，但在人工智能前沿领域，它的代表性仍然严重不足。我们正通过 humain-m3 项目来改变这一现状。同时，通过 HUMAIN Node，我们将这种智能技术开放给开发者、研究人员和创新者，让他们能够进行实验、在此基础上进行开发，并创造下一代阿拉伯语人工智能体验。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/189.htm", "publishedAt": "2026-09-03T14:57:50+00:00"}, {"title": "别再让员工偷偷用 ChatGPT 了：用一台内网网关，把大模型变成\"自来水\"", "summary": "企业接入大模型，最难的不是技术，是秩序。本文分享一个开源思路：在内网部署一层轻量 API 网关（llm-proxy-tk），让大模型像公司内部的水电一样——统一接入、按人发卡、用量可视、随时断供。 一、先说三个扎心的现状 过去一年，我接触了不少中小企业和团队，发现大家用大模型的方式惊人地一致： 现状一： 密钥在群里裸...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502302", "publishedAt": "2026-09-03T10:23:46+00:00"}, {"title": "陈大年复出，入局大模型", "summary": "首秀逼近DeepSeek万亿旗舰", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/483600.html", "publishedAt": "2026-09-03T10:13:24+00:00"}, {"title": "Meta 这个百万级上下文模型，用数据换折扣，差价 21 倍", "summary": "Meta 最新 AI 大模型 Muse Spark 1.3 把上下文窗口拉到了 100 万 token，定价分了两档，差价超过 10 倍。 Meta 的新模型定位很明确：长周期、多步骤的 agentic workflow。能处理视频、图片和文档的多模态感知，工具调用一阶成功率比前代更高，代码能力在多个评测中「与前沿持平」。 定价策略值得细看。Muse Spark 1.3 分...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502295/meta-ai-muse-spark-1-3", "publishedAt": "2026-09-03T07:16:37+00:00"}, {"title": "每个开发者都能做的工业质检AI，RT-Thread 命题公布", "summary": "工厂质检是 AI 落地制造业最成熟的场景之一。产线上的划痕、裂纹、装配缺陷，机器视觉效率与准确度远高于人工。可要真正在工厂里铺开，事情没那么简单。缺陷检测高度定制，每一种工件、每一道工艺的缺陷都不一样，模型要重新采数据、标样本、训练、部署，走完这套流 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
