const DATA = {"date": "2026-11-04", "generatedAt": "2026-11-04T02:52:15Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "ROG XBOX 掌机 X 20 周年版上手：一次补齐遗憾的升级，体验更加出色", "summary": "去年这个时候，华硕和微软联合推出了一款 ROG XBOX 掌机 X，当时它舒适的人体工学设计，出色的屏幕素质、性能和散热体验、大厂联合定制 UI 就获得了外界的一致好评。时隔一年，在 ROG 品牌成立 20 周年之际，华硕又给广大玩家带来了 ROG XBOX 掌机 X 20 周年版，它可不是简单的换皮改色，而是在硬件上由内而外进行了全面升级。IT之家最近拿到了这款新品进行了体验，借此机会，我们就来聊聊升级后的 ROG XBOX 掌机 X 20 周年版表现究竟如何。一、外观升级这次的 ROG XBOX 掌机 X 20 周年版虽然在机身造型和按键布局上没有变化，但整体涂装细节做了定制化升级，这点倒是很像微软。首先就是机身换成了黑透底色，通过外壳可以隐约看到机身内部的一些电子元件和 PCB，特别是背部外壳可直观展现内部两个不小的散热风扇和顶部出风鳍片，质感拉满。外壳内层还做了很多类似电路管线的骨架纹理设计，视觉上更有机械感和科技感，还能作为外壳加强筋存在，一举两得。再来就是无处不在金色点缀设计，比如正面屏幕左右两侧上方的 4 个快捷按键，左右双摇杆的金色 RGB 光环。机身内部风扇外壳 + 热管 + 散热鳍片一整套做成了金色，标志性的斜切分割线也改为金色，左下角还新增了一块金色的 20 周年纪念徽章，黑金双色互相搭配，一实一透，尽显轻奢。当然，标志性的 XBOX 手柄同款握把设计也非常吸睛，表面做了防滑纹理，握持起来更加舒适、汗手也不易打滑和出现粘滞感。顶部的四个扳机按键面积够大，按压反馈和阻尼调校都是第一梯队，还做了人体工学微调，ABXY 按键也做了表面弧度优化。第二个升级点是摇杆和十字键，ROG XBOX 掌机 X 20 周年版这次换成了 TMR 摇杆，它继承了霍尔摇杆的耐磨和防漂移特性，使用寿命更长，灵敏度和输出信号表现更好，功耗还更低，适合需要高强度操作的游戏或微小精确操作的游戏，比如 FPS 游戏、格斗游戏、赛车游戏、硬核平台跳跃游戏等，不过摇杆的蘑菇头很难做出偏软手感，还是推荐大家买一副摇杆帽搭配使用。十字键采用可变式设计，可在 4 向和 8 向之间进行切换，格斗 / 2D 横版街机游戏操作上限更高。第三个升级是 ROG XBOX 掌机 X 20 周年版的屏幕，依旧是 1080P + 120Hz 的显示组合，但尺寸由 7 英寸升级到了 7.4 英寸，顶部黑边更窄，材质也由 LCD 升级到了 OLED，还是 ROG 最高规格的星云原画屏，支持 HDR。升级后的屏幕表面采用 DXC 抗反射涂层工艺，搭配 OLED 屏幕的广色域和 HDR 效果，画面对比度、色彩表现、峰值亮度以及响应时间全面提升，屏占比也更高，玩起游戏来更加沉浸。新版掌机还重做了内部散热，散热鳍片面积增加 11%，新款液态轴承风扇风量提升约 20%，优化了内吹设计，三相风道可吹透处理器、散热鳍片和内部屏幕区域，以换取更低的机身表面温度，长时间游玩性能释放更稳定，屏幕区域不烫手。总的来说，ROG XBOX 掌机 X 20 周年版在外观和硬件上相比去年推出的标准版做了很多改进和升级，整体使用体验会更好，由此换来的是机身净重的增加，新版机器重量为 756g 相比标准版重了 41g，好在整机重量是均匀分摊的，实际握持起来并不会觉得明显增重。另外，我们手上这个版本的包装内还附送了一个环保材质的掌机支架，以及一个线充一体的方形黑色 65W USB-C 口电源适配器。二、系统交互由于这台掌机是由 ROG 和微软 XBOX 团队合作开发的，因此在系统 UI 和功能交互上，拥有 2 套定制的界面和功能。首先系统底层是基于完整的 Windows 11 家庭版，但为了让核心体验更符合主机玩家习惯，开机后默认进入的是 XBOX 全屏主机风格首页，游戏列表和菜单标签都非常的 XBOX，以适应手柄操作。使用这套 UI 需要登录 XBOX 账号，页面中集成了最近游玩游戏卡片，XBOX 游戏库、XBOX 应用商店，XGP 订阅管理、远程串流、成就、好友列表等功能，如果你是 XBOX 主机的老用户，完全可以零成本上手。除了适配手柄交互逻辑外，掌机正面也单独加入了专属的 XBOX 西瓜键，它的作用就类似于 XBOX 手柄上的西瓜键，在不同场景和主页中会提供多种快捷功能。比如，任意场景长按会进入多任务后台页，用户可以在定制主页、全屏 App、全屏游戏以及 Windows 桌面间切换，也可以关闭标签页，清理后台。短按则是快捷呼出 XBOX Game Bar 页面，融合了大部分常用的快捷功能，或进行迅疾回到主页、切换游戏平台等操作。ROG 这边则提供了一套奥创中心的交互 UI，通过屏幕左侧的奥创图标快捷键可立即呼出奥创 SE 侧边栏，方便用户对当前游戏的硬件设置快速调整，比如屏幕亮度、音量、性能模式、刷新率、功耗等设定。以上所有操作都可以完全用手柄按键和摇杆完成，无需在按键和触屏点按之间反复“横跳”，彻底解决了 Windows 桌面模式和 XBOX 主机页面、Steam 大屏模式交互割裂的问题，操作起来非常丝滑。更加惊喜的是，ROG 还定制了 BIOS 电源管理系统，大幅提升了休眠和唤醒体验，睡眠状态下短按电源键不仅秒唤醒，离电睡眠时的待机耗电也大幅减少，唤醒时后台游戏还能直接玩不崩溃、不闪退，体验足以媲美主机系统的电源管理。三、游戏性能ROG XBOX 掌机 X 20 周年版的核心硬件配置和此前发布的标准版没有明显区别，主要还是屏幕、外设部分的更新。CPU 依旧是 AMD 锐龙 AI Z2 Extreme，8 核心 16 线程，4nm 制程工艺；GPU 集成了 RDNA3.5 架构的 Radeon 890M，拥有 16 个 CU 核心；存储组合上标配 24GB LPDDR5x 8000MHz 的板载内存 + 1TB PCIe 4.0 的三星固态硬盘；电池还是 80Wh；再配合前面提到的 7.4 英寸 1080P 120Hz OLED 星云原画屏，整体配置放在掌机中妥妥的旗舰水平。在奥创控制中心 SE 中，ROG 给到了 4 种性能预设，分别是 13W 静音档、17W 性能档、25W 增强档（离电）以及最高 35W 增强档（插电），我们直接对几款主流单机游戏进行实测，看看这款掌机在不同功耗预设下，性能表现如何。1、《剑星》《剑星》这款游戏由于没有光线追踪，因此在 1080P 分辨率下的游戏优化是比较出色的，而在高分辨率下，游戏对显存容量的要求比较敏感。我们选择的测试设置为 1080P 分辨率 + 高画质预设 + FSR 平衡，测试场景为固定 BOSS 战斗，经过实测：13W 静音档下，游戏平均帧数为 35 帧；17W 性能档下，游戏平均帧数为 42 帧；25W 离电增强档下，游戏平均帧数为 45 帧；35W 插电增强档下，游戏平均帧数为 55 帧；从结果来看《剑星》的优化确实不错，在功耗最低的 13W 静音档都可以跑 35 帧的战斗场景性能，而户外跑图时建筑内场景下最多可以跑到 39 帧左右。17W 和 25W 的游戏平均帧数相当接近，只有 3 帧的差距，因此如果想要玩得更久一点，开 17W 性能档，锁 40 帧是个不错的选择。插电后的 35W 增强档，平均帧数又有 10 帧的提升，只要稍微调整一下部分画质选项，完全可以稳定在 60 帧以上。2、《仁王 3》相比前面的《剑星》，《仁王 3》的游戏优化就没那么好了，游戏里满是大红大黑大绿的场景，即使在 1080P 分辨率下，对于图形性能的要求也非常高。我们特意选择了一个典型的 BOSS 战，那就是和井伊直虎并肩战斗的支线任务“龙潭寺的怨灵”，AI 队友加 BOSS 满屏 AOE 大招，压力直接拉满。画质设置为 1080P + 高画质 + FSR 帧生成，经过实测：13W 静音档下，游戏平均帧数为 27 帧；17W 性能档下，游戏平均帧数为 35 帧；25W 离电增强档下，游戏平均帧数为 48 帧；35W 插电增强档下，游戏平均帧数为 55 帧；整体而言，《仁王 3》在 17W 和以下功耗段只能跑到平均 30 多帧的水平，不属于理想的游戏功耗区间，但在离电 25W 的增强档位下，平均 48 帧的战斗帧数玩起来还是比较舒服的，插电 35W 下平均帧数则来到 55 帧，这时候用奥创中心自带的帧数限制功能进行锁帧，游玩体验就很不错了，跑图的平均帧数每档要再高出 5 帧甚至更多。3、《生化危机：安魂曲》《生化危机：安魂曲》在今年推出的一众新游戏中性能开销力压群雄，即使是光栅部分也很考验硬件水平。我们直接开一个新档，在游戏开始前往鹪木旅馆的那段雨天场景进行跑图，画质设置为 1080P + 高画质 + FSR 平衡，然而我们发现此时 25W 和 35W 下平均帧数丝毫没有差别，都是 43 帧，检查一下并没有开启垂直同步，而且继续调低 FSR 超分档位或者把几个最吃显存的画质选项全部拉到低都没用。好在游戏设置中还提供了 FSR3 帧生成选项，开启后游戏帧数大幅提升，经过实测：13W 静音档下，游戏平均帧数为 38 帧；17W 性能档下，游戏平均帧数为 61 帧；25W 离电增强档下，游戏平均帧数为 72 帧；35W 插电增强档下，游戏平均帧数为 80 帧；13W 静音档的平均帧数由原本的 25 帧暴增到 38 帧，17W 性能档就能稳定在 60 帧以上，35W 插电增强档更是能突破稳定在 80 帧左右，画面也不会很糊，强烈建议大家同时开启 FSR 超分和帧生成。4、《影之刃零》最后一款游戏我们来看下刚发售不久的高速动作 ARPG 游戏《影之刃零》，玩过这款游戏的小伙伴都知道，本作的性能优化非常出色，除了 A 卡存在明显 BUG 外，网友表示掌机设备都能跑得动，所以游戏解禁后我们也赶紧在 ROG XBOX 掌机 X 上试试效果。这款游戏我们选择了初见玉儿那个铃铛存档点，顺着溪流一路向前跑图 + 打怪，画质设置为 1080P + 高画质 + FSR 平衡，经过实测：13W 静音档下，游戏平均帧数为 36 帧；17W 性能档下，游戏平均帧数为 47 帧；25W 离电增强档下，游戏平均帧数为 56 帧；35W 插电增强档下，游戏平均帧数为 63 帧；万万没想到《影之刃零》居然是以上 4 款测试游戏中表现最好的一款，仅用 13W 静音档就能在高画质下跑到平均 36 帧的表现，17W 性能档就能摸到 50 帧了，25W 离电增强档就可以确保 50 帧以上的体验，而在插电 35W 增强档下，我们测试的场景中最高跑到了 71 帧，而且不是在某个黑漆漆的山洞里，优化是真的强。另外，以上 4 款游戏如果均采用 25W 离电增强档进行游玩，平均续航水平都是 2 小时左右，如果在日常通勤路上，短途出行乘坐飞机、高铁等交通工具上，或者睡前玩 1-2 小时，那么这个续航水平足够了。至于独立游戏，比如《黑帝斯》《空洞骑士：丝之歌》《星露谷物语》这些经典的老游戏，即使画质开到全高，也只要 7W 的功耗就能跑满这款掌机屏幕的 120Hz 上限，画面清晰、操作丝滑，ROG XBOX 掌机 X 玩起来没有任何压力，体验非常舒适。由于超低的功耗，玩这类独立游戏的续航通常也能达到 6-8 个小时，非常适合碎片化时间开一把，完全不必有续航焦虑。当然，大家也不要觉得只要是独立游戏性能要求就不高，在测试中我们尝试了一款还未发售但有试玩版 Demo 的横版动作肉鸽游戏《零境：入侵》，它的画面非常精致，在高画质预设下，ROG XBOX 掌机 X 开到 25W 离电性能档也不能完全跑满 60 帧，必须插线激活 35W 增强才能保障 60 帧游戏体验。后来我们打开画面设置发现，这款游戏支持 FSR 超分和 HDR，并且在高画质预设下，FSR 超分默认是原始（原画）档位，需要再降低一档 FSR 超分到质量档才能完全跑到 60 帧以上，更恐怖的是游戏还有超高画质档位可供选择，可见现在新游戏对于硬件性能的要求是越来越高了。经过一番体验，我们对这台 ROG XBOX 掌机 X 20 周年版的整体性能表现概括起来就 3 句话：主流单机游戏 1080P + 高画质 + FSR 超分，稳定 50 帧以上的帧数；成熟独立游戏 1080P + 高画质 + FSR 超分，稳定 120 帧以上的帧数；吃性能新独游 1080P + 高画质 + FSR 超分，稳定 60 帧以上的帧数；这样的表现，对于一台主打碎片时间游玩的轻度游戏设备来说，已经相当不错了。四、总结整体而言，ROG XBOX 掌机 X 20 周年版是目前 Windows 阵营中体验最为出色的掌机设备，无论是外观设计、手感和握持体验、屏幕素质和性能、散热和续航表现都展现出了大厂的实力，各方面都没有明显短板。不仅如此，ROG 还同微软 XBOX 强强联合，定制了最适合掌机设备的系统 UI 和交互，如果你想要一台可以随时拿起来玩游戏的掌机，ROG XBOX 掌机 X 20 周年版毫无疑问是个不错的选择。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/021/940.htm", "publishedAt": "2026-11-04T01:44:24+00:00"}, {"title": "国内首款：网易《燕云十六声》官宣 11 月 24 日实装英伟达 DLSS 5", "summary": "IT之家 11 月 4 日消息，网易旗下开放世界武侠游戏《燕云十六声》官方宣布将于 2026 年 11 月 24 日正式实装英伟达 DLSS 5 技术，成为全球首批、国内首款支持该技术的游戏（北美地区将提前一天，于 11 月 23 日先行上线）。DLSS 5 是英伟达在 2026 年 3 月 GTC 大会上公布的新一代实时神经渲染技术，官方将其定位为“图形领域的 GPT 时刻”。与单纯提升分辨率的传统超采样不同，DLSS 5 以游戏每帧的颜色和动态向量为输入，利用 AI 模型为场景生成与原始 3D 内容紧密对齐的拟真光照和材质，最高可在 4K 分辨率下实时运行。据介绍，《燕云十六声》此次接入的是 DLSS 5 中的 3D 引导神经渲染方案。该方案以游戏引擎渲染的帧为不可更改的基础，在完整保留美术人员设计的几何结构、纹理和光照缓冲的前提下，由神经网络实时重建复杂光照与材质细节，目标是提升光照与角色质感，同时避免模糊或清晰度损失。《燕云十六声》官方表示，11 月 24 日上线的版本历经英伟达多轮专项调优，在画面效果与运行帧率之间实现了更好的平衡。官方称后续将继续与英伟达保持技术合作，持续更新迭代渲染效果。需要指出的是，DLSS 5 目前仅对 RTX 50 系列显卡生效，不过英伟达此前已经承诺引入 RTX 40 系列显卡。敬请期待。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/021/935.htm", "publishedAt": "2026-11-04T01:42:55+00:00"}, {"title": "曝字节将大面积限制员工在内部自费使用 Claude、Codex 等", "summary": "IT之家 11 月 4 日消息，据大厂日爆 11 月 3 日爆料，字节迎来新规，将大面积限制 Claude、Codex 等个人账号的内部使用。爆料称，本月起，字节跳动将会对所有 L4 级别的代码仓库和飞书文档进行外部 AI 访问封禁，覆盖范围全公司，员工个人采买的 AI 账号不能再用。爆料还称，通知自上周发出后，引起了内部一些讨论，字节跳动技术副总裁洪定坤还在内网进行了详细回应，比如“L3 及以上内容一旦有泄露，后果是非常严重的”、“推广产品不需要用这种禁掉其他选择强迫使用的方式，因为这样效果很差”。据 The Information 今年 8 月报道，字节跳动创始人张一鸣在上个月的 Seed 团队全体会议上明确表示，即使意味着暂时落后于竞争对手，公司也不会依赖 AI 蒸馏技术来改进其模型。延伸阅读在字节跳动的职级体系中，L4 通常对应原 3-1 级别，属于团队 TL 或初级经理，是核心技术骨干与管理者的分水岭。L4 级别的代码仓库，几乎沉淀了公司全线业务的核心资产与底层架构，这也是此次封禁被内部高度重视的原因。这并非字节跳动首次收紧外部 AI 工具的使用。2025 年 5 月，字节跳动安全与风控部门曾发布邮件称，出于防范数据泄露风险的考虑，自 2025 年 6 月 30 日起内部分批次禁用第三方 AI 开发软件，包括 AI 编程工具 Cursor、Windsurf 等，并将旗下编程助手 Trae 作为替代方案。此次将封禁范围扩大至 L4 代码库与飞书文档，是进一步收紧外部 AI 的使用空间。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/021/917.htm", "publishedAt": "2026-11-04T01:12:30+00:00"}, {"title": "OpenAI 高管会议室发现“窃听”设备后，知情人士称员工多年不断反映安全漏洞", "summary": "IT之家 11 月 4 日消息，今年 10 月，OpenAI 在一间高管会议室发现了被人偷偷安装的录音设备。多名前员工得知消息后却不觉得意外。据路透社援引 5 名知情人士消息称，早在 2022 年底 ChatGPT 问世之前，就有员工对 OpenAI 的安全管理提出质疑，并向公司高层和董事会反映问题。部分员工在沟通后认为，管理层更关心如何追赶谷歌、Anthropic 等竞争对手，对安全问题的重视程度反倒不够。这些员工认为，OpenAI 的安全管理十分松懈，外部人员甚至外国政府都能相对容易地获取公司的敏感技术信息。知情人士举例称，任何拥有代码访问权限的 OpenAI 员工，都可以查看公司大量项目的底层技术细节。另据两名知情人士透露，OpenAI 目前已开始调整安全策略，由负责产品开发的高级主管蒂博 · 索蒂奥牵头加强内部系统防护。员工多年来持续向管理层反映安全漏洞，也反映出 AI 行业面临的两难处境。2022 年底 ChatGPT 推出后，AI 技术逐渐成为美国的战略资产，美国企业因此承受着更大的压力，必须防止自身技术落入外国竞争对手手中。但增加安全防护措施也可能拖慢 AI 技术研发，甚至给 OpenAI 和 Anthropic 筹划的大规模 IPO 增添障碍。今年 4 月离开 OpenAI 的前研究员威尔 · 德皮尤就曾指出，面对激烈竞争，AI 企业领导者不能为了安全而牺牲速度。对于员工提出的安全隐患，以及管理层没有采取行动的指责，OpenAI 发言人埃拉娜 · 维德曼回应称，OpenAI 是全球最频繁遭到攻击的机构之一，公司为此投入巨资建立安全防护体系，防范内部人员、网络犯罪分子及国家行为体发动的攻击。据IT之家此前报道，10 月 13 日，美国司法部宣布，联邦执法人员逮捕了一名 35 岁的沙特阿拉伯公民阿卜杜勒拉赫曼 · 阿尔福赞，指控他在 OpenAI 高管会议室秘密安装了一台藏在卫生纸里的录音设备。案发时，阿尔福赞是 OpenAI 的一名工程师。按照 OpenAI 过去的代码管理方式，只要员工拥有代码访问权限，就能查看许多项目的技术细节，与本人工作毫无关系的敏感项目也不例外。原因在于，OpenAI 将大部分代码集中存放在一个业内称为“单体代码仓库”（monorepo）的系统中。它规模庞大、结构复杂，过去或能劝退部分潜在攻击者，但 AI 智能体已经具备了检索和梳理如此庞大资料的能力。OpenAI 过去还将大量研究文档存放在 GitHub 和 Slack 上。知情人士称，部分员工因此担心，只要有意搜寻，公司内部的关键信息仍可能被他人获取。不过，其中一名知情人士及 OpenAI 均确认，公司对敏感项目采取了访问限制。OpenAI 表示，公司许多最敏感的项目都存放在独立的代码仓库中，访问权限受到严格控制。单体代码仓库既不包含 OpenAI 的全部代码，也不包含模型的关键技术细节，例如决定模型如何运行的数值参数，即模型权重。另据 3 名熟悉公司内部运作的人士透露，OpenAI 过去还存在内部工具缺乏定期安全审查的问题，包括研究人员用于对新模型进行压力测试的“沙盒”环境。员工经常按照工作需要修改工具，但修改内容未必经过安全测试，因此可能留下供外部攻击者利用的漏洞。OpenAI 对此回应称，在 2024 年 10 月加入公司的首席信息安全官戴恩 · 斯塔基领导下，公司采取了有力的安全管理措施，并定期对内部工具开展安全审查。相关阅读：《OpenAI“窃听”案迎来新进展：当事沙特工程师寻求保释，否认潜逃意图》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/021/892.htm", "publishedAt": "2026-11-04T00:00:32+00:00"}, {"title": "微软 Win11 AI PC 路线图曝光：4 档硬件，8GB 内存也有 AI 入场券", "summary": "IT之家 11 月 4 日消息，消息源 @9550pro 昨日（11 月 3 日）在 X 平台发布推文，分享了一张题为“Windows 是混合智能之家”的幻灯片，展示了微软“混合智能”（Hybrid Intelligence）AI PC 路线图。IT之家此前报道，太平洋时间 10 月 7 日上午 10 点（北京时间 10 月 8 日凌晨 1 点）在美国旧金山举办的发布会上，微软提出“混合智能”（hybrid intelligence）理念，强调通过混合架构，结合云端 AI 与本地计算能力，在 Windows 11 系统上实际处理用户任务。根据曝光的“混合智能”AI PC 路线图，微软将 AI 硬件划分为四个层级，其中最低的 Tier 0 层级涵盖配备 8GB 内存的 Windows PC，处理器包括英特尔酷睿 3/4 系列、AMD 锐龙 100/200 系列，以及骁龙 X 或 X Plus。科技媒体 Windows Central 解读认为，即便没有高内存和顶级 NPU，普通用户仍可通过云端获得 AI 能力。Tier 1 则是 16GB 至 64GB 内存的 Copilot+ PC，覆盖从骁龙 X2 Plus 到 AMD Ryzen AI MAX+ 400 等多种配置。Tier 2 面向需要在本地构建、运行 AI 模型的开发者与创作者，硬件包括英特尔酷睿 Ultra Next、NVIDIA RTX Spark 和 AMD Ryzen AI MAX+ 400。最高层级则是内存超过 128GB 的超级计算机，用于本地运行前沿大模型，涉及英特尔 Crescent Island、NVIDIA GB300 DGX Station 等专业平台。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/021/886.htm", "publishedAt": "2026-11-03T23:21:17+00:00"}, {"title": "OpenAI 证实：ChatGPT 搜索查询量已达谷歌 20%", "summary": "IT之家 11 月 4 日消息，据《商业内幕》今天（4 日）凌晨报道，OpenAI 挑战谷歌搜索现已“初见成效”。ChatGPT 消费者产品负责人亚当 · 弗莱证实：ChatGPT 上的搜索类查询量，约相当于谷歌搜索查询量的 20%。今年夏天，皮尤研究中心发布的一份调查报告显示，搜索信息是美国成年人最常见的 AI 使用场景，42% 的受访者曾用 AI 搜索信息。工作用途排在第二位，38% 的受访在职成年人曾用 AI 处理工作任务。娱乐、获取新闻和寻求医疗建议等用途则相对少见。这次调查并非专门针对 ChatGPT。报道指出，ChatGPT 在 AI 聊天机器人中最受欢迎。44% 的受访美国成年人使用过 ChatGPT，排名第二的 Gemini 则只有 24%。据IT之家了解，去年，谷歌母公司 Alphabet CEO 桑达尔 · 皮查伊在接受彭博社记者艾米莉 · 张采访时也谈到了 AI 聊天机器人与谷歌搜索之间的竞争。皮查伊当时说：“聊天机器人的用户规模达到了数亿人，但我们的搜索查询量也在增长。所以我认为，这远远谈不上是零和博弈。举个类似的例子，TikTok 出现后，大家都开始使用 TikTok，但 YouTube 在那段时间同样保持增长，而且表现非常出色。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/021/885.htm", "publishedAt": "2026-11-03T23:16:23+00:00"}, {"title": "AMD 苏姿丰官宣 EPYC Venice 处理器已赚钱出货，首批 OEM 整机第四财季上市", "summary": "IT之家 11 月 4 日消息，在 2026 财年第三财季（2026 年 6 月 28 日～2026 年 9 月 26 日）财报电话会议上，AMD 首席执行官苏姿丰表示，第六代 EPYC“Venice”服务器处理器已在 2026 年第三财季开始产生营收出货，首批基于该处理器的 OEM 整机系统预计将于第四财季（2026 年 9 月 27 日至 2026 年 12 月 26 日）上市。在 AMD 发布的第三季度财报中，公司整体营收达 134 亿美元（IT之家注：现汇率约合 893.16 亿元人民币），其中数据中心业务营收约 85 亿美元（现汇率约合 566.56 亿元人民币），同比增长 97%，成为业绩增长的核心引擎。苏姿丰称，Instinct GPU 与 EPYC CPU 的需求持续增强，公司将在第四季度扩大 Helios 机架级 AI 系统和 Venice 处理器的生产规模。Venice 是 AMD 面向云、企业与高性能计算市场的第六代 EPYC 服务器处理器，采用台积电 2 纳米工艺和 Zen 6 架构。AMD 此前表示，该系列在性能、能效和计算密度方面均有显著提升，客户需求达到“前所未有的高度”。AMD 同时披露，Anthropic、Meta、微软、OpenAI 和甲骨文云基础设施（OCI）已在首批 Helios 机架级系统上运行模型与工作负载；这些系统搭载 Instinct MI450 系列 GPU 和第六代 EPYC CPU。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/021/881.htm", "publishedAt": "2026-11-03T22:51:43+00:00"}, {"title": "OpenAI ChatGPT 最新数据：周活跃用户达 12 亿，两个月新增 2 亿", "summary": "IT之家 11 月 4 日消息，当地时间 11 月 2 日 OpenAI 消费者产品负责人 Adam Fry 在纽约举行的一场 OpenAI 活动期间接受了 Big Technology 的采访。他透露，ChatGPT 每周活跃用户数量已经达到 12 亿之高。Fry 表示，ChatGPT 的用户增长速度正在进一步加快。过去 60 天内，ChatGPT 的周活跃用户从 10 亿增长至 12 亿，新增约 2 亿用户。他将这一增长速度概括为每 30 天增加约 1 亿用户。搜索业务方面，Fry 透露，OpenAI 对 ChatGPT 内部的搜索类查询进行了统计，并与 Google 的搜索查询量进行比较，结果显示，ChatGPT 当前处理的搜索类查询量约为 Google 的五分之一，每周生成图片达到 15 亿张，语音输入和语音对话功能的合计周活跃用户达到 2.5 亿。Fry 解释称，只要用户提出的问题触发了 ChatGPT 的联网搜索，就会被计为一次搜索。相关查询包括人物、地点、事物的信息检索，以及需要获取最新信息的金融、健康等问题。单纯的写作和编程请求则不属于这一统计范畴。Fry 还提到，ChatGPT 的语音输入和语音对话功能合计拥有 2.5 亿周活跃用户，每周生成的图片数量达到 15 亿张。这表明语音交互和图像生成也已经成为 ChatGPT 的重要使用场景。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/021/878.htm", "publishedAt": "2026-11-03T22:39:56+00:00"}, {"title": "AI教AI开车！百度首次披露Apollo World世界模型，让无人驾驶突破“不可能三角”", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/tIt75FRqU2hwy4eWrOIu?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-03T21:26:32+00:00"}, {"title": "构建面向 Agentic 推理的下一代 LLM 推理引擎", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/YwAayF1ylWb7oN4P0lyC?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-03T15:40:16+00:00"}, {"title": "从模型调用到任务交付：MaaS 如何走进 Agent 生产", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/zZutPTX8bsr6NWQYNC3A?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-03T14:40:18+00:00"}, {"title": "AI 训练 AI！百度首次披露 Apollo World 世界模型，让无人驾驶突破“不可能三角”", "summary": "“世界模型，重点不是渲染的画质是否好看，而是模拟器是否能忠实还原现实物理规律和行为的因果”。11月3日，在深圳举行的百度AI Day·Apollo专场上，百度Apollo首次披露面向物理AI的智能体驱动全模态世界模型Apollo World，并提出世界模型 “2+3”判断标准。目前，该模型已用于萝卜快跑全球化测试与验证，助力无人驾驶规...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503374", "publishedAt": "2026-11-03T11:50:21+00:00"}, {"title": "模型谁都买得到，拉开差距的是AI生产力系统", "summary": "AI的下一程是生产力系统之争", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/507448.html", "publishedAt": "2026-11-03T11:13:49+00:00"}, {"title": "GPT-6 Astra 爆改 Qwen 大脑：只动 0.016% 参数，数学成绩疯涨", "summary": "我「编程」我自己#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1687285?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-11-03T07:22:57+00:00"}, {"title": "小米斩获乌镇峰会双料大奖：小米集团获“杰出贡献奖”，小米具身基座模型获“领先科技奖”", "summary": "11月3日，小米方面披露，小米集团获得2026世界互联网大会“杰出贡献奖”创新突破 oogle 教育业务副总裁兼总经理 Chris Phillips 在接受《纽约时报》采访时表示，搜索与人工智能已经深度融合。如果学校选择彻底关闭 AI 功能，学生将无法访问 Google Search，尝试使用搜索服务时，只会看到由学校提供的停用提示信息。据科技媒体 TechCrunch 报道，学校目前无法单独关闭 Google Search 中的 AI 功能，同时保留传统搜索服务。对于希望学生继续通过搜索引擎查找资料、比较信息来源，但不希望他们接触 AI Overview 等生成式 AI 功能的教育机构而言，这意味着需要在两者之间作出选择。谷歌此次调整还涉及 AI 辅助学习功能 Guided Learning（IT之家注：该功能旨在通过提问、分步骤解释和互动练习，引导学生自行理解问题，而不是直接提供答案）。谷歌已宣布将 Guided Learning 引入 Google Classroom，并计划将相关能力整合到面向学生账户的 Google Search 中。谷歌表示，Guided Learning 将首先在美国部分学校开展试点，收集教师反馈后再逐步扩大覆盖范围。按照官方公告，该公司希望通过这一功能，让 AI 在课堂中承担辅助学习的角色。在此之前，部分教育机构和家长对 AI 工具可能影响学生独立思考、作业完成方式及学习过程表达了担忧。谷歌此次将相关工具调整为默认关闭，需要学校主动启用，但搜索服务与 AI 功能之间的绑定也引发了新的讨论。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/021/880.htm", "publishedAt": "2026-11-03T22:47:23+00:00"}, {"title": "从提效到扩能：AI 驱动小团队的能力突破与组织演进｜AICon北京", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/DliBOqGrOaxaXvqlBjGR?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-03T10:00:00+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "给 AI 业务单独划一块地：帆软怎么重新安排事、人和组织｜AICon北京", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/BGkTakB51rl6ybIh4sYJ?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-04T10:00:00+00:00"}, {"title": "全球最大视频平台 YouTube 推广 AI 配乐工具，帮创作者化解音频版权纠纷", "summary": "IT之家 11 月 4 日消息，全球最大视频平台 YouTube 今天（11 月 4 日）发布博文，宣布面向全球内容创作者，推广 YouTube Studio 中的“替换歌曲”（Replace song）工具功能，让其更方便地处理视频中的版权音乐。IT之家援引博文，“替换歌曲”工具此前已在美国上线，该功能可在创作者收到音频版权申诉后，即时生成四首独特的免版税器乐背景音乐，用于替换受版权保护的音频；替换完成后，相应的 Content ID 版权声明将自动移除。操作方面，创作者进入 YouTube Studio 的“替换歌曲”工具后，在“建议”选项卡下点击新增的“创建”按钮，即可获得四段各约三分钟的器乐曲目，并可在时间线上循环播放或调整音量。YouTube 表示，该功能旨在减少音频版权申诉对创作流程的干扰，让创作者在保留视频原有氛围的同时，快速选择符合版权安全要求的背景音乐。工具目前仅生成器乐背景音乐，暂不支持人声或完整歌曲创作。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/021/877.htm", "publishedAt": "2026-11-03T22:29:25+00:00"}, {"title": "Siri AI 将实现跨 App 办事：苹果开放“应用技能”，一句话串联多个应用任务", "summary": "IT之家 11 月 4 日消息，科技媒体 9to5Mac 今天（11 月 4 日）发布博文，报道称苹 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
