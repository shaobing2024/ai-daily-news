-27T09:43:30+00:00"}, {"title": "亚马逊云科技发布 Loom，一个用于在企业级规模上管理 AI 代理的开源参考平台", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/JDgONrm19ROF1qHzfOQO?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-27T09:24:39+00:00"}, {"title": "模型开源，力破西方偏见", "summary": "2026年7月，AI行业发生了一起戏剧性的安全事件： 全球最大的AI开源社区Hugging Face遭到OpenAI模型的自主入侵。面对上万条攻击日志，安全团队起初试图用商业模型进行分析，却处处受阻。最终，他们转而本地部署了中国模型GLM-5.2，数小时内就完成了整个取证分析流程。 要知道，美西方原本长期攻击开源模型的安全问题。 美...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/480605", "publishedAt": "2026-07-27T09:01:39+00:00"}, {"title": "美团方面否认 LongCat 模型负责人裴鹏离职传言", "summary": "IT之家 7 月 27 日消息，近日，有消息称美团 LongCat 团队基础模型负责人裴鹏即将离职。据时代周报向美团方面求证，对方表示，该消息不属实。公开资料显示，裴鹏毕业于北京大学，2023 年加入美团，最初出任计算和智能平台部基座模型团队预训练负责人，后担任 LongCat 团队基础模型负责人，全面牵头美团大语言模型、多模态模型与 Agent 智能体模型的研发工作。裴鹏主导 LongCat 系列基础模型研发，推进万亿参数大模型 LongCat-2.0 的研发与落地。据IT之家此前报道，6 月 30 日，美团发布新一代万亿参数大模型 LongCat-2.0；7 月 6 日，LongCat-2.0 正式开源。LongCat-2.0 总参数 1.6T，平均激活约 48B，是业界首个在五万卡国产算力集群上完成推理的万亿参数模型。相关阅读：《美团全场景 AI Agent 平台 CatPaw 发布，已在内部大规模落地》《美团 AI“小团”升级代理执行能力：从 AI 规划，到直接帮你搞定》《业界首个：美团 LongCat-2.0 发布，国产芯片上跑出的万亿参数模型》《美团万亿参数大模型 LongCat-2.0 开源，同步开放国产卡推理代码》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/142.htm", "publishedAt": "2026-07-27T09:00:04+00:00"}, {"title": "抖音宣布优化适龄推荐算法，引入多模态大语言模型", "summary": "IT之家 7 月 27 日消息，抖音集团今日发布公告称，为了切实缓解家长的监护焦虑，并回应未成年人的成长需求，抖音近期全面升级了未成年人模式的核心引擎 —— 适龄推荐算法。当用户开启未成年人模式并设置出生年月后，专属的适龄推荐算法便会随之启动。据介绍，本次对未成年人模式推荐算法的全面升级，核心在于引入了前沿的多模态大语言模型（MLLM）技术，构建了一套智能化、精细化的内容识别与分发体系。多模态大语言模型具备强大的跨模态语义理解能力，能够综合处理文本、图像、音频等多种信息，并综合考量内容的认知复杂度、价值观导向等，为每一条视频判断其适宜观看的年龄范围，为后续的适龄推荐提供技术基础。首先，平台通过未成年人优质多模态大模型对海量信息进行筛选，识别出适宜未成年人观看的候选内容；再由人工专家层层筛选，甄选出兼具正向价值观的优质内容，将其纳入未成年人专属内容池。随后，适龄识别多模态大模型会对这些人审后的优质内容进行深度理解与识别分类，并输出适宜的年龄段信息。IT之家注意到，官方还称，目前，平台采用了精细化的年龄划分标准，进行优质内容适龄推荐，这种适龄推荐机制能够适配不同阶段未成年人的认知特点与心理变化，让内容供给的颗粒度更加细腻。与此同时，算法还会结合孩子的内容偏好进行推荐。这种“人工筛选 + 大模型分类 + 适龄推荐 + 内容偏好匹配”的多重保障，在平台能够收集到的信息范围内最大可能地让每一次推荐内容都能更契合孩子的认知发展需求，同时，孩子也可以通过长按点击“不感兴趣”按钮，进行实时反馈。目 体网址，仍然可以直接访问。不过，从此次事件来看，部分 Claude 分享页面在被谷歌抓取时似乎并未设置“noindex”标签，因此最终被搜索引擎收录，并随着相关链接在社交媒体传播而曝光。这些被公开的聊天内容涉及多个敏感领域，包括律师之间讨论法律策略、技术故障排查、带有性暗示的私人聊天，以及其他包含个人隐私和敏感信息的对话。目前谷歌已经移除了大部分相关搜索结果，如今再次使用“site:claude.ai/ share”进行搜索，已经无法找到任何相关页面。这一事件也再次暴露出一个日益值得关注的问题：随着人们越来越依赖功能强大的 AI 工具，在享受便利的同时，也可能面临隐私泄露的风险。截至IT之家发稿，Anthropic 尚未针对此事发布公开声明。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/112.htm", "publishedAt": "2026-07-27T08:26:39+00:00"}, {"title": "全新一代宝马 X5 国产版官图发布：燃油和纯电可选，2027 年上市", "summary": "IT之家 7 月 27 日消息，宝马今日发布了旗下中大型 SUV—— 全新一代 X5 国产车型的官方图片。新车将同步推出燃油版与纯电动版两种动力形式，计划于 2027 年正式上市销售。IT之家注意到，全新一代 X5 在造型上全面融入了宝马“新世代”设计理念。整车通过大面积连贯型面处理，以更为简洁的设计语言弱化了传统元素对车身视觉的切割感，从而塑造出更加完整、流畅的车身轮廓，同时进一步优化了整车的空气动力学性能。国产版海外版灯光系统方面，新车搭载了创新的动态数字 LED 灯组，并首次将日间行车灯与近光灯整合于同一设计单元内。用户可在“双斜线”与“双 X”两种灯光图形间自由切换：前者延续品牌新世代设计特征，后者则进一步强化了 X 家族的身份标识。车身配色方面，新车将提供 8 种车漆选择，除个性化定制丹泉石蓝外，还专为中国市场推出了开普敦铜与磨砂尤加利绿两款专属色。车身侧面，前后轮拱及侧裙以硬朗利落的筋线勾勒，配合造型独特的轮圈，营造出鲜明的运动气质。尾部则采用平直狭长的尾灯设计，灯腔内部结构复杂精致；尺寸可观的后扰流板也进一步强化了整车的运动氛围。内饰方面，新车延续了宝马最新的设计思路，搭载超感智能座舱，集成视平线全景显示与向心中控等前沿交互科技。值得关注的是，全新 X5 首次在车内配备了副驾娱乐屏，并针对中国市场量身定制了 AI 智能体验与数字娱乐生态。材质运用上，新车首次引入天然岩石面板，搭配璀璨水晶质感组件及环抱式光韵饰板，显著提升了座舱的高级感与精致度。空间方面，3165 毫米的轴距为车内带来了更为宽裕的乘坐空间；全新设计的副驾及后排舒享座椅、后排双电动腿托，以及新增的悬浮式巨幕，共同打造出更具豪华感的后排乘坐体验。据官方介绍，全新 X5 将基于新一代软件平台对整车底层逻辑进行重构。其全场景智能驾驶辅助系统由宝马与 Momenta 联合开发，旨在为用户提供更加自然、直观的人车交互体验。动力方面，燃油版车型将搭载第四代 B58 3.0 升直列六缸涡轮增压发动机，最大功率达到 294 千瓦，较前代提升 5%；峰值扭矩 580 牛 · 米，提升幅度达 11.5%。在燃油经济性同步优化的前提下，新车 0-100 公里 / 小时加速时间缩短 0.2 秒至 5.3 秒。纯电动版本则基于 800V 高压平台打造，采用大圆柱电池，并整合宝马驾控超级大脑与新世代电驱技术，在 CLTC 工况下可实现超过 1000 公里的纯电续航里程。此外，新车配备全新升级的 BMW xDrive 智能四驱系统，配合更宽的轮距以及 315 毫米的后轮胎宽，在稳定性、通过性与脱困能力方面均有进一步强化。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/085.htm", "publishedAt": "2026-07-27T07:55:39+00:00"}, {"title": "美团 AI“小团”升级代理执行能力：从 AI 规划，到直接帮你搞定", "summary": "IT之家 7 月 27 日消息，美团宣布旗下本地生活 AI 原生助手“小团”全面升级，“从 AI 规划，到直接帮你搞定”。据介绍，新版“小团”在搜索、问答和决策辅助之外，进一步升级代理执行能力：用户提出需求后，“小团”可结合实时信息，协助完成下单、打车、订位等各类本地生活服务相关操作。IT之家注意到，今日美团还发布了全场景 AI Agent 平台 ——CatPaw，该平台已在美团内部大规模落地，覆盖 9 万名员工，搭建了超过 3 万个 Agent，并在餐饮、美业、宠物医院等真实业务场景完成验证。CatPaw 提供开箱即用的 AI 工作台与企业级 Agent 开发托管能力，支持 7×24 小时云端运行，即使设备关机或断网也不受影响。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/080.htm", "publishedAt": "2026-07-27T07:42:40+00:00"}, {"title": "消息称高通骁龙 8 Elite Gen 6 Pro 硬件支持 AI 驱动超分辨率、帧生成", "summary": "IT之家 7 月 27 日消息，外媒 Notebookcheck 当地时间昨日爆料称，预计被称为骁龙 8 Elite Gen 6 Pro 的高通 SM8975 移动平台将具备一项名为 AI Frame Fusion 的新功能，支持人工智能驱动的超分辨率与帧生成。IT之家了解到，AI Frame Fusion 的硬件基础是 GPU 着色器内的 2 个专为加速 GEMM 和卷积运算而设计的矩阵 ALU 模块。这一硬件结构似乎为 SM8975 独占，未出现在 SM8950（骁龙 8 Elite Gen 6）中。AI Frame Fusion 可在超分辨率模式下结合运动矢量、深度缓冲区、低分辨率颜色缓冲区以及前一帧数据，将输出画面分辨率提升至 1080p 或 1440p；而帧生成模式则利用运动矢量和光流重投影技术，在两个实际帧之间插入一个生成帧。此外，SM8975 的尺寸预计为 12.6 × 10.67 (mm)，约 134 mm² 的面积要比骁龙 8 Elite Gen 5 的 126.2 mm² 再大上一些；与其调制解调器配套的收发模块中，高阶的 SDR885 上下行链路均支持 4×4 MIMO。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/072.htm", "publishedAt": "2026-07-27T07:27:15+00:00"}, {"title": "出海企业苦等的可信任AI营销产品，飞书深诺做出来了", "summary": "让中国品牌赢在全球", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/461226.html", "publishedAt": "2026-07-27T04:33:09+00:00"}, {"title": "AI Agent 与前沿部署工程：商业决策智能实践 ｜ Summit 2026", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/video/TV8xhCYdGPx6a38TuzEh?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-26T15:03:20+00:00"}, {"title": "ZGI 正式上线 Gitee：让 Agent 不只被创建，也能被执行、追踪和管理", "summary": "“做出一个 Agent Demo 并不难，真正困难的是让它长期、稳定、可控地运行。” 近日，Agent Runtime 项目 ZGI 正式同步上线 Gitee (https://gitee.com/zgiai/zgi)，并面向开发者开放源代码和部署文档。 ZGI 由一支分布在不同城市和地区的远程团队共同开发。过去半年多，我们一直在尝试解决一件事：为 Agent 提供一套真正能...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/479885", "publishedAt": "2026-07-26T12:34:31+00:00"}, {"title": "美国具身也没成熟！PI：中国公司何必总当“中国版XX”｜RSS 2026", "summary": "这是机器人领域最好的时代", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/460542.html", "publishedAt": "2026-07-25T12:24:27+00:00"}, {"title": "全世界都在讲 AI 话｜AI 器物志", "summary": "语音输入会成 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
