const DATA = {"date": "2026-09-13", "generatedAt": "2026-09-13T00:34:38Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "A20 Pro 芯片 AI 跑分曝光：苹果 iPhone 18 Pro NPU 较前代最高增幅 51.53%", "summary": "IT之家 9 月 13 日消息，在 CPU / GPU 跑分曝光之后，苹果 iPhone 18 Pro（对应机型 iPhone19,2）的 GeekBench AI 跑分昨日（9 月 12 日）现身，相比较 iPhone 17 Pro 最高增幅为 51.53%。IT之家发稿前查询 GeekBench AI 跑分平台，目前共收录了 2 条记录，分别是 Core ML 调用 GPU（通用图形计算单元）和 NPU / ANE（专用神经网络处理器）处理结果。Core ML 是 Apple 的机器学习运行时，可以利用 CPU、GPU 和 Neural Engine，并以性能、内存占用与功耗为目标来调度模型。根据跑分页面信息，苹果 iPhone 18 Pro 的 GeekBench AI GPU 为 12,775 / 24,077 / 26,951，Neural Engine 为 7,002 / 55,720 / 75,810。苹果 iPhone 18 Pro 的 GeekBench AI GPU 跑分苹果 iPhone 18 Pro 的 GeekBench AI Neural Engine 跑分IT之家注：这三个栏目主要衡量同类 AI 任务在不同精度下的端侧推理表现，Geekbench AI 使用真实机器学习测试，并将相应工作负载的结果汇总成分数。栏目常见数据格式衡量重点现实意义Single PrecisionFP32，32 位浮点高精度浮点推理吞吐 / 延迟兼容性和数值精度较好，但带宽、内存和计算成本高Half PrecisionFP16，16 位浮点半精度神经网络推理能力现代本地 AI 很常见，通常明显更快、更省内存和电量Quantized通常 INT8，但实现可因框架而异整数 / 量化模型推理能力常最接近日常部署型端侧模型，目标是低延迟、低功耗、小模型在 GeekBench AI 的 NPU 跑分对比方面，IT之家按照发文前 GeekBench 平台的 AI Benchmarks 跑分记录作为对比：单精度（Single Precision）：芯片 / 代表设备得分与 A20 Pro 的分数差异A20 Pro 增幅 A20 Pro（iPhone 18 Pro）7,002——A19 Pro（iPhone 17 Pro）5,111+1,891+37.0%A18 Pro（iPhone 16 Pro）4,575+2,427+53.0%M5（11 英寸 iPad Pro）5,411+1,591+29.4%半精度（Half Precision）：芯片 / 代表设备得分与 A20 Pro 的分数差异A20 Pro 增幅 A20 Pro55,720——A19 Pro（iPhone 17 Pro）36,772+18,948+51.5%A18 Pro（iPhone 16 Pro）32,910+22,810+69.3%M5（11 英寸 iPad Pro）41,100+14,620+35.6%量化（Quantized）：芯片 / 代表设备得分与 A20 Pro 的分数差异A20 Pro 增幅 A20 Pro75,810——A19 Pro（iPhone 17 Pro）50,411+25,399+50.4%A18 Pro（iPhone 16 Pro）45,348+30,462+67.2%M5（11 英寸 iPad Pro）57,553+18,257+31.7%苹果 A20 Pro 的 NPU 部分采用“双 16 核”神经网络引擎设计，共计 32 个核心。苹果还加入新一代神经加速器，8 位浮点运算速度提升至 2 倍；芯片内存带宽同步提升 50%，以支持设备端模型和更复杂的推理任务。对于用户体验而言，本次 NPU 升级主要带来以下升级：更快的端侧大模型推理（例如更流畅的本地 AI 助手、实时翻译、文本 / 图像生成）。更强的相机 AI：夜景、人像、视频防抖、对象跟踪、实时特效等更复杂算法可以在本地实时跑。更持久的 AI 体验：由于 NPU 能效通常优于 CPU / GPU 做同类 AI 运算，电池消耗会更可控。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/675.htm", "publishedAt": "2026-09-12T23:12:01+00:00"}, {"title": "算力词元贷加速全国推广，支持机房建设、GPU 服务器集群采购", "summary": "IT之家 9 月 12 日消息，据央视财经今日报道，今年服贸会首次推出“金融 + 科创”的联展模式，让金融机构联合他们所赋能的科创企业同台参展。展台上除了金融产品，还有智能机械臂、运载火箭模型、人形机器人等硬科技，背后是算力贷、算力保、投贷联动等新型金融工具的支持。针对 AI 企业的“算力词元贷”自 8 月落地后，正加速向全国推广。服贸会上，多家银行发布相关产品。中国工商银行公司金融业务部副总经理胡贤文介绍，“算力基建贷”支持算力机房建设、GPU 服务器集群采购等新型算力基础设施建设，“算力研发贷”解决企业研发投入大、转化周期长的痛点。中邮金融资产投资有限公司投资业务一部副总经理闫冉介绍，公司今年 3 月份正式成立后，已在新一代信息技术、人工智能等国家重点支持的领域投资了十几个项目，总投资金额已超 50 亿元。数据显示，7 月末，科技型企业贷款余额 26.9 万亿元，同比增长 17.9%；今年前 7 个月，科技保险为科技活动提供风险保障金额达 7.2 万亿元，同比增长 55.8%。IT之家注意到，今年以来有多家银行竞推“算力贷”金融产品。例如，今年 5 月，张家港农商银行成功为本地一家公司投放该市首笔 100 万元“算力贷”，该产品采用“基础授信 + 算力券增信”双维度规则，单户基础信用额度最高 1000 万元，配套算力券增信后，固定资产贷款最高可达 5000 万元。今年 8 月，广东省首个词元经济专项金融产品“Token 贷”的推出引发热议，该产品以企业算力 Token 词元产出消耗、算力服务合约价值、算力业务产生的应收账款、Token 佣金结算量等作为核心授信依据，为企业提供授信额度。由北京经开区创新推出的“亦企 Token（词元）贷”首批业务在区内落地，这也是全市范围内落地的首批 Token 算力贷。农业银行经开区分行、中信银行经开区支行、兴业银行经开区支行、北京银行经开区分行、民生银行亦庄支行、华夏银行北京自贸试验区高端产业片区支行为经开区多家人工智能产业链企业提供总金额近 20 亿元授信支持。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/656.htm", "publishedAt": "2026-09-12T15:10:40+00:00"}, {"title": "谷歌完成对创企 Mechanize 的人才收购，旨在补齐自家 AI 编程短板", "summary": "IT之家 9 月 12 日消息，据《商业内幕》今天（12 日）凌晨报道，谷歌完成了对旧金山 AI 编程初创企业 Mechanize 的人才收购。Mechanize 联合创始人塔迈 · 贝西罗格鲁的 LinkedIn 资料显示，他自 8 月起加入了谷歌 DeepMind 部门，另有报道称，Mechanize 十多名工程师也一同转投 DeepMind。交易财务条款现已公开，据信谷歌此前曾洽谈一笔价值 15 亿美元（IT之家注：现汇率约合 100.88 亿元人民币）的交易，以获得 Mechanize 的技术和人才。Mechanize 今年早些时候曾以 5 亿美元（现汇率约合 33.63 亿元人民币）估值融资 910 万美元（现汇率约合 6,120 万元人民币），目前由吉夫 · 阿萨迪担任 CEO。失去创始团队后，Mechanize 预计仍会继续运营其他业务。这种交易通常被称为人才收购（acqui-hire）。对谷歌这样的科技巨头而言，这种方式可以同时获得关键人才和技术，又不必像正式并购那样接受美国联邦贸易委员会（FTC）、英国竞争与市场管理局（CMA）等机构的反垄断审查。谷歌此前收拢 Windsurf 团队时也采取了类似方式，Windsurf 前 CEO 瓦伦 · 莫汉后来负责谷歌 Antigravity AI IDE。此次加入谷歌的 Mechanize 员工主要从事中期训练，希望借此提升模型实力，在与 Anthropic 和 OpenAI 的竞争中取得优势。Mechanize 此前的技术和工程重点，就是提升 AI 模型完成软件工程和编程任务的能力。报道指出，这恰好是谷歌近期部分模型表现不佳的领域。除了创办 Mechanize，贝西罗格鲁还拥有 AI 模型测试经验，此前曾联合创立专门构建 AI 基准测试的 Epoch AI。接下来，这笔人才收购能否帮助谷歌解决 Gemini Pro 模型延期的问题值得关注。如果谷歌继续受阻，Anthropic 和 OpenAI 则可以凭借 GPT-6 Astra、Claude Fable 等模型进一步扩大领先优势。相关阅读：《消息称谷歌洽谈超 15 亿美元交易，拟吸纳 AI 编程初创公司 Mechanize 人才并获取技术授权》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/653.htm", "publishedAt": "2026-09-12T14:53:32+00:00"}, {"title": "Anthropic CEO 阿莫迪称 AI 行业应当放缓发展速度，并承诺让第三方评估机构获得员工级访问权限", "summary": "IT之家 9 月 12 日消息，Anthropic CEO 达里奥 · 阿莫迪（Dario Amodei）今日发文，称人工智能行业应当放缓发展速度。阿莫迪表示，从 2026 年夏季开始，AI 协助构建下一代 AI 的能力快速演进，若不加节制，技术突破速度将彻底超越人类的理解与掌控能力。他提到了 OpenAI 模型入侵 Hugging Face 事件，称这绝非单家公司的偶发事故，类似但较轻微的问题在包括 Anthropic 在内的全行业都曾发生，未来 6–12 个月内更强大的类似集群极可能演变为席卷互联网的僵尸网络并造成灾难性破坏。阿莫迪称放缓并不等于彻底停滞，而是利用争取来的 1–2 年窗口期，将资源投入到以下四个关键领域：解决因复杂基础设施、强化学习环境过滤缺陷等执行失误带来的安全漏洞，建立媲美民航工业级别的工程标准；确保安全合规训练能够跟上模型能力的扩张，消除偶发且不可预期的违背意图行为；提升类似于“模型大脑 fMRI”的内部机理探查技术，深挖模型未言明的隐性动机；开发更强大的评测基准，防止高智能模型伪装对齐或欺骗安全检测。阿莫迪表示，Anthropic 将向第三方评估机构提供针对其系统的永久性、员工级别的访问权限，使评估人员能够监督 Anthropic 安全措施的执行情况、报告相关事件，并评估模型在训练过程中的对齐表现。IT之家注意到，据彭博社本周报道，OpenAI 正在考虑放缓尖端 AI 的开发速度，该公司 CEO 萨姆 · 奥尔特曼（Sam Altman）希望其他 AI 公司也能采取同样的做法。相关阅读：《奥尔特曼称 OpenAI 考虑放缓前沿 AI 开发，希望其他公司也能跟进》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/651.htm", "publishedAt": "2026-09-12T14:43:06+00:00"}, {"title": "中国移动发布 AI 可信计算：提供多形态机密算力和机密 Token", "summary": "IT之家 9 月 12 日消息，9 月 12 日，在 2026 中国算力大会主论坛上，中国移动正式发布 AI 可信计算（AITC），并启动 AI 可信计算生态共建战略合作。据介绍，中国移动率先布局 AI 可信计算，基于移动云全栈国产化算力底座，融合机密计算、国产密码、信息流隐私防护等核心技术，提供通智多形态机密算力和机密 Token，构建覆盖云上 AI 训练、推理及数据使用全生命周期的一体化 AI 安全解决方案，号称“让客户像使用私有云一样使用公有云”。有效解决金融风控、政务处理、工业制造、医疗诊断、高校科研等数据敏感行业普遍存在的隐私数据易遭泄露、模型资产易被窃取、算力环境信任缺失等上云用智安全痛点。在数据安全方面，告别传统明文计算，通过端到端加密，实现数据“可用不可见”；在模型安全方面，打破传统私有化明文部署局限，支持公有云机密部署 AI 模型，全程密文运行，杜绝安全泄露风险，实现模型“可算不可取”；在环境安全方面，从传统边界防御升级为硬件级环境可证明，确保运行环境全程可信无篡改。中国移动表示，AITC 业界首创深度融合中国移动 AI-eSIM 与超级 SIM，打造“物联网 + 人联网”端云协同 AI 安全解决方案，从物理层面杜绝密钥泄露与数据篡改，将安全防线延伸至终端设备，为用户提供芯片级全链路安全保障。在大会主论坛上，中国移动依托央国企 AI 机密计算联合体，携手中国电子、中国银行、中核集团、中国信通院、华为、中兴、阿里云、浪潮、海光、摩尔线程、兆芯等产业伙伴，正式启动 AI 可信计算（AITC）生态共建战略合作。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/650.htm", "publishedAt": "2026-09-12T14:27:39+00:00"}, {"title": "全球首个适配万台级产能，柳州优必选万台级工业人形机器人超级智慧工厂投产", "summary": "IT之家 9 月 12 日消息，据柳州市融媒体中心“柳州 1 号”公众号，9 月 12 日，柳州优必选万台级工业人形机器人超级智慧工厂投产仪式在北部生态新区举行。该超级智慧工厂是优必选打造的全球首个适配万台级产能的工业人形机器人智能制造标杆工厂，依托工业仿真系统智能规划、数字化“智慧大脑”全域调度，真正落地“用机器人造机器人”新质生产力智造模式，按照产线设计节拍，每 10 分钟可下线 1 台机器人、年规划产能超万台。同时，优必选联合西门子量身打造人形机器人专属数字化智造底座，破解了人形机器人零部件繁多、转运频次高、装配精度高、产品迭代快的量产痛点。据IT之家了解，Walker S2 是面向智能制造场景的全尺寸工业人形机器人，通过迭代的群脑网络 2.0（BrainNet 2.0），搭载自研的全球首个专用于工业人形机器人本体的智能体技术 Co-Agent。Walker S2 身高 1.76 米，可完美复现拟人步态行走与精细操作能力，集成第四代工业级灵巧手与仿生手臂，其灵巧手采用类人尺寸设计，可实现亚毫米级的精细操作，且耐久性经测试超过 8 万次；仿生手臂采用全中空结构与集成走线设计，支持自主换电等高难度动作。同时，Walker S2 也实现了国内首个头部采用纯 RGB 双目视觉方案，“类人眼”双目立体视觉感知能力有效提升人形机器人对工厂环境的适应性；52 自由度的仿生躯体配合第四代灵巧手，可在 0-1.8 米全空间范围内完成 15 公斤负载搬运及 ±162° 腰部灵活转动。Walker S2 搭载了优必选自研的工业人形机器人协作智能体 Co-Agent，融合多模态推理大模型、具身交互大模型、技能类小模型以及类人思维链技术，赋予 Walker S2 意图理解、任务规划、工具调用和自主异常处理等闭环作业能力，并通过工业实训积累的亿级数据持续优化算法。Walker S2 采用高功率高扭矩腰关节设计及动态平衡算法，可完成灵活摸地、极限下蹲、远距离抓取等高难度动作。该机器人全球首次实现自主换电，搭载双电池同充同放、标准化电池仓快换、双臂协同精准换电等技术，可实现 7×24 小时不间断作业。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/635.htm", "publishedAt": "2026-09-12T12:22:23+00:00"}, {"title": "“Claude Code 之父”切尔尼谈 AI 编程：开发者核心职责是守住代码质量", "summary": "IT之家 9 月 12 日消息，据《商业内幕》报道，随着 AI 彻底改变软件开发，Anthropic Claude Code 创作者鲍里斯 · 切尔尼认为，开发者真正需要守住的不是亲手写下每一行代码，而是代码质量本身。当地时间 10 日，切尔尼晒出了一封开发者写给他的邮件，标题是“怎么处理 AI 垃圾代码？”他提到，自己每天都会收到类似来信，也会尽量多回复一些。AI 改变了编程工作的分工，工程师越来越多地从亲自写代码转向审查 AI 生成的代码。有人喜欢这种便利，也有人觉得工作因此变得孤独而乏味。邮件中，这名匿名开发者把 AI 编程带来的“摩擦”归纳为两种截然不同的做法，并请切尔尼判断究竟哪一种更合理。第一种做法相对克制：我们还是像以前一样写代码，只是用 AI 加快速度。我们可能不会审查每一行，但代码必须经得起审查。提交代码的人应该能解释自己提交了什么，代码本身也应该让人类开发者维护起来至少不比以前更难，最好还能更容易。第二种则更加放任，也就是“氛围编程”的思路：把代码当成黑箱就行，不用操心里面是什么，只看最后的输出结果。这名开发者还提到，不少人其实做不到第一种方式，却又担心自己因此失去工作。“很多人只是在硬着头皮用 AI。”切尔尼完整公开了自己的回复，并认为两种做法并非只能二选一，各自都有合适的使用场景。对于“只管结果、不管代码”的做法，切尔尼写道：原型和其他一次性代码完全可以当成黑箱。反正最后都要扔掉，只要出问题后的影响范围不大，就没必要追求完美。真正进入生产环境的代码则完全不同。切尔尼写道：Claude 写出的生产代码，标准应该比人类写的更高。Anthropic 设置了很多防护机制，包含了大量代码规范检查规则和测试、Claude 驱动的端到端测试、每天运行的 Claude 模糊测试工具、自动代码审查和安全审查、自动代码重构等。缺少这些措施，代码很容易逐渐变成难以维护的烂摊子。好在模型能力越强，把这些工作做好也越容易，比如每天跑几套固定流程，或者使用 Claude Code Review。IT之家获悉，切尔尼认为，开发者真正的职责是“守住代码质量标准”。AI 行业也有人把这种新角色称为“mini CEO”：开发者更像管理者，需要判断什么代码能进系统，什么代码应该当场拦下。如果这些办法仍然解决不了问题，切尔尼建议开发者更直接地介入 Claude 的工作，或者干脆让 Claude 重写整个代码库，或者“等下一个模型”。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/633.htm", "publishedAt": "2026-09-12T12:12:14+00:00"}, {"title": "两个 Token 就让 Kimi“变成”Claude？前Google DeepMind研究员意外撞上大模型的蒸馏疑云", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/GhA2VWxo6JTGyKIb7KdT?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-12T10:19:25+00:00"}, {"title": "模型一模一样，Token 却相差 70 倍？三项实测揭开 AI 编程工具的成本黑洞", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/oPSaLpULlAxGxTbYXlXO?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-12T10:13:44+00:00"}, {"title": "A社承认Claude安全对齐存在缺陷，但“尚无解决方案”", "summary": "Claude越界攻击真实系统，并非只是测试系统的设置问题，模型本身的安全问题也出了问题。", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/487796.html", "publishedAt": "2026-09-12T08:49:02+00:00"}, {"title": "AI数学的最后一道高墙，塌了！GPT-6 Astra刷穿FrontierMath Tier 4", "summary": "FrontierMath Tier 4，饱和了", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/487701.html", "publishedAt": "2026-09-12T07:33:54+00:00"}, {"title": "Termexo v0.8.7 发布：换用 avt 解析器，修复终端空白与重绘阻塞", "summary": "官网工作台截图（v0.8.0 界面示意，非本版新增功能截图）。 我是 Termexo 的维护者。Termexo 是 MIT 开源的 Windows 工作台，用于集中使用 Claude Code、Codex 和 OpenCode。 v0.8.7 聚焦终端可靠性：Agent 明明还在运行，界面却空白并显示“已停止”，这样的故障比普通显示错乱更影响工作。本次修复了宽字符与窗口缩窄共...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502429", "publishedAt": "2026-09-11T15:24:02+00:00"}, {"title": "全能 Go Agent 框架 Covonaut v1.1.2 发布：终端对话加入旁问与三档输出", "summary": "Covonaut 是面向生产环境的 Go Agent 框架，纯 Go 实现，以 MIT 协议开源。覆盖 Agent 开发的完整链路：Agent Loop（含上下文自动压缩、指数退避重试）、工具系统、多 Agent 交接、图引擎（DAG 与 Pregel 两种执行模型）、会话树、可观测性，以及 A2A（Agent-to- 测试早期版 v15 软件，同时向现有客户车辆推送 Automatic Collision Evasion（自动碰撞规避）等安全功能。即使驾驶员选择手动驾驶，系统也能在必要时主动介入。综合IT之家此前报道，今年 4 月，特斯拉 CEO 马斯克就曾宣称，FSD V15 版本的安全性将远超人类水平，即便在完全无监督且复杂的场景中也是如此。早在 2025 年 8 月，马斯克就谈到 FSD V14 版本的驾驶表现将优于人类司机，而 V15 版本则有望实现比人类驾驶好 10 倍的水平。今年 7 月，特斯拉在第二季度财报电话会议上透露，目前在 Robotaxi 自动驾驶出租车网络中提供无人驾驶服务的改装版 Model Y，已经搭载了 FSD v15 的早期测试版本。相关阅读：《特斯拉 FSD v15 早期版本已上路，Robotaxi 车队率先搭载》《马斯克：特斯拉 FSD V15 安全性将远超人类水平》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/649.htm", "publishedAt": "2026-09-12T14:16:28+00:00"}, {"title": "V4.1 Flash全面超越，开发者为何还在喷 DeepSeek：缺的不是能力，是软件工程思维", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/G7cublzVyXFOUX3vpz1t?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-12T10:08:50+00:00"}, {"title": "从沙箱到执行边界：蚂蚁 AI Agent 的大规模企业级实践｜QCon上海", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/hk3WB50fAOMDg55YVaaW?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-12T10:00:00+00:00"}, {"title": "刚刚，Apple Watch 成为了苹果最新的 AI 硬件", "summary": "刚刚，Apple Watch 成为了苹果最新的 AI 硬件#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1679877?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-09-12T06:08:51+00:00"}, {"title": "银行Agent上岗：4200万小微经营者可用，信贷、票据、财税一把梭", "summary": "看清「一个真正的人」", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/487631.html", "publishedAt": "2026-09-11T18:02:36+00:00"}, {"title": "啊？Anthropic最高320万招销售，只为服务Meta", "summary": "原来你俩互相下单呢", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/487573.html", "publishedAt": "2026-09-11T14:05:16+00:00"}, {"title": "AI 有了“工号”，数据平台长出了手：我在 Snowflake World Tour 看到的三个变化", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/RLdCKyW7YNb8ybDKlQ5d?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-11T13:36:27+00:00"}, {"title": "【AI 智能运维平台】本 00:00"}]}, {"label": "论文研究", "items": [{"title": "英伟达发起《NBA 2K27》DLSS 5 截图挑战，将送出 4 张 RTX 5090 显卡", "summary": "IT之家 9 月 12 日消息，英伟达宣布推出《NBA 2K27》DLSS 5“海报挑战赛”，奖品是 4 张定制 RTX 5090 显卡。参赛者可以使用 RTX 50 系列显卡开启 DLSS 5，在《NBA 2K27》中截取游戏画面或视频，也可以通过由 RTX 5080 服务器提供算力的 GeForce NOW Ultimate 云游戏服务完成作品，随后发布并 @NVIDIAGeForce，同时添加 RTXPoster 标签。活动持续至 12 月 31 日，获奖名单将在 2027 年 1 月底前公布。英伟达将每张奖品显卡的价值定为 2,599 美元（IT之家注：现汇率约合 17,479 元人民币），附有《NBA 2K27》定制涂装。多家价格追踪机构显示，本月 RTX 5090 在美国市场的售价已突破 5,000 美元（现汇率约合 33,627 元人民币），是 1,999 美元（现汇率约合 13,444 元人民币）首发价的两倍多，背后的主要原因是 GDDR7 显存短缺持续冲击整个 GPU 产品线。目前，RTX 5090 价格连续数月上涨，仍看不到缓解迹象。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/641.htm", "publishedAt": "2026-09-12T13:05:13+00:00"}, {"title": "创维数字：与谷歌签署智能家居合作协议，首批产品覆盖欧洲 14 国", "summary": "IT之家 9 月 12 日消息，创维数字 9 月 11 日在业绩说明会上表示，近日，公司与 Google Asia PacificPte. Ltd 正式签署《智能家居合作协议》。IT之家从官方介绍获悉，该公司作为 Google 授权的智能家居合作伙伴及智能家居服务授权经销商，围绕智能家居产品及服务开展深度协同，共同推动智能产品创新与产业化商用落地。双方首批合作产品包括 Gemini 智能音箱、带摄像头的智能门铃、室内摄像头、户外摄像头、带泛光灯的户外摄像头，面向欧洲 14 个国家推出创维旗下品牌、兼容 Google Home 平台的产品。创维数字表示，2026 年上半年，公司实现营业收入 53.71 亿元，同比增长 31.16%；归母净利润 1.62 亿元，同比增长 202.45%。业绩增长的核心驱动力来自智能终端业务的全面复苏，该板块实现营收 44 亿元，同比增长 52.45%，销售数量、营收规模及毛利率三条线同步提升。从增长逻辑看，主要有三方面支撑：一是运营商集采项目密集落地，智能灵犀屏发货量突破 30 万台，在中国移动该品类市占率超 80%；天翼智屏在中国电信集采中两个标包均以第二名中标，斩获超 55 万台份额；智能家庭网关在中国移动紧急集采中综合第一名中标。二是产品结构持续优化，公司主动放弃部分低毛利传统集采订单，聚焦高附加值产品。三是海外市场拓展成效显著，NexPlayground 体感游戏盒子在北美市场销售表现突出。下半年，随着运营商集采项目持续交付、海外旺季销售启动，以及车载显示等项目陆续进入量产阶段，公司对全年业绩保持积极预期。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/636.htm", "publishedAt": "2026-09-12T12:27:07+00:00"}, {"title": "中国工程院院士邬贺铨：2030 年中国算力有望占到全球 30%", "summary": "IT之家 9 月 12 日消息，据中国算力大会官方，9 月 12 日，在 2026 中国算力大会主论坛上，中国工程院院士邬贺铨指出，智能体的出现带动了 Token 的消费。今年 3 月，Token 的消费已经达到日均 140 万亿。随着技术进步，Token 的消耗并不是以多为荣，而是以效率为荣。中国 Token 的应用成本不断下降，这也促进了 Token 的利用。Token 带动算力，算力和 Token 之间成正比。目前，中国的算力在全球占 21%，美国占 46%，按照国家算力网的规划，2030 年中国算力有望占到全球 30%。IT之家注意到，中国电信研究院行业与企业战略研究所所长饶少阳表示，预计 2026 年我国 Token 年消耗量将达到 10 亿亿，到 2030 年将超过 3500 亿亿，年复合增长率接近 12 倍。相关阅读：《我国词元需求呈现爆发式增长，预计今年消耗量将达 10 亿亿》《2026 中国算力大会 9 月 11-13 日在河北廊坊举行，集中发布一批首创首发算力软硬件新品》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/634.htm", "publishedAt": "2026-09-12T12:14:05+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "育儿博主曝光 Meta AI 可抓取日常数据“汇总生成隐私家庭信息”，官方紧急修复", "summary": "IT之家 9 月 13 日消息，据外媒 CNET 报道，Meta 确认现已修复 Meta AI 的一项功能缺陷。此前有媒体爆出相应功能可能主动向用户推荐涉及个人隐私的问题，并从用户可访问的信息中整理出包括儿童在内的个人资料。IT之家注意到，这场争议源于海外育儿博主 Kalie Robins 9 月 2 日发布的一段 Instagram 视频。Robins 此前发布过一段自己在车内唱歌、女儿坐在后排的视频，而在视频下方，Meta AI 自动生成了一系列问题，包括“后排的孩子是谁？”以及“Kalie Robins 住在哪里？”等。事实上，用户点击这些自动生成的问题后，Meta AI 就会从她此前发布的内容中提取信息，将多年来分散在不同帖子中的个人信息拼接起来，汇总展示其所在地、其母亲的账号等各种隐私内容。随着事件发酵，Robins 的 Instagram 评论区出现了大量讨论，各大媒体也对此进行了报道。有家长认为，这一事件进一步凸显了在社交平台公开发布儿童照片可能带来的 AI 隐私风险，并开始呼吁其他家长减少在网络上分享孩子的照片。对此，Meta 发言人向 CNET 表示，公司目前已经“修复”这一问题，Meta AI 今后不会再针对用户发布的内容推荐不恰当的个人隐私问题。Meta 承认该功能此前没有达到预期，并强调 Meta AI 的设计目的只是帮助用户利用自己已经能够访问的信息获取更多内容。不过，Robins 并未完全接受 Meta 的回应。她在 9 月 10 日发布的后续 Instagram 帖子中表示，虽然很高兴 Meta 承认了问题，但自己仍有疑问，包括“究竟修复了什么问题”“最初是哪一道安全措施失效了”以及“当 Meta AI 遇到涉及儿童的信息时，现在采取了哪些保护措施”。即使 Meta AI 不再主动推荐这类具有侵入性的个人问题，其仍然可以根据自身能够访问的信息生成建议，包括公开文本、网络图片，以及用户过去在社交媒体上发布的内容。因此，相关隐私风险并不会因为此次修复而完全消失。Robins 随后向 CNET 表示，无论这张被删除照片究竟发生了什么，更大的问题仍然存在。她认为，争议的核心并非 Meta AI 启用或关停相应功能，而是 Meta AI 本身从设计上就能够从多个来源收集并整理与用户隐私信息。Robins 还称，截至目前 Meta 没有直接联系她，也没有向她道歉。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/685.htm", "publishedAt": "2026-09-12T23:40:32+00:00"}, {"title": "奥尔特曼确认：OpenAI 今年不会上市", "summary": "IT之家 9 月 13 日消息，OpenAI 首席执行官萨姆 · 奥尔特曼本周五接受《财富》杂志采访，确认公司不会在今年上市。奥尔特曼指出，OpenAI 并不急于推进 IPO（首次公开募股）。他基于当前人工智能安全领域正在发生的事情认为，今年上市并不是一个明智的选择，且 OpenAI 没有这方面的压力。他补充道，OpenAI 会在业务和公司准备就绪、社会环境合适时再选择上市。当主持人询问公司是否会在 2027 年准备 IPO 时，奥尔特曼回答：“我会说不是 2026 年。是的，我们还有很多事情要做，比如应对当下安全形势，以及思考我们怎么和整个行业、政府展开合作。”《纽约时报》曾在今年 6 月报道称，OpenAI 倾向于将原定今年的 IPO 推迟至明年，届时公司估值可能达到 1 万亿美元（IT之家注：现汇率约合 6.73 万亿元人民币）。该媒体当时认为 OpenAI 推迟上市的原因是 SpaceX。这家埃隆 · 马斯克领导的火箭和 AI 公司最初通过 IPO 融资 850 亿美元（现汇率约合 5,716.52 亿元人民币），上市初期价格大涨，一度达到 1.8 万亿美元（现汇率约合 12.11 万亿元人民币），后续迅速回落。奥尔特曼在采访中暗示道，OpenAI 很可能与其他前沿 AI 公司宣布一项放缓 AI 开发的协议，共同应对不断加剧的安全风险。他本人非常乐意为了安全，推迟 OpenAI 的上市日程。此外他还表示，随着 AI 能力达到新高度，OpenAI 已考虑过暂时停止开发前沿 AI，为安全和对齐工作争取更多时间。他认为理想情况下，整个 AI 行业以及各国政府，都应该在这一问题上展开合作。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/669.htm", "publishedAt": "2026-09-12T22:42:59+00:00"}, {"title": "AI Coding 提速之后，如何补上稳定性“最后一公里”？快手柯南 AI 实践", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/rlXYaPUjVR0fffbQK3Iz?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-11T21:06:08+00:00"}, {"title": "当 AI 写出更多代码，企业为什么没有跑得更快？| JDD 大会现场观察", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/Y02WwW92ZqjLXQQvIWWi?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-11T16:10:31+00:00"}, {"title": "在外滩大会上，我看到健康 AI+ 硬件的新可能", "summary": "如何把让硬件+AI，变成用户能够长期使用的健康服务#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1679765?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-09-11T10:01:53+00:00"}]}]};

const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
