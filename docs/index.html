const DATA = {"date": "2026-10-25", "generatedAt": "2026-10-25T00:45:57Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "澳国脚授权 AI 数字分身，运动员开启肖像权 AI 商业化", "summary": "IT之家 10 月 25 日消息，澳大利亚国家男子足球队球星走在宽敞的中庭里，目光直视镜头，足球鞋踩在光洁的混凝土地面上，脚步声在四周回荡。突然间，他变出四个数字分身，各自散开，再出现在全球不同场景当中。IT之家注意到，这段在社交平台传播的视频是人工智能生成的假画面，但视频的原型、现年 22 岁的足球运动员克里斯蒂安 · 沃尔帕托（Cristian Volpato）本人授权制作了这段内容，他也是最新一位将自己的 AI 肖像授权变现的职业运动员。沃尔帕托的“数字分身”身穿白色亚麻西装，双脚踩在沙滩上，转身看向镜头，身后是十二使徒岩的石灰岩海柱。另一个分身穿着球衣，出现在巨型数字广告牌上。还有一个分身对着镜子整理笔挺的灰色西装，面带微笑。这家新公司专门充当职业运动员的 AI 肖像授权代理，制作了这条视频。业内专家认为，这只是一个新兴线上行业的缩影，这个行业或将改写肖像权与体育内容的未来。博彩公司、转播方和品牌方越来越多地未经许可，就把运动员的形象用在 AI 生成内容里，一部分球员已经开始主动维权。数字分身9 月中旬，效力于意大利足球甲级联赛萨索洛俱乐部的沃尔帕托，和总部位于加州的卡兰多（Callandor）公司达成协议，授权对方使用自己的 AI 肖像。根据这份协议，卡兰多独家持有沃尔帕托的数字形象、声音、生物特征数据以及赛场表现数据。这家公司会对接品牌合作，利用他的 AI 肖像变现并抽取分成，同时拦截没有经过他本人许可的相关内容。卡兰多联合创始人迈克尔 · 菲斯克（Michael Fisk）在洛杉矶接受《卫报》澳大利亚版采访时表示，他们的业务就是打造“数字分身”。“克里斯蒂安一直在训练、比赛，”菲斯克说，“但凡有一点空闲时间，他大概率想留给家人和朋友，所以会错过很多品牌合作机会。”“只要获得本人许可，品牌方就可以全天候、全年无休地使用数字分身。”卡兰多今年 2 月成立，目前签约的运动员不多，包括巴西足球运动员若日尼奥（Jorginho）和美国帆船选手克里斯 · 普尔（Chris Poole）。相关推广项目还处在试点阶段，但公司正在发掘传统广告之外的大量可能性。菲斯克曾在索尼影业和美高梅担任高管，他提到可以用 AI 生成外语版本的有声书旁白。团队还在开发应用，让球迷和运动员的数字分身建立专属互动。“说到底，运动员最向往的，就是和球迷一对一交流，”菲斯克说。他设想开发一款足球训练应用，由沃尔帕托的数字分身实时给出指导。“系统识别到我停球动作不对，分身就会告诉我：‘你应该这样、这样、这样做’，”菲斯克说，“沃尔帕托本人根本不可能一对一指导这么多人。”沃尔帕托和卡兰多的这份协议属于 AI 肖像授权领域的前沿尝试，但他并不是第一位拥抱这项技术的运动员。今年 6 月，巴西球星内马尔将自己的 AI 肖像授权给一家中资娱乐平台，后者在世界杯期间发布了相关短视频。就在这类项目陆续落地的同时，世界各国政府都在着手制定 AI 基础监管规则。目前澳大利亚各大主流体育联赛的球员合同里，还没有任何和 AI 相关的条款。技术的发展却不会等监管跟上。菲斯克说，他旗下这些数字分身客户，正在模糊真实内容和虚假内容的边界。“尤其是在手机上观看的时候，两者的观感、质感几乎看不出差别，想要分辨真假变得越来越难。”“这是一场赛跑”威廉 · 桑德斯在悉尼创办了小型初创公司 Hyperknown，也在推进同类授权合作。他说运动员渐渐意识到，如果自己不去主动把 AI 肖像变现，别人就会擅自拿去牟利。本月早些时候，澳大利亚橄榄球联盟（AFL）要求合作博彩公司 Sportsbet 停止使用未经球员许可的 AI 肖像。此事起因于球员工会发起投诉，工会正在商议是否要制定更严格的相关规则。“Sportsbet 这件事，充分说明了当企业和技术跑在知情同意前面，会发生什么，”桑德斯说。“沃尔帕托代表的是另一种选择：在别人随意处置自己的肖像之前，先把权利握在自己手里。我们正在见证一场赛跑，一边是技术能做到什么，一边是用户真正授权了什么。”澳大利亚体育行业里不少从业者，包括内容创作者、博彩商、转播方以及运动员本人，都已经开始接纳这项技术。本月早些时候，澳大利亚板球运动员特拉维斯 · 黑德为转播平台 Kayo 拍摄广告。他开玩笑说自己的 AI 分身早就拍完这条广告了，随后画面切到他骑着一只笑翠鸟飞行的片段。品牌代言已经是运动员重要的收入来源，不少人能拿到价值数百万美元的合同。目前还不清楚，品牌方是否愿意为 AI 分身支付和真人同等的高额费用。桑德斯的公司刚刚起步，但他认为这里蕴藏巨大机会。他设想，AI 分身可以用外语在运动员从未到访过的国家带货。“以后的信任标识不会只写着‘由 AI 生成’，”他提到社交平台常用的标注，“而是标注‘经本人授权制作’。”“AI 可以源源不断产出内容，但它没办法伪造一个人的授权。这正在成为一项新的商业要求。”“多方利益纠缠在一起”南十字大学知识产权法专家乔纳森 · 哈伦认为，AI 肖像经纪的兴起，是这个高速发展的全球市场里“顺理成章的下一步”。从法律角度来看，这个新兴行业交织着各类权益，需要仔细厘清。“录音、美术作品、影像素材本身受版权保护，但版权成立的前提是存在人类作者，作品包含独立、创造性的人力投入，”哈伦说，“单纯的 AI 复制品不在版权保护范围内。”公众人物和运动员确实拥有一定保护手段，可以阻止他人未经许可使用自己的形象、声音制作 AI 内容。但这类仿冒相关法律，要求当事人能够证明自己遭受了经济损失。可这并没有阻止深度伪造内容泛滥，现成工具的效果也越来越逼真。上个月，英国发起一项倡议，科尔 · 帕尔默、露西 · 布朗丝等多位世界顶尖足球运动员参与其中，表达他们对深度伪造内容的担忧，同时指出监管难以遏制这类内容爆发。这项倡议得到全球球员工会国际职业球员联盟（Fifpro）支持。今年早些时候，一家境外赌场在广告里使用了曼联球员布鲁诺 · 费尔南德斯的深度伪造视频。当然，并非所有未经授权的深度伪造内容都一定不受欢迎。菲斯克认为，如果一刀切严厉打击 AI 制作的粉丝创作，反而会适得其反。“你肯定不希望粉丝用你的形象，把你和你根本不会代言的品牌绑定，或是让你说出你绝不会讲的话，”他说，“涉及宗教、毒品这类内容，必须万分谨慎。这件事确实很复杂，但其中的机遇也十分惊人。”只不过在这片全新的领域里，后续会引发怎样的后果，还很难预判。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/017/542.htm", "publishedAt": "2026-10-25T00:42:38+00:00"}, {"title": "PHP 基金会负责人坦言资金不足：仅 1 名全职员工", "summary": "IT之家 10 月 25 日消息，本周，PHP 曝出两处高危漏洞，全球随即紧急行动，保护网站免遭黑客攻击。这件事也让人们看到，这门已有三十年历史的开源编程语言，对互联网而言有多重要。据估算，全球最高有约七成网站依托 PHP 搭建，但负责维护 PHP 的非营利基金会，经费却十分紧张。PHP 基金会执行董事伊丽莎白 · 巴伦（Elizabeth Barron）在当地时间周五的邮件采访中表示：“我们只有一名全职员工，也就是我，另外还有十四名大多是兼职的外包人员。”基金会董事会成员都是无薪志愿者，资金来源依靠捐赠与资助。IT之家注意到，基金会和外部研究人员以及多家企业合作，其中包括 OpenAI、网络安全公司 Wiz 和 Calif，共同排查安全漏洞、协调补丁开发，本周三发布的修复补丁就是这项合作的成果。网络安全服务商 Cloudflare 称已经监测到数百万次攻击尝试，不过巴伦表示，基金会没有证据表明黑客在漏洞公开前就成功利用这些漏洞，或是攻击已经打好补丁的网站。她说：“我们和 OpenAI、Wiz、Calif 在这个问题上密切协作，几家机构都没有反馈已修复系统出现异常的情况。”人工智能对基金会而言，既是助力，也是负担。这些潜伏了十年的漏洞，正是借助人工智能才被研究人员发现，巴伦也提到，AI 提升了程序员的工作效率。但与此同时，维护人员的工作量也因此增加。现在 PHP 项目收到的代码修改提案数量接近一年前的两倍，“可贡献者人数并没有同步翻倍”。审核代码提交和漏洞报告，需要投入大量人力，依赖经验判断。巴伦说，近期发生的这件事，足以体现企业和政府对 PHP 的高度依赖。“既然大家如此依赖它，显而易见，PHP 的资金投入严重不足。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/017/528.htm", "publishedAt": "2026-10-24T23:27:45+00:00"}, {"title": "开源项目 GPU Unlock 可释放英伟达 RTX 30 系列显卡隐藏 AI 算力，实际性能提升可达 60%", "summary": "IT之家 10 月 25 日消息，英伟达已经上市一段时间的 GeForce RTX 30 系列（代号安培，Ampere）显卡，显然还有大量尚未释放的计算潜力。GitHub 用户扎吉塔（Zagitta）开发了一款名为 GPU Unlock 的开源新项目，可以解除安培架构显卡上部分人为设置的性能限制，在特定负载下，张量核心的计算吞吐量几乎可以翻倍，而且不需要修改英伟达驱动，也不用永久刷写显卡的 VBIOS。IT之家注意到，这个项目专门针对一项指令发射速率限制：在使用 FP32 累加的 FP16/BF16 张量核心运算中，消费级安培显卡的运行速率相比专业卡更低。解除这项限制之后，工具就能释放显卡硬件本身就具备的额外计算性能。有意思的是，GPU Unlock 建立在早前针对英伟达 CMP 加密货币挖矿显卡的相关研究之上。它把 CMP 项目的固件解锁技术和一套提前初始化方案结合起来，依靠一个 Linux 内核模块，在英伟达显卡驱动加载之前执行操作。该模块修改对应的硬件速度选择寄存器，执行一次功能级重置（FLR），之后原版驱动就可以正常初始化显卡。这也意味着用户每次更新驱动新版本时，都不用再给驱动打补丁。开发者目前标注支持 GA102、GA103、GA104、GA106 型号 GPU，覆盖了 RTX 30 系列里的大部分型号，不过并不是每一张显卡都一定能兼容，也不保证都能获得性能提升。性能提升的幅度可以相当可观。根据项目 GitHub 仓库放出的基准测试数据，一块功耗上限设置在 450W 的 RTX 3090 Ti，在使用 FP32 累加的稠密矩阵乘法（GEMM）测试中结果如下：这类提升并不只出现在 RTX 3090 Ti 上。一位 RTX 3080 Ti 用户反馈，在显卡功耗限制为 315W 的条件下，BF16 吞吐量从 71.59 TFLOPS 提升至 113.98 TFLOPS，TF32 性能从 35.65 TFLOPS 提升至 65.28 TFLOPS。还有一份 RTX 3080 10GB 的兼容报告显示，在显卡原厂 320W 功耗上限下，FP16/BF16 性能从大约 65 TFLOPS 提升到 110–113 TFLOPS。这些测试结果也在 X 平台上被广泛讨论。那在实际应用里的表现如何？好在社区用户已经开始在真实 AI 负载下测试这项解锁功能，初步结果比较乐观。Reddit 上一位 RTX 3090 Ti 用户在 ComfyUI 中做了跑分测试，MOSS-Image SFT BF16 吞吐量提升 58.6%，Qwen-Image 2.1 Turbo BF16 提升 57.2%，Z-Image Turbo BF16 提升 56.1%。而 INT8 精度模式下提升幅度很小，MOSS-Image SFT INT8 仅提升 0.3%。测试者同时表示，默认状态和解锁后生成的图片解码结果完全一致。大语言模型（LLM）推理也是潜在受益场景，不过提升效果高度取决于负载类型。例如一份 RTX 3090 的兼容报告显示，vLLM 的提示词处理与推理吞吐量提升 33%，但词元（token）生成速度基本没有变化。这也很好理解，大语言模型解码环节的瓶颈往往是显存带宽，而不是张量核心的原始计算吞吐量。还有一项值得关注的进展是实验版 Windows 实现方案，它不再使用原先的 Linux 内核模块，而是基于 UEFI 的方式。开发者记录了 RTX 3090 的成功案例，BF16 计算吞吐量提升约 82.5%。但这个版本仍然属于实验性质，只适配特定硬件，并不是通用可用的 Windows 正式版本。该方案同样存在明显局限。GPU Unlock 不会提高显存带宽，不会解锁更多 CUDA 核心，也无法让所有负载自动提速。至少有一份 RTX 3080 Ti 20GB 的反馈显示，解锁流程执行成功，但 BF16 性能没有出现预期提升，说明效果并不通用。游戏方面，英伟达的 DLSS 技术同样会用到张量核心，但目前没有可靠证据证明 GPU Unlock 可以提升游戏帧率或是缩短 DLSS 的运行耗时。只有当任务本身调用了这些受影响的指令和累加模式时，才有可能获得收益。所以，这些亮眼的计算跑分，不能等同于游戏帧数会同步上涨。即便如此，对于 RTX 30 系列显卡持有者来说，GPU Unlock 仍是一个很有吸引力的新尝试，尤其是那些把显卡用于本地 AI 推理、图像生成以及其他高计算负载场景的用户。这个项目目前还处在实验阶段，但不用永久改动硬件，就能从现有显卡里挖出可观的额外性能，确实很有吸引力。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/017/525.htm", "publishedAt": "2026-10-24T23:09:54+00:00"}, {"title": "中国信通院：6 月国内词元日均消耗量约 500 万亿，是 2025 年 12 月的近 4 倍", "summary": "IT之家 10 月 24 日消息，据中国信通院，随着大模型技术的迅速迭代，词元（Token）服务成为从技术走向应用的关键点，我国日均词元调用量持续攀升，2026 年 6 月，国内词元日均消耗量约 500 万亿，是 2025 年 12 月的近 4 倍。产业中越来越多的 MaaS（Model as a Service，模型即服务）平台厂商通过公有云 API 方式供给大模型词元服务。然而用户对词元服务性能缺乏直观的判断依据，且面临选型困难等各类问题。为有效衡量服务性能，中国信息通信研究院（简称“中国信通院”）人工智能研究所、人工智能大模型及软硬件评测工业和信息化部重点实验室和中国人工智能产业发展联盟，自 2025 年以来持续开展公有云大模型词元服务性能监测工作，为产业应用提供重要参考，现联合发布《大模型词元服务性能监测报告（2026 年）》。报告基于 2026 年 1-8 月的监测数据，围绕各平台词元服务调用成功率、吞吐速度、首词时延、稳定性、价格、上下文窗口等维度开展分析，对比原厂大模型官方平台，以及 DeepSeek、Qwen、GLM、Kimi 四款开源模型在第三方平台上的性能差异，进一步分析影响词元服务性能的关键因素，总结产业核心观察，明确下一步工作计划，旨在为用户选型提供参考，并为产业界优化服务能力提供方向指引。IT之家附报告核心观点：1. 国内词元服务每秒吞吐量较 2025 年翻倍，仍低于国外报告提出，8 月份国内各模型平均 TPS（每秒输出词元数）达到 78.23（个 / 秒），与 2025 年均值 38.25（个 / 秒）相比实现翻倍。但 8 月份国外典型模型的 TPS 均值为 112.82（个 / 秒），与 2025 年 12 月的 51.35（个 / 秒）相比，提升亦超过一倍，整体优于国内。▲ 所有大模型词元服务月均 TPS2. 词元服务时延有所增加，国内外趋势一致报告提出，今年以来，国内各模型的平均 TTFT（首词时延）呈现持续提升态势，8 月份均值达到 1.26 秒，相较于 2025 年平均值 0.78 秒明显增加。但同时 8 月份国外典型模型 TTFT 平均值达到 2.08 秒，相比 4 月份 1.04 秒亦明显增加。值得注意的是，TTFT 上升并非单纯的性能退化，而是伴随着模型参数量增加、上下文长度增加、调用量增加等多种因素同步产生的结果。▲ 所有大模型词元服务的月均 TTFT3. 2026 年词元服务价格明显回升报告提出，经历了过去两年价格战后，2026 年国内外模型服务价格明显上涨。国内 2025 下半年归一化均价为 6.8 元，而今年以来均价为 13.46 元，涨幅接近 1 倍。但国外价格仍高于国内，2026 年以来发布的典型模型平均归一价格约为 117.8 元。▲ 国内原厂大模型发布时归一化价格趋势图4. 模型上下文长度不断向百万级长度扩展报告提出，被监测的模型中，上下文长度达到 1M（1 百万词元）的模型占比 47.8%，200K 及以上的合计达 95.7%，相比 2025 年底的占比提高超过 76 个百分点，而低于 200K 的模型占比持续减少。▲ 国内原厂大模型发布时归一化价格趋势图5. 开源模型词元服务性能提升显著，同一模型在不同平台性能波动较大报告提出，5 月份更新了 4 款开源模型的新版本进行监测，结果显示 TPS 持续提升，TTFT 时延不断压缩。例如 8 月份 DeepSeek-V4-Pro 的 TPS 已达到 DeepSeek-V3.2 的 2 倍。时延方面，5 月份主要模型完成换代升级后，TTFT 普遍出现阶段性上升，随着推理优化措施落地，时延指标逐步回落至换代前水平。同时，4 款模型在不同平台上的 TPS、TTFT、调用成功率表现不一。部分第三方平台性能明显优于官方平台提供的模型服务，同一模型在不同平台间的 TPS 差距最大可接近一倍。各平台对相同模型的推理加速、优化策略、成本控制不同，是造成性能分化的主要原因。▲ 开源模型性能综合对比图", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/017/518.htm", "publishedAt": "2026-10-24T14:41:49+00:00"}, {"title": "消息称字节跳动 AI 短剧产品内部整合：小云雀并入即梦，仍保留独立入口", "summary": "IT之家 10 月 24 日消息，据 36 氪今日报道，字节跳动内部近期完成了一次业务整合，AI 短剧创作平台小云雀并入智能创作平台即梦，产品仍保留独立入口。此次调整以资源整合为主，即梦已经接入小云雀的短剧相关能力。调整后，小云雀的运营由即梦运营和市场负责人陈欣然负责，产品团队没有变化。小云雀和即梦均出自字节剪映团队。小云雀定位为一站式 AI 内容创作平台，今年 3 月上线短剧 Agent，支持上传最多 10 万字剧本、一键生成视频成片，搭载了字节自研的 Seedance 2.0 模型，在短剧、漫剧的标准化生产场景中具备从剧本解析到分镜生成的完整流程能力。即梦 AI 于 2024 年 5 月推出，最初覆盖文生图、文生视频等生成能力，此后逐步向智能画布、首尾帧控制等偏专业创作的 Agent 编辑工具延伸，用户群体覆盖普通创作者与专业设计师。IT之家注意到，两者在功能上存在重叠：都能在平台内完成“从生成到成片”的全流程，与剪映的剪辑环节形成平行的用户路径。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/017/480.htm", "publishedAt": "2026-10-24T10:59:27+00:00"}, {"title": "智源众智 FlagOS 2.2 让前沿模型与多元算力协同演进", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/mhdJwMMzYFedMFHKfHWs?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-23T19:40:29+00:00"}, {"title": "奥特曼最新 45 分钟访谈：一年不写代码、压力大到不想起床，还嫌 ChatGPT 太谄媚", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/sI3z2UMCrB5PPVDWTsLo?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-23T17:35:04+00:00"}, {"title": "千问蒋冠军：Personal Agent技术框架，需要模型、记忆与生态协同推进", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/6EJRFIef67xr3x6vyCJa?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-23T15:45:32+00:00"}, {"title": "🔥 优化及缺陷修复：开源 AI 无代码平台 NocoBase", "summary": "汇总一周产品更新日志，最新发布可前往我们的博客查看。 NocoBase 目前更新包括三个分支： main、next 和 develop。** main： 截至目前最稳定的版本，推荐安装此版本。 next： 包含即将发布的新功能，经过初步测试的版本，可能存在部分已知或未知问题。主要面向测试用户，用于收集反馈和进一步优化功能。适合愿意提前体验...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503191", "publishedAt": "2026-10-23T15:16:49+00:00"}, {"title": "2026 上海开源软件应用创新大赛「开源 AI 工具赛道」决赛名单公布", "summary": "2026 上海开源软件应用创新大赛「开源 AI 工具赛道」决赛入围名单今日公布，以下 10 支队伍成功晋级，将于 10 月 29 日在上海张江人工智能创新小镇参加总决赛。 现将入围名单按报名时间顺序公示如下： 项目名称 团队负责人 代码仓库地址 实时交互数字人引擎 李恒中 https://gitee.com/lipku/LiveTalking RapidOCR 王佳华...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503189", "published  Claude。本月初，Anthropic 还为 Claude 网页端新增了简体中文和繁体中文的语言选项。对于账号解封问题，Anthropic 官方帮助中心提供了申诉渠道。用户如果认为账号遭到错误停用，可以登录被封禁的账号并填写申诉表，由安全团队进一步调查停用原因。官方列出的封禁原因包括重复违反使用政策、从不受支持的地区创建账号以及违反服务条款。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/017/490.htm", "publishedAt": "2026-10-24T11:39:49+00:00"}, {"title": "显卡一日一价：英伟达停产传闻搅动华强北，RTX 5090 被炒至 6 万元", "summary": "IT之家 10 月 24 日消息，虽然英伟达予以否认，但关于“RTX 5090 停产”的传闻正在华强北引发一轮价格异动。据 21 财经今日报道，RTX 50 系列高端型号渠道报价“一日一价”，旗舰 RTX 5090 从官方初始零售价约 1.5 万至 1.6 万元，被炒至 5.5 万至 6 万元；RTX 5080 从初始售价约 8000 元涨至 1.7 万元。在华强北从业 16 年的金硕利电脑经理熊容容表示，半个月前 RTX 5080 渠道价还在 1.2 万元左右，短期上涨了 4000 至 5000 元；RTX 5090 此前约 3 万元，随后直接攀升至 5 万元级别。与此同时，走货主力型号 RTX 5060 也从约 2300 元涨至 3600 元以上。同一型号日内或隔日价差可达数百元，商户甚至不敢轻易出具书面报价单。市场此前流传英伟达可能停止为 RTX 50 系列供应 GB202 芯片，将产能转向 RTX PRO 专业显卡。但这一说法已遭到英伟达官方否认。IT之家此前报道，英伟达个人计算业务高级副总裁 Jeff Fisher 于 10 月 17 日在台北出席 RTX Spark 发布活动后回应称，英伟达没有停产 GeForce RTX 5090 系列，后续将继续供货；但他同时承认产能确实受到限制，供应紧张是整个行业面临的全球性问题，英伟达会全力将产品推向市场并继续发货。比“停产”更准确的表述来自英伟达开发者关系副总裁艾达 · 凯塔。她在首尔 RTX Spark 发布会后对媒体表示，消费级 GPU 短缺的根源在于内存供应不足，“这不是英伟达能够控制的事情”。据 EET-China 报道，消费级显卡所使用的 GDDR7 显存与 AI 服务器所需的高带宽内存共享先进制程产能，三星、SK 海力士、美光三大存储原厂已将 70% 至 90% 的先进产能优先分配给利润更高的 HBM，2026 年 AI 数据中心预计占据全球内存产能的约 70%。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/017/440.htm", "publishedAt": "2026-10-24T10:00:25+00:00"}, {"title": "AI Agent 正在改写 CPU 的价值：当 Token 变成行动，算力竞争不再只是拼 GPU", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/AkDgwN6h72cqUOJ35Zok?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-23T17:53:09+00:00"}, {"title": "GitLab 19.4 发布，新增目标驱动型智能体，强化成本控制", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/c6KGCCmGuad5wbAcCG61?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-23T15:11:00+00:00"}, {"title": "Xcode 27.2 推出对智能体友好、有效减少合并冲突的 JSON 项目配置格式", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/7ResdjAZYy8yltOh6drM?utm_source=rss&amp; 之外未能取得新的突破。进入 AI 时代后，苹果的 Siri 语音助手也落后于 OpenAI 和 Anthropic 的竞争产品。不过，苹果的产品依然广受欢迎。MacBook 是不少 AI 爱好者和普通用户的首选笔记本电脑，iPhone 随处可见，AirPods 自 2016 年问世以来，也凭借简洁时尚的设计受到消费者青睐。早在 2017 年，蒂尔就曾向《纽约时报》记者莫琳 · 多德断言，苹果的时代已经结束。但从那时起，苹果股价一直稳步上涨。IT之家从报道中获悉，蒂尔并未全盘否定苹果。他认为苹果是一只“经营良好的纯粹价值股”，只是对乔布斯去世后苹果失去长远眼光感到惋惜。“从某种意义上说，我仍然认为埃隆 · 马斯克或史蒂夫 · 乔布斯对社会的贡献远大于蒂姆 · 库克。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/017/537.htm", "publishedAt": "2026-10-25T00:23:21+00:00"}, {"title": "研究人员通过 DNS 数据库发现数千个公开的 Muse 聊天记录分享链接，Meta 已修复", "summary": "IT之家 10 月 24 日消息，Meta 旗下个人 AI 助手 Muse 的对话分享功能被曝存在隐私风险。网络安全研究团队 Claroc 于 10 月 18 日发布报告称，研究人员通过被动 DNS（Passive DNS）查询发现，超过 6800 个 Muse 分享页面的域名可以被检索到，部分页面包含个人财务资料、企业内部文件及机密会议准备信息。Meta 随后暂停了该功能，并表示正在调查问题及评估改进方案。Claroc 研究团队发现，Muse 会根据用户分享的对话标题生成网页地址，并将其部署在 cf.metaaiusercontent.com 域名下。由于对话标题被写入子域名，当用户或接收者访问分享页面时，相关域名可能被被动 DNS 服务记录，进而出现在可查询的历史 DNS 数据库中。研究人员表示，通过一次被动 DNS 查询，他们便发现了超过 6800 个分享页面的主机名。Claroc 随后抽查了数百个页面，发现其中部分内容涉及企业营收审查文件、小企业贷款申请、银行欺诈警报、房地产投资数据，以及员工年度休假安排等敏感信息。研究人员还发现，一名候选人为与一家前沿 AI 实验室负责人进行机密电话沟通准备的材料，其中包含内部联系人信息和会议时间。Claroc 指出，相关页面无需登录 Meta 账号即可访问，只要能够获得对应链接即可查看内容。问题并非源于攻击者破解了随机生成的标识符，而是因为完整域名被记录在被动 DNS 数据库中，研究人员可以通过查询重新发现这些分享地址。Claroc 于 10 月 8 日通过 Meta 的漏洞赏金计划提交了相关问题。Meta 发言人对此回应称，用户可以分享特定的 Muse 内容，并生成可通过链接访问的页面；公司已暂停这一功能，以审查研究报告并考虑如何调整链接的可发现性。Claroc 在 10 月 20 日更新的报告中表示，研究团队重新检查了此前能够在未登录状态下打开的 40 个分享页面，发现这些页面均已无法访问，相关主机名返回错误。IT之家注意到，已经进入被动 DNS 历史记录的域名及其对话标题仍然存在，暂停分享功能并不能彻底抹除此前留下的历史记录。研究团队同时强调，此次调查仅覆盖特定域名模式和一种发现渠道，不能据此推断 Muse 全部分享内容的暴露规模。Claroc 表示，没有证据表明这些页面已被恶意利用，也无法确定其他人是否曾在研究团队发现之前访问过相关内容。相关阅读：《Meta 的 AI 助手 Muse 被曝可深度分析用户社交关系，并为每位联系人建立个人档案》《Meta 个人智能体 Muse macOS 版被曝严重漏洞，可被劫持操控关联应用》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/017/517.htm", "publishedAt": "2026-10-24T14:39:18+00:00"}, {"title": "AI时代，神话并未消失：人类正在创造新的“数字神明”", "summary": "一、引言：当算法开始回答神谕式问题 在过去的几年里，一个越来越常见的场景开始出现：当人们面对复杂的人生问题或难以理解的世界变化时，他们不再首先询问宗教、哲学家或传统专家，而是打开一个人工智能系统。 他们向 AI 提问： 我应该选择什么职业？ 这个研究方向是否值得继续？ 未来社会会变成什么样？ 人类意识究竟是...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503123", "publishedAt": "2026-10-21T01:59:21+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "“让Token不空转”，讯飞如何把Agent推进企业核心流程", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/Lo9TLlRdvy4II38yaex0?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-23T17:40:09+00:00"}]}]};

const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
