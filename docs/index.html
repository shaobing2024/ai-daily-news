有很高价值。随着更多学生陆续作出课程和专业选择，这一趋势是否会持续，将会变得更加明朗。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/557.htm", "publishedAt": "2026-07-25T10:58:19+00:00"}, {"title": "OpenAI 加入，签署支持 AI 开源模型发展公开信组织增至 35 家", "summary": "IT之家 7 月 25 日消息，微软、英伟达、IBM、Meta 等 25 家美国科技公司昨日联名签署公开信，呼吁开放权重 AI 模型。声明表示，开放权重模型指任何人都可以下载、检查、修改并在自有基础设施上运行的人工智能模型，这类模型有助于扩大创新机会、加强竞争、降低风险，有助于推动人工智能进入生产生活各个领域，并避免人工智能发展收益集中在少数主体手中。IT之家注意到，目前该名单中的组织有所增加，已经达到 35 家（Nous Research、OpenClaw、Prime Intellect 3 家仅出现在签署名单中，没有在文末展示 logo），包括 OpenAI，新增组织如下：Cisco（思科）CohereDoorDashFireworks AIGitHubNous ResearchOpenAIOpenClawPalo Alto Networks（派拓网络）Prime Intellect相关阅读：《微软、英伟达、Meta 等 25 家公司签署公开信，呼吁美国政府支持 AI 开源模型发展》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/554.htm", "publishedAt": "2026-07-25T10:20:50+00:00"}, {"title": "OpenAI 突发服务器故障，ChatGPT、Codex 出现宕机", "summary": "IT之家 7 月 25 日消息，今日有大量网友反馈 OpenAI 突发服务器故障，ChatGPT、Codex 等均出现宕机情况。DownDetector 也显示全球 OpenAI 宕机出现大幅飙升，可被视作 ChatGPT 无法正常工作的指标。截至IT之家发文，该故障仍未修复。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/552.htm", "publishedAt": "2026-07-25T09:50:19+00:00"}, {"title": "纳德拉：微软自研 MAI 模型在 Excel 任务表现与 GPT-5.6 相当，且部署成本更低", "summary": "IT之家 7 月 25 日消息，科技媒体 firstpost 于 7 月 23 日发布博文，报道称微软首席执行官萨提亚 · 纳德拉（Satya Nadella）表示，微软自研 MAI 系列模型在许多应用场景中超越了前沿 AI，而且能降低企业部署 AI 成本。纳德拉表示微软正在推进“前沿扩散与控制”（Frontier Diffusion &amp; Control）战略，认为在未来企业 AI 场景下，客户不会再完全依赖单一前沿模型，会根据实际任务和需求，编排最合理的 AI 模型调用系统。微软表示在面向特定产品定制的强化学习环境（RLEs）下，MAI 模型通过学习真实的客户工作流程，在 GitHub Copilot 和 Excel 方面取得了显著的进步。纳德拉表示：在一个软件首次出现真实边际成本的世界里，我们如何确保前沿 AI 的优势能扩散到整个生态系统？关键是在真实世界的场景中优化成本-成果前沿。从实际操作上讲，这意味着为每项任务使用正确的模型，并围绕它优化上下文、技能、工具和智能体控制。在我们的产品中，来自 OpenAI 和 Anthropic 的前沿模型与 MAI 一起构成了编排系统。但模型只是爬山系统的一部分。控制、内存、上下文、工具、技能、用户交互等都塑造了这些智能体系统的评估和性能。纳德拉表示在大部分常见的 Excel 任务下，MAI 系列模型性能相当于 GPT-5.6，而且由于不需要依赖最新的 AI 加速器，企业可以在英伟达 H100/A100 GPU 上运行，因此部署成本更低。IT之家附上相关截图如下：", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/532.htm", "publishedAt": "2026-07-25T07:39:52+00:00"}, {"title": "网信办发布《国家信息化发展报告（2025 年）》：6G 完成第一阶段技术试验，生成式人工智能用户规模达 6.02 亿人", "summary": "IT之家 7 月 25 日消息，昨晚，国家互联网信息办公室发布《国家信息化发展报告（2025 年）》，总结 2025 年各地区各有关部门推进信息化发展成效，开展信息化发展水平监测评估。《报告》显示，我国芯片研发制造迈出坚实步伐，第五代精简指令集（RISC-V）技术应用加快发展。操作系统规模应用取得新进展，开源鸿蒙操作系统装载设备量超 12 亿台。量子科技取得重要突破，脑机接口技术加速应用，6G 完成第一阶段技术试验。人工智能技术加速发展，多款大模型产品性能位于全球前列，具身智能加快落地应用，智能体加速迭代演进。国家区块链网络加快布局建设。开源创新生态不断壮大，我国开源贡献者数量位居全球第二位。信息化人才培养体系不断完善，全民数字素养与技能持续提升。IT之家从报告获悉，网络基础设施提质升级，截至 2025 年底，我国 5G 基站总数达 483.8 万个，三分之二地级市达到千兆城市标准，5G 用户普及率增至 84.7%，超 330 个城市实现 5G-A 网络覆盖，IPv6 活跃用户数达 8.69 亿。算力基础设施加快布局，全国一体化算力网络不断优化。应用基础设施建设加速推进，具有一定影响力的工业互联网平台超 360 家。数据基础制度建设深入推进，《政务数据共享条例》发布实施，行业公共数据授权运营制度加快建设。数据资源规模质量快速提升，2025 年我国年度数据生产量达 52.26ZB。国家公共数据资源登记平台上线运行。产业生态建设取得新进展。2025 年我国数字经济核心产业增加值占 GDP 的比重超过 10.5%，数字产业收入 39.6 万亿元，同比增长 8.8%。网信企业发展活力不断增强，我国市值排名前 200 的网信企业总市值实现大幅提升。智慧农业建设稳步推进，制造业数字化转型成效明显。2025 年我国居民数字消费规模达 25.3 万亿元，同比增长 8.7%。数字化绿色化协同发展扎实推进，新一批国家绿色算力设施可再生能源利用率超 70%，“数绿融合”业态不断壮大。《报告》还提到，截至 2025 年底，共 748 款生成式人工智能服务完成备案，全年新增 446 款备案产品，我国生成式人工智能用户规模达 6.02 亿人，同比增长 141.7%。具身智能加快落地应用，2025 年人形机器人加快规模化量产，国内整机企业数量超 140 家，发布人形机器人产品超 330 款。智能体加速迭代演进，移动端智能体应用数量快速增长，从被动等待指令的“工具”变为主动预判需求决策的“伙伴”。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/527.htm", "publishedAt": "2026-07-25T07:24:58+00:00"}, {"title": "马斯克脑机公司 Neuralink 展示新动态：通过念头控制移动电动轮椅", "summary": "IT之家 7 月 25 日消息，马斯克旗下脑机公司 Neuralink 于 7 月 23 日在 X 平台发布动态，让用户只需要动下念头，就能让电动轮椅便如臂使指般开始移动。IT之家附上相关演示视频如下：技术实现方面，Neuralink 植入物拥有超过 1000 个电极，分布在超过 100 根线上，每根线比人类头发还细，并通过手术机器人插入运动皮层。这些电极会记录神经元放电的活动，通过机器学习模型，映射计算机光标上下左右移动，所以在临床试验参与者传递意图移动的念头后，可以操作电动轮椅前进、倒车、转向等。据 Neuralink 介绍，参与者可以看到来自轮椅安装摄像头的实时视频画面，定制程序会显示参与者正前方的实时摄像头画面：光标上移，轮椅前进；光标下移，轮椅后退；左右移动则控制转向。光标推得越远，轮椅移动速度越快。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/526.htm", "publishedAt": "2026-07-25T07:20:51+00:00"}, {"title": "马斯克看好中国 AI 发展：未来某个时刻有望成为全球领导者", "summary": "IT之家 7 月 25 日消息，特斯拉 CEO 埃隆 · 马斯克当地时间 7 月 23 日在接受英国《经济学人》专访时表示，中国在机器人和 AI 领域实力雄厚，未来“很有可能在某个时候成为领导者”。马斯克特别提及了中国 AI 大模型的最新进展。他对月之暗面刚刚发布的 Kimi K3 模型印象深刻。马斯克认为，中国在 AI 竞赛中拥有决定性优势，其中电力供应能力是关键因素。据他估计，2026 年中国发电量可能达到美国的三倍，足以支撑耗能巨大的 AI 数据中心运行。他同时预测，中国最终能够通过自主研发光刻机，克服美国出口管制导致的先进芯片短缺问题。马斯克称，中国距离解决先进光刻技术问题“比大多数人认为的更近”。在 AI 安全治理方面，马斯克呼吁全球各大 AI 实验室应在发布新模型前，给予彼此一到两周的时间审查安全问题，并将潜在风险分别报告给中美两国的政府部门。他认为这种合作机制应纳入中国 AI 开发商，而非仅限美国企业参与。马斯克明确反对美国政府内部一些官员禁止美国企业使用中国 AI 模型的主张，他认为此类限制无法减缓中国 AI 的发展速度。马斯克在访谈中还重申，AI 整体智能水平可能在五年内超过人类全部智能总和，同时他认为 AI 最有可能带来全民富足时代。马斯克认为，未来十年内，机器人进入工作场景后，可能推动社会进入“极大丰富”的阶段，使货币的重要性下降。他表示，人工智能系统和机器人最终可能承担大量数字和实体工作，让人类劳动变为“可选择”。他表示，如果大量工作被 AI 和机器人取代，社会可能需要进行大规模财富再分配，以实现“全民高收入”。他认为，在机器能够持续生产大量商品和服务的情况下，通货紧缩可能会比通货膨胀更值得关注，因此政府可能需要通过直接发放资金等方式进行调节。在采访中，马斯克还谈到了 SpaceX、政治影响力以及国际事务等话题。他表示，自己曾在美国政治活动中过度投入，“坦率地说，我有些被带偏了”。相关阅读：《马斯克：值得承担致命 AI 风险，AI 最有可能带来全民富足》《马斯克呼吁 AI 实验室携手审查安全问题，愿与 OpenAI 奥尔特曼“冰释前嫌”》《马斯克：当初帮忙创立 OpenAI 却意外加速了 AI 竞赛，这并非我本意》《微醺的马斯克聊嗨了：盛赞中国、预言天上的 AI》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/496.htm", "publishedAt": "2026-07-25T06:54:20+00:00"}, {"title": "吴恩达开源桌面 AI 智能体 OpenWorker，已获 3.7k Star", "summary": "IT之家 7 月 25 日消息，吴恩达（Andrew Ng）昨日（7 月 24 日）在领英（LinkedIn）发布动态，宣布推出开源 AI 智能体 OpenWorker，不仅满足聊天交互，还能高效完成用户交代的任务。在运行平台上，适用于苹果 macOS 的 OpenWorker 已经上线，Github 页面显示 Windows 版已支持运行，但尚未签名。OpenWorker 基于 Ng 的 aisuite 库构建，这是一个与提供商无关的 Python 框架，通过统一 API 支持多种大型语言模型。功能方面，吴恩达表示 OpenWorker 可以帮用户润色文件，准备客户简报、梳理日程、起草报告或处理 Slack 警报。它可以在你的文件和日常工具中运行，生成所需成果，并在执行任何重要操作前进行检查。在模型调用方面，OpenWorker 并不捆绑模型，用户可以使用 GPT 5.6 Sol、Claude Fable、Gemini 3.6，以及包括 Kimi、GLM、DeepSeek、Inkling 在内的开源 AI 模型，并支持 Ollama 等本地 AI 模型。吴恩达，图源：WikiMediaIT之家发稿前，访问 GitHub 项目页面，OpenWorker 目前已收获 3.7k Star。Star 是 GitHub 平台上的核心功能，类似于社交媒体的“点赞”或浏览器的“收藏夹”。用户点击仓库右上角的 Star 按钮即可标记喜欢的项目，方便日后在个人主页查找，同时它也是衡量开源项目受欢迎程度与质量的重要指标。参考点此前往 GitHub 页面，访问吴恩达的 OpenWorker 项目", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/493.htm", "publishedAt": "2026-07-25T06:42:27+00:00"}, {"title": "老黄说得对：特斯拉马斯克点赞英伟达黄仁勋首条 X 平台帖文", "summary": "IT之家 7 月 25 日消息，特斯拉、SpaceX 首席执行官埃隆 · 马斯克昨天转发英伟达 CEO 黄仁勋首条 X 平台帖文。马斯克还在转发的同时配文：“我完全支持，黄仁勋说得对。”据IT之家此前援引外媒报道，黄仁勋首条 X 平台帖文分享了英伟达签署的公开信，阐述开源模型为何重要。该公开信共有 3 页，包括英伟达、微软、Meta、IBM、戴尔科技、Palantir 和 Hugging Face 在内的 25 家公司共同签署。黄仁勋表示：“世界需要前沿闭源模型，也需要前沿开源模型。”黄仁勋在倡议中指出，AI 模型蒸馏等开源衍生技术和早年开源软件运动逻辑一脉相承，是行业创新根基，不能与非法盗用闭源模型技术混为一谈。开源权重模型能降低 AI 落地门槛，中小企业、高校均可低成本迭代模型，充分激活市场竞争；同时开源架构避免算力、技术寡头垄断，让医疗、制造、农业等实体经济广泛共享 AI 红利。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/489.htm", "publishedAt": "2026-07-25T06:14:54+00:00"}, {"title": "亿万富翁投资人马克 · 库班：下一个产生重大影响的 AI 应用或是“工作模拟器”", "summary": "IT之家 7 月 25 日消息，据《商业内幕》今天（25 日）报道，科技亿万富豪、前《创智赢家》投资人马克 · 库班认为，过去几十年里，职场新人主要靠主动争取实践机会、跟随同事学习来积累经验，这种成长路径可能会被彻底改变。库班在 X 发文称，下一项具有重大影响力的 AI 应用可能是“工作模拟器”。“进入 AI 时代后，员工积累经验的方式将与今天完全不同。他们在企业内部接触同事、学习知识和经验的机会会减少，而过去形成判断力主要依靠的正是这些互动。”库班预计，未来员工可能像赛车手和飞行员一样，先在模拟环境中接受训练，学习如何应对真实职场中的各种情况。商业飞行员早已需要在模拟器中完成大量训练，赛车手近年来也越来越多地借助模拟器练习，不必每次都前往赛道。“有远见的企业，会让最了解业务的员工和利益相关方共同设计模拟器，把员工可能遇到的各种情况全部纳入训练，帮助他们提前做好准备。入职培训的含义将被彻底改写。”剑桥大学组织社会学与领导力教授托马斯 · 鲁莱指出，许多机构和商学院已经利用虚拟现实开展无意识偏见等培训。“工作模拟并非全新的概念，但未来很可能更加普及。难以被 AI 取代的职业通常需要多人协作、综合运用不同技能，并根据现场环境迅速分析和判断。”鲁莱以水管工和电工为例，并指出 AI 完全可以生成各种训练情境，帮助人们学习。例如，刚取得执业资格的律师可以反复模拟取证、庭审和和解谈判，在真正接手案件前熟悉流程。实习医生也可以与 AI 患者交流、参与虚拟手术，并通过模拟急救场景积累经验。库班认为，如果律师事务所和医院能把资深同事的知识与经验融入模拟情境，工作模拟器便能提供更实用、更贴近真实环境的培训。据IT之家了解，库班目前认为，AI 将改变世界，但仍不擅长“察言观色”，也缺乏人类的情商，只有与人类协作才能充分发挥价值。“把 AI 的生产力与人类的实时应变能力和判断力结合起来，双方投入都能获得最大回报。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/484.htm", "publishedAt": "2026-07-25T05:51:21+00:00"}, {"title": "全新统一流式架构，Vivix灵动时刻正式发布首个实时互动模型", "summary": "单卡突破10000 video tokens/s，Vivix打通实时多模态生成全链路", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/460174.html", "publishedAt": "2026-07-25T03:21:53+00:00"}, {"title": "从“卷模型”到“算总账”：AI 产业竞争开始拼什么 | 请回答 WAIC 2026", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/SyHXRLS6AR3vI6VtVjDo?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-24T16:45:21+00:00"}, {"title": "合肥又押中AI独角兽：多模态赛道，3个月融了21亿", "summary": "跑出原生全模态新路径", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/460154.html", "publishedAt": "2026-07-24T14:42:32+00:00"}, {"title": "国产世界模型登顶李飞飞团队榜单！适配国产昇腾算力、代码权重全开源", "summary": "给它一张图，还你整个世界", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/460041.html", "publishedAt": "2026-07-24T14:19:06+00:00"}, {"title": "对话腾讯副总裁林松涛：意图正在代替入口，Agent 需要一颗「小脑」", "summary": "大模型是「大脑」，Marvis 想补上「小脑」#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1673039?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-07-24T07:43:20+00:00"}, {"title": "200 家硅谷初创联名反对白宫政府封禁中国开源 AI 模型", "summary": "\"这对 Anthropic 来说太好了，因为我们所有人都不得不花钱买 Anthropic 的服务。\" 7 月 22 日，近 200 家硅谷初创企业联名致信白宫，呼吁不要切断美国开发者获取中国开源 AI 模型的渠道。Particle 创始人 Suhail Doshi 在接受 POLITICO 采访时把话说得最直白：\"将会有数百家公司瞬间死掉。\" 这封信来自一个刚刚成立的叫\"...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/478417", "publishedAt": "2026-07-24T06:39:45+00:00"}, {"title": "德国黑森林实验室发布 Flux3 多模态模型", "summary": "德国人工智能初创公司黑森林实验室（Black Forest Labs）正式发布多模态基础模型 Flux3。该模型基于Self-Flow架构打造，配备专用的图像、视频、音频及动作编解码器，实现了对物理与数字环境的统一理解与生成。 作为首款支持原生音频生成的模型，Flux3可一次性输出长达20秒的音视频同步片段，并涵盖文本/图像/视频转视频、...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/478329", "publishedAt": "2026-07-24T04:01:10+00:00"}, {"title": "Agent 工程思考：从 ReAct 到 Agent Harness", "summary": "从 ReAct 出发，文章讨论 Agent 工程如何从 “模型循环” 走向 Harness：通过前后端共享的 State Schema、运行事实和 UI 边界，让模型行为变成可交互、可恢复、可控制、可追溯的产品能力。", "sourceName": "开源中国", "sourceUrl": "https://my.oschina.net/vivotech/blog/19726101", "publishedAt": "2026-07-24T03:47:08+00:00"}, {"title": "微软推出两款自研模型：MAI-Image-2.5-Pro 和 MAI-Voice-2-Flash", "summary": "微软宣布推出两款自研 AI 模型 MAI-Image-2.5-Pro 和 MAI-Voice-2-Flash，均已进入公开预览阶段。 其中： MAI-Image-2.5-Pro 适用于对质量要求极高的应用场景。包括精美的图片、精细的编辑以及精准的图像内文字渲染。Pro 是我们迄今为止保真度最高的图像模型，定价为每百万个文本输入 token 5 美元，每百万个图像输入 to...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/478288/mai-image-2-5-pro-and-mai-voice-2-flash", "publishedAt": "2026-07-24T03:01:24+00:00"}, {"title": const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
