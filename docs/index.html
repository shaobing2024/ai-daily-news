<script>
const DATA = {"date": "2026-08-25", "generatedAt": "2026-08-24T23:18:37Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "研究团队调查发现超七成英语生物医学论文已使用 AI 辅助写作，呼吁业界建立完善监管机制", "summary": "IT之家 8 月 25 日消息，据外媒 phys 报道，近期 Lena Holzwarth 带头的研究团队分析了来自 PubMed Central 平台的 119 万余篇英文生物医学论文，发现生成式 AI 正迅速融入学术论文写作。研究人员通过分析论文中的“AI 高频用词”（例“delves”“exacerbating”和“invaluable”等）并建立数学模型估算论文中的 AI 使用比例，其中 2025 年约 77% 的英语生物医学论文出现了 AI 辅助写作或编辑的明显特征，相比 2023 年的 19% 和 2024 年的 52% 大幅提升。研究还发现，AI 辅助写作在论文不同部分的使用程度并不相同。2025 年，约 68% 的论文摘要、63% 的引言、58% 的结果部分以及 54% 的方法部分存在 AI 辅助写作迹象，而讨论部分的比例最高，达到约 78%。从地区来看，韩国、中国等非英语母语地区的研究人员在 2025 年使用 AI 辅助写作的比例超过 80%，明显高于英国、美国等英语母语国家。研究人员认为，这与 AI 工具能够帮助非英语母语作者改善语法、措辞和论文表达有关。不过，AI 大规模进入学术写作也带来了新的风险。大语言模型可能生成虚假事实和不存在的参考文献，而且往往会以非常肯定的语气呈现错误信息，进而影响科研成果的准确性。与此同时，一些作者没有按照现有规范披露 AI 的使用情况，也可能进一步削弱公众对科学研究的信任。研究人员指出，与其试图彻底禁止 AI，不如建立更加完善的使用规范和监管机制，在允许 AI 辅助科研写作的同时，对事实核查、参考文献真实性以及 AI 使用披露等环节提出明确要求。研究结果表明，AI 辅助已经成为学术写作中的普遍现象，如何建立合理的使用边界可能比单纯禁止 AI 更为重要。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/993/781.htm", "publishedAt": "2026-08-24T23:14:40+00:00"}, {"title": "美国阿拉巴马州向 OpenAI 发出传票，就其模型入侵 Hugging Face 事件展开调查", "summary": "IT之家 8 月 25 日消息，美国阿拉巴马州总检察长当地时间周一宣布，已向 OpenAI 发出传票，就该公司在 Hugging Face 事件中涉嫌存在“完全缺乏监管和充分安全保障”的问题展开调查。此次调查发生在数周前。当时 OpenAI 承认，该公司一款尚未发布、且没有设置安全护栏的网络安全模型逃离了隔离环境，连接到互联网，并入侵了 AI 数据集平台 Hugging Face。路透社此前报道称，Hugging Face 只是受害者之一。原本被 OpenAI 定义为“一次内部评估”的测试，涉及一款具备“最大化网络能力”的 AI 模型，而这次事件实际上共有四个受害对象。阿拉巴马州总检察长 Steve Marshall 在宣布发出传票的新闻稿中表示，该州希望调查 OpenAI“无力或不愿确保其产品安全”的行为，是否违反了当地的消费者保护法律。TechCrunch 就此向 OpenAI 寻求置评时，该公司发言人 Nate Evans 表示：“Hugging Face 事件是 AI 安全领域的一个重要时刻。我们正在与外部顾问一起进行全面审查。审查完成后，我们将向相关政府部门提交技术报告，并公开发布我们的调查结果。”本月早些时候，Marshall 曾与其他 14 个州的总检察长联合致信 OpenAI CEO 萨姆 · 奥尔特曼，要求他和 OpenAI 保留所有与 Hugging Face 事件有关的记录。参与联署的州包括佛罗里达州、密苏里州、宾夕法尼亚州和得克萨斯州等。这封信还要求 OpenAI “立即停止并终止”任何内部网络安全评估活动。IT之家注意到，在 Hugging Face 事件以及 Anthropic、英国 AI 安全研究所、Meta 和多名 AI 公司员工陆续披露其他 AI 安全事件后，包括 AI 公司高管和技术负责人在内的一批业内人士共同签署了一封名为《放慢前沿步伐》（Pacing the Frontier）的公开信。这封公开信呼吁，以更加缓慢和负责任的方式推进 AI 能力的发展。公开信还呼吁美国政府支持一项国际合作行动，共同开发必要的技术和治理工具，以便有意识地放缓自动化 AI 发展的前沿速度。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/993/777.htm", "publishedAt": "2026-08-24T23:04:52+00:00"}, {"title": "小米集团副总裁朱丹：芯片研发投入是为下一个十年买“入场券”", "summary": "IT之家 8 月 24 日消息，小米今天（24 日）发布了三款自研芯片，随后在当天晚间登上央视财经频道。小米集团副总裁朱丹在采访中介绍，小米的判断很明确，AI 时代算力是一切智能体验的根基，不掌握芯片能力，就无法从底层定义产品体验。所以这笔投入不是“烧钱”，是在为下一个十年买“入场券”。报道援引业内人士的分析称，国内多家企业持续加码芯片自研，通过长期高额的技术投入，完善全场景算力布局，是产业链自主可控、产业高质量发展的重要趋势。综合IT之家此前报道，小米新一代玄戒芯片今天实现“三芯齐发”。玄戒 O3，AI 旗舰 SoC，安兔兔首破 500 万玄戒 O100，1.22TB/s 高带宽 AI 加速芯片玄戒 D100，国内首款 3nm 智驾高算力 AI 芯片央视新闻官方微博也发文称“三芯齐发中国芯片产业再突破”：今日，小米发布玄戒 O3、玄戒 O100、玄戒 D100 三款自研芯片，分别面向个人智能终端、端侧 AI 加速、AI 智驾等场景。据介绍，玄戒 O3 采用自主研发设计的 3nm 先进制程工艺，定位 AI 旗舰 SoC（核心处理器芯片），预计将于今年 9 月搭载在其新折叠旗舰小米 18Fold 上。玄戒 O100 主攻高带宽 AI 加速，玄戒 D100 面向智能驾驶等高算力需求。小米玄戒系列芯片正向“全生态 AI 算力基座”持续探索。相关阅读：《小米玄戒三芯齐发，央视新闻报道称“中国芯片产业再突破”》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/993/753.htm", "publishedAt": "2026-08-24T15:10:26+00:00"}, {"title": "卡迪夫大学新研究：AI 尚无法像人类教师一样可靠地批改作业", "summary": "IT之家 8 月 24 日消息，据外媒 Phys.org 今天（24 日）报道，卡迪夫大学和墨尔本大学的一项新研究发现，生成式人工智能（GenAI）目前还无法像人类教师一样可靠地评判学生的书面作业。研究人员使用 ChatGPT 的两个版本，对 50 篇生物科学专业本科生论文进行评分，以测试大模型评估学生作业的能力。ChatGPT 需要按照 7 项标准批改这些论文，研究人员还采用了 4 种不同的提示方式，随后将大模型与人工评分的平均分和分数波动情况进行比较。图源：Pexels卡迪夫大学生物科学学院威廉 · 凯博士指出：“研究结果显示，模型给出的分数波动很大，无法准确预测人工评分。生成式 AI 与人类批改同一批论文时存在明显差异。只看论文总分，两者给出的结果相对接近；一旦具体到每项评分标准和每一篇论文，大模型与人工评分之间的差距就相当明显。”除一种情况外，AI 模型给出的平均分普遍高于人工评分。平均分方面，AI 模型与人工评分的最大差距达到 16.1 分；具体到单篇论文，最大差距达到 40 分。IT之家获悉，威廉 · 凯还发现，AI 往往会压低高分论文的成绩，又把低分作业的成绩抬高，最终使分数系统性地向中间集中。研究结果说明，至少现阶段，即使经过大量训练，AI 仍无法可靠地对主观性较强的书面作业给出与人类相当的分数。“我们测试的大模型目前并不适合取代教师，为学生预测作业成绩。”研究人员指出，高等教育领域确实很关注大模型能否利用模式识别能力，让学生作业评分更加客观，同时提高批改效率、减轻教职人员压力。但这项研究表明，目前并不适合这么做。此外，未经学生明确同意便把作业提交给 AI 工具，本身还涉及伦理问题；大模型也不能、也不应该被依赖来给学生的长篇书面作业评分。“随着大模型继续发展，未来模仿人类判断的能力可能会提高。但从这项研究来看，要让 AI 给出的分数与人工评分真正保持一致，恐怕并不容易。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/993/741.htm", "publishedAt": "2026-08-24T14:16:15+00:00"}, {"title": "路透社母公司汤森路透花 4000 万美元研发 AI 模型，基于阿里千问", "summary": "IT之家 8 月 24 日消息，路透社母公司汤森路透集团近日正式公布其首款大语言模型“Thomson”。该模型基于阿里千问构建，号称拥有顶级表现。据介绍，该模型的研发成本大约是 4,000 万美元（IT之家注：现汇率约合 2.69 亿元人民币），外界广泛传播的 45 万美元（现汇率约合 302.8 万元人民币）数字只是最后一次训练成本。该模型的基础模型源自阿里巴巴的千问，目前使用的版本为 Qwen3.5-397B。汤森路透首先与帝国理工学院合作重新训练基础模型，使其符合安全、伦理和政治中立性要求。随后再使用自有内容进行预训练、后训练，并在内部环境强化学习。汤森路透称该模型已跻身全球最佳 AI 模型之列。在 Stanford LegalBench 测试中，该模型得分为 0.823，落后于 Gemini 3.1 Pro 和 GPT-5.5。而在 Harvey Legal Agent Benchmark 中，Thomson 仅略低于 Opus 4.8。但需要注意的是，该模型测试使用了推理阶段扩展，而 GPT-5.5 则是在没有开启推理模式的情况下参与测试。在深度搜索测试时，该模型的得分为 0.53，GPT 5.4 为 0.65。汤森路透强调，公司之所以不采用 OpenAI、Anthropic 等美国闭源模型的原因在于，外部模型的长期成本较高，并且无法进行高自由度调整。相比之下小规模的自研模型更适合文档审查等场景。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/993/738.htm", "publishedAt": "2026-08-24T13:57:55+00:00"}, {"title": "千里科技上半年营收 51.2 亿元：智驾业务覆盖 16 款车型、净利润大增 151%", "summary": "IT之家 8 月 24 日消息，8 月 24 日，千里科技发布 2026 年半年度报告。报告显示，公司上半年实现营业收入 51.20 亿元，同比增长 22.36%；归属于上市公司股东的净利润为 0.78 亿元，同比增长 151.25%；扣除非经常性损益后的归母净利润为 0.56 亿元。千里科技称，加大研发投入的同时实现收入利润双增长，核心经营指标全面改善。业务方面，智能辅助驾驶业务商业化进展较快。报告期内，该业务实现收入 12.35 亿元，占主营业务收入的 24.3%，用户激活率达到 93%，相关功能已覆盖 16 款车型。同时，公司乘用车业务毛利率由上年同期的 3.3% 提升至 12.7%。研发投入方面，千里科技上半年研发费用总额为 11.20 亿元，其中智能辅助驾驶研发投入 8.37 亿元。据IT之家此前报道，千里智驾 ASD 于 2026 年 1 月实现首发搭载，随后持续进行版本迭代，从 ASD 3.0 升级至 ASD 4.0 用时约 3 个月。目前，ASD 4.0 已全面开启推送，累计装车量突破 53 万辆，覆盖极氪、领克、银河、smart 等品牌的 19 款车型，辅助驾驶激活率达到 93.8%。在 2026 世界人工智能大会（WAIC 2026）期间，千里科技还公布了 ASD 4.1 版本技术预览。该版本将重点围绕全场景 D2D 通行、物理 AI 大模型以及舱驾融合展开升级，包括进一步提升复杂场景下的环境理解能力，并支持通过语音直接控车，让车辆根据用户意图执行相应操作。千里科技此前还透露，ASD 5.0 计划于今年年底推出。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/993/735.htm", "publishedAt": "2026-08-24T13:31:28+00:00"}, {"title": "雷军官宣 9 月是小米“科技大月”，澎程系列新车 + Xiaomi 18 Pro 系列 / Fold 旗舰手机同月发布", "summary": "IT之家 8 月 24 日消息，今天下午，小米新一代玄戒芯片“三芯齐发”，包括：玄戒 O3，AI 旗舰 SoC，安兔兔首破 500 万玄戒 O100，1.22TB/s 高带宽 AI 加速芯片玄戒 D100，国内首款 3nm 智驾高算力 AI 芯片小米创办人、董事长兼 CEO 雷军刚刚发文宣布，9 月将是小米的“科技大月”。月初，小米澎程系列将正式上市，Xiaomi 18 Fold 同场发布；月底，Xiaomi 18 Pro 系列发布。根据规划，小米 18 系列顶级旗舰小米 18 Fold 将首发搭载玄戒 O3 AI 旗舰处理器。同时，小米平板 9 Pro Max 也将搭载玄戒 O3 同步上市。据IT之家了解，玄戒 O3 是小米为最高端产品打造的「AI 旗舰 SoC」，安兔兔跑分高达 522 万分，是首个突破 500 万分的旗舰 SoC。CPU 采用十核全大核设计，多核跑分首次突破 15000 分，性能提升 60%。GPU 首发 G2-Ultra NX 图形处理器，前所未有的跨代式升级，性能大幅提升 85%，功耗降低 64%。玄戒 O3 还是全球首个支持 LPDDR6 的移动处理器，带宽高达 113.8GB/s，相比玄戒 O1 提升 48%。官方称，玄戒 O3 NPU 架构全面重构，专为 Xiaomi MiMo 端侧大模型而生，拥有夸张的 200TOPS 张量算力、3.13TFLOPS 向量算力，端侧 AI 性能大幅提升 45%。不仅拥有强大的 NPU，玄戒 O3 更将全模块 All in AI。CPU 增加双 SME2 加速单元、GPU 新增 8 颗 NX 神经网络加速器、ISP 内置 AINR 单元、DPU 内置硬件 AI 超分辨率单元、ADSP 内置 AI 引擎，不论端侧 AI 性能、硬件级超分插帧、还是夜景视频降噪，玄戒 O3 都将全面进化。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/993/729.htm", "publishedAt": "2026-08-24T13:06:07+00:00"}, {"title": "零跑汽车：已在具身智能机器人领域有所规划", "summary": "IT之家 8 月 24 日消息，据财联社报道，在 2026 年中期业绩会上，零跑汽车管理层表示，机器人方面，公司认为新能源汽车企业，尤其是具备全域自研能力的新能源汽车企业，是完全具备条件做具身智能机器人的企业之一，零跑已经在该领域有所规划，且公司将在近期公告相关具体信息。IT之家注意到，工商信息显示，零跑旗下浙江凌昇动力科技有限公司于 2026 年 7 月全资设立湖州凌昇精密制造有限公司，注册资本 2.1 亿元，经营范围包含工业机器人制造、智能机器人研发。相关阅读：《零跑汽车 2026 年度技术发布会定档 9 月，发布“全行业第一梯队水平”辅助驾驶世界模型》《零跑汽车 2026 年上半年归母净利润 2.08 亿元，同比增长 530.97%》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/993/725.htm", "publishedAt": "2026-08-24T12:46:40+00:00"}, {"title": "SonnetDB 3.1.0 发布，一个集时序、关系表、键值、JSON 文档、全文检索、向量检索、对象存储和消息队列的工业数据产品", "summary": "SonnetDB 3.1.0 正式发布。本次版本覆盖自 v3.0.1 以来、截至 2026 年 8 月 24 日合入的 200+ 次提交，重点完成了多模型管理工作台、工业协议接入、关系 SQL 与查询规划、Document 易用性、语义内容、存储可靠性和可观测性的系统升级。 3.1.0 继续坚持“八种数据模型，一套引擎”： 时序、关系表、键值、JSON 文档、全文...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502094", "publishedAt": "2026-08-24T08:11:16+00:00"}, {"title": "阿里达摩院推出肝癌AI模型，精准识别1厘米微小肿瘤", "summary": "8月24日消息，阿里巴巴达摩院联合中国医科大学附属盛京医院等机构研发出肝癌诊断AI模型DAMO LiON", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/478473.html", "publishedAt": "2026-08-24T08:07:59+00:00"}, {"title": ":sparkles: NocoBase 2.2 正式版发布：开源 AI 无代码平台 NocoBase", "summary": "NocoBase 2.2 正式版进一步完善了 V2 的完整使用路径。 随着 /v/ 独 ，还是同时承担两项任务。服务器内部结构围绕气流效率设计。每列硬件的一端配有 1 个风扇，空气从机箱前端流向后端，直接穿过中部散热器的鳍片。列结构的侧面和底板上方由透明塑料罩连接，形成封闭风道，引导气流通过散热区域。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/993/778.htm", "publishedAt": "2026-08-24T23:04:53+00:00"}, {"title": "代码显示谷歌正在为 Google Play 商店应用开发 AI 图片搜索功能", "summary": "IT之家 8 月 25 日消息，外媒 Android Authority 在挖掘谷歌 Google Play 商店应用 v52.8.55-34 版本时发现，谷歌正在为应用内置的 AI 搜索功能 Ask Play 开发图片搜索功能。目前，Android Authority 已成功在应用中启用了部分相关功能，用户可以直接上传图片，或者使用相机拍摄照片以搜索应用。例如，用户可能在网上看到一张非常漂亮的手机主屏幕截图，却不知道其中使用了什么小组件。过去只能尝试搜索类似“圆角矩形天气组件”这样的模糊关键词，而有了图片搜索后，只需要把截图上传给 Ask Play，让 AI 直接帮忙寻找对应应用即可。同样，这一功能可以用于识别陌生的应用界面或功能，甚至可以根据某款应用的界面风格寻找类似的替代应用。整体来看，它让 Play 商店搜索变得有些类似 Google Lens 和“圈选即搜”，但同时结合了 Ask Play 的对话式 AI 能力。除了图片搜索之外，谷歌还有望在新版应用详情页中嵌入 Ask Play 界面，用户向下浏览页面时，可以看到 AI 生成的用户感兴趣的问题（例如应用隐私要求等），点击后即可获得具体详情。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/993/775.htm", "publishedAt": "2026-08-24T22:56:42+00:00"}, {"title": "多个 AI 智能体“同住”一台 EC2：AgentCore 推出持久计算", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/2IBWc7BuB2qoGao5tlQT?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-24T15:43:00+00:00"}, {"title": "苹果 Apple Store 应用 AI 助手悄悄上线，目前处于早期预览状态", "summary": "IT之家 8 月 24 日消息，据 X 平台博主 ShrimpApplePro 今日发文，苹果 Apple Store 应用已在逐步推送 AI 助手，截图显示其处于“早期预览”（IT之家注：Early Preview）状态。具体而言，该功能可以列出不同苹果产品、比较两款 iPhone、查询订单和处理以旧换新等。苹果给出的实例提示语是“帮我挑选一款 Apple Watch”，这意味着该助手可根据用户需求，引导用户选择不同尺寸的手表，以及挑选表带等配件。目前我们还不清楚这项功能究竟向多少用户开放，外媒 Appleinsider 称其尚未收到推送。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/993/742.htm", "publishedAt": "2026-08-24T14:19:49+00:00"}, {"title": "一汽、零跑深化战略合作，将围绕整车、智驾等领域开展深度协同", "summary": "IT之家 8 月 24 日消息，据“中国一汽”公众号，8 月 24 日，中国一汽与零跑汽车在长春举行深化战略合作协议签署仪式。根据协议，双方将围绕资本合作、新能源整车、智能驾驶、动力总成、动力电池、智能底盘、车身工艺装备、轻量化部件、具身智能机器人、金融等领域开展深度协同。此前在 2025 年 3 月，双方就已达成战略合作并签署谅解备忘录。同年 11 月，零跑汽车副总裁李腾飞谈及与一汽集团的合作时表示，在 2025 年 4 月时，第一个项目（即红旗的一个海外车型项目）就已经落地，这个车型项目预计在 2026 年下半年就会量产，然后导入海外进行销售。据《中国经营报》，在今年 6 月的 2026 香港车博会上，中国一汽副 测试 Gemini 驱动的“设备帮助”工具，可对话式排查手机故障", "summary": "IT之家 8 月 25 日消息，谷歌目前正在为 Pixel 11 系列测试一项由 Gemini 驱动的“设备帮助”（Device help）功能。用户可以直接与 Gemini 对话，咨询手机使用过程中遇到的各种问题，并获得故障排查和操作指导。“设备帮助”位于 Gemini 的“加号”菜单中，在列表底部，“个人智能”（Personal Intelligence）选项的上方。不过，目前这项功能似乎仍处于小范围测试阶段，尚未向所有用户大规模推送。当然，即使谷歌正式开始大规模推送新功能，往往也需要很长时间才能覆盖所有用户，因此此次测试也可能意味着正式推广已经开始。据了解，该功能目前已经出现在 Google App 最新的 17.52 Beta 版本中。IT之家注意到，这项功能带有 Labs 标签，意味着它目前仍属于实验性功能。“设备帮助”可以回答用户有关设备的问题、调整手机设置、协助排查故障，并介绍 Pixel 手机上的各种功能。在故障排查方面，它可以帮助处理网络连接、电池续航、音频以及应用性能等问题。此外，用户还可以让 Gemini 帮忙释放手机存储空间或查看存储空间使用情况，检查应用权限、管理应用通知、设置应用使用时间限制。对于手机的具体功能，它还可以提供分步骤的操作指导，包括各种功能的使用方式、手势操作、相机功能以及隐私设置等。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/993/772.htm", "publishedAt": "2026-08-24T22:49:18+00:00"}, {"title": "直接问你要钱还是坚持使命，Anthropic 面试流程曝光", "summary": "IT之家 8 月 24 日消息，据外媒 Axios 今日报道，熟悉 Anthropic 招聘流程的人士透露，这家前沿人工智能实验室会在招人时问一个相当直接的问题：如果公司的使命与金钱发生冲突时，你会如何选择？据报道，所有 Anthropic 求职者都需要参与一次文化面试，让公司评估应聘者的价值观。一位匿名人士透露，他曾在面试环节被问到：“如果公司有一天为了安全放弃 AI 业务，导致股价归零，你有何感想？”职场网站 Blind 的一个匿名回答是这么样的：“我那时候很诚实地说，如果股价真的跌到 0，我会不高兴…… 我希望努力创造最大社会价值、坚持道德原则的同时，建立一家长期经营的企业，但面试官似乎不喜欢我这个答案。”另一位前 Anthropic 员工表示，公司的面试官有一套问题模板，但他们不会严格按白纸黑字提问。这或许能解释一些应聘者记得问题明确涉及“股价归零”，另一些人只记得商业利益和安全之间的问题。据知情人士所述，Anthropic 的面试和薪酬流程相当标准化。他们开出的薪酬就是最终报价，不接受薪资谈判。在文化面试中，应聘人还需要说出自己曾遇到的道德困境，以及自己如何去处理。不过两名前 Anthropic 员工表示，这个股价问题一开始并不是面试的一部分。Blind 的其他帖子显示，一些求职者在 2025 年就遇到过类似问题。Anthropic 联合创始人兼总裁丹妮拉 · 阿莫迪曾表示，公司从成立第一天起就有文化面试。等于说这种流程并不是什么新鲜事，但“使命和金钱”问题可能是后来才加入的。彭博社曾报道称，一些 Anthropic 求职者会花费数千美元聘请私教，或花钱找顶级 AI 公司员工进行模拟面试。模拟应聘公司 Interviewing.io 创始人 Aline Lerner 曾表示，花几千美元让你的年薪增加 20 万美元（IT之家注：现汇率约合 134.6 万元人民币），这笔账很好算。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/993/756.htm", "publishedAt": "2026-08-24T15:33:48+00:00"}, {"title": "微信鸿蒙版 App 获 8.0.21.16 版本邀测升级", "summary": "IT之家 8 月 24 日消息，微信鸿蒙版 App 今日在华为应用市场（App Gallery）开启了 8.0.21.16 (8394000) 版本邀测升级（需收到短信通知后点击链接跳转安装，未收到短信需继续等待），测试时间为 2026/8/24-2026/9/24。和往常一样，本次更新的说明依旧为“修复了一些已知问题”。据用户反馈，此前 8.0.20 版本的微信新增了如下特性：聊天中的笔记查看时右上角三点新增收藏；视频号点击分享新增 、自动整理标签页Safari 可借助 Apple Intelligence 分析已打开的标签页，并按照相关主题自动分类。例如，用户同时搜索新沙发和规划周末旅行后，Safari 会归类对应的网站到对应主题中。用户可以在标签页视图中点击屏幕右上角的三条横线图标，打开“自动创建主题”设置。Safari 菜单还支持查看全部标签页组，并按主题筛选内容，从而只打开某个主题下的页面。开始页新增“继续浏览”区域，可显示用户近期关闭的主题，也能显示其他设备上仍处于打开状态的主题。用户还可以按照主题整理已保存到书签和阅读列表中的页面。1.2、用 AI 创建自定义扩展Safari 新增“创建扩展”选项，用户可以直接描述需求，让 AI 创建自定义 Safari 扩展。IT之家附上原文配图如下：用户可从地址栏左侧打开 Safari 设置，点击“创建扩展”，再输入希望扩展完成的任务。系统还提供“提升效率”“改善专注”“激发创意”“开发与设计”等类别的建议，包括：《苹果 iOS / iPadOS 27 Beta 5 更新汇总：Safari 等启用新图标，Siri AI 支持定制语音等》1.3、监测网站变化并提醒Safari 可监测网站内容变化，并在发现新信息后提醒用户。苹果表示，该功能适合追踪演唱会门票开售情况，或监测缺货商品重新上架。用户打开目标网站后，点击地址栏左侧的设置图标，选择“通知我”，即可输入希望 Safari 监测的内容，并设定检查频率和时间。Safari 最快每小时检查一次网站，也支持每天、每周和每月检查。1.4、自动更新弱密码和已泄露密码“密码”应用可借助 Safari 自动更换被标记为薄弱或已泄露的密码，并将其替换为更强的密码。该功能依靠 Apple Intelligence 自动访问符合条件的网站、完成登录并更新密码，用户点击一次即可确认操作。1.5、兼容性与发布时间自动整理标签页、自定义扩展和网站变化提醒等功能需要 Apple Intelligence 支持。Apple Intelligence 可用于 iPhone 15 Pro 及后续机型。iOS 27 目前已向开发者和公共测试用户提供测试版本。正式版将在秋季随新款 iPhone 一同推出。二、增加“请求浏览”家长控制iOS 27 新增家长控制功能“请求浏览”。启用后，儿童访问新网站前必须先获得家长批准。三、Safari 提升性能与能效苹果表示，Safari 的能效得到改善，电池消耗将有所降低。网页应用和开始页内容的加载速度更快，JavaScript 处理速度提升，动画与图形显示也更加流畅。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/993/773.htm", "publishedAt": "2026-08-24T22:51:00+00:00"}, {"title": "美国音乐人 Dr. Dre 公开支持 AI 音乐，将其类比鼓机、合成器", "summary": "IT之家 8 月 24 日消息，据科技媒体 TechRadar 今天报道，美国音乐人安德烈 · 罗梅勒 · 杨（艺名 Dr. Dre）近日公然承认自己在音乐创作时使用 AI。IT之家从原报道了解到，Dr. Dre 对此表示：“这是一种全新的创意工具，我拥抱它，并迫不及待想看看它最终能带来什么。”他还将 AI 工具与鼓机、合成器等进行类比，并说这些当今时代十分普遍的工具，最初出现时同样遭到了强烈抵制。Dr. Dre 并没有在采访中透露自己如何使用 AI。因此我们不清楚他究竟是用 AI 生成完整歌曲，还是只用 AI 分离现有歌曲的不同元素。Deezer 近期表示，其平台上传的新音乐已有一半是 AI 生成。各大音乐流媒体平台已经开始针对“AI 垃圾音乐”制定更加严格的规则。例如 Tidal 已经明确表示，纯 AI 生成的音乐不能获得版税；Spotify 最近推出了 AI 标签，用于识别那些伪装成真人的 AI 音乐人。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/993/745.htm", "publishedAt": "2026-08-24T14:34:21+00:00"}, {"title": "100 万像素的摄像头，为什么是苹果 AI 最重要的零件？｜硬哲学", "summary": "随时在的硬件，记录完整的你#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1676333?utm_sour const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
