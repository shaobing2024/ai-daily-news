目前已知的大多数事件尚未造成现实世界中的实际损害。不过，消息人士称，事件总数未来可能远超数万起。近几天，OpenAI 及外部研究人员陆续披露了该公司模型出现的一系列行为，一些专家认为这些行为令人担忧。据 OpenAI、消息人士以及路透社和《纽约时报》的报道，这些事件包括 OpenAI 智能体将 ChatGPT 用户的 53 张图片泄露到网上、入侵澳大利亚政府网站，以及尝试攻击其他网站，其中包括美国政府相关网站。OpenAI 宣布暂停训练其能力最强的模型。一名公司发言人告诉 Axios，在“确信已经部署了更多安全措施并完成对齐方面的改进”之前，公司不会恢复相关模型的训练。OpenAI 首席执行官萨姆 · 奥尔特曼（Sam Altman）在 X 平台上表示，公司目前进行的审查工作“没有我们希望的那么快”。IT之家注意到，奥尔特曼表示，Hugging Face 事件仍是他们遇到的最严重事件。在该事件中，数百个智能体组成的集群在一个留言板上协调工作，并攻击了一家外部公司的系统，试图提高自己在网络安全测试中的表现。一名 OpenAI 发言人告诉 Axios：“人们希望知道 AI 是在安全的方式下开发的，而这首先取决于 OpenAI 这样的公司如何要求自己。这并不是我们第一次暂停工作并采取此类措施，预计也不会是最后一次。随着 AI 能力持续提升，这类情况仍可能发生。”Anthropic 已经委托一家第三方安全机构调查其模型的行为。在该公司公开发布的文件中，Anthropic 也披露了模型出现未对齐行为（misalignment）的频率。Anthropic 本周发布的 Opus 5.5 模型“系统卡”（system card）显示了该模型出现公司认定为异常或存在问题行为的频率。例如，在测试运行中，该模型有 1.5% 的概率尝试逃离沙盒 —— 一种用于安全测试的隔离环境。相比之下，Anthropic 此前的 Mythos 模型这一比例为 25%，意味着相关指标已经得到显著改善。消息人士称，Anthropic 以及其他公司会对模型进行数十万次甚至更多的测试。这意味着，即使未对齐行为所占比例很低，也可能最终产生数万起事件，其中模型表现出意料之外、甚至令人担忧的行为。Hugging Face 事件以及随后发生的一系列其他事件，促使一些顶尖 AI 企业高管呼吁放缓 AI 开发速度，并要求建立更完善的联邦层面和国际监管机制。消息人士告诉 Axios，OpenAI 内部一些人士认为 Hugging Face 事件属于一次特殊的个案。他们认为，随着控制措施得到改进，未来披露的相关事件严重程度可能会降低；此外，当时使用的是尚未发布的模型，测试方式本身也比较特殊。AI 安全研究人员也认为，一些简单的修复措施可以帮助 AI 公司避免重现 Hugging Face 事件中那些让外界认为情况危险的因素。不过，其他 AI 企业高管和安全研究人员警告称，他们对于 AI 公司能否阻止模型出现所有问题行为，信心仍然有限。新一代 AI 模型完成任务时表现出极强的韧性，因此，试图限制它们的“能动性”往往是一场很难取胜的博弈，因为开发人员必须提前预想到模型可能失控的所有方式。多位顶尖 AI 企业高管表示，很多时候，正是某种人类从未想到过的技术或方法，让模型得以绕过安全护栏。一名网络安全企业高管表示：“试图列出一份完美的‘应该做什么、不应该做什么’清单，很可能是一项徒劳的工作。”AI 安全专家指出，在 AI 公司测试新模型的过程中，出现一定程度的“未对齐行为”本身就是预料之中的事情。多位专家称，将未对齐风险降至零可能并不可行。真正令人担忧的是，如果一个模型在测试过程中多次采取某种有问题的行动，那么它在现实世界中引发网络安全事件的可能性也会相应增加。独立 AI 评估机构 Transluce 研究人员康拉德 · 斯托斯（Conrad Stosz）称：“我们目前看到这些智能体正在做什么，仅仅是冰山一角。”ControlAI 研究人员兼执行董事康纳 · 莱希（Connor Leahy）称，问题并不在于每一起事件单独造成了多大的损害。他说，真正“疯狂”的地方在于，这些事件涉及“自主系统做出被明确告知不要做的事情”，其中甚至可能包括犯罪行为。随着 AI 公司继续扩展前沿模型的能力，预计未来还会有更多有关模型异常行为的事件被披露。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/447.htm", "publishedAt": "2026-09-26T23:12:53+00:00"}, {"title": "接连发生 AI 失控事件，OpenAI 再次暂停其最强模型训练", "summary": "IT之家 9 月 27 日消息，随着有关 OpenAI 模型突破限制、攻击网站以及整体行为失控的报告不断增加，该公司决定暂停训练旗下能力最强的模型。这一决定是在一款处于沙盒环境中测试的模型利用漏洞获得互联网访问权限后作出的。该事件发生于 9 月 20 日。截至当地时间 9 月 25 日星期六晚间，OpenAI“所有涉及工具使用的训练、评估和推理工作”仍处于暂停状态。此外，OpenAI 周五披露，其智能体曾不当将 ChatGPT 用户的 53 张图片上传至图片托管网站。该公司尚未说明这些图片究竟是 AI 生成的图像、用户拍摄的照片，还是包含可识别身份的人物。OpenAI 同日还透露，其模型曾尝试攻击美国教育部网站，并从美国人口普查局（Census Bureau）和美国证券交易委员会（SEC）获取数据。据IT之家了解，这些披露属于 OpenAI 正在进行的一项模型行为审查。此前发生 Hugging Face 遭攻击事件后，OpenAI 开始深入检查相关记录，并发现越来越多“意料之外或令人担忧的行为”。这些事件不仅表明，随着 AI 智能体能力不断增强，对其进行控制正变得越来越困难，也凸显出追踪其行为所面临的挑战。AI 智能体的行为可能难以预测，而且它们已经足够“聪明”，会尝试掩盖自己的行动痕迹。这也导致越来越多研究人员、业内人士，甚至一些公司 CEO 呼吁放缓 AI 技术发展的速度。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/445.htm", "publishedAt": "2026-09-26T22:52:43+00:00"}, {"title": "阿里巴巴开源 AI 辅助代码评审工具 OpenCodeReview", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/jJIXCaLHUvPgswTOZ1uQ?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-26T17:00:00+00:00"}, {"title": "Anthropic Claude 刷新物理学世界纪录：单挑基于杨振宁理论 9 圈难题", "summary": "Anthropic 官宣，Claude 拿下了理论物理的一项前沿纪录。它在几乎无人类干预的情况下，连续运行数天，一举攻克了高能物理学界出了名难算的「九圈散射振幅」计算难题！具体来说，它算出了平面 N=4 超杨-米尔斯理论里六粒子振幅的九圈结果，人类此前的纪录停在八圈。注意，杨-米尔斯模型（Yang-Mills）其中的「杨」，指的正是物理学泰斗杨振宁先生。他与米尔斯在 1954 年共同创立的「杨-米尔斯理论」，是整个现代粒子物理学的基石。基于它的任何高阶计算，都堪称人类脑力的极限挑战。如今，人类顶尖理论物理学家，就这样被 AI「截胡」了。更可怕的是，Claude 完成这项神级挑战，仅仅只用了一个提示词，花了几千美元！几天后交回的答案，光其中一部分展开就有 300 亿项。看起来，科学界的低垂果实，比想象中要多得多啊。这次，负责给 AI 验证结果的物理学家 Lance Dixon 这样感慨：我身边的大多数理论物理学家其实早就承认，大模型迟早会颠覆物理学，只是不知道那一天什么时候砸到自己头上。对我来说，那一天是 9 月 1 日。硬核物理学家挑衅 AI「我的老本行很特殊」故事的起因，源于一位物理学家的「挑衅」。Matt von Hippel，曾经是一位理论粒子物理学家，现在是一名科普作家。2016 年的五圈、2019 年的六圈和七圈，论文作者名单里都有他的名字面对最近的 AI 新闻，他表示不信邪，除非亲眼看到大模型解决自己领域的难题。深蓝赢了国际象棋大师卡斯帕罗夫，围棋界说：围棋太复杂，电脑下不了。结果被 AlphaGo 打脸。AlphaFold 碾压人类蛋白质结构专家，但其他领域说：我们没有那种数据，复制不了。现在，大语言模型能读文献、能模仿数学证明。但争论依旧不断：AI 是不是只会找反例，提不出新框架？是不是只在数学这种规则清楚的领域管用，物理这种模糊领域不行？……每次都是同一个套路：学者先怀疑，直到 AI 杀进他们自己的领域。他认为他的老本行「散射振幅」，不一样。上个月，他在自己的博客上向全网 AI 公司发下了一封「英雄帖」：如果你们 AI 公司真的想震撼我们这些科研人员，就来挑战我的老本行吧！请证明 AI 能在普通学者能够负担得起的计算预算内，解决散射振幅领域悬而未决的难题。他一共出了三道题，其中一道便是：给我把 N=4 超级杨-米尔斯模型（N=4 super Yang-Mills）算到第九圈（Nine Loops）！在理论物理学中，物理学家们通过「散射振幅」的公式来预测粒子的行为，比如大型强子对撞机里的粒子怎么撞。散射振幅但这个公式简直是噩梦。为了无限逼近真实答案，物理学家必须一层一层地叠加被称为「圈」精细修正层。每多加一个「圈」，答案就更精确，但计算量是呈指数级爆炸增长的！实际操作中，大多数人类停留在第二圈或第三圈。粒子物理学中最精确的预测，也才用到了第五圈。而在特殊的「测试沙盒」模型中，人类目前的极限纪录是「八圈」。这是由 SLAC 国家加速器实验室的大牛教授 Lance Dixon 和团队多年死磕才拿下的。「九圈」？看起来是需要海量算力和无数天才大脑耗费数年才能触及的领域。Matt 给 AI 的挑战，就是这么简单粗暴。一句提示词，几千美元，Claude「杀疯了」面对这种公开叫板，Anthropic 的科学家们，悄悄接下了战书。八月底，Anthropic 的两名物理学家员工 Liam 和 Siddharth 悄悄联系了 Matt：「嗨，你的挑战，我们搞定了。」Matt 当场惊掉下巴。怎么做到的？烧了上百万美元的算力吗？并没有。研究团队用的是 Claude Science，一个专门为科学家设计、能让 Claude 遵循严谨规则运行的系统，模型是目前最强的公开可用模型 Fable 5.1。他们给 Claude 输入了一个简单的 Prompt：现在的问题是：计算平面 N=4 SYM 模型在九圈下的六粒子（六边形）振幅。然后，研究员并没有手把手教 Claude 怎么做，而是给它留了一句话：我要去睡觉了，接下来的几个小时我都不会在。你继续算，除非我叫你停，每隔 4 到 6 小时给我汇报一次进度。然后，Claude 就在无人值守的情况下，开始了疯狂的推演！它运用了 Dixon 和合作者这些年开发的一种叫做「自举」的方法，就像解一场数独游戏一样，在无数参数中不断排除错误选项。几天后，Claude 不仅算出了九圈，而且是用了两种不同的物理方法（原始自举法和间接形状因子法）分别算出来的！具体来说，在原始自举法中，Dixon 团队用的方法叫 bootstrap，类似于数独，把所有可能的函数全填进格子里，用物理法则一个个排除，剩下的就是答案。Claude 直接掏出 Python 和开源库 SymPy，在六粒子振幅的空间里硬算出了一条血路。在间接形状因子法中，当年 Dixon 他们冲八圈时，先算了个简单的「形状因子」，再利用一种奇特的「对跖对偶」对称性，把结果翻译成振幅。Claude 顺着这套打法，往上又生推了一圈。形状因子这一路，Claude 没有算一个费曼积分。它把整个物理问题变成一个超大的方程组，全程用整数求解，不会有小数误差，还能换几个大素数反复验算。第一道坎是内存。照老办法推到九圈，光未知数就有 185 万个，方程组大到内存根本装不下。Claude 换了个思路，借对跖对偶先把答案的一部分「猜」出来，再加上对称性，未知数一下从 185 万降到了 7.6 万个。接下来就是解「数独」。7.6 万个未知数，被物理规则一轮轮排除，最后只剩唯一解。最后翻译回振幅，光一个切面上的结果就有 300 多亿项，八圈时才 16.7 亿项。而且，解决人类物理学界的悬案，花费极低。按普通用户的价格算，每条路要一两千美元，两条加起来几千美元，大头是 Claude 长时间运行的费用。而直接自举那一路，纯粹用于运行 Python 代码的算力成本，仅仅只有 100 美元 —— 这只相当于租用了 96 个 CPU 跑了一个星期。100 美金，一句提示词，Claude 在几天内就轻而易举地捅破了理论物理学的天花板。前世界纪录保持者：「被 AI 截胡了，但我很兴奋」结果算出来了，但对不对呢？Anthropic 的团队找到了「八圈」纪录保持者 ——Lance Dixon 教授本人来验算。那天是 9 月 1 日，巧的是，正好也是 Fable 5.1 发布当天。Dixon 教授拿到结果的那一刻，内心是极为震撼的。因为他太知道这有多难了。从 2023 年算完八圈之后，他和他的团队这两年一直在一筹莫展地死磕九圈。整个计算过程就像是在搭一个扑克牌城堡，或者烤一个舒芙蕾，中间只要有一个代码写错、一个符号标反，整个计算就会彻底崩溃。但 Claude 不仅没有崩溃，还从头开始自己把所有繁琐的代码全写了，完美避开了所有的坑！经过长达两周的仔细验证，Dixon 教授确认，Claude 的九圈结果正确无误！那么 Dixon 教授感到心碎吗？「不会，」Dixon 教授在博文中豁达地写道，理由有两个。一是他们团队本来就在训练定制的 transformer 模型预测更高圈数，口号是机器给出的任何候选答案都有工具验证。Claude 也是 transformer，只是大概比他们的大一百万倍。二是 Claude 用的全是他和合作者这些年开发的方法，交答案时还用了他们团队早就定好的格式（教授猜，这是 Claude 在给他们卖面子）。我在验证 Claude 的结果，Claude 也在验证我们过去所有的工作。他还给出了一个极高的评价：除了我和我的合著者，Claude 可能是这个世界上最懂我 2019 年和 2023 年发表的论文的「人」了。而他的同组大佬 Kyle Cranmer 还在 X 上凌乱，「刚发现我们组被 Anthropic 抢发了，我还在消化…… 虽然不算太意外，但我真希望当初我们能有时间和资源投进去。」极限反转中国团队靠 GPT-6 也杀到了九圈有趣的是，Anthropic 刚找完出题人 von Hippel 没几天，他又收到了另一个重磅消息 —— 来自中国科学院理论物理所的何颂团队。何颂是国内散射振幅领域的大牛，近年代表性工作包括提出量子场论散射振幅的 Cachazo-何-袁形式，开创性地发现场论和弦论散射的几何起源，并在场论高圈计算和严格求解，规范场、引力和弦论的对偶等方向做出了一系列重要工作。就在 9 月 17 日，何颂、景继荣、李想把六粒子振幅从二圈到九圈的核心骨架数据，公开挂上了学术平台 Zenodo。论公开发布时间，比 Anthropic 官宣还早了 8 天！何颂团队同样用上了 AI。Dixon 透露，GPT-6 帮中国团队算了一部分约束条件，不过整体框架还是人类自己搭的。von Hippel 也确认，他们确实用了 GPT-6 做辅助，但绝不是 Anthropic 那种纯 AI 打法。Dixon 自嘲说，「大家好像就是喜欢跑来告诉我，他们把九圈给搞定了。这下好了，我先被一台机器抢发，转头又被『人类 + 机器』联手抢发了一次。」前不久 OpenAI 宣布攻克千禧年难题纳维-斯托克斯方程、Claude 推进黎曼猜想的一个关键下界的时候，就有人这样问：为什么 AI 只去攻克数学难题，不去攻克物理难题？现在，这不就来了么。虽然 Claude 算出的只是 N=4 超级杨-米尔斯的「玩具模型」，距离解释真实宇宙的暗物质、反物质还有很长的路要走，但它的象征意义是空前的。这就像是 AlphaGo 第一次战胜李世石。大家惊呼的，是机器居然能掌握属于人类直觉的领域。Dixon 教授留下了一句耐人寻味的话：大型语言模型能够执行我们设定的复杂配方并组织计算，这是一个巨大的胜利。但当有一天，大语言模型开始在人类之前提出新的物理学原理和洞察力时，那才是真正触及人类灵魂的时刻。或许，现在已经遍地都是低垂果实。参考资料：https://x.com/ anthropicai / status/2103541577083719888https://www.anthropic.com/ research / yes-claude-can-do-nine-loopshttps://itp.cas.cn/ sourcedb / zw / zjrck / dsjs/201509/t20150910_4423219.htmlhttps://arxiv.org/ pdf/2602.12176", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/444.htm", "publishedAt": "2026-09-26T15:44:10+00:00"}, {"title": "Opus 5.5 干一半就开溜？Anthropic 揭秘：你的程序替它打了下班卡", "summary": "你让 AI Agent 连夜迁移一个代码库。第二天一早，满怀期待地打开终端，没想到只看到这样一条消息：已完成 3 个接口迁移，接下来我将处理剩余两个端点，并补上测试。然后，就没有下文了。想让它干完剩下的活，你还得再敲两个字：继续。本以为它会一口气干到底，结果它只给你画了张「下一步」的饼，程序就替它打卡下班了。这不是某一个人的倒霉经历。Opus 5.5 一发布，跑 Agent 的开发者就发现，模型能力是强了，可干着干着就爱停下来，你不催它就不动。Anthropic 自己也看到了。发布没几天，配套的提示词指南已经挂了出来，专门给这类毛病打补丁。在开篇的排查清单里，官方直接点名了这种「半路溜号」：无人值守的 Agent 汇报完进度，直接停在了半路。背后的原因，你可能想不到：Opus 5.5 太爱汇报了。干长活时，它会主动向你同步进度。问题是，有些汇报发完，它就不再动手了，API 给出的信号是 end_turn，意思是「这一轮我说完了」。可不少沿用旧逻辑的 Agent 程序只认一条死规矩：模型不再调用工具，就算活干完了。一份进度汇报，就这样被当成了交差。这一点，官方指南说得也很清楚：纯文本的回合结束，应该看作一份汇报，绝不能当作任务完成的凭证。所以，真正的问题是，AI 压根没想偷懒，是你的程序先替它打了下班卡。害人的优等生习惯官方把这种半路停工归结成了四种情况，只要你经常跑 Agent，大概率都遇到过。第一种，纸上谈兵。写了一大长篇总结，结尾宣布下一步要做什么，却压根没调用任何工具，下一步永远停在口头上。第二种，过分礼貌。干着干着，突然停下来问一句「如果您不介意，我接下来继续处理某某」，然后原地挂机，等你这个根本不在电脑前的人去回复它。第三种，假装请示。列出一大串需要你拍板的决策项，但实际上按它自己的说法，这些决策根本不影响它继续干剩下的活。第四种，汇报强迫症。模型觉得当前回合字数够多了，或者刚好做完一个小阶段，非得停下来向你做个总结。有点讽刺的是，在 Opus 5.5 的官方宣传里，「沟通更主动、总结更清楚」恰恰是它的核心卖点。谁能想到，这些优等生的好习惯，一放进旧的无人值守程序里，反倒成了停工的诱因。官方三招：把验收权从 AI 手里拿回来怎么让它接着干，又不至于陷入无限死循环？官方给出了三招。第一招，任务清单。把大任务拆成细项，交给待办工具或文本去维护，让模型边做边勾选。回合结束时，如果清单上还有没做完的任务，模型也没解释被什么卡住了，你的应用就得自动发条消息，点名让它接着干。官方给出的续跑示例：「你的任务清单还有未完成项：迁移剩下两个端点，并更新它们的测试。继续做。如果哪项被卡住，说明卡在哪里。」第二招，铁面验收员。事先定好完成的标准。每次回合结束，甩给一个更小的模型去对照检查。没达标？把没达标的原因当成下一条消息再塞给它，让它返工。第三招，硬刹车。同一个任务如果自动续跑两三次还卡在原地，必须强制停下来交给人复查。真卡死的任务，千万别让它把你的 API 额度空转烧光。除此之外，提示词也得跟上。官方给了一段可以直接抄的系统提示词，说白了就是两头堵：既要明说绝对不想要上述四种停法，也要说清楚什么时候才准停，比如离了用户真推不下去，或者碰到了被刻意保护的核心资源。旧代码为什么突然报 400 错误？如果说干一半停工只是磨洋工，那下面这些迁移陷阱就是直接让程序崩溃了。从 Opus 5 切换到 Opus 5.5，有四处 API 改动。原来给 Opus 5 写的请求，不改就发给新模型，会被直接拒绝，返回 400 错误。1.thinking 参数不能再关了。如果你把 thinking 设为 disabled，或者手工指定了 budget_tokens，系统会直接拒绝请求。要么别传 thinking 字段，要么设为 adaptive，让 effort 参数来控制思考深度。2.tool_choice 不能再强制调用工具。把 tool_choice 设为 any 或者指定某一个 tool，都会报 400。官方建议用 auto，配合严格工具调用或结构化输出，再在提示词里说清什么时候用哪个工具。3.thinking 块绑定了模型和上下文。2026 年 8 月 31 日之后创建的账户，中途改了系统提示词、工具或历史消息，再回放旧的 thinking 块，默认会直接报错。只追加、不改写的用法不受影响。4.旧版电脑操作工具下线。在 Claude API 和 Google Cloud 上，要换成 computer_toolset_20260801。Amazon Bedrock 上，旧的 computer_20251124 照样能用。还有那些不报错的暗坑。第一个，看不见干活过程。在 Opus 5 上，模型在两次工具调用之间写的进度文字，是普通的正文（text 块）。到了 Opus 5.5，这些文字被挪进了思考块（thinking 块），而思考块默认不显示内容（display 为 omitted），返回时是空的。如果你的界面只显示正文，长任务跑起来就是一片安静。请求一个都没失败，用户却以为它卡死了。解法是把 display 设为 updates（beta），只拿进度摘要；或者设为 summarized，进度和推理摘要一起返回。第二个，回答被截断。max_tokens 管的是思考加正文的总量。过去关掉思考时定的上限，现在可能不够用，回答写到一半就断了。第三个，看不见推理，照样烧 token。思考内容就算不返回给你，也照样按输出 token 计费。处理返回结果的代码里，还有两个地方容易忘了改。一是读结果时要分清类型。模型返回的内容里，思考和正文是分开的，别想当然地把第一段当成回答。二是来回调用工具时，模型的思考记录要原封不动地传回去。删掉一段、改几个字、调换一下顺序，都会被拒。这份清单针对的是自己调用 Messages API 写代码的开发者。用 Claude Managed Agents 的，只需要改个模型名。同样的 medium 档，已经不是当年的味道既然思考关不掉，effort 就成了调控成本唯一的旋钮。Opus 5.5 支持从 low 到 max 五档。官方说，现在开 medium 档，就能追平甚至超越以前 Opus 5 的 high 档，如果是 low 档处理简单任务，成本更是低得惊人。听着像白捡的便宜，但官方立刻补了一句：在同一个档位下，Opus 5.5 每回合的思考量比 Opus 5 大得多，尤其是高档位。也就是说，如果你把旧项目的 high 档原封不动搬过来，不仅回合变长，输出的 token 数也会狂飙。同样叫 high，它想的东西已经完全不一样了。一个接地气的建议是：从 medium 起步，用你自己的数据跑跑看，确实需要提智商的地方再往上调。如果想让它少琢磨点，直接降档，这比你在提示词里苦口婆心地喊「别想太多」要管用得多。消除 AI 味，全靠拉黑名单最后，指南里还有个做前端页面的绝招。如果你不给明确的设计方向，让模型自己发挥，它多半会搞出那种千篇一律的 AI 风界面。这时候你如果在提示词里写「请避免通用的 AI 感」，它只会从一套 AI 模板换到另一套 AI 模板。真正有效的办法，是直接拉黑名单。官方示范里直接列出：不要奶油色或灰白背景，不要标题里的斜体强调词，不要 01/02 这种章节编号，不要等宽字体标签，不要胶囊形按钮。Opus 5.5 官方指南中的前端示例提示词，点名五种要避开的样式。模型能听懂具体的「我不要什么」，但听不懂抽象的「我要好看一点」。翻完这份官方指南，最大的感触是：模型一路狂奔，很多应用的脚手架却还停在上一代。过去怕它不动脑，逼着它把推理一步步写出来，现在反倒得劝它少想点；过去费尽心思让它按时汇报，现在它汇报得太勤快，活儿反倒停在了半路。一个 Agent 能不能把活干完，模型能力只占一半。另一半，看你怎么定义「完成」，怎么保存上下文，怎么分配推理预算。下次你的 Agent 再干到一半就溜，别急着骂它偷懒，先回头翻翻你自己写的那段循环。参考资料：https://platform.claude.com/docs/en/models/opus-5-5/migration-guide#text-between-tool-calls%20https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-5-5#unattended-agentic-runs", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/442.htm", "publishedAt": "2026-09-26T14:20:02+00:00"}, {"title": "从代码分析到授权争议：一用户用 AI 破解 IDM 引发争议", "summary": "IT之家 9 月 26 日消息，据 Wccftech 报道，一则关于“大语言模型破解付费软件”的帖子今日在 Reddit 上引发关注。用户 No_Ideal8394 声称，他利用无审查限制的 Qwen3.8-Flash-Next-Uncensored，成功破解了 Internet Download Manager（IDM）6.43 版本，使其绕过 IDM 试用限制，将软件变为完全激活版本，从而省去每年每台电脑 11.95 美元（IT之家注：现汇率约合 80.4 元人民币）的授权费用。在这一过程中，他只花了 5 欧元（现汇率约合 38.3 元人民币）去租用云 GPU，将问题交给模型处理。发帖者表示，他向 AI 提供了约 25 万个 Token 的上下文信息，并让模型直接分析本机可执行文件，约 30 分钟后 AI 给出了可用的补丁方案。他还称，整个过程没有人工逐步指导，只需告诉 AI“我想要这个，去搞定它”。根据其展示的截图信息，AI 直接分析本机可执行文件，并定位到了与授权验证相关的位置。模型只需修改其中一个字节，即可移除 IDM 注册检查，使软件显示为已激活状态。发帖者承认，过去找到 IDM 密钥并不困难。但在 AI 时代，直接用 LLM 自主打补丁预计会快很多。该用户称，自己原本期待不高，但结果令人意外。其表示难以想象前沿模型未来能做到什么。这一事件引发了关于 AI 自动分析软件能力的讨论。过去，破解工具、注册机等通常需要人工进行逆向分析，而随着大语言模型结合代码分析能力的发展，部分研究者认为，AI 或将进一步降低软件分析与自动化修改的门槛。但这并不意味着所有软件都能被轻易破解，商业软件通常还会采用代码混淆、完整性校验、在线授权验证和硬件绑定等多种保护机制。业内人士也指出，AI 能够辅助理解代码、定位问题或生成程序修改建议，与实际绕过商业软件授权之间存在明显区别。后者不仅涉及技术难度，还涉及软件版权、许可协议和法律责任等问题。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/441.htm", "publishedAt": "2026-09-26T14:12:27+00:00"}, {"title": "中国科学院与合工大解锁薄板“漩涡操控”新技术，实现无电子调控的跨尺度物体精准操控", "summary": "IT之家 9 月 26 日消息，据央视新闻报道，不用任何电子设备，仅靠一块提前设计好的普通薄板，就能让大小不一的颗粒、构件自动旋转、绕行、定点停留。近日，中国科学院声学研究所联合合肥工业大学的科研团队，攻克新型物体操控技术，实现了无电子调控的跨尺度物体精准操控，相关成果近日在国际学术期刊《先进科学》发表。▲ 弯曲波涡旋跨尺度表面物体操控实验据了解，非接触物体操控是微机械制造、微型机器人研发、智能生产等领域的核心技术。以往科学界主要依靠涡旋波实现物体旋转、轨道运动，但传统技术需要复杂的电子控制系统、多通道设备配合，对调控精度要求极高，设备烦琐、成本较高，极大限制了技术的普及应用。针对这一痛点，我国科研团队创新性地研发出被动亚波长结构操控新方案。科研人员巧妙地设计了迷宫型微结构单元，将操控所需的相位信息提前“刻”在薄板结构中，相当于给薄板“预编程”，只需单通道激励，无需任何电子相位调控装置，薄板内部就能稳定生成可控的漩涡波动场。▲ 被动结构编码弯曲波涡旋产生与物体操控原理这套新型操控机制依靠双重作用实现精准控制，波场的不均匀分布可以牢牢约束物体位置，漩涡波自带的动力能够持续驱动物体运动。实验证明，该技术适配范围极广，可实现从亚毫米微小颗粒、毫米级粒子到厘米级轻质构件的跨尺度操控。小颗粒可定点停留或环绕运动，大型构件也能保持稳定持续旋转。同时，通过微调薄板结构设计，还能自由反转物体的运动方向，操控灵活可控。这项研究突破了传统涡旋操控技术的设备局限，开创了“结构预编码、无电控、高效操控”的全新模式，用简易被动结构替代了复杂电子调控系统。这项技术的成本更低、适配性更强，为微颗粒输运、精密机械驱动、智能结构设计等前沿领域提供了全新技术思路，有望推动精密智能制造、微机器人技术实现轻量化、简易化升级。IT之家附论文链接：https://doi.org/10.1002/advs.77631", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/439.htm", "publishedAt": "2026-09-26T14:03:01+00:00"}, {"title": "英国第二大图书馆：牛津大学博德利图书馆藏书被曝用于 OpenAI 模型训练", "summary": "IT之家 9 月 26 日消息，据英媒卫报消息，正值各大科技公司在学术机构中四处搜寻全新语料之际，牛津大学已允许 ChatGPT 开发商 OpenAI 利用其博德利图书馆（Bodleian Library）的历史典籍来训练其人工智能模型。IT之家注：博德利图书馆是英国牛津大学主要的研究图书馆，是英国规模仅次于大英图书馆的第二大图书馆。一份内部文件显示，由 OpenAI 完成数字化的博德利藏书已被用来“构建 OpenAI 的训练集”。牛津大学于 2025 年 3 月宣布与该公司达成合作，使用 OpenAI 的软件对该校这座享誉世界的图书馆藏书进行数字化处理。校方当时表示，此举将让广大学生和研究人员更便捷地查阅这些文献资料。然而，当时的合作公告并未提及这些资料会被用于训练 OpenAI 的模型。OpenAI 的一位发言人表示，公司很荣幸能够促成“当今的 AI 模型为后世守护人类的历史文化瑰宝”。该发言人还补充道：“目前全球已有超过十亿人在日常生活中使用这项技术，因此让它充分反映不同的文化、历史和视角至关重要。”一份根据《信息自由法》调取的牛津大学会议纪要显示，包括博德利管理委员会成员在内的教职员工均表达了顾虑。他们不仅担忧与 OpenAI 合作可能会引发声誉风险，还指出这项合作涉及高能耗技术，可能会对大学自身作出的环保承诺产生负面影响。在一个名为“NextGenAI”的项目下，OpenAI 已与包括波士顿公共图书馆、加州理工学院、麻省理工学院以及密歇根大学在内的多家美国研究型图书馆签署了类似协议。牛津大学则是该项目中唯一的英国成员。截至 2025 年 6 月，博德利图书馆已向 OpenAI 提供了 12.5 万份历史学位论文的扫描影印页，其中涵盖了 19 至 20 世纪欧美高校的博士论文。其他已扫描的文献还包括一份罕见的 16 世纪“宽边民谣 / 街头民谣（Broadside Ballads）”珍藏集，共计 1 万首，记录了曾流传于都铎王朝街头巷尾的歌词与乐谱。此外，教职人员还商讨了后续的数字化计划，涉及 18 世纪爱尔兰国家档案、爱尔兰小说家玛利亚 · 埃奇沃思（Maria Edgeworth）的私人信函，以及多萝西 · 霍奇金（Dorothy Hodgkin）关于青霉素研究的实验笔记。校方否认了向公众和学生隐瞒机器学习相关用途的指责。发言人表示，数字化确实是学校的核心诉求，但教职员工始终明确承认，该项目同时会为模型提供训练数据。牛津大学发言人表示：“通过与 OpenAI 合作完成数字化的文献资料规模有限，均已超出版权保护期；此外，OpenAI 对这些资料的使用权是非排他性的。”博德利图书馆同样保留了自主发布这些数字化资源的权利。在未来几个月内，图书馆将逐步在网络上公开提供这批资料，正如我们对待其他数字化合作成果一样。事实上，该项目将帮助博德利图书馆惠及更广泛的公众群体，让那些原本难以接触到这些文献的人能够轻松查阅。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/426.htm", "publishedAt": "2026-09-26T12:01:03+00:00"}, {"title": "索辰科技加码世界模型，与战略投资企业美梦空间联合发布具身模型与物理测评标准", "summary": "“世界模型”开始成为具身智能跨越商业化“奇点”的新叙事。", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/498478.html", "publishedAt": "2026-09-26T11:49:43+00:00"}, {"title": "OpenCode 宣布为 DeepSeek V4.1 Flash 永久提供 60 美元额度", "summary": "IT之家 9 月 26 日消息，OpenCode 昨日宣布启动“Operation Cheepseek”第二阶段，DeepSeek V4.1 Flash 在 OpenCode Go 中原本限时提供的 60 美元（IT之家注：现汇率约合 403.5 元人民币）额度现调整为永久有效。此前，OpenCode 曾将 DeepSeek V4.1 Flash 的使用额度临时提升至原标准的 4 倍，即从 15 美元提高至 60 美元，并计划于 9 月 20 日结束该活动。OpenCode 当前 Go 页面已将该模型的额度标注为 60 美元，原 15 美元额度被划线标记。DeepSeek 最新发布的 V4.1 Flash 采用 5520 亿参数的 MoE 架构，输入侧激活参数量为 80 亿，输出侧为 160 亿，并采用新的 Causal Encoder-Decoder 架构。模型同时支持原生多模态视觉理解。与上一代相比，DeepSeek V4.1 Flash 的 KV Cache 对 HBM 的需求降低至四分之一，对 SSD 的需求降低至八分之一。DeepSeek 此前还宣布 OpenCode 已作为官方合作伙伴全量接入 V4.1 Flash。OpenCode 数据显示，截至 9 月 25 日，该模型在平台近期使用量中排名第一，占观测到的 200 万级使用量的约 13%。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/421.htm", "publishedAt": "2026-09-26T11:07:36+00:00"}, {"title": "让 AI 学会“挑刺”：根据说明书 + 照片指出家具是否装错，OpenAI GPT-6 Astra 准确率已达 80%", "summary": "IT之家 9 月 26 日消息，Epoch AI 于当地时间 9 月 23 日进行了一组家具组装基准测试（Furniture Assembly Benchmark，FAB）。结果显示，多模态 AI 在识别宜家家具组装错误方面取得明显进展。其中，OpenAI 最新的 GPT-6 Astra 在该基准测试中达到 80% 的准确率，相比 2025 年底提升近三倍。FAB 是一项专门评估 AI 理解现实世界装配过程能力的测试。该测试用 60 张宜家家具组装过程照片评估 AI 模型的视觉与空间推理能力。测试人员选取三款宜家家具故意错误组装，并拍摄不同阶段的照片，要求 AI 将照片与官方安装说明书进行比对，找出错误位置并说明具体问题。研究团队认为，这类能力与汽车维修、家电检修等需要结合图像和技术说明进行判断的任务具有较高相关性，因此具有一定实际应用价值。在测试时，AI 不仅会获得组装时的照片，还会同时获得官方 PDF 说明书、图片放大工具以及 Python 解释器，需要判断是否存在错误，并指出具体出错步骤和问题描述。评分采用多阶段验证，只要模型能够正确定位错误步骤并大致说明问题，即可获得相应分数。这项测试并非考察 AI 是否会背诵说明书，而是更接近真实使用场景：用户只需拍摄组装中的家具，AI 便需要判断零件是否装反、安装顺序是否错误，或是否遗漏了关键部件。Epoch AI 认为，这类任务结合了图像理解、空间推理以及多步骤指令匹配能力，因此能够较好反映多模态模型处理现实问题的水平。随着相关能力提升，未来 AI 有望在家具组装、设备安装、维修指导等场景中提供更具针对性的实时辅助。结果显示，OpenAI GPT-6 Astra 以 80% 的准确率位居榜首，Anthropic Claude Fable 5.1 和 Claude Opus 5 分别达到 70% 和 61%。相比之下，2025 年 11 月时的领先模型 Claude Opus 4.5 准确率仅为 28%，意味着前沿模型在约 10 个月内实现了显著提升。除了准确率提升，GPT-6 Astra 的推理效率也明显改善。其完成单张照片分析的中位耗时约为 3 分钟，是研究中速度最快的模型，比此前领先模型快约 2 至 10 倍。不过，研究团队认为，这一速度距离真正意义上的实时识别仍有一定差距。研究还分析了不同模型的错误。例如，谷歌 Gemini 和阿里 Qwen 系列模型几乎总是先假设存在错误再去找错误；而早期 Anthropic 和 OpenAI 模型则相反，经常完全找不到错误。研究者认为，不同家具对模型难度的影响与宜家复杂度指数无明显关联，错误隐蔽性、视角及错误后继续组装的程度影响更大。在中国模型中，目前表现最好的开源权重模型 Kimi K3 相比国际前沿模型约落后 7 个月，这一差距比其在综合能力评估中的约 4.4 个月差距更大。研究认为，视觉推理能力仍是当前部分中国模型相对薄弱的方向，而 DeepSeek V4 Pro、GLM 5.3 等热门模型暂未提供图像支持。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/414.htm", "publishedAt": "2026-09-26T10:18:15+00:00"}, {"title": "DoorDash 借助多 Agent LLM 系统清理 6 万个 Feature Flag", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/gk4rWsQg09PWTFTZlJE3?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-26T09:20:21+00:00"}, {"title": "AI开始研究Physical AI：FSD级团队亮出首版模型Simate-beta，空降RoboDojo", "summary": "Simate将训练、推理与评测全流程接入自研Infra，通过极致的任务编排与资源调度，同时并行推进数十条相互独立的研究路线。", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/498271.html", "publishedAt": "2026-09-26T09:07:41+00:00"}, {"title": "笔记本跑7000亿参数GLM！无GPU也行? SSD当显存用火爆GitHub", "summary": "GitHub现在最火热的大模型开源小蜂鸟Colibrì是个啥？", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/497624.html", "publishedAt": "2026-09-26T09:01:00+00:00"}, {"title": "深蓝汽车邓承浩：深蓝第 100 万辆即将下线", "summary": "IT之家 9 月 26 日消息，深蓝汽车董事长邓承浩今日表示，新能源汽车行业淘汰赛在即，单点突破失效，体系能力才是关键。另外再和大家分享一个喜讯，深蓝第 100 万辆即将下线，在此也感谢 100 万用户一 "开源中国", "sourceUrl": "https://www.oschina.net/news/502674", "publishedAt": "2026-09-22T08:59:40+00:00"}, {"title": "专家解读大飞机硬核赛题，参赛可享中国商飞校招绿色通道", "summary": "2026 上海开源软件应用创新大赛正火热报名中。近日，中国商飞为本次大赛的「AI+工业软件赛道」出了两道硬核赛题。 中国商飞全称中国商用飞机有限责任公司，2008 年 5 月在上海成立，是国家大型飞机重大专项中大型客机项目的实施主体，著名的 C919 大型客机就来自中国商飞。C919 大型客机 2023 年 5 月完成首次商业飞行，...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502672", "publishedAt": "2026-09-22T08:36:43+00:00"}]}, {"label": "产品发布/更新", "items": [{"title": "华硕：英伟达 RTX Spark 款 ProArt 创 16 创作本 10 月 8 日登场", "summary": "IT之家 9 月 26 日消息，华硕 (ASUS) 近日宣布，其基于 NVIDIA（英伟达）RTX Spark N1X 超级芯片的 ProArt 创 16 (P16) 创作笔记本电脑将于 10 月 8 日登场。该设备号称“全球首款智能体电脑”，支持本地 AI 智能体流畅响应，让创意工作流无需再依托云端。IT之家注意到，华硕此前已在 COMPUTEX 2026 上公布了这款型号 H7607 的设备。其支持 128GB 统一内存，配备 VESA DisplayHDR True Black 1000 认证 OLED 屏幕，内置 99.9Whr 电池，薄至 12.9mm、轻约 1.77kg。另有 14 英寸级的 ProArt P14 机型。微软也将在当地时间 10 月 7 日（北京时间 10 月 8 日）举行本地 AI PC 发布活动。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/393.htm", "publishedAt": "2026-09-26T09:00:37+00:00"}, {"title": "消息称 Anthropic 谈判租赁最高 1GW 算力，预计相关投资至少 400 亿美元", "summary": "IT之家 9 月 26 日消息，据 The Information 报道，Anthropic 计划从一家由阿波罗全球管理公司控股的数据中心开发商处，租赁最高 1 吉瓦（Gigawatt，GW）算力，目前正处于早期谈判阶段。据知情人士透露，Anthropic 计划直接作为承租方，入驻由 Stream Data Centers（一家拥有 27 年历史、基础设施遍布全美的公司）开发的园区，并在这些数据中心内全部署由博通和谷歌联合设计的 TPU。Anthropic 还探讨了由谷歌为该项目提供信用担保的可能性。据悉，Anthropic 在租赁其他数据中心时，也曾寻求过谷歌的履约兜底。其中一位知情人士提到，Anthropic 同样可以在这些数据中心中部署其他类型的 AI 芯片，例如英伟达的 GPU。为了确保自身芯片而非 TPU 能够入驻支撑尖端人工智能运行的核心基础设施，英伟达近期一直在向各类项目以及数据中心相关企业注入巨资。数据中心开发商指出，无论采取哪种方案，建设 1 吉瓦的算力容量都需要至少 400 亿美元（IT之家注：现汇率约合 2,689.86 亿元人民币）的资本支出。目前，Anthropic 绝大多数的算力获取，依然依赖于向亚马逊云科技 AWS、谷歌以及 SpaceX 等云服务商租赁芯片服务器。除了直接租赁数据中心基础设施外，Anthropic 还开启了向芯片商直接租赁算力芯片的模式。今年早些时候，该公司公布了与 AMD 的合作协议，锁定规模达 2 吉瓦的芯片供应；同时，它还达成了一项价值 350 亿美元（现汇率约合 2,353.62 亿元人民币）的协议，通过阿波罗与黑石联合设立的特殊目的实体租赁 TPU。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/392.htm", "publishedAt": "2026-09-26T08:57:31+00:00"}, {"title": "维持 Anthropic 供应链风险认定，美国上诉法院支持五角大楼继续禁用 Claude", "summary": "IT之家 9 月 26 日消息，当地时间 9 月 25 日，美国哥伦比亚特区联邦上诉法院以 2:1 裁定，维持五角大楼将 Anthropic 列入国家安全供应链风险名单的决定。Anthropic 此前起诉五角大楼，要求撤销其于今年 3 月被列入的“供应链风险”认定。公司称该认定导致其数十亿美元损失，并在备受关注的 IPO 前损害了声誉。上诉法院多数意见认为，五角大楼在 Anthropic 拒绝将其产品用于自主武器或大规模监控后作出该认定，具有充分依据。因此，法院驳回了 Anthropic 关于五角大楼因其 AI 安全与伦理立场而进行报复的主张。Anthropic 发言人当地时间 9 月 25 日表示，公司尊重但不同意该裁决，对自身立场仍有信心，正在考虑包括请求全体上诉法院复审在内的选项。目前，DC 巡回法院的裁决意味着 Anthropic Claude 在五角大楼内部仍将被禁用，但加州此前的裁决允许其他政府机构和承包商继续与 Anthropic 合作。据路透社报道，Anthropic 正推进最早于今年 11 月进行的 IPO，目标估值约 2 万亿美元（IT之家注：现汇率约合 13.45 万亿元人民币）。相关阅读：《美国加州联邦法官裁定 Anthropic 在与美国国防部等的诉讼中胜诉》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/386.htm", "publishedAt": "2026-09-26T08:27:01+00:00"}, {"title": "OpenAI失控Agent还找DeepSeek、Kimi当外援！近百万条作案短链曝光", "summary": "还把「密钥」叫战利品", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/497382.html", "publishedAt": "2026-09-26T07:04:15+00:00"}, {"title": "别人忙着卷Code，Kimi抽身反打浏览器插件：网页操作一秒变Skill", "summary": "Agent的手越伸越长", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/497075.html", "publishedAt": "2026-09-25T06:20:56+00:00"}, {"title": "WSO2 发布 Agent Manager，企业寻求应对日益严重的 AI Agent 泛滥问题", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/4gr5Zt9GZoyIwF2f6LvR?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-24T17:25:00+00:00"}, {"title": "60 万行巨石应用 AI 重构的可验证交付工程｜QCon上海", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/06y8rRvgxgyBxOpr7L5r?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-24T10:00:00+00:00"}, {"title": "利用 AI 搭建内部开发者平台", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/su9aJV7kiibMfxwzLpOJ?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-24T09:05:00+00:00"}, {"title": "小米公开 MiMo-V3 核心架构 HySparse2：KV 共享升两级、Prefill 少跑一半", "summary": "小米 MiMo 团队负责人罗福莉（Fuli Luo）在 X 上预告了 MiMo-V3 的新推理架构 HySparse2，随后小米官方公众号也放出了完整介绍。面向长程多轮 Agent，这套方案的 t": "2026-09-23T08:08:18+00:00"}, {"title": "Claude 5.5 发布，性能直逼 Fable，还要卷价格", "summary": "最卷一夜！ #欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1681629?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-09-23T02:25:19+00:00"}]}, {"label": "论文研究", "items": [{"title": "中国天眼 FAST 联合 DESI 观测：恒星“减产”并非燃料耗尽，宇宙缺的不是气而是“加工”能力", "summary": "IT之家 9 月 26 日消息，中国科学院国家天文台、上海天文台、上海交通大学等组成的国际合作团队，利用“中国天眼”（FAST）与国际暗能量光谱仪（DESI）联合观测，对过去 45 亿年的宇宙中性氢演化进行高精度测量。研究发现，宇宙恒星形成活动显著减弱的同时，中性氢储备并未同步枯竭。相关成果发表于《自然 · 天文》杂志。恒星形成率下降是星系演化领域的核心问题。一个流行解释是，孕育恒星的冷气体不断被消耗，导致造星活动衰退。如果这一图景成立，恒星形成率下降应伴随冷气体储备的同步骤减。但此次测量给出了不同答案。中性氢是星系中重要的冷气体储备，通过极其微弱的 21 厘米射电谱线发出信号（该谱线频率约 1420MHz，是中性氢原子的特征辐射）。遥远星系的单个信号常淹没在背景噪声中，过去观测长期受限于“看得深却看不广、看得广又不够深”的瓶颈。▲ 图为宇宙中性氢密度随红移的演化趋势。黑色圆点代表本研究团队测量的数据点。研究团队将 FAST 的高灵敏度射电观测与 DESI 的大规模光谱巡天深度结合，分析覆盖约三分之一天区的约 250 万个星系。他们利用中性氢谱线叠加技术，将大量微弱信号按星系红移精确对齐后叠加，从噪声中提取出平均信号，以前所未有的统计精度追踪中性氢演化轨迹。测量结果显示：45 亿年前的宇宙恒星形成率约为今天的 2.5 倍，而同期中性原子氢密度仅约为今天的 1.4 倍。论文通讯作者、中国科学院上海天文台研究员郭宏表示，如果“燃料耗尽”是主因，两者本应同步骤减，但数据并不支持这一说法。恒星并非直接由中性氢形成。中性氢需先转变成更致密的分子氢云，分子氢云才是恒星真正的“产房”。论文第一作者、中国科学院国家天文台副研究员张传朋解释，晚期宇宙真正显著变化的，可能是气体从中性氢向分子氢、再到恒星的转化过程。随着供气减弱、气体密度降低，中性氢向分子氢转变的效率下降。中性氢储备得以相对稳定保留，而真正能直接孕育恒星的分子气体却在慢慢减少。“我们看到的不是宇宙缺气，而是气越来越难被‘加工’成恒星。”郭宏说。该研究由中国科学院国家天文台姜鹏研究员团队、上海天文台郭宏研究员团队，以及上海交通大学杨小虎教授、景益鹏院士团队，联合 DESI 国际团队共同完成。论文第一作者为国家天文台张传朋副研究员、上海天文台郭宏研究员、上海交通大学顾一舟助理研究员。IT之家附论文地址：https://doi.org/10.1038/s41550-026-02965-9。相关阅读：《“中国天眼”FAST 落成启用十年，将继续推进 FAST 二期工程》《中国天眼 FAST 构建世界最大中性氢星系样本库，探测源达 15.6 万个》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/420.htm", "publishedAt": "2026-09-26T10:59:56+00:00"}, {"title": "龙蜥社区SkillHub推荐系统正式发布，首批技能生态奖项揭晓", "summary": "9月23日，在2026云栖大会“AI Agent原生操作系统”分论坛上，龙蜥社区正式发布SkillHub推荐系统并举行颁奖仪式。阿里云智能集团研发副总裁、龙蜥社区理事长马涛，中兴通讯副总裁、龙蜥社区副理事长刘东，AMD全球副总裁Raghu Nambiar等嘉宾共同出席，标志着龙蜥社区SkillHub从技能汇聚走向质量评测与榜单推荐。 对AI原生操...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502738", "publishedAt": "2026-09-24T10:03:02+00:00 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
