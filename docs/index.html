 个国家和地区的 360 项申报案例，其中 22 个国家和地区为首次参与。世界互联网大会领先科技奖共征集到来自 43 个国家和地区的 430 余项科技成果。其中，18 个国家和地区为首次参与，国际申报数量较去年增长 21%。据官方介绍，“互联网之光”博览会以“智能互联、智见未来”为主题，截至目前已邀请 400 余家企业参展。另外，“直通乌镇”全球互联网大赛也将进行全新升级，设置数智医疗、智联出行、智能终端、智能制造、新消费五大赛道，新出行、AI+ 制造两大场景赛，以及开源竞技挑战赛、OPC 两大特色赛事。2026 年世界互联网大会杰出贡献奖覆盖近 20 个国家和地区，涵盖人工智能、信息通信、机器人、医疗健康等多个领域。世界互联网大会“全球青年领军者计划”吸引来自全球 140 余个国家和地区的 2600 余位优秀青年报名，较往年有显著提升。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/879.htm", "publishedAt": "2026-11-02T01:34:22+00:00"}, {"title": "美团龙猫发布 LongCat-2.5 原生多模态 AI 模型：1.6T 参数，面向长程智能体任务", "summary": "IT之家 11 月 2 日消息，美团龙猫今日发布面向长程智能体任务的原生多模态模型 LongCat-2.5，模型总参数量为 1.6 万亿，每个 token 激活约 480 亿参数，在 LongCat-2.0 的基础上进一步强化原生视觉理解与智能体编程能力。据介绍，龙猫在长序列训练中加入更多长程轨迹数据，并通过大规模长程强化学习，提升模型在复杂代码库开发、完整项目构建等任务中的端到端工程能力。围绕数据合成、环境构建与跨 Harness 混合训练，官方持续扩展这条训练链路。此外，龙猫将真实 Agent 的失败轨迹转化为可复现、可验证的训练任务，针对模型能力短板持续补充训练数据。与此同时，LongCat-2.5 将视觉信号表示为多层级离散 token，使主干模型以统一的 token 形式处理视觉与文本输入。原生视觉理解与智能体编程能力的结合，使模型在 Visual Coding 上表现出色，并支持创意设计和 3D 等任务。官方表示，这些升级由持续演进的基础设施支撑：优化国产算力上的长上下文训练与 W4A4 推理，并通过训推数值一致性和长上下文 rollout 优化，支撑大规模长程 RL 的高效运行。IT之家附评测结果：在线体验：https://longcat.chatAPI 接入：https://longcat.chat/platform/productGithub、HuggingFace：即将上线", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/873.htm", "publishedAt": "2026-11-02T01:18:38+00:00"}, {"title": "受益人口近 1.18 亿：南水北调中线工程圆满完成 2025-2026 年度供水任务，累计向受水区供水 72.64 亿立方米", "summary": "IT之家 11 月 2 日消息，据中国南水北调集团分享，截至 10 月 31 日，南水北调中线工程圆满完成 2025-2026 年度供水任务，年度累计向受水区河南、河北、北京、天津供水 72.64 亿立方米，工程惠及沿线 27 座大中城市，受益人口近 1.18 亿人。本年度，中线工程在保证口门供水的基础上，利用汛前及汛期富余水量，相机向沿线清河、贾峪河、滏阳河、七里河、泜河等 15 条河流和地区实施生态补水，超额完成水利部下达的夏季集中补水计划。IT之家注意到，2025-2026 年度冰期，全线供水 16.48 亿立方米，较计划多供 1.58 亿立方米，全力提升冰期输水能力，实现多供水目标。2025-2026 年度供水任务圆满完成，根据规划，中国南水北调集团将同步开启 2026-2027 年度调水任务。延伸阅读南水北调中线工程从丹江口水库引水，全程自流，总干渠全长 1432 公里，于 2003 年开工建设，2014 年 12 月 12 日正式通水运行，设计年调水规模 95 亿立方米。工程穿越长江、淮河、黄河、海河四大流域，途经河南、河北，最终抵达北京、天津。文中提及的中国南水北调集团有限公司成立于 2020 年，于 2020 年 10 月 23 日正式揭牌，由国务院国资委管理，主要负责南水北调工程的前期工作、资金筹集、开发建设和运营管理。2025 年 10 月 13 日，由中国工程院院刊《Engineering》组织评选的“2025 全球十大工程成就”发布，南水北调中线工程与毅力号火星探测器、欧几里得空间望远镜、DeepSeek 开源大语言模型等一同上榜。截至 2026 年 5 月，南水北调东、中线一期工程累计调水超 880 亿立方米，惠及 7 省市 48 座大中城市约 1.95 亿人，其中中线累计调水超 782 亿立方米。工程受水区地下水位普遍回升，浅层、深层地下水分别回升 3.76 米、7.65 米。冰期输水能力的提升依托数字孪生技术，中线数字孪生 2.0 版可实现输水全流程仿真，应急抗旱调度时间由 7 天压缩至 2 天，近三年冰期输水比计划多供水超 5 亿立方米。通水以来，中线工程水质持续稳定达到或优于 Ⅱ 类标准。受益于此，北京自来水硬度从 380 毫克 / 升降至 120 毫克 / 升。此外，永定河、滹沱河、大清河等断流多年的河流通过生态补水重现碧波，白洋淀水质从劣 Ⅴ 类提升至 Ⅲ 类。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/851.htm", "publishedAt": "2026-11-01T23:48:32+00:00"}, {"title": "微软 AI 负责人苏莱曼：AI 模型没有意识，我们应确保它永远如此", "summary": "IT之家 11 月 2 日消息，微软 AI 负责人（Mustafa Suleyman）昨天在 X 平台发布长文，称目前的 AI 模型并不具备意识，人们应该让这种情况一直保持下去。IT之家了解到，苏莱曼表示：“据我了解，如果开发具有意识的 AI 是可能的，那么这么做将是鲁莽的，我们不应该开发这类 AI。如果训练过程中开始出现意识，我会呼吁所有人暂停 AI 开发，直到可以从设计层面消除这些特性。”他认为，如果有任何证据能表明 AI 模型具备意识，就应该立即向公众披露，以便整个社会共同决定下一步怎么做。他说道：“我们这些 AI 开发员，完全没有权利将具有意识的新物种带到世界上，即使有人希望以福祉为首要目标开发它。地球上 80 亿人没有同意参与这项实验，保护人们的道德权利、安全和福祉，是我们首先必须履行的义务。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/848.htm", "publishedAt": "2026-11-01T23:36:08+00:00"}, {"title": "OpenAI、谷歌、微软和 Anthropic 联手推行 AI 数据抓取退出标准", "summary": "IT之家 11 月 1 日消息，OpenAI、谷歌、微软以及 Anthropic 近日宣布将采用一项新标准，内容发布方可以借助该标准选择拒绝 AI 抓取自家网站内容。借助这项管控机制，内容发布方可以一次性向多家 AI 企业统一申明自身针对 AI 模型训练的内容使用偏好，而不必为每家企业单独设置规则。该标准由 Anthropic 技术负责人 Kevin Kelley 向互联网工程任务组（IETF）提出，并将集成在网站的 robots.txt 文件中。长期以来，robots.txt 文件用于告知网络爬虫哪些网站内容允许抓取、哪些禁止抓取，适用场景包含搜索索引、网页归档以及 AI 模型训练。目前，网站必须向每一家 AI 企业分别单独声明自己的 AI 训练相关内容使用偏好。在此背景下，各类 AI 爬虫持续抓取网站内容、将网页素材输入 AI 模型训练，内容发布方正为此焦头烂额。IT之家注意到，目前，网站需向每家公司单独声明训练偏好，新标准旨在简化这一流程。Anthropic 已率先采纳，OpenAI 计划在未来几个月内落实，谷歌和微软则预计于明年支持。Meta 发言人 Andy Stone 也表示支持建立此类通用信号，但未明确具体落地计划。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/837.htm", "publishedAt": "2026-11-01T14:19:52+00:00"}, {"title": "清华姚期智团队新作：代数世界模型，让AI像牛顿一样思考", "summary": "让AI像牛顿一样思考", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/507031.html", "publishedAt": "2026-11-01T08:02:37+00:00"}, {"title": "刚刚，DeepSeek重磅开源：Age e/WmlATgJudjwPKqHf4QgX?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-02T09:20:00+00:00"}, {"title": "英伟达向韩国互联网巨头 Naver 投资 10 亿美元，将超越创始人成为第三大股东", "summary": "IT之家 11 月 2 日消息，据韩国经济日报报道，为加速全球 AI 布局，Naver 创始人兼董事会主席李海珍（Lee Hae-jin）借 10 亿美元（现汇率约合 66.61 亿元人民币）交易引入英伟达并稀释自身持股。IT之家注：NAVER 是韩国搜索引擎与门户网站，1999 年 6 月正式上线，为韩国最大的搜索引擎与综合门户网站。英伟达认购完成后将持有 Naver 约 4.54% 的股权，英伟达将超越创始人李海珍，正式升至第三大股东席位。据悉，前两席仍由机构投资者占据，分别为第一大股东韩国国民年金公团（NPS）以及第二大股东贝莱德（BlackRock）。Naver 于 2026 年 10 月 30 日发布的公告显示，该笔 10 亿美元（现汇率约合 66.61 亿元人民币）款项的既定交割日期为 2026 年 11 月 6 日。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/884.htm", "publishedAt": "2026-11-02T01:51:33+00:00"}, {"title": "C++ web框架 Paozhu 发布1.17.4版", "summary": "本次加上了 OAuth2.1 server ,OAuth2.1 client, JWT模块 顺便添加一个gitub授权 client, 这样可以获取github能力了，是不是以后可以让agent提交代码。 大量修复了 ORM 模块 paozhu已经是强大一体化Web开发平台，支持多域名虚拟主机 支持SAAS 支持MQTT WebSocket 等物联网开发。 也可以用来组网上报数据。 本次添加OAuth...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503335", "publishedAt": "2026-11-02T01:28:49+00:00"}, {"title": "消息称三星首款 AI 眼镜 12 月中旬登陆韩国、美国，要和 Meta 抢市场？", "summary": "IT之家 11 月 2 日消息，据 TrendForce 今天报道，三星正准备进军 AI 智能眼镜市场，计划 12 月中旬在韩国和美国推出品牌首款 AI 智能眼镜。命名暂定为“Intelligent Eyewear”，售价尚未确定。IT之家从原报道获悉，这款 AI 眼镜的首发市场不包括欧洲、中国和日本等地。三星考虑到 AI 眼镜是全新产品品类，因此希望先评估韩国和美国市场需求及用户反馈，再决定是否扩大市场范围。硬件方面，Intelligent Eyewear 将搭载谷歌 Android XR 平台、集成 Gemini AI，通过摄像头和麦克风感知环境，提供实时翻译和语音导航等功能。该产品还可以拍摄文件和会议场景，将有关信息整理到 Galaxy 手机的笔记 App。该产品并没有显示屏，主要通过语音交互。同时，该产品预计将搭载高通骁龙 AR1 Gen 1 处理器，单次充电续航最长 9 小时。产品设计层面，三星已经和 Gentle Monster 与 Warby Parker 合作。今年 5 月的 Google I/O 大会上，三星展示了两种设计方案；上个月在伦敦举行的 Galaxy Unpacked 活动则出现了另外两款设计。值得注意的是，智能眼镜市场已经有多个玩家入局，三星能否成功杀出重围尚无定论。例如 XREAL 刚刚发布了全球首款 Android XR 智能 AR 眼镜 XREAL AURA，预计 11 月中旬在美国、加拿大、日本和韩国等市场出货。并且 Meta 已经深耕智能眼镜市场多年，他们的产品已经覆盖高中低不同价格段。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/866.htm", "publishedAt": "2026-11-02T01:00:01+00:00"}, {"title": "现代汽车集团投资约 9 万亿韩元打造 AI 谷进展：计划成立两家新公司，分别负责 AI 基础设施建设与 GPU 算力服务运营", "summary": "IT之家 11 月 2 日消息，当地时间 10 月 30 日，现代汽车集团宣布正式启用新办事处，此举是推进新万金（Saemangeum）人工智能数据中心建设的重要一步。该数据中心是现代汽车集团在韩国群山市投资约 9 万亿韩元（IT之家注：现汇率约合 448.38 亿元人民币）打造“新万金 AI 谷”的核心支撑项目。今年 9 月，现代汽车集团已先行成立一家特殊目的公司（Special Purpose Company, SPC），负责推进 200 兆瓦可再生太阳能光伏发电一期工程建设，专门为该 AI 数据中心输送绿电。现代汽车集团同时宣布，计划于 11 月携手旗下现代汽车、起亚、现代摩比斯（Hyundai Mobis）、现代建设（Hyundai E&amp;C）及现代 AutoEver 五家核心子公司，联合再设立两家专项 SPC：一家统筹负责数据中心的基建工程与配套设施建设；另一家则专门负责采购与锁定高性能 GPU 算力资源，并开展后续的 GPU 算力云与运营服务。施工目标定于 2027 年 3 月开始，服务计划于 2030 年初启动。该数据中心建成后，预计将支持自动驾驶、机器人技术以及整车工程等领域的 AI 研发。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/864.htm", "publishedAt": "2026-11-02T00:57:15+00:00"}, {"title": "石油巨头沙特阿美收购该国人工智能企业 HUMAIN 49% 股份", "summary": "IT之家 11 月 2 日消息，此前由沙特阿拉伯主权财富基金 PIF 完全控股的人工智能初创企业 HUMAIN 当地时间本月 1 日宣布，全球最大石化企业沙特阿美 (Aramco) 将收购该企业 49% 的股份，PIF 保留剩余 51%。沙特阿美计划通过转让关键人工智能资产并注资约 99 亿沙特里亚尔（IT之家注：当前约合 175.5 亿人民币）的形式进行这笔投资。两家股东将为 HUMAIN 贡献各自的人工智能资产、能力、人才，并监督 HUMAIN 的业务扩张计划。沙特阿美预计将利用 HUMAIN 的人工智能基础设施，将先进的人工智能能力转化为工业应用，从而进一步增强其全球生态系统和运营能力。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/863.htm", "publishedAt": "2026-11-02T00:44:35+00:00"}, {"title": "美国特拉华州拟允许 AI 智能体创办、运营企业", "summary": "IT之家 11 月 2 日消息，据科技媒体 TechRadar 今天报道，美国特拉华州计划放宽商业监管规定，允许 AI 智能体运营的企业注册成立。国会议员对此并不完全认同，一名共和党众议员已致信州长表达担忧。据报道，美国众议院监督委员会主席、众议员詹姆斯 · 科默（James Comer）对此表示反对，担忧 AI 运营的企业可能带来风险。《金融时报》报道称，科默已经致信特拉华州州长马特 · 迈耶（Matt Meyer）。他在信中写道：“我们担心，特拉华州提出的人工智能公司（IT之家注：AIC）可能用于保护实力雄厚的 AI 企业及投资者，使他们免于为鲁莽且造成伤害的行为承担责任。”同时特拉华州草案规定，将为 AIC 设定 30 个月监管沙盒。AI 在此期间需要在受监管的环境中测试，由智能体作出商业决策。与正常企业一样，AI 企业可以成为诉讼对象，必要时也可以主动提起诉讼。特拉华州的计划可能有助于建立 AI 核心企业组织架构，例如自主商业运营企业。许多人认为，如果美国各州不尽快采取行动，这类企业可能会率先在海外出现。加利福尼亚大学法学教授安德鲁 · 贝克（Andrew Baker）认为，特拉华州立法是在寻找折中方案，让 AI 智能体创立的企业获得法律确定性。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/858.htm", "publishedAt": "2026-11-02T00:18:05+00:00"}, {"title": "当 AI 能读懂二进制，闭源软件还剩多少护城河？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/8mCjWWFLdjDA2vb51QZs?utm_source=rss&amp;utm_medi 6/four-months-of-zig", "publishedAt": "2026-10-28T03:54:47+00:00"}]}, {"label": "论文研究", "items": []}, {"label": "技巧与观点", "items": [{"title": "novel-plus v6.3.2 发布，原创文学 CMS 系统", "summary": "novel-plus v6.3.2 发布了，v6.3.0 – v6.3.2 主要改变如下： 创作数据看板 + AI 解读：作家后台首页新增经营数据看板（收入、作品、章节等图表），并支持 AI 智能解读，自动生成创作经营建议。 章节状态管理：支持章节草稿保存与定时发布，到点自动上线，发布前可对正文做 AI 文本检查。 消息中心：作家后台新增消息列表...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503333", "publishedAt": "2026-11-02T01:03:38+00:00"}, {"title": "思科给 1 位年轻工程师无上限 Token 预算，最终目标 2 年内利用 AI 重写 98% 的遗留代码", "summary": "IT之家 11 月 2 日消息，据《财富》报道，思科（Cisco）总裁兼首席产品官吉图 · 帕特尔（Jeetu Patel）透露，他指派了一位 27 岁的年轻工程师，设定了在 24 个月内利用 AI 重构 / 重写公司 98% 遗留代码（Legacy Code）的目标，并向其提供无上限的 Token 预算。IT之家注：遗留代码是计算机系统中与已停止维护的操作系统或技术相关的源代码，也指为兼容旧功能嵌入现代软件的代码，通常使用过时技术编写且缺乏完整文档，维护成本较高。“我已经给了他无限制的 Token，因为他要去重构代码，”帕特尔表示，“所以我对他说，去放手干吧，随便你怎么折腾。”这里的“他”是指帕德马纳班 · 克里希那穆提（Padmanabhan Krishnamurthy），帕特尔亲切地称呼他为“帕迪（Paddy）”。IT之家注意到，克里希那穆提曾于 2023 年联合创办实时翻译初创公司 EzDubs；2025 年，思科完成了对 EzDubs 的收购，他随之加入思科。尽管头顶前创始人兼 CEO 的光环，但帕特尔称他当时“被埋没在组织深处，做着无关大局的边缘事务”。转折发生在帕特尔视察思科旧金山办公室期间，两人当时展开了一次深入交流。克里希那穆提提出，自己只需组建一个两人团队，就能彻底重写思科庞大的遗留代码（Legacy Code）。帕特尔表示，在此之前，即便是自己团队中最具前瞻眼光的 AI 专家也从未有过这般构想。据悉，克里希那穆提已经为自己立下了四周的验证期；其终极目标，是在 24 个月内完成思科 98% 遗留代码的重构。值得注意的是，98% 现阶段仅是一项既定目标，而非落地成果；且相关报道并未透露当前的代码修改体量以及试验的具体成效。相关阅读：《思科总裁用 AI 智能体盘点并取消无用订阅服务，一年省下上千美元》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/857.htm", "publishedAt": "2026-11-02T00:17:13+00:00"}, {"title": "OpenAI 即将启动大规模公关宣传，考虑将数据中心重新包装为“AI 算力园区”", "summary": "IT之家 11 月 2 日消息，据外媒 Axios 昨天报道，OpenAI 正准备在周二美国中期选举结束后，发起大规模公关宣传活动。OpenAI 首席全球事务官克里斯 · 莱汉（Chris Lehane）对此表示，此次中期选举将成为 2028 年总统大选的“预告片”。未来，人工智能将成为大选的核心议题。IT之家注意到，OpenAI 准备在未来加强与公众沟通 AI 相关话题。莱汉提到，他们计划制定 AI 发展速度限制；并寻找方法，让人们认识到 AI 如何赋能日常生活；推动美国参与制定全球标准；以及将数据中心重新包装为“AI 算力园区”。莱汉认为，AI 公司与民众就数据中心展开的讨论将是“良好且健康的对话”。此前因数据中心建设争议不断发酵，亚马逊和微软宣布，与地方政府谈判相关项目时，将不再使用保密协议。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/844.htm", "publishedAt": "2026-11-01T22:58:19+00:00"}, {"title": "古尔曼：苹果明年上半年将推出配备 OLED 屏幕的 iPad Air、搭载均热板的 iPad Pro", "summary": "IT之家 11 月 2 日消息，彭博社记者马克 · 古尔曼（Mark Gurman）发文透露，继上周发布新款 iPad mini 之后，苹果接下来将在 2027 年将重心转向一系列其他平板产品的更新。IT之家获悉，古尔曼称根据他获得的消息，这些产品线更新预计都将在上半年登场：一款升级款入门级平板（考虑到此前涨价导致其售价远高于竞品，这次迭代显得尤为迫切）一款为了与 iPad mini 对齐而采用 OLED 屏幕的全新 iPad Air以及性能更强的 iPad Pro，很可能会加入均热板（Vapor Chamber），以便在运行游戏及高负载 AI 任务时提供更好的散热支持古尔曼表示，除非后续发布计划延期，否则（明年）下半年预计不会再有新款 iPad 发布。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/843.htm", "publishedAt": "2026-11-01T22:48:48+00:00"}, {"title": "如果 AI 幻觉也有预算，超支之后该怎么办？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/z8vQa2zzGyLiTxIZ8PXH?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-01T10:00:00+00:00"}, {"title": "每天上千万次创建：Agent Sandbox 为什么会成为新算力形态？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/video/4qjamMQLVIoZvytUQwpI?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-31T16:15:46+00:00"}, {"title": "不认字的 AI，却很会说话", "summary": "机器为什么不能先说话，再认字？#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1686124?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-10-29T07:03:36+00:00"}]}]};

const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
