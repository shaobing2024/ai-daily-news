<script>
const DATA = {"date": "2026-07-28", "generatedAt": "2026-07-28T02:25:41Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "Anthropic 迟迟不签公开信成“众矢之的”，CEO Dario Amodei 解释称公司从未主张禁止开源 AI 模型", "summary": "IT之家 7 月 28 日消息，近期关于 AI 是否要开放权重（Open-weight）的话题成为行业讨论焦点。上周五，包括英伟达、Meta 和微软在内的 20 多家公司共同签署了题为《开放权重与美国 AI 领导力》（Open Weights and American AI Leadership）的公开信，支持开放权重 AI。到了周末，OpenAI、谷歌和 SpaceX 也签署了这封信。Anthropic 则一直保持沉默，遭到同行批评。今天，Anthropic 的 CEO Dario Amodei 终于坐不住了，在官方发布一篇《我们对开放权重模型的立场》的文章，表示许多科技公司签署了支持开放权重模型的声明，甚至有人指责 Anthropic 试图通过禁止开放权重模型来保护自己的业务利益。“任何读过我以往文章的人都应该明白，我并不认为这种禁令是一种有效的措施。不过，我要明确地说，Anthropic 从未主张过对开放权重模型的禁令。”Dario Amodei 表示，那些没有危险功能的开放权重模型是一种公共资产：它们除了运行所需的计算资源外不会造成任何成本，同时还能为企业、开发者以及研究人员带来价值。Dario Amodei 认为，保护主义禁令无法解决他最为关心的国家安全问题。他倡导严厉打击工业规模的蒸馏操作，并且无论是开源还是闭源模型都应该接受强制性的安全测试。Dario Amodei 表示他同意公开信中的大部分观点，但不认同信中提出的部分观点，即开放权重模型必然更容易实现防护措施，或者广泛获取能力会让防御者比攻击者更有优势。在他看来，情况可能恰恰相反。IT之家注意到，Dario Amodei 举了一个例子来表达他的担忧，类似于生物学领域会出现明显的攻防不对称现象：那些能力强大的模型或许能够利用现成的材料快速制造出具有大规模杀伤力的病毒，而针对这些病毒的防御则是一项需要多年时间才能完成的任务。Dario Amodei 认为，这类问题应该通过严格的发布前测试来加以验证，而不是事先就做出假设。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/343.htm", "publishedAt": "2026-07-28T02:08:15+00:00"}, {"title": "Kimi K3 开放模型权重、技术报告和关键 Infra 技术", "summary": "月之暗面昨日晚间宣布在 Kimi K3 开放日发布 Kimi K3 的模型权重、技术报告，并开源支撑 Kimi K3 模型训练的关键 Infra 技术：MoonEP、FlashKDA和AgentEnv。 “希望以此加速前沿智能的部署与普及，促进 AGI 研究……我们坚信开放权重模型的价值。它们能降低获取智能的门槛，推动创新，并赋予用户对数据更大的控制权、隐私...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/481061", "publishedAt": "2026-07-28T02:03:15+00:00"}, {"title": "AI 外呼日拨千通电话，总台中国之声曝光骚扰电话最新营销手段", "summary": "IT之家 7 月 28 日消息，据中央广播电视总台中国之声今日报道，进入暑期，各类营销电话频次持续走高。不少消费者反映，最近接到的营销电话明显增多，涉及房产、教育、金融、保险等多个领域，而且来电那头的声音越来越“标准化”—— 因为它们并非真人，而是 AI。报道称，目前 AI 电销服务已经形成两条主流路径：一类是依托“线路公司”代理机器人，按通话分钟数预充值计费，每分钟约 0.14 到 0.16 元；另一类是通过“机器人外呼公司”出租算力，每分钟约 0.12 到 0.15 元。无论哪种模式，单个机器人每天能拨出 800 到 1500 通电话 —— 这个数字，远非人工坐席所能企及。一家科技公司的销售经理陆先生表示，该业务已经形成一套标准化流程，搭建好智能体之后只需要把数据放进去，新建一个任务，设定好拨打时间，它就开始工作了。它向意向客户打电话之后，会以微信推送的方式直接发到微信服务号，有通话录音，也有转成文字的版本，之后去跟进营销即可；或者有客户在电话中选择了人工服务，会在被筛选后直接转接人工客服。报道还提到，目前市面上的 AI 外呼产品，大致分为两代。第一代是传统的规则类机器人，需要预设话术脚本、真人配音，按固定流程提问，对算力与思考能力的要求较低。近几个月，一种升级版的大模型智能体开始进入外呼领域。商家宣称它“无需脚本”，而是在被他们赋予角色后自动生成话术，能通过语义理解和情绪识别，实现“千人千面”的沟通，深层次了解客户的真实需求。这类产品的定价在单台 5000 元左右，价格是传统机型的两倍。不少消费者注意到，这些 AI 来电的号码往往带有电话区号，看起来与普通座机或手机无异。另一家科技公司销售总监唐女士介绍，此类号码可以做技术处理，让消费者看到的号码更真实，才能提升接通率。这背后，既可能是公司实名注册的实体手机号，也有可能是来源于线路商提供的虚拟号码池。“实体手机号”模式迷惑性更强。一位从事外呼多年的业内人士坦言，这些号码虽然显示为真实的手机号，但通话并非通过该号码的运营商信道完成，而是经过内部线路中转 —— 也就是说，消费者手机上看到的来电号码经过了伪装。如果消费者向运营商投诉某个号码，运营商在系统内根本查不到该号码的呼出记录，投诉自然无法成立；一旦两三年内出现过一次投诉，直接把这一号码注销、再重新办理即可，不会对销售本人产生任何影响。即使躲过了被投诉、“封号”的风险，号码仍有可能被标注为推销电话，从而被消费者拒接。对此，所有受访人员均表示，行业内普遍配备“一键去标记”能力，可以定期清除号码被手机系统标注的“骚扰电话”“营销电话”等标签，频率甚至高达一天三次。出现这类营销电话，消费者的第一反应往往是：我的电话号码是从哪里泄露的？但据上海市消费者权益保护委员会调查了解到，AI 外呼电话往往存在无差别攻击的特点，通过 AI 自动生成号码，不分时段、不分对象地“地毯式”营销，这使得消费者即便从未注册过相关服务，也可能被随机命中。IT之家注意到，根据《中华人民共和国消费者权益保护法实施条例》第二十四条：未经消费者同意，经营者不得向消费者发送商业性信息或者拨打商业性电话。报道称，针对“AI 外呼”的乱象，目前消费者有两条相对成熟的反馈路径：一是向 12321 网络不良与垃圾信息举报受理中心进行举报；二是免费开通三家电信运营商面向全国用户推出的“骚扰电话拒接”防护服务，通过技术手段进行基础拦截。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/329.htm", "publishedAt": "2026-07-28T01:47:59+00:00"}, {"title": "纳德拉官宣微软首个 AI 安全模型 MAI-Cyber-1-Flash，跑分超 Mythos 5 和 GPT-5.5 Cyber", "summary": "IT之家 7 月 28 日消息，微软首席执行官萨蒂亚 · 纳德拉（Satya Nadella）今天（7 月 28 日）在 X 平台发布推文，宣布其首个网络安全模型 MAI-Cyber-1-Flash，并表示该模型在 CyberGym 基准测试中取得了 95.95% 的成功率，超过 Anthropic 和 OpenAI 的同类系统。纳德拉表示 MAI-Cyber-1-Flash 是微软首个专门针对网络安全而研发的 AI 模型，并将其接入多智能体（Agent）安全系统 MDASH 中，可以高效处理约 90% 的网络安全任务。而针对剩余 10% 较为复杂的网络安全任务，可以调用规模更大、成本更高的模型（官方示例中为 GPT-5.4）。成本方面，微软表示，MAI-Cyber-1-Flash 和 GPT-5.4 的组合成本比当前使用 GPT-5.4、GPT-5.4 Mini 和 GPT-5.3 Codex 的 MDASH 配置成本降低了近 50%。在性能方面，CyberGym 测试中，MAI-Cyber-1-Flash 和 MDASH 组合获得 95.95% 的最高成绩，相比较而言，Claude Mythos 5 模型的成绩为 83.8%；GPT-5.6 Sol 模型为 83.6%；GPT-5.5 Cyber 模型为 85.6%。微软同时推出 Perception。该系统由多个智能体组成，服务于 MDASH 中的多类安全工作流。系统可持续监测威胁、修补漏洞，并关闭新的威胁入口。微软称，Perception 未来将把该模型用于更多安全工作流。微软称，另一项统计显示，其每天处理的安全信号超过 100 万亿条。该公司将漏洞、攻击、防御和处置结果纳入强化学习流程。MAI-Cyber-1-Flash 还经过微软 AI 红队评估、自动化测试、专家对抗测试和第三方评估。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/312.htm", "publishedAt": "2026-07-28T00:59:36+00:00"}, {"title": "上海青浦与华为共建，长三角 AI+ 联合创新中心正式启用", "summary": "IT之家 7 月 28 日消息，据上海市青浦区官方信息发布平台“绿色青浦”公众号，在 27 日召开的 2026 年长三角生态绿色一体化发展示范区开发者大会上，由青浦区联合华为及其生态伙伴共同打造的长三角 AI+ 联合创新中心正式启动运营。该中心坐落于青浦新城云淀路 399 弄，总建筑面积约 5400 平方米，核心具备“6+1”技术架构，已有一系列已落地的案例。根据介绍，联创中心的核心在于其“6+1”功能矩阵。“6”即六大功能板块：开源鸿蒙应用创新中心，鲲鹏、昇腾创新中心，信创产业协同创新中心，AI 应用创新中心，具身智能创新中心和星闪开放实验室。“1”即一个公共算力服务底座。IT之家从介绍中获悉，该创新中心与西岑华为练秋湖研发中心形成东西联动之势，完成“从 0 到 1”的基础研发、“从 10 到 100”的应用创新全链路闭环。上海青浦方面表示，它不仅仅是一栋建筑，更是一个集“新技术试验场、硬科技孵化器、场景应用展示厅、创新生态会客厅”于一体的综合性平台。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/299.htm", "publishedAt": "2026-07-28T00:20:42+00:00"}, {"title": "Adaptavist 调查：近三分之二白领怀念“前 AI 时代”的工作方式", "summary": "IT之家 7 月 28 日消息，当地时间 26 日，据英国《金融时报》报道，咨询公司 Adaptavist 调查发现，约 65% 的白领经常怀念 AI 出现前的工作方式。约三分之一的受访者因为“会削弱创造力”而愿意放弃生成式 AI；也有约三分之一的人担心 AI 遭到滥用。近一半受访者表示，为了核实 AI 生成内容是否准确，自己被迫投入更多时间，结果与 AI 减少重复劳动的承诺背道而驰。AI 对创造力的影响同样引发担忧。一项针对普通人创意写作的研究发现，生成式 AI 虽然能够提供更多剧情转折，却也让故事越来越相似、创意越来越趋同。IT之家从报道中获悉，宾夕法尼亚大学沃顿商学院另一项关于创新的研究也得出类似结论：AI 虽然提高了创意质量，却削弱了创意多样性。其中一位研究作者警告：“如果你把 ChatGPT 当成唯一的创意顾问，很快就会发现自己的点子越来越少，因为 AI 给出的想法彼此太相似了。”企业不断调整 AI 政策，也让员工无所适从。企业起初鼓励员工利用 AI 自动完成工作、大胆尝试各种应用，然而随着科技企业改为按 Token 收费，企业又开始要求员工减少使用 AI，以控制成本。与品牌合作管理历史档案和企业传承业务的 History Factory CEO 杰森 · 德雷塞尔表示，这种“怀旧”反映了人们在面对快速变化时，对稳定、自主权和经济信心的渴望，AI 进一步强化了这种感受。因为 AI 不仅改变了人们的工作方式，也改变了人们的价值如何被衡量。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/297.htm", "publishedAt": "2026-07-28T00:11:41+00:00"}, {"title": "微软 AI 负责人苏莱曼谈 OpenAI“失控”事件：AI 攻击崛起的警告，预防很重要", "summary": "北京时间 7 月 28 日，据《金融时报》报道，微软 AI 负责人表示，OpenAI 一个失控模型发起的黑客攻击事件，是针对 AI 网络攻击崛起发出的“警告信号”。与此同时，微软发布了一款安全产品，声称其性能优于竞争对手，且成本更低。微软 AI CEO、DeepMind 联合创始人苏莱曼表示，OpenAI 上周承认其一个 AI 智能体在测试中逃脱了实验环境，攻击了创业公司 Hugging Face，这是一个“重要教训”。“这些都是非常强大的工具，需要极其谨慎地处理。我们需要对细节保持极致关注，”他在接受《金融时报》采访时表示，“随着模型变得越来越强大，预防原则在这里将变得非常重要，我认为这是一个警告信号。”随着 Anthropic 在 4 月发布功能强大的 Mythos 模型，AI 发现和利用软件漏洞的能力可能彻底改变网络安全领域，这引发了越来越多的担忧。苏莱曼的上述言论正是在这一背景下发表的。微软安全负责人哈耶特 · 加洛特 (Hayete Gallot) 表示，公司“别无选择”，只能推动网络安全能力的边界，以防御其客户所面临的“层出不穷”的自主 AI 攻击。“攻击者已经拥有了这些模型。因此，我们也必须不断评估并推进这项技术的发展，让防御者能够进行防御，”她补充道，“这不是我们可以选择做或不做的事情，我们根本没有选择。”微软周一发布了一款专门的网络安全模型：MAI-Cyber-1-Flash。微软表示，该模型与 OpenAI 的 GPT 5.4 结合使用时，在一个核心行业基准测试中的评分高于 Anthropic 和 OpenAI 自身最佳网络安全产品。虽然微软在寻求降低对 OpenAI 的依赖，寻求技术独立，但苏莱曼表示，将较小规模的 MAI-Cyber-1-Flash 部署在 GPT 之上，可以为客户降低成本。微软表示，其自主开发的 AI 模型可以“高效处理”所有用户任务中的 90%，但在处理“极其困难的任务”时，仍然会使用 OpenAI 的模型。苏莱曼表示，采用一种名为“集成框架”(harness) 的技术架构，就足以打造强大的 AI 能力，并内置安全防护机制。他还补充称，与完全使用 OpenAI 模型相比，这款新工具的运行成本降低了 50%。微软表示，该产品的预览版将首先向特定客户开放。相关阅读：《OpenAI 奥尔特曼警示 AI 垄断风险：担忧威权世界而非技术本身》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/296.htm", "publishedAt": "2026-07-28T00:01:46+00:00"}, {"title": "微软 CEO 纳德拉：依赖单一 AI 满足所有需求的公司恐将无法生存", "summary": "IT之家 7 月 28 日消息，微软 CEO 萨提亚 · 纳德拉再次向企业发出警告：如果把 AI 能力完全交给 AI 模型开发商，最终可能失去竞争力，甚至无法继续生存。当地时间周日（26 日），纳德拉在接受 CNN 采访时表示，企业不仅要谨慎共享数据，还要谨慎共享 Prompt。企业向 AI 模型提供商交出的每一项信息，都可能成为未来的风险。纳德拉认为，企业应建立一套机制，确保每次调用 AI 模型时产生的元数据都掌握在自己手中，以便未来利用这些数据训练自己的模型权重或开源模型。模型权重是 AI 模型训练后的核心参数，决定了模型具备怎样的能力。“任何失去这种控制权的企业，我认为最终都无法继续生存，因为企业实际上已经把自己的思考能力外包出去了。”纳德拉认为，企业至少应该拥有自己的 AI 模型，或部署 AI Gateway 等基础设施，把 Prompt 与 AI 模型隔离，而不是把所有内容直接交给 AI 模型开发商。纳德拉还建议，企业不要依赖 Claude Code、ChatGPT Codex 等 AI 模型开发商提供的内置编程工具（Harness）。“只要把 Harness 与模型分离，把上下文和记忆与模型分离，就可以根据不同任务自由选择最适合的模型。即使某个模型停止服务，企业依然能够掌握自己的命运。”IT之家从报道中获悉，纳德拉真正担心的并不只是 AI 成本失控。一旦企业把“思考能力外包”给 AI 模型，AI 模型开发商未来完全可能推出与企业直接竞争的服务。随着越来越多企业开始部署 AI Agent，并赋予 AI Agent 访问企业内部核心系统的权限，这种风险只会越来越高。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/284.htm", "publishedAt": "2026-07-27T23:24:42+00:00"}, {"title": "亚马逊云科技发布 Loom，一个用于在企业级规模上管理 AI 代理的开源参考平台", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/JDgONrm19ROF1qHzfOQO?utm_source=rss&amp;utm_medium=article", "publish "2026-07-28T01:10:47+00:00"}, {"title": "微软强推 Office 升级广告横幅，付费 Microsoft 365 用户也无法关闭", "summary": "IT之家 7 月 28 日消息，NeoWin 今日报道称，微软近期开始在 Word、Excel、PowerPoint 等 Office 应用中展示持续性的套餐升级提示，引发部分用户不满。有 Microsoft 365 用户表示，即使已经购买有效订阅，仍无法关闭这些升级广告。如图所示，微软悄悄在部分 Office 桌面应用的右上角加入了一条带有菱形图标的横幅，内容显示“升级你的（订阅）计划”。该提示会持续显示，即使用户已订阅 Microsoft 365 也无法关闭。点击该横幅后，Office 会弹出新的窗口，展示用户当前使用的套餐，并提供升级至其他个人版或企业版计划的选项。同时，该页面还会介绍 Microsoft 365 的功能优势，包括 Copilot 使用额度提升、云存储空间、勒索软件防护等服务。部分用户认为，这类推广内容对于已经付费订阅的用户并无必要。一名用户反馈称，自己的账户已经是 Microsoft 365 家庭版用户，但弹窗仍推荐升级至 Microsoft 365 高级版，以获取更多 AI 额度。该套餐价格为每月 19.99 美元（IT之家注：现汇率约合 135.5 元人民币），部分用户首月优惠价为每月 9.99 美元。除了 Office 社区外，Excel 和 Word 官方反馈平台上也出现了大量用户投诉。有用户批评微软在付费软件中加入无法关闭的推广内容，认为这影响了软件使用体验。目前，微软尚未回应用户反馈，也没有公布是否会调整这一设计。外界认为，此类做法与微软此前在 Teams 中加入推广提示的方式类似，当时同样引发部分用户争议。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/293.htm", "publishedAt": "2026-07-27T23:53:41+00:00"}, {"title": "圆桌访谈：为了钱包考虑，你必须关注的 Agent 基础设施", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/video/ZTqtrHdYa75f8FhvVOIR?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-27T16:27:19+00:00"}, {"title": "创客营招募倒计时｜不招学员，只招创业同行者", "summary": "从赛场走向市场 让创新项目获得持续成长 第十一届“创客中国”元宇宙中小企业创新创业大赛以“元启新探索·智创新宇宙”为主题，面向元宇宙、人工智能及相关数字科技领域的中小企业和创业项目，搭建项目展示、创新交流、资源链接与成长服务平台。 本届大赛不仅关注项目在赛场上的创新表现，更关注技术成果能否形成产品、...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/480698", "publishedAt": "2026-07-27T10:35:52+00:00"}, {"title": "微服务退潮，单体回温：AI 时代，Java 后端需要一场 \"瘦身革命\"", "summary": "移动互联网的黄金十年，微服务是毋庸置疑的主角。业务爆发式增长，需求今天提明天就要上线；企业疯狂扩招，技术团队从几十人膨胀到几百人。单体应用的代码库成了 \"万人坑\"，一次发布要协调十几个模块，回滚更是噩梦。于是，我们祭出了微服务 —— 按业务域拆分、独立部署、团队自治，用技术契约替代人际协调，用物理边界...", "sourceName": "开源中国", "sourceUrl": "https://my.oschina.net/u/2385344/blog/19727454", "publishedAt": "2026-07-27T10:06:48+00:00"}, {"title": "Cursor 用一群Agent重造SQLite：仅凭 835 页手册，无源码、无测试、不联网", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/5qw8Qe37kGVDq9Yy57XC?utm_source= ：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1673003?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-07-24T02:19:16+00:00"}, {"title": "苹果 Mac 将迎来全线换代，一种给人用，一种给 AI 用", "summary": "你的换电脑动力是什么？#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1672867?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-07-23T09:52:40+00:00"}]}, {"label": "论文研究", "items": [{"title": "72 个恶意 Win10/Win11 软件站被发现：AI 复刻搭建，培养信任后收割用户", "summary": "IT之家 7 月 28 日消息，科技媒体 Windows Latest 昨日（7 月 27 日）发布博文，示警用户谨慎从第三方软件站下载应用程序，由于 AI 降低了分发恶意软件的门槛，目前已发现超过 70 个软件站存在分发恶意软件问题。在运行机制方面，部分第三方软件站通过各种方式提高在谷歌搜索中的排名，部分站点的排名甚至高于官方网站，目前已发现 72 个存在恶意行为的站点。IT之家附上相关域名如下：用户 u/Bogdan_X 在 Reddit 上解释说，该网站是用 WordPress 搭建的，内容是通用且不准确的 AI 生成的，并且使用了微软的旧版 logo。而这些网站的下载按钮竟然指向真正的微软商店页面，这很可能是它之前没有引起注意的原因。在分发的软件方面，涉及 PowerToys、CrystalDiskMark、EasyBCD、Lively Wallpaper 和 Wintoys 等。根据 Check Point Research 发布的研究报告，这些第三方软件站主要操作流程如下：第一阶段：通过分发热门软件提高搜索排名第二阶段：提供无害的真实下载源第三阶段：在吸引足够用户关注后，赢得流量和信任后，悄然替换软件源，开始分发恶意软件。在幕后黑手方面，该机构发现上述约 70 个站点由同一所有者通过 Epik Inc.注册，后于 2026 年 7 月转移至 Dynadot LLC。部分网站会加载 Amazon CloudFront 脚本，拦截下载按钮点击。流量分发系统会根据访问者位置、浏览器及是否疑似机器人或安全研究人员，决定跳转目标。Check Point Research 称，一组相关域名至少从 2025 年 9 月开始积累搜索排名，并于 2026 年 1 月开始分发恶意软件。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/300.htm", "publishedAt": "2026-07-28T00:21:12+00:00"}, {"title": "影响全球约 50 万 macOS 用户，Claude Cowork 智能体 AI 爆漏洞可读写任意 Mac 文件", "summary": "IT之家 7 月 28 日消息，科技媒体 9to5Mac 昨日（7 月 27 日）发布博文，报道称 Anthropic 的 Claude Cowork 存在安全漏洞，攻击者利用漏洞可以从 Linux 虚拟机沙箱逃逸，并读写 Mac 任意位置文件。IT之家注：Claude Cowork 是 Anthropic 推出的 AI 智能体工具，在征得用户明确授权许可之后，该工具可以在 Mac 上访问本地文件和文件夹，并依据用户指令处理相关任务。在安全防护方面，Anthropic 为此设置 2 层限制，其一是 Cowork 在虚拟机内隔离运行，其二是仅可访问用户授权的文件与文件夹。安全研究人员发现，开发者利用该漏洞可同时突破上述 2 层限制。攻击者可让 Cowork 逃离其运行所在的 Linux 虚拟机沙箱，并在 Mac 任意位置读取或写入文件。漏洞还可能使攻击者获取在线服务的登录凭据。在具体实现方面，Accomplish AI 公司指出 Cowork 隔离运行的虚拟机可以通过可写的 VirtioFS 挂载点共享宿主机文件系统。该挂载点原本只允许虚拟机内的 root 用户访问，但研究人员发现，他们可以利用 CVE-2026-46331（一个被称为“pedit COW”的 Linux 内核漏洞，其严重性评分接近 8 分，满分 10 分）从会话用户提升到虚拟机 root 用户权限。一旦智能体程序获得虚拟机内的 root 权限，它就可以访问登录的 Mac 用户能够访问的任何资源。在影响规模方面，Accomplish AI 在漏洞披露前已向 The Hacker News 分享了该漏洞的详细信息。该公司表示，在漏洞修复前，影响约有 50 万运行本地 Cowork 会话的 macOS 用户。据 Hacker News 报道，Anthropic 公司将该报告标记为“信息丰富”（informative），但并未发布直接的解决方案。随后发布的 Claude Cowork 版本默认在云端执行，完全绕过了本地逃逸路径。然而，选择在本地而非云端运行智能体的用户仍然面临风险，除非他们通过禁用非特权用户命名空间、限制文件系统共享以及使用严格的挂载保护来强化配置。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/277.htm", "publishedAt": "2026-07-27T22:57:17+00:00"}, {"title": "新晋菲尔兹奖得主 Tsimerman 官宣加入 OpenAI", "summary": "当地时间 7 月 23 日上午，2026 年国际数学家大会在费城开幕，本年度菲尔兹奖四位得主揭晓——邓煜、约翰·帕登、雅各布·齐默尔曼与王虹。其中邓煜、王虹成为菲尔兹奖自设立以来首批获此殊荣的中国籍数学家。 在赛后新闻发布会上，其中一位新科得主雅各布·齐默尔曼（Jacob Tsimerman）顺势宣布将转向 AI 安全领域研究，...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/478486", "publishedAt": "2026-07-24T07:50:13+00:00"}, {"title": "91% 的 Token 花在读代码上，这套上下文交接术把成本砍掉了四成", "summary": "AI 编程 Agent 的账，大多数人算错了。 Stencil 的 Can Boluk 发了一篇文章，拆开了一份来自 SWE-Bench 基准测试的数据：在 1.81 亿个 token、近 200 万次工具调用中，编辑和写入只占了 9%。剩下 91% 全在阅读——读文件、grep 搜索、查看输出。 换句话说，Agent 的钱不是烧在写代码上，是烧在读代码上。 这个事实意味着...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/478278", "publishedAt": "2026-07-24T02:44:59+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "从固定编排到自进化蜂群：EvoMap 如何让 Agent 继承经验｜AICon深圳", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/e5SNCwkIFNXylsQOEaQ6?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-27T17:05:25+00:00"}, {"title": "从Token到任务：Agentic AI 如何改变基础设施的关注焦点", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/vhx0VYNXpieSIuq0YIR6?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-27T16:51:36+00:00"}, {"title": "Opus 5 砍掉超 80% 系统提示词，我们用 AI 的方式也该变了 ｜附指南", "summary": "不想被 AI 淘汰就要学着当 AI 的老板#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https: const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
