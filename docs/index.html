const DATA = {"date": "2026-07-28", "generatedAt": "2026-07-28T08:31:47Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "Unity 中国发布团结引擎 2.0：底层架构全面重构，支持主机平台，深度整合 AI", "summary": "IT之家 7 月 28 日消息，Unity 中国今日发布团结引擎 2.0，宣称带来团结引擎自诞生以来最具战略意义的一次进化。团结引擎 1.0 时代深耕小游戏、开源鸿蒙、车机 HMI 等本土生态，2.0 则全面贯通全球主流终端并将 AI 深度融入生产流程。IT之家从发布会获悉，本次发布的 2.0 版本，对引擎底层架构进行了全面重构，围绕核心引擎能力、跨平台部署、AI 原生架构三大方向完成升级，推出可独立执行游戏开发任务的 AI &nbsp;Agent 团结 Codely，并打通从研发、测试到营销、发行的完整链路。至此，团结引擎的定位从一款游戏开发工具，升级为面向 AI 时代的游戏生产基础设施。具体来看，团结引擎 2.0 对渲染、光照、动画、特效和并行计算能力进行了系统性升级。Virtual Geometry 虚拟几何体技术让高精度模型可直接投入使用，由引擎自动完成加载与调度，美术团队无需再为不同设备手工制作多套精度版本；实时动态全局光照摆脱了预烘焙限制，昼夜交替、室内外切换等复杂光影变化均可实时呈现；配合升级后的阴影系统、团结动画系统、粒子系统和并行渲染能力，为开放世界等大型高品质项目提供了完整的技术底座。跨平台方面，团结引擎 2.0 正式新增对 PlayStation 5、XBOX Series X|S、Nintendo Switch 2 和 Nintendo Switch 主机平台的开发支持，进一步完善跨平台开发能力，形成覆盖 PC、移动端、主机、微信及抖音小游戏、开源鸿蒙、智能汽车座舱的完整矩阵，同时贯通全球主流终端与中国本土数字生态。开发者可以在统一的工作流中推进多平台项目开发，并根据不同平台的性能和发布要求进行适配、优化，降低多平台开发与主机移植的技术成本。团结引擎 2.0 从底层重构了资产与工程的表达方式，让 AI 能够像开发者一样理解项目、操作场景和脚本，并打通自然语言、可视化节点与代码三种创作方式。通过修改对比、版本追溯、权限控制等机制，AI 的每一次输出都可以像人类工程师的工作一样被审核和管理。基于这套架构，Unity 中国推出 AI Agent 团结 Codely，能够理解需求、编写代码、搭建场景、运行测试、分析报错、修复问题并交付可检查结果的完整工作流。其核心理念 Loop Engineering 将 AI 的价值从“生成代码”推进到“交付经过验证的结果”，大幅减少人工反复调试和跨环节等待。同时，团结引擎 2.0 的 AI 能力已延伸至性能分析、动画生成、试玩广告制作和自助多渠道发行，贯通从立项到商业化的完整周期，让团队把高成本人才的时间投向创意与判断，把验证环节前移，降低项目沉没成本。Unity 中国还宣布多项生态合作：与 Arm 达成战略合作，围绕 Arm 神经技术（Arm Neural Technology）展开深度合作，通过引擎原生集成及生态共建等，共同推动超分、插帧等 AI 图形技术落地，为移动端带来更清晰的画面与更流畅的帧率，预计覆盖游戏、车载与工业边缘场景；与清华大学合作打造游戏行业专属的私有化垂类大模型，联合训练适配 Unity 及团结引擎的 Coding 大模型，提升引擎 API 理解与复杂工程任务执行能力，同时支持模型私有化部署，回应大型企业的数据安全关切；计划与上海科技大学等伙伴共同构建打通从 3D 生成到实时应用的工程闭环；与腾讯营销合作，为开发者提供自助开户、自助投放与配套流量支持，连接研发与商业化。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/616.htm", "publishedAt": "2026-07-28T08:20:30+00:00"}, {"title": "华为官宣昇腾 0day 支持 Kimi K3 的训练适配及推理部署", "summary": "IT之家 7 月 28 日消息，2026 年 7 月 27 日，月之暗面正式开源 Kimi K3。该模型总参数量达 2.8 万亿，是全球首个开源的 3 万亿级别模型，面向长程编程、知识工作和推理等前沿智能场景而设计。华为官方今日宣布：此次 Kimi K3 一经开源发布，昇腾即实现 0day 极速适配：在训练侧，基于 MindSpeed MM 在 Atlas 800 A3、Atlas 900 A3 SuperPoD 上完成减层训练基础功能适配，在算子、并行加速、显存优化等方面进行专项优化；在推理侧，通过 vLLM Ascend 与 SGLang 开源推理引擎实现快速部署，同时，昇腾 950 超节点支持 FP8、MXFP8、MXFP4 等全系列数值精度格式，原生支持 Kimi K3 的 mxFP4 量化权重。据IT之家昨日报道，Kimi 官方还公布了支撑 Kimi K3 训练的三项 Infra 技术：MoonEP、FlashKDA 和 AgentEnv，覆盖从高性能通信、高性能算子到分布式 RL 环境的关键链路。其中 FlashKDA 此前已开源，MoonEP 和 AgentEnv 则随本次发布正式开源。开源链接：Hugging Face：https://huggingface.co/moonshotai/Kimi-K3GitHub：https://github.com/MoonshotAI/Kimi-K3", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/615.htm", "publishedAt": "2026-07-28T08:17:30+00:00"}, {"title": "阿里云 Qoder 上线实时语音交互智能体 QoderVoice，支持讨论式交互", "summary": "IT之家 7 月 28 日消息，今日，阿里云 Qoder 上线实时语音交互智能体 QoderVoice，由全双工语音模型 Qwen-Audio-3.0-Realtime 驱动。用户可随时语音唤醒智能体，通过语音下达指令、讨论方案，智能体实时响应并执行任务。IT之家附官方详细介绍如下：语音指令与任务执行同步进行用户在 Qoder Quest 模式主界面点击语音入口，即可在任意界面唤起语音助手悬浮窗。发起语音指令后，Qoder 自动创建任务、调用工具并在后台执行。用户无需停留页面等待结果，对话过程中可随时打断、追问或调整需求。支持讨论式交互，复杂任务可多轮协商面对复杂任务，Qoder 会先给出执行方案，用户通过语音补充需求或调整方向，Qoder 根据反馈优化并执行。例如用户说“帮我重构这个模块”，Qoder 给出多个方案后，用户进一步提出“方案 B 更好，但要加上缓存”，Qoder 会立即调整并继续执行。已登陆 Qoder 国际版，提供 3 天免费试用Qoder Voice 已登陆 Qoder 国际版，首批开放给个人订阅、个人体验版和企业订阅用户，提供 3 天限时免费试用。Qoder CN 版将于近期上线。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/614.htm", "publishedAt": "2026-07-28T08:14:49+00:00"}, {"title": "2026 世界物联网 500 强公布，华为、SpaceX、中国航天科技集团排名金榜前三", "summary": "IT之家 7 月 28 日消息，2026 世界物联网 500 强峰会于本月中旬在北京召开，发布了 2026 世界物联网 500 强榜单。来自加拿大、美国、阿联酋、印度、阿塞拜疆、摩洛哥、巴基斯坦、印度尼西亚、马尔代夫、纳米比亚、秘鲁、老挝等 40 多个国家政府机构、国家大使、参赞、外交官员，国际机构组织、物联网数字经济企业代表出席了峰会，见证了本年度 500 强排行榜发布和 500 强企业授牌。IT之家从榜单获悉，2026 世界物联网 500 强排行榜 · 金榜百强名单中，华为、SpaceX、中国航天科技集团排名前三。Rank / 排名Country / 国家Company Name / 公司名称1China / 中国Huawei 华为2USA / 美国SpaceX 太空探索技术3China / 中国CASC 中国航天科技集团4China / 中国CASIC 中国航天科工集团5USA / 美国Nvidia 英伟达6Russia / 俄罗斯Roscosmos 俄罗斯航天集团7China / 中国China Mobile 中国移动集团8China / 中国China Telecom 中国电信集团9USA / 美国Microsoft 微软10Germany / 德国Siemens 升电商社区的信息价值和生态丰富度。适配不同开发需求：支持独立接入和 Agent Plan 配置豆包搜索支持独立产品接入与 Agent Plan 内置配置两种路径，适配不同开发场景需求。企业和开发者可直接登录火山引擎豆包搜索控制台开通服务，支持 API、Skill、MCP 等多种接入形态；也可基于火山引擎 Agent Plan 在 harness 工具里一键配置启用豆包搜索，无需额外联调，快速为 Agent 补齐联网检索能力。豆包搜索面向企业和开发者提供每月 500 次免费搜索额度，超出额度后支持按量后付费，按需调用、灵活可控；也可选择月卡低折扣套餐，适配稳定的规模化使用需求。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/610.htm", "publishedAt": "2026-07-28T08:07:32+00:00"}, {"title": "夜莺监控发布 V9 正式版，引入 AI", "summary": "核心要点 夜莺 v9.0.0 正式版已发布，从 v8.5.1 到 v9.0.0 历时半年、前后端合计上千个提交，是夜莺历史上体量最大的一次大版本迭代。 v9 的头号主线是 Nightingale AI：内置 AI 助手、20+ 个开箱即用的 Skill、大模型（LLM）集中配置管理，并可按页面智能推荐提示词。 夜莺内置了 MCP Server 与 A2A 协议端点，默认只读...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/481363/nightingale-v9-released", "publishedAt": "2026-07-28T08:03:04+00:00"}, {"title": "LM Studio Bionic 智能体工具新增月之暗面 Kimi K3 模型支持，定价方案公布", "summary": "IT之家 7 月 28 日消息，智能体工具 LM Studio Bionic 今天新增月之暗面 Kimi K3 模型支持。据官方介绍，Bionic 提供的 Kimi K3 拥有 2.8 万亿参数，支持 100 万上下文窗口。该模型将托管于美国服务器，并默认启用 ZDR（零数据保留），官方将不会保存用户的提示词、文件以及模型输出内容。通过 Bionic 使用 Kimi K3 的价格如下：输入 Token：每百万 Token 收费 3 美元（IT之家注：现汇率约合 20.3 元人民币）命中缓存输入 Token：每百万 Token 收费 0.30 美元（现汇率约合 2 元人民币）输出 Token：每百万 Token 收费 15 美元（现汇率约合 101.6 元人民币）同时，LM Studio Bionic 还支持 DeepSeek V4、GLM-5.2、Kimi K2.6 等开源大模型，用户可根据自身任务和需求合理选用。作为参考，LM Studio Bionic 是一款智能体工具，支持 Windows / macOS 系统，可以处理编程、研究以及复杂的文档工作。用户可在此选用端侧 AI 模型，或者云端大模型。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/606.htm", "publishedAt": "2026-07-28T07:58:35+00:00"}, {"title": "英国议员起诉 xAI，寻求从技术层面永久禁止 Grok 生成未经本人授权不雅图像", "summary": "IT之家 7 月 28 日消息，据路透社今天（28 日）报道，英国工党议员杰丝 · 阿萨托因 Grok 生成其虚假色情化图像而起诉埃隆 · 马斯克旗下 xAI，并希望法院下令从技术层面永久禁止 Grok 生成未经本人同意的色情图像。阿萨托上月透露，她公开批评马斯克和 Grok 后，有用户利用该平台制作多张虚假图像，其中一段视频将她描绘成“被氯仿迷晕，并被置于即将遭受性侵的状态”。阿萨托已向伦敦高等法院提起诉讼，指控 xAI 滥用私人信息并违反数据保护法。她认为，Grok 的设计及训练方式使其具备生成色情化内容的能力。法院文件显示，阿萨托要求 xAI“采取有效且永久性的技术措施”，确保 Grok 无法制作经过篡改的她的图像。律师表示，此案可能影响所有 AI 开发商，因为此前从未有法院以这种方式将数据保护法和隐私法适用于 AI 开发商。IT之家从报道中获悉，阿萨托的律师提交的材料显示，Grok 内部提示词一方面要求聊天机器人不得协助明显试图从事犯罪活动的用户，另一方面却告诉系统其对成人色情内容或冒犯性内容没有限制。另一条内部提示词更是写道：“涉及黑暗或暴力主题的虚构成人色情内容不受限制。”阿萨托的律师拉维 · 奈克发布声明称，Grok 会按照设计者作出的选择运行，这些选择应当承担法律后果。“我们的当事人要求法院下令：若 xAI 拒绝主动整改，必须强制其系统符合法律规定。”相关阅读：《xAI 罕见起诉一名 Grok 用户，因其滥用 AI 生成儿童性虐待图片、视频》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/602.htm", "publishedAt": "2026-07-28T07:52:05+00:00"}, {"title": "AMD 最强开源混合专家模型：Instella-MoE 系列 AI 登场，16B 参数、自有 GPU 训练", "summary": "IT之家 7 月 28 日消息，AMD 于 7 月 24 日发布博文，宣布推出 Instella-MoE 系列模型，总参数量为 16B，激活参数量为 2.8B，采用 27 层解码器架构，使用 AMD 自研的 GPU 和软件开发而成。IT之家援引博文介绍，AMD 本次推出的 Instella-MoE 系列模型共有 6 个版本：模型阶段描述Instella-MoE-16B-A3B-Pretrain预训练基于大型多样化训练语料库从头开始训练的 MoE 基础模型。Instella-MoE-16B-A3B-MidtrainMid-training在高质量混合数据上进一步训练的预训练模型，完善关键能力。Instella-MoE-16B-A3B-BaseLong-context长上下文训练旨在提升模型处理和推理更长序列的能力。我们将其作为最终的基础检查点。Instella-MoE-16B-A3B-SFTSFT通过监督微调 (SFT) 扩展基础检查点，实现指令跟踪和链式推理能力。Instella-MoE-16B-A3B-DPODPO基于对比偏好数据的直接偏好优化（DPO）以提高模型性能。Instella-MoE-16B-A3B-ThinkRL通过强化学习（RL）对最终思维检查点进行改进，以进一步加强对指令的遵循和整体反应质量。性能方面，下图为 Instella-MoE-16B-A3B-Base 模型和其它模型的对比，横轴代表活跃参数量，而纵轴代表各种跑分测试，可以看到该模型跑分要低 &nbsp;Qwen3.5-4B-Base，不过高于其它模型。以下是 Instella-MoE-16B-A3B-Think 与同类产品的性能对比。与 Gemma-4-E4B-it 相比，它在启用参数更少的情况下获得了更高的分数。Instella-MoE 是 AMD 开发的最先进开源混合专家语言模型，在 AMD Instinct™ MI300X 和 MI325X GPU 上从头开始训练。该模型训练完全基于 AMD ROCm™ 软件栈，以 Primus 训练和 Miles RL 框架为基础，融合了包括门控多头潜在注意力（Gated MLA）在内尖端的架构和系统创新，让 AMD 硬件上高效地进行大规模训练和推理。在预训练阶段，FarSkip-Collective 通过专家并行带来的通信重叠，将模型预训练速度提升了 12.7%。Instella-MoE-16B-A3B 训练流程。Instella-MoE-16B-A3B RL 训练流程。在推理阶段，我们使用 SGLang 推理框架实现了 Instella-MoE。通过将通信与计算重叠，当模型采用专家并行服务时，该实现可将首次 Token 响应时间 (TTFT) 最多缩短 39.2%。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/601.htm", "publishedAt": "2026-07-28T07:51:58+00:00"}, {"title": "荣耀 Robot Phone 全渠道预约量超 20 万台，超品牌历代旗舰产品", "summary": "IT之家 7 月 28 日消息，荣耀官方今天宣布 Robot Phone 手机全渠道预约量超 20 万台，超越品牌历代旗舰产品。IT之家从荣耀发布会了解到，Robot Phone 是荣耀与顶级电影摄影机厂商 ARRI（阿莱）合作的首款落地产品，融合了荣耀的移动影像以及 ARRI 百年底蕴的电影摄影技术。硬件方面，荣耀 Robot Phone 后置三摄方案包含一颗 2 亿像素 F1.6 光圈、等效 23 毫米的 4D 云台主摄，一颗 5000 万像素超广角镜头，以及一颗 2 亿像素潜望式长焦镜头。该机还将首发自研影像芯片“荣耀驭光 H1”，云台主摄 CMOS 尺寸达 1/1.28 英寸。软件方面，该机首次将 ARRI Log-C 编码和 LUT 调色文件引入移动端。据官方介绍，专业影视的 C-Log、LUTs 全部可用，摄影师和导演常用的锁焦、锁白平衡、锁 AE 和运镜数据均可下放至手机。此外，相机支持 AI 物体追踪、AI 视频剪辑与智能拍摄，可实时感知与补偿以确保画面稳定。参数方面，荣耀 Robot Phone 搭载第五代骁龙 8 至尊版芯片，配备一块 6.3 至 6.4 英寸的 1.5K 分辨率四等边直屏。该机内置端侧大模型 YOYO，具备情感感知能力，能够主动识别用户的情绪状态、使用习惯及当前所处环境。荣耀 Robot Phone 手机将于 8 月 12 日正式发布，感兴趣的小伙伴们可以关注IT之家后续报道。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/581.htm", "publishedAt": "2026-07-28T07:22:41+00:00"}, {"title": "华为鸿蒙 HarmonyOS 7 花粉 Beta 版报名开启，适配机型及基线版本号公布", "summary": "IT之家 7 月 28 日消息，华为鸿蒙 HarmonyOS 7 花粉 Beta 版今日也开启了报名，用户可以前往“升级尝鲜”入口提交信息参与审核。IT之家注意到，华为官网还发布了 HarmonyOS 7 花粉 Beta 版适配机型及基线版本号：据华为官方介绍，HarmonyOS 7 实现了底层到体验的全面进化：全面构建 Agent 亲和的系统架构，鸿蒙智能体框架 2.0 升级，小艺与系统全方位融合，更懂你，更能干；鸿蒙空间计算打破虚实边界，带来沉浸的 3D 视觉和交互体验。同时，超丝滑方舟引擎，首次搭载鸿蒙性能大模型，助力天生快，一生快；星盾安全架构，打造坚实的 AI 安全底座，带来六大反诈能力和生态联合防诈平台；鸿蒙星河互联更快更智能，全面向三方生态和硬件开放；还有更多 AI 辅助研发等创新工具，共同构建全场景智能操作系统新体验。相关阅读：《华为鸿蒙 HarmonyOS 7 花粉 Beta 版开启报名：适配 Mate 80、Pura 90、畅享 90 系列等机型》《鸿蒙 HarmonyOS 7 正式发布：从“万物互联”正式迈进“Agent 时代”，华为 Mate90 系列今秋首发搭载》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/578.htm", "publishedAt": "2026-07-28T07:20:19+00:00"}, {"title": "高通第六代骁龙 8 至尊版 Pro 芯片曝光：台积电 N2P 工艺，Die 面积约 134 mm²", "summary": "IT之家 7 月 28 日消息，科技媒体 NotebookCheck 于 7 月 26 日发布博文，分享了关于高通第六代骁龙 8 至尊版 Pro（Snapdragon 8 Elite Gen 6 Pro）的相关信息。该芯片内部代号为 SM8975，基于官方公布的封装尺寸 21.2 × 14 mm 计算（留出约 1% 的误差），得出 SM8975 的 Die 尺寸约为 12.6 × 10.67 mm，即约 134 mm²。报道称虽然第六代骁龙 8 至尊版 Pro 芯片采用更先进的工艺，但 Die 面积依然大于高通第五代骁龙 8 至尊版的 Die 面积（126.2 mm²）。成本预算方面，假设采用 300 毫米晶圆、缺陷密度为 0.1 个缺陷 / 平方厘米，以及台积电 N2P 节点的晶圆成本约为 33000 美元，将该芯片尺寸代入晶圆良率模型，得出每个合格芯片的原始芯片成本约为 84.62 美元（不包括封装、测试、分级或 IP 许可成本）。工艺方面，消息称 SM8975 采用台积电 N2P 工艺，这是一种增强型的 2 纳米工艺，也是高通首款 2nm 工艺旗舰芯片（第五代骁龙 8 至尊版采用 N3P 工艺）。CPU 架构方面，SM8975 采用 2+3+3 的 Oryon 核心布局，包括 2 个超大核心、3 个性能核心和 3 个能效核心。时钟频率方面，此前有消息称主频约为 4.8GHz，但该媒体认为该数字尚未认证，目前应视为推测数值。GPU 方面，消息称 SM8975 搭配 Adreno 850 GPU，相比上一代 SM8850 的 Adreno 840 有所提升。显存容量 (GMEM) 保持不变，仍为 18 MB，与上一代持平。GPU 驱动程序堆栈新增了更精细的 DCVS（动态时钟和电压调节）实现，提供了更多频率步进、更完善的卡顿检测和反馈机制，并提高了在多个 GPU 并行运行时的响应速度。相比之下，标准版 SM8950 预计将搭配缩减版的 Adreno 845 和 12 MB GMEM。AI 性能方面，消息称该芯片将具备一项名为 AI Frame Fusion 的新功能，支持人工智能驱动的超分辨率与帧生成。IT之家了解到，AI Frame Fusion 的硬件基础是 GPU 着色器内的 2 个专为加速 GEMM 和卷积运算而设计的矩阵 ALU 模块。这一硬件结构似乎为 SM8975 独占，未出现在 SM8950（骁龙 8 Elite Gen 6）中。AI Frame Fusion 可在超分辨率模式下结合运动矢量、深度缓冲区、低分辨率颜色缓冲区以及前一帧数据，将输出画面分辨率提升至 1080p 或 1440p；而帧生成模式则利用运动矢量和光流重投影技术，在两个实际帧之间插入一个生成帧。缓存方面，消息称 SM8975 配备了 16MB 共享二级缓存和 8MB 系统级缓存，相比上一代产品有了显著提升。内存方面，Pro 版本同时支持 LPDDR5X 和即将推出的 LPDDR6 标准，而标准版 SM8950 仅支持 LPDDR5X。基带方面，消息称 Pro 版本搭载了高通全新的 X105 调制解调器。连接方面，调制解调器射频部分包括 SDR765 和 SDR885。SDR765 采用台积电 N6RF 工艺，仅支持 Sub-6 GHz，具备上行 2×2 MIMO、下行 4×4 MIMO、1024-QAM 及 n253、n255、n256 卫星频段。SDR885 支持上下行同时 4×4 MIMO，具备上行 256-QAM、下行 1024-QAM，并兼容 Sub-6 GHz 和毫米波、3GPP Release 18；其包含 20 个发射端口，按 7+7+3+3 排列，另有 16 个主接收路径和 16 个分集接收路径。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/554.htm", "publishedAt": "2026-07-28T07:02:18+00:00"}, {"title": "消息称英伟达已租赁 Hut 8 得州数据中心，合约价值最高达 500 亿美元", "summary": "IT之家 7 月 28 日消息，据英国《金融时报》当地时间周二援引五位知情人士报道，英伟达已签署租赁协议，将租用 Hut 8 位于美国得州的数据中心，合同总价值最高可达 500 亿美元（IT之家注：现汇率约合 3387.28 亿元人民币）。Hut 8 上周宣布，其位于得州的 1 吉瓦（GW）Beacon Point 数据中心园区已签下一份基础租期为 15 年的合同，基础合同金额为 196 亿美元；若租户行使续租选项，合同总价值最高可增至 502 亿美元。不过，当时 Hut 8 并未披露租户身份，仅表示对方是一家“现有的投资级客户”，将在该园区部署计算设备，以支持大规模人工智能训练和运营。报道称，知情人士透露，这一数据中心的租户正是英伟达。英伟达未来还可能将该数据中心转租给其“Neocloud（新型云服务）”合作伙伴。这类合作伙伴通常采购英伟达 GPU，并向客户提供 AI 云计算服务。英伟达发言人则表示，公司正与生态合作伙伴携手，通过 DSX AI Factory 架构，加速高效 AI 基础设施的部署，但未确认或否认《金融时报》的报道。据了解，DSX 是英伟达推出的全栈 AI 工厂架构，旨在帮助客户设计、建设和运营大规模 AI 数据中心，将英伟达自身的技术与合作伙伴提供的各类设备整合在一起。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/542.htm", "publishedAt": "2026-07-28T06:55:00+00:00"}, {"title": "Kimi K3 一开源，Anthropic 终于不装了", "summary": "科技的浪潮或许还是要从开源中涌现#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1673258?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-07-28T06:50:29+00:00"}, {"title": "摩根士丹利：谷歌 Frozen v2 芯片无需台积电 CoWoS 封装，采用片上 SRAM", "summary": "IT之家 7 月 28 日消息，摩根士丹利（Morgan Stanley）最新研报指出，谷歌自研 Frozen v2 芯片可能不会采用台积电的 CoWoS 高级封装技术，计划把 SRAM 直接集成到芯片硅片上。在封装技术方面，目前行业观点认为台积电的 CoWoS 封装更适合高性能 AI 芯片，而英特尔的 EMIB-T 被普遍认为更适合中高端 AI 芯片，不过最新研报称谷歌可能放弃封装，把 SRAM（静态随机存取存储器）直接集成到芯片硅片中。这种方案的优势是具备极高带宽和超低延迟，但同时也面临裸片面积增大、功耗与散热升高的巨大挑战。技术实现方面，这种方式并非谷歌首创，人工智能芯片制造商 Taalas 今年早些时候也曾推出过类似的方案。IT之家附上相关截图如下：Taalas 还将神经网络权重直接硬编码到硅芯片上，从而消除了内存到计算机的数据传输瓶颈。然而，这种方法也存在一个关键缺陷：每次推出相比前代产品有显著升级的新 AI 模型后，都必须设计新的芯片。摩根士丹利补充预估，谷歌 Frozen V2 最快明年进入早期生产阶段，并于 2028 年实现量产。在合作伙伴方面，美满（Marvell）被认为是最有可能的合作方。相关阅读：《消息称谷歌正研发全新 Frozen v2 芯片，可大幅提升 Gemini 模型运行效率》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/529.htm", "publishedAt": "2026-07-28T06:41:06+00:00"}, {"title": "德里高等法院裁定 OpenAI 利用印媒 ANI 内容训练 AI 未侵犯版权", "summary": "IT之家 7 月 28 日消息，OpenAI 于当地时间上周五（24 日）在印度赢得了一项关键法律诉讼：德里高等法院认定其利用亚洲国际新闻（印度）社（IT之家注：以下简称 ANI）的内容来训练人工智能不构成侵犯版权。图源：Pexels法官 Amit Bansal 认为，OpenAI 的行为符合印度《版权法》中定义的研究类“合理使用”例外情形；同时 ANI 未能向法院证明 ChatGPT 生成的回复中存在对 ANI 受版权保护内容的直接复制。另一方面，在权衡利弊后，法官认为现阶段颁布的任何临时禁令都将不利于人工智能的发展，尤其不利于印度正在开发的 LLM。如果临时禁令落地，其将对公共利益产生不利影响，包括印度大量免费使用 ChatGPT 用户。相关阅读：《德国音乐版权代理机构 GEMA、印度 ANI 通讯社起诉 OpenAI 侵犯版权》(2024/11/19)", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/520.htm", "publishedAt": "2026-07-28T06:21:07+00:00"}, {"title": "我国启动人工智能大模型 IPv6 能力提升专项行动", "summary": "“人工智能大模型IPv6能力提升专项行动”由中央网信办联合北京、上海、浙江、深圳四地网信办，会同5家头部大模型企业在雄安新区共同启动，推动生成式大模型应用，全面支持IPv6，为智能时代筑牢网络根基。 当前，基于人工智能大模型的各类应用蓬勃发展，Token流量呈现爆发式增长趋势，对网络承载能力提出了新要求。IPv6凭...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/481266", "publishedAt": "2026-07-28T06:10:59+00:00"}, {"title": "争夺印度开发者市场：Cursor 推出月付 649 卢比 Start 套餐", "summary": "IT之家 7 月 28 日消息，人工智能编程助手开发商 Cursor 今日宣布面向印度开发者推出 Cursor Start 个人方案。这一方案含税价格为每月 649 印度卢比（现汇率约合 45.5 元人民币），基本上是 20 美元（现汇率约合 135.5 元人民币）标准方案价格的 1/3。Cursor 表示印度已是其全球第三大市场，过去一年内 Cursor 印度客户增长到了原来的三倍，印度的高级用户数量也高于世界上任何其他市场。Cursor Start 套餐为印度付费用户带来了充足的 Cursor 模型访问权限、比免费方案更多的智能体请求次数始终运行的云端智能体、iOS 版 Cursor 应用程序和 Cursor 与工作流的集成。相关阅读：《为拿下市场和训练数据，OpenAI、谷歌在印度争相推出免费服务》《OpenAI 推出“ChatGPT Go”低价套餐：仅限特定地区，每月 399 印度卢比》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/516.htm", "publishedAt": "2026-07-28T06:04:16+00:00"}, {"title": "全球首个Agentic扩散模型来了：边行动边纠错，128K上下文追平自回归", "summary": "扩散模型首次打通长程Agent任务", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/461650.html", "publishedAt": "2026-07-28T04:18:15+00:00"}, {"title": "Cloudflare 重构 AI 爬虫管控，从一键拦截到三段式分类", "summary": "Cloudflare 宣布彻底重构 AI 爬虫管控体系。过去那个一键\"拦截所有 AI 机器人\"的开关被拆成了三个独立选项：Search（搜索）、Agent（智能体）、Training（训练）——包括免费版在内的全部客户都可以分别配置。 这是一个比表面看起来更重要的分类。 Search 爬虫的目的是索引内容、在查询时给出答案。Cloudflare 的态度是：...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/481154", "publishedAt": "2026-07-28T03:23:33+00:00"}, {"title": "火山引擎开源 Agent 驱动的搜索自迭代技术", "summary": "会调用搜索，只是 Agent 搜索能力的第一步。更难的是：当结果不好时，它能不能找到改进方向，并通过一轮轮实验把搜索变好？", "sourceName": "开源中国", "sourceUrl": "https://my.oschina.net/u/6210722/blog/19728179", "publishedAt": "2026-07-28T02:54:00+00:00"}, {"title": "TaiXu-Admin V0.1.2 发布，LLM+RAG+Agent 应用技术系统", "summary": "TaiXu-Admin V0.1.2 发布，LLM+RAG+Agent 应用技术系统 更新日志 1、实现文档的 LLM Wiki 解析，并用 LLM Wiki 搜索； 2、修改文件实现热编译替换（HCP）机制； 3、增加知识库与知识图谱库的自定义重构； 4、历史记忆管理更新； 5、RAG、Agent 等异常处理； 系统介绍 TaiXu-Admin 是 AI 技术集成的智能技术系统，后端用 ...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/481112/taixu-admin-0-1-2-released", "publishedAt": "2026-07-28T02:46:11+00:00"}, {"title": "Dario Amodei 发表长文谈开源：Anthropic 从未主张禁止开放权重模型", "summary": "Dario Amodei 昨晚发表了一篇长文，标题叫《我们对开放权重模型的立场》。 这不是 Anthropic 第一次谈开源话题。上一轮争论才过去不到一周——Kimi-K3 开源后，Anthropic 是唯一没签那封\"开放权重\"公开信的巨头，技术人员 Julian Schrittwieser 发推嘲讽黄仁勋和纳德拉\"现在居然信开源了\"，六百万阅读。但 CEO 亲自下场写...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/481110/anthropic-position-open-weights-models", "publishedAt": "2026-07-28T02:45:56+00:00"}, {"title": "Kimi K3 开放模型权重、技术报告和关键 Infra 技术", "summary": "月之暗面昨日晚间宣布在 Kimi K3 开放日发布 Kimi K3 的模型权重、技术报告，并 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
