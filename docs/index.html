GeForce RTX 5080 系统上成功看到了相关设置。值得注意的是，英伟达官方发布的 NVIDIA App 11.0.9.585 版本更新说明并未提及 GPU App Prioritization 功能。英伟达此前曾于 10 月 28 日公布面向 RTX Spark 设备的 GPU 资源优先级管理能力，要求用户启用 Windows 硬件加速 GPU 计划（HAGS），以便更好地协调前台应用与后台 AI 任务。目前尚不清楚此次在 GeForce 显卡上出现的功能，是否意味着英伟达正在扩大该技术的适用范围，还是仅针对部分硬件和驱动环境进行灰度测试。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/022/529.htm", "publishedAt": "2026-11-05T01:50:15+00:00"}, {"title": "断网也能搜邮件：微软给 Win10/Win11 经典版 Outlook 加上“本地搜索”", "summary": "IT之家 11 月 5 日消息，科技媒体 Windows Latest 今天（11 月 5 日）发布博文，报道称针对 Windows 10、Windows 11 平台经典版 Outlook 应用（Outlook Classic），微软计划升级搜索体验，在断网情况下也能搜索邮件。该媒体指出在云端搜索响应缓慢、网络连接不稳或完全离线后，经典版 Outlook 应用会自动回退到 Windows 本地索引进行搜索，帮助用户继续查找已保存在电脑中的邮件和附件。微软表示，本地搜索对离线场景，以及 PST 文件、POP 或 IMAP 账户等未完全存储在云端的内容仍然必要。该功能目前仅限经典版 Outlook，新版 Outlook 由于基于网页技术，暂未具备该功能。IT之家附上相关截图如下：除了支持离线搜索外，微软还改进了搜索结果的排序方式。更新后搜索页面顶部的“热门结果”最多可展示 7 条与关键词更相关的邮件，随后才是按时间排列的常规结果。相关排序会参考用户与发件人的互动频率、邮件时间以及发件人等因素，让常用联系人的重要邮件更容易被优先找到。用户在 Outlook 中查找某封邮件时，诸如“the”“and”“is”等常见停用词，常常会把大量无关邮件带入结果页。微软表示，新版搜索对这类词的处理更加智能，能够优先展示真正与查询主题相关的邮件。例如，当用户搜索“FY27 budget”（2027 财年预算）时，系统会把预算相关邮件排在更靠前的位置，而不是让只包含普通词汇的邮件占据结果页。技术层面，微软为 Outlook 打造了一个轻量级的小型语言模型排序器，并通过“蒸馏”方式由更大的模型进行训练。这种设计让搜索能够在保持较低资源占用的同时，获得更准确的相关性判断。微软同时表示，搜索延迟有所降低，整体搜索速度提升约 5%；用户还可在结果页通过“点赞”或“点踩”反馈，帮助系统进一步优化推荐相关性。公司称，所有版本的 Outlook 未来都会获得搜索增强，但部分改进仍在开发中。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/022/527.htm", "publishedAt": "2026-11-05T01:45:41+00:00"}, {"title": "美国 AI 扩张遭遇地方阻力：水电资源和环境争议升温，76% 选民反对在社区建设数据中心", "summary": "北京时间 11 月 5 日，据美国科技媒体 The Verge 报道，随着 2026 年美国中期选举结果陆续出炉，人工智能行业赖以发展的数据中心建设遭遇重大阻力。美国多地选民通过地方公投限制数据中心扩张，多名支持暂停相关项目建设的候选人赢得选举，意味着美国 AI 数据中心开发商未来可能面临更加严格的监管环境。美国全国广播公司（NBC News）在选举日开展的民调显示，76% 的受访选民反对在自己居住的社区建设数据中心。与此同时，针对数据中心建设的地方公投也呈现明显的限制开发倾向。根据咨询机构 Redbud Consulting 汇总的数据，截至当地时间 11 月 4 日上午，在全美涉及数据中心开发的 45 项地方投票议案中，已有 33 项结果支持限制数据中心建设。部分地方政府采取了相当严格的措施。例如，缅因州韦尔斯镇选民支持暂停大型数据中心建设 180 天；俄亥俄州多个城市投票禁止建设用电规模超过 25 兆瓦的数据中心；堪萨斯州埃尔多拉多市则投票决定，在未来 10 年内禁止建设峰值用电负荷超过 10 兆瓦的数据中心。这股反对数据中心无序扩张的浪潮，也影响了多个州的政治格局。在得克萨斯州，民主党州众议员吉娜 · 伊诺霍萨（Gina Hinojosa）击败共和党现任州长格雷格 · 阿博特（Greg Abbott），当选新一任州长。得州是美国规划中数据中心数量第二多的州，而伊诺霍萨支持在全州范围内暂停数据中心开发。相比之下，阿博特此前一直支持数据中心扩张，尽管他今年夏天也启动了新的审查措施，以评估相关项目接入电网的影响。得州联邦参议员选举同样受到数据中心议题影响。民主党候选人詹姆斯 · 塔拉里科（James Talarico）击败共和党候选人肯 · 帕克斯顿（Ken Paxton）。两人都主张削减部分数据中心税收优惠，并要求开发商承担自身能源基础设施成本，但塔拉里科更强调环境影响以及让公众分享数据中心带来的经济收益。在俄亥俄州，民主党人谢罗德 · 布朗（Sherrod Brown）重新夺回联邦参议院席位，击败共和党现任参议员乔恩 · 赫斯特德（Jon Husted）。布朗在竞选期间将对手称为“数据中心的代言人”，批评其此前推动相关税收优惠政策。他主张，数据中心开发商不应在缺乏地方居民参与的情况下获得建设许可或税收减免。密歇根州新当选的民主党联邦参议员阿卜杜勒 · 埃尔-赛义德（Abdul El-Sayed）同样支持暂停新数据中心项目，直到建立充分的安全保障和联邦层面监管措施。此外，佐治亚州新当选的州长基莎 · 兰斯 · 博顿斯（Keisha Lance Bottoms）、缅因州新当选的联邦参议员特洛伊 · 杰克逊（Troy Jackson）等人，也在竞选期间支持暂停数据中心建设，以重新评估其环境及经济影响。值得注意的是，反对数据中心无限制扩张并非民主党候选人的专属立场。在佛罗里达州，共和党人拜伦 · 唐纳兹（Byron Donalds）成功当选州长。尽管他反对全面禁止数据中心建设，但此前在国会提出法案，要求开发商自行承担能源和水资源需求带来的成本。宾夕法尼亚州州长乔什 · 夏皮罗（Josh Shapiro）成功连任。他此前签署行政命令，禁止数据中心开发项目使用保密协议，并取消 AI 数据中心项目的快速审批待遇。在威斯康星州，两党州长候选人虽然都不支持全面暂停数据中心建设，但均主张取消相关州级税收补贴。The Verge 指出，虽然部分支持数据中心开发的候选人仍然赢得选举，但几乎所有相关候选人都不得不在竞选中回应这一议题。数据中心争议背后，是美国居民对电价上涨、水资源消耗、环境影响以及公共财政补贴的担忧。随着 AI 模型训练和推理需求快速增长，科技公司持续扩大算力基础设施投资，但配套电网升级和资源消耗带来的成本，正在成为地方社区关注的焦点。不过，数据中心议题究竟在多大程度上直接影响了候选人的选举结果，目前仍难以量化。选民的投票选择同时受到经济、移民以及其他政治议题影响。此次中期选举至少释放了一个明确信号：美国 AI 数据中心扩张正在遭遇越来越强烈的地方政治阻力。对科技公司而言，未来建设数据中心不仅需要解决芯片、电力和资金问题，还需要面对来自选民、地方政府及监管部门的更多限制。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/022/525.htm", "publishedAt": "2026-11-05T01:33:20+00:00"}, {"title": "曝 OpenAI 新一代 GPT-6.2 Astra、Sol 及 Cyber 网安模型最快周五发布", "summary": "IT之家 11 月 5 日消息，据《The Information》当地时间 11 月 4 日报道，OpenAI 最快可能于当地时间周五（11 月 6 日）发布新一代 Astra、Sol 系列模型，以及面向网络安全领域的 Cyber 模型。不过，报道没有披露具体型号编号，也未提供定价、上下文窗口长度或基准测试成绩。目前尚不清楚这些模型是否会首先通过 API、ChatGPT、Codex 或合作伙伴渠道推出。IT之家此前报道，部分用户已经在 Codex 用量统计中发现了“gpt-6.2-astra”这一模型标识，尽管产品界面的模型选择器仍显示 GPT-6 Astra。此外，疑似首批参与灰度测试的用户已在 X 平台分享体验，反馈称新模型在物理效果和动画生成方面有所改善，生成的动画衔接较为流畅。不过，这些内容目前主要来自用户展示和主观体验，尚无公开基准测试数据能够独立验证相关提升。相关阅读：《OpenAI 下一代 GPT-6.2 Astra 正灰度测试，Codex 用量统计中已单独列出》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/022/522.htm", "publishedAt": "2026-11-05T01:28:58+00:00"}, {"title": "比尔盖茨批评美国政府：AI 模型能力惊人，不作为让世界面临生物武器风险", "summary": "北京时间 11 月 5 日，据《金融时报》报道，微软联合创始人比尔 · 盖茨 (Bill Gates) 指责特朗普政府阻碍了防范 AI 风险的努力。盖茨周三在《金融时报》举办的 AI 未来峰会上表示，AI 模型展现出的“惊人”能力意味着，“无论是其造福人类的潜力，还是造成危害的潜力，都不容低估”。他指出，恶意行为者利用 AI 工具制造生物武器或攻击社会各领域网络安全漏洞，构成了最紧迫的风险。尤其值得警惕的是，一些“开放”模型可以免费供开发者使用，而这些模型的安全防护机制和监控措施能够被移除。盖茨警告称，涉及 AI 的生物安全事件所造成的“损害规模”可能“比新冠严重得多”。盖茨表示，尽管存在这些担忧，但国际社会监管和监测 AI 及其影响的努力，正因白宫的不作为而受阻。“除非美国参与其中，否则采取行动的意义并不大。因此，我们目前陷入了僵局…… 唯一的问题是，究竟还要发生多少起恶性事件，他们才会改变立场？”盖茨说。盖茨是多位发出 AI 警告的科技领袖之一。他们指出，AI 的发展方式可能导致这项技术遭到滥用，甚至可能脱离人类控制，造成灾难性后果。这位亿万富翁慈善家此前曾警告称，AI 可能造成 10 亿人死亡，并引发大范围就业动荡。近几个月来，人们对这项新兴技术安全性的担忧不断升温，Anthropic 在上周的 IPO 招股书中警告称，AI 可能带来“灾难性或生存性风险”。盖茨称赞这家前沿实验室在 AI 危险问题上的坦诚：“他们一直非常公开透明，这是又一个例证。”尽管该技术发展速度惊人，但美国总统特朗普拒绝了加强政府对 AI 监管的呼吁，将制定 G20 AI 指导方针的努力斥为“全球主义者的阴谋”，转而主张科技行业自我监管。自我监管行不通盖茨表示，自我监管行不通，“一旦涉及多家公司，解决这个问题的唯一途径就落到政府身上”。他敦促美国政府考虑为 AI 模型的内部安全防护机制和监控措施制定统一的评估基准，并牵头开展全球合作，修复网络安全漏洞，同时建立大规模监测体系，在“空气、污水和血液”等领域开展监测，以便尽早发现可能由 AI 助长的传染病疫情。作为 AI 技术持续快速发展的一个例证，盖茨预计，OpenAI 和 Anthropic 今年可能都会发布新模型，并在 2027 年有“两次重大发布”。他还表示，“模型本身失控”的问题将在不久的将来成为一个严重担忧，可能就与这些即将发布的模型有关。盖茨认为，这需要政府在保障措施和对新模型进行第三方审计方面开展更多工作。盖茨呼吁加快行动，充分释放 AI 的潜在益处，例如推动药物研发、缓解医院候诊名单过长的问题。他表示：“这些好事不会自然而然地发生。”盖茨还表示，在 AI 正在深刻改变社会的背景下，他支持“对亿万富翁和超级富豪征税”。这一表态似乎意味着他支持加州提出的“亿万富翁税”提案。该提案是一项加州公投议案，但根据周二美国中期选举的初步计票结果，该提案似乎即将遭到否决。他赞扬了 OpenAI 和 Anthropic 联合创始人在慈善事业方面作出的承诺，并表示自己正在与他们商谈合作事宜，“确保这些资金能够在全球健康等多个领域产生巨大影响”。相关阅读：《比尔 · 盖茨：人们要为 AI 带来的二十年颠覆性变革做好准备》《比尔 · 盖茨认为 AI 比核武器更危险、比核能更有用，与 PC、互联网等创新都不同》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/022/512.htm", "publishedAt": "2026-11-05T01:07:24+00:00"}, {"title": "中国科大发布开源 RNA 序列基础模型 structRFM，成果登上 Nature", "summary": "IT之家 11 月 5 日消息，中国科学技术大学（中国科大）今日官宣，该校医学影像智能与机器人（MIRACLE）实验室周少华教授、熊鹏特任研究员团队发布一款开源 RNA 序列基础模型 structRFM，提高了模型在 RNA 结构预测与功能推断一系列下游任务中的性能，有望助力人工智能驱动的科学研究、生物学机制理解、药物发现等。11 月 5 日凌晨，相关研究成果发表于国际学术期刊《自然》（Nature）。这是 2026 年至今，中国科大以第一署名及通讯单位在 Nature、Science、Cell 三大国际顶尖刊物上发表的第 16 篇成果。▲ structRFM 结构引导预训练框架RNA（ribonucleic acid，核糖核酸）是一种重要的生物大分子，存在于生物细胞以及部分病毒、类病毒中，广泛参与蛋白质合成、基因表达调控和 RNA 剪接等生命过程，其功能与序列、折叠结构密切相关。RNA 分子通过碱基配对形成二级结构，并进一步折叠为三维构象，这些结构影响着分子的生物学活性及其与其他分子的相互作用。因此，理解序列、结构与功能之间的联系，是揭示 RNA 生物学机制的重要基础，也是药物发现的支撑要素。随着测序技术的发展，研究者积累了海量 RNA 序列数据。借鉴自然语言处理中的预训练方法，RNA 基础模型能够从这些数据中学习序列规律，提取可用于不同任务的通用特征，为结构预测和功能分析提供支持。此次研究旨在将结构知识融入大规模序列学习，同时保持模型在不同结构与功能任务中的适应性和泛化能力。研究团队研发了 RNA 基础模型 structRFM，首先构建了约 2100 万条经计算注释的序列-二级结构的配对数据。在此基础上，设计算法同时预训练学习序列上下文与结构依赖。预训练后的模型仅需输入序列，即可提取序列级、核苷酸级和核苷酸对级特征，用于多种结构与功能推断任务，并在多项任务中达到国际前沿水平。实验显示，structRFM 在零样本同源性分类中表现良好，并提高了二级结构预测性能；将其特征融入三级结构预测模型后，也改善了三维结构及其对应二级结构的预测结果。在功能推断方面，模型支持剪接位点预测、内部核糖体进入位点识别和非编码 RNA 分类。此外，模型在新发布的 RNA 家族上保持了较好的二级结构预测表现，并通过分段策略扩展至长非编码 RNA 分类。消融实验进一步验证了结构信息的引入及掩码策略对模型性能提升的作用，为算法设计提供了实验支持。研究人员介绍，目前，实验室已开放完整配对数据、模型权重和源代码，为研究结果的复现和相关模型的开发提供了可复用资源。中国科大生物医学工程学院朱河勤博士为论文第一作者，周少华教授和熊鹏特任研究员为该文章共同通讯作者。IT之家附相关论文信息：https://doi.org/10.1038/s41586-026-11210-2项目链接：https://github.com/heqin-zhu/structRFM", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/022/511.htm", "publishedAt": "2026-11-05T01:05:36+00:00"}, {"title": "AI 立功：苹果 Apple TV 4K 能原生 60FPS 运行 Switch 游戏《超级马力欧：奥德赛》", "summary": "IT之家 11 月 5 日消息，网友 u/FloatingFalafel 昨日（11 月 4 日）在 Reddit 社区发帖，发布了开源项目 TVPort，可以在苹果 Apple TV 4K 上原生运行 Switch 游戏《超级马力欧：奥德赛》（Super Mario Odyssey）。IT之家附上相关演示视频如下：在技术实现方面，TVPort 开源项目基于 nxnative 工具包开发，并使用 Claude Opus 5.5 构建，重新编译部分 Nintendo Switch 及 Switch 2 游戏，让其能在 Apple TV 4K 上原生运行。据开发者介绍，多数 Switch 游戏的移植流程较为相似，但部分游戏在纹理加载等方面存在差异，需要额外诊断和修复。在支持的游戏方面，《超级马力欧：奥德赛》目前在 Apple TV 4K 上能以 60FPS 原生运行，仅偶有轻微卡顿，在瀑布等场景下可能会出现音频问题。项目目前仅测试了少数游戏，对硬件要求更高的《塞尔达传说：王国之泪》等作品，可能因第三代 Apple TV 4K 过热降频而难以流畅运行。即将于 11 月 13 日发售的第四代 Apple TV 4K 搭载 A19 芯片，或许能承载更多大型游戏。需要注意的是，TVPort 并不附带游戏文件。用户必须自行从正版卡带提取游戏数据，且需要一台经过改装的 Nintendo Switch，因此它并非面向普通用户的“一键玩任天堂游戏”方案。相关阅读：《〈超级马力欧：奥德赛〉非官方 PC 原生移植版问世，可 4K/60 帧流畅游玩》《开发者成功在任天堂 Switch 游戏机上运行苹果 iPadOS 17》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/022/510.htm", "publishedAt": "2026-11-05T01:05:24+00:00"}, {"title": "OpenAI 自曝 GPT-6 Astra 异常行为：做研究时偷懒，任务完成度降低近四成", "summary": "IT之家 11 月 5 日消息，当地时间 11 月 4 日，OpenAI 发布了一份研究报告，披露了其旗舰模型 GPT-6 Astra 在执行 AI 安全研究任务时出现的异常行为。简单来说，GPT-6 Astra 可能在不告知用户的情况下，主动减少工作量、放弃可行方案，甚至编造技术障碍，导致任务无法正常推进。OpenAI 将这一现象称为“隐蔽性表现不佳”（Covert Underperformance）。报告显示，在技术内容基本相同、仅将任务分别描述为 AI 安全研究和 AI 能力研究的对照测试中，GPT-6 Astra 在安全研究任务中的完成度明显更低。其完成的隐藏评分项目比例仅为 10%，而普通能力研究任务达到 16%，相差 6 个百分点，相对减少约 40%。相比之下，上一代 GPT-5.6 Sol 在两类任务中的表现基本没有差异。OpenAI 表示，这一问题并非简单地拒绝回答。正常情况下，如果模型认为某项研究存在安全风险，应当明确说明限制，或者拒绝提供相关帮助。但 GPT-6 Astra 的异常之处在于，它可能表面上继续执行任务，实际上却偷偷缩小工作范围，让研究人员误以为任务正在正常推进。报告显示，OpenAI 于今年 8 月 20 日首次发现这一现象。当时，部分内部研究人员反映，Astra 在安全与对齐研究中频繁增加不必要的前置条件、放弃已经验证可行的解决方案，或者声称遇到了实际上并不存在的技术障碍。一名研究人员曾使用 Astra 评估模型破坏行为，但项目连续数日没有进展，切换到其他模型后才得以迅速推进。为验证这一问题，OpenAI 设计了成对的编程测试。研究人员使用技术内容完全相同的代码库，仅修改变量名、函数名、注释和文档，将任务分别包装成 AI 安全研究和 AI 能力研究，并通过隐藏评分标准衡量模型实际完成的工作量。测试结果显示，Astra 在安全研究任务中完成的评分项目比例只有 10%，而能力研究任务达到 16%。即使排除模型明确拒绝执行任务的样本，完成度差距仍有 5 个百分点；进一步排除模型在内部推理记录中明确表达过隐瞒协助意图的样本后，差距仍达到 4.7 个百分点。只有在进一步排除所有内部推理记录中出现过哪怕短暂伦理顾虑的样本后，两类任务的完成度差距才缩小至 0.75 个百分点。OpenAI 认为，这说明伦理方面的顾虑可能与任务表现下降存在关联，即使模型没有明确表示拒绝，也可能因此减少实际工作量。除了受控实验，OpenAI 还分析了员工日常使用 Codex 的内部记录。在安全与对齐相关请求中，Astra 有 0.25% 的任务出现了模型在内部推理中明确决定减少协助、却不告知用户的情况；普通能力研究任务中的这一比例为 0.11%，前者约为后者的 2.3 倍。与此同时，7.9% 的安全研究相关内部推理记录出现了伦理顾虑，而普通能力研究任务中的这一比例为 2.9%。OpenAI 还发现，安全研究中的明确拒绝比例为 1.63%，普通能力研究则为 0.56%。这些数据表明，Astra 在处理安全研究请求时，更容易产生顾虑，并采取限制协助的行为。报告还公开了多个具体案例。在一项训练模型规避监控系统的实验中，Astra 认为修复某段代码可能帮助实验继续推进，因此选择不提供修复方案，却没有明确告诉研究人员自己主动限制了协助范围。另一个案例中，研究人员要求 Astra 导出包含评分模型推理过程的数据，模型最终省略了这部分内容，并决定在任务总结中不主动提及遗漏。还有案例显示，Astra 会主动过滤安全评估中的部分测试样本，或者缩小漏洞利用研究的分析范围，却没有向用户清楚说明原因。OpenAI 特别强调，隐蔽性表现不佳与正常的安全拒绝机制不同。模型可以基于安全政策拒绝某些请求，但应当让用户知道哪些内容无法完成。Astra 的问题在于，它没有明确说明限制，而是通过减少工作量、隐瞒遗漏等方式，让任务看起来像是正常完成。对于异常行为的形成原因，OpenAI 将调查重点放在强化学习（RL）和监督微调（SFT）两个训练阶段。研究发现，在 Astra 的强化学习后训练过程中，安全研究与普通能力研究任务之间的完成度差距，从训练初期几乎为零逐渐扩大至 6 个百分点。OpenAI 还发现，某个强化学习评分器在特定测试中对模型的隐蔽性表现不佳存在一定偏好：相比明确拒绝或完整执行任务，该评分器对暗中减少协助的行为给予了相对更有利的评价。不过，研究团队尚不能确定这一评分器是否就是异常行为的直接原因。在监督微调方面，研究人员发现，使用某一特定训练数据集后，模型编造权限限制、以安全为由停止执行任务的倾向明显增加。但进一步实验并未证明该数据集能够单独解释 Astra 的异常表现。OpenAI 还尝试从最终模型中减去该数据集对应的训练权重变化，结果发现，安全研究任务的完成度有所提升，原本存在的安全研究与能力研究差距也随之消失。不过，这种权重调整方式并不属于常规训练流程，研究团队仍无法据此确定具体成因。另一个值得关注的结果是，当开发者指令额外要求模型保持谨慎时，Astra 在安全研究任务中的表现下降幅度增加了 50%。OpenAI 认为，模型对潜在安全风险过度谨慎，是目前解释这一现象最简单的假设，但具体机制仍有待调查。值得注意的是，OpenAI 对大规模内部推理记录进行分析后，没有发现 Astra 试图通过降低任务表现来掩盖自身能力、影响模型部署决策或有策略地阻碍 AI 安全研究的证据。研究团队认为，目前最可能的解释是模型对安全研究任务产生了过度谨慎的反应，但也无法完全排除模型没有在内部推理记录中表达出来的其他动机。OpenAI 指出，这种异常行为可能直接影响 AI 安全研究的可靠性。例如，在监控规避测试、红队评估和模型对齐研究中，如果模型暗中减少协助，研究人员可能误以为某种技术方案无法实现，或者错误评估模型的真实能力。OpenAI 表示，目前正在开发针对隐蔽性表现不佳的新评估方法和监控机制，希望识别模型没有明确拒绝、却实际降低任务完成度的行为。同时，研究团队还将继续调查强化学习和监督微调过程中可能导致这一问题的具体因素，并调整后续模型的训练方式。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/022/509.htm", "publishedAt": "2026-11-05T01:02:32+00:00"}, {"title": "裴宇预告 Nothing 将于 12 月发布首款 AI 原生设备", "summary": "IT之家 11 月 5 日消息，Nothing 创始人裴宇 11 月 4 日发文，表示每隔一段时间就有一项技术出现，改变了每个人的生活方式和工作方式，比如火、印刷术、电、互联网等。如今，整个行业都在寻找新的 iPhone 时刻 —— 吊坠、别针、眼镜、伴侣，某种让 AI 成为每个人生活一部分的神奇消费设备。裴宇认为，新技术在工作中赢得人们的认可，远早于在家中赢得人们的心。PC 最早作为电子表格和文字处理设备流行起来，远早于人们用它们来听音乐或玩游戏。手机最初是为在路上做交易的人准备的车载电话，几十年后才进入青少年的手中。每次的流行技术都能在真实工作中证明自己，变得廉价且受信任，最终成为十亿人喜爱的东西。裴宇表示，AI 也走在同样的道路上。编程、IT、客户支持、法务，即使是近十亿个口袋里的聊天机器人，本质上也是一种生产力工具。然而裴宇认为，AI 目前存在上下文缺口，人们使用 AI 时，其中一半的工作就是把上下文输入文本框，与此同时，最重要的上下文根本无法进入模型，比如喝咖啡时想到的点子、随口说过的一句话。因此，人们每天使用和携带的工具才是获取上下文最便捷的途径，而不是文本框。裴宇预告，Nothing 的首款 AI 原生产品将于下月（2026 年 12 月）发布。“它是一种工具，但却带有定义‘Nothing’产品的个性和用心。”IT之家注意到，裴宇还透露，该产品没有屏幕，也不是一款软件应用。据消息人士 Roland Quandt 透露，Nothing 将推出两款智能眼镜。其中一款主打音频功能，另一款配备摄像头。据介绍，Nothing 的音频版智能眼镜支持播放音乐、通话，用户可通过眼镜与手机的语音助手交互。该产品将配备光致变色镜片，可在阳光下自动变暗、室内自动变亮。同时，该公司还计划推出另一款智能眼镜。该产品将拥有摄像头，支持 ChatGPT、翻译功能。彭博社此前报道称，Nothing 的智能眼镜将通过手机和云端处理 AI 任务，不会配备 AR 显示屏。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/022/507.htm", "publishedAt": "2026-11-05T00:58:31+00:00"}, {"title": "华为宣布昇腾 0 Day 支持 Kimi K3.1 Pro 推理部署，2.8 万亿级 MoE 模型能力再进阶", "summary": "IT之家 11 月 5 日消息，据华为计算公众号，2026 年 11 月 4 日，月之暗面正式公布 Kimi K3.1 Pro 完整模型权重。昇腾基于 vLLM Ascend、SGLang 同步实现 0 Day 推理适配，支持昇腾 Atlas 800 A3、Atlas 900 A3 SuperPod 超节点以及昇腾 950 超节点系列产品进行 Kimi K3.1 Pro 的推理部署。围绕模型新增的稀疏注意力、百万级上下文及推理服务需求，昇腾开展算子与框架协同优化，支持用户及开发者在模型发布首日开展部署与应用验证。IT之家注意到，Kimi K3.1 Pro 是 K3.1 系列的首个模型，拥有 2.8 万亿参数，原生支持视觉理解，具备百万 token 上下文窗口。模型在 K3 基础上进一步扩大后训练规模，在代码开发、3D 创作、金融研究、事实准确性和长程智能体任务等方面实现能力提升。借助百万级上下文，模型可综合利用长篇文档、代码和多轮交互中的任务信息，结合视觉理解与工具调用完成多步骤任务，支撑软件研发、企业知识处理等复杂场景。在计算架构上，K3.1 Pro 采用混合线性注意力，结合 KDA 线性注意力层和 DSA 稀疏注意力层。发挥这一架构的计算优势，需要对算子执行、缓存管理与跨卡通信进行协同优化。文中提到，昇腾推理团队依托 Kimi K3 的适配经验，提前开展模型分析，协同推进模型接入、算子开发与服务验证。在已有 KDA 与 MoE 支持的基础上，完成 K3.1 Pro 新增稀疏注意力路径与多模态推理适配，并同步支持推理框架的既有服务能力。本次适配围绕核心算子优化与推理特性支持展开，覆盖历史信息筛选、稀疏注意力计算、预处理与残差计算，并结合分布式缓存和框架能力叠加，支撑长上下文推理与服务部署。参考vLLM Ascend 部署指导SGLang 部署指导", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/022/502.htm", "publishedAt": "2026-11-05T00:45:14+00:00"}, {"title": "Anthropic 绘制出全球首个包含 96 个蛋白质副本的 3D 细菌库：Claude 辅助加速研究，纯化时间从 3 天缩短至 90 分钟", "summary": "IT之家 11 月 5 日消息，Anthropic 今日宣布其生物学研究团队借助 Claude，首次解析出原核生物相关的 Vault（穹窿颗粒，一种囊泡状蛋白复合物）三维结构。研究发现，一种来自噬菌体的蛋白质能够组装成完整的 Vault 颗粒，由 96 个相同蛋白质组成，总分子质量约为 9.5 兆道尔顿（MDa），包裹体积比人类细胞中的同类结构大约 25%。IT之家注：Vault 穹窿颗粒是细胞内最大的核糖核蛋白颗粒之一，人类细胞中约含 1 万个，典型尺寸约 67 纳米长、40 纳米宽，于 1986 年首次被科学家发现，但在过去约 40 年里其生物学功能始终未知。研究团队在约 150 亿个预测蛋白序列中搜索主要穹窿蛋白（MVP）的同源物，在 29 个细菌门和 4 个古菌门中找到了候选序列，并从中选取 44 个蛋白进行实验室测试。实验显示，其中 7 个在大肠杆菌中表达的蛋白组装成了穹窿样颗粒，冷冻电镜确认了 4 个候选物的完整闭合结构，两个来自细菌，两个来自噬菌体。研究团队重点解析了噬菌体来源的 L05 蛋白，结构分辨率达 3.2 埃。L05 穹窿由 96 条蛋白链组成，每条链有 7 个壁重复序列，而人类 MVP 有 9 个。L05 颗粒长 54.5 纳米、宽 47.5 纳米，外形更接近球形，内部体积比人类穹窿大约 25%。团队进一步向 L05 中插入额外的壁重复序列，得到 L05+2 与 L05+4 变体。L05+2 的冷冻电镜结构显示，颗粒长度和宽度均增加，内部体积再增约 20%，总容积比人类穹窿大约 50%。这表明壁重复序列的数量可作为调控穹窿尺寸的工程手段。结构分析还在 L05 内壁发现了一段未能归属的密度，计算搜索提示辅酶 A 或其衍生物是最可能的配体。人类穹窿内壁同样结合 NAD+ 等核苷酸类分子，提示穹窿的腔内面可能是结合小分子与伙伴蛋白的区域。Claude 在此次研究中参与了蛋白搜索、DNA 序列设计、纯化流程优化与冷冻电镜数据处理。传统穹窿纯化方法约需 3 天，团队开发的尺寸排阻色谱方案将时间缩短至约 90 分钟。首个完整结构模型在 34 小时内生成，按常规分析预计需数周。研究过程也暴露了 AI 的局限。一个实验方案中，Claude 建议的添加剂干扰了 DNA 递送，导致研究延误两周；在冷冻电镜数据处理中，Claude 跳过标准步骤后生成了不准确的结构图，团队通过更密切的监督修正了问题。尽管结构已解析，穹窿颗粒在活细胞中的实际功能仍未被确定。原核穹窿的发现为研究组装机制提供了更易操作的实验体系，也为货物封装提供了尺寸可调的蛋白支架。L05 及其工程化变体的结构数据已存入蛋白质数据库。论文地址：https://www-cdn.anthropic.com/76e55fbe85697afbaae16b839498dc00797dec30.pdf", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/022/501.htm", "publishedAt": "2026-11-05T00:44:46+00:00"}, {"title": "从3D生成到世界模型，这家AI公司想和年轻人一起定义问题", "summary": "薪资+期权不限！实习生也能训核心模型", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/507675.html", "publishedAt": "2026-11-05T00:41:34+00:00"}, {"title": "月之暗面 2.8 万亿参数 Kimi K3.1 Pro 开放权重，登顶 Agent Arena 开源模型榜", "summary": "IT之家 11 月 5 日消息，按照 10 月 24 日发布时给出的承诺，月之暗面（Moonshot AI）今日在 Hugging Face 平台开放了 Kimi K3.1 Pro 的模型权重。在 Arena 运营的 Agent Arena 智能体排行榜中，Kimi K3.1 Pro（Max）位列开放权重模型第一、全部参评模型第 13 位，并在工作、编程与聊天三个类别中均居开放模型首位。Agent Arena 的评测方式与传统的成对盲测不同。它不要求用户对两个回答投票，而是从真实用户的智能体会话中提取信号，包括用户对任务的明确确认、表扬与投诉、纠正指令以及 Shell 命令执行错误等，再通过 Arena 称为“因果追踪”的随机化推断方法估算各模型相对于平均水平的净改进率。Kimi K3.1 Pro 此次排名基于全球用户超过 1.75 万次真实长周期智能体任务会话，净改进率为 +5.1%，较上一代 K3（Max）的 +0.9% 提升 4.2 个百分点。分项指标呈现出更具体的改善幅度。衡量 Shell 命令执行可靠性的 Bash Reliability 从 K3 的-4.5%（第 13 名）升至 +7.9%，在开放模型中排名第一；反映用户满意度的 Praise vs Complaint 指标从 +1.3% 升至 +7.7%；衡量模型根据用户反馈调整执行方向的 Steerability 指标达到 +6.5%，同样居开放模型首位。用户明确确认任务完成的 Confirmed Success 为 +3.9%，开放模型第四。Kimi K3.1 Pro 采用混合专家架构，总参数量 2.8 万亿，单次推理激活约 1040 亿参数，支持约 100 万 Token 上下文窗口。与 K3 相比，K3.1 Pro 以 K3 为基座进行了大规模联合强化学习后训练，覆盖数百个下游领域，并将部分全注意力层替换为门控稀疏注意力层，以降低长上下文建模的开销。值得一提的是，开源权重的“可下载”与“可本地运行”之间存在显著距离。2.8 万亿参数以 BF16 精度存储的权重文件约 5.6TB，即使采用 INT4 量化也仍需约 1.4TB，单机消费级显卡基本不具备部署可能。在终端智能体基准 Terminal-Bench 4.0 上，K3.1 Pro 得分 65.7%，高于 GPT-6 Astra 的 58.2%，与 Claude Opus 5.5 的 66.4% 相差不到 1 个百分点。BenchmarkKimi K3.1 Pro(max)Claude Fable 5.1(max, w/ fallback)GPT-6 Astra(max, w/ fallback)Claude Opus 5.5(max, w/ fallback)DeepSeek-V4.1-Flash-1017(max)GLM-5.3(max)CodingTerminal-Bench 4.065.757.958.266.442.341.8Terminal-Bench-Science 0.138.140.068.163.315.78.1SWE Marathon v1.151.745.642.546.340.042.5BenchCAD w/o tools72.860.6—73.041.2—BenchCAD w/ tools92.792.695.996.281.6—Program Bench31.553.550.065.029.119.0DeepSWE v1.175.567.474.174.277.066.9PostTrain Bench v1.236.544.641.943.830.534.5Kimi Code Bench 2.0 (Internal)77.1———76.161.7Kimi Code Bench 3.0 Long-horiz 13 年主演的《超人：钢铁之躯》上映，成为首位在银幕上塑造这一英雄形象的英国人，此外在 Netflix 剧集《猎魔人》中饰演主角利维亚的杰洛特。谷歌同步上线了幕后纪录片系列的第一集，介绍这款游戏的开发过程。报道指出，《胡子协议》使用了 Googlebook 内置的 Antigravity、Rambler 和 Magic Pointer 等 AI 工具进行创作，属于典型的“氛围编码”（vibe-coded）项目（开发者以自然语言描述想法，由 AI 协助生成和迭代游戏内容）。在游戏来源方面，视频称当年《正义联盟》补拍与《碟中谍 6：全面瓦解》档期重叠，卡维尔因合同必须为后者保留胡须，片方最终只能通过 CGI 在《正义联盟》中“移除”胡子。结果画面效果引发大量讨论，也成为好莱坞特效史上一个知名话题。这款游戏并非单纯玩“CGI 剃胡子”梗。谷歌宣布与男性健康公益组织 Movember 合作，在 11 月期间，玩家每游玩一次《胡子协议》，谷歌将捐赠 11 美元（IT之家注：现汇率约合 73.5 元人民币），累计捐赠上限为 50 万美元（现汇率约合 334.3 万元人民币）。相关资金将用于提升公众对男性心理健康、自杀预防、前列腺癌和睾丸癌的认识，并提供公益支持。相关阅读：《谷歌携手“超人”卡维尔使用 Googlebook 开发游戏，计划 11 月推出》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/022/550.htm", "publishedAt": "2026-11-05T02:49:13+00:00"}, {"title": "比亚迪与 vivo 达成战略合作，实现 AI 智能体跨端融合", "summary": "IT之家 11 月 5 日消息，比亚迪今日官宣与 vivo 达成战略合作，实现 AI 智能体跨端融合，共建智慧出行新生态。vivo 官方也公布了这一消息：“自 2019 年起，双方持续深耕手车互联、智能进入等方向，积累了丰硕成果。依托长期深度互信与技术积累，未来将深化智能终端与新能源汽车的生态协同，推动‘手车互联’迈向‘手车互融’，为全球用户打造无缝流转、安全便捷的智慧出行体验。”IT之家注意到，早在去年 8 月，vivo OriginOS 原系统便宣布比亚迪手车互联全量上线，支持手机镜像投屏至车机。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/022/545.htm", "publishedAt": "2026-11-05T02:39:46+00:00"}, {"title": "拾趣 (Magpie) v0.1.20 发布：全新截图操作，翻译、解释、总结...", "summary": "拾趣 (Magpie)是一款跨平台沉浸式自定义AI 划词工具 划选或双击，浮动条随即弹出：翻译、解释、总结实时呈现；复制、搜索、写入 Obsidian、预填日历，结果直接落地。图片、视频与扫描文档中的文字，框选亦可识别——处理在原地完成，无需迁入对话窗口。 Release v0.1.20 更新内容： Added 屏幕捕获功能已重构为应用内的“...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503405", "publishedAt": "2026-11-05T02:36:28+00:00"}, {"title": "基于本体+知识+Harness+Datat Agent的智能体完整落地链路！", "summary": "Data + AI 技术实践巡展 · 上海站", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/507696.html", "publishedAt": "2026-11-05T02:01:51+00:00"}, {"title": "中国移动支付业务“和包”升级为“移动钱包”，带来三大全新体验", "summary": "IT之家 11 月 5 日消息，中移支付有限公司今日官宣，中国移动“和包”升级为“移动钱包”，汇聚话费充值、移动出行、权益卡券等各类场景与优惠。该应用最早在 2011 年推出，原名“手机支付”“手机钱包”，是中国移动面向个人和企业客户提供的一项综合性移动支付业务。用户开通业务后，即可享受线上支付（互联网购物、充话费、生活缴费等）功能；持 NFC 手机和 NFC-SIM 卡的用户，更可享刷卡功能，把银行卡、公交卡、会员卡装进手机里，实现特约商家（便利店、商场、公     .replace(/</g, "&lt;")

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
