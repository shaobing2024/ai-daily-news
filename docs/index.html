const DATA = {"date": "2026-11-28", "generatedAt": "2026-11-28T04:28:39Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "“iPod 之父”法德尔：OpenAI 曾邀乔纳森 · 艾维打造实体 AI 设备，因为苹果永远不会提供数据", "summary": "IT之家 11 月 28 日消息，当地时间 26 日，据《财富》杂志报道，托尼 · 法德尔透露，萨姆 · 奥尔特曼曾邀请苹果前设计主管乔纳森 · 艾夫为 OpenAI 打造一款实体设备，原因是 OpenAI 无法从运行其 AI 服务的 iPhone 中取得所需数据。法德尔曾与艾夫在苹果共事，因被誉为“iPod 之父”以及参与创造 iPhone 而广为人知。他创办了 Build Collective，此前还创立过 Nest Labs。法德尔认为，OpenAI 之所以执意开发独立硬件，是因为它需要获取现实物理世界的信息，而苹果出于隐私保护考虑，不愿向其开放 iPhone 中的这些数据。他们必须自己开发产品，因为无法从手机中获取情境信息。为此，他们只能重新配备 GPS、麦克风、扬声器、摄像头、温度检测等各种功能，能想到的都得有，因为苹果不允许他们从手机中提取这些信息。说到底，就是为了绕开苹果出于隐私保护而设置的种种限制。AI 掌握的情境信息越丰富，给出的答案就越好，用户也能更快得到答案。苹果的各种产品掌握着你家中的全部情境信息，但这些数据你根本拿不到。出于隐私保护的限制，苹果不会把数据交给你。不过，奥尔特曼此前曾表示，苹果的隐私政策并不是 OpenAI 开发新型硬件的出发点。被问及此事时，OpenAI 发言人提供了一段 YouTube 视频。视频中，奥尔特曼是如此解释的：我们之所以想开发新型消费硬件，是因为我认为，这项技术需要一种全新的产品形态。笔记本电脑和 iPhone 都是非常了不起的发明，堪称人类科技史上最伟大的创造之一。但在我看来，AI 目前受制于必须使用为人类而非 AI 设计的设备。看着 AI 熟练地操作电脑确实令人惊叹，但换个角度想，电脑耗费大量资源渲染一个供人观看的用户界面，再让 AI 读取屏幕上的内容，而不是直接获取数据，多少有些荒唐。IT之家从报道中获悉，OpenAI 未来还希望把 ChatGPT 背后的部分计算任务从自家的云服务器转移到用户设备上。对于许多简单任务，AI 根本不需要依赖服务器集群来处理用户指令，笔记本电脑或手机本身的算力就足够了。不过，要说服苹果开放庞大的 iOS 和 macOS 设备生态，让这些设备运行 OpenAI 的任务，恐怕并不容易。法德尔进一步解释了 OpenAI 可能采取的方案：“他们也希望把计算任务转移到终端侧，但苹果并没有向他们开放这些资源。因此，他们打算推出一款配套设备，本质上就是一部去掉屏幕、保留各种传感器的精简版智能手机。设备通过 Wi-Fi 或蓝牙连接，再经由你的手机把数据传回网络，交由云端运行的 AI 智能体处理，也可以交给手机应用中的 AI 智能体。”至于这款设备究竟会做成什么样子，法德尔猜测：“你可能听说过，他们打算做手机、吊坠、笔，甚至扬声器，因为他们真正想要的就是获取情境信息。”▲ OpenAI 首款联名硬件 Codex Micro 键盘", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/033/824.htm", "publishedAt": "2026-11-28T03:22:22+00:00"}, {"title": "系列首款可拍 8K 视频机型：富士 X-T6 曝光，电池容量提高 16%、引入新胶片模拟模式", "summary": "IT之家 11 月 28 日消息，科技媒体 fujirumors 昨日（11 月 27 日）发布博文，报道称在 12 月 2 日举办的 Fujifilm X Summit 峰会上，富士（Fujifilm）将推出 X-T6 无反相机，在欧洲的建议零售价为 2,099 欧元，比前代产品高出 100 欧元。消息称富士 X-T6 的核心升级富士 X-Trans CMOS 6 HR 传感器。该传感器据称采用 RGBW 子像素技术，从而降低低光照条件下拍摄照片和视频时的噪点。视频方面，X-T6 将支持 8K/30p 4:2:2 10 位拍摄，有望成为富士 X-T 系列首款可拍摄 8K 视频的机型。富士据称将引入名为“距离映射”（Distance Mapping）的新功能，但其具体用途目前尚不明确。新机还将加入名为“Forte Chrome”的全新胶片模拟模式，今年 6 月曾有消息称，新胶片模拟的色彩将“非常浓郁、强烈”。“forte”在意大利语中意为“强烈”，与此说法相符。在续航方面，新机将配备全新的 NP-W255 电池，容量提升最高可达 16%，旧款电池预计仍可继续兼容。早前传闻还指出，该机将搭载富士 X-Processor 6 处理器，自动对焦功能得到改进，AI 物体检测能力也将增强，机身外观设计只做细微调整，从而进一步提升操作便利性。相关阅读：《富士无反相机 X-T6 曝光：首用 4000 万 RGBW 传感器，夜景拍摄更优秀》《消息称富士 X-T6 相机搭载全新 4000 万像素传感器》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/033/797.htm", "publishedAt": "2026-11-28T01:02:28+00:00"}, {"title": "iOS 27.3 前瞻苹果 AI 限额：Siri AI 标准每日 20 次云端请求", "summary": "IT之家 11 月 28 日消息，技术博主 @itspdfu 于 11 月 26 日在 X 平台发布长推文，通过挖掘 iOS 27.3 Beta 2 开发者预览版，发现了苹果 Siri AI 和多项 Apple Intelligence 功能的每日使用限额。消息源指出根据苹果设定，设备每向苹果的私密云计算（PCC）发起一次请求，就消耗一个 Token。而这些 Token 只用来证明用户还有可用额度，不会暴露用户身份。在请求流程中，用户在 iPhone 端发起的云端 PCC 请求，会先联系 Token 授予服务（Token Granting Service，简称 TGS）。TGS 知道用户是谁，会核查用户的使用资格和剩余额度，但不知道用户具体问了什么。核查通过后，TGS 向设备返回一批一次性 Token（One-Time Tokens，OTT），设备把这些 Token 存在本地。随着用户使用，设备再继续申请新的 Token。对于受计量的功能，设备通常每批申请 5 个 Token。IT之家注：这里的 Token 是私密云计算（PCC）的访问令牌，并非 AI 模型中的词元（Token），设备每向苹果的私密云计算发起一次请求，就消耗一个 Token。一次 Siri AI 查询可能多次连接 PCC，比如查找附近营业的书店，就消耗了 2 个 Token。复杂任务一次可能扣 2 到 3 个。在 OS 27.3 Beta 2 中，Siri AI 每台设备每天的标准额度是 20 个 Token。订阅 2TB 的 iCloud+ 套餐后，可在此基础上再增加 80 个，每天共 100 个，相当于标准额度的 5 倍。IT之家此前报道，iCloud+ 现有订阅方案将提供不同等级的 AI 使用额度提升，订阅价格暂时不会调整：5GB（免费）：不增加 AI 使用额度。200GB：最高提升至免费额度的 2 倍，月费 2.99 美元（现汇率约合 20 元人民币）。2TB：最高提升至 5 倍，月费 9.99 美元（现汇率约合 66.7 元人民币）。6TB：最高提升至 10 倍，月费 29.99 美元（现汇率约合 200.3 元人民币）。12TB：最高提升至 20 倍，月费 59.99 美元（现汇率约合 400.6 元人民币）。图乐园和照片生成式编辑的标准额度为每天 10 个，2TB 套餐用户可用到 50 个。快捷指令中的云端模型，以及第三方应用调用苹果基础模型，标准额度都是每天 5 个，2TB 套餐用户可用到 25 个。额度分为设备、账户和家庭三个池子，使用时会优先扣除设备额度。Token 缓存在申请它的那台设备上，不能在设备之间通用。所以一台设备的额度用完后，另一台设备仍有可能继续发起请求。此外一次 Siri AI 查询可能会多次连接 PCC。比如查找附近营业的书店，一次就消耗了 2 个 Token。苹果还计划推出按成本计量的“退款”机制，让简单请求少扣一些额度。不过这一机制目前尚未生效。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/033/795.htm", "publishedAt": "2026-11-28T00:50:37+00:00"}, {"title": "开源 3D 引擎 O3DE 升级 26.10：编辑器换上 Qt 6 新界面，启动器首次原生支持 Wayland", "summary": "IT之家 11 月 28 日消息，科技媒体 Linuxiac 今天（11 月 28 日）报道，免费、开源、跨平台的 3D 引擎 Open 3D Engine（简称 O3DE）发布 26.10 版本，带来包含 200 多项修复和改进，增强开发 3D 游戏、模拟和交互式应用程序。在界面与工具方面，引擎将 Qt 版本从 5.15.2 升级至 6.10.2，实现了编辑器和开发工具的现代化。新版本还重新设计了实体检查器，统一了编辑器快捷键，并在资源编辑器中加入撤销功能。在 Linux 平台方面，游戏启动器首次原生支持 Wayland，用户可在运行时或编译时选择 Wayland 或 X11。IT之家援引博文介绍，编辑器仍需依赖 X11 或 XWayland，在 Wayland 下原生运行会导致启动崩溃。新版还扩展平台兼容性，对 Apple Silicon 提供实验性的原生 ARM64 支持，并通过初步集成 Emscripten 铺路 WebAssembly，但目前尚无可用的浏览器版本。在图形方面，Atom 渲染引擎新增 Ground Truth Ambient Occlusion，扩展了无光照材质功能，改进了贴花渲染，并将 AZSL 着色器编译器并入引擎源代码树。物理方面，新版本移除旧版 PhysX 4 集成，改用可选增强确定性的 PhysX 5。导航方面集成 DetourCrowd，让多个智能体在同一环境中移动时能够避让碰撞，行动更流畅。面向机器人开发者，新版本兼容 ROS 2 Lyrical Luth，支持压缩相机图像，并改进了仿真接口。在底层，开发团队继续清理遗留的 CryEngine 代码，采用标准 C++ 库实现，并提升对 C++23 和 C++26 标准的构建兼容性。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/033/789.htm", "publishedAt": "2026-11-28T00:07:44+00:00"}, {"title": "OpenAI 转守为攻：反诉苹果窃密，喊话“不公平竞争”", "summary": "IT之家 11 月 28 日消息，《金融时报》昨日（11 月 27 日）发布博文，报道称在苹果公司提起的商业秘密诉讼中，OpenAI 公司已经提出反诉，指控苹果自身窃取了 OpenAI 的商业秘密，并涉嫌胁迫和威胁同时为两家公司供货的供应商。苹果公司于 2026 年 7 月起诉 OpenAI，称前员工 Tang Tan 和 Chang Liu 离职后，将商业秘密带到了 OpenAI。OpenAI 在反诉中称，一名员工曾从苹果跳槽至 OpenAI，工作六个月后又返回苹果，并通过个人账户带回了一款 OpenAI 硬件设备的详细资料。这些资料据称包括图片、工程信息、供应商详情、制造数据，以及外观涂层和密封剂标准。该说法早在 10 月就已在法院文件中披露。在反竞争方面，OpenAI 指责苹果利用规模优势阻碍对手，在 OpenAI 筹备发售 AI 设备之际，“胁迫和威胁”现有及潜在供应商，并称这是“不择手段地进行不公平竞争”，涉及多种非法、不公平和侵权行为。此外，OpenAI 认为苹果起诉的真实目的是阻止员工被挖走，并称苹果曾鼓励员工把公司文件存放在个人设备和云存储账户中，让员工陷入“加州旅馆”式的陷阱。IT之家注：“加州旅馆”式的陷阱，指的是一种只进不出、一旦进入就很难脱身的处境。这个说法来自老鹰乐队（Eagles）的名曲《Hotel California》。歌里有一句大意是：你随时可以退房，却永远无法离开。这句歌词常被用来比喻这类困境。在这起反诉官司中，OpenAI 主张认为苹果鼓励员工把公司文件存放在个人设备和云存储账户中。员工一旦这样做，就会被卷入“带走机密”的嫌疑，离职后也难以洗清。OpenAI 因此认为，苹果起诉的真实目的不是真心保护商业机密，更大的目的是阻止员工被挖走。相关阅读：《苹果诉 OpenAI 案新进展：法官允许苹果扩大取证范围》《苹果与 OpenAI 商业秘密诉讼交锋升级：互指违规提交新证据》《苹果诉 OpenAI 窃取商业秘密案新进展：法院准许苹果调取后者招聘材料》《双方关系何时破裂？OpenAI 称与苹果的 ChatGPT 合作远不及预期》《美国联邦法官驳回 OpenAI 请求，苹果无需公布与 SpaceXAI 和解协议》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/033/780.htm", "publishedAt": "2026-11-27T23:12:29+00:00"}, {"title": "全球首个：联想为部分 Win11 商用电脑预装 OpenAI ChatGPT，企业登录最高可领 100 美元优惠额度", "summary": "IT之家 11 月 28 日消息，据 Windows Latest 今日报道，联想成为全球首家在部分 Windows 11 商用电脑上预装 ChatGPT 的 PC 厂商。OpenAI 同时也针对符合条件的联想设备推出商业推广活动，企业用户通过预装的 ChatGPT 桌面应用登录或创建 ChatGPT Business 工作区，最高可获得每个席位 100 美元（IT之家注：现汇率约合 667.5 元人民币）的优惠额度。联想目前已在部分新款 Windows 11 电脑上预装 ChatGPT，现阶段主要涉及商用机型，具体覆盖哪些产品系列尚未完全明确。用户可以在 Windows 开始菜单中找到 ChatGPT，也可能在 Lenovo Now 或 Lenovo Vantage 应用中看到相关入口。OpenAI 官方帮助中心显示，对于已经拥有 ChatGPT Business 工作区的企业，只需通过符合条件的联想电脑上预装的 ChatGPT 桌面应用登录现有工作区，符合要求后即可获得一次性 100 美元额度。对于尚未创建 ChatGPT Business 工作区的企业，如果通过符合条件的预装应用发起升级并创建新工作区，则可以在工作区创建后的 90 天内，按照购买的符合条件的席位数量获得额度，每个席位对应 100 美元。活动既包括创建工作区时购买的席位，也包括此后 90 天内追加购买的席位。需要注意的是，这些额度并非现金，也不能用于抵扣 ChatGPT Business 订阅费用或获取 API 额度，而是添加到工作区共享余额中，用于符合条件的服务用量，且必须在到账后 60 天内使用（已有工作区登录奖励和新工作区按席位奖励不能同时领取）。此次活动还有严格的设备要求：只有联想出厂预装 ChatGPT 的符合条件设备才能参与，用户自行在其他联想电脑上下载安装 ChatGPT 并不符合资格。此外，用户需要使用版本号为 26.1117.31558 或更高版本的 ChatGPT 桌面应用。Windows Latest 指出，目前尚不清楚联想具体有多少台电脑预装了 ChatGPT，OpenAI 也没有披露相关设备数量。现阶段预装范围主要集中在商用电脑，未来是否会扩展到 Legion、Yoga 等消费级产品系列尚无明确消息。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/033/777.htm", "publishedAt": "2026-11-27T23:04:37+00:00"}, {"title": "瞄准“走偏”与“健忘”两道难题：蚂蚁灵波发布两大模型，补齐机器人空间导航能力", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/zRubhYcrBMTrOvzjlPQN?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-27T16:15:06+00:00"}, {"title": "千里科技印奇：智驾业务将聚焦两至三家头部车企，从车型定义阶段参与开发", "summary": "IT之家 11 月 27 日消息，据界面新闻报道，千里科技董事长、阶跃星辰董事长印奇在投资者交流会上表示，千里科技未来将聚焦两至三家头部车企客户，从车型定义阶段参与开发，与车企共同设计智驾算法及芯片、传感器、域控制器等硬件配置。印奇称吉利是这一合作模式的代表性客户。印奇表示，千里科技正与吉利推进不同品牌和车型的智驾硬件标准化，以减少重复开发，并利用量产车辆回传的数据迭代模型。据IT之家此前报道，千里科技 2026 年上半年实现营业收入 51.20 亿元，同比增长 22.36%；归属于上市公司股东的净利润为 0.78 亿元，同比增长 151.25%。相关阅读：《千里科技：子公司拟 3443.88 万元购买极氪智能驾驶相关资产》《千里智驾 ASD 装车突破 53 万辆，已搭载 smart 等 19 款车型》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/033/753.htm", "publishedAt": "2026-11-27T13:47:28+00:00"}, {"title": "微 反而更费 Token？JioHotstar 测完六种方案，文件搜索依然能打", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/Ql4GGMIEqA3bI2W2lh7h?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-27T15:00:00+00:00"}, {"title": "防考生利用 AI 作弊，韩国学校抢购金属探测器", "summary": "IT之家 11 月 27 日消息，据央视新闻报道，为防范考生利用人工智能（AI）设备作弊，韩国教育部近日发布新规，要求所有参加校内考试的学生须在考试前后接受金属探测器检查。各地学校加紧采购金属探测器，导致供不应求。报道提到，一家生产便携式金属探测器的韩国厂商 27 日表示，客户咨询数量较往常增加了约 100 倍，公司大幅提升产量，仍难以满足需求。另一厂商说，如果现在订购，需等待约半个月才能拿到货。一家线上商家也发布公告说，现货已售罄，预计下月初才会补货，目前只接受预订。在买不到金属探测器的情况下，不少学校转而选择租用设备应急，租赁公司接到的咨询量显著增多。一家金属探测器租赁公司的负责人表示，过去一般是有安保要求的活动需要租用金属探测器，租给学校监考还是头一次。据韩国方面消息，韩国 2027 学年大学录取名额中，超过 80% 将通过提前选拔录取，高中成绩在其中起着关键作用。然而，常有考生借助微型摄像头等高科技设备实施作弊，相关设备藏匿于衣物或随身物品中，难以发现。因此，韩国教育部要求各地学校在校内考试中使用金属探测器；而对于设备不足的学校，韩国教育部将协助其向警察部门等公共机构借用，或与附近学校共享。IT之家注意到，韩国教育部 27 日公布的数据显示，截至 11 月 25 日，在 2027 学年度大学修学能力考试（高考）中已查处作弊行为 474 起，较去年同期的 279 起增加 69.9%。其中，涉及智能设备的作弊行为达到 112 起，是去年的 3.6 倍，接近全部作弊案例的四分之一。针对利用智能设备实施的严重作弊行为，教育部已于本月 23 日对 6 名考生提出刑事控告。为防止类似事件再次发生，教育部计划今后加强检查，从源头上阻止可能用于作弊的物品被带入考场。此外，教育部还将把高考和校内考试的监管标准扩大至其主管的 6 类国家级考试，并提高作弊处罚力度。据IT之家此前报道，韩国政府为查获考场内未上交的手机，向高考考生与普通民众同步发送了紧急灾难通知短信。短信发送后，处于开机状态的手机将鸣响 10.5 秒警报。相关阅读：《韩国高考已查处涉智能设备作弊达 112 起，增至去年 3.6 倍》《韩国防 AI 作弊新招：要求考生穿围裙考试、时隔 6 年重新收缴手机》《韩国高考 AI 作弊事件发酵，教育部长引咎辞职》《韩国教育部认定今年高考共 111 起涉电子设备作弊：利用智能手机拍考卷等》《韩国首次利用紧急灾难通知“0 级短信”打击 AI 辅助作弊行为，成功在高考中抓获 54 名违规考生》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/033/763.htm", "publishedAt": "2026-11-27T14:11:50+00:00"}, {"title": "DoorDash利用AI智能体将生鲜杂货复购延迟从16秒降至2秒", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/2uDBVKjk3kJXRb6CqQfu?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-27T13:00:00+00:00"}, {"title": "AI 让“自托管”又变得好玩了", "summary": "一个玩了十几年“自托管了”的极客，最近写了篇博客说，自己对这件事的热情又回来了。 jlelse 的说法是他从没真正停下来过，只是懒得折腾新东西了，能把已经在跑的服务维护住就够了。转折发生在最近几个月，而把他重新点燃的，是一个听上去有点讽刺的东西：AI。 作者能重新玩起来，靠的是一个很朴素的前提：他的基础设施...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503872/ai-made-self-hosti 费的 Galaxy AI Premium 层级相关。Zoom enhancer、三星私有 AI 云 SPAC、Memory 应用：暂未发现版本限制。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/033/822.htm", "publishedAt": "2026-11-28T03:18:23+00:00"}, {"title": "IT 管理员称微软 Copilot 可擅自修改企业 OneDrive / SharePoint 文件，恐引合规风险", "summary": "IT之家 11 月 28 日消息，微软一直积极推动 Copilot 融入旗下各类应用，Office 自然也不例外。然而据外媒 Neowin 当地时间 27 日报道，一名 IT 管理员指出，部分新功能可能给使用 Microsoft 365 的企业和组织带来棘手的合规风险。据这名管理员透露，拥有 Business Premium 订阅及 Copilot 许可证的用户，只需向 Copilot 输入文字指令，就能直接编辑保存在 OneDrive 和 SharePoint 中的文件。Copilot 还可以自行识别目标文件并进行修改，用户既不必指定文件名，也无需明确确认修改操作。即使没有启用按使用量计费，在管理中心关闭 Copilot Cowork 和 Code 智能体，并禁用了 Copilot 操作的自动批准功能，这种情况依然存在。该管理员在测试中发现，Copilot 执行的修改似乎不够准确，用户可能在不知情的情况下改动重要的公司文件。此外，管理员在 Microsoft 365 管理中心找不到专门禁止 Copilot 修改 OneDrive 和 SharePoint 文件的设置，最终只能从许可证层面彻底关闭 Work IQ，同时继续寻找其他解决办法，希望既能保留 Copilot 的实用功能，又不必赋予它文件写入权限。此前，微软已通过消息中心发布的 MC1530611 和 MC1536062 两项通知说明了这些调整。第一项通知宣布，用户可以直接通过 Copilot 创建和编辑 Word、Excel 及 PowerPoint 文档；第二项则宣布，将原本独立运行的 Office 智能体整合为直接提供文档编辑功能的新体验。微软同时强调，现有的 Copilot 配置和策略仍然适用于新体验，管理员应当重新检查这些设置。文件原有的访问权限和保留策略也不会改变。IT之家从报道中获悉，从这名管理员的实际测试来看，企业在向员工开放这些功能之前，建议先进行充分测试。尤其是涉及敏感商业文件时，如果 AI 擅自修改了内容，而用户又没有及时发现错误，造成的损失可能远远超出一次简单的格式错误。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/033/790.htm", "publishedAt": "2026-11-28T00:24:00+00:00"}, {"title": "如何让Agent 记得住、查得准、改得对？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/DUG6LEgK9Vi4sGy6QYTW?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-27T17:25:02+00:00"}, {"title": "淘天集团 AI 研发负责人吕承飞（吕行）已确认出席 AICon北京，分享淘宝 AI 原生研发系统实战", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/Y6xTPR1bRWqmNNakCtXm?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-27T10:00:00+00:00"}, {"title": "🔥 Jync v2.4.8 · AI 助手增强、会话超时与元数据库容错", "summary": "本版概要 v2.4.8 是 2.4.7 之后的稳定性与运维体验版本：补齐 AI 助手的日志/实例检索与空回复兜底， 新增登录会话超时管理，并让 H2 元数据库异常时不再把整个页面打成无提示的 500。建议所有 2.4.x 用户升级。 新增 AI 助手工具增强：新增 search_logs 查询当前实例 function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
