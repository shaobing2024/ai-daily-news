部互联网企业、AI 大模型开发商、国家级 AI 算力平台、AI 数据中心、电信运营商，以及 AI 解决方案、制造、能源及公用事业、金融科技、教育等多个行业和政企客户。其中，互联网企业、云厂商尤为代表着算力行业高技术准入门槛和大规模需求。公司已完成互联网大客户供应商引入认证并开始批量交付产品，为收入放量增长打开更大空间。IT之家注意到，公告显示该公司在重点场景解决方案取得显著进展，已实现在大语言模型推理、智能驾驶、具身智能、多模态（如文生图、文生视频、音乐生成等）高速增长应用领域的规模化部署。在训练场景上，公司与数家大模型企业达成深度合作，使用壁砺™系列千卡集群完成多模态模型的预训练和强化学习，实现从训练、微调到推理端到端业务流程的迁移和商业运营，与国际产品相比，精度完全对齐，训练速度显著提升。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/995/887.htm", "publishedAt": "2026-08-29T03:08:21+00:00"}, {"title": "OpenAI：因 Cursor 被 SpaceX 收购，将停止向 Cursor 提供 AI 模型", "summary": "IT之家 8 月 29 日消息，当地时间 8 月 28 日，OpenAI 发布公告，宣布已正式通知 SpaceX，计划终止向 Cursor 提供 OpenAI 模型的合作合同，拟定的服务停止接入日期为 2026 年 11 月 12 日。为了尽可能延长开发者在 Cursor 中继续使用我们模型的时间，我们已按照合同约定的最长期限提前发出通知。这是一个极为艰难的决定，因为我们始终致力于让开发者能够广泛使用我们的模型。但基于以往埃隆 · 马斯克（Elon Musk）旗下公司屡次违约的经历，我们无法确保 SpaceX 会在我们的服务条款约束内合规使用这项技术，因此不得不做出这一选择。OpenAI 表示，在与 SpaceX 这样的大型合作伙伴协作时，通常采用定制合同，以确保对方遵守服务条款，并在面对大规模系统集成时切实保障安全性。此前，在马斯克收购推特 (Twitter，现已并入 SpaceX) 之后，该公司便违反了双方合同中的多项条款。今年早些时候，马斯克在宣誓作证时也承认，xAI（现同样并入 SpaceX）曾违反过 OpenAI 的服务条款 —— 而这些条款与 xAI 自身制定的规范十分相似。IT之家从公告获悉，OpenAI 与 Cursor 签署的定制协议中明确规定：在公司控制权发生变更后，OpenAI 拥有在限定期限内终止协议的权利。随着人工智能能力的不断演进，我们也承担着更高标准的责任，必须确保即将推出的新模型 Astra 能够严格遵循我们的条款合规使用。综合以上考虑，我们决定在合规允许的前提下将合同终止日顺延至最晚时间，但未来将不再向 Cursor 提供后续新模型。相关阅读：《科技行业史上最大收购之一，SpaceX 豪掷 600 亿美元拿下 AI 编程公司 Cursor》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/995/874.htm", "publishedAt": "2026-08-29T02:21:24+00:00"}, {"title": "开源鸿蒙机器人操作系统 M-Robots OS 3.0 Beta 版发布，重心从“单机能力”转向“群体智能”", "summary": "IT之家 8 月 29 日消息，由国家数据局主办的 2026 中国国际大数据产业博览会昨日在贵阳开幕。深开鸿高级副总裁、研发体系总裁王皓博士在会上正式发布了 M-Robots OS 3.0 Beta 版。IT之家注：M-Robots OS 是深开鸿发布的全国首个基于开源鸿蒙的分布式异构多机协同机器人操作系统，以开源鸿蒙（OpenHarmony）为底座。据介绍，此次发布的 3.0 Beta 版，将重心从“单机能力”转向“群体智能”，构建起安全、实时、可信的分布式机器人操作系统底座。围绕“安全、实时、群体智能、数字底座”四大方向进行了系统性升级：安全方面，系统构筑了“组网可信、接入可控、运行可防”的立体防护体系。基于 VAA 统一标识体系为每台设备赋予唯一数字身份，实现“一机一码、一机一密”；通过 KGSI 安全启动构建信任链，确保运行环境纯净可信；当多设备组成超级设备时，由高安全能力的设备统一进行安全认证，高效且可靠。此外，系统实现了安全状态共享 —— 当单一设备受到攻击时，可快速共享风险并切断连接，杜绝风险蔓延，实现“东西协同的群体安全”。实时与可靠方面，系统基于自研单芯多内核混合部署架构，实现中断响应时延与任务切换时延均≤1μs 的微秒级硬实时响应。同时支持秒级启动和快速恢复 —— 关键业务 2 秒内恢复运行，系统异常 4 秒内完成恢复，单点故障影响不扩散，可满足智能制造、巡检等严苛场景的可靠性要求。群体智能方面，3.0 Beta 版本全新打造了 Agent Native 框架，使能人机多模态交互、单体内多 Agent 自主协同以及机器人间 Agent 自主协同。基于该框架打造的 M-Claw，可实现端到端分布式自治集群 —— 多机器人自组网、分布式能力共享、动态任务分配，真正让机器人从“单机执行”走向“群体协作”。数字底座方面，系统适配 ARM、RISC-V、LoongArch、x86 四大主流架构，兼容 ROS、Dora-rs、OpenHarmony 三大生态，覆盖 CPU、NPU、GPU、BPU 四类算力，确保产业既有的应用资产与开发者技术积累可平滑迁移，避免“推倒重来”。发布会上，王皓通过三个真实场景展示了 M-Robots OS 3.0 Beta 的落地应用：无人零售场景中，基于 M-Robots OS，制作机器人与配送机器人通过 M-DDS 实现自发现自组网，订单信息、设备状态和任务进度实时同步，完成“一杯咖啡的无人接力”—— 从下单到制作到配送，全流程跨设备协同。园区巡检场景中，M-Robots OS 适配海恩巡检机器人，联动无人机，基于 M-DDS 组成超级设备，实现空地一体园区安全防护体系。当发现火灾、非法闯入等异常情况时，系统自动联动周边设备进行多源数据核实分析，并触发最近的地面机器人前往处置，实现“发现-确认-处置”端侧闭环。水质检测场景中，水质检测机器人与实验室环境监测设备、人员工作状态监测设备动态联动，打造“人-机-环”三位一体的实验室管控体系。机器人执行水样检测任务时，可自动调节光照、通风与温湿度，实现检测作业与实验室环境管理的一体化智能管控。相关阅读：《全国首个开源鸿蒙机器人操作系统 M-Robots OS 正式开源》《全国首个开源鸿蒙机器人操作系统 M-Robots OS 2.0 版本发布》《两年深耕：全国首个开源鸿蒙机器人操作系统 M-Robots OS 完整捐献至开放原子开源基金会》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/995/865.htm", "publishedAt": "2026-08-29T01:55:23+00:00"}, {"title": "开放麒麟 openKylin 3.0 正式发布，系统内核升级至 Linux 7.0", "summary": "IT之家 8 月 29 日消息，据开放原子开源基金会，OpenAtom openKylin 3.0 版本正式发布。官方表示，本次版本升级，openKylin 将系统内核跨代升级至 Linux 7.0，完成 180 余个核心组件全面迭代；构建智能体开放底座，让 AI 贯穿系统全链路；隔空手势、语音输入、屏幕朗读等多模态交互革新；场景覆盖从智能桌面延伸至移动端、服务器等全场景。IT之家附主要更新内容如下：升级 Linux 7.0 内核openKylin 3.0 将系统内核从 Linux 6.6 直接升级至 Linux 7.0。GCC 15、glibc 2.42、LLVM 22、JDK 25，围绕新内核的 180 余个核心组件全面升级，核心基础库与编译工具链对齐国际上游社区新版本。本版本集成 NIST 三大后量子密码标准（ML-KEM、ML-DSA、SLH-DSA），通过 openHiTLS 开源密码套件实现系统级调用，配合 TPM 可信启动链，构建“芯片 — 系统”全链路信任体系。内核层支持 Rust For Linux，开发者可以用 Rust 编写外设驱动；核外层的 wget、time 等首批系统工具已完成 Rust 重写，从源头减少内存安全漏洞。构建智能体开放底座openKylin 3.0 将模型、记忆、工具、系统权限与桌面能力纳入统一架构，为智能体提供系统级的运行环境。KylinBot、WorkBuddy、OpenClaw、Raccoon Work 等主流智能体均可在 openKylin 3.0 上完整运行。智能体通过 MCP 协议直接调用桌面能力，无需模拟点击，实现“推理 — 决策 — 操作 — 反馈”全链路自主执行。无论智能体来自社区自研还是第三方生态，在此版本上都拥有同等的系统能力与运行环境。开发者可通过统一封装的 AI SDK 开发智能技能，一套接口适配多家大模型；自建技能可提交至 openKylin-skills 仓库，与全球开发者共享，形成“下载即用、开发即共享”的开放生态闭环。多模态交互革新全新 UKUI 4.24 桌面环境，让人机交互从键鼠延伸至语音、隔空手势 —— 握拳即可截屏，挥手即可翻页、调节音量；全局语音输入，一句话直接下达指令；触摸板边缘轻滑，亮度、音量、进度随手调节。系统级屏幕朗读支持焦点导航与全文跟随，语速音量精细可调；KylinBot 的任务结果可推送至企业微信、飞书、钉钉；AI 的操作结果直接呈现在界面上。任务栏新增三岛模式，数据岛、应用岛、设置岛分区呈现、互不干扰；开机与解锁时，动态壁纸以几秒光影流转，唤醒你的专属工作空间。全场景能力覆盖openKylin 3.0 同源支持 x86、ARM、RISC-V、LoongArch 四大处理器架构。openKylin 是 RISC-V 架构适配最广、成熟度最高的操作系统之一，支持最新 RVA23 标准，AI 推理经 RVV 指令优化，FP32 场景提速 2 至 5 倍，FP16 场景最高 36.5 倍。场景能力从桌面全面延伸到移动端、服务器端 ——“灵龙”人形机器人、AI 无人小车、AI 机械臂的具身智能适配，ARM、LoongArch、RISC-V 等多架构工业硬件平台支持，主流 AI PC 与 PocketClaw 口袋龙虾等便携 AI 终端，面向服务器与工作站的高性能版本，以及 20 余款覆盖 AI、云计算、大数据的 Docker 应用镜像。IT之家附下载链接：https://www.openkylin.top/downloads", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/995/859.htm", "publishedAt": "2026-08-29T01:19:38+00:00"}, {"title": "阿里云巴西节点开服，Qwen 系列开源模型全球下载量突破 30 亿次", "summary": "IT之家 8 月 29 日消息，8 月 28 日，阿里云宣布巴西数据中心正式启用，设有两个可用区，为企业客户及开发者提供计算、存储、数据库等云服务，企业级 AI 服务将陆续上线。这是阿里云在拉美市场的第二个地域节点，此前已于 2025 年 2 月在墨西哥上线首个拉美节点。至此，阿里云全球基础设施达到 31 个地域、106 个可用区。阿里云披露，Qwen 系列开源模型全球下载量已突破 30 亿次，衍生模型超 30 万个。今年 1 至 7 月，仅 Hugging Face 一个平台下载量便达 20.45 亿次，位居全球第一。围绕智能体应用需求，阿里云将在巴西推出容器计算服务智能体 ACS Agent Sandbox、数据分析智能体 Data Agent for Analytics、大数据开发治理平台 AI 助手 DataWorks Data Agent 及全域智能运维平台 STAROps 等系列 AI 服务。目前，阿里云已通过本地合作伙伴服务巴西企业。巴西技术解决方案提供商 Insi 正基于阿里云全栈能力提供数字化转型方案，开源软件公司 4Linux 则结合 Qwen 系列模型与本地服务，帮助企业探索生成式 AI 应用。巴西地域节点也将进一步支持中国企业和国际客户在当地开展业务。去年，巴西已成为中国对外投资全球第一大目的地，业务范围从能源、电力拓展至汽车、制造、物流、电子和数字服务等领域。IT之家查询获悉，阿里云已在韩国、法国、日本、马来西亚、墨西哥等重点市场持续完善全球云基础设施网络，并同步推进 AI 产品和服务落地。本轮布局完成后，阿里云全球基础设施达到 31 个地域、106 个可用区，覆盖欧洲、东亚、东南亚、拉美等主要市场。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/995/847.htm", "publishedAt": "2026-08-29T00:11:17+00:00"}, {"title": "腾讯混元 Hy4 preview 开源，参与“训练自己”！WorkBuddy实测：有了小型团队交付实力，但还得有人盯", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/SxrNXURUimQf4hL83ybj?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-28T16:09:08+00:00"}, {"title": "大模型和硬件之间，长出了一层新生意", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl" const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
