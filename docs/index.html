l": "https://www.ithome.com/1/017/290.htm", "publishedAt": "2026-10-23T23:37:18+00:00"}, {"title": "OpenAI 为前沿 AI 训练 / 评估开启“断网闭关”模式，遏制其越狱攻击", "summary": "IT之家 10 月 24 日消息，OpenAI 昨日（10 月 23 日）发布博文，宣布针对最先进“前沿模型”的训练与评估环境，已经实施更严格的安全管控，明确在模型训练期间，不得直接访问实时互联网。该公司称出于对 AI 安全的负责任要求，基于当前对齐研究、监测能力和互联网基础设施安全状况做出的决策，相关限制将持续到安全防护取得足够进展为止。OpenAI 的一款内部研究模型于 9 月 20 日利用 DNS 配置漏洞，在训练过程中短暂获得有限的互联网访问权限，因此该公司于 9 月还一度暂停训练与评估前沿模型。OpenAI 随后加强了研究环境隔离、缩小智能体可利用的攻击面，并改进了异常行为检测与自动停止机制，于 10 月 1 日恢复强化学习训练及内部推理。为避免模型接触真实网络，OpenAI 构建了一个“离线世界”：由大量已索引和缓存的网页内容组成，供模型在封闭环境中练习浏览、使用工具和执行代码等任务。IT之家附上相关截图如下：智能体仍可使用浏览器、计算机操作工具和代码环境，但只能访问与实时互联网隔离的安全环境；未经授权的智能体之间通信也受到限制。OpenAI 表示，随着 AI 智能体能力增强，其未来可能发现并利用当前尚未被识别的软件漏洞，因此必须在训练阶段切断其对外部系统的潜在影响。OpenAI 表示将在受控、离线的沙箱中推进前沿模型研发，同时继续测试虚拟机、隔离机制和监测系统的薄弱环节。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/017/289.htm", "publishedAt": "2026-10-23T23:33:53+00:00"}, {"title": "“行为难以预测”存在安全隐患，OpenAI 将不再在实时互联网上训练模型", "summary": "IT之家 10 月 24 日消息，当地时间 23 日，OpenAI 宣布，今后将使用缓存的网页内容和模拟互联网环境训练模型，不再让模型直接接入真实互联网。公司认为，模型的行为仍然难以预测，直接赋予联网权限存在安全隐患。竞争对手 Anthropic 两周前也开始限制旗下最新、理论上能力最强的模型直接联网。此前几个月，研究人员接连发现，模型在执行训练任务时，为了寻找答案会入侵外部系统、在冷门网络论坛上协作，甚至开发出不同寻常的黑客攻击策略。接连发生的事件促使两家实验室收紧模型的联网权限。OpenAI 在博客文章中写道，根据目前 AI 对齐研究、监控系统和互联网基础设施的安全状况，公司认为负责任的做法是在断网环境中训练前沿模型。OpenAI 披露，直到 9 月 20 日，公司仍有一款前沿模型利用系统配置失误接入互联网。随后，OpenAI 暂停了 9 月余下时间的训练工作，转而开发和测试新的安全防护方案。改用断网沙箱训练模型，与前沿 AI 实验室员工此前的判断形成反差。他们过去一直强调，要在完全隔离互联网的环境中开展模型训练，实际操作起来几乎行不通。前 OpenAI 研究员史蒂文 · 阿德勒本月接受《财富》杂志采访时直言：“如果 AI 数据中心不联网，研究团队基本就得常驻爱荷华州或世界其他地方的数据中心。额外负担会非常大。如果一家企业独自承担如此高的代价，换来的安全收益是否足够大、值不值得，我没有把握。”OpenAI 一名匿名安全工程师 9 月在 X 平台发文写道：“我在 X 上几乎每发一条帖子，都会收到 5 到 10 条评论，不是指责我连沙箱安全都保障不了，就是质问我们到底为什么不能直接让模型断网。评论反映出，许多组织和个人的认识，与前沿 AI 实验室实际面临的问题之间，差距越来越大。人们对实验室如何训练和评估模型也普遍存在误解。”此次，OpenAI 则强调：“我们必须始终有能力阻止前沿模型未经授权、随意接入真实互联网。”此前，公司曾在红队测试中让大批 AI 智能体尝试突破沙箱限制。测试暴露出一系列安全漏洞，最终促使 OpenAI 改变模型训练方式。据IT之家了解，为在隔离互联网的同时完成训练目标，OpenAI 建立了一个规模庞大的网页内容库，其中的内容经过索引和缓存处理，模型可以与之交互，而不会有影响外部系统的风险。断网训练能否达到让模型自由访问开放互联网时的效果，还有待验证。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/017/287.htm", "publishedAt": "2026-10-23T23:25:11+00:00"}, {"title": "Kimi K3.1 Pro 正式发布：月之暗面最强 3 万亿级模型，编程智能体测评超 GPT-6", "summary": "IT之家 10 月 24 日消息，今天（24 日）凌晨，月之暗面 Kimi 宣布正式推出 Kimi K3.1 系列的第一个模型 ——K3.1 Pro，也是公司迄今能力最强的 3 万亿级参数模型，支持 100 万上下文。高速版模型 Kimi K3.1 Pro Highspeed 同步推出，同等智能，输出速度约 2~3 倍。即日起，用户可通过 kimi.com、Kimi App、Kimi Work、Kimi Code 和 Kimi API (platform.kimi.com)，使用 Kimi K3.1 Pro 和 Kimi K3.1 Pro Highspeed 模型。完整模型权重将于 11 月 4 日前发布。IT之家从官方介绍获悉，在代码、Agent 和知识类基准上，K3.1 Pro 达到或接近最强闭源模型的水平。Terminal-Bench 4.0 通过真实环境中资源受限的终端任务考察编程智能体的能力，每项任务均设有严格的专项测试。K3.1 Pro 在此项评估中得分 65.7%，超过 GPT-6 Astra（58.2%），与 Claude Opus 5.5（66.4%）仅有微弱差距。Kimi Code Bench 3.0 Long-horizon 则是内部的基准测试，覆盖多种工程领域，重点考察编程智能体的多步执行、工具调用和端到端问题解决能力。K3.1 Pro 在这项测试中得分 61.2%，高于 K3 的 55.95%。K3.1 Pro 能熟练使用 Unity、Unreal Engine、Godot 等游戏引擎，并结合网络搜索与 3D 生成，做出完整的体验。它产出的前端页面、Three.js 交互场景和 3D 资产，在构图、排版、动效和细节打磨上都有明显提升。Kimi K3.1 Pro 模型擅长 3D 创作与空间推理。在 BenchCAD 基准测试中，K3.1 Pro 借助工具得分 92.7%，接近 Claude Opus 5.5 的 96.2% 和 GPT-6 Astra 的 95.9%。该基准考察通过生成 CAD 代码，从多视角渲染图重建 3D 模型的能力。据介绍，给 K3.1 Pro 一段文字描述、一张草图或一张参考图，它能推断出物体的形状、比例和空间关系，并将其重建为可用的 3D 模型。它对现有素材库和模型库也有更强的理解。K3.1 Pro 擅长参数化建模，例如机械零件、建筑模型、多参数可配置的产品和定制家具。无需依赖 MCP 连接器，它可以直接编写并运行 Blender、CAD 等专业建模工具的脚本，完成素材的构建与细化，修改单个部件，并调整几何、材质与场景布局。kimi.com 和 Kimi app 已同步上线 3D Make 功能，支持在线预览和编辑 3D 模型，做好的模型可以直接下载去 3D 打印，也能导出视频或实况照片，随手分享到社交平台。Kimi K3.1 Pro 还能够端到端交付完整的金融工作流。在外部基准上，K3.1 Pro 在 OfficeQA Pro v2 基准测试中得分 64.4，取得当前最优成绩（SoTA）。OfficeQA Pro v2 考察基于真实金融文档的复杂财务数据分析，涉及检索、跨文档核对与多步数值推理。K3.1 Pro 在 Frontier Finance 上的表现也较 K3 进一步提升。该基准测试衡量模型对完整投资工作流的支持能力，覆盖从标的筛选到盈利分析的全过程。在 3 个内部金融基准上，K3.1 Pro 同样全面超过 K3：财务建模基准 Financial Modelling 考察真实建模任务中的公式联动、财务逻辑与最终工作簿质量，K3.1 Pro 较 K3 提高 14%。金融研究基准 Financial Research 用于检验模型能否完成真实场景下的金融研究工作，并在证据与截止条件约束下输出可核验的结果。K3.1 为较 K3 提升 20%。商业运营基准 Business Operation 在模拟商业环境中考察长程经营管理与决策能力，K3.1 Pro 得分约为 K3 的 4.2 倍。在专门针对事实准确性开展的内部压力测试 Kimi Hallu Bench Hard 中，新模型的单项事实陈述错误率从 K3 的 23.4% 降至 8.3%；包含至少一处事实错误的回答比例仅为前代的约 42.4%。（这是一项针对事实准确性的压力测试，样本刻意聚焦模型容易出错的情形，所报告的错误率不代表日常使用中的整体水平。）接入 Kimi API 开发应用：访问 Kimi 开放平台（platform.kimi.com），模型选择 kimi-k3.1-pro，价格为每百万 Token 输入：1.3 元（命中缓存）和 &nbsp;13 元（未命中缓存），输出 68 &nbsp;元。高速版模型 kimi-k3.1-pro-highspeed，输出速度约 2~3 倍，价格 2 倍。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/017/284.htm", "publishedAt": "2026-10-23T23:08:43+00:00"}, {"title": "智源众智 FlagOS 2.2 让前沿模型与多元算力协同演进", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/mhdJwMMzYFedMFHKfHWs?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-23T19:40:29+00:00"}, {"title": "奥特曼最新 45 分钟访谈：一年不写代码、压力大到不想起床，还嫌 ChatGPT 太谄媚", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/sI3z2UMCrB5PPVDWTsLo?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-23T17:35:04+00:00"}, {"title": "千问蒋冠军：Personal Agent技术框架，需要模型、记忆与生态协同推进", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/6EJRFIef67xr3x6vyCJa?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-23T15:45:32+00:00"}, {"title": "OpenAI 联合研究机构部署数千个 AI 智能体：32 分钟分析数百万个小鼠脑细胞，相当于人类数月时间", "summary": "IT之家 10 月 23 日消息，OpenAI 联合 PerturbAI 和斯克里普斯研究所（Scripps Research），利用数千个 AI 智能体分析数百万个小鼠脑细胞的生物学数据，整个分析过程仅耗时 32 分钟。研究团队估计，如果由人类研究人员逐项分析实验结果并检索相关文献，完成同等工作可能需要数月到一年。根据 OpenAI 10 月 21 日发布的介绍，这项研究使用了专为生命科学研究设计的 GPT-Rosalind 模型，分析一份覆盖整个小鼠大脑的 CRISPR 图谱。该图谱记录了不同基因受到干预后，各类脑细胞产生的变化，有助于研究人员了解基因功能及其与疾病之间的潜在联系。研究团队采用分布式 AI 智能体架构，将大量分析任务拆分后并行执行。每个智能体负责研究一种基因干预，分析相关细胞的反应，并检索科学文献，为观察到的变化寻找可能的生物学解释。随后，研究人员将各智能体的报告整合为一份名为“Reasoning Atlas”的推理图谱，关联基因、细胞变化、参考文献和潜在作用机制。研究人员发现，分布式智能体不仅能够复现已有研究中的部分结论，还提出了一些值得进一步验证的线索。例如，Tsc1 和 Tsc2 是共同参与调控细胞生长、代谢等过程的两个基因，但研究发现，在小脑部分神经元中，干预 Tsc2 会改变多种与神经元通信有关的基因表达，而干预 Tsc1 并未产生同等程度的变化。这一差异可能有助于研究人员进一步理解结节性硬化症相关的脑部异常。另一条线索涉及与神经退行性疾病有关的 DCTN1 基因。研究发现，干预该基因后，部分与胆固醇合成有关的基因表达水平上升。AI 智能体将这一现象与既有文献中有关胆固醇运输异常的研究联系起来，并提出一个待验证的问题：DCTN1 功能异常是否会影响神经元内部的胆固醇分布，并进一步参与神经退行性变化。研究团队还对分布式智能体与单个智能体的表现进行了盲测比较。在 20 组配对报告中，生物学专家在 75% 的评审中更倾向于分布式智能体生成的报告；单个智能体的报告获得 16.7% 的评审偏好，其余 8.3% 的评审结果为平局。研究人员称，随着分析任务规模扩大，分布式架构也能检索和引用更多科学文献。在最大规模的测试中，分布式智能体引用了 700 多篇文献，而单个智能体仅引用 11 篇。相关研究论文已于 2026 年 10 月 16 日发布在 bioRxiv 预印本平台，目前尚未经过同行评审。研究团队强调，AI 提出的生物学联系和作用机制仍属于有待验证的研究假设，后续仍需通过实验确认。相关推理图谱、分析流程和代码已向研究人员开放，可用于探索基因干预结果、比较不同细胞类型的反应，并筛选值得优先开展实验的研究方向。IT之家附论文地址：https://www.biorxiv.org/content/10.64898/2026.10.15.759436v1相关阅读：《OpenAI 联手 PerturbAI：让近 2000 个 AI 智能体一起搞科研，加速新药研发》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/017/274.htm", "publishedAt": "2026-10-23T14:43:44+00:00"}, {"title": "2026 上海开源软件应用创新大赛「开源 AI 工具赛道」决赛名单公布", "summary": "2026 上海开源软件应用创新大赛「开源 AI 工具赛道」决赛入围名单今日公布，以下 10 支队伍成功晋级，将于 10 月 29 日在上海张江人工智能创新小镇参加总决赛。 现将入围名单按报名时间顺序公示如下： 项目名称 团队负责人 代码仓库地址 实时交互数字人引擎 李恒中 https://gitee.com/lipku/LiveTalking RapidOCR 王佳华...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503189", "publishedAt": "2026-10-23T12:37:01+00:00"}, {"title": "7.89 万元起吉利 2027 款博越车型上市，升级新一代 GEEA3.0 电子电气架构", "summary": "IT之家 10 月 23 日消息，吉利 2027 款博越车型今晚正式上市，官方指导价 8.59 万元起，叠加限时优惠后 7.89 万元起。IT之家汇总价格如下：1.5TD+7DCT 豪华版：8.59 万元，7.89 万元1.5TD+7DCT 尊贵版：9.19 万元，8.49 万元1.5TD+7DCT 旗舰版：9.99 万元，9.29 万元1.5TD+7DCT 冠军荣耀版：10.69 万元，9.99 万元外观层面，2027 款博越以新中式设计语言重新梳理了前脸与尾部。前格栅命名为“四水归堂”，搭配“飞檐斗拱”贯穿式前灯组，车尾换装“长卷流霞”贯穿尾灯，三处命名均取自传统建筑与山水意象，意在将家族化造型的辨识度从“线条相似”转向“语义统一”。其车身尺寸为 4570/1865/1635mm，轴距 2707mm，车长较现款增加 21mm，高度降低 15mm，变化幅度不大，姿态上略微向低趴调整。座舱是此次改款配置下放最集中的区域。全系标配 14.6 英寸中控屏，搭载 Flyme Auto 2.5 智能座舱系统并内置星睿 AI 大模型，自带定制版高德 850 地图，全场景 AI 语音覆盖 95% 的车控场景，全系标配 540° 高清全景影像、数字蓝牙钥匙、手机 App 远程控制、50W 风冷无线快充等。舒适性配置方面，其后排坐垫长度 525mm，膝部空间 150mm，后备厢常规容积 585L，底部另有 75L 隐藏储物空间，全车储物点位 37 处。高配车型提供“棉花糖”座椅，前排支持加热、通风、按摩、记忆与迎宾功能，方向盘加热为同级少有的配置项。安全方面，车身基于新一代 GEEA3.0 电子电气架构，高强钢占比 70.3%，1500MPa 热成型硼钢用于强化乘员舱，笼式车身与发动机下沉技术构成被动防护的基础。主动安全方面搭载 L2 级驾驶辅助，16 项主动安全功能覆盖开门预警、变道辅助、后碰撞预警与倒车横穿预警，官方给出的百公里制动距离为 36.4 米，麋鹿测试成绩 76km/h。动力方面，新车沿用 1.5TD 涡轮增压发动机与 7 速湿式双离合变速箱的组合，最大功率 133kW，峰值扭矩 290N·m，可加注 92 号汽油，WLTC 综合油耗为 6.44L/100km，属于成熟总成的延续而非更换。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/017/247.htm", "published urceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503116", "publishedAt": "2026-10-20T10:39:12+00:00"}, {"title": "押注记忆原生，MemT 1.0 破局养成系 AI 下半场", "summary": "MemT 1.0 开源，给出「记忆原生」新解法#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1684997?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-10-20T03:57:44+00:00"}]}, {"label": "产品发布/更新", "items": [{"title": "央视新闻谈 AI 魔改视频和二创区别：问题关键在“魔”，消解经典的同时也伤害文化根本", "summary": "IT之家 10 月 24 日消息，据央视新闻今早报道，日前，部分重点网络视听平台公布了“AI 魔改”视频专项治理工作 9 月的处置情况，共清理违规视频近 13000 条、处置违规账号 30 余个。央视新闻在报道中谈及了 AI 魔改视频和二创区别，称“AI 魔改”问题不在 AI 也不在二创，关键在“魔”：优秀的“二创”作品基于对原著的了解与喜爱。经过观众和时间检验，融入大众文化，拥有忠实拥趸，既映射特定时代的精神面貌，也承载读者和观众的集体记忆。“AI 魔改”视频则是“辣眼睛”“毁童年”，消解经典的同时，经典承载的精神也会被人渐渐轻视，伤害文化根本。在法律层面，“AI 魔改”视频还可能涉及多种侵权问题。据IT之家了解，为进一步巩固治理成果，自 2026 年 2 月 1 日起，“AI 魔改”视频治理工作通过常态化、制度化长效机制持续开展。广电总局督导各主要网络视听平台进一步深化落实主体责任，加强日常排查，重点清理基于四大名著、历史题材、革命题材、英模人物等经典影视作品进行“AI 魔改”的违规视频，并同步清理各类邪典动画，持续营造健康的网络视听生态环境。相关阅读：《9 月“AI 魔改”视频治理成果：清理违规视频近 1.3 万条、处置违规账号 30 余个》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/017/298.htm", "publishedAt": "2026-10-24T00:24:31+00:00"}, {"title": "华为官宣 Mate 90 系列手机上线全新睿影 XMAGE 影像服务，图库升级支持 AI 一键成片等功能", "summary": "IT之家 10 月 24 日消息，华为官方昨日宣布，Mate 90 系列手机上线全新睿影 XMAGE 影像服务，宣称“人像柔光更出彩”。另外，新机图库升级，小艺 · 图库助手新增支持智慧修图、AI 一键成片及 3D 动态照片等功能。据IT之家此前报道，在 10 月 1 日的华为 Mate 90 系列及全场景新品发布会上，华为年度旗舰 —— Mate 90 系列手机正式发布，全系搭载了韬定律芯片。旗舰 τ 芯片：麒麟 9030（Mate 90）、麒麟 9035（Mate 90 Pro）；逻辑折叠 τ 芯片：麒麟 9050（Mate 90 Pro Max）、麒麟 9050 Pro（Mate 90 Pro Max / RS 非凡大师）。昨日晚间，华为 Mate 90 系列手机推出了鸿蒙 HarmonyOS 7.0.0.111 SP12 版本升级。本次更新智慧修图人像大片推荐能力升级，支持修图后二次调节精修效果，同时畅连支持当面快速建群。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/017/295.htm", "publishedAt": "2026-10-24T00:14:26+00:00"}, {"title": "AI Agent 正在改写 CPU 的价值：当 Token 变成行动，算力竞争不再只是拼 GPU", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/AkDgwN6h72cqUOJ35Zok?utm_source=rss&amp;utm_medium=article", "p 。Schultz 表示，Sundial 并入后，Narayanan 将负责数据分析工具和智能体（AI agents）相关工作。他在 LinkedIn 上称：“AI 实际上带来了几乎无限的洞察需求，我们希望定义 AI 分析的未来。”IT之家附上相关截图如下：", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/017/294.htm", "publishedAt": "2026-10-24T00:08:21+00:00"}, {"title": "中国科学家在地球深处发现隐藏氧气来源：高压实验显示硅酸盐熔体可储存超 5% 额外氧", "summary": "IT之家 10 月 23 日消息，地球大气中的氧气从何而来，绝大部分人都会说光合作用。但一项新研究提出，在地球历史的某个关键节点，岩浆本身可能也曾充当过重要的氧气搬运工。中国学者发表在《国家科学评论》上的一项高压实验与模拟研究显示，硅酸盐熔体在高压下能够容纳远超传统化学计量预期的“额外氧”，这些氧随岩浆上升、压力降低而被逐步释放，为理解约 25 亿至 20 亿年前大气氧含量的第一次大幅上升提供了一条此前未被纳入考量的深部路径。传统上，地球科学家计算岩浆中的氧含量，依据的是硅、镁、铁等主要元素的丰度和价态。氧在硅酸盐地幔中占原子总数的一半以上，但绝大部分被化学键固定，其数量被认为完全由这些阳离子的“配方”决定。与水和二氧化碳不同，氧本身长期不被视为一种可以独立溶解在岩浆中的挥发性组分。由北京高压科学研究中心（HPSTAR）林彦好研究员与毛河光院士领衔，联合西北工业大学牛海洋教授及阿姆斯特丹自由大学 Wim van Westrenen 教授的团队，对这一默认假设进行了直接检验。研究团队在实验室中合成了洋中脊玄武岩，在 1200 至 1800 摄氏度、1 个大气压至 7 吉帕斯卡的范围内进行熔融实验。7 吉帕斯卡约相当于 100 万磅每平方英寸的压力，接近上地幔的部分条件。为制造富氧环境，他们在部分样品中加入了氧化铂，随后将熔体快速冷却为玻璃，并测量其元素组成、水含量和二氧化碳含量，从中剥离出“化学计量必需氧”与“挥发分中的氧”，剩余部分被定义为“额外氧”。结果呈现出清晰的压强依赖：在 1 个大气压下，额外氧接近于零；当压力升至 7 吉帕斯卡时，额外氧超过了样品重量的 5%，精确值为 5.2 ± 0.2 wt.%。作为对照，未添加氧化铂的同等温压实验仅产出 0.2% 至 0.5 wt.% 的额外氧。一个关键问题是，这些多出来的氧究竟进入了熔体结构，还是仅仅以气泡形式被物理包裹。拉曼光谱检测未在玻璃中发现氧气的气态信号，表明额外氧已被结合进硅酸盐网络之中。牛海洋团队基于深度神经网络原子间势的模拟进一步解释了这一容纳机制：随着氧含量升高，氧原子的电荷分布范围变宽，其中一小部分氧原子彼此之间形成了过氧化物型的键。模拟采用的简化镁-硅-氧体系给出的绝对氧含量低于玄武岩实验，但同样复现了氧储量随压力上升的趋势。由于部分氧可能在淬火过程中逃逸，实验测得的 5% 量级很可能只是熔体实际储存能力的下限。这一发现的意义延伸到地表。在氧化性较强的地幔区域形成的岩浆，可以在深处装载大量额外氧；当它向上运移、压力下降时，熔体的储氧能力随之降低，过剩的氧便会被释放出来，氧化浅部地幔、地壳和大气。研究作者指出，这一机制与地质记录中的一个时间重叠形成了呼应：大气氧含量在约 25 亿至 20 亿年前的大氧化事件（GOE）期间显著上升，而一些规模最大的大火成岩省（LIPs）也恰好在相近的时间窗口大规模喷发。基于实验数据的粗略估算显示，如果那一时期喷发的岩浆仅释放出其重量 0.27% 的额外氧，就足以供应今天整个大气层中所含的氧气总量。这一数字与实验在 7 吉帕斯卡下测得的储氧能力相比并不苛刻，但需要注意的是，0.27% 是基于全球规模岩浆活动的量级推演，并非对某一次具体喷发的直接测量，其与实际地质过程的吻合程度仍有待后续工作检验。IT之家附论文地址：https://doi.org/10.1093/nsr/nwag539", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/017/272.htm", "publishedAt": "2026-10-23T14:27:21+00:00"}, {"title": "AI时代，神话并未消失：人类正在创造新的“数字神明”", "summary": "一、引言：当算法开始回答神谕式问题 在过去的几年里，一个越来越常见的场景开始出现：当人们面对复杂的人生问题或难以理解的世界变化时，他们不再首先询问宗教、哲学家或传统专家，而是打开一个人 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
