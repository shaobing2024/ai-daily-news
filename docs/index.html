选择加入）。OpenAI 指出随着模型承担更长、更复杂的任务，部分严重安全风险可能要在多轮交互后才会显现。现有兼容 ZDR 的安全系统通常逐条评估交互，难以识别跨对话、跨账户或持续试探安全机制的行为模式。OpenAI 公司为解决该问题，以预览版的形式推出私密安全处理（Private Safety Processing），该机制会在不让 OpenAI 员工接触底层内容的前提下，利用自动化系统分析关联交互中的风险模式。该系统适用于客户自行控制基础设施中的内容，也适用于 OpenAI 提供的存储。在后者场景中，客户内容由客户控制的密钥加密，OpenAI 员工不持有这些密钥，因此无法访问底层提示词和回复。当系统识别出风险后，OpenAI 只会收到范围受限的安全信号，用于说明涉及的活动类型，并据此判断是否需要采取处置措施。即使内容被标记，员工仍无法查看客户内容。客户可通过自身系统中的信息调查警报和处置决定；如需申诉、说明合法活动，或协助核查已确认的滥用行为，客户可自行选择向 OpenAI 提供相关信息。OpenAI 称，私密安全处理目前正与早期客户测试。该公司计划于 9 月开始推出该能力，并发布技术白皮书。OpenAI 表示，后续会向客户提前说明更新内容、其对既有承诺的影响，以及客户规划所需的时间和支持。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/991/868.htm", "publishedAt": "2026-08-19T22:58:16+00:00"}, {"title": "Meta 推出 Meta AI 原生 Mac 应用：支持窗口共享、跨应用听写", "summary": "IT之家 8 月 20 日消息，Meta 今天推出了全新的 Mac 版 Meta AI 应用，目前以测试版形式提供。这款应用主要面向企业和内容创作者，并与 Facebook 和 Instagram 集成。应用内置分析工具，可以回答有关账号表现的问题，同时还支持连接 Google Workspace，以访问相关文档。需要注意的是，使用 Google Workspace 访问功能必须拥有专业版 Facebook 或 Instagram 账号。Meta 表示，用户可以在使用过程中通过屏幕捕捉共享某个窗口，从而让 Meta AI 根据当前正在处理的内容提供建议。此外，该应用还内置了听写功能，可以在 Mac 上的所有应用中使用。Meta 还在旗下多个平台上为企业用户增加新的 Meta AI 功能。借助这些功能，AI 助手可以完成重复性任务和提醒，并生成演示文稿、文档以及电子表格。不过，内容创作者和企业在启用 Meta AI 时可能需要谨慎考虑隐私问题。Meta 的隐私政策明确指出，用户“与 Meta AI 功能进行的互动”将被用于训练其模型。据IT之家了解，Meta AI 可以免费使用，但 Meta 也提供 Meta One 订阅方案，可以提高使用频率限制。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/991/866.htm", "publishedAt": "2026-08-19T22:45:30+00:00"}, {"title": "OpenAI 因安全问题突然停训GPT-6！网友：当你造出一个神，就不可能再给它拴上绳子", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/BLfF9zUGrzpqJ5QbSBJD?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-19T20:14:12+00:00"}, {"title": "广汽传祺向往 S9 获 OTA 3.0 推送，升级华为乾崑智驾 ADS V4.1、鸿蒙座舱 5 等", "summary": "IT之家 8 月 19 日消息，广汽传祺今日宣布，传祺向往 S9 汽车已开启 OTA 3.0 升级推送，将更新华为乾崑智驾 ADS V4.1、鸿蒙座舱 HarmonySpace 5 等，支持巡航泊车、侧向防护、双控驻车通风等功能。据IT之家此前报道，去年 9 月，广汽传祺向往 S9 乾崑“大家庭智能旗舰 SUV”上市发布，标配华为 ADS 4 Max、宁德时代 44.5 度骁遥超级增混电池、广汽超级智电四驱，22.99 万元起。相关阅读：《22.99 万元起广汽传祺向往 S9 乾崑汽车上市，标配华为 ADS 4 Max 超阶版》延伸阅读本次 OTA 3.0 升级中，华为乾崑智驾 ADS V4.1 新增了巡航泊车功能，车辆在地库、园区低速巡航时可直接点选沿途空闲车位自动泊入，无需停车操作；新增倒车安全提示升级，可识别倒车盲区风险并在屏幕显示红色高亮标记配合主动预警；新增侧向来车主动防御，面对邻车近距离加塞、强行变道切入时，车辆会在安全范围内同步制动并主动避让；城区领航辅助方面，适用范围扩容，激活更便捷。鸿蒙座舱 HarmonySpace 5 方面，新增车载 AI 大模型进阶功能，可回答车辆保养、用车知识等各类问题，问答响应更快；新增视听搜索体验升级，百科内容搭配视频资源，支持语音控制播放；新增语音搜索直达导航，说出目的地后 AI 检索即可一键发起导航；新增驻车通风支持触屏与语音双控制，可提前设定，人离车后自动执行；新增一键露营大床模式，可联动调节一二排座椅快速铺开露营大床。广汽传祺向往 S9 定位中大型 SUV，车身长宽高分别为 5060mm×1950mm×1760mm，轴距 2930mm，提供 5 座及 6 座可选。车内配备 12.3 英寸液晶仪表、15.6 英寸中控屏及 17.3 英寸后排低蓝光护眼娱乐屏。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/991/858.htm", "publishedAt": "2026-08-19T15:09:52+00:00"}, {"title": "为 5 万亿参数超大模型“铺路”？消息称字节跳动调整 Seed 基模团队组织架构", "summary": "IT之家 8 月 19 日消息，晚点 LatePost 今天（19 日）晚间发布消息称，字节跳动的大模型部门 Seed 已于上周完成了新一轮的组织调整。其中最关键的部分是 Seed Foundation Model （Seed 基础模型）成立了四个新的一级部门：Pretrain Data：负责人李成刚。由原先分散在文本模型、编程、视觉理解和语音等方向的预训练数据团队合并而来，统一负责新 Omni 模型的多模态数据，以及超大模型预训练所需的数据工作。Horizon RL：负责人唐晟宇。整合了此前散落在后训练、推理和视觉理解的后训练团队，主要负责强化学习，提升模型的基础智能上限。Product Posttrain-Work：负责人秦禹嘉。新部门主要服务 B 端应用，负责 Agentic 模型的整合与发布，并针对办公场景优化模型的 Agentic 能力，包括支持豆包和 Dola 的任务模式。Product Posttrain-Chat：原本由朱文佳负责的 Application 团队更名而成，主要服务 C 端应用，负责对话模型的整合与发布，与 Product Posttrain-Work 分工协作。四个新部门的负责人均向吴永辉汇报。此外，Seed 还为 AI 安全及其他前沿探索方向分别任命了负责人。Seed 在这次调整公告中提到：“合并相似工作、减少 overlap（重合），内聚在一起”。在此之前，Seed 主要按照模态和研究方向划分团队，文本、代码、视觉、推理等方向都有自己的数据、后训练团队。这一机制在大模型研发早期利于快速补齐不同能力，但团队间的边界随着研究方向增多而变得越来越模糊，导致出现了“重复造轮子”的情形，提高了跨团队沟通和协作的成本。据IT之家了解，本月早些时候，该媒体发布了字节跳动正在讨论训练参数规模超 5 万亿模型的消息。该模型将超过阿里的 Qwen 3.8-Max（2.4 万亿参数）和月之暗面的 K3（2.8 万亿参数），也是目前国内已知参数规模最大的模型。通常而言，模型规模越大，智能水平往往越高，不过该计划仍处于早期阶段。而这一计划，也给了字节跳动打破原有团队边界和分工模式的更强决心和动力。调整中的一个明显变化，就是将负责应用后训练的团队按照用户任务拆分为 Work 和 Chat 两个方向。相关阅读：《国内已知最大规模！消息称字节跳动正讨论训练超 5 万亿参数模型》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/991/856.htm", "publishedAt": "2026-08-19T15:00:59+00:00"}, {"title": "小米新一代人形机器人与观众实时互动视频发布：由大模型驱动，自主理解、判断并完成动作", "summary": "IT之家 8 月 19 日消息，小米官方今日宣布，小米新一代人形机器人亮相 2026 世界机器人博览会，登陆「具身花园」展台。IT之家注意到，小米官方刚刚放出小米新一代人形机器人与观众实时互动的视频。据介绍，从递花、握手到碰拳、比心，这些看似简单的动作背后，由大模型驱动机器人自主理解、判断并完成动作。根据规划，8 月 20 日起，展台将对普通观众开放。这意味着明天进场的观众将有机会与小米新一代人形机器人展开互动。相关阅读：《小米新一代人形机器人亮相 2026 世界机器人博览会，8 月 20 日起展台将对普通观众开放》《卢伟冰：小米机器人将在 2026 世界机器人大会上首次面向公众亮相》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/991/848.htm", "publishedAt": "2026-08-19T14:23:51+00:00"}, {"title": "“AI 教母”李飞飞：身为科技从业者，应把“AI 能带来什么好处”讲得更清楚", "summary": "IT之家 8 月 19 日消息，据彭博社今天（19 日）晚间报道，“AI 教母”李飞飞认为，包括她自己在内的科技从业者，还需要更好地向公众说明人工智能能带来什么价值。她同时警告，美国社会对 AI 的反对情绪不断升温，可能给全球带来风险。李飞飞在接受采访时表示：“美国对世界的影响非常重要。如果我们不能展现出积极对待 AI 的态度，也无法指明一条积极的发展道路，最终所有人都会受损。”她进一步指出，美国应该成为“榜样”，向外界证明 AI 能够创造“巨大的经济价值”。过去一年，美国多地对 AI 数据中心的抵制明显增加，争议主要集中在数据中心对水资源和能源的消耗。皮尤研究中心调查显示，随着 AI 越来越多地进入日常生活，一半美国人对这种趋势的担忧超过了期待。另一边，亚洲许多国家对 AI 的态度则更加积极。李飞飞认为，这种现象与当地从基础教育阶段就高度重视 AI 有关。“除了科学家，我也是教育工作者和学者，所以有时候我会反思，我们过去并没有很好地与公众沟通。”李飞飞的研究为许多当代 AI 技术突破奠定了基础。她参与创建的学术项目 ImageNet 收录了数百万张图像，并推动了计算机识别图像中物体的能力取得重要进展。此后，李飞飞创办了 World Labs，重点开发所称的“世界模型”。这类 AI 模型旨在理解三维世界，并在其中自主导航和作出决策。今年 2 月，World Labs 完成了一轮 10 亿美元（IT之家注：现汇率约合 67.57 亿元人民币）融资。她认为，World Labs 研发的技术未来可以应用于机器人、医疗、教育等多个领域。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/991/841.htm", "publishedAt": "2026-08-19T13:35:57+00:00"}, {"title": "全新捷途山海 L7 PLUS 上市：顶配搭载激光雷达，超级置换价 10.99 万-15.99 万元", "summary": "IT之家 8 月 19 日消息，全新捷途山海 L7 PLUS 今天（19 日）晚间正式上市，新车提供 1.5L C-DM 经济型、1.5TD C-DM 性能型两种动力共 6 种配置，官方指导价 11.99 万-16.99 万元，超级置换价 10.99-15.99 万元。1.5L C-DM 经济型220km 五座启航版：官方指导价 11.99 万元，超级置换价 10.99 万元220km 五座标准版：官方指导价 12.99 万元，超级置换价 11.99 万元220km 五座舒适版：官方指导价 13.99 万元，超级置换价 12.99 万元1.5TD C-DM 性能型220km 五座精英版：官方指导价 14.59 万元，超级置换价 13.59 万元220km 五座豪华版：官方指导价 15.59 万元，超级置换价 14.59 万元220km 五座激光雷达旗舰版：官方指导价 16.99 万元，超级置换价 15.99 万元该车采用最新的家族设计语言，搭载猎鹰 700 智能驾驶辅助系统。动力方面采用 1.5T 插混系统，配备 32.66kWh 电池组，全系标配 220km 纯电续航。据IT之家了解，全新捷途山海 L7 PLUS 采用最新的家族设计语言，顶配车型配备了激光雷达，搭载猎鹰 700 智能驾驶辅助系统。此外，新车内置高通骁龙 8255 智舱芯片，提供云朵舒适座椅、车载冰箱、二排小桌板等实用配置。新车长宽高分别为 4810/1930/1705mm，轴距为 2820mm。该车座舱采用 10.25 英寸仪表屏 +15.6 英寸可左右 10 度旋转的中控屏，搭载 TOUR OS 3.0 智慧 AI 座舱系统，车机内置语音大模型，还配备了伯牙之音 12 扬声器，12 通道独立功放，7.1 全景声道布局。动力方面，全新捷途山海 L7 PLUS 将保留在售车型的 1.5T 插混动力系统。电池方面新车全系搭载 32.66kWh 电池组，标配 220km 纯电续航。其中，1.5TGDI 混动发动机版本最大功率 115kW，峰值扭矩 220N·m，发动机热效率 45.79%；综合最大功率 300kW，峰值扭矩 500N·m。1.5L 混动专用发动机热效率 46.09%，最大功率 82kW，峰值扭矩 137N·m；综合最大功率 267kW，峰值扭矩 417N·m。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/991/837.htm", "publishedAt": "2026-08-19T13:14:39+00:00"}, {"title": "广汽埃安焕新 LOGO 首车 Ray7 亮相，搭载新一代华为 DriveONE 多合一电驱", "summary": "IT之家 8 月 19 日消息，在今晚的埃安超级纯电诞生夜活动上，广汽埃安焕新 LOGO 第一车 Ray7 正式亮相，主打“超高颜值、超级底盘、超级三电、超级智能”。据介绍，广汽埃安焕新 LOGO 首车 Ray7 拥有“闪电黄”和“仲夏紫”两款车色，提供 5 米级越级尺寸车身，采用经典运动姿态 + 低趴宽体设计，并配备量子星环前后灯组。新车还拥有豪车级车漆 + 光影型面设计，支持 0.22Cd 低风阻。新车整车控制全面电气化，全球首发芯片级驱制融合架构，全球首搭华为 EMB 全电线控制动，并配有华为 iTRACK 智能扭矩控制系统。广汽埃安 Ray 7 还采用铝混前双叉臂 + 后五连杆悬挂，辅以前后稳定杆，同时配有 FSD 可变阻尼悬架 + HRS 液压回弹止动器。广汽埃安 Ray 7 拥有全新热管理系统 + 28 合 1 热管理模块，搭载新一代华为 DriveONE 多合一电驱，内置宁德时代整包电池，采用弹匣电池 2.0 方案。新车还拥有文远知行 L4 级同源大模型算法，配备 27 个车规级全视角传感器，含 192 线激光雷达 + 3 颗 4D 毫米波雷达，支持无导航漫游找车位等功能。工信部本月早些时候公布的申报信息显示，广汽埃安 Ray 7 搭载华为数字能源技术有限公司的 180kW 峰值功率电机，配备时代广汽动力电池有限公司（宁德时代、广汽、埃安合资）、因湃电池科技有限公司（广汽埃安旗下自研电池企业）的电池。据IT之家此前报道，“Ray”是广汽埃安今年 7 月官宣的全新车系，首款车型“Ray 7”定位是“年轻人热爱的超级纯电轿车”。该车尺寸为 4960×1900×1455mm，轴距 2920mm。相关阅读：《广汽埃安 Ray 7 纯电轿车申报：华为 180kW 电机、宁德时代 / 因湃电池》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/991/827.htm", "publishedAt": "2026-08-19T12:38:43+00:00"}, {"title": "上任仅半年，微软 AI 部门首席营销官安德烈娅 · 马拉德被曝即将离职", "summary": "IT之家 8 月 19 日消息，据《商业内幕》今天（19 日）透露，微软 AI 部门首席营销官安德烈娅 · 马拉德上任仅约六个月，就已经开始逐步准备卸任。微软在内部邮件中宣布，马拉德计划离开公司。一份 6 月 30 日内部备忘录显示，微软高管优素福 · 梅赫迪宣布，马拉德计划 8 月带家人迁往欧洲，以便陪伴身体欠佳的父亲，因此将逐步退出现有职务。▲ 安德烈娅 · 马拉德的 X 平台头像微软已经确认马拉德的离职安排，她将在明年初之前继续以顾问身份留在公司。备忘录写道：“我非常感谢她为加快 Copilot 营销工作带来的活力，以及以消费者为中心的理念；安德烈娅在推动更加统一的策略方面发挥了重要作用，这其中包括单一应用体验。”两名知情人士表示，马拉德离职也与微软 AI 部门近期调整战略有关。目前，微软正重新审视消费者营销方式，把面向个人用户和企业用户的 Copilot 应用合并成一个应用。作为微软的旗舰生成式 AI 产品，Copilot 整体表现仍落后于 ChatGPT 和 Claude 等竞争产品。据IT之家了解，Copilot 营销工作将统一交由微软高管贾里德 · 斯帕塔罗负责，微软 AI 部门也没有直接补上马拉德职位的计划。马拉德所在的微软 AI 部门近几个月一直处于调整期。今年 3 月，微软将微软 AI CEO 穆斯塔法 · 苏莱曼调往新岗位，负责一个专注于超级智能的团队，同时把原本分散的企业和消费者 Copilot 团队整合到一名新高管旗下。马拉德在消费者营销领域资历深厚，曾担任 Pinterest 首席营销官超过 7 年。更早之前，她负责 Gap 旗下运动休闲品牌 Athleta 的营销工作，也曾出任虚拟医疗公司 Omada Health 首席营销官。今年 1 月，她离开 Pinterest 加入微软 AI 部门。当时，她认为 AI 是自己一生中影响最深远的一次技术变革。“我们肩负着巨大的责任，必须把这件事做好。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/991/823.htm", "publishedAt": "2026-08-19T12:14:31+00:00"}, {"title": "算力互联、调度协同、生态共创｜开源中国携手超智算科技、共绩科技达成战略合作", "summary": "国务院《AI+行动意见》强调加强智能算力互联互通和供需匹配。工信部《算力互联互通行动计划》和\"毫秒用算\"专项行动提出\"盘活存量、精准对接、弹性供给\"，推动算力从\"重硬件囤积\"转向\"重高效调度\"。超智算科技（S·AIDC）与共绩科技、开源中国就算力资源共享、算网平台建设、弹性算力协同、技术与商业信息共享、用户生态等...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502010", "publishedAt": "2026-08-19T11:01:35+00:00"}, {"title": "GLM-5.3 拿下 AA 评测 60 分，将前沿模型的单任务成本打到了最低", "summary": "智谱今日凌晨上线了 GLM-5.3 API。在 Artificial Analysis Intelligence Index 评测中取得 60 分，与 Claude Fable 5、GPT-5.6 Sol 同处全球前沿区间，与 Kimi K3 并列开源模型第一。三个主攻方向：复杂编码、防御性网络安全、长程任务处理。 但最值得关注的数据不是分数。智谱官方发布的「智能—成本」散点图上，GLM-5...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502007", "publishedAt": "2026-08-19T08:21:30+00:00"}, {"title": "具身数据底座开卖，首发5100元：机器人训练数据有了新解法", "summary": "构建全栈物理AI基础设施", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/475477.html", "publishedAt": "2026-08-19T07:42:27+00:00"}, {"title": "Hugging Face 夏季开源报告：中国模型在前沿碾压，但下载量靠的是小模型", "summary": "Hugging Face 发布了 2026 年夏季开源模型观察报告，覆盖 1 月到 8 月的数据，包含六个核心发现，内容如下。 第一，中国实验室跳过梯度，直接往前沿冲。 2026 年几乎每个月，中国实验室发布的最大开源模型都超过美国。中国月均天花板在 754B 到 2.78T 参数之间，而美国在 7 个月里有 5 个月不超过 130B。小米、蚂蚁、美团...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502004/huggingface-state-of-open-models-summer-2026", "publishedAt": "2026-08-19T07:03:09+00:00"}, {"title": "OpenAI 紧急暂停新模型训练，AI 开始进入「越聪明越危险」阶段", "summary": "更聪明的模型，也是更危险的模型。#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1675512?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-08-19T03:28:17+00:00"}, {"title": "豆包视频通话升级，火山引擎多模态传输系统提供技术支撑", "summary": "点击 19 日消息，据彭博社今天（19 日）报道，皮尤研究中心调查显示，美国最年轻的一批劳动者对 AI 的怀疑态度正愈发增强，他们越来越担心技术进步会造成大规模岗位流失。自皮尤 2021 年开始进行这项调查以来，首次有超过半数的 30 岁以下成年人对 AI 的担忧开始多于期待。最年轻群体的转变尤其显著：过去最看好 AI 的发展潜力的一群人，现在却已经成为对 AI 最怀疑的人群之一。这一年龄段近四分之三的成年人还认为，AI 会减少就业机会，比例高于两年前的 61%。此外，其他大多数年龄群体也持类似态度。这样的结果进一步体现了美国年轻人与 AI 之间的矛盾关系。他们既是最熟练使用 AI 的人群之一，又恰好在这项技术可能削弱初级岗位之际进入职场，而初级岗位长期以来一直是年轻人进入就业市场的重要入口。这种担忧并不限于年轻人。皮尤数据显示，超过一半美国人对 AI 感到担忧。已经在职场站稳脚跟的人对 AI 的态度反而越来越积极，也进一步支持了一种观点：经验越丰富的劳动者，越可能从 AI 中获益。AI 究竟对美国招聘造成了多大影响，目前仍很难准确判断。AI 快速普及恰逢经济走弱，两种因素难以完全分开。此外，AI 也可能只取代一份工作中的部分任务，而不是整个岗位。IT之家从报道中获悉，已有迹象显示，面向职场新人的招聘正在放缓，美国企业高管也公开谈到，通过 AI 自动完成部分工作可以降低用工成本。相关阅读：《调查发现美国年轻人普遍不信任 AI，以及主张“拥抱 AI”的科技巨头》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/991/853.htm", "publishedAt": "2026-08-19T14:43:39+00:00"}, {"title": "硅谷掀起“晒表”潮：科技公司定制款帝舵腕表成职场身份新象征", "summary": "IT之家 8 月 19 日消息，据《商业内幕》今天（19 日）报道，一些硅谷从业者开始把职业身份“戴”在手腕上，相比在领英展示履历，他们更愿意晒出由瑞士帝舵为所在公司定制的稀有腕表。这波晒表热潮始于本周一。一篇展示谷歌员工定制腕表的帖子在网上流传后，其他科技公司员工也陆续晒出了自己的定制表款。OpenAI 应用研究负责人鲍里斯 · 鲍尔晒出了 OpenAI 定制款，表背刻有“好研究需要时间”。Palantir 战略合作负责人埃利亚诺 · 尤尼斯也展示了公司员工获得的定制帝舵腕表，并透露该款限量 468 枚。从尤尼斯分享的图片来看，表盘只有一个尺寸很小、十分低调的 Palantir logo。曾在 Instagram 任职、目前效力于 Perplexity 的塞巴斯蒂安 · 施派尔也分享了自己的定制腕表。曾在 Facebook 工作 6 年的内特 · 洛伦岑说，公司员工当时同样定制过腕表，“我真蠢，居然没有把这些全买下来”。这些帝舵腕表并不是公司管理层批量发放的普通纪念品，也不同于华尔街一度流行的巴塔哥尼亚马甲。真正发起定制的通常是员工自己组织的腕表收藏团体。成员需要先召集足够多的买家，达到帝舵规定的最低订购数量后才能下单。根据奢侈腕表新闻网站 Grey Market 执行编辑 Powerfunk 介绍，帝舵定制腕表至少需要订购 40 枚，从下单到完成生产大约需要 6 个月。参加定制的买家通常需要按零售价付款。谷歌定制款采用的帝舵领潜型，普通版本零售价约为 4,500 美元（IT之家注：现汇率约合 30,406 元人民币）。由于每款定制腕表数量都很少，而且通常只有发起定制的团体成员才有资格购买，一旦流入二手市场，就可能变成价值不菲的收藏品。一枚采用 Chrome 恐龙图案的谷歌主题帝舵腕表今年早些时候在拍卖中卖出超过 1 万美元（现汇率约合 67,569 元人民币），苹果“海盗”定制款也曾获得 13,500 美元（现汇率约合 91,218 元人民币）的报价。同系列普通腕表的二手价格通常只有这些定制版本的一小部分。目前，奢华腕表也越来越成为科技行业大人物展示身份的标志。马克 · 扎克伯格收藏了价值数百万美元的稀有腕表，OpenAI CEO 萨姆 · 奥尔特曼则曾佩戴一枚售价 48 万美元（现汇率约合 324.3 万元人民币）的超限量版高珀富斯腕表，该款全球仅生产 33 枚。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/991/849.htm", "publishedAt": "2026-08-19T14:29:33+00:00"}, {"title": "《异环》全球流水破 20 亿元：完美世界 2026 上半年由盈转亏 1.18 亿元，多款在研项目储备中", "summary": "IT之家 8 月 19 日消息，完美世界今日发布了 2026 年半年度报告。上半年公司实现营业收入 27.51 亿元，同比下降 25.47%；归属于上市公司股东的净亏损为 1.18 亿元，上年同期为盈利 5.03 亿元，同比由盈转亏。数据显示，完美世界上半年经营活动产生的现金流量净额为 6.47 亿元，同比增长约 29%。公司游戏业务实现收入 26.39 亿元，同比下降 9.19%；影视业务收入 1.03 亿元，同比大幅下降 86.56%。据介绍，公司自研的超自然都市开放世界 RPG《异环》于今年 4 月底开启全球公测，截至 8 月 18 日全球累计流水已突破 20 亿元。其中官方渠道（官方 PC+ 官方安卓）累计流水占比近 60%。该游戏面向全球 180 余个国家和地区发行，同步登陆 PC、安卓、iOS、Mac、鸿蒙及 PlayStation 5 六大终端。受企业会计准则影响，新游戏公测初期的市场推广费用于发生当期一次性确认，而充值流水在玩家生命周期内分期确认为收入。这种收入与费用的阶段性错配导致《异环》在上半年财务报表上形成了一定亏损，其业绩贡献预计将从第三季度起逐步释放。在研游戏方面，公司目前有《梦幻新诛仙：轻享》《代号 Castle》《代号普洱》《代号 J1》《代号 F》《代号 U1》《代号 ZH》《代号 W1》《代号 L5》等项目，涵盖轻度 MMO、二次元卡牌、模拟经营卡牌、SLG、休闲游戏及小游戏等品类。其中《梦幻新诛仙：轻享》已定档 2026 年 9 月 3 日公测。电竞业务方面，完美世界今年 5 月举办 2026 年反恐精英亚洲邀请赛（CAC 2026）；影视业务继续坚持“减量提质”策略，《夜色正浓》《九个弹孔》等剧集已播出，储备作品《醒来》《云襄传之将进酒》等正在推进中。此外，公司已将 AI 工具全面融入研发管线，通过 AIGC 平台集成 AI 生图、数字人视频、2D 转 3D 等多个工具以提升研发效率。相关阅读：《完美世界预计 2026 上半年净亏损 8000 万元 ~1.2 亿元，〈异环〉业绩错配》《完美世界：〈异环〉全球首日流水超 1 亿元，核心指标优于〈幻塔〉同期水平》《开放世界 RPG 游戏〈异环〉开启全平台公测：覆盖安卓、鸿蒙、iOS、Windows、Mac 等平台，多端账号数据互通》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/991/835.htm", "publishedAt": "2026-08-19T13:10:30+00:00"}, {"title": "乘朱雀三号上天：中国移动首个天基通算融合载荷成功入轨，后续将启动智融合技术试验", "summary": "IT之家 8 月 19 日消息，中国移动研究院今日宣布，中国移动“天基智算载荷 1.0”在东风商业航天创新试验区搭载“鸿鹄 03 星”随朱雀三号重复使用遥二运载火箭成功发射入轨，后续将启动天基通算智融合技术试验。据介绍，太空算力已成为天地一体算力建设前沿探索的热点方向。结合该领域核心技术，中国移动联合中国科学院计算所、鸿擎科技攻关研制“天基智算载荷 1.0”。其采用全国产化软硬件体系，内置中国移动自研轻量化星载核心网和智能体，是中国移动首个面向分布式边缘计算的天基通算智融合载荷。该载荷基于中国移动原创的天基算联网技术体系设计，攻关星地通算融合组网、星载轻量化智能体协同控制与在轨通算智一体推理优化等关键技术，可实现星地智能组网通信及在轨高效数据处理。后续，将重点开展三项在轨测试：一是星地核心网智能组网架构验证，探索天地一体网络演进新范式；二是天基通算智融合技术验证，推动通信、计算与智能高效协同；三是星地智能通信业务验证，挖掘卫星互联网新型算力应用形态。据IT之家今日早些时候报道，朱雀三号遥二运载火箭在东风商业航天创新试验区发射升空，火箭一子级按预定程序成功着陆于甘肃省民勤县朱雀三号着陆场坪，飞行任务取得圆满成功。这是我国在重复使用火箭关键技术上取得的又一重大突破，朱雀三号成为我国首款成功入轨并实现陆地回收的运载火箭。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/991/802.htm", "publishedAt": "2026-08-19T10:55:11+00:00"}, {"title": "AI for Science开始“动手”了：机器人正式走进国家级实验室", "summary": "源络科技，推动AI for Science走进实验室3.0", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/475332.html", "publishedAt": "2026-08-19T06:29:57+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "原价 19.99 美元 / 月的 AI 助手免费送，亚马逊 Alexa+ 登陆全美所有受支持的 Fire TV", "summary": "IT之家 8 月 19 日消息，当地时间 19 日（今天），亚马逊宣布将向美国所有兼容的 Fire TV 设备免费提供 Alexa+，不论用户是否订阅 Amazon Prime。升级后，Fire TV 将获得对话式搜索、智能家居控制和 AI 推荐等功能。此前，未订阅 Amazon Prime 的用户使用 Alexa+ 需要每月支付 19.99 美元（IT之家注：现汇率约合 135.1 元人民币），而且这项服务最初只向亚马逊去年秋季发布的新款 Fire TV 设备开放。亚马逊表示，兼容设备会自动升级到 Alexa+，用户不需要额外下载应用，也不用单独订阅。支持范围包括所有现款 Amazon Fire TV Stick、Fire TV Cube、亚马逊 Ember 智能电视，以及海信和松下等内置 Alexa+ 的智能电视。亚马逊的做法延续了消费电子行业扩大 AI 覆盖范围的趋势，这类升级往往会直接推送给用户。谷歌今年早些时候把 Gemini 带到了 Google TV 平台，以 AI 对话模式取代原本较为简单的搜索功能；Roku 去年也为语音助理加入了 AI 能力。厂商通常会用功能使用时长等数据来证明消费者正在接受这些 AI 服务。亚马逊表示，Alexa+ 用户目前在 Fire TV 上的对话次数接近使用原版 Alexa 时的两倍。按照亚马逊的解读，用户已经不再只是把电视当作单纯观看内容的设备，也开始主动使用电视上的 AI 功能。Alexa+ 不再要求用户必须说出具体片名。用户可以直接按照题材、适合年龄或热门程度提出要求，例如“推荐一部评分很高的惊悚片”，或者“一部以强势女性为主角的历史剧”。此外，Alexa+ 还可以用来管理和控制智能家居设备，例如在电视上直接显示 Ring 摄像头的实时画面。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/991/859.htm", "publishedAt": "2026-08-19T15:15:07+00:00"}, {"title": "龙芯胡伟武：3B6600 用 1Xnm 工艺追平 AMD 英特尔 7nm 性能", "summary": "IT之家 8 月 19 日消息，龙芯中科今日在北京举行公司成立 25 周年大会。龙芯中科董事长胡伟武在讲话中表示，基于自研 IP 和自主工艺，龙芯 CPU 性能已达到市场主流产品水平。据介绍，已交付流片的龙芯 3B6600 处理器使用 1Xnm 高自主工艺，实测性能达到采用 7nm 或更先进工艺的市场主流 X86 CPU 水平。IT之家此前报道，龙芯 3B6600 集成 8 个新一代微架构 LA864 核心，是首款采用 LA864 处理器核的芯片。该芯片硅前测试单核性能比上一代 3A6000 提升约 50%。胡伟武在讲话中回顾了龙芯单核性能的演进历程：从 3A1000 到 3A6000，龙芯花了十年时间只做四核，主频从 1.0GHz 提高到 2.5GHz，SPEC CPU2006 定点单核实测性能从 2.5 分提高到 50 分。而在四核 3A6000 完成单核性能补课后，龙芯不到两年就推出了 16 核、32 核、64 核的 3C6000 系列服务器 CPU。龙芯 3B6600 并非孤立成果。胡伟武同时提到，龙芯已经设计出与 NVIDIA 算力密度可比的通用 GPU 核，并系统解决了制约 Linux 桌面几十年的外设兼容问题以及 Windows 浏览器的兼容问题。此外，龙芯首款通用 GPU 芯片 9A1000 也已交付流片（9A1000 定位入门级独立显卡，图形性能大致对标 AMD RX 550，AI 算力达数十 TOPS）。财务数据方面，2025 年龙芯中科全年销售收入 6.35 亿元，比 2024 年的 5.04 亿元增长 26%；毛利润 2.99 亿元，同比增长 91%，毛利率从 31% 提升至 47%。胡伟武表示，龙芯发展的主要矛盾已经开始从产品研发端转向市场销售端，2025 至 2027 年是三年市场转型期，核心方向是从政策性市场走向开放市场。相关阅读：《龙芯 3B6600 桌面处理器明年能买到、已交付流片，龙架构考虑适配安卓》《龙芯中科公布产品研发新进展，下一代桌面芯片 3 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
