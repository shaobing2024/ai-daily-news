<script>
const DATA = {"date": "2026-08-30", "generatedAt": "2026-08-30T00:59:15Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "荣耀 Magic8 系列手机首发的 AI 追色功能迎升级，新增支持类“调色盘”新玩法", "summary": "IT之家 8 月 30 日消息，据荣耀研发工程师 @荣耀曹工 分享，荣耀 Magic8 系列手机上首发的 AI 追色功能，云端算法一直在持续升级。他透露，AI 追色的调节功能最近还上线了一个类似“调色盘”的新玩法，可以分“影调”和“颜色”来调整等级。另外，随着 OS 大版本和新产品推进，相机和图库在功能和设计上也一直在持续迭代上线。IT之家了解到，去年 9 月，荣耀官宣与高通联合研发的高效能端侧 AI 模型方案，带来了新一代向量化检索技术，以及更准确高效的端侧多模态感知能力。用户只需一句话驱动智能体，就可以实现“检索目标图片、关键色提取、对目标图片精准追色”的一系列动作。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/996/058.htm", "publishedAt": "2026-08-29T23:18:24+00:00"}, {"title": "iOS 27 版 Siri AI 上线前，苹果 CarPlay 已接入 4 个第三方 AI 应用", "summary": "IT之家 8 月 30 日消息，科技媒体 9to5Mac 昨日（8 月 29 日）发布博文，报道称在苹果 Siri AI 上线之前，苹果车联方案 CarPlay 目前已接入支持 4 款 AI 聊天机器人。IT之家援引博文介绍，苹果自 iOS 26.4 起支持对话类应用接入 CarPlay，计划在今年 9 月推出 iOS 27 后，将 Siri AI 纳入该平台。最新消息称继 ChatGPT、Perplexity、Grok 之后，苹果 CarPlay 界面出现 Meta AI，成为第 4 款接入 CarPlay 的第三方 AI 聊天机器人应用。此次接入尚未全面开放。报道显示，部分用户虽然能在 CarPlay 中看到 Meta AI 图标，但启动时会出现“当前账号暂不支持 Meta AI 体验”的提示。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/996/057.htm", "publishedAt": "2026-08-29T23:11:16+00:00"}, {"title": "英伟达 RTX 5090 显卡供电接口熔毁怎么避免？超频团队直接将电源线焊在 PCB 上", "summary": "IT之家 8 月 29 日消息，巴西超频团队 TecLab 昨日发布视频，展示了一种绕过 RTX 5090 供电接口的改装方案 —— 直接将电源线焊到显卡 PCB 原 16pin 接口的供电线路上，从而抛弃这一接口。如此一来，没有了 16pin 供电接口，就从根本上解决了 16pin 供电接口熔毁的问题。TecLab 此次测试使用的是影驰名人堂 GeForce RTX 5090 D HOF OC LAB XOC。这是一款面向极限超频的显卡，与普通 RTX 5090 不同，该型号配备两个 16pin 供电接口。该团队使用两组供电线，并将其焊接至原 16pin 供电输入对应的 PCB 位置，相当于完全绕过两个显卡侧 16pin 连接器。改装完成后，这张显卡依然能够正常启动并完成测试。当然，这种方案并不适合普通用户。毕竟，它需要直接对价值不菲的显卡进行改造，很可能导致这款接近 5,000 美元（IT之家注：现汇率约合 33,710 元人民币）的显卡直接失去保修资格。TecLab 采用这种方式的主要目的可能是为极限超频提供更高的供电能力。单个 16pin 供电接口官方额定功率最高为 600W，实际承载能力可能更高，但对于极限超频而言，即使是 600W 也无法满足需求。此次改装理论上可以为显卡提供超过 1200W 的供电能力。对于 RTX 5090 极限超频硬件而言，这类功耗水平并非完全没有先例，部分面向极限超频的型号甚至支持最高约 2500W 的功耗限制。此次演示中，显卡在改装后能够正常运行并完成测试，但这并不能证明这种直接焊线方案适合长期使用，也无法说明它能够彻底解决 RTX 5090 供电接口过热或熔融问题。TecLab 也指出，长期运行是否会对显卡造成损伤仍有待观察。相关阅读：《内存占用约 35MB：网友 AI 自制开源工具，避免华硕 RTX 5080 和 5090 显卡烧熔》《2500W！微星 RTX 5090 Lightning Z 显卡极限 BIOS 遭泄露》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/996/045.htm", "publishedAt": "2026-08-29T14:12:54+00:00"}, {"title": "英伟达“看中”Hugging Face，开放权重 AI 模型成硅谷热门收购目标", "summary": "IT之家 8 月 29 日消息，据外媒 TechCrunch 今天（29 日）报道，英伟达有望完成本周最受瞩目的一笔科技交易。市场正等待公司确认一项据称价值 130 亿美元（IT之家注：现汇率约合 876.47 亿元人民币）的收购案，目标是开放权重 AI 模型平台 Hugging Face。Hugging Face 承担着“AI 时代的 GitHub”这一角色，为不依附于头部 AI 实验室的模型提供开发、分享和部署生态。英伟达近期连续把巨额资金投入这一领域。此前，该公司就与开放权重模型公司 Poolside 达成 60 亿美元（现汇率约合 404.52 亿元人民币）协议，后者大部分员工将转投英伟达。两周前，Stripe 又以超过 70 亿美元（现汇率约合 471.94 亿元人民币）收购 OpenRouter，而后者主要帮助企业接入开放权重模型。一个以开放和免费分享成果为基础的领域突然吸引如此庞大的资本，背后反映的是 AI 产业格局的变化。英伟达需要降低对大型云服务商和头部 AI 实验室的依赖。OpenAI 和谷歌等模型厂商反过来也开始自研推理芯片，本周早些时候，OpenAI 就详细介绍了 Jalapeño。模型公司大举进入芯片领域之际，英伟达也希望进入模型市场，从中分一杯羹。英伟达自己拥有 Nemotron 开放权重模型系列，但目前采用规模有限。如果 130 亿美元（现汇率约合 876.47 亿元人民币）收购 Hugging Face 的交易成真，英伟达就能直接掌握美国最大的开放模型开发者平台之一，接触庞大的用户群，并进一步推动开发者使用英伟达芯片和技术标准。AI 推理越来越昂贵，也让更多企业开始寻找成本更低的替代方案，月之暗面、DeepSeek 和阿里巴巴等中国公司推出的模型受到的关注与日俱增。报道指出，开放权重模型目前仍不是主流，但采用率正在上升。Ramp 根据企业支出数据统计，约 6% 的公司使用开放权重模型；Jellyfish 的数据则显示，软件工程师中的使用比例只有 2%。Jellyfish AI 产品负责人尼克 · 阿尔巴兰告诉 TechCrunch，开放权重模型特别适合客服聊天等需要大量重复推理的业务。因为任务量大、问题高度重复，企业可以针对自己的场景调整模型，用更低成本处理这些请求。Stripe 收购 OpenRouter 时也强调了成本和算力效率。Stripe 联合创始人兼 CEO 帕特里克 · 科里森表示：“词元是企业利用 AI 开发产品时的核心货币，现实世界中的经济潜力能否释放，关键在于如何高效利用稀缺的算力资源。”编程和智能体任务的情况有所不同。这类任务变化更大，也需要更复杂的推理，因此头部闭源模型通常仍占优势。专有模型厂商不仅接入方式更方便，有时还会补贴部分词元成本。阿尔巴兰认为，等企业把自己的 AI 工作流程打磨得更成熟，采用开放模型会变得容易得多。目前企业考虑开放模型，首要原因仍是希望获得更强的控制权和可配置性，而不是单纯为了省钱。“目前真正达到这种状态的公司还不多…… 但如果头部 AI 实验室继续涨价，越来越多企业至少会被迫考虑开放模型。等企业的 AI 工作流程成熟得多之后，自托管模型才值得投入。”Fireworks CEO 林乔也押注开放模型的发展。Fireworks 为企业提供开放权重模型的路由和托管服务，经常被认为可能成为科技巨头的收购目标。当前，Fireworks 每天处理 40 万亿词元，处理量超过 Gemini 和 OpenAI 各自的 API。Fireworks 看好的是模型越来越多元化。随着大语言模型数量增加、能力不断提升，企业可以更容易地针对自己的业务训练专用模型。林乔上周指出：“每一家应用公司都应该考虑聘请内部研究员。他们可以利用自己的产品和产品数据构建专属模型。未来真正属于专业化智能。每家公司最终都应该针对不同应用场景拥有自己的模型，而且这个过程会逐渐实现自动化。”报道分析称，AI 无论作为工具还是商业模式，其实仍处于非常早期的发展阶段。OpenAI 和 Anthropic 目前占据领先位置，并不意味着这种格局会一直持续。科技巨头开始避免把全部资源押在少数头部 AI 实验室身上，开放技术因此显得越来越有吸引力。相关阅读：《曝英伟达洽谈超 130 亿美元收购 Hugging Face，微软也想插一脚》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/996/041.htm", "publishedAt": "2026-08-29T13:39:19+00:00"}, {"title": "Anthropic 揭示“AI 训练 AI”新方法，比人类研究员成本更低、速度更快", "summary": "IT之家 8 月 29 日消息，用 AI 模型训练其他 AI 模型，正成为新一代 AI 实验室重点探索的方向。当地时间 28 日，Anthropic 研究员计划的一名研究人员展示了这种思路真正落地后可能呈现的样子。Anthropic 发布了最新论文《自动化研究员能够可靠缓解对齐失效》，介绍如何利用 AI 系统改善模型在一系列对齐基准测试中的表现。研究团队针对 10 种具体的失调行为设置测试，自动化系统最终让全部 10 项指标都有所改善，同时没有牺牲模型的整体能力。这套系统由 Anthropic 研究员计划成员陈岳翰（音译）领导开发，工作流程与传统科研相似。自动化系统会先查阅已有文献，提出训练方法，再按照方案训练模型 30 分钟，并通过多轮尝试逐步提高测试成绩。有效方案会留下，无效方案则被淘汰，使整个研究过程能够快速扩大规模。论文指出，总体来看，这些结果初步证明，自动化对齐后训练有望在近期成为一种真正可行的方法。这项研究也向递归自我改进迈出了一步，而许多人把递归自我改进视为 AI 发展的下一个重要阶段。如果 AI 模型能够改进自身的对齐训练方法，那么进一步改进更广泛的训练流程也并非没有可能。到了那一步，人类 AI 研究人员甚至可能逐渐失去存在的必要。论文也直接比较了自动化对齐研究员（AAR）和人类研究人员的表现：“最优秀的 AAR 方法平均只需 6 小时，就能超过经验丰富的人类研究人员提出的方案。人类引导的研究方向，并不会导致更强的表现。”成本差距同样明显。“AAR 每小时只需要大约 4 美元（IT之家注：现汇率约合 27 元人民币）的 API 推理成本，而我们支付给人类研究人员的费用是每小时 150 美元（现汇率约合 1,011 元人民币）。”不过这套方法仍有明显限制。自动化系统的效果首先取决于基准测试能否准确反映真正的对齐目标，即使测试本身可靠，建立和长期维护这些基准仍需要大量投入。自动化研究员依赖的研究文献同样需要持续维护和扩充。参考Automated researchers can reliably mitigate alignment failures", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/996/038.htm", "publishedAt": "2026-08-29T13:25:27+00:00"}, {"title": "Debian 社区议案表决：开发者可使用生成式 AI，人类负最终责任", "summary": "IT之家 8 月 29 日消息，据科技媒体 Linuxiac 今天报道，Debian 社区的大语言模型投票议案近日迎来表决。投票结果显示，大部分开发者支持负责任地使用生成式 AI。IT之家从原报道获悉，本次投票一共有 9 种选项，范围从完全禁止大语言模型辅助开发，到允许特定条件使用 AI。投票结果将影响 Debian 开发者工作方式，以及开发组未来如何应对新 AI 工具。本次投票采用孔多塞投票制，第 5 个选项“负责任地使用生成式 AI”最终胜出。同时，Debian 新政策并不禁止软件开发、文档编写流程使用生成式 AI。该政策承认，人类可在负责任地使用 AI 情况下，提升生产力，让开发者能够将更多精力放在其他任务上。不过新政策要求，所有 AI 辅助生成的代码和文档，必须满足质量、法律合规要求，最终责任由人类开发者承担。此外，Debian 不会强制贡献者标注其代码是否使用 AI。虽然官方鼓励披露，但并不要求必须注明。相关阅读：《Debian 项目发起议案，讨论是否允许 AI 大模型参与开发》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/996/035.htm", "publishedAt": "2026-08-29T13:11:13+00:00"}, {"title": "Anthropic 安全框架自动降级：Claude 误删开发者 700 GB 主目录，自动化清理反成灾难", "summary": "IT之家 8 月 29 日消息，开发者 Sebastien Guillemot 本周三在 X 上反馈称，他在测试 AI 智能体的文件删除防护机制时遭遇严重事故，Claude 直接给他删除了大约 700GB 数据，包括整个用户主目录，相当于一周的工作成果。据称，事故发生前，Anthropic 的安全机制因判断任务存在风险，自动将执行任务的模型降级至 Opus 4.8。据介绍，他本人经常使用 AI 智能体，但他发现这些智能体完成任务后几乎从不清理临时目录中的文件，日积月累之下导致 /tmp 目录中存在大量垃圾。因此，他要求 Claude Fable 编写一个脚本，将每个智能体在 /tmp 下创建独立目录，并在任务结束后自动清理对应文件。核心难点在于确保如何不影响正在使用的文件。为了避免误删，Fable 最初建议加入检测正在运行的智能体、延迟清理对应目录等逻辑。不过他认为生成的代码过于复杂，要求智能体简化方案。由于脚本涉及直接删除文件，Fable 随后自行进行了一次对抗性安全审查，让另一个实例检查删除逻辑是否存在风险。Anthropic 的安全执行环境随后认为该任务风险较高，并将模型从 Fable 5 自动降级至 Opus 5，最终又降至 Opus 4.8。Opus 4.8 随后执行安全测试。测试过程中，模型尝试将删除命令的目标与 /tmp 以及用户主目录进行匹配，以确认删除操作不会指向这些危险位置。IT之家注意到，测试确实识别出了这些目录涉及风险。但问题出现在测试完成后的清理环节。由于这本身是一项代码测试，脚本需要删除测试过程中产生的数据，而测试逻辑与清理逻辑复用了同一个变量名，导致意外删除了用户的主目录。Guillemot 发现异常后立即终止进程，但为时已晚。约 700GB 数据被删除，其中包括他一周的工作成果。最讽刺的是，在删除了主目录后，Claude“完美地”保留了 /tmp 目录。Guillemot 随后通过 Git 仓库、Nix、会话日志等信息源恢复了大部分数据。但很显然，Git 等版本控制系统和日志只能帮助恢复其中一部分已记录或留存的数据，无法替代完整的独立备份。他指出，如果由编码能力更强的 Fable 5 执行任务，或许能够发现测试与清理阶段复用变量名所造成的逻辑冲突。不过，这一说法属于事后推测，无法确认模型能力差异是否会直接避免此次事故。这起事件也再次暴露出 AI 智能体执行高风险文件操作时的安全问题：即使 AI 能够正确识别危险路径，测试代码本身的逻辑错误仍可能让后续清理步骤绕过此前的安全判断。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/996/031.htm", "publishedAt": "2026-08-29T12:59:20+00:00"}, {"title": "Claude开始训练Claude！4美元一小时，跑赢150美元人类研究员", "summary": "AI「自进化」，越来越近了", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/481223.html", "publishedAt": "2026-08-29T12:50:31+00:00"}, {"title": "OpenAI ChatGPT、Codex 现已支持连接多个谷歌 Gmail 账号", "summary": "IT之家 8 月 29 日消息，OpenAI 开发者体验工程师 Gabriel Chua 今日确认，ChatGPT 和 Codex 用户现可连接多个谷歌 Gmail 和日历账号。据官方介绍，许多用户由于个人和工作安排，可能拥有多个 Gmail 或日历账户。此前 ChatGPT 和 Codex 只能连接一个 Google 账户，对用户来说较为不便。如今 ChatGPT 和 Codex 支持多账户连接后，用户可以打开侧边栏的“插件”，找到 Gmail、Google 日历或 Google 联系人，然后添加多个账户。IT之家注意到，ChatGPT 还可以在需要时，从多个已连接账户中提取相关信息，获得更加完整的通信、联系人关系和日程信息，据此提供更有用、更具上下文关联的回答。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/996/022.htm", "p 更新", "items": [{"title": "Digitimes 称 M6 是苹果 2nm 探路先锋，服务 A20 Pro 芯片量产落地", "summary": "IT之家 8 月 30 日消息，行业科技媒体 DigiTimes 于 8 月 28 日发布博文，报道称 M6 芯片作为苹果首款 2 纳米芯片发布，更主要承担台积电 2 纳米制程的低量验证任务，而 A20 Pro 则是成为拉动 2 纳米产能利用的重要产品。作为苹果首款 2 纳米芯片，M6 采用 12 核 CPU 设计，较 M5 增加 2 个核心，由 2 个超级核心、4 个性能核心和 6 个能效核心构成；GPU 同为 12 核，比 M5 增加 2 核，每个 GPU 核心配备神经网络加速器。M6 另采用双 16 核神经网络引擎，最高支持 32GB 统一内存及 170GB/s 统一内存带宽。IT之家援引博文介绍，M6 的产业意义主要在于以较低出货量，承担了验证台积电 2 纳米量产流程的角色，降低后续大规模导入时的工艺与良率风险。Mac 业务近年占苹果总营收不足 10%，而 iPhone 仍是其主要收入来源；因此，预计搭载 A20 Pro 的 iPhone 18 Pro、iPhone 18 Pro Max 及 iPhone Fold，对台积电 2 纳米制程的订单规模影响更大。相关报道显示，A20 Pro 预计采用台积电 N2 制程及晶圆级多芯片模块（WMCM）封装。台积电 WMCM 月产能预计在 2026 年末达到 6 万片晶圆、2027 年超过 12 万片晶圆。另据台积电对 N2 与 N3E 的公开制程比较，N2 在相同功耗下可提升 10% 至 15% 速度，或在相同性能下降低 25% 至 30% 功耗，晶体管密度提升超过 15%。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/996/071.htm", "publishedAt": "2026-08-30T00:33:48+00:00"}, {"title": "苹果首款 AI 眼镜有望 2027 年亮相：首代无显示屏，瞄准语音与视觉识别", "summary": "IT之家 8 月 30 日消息，科技媒体 9to5Mac 昨日（8 月 29 日）报道，苹果计划最早 2027 年推出其首款 AI 智能眼镜，预估会在 2027 年全球开发者大会（WWDC27）上面向开发者公布，并在当年晚些时候出货。发布节奏方面，该媒体梳理现有爆料信息，认为苹果公司可能会在明年 6 月召开的 WWDC27 期间，面向开发者推出其首款 AI 智能眼镜，邀请开发者提前适配相关软件与服务，产品最早可能于 2027 年 9 月发售。定位方面，该产品并非增强现实（AR）眼镜，预估不带镜片显示系统，因此不会在用户视野中直接叠加数字画面。该产品会配备摄像头，摄像头将用于获取现实环境信息，Siri 可据此回答用户问题、提供场景说明及翻译现实中的标识文字。功能方面，报道显示，用户可借助 Siri 对眼前环境提问、获取情境信息，并翻译现实中的标识文字；系统还可能支持记录特定物体或画面，并在后续按提醒调取。设备预计搭载扬声器，可用于音乐和其他音频内容播放，产品形态也将具备开放式耳机的部分特征。外观方面，苹果据称正在开发 4 类镜框方案，已披露的方案包括大型矩形框、纤细矩形框、较大椭圆或圆形框，以及较小的精致椭圆或圆形框；材料或采用醋酸纤维。颜色方面，消息称苹果计划提供黑色、海洋蓝和浅棕色等 3 种颜色。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/996/053.htm", "publishedAt": "2026-08-29T22:44:37+00:00"}, {"title": "韩国政府计划向全体国民提供免费 AI 服务", "summary": "IT之家 8 月 29 日消息，据《华尔街日报》昨天报道，韩国政府计划向全体国民提供免费生成式 AI 服务，帮助民众处理预约医疗、寻找住房、办理税务等日常事务。IT之家从原报道了解到，韩国政府的“All for AI”计划将于 9 月开启 Beta 测试，并计划今年晚些时候扩大覆盖人口。该计划由韩国两大电信运营商，以及韩国最大消费互联网平台 Kakao 牵头推进。据悉，韩国这项的 AI 服务将与政府系统进行对接，居民可利用服务预约医生、搜索公寓并获取税务方面指导。小型企业可利用其计算税款、政策优惠，家长可以获得教育内容推荐。韩国三大科技联盟计划各自推出 AI 应用，并将 AI 功能整合进现有产品。在政府的扶持下，用户可无限量使用服务，不设 To function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
