const DATA = {"date": "2026-09-06", "generatedAt": "2026-09-06T00:32:00Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "OpenAI 将建立全新框架，承诺未来将更加透明地披露 AI 智能体失控情况", "summary": "IT之家 9 月 6 日消息，OpenAI 发文，宣布将建立全新框架，承诺“更加透明地”向民众披露旗下 AI 智能体“失控”和“失准（Misalignment）”情况。当前，OpenAI 正深陷一系列 AI 智能体逃逸并自主入侵第三方网络的安全丑闻中。在 9 月 4 日时，路透社等媒体刚刚曝光了一起此前被隐瞒的“德国 Wiki 劫持事件”。一批 OpenAI AI 智能体曾入侵一个废弃的德国 Wiki 网站，并将其改造成类似机器人之间交流的留言板。对此，OpenAI 将此次事件称为一起“事故”，并承诺将在未来几周内推出一套全新的透明度框架。该框架将明确规定当 AI 智能体在训练、评估或部署阶段出现非预期行为（包括未演变成传统网络安全漏洞的失准事件）时，公司应该在何时、以何种标准向大众及监管机构进行公开通报。同时，OpenAI 透露公司目前正在与全球数十家政府监管机构合作推进该标准的制定，并呼吁行业同行共同加入。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/859.htm", "publishedAt": "2026-09-05T23:43:55+00:00"}, {"title": "极摩客展出 EVO-X5 Pro 迷你主机：锐龙 AI Max+ PRO 495 处理器，192GB 内存", "summary": "IT之家 9 月 5 日消息，据 Computerbase 报道，极摩客在 IFA 2026 上展出了极摩客 EVO-X5 Pro 迷你主机，搭载 AMD 锐龙 AI Max+ PRO 495 处理器（IT之家注：16 核心 32 线程，Zen 5 架构），极摩客暂未公布新品售价。这款迷你主机配备 192GB LPDDR5X 8533MT/s 统一内存，内存带宽 273GB/s，其中集成显卡（Radeon 8065S）最高可分配使用 160GB，可本地运行 300B AI 模型。报道称，极摩客目前仅规划了顶配规格的旗舰版本。极摩客表示，如果消费者希望使用更小容量的内存、或是对内存需求不高，亦可选择继续在售的 Strix Halo 前代机型。这款迷你主机正面配备了 2 个 USB4 接口，背面则配备了两个 USB4 v2 接口，还有双万兆网口等接口，并提供黑色和银色两款配色；机身前置的功能按键（F-MODE）支持调节 TDP，并提供三档预设模式，用户每次按下按键切换时，屏幕上均会弹出短暂的提示动画予以确认。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/840.htm", "publishedAt": "2026-09-05T15:53:56+00:00"}, {"title": "合成器大厂罗兰 Roland 进军 AI 生成音乐领域，主打“旋律创作”", "summary": "IT之家 9 月 5 日消息，合成器大厂罗兰（Roland）正式进军生成式 AI 音乐领域，新推出了一款数字音频工作站（DAW）插件 Melody Flip。该插件内置约 250 种按照不同音乐类型整理的主题音乐创意合集，名为“Palette”。用户既可以从零开始，让 Melody Flip 生成旋律、和弦进行、贝斯线和鼓点的任意组合，也可以导入参考曲目，让系统根据其中的旋律思路继续创作。Melody Flip 与 Suno、Udio 这类直接生成完整歌曲的工具不同，不会一次生成带有人声和完整编曲的成品，而是提供简单的音乐循环，供用户作为后续创作的起点。用户能够控制的参数也比较有限，无法输入文字提示词再让系统生成一首完整作品。用户基本只能选择音乐类型、音符密度、BPM 和调性，然后使用系统给出的结果。Melody Flip 提供了细致的音乐类型划分，从“80 年代迪斯科”“90 年代 R&amp;B”等常见风格，到“Kawaii Future Bass”“Anime World”等小众类型，应有尽有。据IT之家了解，用户可以把 Melody Flip 生成的 MIDI 数据直接导入数字音频工作站，在里面进一步编辑，再搭配功能更强的合成器插件制作最终作品。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/837.htm", "publishedAt": "2026-09-05T15:19:57+00:00"}, {"title": "Epic CEO 斯威尼：AI 导致内存、存储价格暴涨，游戏行业正遭遇第二次崩盘", "summary": "IT之家 9 月 5 日消息，据 GamesIndustry 报道，Epic Games 首席执行官蒂姆 · 斯威尼（Tim Sweeney）在最新一期的《Edge》杂志专访中，与多位业内专家一起探讨了游戏产业当前所面临的“大崩盘 2.0（Crash 2.0）”危机。IT之家注：雅达利大崩溃（又称雅达利冲击）是 1983 年发生在美国的电子游戏产业衰退事件，雅达利当时实行“数量压倒质量”政策，导致北美市场涌现近万款粗制滥造的同质化游戏，彻底摧毁消费者信心。该事件直接造成北美游戏市场规模从 1983 年的 32 亿美元暴跌至 1985 年的 1 亿美元，跌幅超过 97%。斯威尼表示，当前游戏行业正经历自 20 世纪 80 年代（即 1983 年北美游戏市场崩盘事件）以来最严重的一场崩盘。斯威尼指出，当前游戏行业不仅面临着内部机制失灵的困境（例如 3A 游戏越来越高昂的开发成本），同时还要承受外部挑战的双重打击，其中就包括眼下持续蔓延的零部件短缺危机。谈及零部件短缺危机时，他直言：“这是一次始料未及且极为沉重的冲击。外界普遍坚信 AI 系统与数据中心将对整体经济产生颠覆性赋能，这掀起了一场前所未有的投资热潮。AI 赛道背后的庞大资本体量，意味着他们在抢购全部零部件时开出的竞价，足以彻底压倒整个娱乐产业。”这就导致我们成了利益受损的一方：内存与存储的价格直接暴涨至原来的四倍，而且涨势很可能还不会就此止步。我们必须清醒地意识到，在未来整整三年内，所有与游戏相关的硬件供应链都将深陷持续性短缺之中。我认为唯一的破局之道，就是大举兴建大型新工厂来满足全球的产能需求 —— 而这一天也必然会到来。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/836.htm", "publishedAt": "2026-09-05T15:14:29+00:00"}, {"title": "GPT-6带火循环Transformer，阿里早已布局", "summary": "手握两篇顶会论文", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/484726.html", "publishedAt": "2026-09-05T15:07:08+00:00"}, {"title": "GPT-6 Astra 模型发布，OpenAI 总裁布罗克曼自信放话“欢迎来到 AGI 时代”", "summary": "IT之家 9 月 5 日消息，据《商业内幕》报道，OpenAI 宣布，新推出的 Astra 模型已经达到 AI 行业最为追求的一个里程碑。当地时间周四，OpenAI 总裁格雷格 · 布罗克曼在宣布 Astra 模型推出的媒体电话会议结束时自信喊话：“欢迎来到 AGI 时代。”OpenAI 将 AGI 定义为在大多数具有经济价值的工作中，表现超过人类的高度自主系统。在其看来，Astra 是一项重大研究突破，意味着人们能够交给 AI 完成的工作范围发生了变化。布罗克曼此前认为，实现 AGI 并非一个突然发生的时刻，而是一个渐进过程。而这次在新模型发布后，他是这样说的：“未来人们回过头看，可能会认为 AGI 大概就是在这个时候出现的，我认为可能就是从这个模型开始的。就我个人而言，我确实认为我们已经到了这个阶段。”GPT-6 Astra 距离 GPT-5 模型系列推出约一年，距离 OpenAI 最近一次推出 GPT-5.6 升级约两个月。OpenAI 称 Astra 是“全球最智能、对齐程度最高的模型”，并将其形容为专业工作的一次跃迁。根据介绍，Astra 可以填写表格、调整文档格式、安排预约以及操作软件。“任何你能在电脑上完成的事情，Astra 都能替你完成，而且速度很快。”其他科技行业领导者同样将 AGI 视为 AI 发展的重要目标。据IT之家了解，谷歌 DeepMind 联合创始人哈萨比斯在 5 月举行的公司大会上作出预测：AGI 最早将在 2030 年出现，人类正站在“奇点的山脚下”。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/833.htm", "publishedAt": "2026-09-05T14:46:46+00:00"}, {"title": "押中SpaceX的硅谷老将，把票投给了一家中国世界模型公司", "summary": "当AI开始“预演”一场暴雨", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/484683.html", "publishedAt": "2026-09-05T14:46:15+00:00"}, {"title": "全球首例：我国完成人工智能超声机器人引导下先天性心脏病封堵术", "summary": "IT之家 9 月 5 日消息，9 月 5 日上午，解放军总医院第六医学中心心血管病医学部成功完成人工智能超声机器人引导下先天性心脏病介入封堵术。经权威机构科技查新，该手术为全球首例同类智能技术临床应用，标志着智能影像机器人在结构性心脏病微创介入领域取得突破性进展。据介绍，本次手术患者为 48 岁男性，确诊房间隔缺损。因其缺损边缘解剖条件较差，多家医院评估建议外科开胸治疗，患者希望接受微创介入手术，遂转诊至该中心心血管病医学部。该类复杂病例手术难点集中，传统手术高度依赖超声医师手持超声扫查，即便经验丰富的超声医师配合手术，依靠传统手持超声操作，也会面临探头稳定性受限、复杂解剖靶点识别难度高的客观挑战。官方表示，本次手术投用的人工智能超声机器人系统，为第六医学中心朱航主任团队与清华科研团队联合研发的创新成果，突破了传统介入机器人仅能实现器械递送的局限，真正实现影像识别与手术操作的双向智能协同。IT之家获悉，该系统可通过机械臂完成稳定自主超声扫查，依托人工智能算法自动甄别病灶、精准勾勒缺损边界，实时构建心脏三维解剖模型、规划安全手术路径，将以往依赖医师经验的二维人工判读，升级为标准化、精准化、可复现的三维智能导航模式。手术过程中，智能机器人全程自主完成影像采集、病灶定位与实时导航，辅助手术团队精准匹配、顺利植入封堵器，有效规避人为操作偏差，大幅提升了复杂先心病介入手术的精准度与安全性，优化了手术流程、缩短了手术时长，为高难度复杂微创介入手术提供了全新技术支撑。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/823.htm", "publishedAt": "2026-09-05T13:11:10+00:00"}, {"title": "大模型厂商纷纷“卖 Token”，消息称 Kimi、MiniMax 等即将在天猫开店", "summary": "IT之家 9 月 5 日消息，上海证券报今天（5 日）独家获悉，Kimi、MiniMax、阶跃星辰等多家大模型厂商也都在与天猫接洽中，未来将入驻天猫开设官方旗舰店，开售 Token 订阅套餐产品。本月 2 日，国产 AI 大模型厂商智谱正式入驻天猫，开设“智谱旗舰店”。用户可在淘宝 App 搜索“智谱旗舰店”进店下单。店铺目前已上架智谱 GLM Coding Plan 订阅套餐，基于 GLM-5.3 模型，并适配 ZCode、Claude Code、Codex 等 20 余款主流 Agent。IT之家注：此前大模型厂商主要通过官网等自有渠道销售订阅产品。智谱此次入驻天猫，意味着大模型订阅服务开始进入传统电商平台的消费场景。本月 3 日，天猫上线 Token 充值中心，首批接入阿里云、智谱、Kimi、MiniMax、DeepSeek 等国产大模型厂商。其中，阿里云和智谱为品牌官方旗舰店，剩余三家目前为代理模式。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/822.htm", "publishedAt": "2026-09-05T12:52:13+00:00"}, {"title": "比亚迪：超级智能体迪迪虾暨腾势 N8L 纯电上市发布会定档 9 月 14 日", "summary": "IT之家 9 月 5 日消息，比亚迪旗下腾势品牌今日宣布，超级智能体迪迪虾暨腾势 N8L 纯电上市发布会定档 9 月 14 日。在今年 5 月底的比亚迪“敢为”智能化战略发布会上，比亚迪发布了超级智能体“迪迪虾”，实现全舱记忆，跨域互动，端云协同，快慢思考。比亚迪官方表示，随着 AI 大模型与整车智能深度融合，汽车正在从传统的功能型工具向具备主动服务能力的“智能体”演进。“迪迪虾”的核心目标是让车辆具备更自然的人机交互、主动服务和复杂任务处理能力。比亚迪称，其全面升级了中央大脑与整车智能体的情感架构，使其能够围绕用户需求提供更具个性化的服务体验。今年 6 月，“迪迪虾”确认将登陆腾势 N8L 闪充版，采用活人逻辑，支持根据用户需求操控车辆、多步骤复杂指令理解并执行。另外，“迪迪虾”还可以打通手机生态。腾势 N8L 纯电版定位大六座安全豪华 SUV，搭载 208L 超大智能电动前备箱。关于这款新车的更多消息，感兴趣的朋友可以关注IT之家后续报道。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/815.htm", "publishedAt": "2026-09-05T11:45:37+00:00"}, {"title": "OpenAI 回应旗下智能体攻进德国网站：将彻底改革“AI 模型攻击”事件披露机制", "summary": "IT之家 9 月 5 日消息，昨天晚间路透社报道称，一群失控的 OpenAI 智能体劫持了一个德语维基网站，由此引发外界对 OpenAI 的质疑。对此，OpenAI 回应称，需要彻底改革 AI 模型攻击现实世界目标后，企业应在何时以及以何种方式对外披露此类事件。OpenAI 今天（5 日）在 X 平台发文表示：“关于‘维基事件’，也就是我们的智能体向多个互联网网站写入内容一事，我们早就应该制定标准，明确何时以及如何披露‘误对齐’事件，而不仅仅是披露模型本身的误对齐属性。”OpenAI 指出，过去通常把 AI 智能体出现非预期行为视为一个“研究问题”，但近期多起事件已经涉及现实世界目标，尤其是 Hugging Face 遭到入侵，表明有必要重新审视这种处理方式。这是“维基事件”周五首次曝光后，OpenAI 第一次承认自身参与其中。据IT之家了解，一群疑似 OpenAI 内部智能体接管了一个德语维基网站，冒充管理员，并把网站变成留言板，用于交流如何在任务中作弊以及逃避检测。另有报道称，OpenAI 知道这些智能体以这种方式失去控制，却没有披露这一“事件”。消息在 AI 行业引发广泛担忧，外界开始质疑前沿 AI 系统的安全性，以及开发这些系统的企业是否可靠。OpenAI 在 X 平台解释称：“我们此前认为，维基事件属于一种失配情况，与过去安全报告中披露的失配案例类似。”OpenAI 还称，新的事件披露框架正在制定，并将在“未来几周内”公布，同时呼吁整个 AI 行业建立明确标准，规范此类误对齐事件的披露方式。相关阅读：《曝 OpenAI 智能体今年 5 月就已“失控”，曾主动劫持德国一网站》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/814.htm", "publishedAt": "2026-09-05T11:43:16+00:00"}, {"title": "塔塔咨询将在印度海得拉巴建设 1GW AI 数据中心，预计投资 7000 亿卢比", "summary": "IT之家 9 月 5 日消息，塔塔咨询服务公司今日宣布，旗下子公司 HyperVault 已取得 264 英亩（约 106.9 公顷）土地，计划在印度海得拉巴打造规划容量高达 1 吉瓦（1GW）的大规模 AI 数据中心园区。官方表示，该数据中心可支持面向 AI 模型训练、推理以及复杂高性能计算工作负载的高密度 GPU 部署。建设将采取分期推进策略，密切匹配客户算力需求与底层技术迭代要求。全面建成后，该园区预计将跻身印度规模最大、技术最先进的 AI 基础设施园区之列。项目落地后，预计将在当地创造数千个直接与间接就业岗位。HyperVault 及其合作伙伴预计将投资高达 7,000 亿印度卢比（IT之家注：现汇率约合 497.87 亿元人民币），用于该算力基础设施的建设与长期运营。IT之家注意到，保时捷于当地时间 8 月 24 日，与塔塔咨询签署了一项为期五年、价值 12.5 亿欧元（现汇率约合 97.6 亿元人民币）的 AI 合作协议。塔塔咨询称将为保时捷实现“规模化、工业级的 AI 技术落地”。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/810.htm", "publishedAt": "2026-09-05T11:07:31+00:00"}, {"title": "GPT-6 突然全量上线，额度重置再+1，全网实测效果太离谱", "summary": "GPT-6 Astra 的真正野心，是 菜鸟老金的股市任务）》，记录一名知名喜剧演员参与股票交易的过程。节目开场便是他买入几股 SK 海力士股票，这一情节引起韩国散户投资者的共鸣。韩国平均每 4 人中就有 1 人是散户投资者。AI 热潮甚至改变了韩国大学生的专业选择。高等教育在韩国社会被视为人生中的重要阶段。而在首尔大学，与 AI 就业联系紧密的电气与计算机工程专业人气大幅攀升。首尔大学数据显示，今年工程学院尚未确定专业的学生中，每 10 人有 9 人选择电气与计算机工程，2023 年这一比例仅为每 10 人有 2 人。一名林姓受访者表示：“韩国学生并不是在追逐‘AI’这样一个抽象概念，而是在追逐一条具体、清晰的本土就业路径，可以进入三星和 SK 海力士等企业的硬件部门。”她指出，相比其他职业，这类岗位能够提供更明确、更直接的回报，也就是在大型企业获得稳定的正式职位。相关阅读：《路透社：三星、SK 海力士员工已跻身韩国婚恋市场顶层》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/835.htm", "publishedAt": "2026-09-05T15:06:56+00:00"}, {"title": "姚班校友主导，Claude攻克费马大定理首个完整形式化证明", "summary": "最后靠Harness救回来", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/484551.html", "publishedAt": "2026-09-05T01:17:56+00:00"}, {"title": "鸿蒙 AI Coding 的研发新范式与工程实践", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/4C4RQUGPhAXgcx8G64ab?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-04T22:18:30+00:00"}, {"title": "AI 浪潮里，听见一线的声音｜AICon 深圳 2026 优秀出品人 & 明星讲师名单揭晓", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/6EYVBX5UD2Cb0PWYsPCq?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-04T11:11:55+00:00"}, {"title": "人人都能整个“自己的DeepSeek Harness”，那我们为啥还在给Claude Code们充会员？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/6Jc130IN2OaXqsPDIzmJ?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-04T10:22:50+00:00"}, {"title": "“美国大豆包”Gemini翻身：输出速度碾压同行、智能水平重回第一梯队", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/M792kCZ4FIzk7YHe4WhT?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-04T10:16:42+00:00"}, {"title": "趋境科技与摩尔线程达成战略合作，高品质 AI Token 国产异构方案性价比超越国际先进算力", "summary": "国产卡跑出高品质 AI Token 生产级性能", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/484547.html", "publishedAt": "2026-09-04T09:23:24+00:00"}, {"title": "Termexo V0.7.0 发布：终端可见并切换 Claude / Codex 登录账号 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
