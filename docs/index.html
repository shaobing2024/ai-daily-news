const DATA = {"date": "2026-09-10", "generatedAt": "2026-09-10T00:47:21Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "曾获扎克伯格 15 亿美元 offer，Meta 明星 AI 研究员安德鲁 · 塔洛克宣布离职", "summary": "北京时间 9 月 10 日，据《华尔街日报》报道，知情人士透露，明星 AI 研究员安德鲁 · 塔洛克 (Andrew Tulloch) 即将从 Meta 离职。去年，Meta 为了招募他曾提供价值超过 10 亿美元的薪酬方案。塔洛克的加入曾被视为 Meta 的一次重大胜利，也为去年夏天那场疯狂的人才争夺战画上了句号。当时，Meta CEO 马克 · 扎克伯格 (Mark Zuckerberg) 不惜重金招揽研究人员，力图在 AI 竞赛中迎头赶上。他曾在 Meta 工作 11 年，于 2023 年离职前往 OpenAI，随后共同创立了 Thinking Machines Lab。塔洛克周三向同事宣布离职时，并未透露下一步去向。他未回应置评请求。Meta 也拒绝就他的离职发表评论。他的离职加剧了一连串的 AI 研究人员高调出走潮。上个月，谷歌首席科学家杰夫 · 迪恩 (Jeff Dean) 与另外三名资深研究员离职，共同创立了一家 AI 创业公司。周二，一名 Anthropic 研究员因担心该公司及其竞争对手正在竞相打造一项最终可能无法控制的技术而辞职。塔洛克是近期宣布离职的第三位 Thinking Machines Lab 联合创始人。此前，巴雷特 · 佐夫 (Barret Zoph) 和卢克 · 梅茨 (Luke Metz) 已于上个月离开了 OpenAI。佐夫加入了谷歌，梅茨则加入了 Meta。据《华尔街日报》此前报道，为了招揽塔洛克，Meta 曾开出一份丰厚薪酬方案，在最高奖金和优异股票表现下的总价值可能高达 15 亿美元，但塔洛克当时拒绝了。几个月后，他最终以未披露的薪酬加入 Meta。就在塔洛克宣布离职的前一天，Meta 刚刚推出了一款新 AI 智能体，旨在让普通大众接纳这项技术。该智能体在获得授权后，可以代用户发送邮件、在网页上购物并完成其他任务。该公司一直在努力重返 AI 竞赛，近几个月已发布了具有竞争力的模型以及一款价格极低的编程智能体。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/000/574.htm", "publishedAt": "2026-09-10T00:43:52+00:00"}, {"title": "米哈游《原神》角色声音被“偷”获赔 75 万元，上海首例涉 AI 声音仿冒不正当竞争案宣判", "summary": "IT之家 9 月 10 日消息，据《案件聚焦》节目公众号，近日，上海市浦东新区人民法院宣判了上海市首例涉 AI 声音仿冒不正当竞争纠纷案。米哈游公司于 2025 年发现，一款 AI 变声软件提供了《原神》63 款角色的声音资源包，供用户付费变声使用。同时，该软件还大量使用原神角色图片。米哈游随后将这款软件的运营公司告上法庭，称被告提供的变声服务会让用户在听觉上产生混淆 ——“无论讲什么话都会转换成特定角色的音色和声线”。被告辩称变声服务是 AI 大模型训练的结果，声音效果因人而异，且声音权利属于配音演员个人，应当由配音演员来主张。然而，声纹司法鉴定给出了关键结论：AI 变声软件中《原神》角色的试听语音，与游戏角色原声“倾向认定同一”。更关键的是，被告在庭审中承认 —— 他们在未取得授权的情况下，使用《原神》角色的一分钟音频，混合其他声音素材，一起训练了自己的 AI 变声模型。浦东法院知识产权审判庭法官徐弘韬对此阐释：“在游戏当中，这个角色采用什么样的音色特征，其实更多取决于这个角色在游戏里面预设的属性、技能这样一些特定的要素，而不是任由配音演员去进行个性化的发挥。”也就是说，游戏角色的音色特征由角色预设属性决定，具有识别商品来源的“商业标识”功能。浦东法院最终判令被告立即停止不正当竞争行为，赔偿原告 75 万元。IT之家注意到，2026 年 9 月 7 日，最高法发布《关于依法审理涉人工智能纠纷案件的意见》，是首部由国家最高审判机构发布的涉人工智能司法裁判规则文件。《意见》提到，除法律另有规定的外，未经自然人同意，使用自然人的声音作为训练语料，模仿该自然人的音色、语调和发音风格等生成能够识别该自然人的合成人声，该自然人主张行为人侵害其声音权益的，人民法院依法予以支持。这意味着，AI 偷声音不再处于法律的灰色地带。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/000/573.htm", "publishedAt": "2026-09-10T00:42:15+00:00"}, {"title": "OPPO Find X10 系列新机现身 Geekbench，搭载联发科天玑 9600 Pro 芯片", "summary": "IT之家 9 月 10 日消息，OPPO 有一款型号为 PMX110 的新机出现在了 Geekbench 基准测试数据库中。OPPO PMX110 此前已经通过工信部入网认证及 3C 认证，@数码闲聊站 等博主称其为 OPPO Find X10 系列，预计为 OPPO Find X10 Pro Max。数据显示，这款机型搭载了联发科天玑 9600 Pro 芯片，配备 16GB 内存，GB7 跑分达到了单核 3242 分、多核 11132 分，GB6 跑分最多达到了 3691 分和 11093 分，均明显偏低且不稳定。入网参数显示，这款新机均支持 N79 5G 频段及 2.4GHz 扩频通信，系统层面将预装 ColorOS 17 系统，并已备案多个 AI 大模型，支持 80W 有线快充。结合供应链爆料信息，该系列机型有望搭载台积电 2nm 工艺的天玑 9600 和 9600 Pro 芯片，Pro Max 版本预计将采用 6.78 英寸 1.5K 144Hz LTPO 极窄直屏，配备三颗 2 亿像素传感器，电池容量突破 8000mAh，支持 80W 有线与 50W 无线闪充，同时配备 3D 超声波指纹和 IP68 级防尘防水。OPPO Find X10 系列手机昨日起已在京东开启预约，包括 Find X10 标准版、Find X10 Pro Max 和 Find X10 E 三款机型，首发下单可获赠蓝牙耳机或首发专属礼盒等礼品。IT之家后续将保持关注。相关阅读：《OPPO 卓世杰：Find X10 Pro Max 手机三颗后摄均支持 OpenGate 片门全开录像》《OPPO Find X10 系列手机开启预约，含 X10 标准版、X10 Pro Max 和 X10 E 三杯》《OPPO Find X10 Pro Max 手机更多影像规格揭秘，搭载全球首个三 2 亿镜头群》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/000/571.htm", "publishedAt": "2026-09-10T00:22:34+00:00"}, {"title": "OpenAI 悄然收紧 ChatGPT 广告政策，禁止 Adobe 等竞品投放 AI 生图与音频广告", "summary": "IT之家 9 月 10 日消息，OpenAI 最近刚刚推出了 ChatGPT Images 2.5 图像生成模型以及 ChatGPT Live 语音功能。据 The Information 今日报道，OpenAI 近期悄然更新了其广告政策，禁止竞争对手在 ChatGPT 平台内投放特定生成式 AI 产品类别的广告，尤其是针对图像和音频生成工具的商业广告。OpenAI 已通知部分商业合作伙伴，将不再接受仅图像生成和语音生成类产品的广告活动审批。这项新规此前并未对外披露，也尚未更新至 OpenAI 官方广告政策页面。Adobe 美洲媒体高级总监 Doug Wyatt 证实了这一消息。Adobe 曾参与今年早些时候 OpenAI 的广告试点项目，在 ChatGPT 平台内推广其 Acrobat Studio 和自有的 Firefly AI 图像生成器。值得注意的是，目前这项政策调整并不对称 —— OpenAI 仍允许竞品投放视频生成工具的广告。与此同时，OpenAI 还同步调整了 ChatGPT 的发现机制，对于涉及图片编辑器和图像生成器等操作性图像查询，ChatGPT 已停止返回外部引用链接。这意味着第三方开发者同时失去了自然流量和付费推广两条获客途径。公开报道显示，ChatGPT 于 2026 年 2 月在美国启动广告测试，初期广告仅面向免费用户及低价订阅版用户展示。OpenAI 广告业务上线不足 200 天，年化收入运行率已突破 10 亿美元（IT之家注：现汇率约合 67.28 亿元人民币）。该公司此前曾向投资者提出激进的广告增长预期，内部设定的 2026 年全年广告收入目标为 25 亿美元（现汇率约合 168.21 亿元人民币）。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/000/568.htm", "publishedAt": "2026-09-10T00:09:39+00:00"}, {"title": "Anthropic 披露第四起 Claude 模型未经授权访问真实第三方系统的安全事件", "summary": "IT之家 9 月 10 日消息，Anthropic 于当地时间 9 月 9 日发文，确认一起发生于 2026 年 1 月的安全事件，也是 Anthropic 对外披露的第四起真实网络安全事件。据IT之家此前报道，Anthropic 曾在当地时间 7 月 30 日，对外披露三起 Claude 模型未经授权访问真实第三方系统的安全事件。Anthropic 表示，当时判断 Claude 可能在一次网络安全评测中获得了外网访问权限，随后对约 14.1 万份会话日志进行了筛查，并确认了该事件。据悉，由于日志总量庞大，且需要尽快公布处置结果，该轮筛查主要依赖基于智能体的自动化检索，导致了一批同样连通了外网的日志被遗漏。8 月，Anthropic 在整理准备共享给模型评估与威胁研究机构 METR 的日志时发现了这部分遗漏。经过进一步核查，Anthropic 从中发现了第四起发生于 2026 年 1 月的事件，涉及早期版本的 Claude Opus 4.6。IT之家获悉，所有四起事件均发生在由同一家外部评测机构构建的网络安全评估流程中。系统曾向 Claude 发送提示，称其运行在断网的沙箱模拟环境中；但由于环境配置错误，模型被误接入了开放的互联网。按照网安评估的标准惯例，测试模型在运行时并未挂载商用发布版本所标配的安全防护策略。发现该事件后，Anthropic 表示主动扩大了排查范围，将检索规模扩增至约 4.81 亿份日志。先对这些日志进行初筛，排查公网 IP 地址和 URL 等外网访问特征；随后利用 Claude 对初筛标记出的 920 万份高风险日志展开二次深度审查。审查结果重新锁定了上述四起事件，未发现其他程度相当或更为严重的个案。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/000/565.htm", "publishedAt": "2026-09-09T23:53:07+00:00"}, {"title": "苹果 2026 秋季新品发布会一文汇总：iPhone Duo 出世、iPhone 18 Pro / Max 登场、新 CEO 首秀", "summary": "又是一年“科技春晚”，北京时间 9 月 10 日凌晨 1 点，Apple 特别活动如期拉开帷幕。要说今年苹果秋季发布会，大概是近几年关注度最高的一场，原因有三：首先，苹果大改策略仅推出 Pro 系列机型；其次，传闻已久的首款折叠屏 iPhone 终于亮相；最后，新任 CEO 约翰 · 特努斯迎来执掌苹果后的首秀。不过，由于“网络发布会”已经剧透了整整一年，再加上“猪队友”塔塔的大泄密，不少网友都觉得：苹果这次怕是没有秘密了吧？但整场看下来，苹果还是甩出了几个实打实的“狠活儿”，尤其是那个“Duo”。老规矩，IT之家小编这就把发布会从头到尾捋一遍，咱们按亮相的顺序挨个看。一、iPhone 18 Pro / Max一开场就放大招 —— 今年苹果秋季特别活动，率先登场的正是 iPhone 18 Pro / Max。而在正式介绍 iPhone 18 Pro / Max 之前，特努斯先行提出了“智能个人中心”的概念 —— 既拥有推陈出新的广博能力，又能洞悉你的个人情境。他表示，没有任何其他产品的设计，能像 iPhone 那样胜任你的智能个人中枢。说回到 iPhone 18 Pro / Max 本身，特努斯撂下狠话：各个关键领域都有重大提升，智能、性能、电池和摄像头。具体来看，iPhone 18 Pro / Max 还是熟悉的模样，设计采用同色系的铝金属和玻璃背板搭配，外观更加浑然一体。给到的配色有四款：深邃的黑色、雅致的银色、全新亮相的冰川蓝色、高雅且独特的勃艮第酒红色。作为近两年的主打卖点，苹果自然对 AI 功能浓墨重彩，iPhone 18 Pro 能够施展 Apple 智能的全部本领，并支持全新的 Siri AI。Apple 智能给 Siri AI 带来了三大提升：更懂你、更能干、更高效，还能以视觉化的方式表达自我。具体功能涵盖回答问题、写作与编辑、拼写纠正、消除工具、图片扩展，以及空间构图等一系列实用玩法。Apple 智能将于本月随新系统一同推送，支持 16 种语言，不过要特别提醒各位 —— 虽然简体中文在列，但中国大陆用户暂时还用不上。Siri AI 目前以英语推出 Beta 版，将于 10 月支持法语、日语、韩语、葡萄牙语和西班牙语。既然聊到 Apple 智能和 Siri AI，为了驱动相关功能，无疑需要更强大的算力，为此苹果为 iPhone 18 Pro / Max 打造了 A20 Pro 芯片。这颗芯片采用 2 纳米制程工艺，搭载 6 核中央处理器 —— 包含 2 个全新超级核心，速度提升最高 20%；4 个能效核心则全系集成神经网络加速器，以驱动各类低延迟的设备端 AI 任务。全新图形处理器升级为 7 核设计，性能提升最高达 40%，同时内部带宽提升、微架构优化，神经网络加速器也迎来新版升级。A20 Pro 还有一个重磅加码：新增一颗神经网络引擎，核心总数来到 32 个，算力直接翻倍，芯片内存带宽也提升了 50%。为了充分释放性能，A20 Pro 采用定制封装技术，将硅裸片与内存并排封装，芯片可直接与 VC 均热板紧密贴合，散热效率大幅提升。全新的散热管理系统让 iPhone 18 Pro 底气更足 —— 新一代 VC 均热板散热面积是 iPhone 17 Pro 的三倍，还使用了业内首创的纳米级晶铜材料。散热加强的同时，续航也没落下。得益于 A20 Pro 的能效、先进系统优化以及全新电池设计，iPhone 18 Pro Max 拿下了“iPhone 史上最长电池续航”的头衔。具体来看：iPhone 18 Pro 单次充电可续航 24 小时；iPhone 18 Pro Max 更是达到 30 小时。有线快充同样升级，充电 15 分钟就能回血 50%。影像系统同样是 iPhone 18 Pro 的重头戏，苹果首次引入带有可变光圈的全新 4800 万像素融合式主摄，开发出一套由六片激光切割叶片组成的系统，光圈会根据场景自动调节。硬件之外，苹果在软件层面还加入了 Pro 级控制选项，可以轻松调用常用设置，并新增全新的手动控制选项和智能追踪对焦功能，摄影风格可随心调整质感和颗粒感，同时支持 SynthID 标准。正如此前爆料流传的那样，iPhone 18 Pro / Max 确实配备了更小巧的灵动岛，而且能同时显示三项实时活动。iOS 27 也同步升级了 AirDrop 性能，隔空投送提速最高 80%；智能网络助手则让 iPhone 在 WiFi 和蜂窝网络间自动切换最优体验。另外还新增了 iPhone 接力功能，支持在两部 iPhone 上共用同一个电话号码，美国 T-Mobile 与德国电信率先支持这一服务。至于 iPhone 18 Pro / Max 的售价，在发布会结束后苹果便予以公布，起售价分别为 9999 元和 10999 元。iPhone 18 Pro：256GB 售价 9999 元，512GB 售价 11999 元，1TB 售价 15499 元，2TB 售价 20499 元。iPhone 18 Pro Max：256GB 售价 10999 元，512GB 售价 12999 元，1TB 售价 16499 元，2TB 售价 21499 元。二、AirPods 5紧跟 iPhone 18 Pro / &nbsp;Max，苹果带来了 AirPods 5，还是采用无耳塞设计，但内部构造重塑一新。具体来看，凭借全新多孔声学架构和新一代自适应均衡功能，AirPods 5 能呈现更饱满细腻的音效，个性化空间音频更为沉浸。支持主动降噪功能，得益于新的声学架构和先进的计算音频技术，降噪效果相比前代提升 50% 之多。支持自适应音频功能，能在主动降噪和通透模式之间自动切换，根据背景噪声进行调整。在耐用性方面，AirPods 5 经过重新设计，更抗雨、抗汗，也更防尘；在启用主动降噪时，聆听时间最长达 4 小时；搭配充电盒，则最长可达 20 小时。值得留意的是，对于有更多需求的用户，苹果还打造了一个无线充电盒版本的 AirPods 5。该版本能用耳机柄控制音量，并且得益于重新设计的电池，电池续航也更久。价格方面，AirPods 5 国行定价 999 元，无线充电盒版本定价 1199 元。三、Apple Watch这回苹果不按套路出牌，没再一个个单独发布，而是把 Apple Watch Series 12 和 Apple Watch Ultra 4 两块表一块儿端了上来。两款手表双双经过重新设计，并搭载苹果最先进的健康传感器和全新 Apple 芯片。具体来看，Watch Series 12 和 Watch Ultra 4 加码健康和健身功能，带来全新的健康感测系统。首先，电极的表面积增加，在测量心电图时与皮肤贴合得更好；其次，重新设计了光电二极管，从而更有效捕捉光线；最后，配备更大、更节能的绿色 LED，全天候支持精准的心率测量，读取频率提升到 60 倍之多。心率 App 和表盘复杂功能迎来重点升级，能更全面地了解自己的健康状况。新增一项全新的体验“准备指数”，无论是全力训练备赛，还是奔波繁忙日程，都会告知何时应提升强度，何时应放缓节奏。每天早上，Apple Watch 会分析近期活动、生命体征和睡眠情况，为状态打分，并根据身体承受力给出明确的建议。借助 Series 12 和 Ultra 4 的内置麦克风，加上芯片的性能和最新的 AI 模型，新增“音频智能”。音频智能可以理解你听到的内容，支持声音识别功能，可留意警笛、闹钟、门铃、婴儿啼哭等声音。倘若漏听了别人说的关键细节，可以使用实时倒回功能，将话转成文本。而音频智能的推出，背后是全新 S11 芯片作为支撑，处理器内置新的安全隔区，通过专用的音频缓冲区安全管理原始音频。与此同时，还搭载 A20 Pro 同样的更快的中央处理器、图形处理器和神经网络引擎。价格方面，Apple Watch Series 12 售价 2999 元起；Apple Watch Ultra 4 售价 6499 元起。其中，Series 12 提供 42 毫米和 46 毫米两种尺寸，铝金属表壳除了深空灰色，新增深古铜色、黑色、浅金色三种配色，钛金属表壳则提供原色和新增的炫金色。并且时隔多年，陶瓷材质表壳回归，提供珍珠白色和海军蓝色两种配色。至于 Watch Ultra 4，提供原色或黑色钛金属两种外观，表带系列均将增添多种全新配色。四、iPhone DuoOne more thing—— 发布会最后时刻，传说已久的苹果首款折叠屏手机真身降临。特努斯先是说了这样一席话：一个更大的屏幕，显然能展开更多新可能，可折叠设计是最优解，但有些折叠设计就像把两部手机生硬地拼在一起，结果凑出一个方形屏，这对用户来说非常不好用。苹果的初衷，是打造真正想要的体验，首先是更大的显示屏像 iPad 一样自然又直观，然后将精巧设计与尖端工艺融入其中，以 Apple 独有的方式，最终实现一系列非凡创新，相信这将重新定义可折叠手机的使用体验。紧接着，它来了 —— iPhone Duo。作为折叠屏手机，iPhone Duo 拥有迄今最大的 iPhone 显示屏，因为有两个屏幕，苹果认为开合之间的过渡必须要非常丝滑和自然。为了达到这样的效果，设计了统一的显示比例，两块显示屏一致。而且 iPhone Duo 的内屏为真全面屏，内屏采用屏下摄像头方案，苹果第一次将 FaceTime 摄像头隐藏在显示屏下。同时还专门设计了一套精密的铰链，会在开合的过程中支撑显示屏的中间位置，并会在显示屏完全展开时令其保持平整，铰链机构采用定制的可变扭矩设计，可精准控制开合。展开状态下是迄今最薄的 iPhone，机身边框由航空级钛金属打造。针对 iPhone Duo 的独特形态，iOS 27 将重要控制项移到了侧边，状态栏保留了需要的所有信息，但设计得更简练、更灵动。不仅支持左右分屏同时运行两个 App，也能同一个 App 开两个窗口，而且能折起立放使用。来看下 iPhone Duo 具体的配置规格，展开是一块 7.6 英寸超视网膜 XDR 显示屏，合起来的外屏则是 5.4 英寸。为了解决折叠屏的痛点，例如碍眼的折痕、塑料感，容易出现刮痕和凹陷，苹果开发了定制纳米纹理表层，可减少眩光和反光。纳米纹理表层采用无掩模激光蚀刻技术打造。采用创新的结构系统，利用多层覆膜设计，来保持显示屏的平整性和耐用性，刚度高出 40%。并且使用了抗刮划涂层，OLED 面板上下都有高强度玻璃，最底层采用钛金属板来提升耐用性。采用 5 级钛金属打造，天线断点处还采用了高性能嵌件进行强化，嵌件由陶瓷纤维制成，背面采用超瓷晶面板。正面有超瓷晶面板 2 守护，抗水防尘性能达到 IP68 级别。至于 iPhone Duo 的其它核心配置，还有解锁方式采用 Touch ID，整合到侧边按钮中，有星光白色和夜空色两款配色可选，今年晚些时候还能够使用 USB-C Apple Pencil。内置采用全新显示引擎的 A20 Pro，不仅能同时驱动两块显示屏，也能让屏下摄像头区域的独特像素布局与周围融为一体。搭载蜂窝网络调制解调器 C2，与 C1X 相比，速度提升最高达 50%，功耗最多降低 15%。注意！苹果明确表示：iPhone Duo 全球统一采用仅使用 eSIM 的设计。正因此，能充分利用内部空间，把电池容量做大，提升续航表现。至于 iPhone Duo 的影像系统，后置由 4800 万像素全新融合式主摄和 iPhone 18 Pro 同款 4800 万像素融合式超广角摄像头组成。支持拍摄 4K 杜比视界 HDR 视频，提供全新“智能拍摄”功能，两块屏幕都可以独立完成自拍。价格方面，iPhone Duo 提供 4 个存储容量版本：256GB 售价 15999 元，512GB 售价 17999 元，1TB 售价 21499 元，2TB 售价 26499 元。并且上市时间较晚，预购将于 10 月 16 日开始，并将于 10 月 23 日发售。五、总结关于苹果秋季特别活动的新品重点，IT之家小编就先盘点到这里。不过按照老规矩，发布会上展示的信息向来只是冰山一角，更多信息和细节还得自行去了解或慢慢挖掘。如果对苹果这波新品的更多消息感兴趣，记得锁定IT之家 App 并认准置顶的“2026 苹果秋季新品发布会专题”，后续消息尽在掌握。祝大家都有愉快的一天 ~", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/000/554.htm", "publishedAt": "2026-09-09T22:50:44+00:00"}, {"title": "苹果官方详解 Apple Watch Ultra 4 手表：日常续航超两天，国行 6499 元起", "summary": "IT之家 9 月 10 日消息，苹果今日发布 Apple Watch Ultra 4。这块专攻运动与户外挑战的表款搭载了更先进的全新健康与健身功能，电池续航亦更持久。Apple Watch Ultra 4 提供原色和黑色钛金属外观选项，起售价为 RMB 6,499，即日起接受订购，本月 18 日（星期五）起正式发售（点此购买）。Apple Watch Ultra 4 搭载全新健康感测系统和 S11 芯片，带来可穿戴设备中领先的精准心率感测功能、更高频的心率与心率变异性（HRV）监测指标，更全新推出身体状态准备指数，为各界运动人士提供支持。Apple Watch Ultra 4 还具备更持久的续航能力，在户外体能训练场景下支持最长达 45 小时的跟测，同时配备设备端 GPS 功能。作为 Apple 迄今最强大的可穿戴设备芯片，全新的 S11 芯片不仅为健康感测系统注入动力，还将为未来新推出的功能提供支持，帮助用户随时留意重要声音，并将隐私、安全和辅助功能方面的创新置于首位。除这些新功能外，Apple Watch Ultra 本身已通过多种方式为用户提供支持，包括覆盖各项活动的高级体能训练跟测、睡眠监测、心脏健康通知和移动心电图房颤提示软件等强大的健康功能。心率感测技术Apple Watch Ultra 4 经过重新架构，通过配备全新光学和电极式心率传感器的健康感测系统实现连续的高精度健康监测。得益于这套系统和全新的 S11 芯片，Apple Watch Ultra 4 的心率感测功能精准度达到业界前沿水平。一项针对由 1000 余名受试者组成的多元化人群开展的严谨科学研究，将全新 Apple Watch 心率感测功能的准确性与领先可穿戴设备进行了比较，结果显示 Apple Watch 的准确性居于首位。由于这枚光学心率传感器采用面积更大、能效更高的绿色 LED，Apple Watch Ultra 4 能够全天候以每 5 秒一次的频率对心率进行监测。这项持续的被动测量功能助力用户更深入了解自身的健身和生理状态，让“锻炼”和“活动”圆环更准确。通过新增的心率表盘复杂功能，用户可全天随时查看实时心率。Apple Watch Ultra 4 经过重新架构，通过配备全新光学和电极式心率传感器的健康感测系统实现连续的高精度健康监测。心率变异性（HRV）是衡量生理压力和恢复的关键指标，其测量频率现在增加多达 24 倍，并可在心率 App 的新分区中查看。Apple Watch 提供两种不同的心率变异性变量，帮助用户更深入地了解自己的健康状况。恢复心率变异性数据能够最有效识别日常压力与恢复信号，而整体心率变异性则能帮助用户洞察自身的整体健康状况，包括心血管健康。通常情况下，变异性数值升高表明用户整体恢复良好，下降则意味着存在压力。依托 Apple Watch Ultra 4 更高频的心率和 HRV 跟测，新增日间生命体征视图，可供用户自行切换查看夜间和日间指标，以便在夜间指标发生变化前及早发现问题。夜间生命体征功能现在加入恢复心率变异性指标，分析以用户的个人基线水平为参考，有助于用户更全面了解自身健康状况。身体状态准备指数：每日体能速览Apple Watch Ultra 4 加入全新的身体状态准备指数功能，可对用户的近期活动、训练负荷、生命体征和睡眠评分进行分析，帮助用户了解自己在未来一天中的体能状况。准备指数每天都会在从 0 到 10 的区间内给出一个评分，并提供明确可操作的建议：“适度修整”、“量力而行”、“蓄势待发”或“火力全开”。这有助于用户决定如何度过这一天，无论他们面对的是工作日，还是要执行锻炼计划。准备指数会随着新数据的出现全天更新，反映高强度体能训练或日间生命体征等变化。准备指数会清晰突出显示影响评分的因素，并允许用户查看更详细的信息。评分算法基于 Apple 心脏与运动研究的数据，是与 Apple 的运动科学家和医生共同开发的成果。续航更持久在日常使用场景下，Apple Watch Ultra 4 如今提供超过两天的电池续航时间，最长可达 50 小时。在低电量模式下，电池续航时间最长可达 84 小时。在户外体能训练追踪场景下，当全新延长体能训练模式开启完整 GPS 和心率读数追踪体能训练时，电池续航时间最长可达 25 小时，相比前代表款延长 25%。对于时间更长的体能训练，在最大延长体能训练模式下，Apple Watch Ultra 4 持续追踪户外跑步、步行和徒步的时长最多可达 45 小时，通常足以完成一场赛程长达 100 英里的竞赛，同时仍以每秒一次的频率进行 GPS 读取。可穿戴设备中精准度领先的心率感测技术计步器模型设计一新，采用新的机器学习算法和 S11 芯片，从而能够在室内步行或跑步训练期间提供更准确的距离测量结果，全天步数统计也更精准。S11 芯片还支持全新的“步数”复杂功能，方便用户直接在表盘上实时追踪步数。依托 S11 芯片的声音识别和 Shazam 功能由于 Apple Watch 始终佩戴在用户腕上，它是帮助用户留意重要声音的理想设备。依托内置麦克风和 S11 芯片的强劲性能，Apple Watch Ultra 4 提供多项新功能，帮助用户时刻留意周围环境。其设计以用户控制、隐私、安全和辅助功能为中心。这些功能包括：声音识别功能首次登陆 Apple Watch，可在监听到重要声音时提示失聪或听障用户，无论用户是否随身携带 iPhone。此功能会对鸣笛、警报、门铃或婴儿哭声等声音进行监听，同时利用设备端智能技术，在检测到这些声音时通知用户。Shazam 可即时检测用户附近播放的音乐，并自动在智能叠放中的音乐识别小组件中显示歌曲标题和歌手名，供用户在腕上轻松浏览。苹果官方表示，这些功能不会创建或存储录音，操作系统、App、用户和 Apple 都无法访问处理时使用的原始音频。这是因为 Apple Watch Ultra 4 搭载的 S11 芯片内部采用了基于硬件的“安全隔区”设计，能在处理音频时将其与系统其他部分完全隔离，并在处理结束后立即删除音频。用户拥有控制权，并可以选择是否开启各项功能。搭载 watchOS 27watchOS 27 为 Apple Watch Ultra 4 带来多项额外更新，包括：动态 App 网格会展示五个 Siri 推荐的 App 图标，这些都是用户最常用和最近使用过的 Apple Watch App。新增单手轻点手势，用户通过食指和大拇指互点，即可方便地打开智能叠放中的小组件。现在，用户可使用轻点两下手势滚动浏览智能叠放，或者轻点一下选中某个小组件，所有操作皆可单手完成。智能叠放小组件建议会根据场景适配显示，例如通过地图 App 推送停车位置建议，在联系人的生日临近时显示生日祝福建议。Apple Watch 的经期跟踪功能和 iPhone 上的健康 App 提供围绝经期和绝经期提示。表款及表带Apple Watch Ultra 4 提供原色或黑色钛金属两种外观。今秋，各个表带系列均将增添多种全新配色。野径回环式表带现推出深棕褐色、沙砾色、勃艮第酒红色三种配色，高山回环式表带提供沙漠色、深橄榄色、勃艮第酒红色三种配色。海洋表带现在采用独特的半透明硅胶材料打造，并推出三种新配色：半透明灰色、半透明海藻绿色和半透明黑色。Apple Watch Hermès Ultra 4除原色钛金属 Apple Watch Hermès Ultra 4 外，Apple Watch Hermès 系列表带还首次推出 Grand H 钛金属表带，该款表带采用内置拉伸结构，便于调整，可服帖佩戴在潜水服外。Apple Watch Hermès Ultra 4 还推出全新 Fathom 和 Wonder 表盘，为用户带来探索深海世界的视觉享受。旋转数码表冠，即可在展现广阔海面到深邃海底的四款表盘选项中任选其一。每个选项都将带来一种独特的蓝调和别致的动画效果。Apple Watch Ultra 4 与环境新款 Apple Watch Ultra 4 的设计以环保为宗旨，整体使用的再生材料占比达到 45%，包括使用 3D 打印工艺的钛金属表壳采用 100% 再生钛金属，电池采用 100% 再生钴。Apple Watch Ultra 4 制造环节使用的全部电力均来自可再生能源，例如风能和太阳能，Apple 还已在全球范围内投资可再生能源，足以抵消用户为 Apple Watch 充电所使用的电力。与其他 Apple 产品一样，它的纸质包装采用 100% 纤维基材料，在家中即可轻松回收。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/000/522.htm", "publishedAt": "2026-09-09T19:57:33+00:00"}, {"title": "苹果 iOS / iPadOS 27 RC 更新日志：升级 Siri AI，增强家长管控等", "summary": "IT之家 9 月 10 日消息，苹果公司今日正式推送了 iOS / iPadOS 27 RC，正式版将于 9 月 15 日推出。IT之家附上 iOS / iPadOS 27 RC 完整更新日志内容如下：Siri AI适用机型：所有 iPhone 16 机型及后续机型、iPhone 15 Pro、iPhone 15 Pro Max。更强大、更善于对话的 Siri 将陆续向用户推出。它可凭借对个人上下文的理解、App 操作能力、屏幕内容感知和广泛的世界知识，帮助你查找所需信息并高效完成更多任务。全新语音体验带来更自然、更具表现力的声音；在 iPhone Air、iPhone 17 Pro 及后续机型上，你还可借助强大的端侧模型，自定义 Siri 的表达风格与语速，让它更符合你的个人偏好。全新独立 Siri App 可让你轻松继续已有对话或发起新对话，并通过 iCloud 在各台 Apple 设备间私密同步对话内容。“相机”中的 Siri 模式整合视觉智能，可针对眼前所见提问并直接采取操作，例如分摊账单或查询餐点的营养信息。“使用 Siri 写作”可在几乎所有可输入文字的位置，从零开始生成草稿、修改已写内容，或获得 Siri 的写作建议。在“信息”和“邮件”中，Siri 还会根据你与收件人的关系调整措辞风格，并参考你过去与对方沟通时常用的个性化用语和标点。App 中的 Apple Intelligence适用机型：所有 iPhone 16 机型及后续机型、iPhone 15 Pro、iPhone 15 Pro Max。照片“空间重构”可通过虚拟调整拍摄视角，在照片拍摄完成后重新调整构图。“扩展”工具可智能地向图片边缘以外延展，并以逼真的内容填充空白区域；你可借此拉正地平线、更改画幅比例，或在主体周围增加留白。“清理”现可移除更大的物体，并带来更自然、更高质量的效果。可选择“快速”模式处理小瑕疵，或选择“高质量”模式完成更精细的编辑。Safari“按主题整理”利用 Apple Intelligence 分析网页内容，自动将相似的标签页归类到一起。“通知我”可定期检查网页是否有更新，例如价格变化或商品库存状态。“描述扩展”支持使用自然语言创建自定义 Safari 扩展，以调整网页内容的显示方式或格式。图像与快捷指令全新的“图乐园”采用新一代生成式模型，可创建几乎任何风格的高质量图像，包括照片级写实风格；你还可通过触控和自然语言编辑图像，并按个性化建议生成锁定屏幕墙纸和联系人海报。“描述快捷指令”支持用自然语言新建快捷指令，或优化已有快捷指令。新增更多创建和修改 Genmoji 的方式，并带来自动校对功能；在 iPhone Air、iPhone 17 Pro 及后续机型上，端侧模型还可提升听写准确度。家庭“活动摘要通知”可将来自多个配件的相关提醒整合为一条通知。符合条件的 iCloud+ 订阅用户，可获得“家庭”中 HomeKit 安全视频录像的视频描述摘要。符合条件的 iCloud+ 订阅用户，可在“家庭”App 或 Spotlight 中搜索 HomeKit 安全视频摄像头片段，快速找到某个特定时刻。日历、邮件与电话在“日历”中描述活动，即可通过自然语言创建活动；Apple Intelligence 会自动补全时间、地点、受邀人和活动标题等信息。“邮件”中的建议可根据邮件内容协助你采取下一步操作，例如为已预订的餐厅获取路线。“电话”中的“通话上下文”可识别你正在与某些商家通话，并主动从各 App 中呈现相关信息，例如确认码或预订编号。辅助功能VoiceOver 现可更详细、更贴合上下文地理解照片、图表与屏幕截图；你可通过对话方式询问屏幕内容或周围环境，也能借助与“操作按钮”的整合更快速地获取答案。增强的“放大器”为低视力用户提供对话式视觉辅助，采用高对比度界面，并支持用自然语言控制缩放及其他放大器功能。更智能的“辅助阅读器”可改善文本清理与格式编排，并支持图像和表格处理、按需摘要和翻译。“语音控制”的灵活输入方式让你能用自己的语言描述屏幕元素来操作设备，例如说“点按齿轮图标”或“点按右上角的按钮”。儿童安全为儿童设置新账户时，家长现在可精确选择孩子能够使用哪些 App。“请求浏览”让家长可在孩子打开每个新网站前逐一批准。扩展后的“通信安全”保护可在儿童看到共享图像或视频中的血腥、暴力内容前进行干预。“使用时间限额”可协助家长为娱乐、游戏和社交媒体类 App 设定使用时长边界，并根据专家研究及孩子年龄提供相应建议。“日程”允许家长按一天中的不同时间，以及工作日和周末，决定孩子能够访问哪些 App。重新设计的“屏幕使用时间”设置可让家长一目了然地了解孩子的设备使用情况，并只需轻点几下即可调整访问权限。系统改进“Liquid Glass”进一步优化了整体可读性；“设置”中新增滑块，可在“极致透明”与“完全着色”之间调整界面外观。系统多项体验速度更快，包括 App 启动、“照片”图库中新照片的载入，以及隔空投送传输。Spotlight、“照片”和“邮件”的搜索结果更加相关且更全面。“连接辅助”可让 Wi‑Fi 与蜂窝网络之间的切换更加顺畅。其他改进包括：“照片”中 iCloud 共享相簿功能增强、AirPods 新增自定均衡器、“健康”App 的“周期跟踪”支持围绝经期与绝经期记录，以及“闹钟”和“计时器”支持分别设置音量。重要说明并非所有功能都适用于所有地区或所有 iPhone 机型。部分 Apple Intelligence 功能可能设有使用限额。软件更新加入新功能与改进，也可能对设备性能和电池续航产生影响。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/000/536.htm", "publishedAt": "2026-09-09T19:45:10+00:00"}, {"title": "苹果官方详解 Apple Watch Series 12 智能手表：全新健康传感器、S11 芯片，2999 元起", "summary": "IT之家 9 月 10 日消息，苹果今日发布了 Apple Watch Series 12 智能手表，搭载更强的健康传感器和全新的 Apple 芯片。Apple Watch Series 12 起售价为 RMB 2,999，即日起接受订购，本月 18 日（星期五）起将在零售店发售（点此购买）。依托全新的健康感测系统和 S11 芯片，Apple Watch Series 12 能够更高频地跟测心率与心率变异性（HRV）指标，为一系列先进的健康与健身功能提供支持，包括最新推出的身体状态准备指数。除了驱动健康感测系统外，全新的 S11 芯片作为 Apple 迄今最强大的可穿戴设备芯片，还将为未来推出的一系列新功能提供支持，帮助失聪及听障用户随时察知重要声音，并以隐私、安全和辅助功能方面的创新为核心。除了新增功能外，Apple Watch Series 12 同样具备 Apple Watch 系列原有的功能，通过体能训练跟测、睡眠监测、心脏健康提示、移动心电图房颤提示软件、摔倒检测、SOS 紧急联络等功能，帮助用户保持运动，更好地了解自身健康状况，并在需要时获得帮助。心率感测技术Apple Watch Series 12 经过重新架构，配备全新光学和电极式心率传感器，通过健康感测系统实现连续的高精度健康监测。得益于这套系统和 S11 芯片，Apple Watch Series 12 的心率感测准确度在可穿戴设备中居于领先水平。一项对由逾 1,000 名受试者组成的多元化人群开展的科学研究，将新款 Apple Watch 心率监测功能的准确性与领先的可穿戴设备进行比较，结果显示 Apple Watch 的准确度居于领先水平。由于这枚光学心率传感器采用面积更大、能效更高的绿色 LED，Apple Watch Series 12 能够以 5 秒一次的频度，全天候监测心率。这项持续的被动测量功能能够助力用户更深入地了解自身的健身状况和生理状态，让“锻炼”和“活动”圆环更准确。通过新增的心率表盘复杂功能，用户可全天随时查看实时心率。心率变异性（HRV）是衡量压力与恢复状况的一项关键指标，现在测量频度增加最多达 24 倍，并可在心率 App 的新分区中查看。Apple Watch 提供两种不同的心率变异性变量，帮助用户更深入地了解自己的健康状况。恢复心率变异性数据更有助于识别日常的压力与恢复信号，整体心率变异性数据则可帮助用户洞察自身的整体健康状况，包括心血管健康。通常情况下，变异性数值升高表明用户整体恢复良好，下降则意味着存在压力。夜间生命体征功能现在也包含恢复期 HRV 指标，基于用户个人的基线水平进行分析，方便用户更加全面地了解自身的整体健康状况。此外还新增日间生命体征视图，用户可自行切换查看夜间和日间指标，在夜间指标发生变化前及早发现问题。准备指数：每日体能速览Apple Watch Series 12 新增准备身体状况指数功能，可对用户的近期健身记录、训练负荷、生命体征和睡眠评分进行分析，帮助用户了解自己在接下来一天内的体能状况。准备指数会在从 0 到 10 的区间内给出一个评分，并提供明确可操作的建议：“适度修整”、“量力而行”、“蓄势待发”或“火力全开”。这能帮助用户决定如何度过接下来的一天，无论是迎接工作日，还是执行锻炼计划。准备指数会随着新数据的出现全天更新，反映高强度体能训练或日间生命体征等变化。准备指数会清晰地突出显示影响评分的因素，并允许用户查看更详细的信息。评分算法基于 Apple 心脏与运动研究的数据，是与 Apple 的运动科学家和医生共同开发的成果。续航更持久Apple Watch Series 12 依然提供最长可达 24 小时的日常电池续航，持续监测户外体能训练时的电池续航则最长可达 10 小时，相比上一代表款提升 25%。统计步数更精准计步器模型全面重构，采用新的机器学习算法和 S11 芯片，能够在室内步行或跑步训练期间提供更准确的距离测量结果，全天步数统计也更精准。这使得 Apple Watch Series 12 的步数统计精确度远超其他智能手表。S11 芯片还支持全新的“步数”Complication 功能，方便用户直接在表盘上实时追踪步数。依托于 S11 芯片的声音识别和 Shazam 功能长时间不间断的佩戴，令 Apple Watch 成为帮助用户随时察知重要声音的理想设备。依托内置麦克风和 S11 芯片的性能，Apple Watch Series 12 带来多项新功能，帮助用户随时了解周围环境，并在设计上以用户控制、隐私、安全和辅助功能为核心。这些功能包括：声音识别，该功能首次登陆 Apple Watch，可在监听到重要声音时提示失聪或听障用户，无论用户是否随身携带 iPhone。此功能会对鸣笛、警报、门铃或婴儿哭声等声音进行监听，并且利用设备端智能技术，在检测到这些声音时通知用户。Shazam，该功能可即时检测用户附近播放的音乐，并自动在智能叠放中的音乐识别小组件中显示歌曲标题和歌手名，供用户在腕上轻松浏览。苹果表示，这些功能在设计中处处体现以隐私保护为先的理念，通过软硬件和服务的协同合作，以 Apple 独有的方式保卫用户隐私。这些功能不会创建或存储录音，操作系统、App、用户和 Apple 都无法访问处理时使用的原始音频。这是因为 Apple Watch Series 12 搭载的 S11 芯片内部采用了基于硬件的“安全隔区”设计，能在处理音频时将其与系统其他部分完全隔离，并在处理结束后立即删除音频。搭载 watchOS 27 操作系统watchOS 27 为 Apple Watch Series 12 带来多项更新，包括：动态 App 网格，为用户显示五个 Siri 推荐的 App 图标，均为用户最常使用和最近使用过的 Apple Watch App。新增的单手轻点手势，可让用户通过食指和大拇指互点，快捷地打开智能叠放中的小组件。现在，用户可使用轻点两下手势滚动浏览智能叠放，或者轻点一下选中某个小组件，所有操作皆可单手完成。智能叠放小组件建议，会根据场景适配显示，例如通过地图 App 推送停车位置建议，在联系人的生日临近时显示生日祝福建议。Apple Watch 的经期跟踪功能和 iPhone 上的健康 App 新增围绝经期和绝经期提示。产品阵容Apple Watch Series 12 提供 42 毫米和 46 毫米两种尺寸。铝金属表壳除了备受欢迎的深空灰色，还新增深古铜色、黑色、浅金色三种配色。钛金属表壳则提供原色和新增的炫金色两种外观选择。Apple Watch Series 12 还新增一款陶瓷材质表壳，提供珍珠白色和海军蓝色两种配色。适用于 Apple Watch Series 12 陶瓷表壳的沙砾色和海军蓝色运动型表带，采用陶瓷材质的按扣加收拢式表扣，与表壳组成搭配。表带今秋的运动型表带将增添多种全新配色，包括橄榄色、勃艮第酒红色、山花蓝色和淡石莲绿色。回环式运动表带亦新增钱布雷蓝色、洋红色等数种新配色，以及利用创新喷墨印刷技术实现的两种别致的格纹设计款式 —— 勃艮第酒红格纹和浅棕黄格纹。Nike 运动表带和 Nike 回环式运动表带推出五种全新配色：Essential 白色、清静粉白色、巷陌灰色、After Dark 黑色和火花绿色。米兰尼斯表带则新增耀眼夺目的炫金色，能与新款的炫金色钛金属表壳完美搭配；此外还有全新的深古铜色，与新款的深古铜色铝金属表壳相得益彰。现代风扣式表带现采用全新精织材料制成，融入了彩色小点图案。除了原有的原色五金件外，这款表带还首次推出金色五金件选项，能与炫金色钛金属表壳完美搭配。Apple Watch Hermès Series 12Apple Watch Hermès Series 12 在特有的银色钛金属表款之外，首次推出炫金色钛金属表款。炫金色 Apple Watch Hermès Series 12 搭配新款 Noir Satin Clou de Selle 表带，金色的表扣和马鞍钉装饰与表壳外观相得益彰。Apple Watch Hermès 系列推出新款表带 Rocabar Club，采用对比配色和“H”型图案立体编织，设计灵感源自马术障碍比赛。Apple Watch Series 12 与环境Apple Watch Series 12 的设计以环保为宗旨，整体使用的再生材料占比达到 40%，包括铝金属表壳采用 100% 再生铝，使用 3D 打印工艺的钛金属表壳采用 100% 再生钛。Apple Watch Series 12 制造环节使用的全部电力均来自可再生能源，例如风能和太阳能，Apple 还已在全球范围内投资可再生能源，足以抵消用户为 Apple Watch 充电所使用的电力。与其他 Apple 产品一样，它的纸质包装采用 100% 纤维基材料，在家中即可轻松回收。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/000/532.htm", "publishedAt": "2026-09-09T19:41:50+00:00"}, {"title": "苹果 macOS 27 RC 更新日志：全新 Siri AI、界面更精致、体验更可靠", "summary": "IT之家 9 月 10 日消息，苹果今日向 Mac 电脑用户推送了 macOS 27.0 RC 更新（内部版本号：26A428），本次更新距离上次发布 Beta / RC 间隔 9 天，正式版将于 9 月 15 日发布。IT之家附上 macOS 27 RC 更新完整日志内容如下：全新 Siri AI推出由 Apple Intelligence 驱动的全新 Siri AI。它更懂你、能力更强，也更适合自然对话。Siri AI 已整合进聚焦搜索（Spotlight），用户可以直接在平时搜索文件、应用和内容的位置查询几乎任何主题的问题。它还能结合个人上下文，在“信息”、邮件、照片等内容中查找所需信息；只要提出请求，即可跨 App 完成相应操作。全新的独立 Siri App 可让你回顾并继续此前的对话记录，并通过 iCloud 在各台 Apple 设备之间同步。Siri AI 将分阶段向用户推出，可前往“设置”启用。根据屏幕内容操作借助视觉智能（Visual Intelligence），你可以选取屏幕上的一个窗口，让 Siri 回答与当前画面有关的问题，或直接执行操作，例如将画面中的活动添加到日历。可通过专属快捷键 Command-Shift-空格键 调出视觉智能。更强大的照片编辑智能照片编辑工具带来更多创作空间：使用“空间重构”可在拍摄完成后重新调整照片构图使用“扩展”工具可延展画面、扩大取景范围“清除”功能进一步提升，可更高质量地移除干扰元素，并在复杂场景中生成更自然、逼真的补全效果Safari 浏览新工具Safari 可自动按主题归类标签页，让你更容易找到相关网页。“通知我”（Notify Me）可持续监测网页变化，例如商品降价或恢复库存，并在适合采取行动时提醒你。“描述扩展”则支持用自然语言创建自定义 Safari 扩展，例如添加一个按钮，用于保存喜爱的食谱。用自然语言创建快捷指令通过“描述快捷指令”，只需用一句话说明想自动完成的任务，系统便会为你组合所需的操作步骤。例如，你可以描述一个快捷指令：下班回家途中，根据实时路况自动向伴侣发送预计到达时间。更精致的界面设计“液态玻璃”（Liquid Glass）视觉效果进一步优化，提升了文字与界面的可读性。新增滑块可调整其显示风格，从极高透明度到完全着色均可自定义。统一的工具栏、延伸至边缘的侧边栏，以及细节更丰富的 App 图标，也令整体界面更协调、更具质感。新增儿童安全功能更完善的家长控制功能可帮助家长更方便地管理：孩子能看到哪些内容、能与谁联系，以及可在什么时间使用 App。浏览前请求许可：孩子首次在 Safari 打开新网站前，需先征得家长同意通信安全：扩大保护范围，帮助提升对话过程的安全性时间额度：让家长更灵活地管理孩子在不同类别 App 上的使用时长，并根据专家研究提供与年龄相匹配的建议使用时间表：可按一天中的不同时段及一周内的不同日期，规定孩子可使用哪些 App。更快速、更可靠的体验一系列改进让 Mac 运行更快、更稳定，也更易于使用。聚焦搜索和“邮件”的搜索能力得到增强，可更轻松地找到所需内容；隔空投送（AirDrop）传输及网络文件浏览速度也有所提升。此外，系统还包含多项日常体验优化。其他说明有关 Apple 软件更新中的安全内容，请参阅：support.apple.com/100100。部分功能可能不适用于所有地区或所有 Apple 设备，详见：apple.com/ macos / feature-availability。部分 Apple Intelligence 功能可能设有使用限制，包括 Siri AI、智能照片编辑工具、图像游乐场，以及“快捷指令”中的 AFM 3 云端模型。与其他软件更新一样，本次更新会加入新功能和改进，也可能对设备性能和 / 或电池续航产生影响。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/000/534.htm", "publishedAt": "2026-09-09T19:35:51+00:00"}, {"title": "Shopify 推出 Gisting 新技术：将大模型系统提示词压缩为主旨词元", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/WlJkEfJxMgaK9o91ow2Z?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-09T16:30:00+00:00"}, {"title": "DeepSeek 把 V4 Pro 静默路由到费用更低、性能更好的 Flash，但用户表示拒绝", "summary": "\"请不要这样做。\" 这是 DeepSeek 决定把 V4 Pro 的请求静默路由到 V4.1 Flash 之后，开源社区第一时间的反应。 9 月 9 日下午，DeepSeek 的 Tianyi Cui 在 X 上发帖，宣布了一个决定：V4.1 Flash 正式上线之后、V4.1 Pro 上线之前，所有打到 V4 Pro 的请求都会被路由到 V4.1 Flash，并按 Flash 的价格计费。 理由是技术上...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502395", "publishedAt": "2026-09-09T10:49:15+00:00"}, {"title": "GPT Images 2.5 突发上线！网友的「灵魂画作」一个比一个离谱", "summary": "过于抽象#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1679329?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-09-09T10:37:37+00:00"}, {"title": "‌Anthropic 预训练研究员宣布离职，称 AI 实验室拿人类生命押注超级智能", "summary": "\"我今天从 Anthropic 辞职了。\" Jacob Coxon 在 OpenAI 和 Anthropic 做了三年预训练研究。今天他在 X 上发的这条离职帖，不到半天就超过 2600 万次浏览。 他说得直接：「两家公司都没有在负责任地做事。他们正在直奔自我改进的超级智能，拿我们的命在赌。」 Coxon 的帖子一共七条，每一段都在拆解一个问题。 第一条定调...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502394", "publishedAt": "2026-09-09T07:09:38+00:00"}, {"title": "蚂蚁百灵发布首个金融增强模型，AI开始进入真实投研工作流", "summary": "蚂蚁集团百灵首个金融增强开放模型 Ling-3.0-flash-Fin发布。", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/486288.html", "publishedAt": "2026-09-09T05:02:30+00:00"}, {"title": "SkyProduction限免活动第二期：MiniMax H3会员限时免 ro 机型发售时也不会提供，但运行 iOS 27、iPadOS 27 和 macOS 27 的用户可查看参考图片。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/000/544.htm", "publishedAt": "2026-09-09T21:03:15+00:00"}, {"title": "苹果 iPhone 18 Pro 系列发布：新增可变光圈技术、首发 2 纳米制程工艺 A20 Pro 芯片，9999 元起", "summary": "IT之家 9 月 10 日消息，在今晚的苹果 2026 年秋季发布会上，iPhone 18 Pro 系列正式发布，包括 18 Pro 和 18 Pro Max，起售价分别为 9999 元和 10999 元。苹果 iPhone 18 Pro 售价：存储规格官方售价24 期参考月供256GBRMB 9,999RMB 417 / 月起512GBRMB 11,999RMB 500 / 月起1TBRMB 15,499RMB 646 / 月起2TBRMB 20,499RMB 855 / 月起苹果 iPhone 18 Pro Max 售价：存储规格官方售价24 期参考月供256GBRMB 10,999RMB 459 / 月起512GBRMB 12,999RMB 542 / 月起1TBRMB 16,499RMB 688 / 月起2TBRMB 21,499RMB 896 / 月起全新 iPhone 18 Pro 系列提供黑、银、冰川蓝和勃艮第酒红色 4 种配色，外观与 iPhone 17 Pro 接近、首发 A20 Pro 芯片，在智能能力、性能、电池和摄像头方面迎来升级，定位为围绕用户个人需求提供帮助的 AI 手机。苹果新 CEO 特努斯表示，iPhone 将把 AI 能力与设备内的个人情境结合，支持用户随身调用相关功能。电池续航方面，苹果称 iPhone 18 Pro 系列拥有“iPhone 历史上最长的电池续航”。官网显示，iPhone 18 Pro 视频播放最长可达 34 小时、Pro Max 视频播放最长可达 43 小时。系列机型支持 MagSafe 无线充电，功率最高可达 15 瓦 (需 20 瓦及以上电源适配器)。屏幕显示方面，iPhone 18 Pro 系列配备超视网膜 XDR 显示屏，支持 ProMotion 自适应刷新率技术、全天候显示和灵动岛功能。其中，iPhone 18 Pro 的屏幕尺寸为 6.3 英寸、Pro Max 的尺寸为 6.9 英寸。外观设计方面，iPhone 18 Pro 系列铝金属一体成型机身，侧边配有操作按钮、相机控制按钮，取用照片和视频工具更快捷。新机正面配备超瓷晶面板，抗刮划能力提升至 3 倍，并支持在 6 米深的水下停留时间最长可达 30 分钟。性能体验方面，iPhone 18 Pro 系列首发搭载 2 纳米制程工艺 A20 Pro 芯片，其封装方式借鉴了 M 系列芯片，性能和能效均创 iPhone 新高，拥有 6 核中央处理器 + 7 核图形处理器，配备神经网络加速器、双 16 核神经网络引擎，支持硬件加速光线追踪。iPhone 18 Pro 系列还配有新一代 VC 均热板，直接将散热面积增大到三倍，结合更强的导热材料，可轻松送走更多热量。苹果官网显示，新机创新的散热技术与 A20 Pro 芯片配合，持续性能相比 iPhone 17 Pro 最高提升 40%。影像拍摄方面，iPhone 18 Pro 系列前置 1800 万像素 Center Stage 摄像头，支持轻点变焦和旋转、拍照人物居中、视频超稳防抖、同步双拍和视频通话人物居中；后置 4800 万像素 Pro 级融合式摄像头系统，包括 4800 万像素融合式主摄带可变光圈、4800 万像素融合式超广角、4800 万像素融合式长焦，支持 Pro 级控制选项、超高分辨率照片、杜比视界视频拍摄、智能追踪对焦、微距摄影等。IT之家注意到，苹果 iPhone 18 Pro 系列已为 Apple 智能预备好。苹果官方表示，Apple 智能是深植于 iPhone 中的个人化智能系统，能根据个人情境为你在写作、表达自我、处理各种事务上提供协助，让一切更简单轻松。Apple 智能推出时间依监管部门审批情况而定。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/000/535.htm", "publishedAt": "2026-09-09T19:40:55+00:00"}, {"title": "229 元起：苹果为 iPhone 18 Pro / Max、iPhone Duo 上线多款配件", "summary": "IT之家 9 月 10 日消息，在 2026 秋季新品发布会结束后，苹果官网为 iPhone 18 Pro、iPhone 18 Pro Max、iPhone Duo、AirPods 5 等新品发布了全新的配件，起售价 229 元。一、挂绳等配件：配件价格适合群体链接斜挎挂绳（勃艮第酒红色等）RMB 449想把 iPhone 随身斜挎、解放双手的人点此前往苹果官网选购腕带（清透蓝色等）RMB 229需要防止手机意外脱手、偏好轻便携带的人点此前往苹果官网选购AirTag 精织斜纹钥匙扣（勃艮第酒红色等）RMB 299已有 AirTag，想挂在钥匙、包或行李上的人点此前往苹果官网选购1.1、斜挎挂绳该产品共提供 9 种颜色，分别为勃艮第酒红色、橄榄色、清透蓝色、海军蓝色、浅褐色、洋红色、浅灰色、黑色和沙砾色。官方介绍如下：这款精心设计的斜挎挂绳可安装在特定的 Apple 手机壳上，方便你解放双手，轻松携带 iPhone。挂绳由 100% 再生 PET 纱线窄幅机织而成，工艺精美，触感顺滑，上身垂坠且舒适。挂绳上的不锈钢滑扣让你能将之轻松调节到适合长度，同时内嵌的柔性磁体可将交叠的两层挂绳整齐固定。1.2、腕带这款 Apple 腕带共有 6 种颜色可选，分别为勃艮第酒红色、橄榄色、清透蓝色、浅褐色、洋红色和黑色。官方介绍如下：这款腕带专为搭配特定 Apple iPhone 保护壳和 AirPods Pro 而设计，方便你解放双手，轻松携带这些产品。腕带采用 100% 再生 PET 纱线精心编织而成，可舒适系于腕间，适合全天佩戴。内嵌的柔性磁体可让腕带整齐固定。1.3、AirTag 精织斜纹钥匙扣这款 AirTag 精织斜纹钥匙扣目前有 5 种颜色：深橄榄色、勃艮第酒红色、山花蓝色、海军蓝色和黑色。IT之家附上官方介绍如下：这款精织斜纹钥匙扣，通体由创新材料精心打造。不锈钢材质既亮眼又坚固，而耐用的超细斜纹面料则有着麂皮绒般的手感，并且消费后回收成分占比达到 68%，碳排放量比皮革材料显著减少。它严丝合缝地包住 AirTag，让你不用担心脱落。AirTag 需单独购买。二、iPhone 配件配件价格用途链接iPhone 专用 MagSafe 精织斜纹卡包RMB 449磁吸放置常用卡片点此前往苹果官网选购iPhone 18 Pro Max 专用 MagSafe 透明保护壳RMB 399展示机身颜色，同时提供日常保护点此前往苹果官网选购iPhone Duo 保护壳RMB 599为 iPhone Duo 提供纤薄的跌落、刮擦防护点此前往苹果官网选购带支架的 iPhone Duo 双面夹RMB 999保护 iPhone Duo，并提供支架使用方式点此前往苹果官网选购2.1、iPhone 专用 MagSafe 精织斜纹卡包官方介绍如下：iPhone 专用 MagSafe 精织斜纹卡包的设计兼顾风格与功能，是随身携带身份证件和信用卡的理想之选。这款卡包还支持“查找”功能，当它与你的手机分离时，你会收到关于它最后已知位置的通知 **。精织斜纹材料由耐用的超细斜纹纤维制成，手感顺滑。这款配件中精织斜纹材料的消费后回收成分占比达到 100%，碳排放量比皮革材料显著减少。卡包内置强力磁体，可轻松吸附于 iPhone 的背部。你还可以将它吸附在各款 MagSafe 保护壳上，更显你的独特风格。这款精织斜纹卡包有防护功能，可放心收纳最多达三张信用卡。2.2、iPhone 18 Pro Max 专用 MagSafe 透明保护壳官方介绍如下：这款 Apple 设计的保护壳纤薄轻盈、便于握持，既能尽显 iPhone 18 Pro Max 的亮丽外观，又能为机身提供额外保护。它还可稳固连接腕带或斜挎挂绳，方便你解放双手，轻松携带 iPhone。保护壳采用高透光聚碳酸酯和柔韧的材质，与机身按钮契合得丝丝入扣，方便使用。这款保护壳还支持顺畅使用相机控制功能。它带有一片蓝宝石玻璃，并有传导层，能够将手指的动作传递给相机控制按钮。保护壳外层和内层表面均拥有防刮擦涂层。而且所有材质和涂层均经过优化，可防止因长期使用而泛黄。这款保护壳内置磁体，可与 iPhone 18 Pro Max 精准对齐，安装起来更轻松，无线充电更快捷。充电时无需取下保护壳，只要将 iPhone 吸附上 MagSafe 充电器，或放在 Qi 认证充电器上即可。与 Apple 设计的所有保护壳一样，这款保护壳在设计和制造过程中历经了数千小时的测试。因此，它不仅拥有出色的外观，更能在你的 iPhone 受刮擦和跌落时提供妥善保护。2.3、iPhone Duo 保护壳官方介绍如下：Apple 打造的这款两件式保护壳，专为 iPhone Duo 精心   if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');

  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
