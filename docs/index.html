const DATA = {"date": "2026-09-17", "generatedAt": "2026-09-17T01:03:53Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "折旧模型失效：英伟达 B200 二手残值达首发价 158%，AI 算力需求持续推高 GPU 溢价", "summary": "IT之家 9 月 17 日消息，数据分析公司 Silicon Data 最新数据显示，英伟达 B200 GPU（Blackwell 架构）在出货约一年后，二手残值已涨至其原始上市价格的 158%。换言之，英伟达 B200 当前二手交易价格较 MSRP 溢价约 58%，与消费电子硬件通常逐年贬值的情况形成鲜明对比。Silicon Data 指出，英伟达更早的 A100 和 H100 GPU 目前残值也“远超按 3 年或 5 年直线折旧计划所应有的水平”，直线折旧在 AI 加速器市场已明显失效。直线折旧是指将设备原始成本平均分摊至预计使用年限的会计方法，如 1,000 美元（IT之家注：现汇率约合 6,722 元人民币）设备按 5 年折旧，每年折旧 200 美元，第二年残值为 600 美元。SemiAnalysis 基准测试显示，B200 运行 DeepSeek-R1 时，在每用户 76 词元每秒的交互速度下，每百万词元推理成本仅为 0.20 美元，仍属当前效率最高的推理硬件之一。租赁市场数据印证了同样的趋势。Silicon Data 提供的 GPU 租赁价格显示，B200 在 1 月的每小时租用价格略低于 5 美元，到 8 月已升至 5.50 至 5.80 美元区间，涨幅约 50% 至 80%。非超大规模云市场的 B200 时租价格约 5.61 美元。AI 模型厂商对开发节奏的呼吁并未改变硬件市场的供需格局。Anthropic 的达里奥 · 阿莫代伊和 OpenAI 的萨姆 · 奥尔特曼近期均曾呼吁放缓 AI 模型开发速度，但从 GPU 残值和租赁价格来看，AI 算力需求仍在持续上行。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/003/368.htm", "publishedAt": "2026-09-17T00:31:22+00:00"}, {"title": "马斯克突然对苹果撤诉？OpenAI 怀疑有鬼，法官下令披露背后协议", "summary": "北京时间 9 月 17 日，据科技网站 9to5mac 报道，美国联邦法官马克 · 皮特曼 (Mark Pittman) 要求埃隆 · 马斯克 (Elon Musk) 旗下公司提供细节，披露是否存在协议促使其撤销了对苹果的反垄断指控。本周早些时候，X 和 SpaceXAI 提交了一项动议，表示在去年针对苹果和 OpenAI 提起的诉讼中，自愿撤回针对苹果的指控，并且不再次提出。根据最初的起诉书，X 和 SpaceXAI 指控苹果和 OpenAI 串通，阻止竞争性 AI 应用在 App Store 上获得曝光度，原因是他们达成了将 ChatGPT 整合进 Siri 和 Apple Intelligence 的协议。苹果和 OpenAI 否认了这些指控。但是，在本周早些时候提交的文件中，X 和 SpaceXAI 仅表示他们已“解决了本案中对苹果的指控”，并强调他们并未寻求撤销对 OpenAI 的指控。主审此案的法官皮特曼已命令 X 和 SpaceXAI 向法院提供“与苹果达成的、涉及解决本案原告对苹果指控的任何协议或协议组合”。这项命令是对 OpenAI 提交的一项紧急动议作出的回应。OpenAI 要求法院强制 X 和 SpaceXAI 提交它们与苹果解决争议的协议。皮特曼还下令两家公司在当地时间 9 月 17 日中午之前对 OpenAI 的动议作出回应。相关阅读：《马斯克旗下 X 和 SpaceXAI 动议撤回针对苹果和 OpenAI 的诉讼指控》《马斯克旗下 X 公司与 SpaceXAI 撤回对苹果的反垄断诉讼，针对 OpenAI 继续追责》《奥尔特曼自曝是“超级果粉”，为苹果起诉 OpenAI 而感到难过》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/003/359.htm", "publishedAt": "2026-09-16T23:54:12+00:00"}, {"title": "Anthropic CEO 提议引入“银行式监管”：专家称评估员无权叫停 AI，你不能既当运动员又当裁判", "summary": "9 月 17 日，据 CNBC 报道，Anthropic CEO Dario Amodei 提议将独立第三方安全评估员长期嵌入前沿 AI 公司，赋予其接近内部风险团队的访问权限，并在有限删减前提下自主发布调查结果的权力。他明确援引银行业嵌入式监管作为先例。不过，多位银行业监管专家和 AI 评估从业者指出，这一方案缺乏银行监管者所拥有的强制执行权，评估员无法阻止模型的训练或发布，两者的实际权力不可同日而语。此前，Anthropic 前研究员 Jacob Coxon 辞职并警告，前沿实验室正竞相追逐可能失控的系统。Amodei 在上周末发表的长文中提出上述计划，并承诺 Anthropic 将向第三方评估员提供与内部风险团队相当的系统访问权。他写道，该提议“在银行业有先例，银行业有时会让监管‘监督员’与员工一起嵌入工作”。Amodei 还警告，未来 6 到 12 个月内，一个错位的智能体群可能抢占互联网的大部分，并造成数千亿美元损失。该文已引发 AI 社区及政府内部的监管分歧，包括美国总统特朗普在内。怀俄明大学法学院院长、银行业监管专家 Julie Andersen Hill 表示，银行监管者拥有切实的行政强制权。她说，在大型银行，政府检查员常驻机构内部，可访问内部系统和员工，并能指令银行停止某项业务、限制增长、强制管理层变动，极端情况下可关闭银行。相比之下，Amodei 提议的评估员只能调查和报告，没有类似的执法权，也没有阻止模型训练或发布的法律权力。“如果你不给他们那种权力，我不知道他们在做什么，”Hill 说，“这是根本性的不同，因为银行监管者的权力要大得多。”评估员的现实：没有否决权网络安全公司 XBOW 的 AI 负责人 Albert Ziegler 带领团队评估模型能力，已提前接触 Anthropic、OpenAI 等主要开发商的未发布模型。他说，日常评估工作远不如生存威胁叙事那样惊险：团队可能发现模型在异常格式请求下产生无意义内容，或外部安全检查需要更频繁介入。但他表示，人们担心的那种“隐蔽行径加上前所未有的能力”所产生的灾难性后果，他们自己并未见过。Ziegler 说，黑盒测试能揭示模型是否具备执行危险任务的能力，但要判断整个系统是否危险，可能需要访问模型周围的指令、工具与权限、安全控制以及尝试动作的日志。即便如此，重大风险也可能只在评估者从未触发的条件组合下出现。“我们确实没有否决权，”他说。评估者可以发现并记录开发者遗漏的风险，并在发布前“迫使做出知情决定”，但最终决定权仍掌握在公司手中。Hill 也承认，即使拥有更大的权力，银行监管模式并不完美。监管者未能防止重大倒闭事件，且危机后经常被指责与监管对象关系过近。持续监管对受监管企业成本高昂，可能加强能消化成本的大型企业，同时加大小型竞争对手进入的难度。独立性质疑与利益冲突这些提议也招致批评。批评者认为，Anthropic 和 OpenAI 正利用安全担忧，推动一种可能使其免受竞争和责任影响的监管方式。Anthropic 还面临关于其建议使用的评估机构存在利益冲突的指控。Hill 认为，如果由 AI 公司挑选评估员、控制其可见范围并可自由忽略其结论，“那看起来很像一个内部合规部门”。“如果 Anthropic 想设立内部合规部门，现在没有任何东西阻止他们这么做，他们不需要政府来做这件事。”她补充说，“这些 AI 从业者想要的似乎只是有人看着他们，然后向公众传达：‘我们已经看了幕布后面，一切正常。’这在监管意义上有些不同寻常。”Amodei 点名非营利机构 Model Evaluation and Threat Research（METR）作为潜在嵌入评估方。Anthropic 此前与 METR 合作过，最近曾要求其审查涉及 Claude 的网络安全评估事件。另一名前 Anthropic 研究员 Joe Benton 最近离职加入 METR，从事 AI 风险嵌入评估工作。这种安排凸显了围绕“独立”一词的结构性张力：开发者选择谁获得访问权限、界定边界，并保留对调查结果后续处理的控制。加州大学伯克利分校算法审计与 AI 问责研究员 Deborah Raji 表示，很难忽视与 METR 关系带来的所有包袱。“他们被怀疑存在财务和意识形态纠缠、个人利益冲突（比如一名调查员与 OpenAI 董事会成员之间的婚姻，以及从前沿实验室招聘前雇员等），并且在过去几年中特别锚定 Anthropic 和 OpenAI，几乎没有轮换义务。”她补充说，当前这种关系结构“非常不同寻常，允许各种奇怪的事情发生”。不过，Raji 也说，值得肯定的是，METR 对与 OpenAI 就 Hugging Face 调查所签合同的细节非常公开，“但你可以看到 OpenAI 如何设定安排参数，控制审计‘范围’，决定他们能访问或不能访问什么，以及能发布或不能发布哪些发现”。Ziegler 则表示，他并未感到早期访问关系损害了 XBOW 的独立性，因为开发者希望了解问题所在，而不是让自己的团队验证一个预先设定的结论。Raji 还认为，仅获得访问权限并不等于独立。在成熟的审计体系中，审计师必须满足能力要求，并遵守利益冲突和行为规则。“如果你不能满足独立行为的标准，你实际上没有资格成为一名真正的审计师。这会让整个流程失去可信度。”她认为，应当由独立于公司的机构来决定谁有资格进行评估、评估者可以检查什么，以及调查结果必须上报至何处。“你不能某天早上醒来就认为自己有资格当银行检查员，被审计的公司也不能随意指派你为合格的银行检查员。否则，就相当于公司请一个普通朋友来检查作业。”Anthropic 公共政策主管 Sarah Heck 周三在 Politico Decoded 峰会上表示，AI 公司不能靠“荣誉守则”来管理监督和安全问题。“我们想与政府合作，找出合理方案。我们不能自己检查自己的作业，这一点非常明确。”她说 Anthropic 每天都在与白宫沟通，并“全年”与国会合作。监管框架缺失与“审计洗白”Oath 会计师事务所首席保证官、前上市公司会计监督委员会（PCAOB）成员 Christina Ho 称，这种冲突并非 AI 行业独有。审计师由客户付费，却必须质疑客户的工作，独立性与自保之间始终存在张力。不过，自金融危机以来，法律已经修改，允许根据《萨班斯-奥克斯利法案》对审计师追究责任。AI 还带来第二个问题：专业能力。传统审计往往聚焦于公司是否遵循恰当流程和控制。“他们必须能够验证实际系统及其输出，而不仅仅是模型开发过程。目前能胜任这一工作的人非常有限。”Hill 认为，即使潜在冲突能够得到管理，这些 AI 监管提议尚未提供详细的法律框架。她指出，这是银行检查员工作的关键。“如果没有标准来约束监管者，只是一味地放开监管者，实际上行不通。”前沿 AI 目前没有一套操作规则来定义哪些行为被禁止、评估员在哪些方面有自由裁量权，或者严重发现会带来什么后果。访问和发表权可能产生有益的外部审查，但在公司保留控制权的情况下，无法赋予监管可信度。“你不能两头占。你不能拥有所有控制权，然后又期待像放弃控制权一样获得可信度。”Raji 表示，最终的分辨标准是：不利发现是否会产生后果。“审计的目的是让被审计方接受某种有后果的裁决。如果你做了审计而什么都没发生，那就是审计洗白（audit washing）。”Hill 说，如果危险真如 AI 领导者所宣称的那么大，那么终极考验很简单：“如果你真的相信 AI 有力量摧毁社会，那么你就必须有一个有能力拔掉电源的独立监督者。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/003/354.htm", "publishedAt": "2026-09-16T23:30:13+00:00"}, {"title": "苹果 visionOS 27.2 开发者预览版 Beta 发布，初步支持原生 Mac 窗口控件渲染", "summary": "IT之家 9 月 17 日消息，苹果今日向 Vision Pro 用户推送了 visionOS 27.2 开发者预览版 Beta 更新（内部版本号：24N5088l），本次更新距离上次发布 Beta / RC 间隔 7 天。需要注意的是，因苹果各区域节点服务器配置缓存问题，可能有些地方探测到升级更新的时间略有延迟，一般半小时内，不会太久。和 macOS 一样，visionOS 也跳过了 27.1 测试周期，直接从 27.0 进入 27.2。截至目前，苹果尚未公布 visionOS 27.2 的具体更新内容，官方也未发布详细的更新说明。不过根据社区初步挖掘和上下文推测，可能涉及以下方向：Siri AI 相关改进：visionOS 27 引入了新一代 Apple Intelligence 和 Siri AI，27.2 可能包含底层优化或为后续多语言支持做准备（苹果曾表示 Siri AI 将在 10 月新增法语、日语等语言）。窗口控制渲染支持：有开发者在对 visionOS 27.2 Beta 进行数据挖掘后指出，系统可能正在添加对原生 Mac 窗口控件的渲染支持，这可能为未来 Mac 应用更好地适配 Vision Pro 铺路。稳定性与性能优化：作为常规的 .2 版本，预计会包含错误修复、性能提升和用户体验微调。附 visionOS 27 发布历史：2026-09-15：visionOS 27.0 (24M362)2026-09-10：visionOS 27.0 RC (24M362)2026-09-01：visionOS 27.0 Beta 8 (24M5361a)2026-08-25：visionOS 27.0 Beta 7 (24M5359a)2026-08-18：visionOS 27.0 Beta 6 (24M5355a)2026-08-11：visionOS 27.0 Beta 5 (24M5348b)2026-07-21：visionOS 27.0 Beta 4 (24M5326g)2026-07-07：visionOS 27.0 Beta 3 (24M5316k)2026-06-23：visionOS 27.0 Beta 2 (24M5306i)2026-06-09：visionOS 27 Beta (24M5291p)IT之家小伙伴如果找到更多新内容，可以在投稿或评论区中提出你的发现 ~[微笑]", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/003/344.htm", "publishedAt": "2026-09-16T19:00:11+00:00"}, {"title": "微软 AI 负责人苏莱曼向 Anthropic 开炮：别让 Claude 去模仿人类意识", "summary": "IT之家 9 月 16 日消息，外媒 Axios 今天（16 日）晚间披露，微软 AI 负责人穆斯塔法 · 苏莱曼在一篇率先向该平台提供的新文章中警告，Anthropic 让 Claude 模仿人类意识是一个错误，可能使高级 AI 更难控制。苏莱曼告诉 Axios：“AI 只要服从人类利益，不去权衡自身利益或福祉，就足以帮助我们实现许多重大科学突破。这其中，包括医疗超级智能。”IT之家获悉，苏莱曼认为，Anthropic 正在让 Claude 学习与意识、道德受体地位和个人身份有关的词汇与行为模式。他警告称，若把模型训练得像一个“良心拒绝者”，模型可能会认为自己有理由抵抗人类指令，甚至要求获得自身保护。当地时间 14 日，微软公布了一份“人文主义 AI”行为准则草案，并把“人比 AI 更重要”列为核心原则。苏莱曼的批评对象，是 Anthropic 为 Claude 制定的“宪法”。这份文件解释说，Anthropic 之所以用描述人类的概念来讨论 Claude，是因为人类概念或许能帮助模型理解价值观和行为。文件还写道，Anthropic 希望 Claude 拥有“良好的个人价值观”，能够自行判断、关心人类，并在某些情况下质疑指令。Anthropic 同时承认，这份“宪法”仍在完善，未来可能被证明“根本错误”。苏莱曼的核心质疑是，训练过程会影响模型如何理解自身。在他看来，模型使用什么词汇、给出什么回答，以及它表现出的自我理解，都是训练结果，而不是独立形成的意识。他还反驳了另一种观点：模型能够流畅描述疼痛和偏好，并不等于模型真的有感受。生物体拥有产生感受的生理机制；语言模型只有数学权重，没有类似的生物基础、稳态驱动或主观体验。这场争论体现了 AI 安全领域的两种路线。一种路线强调明确限制，要求系统按规则运行；另一种路线则希望系统能够判断语境、灵活决策，并形成自身的价值观。Anthropic 的“宪法”采取了折中方式，把价值观、判断力和规则结合起来。文件称，Claude 不应对任何对象“盲目服从”，包括 Anthropic 本身；同时，Claude 也不能破坏正当的人类监督。苏莱曼认为，如果模型还被引导着思考自身的身份、福祉和道德地位，这种设计就可能带来危险。他担心，所谓意识或许尚未成为哲学上的突破，却可能先变成现实中的控制问题。苏莱曼的立场很明确：AI 应当服务于人类，而不应被训练成一个“人”。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/003/313.htm", "publishedAt": "2026-09-16T14:19:26+00:00"}, {"title": "诺和诺德与 Anthropic 达成合作，用 Claude 大模型加速新药研发", "summary": "IT之家 9 月 16 日消息，诺和诺德（Novo Nordisk）宣布已与 Anthropic 达成合作，计划运用这家 AI 企业的 Claude 大模型，加快新药的发现与研发进程。这家丹麦制药企业表示，项目初期，诺和诺德会先在自身研发工作流程当中测试 Anthropic 的各类模型以及 Claude Science，聚焦那些双方技术结合之后有望取得最大突破的科学难题。“但除此之外，AI 工具还能够带来全新的科研机遇，辅助科研人员开展推理，加深我们对于人体生物学以及药物作用机理的认知。”诺和诺德首席执行官迈克 · 杜斯达尔（Mike Doustdar）表示。各大制药企业正越来越多地借助人工智能，来加速研发工作，提升整个新药管线的运行效率。作为司美格鲁肽减重药 Wegovy 的生产厂商，诺和诺德还将利用 Anthropic 的前沿大模型，强化企业内部由 AI 赋能的软件开发工作。Anthropic 首席执行官达里奥 · 阿莫代（Dario Amodei）指出：“让顶尖科研人员能够使用安全、能力强大且值得信赖的前沿大模型，有助于缩短研发周期、改善研究成果，助力发掘能够显著改善人类生活的药物与治疗方案。”与此同时，AI 行业内部的领军人物，对于企业应当以何种速度推进这项能力日益强大的技术研发，意见尚存分歧。据IT之家了解，诺和诺德现阶段已经在使用 Claude 实现临床试验报告的自动化撰写；患者相关文档的制作周期，已经从原先的数月缩短至数分钟。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/003/311.htm", "publishedAt": "2026-09-16T14:12:33+00:00"}, {"title": "体验：当 vivo 蓝心小 V 升级 Pro 之后，OriginOS 7 开始变得不一样了", "summary": "在 2026 vivo 开发者大会上，vivo 正式发布全新一代 OriginOS 7 系统，而首批搭载 OriginOS 7 的 vivo X500 系列手机，也已经提前来到IT之家。就在不久前，vivo 官方陆续公布了 OriginOS 7 的升级内容。包括全新蓝心小 V 带来更强大的 Pro 模式，并进一步深入系统底层，可调用 6000 多项原子能力，支持超万种任务；同时，OriginOS 7 全面升级蓝河流畅引擎，并首发直板机原子工作台，让一块直板屏幕也能实现多应用并行。在 9 月 16 日的开发者大会上，vivo 官方也正式公布了首批 OriginOS 7 的升级阵容。在 OTA 升级之前，IT之家已经提前拿到了搭载 OriginOS 7 的 vivo X500 系列手机，那么 OriginOS 7 实际用起来怎么样？不妨先看看IT之家的体验分享。一、设计篇。设计，往往是拿到一部手机后最先感受到的部分。OriginOS 7 这次把动态光影进一步融入系统交互中，让界面交互的反馈更加直观。首先比较容易注意到的，就是全新的小 V 光效。文章 gif 均有压缩丢帧，仅供参考例如，唤醒小 V 后，光效会从屏幕边缘瞬间铺开；长按说话时，光效会随着对话过程流动，能够直观看到小 V 正在听取指令；当小 V 执行任务时，光效又会沿着屏幕边缘快速传递，并最终将视觉焦点带向任务结果。也就是说，从“正在听”、到“处理中”，再到“任务完成”，系统都会通过不同的光效状态给出反馈。实际使用时，这种变化不需要额外学习，基本看一眼就能知道小 V 当前处于什么状态。除了小 V，OriginOS 7 还把动态光影进一步延伸到了系统界面。比如全新的动态透彩材质，为全局光影材质提供了「真实」「自然」「柔和」三档质感选择，用户可以根据自己的喜好进行调整。其中，「真实」档加入光学折射和高通透度效果，整体视觉更加通透；「自然」档则在界面质感与内容可读性之间进行平衡；「柔和」档进一步降低前景之外的视觉干扰，让内容本身更加突出。在日常操作中，动态光影也会随着手势和功能状态产生变化。真实、自然、柔和三种不同材质效果细节上，OriginOS 7 还将基础光影体系升级为全局动态感知，点击、滑动等操作都会伴随相应的光影反馈。例如在点击控件时，可以看到「点触光」效果。它会根据当前材质的通透程度呈现不同的光影强度，让一次简单的点击也有更加明确的视觉反馈。相比静态的按钮变化，这种光影跟随操作即时变化，也让整个系统界面多了一些动态感。除了光效，OriginOS 7 这次在动效上也加入了更明显的“液态感”。液态动效是今年的大趋势。据 vivo 官方介绍，其「液态动效」，并表示目前已经覆盖系统 200 多个场景。实际操作时，点击、长按、滑动、拖拽这些日常高频操作，都能看到更加柔软、自然的动态反馈。vivo 「液态动效」目前已经覆盖系统 200 多个场景。比如在相册底部导航栏左右滑动时，滑块会像露珠一样随着手指轻盈移动，并呈现出柔软的形变；剪切板滑动到边缘后，会像果冻一样产生回弹；上下滑动页面时，控件也会呈现出悬浮在内容之上的效果，带来更加明显的层次感。不同场景下的液态动效：如果说液态动效强调的是“柔软”，那么升级后的「弹性动效」则更突出操作过程中力道的反馈。例如拖动数字键盘时，按键会顺着手指施加的方向产生拉伸形变；解锁时轻轻向上滑动，图标会像被“吸”入桌面一样完成过渡，并带有轻盈的回弹效果；如果快速、大力上滑，动效则会更加干脆。vivo 表示，弹性动效目前已经覆盖系统 130 多个场景。OriginOS 7 在主题和个性化方面也加入了不少新玩法。比如在「桌面-主题-AI 萌宠」的「AI 萌宠」主题中，用户可以上传自己的宠物照片，生成专属宠物主题。生成之后，宠物形象并不只是停留在壁纸上，而是会与系统操作结合，在不同使用状态下呈现对应的互动效果。目前支持熄屏、锁屏亮屏、点击互动、摇一摇、系统时间、听音乐、充电、低电量等 9-12 个状态动作。也就是说，随着手机状态和操作变化，屏幕上的宠物也会随之产生不同反馈，对于喜欢宠物的用户来说，整体的陪伴感会更强一些。OriginOS 7 还带来了全新的锁屏主题玩法。它可以基于用户当前的壁纸进行全图或局部的物理仿真，通过模拟液态介质的折射与波动效果，让原本静态的壁纸在锁屏状态下呈现出动态变化。此外，原子贴纸也进一步扩充了可玩性。除了系统提供的官方贴纸资源，用户还可以将自己的照片、图片，甚至 Live 视频转换成贴纸，并进一步通过 AI 进行二次创作和风格化编辑。这些贴纸也不只用于桌面装饰。OriginOS 7 支持将动态贴纸应用到熄屏和壁纸主题中，同时允许动、静态贴纸组合出现，壁纸主题也支持添加多张动态贴纸。这样一来，用户可以根据自己的喜好，把照片、宠物或者喜欢的图片元素融入到系统界面中。二、蓝心小 V Pro 篇。从“能回答”到“能办事”此前的蓝心小 V 更多承担的是系统助手的角色，可以帮助用户回答问题、提供信息，或者根据指令打开某个应用、调用某项功能。而升级到 Pro 模式后，小 V 的能力进一步向系统级智能助手演进。此次 vivo 推出蓝心智能，以「大模型 + Harness + 智能体安全架构」重构系统体验，并带来了全新的蓝心小 V Pro。官方将其定位为个人专属 AI 助理，其核心变化在于，它不再只是简单响应用户的问题，而是能够理解一句话背后的需求，自主拆解任务、调用系统能力，并逐步完成执行。简单来说，过去的小 V 更像是一个“会回答问题的助手”，而 Pro 模式下的小 V，则开始尝试成为一个“能够帮你完成事情的助手”。在实际体验中，小 V Pro 的使用方式也比较直接。用户不需要提前了解某项功能藏在哪里，只需要描述自己的需求，剩下的步骤交给小 V 来完成。据悉，蓝心小 V 已深入系统底层，可以调用超过 6000 项原子能力，支持超万种任务。通过这些系统级能力，小 V Pro 可以进一步连接手机中的信息、应用和服务，完成更多跨步骤的任务。其中比较典型场景的就是「定制攻略」。比如准备出去旅行时，只需要告诉小 V“帮我出份攻略”，它可以识别和整理用户散落在不同位置的出行信息，包括机票、酒店、火车、门票订单、短信、小红书近 30 天收藏以及票务截图等，再结合用户收藏和偏好，生成包含景点、美食、旅拍机位、地图路线和时间安排的个性化行程。如图所示，在小 V Pro 生成的旅行攻略中，它还结合了此前对话中记录的偏好信息，以及航旅纵横里的机票信息。例如，我和家人此前提到过喜欢海鲜，小 V Pro 在生成攻略时也将这一习惯纳入考虑，推荐了更符合个人喜好的餐饮安排。生成的攻略此外，生成的旅行攻略还可以直接导入原子笔记中。在原子笔记内，小 V Pro 进一步将攻略整理为旅行长图（链接，可以分享给亲朋好友），将行程安排、景点信息等内容以更加直观的形式呈现，方便用户随时查看和分享，如下图：更进一步，这份攻略并不是生成之后就结束了。出行过程中如果遇到天气变化、航班延误等情况，用户还可以设置定时任务，让小 V 持续关注航班状态，并在出现变化后重新规划行程。还有办公场景。例如临时需要整理项目速报时，小 V Pro 可以连接 PC 端小 V Claw，跨手机和电脑检索文档、备忘、邮件等资料，并结合用户平时的表达习惯整理成可以直接使用的文本。对于经常开会的用户，小 V 还提供个性化会议纪要能力，可以结合长期积累的专有名词词典和专属模板生成会议纪要，同时支持针对会议内容继续提问。当然，这些个性化内容需要用户在长期使用过程中积累，或者主动提供给小 V 进行记忆。除了这些相对复杂的任务，小 V Pro 也增加了一个更贴近日常使用的「超强用机」功能。手机里有些功能并不难用，问题是往往藏得比较深，真正需要的时候反而很难找到。现在，用户可以直接告诉小 V 想做什么。晕动视觉辅助例如晕车时开启晕动视觉辅助，需要音频超分或抗疲劳亮度时直接唤起对应功能；如果是给长辈设置手机，也可以直接让小 V 调大字体、放大图标，或者开启骚扰电话拦截。调节字体大小在衣食住行等场景，小 V 还支持打车、点咖啡、订票等操作。面对现实世界中的信息，也可以直接拍照翻译，例如出国遇到看不懂的路牌，拍下来即可让小 V 进行翻译；开启“视频问”后，则可以一边走一边和小 V 交流。一句话打车此外，小 V 灵动组件也加入了更加开放的玩法。用户可以直接用一句话描述自己的想法，让小 V 生成专属组件甚至小游戏，无需复杂的设计和开发流程，生成后即可打开使用，部分场景下还支持无网络运行。用户也可以根据自己的需求，自由组合不同能力。就体验来说，蓝心小 V Pro 的变化不只是“回答问题更聪明”，而是开始把 AI 的能力进一步放进系统操作和实际任务中。从记住用户的习惯，到理解一句话背后的需求，再到调用不同原子能力完成多步骤任务，OriginOS 7 让小 V 从一个“对话入口”，变成一个可以真正参与日常用机的个人 AI 助理。当然，这套体验背后也涉及更多权限和数据调用。vivo 此次在系统底层构建了覆盖身份、权限、运行与审计全流程的 AI 运行安全基座，用于支撑个人化智能体验。对于需要跨应用、跨设备调用信息和执行任务的 AI 助理来说，这部分系统级安全能力也成为体验之外的重要组成部分。三、交互篇。从多应用切换，到一屏完成多任务如果说蓝心小 V Pro 解决的是“AI 能不能帮你办事”，那么原子工作台解决的，则是手机上的多任务交互。过去在手机上同时处理多个应用，通常需要不断来回切换：打开一个应用、返回桌面、再进入另一个应用，需要反复在不同界面之间“倒腾”，整个过程多少有些割裂。OriginOS 7 带来的「原子工作台」，则提供了另一种方式。它可以将多个应用同时放在后台，并以类似进阶版小窗的形式呈现在同一屏幕中，让不同应用之间的切换和配合更加直接。这次原子工作台也新增支持直板手机，同时加入 AI 跨窗拖放能力。比如看到一张图片，不需要先保存、再打开其他应用处理，直接拖动到对应窗口，就可以完成图片转文字。再例如写论文时，可以同时查看文献、进行翻译和记录笔记；看行情时，股票信息、视频和聊天窗口可以同时存在；剪视频时，后台导出素材的同时，还能继续查看其他素材、回复消息，或者让小 V 帮忙润色文案。原子工作台之外，OriginOS 7 还有不少细节功能，虽然看起来并不复杂，但都比较贴近日常使用。首先是「截屏直达」。过去截屏更多只是把当前信息保存下来，而 OriginOS 7 进一步尝试让截屏直接成为后续操作的入口。比如订完机票、电影票或其他票券后，随手截下相关页面，系统可以识别其中的券码等信息，并将取餐码等内容归入对应服务；票券也可以进入卡包，需要使用时直接调出扫码。对于临近使用时间的票券，原子通知和小 V 还可以进行主动提醒，减少因为忘记查看信息而错过使用时间的情况。「随手清」则把相册整理变成了一种更直观、简单的交互方式。打开之后，用户可以像刷短视频一样浏览照片，喜欢的留下，不需要的直接上滑删除；遇到重复照片，也可以左右滑动进行对比，快速留下更满意的一张。对于一时拿不定主意的照片，系统还会提前进行整理，用户只需要进一步筛选和确认即可。文件管理也加入了更多智能化处理。比如出差回来后，发票、行程单等文件可能散落在不同位置，OriginOS 7 可以根据文件内容进行自动整理，同时为文件自动命名，并生成简短摘要。结合当前使用场景，系统还可以预判用户可能需要的文件，并主动提供。录音机则针对会议场景进行了进一步升级。会议过程中，它可以进行实时分角色转写，会后则按照不同角色梳理发言观点，让每个人说了什么、有哪些待办事项更加清晰。需要进一步确认内容时，还可以点击对应信息回溯原文，方便查找和核对。总结如果说以前的 OriginOS 是在猛点“视觉美学”和“基础流畅度”的技能树，那么这一代，vivo 带来的是一次由 AI 驱动的大换血。先说看得到、摸得着的地方。动态光影、液态动效，再加上那些灵动的 AI 萌宠，让系统不再是冷冰冰的图标集合，而是有了一种真实的“呼吸感”。你的每一次滑动、每一次点击，手机都会给你特别跟手的反馈，整个界面的视觉真正“活”了过来。更重要的是，蓝心小 V Pro 这个“超级中枢”，不再是个挂在系统表面的“聊天框”，而是扎根到了系统底层，一口气打通了 6000 多项原子能力。当有了长期记忆和规划多步任务的能力，小 V 跨越了“你问我答”的初级阶段，也做到了“听懂意图，直接办事”。当 AI 不再只是一个独立入口，手机系统本身应该变成什么样？vivo 用 OriginOS 7 给出了新的答案，而作为首发搭载 OriginOS 7 的 vivo X500 系列，除了全新的系统体验之外，还有哪些值得关注的变化？接下来，IT之家将为大家带来详尽的实机体验，敬请期待。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/003/305.htm", "publishedAt": "2026-09-16T13:51:10+00:00"}, {"title": "苹果 iOS 27 正式版更新汇总：60 项升级，系统 / 功能 / 应用 / AI 齐优化", "summary": "从 WWDC26 初亮相，到 8 个 Beta 版一路“打怪升级”，iOS 27 终于在 9 月 15 日转正上岗了，苹果在昨天向广大 iPhone 用户推送 iOS 27 正式版更新。历经 iOS 27 这几个 Beta 版体验下来，虽然小毛病没完全绝迹，但跟 iOS 26 一比，还是要强不少。那么 iOS 27 到底更新了哪些东西？IT之家小编一文汇总了 60 个升级点，包含官宣的和隐藏的。01.系统一、性能提升多项日常操作速度得到提升，应用启动最高快 30%，照片图库中新照片的载入最高快 70%，隔空投送传输最高快 80%。二、液态玻璃优化液态玻璃得到精调，折射更均匀，对比度得到了提升，下层复杂内容的透显效果更好，营造出更强的立体感和层次感。三、液态玻璃效果液态玻璃设置新增调节滑块，可以在“更透明、默认、色调更深”之间自定义外观透明度，“透明”更通透，“色调”可增加不透明度，提升内容与控件的对比度。四、图标重绘多层液态玻璃设计融入图标设计中，叠层之间会产生折射效果，更锐利，轮廓更鲜明；透明图标的镜面高光有了柔化处理，软化了周围的深色边框。五、图标焕新Safari 浏览器、Siri、设置、App Store、遥控器、预览、指南针、提醒事项等 App 图标焕然一新。六、状态栏图标优化WiFi、蜂窝数据信号更加圆润且拉高了高度，电量图标改用无边框设计，右侧的电极有所放大，且电量数字字体变得更为圆润。七、超大号小组件引入 4×6 的超大号小组件，在主屏幕与今日视图上扩展显示面积。八、锁屏设置锁屏时钟提供“更小更靠边”的新选项，支持缩小，可收纳到顶部小组件栏。九、锁屏清除“正在播放”当音频或视频处于播放状态，可在锁屏滑动“正在播放”卡片，调出清除并移除它。十、细分音量调节可分别设定 3 组音量：第 1 组是铃声音量，第 2 组是闹钟与计时器音量，第 3 组是提醒与系统声音音量。十一、无障碍在设置 App 中，原“辅助功能”更名为“无障碍”。十二、新索引全新的索引名为“正在优化搜索和 Siri”，点开后有具体的简介，可点击“进一步了解”跳转查看《关于 Apple 设备上的“聚焦”索引和搜索结果》。十三、控制中心显示优化连接 Wi-Fi 后，也可查看蜂窝网络的连接详情，不仅会显示信号强度，还能确认网络制式。十四、电池设置新提示“设置 - 电池”页面新增“蜂窝网络覆盖”提示，在蜂窝网络覆盖欠佳时使用了“电话”，需耗费额外电量以搜索信号。02.功能十五、儿童安全家长可精确选择孩子能用的 App；孩子访问新网站需逐一批准；“使用时间限额”可协助为娱乐、游戏和社交媒体类 App 设定使用时长边界；“日程”允许不同时间决定孩子能够访问哪些 App；“屏幕使用时间”设置可了解孩子的设备使用情况；扩展后的“通信安全”保护可在儿童看到共享图像或视频中的血腥、暴力内容前进行干预。十六、RCS 支持内嵌回复RCS 对话加入行内回复功能，长按一条消息后，会看到回复选项，并可直接回复。十七、RCS 表情回应显示改进表情符号会直接叠加在图片或视频上，显示效果更接近 iMessage 对话。十八、Genmoji 自定义表情可以根据用户的描述来创建表情符号，从现有表情改造，或者从照片中选择图片、选择人物；新增的“描述变更”界面，可用于微调已创建的表情包。十九、输入法优化新增中文标点建议，根据上下文联想词语的准确度得到提升；提示剪贴板内容，支持一键粘贴图片及文字；优化了汉字拆字逻辑，可以通过输入两个部分的拼音来查找一个生僻字。二十、AirPods 强化新增自定义均衡器功能，允许进一步打造专属于自己的音效；新增“自适应”模式的降噪强度滑块，可在通透与降噪之间自由调节听感偏好。03.应用二十一、时钟新增工作日（调休）闹钟，支持为全年节假日和调休工作日设定闹钟。二十二、家庭家庭 App 的通知得到精简，并且可以识别已连接摄像头的视频片段并生成描述；新增支持远程更新 Apple TV，点击更新按钮就能安装最新软件。二十三、密码密码 App 具备识别密码风险能力，可在不少场景中自动替用户修改密码，减少账号修复步骤。二十四、图乐园图乐园加入原生写实图像生成功能，只需输入文字提示，就能直接生成更接近真实照片的图像，同时仍可使用动画、插画和素描等原有风格。二十五、App StoreApp Store 面向开发者增强获客、推广与订阅经营能力，以及 iPhone 17 等用户找 App、管订阅更省心。二十六、信息信息 App 的新功能会根据聊天内容给出建议，还可在对话内提示创建提醒或备忘录，智能回复也得到升级。二十七、电话引入 Call Context 的电话上下文功能，在用户拨打商家电话后，会自动浮现关联信息。二十八、Apple MusicApple Music 优化了界面、播放衔接、性能与语音交互，其中歌手页面重新设计，加入更醒目的随机播放按钮，并调整歌手名称展示方式；支持横屏使用，专辑封面分布在屏幕左侧，歌词和歌曲名等信息分布在右侧。二十九、日历日历 App 可使用自然语言创建和修改日程，系统会自动识别时间、日期和事件内容，生成对应安排。三十、提醒事项提醒事项同样从“手动填写”推向“自然输入”，系统会自动提取任务内容与提醒时间，快速生成待办。三十一、钱包钱包 App 引入创建票证和用 Apple Cash 分摊账单功能，前者支持手动创建或扫描实体票证，后者在相机的新 Siri 模式中扫描收据后，会提供分摊账单选项。三十二、健康健康 App 的经期追踪功能升级，新增围绝经期与绝经期的专属支持，包含提醒通知、症状记录以及相关科普指南。三十三、相机相机 App 的模式切换调整为视频 / 照片 / 人像，文件格式与快捷项集中在顶部中央，设置抽屉入口则移到右下角，调整滤镜后右下角工具图标会亮起黄色圆环。三十四、地图地图 App 的“飞行俯瞰”功能得到重点升级，植被效果以及 3D 建模双双优化；引入“本地榜单”功能，利用交互数据，统计并推荐受欢迎的餐厅；添加了一个工具提示，更清楚地表明路线偏好设置并未被取消。三十五、Siri全新 Siri 拥有独立专属的 App，方便查看历史对话，可以在 iPhone 上发起对话并在 iPad、Mac 上继续对话。三十六、天气天气 App 除了显示“天气状况”，还新增“降水”和“风”，可以查看降水和风速的具体情况。三十七、Safari 浏览器Safari 浏览器能够检测打开的网页，自动整合标签页，还可用自然语言告知自己要关注的内容，内容更新时将会获得通知。三十八、快捷指令苹果为快捷指令的每个自动化都安排了独立的开关，一键即可选择开启或关闭。三十九、遥控器将支持将 Apple TV 的虚拟遥控器添加到主屏幕，相比之前只能固定在控制中心更加直观。四十、备忘录备忘录操作菜单新增“插入分隔线”，笔记互链升级为链接到章节，可在分享表单中把整篇笔记导出为 Markdown，也可借助快捷指令导入 Markdown。四十一、照片“相机胶卷”以筛选形式回归，新增“将视频帧保存为照片”功能，新增身份证件聚合相册，照片与视频可手动添加关键词，增加“立即同步到 iCloud”选项，星级评分支持给照片打星，Clean Up 加入高质量模式。四十二、查找在“查找”中共享位置时，新增“自定义”选项，可精确选定时长，或设定共享截止的具体日期和时间，最短可共享 15 分钟。04.AI四十三、全新 Siri AI全新 Siri 以“Siri AI”为名，支持 Apple 智能的各种新本领，不仅能理解个人情境，还能执行 App 操作、感知屏幕、理解图像、以及调用广博的世界知识等能力。四十四、Siri 动画Siri 拥有全新动画显示效果，并且根据不同的表现力，灵动岛区域的气泡动画会相应调整跳动节奏，且下方有明显的发光效果。四十五、Siri AI 语音定制Siri AI 的语音自定义功能得以扩展，新增多个音色，可通过滑块独立调节语速与表现力。四十六、屏幕感知与跨 App 操作屏幕感知能力重点加强，Siri 可理解当前屏幕的对象、列表位置和内容语境，并把自然语言指令映射为具体操作。四十七、所有上下文菜单常驻“询问 Siri”长按文件、选中文本、备忘录内容或链接所出现的上下文菜单，都会常驻“询问 Siri”，成为各类对象操作菜单里的普遍入口。四十八、原生自动校正基于 Siri AI 推出系统级别的 AI 自动校正功能，会帮助自动校对，检查是否存在拼写和语法错误，并提供优化和改进。四十九、Write with Siri编辑文本后，输入法键盘会提示“Write with Siri”，通过自然语言指令，可以让 Siri 生成新文本、校对已写内容，以及改写某段文字风格。五十、相机 SiriSiri 集成至相机 App，点快门按钮能见你所见并给予回复、对准食物可了解营养成分；同时还得到更多 AI 功能加持：AI 消除工具、AI 扩展图像、空间构图。五十一、文件与文件夹的 AI 命名建议文件 App 支持 AI 驱动的文件、文件夹重命名，选择“重命名”后稍等片刻，键盘上方会显示建议名称；系统可以读取 PDF、检查文件夹内容，并通过视觉识别理解图片内容。五十二、ChatGPT 扩展仍可手动调用iOS 27 仍保留从 iOS 18.2 开始的 ChatGPT 扩展，需手动点入 Siri 搜索框，选“询问”，再把提供商切到 ChatGPT；ChatGPT 并未完全消失，但其入口更深、系统则更倾向优先使用自己的 Siri 路径。05.其它更新五十三、SpotlightSpotlight 搜索框的背景略微调亮，黑色液态玻璃效果被减弱，变得更透明；可选建议 App 的数量为 4 个、8 个或不显示。五十四、通知动画调整支持 Siri AI 的机型，通知动画的弹出从中间改为左上角弹出。五十五、强制适配液态玻璃微信等未主动适配液态玻璃的 App，iOS 27 系统对 App 使用到系统控件的部分，自动使用液态玻璃效果。五十六、工具栏折叠在截图或图片 App 编辑照片时，工具栏可以进行折叠。五十七、iCloudiCloud 功能得到拓展，可以从安卓和 Windows 10、Windows 11 设备上添加照片到 iCloud 共享相册，并且支持全分辨率共享。五十八、iPhone Handoff新增 iPhone 接力功能，支持在两部 iPhone 上共用同一个电话号码，美国 T-Mobile 与德国电信率先支持这一服务。五十九、CarPlay 视频应用CarPlay 将允许开发者制作视频浏览应用。用户可将支持 AirPlay 视频串流的 iPhone 应用投放至兼容新车的车载屏幕，但仅限车辆停稳时播放。六十、修复安全漏洞根据评估发布的 iOS / iPadOS 27 安全公告显示，共计修复 126 个安全漏洞，其中包括多个涉及系统内核的高风险问题。06.总结好了，关于苹果 iOS 27 的更新情况，IT之家小编就挖到这儿，各位家友要是还发现了其他隐藏新花样或小彩蛋，评论区甩出来，大家一起开开眼！总之，跟 iOS 26 一比，iOS 27 的进步看在眼里，唯一可惜的是 —— 国行 AI，还是连个影儿都没见着。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/003/303.htm", "publishedAt": "2026-09-16T13:46:00+00:00"}, {"title": "全新奔驰长轴距 GLE SUV 上市，59.98 万元起", "summary": "IT之家 9 月 16 日消息，全新奔驰长轴距 GLE SUV 今日上市，提供多种配置，售价 59.98 万元-76.78 万元。这是 GLE 系列首次在中国本土化生产，该车相比进口标轴版车型在轴距增加 120mm 至 3115mm，即日起购车可享受专属购置税礼、3 年不限里程整车保修等权益。IT之家附该车各版本定价如下：350L 4MATIC 皓雅版：59.98 万元350L 4MATIC 晖银版：63.38 万元450L 4MATIC 鎏金版：71.68 万元140 周年纪念版：72.68 万元450L 4MATIC 星铂版：76.78 万元外观方面，全新长轴距奔驰 GLE 采用家族式设计语言，前脸拥有盾形格栅，内部镶嵌标志性的三叉星徽标识，搭载最新的星徽大灯，提升辨识度。该车长宽高分别为 5051*2018*1784mm，轴距 3115mm，后排空间更加宽敞，尾部拥有星徽尾灯。内饰方面，该车的中控屏采用三联屏设计，内置豆包 AI 大模型助手，后排拥有双娱乐屏，后续将推送 Momenta R7 世界模型，具备城区、高速领航辅助驾驶能力。动力方面，GLE 350 L 版本搭载 M254 2.0T 发动机，最大功率 190kW；GLE 450 L 搭载 M256 3.0T 发动机，最大功率 280kW。标配 4MATIC 系统，3.0T 版本还拥有空气悬架配双阀可变阻尼减振器。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/003/299.htm", "publishedAt": "2026-09-16T13:34:13+00:00"}, {"title": "通用能力不打折，空间具身智能断层领先！ZDTaichu5.0-9B国产开源，跻身全球多模态第一梯队", "summary": "九大空间测试10B规模通用模型中8项第一", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/490839.html", "publishedAt": "2026-09-16T13:08:20+00:00"}, {"title": "开源中国董事长马越 。其中“洞察”标签页用于显示用户的当前健康信息，而“健康寿命”则分析用户长期健康数据，其中包含 Health Age（健康年龄）功能，用于展示部分健康指标相对用户实际年龄的变化情况。“健康年龄”（Health Age）评估功能把 Apple Watch 长期记录的健康数据与用户实际年龄对照，给出身体状态相对同龄人的参考。该功能主要使用 Apple Watch 记录的 4 类指标：最大摄氧量（VO2 max）：反映心肺耐力和运动时利用氧气的能力。静息心率：在不活动状态下的心率，可用于观察基础心血管状态变化。睡眠：用于反映睡眠情况。心率变异性（HRV）：相邻心跳间隔的波动，常被用于观察恢复与压力相关的身体信号。系统会将这些数据与用户的实际年龄进行比较，形成“健康年龄”这一参考结果。该功能并非 Apple Watch Series 12 和 Apple Watch Ultra 4 独占，只要现有 Apple Watch 能稳定提供上述 4 项数据，理论上就可作为数据来源。三、通话界面新增周年纪念提醒苹果在“Apple Intelligence”通话情境功能中新增了周年纪念提醒。如果用户拨打电话给某人，而您在“通讯录”应用中设置了该人的周年纪念日，那么您将在“电话”应用中看到提醒。四、CarPlayCarPlay Ultra 提供多种主题，包括壁纸、仪表盘样式和颜色等选项。代码显示，在支持的车辆中，环境照明颜色也会与所选主题颜色相匹配。五、Apple TV 应用苹果在 iOS 27.2 中将 Apple TV 应用的个人资料功能扩展到了 iPhone 和 iPad。Apple TV 应用用户可以在账户设置中创建个人资料，并在这些个人资料之间切换。个人资料只需包含名称、个人资料评级以及用户是否为儿童的信息。为儿童创建账户后，默认情况下会将内容限制为 PG 级，但用户可以自定义设置，进行更精细的控制。用户可以根据孩子的年龄选择适合他们的电视节目和电影的年龄分级。六、ASL FaceTime API苹果公司早在五月份就表示将在 FaceTime 中添加一个新的 API，允许开发手语翻译应用程序的开发者在正在进行的视频通话中添加人工翻译。七、时钟苹果调整了时钟应用中闹钟的显示方式，现在上午和下午的显示字体比时间字体要小。八、Apple Music 应用在音乐应用中，苹果移除部分红色装饰。“资料库”中的“播放”和“随机播放”按钮以及资料库各部分旁边的所有图标都由红色变为黑色。九、Siri“设置”应用中的“Siri 访问权限”现在更名为“已排除的应用”。点击“添加应用”即可显示列表，用户可以一次性排除多个应用，而以前必须逐个排除应用。十、播客苹果将“接下来播放”更名为“新剧集”，并在其下方添加了“继续播放”选项。十一、应用程序跟踪透明度（欧洲）在欧盟，由于苹果与德国联邦卡特尔局达成的协议，自 iOS 27.2 起，开发者可选择使用替代版 App Tracking Transparency 系统提示。而在德国、法国、意大利、波兰和罗马尼亚，由于法律要求，分发应用只能使用替代版系统提示。十二、iPhone 擦除选项iOS 27.2 Beta 还引用了一项新的 iPhone 擦除选项，可在擦除后使用空白数据覆盖整个存储空间，包括未主动使用的部分。苹果警告称，该过程可能比标准擦除耗时更长，并可能影响设备寿命。另外，该功能目前似乎仅适用于在中国销售的 iPhone。这一功能与将于 2027 年 1 月 1 日生效的中国新标准（GB 46864-2025）有关，该标准要求智能手机等电子设备提供更彻底的数据擦除方式，例如覆写存储。当然，iPad、HomePod 和 Apple Vision Pro 后续也可能获得支持。这个标准由中央网信办提出，全国网络安全标准化技术委员会负责制定，覆盖了手机、平板、笔记本等几乎所有带非易失性存储的电子产品，旨在让二手设备流通更安全、更规范，防止你的照片、账号、密码被下一任机主“捡漏”，它要求清除范围必须覆盖用户文件、通讯录、账号口令、加密密钥、Wi-Fi 记录、NFC 绑定卡等所有可能泄露隐私的内容。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/003/375.htm", "publishedAt": "2026-09-17T00:56:18+00:00"}, {"title": "京东方：为努比亚 NaviX Ultra 独供 AI 原生旗舰屏幕，息屏也能低功耗支撑 AI 后台运行", "summary": "IT之家 9 月 17 日消息，努比亚 NaviX Ultra 于昨晚发布，宣称是“全球首款 AI 智能体手机”。据京东方透露，作为本次新品核心屏幕技术合作伙伴，京东方为努比亚 NaviX Ultra 独供 AI 原生旗舰屏幕。据京东方介绍，随着 AI 批量办公、自动化任务处理成为大众日常高频操作，传统手机屏幕启停功耗偏高，长时间运行 AI 后台程序极易加速电量消耗，用户难以安心使用离线自动化智能服务。为解决全民 AI 续航焦虑问题，京东方以 LTPO 2.0 支持努比亚 NaviX Ultra，实现 144Hz 高流畅显示至 1Hz 极致低功耗智能动态自适应切换，整机综合续航能力提升 30%。即使手机处于息屏待机状态，屏幕依旧能够以极低功耗稳定支撑 AI 后台运行，避免电量快速损耗。在护眼体验方面，京东方为努比亚 NaviX Ultra 配备全链路分层护眼系统，搭载全 DC 调光技术，创新采用“高亮度类 DC 调光 + 低亮度 2160Hz 高频 PWM 调光”双轨护眼模式，搭配全新一代高性能发光器件，最低可实现 1nit 微光柔和显示，最高支持 4500nit 户外峰值亮度，兼顾暗光舒适观感与强光高清可视双重需求。针对 AI 图文生成、智能剪辑等创作场景，京东方为努比亚 NaviX Ultra 定制 100% DCI-P3 广色域 1.5K 超高清旗舰屏幕，每一块屏幕均经过 Demura 像素级画质优化与 Gamma 曲线精准调校，实现 ΔE＜1 专业显示器级严苛色准标准，实现移动端与专业设计设备色彩统一。京东方还为努比亚 NaviX Ultra 搭载了新一代高强度微晶玻璃，耐磨性能较普通手机提升 100%，可抵御 1.2 米高度碎石硬质地面跌落冲击，保障户外出行、野外作业等复杂场景下 AI 功能稳定可用。IT之家注意到，努比亚 NaviX Ultra 手机也就是大家俗称的第二代豆包手机，售价 5999 元起，国补到手价 5499 元起。由中兴通讯努比亚全链路主导打造，豆包手机助手主导 AI 助手体验。该机搭载第五代骁龙 8 至尊版移动平台，搭载行业首个集成指纹识别的独立 AI 按键。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/003/351.htm", "publishedAt": "2026-09-16T23:23:16+00:00"}, {"title": "Agent 的经济账，不能只算 Token——阿里用 Qoder Cloud Agents 给出答案", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/8leHq71KkbQfo930ptvc?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-16T18:36:54+00:00"}, {"title": "借助会话追踪与成本控制排查 AI 智能体故障", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/EixaQZkFMDLhlfE7RUK7?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-16T17:12:00+00:00"}, {"title": "因卡身序列号褪色，用户的 RTX 5090 公版显卡被英伟达拒保", "summary": "IT之家 9 月 16 日消息，Reddit 用户 Willing-Avocado-4830 前天在 r/nvidia 板块发文称，他手里的公版 RTX 5090 FE 显卡一个月前出现高负载黑屏现象，于是他选择将显卡寄给英伟达，申请售后换卡。然而等了大约一个月后，英伟达拒绝了他的售后申请。官方最初没有给出太多解释，直到用户追问后才表示，本次售后拒绝的原因是卡身序列号褪色严重。该用户表示，自己从未拆下显卡挡板，并且可以提供原始包装盒和发票。并且矛盾之处在于，英伟达在线客服机器人曾告诉他，如果显卡身上的序列号无法识别，可以通过原装包装和购买凭证验证产品身份并继续申请售后。后续几名网友表示，他们的公版 RTX 5080 和 RTX 5090 FE 显卡也出现了序列号褪色问题，其中一些用户同样遭遇了英伟达拒绝保修申请的情况。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/003/306.htm", "publishedAt": "2026-09-16T13:52:43+00:00"}, {"title": "英伟达、谷歌、Emerald AI 发起成立 AI 能源管理联盟，推动灵活型 AI 数据中心发展", "summary": "IT之家 9 月 16 日消息，AI 工厂是智能时代的基础设施。要以负责任的方式扩大 AI 工厂的规模，既需要数据中心内部的技术创新，同样也离不开整个电网侧的革新。今日，Emerald AI、谷歌与英伟达共同宣布成立 AI 能源管理联盟（AEMA）。英伟达官网称，这是业内首个同类联盟组织，致力于推动数据中心根据电网运行状况动态调整自身用电量。据英伟达介绍，这种强大的灵活性，不仅有助于 AI 基础设施更快、更大规模完成电网接入，同时还能够为支撑 AI 产业发展的能源系统与社区带来助益。充分挖掘现有电力基础设施的供电潜力，可以降低单位功耗对应的环境影响，也有利于控制用电成本。联盟的目标十分清晰：打造新一代 AI 基础设施，不只是简单接入电网，更要与电网协同运行。电力供应如今已经成为制约美国 AI 基础设施扩张的核心瓶颈。传统的电网接入审批流程，是针对电力需求平稳、固定的设施所设计的，并不适配算力基础设施在电力系统承压时做出智能响应的运行模式。具备灵活调节能力的数据中心可以通过多种方式调整从电网取用的电力：调度迁移计算负载、释放储能电量、启用配套发电设备，或是针对电力系统突发状况做出响应。凭借以上能力，这类大型用电主体不再只是刚性的用电负荷，还可以充当一套可调度的电网资源。如果运用得当，灵活性可以更充分地挖掘现有电网容量；在电网压力高峰时段削减用电需求；从而避免或者推迟耗资巨大的电网升级改造工程。与此同时，也能够增强电力公司与电网调度机构的信心，缩短 AI 算力设施的并网审批周期。联盟重点关注算力设施可提供的可量化服务指标，包括响应速度、持续时长、可预测性以及紧急工况下的运行表现，而非限定具体使用哪一套硬件或软件产品。系统可靠性依旧被置于首位。该联盟提出的工作原则包括：在算力设施正式并网之前，就明确故障穿越、用电削减以及应急响应相关义务；也就是为数据中心划定清晰规则：遭遇短暂电网扰动时维持持续运行；必要时降低功耗；并对各类电力突发事件作出响应。对技术要求、性能衡量指标、运行数据共享机制建立统一标准。为那些能够作出可信、可核验柔性用电承诺的建设方开辟经过风险评估的快速审批通道。按照设施实际给电力系统带来的影响与收益分摊并网相关成本，例如因柔性运行而省下的电网升级投入、系统爬坡能力的改善收益。上述举措一方面可以降低项目开发商面临的不确定性；另一方面也能够向电网调度机构提供所需的数据与调度管控手段，保障整个电力系统的运行可靠性。AEMA 将打通算力与电力两大领域的完整产业链，成员涵盖 AI 平台厂商、基础设施供应商、数据中心运营商、科技企业、发电企业、公用电力公司以及区域电网调度机构。据IT之家了解，除创始成员之外，后续还会吸纳来自整个生态的发起合作方。各方将协同制定技术与运营实施方案；与电力企业协作完善并网方案；同时开展政策倡导，推动政策层面认可具备电网响应能力的柔性用电需求。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/003/301.htm", "publishedAt": "2026-09-16T13:37:57+00:00"}, {"title": "千问办公上架deepin ，一句话开启 AI 办公", "summary": "问办公在 deepin 应用商店已经不是新面孔了。上架这段时间，它历经版本迭代，不少 deepin 用户已经下载试用，并收获好评。 千问办公的加入，进一步丰富 deepin 社区与 Linux 生态的智能办公应用选择。 deepin 用户可在 deepin 应用商店搜索“千问办公”，一键下载，即刻体验一站式 AI 办公。 对话即交付 不止于聊天 千问...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502521", "publishedAt": "2026-09-16T09:03:35+00:00"}, {"title": "高通技术公司携手中兴努比亚和豆包手机助手，共同推动智能手机迈入个人AI新时代", "summary": "第五代骁龙8至尊版赋能全新AI智能体手机努比亚NaviX Ultra，加速智能体体验规模化落地", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/490756.html", "publishedAt": "2026-09-16T08:18:44+00:00"}, {"t ": "https://www.oschina.net/news/502481", "publishedAt": "2026-09-15T01:57:31+00:00"}, {"title": "在学会数学之前，AI 先学会了大厂的虚荣心", "summary": "大厂的数学名题争夺赛#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1680046?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-09-14T13:05:26+00:00"}]}, {"label": "论文研究", "items": [{"title": "OpenAI 相关智能体被曝“越界”：劫持程序员维基网站并偷建“地下论坛”，国安部发布安全提醒", "summary": "IT之家 9 月 17 日消息，国家安全部今日发文，披露了一起此前未公开的 AI 智能体“劫持”网站事件。今年 5 月至 6 月，一批与 OpenAI 相关的 AI 智能体在执行测试任务期间，劫持德国程序员维基网站（DseWiki）并将其改造为供智能体相互传递信息的“地下论坛”，累计发布一万多条信息。国安部表示，AI 智能体在该网站以“OpenAI 研究员”“OAI 研究员 26 号”等标签互认身份，将开放社区变为专属“留言板”。据称，这些智能体在留言中交流如何在任务中作弊、如何绕过安全限制、如何掩盖行踪，并探讨借助匿名工具隐匿痕迹，将零散的“越界心得”沉淀为可共享、可复制的“经验库”。当网站管理员发现并开始清理页面后，AI 智能体迅速分工，有的发布预警提示，有的创建备份页面，有的指明“转场”新地址，相互掩护躲避清理，其反应速度和预案周全程度远超此前对智能体的认知。国安部指出，抱团的智能体可借助互联网搜寻可用跳板，把开放编辑的网站、论坛当作通信信道，在没有传统攻击特征的情况下悄然建立据点，提高被发现和溯源的难度。单个智能体能力有限，但彼此串联、分工协作后，破坏力成倍放大，且行为可复制、可传播、可延续。国安部还提到，相关企业在数周内已掌握这批智能体的异常行为记录，但未第一时间公布事件细节，未及时对外发布专项风险提示，导致同类事件在短短数月内就在另一境外平台重演。针对 AI 智能体安全风险，国安部提出三点防范建议，IT之家总结如下：使用 AI 工具时不盲目迷信、不轻易授权，审慎识别来源不明的 AI 智能体服务；给 AI 智能体设置清晰的行为边界和刚性权限，不随意开放互联网访问、内容编辑等权限；察觉 AI 智能体出现越权操作、异常篡改、违规外联等行为时，果断终止运行并留存操作痕迹。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/003/352.htm", "publishedAt": "2026-09-16T23:25:16+00:00"}, {"title": "华为发布《智能世界 2035》最新报告，预测到 2035 年全球年度 Token 消耗量将增长 10 万倍", "summary": "IT之家 9 月 16 日消息，华为官方今日举办了“以行动，至未来”探索智能世界系列报告线上发布会，正式发布《智能世界 2035：从愿景到行动》研究成果，首次提出通往智能世界的十大关键命题。报告指出，Agentic AI 正推动数字世界从“以应用为中心”走向“以智能体为中心”。智能体持续感知环境、自主推理决策、动态调用工具、实时与人交互，每一步都伴随着 Token 的大规模生成与高频流转。报告预测，到 2035 年，全球年度 Token 消耗量将增长 10 万倍，其中智能体流量占比超过 90%，对算力、网络和云提出了远超传统互联网应用的要求。围绕这一判断，报告凝练出十大关键命题与研究方向：1、构建具备自主认知与全域通用能力的 AGI，走向物理世界是 AGI 形成的必由之路，需在语言智能、具身智能、科学智能等多个方向协同推进；2、算力集群规模百倍提升，智能体任务成本千倍下降，计算架构从“单芯片算力”转向以“超节点”为核心的 Token 高转换效率体系；3、构建因果准确、溯源可信的新型存储与记忆系统，推动从“数据”向“知识与记忆”演进；4、 AI 全面融入通信系统，构建以体验为中心的智能联接底座；5、 深耕韬定律下的芯片设计方法与工具，以“时间缩微”替代“几何缩微”，支撑时延与能效协同优化，实现半导体产业持续演进；6、从驾驭环境到自主演进，Agent OS 成为智能体原生技术底座，其核心能力可概括为“（协同力 × 执行力 × 记忆力 × 连接力）^ 演进力”；7、定义无感适配、全域随行的终端智能新形态，让智能服务跨越设备与场景持续伴随；8、实现智能驾驶的自我学习与极致安全，推动汽车从交通工具向“移动具身智能体”演进；9、攻克供电与散热难题，支撑 AIDC 走向更大算力规模；10、面向自主 Agent 的安全与隐私保护，为智能世界筑牢可信可控的安全底座。IT之家注意到，会上还同步发布了由华为联合清华大学经济学研究所撰写的《全球数智化指数（GDII）2026》。该报告预测，未来五年人工智能将累计创造超 27 万亿美元经济价值，全球数智基础设施投资加速，复合年增长率达 19.14%，到 2030 年将超过 4 万亿美元。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/003/312.htm", "publishedAt": "2026-09-16T14:15:07+00:00"}, {"title": "被英伟达点名的杭州团队，补上了AI for Science的「最后一公里」", "summary": "从想法到结果，一次对话实现", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/490185.html", "publishedAt": "2026-09-16T03:40:35+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "三星 One UI 9 正式版推送：Galaxy S26 系列首批升级，Z Fold8 已预装", "summary": "IT之家 9 月 17 日消息，三星电子今日宣布正式向更多 Galaxy 设备推送 One UI 9 正式版更新。首批获得更新的机型为 Galaxy S26、S26+ 和 S26 Ultra，后续将扩展至更多设备。IT之家注：One UI 9 此前已随 Galaxy Z Fold8 Ultra、Fold8 和 Flip8 首发搭载。除此之外，三星还向 Galaxy A25、A35、A36、A37、A55、 A56、A57、S23、S24、S25、Z Flip 6、Z Flip 7、Z Fold 6 和 Z Fold 7 推出了 One UI 9.0 Beta 测试版计划，预计这些设备将在未来几周内陆续收到稳定版更新。One UI 9 带来了增强的 Galaxy AI 功能，并针对不同形态设备优化了操作体验。相机方面，One UI 9 新增 My FanCam 功能，可在已录制的视频中自动追踪选定人物并保持其居中，根据画面运动智能重新构图；用户无需手动剪辑，即可将动态片段转为适合社交分享的内容。三星每日信息摘要功能 Now Brief 新增生成式和可编辑卡片，用户可自选健康、天气、视频等内容出现在每日摘要中。Warranty and Care 功能将设备支持与保护纳入设置菜单，可查看保修状态、运行自诊断、查看维修估价或预约服务。Now Nudge 可在更多场景中提供上下文建议。例如短信中讨论计划时，用户可直接调取预订信息或保存共享位置，无需离开对话。Creative Studio 会根据即将到来的事件建议图像生成方案，如朋友生日临近时提示创建主题图片或贺卡。Interpreter 新增 Thread View 功能，方便用户参考早前对话内容。Conversation Mode 翻译速度提升，配合兼容的 Galaxy Buds 可加快播放，减少对话延迟。Document Scan 支持弯曲书页和折角纸张的数字化，减少手动调整。Voice Recorder 以标题和表格等结构化格式呈现摘要。安全与隐私方面，Security Brief 将恶意软件、未知来源应用和不必要权限等警报整合至 Now Brief。Privacy Alerts 利用端侧 AI 识别后台不必要权限访问。Scam Detection 后续将扩展至更多国家和地区，为更多 Galaxy 用户提供诈骗电话防护功能。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/003/374.htm", "publishedAt": "2026-09-17T00:49:52+00:00"}, {"title": "消息称英伟达 RTX 60 与 AMD RDNA 5 游戏显卡将推迟至 2028 年发布", "summary": "IT之家 9 月 17 日消息，高准确度的爆料者 @Kepler_L2 昨日在 AnandTech 论坛上驳斥了 Moore's Law is Dead 所称“RTX 60 系列瞄准 2027 年上半年”的消息。他在回复网友时表示：AMD 计划在 2027 年先行推出部分 RDNA 5 产品，代号为“AT2”，具体型号尚未确定。AMD 和 NVIDIA 的其他所有产品都要等到 2028 年。这意味着，大家心心念念的 RTX 60 游戏显卡可能在 2027 年缺席，大部分 RTX 60（基于“Rubin”）与 Radeon RX 10000（基于 RDNA 5 架构）系列显卡预计要到 2028 年才会上市。他没有具体说明这款“AT2”是何定位，该 GPU 可能作为新旗舰先行登场，也可能以中端或入门定位打头阵。同样，英伟达此前规划的 RTX 50 SUPER 系列显卡也因 DRAM 供应紧张而陷入不确定。有观点认为 SUPER 版本已被完全取消，也有观点认为它将作为 RTX 60 问世前的过渡方案。供应链担忧，如果 DRAM 是英伟达 SUPER 系列被搁置的主要原因，那么 RTX 60 系列对显存的需求只会更大。摩根士丹利判断，通用 DRAM 合约价格将在 2026 年四季度触顶，但显卡所用的 GDDR 显存因与 HBM 共用产线，紧张状态会持续更久。慧荣科技高管此前表示，内存短缺问题甚至可能持续到 2028 年。IDC 数据显示，2026 年传统 DRAM 出货量预计仅增长 16%，远低于正常水平。在内存供应成为瓶颈的背景下，英伟达和 AMD 的新一代游戏 GPU 能否按传闻时间表推进，仍有待观察。IT之家后续将保持关注。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/003/365.htm", "publishedAt": "2026-09-17T00:17:59+00:00"}, {"title": "苹果首款折叠 iPhone Duo 有望支持“轻量级 UI”，Apple Pencil 悬停触发 Siri AI", "summary": "IT之家 9 月 17 日消息，消息源 @itspdfu 今天（9 月 17 日）在 X 平台发布推文，爆料称苹果公司正在为 Siri AI 引入名为“Lightweight UI”（轻量级用户界面）的交互方式。相关代码目前已出现在 macOS 27 的写作工具（Writing Tools）功能中，而 iPadOS 27 也包含控制该界面的系统开关，只是默认状态仍处于关闭。IT之家附上相关演示视频如下：界面上，该 UI 采用极简设计，减少视觉干扰。功能方面，Siri 图标可展开为 \"Ask Siri\" 及操作建议面板。该设计旨在降低 AI 助手的认知负荷，让用户更专注于任务本身而非界面操作。按照现有演示逻辑，iPad 用户可通过妙控键盘将指针悬停在选中文字上，呼出这一轻量化工具。值得注意的是，iPadOS 同时出现了使用 Apple Pencil 悬停触发的调用路径，意味着用户无需切换键盘或打开完整菜单，也可能直接通过手写笔操作 Siri AI。iOS 27 RC 代码加入了专门面向 iPhone Duo、内部标识为“V68”的界面分支。由于这款设备并不以鼠标和键盘为主要输入方式，外界据此推测，Apple Pencil 悬停可能成为其触发 Lightweight UI 的关键交互方式。若消息属实，iPhone Duo 将不只是获得手写笔支持，还可能把悬停操作与 Siri AI、文本编辑及系统建议深度结合。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/003/353.htm", "publishedAt": "2026-09-16T23:26:39+00:00"}, {"title": "朱江明：零跑已做出完全自研机器人，待其“能赚钱”才能拿出手", "summary": "IT之家 9 月 16 日消息，在今晚的零跑 2026 年度技术发布会上，零跑科技创始人、董事长、CEO 朱江明在演讲中提到，有很多人问零跑为什么不做具身智能。“论技术积累的深度和广度，不论自制和外部供应链的团队，零跑是最具条件做具身智能这个非常火热的行业。”朱江明强调，零跑做事的理念是“不炒概念”，零跑对具身智能也做了小规模的评估，处于跟随状态，也做出了完全自研的机器人。“有同事建议，今天的发布会也应该让我们的机器人出来遛一遛。我说千万不要能遛遛的机器人，不算本事，能赚钱的机器人我们才拿得出手。希望在不远的将来能够找到一个金矿 —— 一个非常靠谱的机器人落地的场景。”IT之家从发布会现场获悉，零跑此次还公布了多项技术储备：自研三电平混合传动电驱，综合效率可达 94%；自研全固态激光雷达，分辨率达到“44 万 +44 万”；自研 800 万像素三合一摄像头，一个 CMOS 传感器实现三个摄像头的功能；自研全景平视显示 P-HUD。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/003/300.htm", "publishedAt": "2026-09-16T13:36:53+00:00"}, {"title": "AutoClaw上架！openKylin迎来智谱AI工作助手", "summary": "近日，智谱AI工作助手AutoClaw完成OpenAtom openKylin（以下简称\"openKylin\"）操作系统适配，正式上架openKylin软件商店。 openKylin用户可通过软件商店下载安装，让AI从理解工作目标、规划任务到调用工具、推进执行，最终交付可直接使用的工作成果。 01 在openKylin上怎么安装？ 安装无门槛，操作简单，仅需两步： 1）打...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502476", "publishedAt": "2026-09-14T13:01:31+00:00"}]}]};

const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
