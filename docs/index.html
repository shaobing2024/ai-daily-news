片等唱片公司提起的版权侵权诉讼，但本案属于由艺人遗产管理方直接针对 AI 开发公司发起的首批重大法律诉讼之一。案件判决结果，有可能为 AI 企业使用现有音乐曲库划定通用判例标准。首席代理律师理查德 · 布施（Richard Busch）在诉状中写道：“原告方提起本次诉讼，是为了维护自身专有权利。被告的整套商业模式，建立在规模空前的版权侵权行为之上。”诉状称：“从诞生之初，Anthropic 旗下名为 Claude 的 AI 模型，就能生成互联网上各类曲库中几乎所有歌曲的侵权内容。”诉状进一步指控，Anthropic 使用了普雷斯利的 274 首歌曲训练 AI 模型，其中包含《情不自禁爱上你》《神魂颠倒》和《少一点交谈》等曲目。原告要求每首侵权曲目赔付 15 万美元（IT之家注：现汇率约合 100.3 万元人民币），索赔总额约 4,100 万美元（现汇率约合 2.74 亿元人民币）。诉状写道：“Anthropic 在被发现之后，才设置所谓防护机制来限制侵权音乐内容的输出，而这套防护机制效果不佳；同时该公司明知防护措施无法阻止模型继续产出侵权音乐内容。这足以证明，Anthropic 明知故犯，并且持续故意侵犯他人音乐作品版权。”AI 音乐平台的运行逻辑，是分析海量录音作品，学习歌曲的音色、结构与表达风格，再让用户通过文字或者语音指令生成 AI 音乐。不少音乐人多次表达担忧，害怕自己的音乐、声线在未经许可的情况下被 AI 模型取用，同时担心粗制滥造的 AI 生成音乐会取代人类创作的歌曲。部分 AI 机器人甚至已经在音乐流媒体平台上模仿在世的真实歌手。上周，流媒体巨头 Spotify 对外公布，过去一年里，平台已经从推荐流中下架大约 5000 万首这类低质 AI 音乐。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/017/731.htm", "publishedAt": "2026-10-25T23:53:33+00:00"}, {"title": "AI“专属保险”：全国首个人工智能应用风险综合保障方案正式发布", "summary": "IT之家 10 月 26 日消息，据央视财经报道，在近期结束的 2026 金融街论坛年会上，全国首个人工智能应用风险综合保障方案正式发布。通过保险产品分别对人工智能服务给第三方造成的损失，和人工智能供应方自身费用损失进行保障，填补国内 AI 保险市场空白。IT之家注意到，AI 正在接管越来越多的事情：打电话、做客服、分析农产品价格、写文案剪视频。可一旦它“说错话”侵权，或者“算错账”造成损失，谁来负责？今年 9 月，最高人民法院发布《关于依法审理涉人工智能纠纷案件的意见》，明确了关键规则：生成式 AI 侵权一般适用过错责任，“内容由 AI 生成”不能作为免责抗辩。也就是说谁有过错谁担责，不能用一句“这是机器干的”甩锅，服务方哪怕只是提供了模型能力，如果没尽到注意义务，也可能要承担赔偿责任。据介绍，这类保险保障的是被保险人在提供生成式人工智能服务过程中，因过失或疏忽导致生成的内容，比如文本、图片、音频、视频等，侵犯了第三方合法权益，或对第三方造成误导，并直接导致人身伤亡或财产损失。当然，保险公司不是闭眼承保，而是会先看 AI 用在什么场景、生成什么内容、每天处理多少数据，再定保费。真出事了也不是“自动全赔”，得看企业依法该不该担责、合同怎么约定。除了对 AI 给第三方造成的损失进行保障，还有一类保险是针对 AI 服务提供方自身损失的保障。当模型性能出现偏差，修复、退费、鉴定等费用，由保险公司按合同约定承担。承保前，保险公司会针对模型参数、应用场景、实际性能等风险因子综合评估，实行差异化定价。这类产品主要面向 AI 大模型研发企业、AI 应用开发商、智能硬件制造商及 AI 解决方案提供商。目前，同类保险产品已经开始向办公智能体、语言大模型、人形机器人等场景延伸。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/017/726.htm", "publishedAt": "2026-10-25T23:21:57+00:00"}, {"title": "Kimi 就会员使用 K3.1 Pro 出现限流等问题致歉，为所有订阅会员进行重置", "summary": "IT之家 10 月 26 日消息，Kimi 智能助手今日凌晨发文，就近期 K3.1 Pro 使用体验问题进行致歉，并公布了相关补偿。IT之家附官方原文如下：致用户：关于近期使用体验问题的致歉与补偿致 Kimi 用户对于近期 Kimi 会员使用 K3.1 Pro 时出现的限流及不必要的额度消耗，我们向大家致歉。问题出在我们，我们也本应更早修复。今天，我们会为所有档位的订阅会员进行一次重置：所有有效期内的会员都将获得月度总额的 25% 作为补偿，相当于一周的用量。如果当前用量不足月度总额的 25%，将重置为 0。用量进度条会在今天结束前显示调整结果。同时，我们已调整配置，并正在减少不必要的子 Agent 调用和输出长度，让同样的额度完成更多实际任务。感谢您的理解与耐心等待。KIMI据IT之家此前报道，10 月 24 日，月之暗面 Kimi 正式推出 Kimi K3.1 系列的第一个模型 ——K3.1 Pro，也是该公司迄今能力最强的 3 万亿级参数模型，支持 100 万上下文。相关阅读：《Kimi K3.1 Pro 正式发布：月之暗面最强 3 万亿级模型，编程智能体测评超 GPT-6》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/017/723.htm", "publishedAt": "2026-10-25T23:10:49+00:00"}, {"title": "Claude 桌面应用推出新版界面，从草图到上线用时不到 3 周", "summary": "IT之家 10 月 25 日消息，Anthropic 设计工程师蔡斯 · 麦科伊（Chase McCoy）昨日宣布，Claude 桌面应用已推出全新界面。IT之家注意到，新版界面由 Claude 帮助设计，从草图到正式上线，整个过程不到 3 周。部分用户在评论区中指出，新版界面的信息密度较低，摒弃了衬线字体和暖色调的背景颜色，显得很沉闷冰冷，和 ChatGPT 差不多，且项目面板的可读性也受到了影响。不过，新版界面带来了全新界面和侧边栏功能。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/017/710.htm", "publishedAt": "2026-10-25T14:33:12+00:00"}, {"title": "华为鸿蒙 HarmonyOS 7.0.0.111 版本更多“隐藏”新特性盘点，深色模式随日出日落切换等功能下放", "summary": "IT之家 10 月 25 日消息，华为近两日面向 Mate 80 / 70 / 60、Pura 80 / 70 等系列机型推送了最新的鸿蒙 HarmonyOS 7.0.0.111 版本升级，带来了与 iPhone 双机互联，实况窗分享等功能。▲ IT之家开箱：华为 Pura 70 Pro+「光织银」图赏更新日志并未公开全部升级亮点，IT之家盘点上述机型升级鸿蒙 7 后的“隐藏”新功能如下：更多机型支持深色模式随日出日落自动切换（路径：设置 → 显示和亮度 → 深色模式 → 定时开启 → 选择“日落到日出”）。更多机型支持桌面下滑功能自定义。用户可自行选择桌面任意位置下滑时进入小艺搜索，或按照不同的下滑区域分别进入小艺搜索、通知中心和控制中心（路径：设置 → 桌面和个性化 → 桌面设置 → 桌面下滑 → 选择“小艺搜索”/“小艺搜索、通知中心、控制中心”）：桌面上方区域下滑进入小艺搜索；左下方区域下滑进入通知中心；右下方区域下滑进入控制中心。新增“智慧场景服务”功能，支持创建自定义操作，联动全场景设备以及 App，帮助完成日常任务。该功能集成了鸿蒙车机场景，可设置的条件与任务也更加丰富，支持创建个人、车辆、家庭三大自动化服务（路径：设置 → 顶部个人昵称 → 我的场景）。呼出音量条动画焕新，进一步提升了视觉交互的细腻度（路径：音量条处于消失状态 → 按下手机侧边任一音量按键即可触发）。长条时钟（长度可调）新增一款样式，同时支持一镜到底亮屏、熄屏动画。相册新增涂鸦自由勾勒 / 贴纸点缀图片、视频一键导出动图功能。部分机型本地多模态基础大模型更新。相机 App 焕新，更多组件支持沉浸光感效果。IT之家另附“111”版本官方更新日志说明如下：相关阅读：《华为 Mate60 等机型迎来鸿蒙 HarmonyOS 7.0.0.111 SP10 版本更新，通信共享升级为多人互助通信共享》《华为 Mate X7、Mate80、Mate70、Pura80 等机型推送鸿蒙 HarmonyOS 7.0.0.111 SP12 版本更新：支持 iPhone 互联，实现消息相互流转》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/017/707.htm", "publishedAt": "2026-10-25T14:23:17+00:00"}, {"title": "铺路铺到苹果家：开发者成功令微软 Surface Duo 2 运行 iOS / iPadOS 26 系统", "summary": "IT之家 10 月 25 日消息，随着 AI 技术突飞猛进，许多开发者在大模型辅助加持之下对各种老旧机型进行折腾，例如博主 @none25smu 便发文，展示其成功为微软 Surface Duo 2 刷入苹果 iOS/iPadOS 26 系统。开发者表示，在其他人尝试移植 iOS 16/17 时，自己一直在推进 iPadOS 26 移植计划，目前已成功令微软 Surface Duo 2 运行 iOS / iPadOS 26 ，当下相应移植项目尽管仍处于早期开发阶段，不过已实现双屏运行，在硬件加速方面也取得一定进展。在最新进展中，开发者透露 Surface Duo 2 的两块屏幕目前均可达到每秒 37 帧（37 FPS）的运行表现。相比之下，此前的运行帧率仅为每秒 3 至 10 帧，性能提升较为明显。开发者还提到，目前使用的 Surface Duo 2 是一台“专门用于折腾的设备”，因此机身存在屏幕破损等情况。他也开玩笑地表示，后续还有望将微软 Surface Pen 模拟为 Apple Pencil，令相应机型实现手写笔体验。此外，开发者表示，如果没有其他人抢先完成相关工作，未来也计划将 iOS / iPadOS 移植到初代 Surface Duo 上，并将现在的 iOS / iPadOS 27 移植到 Surface Duo 2 上。相关阅读：《前 / 现任微软员工对苹果首款折叠 iPhone Duo 讨论汇总：“Surface Duo 开发者只能捶胸顿足”》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/017/703.htm", "publishedAt": "2026-10-25T14:00:43+00:00"}, {"title": "韩 KRAFTON AI 预览 Raon-1 mini 模型：30B-A4B，可与 Meta Muse Glimmer 竞争", "summary": "IT之家 10 月 25 日消息，韩国知名游戏企业 KRAFTON（魁匠团）旗下人工智能分支 KRAFTON AI 本周公布了其从头训练的 Raon-1 mini 模型的预览版本，该模型的正式版和后续的更大模型即将推出。Raon-1 mini 采用混合专家架构，导入线性注意力，支持推测解码，整体体量为 30B-A4B。该模型聚焦韩语的同时兼顾英语性能，以 Apache 2.0 许可开源。KRAFTON AI 还在官网提供限时免费 API 试用。KRAFTON AI 表示，预览版的 Raon-1 mini 在编程与智能体任务上与 Meta 的 Muse Glimmer 30B 相当，同时速度更快、内存效率更高；此外其能进行自然的对话。参考https://raon-mini.krafton.ai/en", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/017/695.htm", "publishedAt": "2026-10-25T13:27:18+00:00"}, {"title": "四分之一PR是“AI垃圾”！Linux基金会发布新报告：AI写代码快了52%，开源维护者却更累了", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/9TSuUDxrUSGS26XTA2yB?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-25T10:30:00+00:00"}, {"title": "智源众智 FlagOS 2.2 让前沿模型与多元算力协同演进", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/mhdJwMMzYFedMFHKfHWs?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-23T19:40:29+00:00"}, {"title": "奥特曼最新 45 分钟访谈：一年不写代码、压力大到不想起床，还嫌 ChatGPT 太谄媚", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": 议题上的批评始终没有回应，其中就包括近期 Steam Deck 涨价这件事。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/017/737.htm", "publishedAt": "2026-10-26T00:22:05+00:00"}, {"title": "谷歌 DeepMind 高管：终身学习者将在 AI 职场中占据优势", "summary": "IT之家 10 月 25 日消息，据《商业内幕》今天报道，谷歌 DeepMind 高管莱拉 · 易卜拉欣（Lila Ibrahim）近期表示，公司越来越看重那些能够证明自己在课堂之外，持续学习的求职者。这名高管表示，虽然学历依然重要，但公司的招聘已经更重视求职者的经历。例如一项资历能告诉面试官你学过什么，多项资历则能说明你拥有持续学习的心态。她还透露，现在的应届生往往会在简历中，更详细地描述自己学过哪些正规教育外的东西，并将这些经历与工作和教育背景一并列出。这些额外信息对 DeepMind 来说至关重要，因为它有助于判断求职者是否具备好奇心，以及是否最好终身学习的准备。IT之家从原报道获悉，易卜拉欣还认为，多样化的学习经历能够让一个人更善于提出问题，但学校并没有很好地培养这种能力。如今 AI 的出现，让获取答案的成本变得极低，但真正知道如何提出好问题，却变得越来越难。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/017/681.htm", "publishedAt": "2026-10-25T11:59:23+00:00"}, {"title": "“让Token不空转”，讯飞如何把Agent推进企业核心流程", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/Lo9TLlRdvy4II38yaex0?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-23T17:40:09+00:00"}]}]};

const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
