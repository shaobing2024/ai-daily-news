const DATA = {"date": "2026-11-01", "generatedAt": "2026-11-01T01:48:04Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "华境 S 10 月交付 7507 台，连续 6 个月增长", "summary": "IT之家 11 月 1 日消息，华境汽车官方今日宣布，旗下华境 S 10 月交付 7507 台，交付量逆势攀升，连续 6 个月稳步增长。据IT之家了解，华境 S 是上汽通用五菱与华为合作的首款搭载华为乾崑科技旗舰大六座 SUV，2026 年 9 月交付 7416 台、8 月交付 7306 台、7 月交付 7203 台、6 月交付 5689 台。华境 S 全系标配华为乾崑智驾 ADS Pro 增强版与鸿蒙座舱。该车已于 5 月 8 日正式上市，长 5235mm / 宽 1999mm / 高 1800mm，轴距 3105mm。9 月 12 日，华境 S 新增 4 款配置，全系超级置换价 14.98 万元-19.68 万元。新增的 4 款配置主要在鸿蒙座舱方面迎来升级，搭载 MoLA 2.0 混合大模型架构，支持方言交流识别，车机 UI 迎来焕新。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/658.htm", "publishedAt": "2026-11-01T01:17:02+00:00"}, {"title": "商汤开源 SenseNova Loop-9B-Preview，宣称媲美 27B 参数大小模型", "summary": "IT之家 11 月 1 日消息，商汤科技 10 月 30 日宣布开源商汤日日新 SenseNova Loop-9B-Preview。官方表示，该模型采用 Looped Transformer 架构，引入循环计算、扩展模型的有效计算深度，并探索更充分的信息交互机制，提升模型在复杂任务上的处理能力，在仅 9B 的有限参数规模下，媲美 27B 参数大小模型。SenseNova Loop-9B-Preview 以 9B 尺度模型为基座，保留首尾各 4 层原始解码器模块，将中间层改造为参数共享的循环计算模块，通过多轮迭代扩展有效计算深度。在此基础上，模型进一步探索循环计算中的信息传递机制，尝试引入 mHC（Manifold-Constrained Hyper-Connections），利用多路残差连接与受约束的信息混合，增强特征交互并维持信号传播的稳定性。据介绍，在当前评测设置下，模型在代码生成、办公场景和智能体任务等多个方向上均优于其他模型，并在 WorkBuddy Bench、RaccoonPPT Bench 和 AutomationBench 等评测中进一步超过 Qwen3.5-27B。这些结果初步展现了通过扩展有效计算深度，提升小参数模型复杂任务处理能力的潜力。商汤进一步通过消融实验评估了 mHC 的实际收益。采用该机制后，模型取得明显的性能提升，其中 GPQA Diamond 和 TeamBench 分别提高了 4.42 分和 13.34 分，展现出在复杂推理任务以及多步骤 Agent 任务中的应用潜力。后续还将继续探索 DSA、自适应迭代次数等机制，以提升模型的推理效率与任务表现。IT之家附开源链接：Github：https://github.com/OpenSenseNova/SenseNova-LoopHugging Face：https://huggingface.co/sensenova/SenseNova-Loop-9B-Preview", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/654.htm", "publishedAt": "2026-11-01T01:02:52+00:00"}, {"title": "华为鲲鹏 920 上跑出超越同代主流硬件的性能：北大团队完成 ABACUS 原子算筹软件深度优化，优化 19 类材料核心算子", "summary": "IT之家 11 月 1 日消息，密度泛函理论（Density Functional Theory，DFT）是研究半导体、金属等关键材料性质的主流第一性原理方法。ABACUS（原子算筹）是国内自主研发的密度泛函开源软件，由多家单位联合开发，国内外用户超过一千人，应用单位过百家。华为计算昨晚发文，在北京大学鲲鹏昇腾科教创新卓越中心支持下，北京大学力学与工程科学学院陈默涵研究员团队完成了 ABACUS 在鲲鹏 920 全系列平台上的适配，并把 19 类材料领域核心算子抽出来逐项优化。据介绍，在和业界主流 CPU 相同的 28 核、28 进程 ×1 线程配置下，采用 SVE 指令集的版本在标准测试集上快 1.3 至 3.9 倍；放到单节点满核、启用矩阵运算单元的配置，最高快 10.7 倍。相关代码已经推送到 GitHub 开源社区。▲ 10 种典型材料体系总计算耗时对比（同为 28 核、28 进程 ×1 线程，绿色为业界主流 x86，蓝色为鲲鹏 920 新型号）IT之家附技术内容如下：要让 ABACUS 先跑起来，第一步是把编译链和数学库依赖打通。这里遇到的第一个问题比较隐蔽：鲲鹏 920 的几个型号支持的向量指令集并不一样，分别是 NEON、SVE 和 SVE512，还内置一个专门做矩阵运算的单元。如果沿用通用编译选项，程序只会走最基础的那条代码路径，这些硬件能力实际上一直闲着，测出来的只是没调过的“开箱”成绩。团队因此给三款芯片各自适配了一条路径。其中两款用 gcc-openmpi-openblas，分别编译出 NEON 和 SVE 版本；第三款换成 clang-hmpi-kblas，编译 SVE512 和矩阵运算指令集版本。另一个改动是新增 USE_KML 编译选项，把鲲鹏数学库（KML）接进 ABACUS。接口层面也得跟着调：KFFT 和开源 fftw3、KScaLAPACK 和开源 ScaLAPACK 在函数签名与默认行为上不完全一致，团队改掉了 FFT 接口的 OMP 配置，也调整了 abstol 和 orfac 两个默认值，第三款芯片才算整体适配完成。第一步得保证算得对。NEON、SVE 和矩阵运算三个版本的 ABACUS 都跑通了自带的平面波基组求解 Kohn-Sham DFT、线性组合原子轨道（LCAO）求解 Kohn-Sham DFT、随机波函数 DFT（sDFT）、深度学习泛函 DeePKS 等集成测试，数值结果与业界主流实现一致。性能测试用了 10 个典型材料体系（GaAs、C2H6O、MoS2、Pt (111)、BaTiO3、Na、Fe、H2O、Li27Ni9O54Mn9Co9、Si），体系规模覆盖 8 至 216 原子并采用周期性边界条件，双方都取 28 核、28 进程 ×1 线程。SVE 版本比业界主流 x86 CPU 快 1.3 至 3.9 倍；矩阵运算指令集版本在单节点满核运行时最高快 10.7 倍。随机轨道 DFT 算例上的差距更明显，SVE 版本快 2.8 至 3.1 倍，矩阵运算指令集版本快 6.1 至 20.1 倍。适配只解决了能不能跑。要在同代硬件里跑得更快，得往下走到算法层。DFT 的算力主要花在一批被反复调用的小算子上，而这些地方恰是通用编译器和数学库的盲区：编译器一次只能看一条语句、一个循环，看不到跨模块的重复计算；体系一大，有些操作的复杂度按平方增长，算力和内存很快不够用，能算的体系规模也就卡在这里。团队把 19 类核心算子抽出来，逐个做算法分析再改写，涉及基础数学函数、数值插值积分、球谐函数、矩阵变换、混合精度计算、TDDFT、DeePKS、近邻搜索、并行调度等模块，动手的方向大致有三类。最见效的是压掉平方级复杂度。广义拉盖尔多项式原本用递归，算高阶项时低阶结果被反复重算，调用量接近斐波那契式增长；改成迭代递推、只留三个中间变量后，复杂度降到 O (n)，同一算子的百万次调用测试快了约 8 倍。多项式插值的区间查找原来从表头扫到表尾，换成二分查找后，400 项的表平均比较次数从约 200 次降到 9 次。同类的还有查表复用和整数幂特化。第二类是减掉重复运算。能化简的用数学公式化简，三角函数用递推，循环里的不变量提到循环外，省下来的是同一批数据被反复算几十遍的开销。还有一类针对内存：混合精度、内存布局调整、负载均衡并行，目的是别让访存拖住计算。所有算子的数值结果都复核过，没有一个算错，多数有明显加速，部分到数倍甚至十余倍。这套方法，团队没有只留在 ABACUS 里。手工调优有个绕不开的问题：换一个体系、换一类硬件，专家得从头再调一遍，经验很难复用。他们使用了一站式开发套件 DevKit 源码自动优化能力，让工具自己去识别同类性能瓶颈，并给出优化后的代码。在 920 新型号上实测 ABACUS，计算 8 个原子的温稠密碳 (sDFT) 算例的速度快了 2.28 倍，计算 512 个 Si 原子的体系（LCAO 基组）算例的速度快了 2.66 倍。这套方案能落地，靠的是鲲鹏从硬件、基础软件、迁移优化工具到系统的全链路支撑。硬件侧是 920 的 NEON、SVE、SVE512 和矩阵运算单元，基础软件侧是 KBLAS、KFFT 等，迁移优化工具侧是一站式开发套件 Devkit。对鲲鹏来说，这次项目的关键意义在于支撑了几十万行的大型科学计算软件，通过适配优化后的代码能比业界主流硬件跑得更快，相关调优经验还能沉淀成其它科学软件项目也能用的基础工具。IT之家附开源链接：https://github.com/deepmodeling/abacus-develop", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/650.htm", "publishedAt": "2026-11-01T00:35:18+00:00"}, {"title": "OpenAI：12 月起，ChatGPT 将与 Codex 共享额度", "summary": "IT之家 11 月 1 日消息，OpenAI 发布公告，宣布从 12 月开始，随着将 Work 的智能体能力引入至 ChatGPT 主要体验中，Plus、Pro 以及 Business 订阅方案的用户将在 ChatGPT 与 Codex 之间共享统一的使用额度。IT之家获悉，在 ChatGPT 和 Codex 上的用量将统一按 Token 进行计量。额度的实际消耗速度取决于选用的模型及任务复杂度，而即时对话（Instant Chat）不占用额度。官方表示，正在全面推进过渡筹备工作，以确保用户工作流程不受干扰。预计绝大多数用户等待额度重置的频率不会高于此前。届时，用户可以在设置 → 使用量（Settings → Usage）中统一查看合并后的剩余额度及下次重置时间。若额度耗尽，用户可以选择等待额度自动重置、升级订阅方案，或是增购点数（Credits）来继续使用相关功能。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/645.htm", "publishedAt": "2026-10-31T23:58:31+00:00"}, {"title": "微信支付智慧经营机器人首次进店：支持迎宾、导购、点单等，基于腾讯混元打造", "summary": "IT之家 11 月 1 日消息，10 月 29 日，广东 7-ELEVEN 第 2000 家门店在深圳腾讯总部园区开业。当天，一台印有微信支付标识的智慧经营机器人第一次进店“打工”，这款机器人能推荐商品和优惠套餐，帮忙下单。选好了，再自己扫码买单。▲ 图源微信支付，下同官方表示，迎宾、导购、点单，智慧经营机器人分担一部分，店员就能腾出手补货、热饭、照顾现场。IT之家获悉，这款机器人基于腾讯混元打造，通过模型出色的多轮对话和 Agent 能力，辅助门店的日常销售、收款和经营。此外，微信支付智慧经营机器人搭载了腾讯天籁 inside 音频解决方案，即使店内环境嘈杂，也能“听清”用户声音。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/637.htm", "publishedAt": "2026-10-31T23:16:13+00:00"}, {"title": "鸿海董事长刘扬伟：预计未来数年攻下全球 AI 服务器半壁江山", "summary": "IT之家 10 月 31 日消息，当地时间 30 日。据美国 CNBC 报道，鸿海计划进一步扩大 AI 服务器业务，并加大在美国的生产布局。董事长刘扬伟表示，AI 基础设施市场需求依然强劲，集团希望借此进一步提高市场份额。刘扬伟在接受采访时透露，公司目前占据全球约 40% 的 AI 服务器市场份额，预计明年有望提高至约 45%，未来数年则有机会达到 50%。长期以来，鸿海以代工组装苹果 iPhone 闻名。近年来，AI 基础设施业务逐渐成为集团的重要增长引擎。▲ 图源鸿海刘扬伟预计，未来三至五年，AI 基础设施业务将贡献富士康 60% 至 65% 的营收，不包括直接在本地硬件上运行人工智能和机器学习算法的端侧 AI 设备。AI 基础设施订单持续增长，至少未来一年半的产能都已排满。目前订单主要来自 AI 模型开发商和云服务提供商，政府及企业客户尚未全面采用 AI 技术，但整体市场需求依然强劲。在美国市场，鸿海也准备进一步扩大生产规模。刘扬伟表示，集团计划向供应链上游延伸，以便更好地满足美国市场的需求。考虑到美国的制造成本较高，鸿海初期将优先生产 AI 服务器机柜、数据中心设备等利润率较高的产品。刘扬伟认为，随着美国本土生产规模扩大，制造成本最终也有望随之下降。通过此次扩张，公司希望进一步巩固在 AI 基础设施供应链中的地位，业务布局将从服务器、机柜延伸至整座数据中心和算力服务。不过，刘扬伟也提醒，AI 市场增长并不意味着企业可以不计成本地扩大投资。他强调必须严格控制投资规模，直言“过度投资会毁掉公司”。随着 AI 业务发展，公司每年在 AI 领域的投入预计会超过原定的 30 亿至 50 亿美元（IT之家注：现汇率约合 200.09 亿至 333.48 亿元人民币），具体取决于垂直整合的推进程度。对于大客户削减 AI 支出可能带来的影响，刘扬伟认为，单一客户需求下降，可以通过其他业务领域的增长予以弥补。但如果整个行业的需求都出现下滑，鸿海乃至整个 AI 供应链都将面临更大的挑战。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/627.htm", "publishedAt": "2026-10-31T14:53:54+00:00"}, {"title": "上汽荣威家越 07 明日开启全国交付：首搭豆包座舱助手，限时权益价 11.98 万元起", "summary": "IT之家 10 月 31 日消息，上汽集团宣布荣威家越 07 将于 11 月 1 日开启全国交付。荣威家越 07 于 10 月 23 日上市，包含四款车型，限时权益价区间 11.98-14.48 万元。荣威家越 07 长宽高为 4900*1910*1745mm，轴距 2908mm，提供龙晶紫、玛瑙灰、宝石蓝、珍溪黑、钻石白、翡翠绿等宝石车色，可选绵云青空、坚果可可、云绒暖灰内饰色，车内还配有 AI 灵光氛围灯、双 15.6 英寸 2.5K 超清大屏。此次新车搭载 AI 极速制冰冷暖两用冰箱，可实现最快十分钟制冰。IT之家注意到，该车行业首搭豆包座舱助手支持拟人化表情、FaceID 账号识别记忆、豆包 App 联动、方言外语，实现一句话联动全车、多人交流不打断等。该车还将搭载最新 Momenta R7 世界模型与新芯航图 XHEART X7 大模型专用芯片组成的软硬一体方案。可实现单侧余量 20cm 的极窄垂直泊车，适配 300 余种车位。覆盖常规车位及断头路泊车、离车泊入、一键贴边等场景，兼容城市 NOA、高速 NOA 等功能。规格方面，该车采用增程系统，配备 32.6kWh 和 44.2kWh 两种容量的电池组，纯电续航分别为 220km 和 320km，最大综合续航 1480km。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/618.htm", "publishedAt": "2026-10-31T13:55:36+00:00"}, {"title": "DeepSeek 提出 Super-agent 架构设计：Router 与 Worker 双层架构，探索更自主的 Agent 系统", "summary": "IT之家 10 月 31 日消息，DeepSeek Harness 官方团队今日发布《Super-agent 设计探索：迈向更自主的 Agent 系统》一文，介绍了其面向工程实践的 Super-agent 架构设计思路。随着大模型执行单个任务时越来越不需要人的干预，限制生产力进一步提升的因素正逐渐转向人的注意力，Agent 系统需要从被动响应指令的单任务工具，向持续在线、能够并行处理多项任务的自主协作者演进。DeepSeek 表示，现有主流 Agent 设计仍以单一 Session（会话）为基本单位，不同 Session 之间相互独立。用户并行推进多项工作时，需要手动切换并维护各个 Session 的上下文。根据 DeepSeek 团队观察，一个人通常只能同时跟进 3 至 5 个活跃 Session。即使通过 CLI、MCP 或外部连接器扩展本地 Agent，也仍可能面临单会话同步阻塞、多任务上下文混乱，以及本地设备离线后任务停止等问题。他们将这种新型 Agent 形态及其系统架构称为 Super-agent，并归纳出四项基础特征：连续、高效、主动和持久。首先，连续意味着用户可以在即时通讯、GitHub 评论等不同渠道与同一个 Agent 交互；高效意味着能够并行处理多个复杂任务；主动意味着系统可以持续观察环境事件并自行推进值得处理的事项；持久则要求 Agent 始终在线，并能在长期运行中从异常状态恢复。▲ 同一个任务在 IM 群聊与 GitHub Pull Request 评审之间连续推进▲ 持续关注公共群聊，在无人 @ 的情况下主动识别缺陷并提交修复 Pull RequestDeepSeek 提出的整体架构主要由双层架构、事件驱动、面向人的交互、计算与状态及环境分离、Watchdog 五部分组成。其中，双层架构将系统划分为 Router 层和 Worker 层：Router 负责承接人类交互、维护全局上下文并分派任务，Worker 则在相互隔离的会话中并发执行具体工作。Worker 不直接向用户回复，而是将状态和结果汇报给 Router，由后者统一对外沟通。▲ 双层架构：Router 层统一负责路由与对外交互，多个 Worker Session 隔离并发执行任务在事件驱动机制中，群聊消息、邮件与日程提醒、代码审查评论、CI 运行结果等外部信息被称为 Trigger。系统先通过程序规则过滤事件，再交由大模型判断是否需要采取行动。对于已经分配任务的事件流，Worker 可以订阅对应 Thread，后续相关事件由程序直接发送给 Worker，无需每次都经过 Router，从而降低路由负载。DeepSeek 团队还介绍了 Inline &amp; Spill 和链式召回（Chain of Recall）机制。前者将近期可能用到的信息直接放入模型上下文窗口，将超出预算或低频使用的内容保留在窗口之外，供模型按需读取；后者则通过 Trigger、Thread 和 Worker Session 等对象之间的引用关系，让模型沿关联 ID 逐步找回历史任务信息。▲ Super-agent 整体系统架构为减少人类等待时间，Super-agent 还引入投机执行机制，可以根据环境信号在后台提前开展工作。例如，收到会议邀约后先检查日程冲突、搜集背景资料并准备回复草稿；在研发协作场景中，则可以在群聊讨论问题时尝试复现故障、寻找修复方案，只有确认问题并找到简单修复方式后才向用户交付结果。在人机交互方面，文章提出异步 ReAct Loop，将耗时工具调用改为异步的 start () 和 stop ()。Agent 启动后台任务后即可返回 Started 状态，不必等待任务完成，后台结果随后作为新事件进入会话。这样，前台对话可以继续接收用户的新消息。不过，DS 团队特别说明，这项异步任务机制已经在 DeepSeek Harness 中实现，但尚未默认开启。▲ 两级过滤：先由程序层策略筛除大部分无关消息，再交由语义层策略判断针对长期在线运行，DeepSeek 将 Agent Loop 的计算、会话状态和执行环境进行解耦：计算与持久化状态放在云端，执行环境则可以保留在用户本地设备，仅部署负责执行命令和返回结果的轻量 daemon。该设计支持 BYOM（Bring Your Own Machine），即将用户日常使用的开发机或个人电脑接入云端 Agent，也支持连接云端托管机器或按需创建的计算环境。此外，系统在主架构之外设置独立的 Watchdog Session，形成外部控制回路。Watchdog 不仅监控接口报错、状态恢复失败等基础设施问题，还会通过模型判断 Worker 是否取得实质进展、执行方向是否偏离目标，并在发现异常时介入修复。▲ Thread 示例：同一个 IM 话题或同一个 GitHub Pull Request 下的连续 Trigger 构成一条 ThreadDeepSeek 团队还进行了初步实验，对比 Super-agent、去掉事件直通机制的 Super-agent，以及两种提示词配置下的单 Session 加 Subagent 方案。实验每次包含约 300 条消息，其中约 20 条为工作请求，每种方案重复运行 5 次。结果显示，Super-agent 的任务完成时间 p50 和 p95 分别为 12.4 分钟和 15.7 分钟；中性提示下的单 Session 方案 p95 为 29.5 分钟。DeepSeek 团队指出，这些实验基于合成负载和简化环境，主要评估系统调度与协作能力，并不衡量单个任务的实际执行能力。▲ 工作请求的累计到达曲线与四种方案的累计完成曲线（5 次实验运行均值；消息间隔与工作时长按 1/4 缩放，模型调用耗时为真实值）在 Router 层压力测试中，Trigger 到达速率从每分钟约 1 条提升至约 40 条时，平均批处理大小从 1.0 增至 2.8，单次请求耗时从 2.5 秒增至 3.9 秒，而单个决定分摊的推理时间从 6.4 秒降至 1.6 秒。团队据此认为，事件突发时，Router 可以通过合并积压事件提高有效吞吐。▲ 每种方案重复运行 5 次；任务完成时间指从工作请求到结果消息的耗时。文章同时指出，这套架构仍存在待解决的问题，包括 Router 层如何随任务规模扩展、跨月乃至更长时间跨度的长程记忆、脱离 Session 后的人机协作方式、不同 Agent 实例之间的 A2A 通信，以及安全与隐私保护。尤其是云端 Agent 接入本地设备后，提示词注入、端侧凭据泄露和跨设备权限风险都需要进一步解决。▲ 不同 Trigger 到达速率下 Router Session 的 batch 大小、单次请求耗时与单个决定的分摊推理时间DeepSeek 团队表示，基于上述思路和 DeepSeek Harness 构建的内部 Super-agent 实例已经持续运行，参与问题复现与修复、代码审查响应以及 DeepSeek Harness 自身迭代。此外，他们在文章中还提供了名为 dsh-superagent-prototype 的原型实现，但明确指出，该插件用于验证技术路线，并非 DeepSeek 正式产品。参考资料：dsh-superagent 的 GitHub 仓库：https://github.com/deepseek-ai/dsh-superagent-prototype", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/615.htm", "publishedAt": "2026-10-31T13:36:35+00:00"}, {"title": "西湖大学成立世界模型研究中心，致力于突破核心瓶颈", "summary": "IT之家 10 月 31 日消息，10 月 31 日，西湖世界模型研究中心在西湖大学云谷校区成立。这是西湖大学面向物理智能领域设立的校级交叉科研平台。该中心由西湖大学工学院博士生导师、助理教授，人工智能企业 KMind 联合创始人兼首席科学家于开丞担任主任，由西湖大学人工智能讲席教授、人工智能系系主任金耀初担任首席科学家，并有多位 PI （首席研究员）共同承担各方向研究任务。IT之家从官方介绍获悉，中心面向人工智能从语言认知走向物理交互的发展方向，聚焦世界模型与物理智能，致力于突破智能系统理解物理规律、预测环境变化和开展交互决策的核心瓶颈，打造具有国际引领性的物理智能学术高地与创新引擎。中心以世界模型为核心研究方向，探索感知、认知、预测与行动相结合的智能体系，推动人工智能在真实环境中形成理解世界、推演未来与自主行动的能力。依托西湖大学的科研基础与交叉学科优势，中心将汇聚多领域研究力量，促进基础理论、关键技术与应用探索协同发展，研发能够理解物理规律、预测行动后果并在真实反馈中持续学习的通用世界模型，支撑我国在新一代人工智能领域的自主创新与前沿布局。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/611.htm", "publishedAt": "2026-10-31T13:24:15+00:00"}, {"title": "世界模型首次指导设计芯片！超大核NPU700TOPS，99%算力可用", "summary": "AI算力利用“九九成”", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/10/506866.html", "publishedAt": "2026-10-31T05:11:19+00:00"}, {"title": "聚力开源向实 赋能产业创新——2026 上海开源软件应用创新大赛总决赛暨创新增长大会圆满落幕", "summary": "10月29日至30日，2026上海开源软件应用创新大赛总决赛暨创新增长大会在上海张江人工智能创新小镇举行。本届大赛由开源中国主办，自8月5日启动报名以来，共收到报名项目766个，40余家合作企业和开源社区参与；12道真实产业命题吸引269个项目应题攻关，30支团队晋级总决赛，角逐总价值100万元的奖池。10月30日的颁奖典礼上...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503320", "publishedAt": "2026-10-30T11:10:59+00:00"}, {"title": "英伟达团队基于 MiniMax H3 开源视频增强方案，最高支持 4K 重生成", "summary": "英伟达与麻省理工学院团队，在 Hugging Face 发布了视频增强项目 Open-H3-Regenerate-2K 的模型权重", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/10/506743.html", "publishedAt": "2026-10-30T07:31:11+00:00"}, {" 划于明年初推出 AI 音乐混音服务，用户可自制歌曲混音与翻唱版本", "summary": "IT之家 11 月 1 日消息，据金融时报 FT 消息，Spotify 正在积极推进版权授权谈判，并努力说服音乐人拥抱新技术。Spotify 计划在 2027 年初推出一项由人工智能驱动的新服务，允许用户自行制作歌曲的混音与翻唱版本。知情人士透露，Spotify 计划在明年的第一季度推出该产品，并可能在 2 月份格莱美奖（Grammy Awards）前后首次亮相。其中一位知情人士表示，Spotify 正在考虑向订阅用户每月额外收取 4 至 5 美元（IT之家注：现汇率约合 26.7 至 33.3 元人民币）的增值服务费。借助该功能，付费订阅用户可利用人工智能重新编排流行歌曲，例如将一首民谣改编为舞曲，或生成某位歌手“翻唱”他人曲目的全新版本。知情人士提醒称，具体时间和定价尚未最终确定，仍有可能发生变化。在该媒体报道其人工智能混音计划后，Spotify 的股价在周五上涨了近 6%。该公司拒绝发表评论。Spotify 正在与索尼音乐和华纳音乐就允许其上线该功能的授权协议进行谈判。据悉，该公司已与环球音乐集团、独立厂牌授权机构 Merlin 以及法国音乐公司 Believe 达成了协议。尽管该技术引发了一些艺术家的抵制，但这一产品的面世，将成为音乐产业检验能否把生成式 AI 转化为新盈利增长点的关键试金石。相关知情人士透露，Spotify 已联手全球最大的唱片巨头环球音乐，开始与多位知名音乐人展开一对一沟通，试图游说他们向该服务开放音乐版权。不过消息人士坦言，相较于说服部分成名已久的老牌音乐人，拿下当红流行巨星的合作阻力明显更大。根据规划，即便所属唱片公司已经与 Spotify 签署了授权协议，音乐人本人仍拥有自主决定是否参与的权利。Spotify 早在今年 5 月就对外预告了该功能，但此后一直未透露更多细节。今年 8 月，公司联席首席执行官古斯塔夫 · 索德斯特伦（Gustav Söderström）曾向投资者表态，称该服务将在彻底筹备就绪后正式推出。值得注意的是，该服务与 Suno 等根据文本提示从零生成全新音频的 AI 音乐生成器截然不同。Spotify 的模式是允许乐迷基于已授权同意入驻的音乐人作品进行二次创作。按照目前的拟定方案，乐迷创作混音版本所产生的版权版税将全额反哺给原作音乐人。知情人士还透露，Spotify 正在开发一套配套系统，使这些混音作品能够正常进入各类播放列表，其播放量也将直接计入原作歌曲在 Spotify 官方榜单的成绩。在今年 9 月举行的投资者交流会上，索德斯特伦曾公开呼吁老牌艺术家积极拥抱这项 AI 增值功能以拓宽变现渠道：“如果你是一位活跃于上世纪 80 或 90 年代的歌手，以往增加收入的唯一方式，只能寄希望于其他专业歌手来翻唱或混音你的老歌。而现在，你完全可以依靠全球粉丝亲自去创作、混音和翻唱你的经典作品。”他进一步补充道：“只要有一位粉丝为你的歌曲制作了混音版，你从流媒体总版权池中分得的版税份额就会因此切实增加。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/647.htm", "publishedAt": "2026-11-01T00:12:26+00:00"}, {"title": "AI 需求暴涨：英特尔火速改造多家 CPU 制造工厂，从桌面处理器改为数据中心处理器", "summary": "IT之家 11 月 1 日消息，据 Tom's Hardware 昨日报道，尽管消费级 PC 市场正在缩小，但英特尔有信心，AI 行业的需求将抵消客户端市场的下滑。为此，英特尔正在将部分产能从客户端 CPU 重新分配给数据中心 CPU，扩展爱尔兰的 Fab 24 生产更多 Xeon 芯片，提前开始美国在亚利桑那州的 Fab 62 安装设备，并承诺生产 18A 芯片，同时在新墨西哥和马来西亚扩展先进封装能力。英特尔 CEO 陈立武在公司财报电话会议上表示：“行业仍在经历史上最严重的供应短缺之一，这主要由对超级智能前所未有的需求推动。在这样的背景下，我对我们在第三季度服务器供应增长上的进展感到满意。我意识到未来几个季度我们要应对服务器需求的持续挑战。”该公司的数据中心与人工智能（DCAI）业务在 2026 年第三季度创造了 73 亿美元（IT之家注：现汇率约合 486.88 亿元人民币）的收入，环比增长 17%，同比增长近 80%。英特尔预计，随着 AI 基础设施运营商部署更多 CPU 密集型智能体和推理工作负载，2027-2028 年数据中心 CPU 的需求将保持强劲。为了满足未来几年对 Xeon CPU 的需求，英特尔的当务之急之一是提升 Xeon 6“Granite Rapids”处理器的产量，这些处理器采用 Intel 3 工艺技术制造。该公司最近开始扩建位于爱尔兰莱克斯利普附近的 Fab 24 制造综合体的产能，但该产能要到 2027 年底才会投产。为了进一步提升 Intel 3 的产能，英特尔计划将俄勒冈工厂部分制造资源从 Intel 18A &nbsp;转换为 Intel 3。这些产线最初用于制造 Panther Lake 桌面处理器，但由于 PC 需求减弱，英特尔将优先生产需求更高的数据中心产品。该公司预计俄勒冈州新增的 Intel 3 产能将在 2027 年下半年投入生产。英特尔还在加速其在亚利桑那州的前沿制造业务扩展。该公司正在加快 Fab 52 的 Intel 18A 生产，并加速将设备安装到邻近的 Fab 62，该工厂将成为英特尔第二个用于 18A、18A-P 及衍生工艺技术的大批量制造工厂。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/642.htm", "publishedAt": "2026-10-31T23:44:36+00:00"}, {"title": "AI 编程导师挑战低端 Android 手机！不用服务器，Python 和 SQL 直接在浏览器里运行", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/HHgKMMKa8BNZYQuMFSMS?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-31T20:43:05+00:00"}, {"title": "AI 基建掀起军备竞赛：微软、谷歌、甲骨文等巨头承诺投入超 3 万亿美元", "summary": "IT之家 10 月 31 日消息，据彭博社今天（31 日）凌晨报道，AI 基础设施建设仍将吸引巨额资金。Alphabet、Meta、微软、亚马逊和甲骨文五大科技巨头承诺，未来数年将在数据中心等领域投入超过 3 万亿美元（IT之家注：现汇率约合 20.01 万亿元人民币）。随着数据中心建设竞赛愈演愈烈，五家公司披露的租赁、建筑、能源及设备采购承诺大幅增长。这些资金有的将在短期内支出，有的则涉及未来数十年的长期合同。谷歌的支出承诺规模最大。根据 Alphabet 提交的监管文件，包括技术设备、能源和租赁在内的合同承诺总额超过 1 万亿美元（现汇率约合 6.67 万亿元人民币），接近一年前的八倍。Meta 的支出承诺同样大幅攀升，未来支出总额超过 8,000 亿美元（现汇率约合 5.34 万亿元人民币）。其中将近一半用于尚未生效的数据中心租约，最长分 30 年支付。Meta CFO 苏珊 · 李在上周的分析师电话会议上说：“我们预计将继续大举投资，支持核心业务和新兴 AI 项目。”今年商界的一大争论，是科技企业斥资数千亿美元建设 AI 数据中心，究竟能否收回投资。Alphabet 和 Meta 都是全球最赚钱的企业之一，却因投资有望改变行业格局的新业务，出现自由现金流由正转负的情况。不过，五家公司的支出并非全部用于数据中心，披露口径也不完全一致，因此很难直接比较。例如，Meta 的部分预算用于 Reality Labs 部门的消费级硬件产品，Alphabet 和亚马逊的计划支出则包括内容授权费用。本次统计也没有计入现有租约和债务等其他大额支出。五家公司未来的租赁付款承诺合计 1.3 万亿美元（现汇率约合 8.67 万亿元人民币），其他采购承诺合计 1.9 万亿美元（现汇率约合 12.67 万亿元人民币）。除微软外，数据均取自各家公司最新财报。微软的采购和建设订单数据来自截至 6 月底的年度报告，该公司此后尚未更新这两项数据。甲骨文是首家因投资 AI 数据中心而陷入自由现金流为负的大型科技公司。在本周早些时候举行的投资者说明会上，甲骨文预计到 2028 年恢复正自由现金流，并计划通过供应商融资和客户预付款等方式，减少项目初期需要自行承担的资金支出。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/632.htm", "publishedAt": "2026-10-31T15:56:00+00:00"}, {"title": "当AI从“会想”走向“会干”——腾讯云与英特尔共筑Agentic AI执行新底座", "summary": "点击查看原文>", "sourceName 损失超过 2 亿美元（IT之家注：现汇率约合 13.34 亿元人民币）。目前，超过 40 起未结的欺诈案件涉及 26 个联邦调查局现场办事处和 20 个美国检察官办公室。司法部将其命名为“Operation Ghostbusters”行动，目前已有五人被起诉。美国司法部国家欺诈执法司助理司法部长 Colin M. McDonald 在声明中表示：“今天，我们宣布 Operation Ghostbusters 行动的首批成果 —— 这是一项全国性的行动，旨在阻止针对联邦学生资助、低收入美国人和美国纳税人的重大欺诈计划。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/649.htm", "publishedAt": "2026-11-01T00:31:48+00:00"}, {"title": "美国白宫科学与技术顾问会议主席：Anthropic 很可能成为资本主义历史最伟大企业", "summary": "IT之家 11 月 1 日消息，美国白宫科学与技术顾问会议主席戴维 · 奥利弗 · 萨克斯（David Oliver Sacks）最近出席 All-In 播客，深入分析 Anthropic 的 S-1 注册文件，称这家人工智能初创公司很可能成为资本主义历史上最伟大的企业。Anthropic 在文件中透露，公司 2026 年上半年营收 163 亿美元（IT之家注：现汇率约合 1,087.14 亿元人民币），账面现金 1,120 亿美元（现汇率约合 7,469.91 亿元人民币），预计 2026 年度经常性收入达 1,000 亿美元（现汇率约合 6,669.57 亿元人民币）。通过发行 F 类股票，公司七位创始人将持有 50.1% 的投票权。戴维 · 萨克斯表示：“我认为，这很可能成为有史以来回报最高的风险投资项目，尤其考虑到这家公司仅成立六年。这也可能是史上价值创造速度最快的风险投资支持企业。”他继续说道：“Anthropic 拥有超 1000 亿美元现金，他们几乎没有烧掉筹集的钱，简直是资本使用效率的典范。“现在有很多看空 Anthropic 的人认为，这家公司未来承诺的资本开支太高，根本不可能兑现。”“但这次 IPO 反而为这些承诺提供了保障，因为他们现在已经拥有足够的资金，可以为所有算力订单以及预计中的资本开支提供资金支持。他们实际上只需要募集 800 亿、900 亿或者 1000 亿美元，对吧？这与募集 1500 亿、1750 亿甚至 2000 亿美元完全是两回事，而我之前认为他们需要募集这么多资金。”“因此，他们在 IPO 过程中对资本市场提出的融资需求会更低，这意味着他们将拥有更强的定价能力，也能够更好地控制流通股数量。我认为，所有这些因素都让我们有理由对 Anthropic 的 IPO 持积极态度。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/633.htm", "publishedAt": "2026-10-31T22:56:28+00:00"}, {"title": "史上最大 IPO 前夕，黑石突然改口称 Anthropic 或无法获得投资级信用评级", "summary": "IT之家 10 月 31 日消息，据英国《金融时报》30 日报道，黑石集团向投资者透露，Anthropic 上市后可能暂时拿不到投资级信用评级。这一预期与黑石此前的说法出现反转，也给 Anthropic 为庞大支出筹集资金增加了难度。据知情人士透露，在 Anthropic 最新一笔 630 亿美元（IT之家注：现汇率约合 4,201.83 亿元人民币）的芯片融资交易中，黑石集团告知投资者，主要信用评级机构更有可能在 Anthropic 上市后给予其较高档位的投机级评级，而非投资级评级。若 Anthropic 下个月顺利上市，有望创下史上最大规模 IPO 纪录。招股书披露，公司“大胆但理性”计划从现在到 2045 年向计算基础设施投入超过 8,000 亿美元（现汇率约合 5.34 万亿元人民币）。能否获得投资级评级，关系到 Anthropic 未来能否以较低利率借款，为 AI 基础设施建设提供资金。该公司目前持有超过 1,120 亿美元（现汇率约合 7,469.91 亿元人民币）现金及现金等价物，投资者预计 IPO 还可能为其带来约 1,000 亿美元（现汇率约合 6,669.57 亿元人民币）融资。黑石此前几个月一直向投资合作伙伴表示，预计 Anthropic 会在年底前获得投资级评级。然而，知情人士称，根据主要信用评级机构给出的指引，黑石最近调整了预期，认为 Anthropic 更可能获得 BB 级区间或更高评级。这样的评级会缩小 Anthropic 能够获得的融资来源。许多保险公司和养老基金受到投资规定限制，不能大规模投资信用评级处于投机级的债务发行人。Anthropic 因此可能仍要依靠信用评级较高的供应商，为其债务融资提供支持。华尔街银行本周早些时候完成了“北极星计划”融资交易，为 Anthropic 租用谷歌芯片提供资金，涉及芯片总功率达 1.5 吉瓦。其中超过 420 亿美元（现汇率约合 2,801.22 亿元人民币）的优先级贷款由博通担保。博通参与这些芯片的联合开发，自身也拥有投资级信用评级；另有 180 亿美元（现汇率约合 1,200.52 亿元人民币）次级债务，则以 Anthropic 支付的租金作为偿付保障。机构投资者更青睐优先级债务，因为借款方一旦违约，优先级债务会先于次级贷款获得偿付。博通较高的 A 档信用评级，是 Anthropic 能够获得这笔融资的重要条件。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/610.htm", "publishedAt": "2026-10-31T13:10:01+00:00"}, {"title": "终于不是 AI 了：Lambda 直接运行 Express，API Gateway 还需要吗？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/fcdAAd69U452t9b39rLU?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-31T08:00:00+00:00"}, {"title": "刚刚，Claude宣布取消5小时限制！首批Ultra用户已「解封」", "summary": "200美元Ultra用户先用", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/10/506855.html", "publishedAt": "2026-10-31T05:05:29+00:00"}, {"title": "iPhone 国行 AI 真的来了，千问成为 Siri 新搭档", "summary": "苹果国行 AI 终于迈出关键一步#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1686969?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-10-30T22:34:47+00:00"}, {"title": "AI+社区：「模力工场」连接AI供需，补上信任缺口｜极客邦科技创始人兼CEO 霍太稳分享", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/f3FdeDczctAdHMhvBdKw?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-30T18:53:48+00:00"}, {"title": "EmbeddingGemma 2：Google 把五种模态塞进同一个向量空间", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/O6mtiB7FVd0VSDHJe348?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-30T17:00:00+00:00"}, {"title": "超节点火了一年后，“算力不够就加机器”的扩张逻辑正在被改写", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/ZolBIJdvK5Icdqg6FB0X?utm_source=rss&amp;utm_medium=article", "publishe //www.ifanr.com/1686874?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-10-30T07:42:58+00:00"}, {"title": "Pico CSS 停止维护，作者解释称“AI 能直接生成它要做的事”", "summary": "Pico CSS 停在 v2.1.1 了。这个以\"给语义化 HTML 用的极简 CSS 框架\"出名的项目，在 GitHub Discussion 里宣布不再维护，仓库归档，不再接受 issue、PR 和发布新版本。 理由写得直接，而且把账算到了 AI 头上： 今天 AI 能生成轻量、独立、可访问的 HTML，只带它真正需要的 CSS，所以\"为语义化 HTML 而做的极简 CSS 框架...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503309", "publishedAt": "2026-10-30T03:12:25+00:00"}, {"title": "谷歌发布 Gemini 4 Carbon，安全能力先开放给白帽子", "summary": "Google DeepMind 宣布推出 Gemini 4 Carbon，离上一代 Argon 只隔了两周。官方给它的定位很聚焦：迄今最强的网络安全能力和长程任务能力。 成绩单先摆出来。Artificial Analysis Intelligence Index v5.0 上拿到 59 分排第一；WebDev Arena 上靠网页开发和产物的质量提升，elo 涨了 89 分，以 1768 排到第 4。但真正的重...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503286/google-gemini-4-carbon", "publishedAt": "2026-10-29T03:14:34+00:00"}, {"title": "Anthropic 工程经理把传统编程面试砍了，“它不再提供有效信号”", "summary": "\"编程面试已经死了，至少对我这个团队来说。\" Felix Rieseberg 是 Anthropic 的工程经理，管过 Claude.ai、Cowork 和 Claude Code Desktop，他在推文里说他这个月把传统编程面试从流程里拿掉了。\"我看得够多了，它不再提供有效信号。\" 理由很直接：让你现场写个小 React 挑战，跟考你汇编语言一样没有意义——Claude 两样...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503275/the-coding-interview-is-dead", "publishedAt": "2026-10-28T10:08:54+00:00"}, {"title": "深度使用 Zig 四个月：最爱的设计和最失望的坑，来自同一种偏执", "summary": "Anna Liberty 放弃 Zig 后转用了几年 Rust，近日她表示自己大约四个月前重新开始使用 Zig，还攒了一篇挺有料的体验报告。有意思的地方在于：她最爱的几个特性和最失望的那件事，来自同一套设计哲学的两面。 先说不爽的。她第一个项目写 snurl（小网络协议库，Gemini、Finger、Gopher 那类），想按 TigerStyle 做测试和 ...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503266/four-months-of-zig", "publishedAt": "2026-10-28T03:54:47+00:00"}]}, {"label": "论文研究", "items": [{"title": "《影之刃零》初体验：快意恩仇武侠路，NVIDIA DLSS 4.5 来相助", "summary": "10 月 29 日，灵游坊 S-GAME 自主研发和发行，虚幻 5 引擎打造的全新功夫朋克暗黑武侠动作 RPG 游戏《影之刃零》（Phantom Blade Zero）正式发售。游戏世界观承接《雨血》系列，舞台设定在架空江湖“影境”，玩家将化身心脏遭受重创的剑客 —— 魂，用仅有的六十六天寿命，查找武林阴谋真相，并寻求续命之法。游戏首销日热度极高，Steam 在线玩家峰值数量达到了 72.39 万，位居 Steam 实时榜第二名的位置，在线人数仅次于《CS2》。而在评价方面，首批专业游戏媒体的游戏开分均达到 9 分以上（满分 10 分）水平，首发就支持了路径追踪和 NVIDIA DLSS 4.5 动态多帧生成。IT之家也于游戏发售当天第一时间进行了体验，本次我们将通过 2 套主流 PC 硬件，带大家看看这款游戏的实际体验如何。一、测试平台为了给玩家朋友们提供具有价值的性能参考，IT之家这次以 AMD 锐龙 7 9800X3D 处理器，技嘉 B850 雕妹主板，RTX 5080 和 RTX 5070 显卡，64GB DDR5 6000MHz C30 内存套条为核心搭建测试平台。其中，主板我们选择了技嘉 B850 AORUS ELITE-P ICE 雕妹，经典银白配色 PCB + 散热装甲，全新睡衣雕妹动态屏显，搭配白色系 PC 硬件，颜值很高。它采用 16+2+2 相 DrMOS 60A 供电规格，支持 X3D 鸡血模式，D5 内存黑科技 2.0，最高可超频到 DDR5 8200MT/s 内存频率，2 条全长度 PCIe 5.0 x16 + PCIe 4.0 x4 插槽，4 条 M.2 插槽扩展性拉满，还有整套 EZ-DIY 快拆设计和数显纠错灯，整体表现均衡全面。显卡搭配的则是来自技嘉的 GeForce RTX 5080 超级雕 ICE 显卡以及七彩虹的 iGame GeForce RTX 5070 Ultra OC 12GB x 007 First Light Edition 显卡，分别对应 4K 和 2K 的测试基准分辨率。为了获得更好的游戏体验，我们采用了 26H2 最新版本的 Windows 11 系统。需要注意的是，本次测试基于 617.42 版本的 GeForce Game Ready 驱动程序，而非最新的 621.01 版本，游戏的性能数据基于 NVIDIA App 的信息浮窗功能采集。二、画面效果首先我们来了解一下《影之刃零》的画质选项情况。在基础画质预设上，游戏提供了低、中、高、超高、最高五种预设选项，画质标签最上方还有一个应用推荐画质等级，游戏会根据玩家当前的硬件配置，自动推荐合适的画质预设，一键应用。光线追踪质量拥有关闭、光线追踪和路径追踪 3 个选项，光线重建提供了单独的开关选项，当 N 卡开启路径追踪并在超分辨率设置中选择 DLSS 后，光线重建将保持开启状态。低画质中画质高画质超高画质最高画质先看五档基础画质预设的画面对比，在这组典型的光照场景中，低画质和中画质属于一个层次的观感，低画质墙面文字都是糊的，左侧植被密度最少，对比度最低，右侧木箱、陶罐和金属笼子几乎没有阴影表达，材质发灰或缺失，断木桩贴图有明显塑料感。同时，主角衣服布料细节最少，反射光表达也很塑料，脸部反光比较“油腻”，斗篷贴图非常“风味”。中档画质表现稍好一些，至少墙壁上的文字不再发虚，左侧植被叶片也没被“抹去”，但其它方面和低画质看不出太大区别。到了高画质，物体的贴图细节和纹理开始丰富、整体光影也更加真实，木箱、陶罐的暗部阴影有了轮廓，金属牢笼也终于有了金属感，并找回了部分高光反射。主角脸部反光不再塑料，头发变得更加贴合脸部轮廓，斗笠也不再是“风味”贴图，整个身体的亮部和暗部光线逐渐清晰，人物更加立体，金属反射也更真实。超高和最高画质则让整体的光影表达更加自然，建议各位小伙伴有能力至少开到高画质档位，以获得不错的物体和光影细节。关闭光线追踪开启光线追踪光线追踪（光线重建）路径追踪再来看开启光线追踪和路径追踪后的表现，从这组对比中不难发现，只有路径追踪下人物的环境光遮蔽效果是真实的，主角的斗笠遮挡住面部，有阴影才是对的，面部皮肤颜色也更加自然。无论开启还是关闭光线追踪，主角头发始终发灰，脸部发白，斗笠下方也是没有阴影的。光线追踪路径追踪不仅如此，路径追踪也可以让水体看起来更加清澈，倒影反射更加柔和自然，受到光线照射的流动水体会呈现出不规则的边缘高光，环境拟真效果最好。可以说如果执着于画质和氛围感，就必须开启路径追踪。三、性能表现本次性能测试基于 RTX 5070 和 RTX 5080 显卡，分辨率分别为 2K 和 4K，超分辨率类型均为 DLSS。左：TSR 右：DLSS值得一提的是，虽然本作提供了 TSR、XeSS、FSR 以及 DLSS 四种超分辨率方案，但我们一开始尝试 TSR 超分辨率时发现，相同画面设置下 TSR 超分辨率虽然能够提供 2 倍于 DLSS 超分辨率的游戏平均帧数，但人物脸部和头发会呈现出“超绝破碎感”，可能还存在一些 BUG，观感完全比不上 DLSS，至于 XeSS 和 FSR 超分辨率并不在本次讨论范围内，不过整体画面效果还是 DLSS 超分辨率最好。1）光栅性能测试场景我们选择了序章的竹林和木桥这里，别看还是序章，但该场景中大量的竹子和竹叶，加上光照和反射的光影，性能压力真心不小。RTX 5070 在 2K 分辨率 + 最高画质 + DLAA 超分下，游戏平均帧数 54 帧，1% Low 36 帧；RTX 5080 在 4K 分辨率 + 最高画质 + DLAA 超分下，游戏平均帧数 47 帧，1% Low 33 帧；由此可见，无论是 2K 还是 4K 分辨率，虚幻 5 引擎的画面表现虽好，性能压力也非常大，两张对应 2K 和 4K 分辨率的典型显卡型号，游戏平均帧数均没有达到 60 帧及格线，也就是说即使不开启光线追踪选项，想要 60 帧畅玩《影之刃零》，必须要借助 DLSS 超分辨率才行。2）路径追踪性能前面我们提到，路径追踪是画质拟真和光影表达的最优解，光线追踪属于折中水平，追求性能的玩家直接关闭光追，开启高档位以上基础画质保帧数；而配置足够高的画面党，一步到位开启路径追踪才是王道。这次我们选择的初次遇到女 NPC 的这个场景，有人物、有篝火和炊烟、有植被山石水体，整体环境还是相当复杂的，测试过程就是围着篝火跑图 3 分钟。RTX 5070 显卡：2K 最高画质 + 路径追踪 + DLSS 质量 + 6 倍多帧生成先看 RTX 5070 显卡，默认采用 2K 分辨率 + 最高画质：路径追踪 + DLAA，游戏平均帧数 47 帧，1% Low 40 帧；路径追踪 + DLSS 质量，游戏平均帧数 67 帧，1% Low 50 帧；路径追踪 + DLSS 平衡，游戏平均帧数 74 帧，1% Low 58 帧；路径追踪 + DLSS 性能，游戏平均帧数 80 帧，1% Low 67 帧；路径追踪 + DLSS 超级性能，游戏平均帧数 98 帧，1% Low 88 帧；路径追踪 + DLSS 质量 + 3 倍多帧生成，游戏平均帧数 165 帧，1% Low 141 帧；路径追踪 + DLSS 质量 + 6 倍多帧生成，游戏平均帧数 280 帧，1% Low 225 帧。RTX 5080 显卡：4K 最高画质 + 路径追踪 + DLSS 质量 + 6 倍多帧生成再看 RTX 5080 显卡，默认采用 4K 分辨率 + 最高画质：路径追踪 + DLAA，游戏平均帧数 38 帧，1% Low 28 帧；路径追踪 + DLSS 质量，游戏平均帧数 61 帧，1% Low 56 帧；路径追踪 + DLSS 平衡，游戏平均帧数 69 帧，1% Low 63 帧；路径追踪 + DLSS 性能，游戏平均帧数 79 帧，1% Low 73 帧；路径追踪 + DLSS 超级性能，游戏平均帧数 99 帧，1% Low 90 帧；路径追踪 + DLSS 质量 + 3 倍多帧生成，游戏平均帧数 158 帧，1% Low 130 帧；路径追踪 + DLSS 质量 + 6 倍多帧生成，游戏平均帧数 225 帧，1% Low 169 帧。可以看到，无论是 4K + RTX 5080 显卡，还是 2K + RTX 5070 显卡，开启最高画质和路径追踪后，DLAA 超分依旧不能满足平均 60 帧的及格线，但只要将 DLSS 超分辨率稍微降一档到质量，2 张显卡就基本能够满足平均 60 帧需求了，再配合 DLSS 4.5 的多帧生成选项，3 倍多帧生成就可以达到 160 帧左右的水平，而 6 倍多帧生成下，RTX 5070 最高可以来到 280 帧，RTX 5080 也有 220+ 以上的帧数，无需考虑 DLSS 质量以下的超分辨率档位，就能获得不错的性能表现了。至于 DLSS 质量以下的超分辨率档位，每档的游戏平均帧数比较有限，毕竟有路径追踪在，基础帧数就不是很高，从分辨率和游戏体验上看，DLSS 质量 + DLSS 4.5 帧生成的搭配最为合适，而且在最高 6 倍多帧生成下的游戏平均延迟也都控制在 50ms 以内，对于一款高速动作游戏来说可以接受。四、总结当大家看到这篇评测的时候，估计已经在影境里爽 2 天了。说到底，《影之刃零》最对味的还是它的战斗，鼓励主动进攻、攻防转换，轻重武器随手一切，招式又帅又丝滑，爽感直接拉满。画面就是虚幻 5 的正常发挥，跟其他 UE5 单机大差不差。爱探索和爱收集的玩家，开着 RTX 路径追踪，暗黑武侠的那股味儿，完全可以把它当作风景模拟器；但对大多数人来说，DLSS 4.5 多帧生成更为刚需，哪怕虚幻 5 的性能压力叠满，帧生成一拉，打架照样丝滑不卡。最后，祝各位周末愉快，愿你在刀光剑影里，找到属于自己的江湖快意恩仇。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/664.htm", "publishedAt": "2026-11-01T01:32:18+00:00"}, {"title": "Roblox 平台 AI 游戏突破 7 万款，排名前 100 作品超 80% 使用 AI 辅助开发", "summary": "IT之家 11 月 1 日消息，Roblox 在 2026 财年第三季度报告中透露，该平台内使用 Build 创建的 AI 游戏总数已超过 7 万款。9 月游玩时长排名前 100 游戏中，超 80% 使用 AI 辅助开发。据介绍，Roblox 已有超 50 万名用户使用 Build 工具。在本季度内，有 2 款几乎完全由 AI 创作的游戏，进入平台同时在线玩家数量排行榜前 20 名。IT之家了解到，Roblox 的 Build 功能推出于 2026 年 7 月底，采用移动端优先设计策略，允许创作者借助 AI 生成游戏内容。该工具面向年满 9 周岁且完成年龄验证的用户开放，已发布的 AI 生成游戏仅面向 16 岁以上用户开放。此外，Roblox 计划推出 Universal Player 计划，允许开发者将现有主机、PC 或移动游戏导入 Roblox 平台。从平台整体用户构成来看，2026 年第三季度 Roblox 每日活跃用户中，26% 的年龄在 18 至 34 岁之间，而未满 18 岁的用户占当季每日活跃用户的 18%。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/651.htm", "publishedAt": "2026-11-01T00:40:35+00:00"}, {"title": "马斯克公布 Neuralink 脑机新产品进展：第二款产品“盲视”只待监管批准", "summary": "IT之家 10 月 31 日消息，马斯克透露，Neuralink 第二款脑机接口设备 Blindsight（盲视）已完成工程研发，接下来只待监管部门放行。这款设备旨在帮助失明者以及从出生起就没有视觉的人获得视觉能力。不过，迄今尚无公开披露并得到确认的人体植入试验结果。马斯克 30 日在 X 上发文称：“从工程研发的角度来说，设备已经准备就绪，只等监管部门批准。”与 Neuralink 此前推出的首款植入设备不同，“盲视”并不是读取大脑活动并将信号传输出去，而是反过来向大脑输入信息。设备将摄像头获取的画面转换为信号，传递到大脑视觉皮层，试图绕过已经受损的眼睛和视神经，让使用者获得视觉信息。2024 年 9 月，FDA 授予“盲视”突破性医疗器械认定，以加快审批审查。但这项认定既不代表 FDA 已经确认设备安全有效，也不意味着产品获得上市销售许可。“盲视”目前仍处于临床试验阶段。马斯克今年 8 月曾透露，若获得监管批准，Neuralink 计划在未来 6 至 12 个月内开展人体植入。截至目前，公司没有公布“盲视”的人体试验结果。动物试验方面，Neuralink 已开展长期测试，截至 2025 年年中，有一只猴子连续植入该设备已有三年。除了 Blindsight，马斯克还介绍了 Neuralink 的首款产品 Telepathy（心灵感应）。这款设备可以让瘫痪患者通过脑信号操控电脑。“只需通过思考，就能与电脑或其他人进行高速交流。”马斯克预计，未来几年，“心灵感应”的信息输出能力将远超人类最快的说话和打字速度。他还希望 Neuralink 未来能够将运动和感觉信号传递至四肢，让失去行动能力的患者重新使用双手，甚至恢复行走。IT之家附上两款产品当前的主要信息如下：项目主要功能监管状态已公开的人体试验情况Telepathy通过意念操控电脑及进行交流仍在临床研究阶段；PRIME 研究于 2024 年 1 月启动人体植入已展示光标控制及其他数字交互Blindsight向大脑视觉皮层输入视觉信息2024 年 9 月获得突破性医疗器械认定，尚未获准上市尚无公开确认的人体试验结果VOICE 研究功能恢复语言交流、拨打电话、语音输入及操控 AI 智能体仍在临床研究阶段已展示相关功能，但没有公布量化性能数据", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/630.htm", "publishedAt": "2026-10-31T15:13:20+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "每天上千万次创建：Agent Sandbox 为什么会成为新算力形态？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/v const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
