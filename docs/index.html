是 Hy4 迭代的一个早期版本，预训练和后训练均仍有较大的提升空间，也有一些已知问题，如复杂任务的长思考和过度自我验证倾向，将持续敏捷迭代。如同 Hy3 preview，我们希望通过 Hy4 preview 的尽快发布获得广泛的真实反馈，从而显著提升 Hy4 正式版。同时，我们将坚持发挥与腾讯产品和专家深度合作的独特优势，持续提升生产力的普惠性和上限。Hy4 preview 现已开源，在腾讯云 TokenHub 和 OpenRouter 上线，并可在 &nbsp;WorkBuddy / CodeBuddy 、元宝、ima 等产品上体验。IT之家附相关链接：HuggingFace：https://huggingface.co/tencent/Hy4-previewGithub：https://github.com/Tencent-Hunyuan/Hy4-previewModelscope：https://modelscope.cn/models/Tencent-Hunyuan/Hy4-previewGitcode: https://ai.gitcode.com/tencent_hunyuan/Hy4-preview", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/995/570.htm", "publishedAt": "2026-08-28T06:15:34+00:00"}, {"title": "开源电子书工具 Calibre 9.14 发布：首次引入 AI 生成封面", "summary": "IT之家 8 月 28 日消息，科技媒体 Linuxiac 今天（8 月 28 日）发布博文，报道称开源电子书管理器 Calibre 推出 9.14 版本更新，首次引入了由 AI 驱动的电子书封面图像生成器。IT之家援引博文介绍，对于同人小说、自制 PDF / EPUB 文档等内容而言，因为缺少官方封面，经常会在书架上显示为“空白方块”或“简陋文字块”等。而 Calibre 9.14 版支持用户直接在本地调用图像生成 AI 接口服务，修补上述视觉不足。用户只需选中任意书籍，依次点击“编辑元数据（Edit metadata）”及其新增的“AI 生成（AI Generate）”专属按钮，大模型便会根据书名、简介等文本特征，在几秒钟内自适应渲染出一张高分辨率的专属艺术封面。在书籍编辑器（Edit book）内，9.14 版新增了文件浏览器悬浮预览功能，用户只需将鼠标指针悬停在内部图像文件上方，侧边便会弹出一张浮动缩略图，省去了反复点击双击开窗的繁琐步骤。新版还升级标签编辑器（Tags editor）的搜索功能，可以忽略声调 / 变音符号（Ignore Accents），对多国语言文本的管理更加包容。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/995/569.htm", "publishedAt": "2026-08-28T06:12:37+00:00"}, {"title": "溢价达 288%：微软 25 周年版 XBOX Series X 预购秒没，被黄牛倒卖", "summary": "IT之家 8 月 28 日消息，科技媒体 Windows Central 昨日（8 月 27 日）发布博文，报道称微软 25 周年纪念版 XBOX Series X 遭黄牛疯抢，官方定价为 899.99 美元（IT之家注：现汇率约合 6,063 元人民币），开放预购后数秒内售罄，且 eBay 等二手平台上转售价格暴涨至 2,000~3,500 美元（现汇率约合 13,474 ~ 23,580 元人民币），最高溢价 288.89%。这款纪念主机搭载 1TB 存储，外观采用致敬初代 XBOX 的经典半透明绿色（“OG Green”）设计。每台主机附带一份《光环：战役进化》完整游戏下载码。这款采用半透明绿色外壳的特别版主机预购于美国东部时间 8 月 27 日上午 10 点（北京时间 8 月 27 日 22:00）开启，11 月 13 日正式发售。报道称在开启预购 3~8 秒内，微软 25 周年纪念版 XBOX Series X 便宣告售罄。且页面显示售罄后，在 eBay、Mercari 等二手平台上涌现了超过 4000 条商品记录，基本上都带有抢购成功订单截图。报道称微软 25 周年纪念版 XBOX Series X 转售价格在 2,000 美元（现汇率约合 13,474 元人民币）左右，部分带有较前编号（如 No.00025）的极端收藏商品页面，要价甚至冲高到了 3,500 美元（现汇率约合 23,580 元人民币），量化溢价率高达 288%。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/995/518.htm", "publishedAt": "2026-08-28T05:18:06+00:00"}, {"title": "Anthropic 推出 MHS 标准，首度重拳杀入物理 AI 领域", "summary": "IT之家 8 月 28 日消息，Anthropic 昨日（8 月 27 日）发布博文，宣布以研究预览形式，发布模型硬件标准（Model Hardware Standard，MHS），路透社、CNBC 等媒体解读认为这标志着该公司首次公开进军具身智能与物理 AI（Physical AI）领域。Physical AI（物理人工智能 / 实体 AI）是指能够感知物理世界、在其中执行复杂动作并持续学习的 AI 系统。传统 AI 主要运行在数字环境中，处理文字、图片或音频。而 Physical AI 拥有了一个“身体”—— 它可以是自动驾驶汽车、仓储机器人、工业机械臂，甚至是人形机器人。和 Anthropic 此前推出的模型上下文协议（MCP）类似，MHS 本质上是一个统一的控制与通信标准，让 AI 智能体操控具备可编程接口（Programmable Interface）的设备。例如，AI 智能体可以在几乎没有人工干预的情况下，同时控制显微镜、液体处理器、机械臂和量子计算设备等仪器，全天候自主执行工作流程。Anthropic 公司的一张图表展示了 MHS 如何作为人工智能代理和多种设备之间的“翻译”层。图片来源：Anthropic在早期全量闭门测试中，MHS 在生物医药、量子计算和高级制造等核心硬科技领域表现出了极强的提速能力。制药巨头基因泰克（Genentech）表示，通过 MHS 赋予 AI 直接操控多台异构实验设备的权限，让其全自动剂量反应曲线（Dose-Response Curve）实验的整体开发和运行速度直接缩短到原来的三分之一。IT之家附上相关视频如下：", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/995/514.htm", "publishedAt": "2026-08-28T04:46:12+00:00"}, {"title": "国家发改委：发展机器人产业必须因地制宜，防止盲目跟风、一哄而上", "summary": "IT之家 8 月 28 日消息，据国家发展改革委官网文字实录，国家发展改革委政策研究室副主任李超在今日的发改委 8 月份例行发布会上表示，机器人产业涉及人工智能、先进制造、新材料等诸多前沿技术，必须坚持因地制宜、健康有序发展，立足本地资源禀赋和产业优势，找准定位、发挥优势，防止盲目跟风、一哄而上，推动相关产业发展能够行稳致远。下一步，国家发展改革委将聚焦务实管用、落地见效，以具身智能实训场和应用中试基地为抓手，让机器人在真实场景中迭代技术、围绕真实需求形成应用闭环。一方面，统筹布局具身智能实训场，加强数据、模型、标准等要素供给。在数据方面，构建高质量真机数据采集系统，提升具身智能数据供给质量与规模，破解具身智能训练“数据饥渴”问题。在模型方面，依托高质量数据及真实场景，支持具身模型企业开展多技术路线探索，鼓励视觉 — 语言 — 动作模型、世界模型等前沿方向创新，加速技术收敛与应用落地。在标准方面，推动建设具身智能技术标准体系，以统一标准降低模型跨本体适配成本，促进技术共建共享。另一方面，建好用好具身智能方向国家人工智能应用中试基地，加快应用落地和产业规模扩增。在应用落地方面，扩展具身训练场景库，鼓励有关行业企业开放真实场景，支持具身智能企业开展可靠性与安全性测试，加速具身智能在制造、医疗、消费、服务、公共安全等领域的真实场景中落地应用。在产业规模扩增方面，以中试基地为依托，推动整机、配套、场景企业集聚对接，带动中小企业跨越“从样机到量产”的验证门槛，形成各类企业融通发展的良性产业生态。▲ 第二届世界人形机器人运动会大型组 100 米赛", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/995/481.htm", "publishedAt": "2026-08-28T03:04:28+00:00"}, {"title": "蚂蚁百灵推出金融增强模型 Ling-3.0-flash-Fin：API 调用限免一个月，下周开源", "summary": "IT之家 8 月 28 日消息，蚂蚁百灵今日推出金融增强模型 Ling-3.0-flash-Fin，延续 Ling-3.0-flash 的模型架构和长上下文能力，保持 124B 总参数、5.1B 激活参数的配置。Ling-3.0-flash-Fin 模型权重将于下周正式开源。在此基础上，模型通过金融语料持续预训练、领域后训练和工具使用优化，进一步强化对年报、财务工作簿、多份研究材料等复杂金融内容的处理能力，同时兼顾部署效率。官方表示，Ling-3.0-flash-Fin 在蚂蚁集团与中金公司联合打造的 FinFIRST、以及 FinSearchComp Verified、Finance Agent、APEX-Agents、SpreadsheetBench、τ³-Banking 等金融智能体基准上进行了测试，覆盖金融信息检索、投资研究分析、金融长程任务执行、估值建模、银行业务应用等场景。结果显示，与多款通用模型相比，Ling-3.0-flash-Fin 在上述任务中展现出较强竞争力。金融领域能力得到强化的同时，模型在 AA Intelligence Index v4.1.1 上的得分由 38 分提升至 41 分，实现了通用能力与专业能力的协同提升。蚂蚁集团联合中金打造了 FinFIRST（Financial Information Retrieval, Sourcing and Traceability）。该评测基准由 50 余名金融专业人士深度参与设计，从结果、过程和证据三个层面，系统评估答案是否准确完整、研究口径与计算是否合理，以及关键数据与结论能否回溯至权威原始资料。FinFIRST 将于近期开源，为金融搜索研究与评测提供可靠基准。评测结果表明，Ling-3.0-flash-Fin 综合得分已超过一些大尺寸旗舰模型，和同等尺寸模型相比竞争力突出，尤其是擅长优先定位官方、一手及高可信资料。面向金融从业者与开发者，Ling-3.0-flash-Fin 将在 OpenRouter 开启为期一个月的限时免费 API 调用，方便用户在金融研究、数据分析与应用开发等场景中快速体验和验证模型能力。IT之家附 OpenRouter 体验地址：https://openrouter.ai/inclusionai/ling-3.0-flash-fin:free#providers相关阅读：《蚂蚁集团百灵开源 Ling-3.0-flash 模型：124B 总参数、5.1B 激活参数》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/995/464.htm", "publishedAt": "2026-08-28T02:41:40+00:00"}, {"title": "Cerebras 揭秘 CS-6 晶圆级进化：颠覆性 3D 堆叠，首次垂直集成 DRAM", "summary": "IT之家 8 月 28 日消息，科技媒体 Tom's Hardware 昨日（8 月 27 日）发布博文，报道称在 Hot Chips 2026 活动期间，Cerebras 披露最新路线图，宣布将在未来的 CS-6 系统中首次引入晶圆级 3D 堆叠设计。IT之家曾于 8 月 18 日报道，Cerebras 推出其新一代芯片 WSE-3 Turbo 和基于该芯片的 CS-4 系统。与上代 CS-3 相比，CS-4 带来了 10 倍的词元容量和 2 倍的速度，实现 750 PFLOPS（稀疏 FP16）与 129.6PB/s 内存带宽。由于 Cerebras 的晶圆级引擎（WSE）本身已经达到了单个晶圆二维（2D）物理剪裁面积的最大实用极限，业内普遍认为继续在水平方向上扩容面临物理天花板。为此，Cerebras 在全新的 CS-6 规划中正式转向三维（3D）封装解决方案。CS‑6 的关键变化是引入 3D 堆叠 DRAM，将 DRAM 层通过超高带宽垂直互连直接置于逻辑 / SRAM 晶圆之上。官方目标是“把更多模型权重和状态放在更靠近计算的位置”，在保持晶圆级低延迟数据流优势的同时，突破仅靠 SRAM 扩容的瓶颈。Cerebras 表示，CS‑6 的设计可在不破坏数据局部性的前提下提升每系统可承载模型规模，从而减少运行超大模型所需的系统数量。在空间利用率方面，Cerebras 首席执行官 Andrew Feldman 强调，得益于垂直 3D 堆叠对内部组件密度的极端压榨，CS-6 的整机系统足迹（Footprint）将实现 5 到 10 倍的量化递减。在计算密度方面，减少 SRAM 面积占比可以释放出更多空间用于布置核心的算力硬件（Compute Hardware），从而在更小的芯片物理面积内塞入更多的计算逻辑。发布日期方面，Cerebras 在 Hot Chips 2026 明确：CS const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
