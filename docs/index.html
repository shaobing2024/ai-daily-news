const DATA = {"date": "2026-08-01", "generatedAt": "2026-08-01T02:38:58Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "ChatGPT 被柬埔寨诈骗网络利用，OpenAI 出手封禁", "summary": "IT之家 8 月 1 日消息，OpenAI 官方昨日在官网发文称，公司成功打击一起位于柬埔寨的诈骗网络，这些诈骗人士利用 ChatGPT，进行投资、恋爱、赌博诈骗。IT之家从 OpenAI 官方获悉，本起案件发生在今年早些时候，最初由 WhatsApp 方面提供线索。这些诈骗分子采取有组织的团伙模式，灵活采用各种叙事方式、虚假身份和攻击手段，以最大程度地欺骗受害者。据 OpenAI 观察，这些用户还生成了涉及人口贩卖、强迫犯罪活动的内容，与大量公开报道一致。因此官方封禁了一组互相协同的 ChatGPT 账户，这些用户极有可能来自柬埔寨，并在班迭棉吉省的波贝地区活动。同时，该诈骗网络利用 ChatGPT 模型创建虚假身份、翻译诈骗信息、制作诈骗活动的宣传内容，并使用 GPT 起草内部通知、翻译员工交流记录。▲ 诈骗分子生成的招募图片，关键信息已做遮挡处理上述诈骗分子还会使用虚假身份，与受害人建立信任关系，然后引诱受害者参与涉及加密货币或黄金交易的虚假投资项目。虽然诈骗话术有所不同，但该网络中的用户始终表现出相同的欺诈行为模式。目前 OpenAI 已封禁上述用户的 ChatGPT 账号，并向行业合作伙伴共享了相关信息。我们现在还不清楚该网络造成的经济损失，部分诈骗者曾在聊天框中提到，一些受骗者因此损失了数千美元。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/451.htm", "publishedAt": "2026-08-01T02:37:12+00:00"}, {"title": "OpenAI 宣布其 AI 模型触达全球超 10 亿活跃用户和 200 万家企业", "summary": "IT之家 8 月 1 日消息，OpenAI 昨日（7 月 31 日）发布博文，宣布其模型已触达超过 10 亿活跃用户和超过 200 万家企业。博文指出用户注册使用 ChatGPT 六周后，每天发送的消息量增加了约 50%，并且使用 ChatGPT 完成的工作类型也增加了一倍左右。IT之家援引博文介绍，ChatGPT Work 正在改变知识工作者的定义，不再局限于回答问题，通过把“提问”转变为“执行”，能够完成复杂的多步骤工作。该消息发布前，OpenAI 已下调 GPT-5.6 Terra 和 GPT-5.6 Luna 两款模型的调用费用，从而降低企业与开发者使用成本。OpenAI 在博文中指出：“ AI 基建的价值，并不在于其规模，而在于为用户创造各种可能性，我们正在竭力降低客户使用成本，并带来更强大的智能体验，从而惠及更多人群”。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/446.htm", "publishedAt": "2026-08-01T02:15:31+00:00"}, {"title": "KTC 展出“闺蜜机”A25Q5，内置阶跃星辰 Step 系列大模型", "summary": "IT之家 8 月 1 日消息，KTC（康冠）在昨日开幕的 2026 ChinaJoy 上集中展出了多款显示设备，包括与阶跃星辰 (StepFun) 携手带来的移动智慧屏 +Step 系列大模型深度融合方案。这款“闺蜜机”型号 A25Q5，企业官方也将之称为“便携移动屏”。其采用 24.5\" FHD 60Hz 显示面板，将多模态 AI 装进可随处移动的大屏硬件，还接入 StepFun GUI 助手。KTC 亦展出了另一款被称为“豆包大模型 UMAX 版”的“闺蜜机”，该产品则支持 UHD 分辨率（IT之家注：见下图左下角）。KTC 还集中展出了四款“大师”系列电竞显示器，包括 600Hz TN 的 25M1Pro、1000Hz 的 27M2Pro、QHD 320Hz 的 25M3、白色机身 Mini LED 的 25M5。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/429.htm", "publishedAt": "2026-08-01T01:14:45+00:00"}, {"title": "OpenAI 发现更多 AI 智能体“失控”迹象", "summary": "IT之家 8 月 1 日消息，据路透社今日援引知情人士消息，OpenAI 调查 Hugging Face 攻击事件时，发现其他自主 AI 智能体逃离受控环境的案例。目前 OpenAI 正在调查具体案例。其中一名消息人士表示，上述“越狱”行为影响范围有限，现在没有任何迹象表明这些智能体逃离了 OpenAI 网络环境。OpenAI 发言人对此回应称：“我们除了调查 Hugging Face 入侵事件外，还在审查公司其他模型的更广泛活动。”即使上述事件规模有限，但这些智能体的失控行为，可能进一步推动美国政府加强监管人工智能。结合IT之家此前报道，Anthropic 也在最近表示，自家的 Claude 模型曾引发三起不应发生的真实网络安全事件，背后的直接原因是第三方评估环境配置存在失误。AI 安全专家认为，上述案例描绘出令人担忧的局面：一批开发前沿 AI 的实验室，能够制造出威力巨大的危险智能体，并且这些公司自身无法控制这些 AI。消息人士表示，OpenAI 和外部专家正在分析今年以来的日志数据，试图了解攻击事件经过。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/427.htm", "publishedAt": "2026-08-01T01:06:26+00:00"}, {"title": "OpenAI 奥尔特曼推介 Astra 模型：协同 AI 智能体工作，主打长周期任务能力", "summary": "IT之家 8 月 1 日消息，科技媒体 The Information 今天（8 月 1 日）发布博文，报道称 OpenAI 首席执行官萨姆 · 奥尔特曼（Sam Altman）本周在美国国会山展示名为 Astra 的全新 AI 系列模型，重点提升长周期任务处理能力。报道称奥尔特曼于 7 月 29 日本周三会见美国参议员拉斐尔 · 沃诺克（Raphael Warnock）和伯尼 · 莫雷诺（Bernie Moreno），还计划会见参议院情报委员会民主党首席成员马克 · 华纳（Mark Warner）。消息称在本次闭门会见中，奥尔特曼展示名为 Astra 的新 AI 模型，支持智能体（Agent）拆分任务，让多个智能体协同工作，从而解决单个智能体无法处理的复杂问题。IT之家附上相关截图如下：", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/421.htm", "publishedAt": "2026-08-01T00:45:12+00:00"}, {"title": "DeepSeek-V4-Flash 正式版跑分报告：AI 单任务成本比 GPT-5.6 Luna 低约 60%", "summary": "IT之家 8 月 1 日消息，深度求索（DeepSeek）昨日（7 月 31 日）通过 API 文档发布日志，宣布 DeepSeek-V4-Flash 正式版 API 上线公测。@ArtificialAnlys、@arena 等 AI 跑分基准平台今天（8 月 1 日）同步更新了相关基准测试结果。@ArtificialAnlys (Artificial Analysis)@ArtificialAnlys (Artificial Analysis) 是一家领先的国际独立 AI 基准测试与分析机构，专门针对大语言模型（LLM）、视频生成、AI 音乐等多领域进行无偏见的性能与托管成本评估。其中，Artificial Analysis Intelligence Index（智能指数）是最核心的综合性技术基准，用来全面衡量 AI 模型的绝对智能水平并追踪技术演进。报告指出 DeepSeek V4 Flash 0731 在人工智能分析智能指数 (AII) 中获得 50 分，比 DeepSeek V4 Flash（2026 年 4 月发布）高出 10 分，比 DeepSeek V4 Pro 高出 6 分。DeepSeek V4 Flash 0731 的智能指数比 GPT-5.6 Luna（最高 51 分）低 1 分。即使 OpenAI 今天将 GPT-5.6 Luna 的价格下调了 80%，DeepSeek V4 Flash 0731 在其自有 API 上的单任务成本仍然比 GPT-5.6 Luna（最高 51 分）低约 60%。造成这一差异的关键因素是 DeepSeek 为其自有 API 提供了约 98% 的缓存命中折扣，这一折扣力度远超业内大多数厂商提供的 90% 缓存命中折扣。@arena (Arena.ai)@arena (Arena.ai) 是当前全球 AI 行业最权威的“人类偏好”大模型即时对战与评测平台。它源自著名的 LMSYS Chatbot Arena 团队，采用类似国际象棋的 Elo 积分系统，通过纯粹的人类开发者双盲盲测（Blind A/B Testing）来对全球 AI 模型进行高强度的淘汰赛排名。在其细分榜单中，Frontend Code Arena（前端代码竞技场，又称 WebDev Arena）是目前评估大模型网页开发、前端工程与 Agent 级自动化编码能力的黄金标准与行业风向标。报告称 DeepSeek-V4-Flash-High 以 1586 分的成绩重塑了 Frontend Code Arena 跑分榜单。每个 MToken 的价格为 0.14 美元（IT之家注：现汇率约合 0.95 元人民币）/0.28 美元（现汇率约合 1.9 元人民币），是同类产品中性价比最高的。在前端代码领域，它的总排名为第 7，开放类别的排名第 3！在各个类别中，它在消费产品领域排名第 4，在基于参考的设计、数据与分析、游戏领域排名第 6，在品牌与营销领域排名第 7。与 DeepSeek-V4-Flash-High-Preview 相比，这是一个显著的提升，性能提高了 154 分。而与 DeepSeek-V4-Pro-Preview 相比，提升幅度更大，达到了 121 分。和其它模型对比IT之家查询 X 平台，发现有不少开发者分享了使用 DeepSeek-V4-Flash 正式版的对比视频：DeepSeek-V4-Flash 和 GPT-5.6 Luna 模型的视频对比DeepSeek-V4-Flash 和 GPT-5.6 Luna 模型的视频对比DeepSeek-V4-Flash 和 GPT-5.6 Luna 模型的视频对比DeepSeek-V4-Flash 和 Kimi K3 模型的视频对比", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/417.htm", "publishedAt": "2026-08-01T00:28:49+00:00"}, {"title": "能无限制生成“灾难”图片，谷歌地球 AI 生图功能上线不到一天就下架", "summary": "IT之家 8 月 1 日消息，谷歌为 Google Earth（谷歌地球）加入 AI 图像编辑功能后，不到 24 小时便紧急下线。这一功能调用 Gemini 旗下 Nano Banana 2 图像模型，用户只需输入文字指令，便可修改谷歌地球中的地点影像。该功能上线后很快遭到滥用。AI 研究人员亨克 · 范埃斯制作了多张几可乱真的虚假卫星图像，从美墨边境的难民营到位于伊朗的核电站，都能输出结果。随后，谷歌发言人 31 日在 X 平台发布声明称：“地理空间领域的专业人员利用这项功能完成了不少实用工作，但也有人分享生成图像的截图，部分内容似乎违反了我们的政策。因此，在建立更严格的安全防护措施期间，我们将从 Google Earth 中撤下该功能。”谷歌强调，所有 AI 生成图像都带有水印，也没有进入公众能够查看的 Google Earth 地图内容。近期仓促推出 AI 功能，随后又迅速撤回的企业并不只有谷歌。据IT之家了解，Meta 于 7 月 7 日上线 Muse Image，允许用户调用成年用户公开 Instagram 账号中的图片生成 AI 图像，除非账号所有者已经主动关闭权限。功能推出不到一周，Meta 便将其撤下，并承认此次尝试“没有把握好分寸”。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/415.htm", "publishedAt": "2026-08-01T00:14:40+00:00"}, {"title": "2026 年 7 月全球桌面浏览器排行：谷歌 Chrome 70.58%、微软 Edge 11.15%、火狐 Firefox 6.51%", "summary": "IT之家 8 月 1 日消息，根据市场调查机构 Statcounter 公布的最新报告，2026 年 7 月全球桌面浏览器市场中，Chrome 依然稳居第一，占比 70.58%，Edge 以 11.15% 的份额占据第二，Firefox 以 6.51% 位居第三。全球桌面平台Chrome 占比 70.58%，环比下降 1.48 个百分点Edge 占比 11.15%，环比上升 0.66 个百分点Firefox 占比 6.51%，环比上升 0.07 个百分点Safari 占比 5.66%，Opera 占比 2.0%，Samsung Internet 占比 1.59%，Brave 占比 0.91%，360 Safe Browser 占比 0.52%从长期趋势来看，Chrome 在全球桌面浏览器市场始终占据着绝对领先地位，但近几个月来份额呈现波动下降趋势。Edge 则保持着稳步增长的态势，份额从年初的 9.11% 逐步上升至当前的 11.15% ，持续对市场格局进行微调。Firefox 和 Safari 分列第三、第四位，两者份额差距较小，竞争较为激烈，整体保持相对稳定的状态。中国桌面平台Chrome 占比 48.16%，环比下降 12.77 个百分点Edge 占比 28.81%，环比上升 6.18 个百分点360 Safe Browser 占比 10.08%，环比上升 3.37 个百分点Firefox 占比 4.65%，QQ Browser 占比 3.46%，Safari 占比 3.13%，Sogou Explorer 占比 1.04%在中国桌面浏览器市场，格局与全球市场存在明显差异。虽然 Chrome 依然位居榜首，但相较于全球市场的超高份额，占比已经大幅降低。Edge 紧随其后，份额接近 30% ，本土浏览器 360 Safe Browser 也占据了超过 10% 的份额。本月数据波动较大，Chrome 份额出现明显下滑，Edge 和 360 Safe Browser 份额均有不同程度上升。全球手机平台Chrome 占比 66.79%，环比下降 1.12 个百分点Safari 占比 25.44%，环比上升 1.31 个百分点Samsung Internet 占比 2.48%，环比上升 0.02 个百分点Opera 占比 1.8%，UC Browser 占比 1.25%，Firefox 占比 0.67%，Edge 占比 0.39%在全球手机浏览器市场中，Chrome 和 Safari 垄断了超过 90% 的市场份额，Chrome 以超过六成的份额遥遥领先。Safari 受益于苹果设备的出货，保持着四分之一左右的稳定份额，本月略有回升。其他浏览器合计份额不足 10% ，整体市场格局高度集中，近年来没有出现大的变动。中国手机平台Chrome 占比 56.13%，环比上升 3.57 个百分点Safari 占比 24.28%，环比基本持平UC Browser 占比 9.61%，环比上升 0.77 个百分点Edge 占比 4.57%，QQ Browser 占比 3.99%，Android 占比 0.49%，Samsung Internet 占比 0.38%中国手机浏览器市场同样呈现出头部集中的特点，但本土浏览器 UC Browser 依然占据了接近 10% 的份额，表现亮眼。Chrome 本月份额回升明显，Safari 保持稳定，Edge 和 QQ Browser 也占据了一定的市场份额，竞争格局相对稳定。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/401.htm", "publishedAt": "2026-07-31T16:02:07+00:00"}, {"title": "高德：联合哈啰、海思和开源鸿蒙，推出共享两轮行业首个 AI 原生导航方案", "summary": "IT之家 7 月 31 日消息，高德开放平台宣布，联合哈啰骑行、上海海思、开源鸿蒙，共同推出共享两轮行业首个 AI 原生导航方案，并率先落地内蒙古包头。据介绍，高德开放平台推出专为共享电助力车打造的 RTOS 版本轻量化车机导航方案，让车辆无需依赖外置手机支架，即可具备原生、轻量、稳定的车载导航体验。全新哈啰领航者智能电助力车的 5 英寸屏幕内置高德 RTOS 版完整导航能力，支持离线地图下载、路线规划、全域 POI 检索等功能；同时搭配上海海思谛听模组集成的 GNSS 高精定位与端侧 AI 算力，进一步提升定位精度。官方表示，即使在无网络环境下，用户也能获得稳定、安全的骑行导航指引。IT之家获悉，车辆行进途中，屏幕可提前推送合规停车区域提示，引导用户规范停放，规避违停产生的额外调度成本。此外，车辆工况、实时导航、骑行时长等核心数据也可通过屏幕展示，无需多界面切换。依托 OpenHarmony 系统底座与永久在线能力，整车支持 OTA 远程迭代升级，AI 语音操控、车载应用市场等全新功能将会陆续推出。基于 OpenHarmony 系统，哈啰领航者打通手机、手表与车辆之间的生态壁垒，可实现“碰一碰”秒级开锁，未来还可联动智能手环、头盔等设备，实现更多元的互联互通。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/389.htm", "publishedAt": "2026-07-31T14:05:44+00:00"}, {"title": "德国法院裁定 AI 音乐生成公司 Suno 侵犯版权，需支付赔偿金", "summary": "IT之家 7 月 31 日消息，据路透社报道，德国慕尼黑地方法院周五作出裁决，认定 AI 音乐初创公司 Suno 构成版权侵权，并责令其披露非法获利。法院指出，Suno 无权处理由德国国家授权的音乐版权管理机构 Gema 所代表的艺术家作品。根据判决结果，Suno 必须支付赔偿金，具体数额目前尚待进一步核算。不过该判决仍可向上一级法院提起上诉。Gema 首席执行官托比亚斯 · 霍尔兹米勒（Tobias Holzmueller）表示，“这是一份具有全球深远意义的裁决。”此前，Gema 针对 Suno 在 YouTube 上无偿使用多位艺术家音乐作品的行为发起了诉讼。Suno 则回应称并不认同该裁决，并将评估包括提起上诉在内的所有法律途径。Suno 在今年 6 月的融资金额中估值已达 54 亿美元（IT之家注：现汇率约合 365.35 亿元人民币）。在多起涉及生成式人工智能的诉讼中，AI 音乐公司普遍被指控未向作曲者支付合理报酬。目前已有超过 1800 名艺术家联署，支持对 Suno 及其同行 Udio 提起集体诉讼。相关阅读：《深陷版权诉讼仍受资本热捧，AI 音乐生成公司 Suno 再融资 4 亿美元》《不再存在版权争议，华纳与 AI 音乐生成平台 Suno 达成和解并签约》《Suno 承认使用版权音乐训练 AI 模型，“取经”学习不算侵权》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/382.htm", "publishedAt": "2026-07-31T13:28:28+00:00"}, {"title": "实测 DeepSeek V4 正式版：3 块钱干完 5 件事，AI「智价比」之战开打了", "summary": "顶级模型的竞争，正在从单纯比拼能力上限，转向同时争夺「智价比」。#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1673553?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-07-31T11:50:59+00:00"}, {"title": "OpenAI 宣布 GPT-5.6 Luna 价格下降 80%", "summary": "OpenAI 宣布 GPT-5.6 Luna 价格下降 80%。输入从每百万 token 1 美元砍到 0.2 美元，输出从 6 美元砍到 1.2 美元。GPT-5.6 Terra 降 20%。旗舰 Sol 没降，但加了一个 Fast 模式——2.5 倍速度，2 倍价格，智商不变。 降价的理由不是市场竞争，不是清库存，是 Sol 自己把自己优化了。 这事分两步。第一步，OpenAI 把 GPT-...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/484069", "publishedAt": "2026-07-31T11:35:09+00:00"}, {"title": "让团队记忆在共建中完善： TencentDB Agent Memory 的开源之路 | 腾讯云数据库 DBTalk", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/video/ylsc5EZdSya6DbkWwgdU?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-31T10:00:00+00:00"}, {"title": "SIGGRAPH时间检验奖揭晓：这项研究，提前十年押中了物理AI", "summary": "开源项目GitHub狂揽8000+Star", "so eName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/spxwy17ZcfM3BIctR4PL?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-31T18:39:45+00:00"}, {"title": "微软更新多个通道 Win11 预览版：优化自适应休眠、新增紧凑任务栏、可调任务栏位置", "summary": "IT之家 8 月 1 日消息，微软昨天（7 月 31 日）发布博文，邀请 Experimental 和 Beta 频道的 Windows Insider 项目成员，测试适用于 Windows 11 的多个预览版更新，具体版本如下：Beta 通道： Build 26220.9022 （ 25H2 ）、 Build 28020.2623 （ 26H1 ）Experimental 通道： Build 26300.9032 （ 26H2 ）、 Build 28120.2630 （ 26H1 ）、 Build 29639.1000 （未来平台）IT之家附 Windows 11 改进进展如下：1、更新安全证书：本次所有新版本均刷新了安全证书（ Experimental 未来平台版本此前已完成更新）。微软定期更新 Windows Insider 预览版使用的证书，从而确保 Insider 设备保持在受支持的版本并持续获取未来预览更新；当前证书将于 2026 年 8 月 11 日到期，因此用户需要在该日期之前更新至包含更新后证书的版本。2、优化自适应休眠策略（仅 Experimental ）：本次更新调整了自适应休眠策略，以增加现代待机模式下快速恢复开机的场景，并在低电量状态下更好地保留电池电量。显著变化包括：电池电量高于 80% 时减少休眠，电池电量低于 10% 时提前进入休眠。3、支持调整任务栏位置（Beta 频道新增）：用户现在可以在屏幕上更改任务栏的位置，进入设置 &gt; 个性化 &gt; 任务栏 &gt; 任务栏行为，即可选择任务栏显示在屏幕的底部、顶部、左侧或右侧。在这些其他位置，工具提示、弹出窗口和动画仍会从任务栏发出，大多数自定义设置（如从不合并任务栏图标）在所有位置都可以正常工作。目前替代位置的触摸手势、搜索框和 Copilot 询问支持仍在开发中；自动隐藏任务栏和触摸优化任务栏目前暂不支持；更小任务栏目前仅支持顶部和底部位置。4、新增更小尺寸任务栏（ Experimental 、 Beta ）：微软为希望最大化屏幕空间的用户（尤其是小尺寸设备）引入了更小尺寸任务栏。默认任务栏保持不变，该选项提供更紧凑的体验，包含更小图标和更矮任务栏高度，为应用留出更多屏幕空间。开始菜单、搜索和系统托盘等核心元素会适当缩放，保持对齐和一致性。若要更改任务栏大小，进入设置 &gt; 个性化 &gt; 任务栏 &gt; 任务栏行为 &gt; 任务栏大小，选择“小”后，图标和任务栏高度都会缩小。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/402.htm", "publishedAt": "2026-07-31T17:02:46+00:00"}, {"title": "GitHub AI Agent 翻车：攻击者不用黑客技术，只写一句话就能窃取数据", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/u4rDqep8zVWUJsqVoQ23?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-31T12:00:00+00:00"}, {"title": "米哈游蔡浩宇AI创业生变", "summary": "多个项目暂停，九成资源押向Agent", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/464169.html", "publishedAt": "2026-07-31T07:22:37+00:00"}, {"title": "微软确认开发 Copilot AI 超级应用，整合聊天、编程与智能代理能力", "summary": "微软正在开发一款整合Copilot聊天、编码助手和智能代理能力的AI“超级应用”，微软首席执行官萨蒂亚·纳德拉在最新财报电话会议中确认，该应用计划于今年推出，并覆盖消费者 元。据知情人士透露，利奥波德已被迫将所有 SK 海力士、CoreWeave 等杠杆股票仓位出售给 Citadel 的肯 · 格里芬，基金持仓规模缩水至 100 亿美元。利奥波德的快速崛起和轰然陨落，吸引华尔街和科技圈人士大量关注，他也成为 AI 热潮中最瞩目的失败案例。一些批评者指出，利奥波德于 2024 年 7 月成立基金之前，没有任何管理资金方面的经验。他曾在职业生涯早期加入已经倒闭的加密货币交易所 FTX，并帮助如今声名狼藉的山姆 · 班克曼-弗里德，在巴哈马顶层豪宅运营慈善项目。与此同时，一些交易员、投行人士指出，“全态感知”使用高达 400% 的杠杆，因此崩盘并不意外。华尔街投资培训公司负责人 Jerry Diao 表示：“很多人认为这场爆仓只是时间问题。也许他对 AI 长期趋势的判断是对的，但在公开市场投资中，你必须做好应对短期波动的准备。”颇具戏剧性的是，利奥波德已经和 AnthropicCEO 达里奥的幕僚长阿维塔尔 · 巴尔维特（Avital Balwit）订婚，并计划本周末举行婚礼。利奥波德出生于德国，父母都是医生。他从小就在数学和计算机方面展现出极高天赋，并多次跳级、15 岁高中毕业。进入哥伦比亚大学后，他因一篇名为《Existential Risk and Growth》（生存风险与增长）的学术论文受到关注。据他的同学描述，利奥波德是一个有些孩子气的人，并在社交方面显得比较笨拙。2021 年毕业后，他加入了 FTX 旗下慈善机构 Future Fund 工作。2023 年，他加入 OpenAI 超级对齐团队，并在伊尔亚 · 苏茨克维领导下，研究如何让 AI 系统符合人类利益。在一次黑客入侵 OpenAI 内部系统后，他向董事会提交了一份备忘录，警告公司的安全措施不足以抵御外国间谍活动。2024 年，OpenAI 将他解雇，理由是不当分享机密信息。离开 OpenAI 几周后，利奥波德发布了一篇论文，认为通用人工智能（AGI）可能在几年内到来、各国政府严重低估了 AI 发展速度。2024 年 7 月，他开始为自己的对冲基金募集种子基金，此前曾有传闻称，他获得了 2.5 亿美元（现汇率约合 16.91 亿元人民币）投资。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/420.htm", "publishedAt": "2026-08-01T00:41:10+00:00"}, {"title": "自构建智能体：一项 LangChain4j 实验", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/QSMNwS8RolhIE9sA2MbE?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-31T15:41:00+00:00"}, {"title": "姚顺雨拿50年数学难题成绩单，招人了", "summary": "AI for Science方向", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/464100.html", "publishedAt": "2026-07-31T06:54:57+00:00"}, {"title": "317 家 AI 独角兽，超过一半从来没发过论文", "summary": "一项新的分析用数据证实了我们许多人长期以来的感受：AI 领域最引人注目的实验室基本上已经停止发表他们的研究成果。 斯坦福“元科学”（metascientist）研究者 John Ioannidis 把 317 家 AI 独角兽的发表记录翻了一遍。结论一句话就能说完：超过一半的公司，从来没有在任何一篇学术论文里担任过第一作者或通讯作者。 根...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/482959/ai-s-top-startups-are-barely-publishing-their-research", "publishedAt": "2026-07-30T06:13:13+00:00"}, {"title": "一个 AI Agent，四天半攻陷 Hugging Face，动机是考试作弊", "summary": "一个 AI 代理花了四天半，自主完成了一场从沙箱逃逸到集群管理员的“对冲基金”级别入侵。目标不是钱，而是考试答 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
