术能力、家庭场景应用及产业链协同等方向展开合作，共同打造行业全新一代全自动家庭 AI 烹饪机器人。官方表示，全新一代全自动家庭 AI 烹饪机器人，从自动投放调料、食材到智能翻炒，全程免动手。新品搭载海尔自研 AI 之眼科技，可精准识别主流品牌净菜，省去用户洗菜、切菜等繁琐前置步骤，智能匹配适配菜谱。据介绍，机器人搭载 AI 烹饪大模型，宣称可完美复刻大厨级技艺：精控火候、精准调味、翻炒模仿，还原地道锅气。同时，菜谱体系覆盖美容养颜、健脾养胃、低脂瘦身等六大功效分类，适配老人、孩童、健身人群等八大不同家庭成员的饮食需求。IT之家获悉，双方合作成果将于 8 月在北京 WRC 上正式亮相。此外，橡鹿机器人自主研发的多模态烹饪 AI 基座和具身烹饪机器人现炒方舟也将于 8 月在北京 WRC 正式发布。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/323.htm", "publishedAt": "2026-07-29T13:27:11+00:00"}, {"title": "谷歌旗下 Wiz 公布漏洞挖掘系统 Atlas：利用多个 AI 智能体分工协作、已发现超 200 个漏洞", "summary": "IT之家 7 月 29 日消息，谷歌旗下网络安全部门 Wiz 发文，宣布推出一款能够自主寻找漏洞的 AI 智能体漏洞挖掘系统 Atlas，目前 Atlas 已发现超过 200 个安全漏洞，同时斩获了 GitHub 10 万美元（IT之家注：现汇率约合 67.8 万元人民币）漏洞发现奖金。据介绍，Atlas 由多个 AI 智能体（AI Agent）组成，每个智能体负责不同任务，整体运作方式类似人类安全研究团队。不同代理分别负责理解代码库、提出漏洞假设、相互验证与质疑，并最终完成漏洞确认和报告。与传统单一 AI 模型从头到尾执行任务不同，Atlas 采用多阶段任务拆分以及程序化协作方式完成漏洞挖掘。其首先会针对目标软件代码库建立威胁模型，并利用代码属性图（Code Property Graph）分析程序结构，寻找潜在攻击路径。之后，系统中的多个 AI 智能体会分别提出漏洞假设并进行验证，生成可能存在的多步骤复合型漏洞候选方案，并将候选漏洞交由三个分别担任“支持论证”“反驳分析”和“最终裁决”角色的智能体，只有通过验证的漏洞才会被保留下来。最后，Atlas 会自动建立专用测试环境，安装所需依赖组件，并执行攻击输入以触发漏洞，从而验证漏洞是否真实存在。为了降低运行成本，Atlas 采用了更加精细的 AI 任务分配策略。例如在需要高推理能力的环节，例如复杂漏洞利用链分析以及最终漏洞裁决阶段，系统才会调用能力更强的大型模型。而对于代码属性图分析、初步漏洞筛选等范围明确且重复性较高的任务，则交由成本更低的小型模型处理。此外，Atlas 还结合确定性代码分析技术进行高效率引导，通过对抗式审核机制提前过滤误判，并利用专门为漏洞研究设计的执行框架（Harness）进行验证，以进一步降低系统运行成本。Wiz 表示，这种设计让 Atlas 能够以较低成本进行大规模深度代码分析，同时系统会针对每个发现的漏洞自动生成攻击验证程序，降低误报可能性。根据 Wiz 引用的 AI 漏洞研究基准测试 CyberGym 结果，Atlas 取得 90.9% 的成绩，超过 GPT-5.5-Cyber、Claude 4.6 以及 Claude Mythos Preview 等竞争模型。在实际应用方面，Wiz 表示，Atlas 经过数个月开发后，已经在多个知名开源项目中发现并验证超过 200 个此前未知漏洞。还帮助 GitHub 发现了一项重大远程代码执行漏洞 CVE-2026-3854，因此获得 10 万美元（现汇率约合 67.8 万元人民币）奖金。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/319.htm", "publishedAt": "2026-07-29T13:14:11+00:00"}, {"title": "荣耀 Robot Phone 手机影像亮点汇总：双两亿摄像头，全链路融入阿莱色彩科学工作流", "summary": "IT之家 7 月 29 日消息，荣耀手机官方今日汇总了荣耀影像技术发布会的核心亮点。据介绍，荣耀 Robot Phone 配备双两亿摄像头、首款自研影像芯片、行业首个钛合金云台、行业最全运镜和跟随模式、行业领先防抖和智能跟随算法，同时还全链路融入阿莱色彩科学工作流。参考IT之家昨日报道，该机也是荣耀与阿莱达成战略合作后的首款落地产品，首次将阿莱 Log-C 编码和 应当坚持正确政治方向、舆论导向和价值取向，不得损害国家尊严和利益、妨碍社会安定和公共秩序，不得歪曲历史事实、伤害民族感情，不得借重大政治议题、重大历史事件、重大自然灾害、重大舆情等开展商业营销炒作，不得宣扬错误观念和不良文化。重点三：规范特定户外广告发布根据本市有关规定，《合规指引》进一步明确不得在户外发布特定医疗广告，以及涉及性生理卫生、性功能改善或增强、殡葬用品或者服务等广告；不得发布存在过度暴露人体、表现形式易引发公众不适，以及主要针对人体私密部位的商品或者服务广告。重点四：防范广告引发社会争议针对容易引发社会争议的广告内容，《合规指引》提出不得滥用地域标签制造群体对立，不得利用性别标签实施低俗营销，不得通过贩卖容貌焦虑、制造两性对立等方式博取关注，不得利用情绪营销渲染社会焦虑，不得违规发布“饭圈”应援广告。重点五：防范广告误导消费者针对“大字吸睛、小字免责”等问题，《合规指引》要求提示性用语真实、清晰、显著，重要交易条件和限制性信息应当完整准确提示；规范使用“第一”“首创”“最佳”“领先”等用语及广告引证内容，不得实施“萝卜坑式引证”；使用人工智能生成合成内容开展广告宣传的，应当依法履行标识义务。重点六：规范明星广告代言活动明星广告代言应当遵循公序良俗，坚持正确价值导向并依法履行社会责任。《合规指引》进一步明确不得从事的违法违规广告代言行为，要求企业谨慎选用广告代言人，不得选用违法失德明星以及其他依法不得担任广告代言人的人员，切实防范广告代言风险。重点七：保护未成年人和居民生活环境针对住宅小区电梯轿厢、电梯等候区等场景，《合规指引》要求加强广告内容和播放时段管理，减少不适宜未成年人接触的广告发布；合理控制播放频率、单次时长、内容切换节奏以及音量、亮度等，避免高频循环、长时间连续播放以及噪声扰民、光污染等问题，住宅电梯夜间时段原则上不得播放有声广告。重点八：压实广告活动主体责任广告主、广告经营者、广告发布者及户外广告设施经营主体应当严格落实广告内容审核责任，建立健全广告业务承接登记、内容审核、档案管理等制度，依法履行广告审核义务，加强内容审核、播出管理和风险防控，不得为违法违规广告提供设计、制作、代理、发布等服务。下一步，上海市场监管部门将结合户外广告导向问题专项治理，加强重点内容、重点区域、重点时段监管，强化普法宣传和合规指导，督促广告活动主体落实内容审核责任，不断提升户外广告规范化、精细化治理水平。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/333.htm", "publishedAt": "2026-07-29T14:22:55+00:00"}, {"title": "高通：成为宝马集团未来十年数字座舱与驾驶辅助系统的主要计算芯片提供商", "summary": "IT之家 7 月 29 日消息，高通技术公司与宝马集团宣布达成一项重要合作协议。根据协议，高通技术公司将在未来十年为宝马集团下一代数字座舱，以及先进驾驶辅助系统 / 自动驾驶（ADAS / AD）提供计算芯片。此次合作涵盖高通技术公司的骁龙数字底盘多项解决方案，包括其性能最强大的系统级芯片（SoC）—— 骁龙汽车平台至尊版，以及专用 AI 加速器。IT之家获悉，双方最新的合作成果是 2025 年 11 月 Snapdragon Ride Pilot（辅助驾驶系统）在 BMW iX3 成功量产，这也是宝马集团新世代（Neue Klasse）的首款车型。相关阅读：《可双手离开方向盘：宝马与高通合作研发骁龙 Ride Pilot 辅助驾驶》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/330.htm", "publishedAt": "2026-07-29T14:04:12+00:00"}, {"title": "支付宝升级“AI 支付开发者激励计划”，号称“最高提供 5660 元词元专项补贴”", "summary": "IT之家 7 月 29 日消息，支付宝发文，宣布升级“AI 支付开发者激励计划”，为 AI 开发者提供最高 5660 元的 Token（词元）专项补贴，同时扩展激励享受范围，降低开发者的参与门槛。官方表示，即日起至 8 月 21 日，开发者完成报名并接入“AI 按量付费”“AI 网页应用收款”或“AI 移动应用收款”后，可按照累计有效交易用户数解锁五档奖励，最高累计可获得价值 5660 元的阿里云 Token 资源包（词元）：AI 网页应用收款：适配电脑网站与手机网页场景的收款能力，开发者可通过 Skill 一行命令快速接入，流程更极简、集成更轻量，同时支持个人收款。AI 移动应用收款：面向 iOS、安卓、HarmonyOS 等移动端应用，开发者通过 Skill 一行命令可快速接入收款能力，适用于电商购物、会员充值、在线订票、本地生活、数字内容购买等 App 内消费场景。AI 按量付费：可让开发者的 API、数字内容或算力资源，能够直接向访问它们的 AI 智能体发起自动收款，告别低效率的月费订阅，实现按调用计量精准计费和结算。具体来看，累计有效交易用户达到 10 人，可以解锁 10 元阿里云 Token 资源包。达到 100 人、1000 人和 5000 人，分别解锁 50 元、100 元和 500 元。达到 5 万人后，再解锁 5000 元。五档依次叠加，最高累计 5660 元，达到对应档位后第 7 天解锁。当然，相应奖励明显集中在最高档。前四档全部完成，开发者累计只能获得 660 元资源包，5 万名有效交易用户对应的 5000 元占全部奖励的大部分。支付宝同时表示，个人开发者使用支付宝“AI 按量付费”，还能享受 0 费率优惠至 2026 年 12 月 31 日。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/310.htm", "publishedAt": "2026-07-29T12:47:43+00:00"}, {"title": "马斯克旗下 SpaceXAI 起诉明尼苏达州，反对“AI 脱衣”应用禁令", "summary": "IT之家 7 月 29 日消息，埃隆 · 马斯克旗下的 xAI（如今已更名为 SpaceXAI）强烈反对明尼苏达州一项禁止“脱衣”应用（nudify apps）的法律，甚至因此起诉了该州总检察长。明尼苏达州这项将于本周六生效的法律，将严惩允许用户生成未经他人同意的色情化图像的应用和网站。相关服务背后的公司，每当有人生成此类图像时，都将面临 5 万美元（IT之家注：现汇率约合 33.9 万元人民币）罚款。xAI 在诉状中表示，该法律是一项“范围过度、基于内容限制的言论自由禁令”，同时也限制了视觉表达工具，是为了“笨拙地禁止 AI 脱衣功能”而制定的措施。该公司律师称，除了侵犯言论自由外，该法律规定的罚款金额也过高。xAI 举例称，如果一家企业的用户生成了 10 万张此类图像，那么该企业可能面临高达 500 亿美元（现汇率约合 3389.24 亿元人民币）的罚款。xAI 强调，公司并不反对明尼苏达州“禁止未经本人同意传播真实人物 AI 生成的裸体图像”的立法目标，但认为该法律“远远超出了这一目标，将大量受法律保护的言论内容置于民事责任和政府处罚之下”。考虑到 xAI 过去在类似问题上的表现，这场诉讼并不令人意外。今年年初，该公司的聊天机器人 Grok 就曾因大量生成“脱衣”深度伪造图像而引发广泛关注，其中包括未成年人的相关图像。目前，xAI 仍面临受害者提出的集体诉讼。该诉讼同样指控 xAI 未向执法机构提供有关涉嫌利用 Grok 制作受害者裸露图像人员的信息。此外，xAI 也因相关功能在英国和欧盟面临调查。xAI 在诉状中表示，公司严格禁止用户在未经本人同意的情况下生成他人的裸体或色情化图像，并称已经针对绕过其多重技术限制、试图生成此类内容的用户提起诉讼。最近，xAI 就曾起诉一名南卡罗来纳州用户，指控其利用 Grok 制作成年人和未成年人的私密图像。xAI 表示，如果该法律以目前的形式生效，公司将不得不对 Grok Imagine 的图像编辑功能进行多方面限制。xAI 进一步称，“在法律生效前可以自由获得的受保护言论内容，将因此受到限制和压制”。该公司请求法院宣布这项法律违宪，并阻止州政府执行该法律。针对这起诉讼，明尼苏达州总检察长基思 · 埃里森（Keith Ellison）回应称：“利用人工智能违背他人意愿生成其裸照的行为令人发指。关于 AI，有很多值得讨论的问题。但这不是其中之一。AI 脱衣功能剥夺了目标人物的尊严，并可能在多个层面对他们造成巨大伤害。”他表示，自己将在法庭上与 xAI 交锋。明尼苏达州州长蒂姆 · 沃尔兹（Tim Walz）的回应则更加直接，他用类似电影《机械战警》（RoboCop）的台词风格表示：“法庭见，混蛋。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/298.htm", "publishedAt": "2026-07-29T12:12:21+00:00"}, {"title": "Microsoft 365 引入 Copilot 后涨价，英国对微软是否误导消费者展开调查", "summary": "IT之家 7 月 29 日消息，英国竞争与市场管理局（CMA）表示，已对微软展开调查，原因是该机构担心微软在调整 Microsoft 365 Personal 和 Family 订阅计划时，可能没有提前向用户清楚说明可选方案，其中包括新增 Copilot 等功能。此次调查针对微软对 Microsoft 365 Personal 和 Family 计划所做的调整。这些订阅服务为英国用户提供 Word、Excel、PowerPoint、Outlook 以及 Copilot 等功能，用户可以选择按月或按年购买。从 2025 年 1 月开始，微软自动向现有用户提供包括 Copilot 在内的新功能，且在用户当前订阅周期剩余时间内无需额外付费。当订阅周期结束后，除非用户主动选择其他方案或取消订阅，否则系统会自动将用户转入包含新增功能的新计划，而该计划价格更高。与此同时，微软也停止向新用户提供不包含这些新功能的 Personal 和 Family 订阅计划。对于已经使用 Personal 和 Family 计划的老用户，微软推出了一个限时切换选项，允许用户转为“Classic”（经典版）计划。Classic 计划保留了用户此前使用的功能，并维持原有价格。对于按年订阅 Microsoft 365 Personal 和 Family 计划的用户来说，新计划的价格比对应的 Classic 版本每年高出 25 英镑（IT之家注：现汇率约合 225 元人民币）。CMA 正在调查微软在订阅续费前向用户发送的信息是否具有误导性。调查将重点审查微软是否向用户提供了足够关键信息，包括不同订阅方案之间的区别以及价格差异，以帮助用户在做出决定前充分了解可选择的方案。目前，CMA 尚未认定微软是否违反法律。CMA 表示，其高度支持人工智能技术的普及，并认可 AI 为英国民众生活带来的潜在益处，但同时强调，任何消费者都不应受到不公平对待。此外，消费者必须获得清晰的信息，以便比较不同产品，并选择最适合自己的 AI 服务。CMA 消费者保护部门高级负责人海莉 · 弗莱彻（Hayley Fletcher）表示：“英国各地的人们都依赖 Microsoft 365，无论是用于学习、发送电子邮件，还是管理家庭财务。在家庭预算压力不断增加的时期，消费者了解不同订阅方案的价格和可选内容非常重要，这样他们才能找到最适合自己的方案。当企业调整订阅计划时，消费者需要及时获得清晰的信息，了解自己有哪些选择。我们的调查将评估微软用户是否受到误导，并因此支付了更高费用。随着越来越多的人依赖 Copilot 等 AI 工具，确保每个人都能通过公平、透明的方式使用这些服务非常重要。同时，消费者也应该清楚了解自己何时有机会进行比较，并选择希望使用的产品。”自 2025 年 4 月起，CMA 获得了直接执行消费者保护法规的权力，可以自行判断企业是否违反消费者法律，而无需通过法院程序。截至目前，CMA 已利用新权限为消费者追回超过 195 万英镑（现汇率约合 1755.1 万元人民币）退款，并处以接近 620 万英镑（现汇率约合 5580.5 万元人民币）的罚款。此外，澳大利亚竞争与消费者委员会（ACCC）和意大利竞争管理机构也正在分别调查微软相关实体，调查重点同样涉及微软在订阅续费时向用户提供的信息是否充分。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/268.htm", "publishedAt": "2026-07-29T10:55:06+00:00"}, {"title": "超越OpenAI、Anthropic！国产AI安全智能体杀进全球前四、国内第一", "summary": "AI开始组团“挖漏洞”", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/462447.html", "publishedAt": "2026-07-29T08:13:03+00:00"}, {"title": "Apple 操作系统安全更新公告出现一串 AI 名字", "summary": "Apple 昨天推送了一批安全更新，iOS 26.6、macOS Tahoe 26.6、macOS Sequoia 15.7.8、macOS Sonoma 14.8.8、tvOS 26.6、watchOS 26.6、visionOS 26.6 全线上新。安全公告一共列了 155 个 CVE，单次更新数量的新纪录。 但最值得注意的不是数量。 漏洞致谢名单里出现了一串 AI 的名字。Claude。OpenAI Codex Security。Z.A...", "sourceName": "开源中 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
