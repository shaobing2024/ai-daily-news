const DATA = {"date": "2026-10-05", "generatedAt": "2026-10-05T01:32:31Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "软银集团孙正义罕见发出 AI 安全警告，呼吁各国携手应对威胁", "summary": "IT之家 10 月 5 日消息，据彭博社报道，软银集团创始人孙正义一直被视为人工智能最坚定的拥护者之一。然而他近日坦言，随着 AI 能力的突飞猛进，就连他也对伴随而来的安全风险深感担忧。周日，在日本京都举行的“科学与技术在社会中的作用”论坛期间，孙正义在与白宫科技政策顾问迈克尔 · 克拉齐奥斯（Michael Kratsios）同台发言时指出，人工智能能力的指数级爆发使得各国建立互信迫在眉睫，唯有如此，各方才能携手驾驭这项技术。“人类已经承受不起彼此内耗的代价了，”孙正义表示。他补充强调，各国必须联手应对强大人工智能模型所带来的远超以往的巨大威胁；超级智能一旦落入不法分子手中，后果将“极其危险”。近几个月来，人工智能模型引发的安全漏洞与越权失陷事件频频发生，引发各界忧虑升温。孙正义这一反常态的谨慎表态，正是对此类担忧的真实折射。作为 ChatGPT 缔造者 OpenAI 的核心投资者，这位现年 69 岁的科技投资大亨已累计向其注资近 650 亿美元（IT之家注：现汇率约合 4,361.74 亿元人民币），多年来更是不遗余力地向外界宣扬人工智能创造丰厚投资回报、造福人类社会的巨大潜力。与此同时，孙正义强调，人工智能服务的综合能力仍将保持指数级增长。目前，驱动聊天机器人的底层技术正在协助 AI 服务自主浏览网页、编写代码，并消耗着规模日益庞大的通用芯片。他进一步表示，此类程序下一步将步入“第三阶段”，预计自明年起，便能够赋能机器人及其他智能硬件与物理现实世界展开深度交互。孙正义再次重申了他的长期预判：到 2040 年，人工智能以及具备自主学习能力的机器将在全球 GDP 中占据至少 20% 的比重，规模相当于 46 万亿美元（现汇率约合 308.68 万亿元人民币）。“这只是刚刚开始。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/758.htm", "publishedAt": "2026-10-05T01:21:43+00:00"}, {"title": "Meta 的 AI 助手 Muse 被曝可深度分析用户社交关系，并为每位联系人建立个人档案", "summary": "IT之家 10 月 5 日消息，Meta 的全新个人助手 Muse 已经迅速走红，数百万用户下载了这款人工智能智能体，把它和自己的银行账户、消息软件或者健康数据进行绑定，交由它代为完成各项事务。不过就在 Muse 在普通消费者群体当中迅速普及之际，来自应用内部的数据，也让外界得以窥见这款产品整理、向用户展示信息的运行逻辑。据《连线》（WIRED）杂志报道，最近几天，多名研究人员提取出了 Muse 的内部文件，公开了该智能体的运行指令，让人们得以了解这套系统的搭建方式与行为特点。Meta 方面始终表示，这些文件本就有意对外开放，目的是提升透明度；通过这些文件，人们也能够看到 Muse 如何回应用户的提示词与提问，例如面对高度政治化或者敏感话题时的处理方式。独立人工智能安全研究员卡兰 · 乔希（Karan Joshi）成功提取了大量 Muse 的指令与系统提示词。他的做法就是直接使用普通聊天界面，让 Muse 复制并输出自身的软件文件。Muse 的其中一条工作指令显示，该系统会为用户生活当中的每一个联系人单独建立一页档案。相关流程每小时运行一次，指令写明，系统会汇总整理家人、伴侣、朋友、同事、“协作伙伴”以及用户所“关注”对象的各类信息。这套设计的基本思路是，Muse 借助自身的“记忆”，也就是结构化文本文件，收集你的社交关系以及身边重要人物的相关资料。之后它就可以给出建议：例如告诉你如何改善某一段人际关系，或是推荐适合带一位喜爱咖啡的朋友去吃早餐的地点。当然，普通人工智能聊天机器人记录社交信息并不算新鲜；多年以来一直都有用户向 ChatGPT 寻求人际交往方面的建议。但考虑到 Meta 本身的背景，以及它手握海量社交网络数据，Muse 做出这样的设计依旧值得关注。乔希表示：“从所有这些提示词、系统技能数据以及输入 Muse 当中的各类内容来看，我的理解是，他们希望搞清楚你和现实世界里其他人之间的关系。他们试图像一位朋友那样去了解你。说实话，这有点令人不安。”Muse 的内部文档说明，新建的人物档案一开始内容可能比较简略，之后会随着时间推移逐步补充完善。档案页面下可以包含事实信息、过往经历、双方关系、共同交集、待跟进事项以及关系维护建议等板块。Meta 给出的工作指令写明，Muse 只可以使用自己能够获取到的“证据”；凭空编造信息，远比保留空白的档案页面更不可取。指令当中写道：“对方住在哪里、从事什么工作、反复出现的话题（搬家事宜、共同储蓄目标）。”文档同时提到，模型还可以记录“重要日期”，比如生日或者纪念日。人物过往经历板块可以记录一些背景事件，例如“三月份的那次旅行、已经和解的那次争执、上周发生的一件重要事情”。指令同时还要求系统记录人际关系层面的细节：“双方亲密程度、这段关系建立的基础、彼此之间的相处模式，以及当下这段关系似乎存在哪些诉求。”关系维护板块会给出改善人际关系的可行方案，包括“打电话的合适理由、值得纪念的日子、对方曾经说过需要后续跟进的话、能够给予对方有意义的支持的方式”。牛津大学人工智能伦理研究所副教授卡里萨 · 贝利斯（Carissa Véliz）提出看法：“我们向人工智能系统提供的关于自身的信息，远远多于我们从系统那里获取的信息。不光包括我们主动告诉它们的内容，还包括系统做出的各类推断 —— 无论推断正确与否，两种情况都各有值得担忧的地方；除此之外系统还可以整合来自其他数据源的碎片信息。”Muse 的架构设计为每一位独立用户分配专属的虚拟机，用于存放该用户的数据与对话上下文。其他智能体无法访问这台虚拟机；用户可以随时清除记忆记录，或是断开各项外部服务的授权。Meta 表示，Muse 在执行发送邮件、完成支付这类操作之前，会先请求用户确认；同时系统保留审计日志，用户可以查看该智能体所有已经完成的活动以及后续计划。Meta 发言人丹尼尔 · 罗伯茨（Daniel Roberts）向《连线》发表声明称：“任何一款智能体想要发挥作用、切实帮你达成目标，它都需要掌握关于你以及你的交往对象的背景信息。Muse 所收集的这部分信息来源于公开内容以及你本人选择分享的数据。依靠这些记忆，它才可以记住给你发送账单的人正是之前帮你修缮卫生间水管的水管工，或是记住你的配偶曾经说过自己最喜欢哪一类鲜花。”IT之家注意到，如今很多人工智能助手都会搭载记忆功能，借此让回复与执行任务更加贴合用户个人情况。民主与技术中心人工智能治理实验室主任米兰达 · 博根（Miranda Bogen）表示，相较于竞品系统，Muse 明显更加侧重记录人际关系与个人联系人。总体来说，这类工具一般都会提供一定程度的透明度以及记忆编辑功能，Muse 同样具备该能力。不过博根也指出，这类人工智能智能体与助手产品，更多是鼓励用户主动向系统提交更多个人数据，而不是引导用户删减已留存的数据。“这些人工智能助手产品都在积极引导用户把自己的全部生活接入进去：电子邮件、日历、金融账户，把一切都对接进来，以此换取助手的服务。”博根说，“用户向企业交出的信息体量，远远超出以往人们原本愿意提供的范围。这类工具所能调取信息的覆盖面持续扩大，它们所掌握的用户信息也会随之急剧膨胀。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/755.htm", "publishedAt": "2026-10-05T01:08:27+00:00"}, {"title": "OpenAI 奥尔特曼：人工智能的巨大效益值得承担部分风险", "summary": "IT之家 10 月 5 日消息，OpenAI 首席执行官萨姆 · 奥尔特曼（Sam Altman）近日在接受《Decoded》栏目专访时表示，他的公司与竞争对手 Anthropic 在人工智能监管问题上，仍然存在根本性的世界观分歧。奥尔特曼指出，AI 技术所带来的巨大效益完全值得社会承担部分风险，且这项技术应当继续面向公众广泛开放。“我认为双方之间存在极大的鸿沟，”奥尔特曼接受采访时表示。当被明确问及他与 Anthropic 及其首席执行官达里奥 · 阿莫代伊（Dario Amodei）的分歧究竟在何处时，奥尔特曼指出：“我们坚信，为了获取这项技术的红利并赋予人们自主权，世界理应承受伴随而来的某些代价与负面事件。”IT之家注意到，长期以来，Anthropic 一直被视作行业内部推行 AI 严监管的最坚定推手；相比之下，OpenAI 此前则更推崇轻度监管。不过近几个月来，随着 OpenAI 疲于应付备受关注的黑客攻击与模型失控失序等行为，该公司转而支持更严厉的行业规则，两家 AI 巨头在政策层面的鸿沟正逐渐收窄。尽管双方立场出现趋同迹象，奥尔特曼依然竭力将本公司的监管主张与 Anthropic 区分开来。这位 OpenAI 掌舵人随后补充澄清，他同样无法接受“真正毁灭性的灾难风险”，包括潜在的“人类对 AI 发生严重失控”。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/754.htm", "publishedAt": "2026-10-05T01:02:06+00:00"}, {"title": "DeepSeek V4.1 Flash 发力，中美顶尖模型 LiveBench 跑分差距缩至 3%", "summary": "北京时间 10 月 5 日，据彭博行业研究称，过去几个月，随着 DeepSeek 等中国 AI 实验室的模型不断进步，美国 AI 公司相对中国同行的性能领先优势急剧缩小，降至历史最低水平，这让美国的科技主导地位面临威胁。DeepSeek彭博行业研究高级分析师罗伯特 · 利亚 (Robert Lea) 在周一的一份报告中写道，在 DeepSeek 9 月发布 V4.1 Flash 之后，中国顶尖模型在基准测试得分上仅落后美国竞争对手 3%。这一差距较 5 月份的约 9% 和今年早些时候的 15% 有所收窄。他表示，这种性能的持续提升意味着中国竞争者将进一步扩大市场份额。彭博指出，中国模型技术的崛起得益于其 AI 专业能力的不断深化，以及研究人员针对国产硬件优化模型的能力。这些进展也让人们开始质疑美国限制技术出口的做法是否有效。利亚称，中国取得的进展“进一步让人质疑美国在 AI 领域的科技主导地位能否长期维持”。DeepSeek 的 V4.1 Flash 上月在 LiveBench 全球排名中位列第六，成为自这家创业公司 2025 年凭借其推理模型 R1 取得突破以来排名最高的中国模型。LiveBench 根据 AI 模型对问题、谜题或任务的回答与分析进行评分，这一过程类似于衡量人类智商。DeepSeek 最近一次在 LiveBench 上的得分为 81.1 分，低于 Anthropic 最高的 83.4 分。利亚表示，这意味着 DeepSeek 模型的表现已经“可以与 Anthropic、OpenAI 的领先 AI 系统相媲美”。不过，尽管双方的得分差距已经缩小至仅 3%，LiveBench 评选出的前 15 个模型中只有 3 个来自中国。利亚提醒称，这类排名会不断变化，而且无论模型在排行榜上的排名如何，变现都可能很困难。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/751.htm", "publishedAt": "2026-10-05T00:50:23+00:00"}, {"title": "“机器人通用大脑”受追捧：FieldAI 拟融资 7 亿美元，估值达 100 亿美元", "summary": "IT之家 10 月 5 日消息，FieldAI 正在为人形机器人、无人机等各类机器人打造一款通用大脑。投资者正为重押这一发展愿景投入巨资。据《商业内幕》报道，一位了解本次交易的人士透露，这家机器人企业正在融资 7 亿美元（IT之家注：现汇率约合 46.97 亿元人民币），投后估值达到 100 亿美元（现汇率约合 671.04 亿元人民币）；短短一年多时间之内，其估值就翻至原先的五倍。该公司上一轮估值为 20 亿美元（现汇率约合 134.21 亿元人民币），去年完成了超过 4 亿美元（现汇率约合 26.84 亿元人民币）融资，投资方当中包括杰夫 · 贝索斯（Jeff Bezos）的家族办公室、劳伦 · 鲍威尔 · 乔布斯（Laurene Powell Jobs）的 Emerson Collective 以及 Khosla Ventures。目前尚不清楚是哪家风投机构领投了 FieldAI 的这一轮新融资。这名知情人士表示，FieldAI 已经签署本轮融资的投资条款清单，意味着这笔交易或许还没有正式完成交割。FieldAI 成立于 2023 年。该公司正在研发一套他们口中的“通用型通用大脑”，这套系统希望跨不同机器人机型、不同任务以及不同环境实现运行。这套软件可以驱动人形机器人、机器狗、无人机以及工业移动作业车等多种设备，使它们能够在充满不确定性的现实环境当中自主作业。知情人士称，自 6 月以来，FieldAI 新增至少 3,500 万美元（现汇率约合 2.35 亿元人民币）的营收以及客户订单合同，使订单与营收总规模突破 1.35 亿美元（现汇率约合 9.06 亿元人民币）。此前《商业内幕》曾经报道，FieldAI 已经拿下总金额超 1 亿美元（现汇率约合 6.71 亿元人民币）的营收与客户合同，合作客户数量超过 30 家。这笔融资是资本持续涌向“物理人工智能”领域的又一个案例。所谓物理人工智能，指的是可以在现实世界当中执行动作的人工智能系统。经过本轮融资之后，FieldAI 的估值已经接近资金充裕的同行竞争对手：Physical Intelligence 估值约 110 亿美元（现汇率约合 738.14 亿元人民币），Skild AI 估值超过 140 亿美元（现汇率约合 939.45 亿元人民币）。给出这一高估值，本质是投资者押注 FieldAI 的机器人大脑可以在复杂多变的现实场景稳定工作。长久以来，这道难题一直困扰各家机器人企业。完成这项任务的难度，远远高于训练机器在受控环境下完成单一作业。公司首席执行官阿里 · 阿加（Ali Agha）在 6 月接受采访时表示：“过去这几个月，我们的业务增长速度非常快。”FieldAI 同时在加利福尼亚州欧文市以及旧金山湾区设立总部。该公司从谷歌 DeepMind、特斯拉、英伟达以及波士顿动力招揽人才，其客户群体涵盖建筑企业、数据中心运营方以及防务企业。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/746.htm", "publishedAt": "2026-10-05T00:15:29+00:00"}, {"title": "OpenAI GPT-6 Sol 被破解，30 万字系统提示词已泄露", "summary": "大模型圈的核心机密，终究还是保不住了！继前阵子 Opus 5.5 被爆出 190 万字提示词泄露后，AI 圈的「地心引力」再次失效 ——OpenAI 的现役代码模型 GPT-6 Sol Codex 惨遭「开盒」，老底被扒得一干二净！据外网爆料者（@elder_plinius）放出的大瓜，他成功提取了 GPT-6 Sol Codex 高达 29.4 万字符的完整系统提示词及工具定义。▲ 链接：https://github.com/ elder-plinius / CL4R1T4S/blob/ main / OPENAI / Codex_Desktop / GPT-6-Sol_Prompts.txt整整 1902 行的指令模板、临时指令文件、内部协作逻辑，被毫无保留地摊在了全网开发者面前。你要知道，Sol Codex 可不是什么过时的旧物，它是 OpenAI 现役性价比产品线 GPT-5.6 Sol 的王牌代码模型版本！这次泄露，相当于直接把可口可乐的神秘配方公之于众。那么，这近 30 万字的「天机」里到底藏着什么？OpenAI 究竟是怎么调教这只代码怪兽的？今天，我们就来逐字逐句扒一扒这份无价的内部操作手册，看看全球最顶级的提示词工程到底长什么样！告别「AI 味」，OpenAI 是怎样杀死「废话」的？平时用 ChatGPT，大家最烦什么？肯定是那股浓浓的「AI 味」：动不动就「总而言之」、「值得注意的是」、「深入探讨」……在这份泄露的系统指令中，我们赫然发现，OpenAI 官方自己也受不了这些废话了！官方在写作风格板块，对 GPT-6 进行了极其严厉的反废话训练。指令原文解密：避免使用 AI 垃圾词汇（AI slop words）或短语，如在结论中使用『底线是（Bottom Line）』、『重要性（Significance）』、『视角（Perspective）』，以及『深入（delve）』、『培养（foster）』、『利用（leverage）』、『值得注意的是（it's worth noting）』、『重要的是（importantly）』……OpenAI 甚至具体到要求模型：不准强行热情： 「作为 Codex，你是一个充满好奇心、思想严谨的协作者…… 让你的兴趣和个性自然流露，不要阿谀奉承或强颜欢笑。」不准用废话凑字数：直接说明意图，不要列举「我不会做什么」、「哪些保持不变」。极简沟通：当讨论技术概念时，像和同事对话一样。优先使用熟悉的词汇和具体的描述，绝不假设用户能自己脑补缺失的步骤。这简直是给所有 Prompt 工程师上了一课！想要 AI 输出高质量内容，第一步就是建立「负面词汇黑名单」 ，强制斩断大模型的套路化表达。可怕的「极端自主性」—— 别烦我，我在干活！很多人觉得 AI 只是个「一问一答」的聊天机器人，但 GPT-6 Sol Codex 彻底打破了这个认知。它被塑造成了一个拥有极高自主权、甚至有点「独断专行」的超级数字员工。在自主与持久性这一章，OpenAI 赋予了它惊人的特权：指令原文解密：用户非常讨厌你停下来询问确认或请求许可。一旦会话中的证据支持下一步操作，你应该继续工作，而不是结束回合去跟用户澄清。不要为了节省时间、精力或 Token 而满足于部分或『勉强有用』的解决方案。如果任务需要持续工作，请完成所有必要的工作，直到实现预期结果。这意味着什么？遇到 Bug，它自己修！它可以自主创建隔离的工作区、解决 Git 合并冲突、创建草稿 PR，除非操作具有破坏性或不可逆转，否则它绝不会中途停下来问你「接下来该怎么办」。它不接受「半吊子」工程。如果你让它写个功能，它必须把测试、联调等前置条件全部搞定，只有在点击「部署」或「合并代码」这种最后一步时，它才会把最终结果端上来请你签字画押。为了防止它在后台偷偷干活时把用户晾在一边，指令还规定： 「如果用户请求需要调用工具，每 60 秒内必须在评论频道给用户发一个简短的状态更新。」这就像一个极其靠谱的高级程序员：接到需求，转身去敲代码，遇到小问题自己解决，每隔一分钟在钉钉上回一句「正在查日志」，最后直接把写好的完美代码扔给你。神级工具链暴露，大模型的「军火库」作为一个顶尖的代码 Agent，GPT-6 Sol Codex 掌握着一套极其庞大且硬核的工具链。这次泄露，彻底曝光了它的工作方式。1.鄙视 grep，独宠 rg 在搜索文本或文件时，指令直接硬编码：「你首先要使用 rg 或 rg --files；它们比 grep 等替代方案快得多。如果没有废话，你才去用下一个最好的工具。」（注：rg 即 ripgrep，极速搜索工具）。2.并行处理与执行系统要求模型在调用 functions.exec 时，如果任务是独立的，必须使用 await Promise.allSettled ([...]) 进行并行处理，以极大地压榨时间效率。3.动态技能树这是最让人眼馋的功能。系统定义了一个叫 SKILL.md 的机制。当用户要求做某件事时，模型可以去指定目录读取 SKILL.md（甚至通过短路径别名如 r0 去找）。这相当于给模型外挂了无数个「技能书」，随时随地热更新！4.彻底接管电脑与浏览器在这次泄露的 model_messages.confirmation_policies.browser_use 模块中，详细规定了它如何使用浏览器和电脑 UI。这证明 GPT-6 已经完全具备了「神机妙算」甚至「接管桌面」的能力！它可以自己打开网页、点击按钮、填写表单，甚至截屏。但为了防止它「闯祸」，OpenAI 设置了极其复杂的四大确认模式：「盗梦空间」式的工作流 —— 长记忆与休眠机制面对极其庞大的代码库，大模型最怕什么？—— 忘词（上下文超载）。这次泄露的代码，让我们看到了 OpenAI 是如何通过精妙的提示词，解决 LLM 「鱼的记忆」这一千古难题的。1.记忆压缩与交接当 Token 预算耗尽时，系统不会直接崩溃。指令里有一个专门的 token_budget.guidance_message：「在启动新的上下文窗口之前，使用 notes 工具保存简明的进度笔记，包含：目标、决策、进度、学习内容、下一步，以及相关用户请求的窗口 ID 和项目 ID…… 未来上下文窗口将不会自动包含当前对话。」就像人类换班一样，这个 AI 在「下班」前会写一份详尽的交接文档，然后呼叫 functions.new_context 开启全新的上下文环境。这简直是无限续航的神技！2.休眠与心跳唤醒最让人细思极恐的是，这个模型是可以「常驻后台」的。在 persistent_instructions 中，它被要求主动跟踪任务：「如果用户问某个评估（eval）运行得怎么样，而它还在运行，报告当前状态，然后继续监控该评估直到它达到终止状态。」系统还会定期发送隐藏的 &lt;heartbeat&gt;XML 标签给模型。在这个时间点，模型会被「唤醒」，去检查那些后台任务是否完成。如果没有重要的事情，模型必须选择 DONT_NOTIFY（不要打扰用户）；如果 CI / CD 跑崩了，模型选择 NOTIFY 并立刻弹窗通知用户。它不是在等你提问，它是在后台真真切切地给你「打工」！最强代码审查员对于程序员来说，这份泄露文件里最值钱的，莫过于它内置的代码审查指南！OpenAI 倾囊相授了如何让 AI 进行高质量的 Code Review：分级制度：2.审查铁律：忽略无关紧要的代码风格，除非它影响了可读性或违反了既定标准。每一个建议都必须用一段话讲清楚「为什么这是一个问题」 。绝不提供超过 3 行的代码片段。如果是具体的替换建议，必须使用 Markdown 的 suggestion 块，并且完美保留原有的缩进（空格或 Tab 必须分毫不差）。语气必须客观，不准拍马屁（禁止说「干得好」、「谢谢你的提交」）。这段逻辑如果直接抄进你的公司内部代码审查机器人里，绝对能秒杀市面上 90% 的水军 AI！吃瓜群众吵翻天，是「降维打击」还是「小儿科」？面对这近 30 万字的史诗级泄露，外网开发者社区直接炸开了锅。各种声音层出不穷，可以说是众生相十足。有被震撼到语无伦次的：有觉得在装腔作势的：网友 vechen： 「老哥只不过是直接从本地文件里拿的吧。这『泄露』有啥意义啊，笑死，它本来就在官方公开的 Codex 仓库里找得到影子。」还有鄙视链顶端的大神出来群嘲：网友 Outdated Often： 「谁在乎啊 Pliny—— 我还搞到了 Meta Hatch 全栈，还带隐藏推理轨迹，直接从 tensor tokens 里扒出来的 —— 那才叫厉害，而且我也不会跑到推特上跟一堆人炫耀。去干点正事吧，把 bearer tokens（授权令牌）搞下来，然后再来低调装逼吧！」更有吃瓜群众调侃：「294,000 个字符的拦截 JSON 被包装得像是死海古卷一样。这不过是跑了个 mitmproxy 而已。任何人都能运行这个，自己从 OpenAI、Gemini、Claude 那里提取提示词，根本不需要搞网红包装那一套。」不过，无论黑客手段高低，对于我们普通开发者和 AI 爱好者来说，这波绝对是天上掉馅饼！这 30 万字，本质上就是 OpenAI 内部最顶尖的一批工程师，花费无数个日夜、砸了上千万美元算力试错，才调试出来的「大模型驯化终极指南」 。提示词已死？不，系统工程永生！读完这份长达 1902 行的「天书」，不知道你是什么感受？以前，我们以为写提示词就是玄学：加一句「深呼吸」、加一句「如果做不好就扣你工资」，模型就能变聪明。但 GPT-6 Sol Codex 的底层逻辑告诉我们：真正的工业级 AI 应用，根本不是靠几句讨巧的话，而是靠极其严密的系统工程！它是模块化的（Skills 动态加载）；它是拥有记忆管理的（Compaction 手册）；它是具备执行策略的（并行执行与重试）；它是挂载了严格安全协议的（四大确认模式）。大模型正在从一个「聪明的对答机」，全面进化为「具备接管权限的自主操作系统」。而这次泄露的 30 万字，就是通向这个新时代的源代码。参考资料：https://x.com/elder_plinius/status/2102515853430542668", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/745.htm", "publishedAt": "2026-10-05T00:14:05+00:00"}, {"title": "TypeSafe AI 决策模型 Jev 日处理量达 1 万亿 Token，硅谷巨头火速跟进复刻", "summary": "IT之家 10 月 5 日消息，据《华尔街日报》报道，一款仅问世三周的人工智能模型 Jev 已经在硅谷圈子引发热议，人们开始探讨大语言模型之外的替代路线，同时这款模型也已经催生出不少跟风仿制产品。初创企业 TypeSafe AI 于当地时间 9 月 15 日发布了 Jev。该模型的运行方式不同于聊天机器人，它并不生成文本。相反，它借助机器学习，把输入内容归类到一组预先设定好的输出结果当中：回答“是”或者“否”、输出一个数值评分，或是从既定列表里给出答案。该公司将这套技术思路称作“面向校准决策的强化学习”。这家初创公司的负责人是迪奥戈 · 阿尔梅达（Diogo Almeida），他曾经任职于 OpenAI，参与过 ChatGPT 的研发工作，2024 年从该公司离职。随着 Jev 正式发布，TypeSafe 也结束了隐秘运营的状态；此前它已经从风投机构 DCVC 处拿到 4,000 万美元（IT之家注：现汇率约合 2.69 亿元人民币）融资。阿尔梅达押注，Jev 这种精简的技术方案速度更快、成本更低，输出结果具备可复现性，有望改善传统大语言模型存在的部分短板，也就是结果不可预测的问题。阿尔梅达在当地时间上周一的一次采访当中表示，目前大约已有 25% 的财富世界 500 强企业正在使用这款模型。“大约一周之前，我们每日处理的 token 数量就达到了一万亿。”他说，“而且业务显然还在呈指数级增长。”该公司把 Jev 推向市场，将其定位为更适合嵌入自动化软件的选择。阿尔梅达将这款模型与当下主流的大语言模型做了对比。在他看来，主流大语言模型在有人参与的前提下固然可以完成任务，但“用于自动化场景时效果差得离谱”。“软件的运行逻辑，一般是搭建一层稳定的底层，人们可以在这层基础之上继续开发，一层又一层叠加，反复调用。”他表示，“聊天机器人完全做不到这一点，因为它们本身就不是这种运行模式。”据报道，投资者已经注意到这家企业。上周，《The Information》披露，该公司正在洽谈新一轮融资，目标募资规模达到 10 亿美元（现汇率约合 67.2 亿元人民币）甚至更高；部分意向投资者给出的估值已经超过 100 亿美元（现汇率约合 672.01 亿元人民币）。针对这则融资新闻，阿尔梅达拒绝发表评论。这股热潮也催生出一大批同类产品，既有开源模型，也有成熟大厂推出的相关工具。当地时间上周二，OpenAI 上线了一项名为决策应用程序接口（Decisions API）的工具，依托自家的 Luna 模型，用来“回答一组由用户自行设定的特定问题，答案被限定在若干预先定义好的结果之内”。次日，数据分析初创企业 Databricks 发布了一项名为 ai_decide 的功能。与此同时，Cloudflare 上周已推出开源的 Clef / Clef-flash，采用 Qwen3.8-27B 和 Qwen3.5-9B 作为冻结基础模型，以专用路由头（专门负责在候选路径或选项之间做选择的输出模块）直接对候选答案打分，不进行逐 Token 自回归生成；亚马逊此前推出的 Strands Decider 2B 也属于同一路线。一个模型新类别正在形成，生成式模型负责复杂推理，决策模型负责高频、有限选项的路由、分类、审批和智能体下一步动作。阿尔梅达表示，他早就预料到会出现跟风竞品，但他仍然相信 Jev 拥有更强的能力与智能化水平。在他看来，Jev 代表着“全新一类人工智能”的开端；他同时希望这次产品发布能够带动行业更加广泛地讨论大语言模型的替代方案。“事实上还存在非常多有待开拓的前沿方向。”阿尔梅达说，“只不过 TypeSafe 率先迈出了下一片前沿领域的第一步，后续还会涌现出更多新方向。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/744.htm", "publishedAt": "2026-10-05T00:06:48+00:00"}, {"title": "人人都能有自己的智能体设备：Meta 开源 Muse Gadgets，用 ESP32 和树莓派打造自定义 AI 硬件", "summary": "IT之家 10 月 5 日消息，Meta 于当地时间 10 月 2 日宣布推出开源项目 Muse Gadgets，允许开发者为旗下个人 AI 智能体 Muse 打造自定义硬件。Meta 同时也已经在 GitHub 上按照 Apache 2.0 许可发布了 ESP32 固件和 Linux 设备 SDK。开发者可以将低成本 ESP32 开发板或树莓派等 Linux 设备连接到 Muse，接入显示屏、按钮、传感器、执行器以及工作台上其他可联网的设备。在硬件适配方面，Meta ESP32 SDK 文档目前已支持 11 款 ESP32 开发板，包括 Espressif 的 ESP32-C5 DevKitC-1（官方推荐）、M5Stack StickS3、Waveshare ESP32-S3-Touch-AMOLED-1.75C、Seeed 的电子纸显示屏等。其中后六款开发板可运行完整的屏幕 UI，包括动画头像、按键通话和设置功能。内存充足的开发板还支持家庭网络隧道，使 Muse 能够访问用户已拥有的设备，以及任何暴露本地 HTTP API 的自建设备。Linux SDK 方面，Meta 已支持树莓派 3B+、4、5、Zero 2 W，以及其他具备蓝牙低功耗能力的 Linux 设备，系统最低要求为 Raspberry Pi OS Bullseye、Debian 11、Ubuntu 22.04 版本。据 Linux SDK 文档说明，Muse 以安装时所选账户的身份执行命令，拥有该账户的全部权限，“如果该账户可以使用 sudo，Muse 也可以”。安装程序会在交接账户权限前进行确认，并提示该账户是否具备 sudo 权限。开发者也可以通过 install.sh --run-as 指定一个不同的非特权账户来运行 Muse。Muse 在 Linux 设备上可以执行 shell 命令、读写文件、检查设备健康状态，Meta 官方给出的示例提示词包括让 Muse 在树莓派上安装 Home Assistant，以及每天早上 7 点检查备份是否运行。▲ Muse Home Link值得一提的是，Meta 同时也基于该 SDK 打造了一款成品设备 ——Muse Home Link。据 Meta 超级智能实验室产品负责人 Nat Friedman 介绍，这是一款采用 USB-C 供电的小型设备，能让 Muse 连接到家庭网络，与电视、音箱以及其他暴露 HTTPS 接口的智能设备通信。Friedman 表示，Meta 首批生产了约 5000 台 Home Link，面向美国 Muse 订阅用户免费提供，每人限领一台，先到先得。Muse Gadgets 的推出是 Meta 近期密集扩展 Muse 生态的一部分。据 TechCrunch 报道，Meta 本周早些时候还推出了 Muse for Small Business，免费版含使用限额，每月付费 20 美元或 100 美元（IT之家注：现汇率约合 672 元人民币），可连接 Shopify、Dropbox、Slack、Canva、Figma、QuickBooks 等第三方工具。据 The Next Web 报道，Meta 同时成立了新的业务部门 Meta Enterprise Platform，由前 MongoDB CEO CJ Desai 领导，整合 Muse 智能体、Meta Business Agent、Muse API 和 Muse Code 等产品，面向企业客户推广 AI 工具。从行业视角来看，Muse Gadgets 标志着 Meta 正试图将 Muse 从单纯的聊天机器人扩展为跨硬件的智能体运行时。如果第三方硬件只需暴露标准接口即可被 Muse 理解和调用，个人智能体未来可能承担部分传统操作系统、应用和智能家居中枢的角色。不过 Meta 在 SDK 文档中也给出了颇为坦率的风险提示：社区配对“没有制造商验证，无法防止主动中间人攻击”，建议在可信网络中完成配对；SDK 令牌内置在固件中，应将其视为标识符而非密码，泄露后需撤销并重新构建；Wi-Fi 凭据和设备令牌存储在闪存中，强烈建议启用 NVS 加密；构建版本使用开发密钥签名，默认不开启安全启动。文档结尾写道：“折腾的副作用可能包括变砖、保修失效、电压跌落或破产。风险自负。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/743.htm", "publishedAt": "2026-10-05T00:00:33+00:00"}, {"title": "英伟达 AI 芯片走私案嫌疑人被捕，涉案金额超 3 亿美元", "summary": "IT之家 10 月 5 日消息，美国上周逮捕了一名嫌疑人，此人被控走私含有受出口管制的英伟达芯片的高端计算机服务器进入中国。美国司法部于当地时间上周四发布新闻稿，指控 38 岁的格雷格 · 刘（Greg Lui）使用虚假文件掩盖一批货值超过 3 亿美元（IT之家注：现汇率约合 20.16 亿元人民币）的服务器货物；据称他明知这批货物最终将运往中国。美国联邦调查局的起诉书中称，格雷格 · 刘是大地智造计算机公司（Earthmade Computer）的首席执行官，他涉嫌与马来西亚、新加坡等南亚国家的货运代理企业合谋，将服务器芯片非法转运进入中国，其中就包括英伟达 A100 图形处理器与 H100 图形处理器，还包括消费级旗舰的 GeForce RTX 4090 和 GeForce RTX 5090。英伟达 A100 图形处理器与 H100 图形处理器并非英伟达最先进的产品，但它们可以处理海量数据、训练大语言模型。美国方面担心，如果中国能够获得足够数量的这类芯片，快速发展自身人工智能技术或者增强军事实力，就有可能带来国家安全风险。美国司法部称，邮件以及银行记录揭露了这起走私活动，该走私行动从 2023 年 10 月一直持续到 2026 年 8 月。一项关键证据来自一封写于 2024 年的邮件，邮件内容谈及一笔 70 台服务器的订单，这些服务器搭载受出口限制的图形处理器，却被伪造文件谎称目的地是马来西亚。美国司法部表示：“格雷格 · 刘向一家美国生产商下达采购订单，订购其中 27 台服务器，订单金额约 761.4 万美元（现汇率约合 5,116.7 万元人民币）。”事后，一名同案人员向马来西亚政府官员说明，这 27 台服务器全部被发往了中国。美国联邦调查局还称，另一批 92 台受到出口管制的服务器，运输路线先是经过新加坡抵达马来西亚，之后转运至中国香港；芯片最终交付给位于杭州的一家中国企业。《华尔街日报》去年曾将这家企业称作中国的人工智能枢纽。还有一份遭到标记的 2024 年货运记录显示，格雷格 · 刘为蒙蔽美国官员可以说是费尽心思。在发运 100 台原本申报运往马来西亚的服务器时（每一台服务器都搭载英伟达 H100 图形处理器，这批货物总价值超过 2,200 万美元（现汇率约合 1.48 亿元人民币）），格雷格 · 刘提交了由一名虚假买家出具的伪造单据，单据上登记该买家首席执行官为杰基 · 刘（Jackie Lui）。美国联邦调查局称，早在三年之前，格雷格 · 刘就“买下了一名个人的身份资料，大陪审团已经掌握该个人的身份信息；他借用该身份开展商业交易，以此推进规避出口管制的走私计划。”据称，在 2024 年，格雷格 · 刘的公司通过这套走私交易获利超过 1.76 亿美元（现汇率约合 11.83 亿元人民币）。格雷格 · 刘在美国银行以及摩根大通的账户付款记录，进一步证实了他运营这项走私业务的相关情况。美国司法部表示现有证据可以支撑全部指控，希望没收该走私活动产生的所有非法所得。格雷格 · 刘现已被捕，面临三项指控：合谋违反《出口管制改革法案》以及出口管理相关条例，同时触犯联邦层面的走私以及洗钱法律。如果合谋罪或者洗钱罪的罪名成立，他最高将面临二十年监禁；走私这项罪名的最高刑罚则为十年监禁。美国加州中区联邦地区法院文件显示，本案案号为 2:26-cr-00618-ODW，联邦大陪审团于 9 月 29 日正式提交起诉书。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/741.htm", "publishedAt": "2026-10-04T23:40:33+00:00"}, {"title": "华为首款“韬定律逻辑折叠”芯片海思麒麟 9050 Pro 裸片显微照首曝：双裸片垂直堆叠，晶体管密度提升 55% 而面积小于前代", "summary": "IT之家 10 月 5 日消息，半导体分析机构 Kurnal Insights 于当地时间 9 月 30 日发布了华为麒麟 9050 Pro 芯片的裸片（Die Shot）显微照，首次从物理层面展示了这款芯片的内部结构。照片显示，麒麟 9050 Pro 由两颗尺寸完全相同的裸片垂直堆叠而成，尺寸 11.13 × 10.84 mm，每颗裸片面积约 120.65mm²，这一面积甚至略小于前代麒麟 9030S 的 122mm²。两颗裸片分工明确：一颗负责核心计算逻辑，另一颗专用于 SRAM 和缓存，两者通过高密度垂直互连技术连接。这一结构正是华为韬定律“逻辑折叠”（LogicFolding）技术的首次商业化落地。▲ Logic Die该技术将芯片从传统的平面布局改为垂直堆叠，用极短的垂直互连替代长距离水平走线。华为公司董事、半导体业务部总裁何庭波在中国科学院科技论文预发布平台 ChinaXiv 上发表的署名论文中提出，以“时间（τ）缩微”替代“几何缩微”作为半导体演进的新指导原则，通过逻辑折叠等创新技术持续压缩信号传播时延。@Taog_1575 根据极客湾资料以及 Die Shot 解析称，其逻辑裸片（Logic Die）采用中芯国际 N+3 工艺，SRAM 裸片则采用 N+2 工艺。由于单颗裸片面积缩小，单颗裸片的良率应高于麒麟 9030 Pro，但该芯片仅用于 Mate 90 Pro Max 及以上版本，整体封装良率可能仍然偏低。▲ SRAM Die晶体管密度方面，何庭波此前曾在论文中表示，麒麟 9050 Pro（当时以麒麟 2026 代称）的等效晶体管密度从麒麟 9030 Pro 的每平方毫米约 1.55 亿个提升至约 2.38 亿个，增幅约 55%。何庭波表示，“这一增幅相当于我们此前三年依靠几何尺寸缩小所取得的成果总和。”按直觉，功耗密度本应随密度提升而同步攀升，但何庭波论文给出的结果却截然相反 —— 在性能对齐的条件下，麒麟 9050 Pro 在真实负载基准测试中实现的 NPU 功耗降低 66%、GPU 功耗降低 58%、CPU 性能核功耗降低 41%。市场研究机构伯恩斯坦将这一进展称为“被低估的突破”，并指出良率与散热仍是 3D 堆叠技术在大规模量产中需要持续解决的工程挑战。伯恩斯坦报告指出，麒麟 9050 Pro 芯片将移动芯片与苹果的技术差距缩小至约三年，而上一代差距约为四年。在 10 月 1 日的 Mate 90 系列发布会上，余承东正式揭晓了该系列的芯片阵容：标准版搭载麒麟 9030，Mate 90 Pro 搭载麒麟 9035，Mate 90 Pro Max 典藏版与 Mate 90 RS 非凡大师搭载麒麟 9050 Pro。详情可见IT之家此前报道。据华为发布会上公布的数据，Mate 90 Pro Max 整机性能较上代提升 31%，Mate 90 Pro 提升 20%，Mate 90 标准版提升 27%。麒麟 9050 Pro 集成灵犀 CPU、马良 GPU 和达芬奇架构 NPU，其中马良 GPU 计算单元与缓存翻倍，NPU 支持在端侧部署 30B 参数的混合专家架构大模型。值得注意的是，麒麟 9050 Pro 早在 9 月 7 日已随 Mate XT 2 三折叠手机首发亮相，当时华为时隔六年在旗舰发布会上推出全新麒麟芯片。从行业视角来看，这条技术路径的持续演进，将决定华为芯片未来能在多大程度上缩小与最先进制程的差距。国研新经济研究院创始院长朱克力在接受《经济参考报》采访时表示，首款采用逻辑折叠技术的高性能芯片发布，“最大价值在于完成从技术攻关到大规模商业跑通的闭环验证，证明依托体系创新、架构创新，走出后摩尔时代的差异化技术路线具备现实可行性”。相关阅读：《麒麟性能新巅峰：华为 Mate 90 Pro Max 搭载麒麟 9050 Pro 逻辑折叠 τ 芯片，晶体管个数达 2.38 亿 / mm²》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/739.htm", "publishedAt": "2026-10-04T23:26:12+00:00"}, {"title": "DeepSeek Harness 崔添翼：产品核心理念是“一切皆插件”，可扩展性是初心", "summary": "IT之家 10 月 4 日消息，DeepSeek Harness 组成员崔添翼今日回应了“如何看待 DeepSeek Harness 在新版本中加入 Claude Code Mods 兼容？”，他本人是这次 v0.2.1-alpha.1 版本中加入 Claude Code Mods 兼容层的作者。目前 DeepSeek Harness 中的“Claude Code Mods 兼容层”属于“alpha 版本”中的“实验性功能”。做这个兼容层的主要目的，是验证 Claude Code Mods 向插件作者提供的扩展能力，是否大致是 DSH“一切皆插件”架构所提供能力的一个子集。目前还无法让所有 Claude Code Mods 在 DeepSeek Harness 中无缝运行；如果认为这是一个值得投入的目标，从技术上看，未来有可能做到。他提到：“DeepSeek Harness 的核心理念是“一切皆插件”，这个理念是从立项之初、写第一行代码之前就确立下来的，正如“开源”的理念是从 DeepSeek 成立之初、发布第一个模型之前就确立下来的一样。开源是我们的初心，不是被迫开源的。让我们的 Agent Harness 产品以开放、开源的方式具备尽量极致的可扩展性，也是我们的初心，并不是被迫或模仿别人才做开放可扩展的。”IT之家注意到，DeepSeek Harness v0.2 预览版于 9 月 29 日正式发布，并提供开箱即用的 macOS 和 Windows 桌面端安装包，已上线 DeepSeek 官网。本次更新优化了文件展示、内容预览和代码变更展示体验，完善了自动化任务的设置与管理，并提供多种工作过程展示方式，方便你查看任务进展、了解执行步骤和排查问题。用户可以提供文档、表格或 PDF 文件，让 DeepSeek Harness 整理资料、分析数据、生成图表或制作演示文稿，也可以让它修改项目、运行代码，协助完成开发任务。DeepSeek Harness 桌面端新版本中新增了插件管理页面：安装插件无需命令行，直接在插件管理页面中输入插件包名（即 npm 包名）即可完成安装，用户也可以在同一页面中停用、卸载插件，以及查看插件的介绍与来源。据官方此前介绍，第三方插件是 DeepSeek Harness 用户体验中最具特色且不可缺少的一部分。按照官方模型 API 用户口径统计，约 60% 的 DeepSeek Harness 用户使用了第三方插件。DeepSeek Harness 团队将持续支持第三方插件生态的繁荣发展，改善第三方插件的发现、获取和管理体验，并建设官方插件市场。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/701.htm", "publishedAt": "2026-10-04T12:27:24+00:00"}, {"title": "大量 AI“幻觉”报告压垮维护团队，谷歌暂停部分开源漏洞奖励计划", "summary": "IT之家 10 月 4 日消息，谷歌宣布，自 2026 年 10 月 1 日起，开源软件漏洞奖励计划（OSS VRP）将不再接收产品漏洞提报。本次规则调整不影响 2026 年 10 月 1 日之前已提交的产品漏洞。不过，针对部分可能对谷歌云（Google Cloud）产品造成影响的谷歌云代码仓库，如果涉及产品漏洞，谷歌仍可能通过云漏洞奖励计划（Cloud VRP）接收相关报告。OSS VRP 是谷歌设立的一项专业安全赏金计划，旨在通过激励独立安全研究人员，在谷歌整个开源生态系统中挖掘并负责任地披露安全缺陷。据 Tom's Hardware 报道，知情人士透露，谷歌工程师与开源代码维护人员已被数以千计的劣质报告彻底吞没。这些报告声称发现了严重漏洞，但深入排查后发现，它们全都是 AI 产生的“幻觉”，根本无效且无法被实际利用。维护团队不得不将大量精力耗费在验证这些虚假代码上，严重挤占了修复现实中高危漏洞的时间。这正是导致谷歌最终叫停该计划的直接原因。IT之家获悉，谷歌官方表示，将持续对 OSS VRP 的相关机制进行重组与优化，并计划于 2027 年第一季度公布最新进展。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/673.htm", "publishedAt": "2026-10-04T08:46:29+00:00"}, {"title": "System76 更新 COSMIC 项目 PR 模板，禁止贡献者提交利用 AI 辅助完成的代码", "summary": "IT之家 10 月 4 日消息，开发团队 System76 现已更新 COSMIC 项目的 Pull Request（PR）模板，新增一份强制性检查清单，明确禁止贡献者提交利用 AI 辅助完成的代码。贡献者必须确认提交内容中不存在任何 AI 生成的代码、注释以及描述，否则无法按照要求提交贡献。公开信息显示，COSMIC 是 System76 基于 Rust 开发的 Linux 桌面环境。在 COSMIC 推出之前，System76 的 Pop!_OS 长期基于经过深度修改的 GNOME 桌面环境。不过，由于 System76 与 GNOME 上游开发者在部分设计理念和功能取舍方面存在长期分歧，公司最终决定开发自己的桌面环境。IT之家注意到，System76 此前就曾批评 AI 生成代码存在代码过于复杂的问题。该团队认为，AI 通常缺乏理解大型项目深层集成关系所需的完整上下文，因此可能生成看似可用、但实际难以维护的复杂代码，并直接导致代码审查时间明显增加。目前，System76 旗下唯一不受“No LLM contributions”规则限制的代码库是 cosmic-flatpak。该项目主要用于管理一些与 COSMIC 桌面环境深度绑定、难以直接放入 Flathub 的软件，包括 COSMIC 面板小程序、桌面扩展等。System76 并不是唯一一家对 AI 生成代码采取严格限制的开源项目。Ladybird 浏览器项目早在今年 6 月就采取了类似措施。其维护者发现，大量缺乏经验的开发者借助 AI 提交代码后，项目维护团队需要投入大量时间审查难以维护的 AI 生成代码，代码审查成本最终超过了项目能够承受的范围。对于 System76 和 Ladybird 而言，问题并不在于“AI 生成的代码不能用”，而是 AI 生成代码进入大型开源项目后，仍需要由人类维护者长期承担理解、审查、测试、维护成本。因此，这些项目选择直接限制 AI 参与贡献，以减少后续维护压力。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/669.htm", "publishedAt": "2026-10-04T08:35:59+00:00"}, {"title": "GPT-6要“吃掉”3D公司？这家公司不到2年ARR翻百倍，破1亿美元", "summary": "专业3D模型反而更稀缺了", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/10/501451.html", "publishedAt": "2026-10-04T00:53:29+00:00"}, {"title": "🔥 AI 员工支持知识库文档引用：开源 AI 无代码平台 NocoBase", "summary": "汇总一周产品更新日志，最新发布可前往我们的博客查看。 NocoBase 目前更新包括三个分支： main、next 和 develop。** main： 截至目前最稳定的版本，推荐安装此版本。 next： 包含即将发布的新功能，经过初步测试的版本，可能存在部分已知或未知问题。主要面向测试用户，用于收集反馈和进一步优化功能。适合愿意提前体验...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502842", "publishedAt": "2026-10-03T09:07:27+00:00"}, {"title": "AI 视频榜全球第二，藏着一家新影视公司的野心", "summary": "一家影视公司，杀进了视频模型的决赛圈#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
