const DATA = {"date": "2026-11-12", "generatedAt": "2026-11-12T03:33:39Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "谷歌发布首款决策模型 Gemini Decision 1：9 项测试拿下 7 项第一，准确率最高92.2%", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/E7QKIMUz3h0G0IE5Paii?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-12T11:00:00+00:00"}, {"title": "苹果正在开发一个把 Mac 变成私有 AI 推理服务器的应用", "summary": "爆料人 Aaron Perris 在 11 月 10 日发现了苹果内部的一个新 Mac 应用，名字叫 Harbor。它的定位写在功能描述第一句：把你的 Mac 变成私有 AI 推理服务器。 这件事有意思的地方在于，苹果过去的 AI 叙事一直围绕着云和端侧的小模型转，Harbor 换了个思路——拿你自己买的 Mac 硬件跑开源权重模型，数据不出你的机器。 按...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503540/apple-new-mac-app-coming-to-make-running-local-ai-models-easy", "publishedAt": "2026-11-12T02:58:12+00:00"}, {"title": "百度李彦宏发布大模型的交易所“词元所”：宣称中立、可信，给模型提供商打分", "summary": "IT之家 11 月 12 日现场消息，在今日的百度世界大会 2026 活动中，百度创始人李彦宏宣布推出一个全新的大模型服务平台 —— 词元所。李彦宏表示，当一个开发者或者一家企业，真正想把模型用起来的时候，往往会发现模型越多，选择越困难。同一款模型有的贵，有的便宜，来源五花八门，质量参差不齐，选来选去就是不放心，不敢用。词元所就是为了解决这个难题而生，宣称是一个中立、可信的大模型交易平台。李彦宏介绍称，这个交易所可以类比证券交易所。证券交易所吸引好的公司上市，让投资人发现和投资好的公司；词元所则是希望汇聚好的模型和模型提供商，让企业和个人能够便捷地找到购买和使用可信的模型。IT之家在大会现场了解到，词元所宣称会对模型资源做全面的准入测试，覆盖模型、指纹比对、模型能力测试、性能指标测试、可用性测试等，还会对模型质量参数持续监测。通过这些手段，词元所尽可能把偷换模型、虚标参数这样的动作都挡在门外，确保进来的每一家模型资源都是有保证的。词元所也会对模型提供方在服务质量、兑现度、安全合规、商业履约等多个维度打分，并给出信用评级标签。对于那些信用下降的模型提供方，词元所会在第一时间主动提醒用户。而这些所有的数据都会沉淀为公开可查的信用档案。词元所上线一个月，供应资源数已超过 100 个，日均调用 Token 数已突破 7000 亿。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/025/903.htm", "publishedAt": "2026-11-12T02:52:44+00:00"}, {"title": "Claude API 新增调节 effort 能力：让 AI 按任务使劲，从闲聊转复杂分析可中途“换挡”", "summary": "IT之家 11 月 12 日消息，Anthropic 为 Claude API 新增一项 Beta 功能，开发者可以在消息中调整 effort。这意味着，同一段对话不必始终沿用相同设置，开发者可根据后续任务需要，中途改变模型回答的“努力程度”。IT之家注：effort 可以理解为让 Claude 回答问题时，“投入多少功夫”的档位。它帮助开发者在回答的充分程度、响应速度和使用成本之间做取舍。effort 调整的不只是最后写多少字，还会影响模型在思考、调用工具和组织回答等环节的资源投入。在操作方面，用户可以在消息序列中插入一条内容为空的 system 消息，并通过新的 output_config.effort 设置目标等级。整个过程无需改动顶层配置，提示缓存仍可命中。在生效时间方面，该设置不会修改已经生成的内容，将从下一条带有新输入的用户消息起，作用于后续回答。因此，开发者需要留意调整消息的插入位置，以及下一次用户输入出现的时点。在实际场景中，用户可以设置一段对话前半部分用于简单问答，后半部分转向复杂分析时，便可在任务切换处设置新的努力等级，而不必修改顶层配置。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/025/894.htm", "publishedAt": "2026-11-12T02:23:54+00:00"}, {"title": "百度李彦宏：人工智能的下一幕是智能组织，组织智能将是企业最深的护城河", "summary": "IT之家 11 月 12 日现场消息，在今日的百度世界大会 2026 活动中，百度创始人李彦宏发表演讲，预言人工智能的下一幕是智能组织。李彦宏表示，在十年前的 2016 年他做了一个判断，说下一幕是人工智能。那一年的百度世界大会主题为“人工智能是新电能”。今天这句话肯定已经变成了一个共识。我们回看 2016 到 2026 这十年，也正是人工智能技术形成独立技术栈的十年。李彦宏介绍称，传统 IT 技术栈一般认为是三层架构，包括底层的芯片、中间的操作系统，再加上上层的软件。但是 AI 时代的技术栈是以 GPU 为核心的，芯片层上面叠加了云基础设施，云上面又是模型层，模型上面是以智能体为核心的应用层。“业界也有所谓的五层蛋糕理论，代表人物是英伟达创始人黄仁勋，他在这个四层架构之上加了一个能源层。”李彦宏表示，如果说 AI 技术的上游是能源的话，那 AI 技术的下游是什么？他认为是组织能力，是一个不同于现在通行科层制的 AI 原生组织体系，把它叫做智能组织。如果 AI 是新的电能，那么智能组织就是 AI 时代新的厂房，是生产力真正发生的地方。只有匹配 AI 各种新能力的组织方式落地了，生产力才会大幅度提升，经济才能加速成长。李彦宏呼吁，任何一个企业都不能够只把 AI 当成个人提效的工具，而是要让数字员工真正地进入业务，进入到销售、客服、研发、运营等各个环节。IT之家在大会现场获悉，李彦宏表示“组织智能是企业最深的护城河”，提到了新的组织进化三原则：打破岗位边界，释放组织活力沉淀隐性知识，构建组织智能设计流程闭环，推动组织进化", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/025/881.htm", "publishedAt": "2026-11-12T01:54:29+00:00"}, {"title": "让 AI 直接回复用户 UI 界面：谷歌开源跨平台协议 A2UI 1.0 版本上线，字节跳动已用上", "summary": "IT之家 11 月 12 日消息，A2UI 是谷歌在 2025 年底公布的一份生成式 UI 开放协议，让智能体不仅能回复用户文字，还能直接回复 UI 界面内容。今日，谷歌正式发布了 A2UI 1.0 版本，这是该协议的首个稳定版。开发者现在可以搭配开源的网页、Android 和 iOS 渲染器 SDK 以及 Python、TypeScript 和 Dart 的智能体 SDK 一起使用。Atlassian、Alation、彭博社、字节跳动等公司已经开始利用它进行开发。谷歌介绍称，在 A2UI 中，智能体负责描述要显示的内容，每个应用都可以用自己的原生组件绘制 UI。无论用户是在公司自有应用中接入智能体，还是通过托管 MCP 应用的第三方 AI 助手（如 Gemini 或 Claude）都能获得同样的低延迟、高信任和完全的原生保真度。▲ 同样的请求通过文本和 A2UI 回答，然后在笔记本电脑上也用同样的视图IT之家从谷歌官方博客了解到，A2UI 1.0 版本增加了双向功能调用，还增加了对可访问性和对额外元数据的扩展支持。开源渲染器可以在网页上用 React、Angular 和 Lit 绘制 A2UI 屏幕；用 Flutter 在移动端、网页端和桌面端渲染；以及 iOS 平台的 SwiftUI 和 Android 平台的 Jetpack Compose。网页和 Flutter 渲染器也运行在 MCP 应用内，因此 A2UI 内容可以出现在支持 MCP 应用的 AI 助手中，如 Claude 和 Gemini。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/025/862.htm", "publishedAt": "2026-11-12T01:08:04+00:00"}, {"title": "谷歌推出 Gemini Decisions API 快速多模态决策，基于 Gemini Decision 1 模型", "summary": "IT之家 11 月 12 日消息，谷歌昨日宣布推出 Gemini Decisions API 快速多模态决策，由全新 Gemini Decision 1 模型驱动。该 API 可在 1 次快速处理过程中，对文本、图像、视频和 PDF 内容进行至多 1000 项是非判断、选项选择和标准评估。据介绍，Gemini Decisions API 专为工具选择、策略检查、模型路由和上下文质量评估等决策任务打造，开发者可以输入 1 份包含文本、图像、音频、视频和 PDF 的多模态内容（最多支持 256K Tokens），并针对这份内容提出最多 1000 个相互独立的问题。同时，Gemini Decision 1 会通过一次前向计算对候选选项进行评分，并返回概率和置信度分数。整个处理过程的延迟为 150 至 250 毫秒，输入价格为每 100 万 Tokens 0.10 美元（IT之家注：现汇率约合 0.67 元人民币），输出 Tokens 则不收取费用。此外，该 API 基于 Gemini 原生多模态架构构建。开发者可以在同一份输入中组合不同模态的内容，例如将通话录音与账户元数据结合，或将扫描版 PDF 理赔文件与受损照片放在一起。此外，还可以调整图像和视频输入的分辨率，以控制视觉细节和 Token 成本。目前该 API 已在 Google AI Studio 提供，开发者可获得免费额度进行原型开发。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/025/858.htm", "publishedAt": "2026-11-12T00:55:39+00:00"}, {"title": "88% 受访开发者点头赞成：FreeBSD 组建工作组制定 AI 使用新规", "summary": "IT之家 11 月 12 日消息，FreeBSD 项目近日公布 2026 年第三季度工作进展报告，收录 51 项进展，涵盖 AI 辅助开发、安全合规、虚拟化管理及桌面体验等领域。其中，如何为 AI 参与开源开发划定边界，成为本季度的重要议题。一项面向 140 名开发者的调查显示，88% 的受访者支持制定正式政策或提供指导原则，91% 认同即使使用 AI，人类仍须承担责任。对于 AI 辅助代码，35% 主张必须披露，25% 要求采取比人工代码更严格的审查，16% 倾向直接拒绝；65% 支持在人工审核后采用 AI 生成的文档。项目已成立 AI 工作组，预计第四季度提交最终报告，目前尚未公布正式政策。安全方面，FreeBSD 持续推进欧盟《网络韧性法案》（CRA）适配准备，完善漏洞处理流程，并开发软件物料清单（SBOM）工具，帮助追踪系统组件、依赖及许可证信息。相关基础系统方案仍在评审，尚待整合。使用体验方面，FreeBSD 还开发了一个用 Freepascal / Lazarus 编写的 Bhyve 虚拟机管理程序的图形用户界面 (GUI)。这个名为 Bhyvemgr 的 GUI 进展顺利，将有助于管理 Bhyve 虚拟机：在 Web 管理 / 用户界面方面，Sylve 作为 FreeBSD 的统一系统管理平台，依然保持着相当流畅的外观，用户可以通过 Web 浏览器进行操作。上个季度新增了存储选项、数据中心 / 集群功能等。FreeBSD 也在持续改进操作系统的桌面安装体验，并进一步优化桌面使用体验。此外，还对系统挂起 / 恢复功能和音频堆栈进行了改进。这份报告显示，FreeBSD 正同步推进开发规范与系统易用性建设，但其中多项工作仍处于开发或评审阶段，并非全部已经交付。IT之家附上参考地址FreeBSD Status Report Third Quarter 2026", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/025/845.htm", "publishedAt": "2026-11-11T23:53:14+00:00"}, {"title": "谷歌最强模型 Gemini 4 Carbon 全面开放：一夜重写 OpenCode 桌面应用、价格仅为 Fable 5.2 的 1/4", "summary": "点击查看原文>", "sourceNam 月 11 日）作客 Sources 播客节目时，亚马逊云计算业务 AWS 首席执行官马特 · 加曼（Matt Garman）表示，未来 10 至 20 年内，太空数据中心很难在经济性和实际运营层面达到可行要求。图源：Sources 播客节目截图太空数据中心的构想，是将计算设备送入轨道，利用太阳能为 AI 计算供电。但加曼认为，从概念走向商业运营，仍需跨越发射成本、运载能力、散热和设备维护等多重障碍。技术上虽然能够实现，并不意味着成本足以支撑大规模应用。加曼首先关注的是运输能力。太空数据中心需要送入轨道的，不仅是服务器和 GPU，还包括太阳能电池板、散热设备与通信系统。发射成本和发射频率，都会直接影响整套方案能否成立。加曼以重量可能达到一吨的 GPU 服务器机架为例，说明大规模部署所需的运力。他认为，即便未来火箭单次能够运送约 100 吨有效载荷，建设大型计算设施仍需要大量发射任务；若要具备商业可行性，发射频率可能至少需要达到每天一次。散热是另一个关键障碍。据相关报道，加曼提醒，太空接近真空，不能像地面机房那样，直接利用周围空气带走热量。计算设备产生的废热，需要通过散热系统传递到辐射面，再向外释放。当计算设施扩大到数百兆瓦乃至吉瓦级别时，配套散热系统的面积、重量和成本，也可能成为大型工程问题。加曼还强调了维护问题。地面数据中心的服务器、电源或 GPU 发生故障，可以由技术人员更换；设备进入轨道后，维修和替换将复杂得多，某些故障甚至可能导致整颗卫星被放弃。与此同时，太空辐射对电子元件的影响，也需要额外防护设计。马斯克则寄望于 SpaceX 的星舰降低运输门槛，并通过轨道设备设计解决散热问题。他此前在 X 平台表示，太空散热未必比地面更困难，关键在于散热器的材料、温度和朝向；按照他的说法，背向太阳的铝制散热器可实现每平方米约 1300 瓦的热辐射能力。对于当前的 AI 需求，加曼表示亚马逊正以每 14 秒一块 GPU 的速度向数据中心部署硬件，但需求仍远超供给。他预计，即使持续大规模投入，AWS 未来两年仍将面临算力容量不足。加曼称，如果愿意，AWS 现在就能将计划于 2027 年到位的全部计算加速器所对应的算力提前售出。不过，公司选择保留部分容量，留给后续出现的企业和初创客户。AI 使用成本下降，也未必能缓解算力紧张。加曼表示，AWS 观察到，AI 推理成本每降低 50%，使用量便会出现数量级增长。换言之，调用 AI 越便宜，客户可能用得越多，继续推高计算需求。快速扩容也带来资金压力。报道称，亚马逊预计 2026 年现金资本支出约为 2,200 亿美元（IT之家注：现汇率约合 1.47 万亿元人民币）；截至 9 月 30 日的过去 12 个月，自由现金流为净流出 424 亿美元（现汇率约合 2,834.78 亿元人民币）。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/025/888.htm", "publishedAt": "2026-11-12T02:09:55+00:00"}, {"title": "华为余承东：希望通过 OSTA 星芒全新品牌，探索更多 AI 新可能", "summary": "IT之家 11 月 12 日消息，华为旗下全新品牌“OSTA 星芒手机”官方微博账号今日发布了其第一条内容，华为常务董事、产品投资评审委员会主任、终端 BG 董事长余承东不久后转发了这条微博。余承东表示：“欢迎“星”朋友！看到大家对 OSTA 星芒#的关注和期待，我们希望通过这个全新品牌，探索更多 AI 新可能！11 月 20 日发布会，我们接着聊！”据IT之家此前报道，华为昨日宣布，鸿蒙智行享界 V8 及星芒品牌发布会定档 2026 年 11 月 20 日 14:30。结合此前爆料，星芒首批产品预计包括 OSTA O1 和 OSTA O1 Pro 两款机型。其中 O1 Pro 采用“阔直板”形态，配备 6.39 英寸 1.5K LTPS 直屏，屏幕比例约为 16:9.5，边框宽度约 1.05 毫米，搭载麒麟 9 系芯片，存储最高可选 16GB+1TB，提供星空黑、星云白、星芒紫三款配色。渠道方面，星芒并非纯线上品牌，线上线下均会销售，线上依托华为现有店铺，线下进驻华为体验店；首批备货规模有限，16GB 高配版本仅线上销售，12GB 版本全渠道铺货。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/025/880.htm", "publishedAt": "2026-11-12T01:41:34+00:00"}, {"title": "cc4g-AI 编程工具 Web 集成平台 ms": [{"title": "李彦宏：百度内部每天的活跃智能体数一年内增至 3.7 万，涨了 6 倍多", "summary": "IT之家 11 月 12 日现场消息，在今日举行的百度世界大会 2026 活动中，百度创始人李彦宏表示，去年百度世界大会上他提出“内化 AI 能力，打造原生 AI 组织”。李彦宏透露，百度内部每天的活跃智能体数（IT之家注：即 DAA）一年内从日均 0.5 万增长到 3.7 万，涨了 6 倍多。智能体执行的有效任务完成数，从每周平均 8.4 万个增长到超 100 万个，涨了 11 倍。百度已经建设 4300 个 Workspace，组织 Skill 累计沉淀超过 2 万个。李彦宏认为，这些组织的好经验、好方法沉淀下来，可以让更多同学能够复用，让智能体能够调用。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/025/900.htm", "publishedAt": "2026-11-12T02:38:33+00:00"}, {"title": "百度李彦宏：未来的岗位不会消失但会收敛，大致会分为两类", "summary": "IT之家 11 月 12 日现场消息，在今日的百度世界大会 2026 活动中，百度创始人李彦宏发表演讲，预言未来的岗位不会消失但会收敛。李彦宏认为，未来，岗位不会消失但会收敛，大致会分为两类岗位：一类是 Builder，负责创造新东西；另一类是 Seller，负责人与人之间的沟通和连接，让对方对你产生情感、建立信任。IT之家在大会现场获悉，李彦宏表示“组织智能是企业最深的护城河”，提到了新的组织进化三原则：打破岗位边界，释放组织活力沉淀隐性知识，构建组织智能设计流程闭环，推动组织进化李彦宏表示，去年百度世界大会上他提出“内化 AI 能力，打造原生 AI 组织”。一年来，百度内部每天的活跃智能体数，也就是 DAA，从日均 0.5 万增长到 3.7 万，涨了 6 倍多；智能体执行的有效任务完成数，从每周平均 8.4 万个，增长到一周超过 100 万个，涨了 11 倍。百度已建设 4300 个 Workspace，组织 Skill 累计沉淀超过 2 万个。李彦宏称，“这些组织的好经验、好方法沉淀下来，可以让更多同学能够复用，让智能体能够调用。让一个人的经验，成为整个组织的能力。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/025/891.htm", "publishedAt": "2026-11-12T02:13:27+00:00"}, {"title": "美联航拒绝 AI 代订机票：能查航班，不能替你下单", "summary": "IT之家 11 月 12 日消息，科技媒体 The Verge 今天（11 月 12 日）发布博文，报道称美国联合航空表示，出于隐私和监管方面的考虑，不允许个人 AI 助手代旅客购买机票。AI 仍可向用户展示美联航航班，但不能代表用户完成交易。IT之家援引博文介绍，美联航担心，能够代人操作网站的 AI 智能体可能泄露客户信息，或在未准确理解用户意愿的情况下下单。此外，航空服务涉及必须向旅客告知的信息及相关确认程序，例如确认行李中不含爆炸物；由 AI 代为操作，可能带来合规问题。图源：WikiMedia这项决定背后也有对新增交易中间环节的顾虑。据《华尔街日报》报道，美联航首席执行官斯科特 · 柯比在周二的一场活动上表示：“坦白说，我不想再增加一个中间人。”美联航并非唯一对 AI 智能体设限的企业。The Verge 指出，eBay 似乎已阻止此类代理浏览网站，多家大型银行也采取了限制措施。该媒体认为这些门槛可能压缩个人 AI 助手从“提供建议”走向“代办交易”的实际用途。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/025/879.htm", "publishedAt": "2026-11-12T01:39:34+00:00"}, {"title": "瞄准后智能手机时代：OpenAI 奥尔特曼有意联合三星打造下一代 AI 设备，让 AI 主动管理现实与数字生活", "summary": "IT之家 11 月 12 日消息，韩国《金融新闻》昨日报道称，OpenAI CEO 萨姆 · 奥尔特曼（Sam Altman）在一场座谈会上向三星集团高管提议，希望双方紧密合作，共同开发下一代 AI 设备。奥尔特曼认为，下一代 AI 设备将成为智能手机的后继形态，AI 将逐步取代传统应用，主动管理用户的数字生活和现实生活。这场座谈会于当地时间 10 月 31 日在韩国京畿道龙仁市的三星人力资源开发中心举行。面对三星高管提出的“什么样的设备将成为 AI 伴侣”这一问题，奥尔特曼回答称“那将是智能手机的下一个版本”。他表示，OpenAI 希望与三星紧密合作，共同打造下一代 AI 设备。奥尔特曼描述的下一代设备并非以传统 App 为中心，而是让 AI 主动获取信息、管理用户的现实生活和虚拟生活，同时尽可能减少对用户的打扰。他还表示，这类设备将能够感知和获取物理世界的信息，但隐私保护以及用户对 AI 的过度依赖，需要由整个社会共同管理。当谈及 AI 眼镜时，奥尔特曼表示，这类产品在提升个人生产力方面可能具有很大价值，但其社交体验却难以评价。他举例称，如果一个人在交谈时带着摄像头注视对方，可能会让人感到不适。除了下一代硬件，奥尔特曼还向三星高管提出了企业 AI 转型建议，强调企业应当全面投入 AI，而不是仅将其作为员工提高效率的辅助工具。他认为，如果 AI 只是帮助员工完成原有工作，生产力可能提升 2 至 3 倍；如果将整个工作流程交由 AI 处理，生产力提升幅度则可能达到 100 倍。奥尔特曼介绍，OpenAI 大约三个月前开始在公司内部的各项工作和服务中全面引入 AI。员工只需向 AI 输入任务优先级，系统便会综合相关上下文信息并处理任务。他还以 OpenAI 编程智能体 Codex 为例称，当有人提出增加人员的需求时，Codex 甚至会反过来要求对方证明为什么 AI 无法完成相关工作。奥尔特曼认为，AI 已经开始具备承担部分管理决策的能力。对于企业转型的时间窗口，奥尔特曼以移动互联网时代为例发出警告。他表示，当年率先转型的企业得以存活，而晚一两年行动的大多数企业都被市场淘汰。他认为，企业必须尽快完成 AI 转型，未来 3 至 5 年内，如果缺乏 AI 基础能力，将很难继续保持竞争力。IT之家查询获悉，此次座谈会旨在提升三星集团 AI 转型（AX）负责人的战略判断能力和执行力，约 50 名来自三星电子、金融和生物科技等主要关联公司的高管出席。与会者还向奥尔特曼询问了 AI 大规模应用面临的最大瓶颈，以及企业在持续投入 AI 的同时如何应对盈利压力等问题。相关阅读：《OpenAI CEO 奥尔特曼警示：未来人类可能无法从 AI 手中夺回控制权》《OpenAI CEO 奥尔特曼密访韩国，深化与三星、SK 集团 AI 芯片与数据中心合作》《英伟达在韩举办 AI Day 活动，韩国政府、三星、LG 电子、现代汽车集团等排队合作》《韩国公布该国史上最大规模预算案，重点投向人工智能与半导体》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/025/860.htm", "publishedAt": "2026-11-12T01:02:19+00:00"}, {"title": "如何提升 AI 的环境可持续性", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/GUXzTTTFvwWY7yx6WMyS?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-11T18:33:00+00:00"}, {"title": "Agent 从 Demo 到生产，究竟还差几步？4周实战课来了", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/gzNdPqAMp1Wh1JQ9d2JA?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-11T12:02:05+00:00"}, {"title": "Agent自演进驶入“双轨时代”！openJiuwen首发TTSE经验学习框架", "summary": "让每一次任务，都成为下一次进步的起点", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/508998.html", "publishedAt": "2026-11-10T07:56:29+00:00"}]}]};

const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
