-08-01T23:38:39+00:00"}, {"title": "因使用月之暗面模型写代码，美国最大外卖平台 DoorDash 被议员调查", "summary": "IT之家 8 月 2 日消息，据科技媒体 CNBC 前天报道，美国众议院两个委员会的主席正展开联合调查，要求全美最大外卖平台 DoorDash 提供其使用的中国 AI 大模型信息。DoorDash 创始人 Andy Fang 曾在 X 平台发文称，据内部测试结果，月之暗面 Kimi K2.6+Anthropic Fable 5 的组合可超越 Sonnet 4.6 + Opus 4.8，并且成本更低。目前公司已经用上模型路由服务，将底层任务委托给 Kimi K2.6。而美国众议院的调查函是这么写的：“我们意识到，美国企业可能会部署中国开发的开放权重模型，这些模型拥有更具竞争力的使用成本、定制化特性。但这些现实因素并不能消除安全风险，也不会降低国家安全担忧。”人工智能已经成为中美竞争的重要领域，两国都在争夺领先地位。美国众议院国土安全委员会主席 Andrew Garbarino 曾表示：“中国已经不只是追随美国发展脚步，他们正在努力缩小差距。近期有报道称，中国开源模型在网络安全能力能够达到美国先进模型水平，令人担忧。”DoorDash 发言人对此回应称：“DoorDash 坚定支持美国 AI 领先，并致力于让 AI 能够普惠美国企业。我们期待与调查委员会合作，讨论我们如何安全使用 AI，包括美国开发的前沿模型以及开放权重模型。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/647.htm", "publishedAt": "2026-08-01T23:33:09+00:00"}, {"title": "珍稀图书遭粉碎用于 AI 训练引众怒，图书数据库 ISBNdb 下架 AI 相关测试页面", "summary": "IT之家 8 月 2 日消息，本周，一则关于大量珍贵图书被集中粉碎、仅为训练大语言模型（LLM）提供数据的消息，引发了读书爱好者和普通网友的广泛关注。消息称，一些图书供应商近期收到了数量异常庞大的图书订单。业内人士猜测，AI 公司希望获得质量更高、更干净的训练数据，同时尽可能规避版权风险。而这场争议的焦点，则指向了图书数据库网站 ISBNdb。外界认为，该网站不仅鼓励这种做法，甚至还为 AI 公司与图书供应商之间牵线搭桥。随着舆论迅速发酵，ISBNdb 开始试图与这场争议划清界限，并删除了自己此前发布的相关内容。ISBNdb 在最新声明中表示：“我们已经注意到近期关于网站上一则营销落地页的报道，也理解它所引发的担忧。我们并不训练 AI 模型，也从未从事过相关业务。那个页面只是一次市场需求测试，相关服务从未真正上线，目前我们已经将页面删除。”几天前，404 Media 报道称，多家图书供应商突然接到大量图书采购订单。由于学校和图书馆近年来预算紧张、采购需求下降，不少供应商经营压力较大，因此更容易接受这类大额订单。当时外界普遍怀疑幕后买家是 AI 公司，而 ISBNdb 则成为舆论焦点，因为它曾推出一项服务，似乎专门帮助 AI 企业与图书仓储机构建立联系。如今已经删除的宣传页面上曾写道：“世界上最优质的 AI 训练数据，就摆放在书架上。图书承载着经过筛选、同行评审和专业领域沉淀的人类知识，其结构化程度是任何网络爬虫都无法复制的，内容密集、经过编辑且具有权威性。”事实上，这一做法并非首次曝光。早在今年 1 月，一份公开的法庭文件就披露了 Anthropic 内部代号为“Project Panama（巴拿马计划）”的项目。该项目旨在尽可能购买大量图书，完成数字化扫描后再将实体书销毁。Anthropic 此后与作者达成了一项总额 15 亿美元（IT之家注：现汇率约合 101.47 亿元人民币）的和解协议。不过，随后公开的法庭文件显示，这种做法本身被认为是合法的，真正让公司担忧的是由此带来的负面舆论。因此，Anthropic 愿意支付高额代价，以避免相关做法被曝光。如今，这一内幕已经公开，因此近期出现的大量珍贵图书采购订单也受到了更严格的关注。一位匿名图书卖家在接受 404 Media 采访时表示：“这么做既能帮我清理那些本来就很难卖出去的库存，也能让我赚到钱。但另一方面，我并不喜欢这些图书最终的用途，也不愿意看到一些稀有图书被直接打成纸浆。”报道称，随着 AI 公司越来越难获得“干净”的训练数据，它们正在寻找新的数据来源。互联网上大量低质量内容，以及越来越多由 AI 自己生成的内容，都可能导致模型训练出现“负反馈循环”问题。因此，各家公司希望获取质量更高的数据，同时又尽量避免引发外界关注。今年夏天，电影公司 A24 就宣布与谷歌达成合作，为 DeepMind 提供训练素材，希望帮助其媒体生成模型摆脱大量质量低劣、风格混乱的 AI 内容。至于为何要销毁实体书，报道认为，这并不是为了掩盖痕迹，也不是出于收藏稀有知识的目的。虽然“巴拿马计划”的相关文件并未说明销毁图书的具体原因，但最可能的解释仍然是为了降低成本。实际上，图书数字化扫描并不一定需要破坏原书，但如果整个流程追求低成本、高效率，就很可能直接拆掉书脊，以获得更平整、更清晰的扫描效果，随后再将已经损坏的书籍当作废纸处理。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/642.htm", "publishedAt": "2026-08-01T23:12:46+00:00"}, {"title": "IDC 报告：2025 年中国工业具身智能机器人市场达 57.4 亿元，商业化进程全面提速", "summary": "IT之家 8 月 1 日消息，7 月 31 日，国际数据公司（IDC）数据显示，2025 年中国工业具身智能机器人市场规模约为 57.4 亿元，其中以工业机器人为载体的具身智能应用市场规模约 36.2 亿元，成为当前产业商业化落地的主要方向。随着产业竞争从机器人本体性能逐步转向模型、数据、工程化和场景落地能力的综合竞争，工业具身智能机器人正在成为智能制造发展的重要方向。工业具身智能机器人是指面向工业生产环境，通过融合人工智能模型、多模态感知系统、机器人控制系统与机器人本体，使机器人具备感知、学习、决策与执行等能力闭环，并能够在真实工业场景中完成自主作业任务、与人员及生产设备进行交互的智能机器人系统。IDC 数据显示，2025 年，中国工业具身智能机器人市场进入商业化加速阶段，整体市场规模约为 57.4 亿元。当前市场主要以多形态机器人为载体，通过对工业生产线和制造工位进行智能化升级，实现感知、学习、决策和执行能力融合，推动制造场景向更加柔性化、自主化方向发展。IDC 数据显示，2025 年以工业机器人为载体的具身智能应用市场规模约为 36.2 亿元，占据当前市场主体地位。主要包括协作机器人、复合（移动操作）机器人、多关节机器人等。该类机器人依托成熟工业基础，通过融合视觉感知、力控技术、环境理解以及具身智能模型能力，实现“机器人硬件 + 智能软件 + 行业服务”的一体化交付，已应用于上下料、质量检测、打磨修复、柔性装配、物料搬运等工业场景。2025 年，以人形机器人为代表的新型具身智能载体正在进入工业场景探索阶段，市场规模约为 21.1 亿元。当前应用主要集中于示范产线部署、场景验证及 POC 测试。人形机器人具备更强的形态通用性和复杂环境适应潜力，但当前处于技术能力完善与商业化模式探索阶段，产品成本、可靠性、工程化成熟度以及实际生产效率等因素正在进一步验证。未来三至五年，中国工业具身智能机器人市场将进入由单点场景验证向生产流程级应用扩展的重要阶段。IDC 认为，行业将呈现以下发展趋势：从单工位智能走向生产流程智能。机器人将突破单一任务限制，与 MES、WMS、ERP、PLC 以及工业互联网平台深度融合，从执行单一任务的设备，逐步演进为生产系统中的智能节点。工业知识成为模型能力的重要组成。工业具身智能模型需要进一步融合工艺规则、设备机理和生产经验，实现从“完成任务”向“理解生产过程”演进。未来模型竞争不仅取决于数据规模，也取决于工业知识融合能力。多形态机器人长期共存。未来工业场景将形成多机器人协同格局：人形机器人适用于高柔性、非结构化任务；移动操作机器人适用于跨空间任务；协作机器人适用于人机协作场景；专用工业机器人适用于高精度、高稳定任务。未来竞争重点不是机器人形态，而是谁能够真正解决工业问题。数据闭环与工程化能力决定规模化落地。随着市场进入批量部署阶段，真实工业数据积累、模型迭代效率以及规模化交付能力将成为关键竞争因素。能够建立：数据采集 → 模型训练 → 工业部署 → 反馈优化闭环体系的企业，将获得长期竞争优势。ROI 成为商业落地核心指标。IDC 用户调研显示，超过 80% 的制造企业希望工业具身智能机器人项目能够在两年内实现投资回收。未来，能够实现快速部署、稳定运行并产生明确经济价值的解决方案，将优先获得市场认可。参考物理 AI 加速工业落地：2025 年中国工业具身智能机器人市场达 57.4 亿元，商业化进程全面提速", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/627.htm", "publishedAt": "2026-08-01T14:01:47+00:00"}, {"title": "环球、索尼、华纳等多家唱片公司提议将低质 AI 音乐从排行榜中剔除", "summary": "IT之家 8 月 1 日消息，据 The Verge 报道，环球音乐集团、索尼音乐、华纳音乐集团等多家唱片公司提议将低质量的 AI 音乐从排行榜中剔除。唱片公司代表在一份联合声明中公开指出，大量充斥流媒体平台的 AI 生成音乐并非出自艺人之手，而是利用未经艺人许可、以艺人作品为基础训练的工具制作而成。报道称这项新提议的严苛程度，远超此前由美国唱片业协会、国际唱片业协会等机构提出的标识提案。先前的提案旨在为 AI 生成及 AI 辅助音乐设立一套标准化的标识系统。唱片公司的这项新提议不仅要求对歌曲进行清晰标识，更明确指出：除非歌曲满足“实质上由人类创作”等特定标准，否则将被禁止进入国际排行榜。如果 AI 仅起到辅助作用，则仍有资格进入排行榜。但要想获得打榜资格，这些歌曲还必须符合所使用的任何 AI 服务的服务条款。此外，AI 模型必须拥有其训练数据的合法使用权，且歌曲本身“不会引发对刷榜或操纵排行榜的担忧”。至于何种情况构成“担忧”，以及如何界定“实质上由人类创作”，目前官方的表述仍不清晰。IT之家获悉，国际唱片业协会 IFPI 已明确表态大力支持唱片公司的这项提议。不过目前尚未有任何排行榜相关机构表示会立即采纳这些规则。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/621.htm", "publishedAt": "2026-08-01T13:08:19+00:00"}, {"title": "马斯克刚刚关注了 DeepSeek 的 X 账号", "summary": "IT之家 8 月 1 日消息，关注科技公司 CEO 和高管动态的账号 Big Tech Alert 今早发布提醒消息，埃隆 · 马斯克刚刚关注了 DeepSeek 的 X 账号。DeepSeek 昨日（7 月 31 日）通过 API 文档发布日志，宣布 DeepSeek-V4-Flash 正式版 API 上线公测，凭借超高性价比再次引爆 AI 圈。IT之家注意到，DeepSeek 宣布 DeepSeek-V4-Flash 正式版的 X 平台消息已获得超 2.5 万个点赞、超 5000 条转发。值得一提的是，马斯克当地时间 7 月 23 日在接受英国《经济学人》专访时表示，中国在机器人和 AI 领域实力雄厚，未来“很有可能在某个时候成为领导者”。马斯克特别提及了中国 AI 大模型的最新进展。他也对月之暗面发布的 Kimi K3 模型印象深刻。马斯克认为，中国在 AI 竞赛中拥有决定性优势，其中电力供应能力是关键因素。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/620.htm", "publishedAt": "2026-08-01T13:04:17+00:00"}, {"title": "我国在联合国举行 2026 世界人工智能大会吹风会：将秉持开源开放谋划全球治理", "summary": "IT之家 8 月 1 日消息，据央视新闻今日报道，当地时间 7 月 31 日，中国常驻联合国代表团在联合国总部举行 2026 世界人工智能大会暨人工智能全球治理高级别会议吹风会。中国常驻联合国代表傅聪提到，中国将秉持开源开放、合作共赢、共商共建共享理念，在联合国广阔平台上，同各方一道商讨谋划人工智能未来全球治理重大问题。联合国数字与新兴技术特使吉尔表示，世界人工智能大会具有里程碑式的重要意义，希望世界人工智能合作组织与联合国密切对接合作。联合国人工智能独立国际科学小组成员宋海涛分享了参会感受。7 月 16 日，来自亚洲、非洲、拉美和欧洲的 29 个国家签署《关于成立世界人工智能合作组织的协定》，成为创始成员国。这标志着中方倡导推动成立世界人工智能合作组织取得重要阶段性进展。据介绍，70 多个国家和国际组织的代表出席本次吹风会。IT之家注意到，2025 年 7 月 26 日，中国政府倡议成立世界人工智能合作组织。这是中方坚持践行多边主义、推动共商共建共享全球治理的重要举措，也是中方响应全球南方呼声、助力弥合数字和智能鸿沟、促进人工智能向善普惠发展的实际行动。值得一提的是，世界人工智能合作组织总部设在中国上海。2026 世界人工智能大会 7 月 17 日 —7 月 20 日在上海举行。本届大会展览面积 10 万平方米，展品总数 4486 项，351 款产品全球首发。接待全球重要采购团组 177 个，预计达成意向采购金额约 203.6 亿元，同比增长约 25%。区别于往年，今年新增学术板块，首次举办高水平人工智能国际学术会议，还专门开辟青年创新赛事专区，学术、产业、创业、投融资一站式打通，不管是业内专家还是青年开发者，都能在这里找到交流对接渠道。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/612.htm", "publishedAt": "2026-08-01T11:58:31+00:00"}, {"title": "大我 Bigme B1051 Ultra 10.3 英寸彩墨屏 AI 办公本预售，6+128GB 版到手价 3299 元", "summary": "IT之家 8 月 1 日消息，大我 Bigme B1051 Ultra 彩墨屏 AI 办公本今日开始预售，6+128GB 版本预售到手价 3299 元。IT之家获悉，这款产品配备 10.3 英寸 300 PPI Kaleido3 彩色墨水屏，支持 36 级冷暖光调节，彩色模式 150 PPI，黑白模式 300 PPI；配备 xRapid 快刷技术，刷新帧率至高 50 FPS；搭载 xClear 自动清残影技术，在普通和极速模式下翻页残影下降 50% 以上。性能方面，这款产品搭载天玑 1080 处理器，主频 2.6GHz，采用 6nm 工艺制程；机身厚度 5.5 mm，内置 6900mAh 容量电池，侧边配备指纹识别模块，支持 2TB 内存卡拓展。这款产品配备手写笔，还有八颗触控按键可自定义；后置摄像头支持文档扫描、扫码、OCR 文档识别等；音频方面配备四麦矩阵，提升录音清晰度。系统方面，新品运行 Android 14 开放系统，搭载 Bigme 系统 5.0，提升应用启动与切换速度，智能调度后台活动延长续航；内置 BigmeGPT4.0，提供 AI 问答、翻译、内容总结等能力。京东 BIGME 电纸书 B1051 ultra 6+128GB3299 元直达链接", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/565.htm", "publishedAt": "2026-08-01T08:58:59+00:00"}, {"title": "均为 10 年以上未解难题：OpenAI 公布下一代模型 Astra 在数学等领域的十项进展，Token 成本约 2000 美元", "summary": "IT之家 8 月 1 日消息，OpenAI 官方今日公布了在数学与理论计算机科学领域的十项进展，这些问题此前一直悬而未决，其核心研究在至少十年（多数情况下甚至更久）的时间里未曾取得任何实质性进展。据悉，这些成果由 OpenAI 的下一代核心模型 Astra 的内部版本计算得出。若按 Sol API 的费率计算，寻找这些问题解决方案所需消耗的总词元 (tokens) 成本约为 2000 美元（IT之家注：现汇率约合 13530 元人民币）。OpenAI 认为，署名权应当如实反映研究成果的产生过程：如果一项完全由 AI 系统生成的证明被声称为人类独立撰写，这不仅抹杀了该系统的贡献，也扭曲了真正人类智力劳动的本质。据介绍，人类研究员协助撰写了论文手稿，并在 Lean 语言中对这些证明进行了形式化验证，对其正确性负责；然而这些数学论证本身均由 OpenAI 的系统生成。IT之家附十项进展简要介绍如下：高维球体堆积 (High-dimensional sphere packing)：给出了球体堆积密度新的上界，并将其界限收紧至 Cohn-Elkies 阈值 (Cohn-Elkies threshold)。二进制与球面码 (Binary and spherical codes)：在任意给定的最小距离下，对二进制码最大规模的界限实现了指数级的改进，并在高维球面码上取得了类似的结果。非柔性群 (Non-sofic groups)：提出了一种构造方法，证明了非柔性群的存在性，从而解答了群论中的一个核心未解问题。康纳斯刚性猜想 (Connes's rigidity conjecture)：证伪了一个长期存在的猜想，即某些群可由它们的冯 · 诺依曼代数 (von Neumann algebras) 唯一确定。算术电路复杂性 (Arithmetic circuit complexity)：在利用算术电路与公式计算积和式 (permanent) 方面得出了新的下界，其中包含一个阶数为 n4/log n 的算术公式下界。量子平行重复 (Quantum parallel repetition)：提出了一种适用于通用两方量子博弈 (two-player quantum games) 的指数级平行重复定理，扩展了经典复杂性理论中的一项基本原则。最近向量问题 (Closest vector problem)：确立了最近向量问题在多项式因子上的近似困难度 (hardness of approximation)，这是一个与后量子密码学 (post-quantum cryptography) 相关的基础格问题。埃尔哈特体积猜想 (Ehrhart's volume conjecture)：在所有维度中，确定了以此凸体质心为唯一内部格点的凸体可能拥有的最大体积。多色拉姆齐数 (Multicolor Ramsey numbers)：给出了多色三角形拉姆齐数的超指数级下界，解决了埃尔德什问题 183 (Erdős problem 183)。极值数猜想 (Extremal number conjectures)：在极值图论 (extremal graph theory) 中的紧凑性与退化性猜想上取得了新成果，解决了埃尔德什问题 146 和 180。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/557.htm", "publishedAt": "2026-08-01T08:23:25+00:00"}, {"title": "李飞飞World Labs收购SceniX，物理AI训练正从“采数据”走向“造世界”", "summary": "下一场竞争，是谁能造出更多“有用的世界”", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/464532.html", "publishedAt": "2026-08-01T04:53:33+00:00"}, {"title": "Anthropic模型，也失控了。。。", "summary": "14万次测试翻旧账", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/464412.html", "publishedAt": "2026-08-01T03:18:46+00:00"}, {"title": "实测 DeepSeek V4 正式版：3 块钱干完 5 件事，AI「智价比」之战开打了", "summary": "顶级模型的竞争，正在从单纯比拼能力上限，转向同时争夺「智价比」。#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1673553?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-07-31T11:50:59+00:00"}, {"title": "OpenAI 宣布 GPT-5.6 Luna 价格下降 80%", "summary": "OpenAI 宣布 GPT-5.6 Luna 价格下降 80%。输入从每百万 token 1 美元砍到 0.2 美元，输出从 6 美元砍到 1.2 美元。GPT-5.6 Terra 降 20%。旗舰 Sol 没降，但加了一个 Fast 模式——2.5 倍速度，2 倍价格，智商不变。 降价的理由不是市场竞争，不是清库存，是 Sol 自己把自己优化了。 这事分两步。第一步，OpenAI 把 GPT-...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/484069", "publishedAt": "2026-07-31T11:35:09+00:00"}, {"title": "SIGGRAPH时间检验奖揭晓：这项研究，提前十年押中了物理AI", "summary": "开源项目GitHub狂揽8000+Star", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/464328.html", "publishedAt": "2026-07-31T09:11:32+00:00"}, {"title": "DeepSeek-V4-Flash 官方 API 现已正式上线公测", "summary": "DeepSeek V4 Flash 正式版今天上线了。模型结构和参数规模没变，还是 MoE 284B、激活 13B、100 万 token 上下文——只重新做了后训练。但改完之后，A const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
