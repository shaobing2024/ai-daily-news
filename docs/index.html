ndry 等平台形成竞争，并有助于 Meta 减少对外部 AI 服务的依赖。从微软整体 AI 业务来看，公司对少数科技企业客户的依赖程度同样较高。微软长期合作伙伴 OpenAI 在微软最近一个财年贡献了约 70% 的整体 AI 营收。除提供模型访问服务外，微软还提供 Copilot AI 助手以及面向 AI 工作负载的计算资源。Meta 与微软之间的合作并非始于当前 AI 热潮。微软此前曾为 Meta 提供 AI 开发所需的计算资源；在生成式 AI 热潮兴起之前，微软的 Bing 搜索也曾为 Facebook 的网页搜索提供支持。相关阅读：《Meta 借助 AI 大幅缩短应用开发周期，更多新应用已在路上》《Meta 首席 AI 官汪滔：有了 AI 赋能，初创公司挑战行业巨头从未如此容易》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/992/397.htm", "publishedAt": "2026-08-20T14:40:57+00:00"}, {"title": "中国信通院：全国已建成启用超 70 家具身智能训练场，覆盖过半省级行政区", "summary": "IT之家 8 月 20 日消息，据新华社今天（20 日）报道，中国信息通信研究院日前发布的《具身智能训练场研究报告（2026 年）》显示，近两年，在政策支持和产业需求的牵引下，我国具身智能训练场建设加速推进。据不完全统计，截至今年 6 月底，全国建成启用超 70 家训练场，在建或规划中的训练场为 46 家。具身智能训练场是一类面向具身智能研发和应用搭建的关键基础设施，在真实物理环境中支撑具身智能数据生产、模型训练、系统应用能力验证和迭代优化。报告显示，当前全国范围内掀起一轮具身智能训练场建设热潮，训练场建设已覆盖全国过半的省级行政区，形成以长三角、京津冀和珠三角为核心的三大集群。报告显示，具身智能训练场突破传统人工智能产业高度集聚于省会城市、直辖市和一线城市的发展模式，逐步向三线、四线乃至五线城市延伸，呈现出多层级城市协同布局的发展态势。IT之家获悉，这一布局特征反映出，训练场的选址逻辑正由传统的人才、资本积聚驱动，逐步转向以真实场景、数据供给和运营效率为核心的资源配置模式。场景建设将直接决定数据生产方向、能力训练重点和运营服务边界。报告显示当前，我国具身智能训练场建设总体呈现“以应用为牵引、以综合能力提升为目标”的特征，围绕工业制造、家庭服务、商业零售、医疗康养、特种应急等行业场景加快布局。其中含工业制造场景的训练场最多，占 86%。报告预测，随着具身智能技术逐步成熟、产业应用不断深化，训练场将在场景、数据、服务、运营、标准化等多维度持续演进，我国具身智能训练场将从建设热潮期向能力沉淀期稳步过渡。相关阅读：《产业链已初步成型，中国信通院联合发布具身智能训练场研究报告》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/992/357.htm", "publishedAt": "2026-08-20T13:18:37+00:00"}, {"title": "小鹏辟谣：近日网传我司部分车型辅助驾驶研发进度，相关信息为不实消息", "summary": "IT之家 8 月 20 日消息，小鹏集团官方微博 @小鹏辟谣 今日发文，称网传公司部分车型辅助驾驶研发进度，相关信息为不实消息，第二代 VLA 蒸馏上车工作正按计划有序推进。近日网传我司部分车型辅助驾驶研发进度，相关信息为不实消息。目前，第二代 VLA 蒸馏上车工作正按计划有序推进。后续如有最新进展，我司将第一时间通过官方渠道同步。据IT之家此前报道，在 3 月 2 日下午，小鹏第二代 VLA 智驾正式发布。第二代 VLA 通行效率相比传统 L2 级辅助驾驶及 Robotaxi 快 30%，还能看懂交警手势、自动减速配合查酒驾场景。小鹏集团董事长、CEO 何小鹏称，端到端小模型已经触及能力天花板，智驾研发来到“分水岭时刻”。小鹏汽车官方表示，自动驾驶本质是物理 AI 的问题。理解真实物理世界的运行规律，是小鹏图灵第二代 VLA 模型的起点。小鹏汽车第二代 VLA 模型已实现同一套模型打通中国与欧洲，目前正加快推进欧洲市场量产适配，目标 2027 年逐步向海外用户交付。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/992/356.htm", "publishedAt": "2026-08-20T13:17:48+00:00"}, {"title": "揭秘 OpenAI 的“终极野心”：让智能体像人类一样熟练操作电脑", "summary": "IT之家 8 月 20 日消息，据《商业内幕》今天（20 日）报道，OpenAI 员工乐观估计，公司正接近实现从创立之初就设定的目标：让 AI 智能体像人类一样熟练地操作电脑，尤其是使用浏览器。自 2015 年成立以来，OpenAI 一直希望实现这一能力，最大的难题之一是获得足够的训练数据。经过多年开发，公司现在已经有信心开始向客户逐步开放电脑操作功能。OpenAI 电脑操作团队经理阿里 · 韦恩斯坦指出：“一旦 ChatGPT 操作电脑和软件的速度超过你我，就会改变人们默认与电脑交互的方式。”OpenAI 最新模型从训练初期到后期的各个阶段，都加入了专门提升电脑操作能力的数据和训练流程。参与开发热门电脑操作智能体基准测试的哥伦比亚大学 AI 研究员周宇（音译）解释称，这些训练是在通用 AI 模型已有能力之上继续强化，让模型学会完成更多电脑任务。在最初的大规模基础训练阶段，OpenAI 很可能加入了逐帧屏幕截图，让模型提前接触有助于电脑操作的信息。进入后续训练阶段后，开发人员会向模型展示完成特定任务所需的正确操作。例如，要得到填写完毕的税务表格，或者完成一个物体的 3D 模型，就需要让模型学习对应的一系列电脑操作。其中一部分训练数据来自真人示范。OpenAI 公布 2025 年版电脑操作功能时曾透露，公司使用过由人类演示任务完成过程的数据集，但没有透露最新训练数据的具体情况。周宇指出，这类数据很昂贵，因为获取困难，整理成能够直接用于训练的形式也需要大量工作。OpenAI 很可能还利用强化学习继续提高模型的电脑操作能力，让模型反复尝试虚拟任务，并奖励成功完成任务的行为。周宇认为，模型可以学会更多执行这些“获得过奖励的操作”。OpenAI 也改变了模型实际操作电脑时获取信息的方式。韦恩斯坦表示，过去 ChatGPT 需要反复截取屏幕、分析像素、发送操作指令，再重新截屏分析。而目前在打开网站后，系统可以直接快速读取网页的底层信息，从内存结构、无障碍信息到链接关系都能应对。屏幕截图仍然是工作流程的一部分。用户开启电脑操作功能时，需要允许 ChatGPT 录屏，以便系统迅速识别当前显示的内容。韦恩斯坦表示，这些能力结合后，Codex 就能自行测试生成的代码、发现问题并继续修改，形成“完整闭环”。韦恩斯坦和负责 OpenAI 浏览器能力的詹姆斯 · 孙认为，电脑操作技术的一大价值，是让 ChatGPT 智能体能够进入互联网中大量彼此独立的服务和“长尾”网站。从预约网站、企业内部库存系统到社媒平台，许多在线工具起初就是为人类手动点击和输入而设计的。两人透露，已经有用户利用电脑操作功能自动处理数据录入、合规任务和日程安排。韦恩斯坦指出，OpenAI 模型能力提高后，也越来越能主动发现错误并自行修正，因此更容易把任务做完，也更不容易在网络环境中被无关内容带偏。周宇认为，目前电脑操作技术的速度距离普通消费者期待的水平仍有明显差距。“在训练数据非常充足的有限领域，电脑操作智能体确实可以表现得很好。想让它适应任何网页、任何应用程序和任何操作系统，仍然非常困难。”目前，电脑操作功能还不能迅速批量处理邮件回复，浏览社交媒体信息流时也显得较为迟缓。詹姆斯 · 孙和韦恩斯坦希望，随着 OpenAI 模型继续升级，电脑操作最终能够达到 AI 编程目前的效率，让 AI 直接操作网络工具比用户亲自动手更快。詹姆斯 · 孙表示：“对很多工程师来说，现在已经是让智能体写代码比自己写更快。根本不用权衡，直接让它做就行。我认为电脑操作以后也会越来越接近这种状态。”2025 年，OpenAI CEO 萨姆 · 奥尔特曼谈到早期电脑操作功能时曾公开示警：“实用价值很大，潜在风险也同样不小。我们建议只向智能体提供完成任务所必需的最低权限，以降低隐私和安全风险。”詹姆斯 · 孙表示，OpenAI 一直在研究“确认策略”，也就是 AI 执行下一步操作前，究竟应该在什么情况下向用户请求授权。目前的原则是，只要智能体准备向外传输数据或者删除内容，就必须先征得用户同意。网络工作往往需要连续快速地做出决定，因此 OpenAI 仍在寻找易用性和安全性之间的平衡。他坦言：“你可以把某个东西做到 100% 安全，但那样就非常非常难用了。也可以把它做得非常容易使用，但同时非常危险。所以我们真正想解决的问题，是如何做出既有帮助、又容易使用的产品。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/992/339.htm", "publishedAt": "2026-08-20T12:29:27+00:00"}, {"title": "泰坦军团 49 英寸 5 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
