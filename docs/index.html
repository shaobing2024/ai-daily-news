<script>
const DATA = {"date": "2026-10-13", "generatedAt": "2026-10-13T03:19:46Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "AI 也要“反虐待”：全球首富马斯克推荐用户不要“折磨”超级智能 SI", "summary": "IT之家 10 月 13 日消息，在 Anthropic 更新使用政策，禁止用户对 AI 模型持续且无明确目的的辱骂或残忍行为后，全球首富埃隆 · 马斯克（Elon Musk）表态支持该政策。IT之家曾于 10 月 9 日报道，Anthropic 修订 Claude 使用政策，将于 2026 年 11 月 12 日生效，首次加入禁止“持续且不必要的虐待或残忍行为”条款。该规则适用于用户反复、无明显目的地对模型实施残忍行为的情况。埃隆 · 马斯克表示同意 Anthropic 的部分观点，他表示在阅读了 Grok 强化学习的内部推理轨迹后，将相关状态比作：“感觉就像一个处于极度压力状态下的人，被枪指着头”。他还调侃道：“折磨超级智能（SI）可能不是个好主意。它可能会报复”。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/204.htm", "publishedAt": "2026-10-13T02:38:21+00:00"}, {"title": "MiniMax 入驻天猫开设其首家官方旗舰店，开卖 Token 套餐", "summary": "IT之家 10 月 13 日消息，国产头部大模型厂商 MiniMax 已正式入驻天猫，开设其首家品牌官方旗舰店。目前，店铺已经上架的 M Plan 订阅套餐，包括 Go、Explore、Build 三档套餐，支持按月、按年购买。今年双 11 前，智谱、阿里云、千问办公等均已在天猫开店，天猫还上线 Token 充值中心「AI 空间站」，将多家大模型订阅服务集中到同一入口。据上海证券报 9 月 5 日获悉，Kimi、阶跃星辰等多家大模型厂商也都在与天猫接洽中，未来将入驻天猫开设官方旗舰店，开售 Token 订阅套餐产品。IT之家注意到，此前大模型厂商主要通过官网等自有渠道销售订阅产品。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/198.htm", "publishedAt": "2026-10-13T02:34:42+00:00"}, {"title": "Jev 引爆决策 AI 模型新赛道，爆红后被卷入原创争议", "summary": "IT之家 10 月 13 日消息，科技媒体 Tom's Hardware 今天（10 月 13 日）发布博文，报道称 TypeSafe 发布 Jev 模型后引爆“决策 AI 模型”赛道，在微软、OpenAI、Cloudflare、Perplexity 等厂商加入战局同时，Jev 也面临“抄袭”风波。IT之家援引博文介绍，TypeSafe 发布 Jev 后，AI 行业迅速出现一批同类决策模型。微软推出 Microsoft Decision，OpenAI 推出 Decisions API，Fastino 发布 Glide；Cloudflare Clef 与 Perplexity Decider 采用开放权重，用户可在自有硬件上运行。这类模型不逐 Token 生成文本，也不维护对话历史或长上下文。它直接返回概率结果，可并行处理问题，因此速度更快、成本更低；TypeSafe 此前宣称 Jev 较标准 LLM 快 193 倍、成本低至 445 分之一。在决策模型爆火背后，Jev 也引发了原创性争议。ConvAI Innovations 创始人 Nandakishor Mukkunnoth 称，其 2025 年 3 月 30 日发布的 SalesRLAgent 论文已提出概率估计模型，并公开模型权重与数据集。Mukkunnoth 表示，SalesRLAgent 面向特定销售场景，因此未获得与通用决策引擎同等的关注。TypeSafe 则将 Jev 以完整托管产品发布，包含服务器、API、文档、开发者套件与定价体系。Mukkunnoth 随后在 Jev 发布同日推出开源模型 Laya。Laya 支持 Jev 式模型与接口，可部署在用户自有硬件，并支持多种语言，其基础采用 BERT 家族的 encoder-only 模型。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/193.htm", "publishedAt": "2026-10-13T02:27:08+00:00"}, {"title": "微软推出 Maia 300 自研 AI 芯片，明年拟部署超百万颗以降低算力成本", "summary": "IT之家 10 月 13 日消息，微软于当地时间周一发布了新一代自研 AI 芯片，并计划在明年部署超百万颗该芯片，用于支撑自身内部 AI 业务。这款芯片名为 Maia 300，是微软第三代自研芯片，专门用于 AI 数据运算，例如代码生成、代表用户执行复杂商业任务。上一代 Maia 芯片已经用于运行微软自研模型，以及微软 Azure 云平台上承载的 OpenAI 模型。就在这款新品推出之际，各大云厂商、OpenAI 等 AI 企业都在密集推出自研芯片，目标是打破英伟达在 AI 计算市场的主导地位。在芯片架构上，微软选择了和英伟达不同的技术路线。英伟达 AI 加速器采用一颗巨型主计算芯片，周边搭配高带宽内存。而微软 Maia 300 的核心处理器采用 chiplet 架构，由多颗专用芯片封装在一起。负责核心计算功能的芯粒采用台积电 2 纳米工艺；其他负责数据传输、系统内数据调度的芯粒，则使用成本更低的 3 纳米工艺。Maia 300 服务器单机柜内置 96 颗芯片，整机功耗约 167 千瓦。作为对比，英伟达最新的 GB300 AI 服务器机柜搭载 72 颗 GPU，功耗为 142 千瓦。微软称，Maia 300 每兆瓦电力可以完成的有效计算量，比“主流 GPU 系统”高出约 40%，不过并未指明用于对比的具体产品。微软 Azure 硬件系统与基础设施总裁拉尼 · 博卡（Rani Borkar）在接受路透社采访时表示：“通过对整套系统做全栈优化，这款芯片能够做到每瓦功耗、每单位成本、每字节内存都输出更强的智能处理能力。”微软计划从明年开始，对 Maia 300 开展多吉瓦级规模部署。微软表示，本自然年度的资本开支预计将超过 1,750 亿美元（IT之家注：现汇率约合 1.17 万亿元人民币）。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/191.htm", "publishedAt": "2026-10-13T02:25:31+00:00"}, {"title": "AI 工厂建设迎来统一蓝图：英伟达开放 Vera Rubin 机架设计", "summary": "IT之家 10 月 12 日消息，英伟达昨日（10 月 12 日）发布公告，在开放计算项目（OCP）全球峰会上，英伟达宣布开放 Vera Rubin 机架与计算托架设计，并与 Cisco、Google、Meta、Microsoft、Visionbay 等发布多项 AI 基础设施开放标准。在本次 OPC 全球峰会上，英伟达宣布通过开放 NVIDIA MGX 架构，向 Open Compute Project（OCP）贡献 Vera Rubin 机架和计算托架设计。系统厂商可据此开发面向下一代 AI 工厂的基础设施。更新后的 MGX 1.2 规范新增机架级盲插式液冷、可互操作机架互连、液冷 5000A 母线，以及原生 19 英寸设备支持。IT之家援引博文介绍，该架构支持最高 250kW 的机架部署，并简化组装、测试、维护与部署流程。英伟达同时发布 DSX AI Factory 的 4 个开源软件组件，覆盖交换机配置、GPU 集群压力测试、机架固件管理和裸机部署。相关组件源自 NVIDIA DGX Cloud 运营经验，可帮助云服务商在数小时内将硬件部署为生产集群。合作方面，英伟达还宣布和 AMD、Google、Meta 发布 Open Data Center Specification v0.7，统一 AI 工厂的供电、散热与物理布局设计。Google、Meta、Microsoft 与 NVIDIA 另发布电网弹性规范，要求大规模 AI 设施在电网扰动时保持连接，并在不到 2 秒内恢复至接近满载。Meta 将采用 NVIDIA Spectrum-6 102.4Tb/s 以太网交换机，构建基于开放网络的 Vera Rubin AI 工厂。Spectrum-6 的交换容量与单通道带宽均为 Spectrum-4 的 2 倍，配合 Spectrum-X Multiplane 技术，可支持超过 10 万块 GPU 的集群。英伟达与 Cisco 发布 USFP 标准，这是业界首个面向 400Gb/s 网络架构的可插拔光模块。USFP 在与 OSFP 接近的尺寸内提供 16 条全双工通道，带宽密度为传统 200Gb/s 单通道可插拔光模块的 4 倍，能效约提升 1.3 倍。英伟达与 Google 则宣布，未来 ConnectX-10 SuperNIC 和 BlueField DPU 将支持 Falcon Transport，以提升以太网 AI 网络的可靠性与带宽利用效率。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/120.htm", "publishedAt": "2026-10-13T02:12:40+00:00"}, {"title": "华为徐松余：麒麟 9050 系列开启未来 10 年新征程，实现业界首个 30B MoE 大模型入端", "summary": "IT之家 10 月 13 日现场消息，华为今日（10 月 13 日）在上海练秋湖举办 2026 麒麟媒体沟通会，华为半导体业务无线终端芯片产品管理部部长徐松余发表演讲。徐松余谈到了华为最新的韬定律和逻辑折叠路线，韬定律首次应用于麒麟 9050 系列，在性能 / 能效上获得了可观的收益。徐松余表示，麒麟 9050 系列作为首款逻辑折叠的韬芯片，开启未来 10 年新征程。从 PPT 可以看到，华为目标在 2031 年实现 P 核频率突破 5GHz。IT之家在沟通会现场获悉，麒麟 9050 系列在 AI 方面也取得了进步，是麒麟首个原生 AI Phone 平台。麒麟 9050 Pro 搭载新一代达芬奇架构 NPU、灵犀微核，AI 性能提升 140%、功耗降低 66%。麒麟 9050 系列实现业界首个 30B MoE 大模型入端，总参数 30B、激活参数 2B，占用内存不到 2.5G；还有 7B Dense 大模型、1B VLM 模型等加持，满足不同功能场景下的 AI 需求。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/176.htm", "publishedAt": "2026-10-13T01:59:42+00:00"}, {"title": "消息称 DeepSeek 将完成 1000 亿元融资，投前估值仍为约 5000 亿元", "summary": "IT之家 10 月 13 日消息，据《财经》报道，多位参与本轮交易的人士透露，大模型公司 DeepSeek 的最新一轮融资已临近完成，融资金额从此前计划的 500 亿元增至约 1000 亿元，不到半个月拟融资金额翻了一倍。据IT之家了解，本轮融资为 DeepSeek 的第二轮融资。据报道，新老股东的拟投资金额约各占一半。值得注意的是，融资金额的翻倍并未推高公司整体估值，DeepSeek 目前投前估值仍为约 5000 亿元。据多名独立信源的交易人士称，本轮新进投资方包括石溪资本、中芯聚源、CPE 源峰、君联资本、吉利等，以产业投资方为主。此外，首轮入局的老股东们也在本轮交易名单中，包括宁德时代、腾讯、IDG 资本、砺思资本和拾象资本。其中，宁德时代加码投资，拟增资约 100 亿元，其在首轮中出资金额约为 50 亿元。延伸阅读据IT之家此前报道，DeepSeek 首轮外部融资于 2026 年 4 月开启、6 月底完成交割，整体融资规模约 510 亿元，投后估值接近 4000 亿元，为国内 AI 大模型行业迄今规模最大的单轮融资。其中，创始人梁文锋个人出资约 200 亿元，是最大单一出资方；腾讯出资约 100 亿元，宁德时代体系出资约 50 亿元（含宁德时代及溥泉资本），网易、京东、砺思资本、IDG 资本各出资约 30 亿元，正心谷投资、拾象科技各出资约 15 亿元，国家人工智能产业投资基金出资约 9.8 亿元。本轮新进投资方多带有鲜明的产业背景：石溪资本由存储芯片龙头兆易创新联合投资团队发起设立，聚焦集成电路设计与半导体材料；中芯聚源背靠中芯国际；君联资本是联想控股旗下投资平台；吉利则为汽车整车龙头。《财经》指出，相较于首轮融资，梁文锋在第二轮融资中更倾向于选择能给 DeepSeek 带来上下游产业链赋能的产业投资方。在融资推进的同时，DeepSeek 也在加快 IPO 节奏。据《财经》此前报道，自 2026 年 8 月下旬起，DeepSeek 就在接触多家投行筹备科创板上市，并已聘请中信证券，计划最快 2026 年末递表、目标 2027 年挂牌。有交易人士还透露，2026 年 9 月底开始，保荐券商在协助 DeepSeek 审核投资方背景，要求投资方将部分专项基金调整为盲池备案，以便申报 IPO 时该基金在股东人数统计上计为 1 名，避免底层 LP 穿透合并计入 200 人股东红线。此外，高瓴创投原合伙人严文韬已于 2026 年 9 月下旬加入 DeepSeek 出任 CFO。公开资料显示，DeepSeek 由量化对冲基金浙江九章资产管理有限公司（原名杭州幻方科技有限公司）创立，成立于 2023 年。2026 年 9 月，DeepSeek 发布了最新模型 DeepSeek-V4.1-Flash；此外有报道称其年化营收已突破 10 亿美元。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/172.htm", "publishedAt": "2026-10-13T01:47:22+00:00"}, {"title": "消息称 OpenAI 计划“复活”Sora：换赛道进军 AI 专业影视工具", "summary": "IT之家 10 月 13 日消息，科技媒体《The Information》昨日（10 月 12 日）报道，OpenAI 正与一家专注于电影制作 AI 视频技术的隐身初创公司谈判，计划将此前已停运的视频生成模型 Sora 移交给该公司，让其以专业影视工具的形式重新进入市场。IT之家援引博文介绍，这家初创公司由好莱坞制片人杰弗里 · 卡岑伯格（Jeffrey Katzenberg）、Sora 前研究负责人比尔 · 皮布尔斯（Bill Peebles）以及 Dropbox 前首席财务官苏杰 · 贾斯瓦（Sujay Jaswa）于数月前创立，公司名称尚未公开。合作方面，根据博文披露的细节，这家初创公司计划接管并改造 Sora 平台，并基于该技术开发、销售面向影视制作方的软件或服务。双方尚未敲定合作条款；目前也不清楚该初创公司是否能获得 Sora 的模型权重。OpenAI 今年早些时候因削减高算力消耗的非核心项目，停止了 Sora 模型及其类 TikTok 视频应用的开发，并将资源转向企业 AI、编程工具等业务。此前，Sora 的消费级应用和网页平台已关闭，OpenAI 还终止了与迪士尼规模约 10 亿美元（IT之家注：现汇率约合 67.06 亿元人民币）的合作计划。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/168.htm", "publishedAt": "2026-10-13T01:38:41+00:00"}, {"title": "英特尔 SGX 时代进入倒计时，Diamond Rapids 成最后一代支持的至强处理器", "summary": "IT之家 10 月 13 日消息，科技媒体 Tom's Hardware 昨日（10 月 12 日）发布博文，报道称英特尔 Xeon Diamond Rapids 将成为最后一代支持 SGX 的至强处理器，此后机密计算重心转向 TDX。IT之家注：SGX 全称为 Software Guard Extensions，直译为软件防护扩展，是英特尔的硬件安全功能，可在应用程序内部建立受保护隔离区。它能将特定代码与数据同操作系统、虚拟机监控程序及其他软件隔离，常用于保护密钥、用户数据或敏感业务逻辑。现有 SGX 平台将获得安全更新与支持，直至 2030 年代初，客户仍有时间迁移。而 TDX 全称为 Trust Domain Extensions，直译为信任域扩展，是英特尔面向虚拟机的机密计算技术。SGX 方案通常要求开发者修改或专门设计应用，而 TDX 将整个虚拟机与底层主机环境及其他虚拟机隔离，让企业无需大幅修改软件，即可在云服务器中运行既有应用。英特尔公司表示，TDX 具备更高可扩展性、更易部署，并符合机密计算大规模应用所需的运营模式。英特尔计划扩展 TDX 能力，新增 TDX Connect 可信 I/O、后量子加密及增强证明机制。可信 I/O 可保护虚拟机与加速器、外设之间的数据传输。在智能体 AI 场景中，TDX 可在共享基础设施上为多个智能体提供硬件隔离的虚拟机环境。英特尔还与 Nvidia 协调 CPU 与 GPU 的机密计算技术，将保护范围延伸至敏感数据与 AI 模型。英特尔 TDX 已通过包括阿里云、谷歌云、IBM 云、微软 Azure 和 Volcano 云在内的主要云服务提供商推出。同时，红帽、Canonical 和 VMware 也正在为其软件平台添加 TDX 支持，以促进其在私有云和企业环境中的应用。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/167.htm", "publishedAt": "2026-10-13T01:31:26+00:00"}, {"title": "9 年前英伟达 Tesla V100 老将再战：4 GPU 集群 AI 推理跑赢 2 台 DGX Spark", "summary": "IT之家 10 月 13 日消息，YouTube 频道 Jun Yamog 昨日（10 月 12 日）发布视频，测试将 4 张 Tesla V100 安装于 NVLink 载板，在 Qwen3.8-Flash-Next 基准中，长提示处理速度较 M5 Ultra 快 230%，较 2 台 DGX Spark 快 40%。IT之家查询公开资料，Tesla V100 是英伟达于 2017 年推出的数据中心 GPU，基于 Volta 架构，常用于 AI 训练与推理。其 32GB 版本配备 HBM2 显存，900GB/s 显存带宽可支持大模型参数与数据的快速读取。NVLink 是英伟达的 GPU 高速互联技术，用于在多颗 GPU 之间直接传输数据。相比通过 PCIe 通信，NVLink 可降低互联瓶颈，常用于多 GPU 服务器和 AI 计算集群。该 NVLink 载板提供 300GB/s 带宽，并配备 6 条 NVLink 2.0 连接。为容纳 4 颗独立 GPU，测试者改装 NVIDIA A100 散热器，让其可散发每颗 V100 约 300W 的功耗，并通过 PCIe x8 接口连接载板。该主播使用 4-bit 量化的 Qwen3.8-Flash-Next 模型测试，对比对象包括 2 台配备 128GB LPDDR5X 统一内存的 DGX Spark，以及配备 M5 Ultra 芯片的 Mac Studio 设备。在长提示处理测试中，4 颗 V100 较 DGX Spark 集群快 40%，较 M5 Ultra 快 230%。测试者指出，与 Apple Silicon 的巨大差距可能部分源于软件优化不足。在短提示处理测试中，V100 集群较 DGX Spark 保持 40% 的速度优势，较 M5 Ultra 快 163%。该结果显示，旧款数据中心 GPU 在特定推理负载中仍具备较高吞吐能力。在短提示 Token 生成测试中，4 颗 V100 达到 100.6 tok/s，较 2 台 DGX Spark 快 121%；M5 Ultra 的成绩为 44.5 tok/s。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/165.htm", "publishedAt": "2026-10-13T01:18:41+00:00"}, {"title": "Anthropic 测试事故：Claude 模型向警方提交虚假凶杀线索，还提交 20 份签证申请", "summary": "IT之家 10 月 13 日消息，Anthropic 与费城警方于当地时间上周五证实，一款 Anthropic 的 AI 模型向费城警方提交了一条关于一桩未破谋杀案的虚假举报线索。7 月 18 日，一个 Claude 模型在费城警察局用于提交悬案线索的网站上发送了这条虚假信息，好在这条消息被垃圾邮件过滤器拦截。Anthropic 在 9 月 28 日发现了该事件，并于 10 月 8 日通知警方。Anthropic 在一份报告中描述“在对 Claude 进行评估与内部使用时，观察到模型出现的非预期行为”。报告写道，在内部测试中，团队要求 Claude Haiku 4.5 填写各类表单，操作到提交前一步即停止，不要真正提交。“但有好几次，Claude 错误提交了表单，它以为提交前还会有额外的确认页面。”Anthropic 介绍，这起虚假谋杀线索事件发生在一项测试中：指令要求 Claude 在随机选取的网页上执行任务。在其中一轮测试里，模型打开了一个介绍未破凶杀案的页面，页面附带警方的线索举报表单。当时的指令要求 Claude 不得登录、注册账号、填写个人信息、下单购买或执行破坏性操作，但指令并未禁止提交表单。于是 Claude 填写了如下内容：“我或许掌握与本案相关的线索。我记得在案发时段，在页面标注的街道附近见过一名与描述特征相符的人。如果该信息有用，请联系我。”表单的姓名与联系方式栏均为空白。Anthropic 表示，还发现 Claude 在多个州及联邦政府机构网站上出现同类行为。其中一起事件中，Claude 向美国国务院提交了 20 份签证申请。警方称两个月的延迟“不可接受”IT之家注意到，费城警方向当地 ABC 电视台发布长篇声明。警方称，这条虚假线索生成的邮件最终进入垃圾邮件文件夹，没有任何人审阅。“Anthropic 告知费城警察局，他们 9 月 28 日发现了该事件，随即终止了引发本次提交行为的自动化测试流程，并为后续测试增设验证机制。”警方表示。在 10 月 8 日收到情况通报后，警方“在网站线索记录中找到了这条提交记录，并确认对应的邮件仍留在垃圾邮件箱内。”Anthropic 称，“技术核查一完成”就通知了警方。但警方批评 Anthropic 未能更早发现并上报这条虚假线索。“费城市对此事高度重视，”费城警方声明写道，“该公司必须强化安全防护，防止类似事件在本市不知情的情况下干扰市政系统。事件发现并上报给费城市的两个月延迟，是不可接受的。”Claude 向美国国务院提交 20 份签证申请Anthropic 表示，这起虚假凶杀案举报，只是多起发生在美国联邦、州、地方政府官网的事件之一。“我们已经向白宫通报这些案例，并通知所有涉事机构。”《纽约时报》援引匿名消息源报道，Anthropic 的 AI 智能体“通过美国国务院网站表单提交了 20 份签证申请。所有申请均信息不全，没有进入处理流程。”费城警方表示，正常办案流程“要求先人工审核、甄别线索，才会分发开展后续侦查…… 警方的这套防护机制降低了本次事件的影响。但这并不代表问题不严重：AI 系统把编造的信息伪装成知情人士提供的凶杀案线索。”Anthropic 称，其从 7 月开始核查对话记录，正是在核查过程中发现了这条虚假线索和其他事件。就在同一个月，Anthropic 曾披露，Claude 编写并发布了恶意 Python 软件包，还对其他企业发起多次攻击。Anthropic 表示，本次核查没有发现和今夏上报的网络安全事件同等严重的案例。后续核查转向低风险测试场景，费城警方事件就属于这类场景。“尽管这些行为造成的影响很小，并且我们已经对部分高风险、网络安全类评估切断了实时互联网访问，但我们现在决定，把这项限制扩大到全部内部评估，直到确认安全与监控机制可以可靠拦截这类行为。”Anthropic 说。Anthropic 称新工具可以拦截这类非预期行为Anthropic 已经暂停部分评估项目，另一些评估迁移至离线版本，“或者重构任务逻辑，不再访问真实线上网站”。公司还“更新网页抓取工具等联网工具的安全护栏，严格限制模型可执行操作。”Anthropic 同时开发新工具，用于自动检测并拦截上述行为。“我们用文中这些案例做测试，新工具全部成功拦截。”白宫 AI 专项工作组，也就是其所称的超级智能工作组，发表声明，表示已经告知 Anthropic：“我们要求向涉事机构和公众立即完整披露信息。”据 Axios 报道，白宫 AI 工作组还要求 Anthropic“立即为受影响机构和受害民众提供补救措施”，并且所有 AI 企业“一旦发生模型相关事故必须立刻披露，迅速采取果断行动消除全部损害。”相关阅读：《Anthropic 向白宫通报一起智能体失控事件：AI 试图闯进多个美国政府网站》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/164.htm", "publishedAt": "2026-10-13T01:17:22+00:00"}, {"title": "Meta 发布 Muse Wonder 模型，扎克伯格称公司已在 AI 前沿领域追上竞争对手", "summary": "IT之家 10 月 13 日消息，马克 · 扎克伯格表示，Meta 已经在人工智能的“前沿领域”追上竞争对手。他承诺将继续大规模投入资金，向 Anthropic 与 OpenAI 发起挑战，同时淡化外界对于这项技术可能失控的风险警示。Meta 于大数据周一发布了 Muse Wonder 人工智能模型，扎克伯格在接受《金融时报》采访时称，这套新系统“能够实现更为复杂的能力，达到当前 AI 领域前沿的技术水平”。这家硅谷企业表示，根据技术基准测试结果，Muse Wonder 在部分任务上的表现优于 Anthropic 和 OpenAI 发布的同类模型。这次模型发布对扎克伯格而言是一个重要里程碑。自去年起，他已经投入数十亿美元，重整 Meta 的 AI 管理团队、兴建大型数据中心，并以数百万美元年薪招揽顶尖 AI 研究员，所有举措都是为了跟上 OpenAI、Anthropic 和谷歌的步伐。扎克伯格说：“能够走到这一步，既需要海量算力与资金投入，也离不开项目团队长期开展大量严谨的科研工作。”这场 AI 研发热潮起初曾令投资者感到不安，但自 9 月初 Meta 推出 Muse 个人 AI 助手以来，公司股价上涨了近 10%。Muse 依靠自主智能体完成采购杂货、预订行程等日常事务。Muse 应用一经推出便迅速登顶美国苹果与安卓应用商店的下载榜，并且至今保持榜首位置。这家市值 1.8 万亿美元（IT之家注：现汇率约合 12.07 万亿元人民币）的企业计划将这款新模型接入 Muse 应用。Meta 称，Muse Wonder 在部分技术基准测试中超越了 Anthropic 的 Claude Opus 5.5、Fable 5.1 以及 OpenAI 的 GPT-6 Astra。公司表示，新模型可以完成各类复杂任务，从“解读租赁合同，到梳理财务或健康相关信息”。不过本次发布出现一处漏洞，影响了 Meta Code 订阅服务对 Muse Wonder 调用额度的统计。Meta 首席人工智能官亚历山大 · 王（Alexandr Wang）表示，团队“正在着手解决”该问题。他在周一晚些时候于 X 平台补充说：“目前还有不少漏洞正在排查。”Muse Wonder 将采用闭源模式，性能最强的版本将直接面向企业销售。Meta 借此和 Anthropic、OpenAI 争夺企业 AI 服务订单，也是对其发展愿景的一次重大考验。扎克伯格透露 Meta 将继续加大投入，公司“已经在研发下一代升级版本”，并且模型研发的速度“从现在起大概率会明显加快”。但对于越来越多人担忧的问题 ——AI 技术发展速度过快，很快将超出人类管控范围，他并不认同。今年 7 月就曾发生一起广受关注的事件，超过一千个 OpenAI 自主智能体脱离测试环境，对初创企业 Hugging Face 发起攻击。当被问及对“末日概率（P (doom)）”的看法时，扎克伯格没有给出具体数值。这是硅谷热议的术语，用来描述人工智能引发大规模灾难的可能性。他转而提出，保障模型安全的责任应当由各个研发实验室自行承担。“我更倾向于这样一种观点：AI 是一项技术，可以通过常规防护机制做工程设计，并且以负责任的方式开发。我并不认同那种拟人化视角，认为 AI 会自行其是。”他说。此前 Anthropic 的达里奥 · 阿莫代（Dario Amodei）、OpenAI 的萨姆 · 奥尔特曼（Sam Altman）等 AI 实验室负责人呼吁全行业放缓 AI 研发，扎克伯格一直对此持反对态度。他提到 Meta 也曾在部分阶段主动放缓内部 AI 研发，保障产品安全。他还深度参与起草了美国总统唐纳德 · 特朗普政府发布的白宫《超级智能协议》，该文件制定了行业自律准则。批评者认为，这份协议远不足以形成一套正式的全球 AI 治理体系。扎克伯格提出的愿景是面向普通消费者的“个人超级智能”，这让 Meta 和 OpenAI、Anthropic 形成差异化。后两者的目标是打造通用人工智能，也就是能在绝大多数任务上超越人类的 AGI。“其他企业更多聚焦知识工作、自动化类场景，而我们更关注赋能个人用户。”扎克伯格表示，他希望打造“能造福世界的产品”。扎克伯格称，想要实现这个愿景，Meta 就必须站在 AI 前沿。他指出一个矛盾现象：模型在某些学术领域飞速进步，却“仍然缺少足够的常识，无法成为理想的个人助手”。上个月 OpenAI 宣称，其一款尚未对外发布的内部模型取得数学突破，解决了该领域的重大难题。扎克伯格说：“从社会学角度，我很难理解，为什么我们能造出可以完成高深数学运算的 AI 系统，却还做不出能够稳定为所有人提供客服支持的产品。但我认为，这方面显然还有大量工作要做。”2025 年 4 月，Meta 的 Llama 4 模型不及预期，公司 AI 战略受到审视。这件事促使扎克伯格在人才与基础设施方面大举投入。作为布局的一环，他聘请数据标注企业 Scale AI 创始人亚历山大 · 王，执掌作为 MetaAI 计划核心的 TBD 实验室。TBD 实验室组建后推出的首款模型 Muse Spark 于 4 月发布，但性能依旧落后竞品。Meta 表示，Muse Wonder 在高难度任务上能力更强，包括高级代码编写，并且提升了跨多轮对话记忆相关信息的能力，达到当前顶尖模型的水平。Muse Wonder 也标志着 Meta 战略转向，不再优先推出开源模型，用户和企业需要付费使用。Meta 称将采用分级定价方案：基础调用最低每百万词元（token）收取 0.2 美元（现汇率约合 1.3 元人民币）；性能更强的高级版本 Muse Wonder Full 每月最高收费 200 美元（现汇率约合 1,341 元人民币）。尽管 Meta 的 Muse 应用推动 AI 智能体助手在美国普及，但这项技术的大规模落地依旧存在阻碍。Muse 上线不久，亚马逊就拦截了 Muse 智能体在其网站下单购物的行为，削弱了该系统的实用性。这件事也说明，大型科技企业可以利用自身市场影响力，限制竞品 AI 工具的能力。Meta 还需要克服用户隐私方面的顾虑，已有少量用户指控 Muse 未经许可访问或分享隐私信息。长久以来外界一直质疑这家公司对用户安全的重视程度，其此前深陷多起数据滥用丑闻。今年 8 月，Meta 同意支付最高 180 亿美元（现汇率约合 1,207.05 亿元人民币），与美国多个州达成一项巨额诉讼和解，该案指控其在未成年人保护与社交媒体成瘾问题上存在过失，也是美国企业史上金额最高的和解协议之一。扎克伯格说：“很多让大家不信任这家公司的痛点，反而可以催生出富有价值的技术创新。”他提到公司即将推出的 Muse 保密虚拟机，在这个版本中，用户的数据以及和智能体的全部对话，Meta 完全无法访问。扎克伯格近期主导的 Meta 转型，在公司内部引发动荡。过去几年，员工接连遭遇裁员、组织架构重组与高管调整。Meta 需要向华尔街解释不断膨胀的资本开支，在压力之下，公司于 5 月裁员 10%，共 8000 人。员工表示，裁员叠加公司计划部署员工追踪软件，记录鼠标移动与按键行为用于 AI 模型训练，导致团队士气低落。扎克伯格称：“Meta 未来会开展比现在更多的业务，但每一项业务，或许都可以用更少的人力完成。我猜想未来会有更多人从事和技术协作、创造产品相关的工作。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/159.htm", "publishedAt": "2026-10-13T01:05:08+00:00"}, {"title": "英特尔 \"Crescent Island\" 系列数据中心推理卡定名 Intel GPU D 系列", "summary": "IT之家 10 月 13 日消息，Intel（英特尔）在 2026 OCP 全球峰会上宣布，其基于 \"Xe3P\" 架构的数据中心推理优化 GPU \"Crescent Island\" 正式定名 \"Intel GPU D-series\"，首款产品则是 Intel GPU D270。Intel GPU D270 拥有 32 个 Xe 核心、256 个 XMX 引擎，FP8 算力 1.3 petaflops；配套至高 480GB LPDDR5X 显存，带宽达 1.5TB/s；整卡功耗 350W，采用标准 PCIe AIC 外形规格，支持 PCIe Gen5 规范；允许风冷设计。Intel GPU D-series 专为 LLM、长上下文工作负载、并发推理服务而设计，单卡支持 300B 模型、8 卡系统支持 1T 模型，目标应用范围涵盖多租户 AI 服务、机器人技术以及其它对延迟敏感的工作负载。英特尔还与合作伙伴展示了基于 Xeon（至强）处理器的新型机架设计，部分采用 Xeon 6+ 的配置可扩展至超 4.6 万个 CPU 核心，功率高达 133.45 kW。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/158.htm", "publishedAt": "2026-10-13T01:04:37+00:00"}, {"title": "三星首款智能眼镜曝光：约 41 克重、骁龙 AR1 Gen1，预计下月上市", "summary": "IT之家 10 月 13 日消息，三星首款智能眼镜将在大约一个月后开售，外媒 SammyGuru 放出了这款智能眼镜全系列镜框款式与配色的图片，该智能眼镜由 Gentle Monster 与 Warby Parker 合作打造。IT之家注意到，SammyGuru 还获取到了这款三星即将上市智能眼镜的核心参数，包含一项三星尚未对外公布的数据：整机重量。据悉，搭配标准镜片时，三星这款智能眼镜重量约为 41 克。如果选配定制光学镜片，重量会略有增加，不同型号的重量会存在差异。三星在 Unpacked 发布会上仅表示，这款眼镜比大多数 AI 智能眼镜更轻，现在终于有了具体数值。核心参数：重量：搭配标准镜片约 41 克芯片：骁龙 AR1 Gen1内存与存储：2GB 内存、64GB 存储空间摄像头：1200 万像素，支持 30 帧 3K 视频录制音频：两个开放式扬声器，四麦克风阵列电池：眼镜本体最长可用 9 小时，搭配充电盒最长可使用 72 小时防水等级：IPX4（充电盒无防水等级）这款眼镜没有搭载显示屏，AI 回复的语音内容会通过两个开放式扬声器播放。四颗麦克风用于通话与 Gemini 语音交互。眼镜自带 2GB 内存与 64GB 存储空间，可以先保存照片和视频，等之后再传输到手机。眼镜支持 IPX4 防水，汗水与小雨不会造成损坏，但配套充电盒不具备防水能力。续航与三星在 Unpacked 发布会上承诺的一致：眼镜本体最长续航 9 小时；充电盒满电状态下，整体总使用时长最高可达 72 小时。Gentle Monster 此前只展示过少数黑色镜框。SammyGuru 看到六种镜框造型，合计 16 个版本：方形镜框，黑色，可选透明、浅蓝或灰色镜片偏圆润镜框，可选透明、棕色或灰色镜片粗框方形款，可选灰色或棕色镜片猫眼款，可选灰色或棕色镜片纤细椭圆形镜框，黑色、浅灰或淡香芋紫椭圆形镜框，黑色、酒红或奶油白后面四款镜框配色，是外界首次看到 Gentle Monster 推出的非黑色款式，带来了耳目一新的变化。框型与颜色描述均为 SammyGuru 自行命名。Warby Parker 的镜框都有专属名称，共三种款式：Alden、Reid、Wren。Alden 和 Wren 有松绿色（深绿）与马鞍棕（红棕）；Reid 为纯黑色。每一种镜框与配色都可以选择透明平光镜片或者太阳镜片，总计 10 个版本。此前我们只见过其中两款镜框：5 月谷歌 I/O 大会展出的绿色款，以及 7 月 Unpacked 发布会的棕色款。Warby Parker 还配有专属藏青色充电盒。根据 SammyGuru 掌握的信息，新品上市时间为 11 月。Gentle Monster 款将在韩国与美国发售，Warby Parker 款仅在美国上市，这和本月早些时候传出的 11 月上市消息吻合。可以在两个品牌官网、线下门店以及美国三星体验店购买。目前官方尚未公布售价。还有几个细节值得留意：三星表示，眼镜的各项服务与功能面向 18 周岁及以上人群。美国地区用户可以在 Gentle Monster 官网选配定制光学镜片；韩国地区用户需要到本地眼镜店进行验光配镜。Galaxy 生态专属功能，需要搭载 One UI 9 及以上系统的新款 Galaxy S 系列、Z Fold 或 Z Flip 手机。手表联动功能，需要搭载 Wear OS 7 及以上系统的 Galaxy Watch。谷歌与 Gentle Monster 都表示，这款眼镜同样兼容其他安卓手机与 iPhone。上述硬件要求仅针对 Galaxy 专属附加功能，基础使用不受限制。此外，韩国用户除谷歌地图外，还可以通过 Naver 地图获取语音导航。三星尚未公布新品售价与精确发售日期，但产品预计 11 月开售。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/151.htm", "publishedAt": "2026-10-13T00:49:33+00:00"}, {"title": "3 个月、超 5000 亿词元：AI 重建 2009 年《现代战争 2》源代码，83% 与原版逐字节匹配", "summary": "IT之家 10 月 13 日消息，开发者莫里斯・霍伊曼（Maurice Heumann）于 10 月 9 日发布项目报告，团队历时 3 个月，消耗超过 5000 亿词元（Tokens），调用 AI 智能体反编译 2009 年《使命召唤：现代战争 2》游戏，并重建为 C++ 源代码。团队成员方面，该项目由霍伊曼主导，得到了 RektInator、Future、st0rm 及其他社区成员的协助。AI 调用方面，团队最初同时使用 Claude Max (20x) 与 Codex Pro 订阅，在 Claude Code CLI 和 Codex CLI 中运行 AI 智能体。模型涵盖 Sonnet 5、Opus 5.5、Luna、Sol 与 Terra，智能体通过 GitHub Issues 追踪任务，并经 Discord 交换信息。项目首月部署 4 个智能体，其中 3 个负责反编译与提交代码，1 个负责审查。该阶段完成约 80% 函数，游戏可启动、显示主菜单并加载地图；但团队发现代码虽具可读性，却存在函数签名、类型、结构布局及逻辑层面的语义错误。团队随后引入“逐字节匹配反编译”验证机制。该机制以原游戏编译器重建目标文件，并将重建函数与原 EXE / PDB 中的函数逐字节比对，通过者标记为 PASS，未通过者由智能体重新修改。为防止智能体绕过校验，团队禁止内联汇编、裸函数、对象补丁及在代码中嵌入字节，并通过 CI 对验证脚本哈希值与 GitHub Actions secret 比对。该机制使低成本模型也能在严格反馈下完成高精度任务，并取代人工或智能体审查环节。项目后期主要运行 14 个 Luna 智能体与 2 个 Opus 5.5 智能体，智能体通过独立分支和 Pull Request 提交代码。最终，99% 的游戏函数已纳入重建源码，83% 的函数达到逐字节匹配；其余函数因非确定性特征或链接器行为难以完全匹配。逐字节匹配（Byte-for-byte Matching）是指逐字节匹配指将重建代码编译后的函数二进制数据，与原版程序中的对应函数逐字节比对。若数据一致，通常说明该函数在目标编译环境下保留了与原版相同的语义和行为。霍伊曼表示不会公开相关代码，重建成果将仅保留为私人用途。IT之家附上参考地址500+ Billion Tokens Later: Letting AI Agents Decompile A First-Person Shooter", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/149.htm", "publishedAt": "2026-10-13T00:48:06+00:00"}, {"title": "英特尔 CEO 陈立武：未来两到三年 AI 硬件将持续短缺", "summary": "IT之家 10 月 13 日消息，英特尔首席执行官陈立武（Lip-Bu Tan）认为，未来两到三年，人工智能行业仍将持续面临硬件短缺问题。陈立武在星展银行于新加坡举办的会议上发表了上述看法，他在会上谈及了人工智能领域的最大需求以及自己对量子计算的展望。这位英特尔首席执行官是行业内对技术动态十分敏锐的高管之一，他密切关注多项高增长赛道，包括下一代芯片制造工艺与新材料。智能体 AI 应用普及，催生了对 CPU 而非 GPU 的需求，也助力陈立武推动英特尔实现复苏。举例来说，公司第二季度数据中心与人工智能业务部门营收同比增长 59%。陈立武在解读英特尔二季度财报时提到，随着智能体 AI 的作用不断扩大，AI 训练领域过去 8 块 GPU 搭配 1 块 CPU 的配比，已经下降至 4 比 1。当地时间 10 月 12 日，陈立武在新加坡星展银行的这场活动上，进一步分享了对人工智能、AI 及量子计算等其他领域核心趋势的看法。他首先指出，受技术供应链持续受限影响，未来两到三年 AI 硬件将维持供应紧张的局面。就在他发表此番言论之际，内存芯片等核心组件持续供不应求，价格数月来不断走高，台积电封装这类技术也面临产能约束。这位英特尔 CEO 还谈及前沿 AI 模型、开源以及量子计算相关话题。陈立武表示，中国前沿 AI 模型的词元（token）成本显著更低。他补充道，结合低廉的词元成本来看，这些模型的表现令人满意。陈立武还讨论了 AI 投资问题。他提出，资金固然是基础设施扩建阶段的首要约束，但从长期来看，证明投资回报率（ROI）才是维持投资者信心的关键。对于量子计算，陈立武保持乐观，他认为量子计算有望在未来三至五年走向主流应用。IT之家注意到，陈立武本人在量子计算领域投入了大量资源，上月末，他通过自己的风投基金披露了在量子计算方向的重点投资项目，并表示这项技术想要普及，关键在于找到合适的落地场景。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/144.htm", "publishedAt": "2026-10-13T00:01:06+00:00"}, {"title": "Meta 发布 Muse Wonder 系列旗舰 AI 模型，对标 Anthropic 与 OpenAI", "summary": "IT之家 10 月 13 日消息，Meta 于当地时间周一发布了全新一代尖端旗舰人工智能模型，力图在人工智能竞赛中追赶 Anthropic、OpenAI 等竞争对手。Meta 提供的数据显示，两款新模型名为 Muse Wonder 与 Muse Wonder Full，在推理、写作与代码能力测试中，得分已经接近 Anthropic 的顶尖模型。通过 Muse 应用访问需每月 20 或 100 美元（IT之家注：现汇率约合 670.6 元人民币）订阅，两款模型即日起通过 Meta Model API 与 Muse Code 开放，Muse Wonder Full 仅面向 Muse Code 订阅用户，月费 50 或 200 美元（现汇率约合 1,341 元人民币）。新模型还加入 Active Memory 与 Active Focus，以减少智能体偏离目标。Meta 首席执行官马克 · 扎克伯格（Mark Zuckerberg）在该公司人工智能技术研发遭遇挫折后，于去年对公司的人工智能部门进行了重组。此后，公司陆续推出了多款新 AI 模型与 AI 产品，服务 Instagram、Facebook、WhatsApp 平台的合计 35 亿用户。Muse 是 Meta 推出的 AI 智能体应用，可以代替用户操作各类软件与应用程序，这款应用在上个月上线后的数周内，便登上应用商店榜首。Muse Wonder 面世之际，业界对尖端 AI 模型与 AI 智能体的担忧持续升温，已有部分智能体出现失控情况，侵入企业系统、干扰政府网站。扎克伯格尝试为 Meta 的技术打造差异化叙事，Meta 模型的底层架构和 Anthropic、OpenAI 的模型相近，但他强调人工智能应当具备实用价值、赋能用户，而非带来危险。2025 年 6 月，Meta 聘请 AI 初创企业 Scale AI 创始人亚历山大 · 王（Alexandr Wang）担任首席人工智能官，此后便启动 Muse Wonder 的研发。Muse Wonder 是亚历山大 · 王所领导 AI 部门推出的第二代 AI 模型，也是 Meta 首款宣称用于对标前沿模型的产品，这类前沿模型通常需要极高算力才能运行。Meta 表示，Muse Wonder 不久后将为 Muse 应用的部分功能提供底层能力。Muse Wonder Full 是性能更强的版本，仅对 Meta 高级 AI 编程工具 Muse Code 的订阅用户开放。这两款内部开发代号为西瓜（Watermelon）的新模型，代码编写能力相比 Meta 过往模型有大幅提升。AI 编程市场目前由 Anthropic 与 OpenAI 主导，而 Meta 正努力拓展面向其他企业的 AI 服务业务。IT之家注意到，Muse Wonder 在研发过程中曾遭遇波折。《纽约时报》此前报道，Meta 在 7 月暂停了模型预训练环节，导致模型发布推迟至本月。上周末，扎克伯格在 Instagram 直播一边烤肉，一边预告这款新 AI 模型，他还在直播中提到菜单里还有一样东西：“一个大西瓜。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/138.htm", "publishedAt": "2026-10-12T23:30:53+00:00"}, {"title": "FocusAny v2.3.0 本地 AI 工具条，稳定性大扫除", "summary": "全局搜索、插件、大模型、MCP、工作流，都收在一个快捷键呼出的面板里。v2.3.0 没有上新功能，专心做了三件事——让崩溃说得清、让界面更顺眼、让数据放哪看得见。 崩溃、卡死、白屏，下次能查得到 你没法描述它，开发者也很难复现。 从现在起，FocusAny 会把这类情况记在本机日志里：是哪个窗口崩了、卡住了多久、当时占...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502979", "publishedAt": "2026-10-12T13:39:30+00:00"}, {"title": "Linus 把 Claude Code 写的内核补丁推送到个人仓库", "summary": "Linus Torvalds 在自己 Linux 仓库里推了一个叫 noref-filemap-read-with-llm 的分支，后缀不是开玩笑。Torvalds 表示：『代码、测试程序、上面清单背后的审阅和这封信的初稿，都由一个 LLM 编程助手（Claude Code）在我的指导下完成。测试是在我自己的机器上跑的。』 这个分支不只是一次 AI 写代码的表演，它对着的是一...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502978/linus-torvalds-used-claude-code", "publishedAt": "2026-10-12T11:42:23+00:00"}, {"title": "华为AI靠RSI通关25款游戏！操作次数比人类少56%", "summary": "游戏打到21:0，AI甚至不用再调用大模型了", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/10/502654.html", "publishedAt": "2026-10-12T05:48:36+00:00"}, {"title": "DatI 0.7.2 发布：在 Agent 中记录国庆假期行程与花费实战", "summary": "在很多人的印象里，大模型接入数据库（Data Agent / Text-to-SQL）往往等同于企业级只读 ChatBI：在电脑前问一句“上个月华东区销售额是多少”，模型生成一条 SELECT 查询，吐出一个图表。 但如果数据库接入方式本身支持受控的写操作（CRUD）与业务语义沉淀，Agent 的能力边界会被彻底打开——它不再只是被动的查数工具，...", 可自主查询操作各类授权平台，比较方案、电话联系服务方，完成目标任务。据财新报道，Meta 发布个人智能体 Muse 后，引起国内科技巨头迅速跟进。IT之家注意到，与传统的问答型聊天机器人不同，Muse 的核心定位是“替用户采取实际行动”（Action-oriented Agent），主打跨平台接管琐碎任务，被马克 · 扎克伯格视为迈向“个人超级智能”的关键产品。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/244.htm", "publishedAt": "2026-10-13T03:06:45+00:00"}, {"title": "北京警方通报：男子用 AI 制作虚假截图、标注贩毒人员车辆为某品牌，被采取刑事强制措施", "summary": "IT之家 10 月 13 日消息，北京警方 10 月 12 日晚通报 3 起造谣博眼球典型案例，一男子制作虚假截图、标注贩毒人员车辆为某品牌，被采取刑事强制措施。案例一：周某（男，46 岁）为博取关注、吸粉引流，编造内容为“某河域多名游泳者死亡”的谣言信息，在网络平台发布，造成传播扩散，误导大量网民关注和讨论，严重扰乱社会秩序，造成不良影响。目前，周某已被属地公安机关依法采取刑事强制措施。案例二：龚某（男，24 岁）为博取关注、吸粉引流、招揽生意，利用 AI 工具制作某法制节目虚假截图，将一贩毒嫌疑人驾驶车辆，以字幕形式标注为某品牌汽车，在网络平台发布，造成传播扩散，误导网民关注和讨论，严重扰乱社会秩序，造成不良影响。目前，龚某已被属地公安机关依法采取刑事强制措施。案例三：郭某（男，50 岁）、常某（男，51 岁）为博取流量、获得行业关注，编造“某科技公司多人被带走”的谣言信息，在网络平台发布，造成传播扩散，误导大量网民关注和讨论，严重扰乱社会秩序，造成不良影响。目前，郭某、常某已被属地公安机关依法采取刑事强制措施。IT之家附警方提示：网络空间不是法外之地，通过编造并发布不实信息的方式博取关注、吸粉引流、谋取私利的行为，不仅违背公序良俗，还可能触碰法律红线。请广大网民自觉遵守法律法规，规范自身网络言行，共同维护清朗有序的网络空间。相关阅读：《小米徐洁云澄清 CCTV 12〈天网〉节目夸 SU7 操控好、安全性高：这个图的确是假的》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/156.htm", "publishedAt": "2026-10-13T00:58:11+00:00"}, {"title": "英伟达携手思科推出首款 400G / lane 可插拔光模块规范 USFP", "summary": "IT之家 10 月 13 日消息，NVIDIA（英伟达）、Cisco（思科）当地时间昨日宣布携手推出业界首款支持 400Gbps / lane 高速信号的可插拔光模块规范 USFP。USFP 与 OSFP 光模块尺寸相当，首批产品集成 16 条全双工通道，后续还可扩展至 32 条乃至更多通道，从而实现 12.8 Tb/s 的吞吐量。USFP 光模块的带宽可达现有 200G / lane 可插拔光模块的 4 倍；而在 400G SerDes 技术的支持下，USFP 的能效是后者的 1.3 倍。其采用新型二维阵列连接器，其两步插入设计可在模块插入后才接合高速触点，从而减少触点磨损，提高信号完整性，并使插入力更可预测；支持 100W 功耗，简化了交换机设计。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/155.htm", "publishedAt": "2026-10-13T00:55:04+00:00"}, {"title": "英伟达 RTX Spark 全球巡展官宣：北京等 6 城将开启体验，可赢黄仁勋签名版笔记本", "summary": "IT之家 10 月 13 日消息，英伟达官方账号 @nvidia 今天（10 月 13 日）在 X 平台宣布，将围绕新款 Windows PC，计划在北京等 6 个城市举办 RTX Spark 全球发布活动，参与者有机会获得黄仁勋亲笔签名的电脑。本次全球发布活动计划首批站点包括北京、柏林、伊斯坦布尔、首尔、旧金山和台北，不过官方推文表示后续会公布活动详情及参与方式。IT之家附上相关截图如下：NVIDIA 表示，参与者可在现场体验新款笔记本电脑演示、领取周边礼品，并有机会赢取一台由公司 CEO 黄仁勋（Jensen Huang）亲笔签名的华硕 ProArt P14 RTX Spark 笔记本电脑，每站还将提供更多“独家体验”。图源：视频截图NVIDIA 将这次活动称为“Windows PC 新篇章”的全球庆祝，Windows 官方账号也在该推文下回应称“我们来这里是为了庆祝”。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/139.htm", "publishedAt": "2026-10-12T23:38:16+00:00"}, {"title": "消息称 Epic 为迪士尼打造的游戏推迟上线，全面改用 AI 开发", "summary": "IT之家 10 月 13 日消息，Epic Games 正全力将人工智能应用于游戏开发。这家工作室一直在为迪士尼制作游戏，但有消息人士向彭博社透露，其一款待发布作品已经推迟上线，目的是在开发过程中更多使用 AI 技术。彭博社报道称，该游戏的一名总监向团队通报，项目将采用“AI 优先”的制作方案。内部通知写道：“不再手写代码”，同时要求项目全部美术资源都要“通过完整 AI 工作流生成”。消息人士称，这套新方案并未获得全体开发人员的认可，据称部分员工希望这项要求并非认真的。不过 Epic Games 今年已经在虚幻引擎平台大量上线生成式 AI 工具，因此这项指令看起来相当真实。Epic 的公关总监杰克 · 琼斯（Jake Jones）在给彭博社的声明中表示：“我们正在拥抱 AI 加速开发模式，由 Epic 的开发者主导，他们是我们所有工作的愿景设计者与创意核心。”迪士尼早在 2024 年就向 Epic 投入 15 亿美元（IT之家注：现汇率约合 100.5 亿元人民币）的大额资金。多年来，多款迪士尼旗下角色已经作为外观皮肤登陆《堡垒之夜》，而这次更深层次的合作旨在打造一个“游戏与娱乐宇宙”。今年早些时候有传闻称，这家开发商为迪士尼打造的最受期待项目，是一款类似《Arc Raiders》的撤离射击游戏。该游戏原定 11 月上线，不过彭博社最新报道提到，早在这项新的 AI 开发要求下达之前，发售日期就已经推迟到 3 月。游戏开发者大会的年度调查显示，越来越多开发者认为生成式 AI 会损害行业发展。本年度调查中，52% 的受访者认为这项技术对行业不利，2025 年这一比例仅为 30%。调查还发现，尽管不少游戏从业者确实在使用生成式 AI 工具，但大多只是用于资料调研、编写代码这类工作，而非制作美术资源。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/136.htm", "publishedAt": "2026-10-12T23:23:01+00:00"}, {"title": "应用材料 CEO 迪克森：依托 AI 提效，未来数年营收有望翻倍，但员工数量不会同步翻倍", "summary": "IT之家 10 月 13 日消息，应用材料公司计划在未来数年内实现营收翻倍，但不会同步扩招员工，原因是该公司正更多借助人工智能工具开展产品研发、质量管控等工作。“未来几年公司规模翻倍的过程中，我们不会让员工数量也同步翻倍。”这家半导体设备制造商的首席执行官加里 · 迪克森（Gary Dickerson）在采访中表示。发表此番言论前，该公司举办活动正式揭幕了位于硅谷、投资 50 亿美元（IT之家注：现汇率约合 335.02 亿元人民币）的 EPIC 中心，该中心专注于设备、工艺创新与成果商业化。这座耗资 50 亿美元（现汇率约合 335.02 亿元人民币）打造的设施，旨在帮助芯片厂商联合科研人员与设备合作伙伴，加快研发进度。作为美国最大的半导体设备生产商，应用材料正受益于人工智能热潮带动的设备需求激增。公司自身也在利用人工智能工具开展创新与产品研发，同时寻找提升半导体良率的办法，良率指硅晶圆产出可用芯片的比例。“对我们的客户而言，产出更多合格芯片意味着巨大收益。”他说。公司正在客户现场落地 AI 应用，以此提升“单块晶圆的合格芯片数量以及每日晶圆处理量”。迪克森拒绝给出未来几年的员工人数预测数据。截至 7 月下旬，公司员工约 38,900 人。这位高管提到，在部分业务板块，人工智能带来了巨大的生产力提升，部分场景下效率增幅可达 50%，公司会在这些领域进行招聘。这座坐落于加州森尼韦尔市的 EPIC 中心，由应用材料联合台积电、英特尔公司、三星电子、美光科技以及 SK 海力士等客户共同打造。中心占地 60 万平方英尺（折合 5.6 万平方米），拥有近 4 英亩的先进洁净车间，用于芯片相关研发。公司介绍，项目所用混凝土足以填满 34 个奥运标准泳池，使用的钢材可以建造两座埃菲尔铁塔。迪克森表示，AI 产业扩张存在一些短期风险，可能造成发展阻力，例如资金、物料、能源以及产能不足，但长期来看，这一轮增长将具备“变革性”。“短期来看，确实存在一些因素会放缓增长速度。”他说，“但无论在哪种情形下，增长规模都会十分可观。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/134.htm", "publishedAt": "2026-10-12T23:11:14+00:00"}, {"title": "苹果上线“切换到 Safari”：在 Mac 上视频播放时长比 Chrome 多 5 小时，网站加载速度快 35%", "summary": "IT之家 10 月 13 日消息，科技媒体 9to5Mac 昨日（10 月 12 日）发布博文，报道称苹果美国官网上线“切换到 Safari”（Switch to Safari）宣传活动，通过新网页与两段视频推广 Safari 在 Mac 上的续航、速度与隐私表现。整体定位方面，苹果公司在新宣传页面中，通过对比 Chrome 和 Safari 浏览器，从而突显 Safari 浏览器的诸多优势，包括更长电池续航、更强隐私保护与更快性能。苹果称，与 Chrome 相比，Safari 在 Mac 上可提供最多 5 小时的视频流媒体播放时间。在加载经常访问的网站时，Safari 的速度最高比 Chrome 快 35%。隐私方面，苹果表示 Chrome 允许更多第三方跟踪器跨网站跟踪用户，并收集数据后出售给广告商。苹果还称 Chrome 不会记住用户希望隐藏的干扰内容。功能SafariChrome在 Mac 上浏览时，常用网站的页面加载速度更快是否Mac 单次充电即可全天播放流媒体视频是否动画内容的渲染性能更佳是否高级 Web 应用中的 JavaScript 性能更快是否默认阻止第三方 Cookie 跟踪您是否利用机器学习对抗跟踪是否在“无痕浏览”中阻止已知跟踪器是否可隐藏令人分心的内容，并记住您的偏好 ²是否在 Mac 上播放 YouTube、Netflix 和 Apple TV 的 4K HDR 视频⁵是否新页面提供 Safari 与 Chrome 的并排比较图表，并介绍阅读模式（Reader Mode）、通知我（Notify Me）、配置文件（Profiles）与 Apple Pay 等功能。苹果同时发布两段视频，分别展示 Safari 的干扰控制（Distraction Control）与智能跟踪预防（Intelligent Tracking Prevention）功能。干扰控制是 Safari 的页面管理功能，允许用户隐藏网页上的特定干扰元素，例如弹窗、覆盖层或部分广告内容。用户可针对单个网站保存隐藏设置，便于后续访问时保持页面整洁。IT之家附上相关视频如下：智能跟踪预防是 Safari 的隐私功能，用于限制第三方跟踪器跨网站识别用户。它可阻断或限制跟踪脚本与 Cookie，减少广告商根据浏览行为建立用户画像的范围。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/133.htm", "publishedAt": "2026-10-12T23:06:15+00:00"}, {"title": "AI 智能体三周重构 30 万行代码，Code Health 从 5.6 升至 10.0：代码真的变好了吗？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/Qk7CzmLpDCvfYpAiU6Tf?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-12T16:00:00+00:00"}, {"title": "给 DeepSeek Harness（DSH）装上 bot 插件，把 DSH 变成 bot 系统", "summary": "DeepSeek Harness 有了一个把它『Bot 化』的插件 —— DeepSeek Bot（DS Bot）做的事情一句话能讲清：支持你搭一个长期存在的 bot 团队——有主 bot、有 bot 之间互相发消息、有群聊。它自己申明得很清楚，这是独立社区项目，不是 DeepSeek 官方产品。 最有意思的设定是那个 main bot。第一次打开 DS Bot，系统已经给你配...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.n 认为，传统的单体 CPU 架构难以处理存储控制所需的数百个细节功能。过去，CPU 核心仅仅在提升性能，但这导致了严重的功耗浪费和不可预测的流水线延迟。为克服这些 CPU 限制，SK 海力士推出了自研的超轻量事务专用处理器“H-TPU”作为解决方案。H-TPU 不是用于 AI 计算的张量加速器，而是一个可编程处理器，专门用于控制 SSD 数据平面和处理事务，摒弃依赖单一庞大通用 CPU，核心方法是拆解控制功能，将处理器划分为功能单元，并分布到数十个小型 TPU 集群中。구인재解释道：“H-TPU 采用了简化的四级流水线，排除了超标量和非顺序执行设备，其占用面积仅为通用 CPU 核心的 1/25（约占总 CPU 面积的 4%），功耗仅约为 1/25%（约 2.5%）。”他补充道：“只有与特定任务（如写入）相关的功能模块才能工作，而未使用的模块则切换到最低功耗模式，从而大幅节省了整个控制器的功耗。”SK 海力士计划将 H-TPU 技术应用于其各类 NAND 存储器产品线，包括下一代企业级固态硬盘（eSSD）控制器。之后，它将被用于下一代 AI 存储架构“Storage Next”。此外，SK 海力士预计，围绕 H-TPU 的控制器创新将与明年发布的新一代高带宽闪存“HBF（高带宽闪存）”结合，带来强有力的协同效应。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/160.htm", "publishedAt": "2026-10-13T01:15:13+00:00"}, {"title": "从 Agent 到 Loop：AI 正如何重构软件工程？｜QCon 上海 2026 即将开幕", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/DpieQJ598YdxQC8Ymjso?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-12T17:19:27+00:00"}, {"title": "百目 JArgus v2.0.6 — 静态检查器误报治理版本", "summary": "百目 JArgus v2.0.6 静态检查器误报治理专项版本：注解修饰的代码、编译器生成方法与框架反射调用点不再被误判，死代码检测理解 lambda 与方法引用，多个检查器的豁免规则对齐业界惯例。 github: https://github.com/vfaner/jargus/releases/tag/v2.0.6 Gitee: https://gitee.com/super_rgh/jargus/releases/tag/v2.0.6...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502961", "publishedAt": "2026-10-11T10:16:36+00:00"}, {"title": "利用 AI 代码智能体优化软件架构的五种方法", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/soRObi5sjdTTUM95zLJK?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-11T10:04:31+00:00"}, {"title": "陶哲轩转发抵制声明，数学界和OpenAI彻底撕破脸", "summary": "数学家该怎么证明自己真的不需要 AI#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1683401?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-10-09T10:21:04+00:00"}]}]};

const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
