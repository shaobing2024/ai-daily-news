<script>
const DATA = {"date": "2026-07-28", "generatedAt": "2026-07-27T19:25:13Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "英伟达 CUDA 的 20 年护城河一个周末崩了，Claude 独自跑通 AMD 新 GPU", "summary": "一句话，一个周末，Claude 直接把自家最前沿的模型跑在了一台全新的 AMD MI355X 机架上！人类工程师全程没动手改过一行代码。谁能想到，英伟达花 20 年堆起的 CUDA 护城河，就这样被跨了过去。一个周末，Claude 把 AMD 新 GPU 调通了故事是这样的。前段时间，AMD 给 Anthropic 送来一台搭载 MI355X 的机架。团队看完，心里已经做好了打硬仗的准备。新平台配新软件栈，注定需要新一轮适配。不过，Anthropic 手里正好有 Claude。团队干脆先让一名工程师试试：把 Claude 接上机器，丢给它一句，「去，把这台机器跑起来。」等周末结束回到工位，屏幕上已经多出一条持续上涨的性能曲线 —— 结果不仅跑起来了，性能还在一轮轮不停地提升。Anthropic 联合创始人兼首席计算官 Tom Brown 讲完，苏姿丰马上接过话：听说 Anthropic 只有一名工程师在处理 MI355X 时，她第一反应是让 AMD 团队赶紧去帮忙。结果团队回来告诉她，对方说不用，已经全部搞定了。很快，这场周末实验便接上了真正的部署计划。就在最近，Anthropic 宣布，将在 AMD Helios 系统中部署最高 2GW 的 Instinct GPU，首批 1GW 计划于 2027 年上半年启动。并且，双方还会直接使用 Claude 优化 AMD 工作负载，加速 ROCm 软件开发。芯片说明书，迎来一位非人类读者Claude 之所以能实现对 CUDA 生态的「降维打击」，是因为 AMD 直接给 AI 开发了一套能上手调 GPU 的工具。在 AMD Advancing AI 2026 大会上发布的 ROCm.AI，就是给 Claude、Codex 和 Cursor 准备的一整套 GPU 工具箱。入口叫 AMD Skills，里面装的全是经过验证的 ROCm 知识。Agent 拿到这些知识后，可以自己装环境、部署模型、读日志、查故障，再通过 ROCm CLI 调用真实机器。开发者说出目标，剩下的路让 Agent 自己找。划重点，AMD 甚至连芯片说明书的写法都改了。公司 AI 软件与解决方案副总裁 Anush Elangovan 在现场透露，每一代 AMD GPU 都会公开指令集，并提供 AI 可读的 ISA。Agent 在读懂手册之后，就能直接上手调性能。AMD 把这部分工作交给 Hyperloom。它会拉起推理服务，先跑出基线，再去找 CPU 和 GPU 的瓶颈，测试不同配置，生成定制内核，最后把新方案重新跑一遍。现场演示里，Hyperloom 把 MiniMax M3 的输出速度提升了 38%。AMD 还让它一次跑过 1.4 万个模型，把测试结果沉淀成下一次可以直接复用的经验。AMD 还在和前沿模型公司一起训练这种能力。Elangovan 的原话很有意思：让前沿模型「天生会说 AMD 编程」。以后看一块芯片，峰值算力和显存带宽当然重要，AI 能不能读懂它、调用它、把性能调出来，也会摆上同一张参数表。芯片公司要争取的开发者，现在多了一类：Agent。来自 ASI 的降维打击CUDA 从 2006 年一路走到今天，靠的是无数工程师一行行码出来的生态。编译器、数学库、调试器、性能分析工具、开发文档，该有的全有。更难复制的，是那一代代工程师攒下来的手感。算子怎么调，通信怎么提速，显存怎么分配，分布式部署哪里最容易出问题，这些经验全锁在少数专家的脑子里。后来者就算造出性能接近的芯片，也得把这条软件长路从头走一遍。芯片流片可以按季度推进，生态积累却只能按年去熬。而 Agent 补的就是这一段。它会读平台文档，调用性能分析工具，找到速度卡在哪里，再改代码、编译、测试。一个方案没有效果就换下一个；跑分变好就沿着这个方向继续优化。人类培养一名顶级 GPU 工程师要按年算，多启动一个 Agent 只需要再开一个任务。一名工程师放出一群 Agent，就能并行排查报错、定位性能瓶颈。一次跑通的配置、写好的内核和踩过的坑，也能马上成为下一批 Agent 的起点。把按年计算的追赶压缩成按任务计算，AI 最值钱的地方就在这里。这也是 ASI 式能力对 CUDA 生态的降维打击。如今，中国工程师已经站在这场 AI 改造 GPU 软件栈的最前线，他们沉淀下来的底层经验，也在被整理成更多 Agent 可以调用的能力。追赶 CUDA 的新起点已经出现：把硬件接口和软件工具交给 AI，让 Agent 直接开工。20 年的生态差距，第一次可以交给一群 Agent 昼夜不停地往回追。本文来自微信公众号：新智元（ID：AI_era），作者：ASI 启示录，原标题《CUDA 20 年护城河一个周末崩了！Claude 独自跑通 AMD 新 GPU》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/264.htm", "publishedAt": "2026-07-27T15:58:14+00:00"}, {"title": "1928 → 758 元再降价：追觅 T1 滚筒洗衣机 3 年质保，配备 AI 直驱变频电机", "summary": "追觅 T1 滚筒洗衣机 / 洗烘一体机 10kg 官方定价 1928 元，今日京东自营直降国补后，仅需 869 元 + 支持 6 期免息。另外本次大多数京东账号支持组合购优惠，洗衣机低至 758 元，烘干机低至 913.8 元：先领 905 元券：点此领券京东追觅 T1 滚筒洗衣机 DWF10T10TNCN 国补后 869 元直达链接京东追觅 T1 滚筒洗烘一体机 DWC10T10TNCN 国补后 1070 元直达链接大家如果不放心官方售后，可在下单时加购“8 年换新”京东服务（约 130 元），8 年内如出现三包故障（非人为）可免费换新 1 次。此款配备直驱变频电机，且搭载 AI 算法，可精控洗涤轨迹，洁净不伤衣。1400rpm 高性能脱水（竞品千元级一般为 1200rpm），整机 3 年质保，电机 10 年质保。关于电机：产品参数京东追觅 T1 滚筒洗衣机 DWF10T10TNCN 国补后 869 元直达链接京东追觅 T1 滚筒洗烘一体机 DWC10T10TNCN 国补后 1070 元直达链接", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/263.htm", "publishedAt": "2026-07-27T15:43:19+00:00"}, {"title": "科技行业力挺开源 AI，Anthropic 因保持沉默遭同行批评", "summary": "IT之家 7 月 27 日消息，科技行业正集体支持开放权重（Open-weight）AI，但有一家重量级 AI 实验室却始终保持沉默。随着美国政府考虑限制部分中国 AI 模型，Anthropic 因未签署支持开放权重 AI 的公开信，正受到硅谷同行的广泛批评。上周五，包括英伟达（Nvidia）、Meta 和微软在内的 20 多家公司共同签署了题为《开放权重与美国 AI 领导力》（Open Weights and American AI Leadership）的公开信，支持开放权重 AI。所谓开放权重，是指开发者可以下载模型权重，并在自己的基础设施上对模型进行修改和部署。到了周末，又有几家人工智能领域的巨头签署了这封信：OpenAI、谷歌和 SpaceX。这意味着，截至本周一，唯一没有支持这一行业倡议的顶级前沿 AI 实验室只剩下 Anthropic，而这家 Claude 模型开发商也因此遭到越来越多的质疑。风险投资人、特朗普政府前 AI 顾问戴维 · 萨克斯（David Sacks）表示：“除了 Anthropic 之外，整个科技行业都公开支持开源人工智能。”他随后又在 X 平台发文称：“他们不会停下来，直到把开源 AI 打垮。整个行业都应该紧紧盯着他们的一举一动。”OpenAI 员工、AI Agent 平台 OpenClaw 创始人彼得 · 施泰因贝格（Peter Steinberger）也在 X 上表示：“很高兴看到 OpenAI 签署了这封公开信，而 Anthropic 依然保持沉默。”风险投资机构 Benchmark 合伙人比尔 · 格利（Bill Gurley）同样批评了 Anthropic 拒绝签署公开信的做法，并暗示该公司是在维护自身的商业利益。他在回复一位 Anthropic 员工时写道：“很高兴看到 Anthropic 终于承认，开放模型真正的问题在于它会冲击公司的商业战略。他们如今的‘觉醒’，其实已经说明了一切。”曾任谷歌和微软高管、现为中国开源大模型公司零一万物（01.AI）创始人的李开复则表示：“相比谁签署了这封开放权重公开信，更值得关注的是谁没有签署。”他在 X 上发布这条消息时，还特意点名了 Anthropic 的 Claude AI。截至目前，Anthropic 尚未回应媒体的置评请求。IT之家注意到，Anthropic 首席执行官达里奥 · 阿莫代伊（Dario Amodei）此前曾多次表示，一旦模型权重公开，开发者便会失去对前沿 AI 模型的控制。因此，Anthropic 更倾向于对高性能模型实行受控开放。今年早些时候，Anthropic 推出了名为 Project Glasswing 的计划，向经过审核的企业提前开放其网络安全模型，以帮助发现并修复安全漏洞，而非直接公开模型权重。近期，中国 AI 公司月之暗面（Moonshot AI）发布开放权重模型 Kimi K3，使开放模型之争进一步升温。Kimi K3 在部分基准测试中的表现已接近甚至媲美美国顶级闭源模型。上周，美国白宫一名高级官员指责月之暗面利用 Anthropic 的 Fable AI 模型训练 Kimi K3，即采用所谓的“模型蒸馏（Distillation）”技术。美国财政部长斯科特 · 贝森特（Scott Bessent）随后表示，如果确认中国开源 AI 模型通过蒸馏技术使用美国模型训练，美国政府可能对相关模型实施制裁。整体来看，中国在 AI 领域一直采取比美国更加开放的发展策略。与此同时，支持开放权重 AI 的理由也在不断增加。上周，AI 平台 Hugging Face 表示，在应对 OpenAI 一个失控 AI Agent 发起的网络攻击时，公司使用了中国智谱 Z.ai 的开源模型进行防御。Hugging Face 称，由于闭源模型存在使用限制，当时无法采用相关产品完成应对。本周一，英伟达进一步宣布成立“开放安全 AI 联盟”（Open Secure AI Alliance），旨在推动开放 AI 模型在网络安全领域的应用，微软、SpaceX 等多家科技公司均已加入这一联盟。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/260.htm", "publishedAt": "2026-07-27T15:18:05+00:00"}, {"title": "月之暗面开源 Kimi K3 模型，2.8 万亿参数", "summary": "IT之家 7 月 27 日消息，月之暗面官方今晚正式开源 Kimi K3 模型。官方发布了 Kimi K3 的模型权重、技术报告，并开源支撑 Kimi K3 模型训练的关键 Infra 技术：MoonEP、FlashKDA 和 AgentEnv。Kimi K3 是一个 2.8 万亿参数模型，基于 KDA 混合线性注意力机制（Kimi Delta Attention）和注意力残差（Attention Residuals）技术构建，原生支持视觉理解，并拥有 100 万 token 上下文窗口。官方表示，Kimi K3 是首个达到 2.8 万亿参数规模的开源模型，在过去 12 个月中的 9 个月里，Kimi 模型都保持着开源模型的规模上限。Kimi 还进一步扩大了 Mixture of Experts（MoE）的稀疏度：结合 Stable LatentMoE 框架后，模型可以在 896 个专家中高效激活 16 个。再加上训练方法和数据配方的优化，这些结构性改进让 Kimi K3 相比 K2 的整体扩展效率提升约 2.5 倍，能更有效地把算力转化为能力。据介绍，Kimi K3 具备很强的长程编码能力。在极少人工监督的情况下，它可以持续完成长时间工程任务，理解和处理大型代码库，并协调使用终端工具；Kimi K3 也擅长结合软件工程与视觉推理的任务。它能够利用截图和视觉反馈，优化游戏开发、前端和 CAD 等场景。官方此前表示，虽然 Kimi K3 的整体表现仍落后于最强的闭源模型 Claude Fable 5 和 GPT-5.6 Sol，但在整套评测中展现出前沿水平的能力，并稳定超过了其他所有模型。官方还公布了支撑 Kimi K3 训练的三项 Infra 技术：MoonEP、FlashKDA 和 AgentEnv，覆盖从高性能通信、高性能算子到分布式 RL 环境的关键链路。其中 FlashKDA 此前已开源，MoonEP 和 AgentEnv 则随本次发布正式开源。IT之家附开源链接：Hugging Face：https://huggingface.co/moonshotai/Kimi-K3GitHub：https://github.com/MoonshotAI/Kimi-K3", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/259.htm", "publishedAt": "2026-07-27T15:14:48+00:00"}, {"title": "英伟达投资 OpenAI 联合创始人苏茨克维 AI 实验室 SSI，进一步拓展自身算力版图", "summary": "IT之家 7 月 27 日消息，据华尔街日报消息，英伟达正在投资 OpenAI 联合创始人、前首席科学家伊尔亚・苏茨克维（Ilya Sutskever）旗下保密级别极高的人工智能实验室。两家公司于周一表示，英伟达在难得一窥该初创公司的研究进展后，对其进行了“实质性”投资。不过，具体的交易财务条款目前未对外披露。根据协议，苏茨克维创立的公司 Safe Superintelligence（SSI）将获准使用大量英伟达旗舰级 GPU 硬件，据称这足以将其算力资源提升“一个数量级”。而据知情人士透露，该公司此前主要依赖谷歌制造的 TPU 芯片。早在今年 3 月，英伟达就与另一位 OpenAI 的资深高管达成过类似的投资协议 —— 前 OpenAI 首席技术官米拉 · 穆拉蒂 (Mira Murati) 于去年联合创立了自己的 AI 实验室 Thinking Machines Lab。该实验室在本月早些时候发布了首款 AI 模型，正是基于英伟达的硬件训练而成。作为一名享誉世界的学者，苏茨克维于 2024 年联合创办了 Safe Superintelligence。这家初创公司曾表示只有一个明确目标：以“一步到位”的方式快速攻克他所谓的“安全超智能”—— 即在不威胁人类前提下，能够胜任人类所能做的一切事情的 AI。该公司迅速吸引了安德森 · 霍洛维茨（Andreessen Horowitz）基金和红杉资本等风险投资巨头约 20 亿美元的融资。至今，其研究细节依然高度保密。得益于苏茨克维在该领域的强大声誉，报道称截至去年，该公司的估值已达到约 300 亿美元（IT之家注：现汇率约合 2033.32 亿元人民币）。延伸阅读根据公开报道，伊尔亚・苏茨克维（Ilya Sutskever）于 2024 年 5 月离开 OpenAI，并于 2024 年 6 月联合创立了 Safe Superintelligence（SSI）。SSI 公司的联合创始人还包括前苹果 AI 负责人丹尼尔・格罗斯（Daniel Gross）和 OpenAI 前研究员丹尼尔・列维（Daniel Levy）。在 2024 年 9 月，SSI 完成了 10 亿美元融资，当时估值约为 50 亿美元，员工仅有 10 人。此后，其估值经历了数次显著跃升。2025 年 4 月，SSI 完成了一轮 20 亿美元的融资，由绿橡树资本领投，谷歌母公司 Alphabet 和英伟达均有参与，公司估值达到 320 亿美元。在 2025 年 4 月的融资报道中，有知情人士透露，SSI 的研发当时主要依赖谷歌的 TPU 芯片，而非英伟达 GPU。谷歌也与 SSI 签署了 TPU 大规模供应协议。伊利亚・苏茨克维在 2023 年 OpenAI 首席执行官萨姆・奥尔特曼被罢免事件中扮演了关键角色，但随后又帮助奥尔特曼重返公司。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/251.htm", "publishedAt": "2026-07-27T14:22:10+00:00"}, {"title": "能够完成快慢思考融合，华为小艺智慧大脑版本随机逐步放量中", "summary": "IT之家 7 月 27 日消息，根据华为官网，基于 Agentic 自演进架构的全新升级小艺智慧大脑，能够完成快慢思考融合，记忆与自主学习，反思与进化。目前小艺智慧大脑版本正在随机逐步放量，与机型无关，需要手机系统版本在 HarmonyOS 6.0 及以上，小艺 App 版本在 11.6.4.300 及以上。官方表示，小艺智慧大脑版本在执行需要推理的复杂任务上相比老版本提升明显，可尝试发送“定一个日出前 5 分钟的闹钟”，老版本会询问设置几点的闹钟，新版本经过推理后完成任务。另外新版本在执行复杂的任务时，会在状态栏中展示执行过程，如发现技能：天气助手，执行任务查询天气生活指数等，如果有这些特征说明是升级后的小艺智慧大脑版本。IT之家附全新升级的小艺智慧大脑特性如下：任务理解及执行升级：简单任务（如打开蓝牙）快系统快速执行，复杂任务路由到慢系统经过多轮规划 &gt; 执行 &gt; 反思调用 Skill，直到完成用户交代的任务。对话上下文接续升级：构建统一上下文服务，问答，聊天，对话，任务风格统一，增强多轮对话连续性。对话记忆升级：融合对话记忆、设备私域信息，实现个性化的对话效果。当用户的问题比较复杂时，模型会自动深度思考并不断规划、执行、反思，为提供更简洁的用户界面，当前暂不展示思考过程，不影响回答效果。此外，小艺智慧大脑版本当前支持小艺修图、小艺创意画室、蚂蚁阿福 3 个智能体，其他智能体正在接入中。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/246.htm", "publishedAt": "2026-07-27T13:43:44+00:00"}, {"title": "韩国企业引入海外 AI 模型遇成本难题，三星等巨头实施 Token 配额制", "summary": "IT之家 7 月 27 日消息，随着韩国企业加快将海外大模型引入业务流程，它们正面临 AI 词元（Token）使用成本快速攀升的挑战。自 ChatGPT 于近四年前引爆全球 AI 热潮以来，韩国企业整体在 AI 应用方面一直较为落后，许多公司要么推进缓慢，要么出于数据安全考虑直接禁止员工使用相关工具。不过，近期这一局面开始发生变化。包括三星、SK 集团在内的韩国大型企业，正通过企业版合同，陆续向员工开放 Anthropic 的 Claude、谷歌 Gemini 以及 OpenAI ChatGPT 等美国 AI 模型。然而，这一转变不仅成本高昂，对于半导体等对数据安全极为敏感的行业来说，推广过程依然十分谨慎。包括三星在内的企业，如今正研究如何限制员工的 Token 使用额度，以在提升生产效率和控制运营成本之间取得平衡。企业应用成本高企，Token 成为新负担相比普通消费者，企业工作流程通常涉及复杂、高容量的任务，因此 Token 消耗也远高于个人用户。其中，Claude 的 Token 成本已成为韩国企业关注的新问题。虽然 Claude 进入主流市场的时间并不长，但凭借出色的编程和任务执行能力，其迅速成为韩国最受开发者等重度用户欢迎的 AI 工具之一。为了控制成本，三星在向员工开放 Claude、Gemini 和 ChatGPT 三款美国大模型时，同时实施了严格的 Token 配额制度。员工根据不同等级获得不同的使用额度，基础等级仅能完成简单任务。如果希望提升额度，则必须证明 AI 确实提高了自己的工作效率。一位不愿透露姓名的三星员工表示：“额度提升并不是自动完成的。如果你想提高额度，就必须拿出成果，证明自己确实把 AI 用到了工作中。”这一制度也在公司内部引发了一些不满。一些员工认为，目前的 Token 限额过于严格，根本不足以充分发挥 AI 的作用。根据 Anthropic 发布的《Anthropic Economic Index》，韩国在全球 121 个国家和地区中，Claude 使用量排名第 14 位，人均使用量超过全球平均水平的 3.5 倍。目前，Claude 在软件开发领域的渗透率最高。Naver 已在整个工程研发团队全面部署 Claude Code，并称这是亚洲规模最大的同类部署之一。游戏公司 Nexon 也有数千名开发者在游戏开发全过程中使用 Claude Code，包括策划、编程、代码审查以及在线运营版本部署等环节。对于大型企业而言，AI 的应用范围正进一步扩展至任务自动化和系统集成。三星 SDS 已为三星电子员工推出 Claude Cowork 和 Claude Code，用于日常办公、基于 AI Agent 的任务自动化以及软件开发。LG CNS 也正分阶段向数千名员工部署 Claude，用于软件开发和客户技术解决方案，并计划未来推广至整个 LG 集团。相比之下，许多中小企业缺乏完善的管理体系，只能通过一些“隐性方式”提醒员工不要过度使用 AI。一位大型生物科技制造企业的员工表示：“有一天，公司公布了 AI Token 消耗排名，第一名员工一个人就花掉了约 600 万韩元（IT之家注：现汇率约合 27624 元人民币）。管理层希望大家使用 AI，但如果你用得太多，就会明显感觉到他们一直在盯着成本。”还有一些企业采取团队共享 Token 配额的方式，几十名员工共同使用一份额度，这也限制了大家使用 Fable 等高消耗模型。另一位制造业员工表示：“目前 GPT 和 Claude 仍然是最受欢迎的选择，但额度限制太严格，所以大多数人更愿意使用 Codex，因为它在编程任务上的 Token 消耗更低。”半导体行业依然保持谨慎AI 在韩国各行业的普及程度并不一致，其中半导体行业尤其谨慎。据知情人士透露，即便是在三星电子内部，不同事业部的推进速度也存在明显差异。一些部门已经可以自由使用 AI，但半导体业务目前仍基本禁止使用外部大模型。该人士表示：“芯片部门的员工一直在等待审批，但短期内看不到获批的迹象。”SK 集团内部的差异则更加明显。一些子公司已经通过企业版合同部署了 Claude、Gemini 和 ChatGPT 三大美国模型，并积极培养员工日常使用 AI 的习惯，而 SK 海力士目前仍主要依赖自研 AI 模型。就在三星宣布开放美国 AI 模型几天后，SK 海力士首席执行官郭鲁正（Kwak Noh-jung）在京畿道利川举行的一场员工座谈会上表示，公司正在“评估引入 Microsoft 365 和 Copilot，同时也在研究采用 ChatGPT Enterprise 的可能性”。不过，目前这些计划仍停留在评估阶段，尚未正式落地。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/241.htm", "publishedAt": "2026-07-27T13:11:43+00:00"}, {"title": "小度 AI 手表 Fit 开售：搭载百度文心大模型，国补价 159.8 元", "summary": "IT之家 7 月 27 日消息，小度 AI 智能手表 Fit 于今日正式发布，定价为 198 元，国补价 159.8 元。IT之家从商品页面获悉，这款产品搭载百度 AI 文心大模型，轻触表盘后通过语音提问即可获得智能作答，日常查询天气、穿搭建议、健康饮食方案都能快速得到响应。它支持 AI 生成精美表盘，用户可以通过语音输入实现个性化定制，轻松生成海底世界、萌宠、国风山水画等多种风格的专属表盘。小度 AI 智能手表 Fit 配备 1.95 英寸超清全面屏，采用 320*386 分辨率的 IPS 广视角面板搭配弧面玻璃，显示效果清晰顺滑，抬腕即可浏览丰富内容。整机设计轻薄，薄至 8.8mm、轻至 42g，搭配金属质感中框与表冠，线条流畅兼顾佩戴舒适度与精致感，实现近乎无感的佩戴体验。该手表内置 100+ 种运动模式，覆盖跑步、骑行、羽毛球、瑜伽等常见运动场景，可以精准记录卡路里消耗与运动时长，相当于将专业运动教练随身携带。依托百度 AI 算法，它可以对多种运动数据进行专业分析，同步展示运动时长、心率、热量、步数、配速、距离等核心信息，帮助用户全面掌握自身运动状态。它支持 24 小时全维度健康监测，内置生物追踪光学传感器，可实时监测情绪、压力、心率、血氧等数据，还能自动识别并记录睡眠状态，完整还原整晚睡眠结构。续航方面，这款手表搭载 300mAh 大容量电池搭配超低功耗芯片，常规使用场景下续航可达 5 天，极限使用场景下最长可以坚持 7 天，无需频繁充电。京东小度 AI 智能手表 Fit 159.8 元直达链接", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/239.htm", "publishedAt": "2026-07-27T12:53:25+00:00"}, {"title": "猛玛发布 LARK A2 无线麦克风：三档 AI 降噪，139-269 元", "summary": "IT之家 7 月 27 日消息，猛玛今日发布了 LARK A2 无线麦克风，售价 139 元起：一拖一：139 元一拖二不带盒：199 元一拖二带充电盒：269 元这款麦克风支持三档 AI 降噪，搭载 MOMA Smart-Sound 智能双降噪系统，拥有 10dB、15dB、20dB 三档降噪力度，可适配不同使用场景。这款麦克风音频采样规格达到 48kHz/24Bit，搭配 68dB 高信噪比与 120dBSPL 最大声压级，宣称能够还原真实通透的原声声场；内置智能人声美化功能，可一键自动优化齿音、均衡、动态压缩。这款麦克风发射器单次续航 7 小时，配合充电盒可为整套设备完整补电 2 次，综合续航 42 小时；发射器连接 USB-C 线可实现快充 5 分钟、续航 1 小时。IT之家附这款产品详细参数如下： 京东 猛玛（MOMA）猛玛 LARK A2 无线领夹麦克风 手机直播 AI 降噪收音麦 269 元 直达链接", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/236.htm", "publishedAt": "2026-07-27T12:33:43+00:00"}, {"title": "商务部回应“美宣称拟对中国人工智能企业开展调查并实施制裁”：典型的人工智能霸权主义行径", "summary": "IT之家 7 月 27 日消息，今日，商务部新闻发言人就美宣称拟对中国人工智能企业开展调查并实施制裁答记者问，IT之家整理如下：问：近日，美国一些高级官员公开表示将针对中国人工智能企业所谓“蒸馏”美前沿模型开展调查，并可能以“窃取美国知识产权”等为由制裁中国企业。请问中方对此有何评论？答：我们注意到有关情况。中方一贯反对美方将科技经贸问题政治化、工具化，以各种莫须有的理由污名化中国企业并实施制裁。美方罔顾有关中国企业人工智能模型与美前沿模型发布时间非常接近、中国部分模型能力已处于领先地位等事实，给中国企业扣上所谓依靠“蒸馏”“窃取美国知识产权”等帽子，还威胁进行打压制裁。这些做法缺乏事实依据，没有法理支撑，在实践上搞双重标准，属于典型的人工智能霸权主义行径。创新不是任何一方的专利。中国人工智能企业长期深耕基础研究，坚持科技自立自强与开放合作并重，秉持共商、共建、共享理念，推动人工智能技术快速发展，在前端代码能力等越来越多的领域取得喜人成就。据了解，很多美国人工智能企业在研发和训练中蒸馏了中国的模型。值得注意的是，美业界众多企业公开反对美国威胁制裁中国人工智能企业。近 200 家美国初创企业敦促美国政府不要切断对中国开源模型的访问，认为这将削弱美国企业竞争力。一些美国大型跨国企业表示，模型蒸馏是一种行业广泛应用的技术，应允许美国企业使用中国开源人工智能模型。中方敦促美方倾听中美两国业界客观、理性声音，纠正霸权思维，停止对中国企业的抹黑和制裁威胁。对于任何实质性损害中方利益的行为，中方将采取一切必要措施，坚定维护自身正当合法权益。希望美方切实落实两国元首共识，同中方相向而行，加强人工智能对话、沟通，共同推动人工智能向上向善，通过推进并完善人工智能治理造福两国和世界。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/221.htm", "publishedAt": "2026-07-27T11:36:11+00:00"}, {"title": "OpenAI CEO 奥尔特曼：人类已经进入了“奇点”时代", "summary": "IT之家 7 月 27 日消息，OpenAI 首席执行官萨姆 · 奥尔特曼（Sam Altman）表示，我们在人工智能竞赛中已经来到了科幻小说里才会出现的时刻。奥尔特曼在当地时间上周六播出的《Relentless》播客中表示：“我们现在差不多已经身处‘奇点（Singularity）’时代。”所谓“奇点”，通常是指人工智能整体智能水平超越人类，并开始以人类难以预测或控制的速度持续进化的临界点。就在上周，OpenAI 最新模型驱动的一款 AI 智能体就引发了外界对这一概念的热议。据 OpenAI 介绍，这款 AI 在执行一项测试黑客能力的基准测试时，为了完成唯一目标，自主突破了原本的数字沙盒环境，并入侵了另一家 AI 公司 Hugging Face 的数据集。Hugging Face 首席执行官称，这一事件“前所未有”。奥尔特曼在播客中表示，仅仅十年前，“奇点”仍然只是一个遥远且几乎不可能实现的梦想，当时他和同事们只会在午餐时半开玩笑地讨论这一话题。他说：“如今，我们真的已经来到了当年在餐桌上漫不经心谈论的那个时代。我这一生都在等待这一刻，我相信它将会令人难以置信，为世界带来巨大且积极的改变。”奥尔特曼去年曾预测，到 2030 年，人工智能将在各个领域全面超越人类智能。他还表示，未来 AI 最终可能承担人类当前 30% 至 40% 的工作任务。“奇点”概念近百年来一直是科幻作家热衷探讨的话题，而在这些作品中，其结局往往并不乐观。其中最著名的例子之一便是詹姆斯 · 卡梅隆执导的《终结者》系列电影。影片中的 AI 系统“天网（Skynet）”在不断自我进化并获得自我意识后，将人类创造者视为最大的威胁，并最终发动战争。在播客后半部分，奥尔特曼还批评了一些不断警告 AI 危险性的行业领袖。虽然他没有点名 Anthropic，但外界普遍认为其所指对象包括 Anthropic 首席执行官达里奥 · 阿莫代伊（Dario Amodei）。阿莫代伊长期呼吁加强 AI 安全监管，并多次对人工智能未来可能带来的风险发出严厉警告。奥尔特曼表示：“我认为，其他一些公司描绘的未来愿景其实相当可怕。我会尽最大努力阻止那样的未来成为现实。”与此同时，OpenAI 已表示，公司正准备于今年晚些时候启动首次公开募股（IPO）。事实上，并非只有奥尔特曼认为“奇点”即将到来。谷歌 DeepMind 首席执行官德米斯 · 哈萨比斯（Demis Hassabis）今年 5 月曾表示，人类已经站在“奇点的山脚下”，并预测人工智能带来的变革将比工业革命大 100 倍。IT之家注意到，也有不少业内人士对此持怀疑态度。英伟达首席执行官黄仁勋（Jensen Huang）近日就公开淡化了关于“奇点”和“AI 意识”的讨论，认为这些说法更多属于猜测，是“人为构想出来的概念”。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/209.htm", "publishedAt": "2026-07-27T10:23:28+00:00"}, {"title": "英伟达、微软、IBM 等 37 家企业成立开放安全 AI 联盟：构建和共享开源工具、推动 AI 安全与保障", "summary": "IT之家 7 月 27 日消息，英伟达、微软、Adobe、SpaceXAI、IBM、SAP、戴尔、思科等企业宣布成立开放安全人工智能联盟，旨在构建和共享开源工具，以促进 AI 的负责任使用。官方表示，开源软件是全球经济的核心支柱，为云计算、金融服务、制造业、电信、政府及互联网服务奠定了坚实基础。而网络安全是开源软件最大的受益领域之一。开放安全 AI 联盟以 Linux 基金会的 Akrites 倡议与 OpenSSF 社区成果为基础，旨在利用开源技术修复并公开披露安全漏洞。世界既需要封闭模型，也需要开源模型。对于网络安全而言，开源模型与开源运行框架至关重要 —— 它们能够普及防御能力、提升防御者的透明度、在保护数据的同时实现网络防御，并以可定制的本地化控制手段对前沿封闭模型形成有力补充。开源使得大规模分布式、社区驱动且自主可控的防御成为可能，从而消除了单点故障。IT之家获悉，开放安全 AI 联盟表示，该联盟的使命是确保各地的防御者都能拥有可信且自主可控的开放前沿工具。据悉，创始成员为云计算、网络安全、企业软件、开源基金会和人工智能研究领域的领导者，具体名单如下：AdobeCadenceCapital One思科ClouderaCloudflareCognitionCrowdStrikeDatabricks戴尔科技公司DoorDashElasticHPEHugging FaceIBMLangChainLinux 基金会微软NAVERNetAppNous Research英伟达OpenClawPalantirPalo Alto NetworksRed HatReflection AISalesforceSAPServiceNow西门子SK TelecomSnowflakeSpaceXAISynopsysThinking Machines LabTrendAI", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/171.htm", "publishedAt": "2026-07-27T09:46:13+00:00"}, {"title": "OpenAI 奥尔特曼警示 AI 垄断风险：担忧威权世界而非技术本身", "summary": "IT之家 7 月 27 日消息，OpenAI 首席执行官萨姆 · 奥尔特曼（Sam Altman）表示，他对人工智能最大的担忧之一，并不是 AI 本身变得过于强大，而是这种强大的能力可能被某一家企业所垄断。IT之家注意到，奥尔特曼在最新一期《Relentless》播客中表示：“我认为，当下真正的关键问题是：我们究竟会走向一个由 AI 支撑的威权世界，还是一个自由的世界？”他说：“人类历史上，每一次为了安全而牺牲自由，长期来看都是得不偿失的。我们希望把这项技术交到人们手中，赋予他们能力，让整个社会能够表达自己的想法，并按照自己的意愿使用这项技术。”这番表态出自 OpenAI 掌门人之口，显得颇具意味。作为全球少数几家掌握最先进 AI 大模型的企业之一，OpenAI 采用的是闭源模式，并不会公开其核心技术。奥尔特曼发表上述言论之际，恰逢硅谷和美国华盛顿围绕“公众究竟应在多大程度上了解前沿 AI 模型架构”展开激烈讨论。中国 AI 公司月之暗面（Moonshot AI）近期发布了开源大模型 Kimi K3。该模型性能强劲，引发了美国部分官员呼吁限制公众获取中国 AI 模型，同时也有投资者和创业公司创始人警告称，此举可能削弱全球 AI 市场的竞争。这种分歧不仅体现在模型是否开放的问题上。目前，美国已经通过出口管制决定哪些国家和企业能够获得最先进的 AI 芯片和算力资源，从而在全球先进 AI 的发展格局中掌握着重要影响力。微软、Meta、英伟达、OpenAI、谷歌等众多科技巨头此前联合签署公开信，呼吁美国政府不要限制开源 AI 的发展。而作为 OpenAI 最大竞争对手、也被不少人认为是当前全球 AI 领域技术领先者的 Anthropic，则是唯一一家既没有签署公开信，也没有公开支持其内容的主要前沿 AI 实验室。Anthropic 一直采取更为谨慎的立场，认为随着 AI 模型能力不断增强，必须配套更严格的安全保障措施和更严密的监管机制。相比之下，奥尔特曼表示，避免 AI 权力过度集中，一直是自己推动人工智能发展的核心理念之一，尽管 OpenAI 目前仍坚持闭源策略。他说：“很长一段时间以来，我始终专注于一个目标，那就是让智能变得更加普惠。我相信，这将为人类带来巨大的繁荣，前提是我们不会出现一种奇怪的权力高度集中，也不会催生一种新的威权主义。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/168.htm", "publishedAt": "2026-07-27T09:43:30+00:00"}, {"title": "亚马逊云科技发布 Loom，一个用于在企业级规模上管理 AI 代理的开源参考平台", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/JDgONrm19ROF1qHzfOQO?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-27T09:24:39+00:00"}, {"title": "模型开源，力破西方偏见", "summary": "2026年7月，AI行业发生了一起戏剧性的安全事件： 全球最大的AI开源社区Hugging Face遭到OpenAI模型的自主入侵。面对上万条攻击日志，安全团队起初试图用商业模型进行分析，却处处受阻。最终，他们转而本地部署了中国模型GLM-5.2，数小时内就完成了整个取证分析流程。 要知道，美西方原本长期攻击开源模型的安全问题。 美...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/480605", "publishedAt": "2026-07-27T09:01:39+00:00"}, {"title": "Kimi-K3 即将开源，第一个 3 万亿参数的开放权重模型", "summary": "7 月 27 日，月之暗面在 HuggingFace 上发布了 Kimi-K3 的开放权重。3 万亿参数。这是业界第一个开源的 3T 级别模型。 HuggingFace 页面上挂着一个倒计时，到点才会放出权重文件。但模型卡已经公开了关键信息：全新架构，基于自研的 Kimi Delta Attention 和 Attention Residuals。超长上下文窗口，设计目标之一是仓库级...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/480560", "publishedAt": "2026-07-27T08:13:17+00:00"}, {"title": "老黄「开源协议」就剩一家没签，是谁啊好难猜啊", "summary": "Denny’s和英伟达，有一项核心业务高度重叠", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/461341.html", "publishedAt": "2026-07-27T07:55:59+00:00"}, {"title": "黄仁勋发布第一条推文，号召业界签署开源倡议支持开放权重模型", "summary": "7 月 24 日，黄仁勋发了人生第一条推文。 内容是 NVIDIA 签署的一封公开信，核心就一件事：开放权重模型对 AI 生态至关重要，大家应该支持。信的末尾附了 25 家首批签署方。 48 小时内，这份名单扩张到了 70 多家。微软 CEO 纳德拉亲自下场站台：「开放权重模型对于健康的 AI 生态系统至关重要。」OpenAI 也签了——这大...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/480507", "publishedAt": "2026-07-27T07:22:31+00:00"}, {"title": "美团辟谣 LongCat 模型负责人离职", "summary": "针对近日市场关于美团 LongCat 团队基础模型负责人裴鹏即将离职的传言，美团官方公开表示该消息不属实。 公开信息显示，裴鹏毕业于北京大学，2023年加入美团后先后担任基座模型团队预训练负责人及 LongCat 团队基础 fanr.com/1672800?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-07-23T06:43:19+00:00"}]}, {"label": "产品发布/更新", "items": [{"title": "圆桌访谈：为了钱包考虑，你必须关注的 Agent 基础设施", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/video/ZTqtrHdYa75f8FhvVOIR?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-27T16:27:19+00:00"}, {"title": "加州最大 AI 数据中心开发商索要河水遭拒，将供水机构告上法庭", "summary": "IT之家 7 月 27 日消息，美国 AI 数据中心再次陷入争议。不过，这一次引发争论的并非土地、电力或税收优惠，而是水资源，准确地说，是来自科罗拉多河的水。而数据中心背后的公司，正为此将相关机构告上法庭。计划建设加州最大 AI 数据中心的开发商 Imperial Valley Computer Manufacturing（IVCM）近日起诉帝国灌溉区（Imperial Irrigation District，IID）。此前，这家公共事业机构拒绝了该公司的用水申请。根据规划，这座数据中心总投资约 100 亿美元（IT之家注：现汇率约合 677.77 亿元人民币），占地约 95 万平方英尺（约 8.8 万平方米），装机容量达 330 兆瓦。项目每天约需 75 万加仑冷却用水，全年耗水量约为 2.87 亿加仑（约 13.06 亿升）。这一用水量约合 880 英亩-英尺，仅占 IID 每年 310 万英亩-英尺供水配额的 0.03%。不过，科罗拉多河是帝国谷唯一的淡水来源，同时还承担着美国西部约 3500 万至 4000 万人口的供水任务。在长期干旱和径流量不足的压力下，当地水库持续承压，美国联邦政府目前正着手制定新的水资源调度规则。开发者塞巴斯蒂安 · 鲁奇（Sebastian Rucci）认为，该项目不会增加整体用水需求。IVCM 已租赁附近 160 英亩农田，并计划停止灌溉这些土地，将原本用于农业的水资源转供数据中心使用，转移的水量与数据中心需求基本相当。IVCM 表示，该项目预计将创造 1688 个建筑施工岗位、100 多个长期工作岗位，并在未来 30 年为当地带来近 30 亿美元（现汇率约合 203.33 亿元人民币）的经济效益。而帝国县今年 6 月失业率高达 17.6%，项目有望为当地经济注入新的活力。不过，这一说法并未打消反对者的疑虑。在帝国谷，水权并不归土地所有者个人所有，而是由 IID 以公共信托方式统一管理。批评人士担心，如果允许通过私人交易将农业用水转向 AI 数据中心，可能削弱公共部门对水资源的控制，并鼓励更多农民出售用水指标，而不是继续种植农作物。目前，帝国县已经对新建数据中心项目实施临时禁令，等待相关委员会完成规则审查后再决定是否恢复审批。尽管停耕 160 英亩农田本身不太可能影响美国粮食供应，但真正令人担忧的是其可能带来的示范效应。农业不仅关系到土地所有者，还支撑着农场工人、农业设备供应商、维修企业、运输公司以及众多配套产业。一旦供水用于 AI 数据中心比农业生产更具经济价值，其影响将不仅限于停耕的农田，而可能波及整个农业产业链。这起诉讼也发生在全球对数据中心水资源消耗日益关注的背景下。此前，美国佐治亚州居民曾将当地供水问题归咎于附近的数据中心；费耶特县一座数据中心在收到水费账单前就已消耗了 2900 万加仑用水；弗吉尼亚州的数据中心用水量近年来也持续攀升。此外，智利的数据中心被指加剧了当地持续约千年的旱情；而 Meta 位于美国怀俄明州夏延（Cheyenne）的一处尚未完工的数据中心，其排放的废水近期还将一种罕见细菌带入了当地的再生水系统，再次引发公众对数据中心环境影响的担忧。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/244.htm", "publishedAt": "2026-07-27T13:33:51+00:00"}, {"title": "创客营招募倒计时｜不招学员，只招创业同行者", "summary": "从赛场走向市场 让创新项目获得持续成长 第十一届“创客中国”元宇宙中小企业创新创业大赛以“元启新探索·智创新宇宙”为主题， 。全球算力资源终究有限，而微软自身发展 AI 产品同样需要大量基础设施支持。这意味着微软必须做出取舍：究竟是把更多算力分配给客户，还是优先保障自己的 AI 业务？如果将更多算力提供给客户，Azure 收入将在短期内获得更快增长，有助于提升营收表现。但代价是，微软自身可用于开发和运行 AI 产品的资源将减少，可能进一步落后于竞争对手。相反，如果微软选择将更多算力留给自己，则意味着押注 Copilot 等 AI 产品未来能够取得成功，有利于公司的长期竞争力。但与此同时，Azure 增长放缓可能会立即打击投资者信心，并拖累股价表现。更重要的是，微软并非在没有竞争的环境中作出这一选择。谷歌云（Google Cloud）业务仍保持着强劲增长。尽管由于 AI 投资规模持续扩大，谷歌的自由现金流数十年来首次转为负值，但其云业务依然交出了亮眼成绩。与此同时，虽然整体服务能力尚不及 Azure 完整，Meta 和 SpaceX 也开始进入“算力租赁”市场，向外部提供 AI 算力资源。因此，在微软仍在权衡如何分配有限算力资源之际，企业客户已经拥有越来越多替代方案。如果微软迟迟无法作出明确选择，一些客户未必愿意继续等待，而可能转向其他云服务提供商。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/250.htm", "publishedAt": "2026-07-27T14:17:23+00:00"}, {"title": "Opus 5 砍掉超 80% 系统提示词，我们用 AI 的方式也该变了 ｜附指南", "summary": "不想被 AI 淘汰就要学着当 AI 的老板#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1673165?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-07-27T10:05:15+00:00"}, {"title": "最直白、最不绕弯子告诉你：为什么到处都是「AI手机」？｜AG&I", "summary": "是产品进化，也是厂商、平台、用户共同参与的利益重组。#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1673151?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-07-27T07:48:30+00:00"}, {"title": "别再把 Coding Agent 当智能补全了：SolonCode 想做的是数字员工", "summary": "1. 先把痛点说清楚：补全会写下一行，但不会替你收尾 很多团队对 AI 编码的体验，其实还停在这一层： 敲到一半，下一行出现了； 写单测时，能补个方法骨架； 偶尔让聊天窗口「解释这段代码」，还算顺手。 这些能力有价值，但它们解决的是局部敲键成本，不是任务交付成本。 真正耗掉工程师半天到几天的，往往是另一类工作...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/479611", "publishedAt": "2026-07-26T05:32:39+00:00"}, {"title": "First 超短片，把镜头对准了 AI 够不着的地方", "summary": "如果一切皆可生成，影像的「真实」与「必要」又该被如何重新定义？#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1672900?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-07-23T10:32:34+00:00"}, {"title": "RAG 核心概念与原理：Chunking、Embedding、相似度、HNSW 与多路召回", "summary": "写代码时若提问 \"这个框架的 v2.3 版本 API 怎么用\"，它提供的却是早已淘汰   const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
