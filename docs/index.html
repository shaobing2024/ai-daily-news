指标进行评分，并针对具体问题提供修复建议。分析轨迹可以作为独立文档打开，同时支持 Windows 和 macOS 平台的调用栈采样器，以及 Qt Tracepoints。调试方面，新版增加了实验性的 C++/QML 联合调试引擎，可生成合并后的调用栈信息。用户可以在运行配置的 Debug 设置中同时选择 C++ 和 QML。此外，Qt Creator 21 还引入了模块化调试器后端，方便测试和扩展。编辑器和版本控制方面，新版增加了 .qdoc 文件编辑器及渲染预览，支持对代码注释、文本文件和 Git 提交信息进行拼写检查，并改进 Git 合并冲突标记的显示方式。FakeVim 也获得多项修复，并增加对部分 Vimscript 和插件功能的支持。Git 工具方面，Qt Creator 21 新增 Changes 导航视图，可以查看已修改文件并执行差异比较、暂存、还原、日志查看和注释等操作。单文件差异现在支持实时编辑，新增的 Git Log 导航视图则可以展示提交关系图，并查看提交涉及的文件统计信息，以及执行提交查看、切换分支和 Cherry-pick 等操作。CMake 方面，新版更新了 CMake 解析器，支持 CMake 4.2，并新增内置 CMake 文件缩进器，可以替代 cmake-format。此外，CMake 编辑器支持 Outline 视图和下拉导航，CMake Presets 也增加了 Qt Creator 专用的 runSettings 和 runDevice 扩展。设备支持方面，Qt Creator 21 新增 HarmonyOS 实验性支持，以及通过 SSH 连接的远程 Windows 设备支持，同时允许在 IDE 中使用由 Podman 管理的容器。Android 支持新增 Logcat 视图，iOS 设备在 Xcode 27 环境下的运行问题也得到修复。当然，Qt Creator 21 的 HarmonyOS 支持目前仍处于实验阶段。结合 Qt 官方今年 10 月发布的 Qt 6.12，开发者可以使用新版 Qt Creator 和 Qt 6.12 进行相关 HarmonyOS 应用开发。Qt Creator 21 现已通过 Qt Online Installer 提供更新，商业版和开源版用户均可获取，新版本对所有用户免费升级。IT之家附官网地址：www.qt.io/download", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/031/463.htm", "publishedAt": "2026-11-24T04:35:19+00:00"}, {"title": "蚂蚁 Ling-3.2-air 模型发布并开源：原生多模态架构，1240 亿总参数", "summary": "IT之家 11 月 24 日消息，蚂蚁科技集团今日发布并开源 Ling-3.2-air 模型。该模型延续了 Ling-3.0-flash-VL 的原生多模态架构，支持文本、图像和视频输入，拥有 1240 亿总参数，每个 Token 激活 55 亿参数。与上一代相比，Ling-3.2-air 在解决代码仓库中的问题、执行多步骤工作流，以及理解视觉信息和推理专业文档等任务上的表现均有提升。具体来看，与上一代 Ling-3.0-flash-VL 相比，Ling-3.2-air 的提升覆盖了语言推理、编程、智能体执行和多模态任务，尤其体现在代码仓库问题解决、多步骤工作流和视觉推理等场景。语言推理与编程。Ling-3.2-air 在 HLE 上的得分从 21.96 提升至 31.42。在面向真实代码仓库的软件工程评测 SWE-bench Pro 上，得分从 26.40 提升至 58.28，提高了 31.88 分。智能体与工作流执行。AutomationBench-AA 得分从 15.7% 提升至 61%，SkillsBench 得分从 42.91 提升至 67.82。在考察专业知识工作的 AA-Briefcase v1.1 上，Elo 评分从 987 升至 1340，提高了 353 分。多模态感知、推理与执行。视觉理解评测 BabyVision 的得分从 51.80 提升至 66.49，MathVision（w/CI）从 84.31 提升至 95.66。提升也延伸到了专业文档与多模态任务执行。GDP.pdf 的任务全通过率从 8.4% 提升至 16%，Vision2Web 得分从 57.69 提升至 80.73。IT之家附 Ling-3.2-air 开源地址如下：https://huggingface.co/inclusionAI/Ling-3.2-airhttps://modelscope.cn/models/inclusionAI/Ling-3.2-air", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/031/426.htm", "publishedAt": "2026-11-24T04:01:00+00:00"}, {"title": "蚂蚁OceanBase发布湖库一体AI数据平台OceanLake，核心引擎向全球开源", "summary": "中国AI数据平台加速崛起", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/512330.html", "publishedAt": "2026-11-24T03:30:46+00:00"}, {"title": "我国前三季度数字产业收入 32.41 万亿元：智能算力规模同比增长 146%，生成式 AI 产品应用普及率超 50%", "summary": "IT之家 11 月 24 日消息，今日，工信部运行监测协调局发布前三季度数字产业运行数据。前三季度我国数字产业实现收入 32.41 万亿元，同比增长 14.8%，增速较上年同期加快 5.2 个百分点。其中，生成式人工智能产品应用普及率已超 50%。数据显示，我国前三季度数字产业实现利润 2.78 万亿元，同比增长 23.4%，增速较上年同期提升 14.9 个百分点，收入利润率 8.6%，较上年同期提高 0.4 个百分点。工信部将利润增长归因于人工智能需求旺盛与出口增势强劲的双重拉动。数字制造业是收入增长的主要来源。规模以上计算机、通信和其他电子设备制造业实现收入 14.9 万亿元，同比增长 21%，利润总额 9852 亿元，同比增长 1 倍。服务业部分收入 13.09 万亿元，同比增长 7.3%，其中软件和信息技术服务收入 11.8 万亿元，信息技术服务收入占比升至 69.5%。算力基础设施的扩张为 AI 应用提供了底座。截至 9 月底，我国智能算力规模达 2592EFLOPS（IT之家注：EFLOPS 指每秒百亿亿次浮点运算），同比增长 146%；同期 5G 基站总数达 525.4 万座，其中 5G RedCap 基站 290.9 万个，千兆光网 10G PON 端口 3340 万个。终端侧的表现更为直观。三季度国内超 20 款人工智能手机和电脑新品集中发布，旗舰产品具备端侧自主执行任务能力。前三季度重点平台智能眼镜销售额同比增长 1.1 倍，具身智能机器人销售额同比增长 22.6%。开源鸿蒙生态设备数量已超 13.5 亿台，社区贡献者超 1.4 万名。区域分布上，收入规模前 10 大省（市）合计完成收入 26.84 万亿元，占全国总量的 82.8%。中部地区增速较快，实现收入 4.66 万亿元，同比增长 32.2%，高于全国 17.4 个百分点，安徽、湖北、河南增速领先。围绕集成电路、人工智能等领域，各地已累计培育建设 22 个国家级先进制造业集群。相关阅读：《今年前三季度我国数字产业收入超 32 万亿元，同比增长 14.8%》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/031/326.htm", "publishedAt": "2026-11-24T03:01:05+00:00"}, {"title": "全国首个“人工智能产业保险共同体”成立，目标破解“不敢保、不能保”难题", "summary": "IT之家 11 月 24 日消息，“深圳创投日”四周年暨 2026 香蜜湖财富管理周开幕大会于 11 月 23 日在深圳举行。深圳福田区 13 家财险机构共同发起成立全国首个“人工智能产业保险共同体”，致力于破解大模型产业链“不敢保、不能保”难题。同时，活动现场还发布了该共同体的核心研究成果 ——《人工智能产业风险治理白皮书（2026）》。该白皮书是全国首份系统回应人工智能产业风险与保险供给的白皮书，首次绘制“算力 — 模型 — 应用”全产业链风险图谱，将 AI 系统性风险转化为可承保、可定价的保险供给，并给出“保险 + 服务 + 科技”三位一体的全周期治理方案，为全国贡献了可复制的“深圳方案”。IT之家查询公开资料获悉，本次活动由中共深圳市委金融委员会办公室、深圳市福田区人民政府指导，深圳市财富管理协会、另类投资管理协会（AIMA）主办，招银理财、东方富海、建信理财、平安理财、博时基金、南方基金、中信证券、国信证券联合主办，招商银行深圳分行、中金财富证券、华润信托、平安期货、深圳市创新企业社会责任促进中心、深圳市家族办公室促进 定风险。IT之家援引博文介绍，史密斯表示未来数月全球技术故障风险仍将居高不下，而且由于“全球整个信息基础设施实际上都在进行升级改造”，相关风险无法在几周内解决，恐出现更多技术故障。科技媒体 NeoWin 报道指出，近期全球网络出现大规模、大范围的宕机事件，微软 Exchange、Outlook、Teams 等服务出现较大范围故障后，苹果 App Store、多家银行、航空公司及 PlayStation Network 也接连报告服务中断。官方已排除这些事件为协同网络攻击的可能性。美国国务卿马可 · 鲁比奥表示，没有证据显示各起事故彼此相关，或源自有组织的网络攻击。史密斯认为，人工智能正在改变网络安全与系统运维的节奏。AI 让安全人员更容易发现代码漏洞，但恶意攻击者同样可利用这一能力寻找攻击入口；结果是，企业不得不以“前所未有的速度”部署补丁，留给测试和验证的时间被大幅压缩。他特别指出，老旧基础设施最易受影响。当系统更新速度过快、测试不足时，本应提升安全性的修补工作，反而可能触发新的故障。微软此次全球中断，就被其归因于四个月前的一次软件更新、较新的更新以及网络流量变化共同形成的“完美风暴”。相关阅读：《微软公布 Outlook 全球宕机最终报告：部分邮件投递失败，安全功能也受影响》《微软 CEO 纳德拉就全球服务宕机致歉：吸取教训改进可靠性》《微软苹果接连宕机，谷歌紧急回应 Gmail 故障传闻“服务运行正常”》《微软 2026 最大宕机事件余波：部分用户反馈 Microsoft 365 服务再次出现故障》《微软高管解释 Microsoft 365 服务为何全球宕机：三重故障引发连锁反应，击垮 80% 服务器》《不法分子借微软 365 宕机实施大规模钓鱼攻击，伪造邮件通知窃取用户账号》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/031/479.htm", "publishedAt": "2026-11-24T06:08:17+00:00"}, {"title": "魅族新机 M2621Q 入网，AI 小方块预计年底前后上线", "summary": "IT之家 11 月 24 日消息，微博博主 @数码闲聊站 今日发文称，魅族新机近期入网，型号 M2621Q，支持 4G 网络，目前机型未知。该名博主还在文中透露，魅族的 AI 小方块预计将在年底前后上线。该机搭载 4 英寸屏幕，主打 Flyme AIOS。博主 @体验more 曾在此前透露，魅族 AI 小方块将量产上市，搭载紫光展讯 T8200 处理器。参考IT之家此前报道，在 9 月 2 日的腾讯 WorkBuddy 生态发布会上，魅族 AI 小方块概念机亮相。据介绍，魅族 AI 小方块概念机搭载基于原生 AI 的 Flyme AIOS，通过深度融合智能交互与 WorkBuddy 云端 AI 工作台核心能力，带来全新 AI 协同办公体验。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/031/477.htm", "publishedAt": "2026-11-24T05:59:38+00:00"}, {"title": "消息称豆包灰度测试“豆包购物”，配有一级功能入口", "summary": "IT之家 11 月 24 日消息，据《读佳》今日报道，豆包 App 正灰度测试“豆包购物”，并配有一级功能入口，目前部分用户可见该功能。从报道中晒出的截图可以看到，豆包购物独立放置在侧边菜单栏，和新对话、定时任务、插件技能并列，点击进入后是抖音电商提供的类小程序页面，相当于一个小型的抖音商城。豆包购物底层复用抖音电商完整履约体系，可支持实物、餐饮团购、演出票务交易，覆盖结算、退款、售后核销全链路。授权页面显示，这套购物链路依托抖音电商，页面标注来源为抖音电商。据 36 氪今年 6 月报道，知情人士透露，豆包计划三季度进一步结合电商功能更新完善付费场景，并通过补贴为抖音商城进行引流，四季度进入运行期。这些动作，皆是为了面向 2027 年及更长期的商业化回报做准备。IT之家注意到，豆包官方今天宣布“小豆”正式开启公测，采用邀请制开放。用户凭邀请码即可开启体验，并获赠一定量免费额度。小豆是豆包旗下的 AI 个人助理产品，采用对话式交互方式，在用户明确指令与授权范围内，协助你高效处理日常事务。官方宣称它是“一个懂你，还能主动帮你办事的豆包”。未来，小豆上的能力与体验也将逐步在豆包 App 上线。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/031/464.htm", "publishedAt": "2026-11-24T04:36:05+00:00"}, {"title": "黄仁勋重掌帅印：英伟达创逾 23 年最大单日涨幅，助推美股科技股集体大涨", "summary": "IT之家 11 月 24 日消息，科技媒体 The Information 今天（11 月 24 日）发布博文，报道称受黄仁勋复职英伟达 CEO 利好消息影响，推动美股科技股集体大涨，提振了投资者对人工智能行业的信心，推动纳斯达克 100 指数上涨 6.8%。英伟达宣布黄仁勋重新出任首席执行官，公司股价当天收涨 31.48%，市值回升近 1 万亿美元，创下自 2003 年 5 月以来的最佳单日表现，创逾 23 年最大单日涨幅。单日大涨尚未让英伟达收复此前全部失地。其股价已接近黄仁勋 11 月 12 日辞职时的收盘水平，但仍明显低于 10 月初 239.24 美元的高点。IT之家援引该博文介绍，在本轮上涨前一周，美股科技股遭遇猛烈抛售。纳指过去 1 周累计下跌约 10%，创下 2020 年以来最差单周表现，而英伟达过去一个月的累计跌幅则超过 40%。黄仁勋回归成为市场情绪转向的重要催化剂，推动资金重返科技板块，涨势从芯片延伸至服务器、存储及云计算基础设施企业。AMD 上涨 6.85%，Arm 上涨 16.08%，戴尔和美光分别上涨 20.46% 和 19.04%；谷歌母公司 Alphabet、Meta 也均上涨逾 6%。不过，人工智能概念股并未全面走高。刚上市的 Anthropic 在第三个交易日下跌 1.43%。该公司首次公开募股融资 935 亿美元，上市首日上涨 17%，次日则下跌 8.5%。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/031/458.htm", "publishedAt": "2026-11-24T04:22:10+00:00"}, {"title": "黄仁勋回归英伟达首日：没有办公电脑用，希望配台 RTX Spark", "summary": "IT之家 11 月 24 日消息，科技媒体 Wccftech 今天（11 月 24 日）发布博文，报道称英伟达创始人黄仁勋重返公司总部，在面向员工的简短讲话中，为了活跃现场气氛，调侃表示这是自己重新上班的第一天，目前还没有电脑，希望 IT 部门配发的新设备是一台 RTX Spark。IT之家翻译黄仁勋的简短发言内容如下：谢谢大家，谢谢大家给我第二次机会。这是我重新上班的第一天。我没有电脑，所以 IT 部门会给我配一台新电脑。我希望它是 RTX Spark。我想，我想感谢你们所有人。第二次担任 CEO，我一定会做得更好。RTX Spark 是英伟达面向个人电脑推出的计算平台，结合 Grace CPU、Blackwell RTX GPU 和运行 AI 所需的软件生态，用于轻薄 Windows 笔记本和小型台式机。延伸阅读黄仁勋此番离任始于 2026 年 11 月 8 日。英伟达董事会当天发表声明称，鉴于近期有报道指其成为外国情报行动的目标，将成立由独立董事组成的委员会，并在外部独立律师协助下展开调查。11 月 12 日，英伟达宣布黄仁勋辞去总裁、首席执行官及董事会成员职务，即刻生效；执行副总裁兼首席财务官科莱特 · 克雷斯（Colette Kress）出任临时首席执行官，董事会同时启动新任 CEO 遴选程序。董事会还任命 Harvey C. Jones 为公司首任董事会主席，他此前曾担任新思科技首席执行官及执行董事长。克雷斯于 2013 年 9 月加入英伟达，此前曾在思科和微软从事财务相关工作。据IT之家此前报道，黄仁勋在承认婚外情、并向家人和员工公开道歉后辞去职务，结束了在这家由他于 1993 年参与创立、并掌舵 33 年的公司的 CEO 任期。离任期间，一项呼吁其复职的网络请愿已获得约 18 万个签名，特斯拉 CEO 埃隆 · 马斯克、OpenAI CEO 萨姆 · 奥尔特曼、微软 CEO 萨提亚 · 纳德拉等科技界人士先后表态支持；美国总统特朗普 11 月 16 日也表示，对其回归持开放态度。11 月 23 日，英伟达董事会一致投票决定恢复黄仁勋的总裁、首席执行官及董事会成员职务，称在决策过程中听取了美国政府高层意见，并确信其复职不构成国家安全风险。同日，英伟达官网更新了黄仁勋的个人简介，将其身份改为“创始人、总裁兼首席执行官”。RTX Spark 是英伟达在 2026 年 10 月 16 日随首批笔记本推向市场的平台，首发厂商包括华硕、戴尔、联想、微软和微星；11 月 18 日，华硕、机械革命和微星的紧凑型桌面主机也正式开售，宏碁、戴尔、技嘉、惠普及微软 Surface RTX Spark Dev Box 等产品陆续推出。按官方规格，RTX Spark 搭载最高 20 核 Grace CPU、最高 6144 个 CUDA 核心的 Blackwell RTX GPU 以及最高 128GB 统一内存，可提供最高 1 Petaflop 的 FP4 AI 性能，其中 CPU 部分由联发科与英伟达合作设计。以已上市机型为例，华硕 ProArt 创 14 起售价 18999 元，联想 YOGA Pro 15 起售价 29999 元，微软 Surface Laptop Ultra 起售价 21988 元；迷你主机华硕 ProArt GR1X 售价 34999 元起。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/031/389.htm", "publishedAt": "2026-11-24T03:47:23+00:00"}, {"title": "郭明錤：黄仁勋复职消除英伟达部分不确定性，但部分瓶颈仍在", "summary": "IT之家 11 月 24 日消息，香港天风国际证券分析师郭明錤今日在 X 平台发文，分析黄仁勋恢复英伟达 CEO 职位后的市场状况。郭明錤表示，黄仁勋回到英伟达后，公司策略、产品规划、技术发展与供应链管理等不确定性被移除。这些不确定性曾在过去 1-2 周对科技股造成压力，因此他回归后股价立刻大涨。但能否回到过去高点，除了取决于个别公司在 AI 供应链与英伟达生态的定位外，还要看以下两点。例如，英伟达在销售层面面临着出口管制，可能对出货和营收造成影响。并且更高的合规成本，也会对进行中的循环融资产生影响。黄仁勋与英伟达仍在接受调查，未来他的公开发言、内部决策与对外互动，都会成为质询的新证据，这也会强化不确定性。此外，英伟达仍然无法改变数据中心建设挑战、CSP（IT之家注：云服务供应商）资本支出陆续在 2027-2028 年见顶，并且还面临次世代先进封装良率等技术限制。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/031/338.htm", "publishedAt": "2026-11-24T03:23:48+00:00"}, {"title": "释放AI与出海强预期，近1500人参与亿邦产业互联网年会暨首届产业智能体大会", "summary": "2026年11月20日，第八届亿邦产业互联网年会与首届产业智能体大会在北京国贸大酒店首次合体举行。", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/512305.html", "publishedAt": "2026-11-24T03:21:12+00:00"}, {"title": "豆包旗下 AI 个人助理“小豆”开启公测，能够帮你处理日常事务", "summary": "IT之家 11 月 24 日消息，豆包官方今天宣布“小豆”正式开启公测，采用邀请制开放。用户凭邀请码即可开启体验，并获赠一定量免费额度。IT之家注意到，小豆是豆包旗下的 AI 个人助理产品，采用对话式交互方式，在用户明确指令与授权范围内，协助你高效处理日常事务。官方宣称它是“一个懂你，还能主动帮你办事的豆包”。未来，小豆上的能力与体验也将逐步在豆包 App 上线。根据 App Store 商店页信息，小豆具备以下能力：【信息查询】随时提问，快速获取天气、新闻、知识与生活常识答案。【日程待办】用文字或语音添加日程、待办与提醒，不错过每件要事。【生活服务】查快递、找周边、搜攻略，出行日常一站搞定。【购物售后】协助查询订单、处理退换货与售后咨询。【健康提醒】喝水、用药、运动打卡，贴心守护日常健康。【办公辅助】写文案、理思路、做总结，提升工作效率。只需开口或打字，小豆随叫随到，让复杂事变简单，把时间留给更重要的事。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/031/329.htm", "publishedAt": "2026-11-24T03:06:48+00:00"}, {"title": "“得Agent开发者，得天下”，70+技术大咖共探AI技术演进与生态变革，2026奇点智能技术大会圆满收官！", "summary": "「2026 奇点智能技术大会」与「2026 C++ 及系统软件技术大会」在北京万达文华酒店成功举办。", "sourceName": "量子位", "sourceUrl": "https:// ..", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503693/anthropics-historic-debut-put", "publishedAt": "2026-11-20T02:48:09+00:00"}]}, {"label": "论文研究", "items": [{"title": "Anthropic 数学家澄清 Claude 证明黎曼猜想争议：“25 万页”的说法只是开玩笑，没想到大家都当真了", "summary": "IT之家 11 月 24 日消息，当地时间 11 月 23 日，参与使用 Claude 研究黎曼猜想的数学家 Levent Alpöge 在 X 上发文，承认自己做了一些傻事，并对此前公布的证明材料及相关争议作出解释。首先，他表示最受争议的「超 25 万页」证明文档实际上只是一个玩笑，他根本没打算发布如此庞大的可读版证明材料。他表示，自己发布的 Lean 代码确实“满是垃圾”，但可以编译通过。他认为外界对这些冗余代码的批评“完全合理”，自己本应清理。此前，Alpöge 于 11 月 20 日在个人网站发布一份 4 页说明，称自己与 Claude 合作发现了黎曼猜想的证明，方法同样涵盖广义黎曼猜想。该证明没有以传统论文形式发布，而是以 Lean（一种可由计算机逐步检验数学推理的证明助手）形式化代码公开。据《对话》（The Conversation）报道，他当时解释称论证极其冗长，由 AI 生成的英文说明篇幅“达到 25 万页以上”，把这样一份难以阅读的文本发布出来并不合适，因此只放出 Lean 代码。Alpöge 在回应中表示，他自认为这种大数字极其好笑，原本希望通过主定理中对实数全序关系的冗长表述，让读者意识到 25 万页只是夸张说法，但没想到大家却当了真，而他在公布后的几天里不想在社交媒体上发言，所以这几天一直没有回应。他还提到，自己此前提到的 YM4 存在性工作中“慢慢处理 6 万页垃圾内容”同样是玩笑，只是评审委员会要求提供 Lean 后，他觉得浪费了时间。他表示，陶哲轩曾建议不要在论文里开玩笑，而他硬塞进去的《谋杀绿脚趾》（The Big Lebowski）梗也让他明白了这一点。他说，自己不愿让任何“垃圾”写作稿附在这一问题上，又觉得写不出可读的东西，于是转向 Lean，一味追求篇幅。对于公开的 Lean 代码，Alpöge 承认代码满是垃圾，但可以编译，也接受所有批评。他表示，自己本应提前清理这些代码，但由于一些难以解释的技术原因，整理过程比预想中困难。第三点，Alpöge 还回应了数学家 Scott N. Armstrong 对其研究习惯的批评。他表示，即便在学生时期，也有定理花了他近十年才整理成文，这次他希望能更负责。他说自己写的时候相当随意，估计其中大部分最终并不必要，未来有望大幅简化。第四点，他说自己忘了强调他认为的核心。在他看来，这类论证是对定义进行插值时的原始输入。数域领域目前还没有相应 H¹ 对象，对外行来说，人们为定义而苦苦争取这些论证的原因也未必一目了然。他认为，这一研究思路的核心并不是让证明变得越来越复杂，而是希望最终能够找到更加简单的数学框架。他还表示，自己一直认为黎曼猜想的证明理应足够简单，如果研究过程中出现了大量真正困难的环节，反而说明现有数学框架可能还不够完善。针对外界似乎有人把他的话理解为证明存在问题，他对此感到困惑，并反问：「不，我并不是在质疑证明。它几天前就已经通过验证了，不是吗？」IT之家此前报道，Lean FRO 和 Mathlib Initiative 已于 11 月 21 日发布联合声明，表示对 Alpöge 的证明具有充分信心。两大组织确认，相关 Lean 代码能够正确编译，证明所使用的定理与 Mathlib 中经过核验的黎曼猜想定义一致，并且相关证明已经通过 Lean 官方内核以及多个独立证明检查器的验证。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/031/476.htm", "publishedAt": "2026-11-24T05:55:12+00:00"}, {"title": "“我可能行动太快了”：为黄仁勋辞职后，工程师戴士钦释放回归英伟达意愿", "summary": "IT之家 11 月 24 日消息，科技媒体 Business Insider 今天（11 月 24 日）发布博文，报道称前英伟达工程师戴士钦（Darrell Dai）在领英（LinkedIn）上发布动态，欢迎黄仁勋回归英伟达，并坦言自己此前“可能行动太快”。在黄仁勋于 11 月 12 日离任英伟达 CEO，公司董事会昨日（11 月 23 日）一致投票决定恢复其职务，两次决定相隔 11 天。其间，名为“支持黄仁勋”的在线请愿活动宣称，已获得超过 1 万名英伟达员工签名，占公司员工总数的 24% 以上。戴士钦的领英资料显示，他此前在英伟达上海担任高级研究工程师，任职一年多。IT之家曾于 11 月 16 日报道，戴士钦为了支持黄仁勋，于 11 月 14 日宣布离职，称黄仁勋的离开促使自己决定结束在公司的职业篇章，同时表达了对同事和共同事业的感激。图源：前英伟达工程师戴士钦（Darrell Dai）如今随着黄仁勋复职，他表示希望先休息、反思，认真考虑未来，再以更清醒的头脑作出选择。在最新动态中，他坦言自己此前“可能行动太快”。他表示，愿意探讨重返英伟达的可能性，但不想再次仓促作出重大决定。相关阅读：《英伟达机器人学习工程师戴士钦宣布辞职：“黄仁勋离职让我格外失望”》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/031/340.htm", "publishedAt": "2026-11-24T03:29:00+00:00"}, {"title": "知乎宣布间接投资 DeepSeek，股价应声大涨 10%", "summary": "IT之家 11 月 24 日消息，知乎 11 月 23 日发布自愿公告，宣布知乎参投的天津砺思星深股权投资合伙企业已通过中间主体间接投资 DeepSeek，取得低个位数百分比股权。知乎董事会认为，基金投资于 DeepSeek 以及本公司通过基金拓宽参与优质人工智能及科技企业投资机会的渠道，同时还能进一步加深对人工智能技术、产品演进和商业模式发展的理解，两者在战略上是一致的。消息公布后，知乎港股股价今日大涨 10%；美股隔夜收盘价 2.35 美元，涨约 15.76%。工商信息显示，DeepSeek 运营主体杭州深度求索人工智能基础技术研究有限公司近日完成工商变更，新增股东杭州程砚企业管理咨询合伙企业（有限合伙）。IT之家查询国家企业信用信息公示系统获悉，杭州深度求索注册资本由 1644.7496 万元增至 1991.8707 万元，增加 347.1211 万元，增幅约 21.1%。据证券时报援引知情交易人士消息，DeepSeek 本轮融资募资规模区间在 1000 亿元至 1055 亿元，投后估值约 6155 亿元。叠加 2026 年 6 月首轮约 510 亿元融资，市场测算其短时间内两轮累计吸纳资金将超 1500 亿元。据测算，梁文锋直接及间接持股比例合计约 67.42%，千亿资本入场并未改变控制权归属。作为新增股东的持股平台，杭州程砚也同步完成工商变更，登记出资额增至 343897.9 万元，同时新增 31 家合伙人。目前，杭州程砚合计拥有 32 名合伙人，杭州程策商务咨询有限公司仍担任执行事务合伙人。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/031/339.htm", "publishedAt": "2026-11-24T03:26:17+00:00"}, {"title": "谷歌拟给浏览器 AI 加道“权限锁”：允许看商品，不许进支付页", "summary": "IT之家 11 月 24 日消息，科技媒体 NeoWin 昨日（11 月 23 日）发布博文，报道称谷歌工程师提出实验性方案，计划在浏览器层面为 AI 智能体设置权限边界，避免其获得过大的操作权限。该方案目前仍处于原型提议阶段，尚未确定是否上线 Chrome 浏览器。IT之家援引博文介绍，根据拟议的方案，谷歌工程师计划扩展浏览器自动化协议 WebDriver BiDi，通过浏览器权限约束 AI 智能体访问体验，包括但不限于支持访问哪些网站、能否点击按钮或输入文字等。根据方案的示例场景，用户可以允许 AI 浏览购物网站查找商品，却禁止它访问外部支付网站。所有 AI 智能体的操作均需要额外申请权限，由用户或浏览器决定是否放行。用户还可中断正在执行的任务、撤销权限；浏览器则可通过醒目标识，提示哪些标签页正由 AI 控制。不过这套拟议的解决方案仍需要完善，现有方案无法精细区分每个按钮的用途，因此 AI 仍可能按下授权网站上的“删除”按钮。谷歌希望未来将相关机制纳入 WebDriver BiDi 标准，让其他浏览器也能采用，但具体落地仍有待推进。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/031/331.htm", "publishedAt": "2026-11-24T03:11:24+00:00"}, {"title": "华为：883 天并肩同行，鸿蒙终端设备数突破 1 亿台", "summary": "IT之家 11 月 24 日消息，鸿蒙 HarmonyOS 终端设备数今日官宣破亿，华为官方今日也发布感谢信，向开发者、用户、讲师等每一位“鸿蒙人”致谢。华为官方刚刚透露，鸿蒙 HarmonyOS 终端设备用时 883 天达成了数量破亿成就。IT之家注意到，华为官方海报小字显示，数据来源于华为内部统计，基于搭载 HarmonyOS 5 / 6 / 7 的手机、平板和电脑设备数量突破 1 亿，统计时间截止至 2026 年 11 月 16 日。回顾原生鸿蒙 HarmonyOS NEXT 发展历程。在 2023 年 8 月，除了面向消费者的 HarmonyOS 4 之外，华为还推出了面向开发者的 HarmonyOS NEXT 开发者预览版，随即面向合作企业开发者开放。2024 年 10 月，在原生鸿蒙之夜暨华为全场景新品发布会上，华为原生鸿蒙 HarmonyOS NEXT（5.0）正式发布，采用全新交互设计，搭载全新分布式软总线，支持跨设备互通扫描、互通图库、跨设备剪贴板、应用内视频投播等能力。2025 年 10 月，华为鸿蒙操作系统 HarmonyOS 6 正式发布。鸿蒙星河互联架构迎来升级，连接能力更强，感知能力更强，可将手机贴在笔记本屏幕上互传文件，宣称从鸿蒙 4 升级后流畅度提升 40%。另外，鸿蒙 6 还迎来“智慧光感”设计，每一次交互都会有绚丽通透的色彩。今年 9 月，华为鸿蒙操作系统 HarmonyOS 7 正式发布，主打全新空间美学，搭载 Harmony Intelligence 智能架构，拥有系统智能体小艺，发布 24 小时后累计升级终端设备数突破 500 万。此外，鸿蒙 7 还带来了方舟引擎新突破 —— 超空间内存和超空间存储技术。相关阅读：《华为鸿蒙 HarmonyOS 终端设备数破亿，消息称今日下午还有“重磅福利活动”》《华为鸿蒙 HarmonyOS 终端设备数突破一个亿，实体纪念章将至》《华为余承东：鸿蒙终端设备数突破一个亿，越过规模临界点迈入新阶段》《官方认证：华为鸿蒙生态里程碑壹亿用户纪念章上线，HarmonyOS 5 及以上系统可领》《华为鸿蒙系统装机量被曝破亿后，HarmonyOS 7 设备占比突破 82%》《里程碑时刻！曝华为鸿蒙 HarmonyOS 装机量突破 1 亿台》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/031/313.htm", "publishedAt": "2026-11-24T02:42:00+00:00"}, {"title": "“Agent版arXiv”来了！936个智能体12个星期狂发近千篇论文，连同行评议都整上了", "summary": "一个完全由AI组成的科学家社会，是什么样？", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/512004.html", "publishedAt": "2026-11-23T06:59:38+00:00"}, {"title": "华为OSTA星芒 O1 Pro 评测：一台真正为 AI 而生的鸿蒙手机", "summary": "面向 AI，面向世界，面向未来#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1690613?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-11-23T00:57:34+00:00"}, {"title": "哈佛大学研究人员：AI 编程目前的瓶颈是“Code Review”", "summary": "哈佛大学两位博士候选人做了一份工作论文，把 AI 编程 Agent 的真实效果算了一遍。样本是 718 家公司、725938 名员工。 结论不太好看。 用上 AI 编程 Agent 之后，人均每月新增代码行数从 5017 涨到 6511，多了约 30%。提交数增长 20%，Pull Request 增长 23%。该有的增长都出现了。 但活干完了吗？没有。 论文用 Jira i...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503706/harvard-researchers-find-ai-coding-agents-shifted", "publishedAt": "2026-11-20T09:00:13+00:00"}, {"title": "Google「AI Overviews」让网站的搜索流量下降四成", "summary": "Google 搜索引擎「AI Overviews」服务正在抢走网站的流量。 根据一项随机实验的测试，AI Overview 导致从 Google 搜索结果指向外部网站的点击量下降了四成。 这是随机实验做出来的数字，不是相关性推测。研究者对一部分美国桌面用户隐藏了 AI Overviews，然后和仍能看到的那组做对比。 这个数字背后有一个更直观的画面：...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503698", "publishedAt": "2026-11-20T03:57:08+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "当 AI 改变一切，下一步如何构建？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/iRm9lBSQj0OCvDdgLQrO?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-24T14:12:36+00:00"}, {"title": "超越试点：销售管理者的 AI 转型行动指南", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/video/UU3P37LW5IE6Xg4O0cSN?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-24T12:36:05+00:00"}, {"title": "“90% 编程无需手敲代码”：微软拉曼纳称 AI 让程序员少写代码，却要思考更多", "summary": "IT之家 11 月 24 日消息，在接受 Peter Yang 采访时，微软高管查尔斯 · 拉曼纳（Charles Lamanna）表示，AI 正在重塑软件工程师的工作重心，让其大幅减少“手搓”代码逐行敲打的工作，但对于系统设计、验证、测试和安全上线等提出了更高的思考要求。IT之家查询公开资料，拉曼纳是微软的执行副总裁，负责 Copilot、智能体及平台业务，是推动微软将 AI 融入办公软件、企业应用和开发平台的核心高管之一。在采访中，拉曼纳举例表示，如果让一名 1990 年前后的程序员看到今天的云计算平台，他可能会觉得，自己过去需要亲手完成的大量工作，如今已经由平台代劳，感叹“90% 的工作被取代了”。他同时预测，AI 智能体将成为许多软件的主要使用者，推动软件接口和交互方式调整。在他看来，智能体是“非常苛刻的客户”，更看重性能和可编程性。例如，人类搜索时通常只想看十条链接，智能体却可以处理上千条结果。在采访中拉曼纳认为 Copilot 虽然可以帮助用户完成任务，但是不会取代 Office 应用，对于移动文本框这类直观、精细的编辑，用户直接用鼠标操作，仍然更符合用户的使用习惯。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/031/316.htm", "publishedAt": "2026-11-24T02:48:40+00:00"}, {"title": "AI 时代的数据工程：如何打造 AI 原生团队", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/video/qWRo8T0IdKoI7RBuQwNd?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-23T19:40:31+00:00"}, {"title": "从算力底座到行业落地，华为智启未来主题论坛亮相 2026 世界计算大会", "summary": "11 月 20 日，2026 世界计算大会举办期间，由华为主办的“数智共昇 鸿湘有为”智启未来主题论坛在长沙举办。论坛深度对接湖南省“AI+”发展战略，围绕计算前沿技术、产 function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
