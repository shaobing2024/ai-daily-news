const DATA = {"date": "2026-09-12", "generatedAt": "2026-09-12T00:51:44Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "OpenAI 将 Habitat 从 Python 迁移至 Rust：CPU 效率提升 6 倍，服务 10 亿 ChatGPT 用户", "summary": "IT之家 9 月 12 日消息，OpenAI 今日发文，主要介绍了其在线存储平台 Habitat 如何应对产品规模的快速增长，以及从 Python 迁移至 Rust 的工程实践。OpenAI 称该平台目前每秒处理超过 7000 万次请求，每周服务超 10 亿用户，管理的数据规模超过 500PB。据介绍，Habitat 已从 2024 年的 Python 客户端库，发展为支撑旗下产品的分布式存储系统。据介绍，Habitat 最初是一个与 ChatGPT 主服务器交互的 Python 库，底层连接 Azure Cosmos DB。其目标是让产品工程师无需直接管理数据库，即可完成数据存取。系统负责数据类型识别、路由、授权、加密、序列化及连接池管理等工作。随着 OpenAI 产品数量和数据需求增长，Habitat 在 2025 年年中逐渐暴露出客户端架构的局限。每次修改共享库都需要协调数十个服务进行部署，增加了发布复杂度和故障风险。因此，OpenAI 决定将 Habitat 改造为独立服务，集中管理部署、监控和平台功能。独立服务还为数据安全提供了统一控制点。OpenAI 可以在 Habitat 中集中执行访问控制、审计日志及底层存储资源权限管理，降低外部、内部及代理程序未经授权访问用户数据的风险。OpenAI 最初选择用 Python 开发高吞吐服务，以优先解决平台稳定性和产品开发效率问题。然而，Python 服务在高并发场景下仍面临 CPU 开销、内存开销和网络延迟等挑战，尤其需要控制请求尾延迟。Habitat 通过限制并发请求数量、增加 Python 工作进程，以及优化异步任务调度来改善性能。OpenAI 还调整了功能开关配置的刷新策略，减少大规模 JSON 解析对请求处理的影响。在连接池方面，OpenAI 发现 Python 的 aiohttp 默认采用 LIFO 连接复用策略，可能导致流量持续集中到响应较慢的服务进程。团队改用 FIFO 连接复用，降低了负载不均衡问题（IT之家注：LIFO 指后进先出，FIFO 指先进先出，两者是常见的队列处理策略）。Habitat 采用受限的 NoSQL API，避免客户端执行不可控的 SQL 查询、复杂联表或大范围数据扫描。对于需要复杂查询的场景，OpenAI 通过变更数据捕获（CDC）将数据实时或近实时同步至 Rockset，提供离线分析和搜索能力。在 2026 年第二季度，OpenAI 调用 2 名工程师，再加上 Codex 和 GPT-5.5，将 Habitat 服务整体用 Rust 重写。官方数据显示，新的 Rust 服务目前已处理 95% 的生产请求，CPU 效率提升 6 倍，内存效率提升 15 倍，平均延迟和尾延迟也有所降低。OpenAI 计划在未来几周内完全弃用 Habitat 的 Python 实现。该公司还表示，后续文章将介绍 Habitat 如何扩展 Azure Cosmos DB 存储层，以及在超过 500PB 数据和每秒 7000 万次请求规模下的多租户可靠性与读性能优化。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/497.htm", "publishedAt": "2026-09-12T00:07:04+00:00"}, {"title": "OpenAI 进一步完善 ChatGPT Sites：响应速度提升、新增协作功能、可绑定自定义域名", "summary": "IT之家 9 月 12 日消息，OpenAI 宣布进一步完善 ChatGPT Sites 功能，新增一项“Build Together”协作功能，允许用户邀请其他人共同开发同一个网站 / Web 应用。公开信息显示，ChatGPT Sites 主要用于帮助用户使用自然语言创建网站 / Web 应用，先前相应功能主要面向单人使用，项目创建后默认只能由一名用户负责修改和发布。而本次更新后，用户可以向其他人发送协作申请，受邀成员可以快速编辑、保存并发布 Site 内容。此外，用户还能够将 ChatGPT Sites 生成的项目设置为完全私有，并仅向指定人员开放访问权限。以便团队在产品正式对外发布之前邀请多人进行内部秘密测试。例如，某开发者 A 计划为某活动制作网站，因此要求 ChatGPT Sites 生成了一个内部项目，之后发送给开发者 B，B 无需反复与 A 沟通提出修改建议，可以直接进入项目进行调整，还能够利用自然语言检查数据库中实际保存了哪些内容，而无需再单独打开数据库进行查看。除此之外，ChatGPT 现在还支持查看与 Site 连接的数据库、并支持绑定自定义域名。用户可以将自己拥有的域名连接到 Site，使面向客户、同事或朋友分享的网站不再局限于 ChatGPT 提供的通用网址。OpenAI 还同期提升了 ChatGPT Sites 的响应速度，官方宣称“从输入提示词到完成 Site 部署所需的时间已经缩短约一半”。对于需要频繁修改提示词、不断测试和调整项目的用户而言，更快的部署速度可以进一步缩短开发和验证周期。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/485.htm", "publishedAt": "2026-09-11T23:10:51+00:00"}, {"title": "美国一律师用 ChatGPT 生成诉讼文书却出现伪造警察证词，被罚款 5000 美元", "summary": "IT之家 9 月 11 日消息，据路透社今天（11 日）报道，美国新墨西哥州最高法院宣布，辩护律师斯蒂芬 · 阿伦斯在为一名被判谋杀罪的当事人提出上诉时，提交的文书中出现了虚构证人和编造的警察证词。然而，这些内容均由 OpenAI 的 ChatGPT 生成。该法院认定，阿伦斯因未核实提交文书的准确性构成藐视法庭，故对其处以罚款。阿伦斯承认，自己借助 AI 起草了这份文书。法院指出，文书中的虚假证词来自“完全虚构的证人”。陪审团还表示，阿伦斯“缺乏悔意，也缺乏对委托人的关心”。法官们对阿伦斯处以 5,000 美元（IT之家注：现汇率约合 33,640 元人民币）罚款，还将把他移交律师纪律委员会进行调查。阿伦斯解释称，去年接手这起上诉案时，自己让 ChatGPT 整理庭审过程，却没有意识到 AI 产生“幻觉”、编造事实的程度会有多严重。“我很懊悔，但希望纪律委员会能考虑到，这是一次无心之失。所有依赖这项强大却有时不够稳定的技术的专业人士，都应从中吸取教训。”越来越多的律师因未充分核查 AI 生成的诉讼文书就将其提交法院，受到州或联邦法官的处分。此前，已有数十名律师因文书中的 AI 错误受罚，包括编造判例引用、错误引用法律。阿伦斯的情况似乎更为严重，他在刑事上诉文书中使用了虚构的证人证词。上个月，新墨西哥州最高法院要求阿伦斯解释，虚构内容是如何进入其主要上诉文书的。阿伦斯在听证会上解释称，自己把电脑生成的庭审文字记录和其他案件材料交给 ChatGPT，以为它会给出“无懈可击的摘要”。报道提到，阿伦斯没有充分认识到 AI 存在出错的风险，令法官们难以置信。C· 香农 · 培根法官在听证会上质问：“律师先生，你看新闻吗？听广播吗？有没有在了解外面发生什么？律师依赖 AI 幻觉的问题，每天都是头条新闻！”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/451.htm", "publishedAt": "2026-09-11T13:06:34+00:00"}, {"title": "AMD 发布锐龙AI Max PRO 400 系列，端侧智能体走向多模型协同", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/NizuOkFpcOPgbeClC4uL?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-11T12:30:38+00:00"}, {"title": "DeepSeek 将继续提供 V4 Pro API 调用服务：原定 9 月 14 日下线，计费方式保持不变", "summary": "IT之家 9 月 11 日消息，DeepSeek 宣布，为响应广大用户的需求，决定在 2026 年 9 月 14 日之后继续提供 DeepSeek V4 Pro 的 API 调用服务，计费方 一轮更新。本次更新以提高智能体任务完成可靠性为核心，集中修复了系统智能体、CUA（桌面操作智能体）、统一模型推理服务、智能体运行时的数十项可靠性缺陷。此外，新增了语音交互、人机智能协同等实用功能，覆盖任务管理、...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502369", "publishedAt": "2026-09-08T02:14:36+00:00"}, {"title": "选手可选福利：模力方舟旗舰模型为开源大赛提供专属折扣", "summary": "近日，两场开源软件大赛（“2026 上海开源软件应用创新大赛”与“2026北京开源行业解决方案创新赛”）正火热进行中，陆续有选手咨询模力方舟的模型调用成本能不能省一点。 即日起，模力方舟给参赛选手准备了一份可选福利，旗下旗舰模型按官方刊例价提供专属折扣，覆盖 DeepSeek V4 全系、Kimi K3 与 K2.6、GLM-5.2 与 5....", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502363", "publishedAt": "2026-09-07T11:38:09+00:00"}]}, {"label": "产品发布/更新", "items": [{"title": "第三方公司基于三星 Galaxy Watch 8 打造 Bark Watch 儿童手表，内置 AI 风险监测功能", "summary": "IT之家 9 月 12 日消息，美国科技公司 Bark Technologies 基于三星 Galaxy Watch 8 40mm 版手表进行定制，推出了一款 Bark Watch 儿童手表，面向“已经开始希望获得更多独立性的儿童”，定价为 240 美元（IT之家注：现汇率约合 1,614 元人民币）。用户还需要单独购买每月 15 美元（现汇率约合 100.9 元人民币）的服务套餐，用于提供蜂窝网络连接以及家长控制功能。具体来看，该产品在保留 Galaxy Watch 8 硬件功能的同时，通过软件限制儿童可能接触到的网络风险。不提供社交媒体应用、网页浏览器或手机游戏，也不允许用户不受限制地自行安装应用。Bark 的 AI 平台会在后台运行，对通过短信发送和接收的媒体内容进行分析，一旦发现网络欺凌、情色内容等潜在风险，就会向家长发出提醒。Bark Technologies 表示，如今儿童在使用互联网和移动设备时可能面临网络欺凌、情色内容以及网络诱骗等风险，而不少儿童智能手表的功能相对基础。因此，本次推出的 Bark Watch 旨在于功能和安全性之间取得平衡，让年龄较大的儿童能够使用更多智能手表功能，同时让家长获得相应的安全管理能力。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/505.htm", "publishedAt": "2026-09-12T00:45:49+00:00"}, {"title": "英伟达为 G-Sync Pulsar 显示器推送 1.1.10 固件，240Hz 下 MPRT 响应速度可降至 0.97ms", "summary": "IT之家 9 月 12 日消息，英伟达近日为 G-Sync Pulsar 显示器推送 1.1.10 版固件更新，进一步提升动态画面清晰度。具体来看，G-Sync Pulsar 1.1.10 固件在 240Hz 模式、Pulse Width 设置为 50 时，可将 MPRT 响应速度降低至 0.97ms，首次低于 1ms。英伟达表示，这一表现能够带来相当于 1000Hz 显示器的动态清晰度。在最高 480 尼特亮度下，支持 G-Sync Pulsar 的显示器在 240Hz 和 360Hz 刷新率下的运动画面清晰度，也提升至与 60Hz ULMB2 模式相当的水平。其中，360Hz 模式的 MPRT 响应速度由原来的 1.64ms 降至 1.14ms。至于未来是否能够进一步将 360Hz 模式的 MPRT 压低至 1ms 以内，目前尚无官方消息。公开信息显示，G-Sync Pulsar 是一项将可变刷新率（VRR）与动态背光频闪结合的显示技术，旨在同时降低画面撕裂和运动模糊。显示器会根据画面刷新节奏以及 VRR 状态同步控制背光闪烁，在保持低撕裂的同时提升高速运动画面的清晰度。不过，目前支持 G-Sync Pulsar 的显示器数量仍然有限，仅有少数高端型号，具体来看仅包括 Acer Predator XB273U F5、AOC AGON PRO AG276QSG2、ASUS ROG STRIX Pulsar XG27AQNGV 以及 MSI MPG 272QRF X36 四款产品。除了提升动态清晰度外，1.1.10 版固件还改善了 G-Sync Pulsar 的稳定性。先前系统在运行部分高负载游戏时，为避免画面出现异常，系统可能会在没有明显提示的情况下自动开启或关闭 G-Sync Pulsar 功能。英伟达此次更新针对相关问题进行了优化。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/502.htm", "publishedAt": "2026-09-12T00:40:56+00:00"}, {"title": "DeepSeek 开口说话了：灰度测试 AI 语音对话，支持四种音色", "summary": "IT之家 9 月 12 日消息，据IT之家小伙伴反馈，DeepSeek 灰度测试语音对话，测试到的用户在 App 右上角会有一个小喇叭按钮。此外，DeepSeek 的设置页面会出现一个“朗读音色”选项，用户可以选择四种音色：贝壳：百变活泼白浪：明朗坚定海星：俏皮甜美暗潮：低沉浑厚", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/498.htm", "publishedAt": "2026-09-12T00:17:46+00:00"}, {"title": "冲刺史上最大 IPO：英伟达正洽谈为 Anthropic 投资至多 100 亿美元", "summary": "IT之家 9 月 12 日消息，路透社刚刚报道称，英伟达正与 Anthropic 洽谈，考虑以基石投资者身份参与其 IPO，考虑投资至多 100 亿美元（现汇率约合 672.8 亿元人民币）。报道称，Anthropic 计划通过上市融资最多 1000 亿美元，估值或达到约 2 万亿美元（IT之家注：现汇率约合 13.46 万亿元人民币），这将有望成为史上最大规模的 IPO 事件。由于此次谈判仍在讨论中，融资规模、投资金额及其他安排均可能发生变化。Anthropic 拒绝置评，英伟达未立即回应置评请求。如果英伟达最终确认参与此次 IPO 投资，Anthropic 将获得一家重要战略合作伙伴的早期支持，同时进一步深化双方在人工智能计算领域的关系。英伟达作为基石投资者，可能增强投资者对这宗超大规模 IPO 的信心。基石投资者通常是承诺在股票面向更广泛市场发售前，预先认购一定数量股份的机构投资者。对于融资规模巨大的 IPO，企业提前引入机构投资者的做法日益常见。英伟达和亚马逊曾参与 Arm 的基石投资，沙特公共投资基金（PIF）则是 SpaceX 的基石投资者之一。Anthropic 与英伟达的关系也反映出 AI 开发商与算力供应商之间日益紧密的联系。Anthropic 高度依赖英伟达 GPU，同时也在寻求多元化芯片供应商，以应对 Claude 业务增长带来的算力需求压力。2025 年 11 月，英伟达宣布计划向 Anthropic 投资最多 100 亿美元，并与微软达成更广泛的合作。根据当时的安排，Anthropic 承诺购买价值 300 亿美元的微软 Azure 云计算服务，这些服务将采用英伟达芯片。Anthropic 目前已有亚马逊和谷歌等大型科技企业作为投资者，两家公司同时也是其主要算力供应商。2026 年 4 月，Anthropic 宣布计划在未来 10 年向亚马逊 AWS 投入超过 1000 亿美元，并采购超 100 万颗 Trainium2 芯片。此外，Anthropic 还与谷歌及博通合作，计划增加数吉瓦规模的 TPU 算力。随着收入快速增长，Anthropic 正持续扩大算力资源，并组建内部团队设计适配 Claude 的定制芯片，以进一步控制硬件成本。Anthropic 预计在 2026 年 11 月美国中期选举前完成上市。公司 2026 年 5 月完成一轮 650 亿美元融资，投后估值达到 9650 亿美元。根据 Anthropic 披露的数据，其年化营收运行率截至 2026 年 7 月底已超过 650 亿美元，而 2025 年底约为 90 亿美元。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/488.htm", "publishedAt": "2026-09-11T23:22:39+00:00"}, {"title": "2026 年度《时代》杂志全球最佳企业榜单公布：英伟达位居第一、苹果重返排名前三", "summary": "IT之家 9 月 12 日消息，《时代（TIME）》杂志现在已公布“2026 全球最佳企业”（The World’s Best Companies 2026）榜单，英伟达位居第一，苹果则以 93.16 分排名第三。这也是苹果继 2024 年登顶后再次进入该榜单前三。IT之家注意到，苹果在该榜单中的排名近年来经历了较大变化。尽管在 2024 年苹果曾位居榜首，但在 2025 年榜单中意外落选。《时代》杂志当时表示，苹果 2022 年至 2024 年的营收出现下滑，而华尔街多名分析师认为，这可能与苹果在人工智能领域落后有关。不过，《时代》杂志同期指出“苹果可能正在适应新的科技竞争格局”。前苹果 CEO 蒂姆・库克当时曾表示，公司正在大幅增加 AI 领域的投入，并计划将相关能力进一步融入旗下设备和平台。作为参考，苹果在 2025 年 7 月公布的财报显示，公司营收同比增长 10%，创 2021 年以来最大增幅。如今，随着苹果重返 2026 年榜单，其最终得分为 93.16 分，仅次于排名第二的美国健康保险公司 Cigna（94.37 分）以及以 97.51 分登顶的英伟达。排名 2024 年最佳企业 (总分)2025 年最佳企业 (总分)2026 年最佳企业 (总分)1 苹果 (Apple)美国 · 97.75 分英伟达 (NVIDIA)美国 · 97.62 分英伟达 (NVIDIA)美国 · 97.51 分 2 埃森哲 (Accenture)爱尔兰 · 97.70 分微软 (Microsoft)美国 · 95.97 分信诺 (Cigna)美国 · 94.37 分 3 微软 (Microsoft)美国 · 97.65 分摩根大通 (JPMorgan Chase)美国 · 95.03 分苹果 (Apple)美国 · 93.16 分 4 宝马集团 (BMW Group)德国 · 97.41 分 Alphabet (谷歌母公司)美国 · 94.63 分 Meta Platforms美国 · 91.80 分 5 亚马逊 (Amazon)美国 · 96.47 分亚马逊 (Amazon)美国 · 94.19 分阿斯利康 (AstraZeneca)英国 · 90.64 分《时代》杂志表示，相应评分同时综合考察员工满意度、过去 3 年的营收增长率以及可持续发展透明度三项指标，三项指标权重相同，满分为 100 分。其中，苹果在员工满意度方面排名第三，仅次于微软和 IBM。在可持续发展透明度方面，苹果则排名第 24 位。值得注意的是，苹果曾在 2024 年该项指标中排名第一。此外，《时代》将苹果的营收增长表现评为“非常高”（Very High），这是该机构设置的四档评级中的最高等级，高于“杰出”（Outstanding）、“高”（High）和“中等”（Moderate）。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/483.htm", "publishedAt": "2026-09-11T23:02:52+00:00"}, {"title": "银行Agent上岗：4200万小微经营者可用，信贷、票据、财税一把梭", "summary": "看清「一个真正的人」", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/487631.html", "publishedAt": "2026-09-11T18:02:36+00:00"}, {"title": "高盛：总是盯着“AI 泡沫会不会破”不放，反而可能会低估 AI 创造的价值", "summary": "IT之家 9 月 11 日消息，今年以来，华尔街一直在就 AI 热潮是否已经变成泡沫争论不休。高盛投资银行业务联席主管金 · 波斯内特却认为，真正值得问的问题并不是这个。“大家都在问，我们是不是已经进入 AI 泡沫。但更应该问的是，AI 会不会从根本上改变企业的运营、竞争和价值创造方式。这个问题的答案显然是肯定的。”长期身处美国企业押注 AI 转型最前线的波斯内特，亲眼见证了企业界为这场变化投入多少资源。今年，高盛参与了多笔市场规模最大的交易，还拿下 SpaceX 创纪录 IPO 中备受争夺的牵头位置。在她看来，眼下发生的不是简单的泡沫，而是一轮“AI 投资超级周期”，并将进一步推动企业支出和并购交易增长，而并购正是高盛投行业务的核心领域之一。波斯内特认为，如果把注意力都放在泡沫会不会破、什么时候破，反而可能低估 AI 本身能够创造的价值。不过，这并不意味着所有 AI 公司都会成功。互联网时代同样既诞生了价值惊人的企业，也制造过规模极大的泡沫。“这两件事完全可以同时成立。AI 生态内部当然可能出现泡沫，但我不认为 AI 本身就是泡沫，因为 AI 带来的生产率提升空间太大，而且几乎能够应用到整个经济体系。”即使地缘政治和经济环境仍存在不确定性，AI 广泛的应用前景仍在明显推高 IPO 和并购市场热度。今年年初，波斯内特曾预计 IPO 市场会进入“超级周期”，后来的表现甚至超过了她自己的判断：大型交易数量与日俱增，各行业的上市活动也更加活跃。伦敦证券交易所集团数据显示，截至 9 月 10 日，全球 IPO 规模已经达到 2,060 亿美元（IT之家注：现汇率约合 1.39 万亿元人民币），同比增长 183%。在波斯内特看来，IPO 数量本身就是衡量 CEO 信心和投资者出资意愿的重要指标，尤其能够反映市场是否愿意继续为“增长、创新和规模扩张”买单。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/474.htm", "publishedAt": "2026-09-11T15:48:59+00:00"}, {"title": "啊？Anthropic最高320万招销售，只为服务Meta", "summary": "原来你俩互相下单呢", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/487573.html", "publishedAt": "2026-09-11T14:05:16+00:00"}, {"title": "全球首款 AI 智能体手机，努比亚 NaviX Ultra 将搭载 2 亿像素主摄", "summary": "IT之家 9 月 11 日消息，全球首款 AI 智能体手机努比亚 NaviX Ultra 将于 9 月 16 日发布，现已在各大电商平台开启预约。据官方预热，这款新品搭载 2 亿像素主摄，旗舰三摄系统；星河冷控散热系统，7100m㎡立体均热 VC；机身厚度仅 7.62mm，7100mAh 第 5 代南海电池；星穹全域通信系统，全链路网络通讯增强引擎。据IT之家此前报道，努比亚 NaviX Ultra 由中兴通讯与字节跳动联合研发，搭载豆包手机助手，被称为“豆包手机二代”。新机有望搭载骁龙 8 Elite Gen5 旗舰处理器，支持 90W / 100W 有线快充及无线充电。影像系统方面，预计配备 5000 万像素主摄、超广角及潜望式长焦镜头，前置 5000 万像素高清镜头。努比亚官方 9 月 4 日与长鑫存储共同宣布，努比亚 NaviX Ultra 将搭载长鑫存储速率达 10667Mbps 的 LPDDR5X 内存。长鑫存储官方强调，这是国产 10667Mbps 高速率 LPDDR5X 芯片首次量产应用，标志着国产移动 DRAM 正式迈入顶级速率商用阶段。努比亚 NaviX Ultra 合作商也已公布，包括高通骁龙、京东方、长鑫存储、三星半导体、汇顶科技等。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/001/459.htm", "publishedAt": "2026-09-11T13:55:19+00:00"}, {"title": "AI 有了“工号”，数据平台长出了手：我在 Snowflake World Tour 看到的三个变化", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/RLdCKyW7YNb8ybDKlQ5d?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-11T13:36:27+00:00"}, {"title": "【AI 智能运维平台】本周更新：内置僵尸机分析报表，快速甄别可降配/低频使用的资源", "summary": "Blueking Lite 是一个 AI First 的轻量版运维产品，具有部署资源要求低、使用成本低、渐进式体验等特点，为运维管理员提供日常运维中的必备工具。 :loudspeaker: 【平台 · 本周更新速递】 :hammer_and_wrench: 系统管理 • 平台布局支持 经典/应用顶栏 模式切换 • 提供平台接口文档，支持导出 PDF • 上线凭据仓库，统...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/ne const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
