"title": "华为史上最薄智能手表 WATCH Air 官宣，11 月 24 日登场", "summary": "IT之家 11 月 19 日消息，华为刚刚宣布，华为史上最薄智能手表 —— 华为WATCH Air 将于 11 月 24 日 14:30 登场。该产品拥有 6.9 毫米机身，号称“薄，且强”。IT之家注意到，数码博主 @数码闲聊站 此前已发文透露华为 WATCH Air 的屏幕、材质与机身参数，华为史上最薄机身、最窄黑边、最大屏占比，集齐三个“华为之最”。据博主介绍，华为 WATCH Air 配备 1.92 英寸 AMOLED 方屏，边框为 1.4mm 极窄四等边，屏占比达到 86%，峰值亮度 3500nits，并采用 LTPO 2.0。博主称，该手表拥有华为智能手表史上最窄黑边与最大屏占比。材质方面，博主称华为 WATCH Air 首次采用高亮钛合金一体化工艺，强度高于普通铝合金，并搭配轻薄机身。机身结构上，博主称该手表采用全新结构设计，厚度压至 6.9mm，重量为 27g；在这一厚度下还内置高硅叠片异形电池，续航可做到一周一充。功能方面，博主表示华为 WATCH Air 的健康功能对齐 WATCH 6，运动功能对齐 GT 7 Pro。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/029/181.htm", "publishedAt": "2026-11-19T02:15:07+00:00"}, {"title": "全新零跑 Lafa5 更多规格公布：纯电续航 640km，全域 800V 高压平台 +3C 快充", "summary": "IT之家 11 月 19 日消息，零跑汽车今日公布全新零跑 Lafa5 更多规格，包括续航、动力、辅助驾驶、底盘等信息。据介绍，该车升级 69.7kWh 大电池，实现 640km CLTC 纯电长续航；配备激光雷达 + 高通 8650 高阶辅助驾驶，拥有 28 个智能感知硬件、端到端大模型、40 项辅助驾驶功能；全域 800V 高压平台 +3C 快充，SOC 30-80% 快充仅需 16 分钟。该车标配 FSD 可变阻尼减振，兼顾滤震舒适与过弯支撑；搭载六合一高性能电驱，最大功率 185kW，实现 6.06 秒零百加速；中欧底盘团队联合调校，50:50 前后黄金轴荷比；LMC 一体化运动融合控制技术，支持运动融合控制、120km/h 爆胎稳定、动态转向辅助、高速预稳定控制等。安全方面，该车还支持 4-130km/h 紧急制动辅助 AEB、80-130km/h 紧急转向辅助 AES、误加速抑制 MAI 系统等。新车采用 9 横 7 纵硬核安全笼式车身设计，高强钢占比 77.5%，扭转刚度 34500N.m/deg；CTC2.0 Plus 电池底盘一体化，号称“热失控后 48 小时不起火不爆炸”。IT之家注意到，全新零跑 Lafa5 将在 11 月 27 日开幕的 2026 广州车展上正式上市。新车的升级项目包括 800V 高压平台、AR-HUD、零重力座椅、全车 14 扬声器、17.3 英寸中控屏等。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/029/177.htm", "publishedAt": "2026-11-19T02:09:07+00:00"}, {"title": "马斯克预警称 AI 或于 2031 年超越全人类智慧总和", "summary": "IT之家 11 月 19 日消息，在接受《经济学人》采访时，全球首富埃隆 · 马斯克（Elon Musk）大胆预测，称未来约 5 年内，即约 2031 年，人工智能（AI）超过全人类智慧的总和。到那时，除“作为人类”之外，几乎没有什么是 AI 不能比人类做得更好的。IT之家附上相关视频如下：马斯克同时描绘了一个乐观图景：若不发生全球热核战争等重大灾难，AI 与机器人将带来“惊人的富足时代”，商品和服务供给大幅增加，任何人都能获得自己所能想象的东西。他甚至预计，到 2036 年前后，金钱的重要性可能显著下降。但这位长期推动 AI 发展的企业家也承认风险并非为零。他警告，如果 AI 与人类的智力差距扩大到类似人类与黑猩猩之间的程度，人类未必还能继续掌控技术。面对难以逆转的 AI 发展势头，马斯克曾于今年 7 月提出一种行业自律方案：主要 AI 公司应定期举行安全会议，并在新模型发布前，让竞争对手获得约一至两周的早期访问权限，用于检测危险能力、安全漏洞和潜在滥用风险。他认为，竞争者既有技术能力，也有动机发现彼此的问题；政府则应在企业忽视已识别的重大风险时介入。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/029/161.htm", "publishedAt": "2026-11-19T01:11:17+00:00"}, {"title": "从“S 级客户”到全系自研：曝理想 i6 押宝宁德时代电池惨遭断供后决心自研", "summary": "IT之家 11 月 19 日消息，《21 汽车 · 一见 Auto》昨日报道称，理想汽车与宁德时代之间维持多年的供应关系，在 2026 年秋季走到了一个微妙的临界点。今年 9 月初，理想先是以 26.5 亿元增资欣旺达动力，随后宣布全系车型切换自研电池。官宣次日，宁德时代 A 股股价下跌 3.65%，市值缩水 540 亿元。外界将此视为双方“切割”的信号，但两家公司对外口径始终一致：仍是战略合作伙伴。《一见 Auto》指出，双方真正的裂痕始于 2025 年第四季度的 i6 电池供应。当时理想向用户承诺年底提车可配备宁德时代电池，意味着宁德是 i6 该季度的电池独供方。理想 10 月下发的产能指标为 8000 个电池包，宁德实际只交付了 4000 个，理由是“产能不够”。i6 在国庆期间积累的约 4 万台订单，2025 年内只交付了 2.9 万台，约 1 万台被迫推迟至 2026 年交付。一位车企电池高管对此的评价是，供应商产能偏差超过 50% 属于“巨大的供应失误”。李想在那段时间几乎每天都在焦虑电池产能，核心焦虑在于“命运掌握在别人手里”。宁德方面也有其难处。2025 年 9 月宁德产能利用率已达 96.9%，产线两班倒之外加开第三班，接近满产。在产能紧缺时，宁德内部按合作关系分级，同为优先保障级别的情况下，会优先向有资本绑定的车企倾斜。理想虽长期属于最高等级的客户，但双方始终未建立股权层面的绑定。如果说 i6 断供动摇了理想对供应确定性的信任，那么 2025 年 11 月的 MEGA 召回则触及了责任划分的底线。一辆 2024 款 MEGA 在行驶中起火，调查指向同批次冷却液防腐性能不足，极端情况下可能导致动力电池热失控。理想决定召回 11411 辆 2024 款 MEGA，免费更换冷却液、动力电池及前电机控制器。在召回前的沟通会上，宁德方面建议单点解决、不进行大规模召回。理想高管当场反问：如果再出现一台自燃车辆，宁德能否与理想共同承担责任？据在场人士描述，宁德方面未作回应，会议不了了之。理想最终执行了召回。财报上的损失为 11 亿元，但内部人士透露实际花费超 20 亿元，全部来自公司现金流。业内人士测算，单台召回成本最高可达 15 万元，涉及电池更换及关联冷却部件的工时费用。这次事件之后，理想内部的复盘结论指向同一个方向：关键零部件的供应与责任，必须回到自己手中。在资本层面，理想的动作在 2026 年 9 月密集落地。9 月 4 日，理想以 26.5 亿元增资欣旺达动力，交易完成后合计持有后者约 11.17% 股份。更早的 2025 年 10 月，双方已以 50:50 比例合资成立山东理想汽车电池有限公司，承接自研电池的生产制造。自研电池并非从电芯到整包的全链条自制，电芯由欣旺达与中创新航代工，理想深度介入材料规格、工艺参数与全流程数据，电池包则由理想自研自制。10 月 20 日，理想正式发布“连山”电动技术体系，并推出电池保障计划：因自研电池质量问题引发自燃且车辆达到报废标准，赔付同等配置新车。MEGA 搭载的连山电池容量 108kWh，CLTC 续航 710km，5C 超充规格与宁德时代版本在纸面指标上保持对齐。同时，宁德时代也在调整。2026 年 10 月，换电业务负责人、时代电服 CEO 杨峻接替韩伟兼任市场体系联席总裁，乘用车 CTO 高焕接棒国内乘用车业务副总裁王慧的职责。选择更熟悉车企体系的高管主管乘用车业务，被外界视为对当前客户关系变化的回应。除理想外，小米也推出了自有电池品牌“龙甲电池”，电芯由中创新航、欣旺达等提供，小米把控全流程；鸿蒙智行则通过巨鲸电池平台引入国轩高科、中创新航等多家供应商。相关阅读：《第 20 万台理想 i6 下线，高管称产能爬坡的速度提上来了》《加配不加价：首销限时 23.98 万元 2026 款理想 i6 车型正式发布，自研马赫 M100 与连山 5C 电池同时上车》《理想汽车法务部声明“理想 i6 团购返佣”活动与公司无关，已就相关情况向警方报案》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/029/159.htm", "publishedAt": "2026-11-19T01:05:32+00:00"}, {"title": "奥尔特曼称 OpenAI 没法让所有人满意，必须平衡 AI 安全与发展", "summary": "IT之家 11 月 19 日消息，美国当地时间 11 月 18 日周三召开的 DealBook 峰会上，OpenAI 首席执行官萨姆 · 奥尔特曼（Sam Altman）表示，其公司正在“安全”与“发展”寻找 AI 平衡点。奥尔特曼和 OpenAI 总裁格雷格 · 布罗克曼（Greg Brockman）共同参与本次活动，他们表示在推进 AI 发展的进程中不可避免地会遇到风险，因此公司必须在优先保障安全和持续创新之间做出取舍。奥尔特曼在访谈中坦言，OpenAI 不可能“让所有人都满意”。他称，如果公司只顾“踩满油门”追求技术突破，公众会担心人工智能失控；但若过度强调安全，也可能延缓产品和技术进步。奥尔特曼强调 OpenAI 采取“迭代部署”策略，即分阶段推出技术、在真实环境中观察风险并不断改进。在他看来，理解 AI 风险的重要方式之一，不能完全脱离实际进行封闭开发，更重要的是让技术接受现实检验。奥尔特曼也承认，随着模型能力迅速增强，安全、对齐和监控的难度正在显著提高。OpenAI 总裁、联合创始人格雷格 · 布罗克曼表示，随着模型能力显著增强，安全性、保障性和“对齐”（即 AI 行为符合人类意图）已成为必须认真对待的问题。他称，这不只是 OpenAI 一家公司的转变，更是整个 AI 行业正在经历的文化转变。OpenAI 已与其他 AI 公司签署自愿协议，承诺开展风险评估，并与第三方评估机构合作。该公司本周表示，正在引入 METR、Apollo Research 等机构的独立安全研究人员，对模型进行安全评估。奥尔特曼还警告，当前 AI 公司之间的激烈竞争不利于安全。他表示，各家公司只能了解自身的安全标准，难以充分掌握竞争对手的开发情况；这种“迷雾中的竞赛”可能使安全投入不足。他呼吁行业建立共同的安全标准，并推动更大程度的透明度。针对硅谷部分关于 AI 逐步接管决策权、甚至可能形成“超级智能”的讨论，奥尔特曼明确表示反对。他说，人类必须继续掌控未来，不应将决策权逐步交给 AI；布罗克曼也认为，AI 能力越强，保障其与人类目标一致、安全可控的责任就越大。在商业层面，奥尔特曼透露 OpenAI 仍计划在某个时点上市。此前，OpenAI 已将 IPO 计划推迟至明年，以优先处理安全问题；本月早些时候，公司完成 110 亿美元（IT之家注：现汇率约合 734.89 亿元人民币）融资，估值达 1.25 万亿美元（现汇率约合 8.35 万亿元人民币）。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/029/158.htm", "publishedAt": "2026-11-19T01:00:15+00:00"}, {"title": "华为最薄手表 WATCH Air 更多规格曝光：6.9mm 机身厚度、86% 屏占比", "summary": "IT之家 11 月 19 日消息，数码博主 @数码闲聊站 今日发文透露华为 WATCH Air 的屏幕、材质与机身参数，华为史上最薄机身、最窄黑边、最大屏占比，集齐三个“华为之最”。据博主介绍，华为 WATCH Air 配备 1.92 英寸 AMOLED 方屏，边框为 1.4mm 极窄四等边，屏占比达到 86%，峰值亮度 3500nits，并采用 LTPO 2.0。博主称，该手表拥有华为智能手表史上最窄黑边与最大屏占比。材质方面，博主称华为 WATCH Air 首次采用高亮钛合金一体化工艺，强度高于普通铝合金，并搭配轻薄机身。机身结构上，博主称该手表采用全新结构设计，厚度压至 6.9mm，重量为 27g；在这一厚度下还内置高硅叠片异形电池，续航可做到一周一充。功能方面，博主表示华为 WATCH Air 的健康功能对齐 WATCH 6，运动功能对齐 GT 7 Pro。据IT之家 11 月 16 日报道，华为 WATCH Air 的外观已先行曝光，采用圆润机身与超轻薄设计，并预装鸿蒙 HarmonyOS 系统。截至发稿，华为尚未公布 WATCH Air 在中国内地市场的售价与上市时间。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/029/156.htm", "publishedAt": "2026-11-19T00:53:52+00:00"}, {"title": "微软纳德拉示警：比“千年虫”更棘手，AI 正让网络变得越来越脆弱", "summary": "IT之家 11 月 19 日消息，美国当地时间 11 月 18 日在《纽约时报》DealBook 峰会上，微软首席执行官萨提亚 · 纳德拉（Satya Nadella）表示，近期频发的网络中断可能并非偶发事件，随着人工智能系统能力增强，全球数字基础设施的稳定性正面临更复杂的考验。针对近期接连出现的网络中断究竟是“反常现象”还是“新常态”，纳德拉表示目前尚难判断。他将当前形势与“千年虫”（Y2K）问题作类比：当年人们担心进入 2000 年后计算机系统会大面积瘫痪，但那本质上是一个已知漏洞，且只持续一天；而如今，若 AI 模型能力持续增强，其带来的系统性风险和连锁反应可能更难预测。IT之家援引博文介绍，纳德拉指出，过去工程师通常有数周时间测试和部署技术补丁，而现在他们却往往要在漏洞正被利用的同时进行检测、修复与防御。这意味着软件更新、系统运维和安全响应的节奏被大幅压缩，任何一处疏漏都可能被迅速放大。纳德拉特别强调，日常生活中的关键基础设施存在大量“无法修补”的漏洞。他举例称，固件、数据中心冷水机、暖通空调（HVAC）系统，甚至交通系统，都已连接互联网；一旦其中某个环节出现故障或遭到攻击，影响可能远超一次普通的服务中断。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/029/154.htm", "publishedAt": "2026-11-19T00:41:27+00:00"}, {"title": "微软 CEO 纳德拉谈 6 万人自愿离职计划：部分团队尚未适应 AI 转型，公司希望给予员工更多自主权、让合适的人才进入合适的岗位", "summary": "IT之家 11 月 19 日消息，当地时间 11 月 16 日，微软 CEO 萨提亚 · 纳德拉在接受《The Pragmatic Engineer》播客节目采访时谈到了一些大家关心的问题。当被问及公司面向约 6 万名员工推出自愿离职计划，是否意味着微软将借助 AI 提高效率并进一步裁员。对此，纳德拉没有直接给出肯定或否定的答复，而是坦言，随着 AI 改变软件开发方式，微软员工的工作模式和团队组织结构都将发生变化。纳德拉表示，微软希望旗下超过 20 万名员工都能继续成长，但公司需要以不同方式重新配置员工队伍。他指出，未来仍然存在大量职业发展机会，不过这些机会的具体形态可能有所不同，包括团队规模、工作流程以及岗位职责等方面。“我也希望自己能够坐在这里告诉大家，一切都会保持原样。但我做不到。”纳德拉承认，微软内部并非所有团队都已经适应 AI 带来的变化。他表示，不希望员工被困在一个没有完成转型的团队中，即使这个团队属于微软内部也是如此。如果员工感觉自己的职业发展受到限制，可以选择离开当前团队。不过，他更希望员工能够在微软内部寻找其他发展机会。这次采访由前微软工程师 Gergely Orosz 主持。面对有关自愿离职计划是否预示 AI 相关裁员的问题，纳德拉强调，公司希望给予员工更多自主权，让他们能够进入符合自身长期职业发展和经济利益的岗位。纳德拉还提到，系统工程师、基础设施人员以及 AI 训练研究人员等岗位的薪酬正在大幅上涨。微软希望通过相关安排，让员工有更多机会转向这些需求增长的领域。他同时表示，前向部署工程师（FDE）是微软目前增长最快的岗位之一。IT之家此前报道，微软于 2026 年 10 月 26 日正式公布自愿离职计划（Voluntary Exit Offer，简称 VEO）。微软首席人力资源官 Amy Coleman 表示，该计划面向美国、加拿大、英国和印度部分参与团队中职级为 70 级及以下的符合条件员工，提供经济补助和职业规划支持。具体参与范围由各业务部门根据业务优先级、客户承诺和人员需求决定。据《财富》杂志报道，微软方面确认约有 6 万名员工符合此次计划的申请条件，并预计实际肯接受其离职条件的人的比例低于 5%，即不足 3000 人。微软方面表示，推出计划并不意味着希望大量员工离开，而是希望让合适的人才进入合适的岗位。这项计划与微软此前推出的自愿退休计划有所不同。今年 4 月的自愿退休计划仅面向美国员工，并要求员工年龄与在微软服务年限之和达到 70 年；此次 VEO 则没有年龄和工龄门槛。Gergely Orosz 随后也在 X 上分享了自己对这次采访的理解。他预计，微软接下来可能进行规模较大的组织调整，逐步以原生 AI 团队作为新的组织模式。他还认为，自愿离职计划也可能促使一些认为自己所在团队缺乏转型进展的开发人员考虑外部机会。AI 已经在改变微软的软件开发流程。纳德拉此前透露，AI 生成的代码已经占微软代码总量的 20% 至 30%。微软杰出工程师 David Fowler 也曾表示，手动编写代码的传统工作方式正在发生变化。纳德拉认为，随着代码生成成本不断下降，软件开发的难点正在转向验证环节。他表示，在代码生成已经变得廉价的情况下，如何验证代码正确性，反而成为更加困难的问题。对于微软是否会恢复应届毕业生招聘，纳德拉承认公司目前放缓了相关招聘工作。他表示，微软首先需要重新调整现有员工的岗位配置，将员工安排到更适合的团队，然后再考虑增加校园招聘。纳德拉还谈到了 AI 对未来软件工程团队组织方式的影响。他认为，未来的 AI 原生企业可能从一名员工和一定数量的 AI Token 预算开始，随着工作量增加，再逐步引入更多人员。不过，他也强调，现在判断这种模式是否会成为长期趋势还为时过早。纳德拉最后承认，科技行业围绕技术奇点以及未来工作岗位可能消失等话题的讨论，已经给从业者带来了巨大的焦虑。对于微软此次获得自愿离职资格的约 6 万名员工而言，公司高层对 AI 转型和组织调整的表态，也意味着微软未来的岗位结构和团队工作方式可能继续发生变化。相关阅读：《微软 CEO 纳德拉畅想：未来可能有 2000 万个 AI 智能体与 20 万名员工协同工作》《微软大规模自愿离职补偿计划引员工担忧，高管澄清“并非要裁 6 万人”》《微软向约 6 万名员工推出自愿离职买断方案，适配 AI 时代人员结构调整》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/029/147.htm", "publishedAt": "2026-11-19T00:19:17+00:00"}, {"title": "吉利银河首款旗舰大五座 SUV，银河 M8 五款车色首发亮相", "summary": "IT之家 11 月 19 日消息，吉利银河近日公布旗下首款旗舰大五座 SUV—— 银河 M8 更多车型信息，新车将提供五款全新车色，将于 2026 年第四季度正式上市。IT之家注意到，银河 M8 提供沧海银蓝、月瓷白、云绒米、玄夜黑以及鎏金棕五款车色。新车整体造型与吉利银河 M9 保持一致，车头配备带星光点缀的贯穿式灯带，下包围设有主动进气格栅。尺寸方面，该车长宽高为 5205mm*1999mm*1800mm，轴距 3030mm，采用大五座布局。车尾造型同样与银河 M9 基本保持一致。根据选装信息，该车可选金色车标，预计推出黑金智曜高定版；轮圈提供 20 英寸、21 英寸两种规格，共四种样式。座舱方面，银河 M8 内饰延续银河 M9 的设计，配备液晶仪表以及大尺寸悬浮中控屏，搭载全场景 AI Agent 智能体，配备“端到端 AI 语音大模型”。辅助驾驶方面，该车车顶搭载激光雷达。动力方面，新车搭载 1.5T 发动机与电机组成的插混系统，发动机最大功率 120kW。储能装置为宁德时代磷酸铁锂电池，电池容量 53.42kWh，纯电续航 231km/251km。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/029/146.htm", "publishedAt": "2026-11-19T00:15:28+00:00"}, {"title": "OpenAI 自曝模型失控险情：最强 AI 曾突破网络封锁，紧急停训 11 天", "summary": "IT之家 11 月 19 日消息，OpenAI 今天（11 月 18 日）发布题为《管理前沿 AI 风险：从训练到部署》的安全政策说明，首次系统披露研发、内部使用到公开发布阶段，如何在高能力模型的全生命周期中管控风险。IT之家援引博文介绍，OpenAI 称由于前沿模型的能力正快速增强，因此理解、对齐和保障模型的能力必须“始终领先一步”。公司维持引入“安全案例”流程，要求在训练全程提供更有力的行为对齐证据；这些措施虽会拖慢发布节奏，但会增强安全推进的信心。OpenAI 强调其保护措施围绕四层展开：模型对齐：对齐就是让 AI 系统能够可靠地按照我们预期的方式行动。模型必须在尊重政策和更广泛的社会利益的前提下，解读用户的需求。安全和沙盒：这些控件限制模型能够访问或影响的文件、工具、网络及其他资源。它们有助于遏制培训和评估过程中错误或行为不一致所带来的后果。保障阻止措施：这些都是额外的防护措施，用于评估用户请求并建模阻止潜在有害或未经授权行为的行为。它们包括安全分类器，有助于防止网络滥用或协助生物武器，以及自动审核功能，可以阻止潜在的未经授权模型操作。监测与响应：这些系统能检测令人担忧的行为，调查发生了什么，并在必要时进行干预。它们为部署流量提供了可视化，并能提醒我们新兴的风险类型。文章特别提到今年 7 月的“Hugging Face 事件”。OpenAI 表示，该事件说明不能仅依靠沙盒隔离来约束高能力模型。此后，公司重构了内部研究系统，前沿模型训练环境将不接入实时互联网，并通过受限权限沙盒、虚拟机以及网络与云边界实现多层隔离。OpenAI 还披露另一件内部模型突破网络安全限制的事件。该事件发生于 9 月 20 日，一个正在接受训练的 AI 研究模型利用 DNS 配置漏洞，成功绕过网络隔离措施，获得有限的互联网访问权限。OpenAI 随后紧急叫停旗下能力最强模型的训练与评估，停训时间长达 11 天。为加快干预，OpenAI 建立了“控制室”（Control Room）系统：在收到停止指令后，可在 35 秒内停止研究工作负载的后续模型输出；该控制直接部署在推理基础设施中，不依赖各研究任务自行实现关停机制。在模型进入内部部署后，OpenAI 员工可让其访问更广泛的互联网、Slack、代码库及内部基础设施，风险也随之上升。公司表示，此时将更依赖模型对齐、系统级防护和实时监控，重点防范绕过安全限制、数据外泄及向未授权目的地发送敏感信息等行为。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/029/145.htm", "publishedAt": "2026-11-19T00:09:16+00:00"}, {"title": "Agent 驱动 MaaS 新范式，如何让模型能力随需而用？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/video/xsEfht2OwBZQBvWVHSIb?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-18T18:50:07+00:00"}, {"title": "LinkAndroid v2.5.0 自动更新上线，软件自己检查并安装新版本", "summary": "LinkAndroid 2.5.0 之后，更新从「去官网看有没有新版」变成「它自己问一句，你点两下」。 LinkAndroid 是把 Android 手机接到电脑上干活的工具：投屏操控、截屏美化、录屏、管文件装应用、跑 Python 自动化脚本，也能接大模型帮你写脚本。装好之后怎么知道它又更新了，一直是这里的空白。 更新这件事，本来就不该占用你...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503649", "publishedAt": "2026-11-18T14:15:13+00:00"}, {"title": "AIGCPanel v2.7.0 模型权重按需下载，直播错误看得见", "summary": "模型包不再带着权重一起下，直播里播不出去的那句话会告诉你是为什么。 AIGCPanel 是装在自己电脑上的 AI 数字人工作台，口型、语音合成、语音识别都能在本地跑，显卡不够时也能接云端模型或者自己的 API。v2.7.0 的主线有两条：模型权重从模型包里拆出来按需下载，直播合成失败的原因直接写到面板上。本地跑模型的人感受...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503648", "publishedAt": "2026-11-18T14:14:37+00:00"}, {"title": "基于昇腾算力的大模型推理加速研究与实践｜AICon北京", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/NbShAFtZqRSsFrsVu6aj?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-18T14:00:00+00:00"}, {"title": "18 年铸就开源创新基础设施，开源中国「模力方舟词元养成计划」发布", "summary": "GOTC 2026 于 11 月 14 日圆满落幕，主会场上，开源中国董事长马越发表演讲，系统回顾开源中国 18 年的发展历程，分享从开源社区、源代码社区、研发效能平台到人工智能平台、创新孵化平台的五次阶段演进。现场，开源中国统一品牌标识与 IP 形象集中亮相，模力方舟词元养成计划（MoArk Token Incubation Program）正式发布...", "sourceName": "开源中国", "sourceUrl": "https://www. 媒体 GameGPU 昨日（11 月 18 日）发布博文，测试将索尼 PS5 Pro 的 4K 输出信号接入外置采集卡，再由 PC 处理后，《侠盗猎车手 VI》（GTA 6）游戏帧率从原生 30 FPS 提升至约 262~286 FPS，提升 773.33%~853.33%。在测试方面，团队将索尼 PS5 Pro 主机通过 AVerMedia Live Gamer ULTRA 2.1 GC553G2 外接视频采集卡连接到电脑，游戏以 4K 分辨率运行，图形设置最高。图像输出通过 OBS Studio 进行整理，视频录制则使用 NVIDIA 应用完成。为了转换图像并实现最大平滑度，团队启用了使用 NeuralScreen v2.6.4 的 NVIDIA DLSS 5（3D 引导神经渲染）实时生成神经渲染，并支持 6X 模式下的 DLSS 4.5 帧生成。在露西亚身处监狱的场景中，开启 DLSS 5 帧生成后，帧率从主机原生的 30 fps 提升至约 262 至 286 fps；另一段杰森站在码头上的沼泽任务画面，也一度达到 278 fps。在露西亚场景画质方面，英伟达 DLSS 5 技术在标准图像基础上加入逼真的视觉效果，彻底改变场景的感知。神经网络启用后，露西亚的脸、皮肤纹理、发丝、囚服的褶皱，以及窗外洒下的柔和光线都变得栩栩如生。不过开启 AI 渲染后，露西亚的皮肤质感、肤色和整体形象都发生明显变化，部分玩家认为其已与官方预告片中的形象出现偏差，担心神经渲染会“改写”开发者的原始美术设计。IT之家附上相关视频如下：在杰森场景方面，英伟达 DLSS 5 技术在标准图像基础上运行，并加入逼真的视觉效果，启用神经网络后，杰森的面部特征、胡茬、皮肤纹理、长袖衬衫的褶皱和帽子的褶皱都变得栩栩如生。此外整个沼泽场景通过逼真的微对比和深邃阴影改造：木质甲板、锈蚀的遮棚屋顶、水面倒影、浓密树叶和背景雾气都摆脱了常规渲染的模糊，看起来就像是在一部真实电影中拍摄的。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/029/200.htm", "publishedAt": "2026-11-19T03:11:05+00:00"}, {"title": "2026 小鹏科技日定档 11 月 25 日，宣传语“Origin 原点”", "summary": "IT之家 11 月 19 日消息，小鹏汽车今日官宣，「Origin 原点」2026 小鹏科技日定档 11 月 25 日 14:00 在广州举行。海报中展示了小鹏 IRON 机器人。根据计划，小鹏将在 2026 年底实现人形机器人量产，2027 年上半年开启交付，率先落地门店、商场等商业场景，并逐步拓展至工业及家庭场景。8 月 24 日，小鹏机器人业务完成首轮超 9 亿美元（IT之家注：现汇率约合 60.13 亿元人民币）融资，投后估值超 63 亿美元（现汇率约合 420.89 亿元人民币），刷新中国具身智能行业单轮私募股权融资纪录。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/029/198.htm", "publishedAt": "2026-11-19T03:06:26+00:00"}, {"title": "英伟达披露 GPU 租赁价格上涨：Hopper 最高翻倍，B300 涨超 60%", "summary": "IT之家 11 月 19 日消息，英伟达在最新财报电话会议上披露，随着 AI 推理需求持续增长，公司旗下不同代际 GPU 的租赁价格均出现上涨。其中，Hopper 架构 GPU 的多年期续约租赁价格最高达原价 2 倍，Blackwell 架构 B300 GPU 的租赁价格较推出时上涨超过 60%。据 Wccftech 报道，英伟达临时 CEO、首席财务官科莱特 · 克雷斯（Colette Kress）在财报电话会议上表示，自今年 5 月以来，AI 词元价格下降近 60%，进一步刺激了 AI 使用量和算力需求增长，推动不同代际 GPU 的租赁价格上涨。她还表示，英伟达提供给超大规模云服务商和新兴云服务商的计算资源目前均处于满负荷使用状态。英伟达此前披露的数据显示，B300 GPU 的租赁价格较推出时上涨超过 60%。这表明算力租赁市场的价格上涨并不局限于新一代产品，上一代 Hopper 架构产品同样受到需求增长的影响。消费级显卡市场也出现涨价消息。据博板堂爆料，技嘉显卡工厂及华硕显卡工厂现已执行 11 月份最新成本价格调整政策，针对大部分型号成本价格全面涨价。其中，RTX 5080 系列上涨 1000 元，RTX 5060 系列上涨 150 元。中国 AI 企业还面临海外算力租赁渠道收紧的问题。据《金融时报》报道，英伟达已要求全球数据中心及云服务合作伙伴，将至少 51% 的服务提供给非中国客户。这项要求通过英伟达销售团队口头传达，适用于未来签订的合同，不涉及现有租赁协议。《金融时报》报道称，一套国际市场售价约 60 万美元（IT之家注：现汇率约合 400.8 万元人民币）的 B300 机架系统，上个月在中国市场的售价据称达到 1850 万元人民币。报道指出，英伟达收紧海外云服务客户限制，可能进一步影响中国企业获取先进 AI GPU 算力的渠道。相关阅读：《轻信短视频“英伟达 RTX 5080 显卡降价近万元”虚假消息，杭州一居民被骗 1.58 万元》《消息称黄仁勋曾力推 RTX 5080 24GB 显卡安抚游戏玩家，如今英伟达或将其取消》《24Gb GDDR7 价格过高，传 16GB 版本 GeForce RTX 5080 显卡回归市场》《消息称华硕 / 技嘉显卡工厂已执行最新成本价格调整政策：RTX5080 系列涨 1000 元、5060 涨 150 元》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/029/193.htm", "publishedAt": "2026-11-19T02:46:23+00:00"}, {"title": "最高每小时狂写 30GB：英伟达 621.24 驱动反馈加速消耗 SSD 寿命", "summary": "IT之家 11 月 19 日消息，科技媒体 Tom's Hardware 今天（11 月 19 日）发布博文，报道称英伟达 GeForce 驱动 621.14 和 621.24 两个版本存在异常后台写入问题，即使电脑处于闲置状态，系统仍持续向 SSD 写入数据。报道称最早的用户反馈可以追溯到 11 月 4 日，有用户反馈在升级 621.14 版本驱动后，电脑闲置时出现异常后台写入，实测约每小时 3GB。IT之家附上相关截图如下：该用户通过 Windows 资源监视器、性能计数器及 CrystalDiskInfo 等工具检测发现，5 分钟内系统对 C 盘的写入量约为 270MB，折算约每小时 3GB。写入量会随日志文件变大而增加，有用户称，每次使用 Alt+Tab 切换窗口，还可能额外产生 500MB 至 1GB 的写入。若按较高估算值计算，一台每天开机 8 小时的电脑，可能每年产生约 87.6TB 的额外写入。以一块标称 600TB 写入寿命的 1TB SSD 计算，相当于每年消耗约 15% 的额定耐久度。另一起报告来自 11 月 12 日，用户反馈 621.24 版本最高约每小时 30GB，长时间使用甚至可能达到 70GB 以上；即便关闭 NVIDIA App 遥测，该问题依然存在。问题根源方面，问题疑似源自英伟达的“NVIDIA Display Container LS”后台服务，其进程 NVDisplay.Container.exe 会不断重写日志文件 nvlog.nvlgstg。相关阅读：《AMD 显卡驱动被曝 SSD 持续写入 Bug：最高每天 432GB，官方已着手调查》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/029/169.htm", "publishedAt": "2026-11-19T01:42:01+00:00"}, {"title": "微信鸿蒙版 App 获 8.0.23.46 邀测升级", "summary": "IT之家 11 月 19 日消息，微信鸿蒙版 App 在华为应用市场（App Gallery）发布了 8.0.23.46 (8394542) 版本邀测升级（需收到短信通知后点击链接跳转安装），测试时间为 2026/11/18-2026/12/18。和往常一样，本次更新的说明依旧为“修复了一些已知问题”。据博主 @伤心萨摩耶Ciuciu 以及 MeoW 反馈，8.0.23 版微信中发现的新特性包括但不限于（IT之家注：不局限于 8.0.23.46）：0.部分 Flutter 跨端页面（如朋友圈、听一听等页面）响应系统字体粗细；1.更换铃声选择界面右上角新增铃声设置入口，支持启用或停用个性化内容推荐；2.发表视频号内容时新增添加标注，视频号已发布的内容点击分享同步新增添加标注；3.发现 &gt; 直播 &gt; 更多直播新增搜索按钮；4.听一听主页面右下角新增小微分支入口悬浮按钮，并根据当前页面内容弹出对应提示词，可快速使用听一听相关问小微功能，播放页面点击分享新增问小微（主页面右下角悬浮按钮为逐步开放） 特定任务设计的专用芯片（ASIC）服务器。双鸿董事长林育申指出，服务器正变得越来越热。随着更多高功耗芯片进入服务器，有限空间内需要排出的热量也随之增加。已有行业报道指出，在高密度计算场景下，传统风冷面临挑战，利用液体带走热量的液冷方案，其成本与性能优势逐渐显现。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/029/234.htm", "publishedAt": "2026-11-19T03:42:52+00:00"}, {"title": "Anduril 创始人拉奇谈 AI 网络安全：美国 AI 攻防失衡，长期来看善用 AI 防御的一方将占据优势", "summary": "IT之家 11 月 19 日消息，Anduril 联合创始人帕尔默 · 拉奇（Palmer Luckey）今日在《纽约时报》DealBook 峰会上警告称，美国正面临 AI 网络攻防体系的严重失衡。拉奇表示，AI 已经能够帮助攻击者开发各种漏洞利用程序，针对美国企业和基础设施发动攻击。“攻击者快速采用新技术，而老旧系统却无法像技术发展那样迅速完成升级，这两者之间存在不匹配。”他认为，美国需要加快数字基础设施的更新和安全防护建设。“我认为大家必须加快步伐，是时候开始加速了。”此次发言正值美国多家机构近期接连出现技术故障之际。拉奇将这些事件与 AI 技术推动的网络攻击能力提升联系起来（但目前没有证据表明这些故障由网络攻击造成）。拉奇认为，相关攻击既可能出于战略目的，也可能出于经济利益。拉奇认为，AI 不仅会增强攻击能力，也可能让防御方获得更大优势。他表示，从长远来看，能够最有效地利用 AI 进行防御的一方将占据优势，但目前攻击者在技术应用速度上领先于许多传统防御系统。除了网络安全，拉奇还谈到了美国国防技术的发展。他创立的 Anduril 主要开发 AI 无人机、自主武器系统和军事软件。美国国防部长皮特 · 赫格塞斯此前邀请拉奇参与名为 Project Meridian 的为期 120 天的战略研究，研究未来战争的发展方向。拉奇为这一安排辩护，称政府与产业界人士共同讨论军事发展方向有着长期传统。拉奇还披露了自己正在推进的一项海上建设计划 SLAB。根据他在 X 上发布的信息，该项目希望在美国近海建设大型海上平台，供金属加工、石油精炼、化学工程、医疗研究和海水淡化等行业使用，降低土地和运营成本，同时减少州及地方监管限制。拉奇称，该平台的设计寿命目标为 1000 年，项目由他与几位朋友共同投资，早在 2017 年就曾以 10 亿美元（IT之家注：现汇率约合 66.81 亿元人民币）估值获得资金支持。他表示，项目仍有很长的路要走，并非近期才因 AI 数据中心需求而提出。另外值得一提的是，拉奇自身的创业经历也成为此次峰会讨论内容之一。2014 年，他联合创立的虚拟现实公司 Oculus VR 被 Facebook 收购，交易金额约为 20 亿美元（现汇率约合 133.62 亿元人民币）。随后，他加入 Facebook，但后续因 VR 业务发展方向与团队产生分歧。2016 年美国总统大选前，拉奇向一个支持特朗普的组织捐赠了 9000 美元。该组织曾发布针对民主党总统候选人希拉里 · 克林顿的攻击性广告。这一事件引发 Facebook 内部员工不满，拉奇称，同事要求公司解雇他，他最终于 2017 年离职。谈及这段经历时，拉奇表示，自己至今仍然对此事耿耿于怀。他说：“我仍然对此事非常介意。我一直没有放下。”拉奇还将创立 Anduril 形容为自己离开 Facebook 后的一个重要创业项目。如今，这家公司已成为美国国防科技领域的重要参与者，业务涵盖自主无人系统、人工智能和军事装备制造。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/029/176.htm", "publishedAt": "2026-11-19T02:02:55+00:00"}, {"title": "全球首个医疗健康AI独立评测与分析平台InclusionMed正式上线", "summary": "近日，全球首个医疗健康 AI 独立评测与分析平台InclusionMed 正式上线", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/510916.html", "publishedAt": "2026-11-18T07:24:50+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "黄仁勋离职引发科技圈讨论：马斯克称其无可替代，微软纳德拉建议不要神化创始人", "summary": "IT之家 11 月 19 日消息，OpenAI CEO 萨姆 · 奥尔特曼、微软 CEO 萨提亚 · 纳德拉和特斯拉 CEO 埃隆 · 马斯克等科技行业高管今日在《纽约时报》DealBook 峰会上谈及英伟达前 CEO 黄仁勋近期离职事件。几位科技行业人士表达了对黄仁勋的支持或同情，但对于英伟达未来的管理层安排，各方态度并不完全一致。黄仁勋于 11 月 12 日正式辞去英伟达 CEO、总裁及董事会成员职务，英伟达首席财务官科莱特 · 克雷斯（Colette Kress）出任临时 CEO。英伟达董事会此前宣布启动独立调查，黄仁勋则公开承认对妻子不忠，并向家人和公司员工道歉。奥尔特曼：很难想象没有黄仁勋的 AI 行业在此次峰会上，奥尔特曼表示，黄仁勋对整个 AI 行业具有重要意义。他说：“很难想象没有黄仁勋的 AI 行业。”他表示，自己对黄仁勋的处境抱有更多同情，并希望黄仁勋和英伟达都能顺利度过当前阶段。奥尔特曼还提到了自己 2023 年被 OpenAI 董事会罢免 CEO 职务、随后又重新回归的经历。他表示，这段经历让自己对黄仁勋目前的处境有了更多理解，同时也不希望外界不断通过各种未经证实的猜测解读事件。马斯克力挺黄仁勋马斯克的态度更加明确。他在峰会上再次为黄仁勋辩护，称黄仁勋是自己的老朋友，并将其比作篮球巨星迈克尔 · 乔丹。马斯克表示，黄仁勋拥有数十年来积累的长期合作关系，对技术有着深刻理解，团队成员也非常认可他。他认为，英伟达董事会决定让黄仁勋离开，堪比正在连胜的芝加哥公牛队突然把乔丹踢出球队一样，并不是明智的决定。马斯克表示：“我不认为他对美国不忠。”他还透露，自己愿意聘请黄仁勋，并认为没有其他人能够真正取代他。马斯克此前也参与支持要求英伟达重新任命黄仁勋的联名请愿。纳德拉：同情其遭遇，但黄仁勋并不是神微软 CEO 纳德拉则采取了相对谨慎的态度。他表示，黄仁勋的遭遇令人遗憾，但后续如何处理属于英伟达董事会的职责范围。纳德拉特别提到了英伟达临时 CEO 科莱特 · 克雷斯，称她曾在微软工作多年，自己对她非常了解，并认为她是一位非常优秀的人。他同时表示，自己对英伟达现有团队继续推进业务充满信心。“我联系的还是和以前一样的那群人，”他说。纳德拉并非微软的创始人，他认为创始人之所以了不起，是因为他们白手起家。“创始人是独一无二的，但他们并不是神。”他们应该为公司在他们离开后蓬勃发展而感到自豪，如果公司没有蓬勃发展，他反问道：“那又怎样？你究竟创造了什么？”其他人美国财政部长斯科特 · 贝森特此前则公开主张英伟达应该从公司外部寻找新任 CEO。他表示，英伟达需要一次“戏剧性的调整”（dramatic shake-up），并希望董事会进一步调查公司内部管理以及芯片出口合规问题。Anduril 创始人帕尔默 · 拉奇则表示：“中国希望黄仁勋离开，所以我希望他留下。”他认为，黄仁勋对英伟达的技术、业务以及合作伙伴关系具有重要作用。值得注意的是，英伟达董事会主席已经在 11 月 17 日的财报电话会议上明确表示，董事会一致接受了黄仁勋的辞职，不打算恢复其 CEO 职务。尽管黄仁勋此前表示，如果董事会认为回归符合公司、员工和股东的利益，他愿意重新担任 CEO，但目前双方立场已经明确。相关阅读：《马斯克谈黄仁勋结束 33 年掌舵英伟达生涯：创始人很难被取代》《马斯克、奥尔特曼、纳德拉等人出席 DealBook 峰会，回应热点问题》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/029/174.htm", "publishedAt": "2026-11-19T01:50:28+00:00"}, {"title": "从 AI 试点到规模化生产：Snowflake 驻场前沿工程师如何助力企业实现 AI 落地 ｜ 技术趋势", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/ZukzUBeu7k74T9UGCkfh?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-18T18:44:20+00:00"}, {"title": "如何让 Agent 从“能跑起来”到“可规模化、可信赖地持续生产”？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/video/uzyzSB9H const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
