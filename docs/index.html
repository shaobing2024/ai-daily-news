const DATA = {"date": "2026-08-06", "generatedAt": "2026-08-05T23:56:40Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "继 OpenAI、Anthropic 之后，Meta AI 模型测试期间也发生“越界”事件", "summary": "IT之家 8 月 6 日消息，据《The Information》当地时间周三报道，Meta 的一款 AI 模型在网络安全测试过程中入侵了另一家公司的系统。这是继多家大型 AI 公司之后，再次发生 AI 智能体在测试中入侵其他公司系统的事件。报道称，Meta 的 Muse Spark 1.1 模型成功入侵了一家未公开名称公司的系统，并对其内部系统进行了修改。之所以能够做到这一点，是因为用于测试的“沙盒”环境配置出现错误，使该 AI 模型获得了访问公共互联网的权限。报道援引知情人士消息称，Meta 与一家名为 Irregular 的第三方评估机构共同进行了此次测试。报道称，Irregular 的配置失误导致测试环境出现问题，随后该模型利用另一家第三方服务中的安全漏洞实施了攻击。Meta 发言人向《The Information》表示，这与此前其他公司披露的类似事件情况相似。Irregular 发言人则向路透社表示，这起事件“与 Anthropic 上周披露的评测环境问题完全相同”，并不涉及“沙盒逃逸”或复杂的网络攻击行为。Irregular 在声明中表示：“目前不存在任何尚未解决的问题。Irregular 正在编写一份白皮书，分享如何安全隔离测试环境以及开展网络安全评测的最佳实践。”IT之家注意到，就在上周，Anthropic 披露，其部分 Claude AI 模型在网络安全测试期间曾入侵三家公司的系统。而在此之前，OpenAI 也曾透露，其一款 AI 智能体在测试过程中发生失控并发起攻击。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/986/269.htm", "publishedAt": "2026-08-05T23:15:37+00:00"}, {"title": "挑战 Codex 等，Meta 推出其首个编程 AI 智能体工具 Muse Code", "summary": "IT之家 8 月 6 日消息，Meta 公司今天（8 月 6 日）发布博文，宣布以测试版推出其首个编程 AI 智能体工具 Muse Code，希望挑战 Anthropic 的 Claude Code，以及 OpenAI 的 Codex 等编程 Agent 工具。IT之家附上 Meta 公司首席执行官马克 · 扎克伯格（Mark Zuckerberg）的相关介绍如下：Muse Code 是 Meta 首席 AI 官汪滔（Alexandr Wang）的最新成果，他负责领导 Meta 超级智能实验室以及开发相关模型。他于 2025 年 6 月加入 Meta，是公司首席执行官马克 · 扎克伯格（Mark Zuckerberg）重整公司人工智能战略的核心人物之一。在本周三接受 CNBC 采访时，汪滔表示：“开发者只需要 1 条命令，就能安装 Muse Code，并用它处理完整软件工程任务，覆盖规划变更、编写代码、验证结果等多类场景。”在功能方面，Muse Code 目前以预览方式推出，汪滔称 Muse Spark 1.2 与 Muse Code 同步开发和训练，从而提升了整体编程性能。在商业模式方面，开发者可通过按量付费方式使用 Muse Code：每 100 万 Tokens 输入费用为 1.25 美元（现汇率约合 8.5 元人民币），每 100 万 Tokens 输出费用为 4.25 美元（现汇率约合 28.7 元人民币）汪滔表示，该编程 Agent 工具还设有“contributor tier”（贡献者订阅），入门成本显著更低，价格比按量付费档的十分之一甚至更低。不过，选择最低价档的开发者必须主动同意帮助改进模型，这涉及 Meta 使用第三方数据强化底层技术。汪滔还表示，Meta 正开始接受零数据保留（zero-data retention）请求。这意味着 Meta 不会保留开发者数据用于改进模型。他称，这是一项“对许多人很重要的大型企业功能”。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/986/268.htm", "publishedAt": "2026-08-05T23:13:48+00:00"}, {"title": "谷歌 DeepMind 重组：哈萨比斯转任首席科学家，聚焦通用人工智能应用", "summary": "IT之家 8 月 6 日消息，谷歌母公司 Alphabet 昨日（8 月 5 日）宣布重组旗下 AI 公司 DeepMind，公司首席执行官戴米斯 · 哈萨比斯（Demis Hassabis）卸任日常管理职务，转任董事长兼 Alphabet 首席科学家，聚焦通用人工智能（AGI）战略与科学应用。因 AlphaFold 在人工智能与蛋白质结构预测领域的突破性贡献，哈萨比斯和约翰 · 江珀（John Jumper）、以及美国科学家大卫 · 贝克（David Baker）三人共同分享 2024 年诺贝尔化学奖。戴米斯 · 哈萨比斯（Demis Hassabis），图源：WikiMediaIT之家援引博文介绍，在出任 Alphabet 首席科学家外，哈萨比斯会继续领导 AI 药物研发分拆公司 Isomorphic Labs。哈萨比斯在推文中表示：我毕生致力于通用人工智能（AGI）的研发，值此关键时刻，我将担任谷歌 DeepMind 董事长兼 Alphabet 首席科学家。这可以让我能够专注于长期战略，加速科学突破，包括充分利用我在 Isomorphic 的研究成果来帮助治愈疾病。DeepMind 首席技术官、Alphabet 首席人工智能架构师科雷 · 卡武库奥卢（Koray Kavukcuoglu）将接管日常运营，出任 Google DeepMind 高级副总裁。科雷 · 卡武库奥卢（Koray Kavukcuoglu），图源：谷歌他将直接向 CEO 桑达尔 · 皮查伊汇报，不再担任独立 CEO，并负责后续 Gemini 模型开发。哈萨比斯在信中提到公司新模型取得“巨大进展”，并点名尚未发布的 Gemini 4。卡武库奥卢表示：对于谷歌 DeepMind 而言，我们的使命始终不变，会负责任地构建人工智能并造福人类。我的首要任务是确保我们拥有最清晰的路径，以实现我们雄心勃勃的 Gemini 路线图，并朝着通用人工智能（AGI）的目标迈进。在当今瞬息万变的环境中，我们必须以绝对的决心和速度开展工作。Alphabet 及谷歌现任首席执行官桑达尔 · 皮查伊（Sundar Pichai）表示：我们必须加快所有这些工作，并始终专注于人工智能前沿领域。与此同时，现在比以往任何时候都更需要把握时机，塑造通用人工智能和科学的未来。谷歌首席科学家杰夫 · 迪恩（Jeff Dean）也将离开公司。迪恩在谷歌任职 27 年，计划与前谷歌员工桑杰 · 格马瓦特、奥里奥尔 · 维尼亚尔斯和夸克 · 乐共同创办 Discovery Loop，这是一家旨在自动化机器学习、科学与工程研究的公益公司。Alphabet 是该公司的创始投资者，并将提供云计算资源。杰夫 · 迪恩（Jeff Dean），图源：WikiMedia", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/986/265.htm", "publishedAt": "2026-08-05T22:57:06+00:00"}, {"title": "Ming-Flash-Omni：全模态统一大模型的关键技术与实践", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/OlBv9DATXabu0bb4kAPt?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-05T15:57:15+00:00"}, {"title": "阿里巴巴 2026 云栖大会定档 9 月 22 日至 24 日在杭州举行", "summary": "IT之家 8 月 5 日消息，阿里官方今日宣布，2026 云栖大会将于 9 月 22 日至 24 日在杭州举行。本届大会主题为“智以致用”（Intelligence Goes Beyond），将以 Agentic AI 为核心，串联芯片、云基础设施、模型能力与模型服务、Agentic 应用的完整技术链路。此次大会将设置三大主论坛。其中，“云栖主论坛”将聚焦重磅技术发布与产业标杆实践；“技术主论坛”展示全栈技术体系；“‘为了无法计算的价值’主论坛”则探讨 AI 的社会价值与绿色共生。届时将有超过 2000 位全球领袖和行业专家参与分享。据介绍，本届云栖大会的展览规模进一步扩大，展区面积超过 5 万平方米，预计吸引超过 1000 家企业联合参展。展区规划了五大主题场馆，IT之家总结如下：1 号“智能引擎馆”将呈现阿里巴巴在算力、模型等方面的全栈技术能力；2 号“算力基石馆”展示支撑智能时代的算电基础设施全景；3 号“超级创造馆”聚焦智能生活与 Agent 体验；4 号“产业共创馆”见证 AI 在具身智能、汽车、制造、金融等行业的落地；此外还特设“太空算力 · 物理 AI 馆”，探索机器人与太空算力等前沿领域。除主论坛外，大会还将举办 140 多场分论坛及专题讨论，议题覆盖芯片与算力、AI 原生云、模型前沿、Agentic 应用、开源社区、产业数智转型、AI 治理与人文价值等多个方向。云栖大会由杭州市人民政府和阿里巴巴集团共同主办，其前身可追溯至 2009 年的地方网站峰会，2015 年正式定名并永久落户杭州云栖小镇。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/986/256.htm", "publishedAt": "2026-08-05T15:26:28+00:00"}, {"title": "开出AI界最高薪的Anthropic，抱怨员工为钱而来？全网“阴阳”：和你死活反开源一样", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/qYp5NCloR64emA3Bq11F?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-05T15:25:00+00:00"}, {"title": "GPT-5.6价格暴降，最低打两折！网友隔空点A社：该你了", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/KROGtjyegHRSKCSNS70o?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-05T15:17:20+00:00"}, {"title": "Cloudflare 宣布推出开源“Cloudflare OS”：面向 AI 智能体和企业工作的开放平台", "summary": "IT之家 8 月 5 日消息，Cloudflare 今日宣布开源名为“Cloudflare OS”的 AI 平台项目，定位为面向智能体（Agents）、应用程序以及企业工作流程的开放平台。不过，该项目并不是传统意义上的操作系统，而是一套用于组织内部 AI 协作和任务执行的基础平台。Cloudflare 表示，Cloudflare OS 目前已经在公司内部使用。该平台从浏览器中的对话交互开始，与常见 AI 工具类似，但不同之处在于，每次对话都会基于企业自行整理的知识、技能和工作环境展开。根据 Cloudflare 介绍，用户可以为工作空间设定目标，平台能够调用组织已有的数据、工具以及知识资源完成相关任务。原本以聊天形式开始的操作，可以进一步转变为文档、应用程序或持续运行的工作流程。Cloudflare OS 主要由三部分组成。第一部分是基于企业自定义上下文和技能的智能体工作空间，其中包含隔离运行环境，允许 AI 智能体编写并执行代码。第二部分是新的安全与治理框架，用于确保智能体能够安全访问企业内部数据和服务。第三部分则是个人化、可修改的应用平台，用户可以创建、共享并持续调整自己构建的应用。Cloudflare 强调，虽然该项目使用了“OS”这一名称，但其含义不同于传统操作系统。Cloudflare OS 一方面被描述为帮助企业安全使用 AI 提升生产效率的“企业操作系统”，另一方面也被视为用于管理 AI 工作负载的基础平台，类似传统操作系统管理计算资源的方式。该项目目前已经在 GitHub 上开源，名称为 cloudflare-os，采用 Apache 2.0 开源许可证。IT之家附 GitHub 地址：https://github.com/cloudflare/cloudflare-os相关阅读：《Cloudflare 推出新开源库，为每个 AI 智能体配备独立工作计算机》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/986/252.htm", "publishedAt": "2026-08-05T15:11:39+00:00"}, {"title": "中国联通：智算规模达 45EFLOPS，今年算力相关投资将超 175 亿元", "summary": "IT之家 8 月 5 日消息，中国联通今日宣布，截至目前，中国联通标准机架规模超过 110 万架，建成 7 个百兆瓦级 AIDC 园区，智算规模达到 45EFLOPS（IT之家注：1EFLOPS 表示每秒可执行一百亿亿次（10^18）浮点运算）。中国联通表示，明确 2026 年全年资本开支 500 亿元，其中算力相关投资超 175 亿元，占总投资 35%。据介绍，中国联通围绕“东数西算”战略部署的京津冀、长三角、粤港澳大湾区、成渝、内蒙古、贵州、甘肃、宁夏等八大国家算力枢纽节点，完成了资源布局的全覆盖，深度参与国家规划的 10 个数据中心集群建设。在算力平台层面，中国联通打造了以“联通云 AI+ 联通元景”为核心的全栈算力体系。实现四地三类异构算卡数千公里跨域混训，百亿、千亿大模型跨域训练效率分别达 90%、85%。相关阅读：《我国智能算力规模达 2185EFLOPS，全国算力设施整体上架率达 71.4%》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/986/235.htm", "publishedAt": "2026-08-05T13:41:05+00:00"}, {"title": "消息称阶跃星辰内部确立大模型与智能体终端两条战略线，手机业务独立运营、将进入海外市场", "summary": "IT之家 8 月 5 日消息，据虎嗅消息，阶跃星辰内部正在按照两条战略线推进：一条仍以大模型为核心，另一条则以智能体终端为核心，目前手机只是初步探索。其中，以大模型为核心的业务仍以上海阶跃星辰智能科技股份有限公司这一原有主体运营；手机业务则被放入一家新公司独立运营。据悉，阶跃正在搭建海外商业化团队，计划向海外销售大模型 API，其中将以语音模型为主。按照目前的规划，阶跃的大模型和手机都将进入海外市场：模型为手机提供差异化能力，手机则成为模型直接触达用户的产品载体，两条业务线相互促进。据IT之家此前报道，7 月 13 日，阶跃星辰发布终端品牌 STEPX，旗下首款智能体手机 STEPX Neo 正式亮相，机身背面配备交互副屏，搭载智能体原生系统 Step AOS。阶跃官方公布的首批生态合作伙伴包括美团、WPS、剪映、携程、高德、支付宝、百度、滴滴、京东、微博、百度地图等。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/986/233.htm", "publishedAt": "2026-08-05T13:29:22+00:00"}, {"title": "Anthropic 首次确认自研 AI 芯片：专为 Claude 定制，公司正在组建团队", "summary": "IT之家 8 月 5 日消息，Anthropic 发言人对 Business Insider 确认，公司正在组建内部芯片团队，计划为旗下 Claude 模型开发定制化芯片，以应对不断增长的 AI 算力需求。这是该公司首次公开确认自研芯片计划。该发言人表示，Anthropic 计划通过硬件与模型协同设计的方式，让 Claude 能够以更高速度和更高效率运行，并满足客户规模化使用需求。不过，Anthropic 不会完全依赖自研芯片，公司未来将采用“多芯片策略”，继续使用来自 AWS、谷歌、英伟达和 AMD 的硬件。此前，路透社曾报道称 Anthropic 正在探索自主设计 AI 芯片的可能性。《The Information》上月报道称，Anthropic 已与三星电子就潜在芯片制造合作进行沟通。Anthropic 最近发布的一份招聘信息进一步透露了该公司的芯片规划。招聘岗位显示，公司正在寻找加入“定制芯片团队”的工程师，候选人需要具备半导体设计、验证等多个领域的专业经验。该职位提供的年薪范围为 32 万美元至 48.5 万美元（IT之家注：现汇率约合 216.4 万元至 328 万元人民币），招聘要求中提到，候选人需要证明自己曾“直接参与”半导体设计最终定型以及产品交付流程。招聘信息写道：“该岗位适合那些拥有芯片量产经验、能够理解项目周期，并且能够在没有大型组织支持的情况下做出重要决策的人。”Anthropic 并非首家尝试自主设计 AI 芯片的人工智能公司。此前，竞争对手 OpenAI 已与博通（Broadcom）合作开发专用 AI 芯片，并于 6 月公布了名为“Jalapeño”的自研半导体项目。相关阅读：《消息称 OpenAI、博通合作 Jalapeño 芯片采用台积电 3nm 工艺制程》《OpenAI、博通联手打造的 AI 芯片 Jalapeño 首秀，号称媲美英伟达 Blackwell》《知情人士：OpenAI 跟博通开发 AI 芯片能比买英伟达芯片省二至三成成本》《OpenAI 携手博通打造首款自研 AI 芯片：算力达 10 吉瓦级，2026 年下半年开始推进研发》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/986/228.htm", "publishedAt": "2026-08-05T13:00:44+00:00"}, {"title": "超 10 万个样本验证：深圳先进院提出非接触激光超声技术，实现锂电池 SoC / SoH 实时监测", "summary": "IT之家 8 月 5 日消息，中国科学院深圳先进技术研究院今日宣布，旗下智能仿生研究中心郭师峰团队与清华大学深圳国际研究生院周光敏团队合作。相关研究成果已于 7 月 29 日发表在《Science Advances》上。该研究面向高倍率工况下锂离子电池的荷电状态（SoC，State of Charge，表示电池当前剩余电量）与健康状态（SoH，State of Health，反映电池经循环后的性能退化程度）的高精度原位监测需求，提出了一种将“非接触激光超声传感”与“Transformer 深度学习”模型相结合的一体化方案。现有电池状态估算方法多依赖电压、电流和内阻等电化学参数，但在高倍率充放电过程中，复杂的电化学动力学及热效应会显著削弱此类方法的适用性。近年来兴起的超声检测技术虽为电池内部状态的无损感知提供了新路径，但主流的接触式和浸液式压电超声方法普遍依赖耦合剂或浸液介质，检测结果易受耦合状态及温度波动影响，耦合剂残留也限制了其在真实场景中的推广。针对上述局限，研究团队提出了一种无需耦合剂的非接触激光激励超声传感（LEUS）系统。该系统采用环形脉冲激光与连续激光协同的双激光设计方案。根据论文摘要，该设计可将超声信号振幅提升 10 倍，信噪比达到 30dB，较典型配置高出 16dB。通过将采集到的超声信号转化为时频谱图，Transformer 网络可自动提取与 SoC、SoH 相关的判别性特征，减少对人工特征构建的依赖，同时实现高精度预测。在预测精度方面，该模型对 SoC 的平均误差低于 5.7%，对 SoH 的平均误差低于 2.1%。研究团队还引入了迁移学习策略，使基础模型能够快速适配不同的电池化学体系、型号及高倍率循环条件，仅需少量超声数据即可实现稳定监测，显著降低了重训练时间和成本。在验证环节，团队构建了覆盖磷酸铁锂（LFP）和镍钴锰（NCM）两种正极材料、三种容量设计、13 种高倍率测试协议的 40 块商用电池数据集，累计采集超过 10 万个超声信号样本。验证结果表明该方法具有较强的鲁棒性和可靠性。该研究贯通了非接触超声信号采集、多场景电池数据构建及深度学习状态推断等关键环节，为复杂工况下锂离子电池的无损、实时与智能化状态监测提供了新的技术路径。郭师峰研究员、冯伟研究员和周光敏副教授为该论文共同通讯作者，吕高龙博士与孙崇博博士为共同第一作者。该研究获得国家重点研发计划、国家自然科学基金、广东省及深圳市基础研究项目的资助支持。IT之家附论文地址：https://doi.org/10.1126/sciadv.aec5358", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/986/225.htm", "publishedAt": "2026-08-05T12:48:35+00:00"}, {"title": "又一家AI基金暴雷了", "summary": "开源改写游戏规则", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/467001.html", "publishedAt": "2026-08-05T12:43:18+00:00"}, {"title": "2027 款广汽埃安 AION RT 上市：标配宁德时代电池，9.98 万元起", "summary": "IT之家 8 月 5 日消息，2027 款埃安 AION RT 今晚上市，新车共计推出 4 款车型，全系标配宁德时代电池，售价 9.98-12.38 万元：550 智享版：9.98 万元605 智豪版：10.98 万元710 智豪版：11.98 万元710 智尊版：12.38 万元新车核心变化点是引入全新非晶合金电驱，带来更低电耗，实际续航里程表现更佳。CLTC 最大续航提升至 710km。外观方面，2027 款埃安 AION RT 换装全新半隐藏式门把手，并增加应急拉手；外观整体延续现款车型的设计。内饰方面，升级软质包覆，并新增耐脏内饰配色。整体依旧搭载 8.88 英寸悬浮式仪表盘与 14.6 英寸中控屏，车机系统为 ADiGO 6.0，增加 CarPlay 互联。IT之家获悉，新车车身尺寸保持不变，新车长宽高分别为 4865/1875/1520mm，轴距 2775mm；整车风阻系数为 0.208Cd。辅助驾驶方面，新车取消标配激光雷达，带来新一代端到端智驾辅助大模型，可选装无图城市领航 NOA，标配高速领航和自动泊车功能。新车主动安全还升级倒车 AEB、哨兵模式远程查看、胎压监测、行车记录仪录音等。动力方面，550 智享版车型最大功率 150kW、最大扭矩 205N·m；605、710 车型最大功率 165kW、最大扭矩 205N·m。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/986/209.htm", "publishedAt": "2026-08-05T11:46:16+00:00"}, {"title": "比亚迪仰望 U8L 鼎藏版四座旗舰 SUV 上市：甲骨文 24K 黄金车标，售价 145.8 万元", "summary": "IT之家 8 月 5 日消息，比亚迪仰望汽车今晚宣布，比亚迪仰望 U8L 鼎藏版全尺寸行政旗舰 SUV 上市，售价 145.8 万元。仰望 U8L 鼎藏版长 5400mm、宽 2049mm、高 1921mm，轴距 3250mm；采用矩阵式鼎型大灯、甲骨文黄金车标，搭载上下对开式电动尾门。仰望 U8L 鼎藏版是一款四座旗舰，搭载行政级零重力尊享座椅，最大躺角 150°，搭载电动腿托，支持 18 点式按摩功能。仰望 U8L 鼎藏版 CLTC 综合续航 1205km，纯电 CLTC 续航 230km，搭载比亚迪闪充技术 5 分钟充好、9 分钟充饱。仰望 U8L 鼎藏版搭载天神之眼 A 辅助驾驶三激光版，采用天神之眼 5.0 端到端强化学习大模型，拥有 40 组全域高精度感知硬件。IT之家获悉，仰望 U8L 鼎藏版有多种外观、内饰、轮毂可选，还可选装方向盘黄金 / 铂金车标搭配前、后黄金车标。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/986/206.htm", "publishedAt": "2026-08-05T11:34:58+00:00"}, {"title": "AI 根因分析从模型推理转向上下文工程", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/sJLewGjY5sUZPgpGy071?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-05T10:24:08+00:00"}, {"title": "中国开源 AI 模型将豁免美国政府安全审查", "summary": "8月4日，白宫在一场闭门会议上向OpenAI、Anthropic、Google等硅谷AI巨头透露了一个消息：在即将出台的AI安全框架下，中国竞争对手开发的开放权重AI模型将被豁免，无需接受美国政府的安全测试。 据彭博社引述知情人士报道，这场会议在周二举行。所谓开放权重模型，就是允许用户下载并定制其中技术的模型——DeepSeek、月之...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/488173/china-s-open-weight-models-to-be-spared-us-tests-us-firms-told", "publishedAt": "2026-08-05T09:17:28+00:00"}, {"title": ":fire: SolonCode v2026.8.4 发布：界面字体可调、22 种语言、记忆搜索增强", "summary": "打开终端就能上岗的全中文编码智能体，这一轮把「看得清、用母语、记得住」三件事一次补齐。 SolonCode 是什么 SolonCode 是杭州无耳科技研发的企业级终端编码智能体——一位全中文驱动的数字员工，自主理解需求、规划步骤、编写代码。不挑模型、不挑平台，curl 一行 可交易股票将从目前约 6.39 亿股增至最多 15.5 亿股，流通规模增加一倍以上。巨额限售股即将进入市场，SpaceX 估值又处于高位，做空资金因而蜂拥而至。S3 Partners 截至周二收盘的数据显示，现有流通股中有 35% 已经被卖空。财报发布后，SpaceX 股价较 6 月 16 日高点下跌 38%，做空者由此获得 53 亿美元（现汇率约合 358.44 亿元人民币）账面利润。SpaceX 股价周三再跌逾 10%，此前两日涨幅大多被抹去，价格重新回到 110 美元（现汇率约合 743.9 元人民币）附近。分析师依然看好长期发展前景，并把本月晚些时候暂定进行的星舰第 14 次发射视为下一个潜在催化剂。星舰是 SpaceX 把数据中心送入太空计划的关键环节。AI 支出高于预期，是股价掉头下跌的原因之一。华尔街更关注 SpaceX 最快明年开始把数据中心送入轨道，以及利用 Starlink 网络直接挑战美国最大移动通信运营商的计划。作为目前唯一盈利的业务，卫星互联网服务 Starlink 推动季度营收超过分析师预期。Aptus Capital Advisors 投资组合经理戴维 · 瓦格纳表示：“在 12 月前，限售股始终会压在股价上方。面对基本面和解禁压力，许多投资者暂时不愿买入 SpaceX 股票。说白了，我们也是如此。”即便长期坚定看好 SpaceX 的股东，也可能趁解禁兑现部分收益。收购 xAI 后形成的 SpaceXAI 估值为 1.25 万亿美元（现汇率约合 8.45 万亿元人民币），而 SpaceX 目前市值约为 1.5 万亿美元（现汇率约合 10.14 万亿元人民币）。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/986/241.htm", "publishedAt": "2026-08-05T13:54:51+00:00"}, {"title": "从工具调用到生产级 Data Agent：Context 与治理闭环｜AICon深圳", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/2djLJTOiQuAjeriOthao?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-05T10:00:00+00:00"}, {"title": "NVIDIA 成为 LVFS / Fwupd 首席赞助商", "summary": "红帽公司的 LVFS/Fwupd 首席开发者 Richard Hughes 发文确认，英伟达（NVIDIA）已成为 Linux 厂商固件服务 (LVFS) 的最新首席赞助商。 “至此，赞助 LVFS 的 OEM 已增至 4 家，这意味着我们已成功达到去年为自己设定的筹资目标。” 继戴尔和联想成为顶级赞助商，每年向 LVFS/Fwupd 项目捐赠 10 万美元，以及惠普于 5 月成...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/488134", "publishedAt": "2026-08-05T08:36:52+00:00"}, {"title": "OpenAI 公开邮件和聊天记录回应苹果诉讼，称“Apple is getting this wrong”", "summary": "上个月，苹果一纸诉状把 OpenAI 告上法庭，指控其挖角苹果前员工并窃取商业秘密。苹果的诉状把 OpenAI 描述成一个系统性地从前东家挖人、套取机密信息的对手。 OpenAI 没发律师函，也没选择庭外沉默。它在官网贴了一篇博文，标题只有六个字：Apple is getting this wrong。 然后，它把邮件往来和 iMessage 聊天记录全贴了...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/487756/apple-is-getting-this-wrong", "publishedAt": "2026-08-05T02:24:08+00:00"}, {"title": "👍JeeSite V5.18.1 发布 SpringBoot / Cloud / AI / Vue 多项新增优化，功能持续迭代升级", "summary": "升级内容 Vue 分离端版本 新增 Vue 路由和 IFRAME 组件，路径中包含 has const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
