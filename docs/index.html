const DATA = {"date": "2026-10-06", "generatedAt": "2026-10-06T02:39:29Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "消息称 OpenAI 洽谈 300 亿美元融资，阿联酋基金、贝莱德入局磋商", "summary": "IT之家 10 月 6 日消息，据彭博社报道，知情人士透露，OpenAI 正在与来自阿联酋的多家投资基金（总部位于阿布扎比的 MGX 也在其中）展开磋商，希望由这些基金作为基石投资方，助力这家 ChatGPT 开发商完成一轮规模 300 亿美元（IT之家注：现汇率约合 2,014.34 亿元人民币）的融资。其中一位知情人士称，这些阿联酋基金将会组建投资财团参与本轮融资。另有消息表示，几家阿联酋基金合计的出资规模最高可能达到 100 亿美元（现汇率约合 671.45 亿元人民币）。知情人士还称，贝莱德集团（BlackRock Inc.）也正在洽谈，计划随同该财团一同参与本轮融资。知情人士同时表示，本轮融资仍在推进过程中，各项细节仍有可能发生变动。据彭博社此前报道，OpenAI 计划至少募资 300 亿美元（现汇率约合 2,014.34 亿元人民币），投前估值约 1.4 万亿美元（现汇率约合 9.4 万亿元人民币）。该公司表示现阶段重心放在人工智能安全相关工作上，因此已经将首次公开募股（IPO）计划推迟至至少明年。OpenAI 上一轮融资发生在今年 3 月，融资总额 1,220 亿美元（现汇率约合 8,191.65 亿元人民币），估值为 8,520 亿美元（现汇率约合 5.72 万亿元人民币）。OpenAI、Anthropic PBC 等头部 AI 企业此前就已经向资金雄厚的中东投资者寻求资金，以此满足前沿 AI 软件研发与运维所带来的巨额资本需求。MGX 此前就已经参与过 OpenAI 以及 Anthropic 的融资轮次。彭博社消息显示，这家投资机构今年早些时候完成接近 500 亿美元（现汇率约合 3,357.23 亿元人民币）的募资，用于加快布局 AI 基础设施与相关技术。知情人士透露，OpenAI 也已经和现有投资方加州大学捐赠基金展开沟通，邀约对方参与本轮融资。老股东 Thrive Capital 以及安德森‑霍洛维茨基金（Andreessen Horowitz）同样在商讨追加投资。知情人士表示，和常规的风险融资不同，虽然目前尚未敲定领投方，但 OpenAI 已经直接向投资者给出 1.4 万亿美元（现汇率约合 9.4 万亿元人民币）这一投前固定估值。通常情况下，各家投资机构会提交投资条款，再与企业协商由谁来担任本轮领投方。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/961.htm", "publishedAt": "2026-10-06T02:29:06+00:00"}, {"title": "防止 AI 胡编乱造：微软 Word Copilot 新增引用功能，可溯源查证", "summary": "IT之家 10 月 6 日消息，科技媒体 Windows Central 昨日（10 月 5 日）发布博文，报道称在 Word 文档处理应用中，微软优化 Copilot AI 体验，新增引用功能，帮助用户溯源遏制 AI 幻觉。信息引用方面，Copilot 回复现在会附带来源链接，用户可直接点击跳转至原始网页或内部文档，核实信息上下文与准确性。微软表示，此举提高了透明度，帮助用户理解 Copilot 信息的出处。IT之家附上相关截图如下：AI 工具常因训练数据滞后或语境误读而输出错误结论，甚至编造看似真实的来源，业内也将其称为“幻觉”。引用功能允许用户快速回溯原始材料，确认 Copilot 是否正确提取并理解了信息。微软同时优化了 Copilot Chat 的设计与功能，并为 Copilot App 增加插件、连接器及 Work IQ 增强。除 Word 外，Copilot 在 PowerPoint 中新增技能与连接器。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/958.htm", "publishedAt": "2026-10-06T02:12:00+00:00"}, {"title": "GLM-5.3 上架亚马逊 AWS 旗下大模型平台，智谱打开海外收入分成通道", "summary": "IT之家 10 月 6 日消息，据《科创板日报》报道，亚马逊云科技（AWS）旗下大模型服务平台 Amazon Bedrock 今日接入智谱 GLM-5.3，AWS 基于模型调用量与智谱进行收入分成。报道称，除了 AWS 外，智谱近期与多家海外云厂商落地收入分成模式。此前智谱透露计划通过海外云平台收入分成增加一条具有规模潜力的商业路径。国内方面，智谱也已与阿里云百炼平台等头部云厂商签署类似分成协议，华为云已上架 GLM-5.3，并就类似合作达成意向，形成贯通国内外的分成体系。财报显示，智谱 2026 上半年营业总收入 9.54 亿元，同比增长 399.7%；归母亏损 20.71 亿元，同比亏损收窄 12.1%。今年 9 月，智谱宣布完成约 50 亿美元（IT之家注：现汇率约合 335.72 亿元人民币）融资，包括约 20 亿美元股份配售及约 30 亿美元可转债发行。此次融资主要用于下一代 GLM 基础模型及完全自训练（Fully Self Training）体系的研发，以及大规模训练、生产推理、算力资源及相关技术基础设施的部署及升级。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/946.htm", "publishedAt": "2026-10-06T01:34:19+00:00"}, {"title": "叫板 DeepSeek、Kimi，英伟达投资的 Reflection AI 发布旗下首款开放权重 AI 模型 Beam", "summary": "IT之家 10 月 6 日消息，由英伟达投资的初创企业 Reflection AI 于当地时间周一推出了自家首款开放权重大模型 Beam。这家初创公司希望在代码编写与智能体任务领域，同 DeepSeek、Kimi 等中国 AI 模型展开竞争。Reflection AI 表示，Beam 在性能上可以对标中国 AI 初创企业智谱 AI（Z.ai）的 GLM‑5.2；在代码以及智能体任务方面，该模型的性能正逐步逼近千问 3.8‑Max（Qwen3.8‑Max）。这家初创公司称，Beam 的总参数量达到 5010 亿；参数量也就是决定 AI 系统如何处理信息的变量。不过该模型属于稀疏激活架构，每处理一项任务只会激活 230 亿参数。每次仅启用网络当中的一部分，以此实现更快的推理速度，同时降低运行成本。作为对比，智谱 AI 的 GLM‑5.2 总参数量约为 7440 亿，激活参数量为 400 亿。就在该模型发布之际，美国各家科技企业正力图抵御来自中国开放权重模型带来的竞争压力。这类模型成本更低、可定制性更强，代码生成能力几乎已经能够赶上 OpenAI 与 Anthropic 的头部模型。据IT之家了解，Reflection AI 由前 DeepMind 研究人员米沙 · 拉斯金（Misha Laskin）与约安尼斯 · 安东诺格鲁（Ioannis Antonoglou）在 2024 年创立。该公司主要开发软件开发自动化工具，软件开发自动化也是当下增长十分迅速的一类 AI 落地场景。今年早些时候，Reflection AI 已经和 SpaceX 达成合作协议，可以在埃隆 · 马斯克执掌的 SpaceX 的 Colossus 2 数据中心获取额外的算力资源。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/932.htm", "publishedAt": "2026-10-06T00:42:20+00:00"}, {"title": "麦当劳在美遭集体诉讼，被指用 AI 系统非法操纵菜单价格", "summary": "IT之家 10 月 6 日消息，据路透社报道，麦当劳已在芝加哥联邦法院被提起诉讼，这是一起拟议的全国性集体诉讼。原告指控这家快餐企业借助一套人工智能定价系统，非法协调其特许经营店和直营餐厅的菜单价格。IT之家注意到，这起诉讼于当地时间上周五提交。诉状称，麦当劳与独立特许经营商合谋，利用基于非公开数据训练的算法操纵价格，此举违反了美国反垄断法。路透社上周曾报道，麦当劳的定价引擎运用机器学习算法，持续分析其近 14,000 家门店每天数百万笔交易产生的数据。本次诉讼引用了这篇报道，报道当中还提到其他快餐企业也开始借助人工智能开展定价以及其他运营工作。诉状写道：“独立经营的商家必须自主制定自身的商品价格。”麦当劳在周一发布了一份声明，表示相关指控属于主观揣测，缺乏事实依据。“巨无霸汉堡以及其他任何餐品的价格都并非由人工智能设定。”该公司表示。麦当劳称，各特许加盟商拥有定价决策权；定价推荐工具以及数据分析手段在各行各业都已经得到普遍使用。近些年来，美国已经出现多起集体诉讼。原告纷纷指控各类企业利用算法或者人工智能，就酒店客房、公寓租赁以及其他消费品类开展非法价格协同。原告代理律师拉克 · 特纳（Lark Turner）在一份声明中表示，麦当劳“正在利用手里海量的数据以及特许加盟体系，从消费者身上一分一厘地榨取利益，就连最后一份薯条都不放过。”诉状显示，原告是伊利诺伊州居民，希望代表范围可能多达数百万名麦当劳消费者，发起本次集体诉讼。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/924.htm", "publishedAt": "2026-10-05T23:55:59+00:00"}, {"title": "Termexo v0.10.10 发布：19 个本地 MCP 工具，五种编程 Agent 自动接入", "summary": "AI 生成概念图，非产品界面。 MIT 开源的 Windows AI 编程工作台 Termexo 发布 v0.10.10。新版把终端、任务和部分设置开放为 19 个本地 MCP 工具，并支持在 Termexo 新启动的 Claude Code、Codex、OpenCode、Grok Build 和 Antigravity 终端中自动添加连接。 工作台能力作为工具开放 Agent 可以查询工作区和终端，读取指...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502845", "publishedAt": "2026-10-05T23:39:06+00:00"}, {"title": "谷歌有望升级 Call for Me 功能：Gemini 将支持代用户拨打私人亲友电话", "summary": "IT之家 10 月 6 日消息，有多少通电话，仅仅因为要跟其他人沟通实在太过麻烦，你就一拖再拖？人工智能早已承诺，会帮我们把生活里大量费力不讨好的杂事实现自动化。对于一部分人来说，其中最有吸引力的设想或许就是由 AI 替我们打电话。谷歌刚刚在 Pixel 11 系列手机上推出了“代我通话（Call for Me）”功能，而现在有迹象表明，这项功能可能将迎来一次重大功能拓展。据IT之家了解，目前的代我通话专门设计用于拨打各类商户电话，它可以耐心听着等待接通的背景音乐，协助完成预约之类的事务。听上去很不错，不过这项功能的适用范围还相当有限。既然 Gemini 属于通用大语言模型，何不进一步放开能力，把代我通话拓展，支持拨打亲友的私人电话呢？在查看部分新版更新内容时，Android Authority 找到了早期线索，显示谷歌似乎正打算实现这一点。从介绍界面上“妈妈”和“约翰”这两个示例就能够看出，这一版本的代我通话显然不再仅限于和商户沟通。Gemini 在这类通话当中可以执行的任务看起来仍会受到一定约束，大多只负责转达信息或是开展简单问询。但不难想象，遇到有些人很不爱回复短信的时候，这项功能就会十分好用。当然，并不是所有人都愿意和一台机器通话。Gemini 看上去也会提供相应选项，允许用户拒绝接收这类由 AI 代为打出的电话。除了代我通话的能力升级之外，外媒还发现了应用操作的细化权限设置，也就是上面第三张截图里可以看到的新增写入与删除板块。目前该模块显然仍处在开发阶段，各项选项还无法正常运行。至于升级后的代我通话功能，尚且无法确定谷歌究竟会在何时正式上线该功能（甚至不能确定谷歌是否真的会推出）。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/921.htm", "publishedAt": "2026-10-05T23:37:51+00:00"}, {"title": "tvOS 27.2 代码显示苹果 Apple TV 4K（第四代）将支持 Siri AI 和 Apple Intelligence", "summary": "IT之家 10 月 6 日消息，科技媒体 MacRumors 昨日（10 月 5 日）发布博文，通过挖掘 tvOS 27.2 Beta 3 更新代码，发现新的线索，表明苹果 Apple TV 4K（第四代）将支持 Siri AI 与 Apple Intelligence。代码显示，系统设置应用中新增“改进 Siri 与 Apple Intelligence”开关，允许用户授权苹果收集其与 Siri、听写及翻译功能的文本和音频交互数据，用于改进基础模型。该隐私披露文本与其他支持 Apple Intelligence 的苹果设备一致。不支持该功能的设备仅显示“改进 Siri 与听写”选项。IT之家援引博文介绍，tvOS 27.2 同时引入全新 Siri Messages UI 框架，暗示未来 Apple TV 可显示信息内容。Siri 或能读取发送至关联 iPhone 的消息，并在电视屏幕上提供智能回复选项。当前 Apple TV 上的 Siri 不支持收发或读取信息，该框架很可能专用于 Siri AI 功能。硬件方面，苹果正研发配备 8GB 或 12GB 内存、搭载 A19 或 A19 Pro 芯片的 Apple TV 版本。此类配置足以支持设备端 Siri AI 功能运行。多方消息指出，新款 Apple TV 最早可能于 10 月 13 日发布。此次系统测试版的更新节奏与硬件泄露信息相互印证，显示苹果正加速推进 Apple Intelligence 向客厅场景扩展。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/920.htm", "publishedAt": "2026-10-05T23:33:29+00:00"}, {"title": "OpenAI 将在欧盟为 ChatGPT 和 Codex 文本输出添加隐形水印", "summary": "IT之家 10 月 5 日消息，OpenAI 今日宣布，为配合《欧盟人工智能法案》的内容透明要求，未来几周将在欧盟地区符合条件的 ChatGPT 和 Codex 文本输出中加入机器可识别的隐形水印。据介绍，文本水印技术名为 textGrain（文本粒水印），会在模型选词过程中嵌入不可见的统计信号。检测器通过识别该信号，判断一段文本是否带有 OpenAI 水印。IT之家注意到，OpenAI 下一步将在欧盟推广文本水印。未来几周，团队将仅在欧盟所有计划中向符合条件的 ChatGPT 和 Codex 用户引入文本水印功能。值得一提的是，OpenAI 不会在发布时将文本水印设为全球默认。OpenAI 将为 API 客户启用选择加入的水印功能。从今天起，全球的 API 客户将能够选择为部分模型添加水印文本输出。这让客户能够决定水印如何符合其透明度义务以及为用户提供的体验。团队还在与云合作伙伴合作，在未来几周内为通过其服务访问的 OpenAI 模型输出提供水印功能。OpenAI 还将为研究人员和专家组织提供探测器访问，获批的研究人员和专家组织可以申请从今天开始。根据行为准则访问最初将根据具体情况逐案授予，以支持文本来源的评估和改进。该工具会报告是否检测到 OpenAI 水印，但不会透露用户身份或提示内容或对话内容。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/903.htm", "publishedAt": "2026-10-05T15:58:02+00:00"}, {"title": "OpenAI 将在 ChatGPT 中推出全新图片广告形式，不会影响生成结果", "summary": "IT之家 10 月 5 日消息，OpenAI 今日宣布，将在 ChatGPT 中推出全新的图片广告形式，扩充广告效果衡量工具与合作生态，并研发新方案用于评估品牌适配性。IT之家从官方介绍获悉，ChatGPT 每周覆盖 12 亿用户，是全球规模最大的原生 AI 消费平台。这款全新图片广告形式，能够帮助用户想象产品与服务如何融入日常生活。广告图片可以展示产品灵感、使用场景或是产品带来的体验，让用户认识新品牌、了解产品的独特优势，辅助消费决策。对广告主而言，这也创造了借助图片讲述品牌故事的新机会。项目初期，团队会在 ChatGPT 的图像生成功能中测试该广告样式。广告会做清晰标注，和用户正在生成的图片相互独立。和我们其他广告形式一样，广告内容不会影响 ChatGPT 给出的回答。本次测试将于本月晚些时候在美国启动，首批会邀请部分广告主参与。OpenAI 提到，全新图片广告形式，助力用户发掘产品服务、想象产品如何融入生活，也让广告主拥有更直观的视觉化品牌叙事方式。整体来看，ChatGPT 广告新增的效果衡量能力、品牌适配评估能力，帮助企业评估广告活动效果，对广告投放场景建立信心。以上所有功能都遵循广告原则：ChatGPT 的回答保持独立客观，用户对话隐私受保护，用户掌握自身使用体验的控制权。OpenAI 表示会持续迭代广告平台，推出新广告样式与能力，帮助企业以贴合用户需求的有效方式触达客户，为各类规模的企业创造增长机遇。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/901.htm", "publishedAt": "2026-10-05T15:01:59+00:00"}, {"title": "SmartCall v1.0.7 发布，新增模型以及音色管理", "summary": ":book: 项目简介 SmartCall 是一套基于 AI 大模型 + Asterisk 通信引擎构建的新一代智能客服呼叫中心系统。系统深度融合了 AI 语音机器人、智能 IVR 流程编排、端到端双工对话模型、实时语音识别（ASR）、语音合成（TTS）、大模型意图识别 等核心能力，为企业提供从呼入智能应答到智能外呼的全链路 AI 客服解决方案。 无...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502844", "publishedAt": "2026-10-04T19:06:04+00:00"}, {"title": "GPT-6要“吃掉”3D公司？这家公司不到2年ARR翻百倍，破1亿美元", "summary": "专业3D模型反而更稀缺了", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/10/501451.html", "publishedAt": "2026-10-04T00:53:29+00:00"}, {"title": "🔥 AI 员工支持知识库文档引用：开源 AI 无代码平台 NocoBase", "summary": "汇总一周产品更新日志，最新发布可前往我们的博客查看。 NocoBase 目前更新包括三个分支： main、next 和 develop。** main： 截至目前最稳定的版本，推荐安装此版本。 next： 包含即将发布的新功能，经过初步测试的版本，可能存在部分已知或未知问题。主要面向测试用户，用于收集反馈和进一步优化功能。适合愿意提前体验...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502842", "publishedAt": "2026-10-03T09:07:27+00:00"}, {"title": "AI 视频榜全球第二，藏着一家新影视公司的野心", "summary": "一家影视公司，杀进了视频模型的决赛圈#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1682888?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-10-03T07:00:20+00:00"}, {"title": "openJiuwen X-Router自演进模型路由技术首发，昇腾亲和，Agent越跑越省，实测减少50+%Token消耗", "summary": "让每一次请求选对模型，让每一次反馈都成为下一次更优、更省的选择", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/10/500098.html", "publishedAt": "2026-10-02T07:34:15+00:00"}, {"title": "团队使用 Codex 和 Claude Code，API Key 和模型权限怎么管？我开源了 Zentrola", "summary": "一个人使用 AI Coding 工具时，事情很简单：申请一个 API Key，填进 Codex 或 Claude Code，然后开始工作。 但当使用者从一个人变成一个团队，原本简单的配置问题很快就会变成管理问题：真实 API Key 要不要发给每个人？新成员应该能用哪些模型？成员离职后如何撤销权限？上游服务商发生故障时，是否要通知所有人临时修改...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502836", "publishedAt": "2026-10-01T14:28:31+00:00"}, {"title": "刚刚，Gemini 4 Argon 发布：多项基测碾压 GPT .", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502769", "publishedAt": "2026-09-28T07:25:33+00:00"}, {"title": "DataTalk Studio 开源：用对话完成报表开发的 AI-native BI 工作区", "summary": "DataTalk Studio 是一个面向数据分析师、业务人员和开发团队的 AI-native BI 工作区，目标是用自然语言完成报表创建、修改、校验、发布和复用。 传统 BI 流程通常需要在数据源管理、指标定义、SQL 编写、图表配置和报表发布等多个工具之间反复切换。DataTalk Studio 尝试把这些环节组织到同一个工作区中：用户可以通过对...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502768", "publishedAt": "2026-09-28T07:04:27+00:00"}, {"title": "开源 AI 终端 uniTerm v1.9.5 发布: 工作区管理全面升级、终端图片显示、SFTP 提速等 50 余项更新", "summary": "uniTerm 是一款轻量级一站式开源终端软件。整合终端、文件传输、远程桌面、数据库客户端、容器等 5 大类协议于一身，覆盖 30+ 协议，安装包仅 15MB；内置可自主执行的 AI Agent，能规划并执行多轮 Shell 命令。 v1.9.5 是一次面向「工作区」与「终端体验」的全面升级：工作区支持点选创建与拖拽分屏，可保存为连接随时重...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502766", "publishedAt": "2026-09-28T04:54:43+00:00"}]}, {"label": "产品发布/更新", "items": [{"title": "英伟达黄仁勋“世界巡演”AI 视频海内外爆火，马斯克调侃“内存涨价的原因找到了”", "summary": "IT之家 10 月 6 日消息，近期有关迈克尔 · 杰克逊演唱会的二创视频在国内视频平台爆火，网友们将舞台上的迈克尔 · 杰克逊和台下的观众替换为各种知名人物。B站 UP 主“王与也行”10 月 4 日发布的一段“黄仁勋 世界巡演”AI 视频已收获超百万播放量，甚至火到了海外，引来埃隆 · 马斯克的调侃：这就是内存价格如此昂贵的原因。IT之家查询发现，原版视频来自迈克尔 · 杰克逊 1992 年危险之旅世界巡演之罗马尼亚 · 布加勒斯特演唱会的《Jam》曲目片段。今年 3 月有报道称，黄仁勋在摩根士丹利科技大会上表示，当前内存供应稀缺，对英伟达来说是“极好的消息”（fantastic for us）。黄仁勋认为，资源限制实际上会迫使客户直接选择性能最强的方案。而由于英伟达拥有充沛的资金与规模优势，能够在全产业链锁定大量供应，因此英伟达能从中获益。他指出，英伟达目前已经锁定了大规模部署“AI 工厂”所需的内存、晶圆、CoWoS 封装、系统及线缆等关键组件。黄仁勋甚至在会上向供应商霸气喊话：“尽管去建 DRAM 内存厂吧，因为你们产多少我就会用掉多少。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/953.htm", "publishedAt": "2026-10-06T01:51:55+00:00"}, {"title": "LG 电子将为北美超 5GW 人工智能数据中心供应冷水机组", "summary": "IT之家 10 月 6 日消息，LG 电子当地时间昨日宣布，其北美分支与暖通空调服务企业 AIR Control Concepts 达成一项涉及超 5GW 规模的人工智能数据中心 (AIDC) 先进冷水机组长期供应协议。AIR 负责北美主要数据中心枢纽的超大型基础设施项目，其主要客户是全球领先的数据中心运营商。这份长期合同将加速 LG 进军全球 AIDC 冷却市场的步伐，满足算力基础设施对高效散热解决方案日益增长的需求。LG 的 AIDC 冷水机组结合了离心风冷结构和制冷剂自然冷却技术，利用室外冷空气降低压缩机冷却负荷。根据 LG 内部模拟，制冷剂自然冷却技术每年可比水冷技术节能约 30%。相关阅读：《LG 电子将在美国新建 AI 数据中心冷水机组工厂，韩国本土同步扩产》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/949.htm", "publishedAt": "2026-10-06T01:50:26+00:00"}, {"title": "维基媒体：OpenAI 失控 AI 智能体或引发其 5 月数据服务故障", "summary": "IT之家 10 月 6 日消息，运营网络百科全书维基百科的维基媒体基金会表示，今年 5 月其数据服务出现故障，或许和来自 OpenAI 失控智能体产生的巨量访问流量有关。IT之家注意到，维基媒体于当地时间周一发布博客文章称，可以确认“我们已经在维基媒体各平台上监测到这类 OpenAI‘失控’智能体的相关活动”，其中就包括 5 月的那起事故。该事故造成维基数据查询服务出现“部分中断”。维基媒体称，这次故障的诱因看起来是这些智能体访问了数以百万计的页面，同时发起数十万次的数据查询请求。维基媒体还指出，OpenAI 的智能体未经许可就对维基系列网站执行编辑操作。其中针对一项引文工具还出现了“存在潜在恶意的编辑行为”，基金会认为该行为的目的很可能是劫持这套工具。维基媒体的在线协作文档工具 Etherpad 同样也遭到了来自 OpenAI 智能体的恶意操作。OpenAI 在一份声明当中表示，感谢维基媒体给出的“详细调查结论”，目前正与该机构合作分析这一系列活动。OpenAI 发言人德鲁 · 普萨泰里（Drew Pusateri）表示：“后续分析工作推进过程中，我们会持续对外披露相关信息。”路透社此前曾报道，OpenAI 目前正加紧梳理，试图完整查清这批失控智能体所引发全部问题的范围。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/947.htm", "publishedAt": "2026-10-06T01:38:25+00:00"}, {"title": "挪威政府拟在部分敏感区域实施人工智能眼镜临时禁令", "summary": "IT之家 10 月 6 日消息，挪威政府当地时间本月 5 日表示，计划尽快向议会提交临时禁止在部分敏感区域使用人工智能眼镜的草案，并为后续永久性立法设立专家咨询机构。这里的“敏感区域”可能包括公园、海滩、博物馆、购物中心、学校、幼儿园、游乐场、课外活动中心、医疗机构、设有更衣淋浴设施的健身场所。挪威政府还将评估该禁令的适用设备范围，以及是否应涵盖高等院校及其它教育机构。图源：Pexels该国数字化和公共管理部长 Torgeir Micaelsen 表示：我担心引入新型强力技术后，人们可能会在不知情的情况下被拍照、录像或录音。因此，我们将提议在特定场所暂时禁止使用 AI 眼镜。这将为我们争取时间，以便开展深入调查并进行充分的讨论，从而为制定长效监管措施奠定坚实基础。……我们不希望生活在一个人们在习惯于不受监控的场所和情境中，却因担心被秘密录音、拍照或录像而感到不安的社会。这样的社会会让人感到不安全，并导致我们变得疏离。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/945.htm", "publishedAt": "2026-10-06T01:24:58+00:00"}, {"title": "我国应用下一代通信关键技术空心光纤，AI 算力时代给光信号造出“磁悬浮”高速轨道", "summary": "IT之家 10 月 6 日消息，@央视新闻 昨日（10 月 5 日）发布微博，我国下一代通信关键技术“空心光纤”已率先在宁夏中卫的智算中心间投入商用，传输时延与损耗直降 30% 以上，在 AI 算力时代给光信号造出一条“磁悬浮”高速轨道。该光纤直径不足 0.4 毫米，内部嵌入 20 根微型玻璃圆柱，可为光信号提供低损耗、高速传输通道，有望实现超低时延、超大带宽，提升跨区域算力网络传输效率，为下一代通信技术应用提供支撑。通信工程师本月在宁夏中卫相距 30 公里的数据中心之间，首次大规模部署空心光纤，解决了因距离京津冀等算力需求地上千公里而产生的超高时延难题。IT之家援引博文介绍，空心光纤将传统光纤的玻璃纤芯掏空，管壁内嵌多层微结构，让光信号在接近真空的空气通道中传输，速度飙升至光速的 99.7%，远超传统光纤约 69.5% 的物理极限。相较传统实心光纤，空心光纤实现了超低时延、超低损耗和超大带宽的统一，这也为远距离无损传输扫清了最大障碍。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/941.htm", "publishedAt": "2026-10-06T01:16:52+00:00"}, {"title": "高盛上调台积电目标价至 3300 新台币，预示约 28% 上涨空间", "summary": "IT之家 10 月 6 日消息，台积电 10 月 5 日在中国台湾股市创出历史新高，早盘最高冲上 2,580 新台币（IT之家注：现汇率约合 543.1 元人民币），13:30 收盘价定在 2,575 新台币（现汇率约合 542 元人民币），涨幅 3%，市值升至约 66.78 万亿新台币（现汇率约合 14.06 万亿元人民币）。高盛将台积电 12 个月目标价从 3,100 元新台币（现汇率约合 652.5 元人民币）上调至 3,300 元新台币（现汇率约合 694.6 元人民币），预示约 28% 的上涨空间。高盛预计随着人工智能对 GPU、网络芯片和服务器 CPU 的需求不断增长，台积电明年的增长势头将保持强劲。高盛分析师在报告中写道，“尤其值得注意的是，AI 智能体带动 CPU 需求增强，这是过去一年出现的一项关键变化”。高盛预计，台积电 2026 年和 2027 年以美元计的营收将分别同比增长 42% 和 36.9%，毛利率分别为 67.2% 和 67.5%。高盛还把 2027 年和 2028 年资本支出预测分别从 780 亿美元（现汇率约合 5,237.28 亿元人民币）和 820 亿美元（现汇率约合 5,505.86 亿元人民币）上调至 850 亿美元（现汇率约合 5,707.3 亿元人民币）和 980 亿美元（现汇率约合 6,580.18 亿元人民币），预计台积电将进一步扩大产能投资，以支持客户更长期的需求。高盛维持台积电“买入”评级。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/937.htm", "publishedAt": "2026-10-06T00:57:51+00:00"}, {"title": "SpaceX 股价大涨 7.6%，马斯克身家重回 1 万亿美元", "summary": "IT之家 10 月 6 日消息，美东时间周一，SpaceX 股价大涨 7.6%，升至 6 月中旬以来最高水平，推动马斯克的身家重新超过 1 万亿美元（IT之家注：现汇率约合 6.71 万亿元人民币），较上周五增加了 306 亿美元（现汇率约合 2,053.37 亿元人民币）。这巩固了马斯克作为全球首富的地位，亚马逊创始人杰夫 · 贝索斯以 3,715 亿美元（现汇率约合 2.49 万亿元人民币）净资产位居遥远的第二。马斯克此前在 SpaceX 首次在纳斯达克上市交易后的 6 月成为全球首位万亿富豪，不过数日后随着 SpaceX 和特斯拉的股价下跌，他便失去了这一身份。随着 SpaceX 和特斯拉股价上涨，他的净资产近日已逼近万亿富豪门槛；上周特斯拉第三季度交付量超出分析师预期，仅周五一天就为马斯克的净资产增加了 610 亿美元（现汇率约合 4,093.32 亿元人民币）。美东时间周一上午，特斯拉的股价继续上涨，涨幅超过 1%；而 SpaceX 的股价周一上午涨幅更为显著，上涨超过 5%，这让马斯克重新夺回了万亿富翁的头衔。上周，马斯克（Musk）与特朗普以及其他人工智能行业领袖一同现身白宫，当时美国总统推出了一份全新的人工智能“协议”。这份文件提出若干指导原则，旨在推动人工智能以负责任的方式开展研发。不过特朗普称该协议仅具备“道德约束力”；全文大约仅有 300 个单词，并没有为行业设立实质性的约束机制或是详尽监管规则。特朗普上周还签署了一项行政命令，要求美国政府今后将人工智能改称“超级智能”。马斯克对此表示支持，他周日在 X 平台发帖写道：“不要再叫 AI 了”，并且提出“SI（超级智能）”这个叫法“更好”。这位身家万亿的富豪在 X 上发文称，SpaceX 旗下运营聊天机器人 Grok 的子公司 SpaceXAI 将会更名为“SpaceXSI”。不过截至周一上午，该公司似乎尚未采取任何正式行动完成品牌更名。”就在马斯克个人净资产出现上涨的几天之前，他的前女友希冯 · 齐利斯（Shivon Zilis）于周五在社交平台透露自己已经结束了二人的关系。她发文写道：“毫无预兆，一周之内就要从深陷爱恋走向放手，这件事很难接受，但世事有时就是如此。”齐利斯与马斯克共同育有四名子女。齐利斯本人任职于马斯克旗下的 Neuralink，今年 5 月她曾在法庭出庭作证：在发展成为恋人之前，二人仅仅是朋友与同事；最初马斯克向齐利斯捐献精子，借助试管婴儿技术，她生下了两人的头两个孩子。", "sourceName": "IT之家", "sourceUrl": "https://ww 时候，你就得狠狠回击霸凌者。”奥尔特曼在接受《名利场》的深度专访时说道，“而且我还觉得，埃隆和很多喜欢欺压别人的人一样，只会尊重敢于还手的对手。”据IT之家了解，奥尔特曼与马斯克曾经闹过一场众所周知的决裂，这件事已经被反复提起，同时也是多起法律纠纷的核心。二人之间的纠葛远非人工智能行业里唯一尚未平息的矛盾；如今，这层关系也成为全球头部人工智能企业试图就技术管控方向达成共识的时代背景。当下行业再次掀起对于人工智能安全问题的担忧，这位 OpenAI 首席执行官称自己仍然愿意和马斯克合作，而马斯克如今已经开始把昔日盟友称作“骗子奥尔特曼（Scam Altman）”。“如果希望我能够和他共事，或许大家应该乐见我偶尔予以回击。当然，我是愿意和埃隆开展合作的。”他说道。而就自身而言，奥尔特曼坦言“我并不认为自己是一个完人”。但与此同时，他并不觉得自己才是最大的问题所在。“在埃隆和我两个人当中，我并不确定大家矛头应该指向的那个人就是我。”他表示。今年 7 月，有一个账号发文称自己早已“向全世界发出警示，提防骗子奥尔特曼”，马斯克随即借机猛烈抨击奥尔特曼。马斯克转发了这条帖子并且补充写道：“他把行骗提升到了一个全新的层次。”作为回应，奥尔特曼则拿马斯克大力倡导的轨道数据中心一事反唇相讥；这位 OpenAI 首席执行官已经多次对该设想表达过怀疑态度。“老兄，可是你一直在向公开市场的投资者兜售短期太空数据中心的概念。”奥尔特曼发帖写道。尽管双方冲突不断，各家人工智能企业还是在合作方面迈出了更多步伐。OpenAI、Anthropic、SpaceXAI、谷歌以及英伟达的负责人签署了一份由白宫牵头的协议，各家企业同意自行落实若干安全管控举措。奥尔特曼在接受《政客》旗下 Decoded 播客节目采访时表示，各家前沿实验室并没有统一的群组聊天渠道，但相关负责人之间仍有多条沟通渠道保持对话。“并不存在一个所有人都加入的大型 WhatsApp 群组。”奥尔特曼说，“不过方式有很多，大家会在同一场会议上碰面，也会通电话，偶尔还会开会，类似这样的沟通形式。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/936.htm", "publishedAt": "2026-10-06T00:54:25+00:00"}, {"title": "丰田联合五十铃推出新款 Sora 氢燃料电池巴士，续航突破 300 公里", "summary": "IT之家 10 月 6 日消息，丰田汽车于当地时间周一宣布，将推出新款 Sora 氢燃料电池巴士，续航里程超过 300 公里，相比老款车型提升约 100 公里。据IT之家了解，丰田从 2018 年开始投放 Sora 巴士。新款车型由丰田与五十铃汽车联合开发，采用五十铃研发的巴士底盘平台，搭载丰田的燃料电池系统。新款巴士同时使用燃料电池系统以及大容量电池，在实现更长续航的同时改善了车辆的使用性能。车内增设便于固定轮椅的装置，并且配备了最新的安全设备。燃料电池系统与氢气储罐布置在车顶，方便开展车辆维护作业。五十铃同样在周一对外表示，将开始销售旗下首款燃料电池巴士 Erga FCV。这款巴士将由五十铃与日野汽车的合资企业 J‑Bus 的宇都宫工厂负责生产，其基础构造和丰田新款 Sora 几乎完全相同。该巴士续航里程同样超过 300 公里。安全配置包含前方行人与骑行者探测提醒系统，一旦驾驶员突发身体不适或者出现其他异常状况，车载设备还可以使车辆减速直至停下。这款车型的售价暂未对外公布。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/919.htm", "publishedAt": "2026-10-05T23:24:38+00:00"}, {"title": "刚刚，Hinton发了首篇RSI论文", "summary": "AI已经开始真正进入「造下一代AI」的流水线", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/10/501705.html", "publishedAt": "2026-10-05T04:42:52+00:00"}, {"title": "Claude Sonnet 5.5 发布：速度快 3 成、Agent 编程评测从 10% 跳到 70%", "summary": "Claude 5.5 家族的第二个成员今天发布：Sonnet 5.5。Anthropic 把它定位成 Opus 5.5 的「快而省」互补款——专攻范围明确的高频日常任务、修 bug、做文档和表格，还强调 ”的页数限制。[…]值得一提的是，被告方当初提交刘畅的这份书面证言时曾提出，只有在法庭决定采信苹果那部分遭到被告质疑的证据的前提下，才希望法庭审阅这份证言。即便如此，苹果主张：既然被告方现在已经自行提交了新的辩论意见与证据，法庭应当审阅全部卷宗材料，而不应当剔除苹果答辩意见书中的任何证据：被告方新增的辩论意见与证据，性质更接近于一份“再答辩意见书”，而不属于证据异议。但被告方事先并未向法院申请许可提交再答辩意见书。尽管如此，鉴于被告方已经在本次提交的文件当中针对苹果答辩意见书中所有所谓“新证据”作出完整回应，法院应当驳回被告方提出的剔除苹果答辩证据的申请，依据完整卷宗对临时禁令申请作出裁决，卷宗应当一并纳入苹果答辩意见书当中的论点、证据，以及被告方本次违规提交的新增论点与证据。法庭定于 10 月 14 日就苹果提出的临时禁令申请举行口头辩论。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/009/955.htm", "publishedAt": "2026-10-06T01:59:54+00:00"}, {"title": "KnowForge 2026.0.6 发布：会员、支付、付费内容与 AI 知识服务全面上线", "summary": "这可能是 KnowForge 到目前为止，功能跨度最大的一次更新。 如果说前面的版本主要在解决： 如何更好地创作、组织、阅读和管理知识 那么这一次，我们开始进一步回答几个更大的问题： 知识服务如何商业化？ AI 如何真正进入知识创作与阅读流程？ 作者如何通过内容获得收益？ 不同用户如何拥有不同的资源、功能与 AI 使用额...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502760", "publishedAt": "2026-09-28T02:55:16+00:00"}]}]};

const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
