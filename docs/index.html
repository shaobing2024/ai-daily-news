const DATA = {"date": "2026-08-13", "generatedAt": "2026-08-12T23:36:58Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "消息称苹果拟向出版商支付最高数亿美元，获取新闻内容以改进 AI 版 Siri", "summary": "IT之家 8 月 13 日消息，据《华尔街日报》报道，苹果正在与多家出版商洽谈新的合作协议，希望使用它们的内容来提供最新的新闻和信息，这是苹果改进 AI 驱动的 Siri 语音助手计划的一部分。据知情人士透露，苹果近几个月已经主动联系了一些出版商。相关人士表示，苹果提出的新协议期限可能为多年，允许公司获取出版商的内容，用于支持 Siri 的 AI 功能。该功能预计将于今年晚些时候正式推出。部分知情人士称，苹果提出了一种灵活的付费方案，即当合作出版商的内容被 Siri 使用时，苹果再向其支付费用。据悉，苹果还讨论过一笔规模可能达到数亿美元的预算，用于向合作出版商支付相关费用。目前，大型 AI 公司与单个新闻机构之间通常采用标准授权模式，包括支付固定授权费用，并且通常与广泛获取内容的权利挂钩，而不是按照实际使用量逐笔付费。苹果近期与出版商的接触正值公司着力增强 Siri 之际。多年来，Siri 一直因实用性不足而受到批评。苹果最近宣布将对 Siri 进行重大升级，让 AI 更加深入地融入苹果用户的日常使用体验。据知情人士透露，苹果此前与部分出版商达成的协议中，也曾向出版商支付费用，以获得相关内容以及 AI 训练方面的使用权。此外，从 2019 年开始，苹果还与出版商合作推出付费服务 Apple News+，不过此后已有部分出版商退出。相关协议已经为一些新闻和杂志出版商带来了可观收入。《华尔街日报》是最早参与 Apple News+ 的出版商之一。《华尔街日报》的母公司新闻集团与苹果签有商业协议，为苹果旗下服务提供新闻内容。IT之家注意到，2024 年末，苹果曾进行一项试验，开始向用户提供 AI 生成的新闻摘要。但该功能生成了一些错误的新闻标题，引发出版商担忧。苹果随后很快关闭了这项功能。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/989/014.htm", "publishedAt": "2026-08-12T23:33:05+00:00"}, {"title": "腾讯微信公布 WeLM 模型：80B 版已在 AI 助手小微上应用，617B 版正在开发", "summary": "IT之家 8 月 13 日消息，腾讯微信团队在 X 平台公布了由微信团队打造的大语言模型 WeLM，该模型以资源利用效率为核心。根据官方公布的海报，WeLM 系列大语言模型目前已经明确的两个规格是：WeLM-80B：800 亿总参数，30 亿激活参数WeLM-617B：6170 亿总参数，230 亿激活参数其中，WeLM-80B 模型已部署于微信原生 AI 助手“小微”，支持以下功能：聊天与搜索使用微信原生功能调用小程序服务IT之家获悉，WeLM-671B 模型正在开发中，为混合专家模型（MoE）；在保持适度激活参数的前提下，显著提升通用理解与逻辑推理能力，面向微信生态内的复杂任务：智能小程序开发小微工具生成相关阅读：《微信 AI 助手“小微”再扩容，灰度测试朋友圈“帮写”及“点评”功能》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/989/007.htm", "publishedAt": "2026-08-12T23:03:31+00:00"}, {"title": "别再所有人平分AI算力：顶级模型给资深工程师才省钱，新人刷题式成长已失效", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/YBCpst8secs3xWqZwWLe?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-12T17:19:22+00:00"}, {"title": "阿里开放 Qwen3.8-2.4T-A95B 模型权重：2.4T MoE、激活 95B、原生 256K 上下文", "summary": "IT之家 8 月 13 日消息，阿里云“魔搭 ModelScope 社区”公众号昨天（12 日）深夜宣布，阿里 Qwen 团队正式开放 Qwen3.8-2.4T-A95B 模型权重。此次是 Qwen-Max 级别的模型首次开源权重：模型总参数为 2.4T，每个 Token 激活 95B 参数，原生支持 262,144 Token 上下文，并可扩展至 1,010,000 Token。Qwen3.8 延续 Qwen3.5 的混合架构，重点提升编程、办公、科研和长周期 Agent 任务的端到端完成能力。官方云端版 Qwen3.8-Max 基于该开放权重模型，并加入更多生产环境能力。官方公布的评测覆盖编程 Agent、通用 Agent、专业工作和长上下文等方向；与 Opus 4.8、Fable 5、GPT 5.6 Sol 等模型相比，各项结果互有高低，并在 PaperBench、IFBench 等 Benchmark 中取得所列模型中的较高成绩。IT之家附上有关链接如下：模型：https://modelscope.cn/models/Qwen/Qwen3.8-2.4T-A95Bblog：https://qwen.ai/blog?id=qwen3.8Qwen Studio：https://chat.qwen.aiQwen3.8-2.4T-A95B 是一个因果语言模型，总参数为 2.4T，每个 Token 激活 95B。模型每个 MoE 层包含 512 个专家，每个 Token 选择 10 个路由专家，并同时激活 1 个共享专家。模型还进行了多步 MTP（Multi-Token Prediction）训练，为支持相应机制的推理引擎提供预测多个后续 Token 的能力。根据介绍，Qwen3.8-Max 的办公与 Agent 后训练概括为三个环节：持续扩展真实环境，并在这些独立维度上解耦合：任务（Task）（单任务 → 多任务 → 跨天任务）、工作空间（Workspace）（多文件 → 层级目录 → 复杂异构目录）、Harness （不同的类别、版本、技能）。这使得环境数能够以组合方式自然增长，而非依赖逐一定制化集成。构建一个统一的奖励系统，将真实任务中异构的验证方式内化其中。该系统涵盖基于执行的校验、对文本及渲染后的视觉输出的 rubric 评估、以及 agentic 检查。我们将多种形式与模态统一在一个奖励系统内，为所有环境提供了一致而可靠的奖励信号，消除维护任务专用的 verifier 所固有的不一致性。构建一个在线数据均衡器，对每个 batch 进行重构，使其在任务、难度、工作区与 harness 上的分布高度均衡，降低 batch 间梯度方差，从而支撑强化学习的训练算力稳定、持续地扩展。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/989/001.htm", "publishedAt": "2026-08-12T16:10:01+00:00"}, {"title": "深夜放大招！DeepSeek V4 Pro 正式版 API 更新上线，多项测试性能接近 Fable 5", "summary": "IT之家 8 月 13 日消息，据IT之家小伙伴反馈，DeepSeek V4 Pro 正式版今日晚间正式发布，已更新至 API，调用模型名不变。新版本增强了 Agent 能力，支持 Responses API 和 Codex 接入。从官方群放出的评测对比表可以看到，DeepSeek V4 Pro 正式版（DeepSeek-V4-Pro-0813）在多项测试中接近 Fable 5 水平，相比之前的预览版能力大幅提升。IT之家附定价如下：百万 tokens 输入（缓存命中）：0.025 元百万 tokens 输入（缓存未命中）：3 元百万 tokens 输出：6 元", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/989/000.htm", "publishedAt": "2026-08-12T16:05:28+00:00"}, {"title": "剑指 GPT-5.6 Sol，SpaceXAI 发布 Grok 4.6 模型", "summary": "IT之家 8 月 12 日消息，北京时间今天（12 日）晚间，Grok 4.6 正式发布。新模型在 Grok 4.5 基础上进一步强化长时间运行的智能体任务，以及复杂的交互和视觉工作。按照发布信息，Grok 4.6 能够持续处理包含大量步骤的复杂任务，包括资料研究、信息分析、大型代码库处理，以及将产品构想转化为完整应用或工作成果。基准测试方面，Grok 4.6 在多项智能体编程和知识工作测试中达到前沿水平。在综合 9 项基准测试的 Artificial Analysis Intelligence Index 上，Grok 4.6 与 GPT-5.6 Sol 取得相同成绩。据IT之家了解，Grok 4.6 已在 Cursor 和 Grok Build 上线。首周，两项服务将向用户提供两倍的内含使用额度。训练方面，Grok 4.6 经历了比 Grok 4.5 更长的补充训练。训练数据包括经过筛选的模型生成推理数据和高级技术概念数据，以及高质量工程数据，并配合改进后的优化器和训练方案，为后续监督微调（SFT）和强化学习（RL）提供基础。训练团队随后利用 Grok 4.5 重新生成 SFT 轨迹，覆盖不同推理强度、智能体运行框架，以及 STEM、软件工程和知识工作等领域，并使用基于模型的检查剔除存在问题的轨迹。Grok 4.6 还接受了广泛的智能体强化学习训练，任务覆盖知识工作、通用编程、内核优化、Web 开发和计算机辅助设计等领域。在实际项目测试中，Grok 4.6 重点接受了长流程、多步骤任务的考验。测试结果显示，新模型擅长把宽泛的产品构想转化为可以运行的初版，包括研究陌生领域、规划应用结构、实现核心交互，以及根据多轮反馈持续完善结果。在更长的任务流程中，Grok 4.6 还表现出更多自主测试和验证行为，会在继续执行任务前检查已经完成的工作。视觉和交互式项目的初版成果也较 Grok 4.5 有所提升，面对明确的产品构想时，可以一次建立应用的基本结构和视觉语言。安全方面，Grok 4.6 根据扩展后的模型能力调整了安全防护机制。此次安全评估覆盖部署前能力测试、安全防护校准，以及部署后和第三方测试，规模为历来最大。安全体系面向漏洞修补、工程设计和 AI 研究等合法使用场景，在提高实用性的同时控制安全风险。除 Cursor 和 Grok Build 外，Grok 4.6 也已通过 API 开放，并登陆 OpenRouter、Vercel 和 Cloudflare 等合作平台。价格为每 100 万个输入 Token 2 美元（IT之家注：现汇率约合 13.5 元人民币）、每 100 万个输出 Token 6 美元（现汇率约合 40.6 元人民币），速度更快的版本价格为普通版本的两倍。首周，Cursor 和 Grok Build 用户可获得两倍的内含使用额度。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/988/999.htm", "publishedAt": "2026-08-12T15:57:46+00:00"}, {"title": "深夜放大招？DeepSeek 官网 API 文档新增“DeepSeek-V4-Pro-0813”模型", "summary": "IT之家 8 月 12 日消息，今天（12 日）晚间，DeepSeek 官网“API 文档”上的“模型 &amp; 价格”页面中，模型版本新增了 DeepSeek-V4-Pro-0813，其支持非思考与思考模式。不过截至IT之家发稿，官方尚未发布 DeepSeek-V4-Pro-0813 的更新日志。值得一提的是，就在不久前的 7 月 31 日，DeepSeek-V4-Flash 正式版 API 上线公测。据IT之家了解，官方当时曾称，DeepSeek-V4-Pro 正式版将会尽快发布。相关阅读：《DeepSeek-V4-Flash 正式版 API 上线公测，V4-Pro 正式版将“尽快”发布》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/988/998.htm", "publishedAt": "2026-08-12T15:41:33+00:00"}, {"title": "谷歌 Pixel 11 系列正式发布：全系 256GB 起步 899 美元起，8 月 20 日开售", "summary": "IT之家 8 月 12 日消息，谷歌正式发布了 Pixel 11 系列手机等一系列产品，包括 Pixel 11、Pixel 11 Pro、Pixel 11 Pro XL 以及 Pixel 11 Pro Fold。该系列即日起开启预购，将于 8 月 20 日正式开售。谷歌 Pixel 11 系列搭载自研 Tensor G6 芯片。相较上一代 Tensor G5，Tensor G6 网页浏览速度提升 25%，应用启动速度提升 15%，并运行最新的 Gemini Nano 模型。谷歌 Pixel 11 系列全系标配 256GB 存储起步。Pixel 11、Pixel 11 Pro 和 Pixel 11 Pro XL 均采用更薄的机身设计，相机条显著收窄并覆盖边缘到边缘的玻璃，与官方保护壳齐平以防止在平面上晃动。相机条上新增了 HiLight 指示灯，可通过彩色光效循环显示通知状态或指示 Gemini 的当前操作。美国市场销售的 Pixel 11、Pro 和 Pro XL 为纯 eSIM 设计，加拿大及其他国际市场保留物理 SIM 卡槽；Pro Fold 在所有市场均配备物理 SIM 卡槽。具体价格方面（以 Pixel 11 为例，以旧换新最多可省 500 美元）：Pixel 11：冰霜紫、木槿桃、开心果绿、曜石黑12GB/256GB 版本 899 美元（现汇率约合 6,076 元人民币）、29,990 新台币（现汇率约合 6,280 元人民币）12GB/512GB 版本 1,019 美元（现汇率约合 6,887 元人民币）、33,990 新台币（现汇率约合 7,118 元人民币）Pixel 11 Pro：砂岩粉、橄榄绿、迷雾灰、曜石黑 (雾面)12GB/256GB 版本 1,099 美元（现汇率约合 7,428 元人民币）、36,990 新台币（现汇率约合 7,746 元人民币）16GB/512GB 版本 1,219 美元（现汇率约合 8,239 元人民币）、40,990 新台币（现汇率约合 8,583 元人民币）16GB/1TB 版本 1,499 美元（IT之家注：现汇率约合 10,131 元人民币）。Pixel 11 Pro XL：颜色同上12GB/256GB 版本 1,299 美元（现汇率约合 8,779 元人民币）、42,990 新台币（现汇率约合 9,002 元人民币）16GB/512GB 版本 1,419 美元（现汇率约合 9,590 元人民币）、46,990 新台币（现汇率约合 9,840 元人民币）16GB/1TB 版本 1,649 美元（现汇率约合 11,145 元人民币）。Pixel 11 Pro Fold：橄榄绿、曜石黑16GB/512GB 版本 1,899 美元（现汇率约合 12,835 元人民币）、60,990 新台币（现汇率约合 12,771 元人民币）。谷歌表示，由于入门款存储从 128GB 翻倍至 256GB，Pixel 11 和 Pixel 11 Pro 的实际定价与去年 256GB 版本的 Pixel 10 和 Pixel 10 Pro 持平。但 Pixel 11 Pro XL 的基础款（12GB/256GB）较 Pixel 10 Pro XL 同配置上涨了 100 美元，且 RAM 容量由前代的 16GB 缩减至 12GB。Pixel 11 Pro 和 Pro XL 配备 Super Actua 显示屏，峰值亮度达 3600 尼特，并采用新型防刮涂层。Pro Fold 内外双屏同样达到 3600 尼特亮度，较上一代提升 20%，谷歌称其为“最耐用的折叠屏机型”，支持 IP68 防护。该系列全系提供七年操作系统、安全补丁及 Pixel Drop 更新；Pro 机型附赠六个月 Google AI Pro 订阅（含 Gemini 高额度套餐、5TB 云存储及 Google Health Premium）。配置参数（下列更高端机型与上列相同的参数省略）：Pixel 11：搭载 Tensor G6 及 Titan M3 安全性辅助处理器；512 GB 版本搭载 Zoned UFS，能效更强6.3 英寸 Actua OLED 屏幕（20:9），1080 x 2424 (422 PPI) 分辨率，60-120Hz 可变刷新率，康宁 Gorilla Glass Victus 2 表面玻璃，HDR 典型亮度 2,000nits，峰值亮度 3,000 nits。典型容量 4985 mAh（额定容量 4840 mAh）电池，续航超 30 小时，充电约 30 分钟即可充至 55% 电量（需搭配 30W USB-C PPS 以上规格的充电器）；支持 Pixelsnap 无线充电（Qi2.2 认证），功率最高可达 25W。后置 4,800 万像素 Quad PD 广角镜头（1/1.56 英寸，ƒ/1.70 光圈、85°）、1,300 万像素超广角（1/3.1、ƒ/2.2、120°）、1,080 万像素 Dual PD 长焦镜头（1/3.2、ƒ/3.1、23°），5 倍光学变焦，最高 30 倍数码变焦；前置 1,050 万像素 Dual PD 自拍镜头（ƒ/2.2、95°）。152.8x72x8.6mm，197 克；康宁 Gorilla Glass Victus 2 抛光背盖，搭配抛光处理的航空级铝合金边框；USB Type-C 3.2 接口；IP68 防尘防水；双 SIM 卡；Wi-Fi 6E，蓝牙 6.0，NFC，支持双频 GPS+ 北斗等；抗指纹涂层；预装 Android 17，提供 7 年系统更新支持。Pixel 11 Pro：6.3 英寸 Super Actua 屏幕，1280 x 2856 LTPO OLED (495 PPI)，1-120 Hz 自适应刷新率，康宁 Gorilla Glass Victus 2 表面玻璃搭配抗刮保护层，2,400 nits (HDR) 和 3,600 nits。4850 mAh (4707 mAh) 电池，充电约 30 分钟可充至 55% 电量。后置 5,000 万像素 Octa PD 广角（1/1.3 英寸、ƒ/1.68、82°）、4,800 万像素 Quad PD 超广角（1/2.51 英寸、ƒ/1.7、123°）、4,800 万像素 Quad PD 长焦（1/1.95、ƒ/2.8、23°），最高 120 倍数码变焦；前置 4,200 万像素 Dual PD 自拍镜头（ƒ/2.2、103°）。152.7x71.9x8.4mm，204 克；三频 Wi-Fi 7。Pixel 11 Pro XL：6.8 英寸 Super Actua 屏幕，1344 x 2992 LTPO OLED (486 PPI)5115 mAh (5000 mAh) 电池，充电约 30 分钟可充至 75% 电量；162.7x76.5x8.5mm，226 克。Pixel 11 Pro Fold：外屏采用 6.5 英寸 Super Actua 屏幕，1080 x 2342 OLED (399 PPI)，超耐用玻璃陶瓷表面玻璃；内屏采用 8 英寸 Super Actua Flex 屏幕，2076 x 2152 OLED (372 PPI)，超薄玻璃。4806 mAh (4658 mAh) 电池，充电约 30 分钟可充至 50% 电量；标准版同款 4,800 万像素 Quad PD 广角镜头（1/1.56 英寸，ƒ/1.70 光圈、85°）+1,080 万像素 Dual PD 长焦镜头（1/3.2、ƒ/3.1、23°）、1,050 万像素 Dual PD 超广角（1/3.4、ƒ/2.2、127°），最高 30 倍数码变焦；双屏前置均为 1,000 万像素 Dual PD 自拍镜头（ƒ/2.2、87°）。折叠状态 155.2x76x10.1mm，展开 155.2x150.4x5mm，重约 239 克；除 Pixel 11 系列外，谷歌还发布了 Pixel Watch 5 智能手表，起售价 399 美元（41mm）和 429 美元（45mm）。该手表搭载骁龙 W5 Gen 2 芯片，支持血压趋势与胰岛素抵抗趋势监测（基于心率、睡眠质量及日常活动分析得出，谷歌强调该指标不能用于糖尿病筛查或实时血糖监测），续航达 30 至 40 小时，支持 15 分钟快充。谷歌还推出了其首款追踪器 Pixel Tag，售价 29 美元 / 个、99 美元 / 四件套，基于 Android Find Hub 网络，支持 IP67 防护、可更换电池（续航约一年），将于 11 月 11 日上市。谷歌 Pixel Buds 2 耳机新增 Olive 配色，并将于 9 月通过软件更新获得动态主动降噪、Gemini 语音控制及 Live Translate 等功能。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/988/985.htm", "publishedAt": "2026-08-12T14:06:42+00:00"}, {"title": "腾讯总裁刘炽平：微信将成为以 AI 为先的生态系统，未来能转化为巨大价值", "summary": "IT之家 8 月 12 日消息，在今天（12 日）晚间的腾讯 2026Q2 财报业绩电话会上，腾讯总裁刘炽平谈及二季度微信 AI“小微”灰测的反馈。刘炽平认为，AI 可以让微信变得更加智能化，能够帮助用户进行交易、探索内容以及管理日常生活。“在 PC 时代，QQ 主要是一个通信和社交工具，到了移动互联网时代，微信又将 QQ 的价值放大了 10 倍以上。而到了 AI 时代，随着时间的推移，微信将成为以 AI 为先的生态系统。用户给出一个指令，系统就自行执行。”刘炽平表示，如果腾讯能够在控制成本的同时提供这种体验，并且满足用户隐私需求、成本效益，就能为微信赋予强大的能力。“未来微信的生态系统将会扩大，基于目前的盈利机制转化为巨大的价值。这就是我们看到的未来。随着原型的推出，我们对此越来越有信心。”延伸阅读IT之家从腾讯 2026 年第二季度财报获悉，当季实现营收 2047.9 亿元，同比增长 11%；Non-IFRS 经营利润为 756.4 亿元，同比增长 9%；资本开支达 527.8 亿元，同比增长 176%，AI 投入力度持续加大。微信 AI 助手“小微”于 2026 年 6 月启动灰度测试，底层由微信团队自研的 MoE 架构中文大语言模型 WeLM 驱动，部分复杂推理场景调用 DeepSeek 进行补充。目前其入口已从微信首页侧滑主入口延伸至公众号消息总结、朋友圈文案生成、扫一扫“拍照给 AI”以及聊天输入框等多个高频场景，用户可通过文字或语音指令操控微信原生功能、唤起小程序完成生活服务，或对文件、图片等内容进行理解与总结。腾讯混元大模型本季度完成 Hy3 从 preview 到正式版的快速迭代，采用 MoE 架构，总参数量 2950 亿、动态激活 210 亿参数，支持 256K 超长上下文，上线一周调用量较上一代模型增长超 68 倍。更大参数规模的 Hy4 也计划于近期发布，将进一步提升模型性能和多模态能力。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/988/977.htm", "publishedAt": "2026-08-12T13:44:38+00:00"}, {"title": "腾讯：预计今年底至明年初 GPU 资源将更加充足，从而进一步提升云服务能力", "summary": "IT之家 8 月 12 日消息，腾讯今日发布了 2026 年第二季度财报。腾讯高管在业绩会上表示，腾讯云正持续推进算力布局，预计今年底至明年初 GPU 资源将更加充足，从而进一步提升云服务能力。腾讯表示，公司正关注 GPU 算力、模型即服务（MaaS）等业务机会，将统筹调配算力资源，兼顾内部模型开发与对外出租需求。腾讯高管在业绩会上表示，将持续加大算力投资，算力资源将进一步兼顾内部模型构建、对外出租。公司将提升资本开支规模，对应股票回购的现金流或相应减少。其强调，本轮 AI 原生业务投入以一次性为主，今年底至明年初仍将持续，但未来不会持续维持高投入规模。腾讯 2026 年第二季度财报显示，公司当季营收 2047.9 亿元，同比增长 11%；Non-IFRS 净利润 684 亿元，同比增长 9%。在 AI 基础设施建设方面，腾讯二季度资本开支达 527.8 亿元，同比增长 176%，环比增长 65%，主要用于采购 AI 基础设施，以支持 Hy 系列模型升级、WorkBuddy 及 CodeBuddy 推理需求、微信 AI 举措，以及满足外部客户对云服务的增长需求。若剔除算力采购的预付款项，二季度自由现金流为 376 亿元。腾讯 CEO 马化腾在业绩会上表示，公司正从智能、应用与基础设施三个层面构建 AI 赋能的腾讯。“在基础设施层，我们大幅增加算力采购，将助力我们把应用及模型的使用转化为收入。”腾讯总裁刘炽平此前曾表示，资本开支规模低于预期的原因在于先进 GPU 在中国的供应受阻，公司通过租用弥补部分算力需求，同时减少对外租售以保证自身算力。在 GPU 资源分配上，腾讯此前采取优先支持混元、元宝等内部 AI 应用场景的策略。随着国内自研 GPU 供给逐步增加，腾讯计划释放更多算力资源给腾讯云。腾讯云预计在 2026 年第四季度部署基于近封装光学（NPO）技术的超级计算节点，单季度国产算力采购量据行业估算可能达到 10 万卡级别。相关阅读：《腾讯回应 Q2 负自由现金流 138 亿元：若剔除算力采购的预付款项，自由现金流为 376 亿元》《腾讯控股 2026 财年半年报归母净利润 1141.15 亿元同比增长 10%，微信月活 14.39 亿同比增长 2%》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/988/969.htm", "publishedAt": "2026-08-12T13:25:06+00:00"}, {"title": "国产具身智能创全球新纪录！以30%成本跑赢 Figure AI 45%效率，聪明的具身大脑成关键", "summary": "具身模型一小时狂拣1816件异形包裹", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/471049.html", "publishedAt": "2026-08-12T13:10:55+00:00"}, {"title": "荣耀罗巍：Robot Phone 手机预定超过 40 万台", "summary": "IT之家 8 月 12 日消息，在今晚的荣耀 Robot Phone 全球新品发布会上，全球首款机器人手机 —— 荣耀 Robot Phone 正式发布，定价 9,999 元起。12GB+512GB：9,999 元16GB+1TB：12,999 元京东荣耀 Robot Phone9999 元起直达链接IT之家注意到，荣耀首席影像工程师罗巍透露，Robot Phone 手机预定超过 40 万台。他直言：“再不下手估计买不到了。”IT之家从荣耀发布会了解到，Robot Phone 是荣耀与顶级电影摄影机厂商 ARRI（阿莱）合作的首款落地产品，融合了荣耀的移动影像以及 ARRI 百年底蕴的电影摄影技术。硬件方面，荣耀 Robot Phone 后置三摄方案包含一颗 2 亿像素 F1.6 光圈、等效 23 毫米的 4D 云台主摄，一颗 5000 万像素超广角镜头，以及一颗 2 亿像素潜望式长焦镜头。该机还首发自研影像芯片“荣耀驭光 H1”，云台主摄 CMOS 尺寸达 1/1.28 英寸。参数方面，荣耀 Robot Phone 搭载第五代骁龙 8 至尊版芯片，配备一块 6.31 英寸的 1.5K 分辨率四等边直屏。该机内置端侧大模型 YOYO，具备情感感知能力，能够主动识别用户的情绪状态、使用习惯及当前所处环境。京东荣耀 Robot Phone9999 元起直达链接2026 年数码家电政府补贴持续进行中，IT 之家为大家汇总国补领券地址，买数码家电之前记得领取。数码补贴：点此领券手机 / 平板 / 3C 数码支持 8.5 折政府补贴，不超过 6000 元的产品至高立减 500 元。家电补贴：点此领券多类家电支持 8.5 折政府补贴，单品至高补贴 1500 元。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/988/965.htm", "publishedAt": "2026-08-12T13:04:21+00:00"}, {"title": "3999 元影石 X6 正式发布：1/1.1 英寸大底传感器 + AI 三芯架构，支持 8K 50 帧全景视频", "summary": "IT之家 8 月 12 日消息，影石今日正式发布新一代超旗舰全景相机 X6，标准套装 3999 元起，旅拍套装和全能套装分别为 4299 元、4499 元，首批只有黑色可选。京东影石 Insta360【新品】X6 全景运动相机 8K 高清防抖防水手持口袋摄像机 标准套装 极夜黑 3999 元直达链接2026 年数码家电政府补贴持续进行中，IT 之家为大家汇总国补领券地址，买数码家电之前记得领取。数码补贴：点此领券手机 / 平板 / 3C 数码支持 8.5 折政府补贴，不超过 6000 元的产品至高立减 500 元。家电补贴：点此领券多类家电支持 8.5 折政府补贴，单品至高补贴 1500 元。欢迎下载最会买 App - 好货好价，高额返利，1 毛钱也能提现！扫描二维码或点击此处下载最新版（自动识别平台）。作为影石深耕全景影像十年的标杆之作，X6 在画质、形态与 AI 体验上全面进阶，搭载索尼定制方形大底传感器与 4nm AI 三芯架构，支持 8K 50 帧全景视频和 1.2 亿像素全景照片。X6 搭载影石与索尼联合定制的两颗 1/1.1 英寸方形大底传感器，相比上一代 X5 其传感器有效利用面积增加 33%，单像素进光量提升 300%，显著改善弱光、逆光及高对比度场景下的成像表现。X6 拥有 14.5 档动态范围，在全档位支持 10-bit 色深，并成为首款支持机内原生杜比视界的全景相机。算力方面，X6 搭载一颗高通 4nm 旗舰 AI 芯片和两颗专用影像芯片，算力提升 5 倍，功耗降低 35%。新增的两颗环境光传感器可有效抑制灯光频闪。X6 还是首款支持机内原生杜比视界的全景相机，可逐帧分析动态元数据，为不同画面匹配合适的亮度和对比度。针对专业创作者，X6 全档位支持 10-bit 色深，提供 I-Log 灰片模式，支持 ACES 色彩管理流程。X6 深度整合全景模式、云台模式 2.0 与平面视频模式，真正实现一机多用。全新云台模式 2.0 在 X5 动态跟拍模式基础上进一步升级，无需后期取景，机内直出 4K 平面视频，并支持同步备份 8K 全景素材，除人物外还可智能追踪动物和物体。X6 配备全新口袋折叠自拍杆，可直接控制相机拍摄。头部追踪功能配合配件后，镜头可随用户视线自动调整。屏幕方面，X6 配备 2.32 英寸 OLED 全面屏，拥有 1200 尼特峰值亮度；2600mAh 可拆卸电池支持 8K 30fps 连续录制 140 分钟，24 分钟可快充至 80%，并可在-20℃ 环境中稳定工作。X6 还升级了可更换镜片 2.0，抗刮性能达到上一代 5 倍，裸机支持 20 米防水；机身自带 47GB 可用存储，支持 NFC、Wi-Fi 6.0 与 USB 3.0 高速传输。X6 的另一条升级主线是 AI 创作链路。自研全景 AI 多模态模型 PanoMind 基于旅行、滑雪、骑行等 30 余类场景、累计超 1 万小时的专项数据训练。「AI 导演」功能可在相机充电时自动识别高光时刻、生成虚拟相机运动轨迹并完成成片，自动推送至手机 App。「时刻 Pro」则支持用户通过自然语言提出创作需求，自动筛选素材、设计叙事并生成视频。「3D 时光舱」可将 X6 拍摄的素材导入 App 后自动生成 3D 高斯泼溅模型，将真实场景重建为可自由漫游的 3D 空间。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/988/955.htm", "publishedAt": "2026-08-12T12:10:34+00:00"}, {"title": "大我 Bigme B1051 Ultra 10.3 英寸彩墨屏 AI 办公本开售，6+128GB 版本到手价 3299 元", "summary": "IT之家 8 月 12 日消息，大我 Bigme B1051 Ultra 彩墨屏 AI 办公本今日开售，6+128GB 版本到手价 3299 元。IT之家获悉，这款产品配备 10.3 英寸 300 PPI Kaleido3 彩色墨水屏，支持 36 级冷暖光调节，彩色模式 150 PPI，黑白模式 300 PPI；配备 xRapid 快刷技术，刷新帧率至高 50 FPS；搭载 xClear 自动清残影技术，在普通和极速模式下翻页残影下降 50% 以上。性能方面，这款产品搭载天玑 1080 处理器，主频 2.6GHz，采用 6nm 工艺制程；机身厚度 5.5 mm，内置 6900mAh 容量电池，侧边配备指纹识别模块，支持 2TB 内存卡拓展。这款产品配备手写笔，还有八颗触控按键可自定义；后置摄像头支持文档扫描、扫码、OCR 文档识别等；音频方面配备四麦矩阵，提升录音清晰度。系统方面，新品运行 Android 14 开放系统，搭载 Bigme 系统 5.0，提升应用启动与切换速度，智能调度后台活动延长续航；内置 BigmeGPT4.0，提供 AI 问答、翻译、内容总结等能力。京东 BIGME 电纸书 B1051 ultra3299 元直达链接", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/988/950.htm", "publishedAt": "2026-08-12T12:03:00+00:00"}, {"title": "寒武纪回应“存货超 82 亿”：将持续拓展市场，控制相关风险", "summary": "IT之家 8 月 12 日消息，寒武纪 2026 年半年实现营业收入 59.96 亿元，同比增长 108.13%；归母净利润 23.11 亿元，同比增长 122.61%。寒武纪今日举办 2026 年半年度业绩说明会。针对市场关注的存货问题，寒武纪董事长、总经理陈天石回应称，公司根据客户订单需求及市场预测制定采购计划，将持续拓展市场、推动 AI 应用落地以控制相关风险。截至 2026 年 6 月 30 日，寒武纪存货账面价值达 82.48 亿元，较上年末增长 66.83%，占总资产比例高达 45.32%。存货增长主要系原材料与委托加工物资增加所致。IT之家注意到，其中原材料账面余额 57.49 亿元，委托加工物资账面余额 25.37 亿元。寒武纪采用 Fabless（无晶圆厂）模式，需通过代工厂完成芯片制造，存货增长更多体现为提前储备原材料及部分产品交由代工厂加工。报告期内，寒武纪云端产品线实现收入 59.94 亿元，占营业收入的 99.98%。公司在金融、互联网等核心行业实现了持续性的规模化商用部署。研发投入方面，上半年研发费用约 7.02 亿元，同比增长 29.63%，研发人员从 792 人扩充至 1007 人。公司持续推进 DeepSeek、Qwen、Kimi 等国产主流模型的适配工作。相关阅读：《寒武纪 2026 上半年归母净利润 23.11 亿元，同比增长 122.61%》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/988/948.htm", "publishedAt": "2026-08-12T11:55:28+00:00"}, {"title": "荣耀 Robot Phone 手机搭载 Agentic OS 新一代伙伴型多模态智能操作系统，首发全新 YOYO Pro", "summary": "IT之家 8 月 12 日消息，在今晚的荣耀 Robot Phone 全球新品发布会上，荣耀官方宣布，Robot Phone 将搭载 Agentic OS 新一代伙伴型多模态智能操作系统。荣耀 Robot Phone 手机提供星轨银和月影灰两款配色，将首发全新 YOYO Pro 模式，由阿里千问大模型深度加持，支持超长任务执行、跨生态联动等功能。IT之家注意到，该机还采用 9.59mm 轻薄机身 + 248g 全金属一体成型设计，配备 6.31 英寸屏幕。荣耀 Robot Phone 搭载第五代骁龙 8 至尊版芯片，内置 7060mAh 青海湖电池，支持四麦克风阵列拾音。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/988/946.htm", "publishedAt": "2026-08-12T11:48:05+00:00"}, {"title": "AI 编程语言 Mojo 推出 1.0 正式版，预计年内开源编译器及相关工具链", "summary": "IT之家 8 月 12 日消息，Modular 现已正式发布 AI 编程语言 Mojo 1.0 版本，新版进一步整理了语法和类型系统，并针对“引用失效”问题加入了部分诊断能力。具体来看，本次 Mojo 1.0 在语言设计方面统一了此前存在多种表达方式的功能（包括变量声明、闭包以及指针类型等），同时新增类似 Python 的 lambda 匿名函数语法，开发者可以直接在代码中创建简短的内联闭包。除此之外，Mojo 1.0 为“引用失效”问题加入了诊断能力。官方举例，例如程序向 List 添加新元素后，原本指向 List 内部数据的引用可能因为内存重新分配而失效。如果代码继续使用该引用，就可能产生难以发现的错误。Mojo 现在能够识别此类“引用失效”情况，并提前提醒开发者进行修改。Modular 同时透露，，过去几年间 Mojo 一直处于快速开发阶段，不断调整语法、类型系统以及标准库，导致不少项目显著增加开发和维护成本。因此，Mojo 1.0 的重点是建立更加稳定的语言基础，虽然 1.x 版本期间仍可能出现兼容性问题，但后续官方将更加谨慎地调整语言设计，尽量避免现有代码因版本更新而频繁失效。目前，Mojo 已经可以用于 CPU、GPU 以及其他计算加速器的程序开发。后续官方还计划加入异步编程、模式匹配以及联合类型等功能，预计今年内官方将开源 Mojo 编译器以及相关工具链，让开发者能够进一步参与 Mojo 生态建设。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/988/945.htm", "publishedAt": "2026-08-12T11:47:11+00:00"}, {"title": "紫东太初推出GMC核心集剪枝方法，少80%Token仍满血保真多模态能力", "summary": "免训练、开箱即用！", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/471030.html", "publishedAt": "2026-08-12T10:54:29+00:00"}, {"title": "小扎万字长文炮轰闭源：蒸馏无罪，Meta 正式重回开源模型路线", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/9sy33cA91Fp8z5mlOvNu?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-12T10:43:48+00:00"}, {"title": "Gitee CLI 开源，无需离开终端，即可完成 Gitee 日常工作。", "summary": "但当任务走到「把这个分支提个 PR」「顺手建个仓库」「把这批 issue 归档」时，它们往往就卡住了，网页界面点不动，裸调 REST API 又要记住一堆端点、鉴权和分页规则。 Gitee CLI 正在补上这「最后一公里」：它是一个同时服务于「人」和「AI Agent」的命令行工具；而主仓库内置的 Agent Skills，则把「如何正确、安全地使...", "sourceName": "开源中国", "so 览器内的任务和对话现可跨 Claude 桌面端、网页端及移动端无缝同步。IT之家附上相关视频演示如下：侧边栏中发起的对话将保存至 Claude 历史记录，用户可在其他平台恢复会话。此外用户无需二次设置，可以直接在浏览器中使用账户已配置的 Agent Skills 和 Connectors。Chrome 版 Claude 能查看当前网页，并利用用户现有的浏览器登录状态执行具体操作，包括点击链接、页面跳转、输入文本及填写表单等。安全方面，Anthropic 警告，浏览器智能体仍易受提示词注入攻击。为提升安全性，启用自动批准时，系统会通过单独检查审查重大操作。在执行购买或共享个人数据等操作前，Claude 仍会征询用户意见。公司强调，这些保障措施可降低风险，但无法完全消除风险。推送范围上，Anthropic 自今天开始已经面向 Max 和 Team 客户开放，未来几周内将向 Pro 用户推出。企业管理员可启用该功能，并限制 Claude 仅访问已批准的域名。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/989/006.htm", "publishedAt": "2026-08-12T23:03:20+00:00"}, {"title": "回来了，马斯克带着 24 小时干活的 Agent 回来了", "summary": "Cursor 团队匠心打造#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1674851?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-08-12T22:55:47+00:00"}, {"title": "实测 DeepSeek V4 Pro 正式版：能力直逼 Fable 5，还藏了一个大招", "summary": "在 AI Agent 的道路上狂奔#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1674965?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-08-12T22:55:33+00:00"}, {"title": "从亚百毫秒级启动到生产级部署，腾讯云为何重构 Agent 沙箱？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/KwZX2bLcaHRjuLG95vHI?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-12T18:07:43+00:00"}, {"title": "谷歌 Pixel Buds Pro 2 耳机升级：主动降噪、同声传译功能均获增强", "summary": "IT之家 8 月 12 日消息，今天（12 日）晚间随 Pixel 11 系列一同亮相的 Pixel Buds Pro 2 和 Pixel Buds 2a，将从今年秋季起加入一系列免手操作功能，让日常使用更加灵活。谷歌新款耳机把升级重点从硬件转向了更智能的软件功能。其中最重要的升级是动态 ANC（主动降噪），针对的是耳机使用中一个很常见的问题：佩戴一段时间后，耳机与耳道之间的贴合程度可能发生变化。Pixel Buds Pro 2 能够根据轻微的密封变化调整降噪效果，从而维持更强的噪声抑制能力。谷歌称，Pixel Buds Pro 2 现有 ANC 系统的降噪能力最高已经达到初代 Pixel Buds Pro 的两倍，动态 ANC 相当于在原有基础上进一步提升稳定性。Gemini 进一步融入耳机控制功能中。用户可以直接通过语音调整设置，例如让谷歌提高低音强度，不必再拿出手机操作。睡眠追踪也获得了 Pixel 生态系统的联动支持。Pixel Watch 检测到用户入睡后，可以自动暂停播放、关闭耳机触控并将通知静音。Live Translate 实时翻译同样迎来大幅升级。按下 Pixel Buds 后即可进入聆听模式，不用操作手机，就能近乎实时理解 70 多种语言的大意。用户也可以直接开口说话，再由 Pixel 手机向对方播放翻译后的回答。Pixel Buds Pro 2 的硬件本身没有明显变化。与初代 Pixel Buds Pro 相比，Pixel Buds Pro 2 体积缩小 27%，重量减轻 24%，搭载谷歌 Tensor A1 芯片，同时采用重新设计的佩戴结构。Pixel Buds Pro 2 还新增 Olive（IT之家注：直译为橄榄）配色，并将于 8 月 12 日开放订购。软件功能将从 9 月起陆续推送。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/988/991.htm", "publishedAt": "2026-08-12T14:33:27+00:00"}, {"title": "全球首款机器人手机荣耀 Robot Phone 正式发布，天马宣布独家供屏", "summary": "IT之家 8 月 12 日消息，在今晚的荣耀 Robot Phone 全球新品发布会上，全球首款机器人手机 —— 荣耀 Robot Phone 正式发布，定价 9999 元起。天马微电子宣布，为本款机型独家供应屏幕，深度定制天马天工屏高端 OLED 显示方案。天马表示，这是天工屏首次应用于具备具身交互能力的 AI 终端，适配机器人手机的创作、随行交互等场景。据介绍，荣耀 Robot Phone 手机配备一块 6.31 英寸 1.5K OLED 直屏，屏幕分辨率 2640×1216，支持 P3 影院级广色域与专业色彩校准；峰值亮度可达 6800nits，支持 1‑120Hz LTPO 自适应刷新率；采用中置挖孔设计，拥有 1.08mm 极窄四等边，并实现了 94.58% 高屏占比。这块屏幕采用天工屏 U9 护眼基材，支持 4320Hz 超高频 PWM 调光，可实现全亮度无频闪；拥有 1nit 硬件级极暗护眼方案，支持荣耀 AI 绿洲护眼，集合芯片级 AI 离焦护眼、AI 干眼友好、AI 助眠显示等十余项护眼技术。IT之家注意到，荣耀 Robot Phone 的屏幕局部峰值亮度高达 6800nits，支持最低 1nit 极暗显示、真 10.7 亿色显示与 P3 广色域，并通过了 HDR Vivid 与杜比视界 Dolby Vision 双重认证。相关阅读：《9999 元起，荣耀 Robot Phone 手机正式发布》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/988/986.htm", "publishedAt": "2026-08-12T14:11:08+00:00"}, {"title": "荣耀 Robot Phone 发布：9999 元起，AI 手机开始长出「身体」", "summary": "坏了，手机会自己动了。#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1674938?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-08-12T13:51:36+00:00"}, {"title": "铠侠与闪迪发布第九代 2Tb QLC 3D 闪存，接口速度达 4.8Gb/s 提升 33%", "summary": "IT之家 8 月 12 日消息，铠侠与闪迪今日共同宣布，推出第九代高性能 2Tb QLC 3D 闪存。该技术面向 AI 基础设施及数据密集型应用场景，旨在应对 AI 工作负载带来的存储需求增长。第九代 QLC 技术采用了两家公司的 CMOS 直接键合阵列（CBA）架构，将先进 CMOS 晶圆与成熟的存储单元阵列平台相结合。与前代第八代 2Tb QLC 产品相比，新技术引入了 6 平面架构及多项性能增强设计，实现了更高的写入与读取带宽，同时改善了读写功耗效率。IT之家从官方新闻稿获悉，其 NAND 接口速度达到 4.8Gb/s，较第八代器件提升了 33%。铠侠首席技术官宫岛英史表示，随着 AI 应用从生成式 AI 向智能体和物理 AI 扩展，数据利用日趋多样化和复杂化，公司正通过将成熟的存储单元技术与最新 CMOS 技术相结合，加速第九代闪存的开发，在保持较高投资效率的同时实现高性能。闪迪首席技术官 Alper Ilkbahar 则表示，AI 的快速普及正在加速存储接口的迭代，市场对能更快进化的存储技术需求日益增长，第九代 QLC 技术展示了 CBA 架构在分别推进 CMOS 和存储技术创新方面的灵活性。相关阅读：《铠侠与闪迪发布第十代 332 层 QLC NAND 闪存，接口速率达 4.8Gb/s》《铠侠第一大股东易主：东芝减持放弃宝座，SK 海力士关联投资实体成“新王”》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/988/979.htm", "publishedAt": "2026-08-12T13:48:22+00:00"}, {"title": "马斯克：大概再过四五年，AI 将占到 SpaceX 价值的 99%", "summary": "IT之家 8 月 12 日消息，SpaceX 创始人兼 CEO 埃隆 · 马斯克在公司 8 月 11 日发布于 X 的员工讲话中称：“我们的 AI 收入可能到 9 月，也就是下个月，就会超过 SpaceX 其他所有业务收入的总和，第四季度还会大幅超过其他业务收入。所以，AI 已经成为 SpaceX 未来极其重要的一部分。”今年早些时候，SpaceX 收购了马斯克 2023 年创立的初创公司 xAI。不过，收购 xAI 只是 SpaceX 进军 AI 的开端。马斯克此次放出豪言：“大概再过四五年，AI 会占到 SpaceX 价值的 99%；五年后肯定会达到这个水平。到时候 SpaceX 的价值将是一个天文数字。”“天文数字”并非夸张。马斯克称，SpaceX 计划在明年年底前将运行中的 AI 算力提高到 10 吉瓦，而目前只有 1.4 吉瓦。“每瓦的价值可能达到 30 至 50 美元（IT之家注：现汇率约合 202.8 至 337.9 元人民币）。也就是说，如果我们在明年年底前上线 10 吉瓦 AI 算力，每年就能带来 3,000 亿至 5,000 亿美元（现汇率约合 2.03 万亿至 3.38 万亿元人民币）收入。数字非常大。”马斯克乐观预计：“未来从根本上属于 AI 和机器人。只要文明继续进步，我认为 AI…… 数字智能的总量最终可能超过生物智能总量的一万亿倍。”马斯克还称，自己推动 AI 业务并不只是为了赚钱。“拥有一种关心人类、促进人类发展，并帮助我们前往其他行星和其他恒星系统的 AI 非常重要。正因如此，我认为 SpaceX 不仅必须在 AI 硬件上取得成功，也必须在 AI 软件上取得成功。我认为，由 SpaceX 孕育出来的 AI 会是一种非常好的 AI。SpaceX 汇聚了地球上一些最优秀的人，无论能力、道德还是善良品质都非常出色。”马斯克敦促 SpaceX 员工尽可能为公司的 AI 业务提供帮助，并强调，如果取得成功，员工未来甚至可能获得一些令人惊叹的度假机会。“其中一个不错的好处是，未来 SpaceX 任何想去月球或火星的人都能去。我向你们保证。”相关阅读：《马斯克最新 SpaceX 讲话：我们必须赢得 AI 竞争》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/988/975.htm", "publishedAt": "2026-08-12T13:35:37+00:00"}, {"title": "林俊旸官宣创业公司“Pragmatik Labs”", "summary": "前阿里通义千问（Qwen）团队核心成员林俊旸官宣了其创业公司：语用科技（Pragmatik Labs）。 今日凌晨，他在 X 上发布了这条消息。\"a life update\"，措辞轻描淡写，但内容不轻：新公司叫 Pragmatik（p7k）Labs，中文名\"语用科技\"，方向是数字世界和物理世界的下一代 Agent。种子轮由高榕创投和红杉中国联合领投，腾讯和上...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/501902", "publishedAt": "2026-08-12T07:41:42+00:00"}, {"title": "谷歌力撑 Go ，称其为 AI 辅助软件工程的理想编程语言", "summary": "当 AI 帮你写代码时，你选什么语言？Google 的答案是 Go——不是因为它好写，而是因为它好读、好审、好维护。 Google 官方博客发表了一篇立场鲜明的文章，论证 Go 是 AI 辅助软件工程的理想语言。逻辑很直接：当 AI 成为你团队里那个\"有点莽撞但产出极高的队友\"时，软件工程的瓶颈从\"写代码\"变成了\"审代码\"。Go 从设计之...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/501900/go 到 8000 亿千瓦时。人工智能的未来，不仅是“算”的比拼，更是“电”的竞赛。报道指出，算力在狂奔，绿电在托底。截至 6 月底，我国非化石能源发电装机容量 25.2 亿千瓦，占总装机容量比重的 62.4%，我国新增用电需求几乎全部由绿电满足。东数西算八大枢纽内，大型绿色算力集群绿电使用率持续攀升。内蒙古和林格尔、甘肃庆阳等地新建数据中心的绿电消费占比已超 80%，全国 172 个算力中心通过绿色低碳 4A 认证。IT之家从报道中获悉，如今，东数西算工程已撬动万亿级社会投资，有效解决算力高能耗、新能源发电波动等问题，绿色能源底座正在托举中国 AI 全球竞争力。到 2030 年，近 6 万亿度绿电奔涌入网。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/988/994.htm", "publishedAt": "2026-08-12T15:14:02+00:00"}, {"title": "群青智能联合创始人&CEO 吴哲明博士确认出席AICon深圳，将分享“从真实产线定义智能——工业具身智能的物理 AI 闭环”", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/b1V6WF6iUajJpND8VmCE?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-12T14:25:14+00:00"}, {"title": "Anthropic CEO整天神神叨叨，投资人受不了了", "summary": "Dario能不能少吓唬点人…", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/471162.html", "publishedAt": "2026-08-12T13:38:09+00:00"}, {"title": "零刻推出 AMD 锐龙 AI 9 HX 470 版 ME Pro NAS 迷你主机，4795 元起", "summary": "IT之家 8 月 12 日消息，零刻 (Beelink) 今日宣布推出 AMD 锐龙 AI 9 HX 470 版 ME Pro NAS 迷你主机，包括两盘位和四盘位版本。IT之家注意到，此次新机型与早前推出的 AMD 锐龙 AI 9 HX 370 版 ME Pro 并未任何意义上的本质区别，仅是简单的处理器迭代。目前 AMD 锐龙 AI 9 HX 370 版 ME Pro 标价仍是两盘位 3999 元起、四盘位 4299 元起；AMD 锐龙 AI 9 HX 470 版则是两盘位 4795 元起、四盘位 4995 元起（以上价格均为无内存无存储“准系统”）。AMD 锐龙 AI 9 HX 470 版 ME Pro 拥有 2 条 DDR5-5600 SO-DIMM 内存插槽、3 个 M.2 2280 PCIe SSD 盘位 (2× Gen4×4 + 1× Gen4×1)，配备联发科 Wi-Fi 6 无线网卡 MT7920，提供 1 个 10GbE RJ45、1 个 2.5GbE RJ45、1 个 USB-C 40Gbps 等 I/O。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/988/960.htm", "publishedAt": "2026-08-12T12:35:35+00:00"}, {"title": "iOS 27 曝光苹果 AI 收费：想让 iPhone 更聪明？得加钱", "summary": "得加钱。#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1674897?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-08-12T07:03:57+00:00"}, {"title": "人形之外，擎羽把“身体”变成具身智能的新变量", "summary": "从柔性本体走向跨本体基础智能，让任务与世界知识延续", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/470874.html", " bin AI 服务器机架准备量产，预计 2026 年第三季度进入量产准备阶段，并于第四季度开始出货。蒋集恒表示，未来几个季度产量将逐步增加，Vera Rubin 预计将在 2027 年成为富士康的重要产品。不过，富士康也指出，AI 服务器市场未来的增长仍受到先进封装产能的影响。英伟达等 AI 芯片客户高度依赖台积电生产，而 CoWoS 先进封装技术是 AI 芯片生产的重要环节。目前市场预计台积电 CoWoS 产能将在 2027 年增长超过 50%，但最终能转化为多少 AI 服务器机架出货量仍取决于芯片供应。富士康正在继续扩大 AI 基础设施制造能力。公司 2026 年计划将资本支出提高 30%，同时在印度、墨西哥和美国得州扩大生产布局，其中墨西哥和得州工厂将用于生产英伟达 AI 服务器。富士康 2026 年 7 月营收也创下单月新高，达到 9465 亿新台币，同比增长 54.2%，首次超过 9000 亿新台币。公司表示，云与网络产品，尤其是 AI 服务器的需求增长，是推动营收上升的重要因素。在 AI 业务快速增长的同时，投资者也开始关注公司对 AI 基础设施需求的依赖程度。2026 年以来，富士康股价累计上涨约 17%，但同期中国台湾整体市场指数上涨约 57%，其涨幅明显落后于大盘。相关阅读：《鸿海 2026 财年上半年归母净利润 1098.93 亿新台币，同比增长 27.09%》《鸿海单月营收首度超过 9000 亿元新台币，同比增 54.19%》《苹果 iPhone 18 Pro 系列已量产：目前处于产能爬坡阶段，富士康迎来招工高峰》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/988/966.htm", "publishedAt": "2026-08-12T13:15:41+00:00"}, {"title": "英伟达 RTX PRO 6000 Blackwell 涨价至 16000 美元，较上市初期上涨 87%", "summary": "IT之家 8 月 12 日消息，受全球显存与内存组件持续短缺影响，英伟达旗下旗舰级专业显卡 RTX PRO 6000 Workstation Edition（配备 96GB GDDR7 显存）官方售价已从 6 月的 13250 美元上调至 16,000 美元（现汇率约合 10.8 万元人民币），两个月内涨幅约 20.8%。RTX PRO 6000 Blackwell 于 2025 年 3 月 18 日正式发布。英伟达当时未公布官方建议零售价，但早期美国零售商列表显示盒装工作站版售价为 8565 美元，批量采购价为 8435 美元，此后预售价一度低至 7673 美元。以 8565 美元的早期上市价格计算，当前官方商城 16000 美元的标价涨幅已达 87%；若对比 7673 美元的最低价，当前价格涨幅已超 100%。这款专业卡采用 GB202 核心，搭载 96GB GDDR7 ECC 显存，显存位宽 512-bit，带宽达 1597 GB/s。CUDA 核心数量为 24064 个，配备 188 个第四代 RT 核心，FP4 Tensor 核心算力达 4 PFLOPS，功耗为 400-600W。此次涨价的直接原因是 GDDR7 显存颗粒面临产能瓶颈与成本上涨。上游 DRAM 厂商已预警供应紧张将持续多年。受此影响，消费级显卡同样大幅涨价，配备 32GB 显存的 RTX 5090 市场零售价已突破 4,500 美元（IT之家注：现汇率约合 30,414 元人民币），远超 1999 美元的官方指导价。目前英伟达官方商城中的 RTX PRO 6000 Blackwell 状态标注为“缺货”。市场分析认为，随着显存供应持续紧张，该显卡价格未来不排除突破 20000 美元的可能性。相关阅读：《“建议零售价”如今已成空谈：英伟达 RTX 50 系显卡本月涨幅最高达 39%》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/988/947.htm", "publishedAt": "2026-08-12T11:52:52+00:00"}, {"title": "梁文锋身价一年暴涨 3850%，登顶全球亿万富豪增速榜首", "summary": "10亿美元变成395亿美元，只用了一年。 海外金融研究机构 BestBrokers 基于福布斯实时富豪榜数据（2025年7月27日至2026年7月27日）发布了一份全球亿万富翁财富涨幅排名。DeepSeek 创始人梁文锋以 3850% 的年度财富增长率拿下全球第一，把第二名甩开了三倍多。 梁文锋 202 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
