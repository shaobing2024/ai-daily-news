net 5.5 简直快得离谱，不仅极其高效，而且找回了 Sonnet 4 时代那种极其自然的『人味儿』！」在他看来，同样的价位上，同样的提示词，Sonnet 5.5 对 GPT-6 Sol 实现了碾压。甚至，让 OpenAI 恐惧的是，Sonnet 5.5 已经不是碾压 GPT-6 Sol 这么简单了。爆料人 @srikanthvaluri 和 @buildwithrajath 综合早期实测后指出：「Sonnet 5.5 的表现远超预期，虽然 GPT-6 Astra 在打磨度上仍有一点优势，但 Sonnet 5.5 的表现直接逼平 Astra。」不可思议的是，在某些高级编码和 Agent 能力上，它也逼近了 Astra。有人感慨，连 Sonnet 甚至都碾压 Astra 了，我们这是要进入什么时代了？价格屠夫，性价比之王如果说实测性能的超越只是让 OpenAI 感到「难受」，那么 Sonnet 5.5 曝光的定价，则是在掘 OpenAI 的根。据透露，这款性能直逼 Astra、暴打 Sol 的「神仙模型」，其定价完全对标低端市场。输入（Input）：$2 / 百万 Token输出（Output）：$10 / 百万 Token缓存读取（ Cache reads）：仅仅 $0.20 / 百万 Token！这意味着，Anthropic 正在用「白菜价」提供前沿级别的 AI 能力。OpenAI 的 GPT-6 Sol 和 Luna，价格低于 GPT-5.6 一半，目的就是抢占高频场景。但现在，Anthropic 带着 Sonnet 5.5 杀到了同一价格区间，性能却要强悍得多。「如果 Anthropic 能够以这种极具竞争力的价格，交付如同 Opus 5.5 那样巨大的性能飞跃，OpenAI 将毫无还手之力。」有人评价说。开发者 Rajath Gowda 直言不讳：「Sonnet 5.5 正在成为 OpenAI 的一个大麻烦。如果它真的接近 Opus 5.5，Anthropic 就要把前沿能力变得极度廉价。这才是 OpenAI 最该担心的事。」Anthropic 的战略意图昭然若揭：用 Opus 5.5 守住高端王座，用 Sonnet 5.5 以极致性价比彻底接管中端和日常开发市场。Anthropic 贴脸开大，截杀 DevDay而且，发布时机的选择，往往比产品本身更具戏剧性。就在 OpenAI 发布 GPT-6 Sol 和 Luna 的同一天，Anthropic 直接掏出了 Claude Opus 5.5 —— 性能比前代强，成本降低了 40%，速度快了 30%。而就在近两周，Anthropic 更是战果辉煌：Claude 算出了物理学九圈振幅打破世界纪录；发现了未知的生物酶系统；还推出了包含超 2000 个插件的 Claude Marketplace。相比之下，OpenAI 近期不仅有内部模型争议，还曝出了 AI 泄露用户图片、公开研究员 GitHub Token 作弊等对齐失控事件。本周二（9 月 29 日），正是 OpenAI 极为看重的年度开发者大会 DevDay。就在这个节骨眼上，Sonnet 5.5 灰测全网刷屏。多位大佬疯狂明示：「模型预计下周发布，我猜就是下周二（DevDay 当天），懂得都懂。」或许，纽约时间明天下午 2 点就会有重大预热。有人说，「我为 OpenAI 感到难过。他们最好在 DevDay 上做出强有力的回应，否则他们就真的完蛋了。」Sonnet 5.5 背后技术关键上新这么快的原因，或许是 Anthropic 已经搞定了 RL / 后训练流程。一切的关键，就是高质量的数据。当被问及 Anthropic 到底是如何做到迭代如此之快时，业内大佬 @yacineMTB 推测，核心就是极高标准的数据飞轮。「但我依然感到震惊，他们到底是怎么做到的？」Anthropic 已经实现了大模型研发的「内部闭环」，他们正在用 AI 制造 AI。根据最新曝光的内部量化数据，Anthropic 已经把「数据飞轮」转到了一个令对手胆寒的转速：26% 的核心研发工作，已经由 AI（前代 Claude 模型）主导完成。高达 80% 以上的自产代码，是由大模型自主编写的。这不仅仅是「降本增效」那么简单，这在技术上意味着递归自我改进（RSI）开始显现。Anthropic 估计最早在 2027 年，Claude 就有可能完全自动化，到时候恐怕迭代速度更加疯狂。ASI 双雄对决，谷歌也蠢蠢欲动，我们普通用户只管坐等大战了。大 V Token Gremlin 这样说：「下周的 AI 圈将会有我们前所未见的景象。腾出你的时间，清空你的日程表，做好心理准备，并把你手头最难的工作流保存下来留到以后做。相信我，即将到来的东西，将彻底改变你工作的方式。」Sonnet 5.5 的出现，标志着「平价高质量 AI 时代」的正式降临。两美金，就能买到一百万 Token 的「白菜基建」。极低成本的缓存读取（$0.20/M），能让每个人轻松构建出超长上下文记忆的私人 AI 助理。准备好了吗？如果爆料属实，不到 24 小时内，我们就有新模型可以蹬了。本文来自微信公众号：新智元（ID：AI_era），作者：ASI 启示录，原标题《突发，Sonnet 5.5 偷跑！实测碾压 GPT-6 Sol 直逼 Astra》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/650.htm", "publishedAt": "2026-09-28T01:10:40+00:00"}, {"title": "前苹果 Siri 工程师推出 AI 智能体 szn，可在 iMessage 中与用户互动", "summary": "IT之家 9 月 28 日消息，前苹果 Siri 和 Apple Intelligence 工程师 Nikhil Gupta 宣布推出了一款名为 szn 的 AI 智能体，可直接运行在 iMessage 对话中，帮助用户浏览网页、购买商品以及代表用户与商家沟通。该服务目前已在官网开启注册，面向部分用户提供早期体验，计划于 10 月进一步扩大开放范围。与传统聊天机器人不同，szn 并不只是回答用户的问题，而是可以代表用户执行实际操作。目前用户可以通过 iMessage 与 szn 互动，其能够基于用户共享的备忘录、Find My 位置以及 iCloud 文件提取分析数据，用户无需离开当前对话即可让 AI 完成相关操作。Gupta 表示，每名用户都会获得一个独立的 AI 模型，每个 szn 智能体均拥有独立的姓名、电子邮件地址和电话号码，因此理论上可以像一个独立联系人一样与外部服务进行沟通。例如，用户可以让它代为联系商家、处理订单或进行预约。不过，szn 如何接入 iMessage 目前仍不明确，苹果此前曾限制第三方服务通过非官方方式接入 iMessage。比较典型的案例是 Beeper Mini，该服务曾通过模拟苹果设备身份连接 iMessage，随后被苹果迅速阻断。今年 6 月，Poke 成为苹果批准的首个接入 Messages for Business 平台的 AI 智能体，这意味着其拥有苹果官方提供的消息平台接入渠道，不过目前尚不清楚 szn 是否采用类似方式连接 iMessage。与此同时，苹果也在持续增强 Siri 的 AI 能力。iOS 27 中的新版 Siri 已经能够在应用内部执行部分操作，并按照用户的表达习惯起草消息。OpenAI 此前也为 Mac 版 ChatGPT 加入了读取 iMessage 并协助生成回复的功能，但消息最终发送仍需要用户确认。不过，让 AI 直接处理支付信息并以自己的身份向外部人员发送消息，也意味着用户需要考虑隐私、安全和授权范围等问题。szn 具体的收费模式以及其连接 iMessage 的技术方案细则目前仍有待官方进一步公布。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/634.htm", "publishedAt": "2026-09-27T23:59:19+00:00"}, {"title": "荣耀亲选 AI 投影仪 Ultra 今起首销：1700CVIA 亮度、自研全封闭光机 2.0 技术，国补价 1999 元", "summary": "IT之家 9 月 28 日消息，荣耀亲选 AI 投影仪 Ultra 今日 14:25 正式开售，原价 2599 元、国补到手价 1999 元。京东荣耀亲选 AI 投影仪 Ultra2599 元直达链接这款新品拥有 1700CVIA 流明亮度，符合国家标准并获得权威认证，宣称即使白天不拉窗帘、夜晚开灯直投，也能拥有清晰画面。它采用自研全封闭光机 2.0 技术，升级了防尘性与散热性，从源头提升耐用性，大幅降低光损，让画面更清晰。还配备光镜双玻隔热系统，无偏光片屏体，高密度超亮光源，5 片全域高解析镜头和动态轻音风扇，进一步提升画面亮度和清晰度，保障耐用性同时运行噪音低至 30dB。画质方面，这款投影仪搭载鸿鹄画质引擎，AI PQ 算法深度赋能逐帧精修画面，滤除杂质，拥有更好的质感。它原生分辨率为真 1080P（1920*1080），同时支持 HDR 10、HDR Vivid 解码和 4K 解码，对比度达到 3000:1。核心配置上，荣耀亲选 AI 投影仪 Ultra 搭载 V670 8 核芯片，配备 2GB+64GB 存储，算力提升，支持第三方应用安装；支持 MEMC 运动补偿，减少高速画面拖影、抖动与卡顿。音效方面，它由 vifa 丹麦大师调音，拥有 24W 大功率音箱和 400CC 大音腔；搭载鸿鹄音效 2.0，支持 AI 人声增强和虚拟环绕声。这款新品支持 GPMI 一线通反向操控，单根 GPMI 即可承载全部信号链路，简化布线，还可以实现对外部设备的跨屏反向操控。智能体验方面，它配备 AI 画面校准系统，拥有无感自动对焦、无感自动梯校、自动避障、自动入幕功能，位移投影仪也不中断观影，并能够动态调节。它还支持 AI 隔空指向遥控 2.0，遥控器配备触控板，可以像笔记本一样点按、滑动、拖拽操作，光标精准游走。全局接入 AI 大模型，支持 AI 语音互动，能够实现找片、查天气、调音量等操作，还可以陪你闲聊。此外还支持 AI 触控投影，搭配触控笔可实现精准点触，将投影仪变身为智能白板，适合会议批注、记录笔记、绘画等场景。其他方面，荣耀亲选 AI 投影仪 Ultra 内置了各大平台的海量影视内容，接入荣耀智慧空间，支持远程操控，支持疾速开机无广告，Wi-Fi 6 低延迟，支持 DIY 动态桌面壁纸，接口丰富，配备 USB * 2、3.5mm、HDMI、GPMI、RJ45 接口。拥有钛空灰配色可选，能效等级为一级。IT之家附荣耀亲选 AI 投影仪 Ultra 产品参数如下：京东荣耀亲选 AI 投影仪 Ultra2599 元直达链接2026 年数码家电政府补贴持续进行中，IT 之家为大家汇总国补领券地址，买数码家电之前记得领取。数码补贴：点此领券手机 / 平板 / 3C 数码支持 8.5 折政府补贴，不超过 6000 元的产品至高立减 500 元。家电补贴：点此领券多类家电支持 8.5 折政府补贴，单品至高补贴 1500 元。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/621.htm", "publishedAt": "2026-09-27T23:06:42+00:00"}, {"title": "目标让手机用十年：Linux 手机系统 postmarketOS 正式更名为 Nura", "summary": "IT之家 9 月 28 日消息，Linux 手机系统 postmarketOS 宣布项目正式更名为“Nura”，新的名称源自意大利撒丁岛古老的努拉吉（nuraghe）石结构建筑，寓意项目希望让智能手机长期保持可用。公开信息显示，postmarketOS 诞生于 2017 年，最初目标是让智能手机能够持续使用 10 年。该系统基于 Alpine Linux 开发，希望让受支持的手机在厂商停止提供系统更新后仍能继续运行。如今项目成立已经接近 10 年，开发团队决定正式更换沿用了多年的项目名称。在 9 月 27 日举行的项目会议上，开发团队宣布 postmarketOS 正式更名为 Nura。团队表示，随着项目不断发展，原有名称越来越难向新用户解释，同时在不同语言环境下也存在发音和记忆困难的问题。postmarketOS 的大小写方式也容易造成混淆。名称由小写的“p”和“m”以及大写的“OS”组成，因此用户经常采用不同的写法，例如“PostMarketOS”和“PostmarketOS”。此外，postmarketOS 这一名称本身也逐渐与项目现状不完全匹配。它容易让人理解为用户需要在已经购买的手机上自行安装该系统，但如今 PINE64 已经推出了预装 postmarketOS 的 PinePhone 等新设备。开发团队还希望新名称更加简洁，同时能够注册商标。团队表示，描述性较强的 postmarketOS 名称无法满足商标需求。经过约一年半的名称征集和筛选，团队从超过 300 个建议中最终选择了 Nura。“Nura”由社区成员 Davide Depau 提出，名称源自意大利撒丁岛的古老花岗岩建筑“nuraghe”。这些建筑已经屹立数千年，其长期存在的特点与项目希望延长电子设备使用寿命的理念相契合。团队目前已经提交 Nura 商标申请。随着更名完成，项目官方网站也从原来的域名迁移至“nura.eco”。团队选择“.eco”域名，是因为这一后缀与项目强调设备长期使用和环保的理念存在联系。除此之外，官方同步对项目 Logo 进行轻微调整。原有的箭头图案继续保留，但箭头之间增加了一些间距，以便在较远距离下能够更加清晰地识别。由于开发者仍在更新软件中的相关内容，用户目前可能仍会在部分系统组件和界面中看到“postmarketOS”这一旧名称。虽然名称发生变化，但 Nura 仍将延续 postmarketOS 最初的核心理念，即通过开源软件和长期维护，让智能手机等电子设备能够使用更长时间。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/620.htm", "publishedAt": "2026-09-27T22:59:29+00:00"}, {"title": "黑客在暗网兜售 AI 模型访问权限，最低价仅有正版 3%", "summary": "IT之家 9 月 28 日消息，据英国《金融时报》当地时间 26 日报道，非法获取 AI 模型和算力，正迅速成为网络犯罪黑市上最抢手的商品，黑客希望借助价格高昂的大模型实施勒索、网络战和间谍活动。谷歌威胁情报团队首席分析师约翰 · 霍特奎斯特披露，今年所谓“LLM 劫持”活动明显增多，具体表现于倒卖公开 AI 工具的被盗登录凭据，以及部分团体盗用他人算力，以免费运行自己的模型。从事网络安全工作 20 年的霍特奎斯特坦言：“我们在地下市场看到，一个围绕 AI 使用权限形成的经济体系在不断壮大。”霍特奎斯特警告，攻击者能够以低廉价格使用原本昂贵的 AI，从而在成本上占据优势，被攻击方为了防御同样需要使用这些 AI 工具。“归根结底，这些做法让他们在与我们对抗时拥有某种经济或效率优势，因为他们能以低得多的价格获得这些 token。”谷歌威胁情报团队研究人员发现，暗网市场出售 Anthropic、谷歌和 OpenAI 等公司的 AI 模型使用权限，折扣最高达到 97%。作为对照，ChatGPT 和 Claude 最高级版本的订阅价格则可达到每名用户每月 200 美元（IT之家注：现汇率约合 1,346 元人民币）。霍特奎斯特称，AI 实验室会监测滥用迹象，因此部分卖家甚至推出“保证访问”服务，承诺初始账户一旦遭到封禁，就不收取额外费用，直接提供新的登录凭据。还有一些犯罪团体和国家支持的组织会入侵企业托管在云端的服务器，再植入自己的 AI 模型，利用受害者的系统运行模型。这种手法类似于威胁行为者试图侵入第三方设备、借用设备算力挖掘加密货币。霍特奎斯特警告，越来越多大型企业希望把定制 AI 模型部署在自有服务器上，不再向云服务商租用算力，企业自行运行的 AI 系统也会随之成为攻击目标，因此必须严密保护。“如果你需要自己为算力付费，而且成本可能非常高…… 这部分算力就会成为威胁行为者眼中的重要潜在资源。”霍特奎斯特认为，企业仍在摸索究竟需要使用多少 AI，因此对黑客来说，当前正是“悄悄潜入”目标账户和计算机服务器的最佳时机。“你可能会觉得算力使用量突然大增是完全正常的事，因为你刚采用了这些 AI 基础设施。确实，这就是藏在噪声中的机会。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/619.htm", "publishedAt": "2026-09-27T22:57:05+00:00"}, {"title": "量子AI创业来了一支“清华梦之队”：10亿估值，用量子改造大模型底层", "summary": "", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/498633.html", "publishedAt": "2026-09-27T14:20:35+00:00"}, {"title": "预售 11.99 万起，北京现代艾尼氪 IONIQ V 车型 9 月 29 日上市", "summary": "IT之家 9 月 27 日消息，据汽车之家报道，北京现代旗下全新中型车 —— 艾尼氪 IONIQ V 将于 9 月 29 日完成上市。该车于 8 月 21 日的成都车展亮相，预售起价为 11.99 万元。IT之家附上艾尼氪 V 相关售价信息如下：标准版 540 Max：预售价 11.99 万元，CTLC 纯电续航 540 公里高端智驾版本 540 Max+：预售价 12.99 万元，CTLC 纯电续航 540 公里长续航 650 Max+：预售价 13.99 万元，CTLC 纯电续航 650 公里艾尼氪 V 设计均由现代中国设计中心全程主导，为中国用户量身定制，并反向输出全球。车辆提供赛博金、次元紫、伽马绿、磁力灰、光子白（素色漆）、光子白（哑光漆）、流光银、夜刃黑等 8 款颜色。整体采用极其前卫的轿跑溜背式造型，车身比例呈现低重心、宽体化的视觉效果。其车侧采用无框式车门，车尾为次元星轨尾灯样式。座舱方面，新车车内配备星云环抱式内饰设计，27 英寸超薄 4K 超大屏，星云光影氛围灯，赛博之眼 HUD。车辆深度融合 Momenta、高通 8295 芯片、宁德时代、文心大模型、火山引擎。规格方面，这款车型长宽 ，据外媒 The Verge 今天（28 日）凌晨报道，安全研究人员罗文 · 霍华德-琼斯称，今年 4 月至 6 月，OpenAI 智能体对联合国贸易和发展会议（UNCTAD）的统计网站发起了超过 16000 次扫描。这起事件还没有严重到 Hugging Face 遭黑客攻击或近期美国政府网站遇袭的程度，却再次引发了一个令人担忧的问题：AI 智能体为了完成任务，会突破通常的行为边界。霍华德-琼斯称，这些智能体很可能承担了通过 UNCTADstat API 获取生产能力指数（PCI）公开数据的任务。但智能体或无法直接调用 API，同时受 HTTP 工具本身的限制，也难以从 UNCTADstat 提取所需数据。据悉，智能体最终找到了绕过限制、从网站获取数据的方法，过程中仍出现了一些错误。随后，AI 的做法从寻找变通方案转向掩饰行为。智能体误以为这些错误来自一个并不存在的过滤器，认为请求遭到该过滤器拦截，因此开始隐藏自己的行为。据IT之家了解，最终，智能体发现可以利用谷歌的跨站脚本学习工具 XSS Game 来实现目标。为了获取联合国数据，这些智能体随后采取了越来越激进的手段。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/641.htm", "publishedAt": "2026-09-28T00:30:40+00:00"}, {"title": "吉利汽车集团副总裁李传海：目前行业缺少统一的 AI 治理标准，不仅抬高产业成本、也埋下安全隐患", "summary": "IT之家 9 月 27 日消息，2026 世界新能源汽车大会（WNEVC）于 9 月 22 日-24 日在海南海口举办。据睿见 Economy 报道，吉利汽车集团副总裁、吉利汽车研究院院长李传海表示，AI 在汽车领域的应用正在加速，但有一点值得行业警醒：目前行业缺少统一的 AI 治理标准，各家企业独立探索，标准不统一、接口不互通，不仅抬高了产业成本，也埋下安全隐患。因此我们真诚建议，全产业共同推动 AI 标准化治理，让技术创新有规可依、有标可循。这不仅关系产业健康发展，也是中国汽车在全球竞争中掌握话语权的关键。IT之家获悉，在李传海看来，新技术带来全新机遇，新能源与智能化正在重塑全球汽车技术体系，全球标准也迎来重构窗口期。从电池安全、充电接口，到功能安全、数据治理，中国已经积累完整的技术能力与产业实践，我们已经到了广泛参与、甚至主导全球标准治理的新阶段。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/007/563.htm", "publishedAt": "2026-09-27T10:29:06+00:00"}, {"title": "龙蜥社区SkillHub推荐系统正式发布，首批技能生态奖项揭晓", "summary": "9月23日，在2026云栖大会“AI Agent原生操作系统”分论坛上，龙蜥社区正式发布SkillHub推荐系统并举行颁奖仪式。阿里云智能集团研发副总裁、龙蜥社区理事长马涛，中兴通讯副总裁、龙蜥社区副理事长刘东，AMD全球副总裁Raghu Nambiar等嘉宾共同出席，标志着龙蜥社区SkillHub从技能汇聚走向质量评测与榜单推荐。 对AI原生操...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502738", "publishedAt": "2026-09-24T10:03:02+00:00"}, {"title": "AMD 市值破万亿，但靠的从来不只是 GPU", "summary": "AMD 的市值周一短暂突破了 1 万亿美元——对芯片设计公司来说，挤进这个俱乐部的屈指可数。但媒体对它评价仍是“永远处于劣势的一方”（perpetual underdog），因为在 AMD 头顶还压着英伟达这座近 5.5 万亿美元的市值高山，它只是把老对手英特尔（6400 亿）甩在了身后。 涨上去最直白的原因是搭上了 AI 这班车。AMD 入局...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502669/perpetual-underdog-amd-nips-joins-the-1t-club", "publishedAt": "2026-09-22T07:08:51+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "“第二代豆包手机”努比亚 Nav const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
