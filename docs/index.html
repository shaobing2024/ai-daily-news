预报模型。以甬江流域为例，以往开展一场完整的方案计算需要 5 到 10 分钟，如今 AI 预报模型仅需 5 到 10 秒，预报时效性从分钟级提升至秒级。根据降雨预报和水位变化，该模型每 5 分钟更新一次调度建议，调度员可据此实时调整下泄流量。在数字孪生调度平台上，皎口水库与其上游的周公宅水库实现了联合调度。IT之家从央视获悉，两座水库构成“梯级水库”，周公宅的泄流量直接影响皎口的水位。目前，宁波全市 16 座大中型水库已接入统一调度平台，实现市级、县级、水库管理单位三级联动。哪座水库接近汛限、哪座尚有库容，在大屏上一目了然。此外，皎口水库大坝内安装了上百个传感器和监测点，包括 121 个坝基渗流点、32 个测压管、19 组三向测缝仪，24 小时不间断向后台传输数据。平时无人机用于替代人工巡查，台风天则由人工加密巡查。宁波市水利部门数据显示，从 8 月 6 日至 11 日 10 时，全市大中型水库共增蓄水量 4.54 亿立方米。在保证水库防洪安全的前提下，居民供水得到充分保障。据央视报道，浙江省水利厅数字孪生平台已覆盖全省 1 万多个水文站，可在 2 分钟内自动生成防御方案。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/988/529.htm", "publishedAt": "2026-08-11T15:08:39+00:00"}, {"title": "消息称英伟达开发万亿参数开源 AI 模型 Nemotron 4，目标挑战全球顶级", "summary": "IT之家 8 月 11 日消息，今天（11 日）晚间，The Information 援引项目参与者消息称，芯片巨头英伟达正在研发新一代 AI 模型系列 Nemotron 4，希望借此与全球最先进的开源模型展开竞争。英伟达是美国少数主动推出开源模型的大型科技企业之一。今年以来，AI 开发和运行成本持续攀升，而价格更低的中国模型在性能上逐步逼近 Anthropic、OpenAI 等美国领先 AI 实验室的顶尖系统，使开源模型获得更多关注。近期接连披露的多起涉及自主 AI 智能体的黑客攻击事件，也进一步加大了外界对开源模型的关注，尤其是因为开源模型通常不会对网络安全用途施加限制。英伟达希望通过开放模型生态扩大 AI 应用范围，并进一步推动市场对其 GPU 算力的需求。英伟达生成式 AI 副总裁 Kari Briski 在邮件中透露：“投资 Nemotron，是因为我们相信每家企业、每个国家都需要可及的前沿开源模型。”多名参与 Nemotron 4 开发的员工透露，其中规模最大的模型预计至少拥有 1 万亿个参数。英伟达目前尚未确定 Nemotron 4 的发布日期，最终训练也尚未完成。不过报道称，员工认为该模型最早可能在今年秋末准备就绪。据IT之家了解，英伟达上个月还与多家企业成立联盟，共同开发并共享 AI 安全和网络安全工具。此外，英伟达与微软等科技巨头共同签署公开信，支持开放权重模型，以避免创新能力向海外转移。另外，英伟达还发布了 Nemotron 3.5 Lightning 模型，进一步扩充现有模型产品阵容，主要面向代码审查、工具调用、安全警报监控、回答账单问题等任务。英伟达同时推出开源模型路由库 NeMo Switchyard，可根据不同 AI 任务的需求，自动将任务分配给最合适的模型。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/988/524.htm", "publishedAt": "2026-08-11T14:54:16+00:00"}, {"title": "开源共生 先锋同行｜世界人工智能开源大赛（GOAI）全球六城巡回宣讲活动圆满收官", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/FisL2qoucPCr9v55Xpp8?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-11T12:34:19+00:00"}, {"title": "Claude 开始给生成内容打水印了，用户最担心的是代码", "summary": "Anthropic 宣布从 2026 年 8 月 2 日起，新发布的 Claude 模型将内置 AI 生成内容标记功能。两种技术：文本嵌入式水印和 C2PA 签名来源元数据。全球全场景覆盖，包括 API、Claude、Claude Code、Claude Cowo _source=rss&amp;utm_medium=article", "publishedAt": "2026-08-11T17:19:44+00:00"}, {"title": "为 Agentic Enterprise 实现 ROI：企业高管需要关注的 3 个关键因素", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/fe63sMOT127Pu7QpHP3a?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-11T17:19:14+00:00"}, {"title": "苹果 iOS 27 测试版出现 iCloud+ 限制变化，库克此前曾暗示将对高级 AI 功能收费", "summary": "IT之家 8 月 11 日消息，苹果今日发布了 iOS 27 第五个开发者测试版。有用户发现，该版本中出现了与 iCloud+ 订阅服务和 HomeKit Secure Video 相关的新提示，可能暗示苹果未来将针对部分高级功能进行收费。苹果 CEO 蒂姆 · 库克此前曾表示，部分 Apple Intelligence 功能未来可能会产生额外费用。不过，目前苹果尚未公布具体收费方案。根据苹果现行 iCloud+ 服务规则，50GB 套餐支持 1 个 HomeKit Secure Video 摄像头，200GB 套餐支持最多 5 个摄像头。而 2TB 至 12TB 容量的高阶套餐则不设限制。在 iOS 27 开发者测试版 Beta5 中，有用户发现 HomeKit Secure Camera 设置页面出现了与现有规则不同的提示。使用 2TB iCloud+ 套餐时，页面显示该账户仅支持 5 个摄像头。按照当前订阅规则，2TB 套餐应支持无限数量摄像头。用户 Stephen Robles 分享的另一张截图显示，系统提示“你的 iCloud+ 套餐包含 15 个摄像头的视频摘要功能”。而他订阅的是最高级别的 12TB iCloud+ 套餐，该套餐目前价格为每月 59.99 美元（IT之家注：现汇率约合 405.3 元人民币）。因此，上述变化可能是 iOS 27 测试版中的程序错误，也可能是苹果正在测试新的 iCloud+ 服务策略。目前尚无法确认苹果是否计划修改 HomeKit Secure Video 权益。相关阅读：《库克称苹果正评估算力成本，iOS 27 的 Siri AI 额度方案尚未敲定》《库克暗示苹果将为高频使用 AI 的 iOS 27 用户增加 iCloud+ 订阅层级》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/988/525.htm", "publishedAt": "2026-08-11T14:55:55+00:00"}, {"title": "蚂蚁首次投向机器人“指尖”！数亿元押注，全球首个物理交互脑发布", "summary": "资本正从具身本体集体涌向触觉", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/470674.html", "publishedAt": "2026-08-11T13:57:46+00:00"}, {"title": "比亚迪 2027 款海豹 06 家轿上市：天神之眼 B-辅助驾驶激光版、第二代刀片电池，9.99 万元起", "summary": "IT之家 8 月 11 日消息，比亚迪 2027 款海豹 06 今晚正式上市，该车定位“B 级满配家轿”，满电满油综合续航 2370km、搭载天神之眼 B-辅助驾驶激光版，上市价 9.99 万元起。2027 款海豹 06 EV630 旗舰型：15.59 万元；630 尊享型：14.29 万元；630 智享型：13.29 万元；530 尊享型：12.99 万元；530 智享型：11.99 万元；530 舒享型：10.99 万元。2027 款海豹 06 DM-i320 旗舰型：14.19 万元；320 尊享型：12.89 万元；320 智享型：11.89 万元；230 尊享型：11.99 万元；230 智享型：10.99 万元；230 舒享型：9.99 万元。外观方面，新车采用全新海洋美学，尺寸为 4870×1890×1495mm、轴距达到 2820mm，提供极汐绿、暖阳白、云海灰、雪域白、亚特兰蒂斯灰 5 种车色 + 暮色蓝、海盐灰 2 种内饰色，并配备 18 4.htm", "publishedAt": "2026-08-11T13:38:59+00:00"}, {"title": "网上中签率 0.018% 仅为长鑫 3.8%：“人形机器人第一股”宇树科技公布中签结果，超 978 万户参与申购", "summary": "IT之家 8 月 11 日消息，宇树科技今晚披露了首次公开发行股票并在科创板上市的网上摇号中签结果，中签号码共有 19414 个，每个中签号码可认购 500 股。宇树科技本次发行价格为 150.80 元 / 股，投资者中一签需缴款 7.54 万元。回拨机制启动后，宇树科技网上发行最终中签率为 0.01809759%。对比此前上市的另一只科创板热门新股长鑫科技，宇树科技的中签率明显更低。长鑫科技今年 7 月上市，网上发行最终中签率为 0.47141739%，刷新了科创板历史纪录。宇树科技的网上中签率约为长鑫科技的 3.8%。从申购数据来看，宇树科技本次网上发行有效申购户数为 978.46 万户，有效申购股数为 536.37 亿股，网上发行初步有效申购倍数约为 8288.82 倍。由于超过 100 倍，发行人与保荐人启动了回拨机制，将 323.6 万股从网下回拨至网上。回拨后，网上最终发行数量为 970.7 万股，约占扣除最终战略配售数量后发行数量的 30.00%。作为对比，长鑫科技网上有效申购户数约为 942.88 万户，有效申购股数约 8169.2 亿股。长鑫科技网上最终发行数量约占超额配售选择权全额行使后扣除最终战略配售数量后发行数量的 50.07%。按 2026 年以来 A 股新股上市首日平均涨幅 276.04% 测算，中一签宇树科技账面盈利有望突破 20 万元。宇树科技预计 2026 年上半年营业收入在 10.52 亿元至 11.28 亿元区间，同比增幅 35.62% 至 45.41%。相关阅读：《宇树科技今日启动申购，网上发行最终中签率约 0.0181%》《宇树科技今日启动申购：中签率远低于长鑫，中一签或赚 20 万》《大疆错失宇树数十亿市值引热议：曾是最大外部股东，2019 年退出》《宇树科技今日启动申购，A 股迎来“人形机器人第一股”》《王兴兴回应 DeepSeek 投资宇树：将在三方面开展重点合作》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/988/502.htm", "publishedAt": "2026-08-11T13:25:59+00:00"}, {"title": "李飞飞：AI 进入校园的最大风险，是可能削弱孩子的学习能力", "summary": "IT之家 8 月 11 日消息，据《商业内幕》今天（11 日）报道，被称为“AI 教母”的斯坦福大学计算机科学教授、World Labs 联合创始人李飞飞认为，AI 进入校园最大的危险并不是学生会利用 AI 作弊，而是 AI 会削弱学生的学习能力。李飞飞认为，最糟糕的结果，是年轻一代的自主性，以及作为人的学习和生活动力被工具夺走。“无论是人还是机器，都不应该夺走它。”如果 AI 使用不当，未来几代人可能会在“大脑没有得到充分发育”的情况下成长，但她同时警告，不应全面抵制 AI，禁止学生使用这些工具。“两种情况都让我担忧。无论是拒绝使用工具，还是夺走自主性和动力。”李飞飞还指出，如果学生已经投入学习，只是在遇到困难时需要帮助，AI 就可以成为强大的学习伙伴。她回忆道，在自己还是医学预科生时，曾在有机化学学习上遇到困难，当时助教的答疑时间有限，教授能够用于回答问题的时间也有限。李飞飞坦言，如果当时有 AI 工具，自己会提出多得多的问题。“我知道自己卡在哪里。我有学习的动力。我只是需要指导。”李飞飞表示，学校在思考如何使用 AI 时，应该以这种区别为依据。教育工作者不应只把 AI 视为作弊风险，而应该帮助学生利用 AI 更深入地学习各个学科，同时保留学生自身的好奇心和努力。“我们要找到一种办法，保留孩子和学生的动力与自主性，并且让他们能够使用这些工具，以正确的方式去使用。如果使用得当，AI 可以让未来的学生比我们聪明得多，因为他们获得了强大的能力加持。”IT之家从报道中获悉，牛津大学出版社去年发布的一份报告警告，AI 让学生学习速度变快的同时，学生的思考深度却出现降低趋势。麻省理工学院研究员娜塔莉娅 · 科斯米娜开展的另一项规模较小的研究发现，在写文章时能够使用生成式 AI 的人，随着时间推移，表现不如使用谷歌或完全不借助辅助工具的人。在另一项实验中，元科学研究组织 Possibility Institute 首席科学家维维恩 · 明发现，大多数用户使用 AI 是为了减少思考。", "sourceName": const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

  nav.innerHTML = html;
}

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";

    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
