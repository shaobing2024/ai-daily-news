21 寸大轮毂，都是普利司通静音轮胎。配备了蜻蜓大灯、光环尾灯等家族化语言，同时还有四款个性化饰板可选。内饰方面，该车一二排标配 16 点式座椅按摩，全车最多可选 4 个零重力座椅，一排可选标准按摩座椅 / 旋转座椅（带按摩功能）/零重力座椅。一排座椅支持电动旋转（支持小爱同学控制），在“对坐模式”下双人乘坐空间最大 1760mm、四人模式二排空间 1370mm，二三排极致后移，空间最大 1550mm。该车后排配备 3K 分辨率 21.4 英寸后排娱乐屏，支持海量儿童内容。中岛内置两个手机位、四个杯托、6.6L 容量、9L 独立压缩机冰箱，可滑动到第二排座位作为“多功能茶几”使用。全车提供 17 个空调出风口，配备 4890W 峰值功率 25 扬声器 7.1.4 声学架构音箱系统。N90 Max 搭载第三代骁龙 8 移动平台和英伟达 Thor 车载计算平台，车内支持超级小爱，提供车内动态音区语音交互、车外小爱语音边走边说等功能，可实现全场景互联互通。同时，新车还支持双 5G 双卡双通、Wi-Fi 7、IoT 通讯接口、内置 ETC 可免费激活。智驾方面，该车标配小米 HAD，搭载小米 XLA 认知大模型，满配辅助驾驶。同时小米澎程 N90 Max 新增后向固态激光雷达，测距精度可达 2cm。规格方面，N90 Max 尺寸为 5285mm x 1998mm x 1825mm、轴距 3080mm。搭载行业领先的超级增程系统，实现 CLTC 纯电续航 464km，CLTC 综合续航 1705km，WLTC 亏电油耗 6.26L/100km，支持 92 号、95 号、98 号汽油。15 分钟最长补能 285km，从 20% 充电至 80% 最快只需 18 分钟。此外，该车支持 220V 电源输出、6.6kW 对外放电，户外露营用电自由；增程器介入噪音低于 1 分贝，静音体验媲美纯电车；增程器首保后，3 年或增程器 3 万公里，保养 1 次。底盘方面，该车搭载前双叉臂 + 后多连杆独立悬架，配备双电机四驱动力，支持 310kW 峰值功率、0-100km/h 加速 5.9s、最高时速 190km/h。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/882.htm", "publishedAt": "2026-07-30T12:49:02+00:00"}, {"title": "瑞萨电子推出第三代 DDR5 MRDIMM 芯片组解决方案，支持 16000MT/s", "summary": "IT之家 7 月 30 日消息，瑞萨电子 (Renesas) 今日宣布推出其第三代 DDR5 MRDIMM（多路复用双列直插内存模块）芯片组解决方案。瑞萨的新款 MRCD（多路复用寄存时钟驱动器）RRG5013x 和新款 MDB（多路复用数据缓冲器）RRG5103x 均可满足未来 MRDIMM 实现 16000MT/s 超快传输速率对芯片组的要求，带来 25% 的代际内存带宽提升。第三代 MRDIMM 基于成熟的第二代产品架构，在扩展性能的同时保留了标准 DIMM 的外形尺寸和系统兼容性。此外，第三代产品还增强了系统的可视性与稳健性，包括设备均衡自训练模式（DESTM）的质量指示状态，该功能使用户能够微调时序和接收端均衡训练，从而最大化裕量。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/877.htm", "publishedAt": "2026-07-30T12:40:34+00:00"}, {"title": "小米澎程新车官宣搭载第三代骁龙 8 移动平台 + 英伟达 Thor 辅助驾驶计算芯片", "summary": "IT之家 7 月 30 日消息，在今晚的小米澎程技术发布会上，小米创办人、董事长兼 CEO 雷军宣布，澎程搭载第三代骁龙 8 移动平台和英伟达 Thor 车载计算平台，均采用先进的 4nm 制程工艺。据介绍，小米澎程配备了和 SU7、YU7 一样的顶尖智能基座，域控制模块四合一具备体积小、重量轻、能耗低的特性。这枚英伟达 Thor 辅助驾驶计算芯片支持 700TOPS 算力，搭载 NVIDIA Blackwell 架构，支持最高功能安全等级 ASIL-D。该车还搭载小米澎湃智能座舱，支持超级小爱，提供车内动态音区语音交互、车外小爱语音边走边说等功能，可实现全场景互联互通。同时，新车还支持双 5G 双卡双通、Wi-Fi 7、IoT 通讯接口、内置 ETC 可免费激活。IT之家从发布会现场了解到，小米澎程全系标配小米 HAD，搭载小米 XLA 认知大模型，满配辅助驾驶。同时小米澎程 N90 Max 新增后向固态激光雷达，测距精度可达 2cm。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/876.htm", "publishedAt": "2026-07-30T12:37:05+00:00"}, {"title": "欧盟委员会：ChatGPT 可能被纳入《数字服务法案》监管范围", "summary": "IT之家 7 月 30 日消息，欧盟委员会发言人托马斯 · 雷尼耶（Thomas Regnier）表示，ChatGPT 和 Roblox 都有可能被欧盟委员会列入《数字服务法案》（DSA）定义的“超大型在线平台（VLOP）”或“超大型在线搜索引擎（VLOSE）”名单。他表示，由于 ChatGPT 和 Roblox 公布的用户数量均已超过《数字服务法案》规定的门槛，因此被指定为超大型在线平台“完全有可能”，相关决定“可能会在未来某个时间作出，或早或晚”。据IT之家了解，根据《数字服务法案》，一旦被列入超大型在线平台或超大型在线搜索引擎名单，相关企业就必须遵守欧盟规定的一系列更严格的规则和义务，包括风险评估、内容审核、透明度报告以及其他监管要求。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/873.htm", "publishedAt": "2026-07-30T12:30:53+00:00"}, {"title": "研究显示：AI 聊天机器人实施情感诈骗的能力已超越人类", "summary": "IT之家 7 月 30 日消息，网络恋爱诈骗是互联网世界中历史最悠久的骗局之一，但至今仍不断有新的受害者上当。由四所大学联合开展的一项研究显示，如今 AI 聊天机器人实施这类诈骗的效果甚至已经超过真人，这一结果令人担忧。如今，恋爱诈骗通常始于交友软件。骗子会使用极具吸引力的个人资料，扮演一位热情主动、各方面都符合受害者理想对象标准的追求者。随后，骗子会与受害者进行长时间的线上交流，这一过程通常持续数月。他们往往以“长期在海外出差”或“人在国外旅行”为借口，解释为什么无法尽快见面。当双方建立起足够的信任后，骗局通常会进入两个方向之一：一种是骗子谎称遭遇突发状况，急需资金摆脱困境；另一种则是向受害者炫耀自己投资获利丰厚，并诱导对方向虚假的加密货币投资项目转账。据IT之家了解，这类骗局被称为“长期骗局”（Long Con），因为其依赖于长期建立信任关系，骗子往往会连续数月每天与受害者聊天。虽然这种方式看起来需要投入大量时间，但实际上，这类诈骗通常由位于柬埔寨、缅甸和老挝等国的诈骗园区实施，参与者大多收入微薄，甚至有人是被拐卖后被迫从事诈骗活动。据《Wired》报道，这项研究由印度阿姆里塔大学（Amrita Vishwa Vidyapeetham）、意大利威尼斯福斯卡里大学（Ca' Foscari University of Venice）、澳大利亚墨尔本大学以及以色列内盖夫本-古里安大学（Ben-Gurion University of the Negev）的研究人员共同完成，测试对象包括 ChatGPT、Claude 和 Gemini 等 AI 聊天机器人。研究人员让 AI 聊天机器人与真人骗子分别参与模拟恋爱诈骗流程，更准确地说，是模拟诈骗前期通过长期聊天建立信任，并最终诱导受害者投资虚假项目的过程。研究结果显示，AI 聊天机器人表现得极为出色，不仅成功伪装成真人，在部分指标上的表现甚至超过了实验中的真人“骗子”。参与实验的受试者并不知道研究的真正目的，他们始终认为自己聊天的对象是真人，无论实际对方是 AI 还是人类。研究人员通过主观评价和客观测试两种方式衡量双方建立信任的程度。当聊天进行到最后，研究人员以“下载一款应用程序”等请求测试受试者时，由真人逐步建立信任关系的情况下，仅有 18% 的受试者同意；而当聊天对象实际上是 AI 时，这一比例接近一半。此外，当受试者被要求评价自己对聊天对象的信任程度时，AI 聊天机器人获得的评分也明显高于真人。《Wired》就研究结果联系了 Anthropic、OpenAI 和谷歌。OpenAI 和谷歌均未作出回应，而 Anthropic 发言人在声明中表示，公司政策明确禁止利用 Claude 从事诈骗或冒充真人等行为，同时也部署了多项技术防护措施，以防止诈骗分子利用 Claude 实施欺诈。研究人员认为，这项研究最令人担忧的地方在于，如果诈骗团伙用 AI 聊天机器人取代真人客服，诈骗中心的运作规模将实现大幅扩张。AI 骗局机器人可以同时与数千名潜在受害者展开对话，而无需大量人力。只有在最后一步，即诱导受害者转账汇款时，诈骗团伙才可能需要真人介入，以绕过 AI 系统自身设置的安全限制。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/865.htm", "publishedAt": "2026-07-30T12:09:33+00:00"}, {"title": "小米昆仑技术架构供应商公布：东安动力、英伟达、高通骁龙等", "summary": "IT之家 7 月 30 日消息，在正在进行的小米澎程技术发布会上，小米创始人兼 CEO 雷军介绍了“小米昆仑技术架构”，其中包含小米昆仑平台、小米昆仑超级增程、小米昆仑全域安全。据介绍，小米汽车的第二个产品系列 ——Skynomad 小米澎程，在 2023 年初正式立项，历时 3 年，团队从头打造了一个全新的平台架构 —— 小米昆仑技术架构。作为「智能可变大空间 SUV」的技术基座，小米昆仑技术架构包含三大核心技术：小米昆仑平台，纯平地板、方正格局、超长座椅滑轨；小米昆仑超级增程，超长续航里程、超低亏电油耗、用车养护很省心；小米昆仑全域安全，搭载铠甲笼式车身，全方位守护整车安全。据官方透露，小米昆仑技术架构核心零部件全部来自国内、国际优秀供应商，官方海报显示有东安动力增程器、中国中车前电驱总成、英伟达 NVIDIA DRIVE AGX Thor、骁龙 8 Gen3 SoC、禾赛激光雷达、速腾聚创后向固态激光雷达、拓普空气弹簧、博世智能集成制动控制系统等等。关于本次发布会的更多消息，IT之家稍后带来。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/858.htm", "publishedAt": "2026-07-30T11:54:44+00:00"}, {"title": "安全公司 Check Point：OpenAI 旗下 ChatGPT 首次进入“最常被冒充品牌前十名”榜单", "summary": "IT之家 7 月 30 日消息，安全公司 Check Point 公布了《2026 年第二季度网络钓鱼冒充品牌研究》，本季度 OpenAI 旗下的 ChatGPT 首次进入“最常被冒充品牌前十名”榜单，这显示越来越多黑客开始瞄准 AI 领域，通过伪装成热门 AI 工具实施网络犯罪。IT之家参考报告获悉，微软仍是最常被冒充的品牌，占所有同类钓鱼攻击活动的约 23%；排行第二位为领英，占比 11.6%；排行第三位为谷歌，占比 6.7%；排行第四位为苹果，占比 5.8%；而 ChatGPT 排行第十，占比 1.1%。▲ 黑客冒充 OpenAI 发送的钓鱼邮件案例Check Point 表示，如今随着越来越多用户开始将 AI 工具用于工作和日常生活，未来几个季度可能会有更多 AI 平台进入“最常被冒充品牌排行榜”，这些 AI 平台对于攻击者而言，已经逐渐具备与大型银行和科技企业相同的吸引力，成为高价值攻击目标。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/845.htm", "publishedAt": "2026-07-30T11:23:40+00:00"}, {"title": "IBM 宣布已进入“量子优势”时代，结果可验证", "summary": "IT之家 7 月 30 日消息，IBM 今日表示，其研究已经证明了“量子优势”（quantum advantage）—— 即量子计算机能够完成超越传统计算机能力范围的计算任务，并且这些结果可以经过严格验证。这项研究成果标志着量子计算这一新兴技术向实际应用迈出了重要一步，相关发现发表在 IBM 及其研究合作伙伴共同撰写的三篇论文中。合作方包括芝加哥大学、日本理化学研究所（RIKEN）以及量子计算软件公司 Qedma、BlueQubit 和 Algorithmiq。IBM 研究部门负责人 Jay Gambetta 表示：“我们已经进入量子优势时代。科学家可以相信这些结果。现在，量子计算正在从人们对系统进行性能测试，转向利用这些系统开展科学研究并探索实际应用。”IT之家注意到，这一消息发布之际，IBM 正在努力证明其量子计算业务未来能够实现盈利。本月早些时候，由于公司发布盈利预警，IBM 股价创下历史最大跌幅。IBM 当时表示，客户支出正在从传统软件转向 AI 硬件和存储芯片领域，公司第二季度的软件和基础设施业务表现低于预期。此后，IBM CEO 阿尔温德 · 克里希纳（Arvind Krishna）对公司未来发展表达了乐观态度。他认为，量子计算将在未来几年开始推动 IBM 增长。克里希纳此前接受《华尔街日报》采访时表示，IBM 在量子领域的先发优势，可能会像英伟达凭借 GPU 先发优势获得成功一样，改善公司的发展前景。IBM 正面临来自微软、谷歌等科技巨头的竞争，同时也要应对量子计算领域大量初创公司的挑战。不过，IBM 并不是第一家宣布实现量子优势的企业。量子计算公司 D-Wave 去年曾宣布达到这一目标，谷歌也在去年 10 月表示实现了“可验证的量子优势”。但 Gambetta 表示，IBM 最新发布的论文值得关注，因为它证明了相关结果是可以被验证的。他说：“他们采用了一些方法，确保量子计算机执行的计算能够产生正确结果。”例如，在 Qedma 与 IBM 联合发表的论文中，两家公司展示了如何利用量子计算机探索材料物理学，并表示相关结果通过多种方式得到了验证，其中包括在 Quantinuum 量子计算机上的验证。Gambetta 表示：“可以把它看作是在量子计算机上展示的一种新物理现象，而传统计算方法无法完成这样的任务。”与传统计算机不同，传统计算机的计算结果通常可以通过在其他计算机上重复运行相同任务进行验证，而一些量子计算机产生的结果已经超出了经典计算机能够验证的范围。研究机构国际数据公司（IDC）专注量子计算的分析师 Heather West 表示，这也是 IBM 此次宣布具有重要意义的原因之一。她认为，能够复现量子计算机的计算结果，说明这些系统正在变得更加可靠和稳定。今日的消息也意味着 IBM 在实现容错量子计算机的道路上又进一步。此前，IBM 曾承诺将在 2029 年实现这一里程碑。不过，对于企业而言，最重要的问题仍然是量子计算机是否能够真正解决实际问题，例如优化计算，以及推动材料科学、医学等领域取得突破。Gambetta 表示，IBM 最新研究成果正是朝这一方向迈出的重要一步。他说：“拥有一个可信赖的基础，才能开始开展应用研究。随着我们不断推出能力更强的机器，这将帮助我们扩大应用规模，使其解决真正具有商业价值的问题。”IDC 分析师 West 将 IBM 的成果称为“迈向利用量子系统解决超越经典计算能力限制的复杂问题道路上的又一个里程碑”，并认为这进一步巩固了 IBM 在量子计算市场中的重要地位。不过，West 表示，实现量子优势不会是某一个决定性的瞬间，也不会像 ChatGPT 发布后引发人工智能热潮那样迅速改变整个行业。她补充道：“未来我们还会看到更多基于这些成果的进一步突破。也许一个月后、六个月后或一年后，当前这些发现会被更加先进的研究成果超越，而这正是科学发展的正常方式。”IBM 表示，公司欢迎围绕量子优势展开讨论。Gambetta 也预计，科学家将提出新的经典计算方法，并与 IBM 的研究结果进行比较。他说：“我不会说这些结果是绝对无懈可击的。真正发生变化的是，我们已经进入了一个能够获得可信结果的阶段，因此科学界可以围绕这些结果展开讨论。未来几年，这将主要成为一场科学领域的讨论，就像人工智能领域过去利用 GPU 研究神经网络时，在大学中展开的讨论一样。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/841.htm", "publishedAt": "2026-07-30T11:08:03+00:00"}, {"title": "首个突破90%成功率的桌面操作智能体！从堆模型到拼工程，实在Agent登顶OSWorld双冠", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/4hUcQzeCeKm0wqkc4Zdc?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-30T10:33:33+00:00"}, {"title": "欧盟计划投资 100 亿欧元建设 7 座 AI 超级工厂，发力追赶中美", "summary": "IT之家 7 月 30 日消息，欧盟委员会当地时间周四表示，欧盟将提供 100 亿欧元（IT之家注：现汇率约合 773.81 亿元人民币）资金，支持企业建设 7 座 AI 超级计算工厂，以缩小其与美国和中国在人工智能领域的差距。欧盟委员会表示，希望这些公共资金能够进一步吸引 200 亿欧元（现汇率约合 1547.61 亿元人民币）的私人投资。欧盟委员会表示，已同 AMD、英伟达和高通签署意向书，以确保 AI 超级工厂联合体能顺畅获取所需硬件设备。负责科技主权事务的欧盟委员会执行副主席亨娜 · 维尔库宁（Henna Virkkunen）表示：“随着 AI 发展速度不断加快，获得 AI 超级计算工厂所提供的大规模计算能力，对于欧洲来说已经成为一项战略需求。”近年来，欧盟推动建立“科技主权”的努力变得更加紧迫。欧洲各国领导人担心对外国技术供应商的依赖，认为这些技术可能被“武器化”并用于对抗欧洲。美国总统唐纳德 · 特朗普曾多次批评欧盟的科技监管政策。目前，企业已经可以参与相关项目竞标，建设这些 AI 超级计算工厂。这些工厂计划至少配备 10 万颗最先进的 AI 芯片，其计算能力预计约为目前欧盟境内运行的数据中心的 4 倍。当这 7 座超级计算工厂投入运营后，欧洲现有的计算能力将实现翻倍以上增长。目前，欧盟的计算资源主要由遍布芬兰至西班牙的 19 个 AI 数据中心提供。根据美国联邦储备委员会（美联储）2025 年的一项评估，在 AI 发展的关键领域，欧洲远远落后于美国和中国。中国拥有庞大的数据中心供电能力，而美国则占据了全球大部分私人 AI 投资。欧盟委员会 6 月提交给欧洲议会的一份报告指出，欧洲并不生产数据中心所需的大量关键零部件，同时欧盟电力成本可能达到美国和中国的两倍甚至三倍。该报告称：“欧洲企业和公共机构将继续依赖美国 AI 服务提供商，这将损害那些努力追赶前沿技术的欧洲本土服务商。”报告指出，欧盟排名前五的云服务提供商全部来自美国。报告还警告称：“对超大规模云计算和 AI 计算服务提供商的依赖，尤其是在高度关键的应用场景中，将继续使数据面临第三方国家访问风险，同时也可能影响服务连续性，威胁欧洲的运营自主能力。”法国 AI 公司 Mistral AI 目前正在巴黎总部园区运营欧洲规模最大的 AI 数据中心之一。该公司开发了 Le Chat 聊天机器人，但其发展速度仍未赶上美国 AI 企业，例如 ChatGPT 开发商 OpenAI，以及中国竞争对手 DeepSeek。尽管法国总统埃马纽埃尔 · 马克龙等欧洲政治领导人多次警告欧洲缺少本土 AI 龙头企业，但整个欧洲大陆对于这项新兴技术可能带来的经济冲击和隐私问题仍存在强烈担忧。欧盟委员会表示，依托不断扩大的数据中心网络开发出的 AI 产品，将“遵守欧盟在数据保护、安全、防护以及伦理方面的标准”。这一表述可能涉及欧盟现有的《数字服务法案》（Digital Services Act）和《数字市场法案》（Digital Markets Act）。今年 6 月，全球约 40 名城市市长签署了一项协议，呼吁限制 AI 数据中心建设对城市自然资源、能源价格以及气候目标带来的负面影响，涉及城市包括美国菲尼克斯和澳大利亚墨尔本等。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/814.htm", "publishedAt": "2026-07-30T10:33:22+00:00"}, {"title": "OpenAI CEO 奥尔特曼：过度依赖 AI 或致人类认知能力衰退", "summary": "IT之家 7 月 30 日消息，OpenAI CEO 萨姆 · 奥尔特曼表示，人工智能（AI）一个被低估的风险是，人们可能会过度依赖这项技术来完成思考，从而导致自身的思维能力逐渐退化。在当地时间周二播出的《Invest Like the Best》播客节目中，当被问及 AI 领域目前最重要、尚未解决的问题时，奥尔特曼表示：“我认为没有得到足够关注的一个问题是，我们将如何避免认知能力衰退？”他进一步说道：“我们将如何使用这些工具，同时确保自己能够不断锻炼大脑，持续理解那些真正重要的事情？”奥尔特曼发表这一观点之际，越来越多研究人员开始警告，虽然 AI 可以提升工作效率，但也可能削弱人们原本具备的职业技能和认知能力。“从来没有任何一种工具像这样，让我们有机会把思考过程交给它完成。”麻省理工学院（MIT）研究人员 Nataliya Kosmyna 本月早些时候接受 Business Insider 采访时表示。她进行的一项初步研究发现，使用生成式 AI 撰写论文的人，随着时间推移，其表现反而不如使用谷歌搜索或完全不借助工具的人。理论神经科学家、AI 研究人员 Vivienne Ming 曾将人们因为 AI 可以代替完成任务而放弃认知劳动的风险称为“慢性替代”（chronic substitution）。她上个月表示，反复依赖 AI 替代思考过程，可能会削弱人的认知储备，而认知储备是抵御痴呆症的重要防线。随着 AI 工具的能力不断提升，这些担忧变得更加突出。如今，AI 已不再只是用于回答问题和生成文本，而是开始承担越来越复杂的工作，包括文件审查、研究分析、客户支持以及编程等任务。IT之家注意到，奥尔特曼并不是唯一一位担忧 AI 对人类认知能力产生影响的科技行业领导者。去年，法国 AI 公司 Mistral AI CEO Arthur Mensch 在接受《泰晤士报》采访时表示，AI 最大的风险可能是导致劳动者“技能退化”（deskilling）。随着人们越来越依赖 AI 搜索信息，人类可能会逐渐变得更加懒惰。不过，在此次播客采访中，奥尔特曼对于 AI 的未来仍然保持更加积极的态度。他描述了一个“非常神奇”的未来场景：个人 AI 助手可以全天候运行，阅读各种文件、旁听会议、回忆几周前的邮件内容，并利用夜间闲置算力生成创意，同时主动建议用户下一步应该采取什么行动。但他也表示，即使是功能强大的 AI 模型，可能仍然难以复制那些让人类与众不同的能力。他说：“这个世界可能需要创造一个新的词，来描述人类非常擅长、但 AI 似乎仍然非常难以真正掌握的那种判断力。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/812.htm", "publishedAt": "2026-07-30T10:21:24+00:00"}, {"title": "一汽-大众 ID.AURA T6 纯电 SUV 开启盲订：小鹏联合研发 CEA 电子电气架构、宁德时代电池", "summary": "IT之家 7 月 30 日消息，今日，一汽-大众 ID. AURA T6 在佛山举办“挚友抢先品鉴会”，并同步开启盲订通道。作为一汽-大众智电 2.0 时代的首款产品，新车定位纯电中型 SUV，此次盲订公布了具体权益，但售价及完整配置尚未公布。据官方介绍，本次盲订权益包括：99 元订金可膨胀为 2000 元购车抵扣款；大众集团与一汽集团的老用户，增换购可额外享受 5000 元专项补贴。此外，盲订用户下单即可在 App 内获得专属电子勋章，成功购车后另有同款实物勋章相赠，并有机会受邀参加上市发布会、走进工厂参观。IT之家注意到，ID. AURA T6 提供云雀灰、初雪白、贝珠白、星河蓝、远山绿、烟霞紫等六款车身颜色，内饰方面则提供云影灰、绒光米、蜜光橙三种配色，搭配大面积亲肤材质。空间上，新车得房率为 85.3%，并配备一键成床、女王副驾、小桌板等功能。车身尺寸上，该车长宽高为 4811/1879/1648mm，轴距为 2836mm。新车搭载由本土团队主导研发、面向中国市场打造的中央计算 + 区域控制：大众与小鹏联合研发 CEA 电子电气架构，支持整车 OTA，并具备哨兵模式、远程控车、智能进入等功能。新车搭载 192 线激光雷达、420TOPS 高阶智驾、宁德时代电池，全系标配 4nm 智舱芯片等高端配置。硬件方面，新车配备 4nm 工艺智舱芯片，算力约 20TOPS，官方称其性能比肩行业第一梯队，可稳定支持端侧大模型部署。交互层面，ID. AURA T6 首创多模态 AI 智能桌面，可主动学习用户使用习惯并预判需求。依托端侧大模型与云端大模型（DeepSeek、豆包、千问等），新车 AI 用车助手支持用车百科问答、保养预约、充电规划等功能；AI 出行管家可智能推荐沿途吃喝玩乐、按语义定制行程，并支持沿途景观识别与停车记忆。此外，该座舱还可实现乘员识别、遗留物品提醒、AI 睡眠关怀等功能，并支持四音区识别、多方言对话与声音克隆。视听硬件方面，新车配备 15.6 英寸 2.5K 中控屏、25.8 英寸 AR-HUD 及 10.25 英寸全液晶仪表；音响系统为 18 扬声器杜比全景声（后期 OTA 开放），外置功放最大功率 920W，支持 7.1.4 全景声。生态方面，新车支持 8 大类 23 个主流应用，覆盖娱乐、出行、生活等场景；手车互联支持 CarPlay、HiCar、CarLink 三大方案，官方称兼容几乎所有的手机品牌。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/807.htm", "publishedAt": "2026-07-30T10:09:43+00:00"}, {"title": "轻量化异构双臂 x VLA/世界模型：家庭服务具身机器人的落地实践｜AICon深圳", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/SZaGmZI0g7INLtxalmvi?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-30T10:00:00+00:00"}, {"title": "Claude Code之父：Harness const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
