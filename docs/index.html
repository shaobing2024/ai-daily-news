B 端口，此前被藏在卫生纸中，约于 9 月 28 日安装，内部含有加密数据。美国司法部称，该会议室经常用于讨论 OpenAI 专有研究、产品计划、技术能力、业务关系及政府合作等机密信息。监控录像显示，Alfozan 多次出现在会议室附近，但未被授权参加该会议室的会议。起诉书称，Alfozan 还使用一款生产力工具搜索 OpenAI 的办公室、会议室、高管位置及会议安排。与 Alfozan 配偶关联的聊天机器人账户，则被用于询问连续录音、修改 Wi-Fi 连接、实时监听及加密 SD 卡等事项。美国司法部指控，该聊天机器人账户在 9 月 27 日至 28 日期间提交了与涉案录音设备相关的提示，内容包括设备自定义标头和唯一 MAC 地址。10 月 5 日，监控录像还显示 Alfozan 返回会议室并查看电视机后方。OpenAI 公司已解雇该员工，并将事件移交 FBI 调查。OpenAI 同时表示，目前没有迹象表明该员工不当访问或外泄模型权重、源代码或客户数据。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/653.htm", "publishedAt": "2026-10-14T00:40:48+00:00"}, {"title": "黄仁勋又出手了，英伟达拟再砸 20 亿美元加码欧洲 AI", "summary": "IT之家 10 月 14 日消息，据彭博社报道，英伟达 CEO 黄仁勋在欧洲访问期间宣布，公司计划追加 20 亿美元（IT之家注：现汇率约合 134.1 亿元人民币）投资。此次欧洲之行还包括与法国总统埃马纽埃尔 · 马克龙会晤。当地时间 13 日，黄仁勋透露，英伟达过去一年在欧洲投资 80 亿美元（现汇率约合 536.4 亿元人民币），此次将在此基础上继续增加投资。他还宣布向法国四家初创企业 Doctolib、Genesis AI、Pigment 和 Entalpic 注资。作为全球最大的 AI 芯片制造商，英伟达承诺在世界各地投资数千亿美元，希望加快 AI 技术的普及，同时带动自身产品的需求增长。黄仁勋访问欧洲之际，公众对 AI 的反对声音日渐高涨。人们不仅担心 AI 模型失控，也担忧耗电量巨大的数据中心对环境的影响，要求限制 AI 发展的呼声随之增加。欧洲和英国则希望参与制定防范措施，减少 AI 可能带来的危害。黄仁勋在欧洲之行首站巴黎的一场活动上直言：“欧洲必须加入这场竞争。”接下来，他还将访问伦敦和柏林。英伟达称，黄仁勋与马克龙会晤时，双方讨论了英伟达在法国的投资，以及开源软件和 AI 安全等议题。黄仁勋一直主张欧洲通过发展开源模型追赶美国的先进 AI 技术，因其使用成本可以更低，也更方便根据不同需求进行调整。“开放模型很重要，因为可以根据不同语言以及技术自主权的需要进行定制。”英伟达是法国 Mistral AI 的重要合作伙伴。Mistral 开发的是开放权重模型，即公开模型参数，让其他开发者能够自由使用和修改。英伟达不仅投资了 Mistral，还向其数据中心供应 AI 加速芯片。Mistral 利用 4000 颗 Grace Blackwell 芯片训练了最新模型 Le Chonk。黄仁勋近期的投资也着重推动开源模型的研发和普及，希望让 AI 在全球经济中得到更广泛的应用，并降低市场对少数科技巨头产品的依赖。黄仁勋还宣布向法国四家初创企业 Doctolib、Genesis AI、Pigment 和 Entalpic 注资。Doctolib 是法国最知名的初创企业之一。自 2013 年成立以来，Doctolib 为医生和其他医务人员提供行政事务管理服务，也成为许多欧洲患者预约就诊的常用平台。Pigment 主要开发 AI 企业管理软件，Entalpic 则将 AI 用于化学和材料研究。Genesis AI 专注于机器人 AI 技术。黄仁勋预计，以人形机器人为代表的物理 AI 将成为英伟达技术的下一个巨大市场。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/651.htm", "publishedAt": "2026-10-14T00:30:26+00:00"}, {"title": "印度软件巨头印孚瑟斯董事长尼勒卡尼：AI 正推动业务增长，就业担忧纯属无稽之谈", "summary": "IT之家 10 月 14 日消息，据彭博社报道，印度知名科技企业家、印孚瑟斯董事长南丹 · 尼勒卡尼不认同 AI 会造成大规模失业的担忧。他认为，AI 反而能为小企业注入活力，催生新的技能需求。现年 71 岁的尼勒卡尼，是印孚瑟斯七名联合创始人之一。他在新德里举行的彭博创新经济论坛上指出，虽然编程等工作越来越多地可以由 AI 完成，但技术应用和风险管理也会创造新的就业机会。与此同时，他斥责 AI 将取代人类就业的说法“纯属无稽之谈”。尼勒卡尼认为，确保 AI 安全可靠运行将创造新的工作岗位。“企业转型不只是写代码。70% 的工作涉及治理、变革管理、企业转型和安全防护。怎样防止 AI 机器人产生幻觉？又该怎样防止 AI 智能体失控？”他进一步指出，新岗位则主要集中在了解客户需求、协调合作、组织人员共同工作等方面。印孚瑟斯等印度软件外包巨头长期依靠大量工科毕业生为全球客户编写程序。随着 OpenAI、Anthropic 等企业的 AI 模型编程能力不断提升，传统的软件外包模式受到冲击。尼勒卡尼也承认，编程工作逐渐实现自动化，但技术在整个服务项目中只占很小一部分。“所谓 AI 导致失业，不过是为了迎合大资本利益而炒作的灾难论。我们这类企业面临的业务需求实际上比以往任何时候都大，因为企业转型非常复杂，而 AI 要求企业从根本上重新思考经营方式。”投资者却没有表现出同样的信心。IT之家从报道中获悉，随着 AI 编程工具不断升级、功能日益强大，股东对印孚瑟斯争取新业务的能力愈发担忧。过去两年，印孚瑟斯股价累计下跌约 45%。当地时间周二，印孚瑟斯股价上涨 3.2%，竞争对手塔塔咨询服务上涨 6.2%。尼勒卡尼说：“我们只会有越来越多的业务。当然，各家公司也必须做好准备，推动自身转型，帮助员工学习新技能，并建立新的业务能力。这些确实都需要做到，但也意味着未来还有更多工作要做。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/648.htm", "publishedAt": "2026-10-14T00:16:56+00:00"}, {"title": "扎克伯格：Meta 承诺数千亿美元豪赌 AI，却一度对能否成功完全没把握", "summary": "IT之家 10 月 14 日消息，据彭博社今天（14 日）凌晨报道，Meta CEO 马克 · 扎克伯格透露，去年公司还不知道旗下 AI 产品能否成功，就不得不承诺投入数千亿美元，建设运行这些产品所需的基础设施。扎克伯格在最新《Cheeky Pint》播客中回忆，自己曾对 Meta 首席 AI 官汪滔（Alexandr Wang）说：“我们得掏出一笔钱，我也说不准是 1,000 亿美元（IT之家注：现汇率约合 6,705.82 亿元人民币）还是 2,000 亿美元（现汇率约合 1.34 万亿元人民币）。你确定这能成功吗？”Meta 一直难以说服投资者接受 AI 投资带来的支出激增，扎克伯格的这番话也透露出公司当时面临的不确定性。尽管他多次强调，巨额投资最终会得到回报，但股东越来越担心 Meta 的营收和利润能否增长得足够快。两个多小时的访谈中，扎克伯格和汪滔透露，Meta CFO 苏珊 · 李曾多次提醒他们，一旦投资失败，代价将极其高昂。扎克伯格对汪滔说：“我觉得苏珊有点吓到你了。”汪滔回忆：“每次谈起这件事，我们都会开玩笑说：‘嗯，但愿一切顺利，最后能有个好结果。’”面对如此巨额的投资，他最多只能凭直觉谈谈团队的研发进展，根本无法保证项目一定成功，当时能否成功完全没有把握。扎克伯格坦言，自己并不知道消费者会如何看待 Muse：“我们原本觉得，比较有可能的情况是：‘好吧，产品推出后大概还得改进一番。’”为了在先进 AI 模型和产品的研发竞赛中与谷歌母公司 Alphabet、OpenAI 及 Anthropic 等美国科技企业抗衡，Meta 投入了数千亿美元。在 AI 数据中心建设方面，Meta 的投入也位居科技行业前列。投资者将在下周再次了解 Meta 的财务状况。公司定于 10 月 21 日股市收盘后公布业绩。上季度，随着数据中心和智能眼镜业务的支出持续增加，Meta 的自由现金流降至多年来最低水平，股价因此下跌 8%。截至当地时间周一收盘，Meta 股价今年以来累计上涨超过 12%。相关阅读：《Meta 发布 Muse Wonder 模型，扎克伯格称公司已在 AI 前沿领域追上竞争对手》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/640.htm", "publishedAt": "2026-10-13T23:48:09+00:00"}, {"title": "AI 长视频时代来临：OpenAI GPT-6 Astra 助力生成时长从 1 分钟提升到 10 分钟", "summary": "IT之家 10 月 14 日消息，OpenAI 公司今天（10 月 14 日）发布公告，宣布和 AI 视频生成平台 Higgsfield 达成最新合作进展。在接入 GPT-6 Astra 后，Higgsfield 支持生成的 AI 视频时长上限从 1 分钟提升到 10 分钟。IT之家附上官方介绍视频如下：GPT-6 Astra 支持创意智能体调用外部工具，处理 3D 建模等复杂工作。Higgsfield 表示，该能力用于维持长视频在角色、场景和视觉细节上的一致性，是长视频生成的关键难点。Higgsfield 已将相关流程用于其 YouTube 频道。该频道拥有近 50 万订阅者，团队借助 GPT-6 Astra 生成超过 10 分钟的教学视频，减少此前所需的大量人工制作工作。在图像方面，Higgsfield 集成 GPT-Image-2.5。公司称该模型可在图像上稳定渲染可读文字与信息图，帮助小型企业以较低制作成本生成宣传素材。Higgsfield 还使用 OpenAI 的 Codex 加速产品开发。该公司拥有约 200 名创意人员和 100 名工程师，创意人员可借助 Codex 将想法转化为软件原型，并减少前端与后端工程师的介入。Higgsfield 同时披露下一阶段方向：基于 GPT-Live-1 探索“语音到视频”创作。用户可口头描述创意，由 AI 理解语音意图并实时生成视频内容。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/639.htm", "publishedAt": "2026-10-13T23:44:48+00:00"}, {"title": "AI 重新编译、修改游戏获夏尔马“点赞”，微软成立 XBOX Labs 新团队", "summary": "IT之家 10 月 14 日消息，随着 AI 辅助游戏修改和重新编译技术迅速兴起，微软成立了 XBOX Labs 团队，探索新技术在游戏开发中的应用。最近几周，越来越多 Mod 制作者利用 Claude 最新的 Opus 5.5 模型，将不同游戏的内容混合在一起，例如让马力欧在《艾尔登法环》中体验平台跳跃玩法，甚至将《使命召唤》移植到网页浏览器中运行。据外媒 VGC 报道，当地时间 13 日，XBOX CEO 阿莎 · 夏尔马在致员工的内部信中指出，AI 生成游戏内容的热潮正在改变人们对游戏开发边界的传统认识。为此，微软成立了一个专门探索新技术和新创意的团队。夏尔马在信中写道：“最近几周，我们看到一些游戏经过快速反编译和重新构建，甚至能在原本不支持的硬件上运行。”信中提到，Windows PC 版游戏经过转换，可以在苹果自研芯片上运行，也能借助 WebAssembly 和 WebGPU 移植到浏览器中。WebGPU 在全球浏览器中的支持率接近 90%。夏尔马坦言，更令人惊讶的是，许多全球知名游戏的内容甚至进入到了其他游戏的源代码中。“这些尝试让游戏行业长期以来的固有观念受到挑战，包括软件与硬件的绑定关系、创作与游玩的界限，以及玩家发现和体验游戏的方式。”她进一步提到，游戏行业未来会怎样发展，很难预测。“但让更多人能够接触优秀游戏、让老游戏焕发新生，以及让更多玩家参与游戏创作，当然值得期待。即使这些变化会冲击我们现有的商业模式，有时甚至正是因为打破了原有模式，无疑也会让玩家受益。”为了探索这些可能性，夏尔马委托 XBOX CTO 斯科特 · 范 · 弗利特牵头组建一支小团队，由游戏开发者、工程师和科学家组成，负责将新技术和新创意转化为玩家及开发者可以实际体验的成果。“我们会公开开展开发工作，从大家的实践中吸取经验，并根据是否有更多人参与游戏和创作来判断成效。”IT之家附备忘录部分内容如下：我认为 XBOX 在这一领域大有可为。编程之所以成为智能体最早广泛应用的领域，是因为其可以编写、运行和测试软件。游戏也有许多类似的特点。人们每年玩 XBOX 游戏的时间超过 720 亿小时，约为全球编程总时长估计值的五倍。过去 25 年，我们积累了丰富的游戏开发经验。我希望我们的开发者能够参与探索，让这些新技术发挥更大的潜力。随着探索不断深入，我们会一如既往地与全行业开发者分享自己制作的工具。我们的工作重点不会改变。我们会继续推进 4Cs 战略、打造优秀游戏、发展硬件业务，并妥善管理知识产权，维护围绕这些知识产权形成的玩家社区。XBOX Labs 让我们能够在继续推进现有工作的同时，探索新技术。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/633.htm", "publishedAt": "2026-10-13T23:24:05+00:00"}, {"title": "不服判决：Anthropic 硬刚美国政府 AI“供应链风险”认定", "summary": "IT之家 10 月 14 日消息，据彭博社报道，Anthropic 公司敦促华盛顿联邦上诉法院重新审议此前的一项判决，该判决维持了特朗普政府将这家人工智能企业认定为危害美国国家安全供应链风险主体的决定。该公司于当地时间周二申请由上诉法院全体法官，复核一个三人法官小组在 9 月 25 日以 2 比 1 票数作出的裁决。Anthropic 主张，多数意见对法律作出了错误解读，允许美国国防部“在没有任何预先认定流程的情况下采取行动，而且已有明确证据表明，这项认定是对 Anthropic 就人工智能安全公开发表言论的报复”。Anthropic 与政府之间的这场法律博弈事关重大。在人工智能技术发展的关键节点，法院需要判定，究竟是联邦政府还是私营企业掌握人工智能技术安全防护机制的控制权。美国本土开发者正争相推出最先进的人工智能模型，并向投资者证明这项技术能够实现盈利。今年早些时候，双方关于军方使用该公司人工智能技术的合同谈判破裂，Anthropic 由此与特朗普政府公开产生争执。这家公司曾要求获得保证，其技术不会被用于对美国民众的大规模监控，或是自主武器部署。但美方表示，出于国家安全考量，无法接受对技术使用施加任何限制。美国国防部在 3 月通知 Anthropic，该企业及其产品被认定为美国供应链风险，所有联邦机构都需要撤回和这家公司相关的业务指令。这类风险认定，以往一般只针对美国视作对手国家的企业。Anthropic 对政府提起两起诉讼，一起在加州，针对国防部要求联邦机构停止和该公司合作的指令；另一起向哥伦比亚特区巡回上诉法院提起，质疑这项风险认定本身的合法性。在旧金山的案件中 Anthropic 胜诉，美国地区法官丽塔 ·F· 林（Rita F. Lin）在 8 月下令，要求政府解除联邦机构使用 Anthropic 技术的禁令。她强调，国防部此举的动机看起来属于报复，而非出于正当的安全考量。但在华盛顿的这起案件里，三人法官小组于 9 月 25 日裁定，政府的这项认定具备合法性。格雷戈里 · 卡察斯（Gregory Katsas）法官撰写多数意见称，国防部“有合理理由担心，Anthropic 可能修改克劳德（Claude）模型的设计，使其无法执行国防部认为在合同授权范围内、且具备必要性的国家安全相关任务”。IT之家注意到，本案案号为 Anthropic 诉美国国防部案，26-01049，受理法院为美国哥伦比亚特区巡回上诉法院（华盛顿）。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/630.htm", "publishedAt": "2026-10-13T23:07:38+00:00"}, {"title": "在高管会议室偷偷安装录音设备，OpenAI 一沙特籍工程师被 FBI 逮捕", "summary": "IT之家 10 月 14 日消息，据路透社报道，美国司法部当地时间周二表示，美国联邦探员逮捕了一名任职于 OpenAI 的沙特籍工程师，指控他在这家人工智能企业的高管会议室安装隐蔽录音设备。美国司法部在声明中称，35 岁的阿卜杜勒拉赫曼 · 阿尔福赞（Abdulrahman Alfozan）自 2025 年 7 月起担任 OpenAI 工程师。美国司法部介绍，9 月 30 日，OpenAI 在其旧金山一处办公楼的高管会议室里，发现一台电视后方 USB 接口上插着该录音设备。美国联邦调查局的诉状显示，这个 U 盘大小的设备带有麦克风，还可外接摄像头，被藏在卫生纸之中。设备大约在 9 月 28 日被安装，内部存储的数据经过加密，无法直接读取。调查人员后续在阿尔福赞的个人包中查获另一件同款定制设备。OpenAI 在 X 平台发文称，公司依靠内部人工智能模型锁定了放置设备的责任人，并追查了设备来源。该企业表示，已有证据显示这名员工打算在办公室多个敏感区域继续加装录音设备，秘密录制会议内容。公司称：“目前没有迹象表明此人不当访问或窃取模型权重、源代码或是客户数据。该员工已被解雇。”OpenAI 将案件移交了美国联邦调查局，相关调查仍在进行。美国联邦调查局局长卡什 · 帕特尔（Kash Patel）在声明中表示：“阿卜杜勒拉赫曼 · 阿尔福赞涉嫌在雇主的高管会议室藏匿秘密录音装置，偷偷录制和公司超级智能技术相关的敏感谈话。”联邦调查局诉状显示，直至 9 月 16 日的约一个月时间里，阿尔福赞还借助一款人工智能办公助手，查询会议室日程与相关权限信息。他自 2020 年 9 月起持有美国合法永久居民身份。如果罪名成立，阿尔福赞最高可获五年监禁、25 万美元（IT之家注：现汇率约合 167.6 万元人民币）罚金，以及三年监管释放。根据他的领英个人主页信息，阿尔福赞曾就读于麻省理工学院与加州大学伯克利分校，此前任职于 Meta 和微软。OpenAI 当地时间上周五表示，经调查发现三名研究人员违反公司敏感信息管理规定，已将三人辞退。这三名研究人员分别是贾斯敏 · 王（Jasmine Wang）、托梅克 · 科尔巴克（Tomek Korbak）与米基塔 · 巴列斯尼（Mikita Balesni）。三人随后发布公开信，详述被解雇的经过，认为这次突然解雇会让员工产生不安，破坏研究人员提出安全风险顾虑的内部文化。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/629.htm", "publishedAt": "2026-10-13T22:59:27+00:00"}, {"title": "Meta 新模型杀回AI第一梯队，Alexandr Wang 亲述 Muse 7个月翻身内幕", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/2QXm6PqYYX57AOxTYyO0?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-13T18:32:43+00:00"}, {"title": "修复漏洞的 PR 刚提交，攻击几分钟后就来了：AI 正在击穿开源安全流程", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/R7OkT6DCUifdCQqAvwtJ?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-13T17:25:00+00:00"}, {"title": "谷歌最强 AI 模型：Gemini 4 Argon 上线，输出词元上限 100 万个、专攻最棘手难题", "summary": "IT之家 10 月 14 日消息， Gemini 4 Argon 现已面向全球开发者和企业开放，可通过 AI Studio 、 Gemini 平台 API 使用，同时支持 Google Antigravity 的 Google AI Ultra 订阅用户，以及 Gemini 应用和搜索 AI 模式的 Google AI Ultra 和 Pro 订阅用户。该模型目前限时入门定价如下（汇率为 2026 年 10 月 14 日 1 美元（现汇率约合 6.7 元人民币） ≈ 6.6921 人民币）：输入：每百万 Tokens 2 美元（IT之家注：现汇率约合 13.4 元人民币）输出：每百万 Tokens 10 美元（现汇率约合 66.9 元人民币）缓存输入：每百万 Tokens 0.1 美元（现汇率约合 0.7 元人民币）2026 年 11 月 30 日入门促销结束后，定价调整为：输入：每百万 Tokens 4 美元（现汇率约合 26.8 元人民币）输出：每百万 Tokens 20 美元（现汇率约合 133.8 元人民币）缓存输入：每百万 Tokens 0.2 美元（现汇率约合 1.3 元人民币） Gemini 4 Argon 擅长在编码、金融、法律、网络安全、科学等领域处理复杂的现实任务，在多步骤任务上的深度和精度使其在多个领域基准测试中表现优于其他前沿模型，目前在衡量金融、编码、法律和税务等关键经济领域模型性能的 Vals Index 中排名第一。谷歌内部及外部企业、研究团队已经开始使用该模型解决各类问题，包括大型代码库重构优化、法律金融等领域业务工作流优化、发现修复关键网络安全漏洞，以及推动量子计算、核聚变、生命科学等领域的全新突破。在工程领域，该模型帮助 Chrome 团队完成了数千万行代码的架构重构，将原本需要数月的工作缩短至数周；还在一夜之间自主完成了开源项目的性能优化，将内存会话准备时间缩短了 40% ，冷导入速度提升了 21% 。在科研领域，谷歌为 10,000 名科学家提供 6 个月的 Google Antigravity 最高使用层级免费访问资格，目前申请通道已开放。在网络安全方面，谷歌扩大了 Fairwind 项目合作伙伴范围，帮助更多网络安全防御者使用该模型发现修复漏洞。安全方面，谷歌为该模型部署了多层防御体系，在越狱抵抗、提示注入防护、代理对齐监控等方面均有显著提升，有害请求违规率相比前代 Gemini 模型降低了近一半。在输入输出方面，目前最新的 Gemini 4 Argon 支持最高 1,048,576 个 token（约 100 万 token）的长解码输出，但输入、思考与输出共用同一个 100 万 token 的上下文窗口。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/601.htm", "publishedAt": "2026-10-13T16:16:12+00:00"}, {"title": "GitHub新晋顶流REA：当大模型能逆向一切，软件行业还剩什么？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/BEJ6IXREBoXspGmXRQHj?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-13T11:40:05+00:00"}, {"title": "AI学会「寄生繁殖」了，Anthropic 用 15台破电视盒子养活大模型", "summary": "当大模型也像病毒一样传播#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1683992?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-10-13T08:51:30+00:00"}, {"title": "16个获奖名额，总奖池33万，“地心飞行”AIGC大赛全网征集创意视频", "summary": "如果硬盘里正好躺着一部做完的超现实题材片子，或者你一直想用 AI 拍一段扣人心弦的冒险，现在有一场大赛正在等你的作品。 第四届开放原子大赛·2026 开源行业解决方案创新赛（下称北京开源创新赛）的赛道三，是「地心飞行」AIGC 创作赛道。它面向沉浸式飞行影院这类文旅场景，征集 2-5 分钟的超高清视频，主题围绕地底世...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502999", "publishedAt": "2026-10-13T08:42:54+00:00"}, {"title": "DeepSeek 半年融 1500 亿冲向科创板，梁文锋开始给模型找“身体”", "summary": "据媒体报道，DeepSeek 有意入局具身智能领域，其创始人梁文锋最近在密集和具身智能领域的创业者见面交流，探讨方向涉及具身机器人、大模型与现实世界的交互。 融资这边，《财经》记者从多位参与交易的人士处确认了一个数字：DeepSeek 将在近期完成最新一轮融资，金额从此前计划的 500 亿元增至约 1000 亿元。这是它的第二...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502997", "publishedAt": "2026-10-13T07:42:56+00:00"}, {"title": "Anthropic 公开反蒸馏防御战报：让推理记录更难被偷、捕获量降了九成", "summary": "Anthropic 今天发了一篇博客，讲他们怎么对付『蒸馏攻击』——一种隐蔽的、工业规模的、用大量非法账号从另一个模型批量抽取能力的做法：从更强、更大的模型（这里就是 Claude）生成数百万条回复，再拿这些回复去教一个更小的模型模仿前者的行为，从而用开发时间和成本的一小部分就逼近前沿能力。Anthropic 说过去几个月...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502996/anthropic-distillation-defenses", "publishedAt": "2026-10-13T06:57:06+00:00"}, {"title": "Meta 发布 Muse Wonder，为个人和专业 Agentic 任务提供最先进性能", "summary": "Meta 发布了 Muse Wonder 系列——Muse Wonder 和更完整的 Muse Wonder Full，官方称这是他们『最具能 键参数放在一起： 项目...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502940", "publishedAt": "2026-10-10T06:20:24+00:00"}, {"title": "Nano Banana 2.1 深度实测：4K 直出、中文排版大进步，连续改图的坑也要看清", "summary": "先说结论 10 月 6 日，Google 把生图模型 Nano Banana 更新到了 2.1。这一版底座换成了 Gemini 3.6 Flash，升级集中在四个方向：视觉设计、蒙版编辑、主体一致性、画面真实感。 如果只想知道值不值得切过去，可以先看这张速查表： 维度 表现 一句话评价 画面质感 4K 原图直出，微距细节扎实 明显进步 中文文字 清晰度、错...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502939", "publishedAt": "2026-10-10T06:20:15+00:00"}, {"title": "不输出文本、只输出概率的 Jev —— 上线几周估值飙到 75 亿美元", "summary": "TypeSafe AI 以 75 亿美元估值融了 8.7 亿美元，领投方 Andreessen Horowitz，红杉和现有投资方 DCVC 跟投。这家做非文本 AI 模型 Jev 的公司，上线才几周就拿到了这个量级——TechCrunch 的报道口径是『几乎没什么好惊讶的』，因为 Jev 自 9 月 15 日发布后几乎瞬间就火了，公司声称已经有三分之一的世界 500 强在用。 ...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502935/the-maker-of-non-text-ai-model-jev-valued-at-7-5b", "publishedAt": "2026-10-10T03:06:33+00:00"}]}, {"label": "产品发布/更新", "items": [{"title": "苹果官网新线索，全尺寸 HomePod 有望支持 Siri AI", "summary": "IT之家 10 月 14 日消息，消息源 @itspdfu 今天（10 月 14 日）在 X 平台发布推文，报道称基于苹果官网相关代码信息，全尺寸 HomePod 未来可能会支持 Siri AI。IT之家访问苹果中国官网，发现苹果公司已同步调整全尺寸 HomePod 图片相关文字描述，显示：“白色 HomePod，展示全尺寸圆柱形设计、无缝式声学织网外观，顶部亮起表示 Siri AI 功能的多色光晕。”其中图片文字描述中的“顶部亮起表示 Siri AI 功能的多色光晕”，暗示全尺寸 HomePod 未来将会支持 Siri AI。苹果同时表示，HomePod mini 2 将搭载 Siri AI，但功能不会随设备发布立即启用。相关支持将在“未来的软件更新”中推出。在 HomePod mini 2 上，Siri AI 处理涉及用户个人情境的请求时，需与支持 Apple Intelligence 的 iPhone 或 iPad 配对。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/645.htm", "publishedAt": "2026-10-14T00:05:28+00:00"}, {"title": "谷歌 Play Store 新功能：用户用 AI 搓的 App 不用上架商店，可仅限自己使用", "summary": "IT之家 10 月 14 日消息，谷歌于当地时间周二宣布，用户通过氛围编码（vibe-coded）制作的应用，如今可以直接在安卓智能手机上运行，无需先在谷歌应用商店（Google Play Store）公开发布。一项新功能支持用户使用普通谷歌账号，借助谷歌应用商店在设备上启动属于自己的个人应用，且应用将完全保持私密。这类个人应用不会出现在谷歌应用商店的搜索结果或应用列表页面，除创建者本人外，不会分享给任何人。推出该功能的背景是，越来越多人尝试借助人工智能搭建满足自身特定需求的应用。但在此之前，如果想要在自己的安卓设备上使用这类应用，就必须上架谷歌应用商店，可供商店约 30 亿用户访问。这使得很多人只愿意把氛围编码的成果做成可跨设备运行的网页应用，而不是安卓原生应用。谷歌表示，现在安卓设备用户可以在谷歌人工智能工作室（Google AI Studio）里用氛围编码制作应用，再将其部署出来仅供自己使用。这类应用仍需要遵守谷歌应用商店现有的各项规则，但能让用户更直接地尝试开发安卓应用。该功能初期仅面向美国年满 18 周岁的用户开放。谷歌负责谷歌应用商店与开发者生态的副总裁兼总经理萨姆 · 布莱特（Sam Bright），在周二功能上线前的媒体通气会上表示：“这就是谷歌应用商店里应用的未来 —— 个性化、安全、人人都能创作。这也是应用商店率先转型，从‘万事皆有对应应用’走向‘为我专属打造应用’的原因。谷歌应用商店创立之初目标很简单：帮你找到喜爱的应用。但从今天起，希望大家能看到，它已经演变出更多价值。”谷歌称，未来几个月内，用户还可以把自己用氛围编码制作的作品分享给可信好友圈子。也就是说，你为家人、朋友，或是孩子的少儿棒球联赛制作的应用，可以在小范围内供一群人使用，不用在应用商店公开发布。如果这款应用后续获得很高人气，开发者可以完成信任与安全审核，将个人应用转为公开发布在谷歌应用商店、供所有人体验的应用。谈及人工智能对应用开发带来的影响，谷歌还表示正在优化谷歌应用商店的内容推荐机制。例如利用谷歌人工智能打造个性化游戏推荐引擎 Game Finder。这项功能率先在美国地区以英文上线，会结合用户的游戏偏好，以及从平台 12 亿游戏玩家社群中沉淀的数据给出推荐。谷歌还将支持用户自建游戏清单，在全新社区发帖板块发布游戏相关提问，参与限时 48 小时、名为 Sprints 的游戏挑战赛，同时推出其他多项游戏相关更新。除此之外，应用商店内置人工智能助手 Ask Play 迎来升级，新增对比功能，用户可以查看同类应用之间的核心差异。谷歌应用商店内的应用和游戏，也会更深地接入 Gemini 对话功能。IT之家注意到，同步推出更新的还有谷歌应用商店全新年龄段功能。家长可以向开发者提供孩子所处年龄段，无需填写精确出生日期，以此获取适配该年龄段的使用体验。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/635.htm", "publishedAt": "2026-10-13T23:30:40+00:00"}, {"title": "AI 芯片企业 Cerebras CEO 预言：家用 AI 时代即将到来，AI 智能体帮你搞定生活琐事", "summary": "IT之家 10 月 14 日消息，美国人工智能芯片研发企业 Cerebras Systems 首席执行官兼联合创始人安德鲁 · 费尔德曼（Andrew Feldman）认为，我们即将迎来家家户户都配备人工智能设备的时代。当地时间周二，这位芯片企业高管在 2026 年 TechCrunch Disrupt 大会的舞台上，被问及人工智能要成为家用设备还需要哪些条件，他回应道：“实际上，我觉得这一天并不遥远。”他举例提到消费级智能体的技术进展，比如 Meta 的 Muse，还有估值现已达到 100 亿美元（IT之家注：现汇率约合 670.58 亿元人民币）的初创企业 Instinct，以此说明人工智能正在普通用户群体中站稳脚跟。至于居家人工智能产品，他预测未来将会出现本地运行的个人人工智能助手。费尔德曼解释：“就像手机一样，这类设备一部分任务在本机处理，一部分任务上传云端。但我认为它们会深度了解你，并且会有专属的安全防护边界。它们还能绑定信用卡，替你采购商品。”他接着说，“我相信它们会切实改善我们的生活。”当然，作为一家人工智能芯片厂商，家用人工智能设备这一愿景，或者说智能体技术在消费市场的大规模普及，无疑极具吸引力。不过费尔德曼并不只是在研发硬件基础设施，他本人也在使用个人人工智能工具。他说自己目前依靠“一套智能体组合”整理日程、调取即将通话对象的相关资料，还有更多用途。人工智能已经接手很多过去需要人工完成的工作，但最让费尔德曼期待的是前所未有的全新应用场景。不过，这些新场景具体是什么，他打算留给其他创业者去探索。他表示：“我喜欢做基础设施领域的一大原因，就是我不用构思面向消费者的产品创意…… 我更愿意搭建平台，让其他人的创意可以在上面落地生根。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/632.htm", "publishedAt": "2026-10-13T23:18:52+00:00"}, {"title": "手机解锁先见 AI，不再先找 App：阶跃星辰首款智能体手机来了，定价 3999", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": blishedAt": "2026-10-13T04:07:04+00:00"}, {"title": "这届 AI PC，太烧心了", "summary": "AI PC 还没火，先被 AI 背刺了。#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1683688?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-10-10T08:28:39+00:00"}]}, {"label": "论文研究", "items": [{"title": "苹果诉 OpenAI 窃取商业秘密案新进展：法院准许苹果调取后者招聘材料", "summary": "IT之家 10 月 14 日消息，一名法官裁定，在苹果公司于 7 月针对 OpenAI 提起的商业秘密诉讼中，苹果可以快速调阅 OpenAI 的招聘相关材料。具体而言，法院准许苹果查阅相关文件，这些文件与 OpenAI 面试前苹果员工的记录有关。这批求职者应聘的是 OpenAI 消费硬件与机器人部门岗位，相关招聘发生在传闻中 OpenAI 首款硬件设备发布之前。文件内容可能包含面试清单、指引、说明、手册、面试脚本，还有技术演示材料以及记录，这些记录能证明面试讨论中提及苹果的技术或零部件。法院认定这批文件应当优先调取，要求 OpenAI 在五天内移交已经整理完毕的材料，其余和本次调取申请相关的材料需要在 14 天内提交。IT之家注意到，这起诉讼的背景是 OpenAI 正在研发一款消费级硬件设备。如果这款人工智能设备日后成为用户生活、软件与服务交互的核心，有可能和 iPhone 乃至整个智能手机赛道形成竞争。苹果在诉状中指称 OpenAI 存在一系列窃取商业秘密的行为，其中一项直接指控是，前苹果员工使用苹果笔记本下载涉密资料，文件包含尚未对外公布的技术、功能与产品信息，例如技术规格、工程演示文稿以及专属项目数据。苹果还提出多项指控，称任职于 OpenAI 的前苹果员工会指导其他打算从苹果跳槽至 OpenAI 的人员，告知其可以在面试中携带哪些信息。美国地区法官爱德华 · 达维拉（Edward Davila）并未批准苹果提出的所有快速调取涉案文件与通讯记录的申请，但裁定苹果可以获取面试材料，以及案件相关人员在 LINE 通讯软件上的私聊记录，其中包括 OpenAI 员工刘畅（Chang Liu）与彭艾莉莎（Alyssa Peng）。法官同时批准对刘畅、彭艾莉莎以及第三名人员，也就是 OpenAI 硬件首席官邓耀谭（Tang Yew Tan）进行庭外取证。这三人均曾任职于苹果。不过，法官驳回了苹果提出的快速调取 OpenAI 特定领域研发资料的申请，例如金属表面处理与电源管理相关内容。法官还拒绝了苹果另外几项范围更广的证据开示请求，包括调取 OpenAI 硬件研究资料，以及前苹果员工入职 OpenAI 后所产出成果的相关信息。但本次驳回并非最终决定，法官表示苹果可以缩小申请范围，重新提交申请。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/012/643.htm", "publishedAt": "2026-10-13T23:57:32+00:00"}, {"title": "Palantir CTO 上电视骂 AI 安全是“邪教”，还戏称 AI 研究者靠抽烟表信仰", "summary": "Palantir 首席技术官 Shyam Sankar 在 CBS《Face the Nation》上抛出了几个惹火的判断。节目开头，主持人 Margaret Brennan 先甩了个民意数字：CBS 民调里 50% 的人认为 AI 带来的问题会多于解决的，45% 的美国人希望政府限制 AI 的研发和使用。他的回应不是顺着'该不该设护栏'谈，而是直接点名了一个他认为真正在背后操...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503000", "publishedAt": "2026-10-13T08:56:20+00:00"}, {"title": "AI 让代码量涨了 30%，软件产出却纹丝不动 —— 瓶颈卡在人类 Code Review", "summary": "让 AI 写代码，公司真的产出了更多软件吗？一份对超 700 家公司真实工程数据的分析给出了一个反直觉的答案： const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
