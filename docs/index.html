const DATA = {"date": "2026-10-07", "generatedAt": "2026-10-07T02:01:25Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "谷歌 AI 图像模型 Nano Banana 2.1 发布，提升视觉设计、蒙版编辑、主体一致性", "summary": "IT之家 10 月 7 日消息，谷歌于今日正式发布了 Nano Banana 2.1，这是该公司 AI 图像生成与编辑模型的升级版本。谷歌强调，新版 Nano Banana 2.1 实现了全方位提升，在视觉设计、基于蒙版的图像编辑以及主体一致性这几方面的进步尤为突出。今年早些时候，谷歌推出了 Nano Banana 2，也被称作 Gemini 3.1 Flash Image。Nano Banana 2 在拥有谷歌 Flash 系列模型高速特性的同时，实现了与 Nano Banana Pro 同级别的出图质量。谷歌还把多项原本属于 Pro 版本的功能下放至这款定位更低的模型，包括现实世界知识库、文字渲染效果优化，还有角色与物体的一致性表现提升。IT之家注意到，Nano Banana 2.1 在原有能力的基础之上，主要在三大方向做出改进：视觉设计：Nano Banana 2.1 可以生成构图效果更佳、完成度更高的视觉素材。蒙版编辑：用户能够更加精准地选中并修改现有图像的局部区域，无需重新生成整张画面。主体一致性：在执行编辑操作或者批量生成多张关联图片的时候，模型可以更好地保留画面主体的样貌与特征。改进后的主体一致性对于 Gemini 用户而言实用性很强，可以保证同一个人物或者物体在多次生成结果当中保持样貌统一。谷歌 Nano Banana 2.1 现已逐步部署上线，覆盖 Gemini 应用、谷歌搜索的 AI 模式、Google AI Studio、Google Flow、Stitch、谷歌广告以及 Gemini 企业平台。面向开发者，Nano Banana 2.1 已经正式开放，对应的模型 ID 为 gemini‑nano‑banana‑2.1；该模型支持文本、图片、音频以及视频输入，同时可以输出 1K、2K 以及 4K 分辨率的图像。目前，OpenAI 的 ChatGPT Images 2.5 依旧是全球领先的图像生成编辑模型。在用户持续微调一张图片时，它更擅长保留上一轮的修改成果，不会改动没有编辑的区域，也不会随着反复迭代让原图画质变差。紧随 OpenAI 这款产品之后的是微软 AI 的 MAI‑Image‑2.6 模型，该模型于今年 8 月发布。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/149.htm", "publishedAt": "2026-10-07T01:01:58+00:00"}, {"title": "OpenAI 发布又一批 AI 数学研究成果，攻破数百个悬而未决难题", "summary": "IT之家 10 月 7 日消息，OpenAI 在一批包含 722 份手稿、涵盖 372 个结果家族的文件中，公布了某款未发布的前沿模型解决的多项长期存在的数学难题。IT之家注意到，这一举措延续了其一系列突破性成果，这些成果既给数学界部分人士留下了深刻印象，也引发了不安，同时还带来了关于研究伦理和学术行为的疑问。据负责以负责任的方式传达这些成果、新成立的精英数学家独立咨询小组 AGMAI 介绍，此次公布的内容包含对“数百个”未解决问题的解答。数周以来外界一直在期待这批成果，不过在此之前，OpenAI 始终没有说明模型究竟解决了哪些问题，也没有给出确切的发布时间。该公司曾在九月份称，自家模型“已经解决了一百余个长期悬而未决的公开难题，覆盖数学的绝大多数分支领域”。本次对外发布的文稿以及相关资料还包含一部分模型推理过程摘要、算力消耗估算值，以及尝试求解过的问题数量统计数据。OpenAI 称，一项普通成果所消耗的算力，大致相当于 ChatGPT Pro 连续思考三小时的算力水平。数学与人工智能咨询小组（Advisory Group on Mathematics and Artificial Intelligence，AGMAI）于九月下旬发布首批建议。该小组呼吁人工智能实验室尽可能通过成熟的学术渠道及时对外发布数学研究成果，同时应当披露所使用模型的名称、提示词、算力开销等详细信息。小组还恳切规劝人工智能企业，“不要把发布数学成果当作推广自家模型的营销手段”；该机构认为，这类做法会给整个数学社群带来严重损害。OpenAI 是这样描述本次发布的工作流程的：针对本次发布，我们将成果发布在一处 GitHub 代码仓库当中，同时制定了文稿修订与引用相关的处理规范。我们还会继续探寻其他由学术社群托管的发布方案，使之符合该咨询委员会提出的各项指导意见。对于后续版本的成果发布，我们承诺会进一步完善文稿质量，优化引用情况、数学内容阐述以及成果展示形式，便于大家理解。数学家还需要对这批成果开展评估、消化吸收，因此这批研究带来的完整影响或许尚需一段时间才能够显现。此前 OpenAI 以及 Anthropic 等竞争对手实验室已经产出数量迅速增长的一批数学成果，整个数学界仍处在消化阶段，其中甚至包含一道千禧年大奖难题的相关结果，该难题属于数学领域最知名的未解问题。今年各家人工智能实验室快速闯入数学这门学科，尤其是它们对外发布消息的方式，已经激起激烈争论，议题涉及科研范式、伦理规范，以及企业应当如何向人类数学家致谢；人工智能系统正是建立在人类数学家的已有工作之上，并有可能依托这些前人工作生成新结果。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/137.htm", "publishedAt": "2026-10-06T23:42:31+00:00"}, {"title": "LibreOffice：短期内默认版本不内置 AI 功能，用户可通过扩展自行接入本地模型", "summary": "IT之家 10 月 7 日消息，如果你正在寻找一款不使用人工智能的文档编辑软件，LibreOffice 或许正是适合你的选择。开发这款开源文档编辑软件 LibreOffice 的非营利机构文档基金会（The Document Foundation），于本周在一篇博客文章中表示，该机构并非一味排斥人工智能，但在可预见的未来，“不会”在自家软件当中加入人工智能功能。这篇博客发布的几周之前，也就是八月下旬，LibreOffice 刚刚推出了最新版本。当时这家非营利组织就已经重申，这套软件“不包含任何生成式人工智能功能”。LibreOffice 当时称，这是一项“经过慎重考量的设计定位”，目的是确保用户的文档不会被上传至服务器进行处理，软件运行的任何环节都不需要联网。该非营利机构补充，有数千万个人用户与各类机构正在使用这款软件，用户应当始终掌握自己的数据。该机构表示：“任何处理机密信息、法律特许保密资料或是个人数据的机构，都需要清楚这些数据的去向。能够通过审计核查的唯一保障，就是数据始终保留在本机设备之内，不外泄出去。”LibreOffice 同时提到，如果用户仍有使用人工智能工具的需求，可以自行安装软件扩展插件，把文档编辑器和本地人工智能模型对接起来。IT之家注意到，该软件选择不内置人工智能功能，和当下许多软件厂商的流行趋势背道而驰。如今不少厂商一味堆砌各类人工智能功能，甚至不惜损害用户的使用体验。现代软件出现所谓的“劣化现象”：大量加入聊天机器人、人工智能助手这类多余且臃肿的功能。受此影响，已经有一部分开发者开始开发或者增设相关功能，用来屏蔽、彻底移除软件内的人工智能模块。人工智能工具往往需要把用户的数据上传到远端服务器完成处理，而用户无法管控这些数据的存储方式以及保存时长。LibreOffice 表示，目前还没有任何一套集成方案可以全部满足它提出的各项条件，例如保证用户的数据保留在本地设备，同时不单一依赖某一家人工智能服务商等。该机构对于在软件内加入人工智能功能的标准，并不等于“彻底否决人工智能”。这项决定是基于现阶段技术现状做出的评估，而不是对人工智能行业本身的价值下定论。LibreOffice 在博客文章中写道：“在此之前，软件默认安装版本不会内置任何形式的人工智能；希望接入人工智能功能的用户可以使用扩展插件。同时我们也会持续密切跟踪这项技术的实际发展走向。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/132.htm", "publishedAt": "2026-10-06T23:19:20+00:00"}, {"title": "已挖出十几万漏洞，Anthropic 向更多安全团队开放其最强 Claude 模型", "summary": "IT之家 10 月 7 日消息，据路透社报道，Anthropic 正在扩大一项计划，允许经过审核的网络安全专业人员在更少安全防护的情况下测试其最强大的人工智能模型，此前该公司的“玻璃翼计划（Project Glasswing）”今年已帮助发现了超过 10 万个软件漏洞。据IT之家了解，玻璃翼计划旨在保障全球关键软件的安全。该计划的合作方在 4 月至 7 月期间，至少找到了 129000 个已经核实的漏洞。而 Anthropic 自身开展的开源扫描工作，在 4 月到 10 月之间又额外发现了 5500 个漏洞。到目前为止，已有超过 33000 个漏洞被评定为严重或者高危等级。Anthropic 表示这些数据很可能存在统计遗漏，且实际影响至少是目前数据的五倍，因为该数据来自对有限数量合作方的调查。新版网络核验计划（Cyber Verification Program，简称 CVP）于当地时间周二正式对外公布，整合了 Anthropic 过去半年运行的两套项目。第一个就是玻璃翼计划，它为负责关键软件安全防护的机构开放了 Claude Mythos 的使用权限，这是 Anthropic 旗下网络安全能力最强的模型系列。第二个是旧版的网络核验计划，它向经过资质审核的安全团队开放防护限制下调后的 Claude Opus 以及 Claude Sonnet 模型。该公司在 4 月发布 Claude Mythos Preview 的时候，曾引发担忧：人工智能或许会在软件完成安全加固之前就对其发起黑客攻击。新设立的项目一共分为三个层级，每一层级都设置了对应的资质审核要求与安全管控措施。全部三个层级都可以使用 Claude Opus 5.5、Claude Sonnet 5.5、Claude Mythos 5.1 以及后续推出的新模型。防御层级适用于事件应急响应、恶意软件分析这类工作。安全团队、关键基础设施运营方、开源项目维护人员以及拥有漏洞上报履历的研究人员都可以提交申请。红队层级在此基础上增加了授权渗透测试与红队攻防演练权限，但仅接受机构申请。专项层级的约束最少，仅面向一小部分机构开放；这些机构获得许可，可以对电网、航空飞行系统、银行跨行转账基础设施这类事关安全的关键系统开展测试。Anthropic 会同美国政府一同审核每一名参与成员的资质，原本玻璃翼计划的现有成员将会归入这一专项层级。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/127.htm", "publishedAt": "2026-10-06T22:50:13+00:00"}, {"title": "谷歌推出 EmbeddingGemma 2：支持多模态、7.4 亿参数量化手机端运行只需 191MB 内存", "summary": "IT之家 10 月 7 日消息，去年谷歌推出了 EmbeddingGemma，为开发者提供轻量高质量的文本嵌入方案，下载量已超 2000 万次，广泛应用于端侧搜索工具和隐私优先检索增强生成（ RAG ）管线。如今谷歌正式推出 EmbeddingGemma 2，将能力从文本扩展到代码、图像、视频、音频，可将这些内容统一映射到同一个嵌入空间。IT之家援引博文介绍，该模型基于 Gemma 4 架构开发，采用商业友好的 Apache 2.0 许可发布，总参数为 7.4 亿，非常适合端侧推理。EmbeddingGemma 2 基于 Gemini 嵌入模型同源技术打造，具备多项核心优势：同尺寸顶尖性能：在子 1B 参数多模态嵌入模型中，于 MTEB Code、MAEB 等基准测试中取得领先分数，性能比肩甚至超越不少更大尺寸模型。模块化设计：纯文本任务仅需 2.7 亿参数，可按需添加 1.7 亿参数的视觉编码器和 3 亿参数的音频编码器，实现完整多模态支持。存储高效：借助 Matryoshka 表示学习（ MRL ），开发者可动态将输出向量从 768 维截断至 512、256 或 128 维，本地向量数据库存储和内存占用最高可降至六分之一。端侧性能优化：在资源受限条件下仍可高效运行，量化后在谷歌 Pixel 11 Pro 上，纯文本权重仅需约 191 MB 运行内存，完整多模态模型约需 567 MB。支持扩展上下文：配备 8K Token 上下文窗口，比初代 EmbeddingGemma 大 4 倍，可在本地硬件直接处理最长 5.5 分钟音频、29 张图像、58 个视频帧，或上述内容的交错组合。在性能方面，EmbeddingGemma 2 保留了前代出色的多语言文本性能，同时代码性能大幅提升 9.92 分（MTEB Code 测试中从 68.76 提升至 78.68），非常适合本地代码库索引、语义代码搜索和编程代理检索。在图像、视频、文档和音频任务中，该模型为子 1B 参数模型树立了单位参数质量新标杆，甚至性能超过不少尺寸两倍于它的专业模型。EmbeddingGemma 2 将强大能力直接带到端侧硬件，本地生成嵌入可保障数据隐私、降低管线延迟，支持开发者搭建完全离线运行的跨模态搜索和检索系统。搭配 Gemma 4 等生成模型，还可实现理解复杂多模态数据的端侧 RAG 管线；由于二者架构同源，共享文本分词器和音频编码器，可在统一管线中同时运行，合计内存占用更低。开发者可在 Hugging Face 和 Kaggle 下载模型权重，很快也会登陆 Gemini Enterprise Agent Platform Model Garden。可通过 Google AI Edge MediaPipe 开发跨平台应用，或使用 LiteRT 进行自定义模型集成，也支持 transformers.js、WebGPU 等浏览器开发方案，同时兼容 transformers、Ollama、LMStudio 等众多常用开发工具。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/125.htm", "publishedAt": "2026-10-06T22:41:19+00:00"}, {"title": "小米米家智能晾衣机 3 Max 今日开售：首创柔烘除菌专区，首发国补价 2699 元", "summary": "IT之家 10 月 7 日消息，米家智能晾衣机 3 Max 今日 20:00 正式开售，首发国补价 2698.75 元。京东米家【重磅新品】电动晾衣架 3 Max 柔烘除菌超薄隐形阳台智能升降晾衣机 2698.75 元直达链接该机是米家首款柔烘除菌晾衣机，首创米家半封闭式柔烘专区。衣物平铺在晾晒网上后，启动干衣或除菌功能时，晾杆组件自动上升贴近风口，形成半封闭柔烘专区，通过热风循环锁温实现更快干衣与除菌。据介绍，柔烘专区支持标准烘、智能烘、柔护风三种模式。标准烘以均匀热风快速干衣，智能烘通过湿度感应自动调节风温，柔护风以自然风呵护娇贵衣物。三种模式均需通过米家 App 调控。官方称，该机干衣效率相比自然晾干提升约 5 倍。其配备 770mm 超长出风口，支持 1250W 稳定热风，同时提供 10W 节能自然风，可在阴雨天气驱散潮气、减少异味。健康防护方面，晾晒网含抗菌成分，抗菌率 99%。启动除菌功能后，出风口释放高浓度等离子，实现 24 小时防护。产品已通过中家院母婴家电评价权威检测认证。晾晒布局提供 5 大分区，总长 2.4 米，可同时晾晒 80 件大衣或 2 床厚被褥，额定承重 45 千克。另设平置晾晒平台，减少弯腰取衣频次。照明方面，底部配备 42 英寸超大灯板，支持 2700K 至 5700K 色温调节和亮度无级调节，显色指数 Ra95，符合 RG0 无蓝光危害标准。支持 24GHz 毫米波人感照明，人来灯亮、离开延时熄灭。该机整机收起厚度仅 9cm，采用一体化纯平造型和隐藏式滑动出风口，提供白色简雅、极地灰两种配色。支持明装和嵌入式留槽安装，适配多种吊顶环境。智能体验方面，该机支持小米澎湃智联，已接入小米智能生态，可与洗衣机联动。用户可通过米家 APP 自定义升降时间与高度，最大升降约 1.3 米，并支持小爱同学语音控制。安全与品质方面，该机搭载低噪直流电机，历经 6000 次 45 千克满负荷耐久测试，升级 2.0mm 钢丝绳。提供过载监测超重停机、下降遇阻即停、二级限位防碰撞等多重保护。IT之家附详细参数如下：京东米家【重磅新品】电动晾衣架 3 Max 柔烘除菌超薄隐形阳台智能升降晾衣机 2698.75 元直达链接2026 年数码家电政府补贴持续进行中，IT 之家为大家汇总国补领券地址，买数码家电之前记得领取。数码补贴：点此领券手机 / 平板 / 3C 数码支持 8.5 折政府补贴，不超过 6000 元的产品至高立减 500 元。家电补贴：点此领券多类家电支持 8.5 折政府补贴，单品至高补贴 1500 元。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/126.htm", "publishedAt": "2026-10-06T20:59:09+00:00"}, {"title": "宣称“欧美最强开源模型”：Mistral AI 发布 Mistral Large 4 公开预览版，月底开放权重", "summary": "IT之家 10 月 6 日消息，当地时间 10 月 6 日，法国公司 Mistral AI 正式推出 Mistral Large 4 模型的公开预览版（Public Preview），简称 ML4，代号 le Chonk。即日起，用户可以在 Mistral Studio 上体验预览版 API，模型权重将于本月底正式开放下载。目前，官方正联合顶尖网络安全机构、受信任的合作伙伴及政府监管部门，在真实业务环境中对模型展开红队测试（Red-Teaming）。相关合作方将获得该模型的专项测试访问权限；该测试版本适当放宽了内容安全审查策略，并强化了网络安全攻防技术能力。ML4 是一款拥有 1 万亿总参数、490 亿激活参数的原生多模态模型，Mistral 称其实测表现不仅足以媲美全球顶尖的开源模型，更大幅领先于欧美开发的所有开放权重模型。在网络安全、金融与法律等关键企业级工作负载中，该模型在所有开源模型中均达到了 SOTA。在某些特定领域（例如视觉定位），它的表现更进一步，甚至超越了当前的前沿闭源模型。据介绍，ML4 是在 Mistral 位于欧洲的自建数据中心内，基于 3,800 块英伟达 Grace Blackwell GPU 从零开始训练完成的，其欧洲部署方案完全由 Mistral 实施端到端独立运营，严格遵循欧盟法律法规，不受制于任何其他第三方数字服务提供商。ML4 的训练数据具备显著的多语言特性，语料覆盖超 160 种自然语言，全面囊括了欧盟的所有官方语言。价格方面，ML4 每百万 tokens 输入 1.36 美元（IT之家注：现汇率约合 9.1 元人民币），每百万 tokens 输出 4.18 美元（现汇率约合 28.1 元人民币）。IT之家附相关分数如下：", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/108.htm", "publishedAt": "2026-10-06T13:56:21+00:00"}, {"title": "Mistral AI 放出预告：今日新模型可在网安等方面优于中国竞品", "summary": "IT之家 10 月 6 日消息，据路透社报道，法国人工智能初创企业 Mistral AI 首席执行官 Arthur Mensch 当地时间今日在阿拉伯联合酋长国首都阿布扎比举行的 Ai Everything 会议上表示，该企业将在本日发布新的人工智能模型。Arthur Mensch 发言称：我们今天将要发布的模型在网络安全等某些方面，实际上都优于中国的模型。因此，所谓“欧洲无法竞争”的说法是不正确的。……人们对替代性技术供应商有着强烈的渴望和巨大的需求。这位欧洲最大人工智能“独角兽”企业的掌门人并未具体说明具体比较对象和网络安全以外的优势领域。相关阅读：《消息称 Reflection 等多家西方企业本月将推出开放权重 AI 模型》《叫板 DeepSeek、Kimi，英伟达投资的 Reflection AI 发布旗下首款开放权重 AI 模型 Beam》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/043.htm", "publishedAt": "2026-10-06T11:24:24+00:00"}, {"title": "Termexo v0.10.10 发布：19 个本地 MCP 工具，五种编程 Agent 自动接入", "summary": "AI 生成概念图，非产品界面。 MIT 开源的 Windows AI 编程工作台 Termexo 发布 v0.10.10。新版把终端、任务和部分设置开放为 19 个本地 MCP 工具，并支持在 Termexo 新启动的 Claude Code、Codex、OpenCode、Grok Build 和 Antigravity 终端中自动添加连接。 工作台能力作为工具开放 Agent 可以查询工作区和终端，读取指...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502845", "publishedAt": "2026-10-05T23:39:06+00:00"}, {"title": "SmartCall v1.0.7 发布，新增模型以及音色管理", "summary": ":book: 项目简介 SmartCall 是一套基于 AI 大模型 + Asterisk 通信引擎构建的新一代智能客服呼叫中心系统。系统深度融合了 AI 语音机器人、智能 IVR 流程编排、端到端双工对话模型、实时语音识别（ASR）、语音合成（TTS）、大模型意图识别 等核心能力，为企业提供从呼入智能应答到智能外呼的全链路 AI 客服解决方案。 无...", "sourceName": "开源中国", "sourceUrl": "https://www.os ：谷歌与 Constellation 达成长期电力协议", "summary": "IT之家 10 月 6 日消息，Google（谷歌）当地时间今日宣布同美国能源企业 Constellation 达成一份总规模 3.59GW 的长期战略能源合作。这 3.59GW 分为两部分：890MW 为新增核电容量，预计 2028~2032 年上线，持续 20 年；2.7GW 为任意容量，持续 15 年。在谷歌的资金支持下，Constellation 将对其横跨多州的 11 座核电机组进行升级，并在工程建设期间创造约 7,200 个建筑工作岗位。作为一揽子商业协议的一部分，Constellation 还与谷歌云、Gemini Enterprise 构建为期五年的扩展技术联盟，旨在建立“能源人工智能”蓝图，以加速产能交付、优化资产调度并保护关键基础设施。谷歌和 Constellation 还达成了一项战略框架协议，旨在评估在美国各地开发新型清洁能源发电、储能和需求响应技术的机会，以支持谷歌的业务增长。相关阅读：《Constellation 收获亚马逊 20 年核电长单，接近与 Alphabet 达成 10 亿美元交易》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/063.htm", "publishedAt": "2026-10-06T11:37:10+00:00"}, {"title": "DataAgent - 快手大数据生产与分析的智能化探索之路｜QCon上海", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/yVWAQGCZCzI838JESA1b?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-05T10:00:00+00:00"}, {"title": "限时28天！OpenAI承诺没新功能就重置，网友：只想要Opus", "summary": "有改进就体验，没改进就重置，横竖不亏。", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/10/501700.html", "publishedAt": "2026-10-05T02:50:46+00:00"}, {"title": "Agent 的记忆不在对话里：把企业数仓沉淀为可治理的共享语义记忆｜QCon上海", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/M4mgbKf4RDv5AKTwQvFH?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-04T10:00:00+00:00"}, {"title": "企业级 Agent Infra 架构实践：从安全沙箱到网络管控与身份治理｜QCon上海", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/bLB8RQ6sd3ZGQts0D4tP?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-03T10:00:00+00:00"}, {"title": "别再给 Agent 一个“毛坯房”了：构建 Agent 拎包入住的开发环境实践｜QCon上海", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/DEyrayxufObhpoeZgOKT?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-02T10:00:00+00:00"}, {"title": "生成即合规：Agentic AIGC 驱动的广告素材修复实践｜QCon上海", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/TLjNcyBg9Z7 026-09-30T00:20:06+00:00"}]}, {"label": "论文研究", "items": [{"title": "波士顿动力换帅，亚马逊前高管出任 CEO", "summary": "IT之家 10 月 7 日消息，波士顿动力（Boston Dynamics）已经任命亚马逊公司前高管罗希特 · 普拉萨德（Rohit Prasad）担任首席执行官。这家由现代汽车集团控股的机器人企业，将由他带领，迈入机器人技术创新与商业化的新阶段。以动作灵活的人形机器人闻名的波士顿动力，当前正在面向工业以及各类现实场景研发机器人系统，也就是实体人工智能（物理 AI）领域。现代汽车于 2021 年收购了波士顿动力多数股权；该集团今年早些时候表示，计划自 2028 年起，在佐治亚州的自家工厂投入使用 Atlas 人形机器人，并且建设年产最高可达 3 万台人形机器人的产能。IT之家注意到，波士顿动力于当地时间周二发布的人事公告称，普拉萨德曾在亚马逊任职 12 年，参与打造并拓展智能语音助手 Alexa 的相关业务。加入亚马逊之前，他还在 Raytheon BBN Technologies 工作过 14 年，负责机器学习方向的研究，以及面向美国政府与商业客户的落地应用项目。今年早些时候，执掌波士顿动力首席执行官一职长达六年的罗伯特 · 普莱特（Robert Playter）卸任。在这家拥有三十余年发展历史的企业当中，他仅仅是第二任首席执行官。自此之后，已经有数名高层管理人员离开公司，其中就包括首席技术官阿伦 · 桑德斯（Aaron Saunders）。与此同时，现代汽车正着手收购软银集团所持有的波士顿动力剩余股份，以求完全拿下这家机器人先驱企业。现代汽车还已经和英伟达以及谷歌 DeepMind 达成战略合作，共同开发 Atlas 机器人。这批机器人预计先期承担焊接、物流这类简单作业任务；到 2030 年前后，再逐步投入零部件装配等更为复杂的制造工序当中。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/151.htm", "publishedAt": "2026-10-07T01:10:39+00:00"}, {"title": "前妻评马斯克：于混乱之中如鱼得水，将所有挑战视作生死考验", "summary": "IT之家 10 月 7 日消息，对于埃隆 · 马斯克（Elon Musk）而言，混乱或许并不只是一种管理风格。他的前妻表示，身处混乱之中才会让他觉得自在。IT之家注意到，贾斯汀 · 马斯克（Justine Musk）在周二发布的一段预告片中，讲述了这位亿万富翁对高强度生活的偏好。这段预告片是卡拉 · 斯威舍（Kara Swisher）为她与电影人亚历克斯 · 吉布尼（Alex Gibney）的访谈所做的，发布于吉布尼的纪录片《马斯克》（MUSK）上映之前。谈及自己的前夫，贾斯汀 · 马斯克向斯威舍说道：“我曾经形容过他，他就像是会纵身跳下悬崖，然后在坠落的过程当中临时造出降落伞的那种人。我认为他就是在混乱当中如鱼得水。”身为作家的贾斯汀 · 马斯克也是薇薇安 · 詹娜 · 威尔逊（Vivian Jenna Wilson）的母亲。她表示，这位特斯拉首席执行官在表述时，常常把各类难题渲染成关乎生死存亡的紧急事件，其中还带有一定表演成分。“所有事情都事关生死。”她说，“而且我觉得他确实就是以这种方式生活，始终维持着这种高强度的状态。”这番描述同样也在埃隆 · 马斯克旗下各家公司内部得到印证。在职与离职员工向 Business Insider 透露，随着马斯克越来越深度介入 xAI 的日常事务，公司的工作优先级会突然发生变动；还会设立高压的“作战室”，并且建有一个超过三百名工程师的群组聊天。研究人员时常需要停下手上正在开展的工作，优先处理马斯克指出的各类问题。一名前员工此前就表示：“因为这家公司本身规模不大，每一件事都搞得像紧急救火演练。”其实早在创立这家人工智能初创企业之前，马斯克就一向喜欢大刀阔斧推行变革，又会很快推翻其中部分决策。2022 年收购推特之后，他大规模裁员，事后又坦言部分岗位削减得有些过头。贾斯汀 · 马斯克称，前夫身上这种极强的行事气场，会先把旁人裹挟进去，等人们反应过来的时候已经深陷其中。“这种状态是他自带的。他有办法把你一同卷入进去。一开始的时候，看上去很容易让人觉得充满激情与兴奋。”贾斯汀 · 马斯克说道，“我一直觉得，他看似疯狂的举动背后自有一套章法，很多时候还带着不少掩人耳目的花招。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/143.htm", "publishedAt": "2026-10-07T00:06:41+00:00"}, {"title": "AI 颠覆担忧消退，美国软件股创 2026 年阶段新高", "summary": "IT之家 10 月 7 日消息，据路透社报道，受盈利预期大幅上调的推动，美国软件类股票正创出 2026 年阶段新高；多位分析师据此认为，此前市场对于人工智能将颠覆整个软件行业的担忧很大程度上被夸大了。IT之家注意到，标普 500 软件与服务指数周二上涨 1.3%，创下自 2025 年 11 月以来的最高点位。在此之前，该指数在 7‑9 月这个季度录得自 2020 年第二季度之后最大的季度涨幅。赛富时（Salesforce）、ServiceNow、埃森哲（Accenture）等软件企业交出亮眼的财报业绩，再加上各家企业与 AI 实验室达成各类合作，助推板块自六月下旬开启一轮复苏行情。网络安全板块个股表现尤为突出。Crowdstrike、Fortinet 以及 Palo Alto Networks 今年的股价涨幅都达到了三位数百分比；进入 AI 时代之后，各家企业持续在网络安全领域投入重金。LPL 金融首席跨资产策略师亚当 · 特伦奎斯特（Adam Turnquist）表示：“对于很多软件公司而言，人工智能更多起到赋能作用，而并非颠覆者。我们如今正在见证一轮趋势转向：软件板块重新夺回市场领涨地位。我们认为接下来一段时间，软件板块存在跑赢半导体板块的机会。”软件板块指数今年累计上涨 5%；而费城半导体指数汇集了众多美国芯片厂商，2026 年涨幅高达 87.5%，不过该指数目前距离自身前期高点已经出现明显回落。来自 LSEG 的数据显示，软件行业 2026 年的预期年收益增长率已从 3 月底的 13.8% 攀升至 20.6%。从 1 月下旬到 4 月触及最低点，软件板块曾经累计回撤超过 26%。当时市场出现一轮抛售，被业内称作“SaaS 大崩塌（SaaSpocalypse）”；投资者当时心存顾虑，认为企业今后可以借助人工智能自行内部开发应用程序，不再需要采购外部 SaaS 软件。如今分析师表示，当初的恐慌并没有实际证据支撑。科技调研机构 Valoir 的首席执行官丽贝卡 · 韦特曼（Rebecca Wettemann）称：“所谓 SaaS 行业崩塌的局面，完全没有像华尔街部分人士此前设想的那样快速到来。”她补充说明，随着人工智能从试验阶段走向落地应用，软件厂商反馈客户的采购需求依旧保持增长。尽管如此，这项高速迭代的新技术仍在重塑商业模式，行业风险并未彻底消失。扎克斯投资管理（Zacks Investment Management）首席市场策略师布莱恩 · 马尔伯里（Brian Mulberry）认为，软件股真正的考验或将出现在 2027 年下半年；届时更多的数据中心算力投产，AI 代码生成工具或许会对传统软件厂商形成更强的冲击。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/141.htm", "publishedAt": "2026-10-06T23:58:45+00:00"}, {"title": "AMD 股价创历史新高！CEO 苏姿丰称 AI 芯片需求非常旺盛，将持续大幅扩产", "summary": "IT之家 10 月 6 日消息，AMD 盘初涨近 3%，报 649.88 美元（IT之家注：现汇率约合 4,364 元人民币），创历史新高，市值达 1.06 万亿美元（现汇率约合 7.12 万亿元人民币）。开盘后 AMD 股价有所回落，目前涨超 2%，报 646.48 美元（现汇率约合 4,335 元人民币）。AMD CEO 苏姿丰今日在受访时表示，2026 年整体运算市场需求极为强劲，AMD 虽已同步扩充产能，但当前需求依然远高于供给。面对供不应求的现况，AMD 正全力拉升供货，预计 2027 年将大幅扩增产能。上月，AMD 股价累计上涨约 30%，总市值首次突破 1 万亿美元（现汇率约合 6.71 万亿元人民币）。当地时间 9 月 28 日，AMD 还宣布将以 82 亿美元（现汇率约合 550.59 亿元人民币）收购 AI 初创公司 World Labs，以增强自身技术实力。相关阅读：《AMD 苏姿丰落地中国台湾会见供应链和客户：今早见鸿海刘扬伟，下午再访台积电，私人飞机换成黄仁勋同品牌》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/010/114.htm", "publishedAt": "2026-10-06T14:30:54+00:00"}, {"title": "刚刚，Hinton发了首篇RSI论文", "summary": "AI已经开始真正进入「造下一代AI」的流水线", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/10/501705.html", "publishedAt": "2026-10-05T04:42:52+00:00"}, {"title": "Claude Sonnet 5.5 发布：速度快 3 成、Agent 编程评测从 10% 跳到 70%", "summary": "Claude 5.5 家族的第二个成员今天发布：Sonnet 5.5。Anthropic 把它定位成 Opus 5.5 的「快而省」互补款——专攻范围明确的高频日常任务、修 bug、做文档和表格，还强调它有敏锐的设计眼光。官方口径一句话：比 Sonnet 5 清晰升级，速度快 30% 以上，多数任务成本低 30%。 性能数据的跳跃有点夸张。Sonnet 5.5 在 agenti...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502794/claude-sonnet-5-5", "publishedAt": "2026-09-29T04:14:33+00:00"}, {"title": "AMD 花 82 亿美元买下李飞飞的 World Labs，她直接空降成首席科学家", "summary": "AMD 用 82 亿美元换了一张通往「真实世界 AI」的门票。周一官方宣布收购 World Labs——这位由李飞飞 2024 年创立的旧金山 AI 实验室，曾经投资过它的 AMD 这次全资以股票形式买下，交易预计今年年底前完成，待监管审批。李飞飞将以执行副总裁兼首席科学家的身份加入 AMD。 这笔交易是 AMD 史上第二大收购，仅次于 2022...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502790/amd-will-acquire-fei-fei-lis-world-labs-for-8-2-billion", "publishedAt": "2026-09-29T03:12:51+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "消息称 SpaceX 计划募资 400 亿美元，用于采购英伟达 AI 芯片", "summary": "IT之家 10 月 7 日消息，据《金融时报》报道，埃隆 · 马斯克（Elon Musk）旗下的 SpaceX 正计划募资 400 亿美元（IT之家注：现汇率约合 2,685.79 亿元人民币）。本轮融资由阿波罗全球管理（Apollo Global Management）牵头，资金将用于采购英伟达芯片。这家同时涉足人工智能与火箭业务的企业正在加大投入，押注该芯片厂商的先进技术。据知情人士透露，该公司计划通过银行贷款筹集约 100 亿美元（现汇率约合 671.45 亿元人民币），再发行 300 亿美元（现汇率约合 2,014.34 亿元人民币）投资级债券，以此为这笔规模巨大的芯片采购订单提供资金。知情人士称，私募资本集团阿波罗预计将牵头本次交易，并协助向广泛的投资者群体销售这批债券。太平洋投资管理公司（Pimco）也属于少数几家正在洽谈参与出资的贷方机构。这笔交易预计将于 2027 年完成。SpaceX 的融资计划表明，当下市场正在筹措巨额资金，投向支撑人工智能发展的数据中心、芯片以及其他基础设施。得益于 BBB 的信用评级（投资级当中倒数第二档），保险以及养老基金可以购买 SpaceX 的债券。这类基金一般很少配置垃圾级债券。此前马斯克已经表态，要在自己的人工智能项目上继续深度使用英伟达的技术。如若本次融资落地，SpaceX 与英伟达之间的合作关系将会进一步深化。对于英伟达而言，这同样是一次利好。目前有越来越多芯片厂商试图挑战它在高端半导体领域的统治地位。“我们决定完全基于英伟达开展建设，因为我们认为 Vera Rubin 架构是最出色的架构。”马斯克在 8 月 SpaceX 的业绩电话会议上谈及英伟达这套尖端人工智能平台时说道，“我们认为它是性能最优的 AI 计算系统，同时我们十分珍视和英伟达在多个层面开展的密切协作与伙伴关系。”SpaceX 在 6 月完成 860 亿美元（现汇率约合 5,774.44 亿元人民币）首次公开募股之后不久便拿到了投资级信用评级。时隔不到两周，该公司就发行了 250 亿美元（现汇率约合 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
