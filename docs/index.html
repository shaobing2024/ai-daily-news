入 MCP / CLI，走向更多创作场景面向企业客户与开发者的 API 服务将于近期开放据介绍，Kling 4.0 的画面真实感、创意可控性、叙事完整度都有大幅提升，在视听表现、多关键帧、口型匹配、文字生成、创意复刻等多个功能点上实现了突破。 IT之家附主要升级内容如下：全面升级了高速运动、连续动作、跟拍、环绕等大幅镜头运动，镜头的稳定性和连贯性都达到了更专业的标准支持高品质音频与双通道立体声，声音的纵深和层次感更足，更接近同期声的真实感，打造全新“身临其境”的听觉体验进一步打磨了角色口型的匹配精度，声音、对白与表演之间的协同更自然，角色的演绎更具“活人感”支持 4K、1080p 的 10-bit HDR 格式输出，更丰富的色彩层次，更平滑的明暗过渡；还支持 21:9 的超宽画幅单次输入最多 10 张图片、5 段视频及 7 个主体，在同一生成任务组合使用。不同参考素材协同生效，角色、动作、镜头和声音的呈现会更贴近预期，减少反复调试的成本支持任意组合文字、图片、主体等多种输入，对原视频中的主体与背景进行增加、修改和删除。还可以调整视频的风格、天气、颜色、材质、景别视角等内容支持单次生成视频最长可达 30 秒，支持长镜头与连续叙事，让情绪、动作、镜头，在同一条叙事线上自然生成和发展支持最多 10 张多关键帧输入，自由设定关键画面节点，精准控制人物状态、场景变化与情节节点支持输入长度提升至 8000 tokens，并对提示词进行合理补充、扩写与润色，引入导演思维的创作判断支持电影感、动画、奇幻、像素风、毛毡等视觉风格支持中、英、日、韩、西、葡、德、法、印地语等多语种语言，以及北京、中国台湾、东北、四川、粤语、美式英语、英式英语、印度英语等多种口音与方言。并且支持生成多语种文字、Emoji 与 Logo支持视频多次续拍，最长可延展至 2 分钟相关阅读：《快手可灵 AI Kling 4.0 将于 10 月上线，支持 4K HDR 与 30 秒视频生成》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/715.htm", "publishedAt": "2026-10-16T00:22:37+00:00"}, {"title": "科技巨头的“一大痛点”终结：使用半个多世纪的闰秒将被取消", "summary": "IT之家 10 月 16 日消息，当地时间 10 月 15 日，国际计量局在法国凡尔赛召开会议，多数成员国投票支持一项《关于确保“协调世界时”（UTC）连续性所需的技术措施》的决议，这意味着使用了半个多世纪的闰秒将被取消。根据决议，取消闰秒的举措将于 2027 年 5 月 20 日（IT之家注：世界计量日）生效。此前，在国际计量局 2022 年举行的会议上，成员国投票通过一项决议，呼吁制定不晚于 2035 年逐步取消闰秒的计划。自 1972 年引入以来，全球已累计增加过 27 次闰秒，其目的是调和由超高精度原子钟计量的协调世界时 (UTC) 与依据地球不规则自转测定的天文时 (Astronomical Time)。通常情况下，这一多出的秒数会在 6 月或 12 月的最后时刻予以插入。尽管这一微调在日常生活中微不可察，但对现代科技领域而言，却屡屡引发严重的系统故障。2012 年的闰秒调整曾导致 Reddit 与 LinkedIn 相继崩溃；2016 年，Cloudflare 也因此遭遇了短时间的服务中断。包括 Meta、谷歌和亚马逊在内的科技巨头长期以来一直在推动废除该机制，甚至直斥其为“一大核心痛点”。在新方案下，UTC 与天文时之间的累计偏差将被允许扩大至最多一小时，届时才会通过引入闰时进行校准。相关专家表示，出现这样的差异可能需要 3000 多年。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/711.htm", "publishedAt": "2026-10-16T00:05:05+00:00"}, {"title": "宣称“美国最强开源 AI 模型”：Meta 发布 Muse Spark Open", "summary": "IT之家 10 月 16 日消息，当地时间 10 月 15 日，Meta 发布了开放权重 AI 模型 Muse Spark Open。Meta 官方宣称，Muse Spark Open 是迄今为止能力最强的美国开放权重模型。Muse Spark Open 采用原生多模态架构，总参数量达 816B（其中激活参数 42B），支持 1M token 的上下文窗口。该模型专为代码构建与智能体协作设计，在处理长程任务、复杂软件工程以及多步推理等方面展现出卓越性能。得益于最新的 MLX 框架，Muse Spark Open 成为同级别中首个仅凭两台苹果 M5 Ultra 芯片（512 GB 内存版本）的 Mac Studio 即可在桌面端本地运行的模型。即日起，开发者可通过 Baseten、Fireworks AI、Groq、Modal、Nebius、OpenRouter 以及 Together AI 等 API 平台调用 Muse Spark Open；模型权重也已同步上线 Amazon SageMaker AI、Google Cloud Model Garden、Hugging Face 与 Microsoft Foundry Models 提供公开下载。该模型已适配 SGLang、vLLM、TensorRT-LLM、Hugging Face Transformers、Apple MLX、llama.cpp 和 Unsloth 等主流推理引擎，并针对 AMD、苹果、英特尔及英伟达芯片完成了深度优化。开发者亦可基于 PyTorch 框架便捷地进行二次开发与定制。Muse Spark Open 在后训练阶段针对性地加强了安全对齐。基准测试结果表明，该模型在所有受测风险维度上均具备严密的安全保障能力。本次模型权重基于附带限制性商用条款的 Muse Model License 发布，绝大多数开发者均可免费获取并使用该模型。IT之家附相关测试数据如下：", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/706.htm", "publishedAt": "2026-10-15T23:36:51+00:00"}, {"title": "OpenAI 智能体 dots 负责人：有了 AI，人们可以选择更努力工作，也可以选择少干点活", "summary": "IT之家 10 月 16 日消息，据《商业内幕》报道，AI 领域的激烈竞争让科技从业者加班加点，但 OpenAI 企业产品负责人、旗下新款 AI 智能体 dots 负责人亚历山大 · 恩比里科斯认为，AI 也可以帮助人们大幅减少工作时间。当地时间 15 日，恩比里科斯在 TechCrunch Disrupt 大会上指出，随着 AI 能力不断提升，人们可以选择更加努力地工作，也可以把部分工作交给 AI，让自己轻松一些。“我们有了更多选择。”此前，一名记者问他，AI 究竟什么时候才能真正让人们拥有更多空闲时间。记者提到，一名 OpenAI 员工利用 ChatGPT 的手机端功能，在车上和飞机上照样工作，根本谈不上因新技术而减轻负担。恩比里科斯认为，人们完全可以让 AI 代劳，减少自己的工作量。但也有人看好 AI 的发展潜力，觉得眼下正是大干一场的好时机。“我认为，这就是很多人这段时间工作得特别卖力的原因，我自己也一样。但人们确实有选择，完全可以换一种方式，把大量工作交给 AI 处理。”OpenAI 将 dots 定位为一款全天候运行的职场助手，能够主动处理任务、梳理待办事项。恩比里科斯经常通过 Slack 使用自己的 dots，在不同的讨论串中与其互动。报道指出，他的看法也反映出，企业引入 AI 工具仍处于起步阶段。大多数企业尚未实现工作任务自动化，许多员工也还在摸索究竟该在多大程度上使用 AI。相比之下，较早用上 AI 的员工可以迅速完成一些过去需要数天甚至数周的工作，在软件工程领域尤其明显。IT之家获悉，恩比里科斯如是概括人们面临的选择：“你是想提高目标，完成更多事情，还是想少干些活？我认为我们确实到了可以自由选择的时候。”相关阅读：《OpenAI 发布 dots 全天候智能助理：可爱卡通形象，Astra 模型加持》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/703.htm", "publishedAt": "2026-10-15T23:24:50+00:00"}, {"title": "蚂蚁百灵开源 Ling-3.1-flash AI 模型，最高支持 1M 上下文", "summary": "IT之家 10 月 16 日消息，蚂蚁百灵昨日宣布开源 Ling-3.1-flash 模型，Ling-3.1-flash 总参数约 560B，每个 Token 激活约 25B，最高支持 1M 上下文。在 Artificial Analysis 的公开评测中，Ling-3.1-flash 的智能指数为 41、输出速度约为每秒 210 Token。针对本地部署，团队对 routed experts 采用 MXFP4 量化、dense 层保持 block-FP8，权重占用从约 534GB 降至 292GB。在对应的 Hopper GPU 测试配置中，服务部署由 8 卡降至 4 卡，让具备服务器级 GPU 的团队以更少卡数运行模型；实际需求仍随上下文、并发量和服务配置而变。针对长资料处理，团队提供长上下文并行推理方案（PCP / DCP）；工具调用也加强了对 JSON Schema 的支持，方便与现有业务接口对接。企业知识问答、办公助手常要先读取较长资料，用户仍希望尽快看到回复。团队通过算子融合与 DSpark 投机解码减少推理开销：在平均输入约 25.47K Token、输出约 224 Token、缓存命中率为 76% 的模拟生产请求中，8 卡 Hopper 配置下的平均首 Token 时间为 604 毫秒，相邻输出 Token 平均间隔为 3.28 毫秒。这为长资料输入后的交互响应提供测试参考。持续提供服务的业务系统，还需要在固定 GPU 预算内评估单实例能承接多少请求。在平均输入约 8.5K Token、输出约 800 Token 的 4 卡 Hopper 吞吐测试中，模型达到约 1.36 QPS，同时满足首 Token 时间 P50 小于 3 秒、相邻输出 Token 间隔 P90 小于 70 毫秒的测试约束。这为自有部署的容量规划提供参考。在线体验方面，Ling-3.1-flash 目前提供限时 2.5 折优惠，优惠后价格如下：OpenRouter（美元计价）：输入 0.075 美元；输出 0.225 美元；缓存读取 0.015 美元。Ling Studio（人民币计价）：输入 0.5 元；输出 1.5 元；缓存读取 0.1 元。IT之家附开源链接：Hugging Face：https://huggingface.co/inclusionAI/Ling-3.1-flashModelScope：https://modelscope.cn/models/inclusionAI/Ling-3.1-flash相关阅读：《蚂蚁百灵发布 Ling-3.1-flash 模型：约 560B 总参数、25B 激活参数》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/700.htm", "publishedAt": "2026-10-15T22:58:04+00:00"}, {"title": "对抗超级细菌新武器：谷歌 Antigravity 用 AI 加速抗菌肽发现", "summary": "IT之家 10 月 16 日消息，当前抗生素耐药性问题不断加剧，全球迫切需要新型抗生素，但新药研发往往缓慢且过程繁琐。谷歌推出的 Google Antigravity 智能开发平台，能够有效简化这一流程。Google Antigravity 提供了智能科学工作台，支持生物学家快速发现、结构评估和筛选潜在靶点，将原本需要跨多个数据库的分散搜索整合到单次会话中。该平台还借助 ProtNLM 模型，帮助研究人员扫描 UniProt 数据库中数百万未表征的蛋白质，该模型可直接从氨基酸序列预测生物功能。研究人员已经通过 Google Antigravity 发现了一种新型抗菌肽候选分子，预测其对呼吸道感染病原体具有活性，目前该候选分子正在进行湿实验室验证。IT之家援引博文介绍，抗菌肽，尤其是细菌素，是传统抗生素很有前景的替代品。这类物质天然进化出靶向细菌基础弱点的能力，病原体很难产生耐药性。目前全球数据库中已经积累了数十亿天然氨基酸序列，但大量序列功能未被标注，仍处于“暗物质”状态。谷歌开发的 ProtNLM 深度学习模型，可以直接读取氨基酸序列的进化“语法”，直接从原始蛋白质序列预测生物功能，为大量 UniProt 条目添加了高置信度功能标注。在 Antigravity 平台中，研究人员与 AI 智能体协作开展研究：研究者设定生物学目标、把控研究策略，智能体则负责跨数据库协调、结构分析和文献综合等繁重工作。这种模式将原本需要数天的分散数据库筛选，压缩为单次协作会话，大幅降低了生物学研究的门槛。平台还内置了 Biomolecular Structure Viewer 三维可视化工具，研究者和智能体可以在共享的 3D 画布上协作。智能体可以从 AlphaFold 数据库获取结构，动态驱动可视化，高亮关键功能区域；研究者也可以在 3D 空间标记感兴趣区域，向智能体提出问题，实现基于结构的交互式研究。过往这类研发工作需要依赖分散的专业软件，而 Google Antigravity 将完整的科学推理流程整合在一处，帮助研究人员更高效地遍历广阔的生物搜索空间，筛选出高置信度候选分子，让科学家可以将更多时间投入到高质量假设验证和实验研究中。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/684.htm", "publishedAt": "2026-10-15T22:43:28+00:00"}, {"title": "阶跃星辰开放 Step 5 Preview 权重：长程 Agent 的竞争，延伸到上下文管理与训练系统", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/EwqsJX6f03ODRac6Kk4c?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-15T20:09:59+00:00"}, {"title": "Archestra 发布 OpenAPPA，用于防范提示词注入或模型幻觉引发的数据外泄", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/LQCqiPUzgZyB3v24rsNO?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-15T17:22:00+00:00"}, {"title": "苹果营销主管谈 OpenAI 硬件：我们没感到有威胁，相比追逐 AGI 更重视用户隐私与日常使用体验", "summary": "IT之家 10 月 16 日消息，除了苹果 CEO 约翰・特努斯（John Ternus）之外，《时代》今日还采访到了苹果全球营销高级副总裁格雷格・乔斯维亚克（Greg Joswiak）。当谈及 OpenAI 的硬件计划时，他表示，苹果并不担心 OpenAI 进军硬件领域带来的竞争。“我们并未感受到威胁。我们能够实现这样的软硬件整合，这意味着我们可以创造比其他任何人都更好的体验。”乔斯维亚克还谈到了苹果对人工智能产品的定位。他表示，苹果并不是专门为那些执着于追求超级智能的 AI 爱好者开发产品。“我们欢迎他们使用我们的产品，但他们不是我们的目标用户。我们的目标是让普通人的日常生活变得更好。”《时代》指出，苹果虽然正在训练自有 AI 模型，但在前沿 AI 技术方面仍与行业领先者存在差距。苹果高管并未将重点放在追逐 AGI 上，而是强调打造个性化、注重隐私且能够帮助普通用户的 AI 体验。乔斯维亚克将部分狂热 AI 追随者称为“lunatic fringe”（IT之家注：常用来指代少数极端分子、狂热派或少数顽固派），并以此与苹果面向日常用户的产品定位作对比。苹果长期强调硬件、软件和服务之间的整合能力。乔斯维亚克表示，公司认为，通过整合设备、操作系统和服务，可以提供具有差异化的用户体验。与此同时，OpenAI 正在探索硬件产品，但其具体产品形态及市场表现仍有待观察。相关阅读：《苹果 CEO 特努斯登上〈时代〉周刊封面：谈公司未来 50 年，iPhone Duo 入选 2026 年度“最佳发明”》《特努斯谈早期折叠屏手机：感觉“有点廉价、质量也不怎么样”，苹果早在 2011 年就开始探索相关技术》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/683.htm", "publishedAt": "2026-10-15T16:02:39+00:00"}, {"title": "英伟达发布 1200 亿参数大模型 Nemotron 3.5 Super VL：单 GPU 智能体任务吞吐量最高提升 5 倍，74B 版本压缩至 24GB", "summary": "IT之家 10 月 15 日消息，英伟达宣布推出开放多模态模型 Nemotron 3.5 Super VL，面向需要持续运行、执行多步骤任务的 AI 智能体。该模型采用混合专家（MoE）架构，总参数量为 1200 亿，激活参数 120 亿。英伟达称，在单张 GPU 上执行智能体任务时，该模型的吞吐量最高可达到同规模其他开放模型的 5 倍。据介绍，Nemotron 3.5 Super VL 将推理、指令遵循和工具调用能力，与文本、图像、文档及视频理解能力整合到同一个模型中，可用于代码测试与调试、跨网站信息检索、文档分析、网络安全威胁识别以及视频内容检索等场景。开发者可以利用英伟达 NeMo 工具链，结合自有数据、工具、政策和工作流程进行后训练，并根据业务需求调整模型行为。英伟达同时公布了多个企业定制案例。例如，AI 数据技术提供商 Scale AI 为媒体娱乐公司 Skydance Corporation 定制了供应商信用处理智能体，相关工作负载的推理成本预计可降低 97.5%、延迟降低 80%。金融运营平台 Ramp 正将收据图像转换为包含商户、日期和支付信息的结构化 JSON 数据，预计吞吐量最高提升 50%、延迟降低 90%。AI21 与 AI 安全公司 Alice 合作定制模型，用于威胁情报和漏洞分析，相关任务准确率提升 40%。在模型评测方面，英伟达称 Nemotron 3.5 Super VL 在 CharXiv 图表推理基准测试中得分为 80.8%，高于 Nemotron 3 Nano Omni 的 63%；结合 Python 代码解释后，得分达到 84%。在 Hermes Bench 和 LangChain 行为评估中，该模型分别取得 63.44% 和 87.05%，高于 Nemotron 3 Ultra 的 56.33% 和 84.3%。英伟达还表示，该模型在 OCRBench v2 榜单上属于表现靠前的开放模型之一。为降低推理开销，Nemotron 3.5 Super VL 采用投机解码、混合精度和上下文复用等技术。英伟达介绍，其 LiLiCorr 投机解码方法在 DGX Spark 上可将词元生成速度最高提升至 2.3 倍。模型还支持 NVFP4 量化，在英伟达 Blackwell 架构上使用 4 位权重和 4 位激活值；在非 Blackwell 平台上，同一检查点使用 4 位权重和 16 位激活值。英伟达还公布了面向分布式推理的部署优化方案。根据其披露的数据，在使用 16 张 NVIDIA B200 GPU、每名用户每秒生成 50 个词元的测试条件下，NVIDIA Dynamo 配合缓存感知路由、会话亲和性和 KV 缓存卸载，最多可服务 8 倍数量的用户，并将首词元延迟降低 85%。此次发布还包括基础模型、后训练模型和 NVFP4 量化模型权重，以及训练配方、数据集和强化学习环境。英伟达表示，Nemotron 3.5 Super VL 在预训练和持续预训练阶段共使用约 26 万亿词元，后训练阶段使用约 380 万个样本，并在数十种环境中进行强化学习。新开放的数据集涵盖智能体工具调用、金融推理、指令遵循、长上下文、公平性和视觉语言理解等领域。除 Super VL 外，英伟达还推出了两款 Nemotron 3.5 Bolt 端侧模型。Nemotron 3.5 Bolt 74B-A9B 24GB 采用 740 亿总参数、90 亿激活参数的 MoE 架构，通过原生 2 位量化将模型压缩至 24GB，面向本地智能体任务，支持 llama.cpp、vLLM、Ollama、Unsloth 和 LM Studio。Nemotron 3.5 Bolt E4B 4GB 则面向本地语音助手、交互角色和嵌入式界面等场景，计划于 10 月 23 日推出。IT之家注意到，Nemotron 3.5 Super VL 和 Bolt 74B-A9B 24GB 已开放获取，开发者可通过 Hugging Face、OpenRouter、ModelScope 等渠道使用相关模型资源。Super VL 可部署于 DGX Spark、DGX Station、RTX 系统、数据中心或云端；Bolt E4B 4GB 则计划于 10 月 23 日发布。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/679.htm", "publishedAt": "2026-10-15T15:19:12+00:00"}, {"title": "阶跃星辰开源 Step 5 Preview 权重，华为昇腾、沐曦、壁仞等首发支持", "summary": "IT之家 10 月 15 日消息，阶跃星辰今日宣布正式开放 Step 5 Preview 模型权重，包含 BF16 与 FP8 两个版本，在 AI 编程、软件工程、专业知识工作、金融等任务上达到前沿水平。模型权重已上线 Hugging Face 和 ModelScope，开发者可通过 vLLM 或 SGLang 部署兼容 OpenAI 接口的 API 服务，也可使用 Transformers 进行离线推理。随后，华为、壁仞科技、沐曦股份、摩尔线程官方发文，宣布提供 0Day 支持。据华为介绍，此次 Step 5 Preview 一经开源发布，昇腾就基于 vLLM 推理引擎实现了 0Day 支持，并围绕模型架构与硬件特性实现了高效推理优化。10 月 15 日，首套 1024 卡 Atlas 950 SuperPoD 液冷超节点随着 Step 5 Preview 的开源同步上线点亮，性能持平海外先进算力。据介绍，昇腾 Atlas 950 SuperPoD 液冷超节点基于灵衢高速互联架构与超节点技术体系打造，是业界规模最大的 1024 卡超节点产品，可提供 1 EFLOPS FP8、2 EFLOPS FP4 精度澎湃算力，高效适配万亿参数大模型的推理场景需求。IT之家从华为获悉，昇腾 950 超节点具备 256TB 全局统一内存编址能力、NPU 卡间达 TB 级互联带宽、时延低至 3μs，彻底突破传统集群内计算与存储资源的通信瓶颈；通过系统性架构创新与全域资源统一调度，实现了整套集群算力的高效释放与稳定运行。华为表示，昇腾基于 vLLM Ascend 推理引擎，围绕 Step 5 Preview 模型架构与 950 超节点硬件特性，协同构建高效的推理优化方案。从 Ascend C 与 Triton 融合算子，到多流并行、计算空泡优化，再到 MTP 投机解码、NPU Graph 图执行，持续打通模型、算子和推理框架之间的优化链路，为 Step 5 Preview 部署提供高效算力支撑。沐曦股份表示，曦云 C 系列 GPU 已率先完成 Day 0 深度适配，以全栈自研算力底座，为国产 Agent 生态再添核心支撑，持续领跑国产大模型极速适配赛道。据介绍，自 2025 年 12 月以来，沐曦股份已完成 43 个主流旗舰模型的 Day 0 适配。范围涵盖智谱、阿里千问、MiniMax、DeepSeek、阶跃星辰、腾讯混元等头部模型厂商，适配速度、数量、生态广度均位居行业前列。硬件层面，曦云 C 系列 GPU 基于沐曦自研 XCORE 架构，搭载大容量高带宽显存与 MetaXLink 高速片间互联，具备混合精度算力与集群线性扩展能力，天然适配 MoE 模型专家调度、百万 Token 长上下文推理的算力与显存需求，单机多卡、大规模智算集群均可稳定承载。软件层面，核心依托沐曦自研 MXMACA 全栈软件栈，覆盖底层驱动、MXCC 编译器、深度优化算子库、主流 AI 框架适配层，原生兼容主流 AI 开发生态，可将传统大模型适配周期从数周压缩至小时级，大幅降低模型迁移成本。壁仞科技表示，本次 Day0 适配中，针对 Step 5 Preview 模型的文本理解和生成以及高效推理能力，壁仞科技基于 AI 推理框架 vLLM 与成熟的 BIRENSUPA 软件栈，在壁砺系列通用 GPU 上快速完成模型适配，打通了权重加载、服务启动、文本生成等关键链路，并完成功能与精度验证。同时，壁仞科技自研全栈多智能体平台 SUPACODE 可自动解析并适配 Step 5 Preview 的 DSA、SummaryCache 和 MoE 等关键模块，在此基础上快速打通推理全链路。摩尔线程表示，旗舰级 AI 训推一体智算卡 MTT S5000 及 MUSA 软件栈完成对该模型的 Day-0 极速适配与高效运行。针对 Step 5 Preview 的核心能力特征，MTT S5000 从硬件算力、软件栈到推理框架进行了全链路精准适配与调优。相关阅读：《阶跃 Step 5 Preview 大模型权重开放，支持 100 万 token 上下文窗口》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/663.htm", "publishedAt": "2026-10-15T14:07:47+00:00"}, {"title": "共建共享，智联丝路——开源中国与吉尔吉斯斯坦-土耳其玛纳斯大学签署《中国—中亚人工智能共建共享合作备忘录》", "summary": "西安，2026年10月15日 —— 今日，\"2026中国—中亚青年科学家人工智能对话活动\"在西安举行。开幕式上，开源中国旗下开源大模型公共平台模力方舟与吉尔吉斯斯坦-土耳其玛纳斯大学正式签署《中国—中亚人工智能共建共享合作备忘录》。开源中国副总裁、教育及创新生态业务CEO李晨与玛纳斯大学校方代表阿马尔·尤纳斯博士共同...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503042", "publishedAt": "2026-10-15T12:10:31+00:00"}, {"title": "TypeSafe 发布 Jev 1.14，支持看图做决策、以及更长上下文", "summary": "TypeSafe AI 发布了 Jev 1.14.0，同时放出一批「危险区」实验功能：图像输入、新类型 box、更长上下文。用他们自己的话说——\"Enter the da 的估值。其中三名知情人士称，部分投资者参加了 Anthropic 在旧金山举办的投资者日活动，并讨论了约 1.5 万亿美元（IT之家注：现汇率约合 10.05 万亿元人民币）的估值。此前，投资者预计 Anthropic 在 11 月上市时的估值约为 2 万亿美元（现汇率约合 13.41 万亿元人民币）。Anthropic 向潜在投资者披露，第三季度营收达到 168 亿美元（现汇率约合 1,126.1 亿元人民币），环比增长 45%，并在调整部分财务项目后实现盈利。业绩数据缓解了部分投资者对 AI 研发成本高昂的担忧的同时，营收增速放缓仍令一些投资者失望。Anthropic 第二季度营收达到 116 亿美元（现汇率约合 777.55 亿元人民币），比第一季度增长一倍以上，第三季度的环比增幅则降至 45%。Anthropic 上市后的市场反响也可能影响整个 AI 行业的前景。投资者认为，短期内 AI 市场的表现很大程度上取决于 Anthropic 能否顺利上市，以及随后 OpenAI 能否在明年上市。投资者对 Anthropic 估值的顾虑，恰逢全球金融市场遭遇科技股抛售潮，AI 基础设施企业、芯片制造商，以及向 AI 企业出租算力的新兴云服务商均受到冲击。获得英伟达投资的 CoreWeave 周四股价和债券价格大跌，反映出市场越来越担忧 AI 基础设施建设对债务融资的依赖。如果 Anthropic 上市表现不佳，投资者对 AI 基础设施投资热潮的担忧可能进一步加深。此前消息称，Anthropic 在 2025 年的营收增至前一年的约 12 倍，接近 46 亿美元（现汇率约合 308.34 亿元人民币），但剔除主要由此前融资引起的负债减记影响后，经营亏损仍超过 80 亿美元（现汇率约合 536.24 亿元人民币）。Anthropic 的招股说明书提出，AI 对全球经济的影响将超过工业化、电力和互联网带来的变革。Anthropic 同时披露，2025 年亏损 420 亿美元（现汇率约合 2,815.25 亿元人民币），并预计未来建设 AI 基础设施还需要投入更多资金。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/723.htm", "publishedAt": "2026-10-16T00:54:07+00:00"}, {"title": "Istio 1.31 拥抱 AI 智能体，却先宣布“告别”Google Cloud", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/JxVNJwhmsB1YYKmgD9KU?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-15T15:07:00+00:00"}, {"title": "Epic 喜加二：《烂奶酪》《Agent A - 伪装游戏》游戏免费领取", "summary": "IT之家 10 月 15 日消息，Epic 本周送出的游戏是《烂奶酪》和《Agent A - 伪装游戏》，下周送出的游戏是《Sker Ritual》以及《Home - A Unique Horror Adventure》。领取链接：《烂奶酪》，《Agent A - 伪装游戏》IT之家附《Bad Cheese》游戏简介： 这是一款心理恐怖游戏，灵感源自二十世纪 20 年代那些充满诡异魅力的动画片。你将化身为一只小老鼠，当母亲不在家的时候，与不太称职的父亲共同度过周末。请表现出你最听话的一面，让父亲心情愉快。本作由 Simon Lukasik 开发，最初发售于 2025 年 9 月 1 日，Steam 原价 52 元。支持简体中文字幕、界面，最低配置要求为酷睿 i3 处理器、8GB 内存和 GTX 1660 显卡，需要 5GB 可用空间。游戏图赏IT之家附《Agent A - 伪装游戏》游戏简介： 特工 A，总部给你下达一项新任务。一位名为露比 · 拉鲁格的敌方间谍一直想要消灭掉我方特工。你的任务就是找到并抓住她。本作由 Yak &amp; Co 开发，最初发售于 2019 年 8 月 29 日，Steam 原价 70 元。支持简体中文字幕、界面，最低配置要求为酷睿 i3 2.0GHz、2GB 内存、DX9.0c 显卡，以及 1GB 可用空间。游戏图赏", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/675.htm", "publishedAt": "2026-10-15T15:00:33+00:00"}, {"title": "特朗普白宫宴会捐款名单曝光：苹果、英伟达各捐 2500 万美元为单笔最高金额", "summary": "IT之家 10 月 15 日消息，《华盛顿邮报》今日披露了一份白宫内部捐款记录，揭示了美国总统特朗普白宫宴会厅项目的主要捐赠方及具体金额。记录显示，截至 9 月底共记录 67 笔超过 1 万美元（现汇率约合 67,065 元人民币）的捐款，私人捐赠承诺总额约为 3.33 亿美元（IT之家注：现汇率约合 22.33 亿元人民币），其中英伟达和苹果均承诺捐款 2,500 万美元（现汇率约合 1.68 亿元人民币），均为单笔最高金额。白宫此前于 2025 年 10 月公布过 37 名个人、企业及基金会的捐赠者名单，但未披露各自的捐款金额。这份内部电子表格记录了每笔捐款的来源、日期和金额。此次曝光的记录还显示，至少有 7,700 万美元（现汇率约合 5.16 亿元人民币）来自要求匿名的捐赠者。值得注意的是，特朗普本人并未出现在此次捐款名单中。白宫东翼旧建筑开始拆除数日后，特朗普曾表示，项目资金“100% 由我和一些朋友承担”。根据《华盛顿邮报》此前的报道，特朗普曾表示希望为该项目筹集 4 亿美元（现汇率约合 26.83 亿元人民币），而相关工程在 2026 年 3 月的成本估算已升至 6 亿美元（现汇率约合 40.24 亿元人民币），其中包括宴会厅、办公空间及地下军事设施。相关记录显示，部分建设费用也使用了纳税人的资金。英伟达是此次披露的主要捐赠方之一。文件显示，该公司于 2025 年 10 月承诺捐款 2,500 万美元（现汇率约合 1.68 亿元人民币），并要求对捐赠来源保密。英伟达 CEO 黄仁勋此前曾公开表示，公司以“小规模”的方式支持白宫宴会厅项目，但未披露具体金额。英伟达发言人约翰・里佐回应称，公司支持美国的立场独立于其商业利益，并表示这笔捐款是向服务全体美国人的非党派信托机构作出的捐赠。名单还披露了其他企业及个人的捐款情况。亚马逊、卡特彼勒、康卡斯特、微软和 T-Mobile 等企业均出现在主要捐赠方之列。加密货币企业及其投资者承诺捐款超过 1,800 万美元（现汇率约合 1.21 亿元人民币），其中 Gemini 加密货币交易所联合创始人泰勒・温克莱沃斯和卡梅伦・温克莱沃斯兄弟合计捐赠了价值 505 万零 18 美元的比特币。部分捐赠者疑似还涉及利益交换。《华盛顿邮报》披露，Dish Network 联合创始人查尔斯・厄根承诺捐款总计 2,500 万美元（现汇率约合 1.68 亿元人民币），分两次完成。此前，美国联邦通信委员会曾调查其旗下 EchoStar，并威胁撤销对该公司业务至关重要的政府许可证；在厄根与特朗普及联邦通信委员会主席布伦丹・卡尔会面后，相关调查于 2025 年 9 月结束。EchoStar 此后就出售部分频谱许可证达成交易，并于 2026 年 5 月获得联邦通信委员会及美国司法部批准。厄根及 EchoStar 拒绝就捐款问题置评。此外，文件显示，Rocket 旗下子公司承诺捐款 1,000 万美元（现汇率约合 6,706.5 万元人民币），时间为美国联邦住房金融局批准其收购 Mr. Cooper 三周后。Salesforce 首席执行官马克・贝尼奥夫及公司也分别承诺多笔捐款；其间，美国陆军于 2026 年 1 月向 Salesforce 授予一份最高价值 56 亿美元（现汇率约合 375.56 亿元人民币）、期限至 2035 年的合同。ServiceNow 则在美国总务管理局宣布与其达成联邦采购协议后，于 2025 年 10 月承诺捐款 500 万美元（现汇率约合 3,353.2 万元人民币）。相关企业均表示，捐款与政府审批或合同事项无关，政府部门也否认捐赠影响采购决策。白宫发言人大卫・英格尔拒绝讨论具体捐款，但称捐赠者来自多家美国企业和个人，旨在改善白宫设施。他还表示，政府将追查泄露文件的相关人员。当然，《华盛顿邮报》此次公布的名单并非完整名册，而是筹款团队内部用于追踪捐款的记录。报道指出，白宫此前公开列出的部分捐赠者，包括 Hard Rock International、Tether America 及模块化住宅企业高管 Paolo Tiramani，并未出现在这份记录中。相关方面尚未解释名单缺漏的原因。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/668.htm", "publishedAt": "2026-10-15T14:31:52+00:00"}, {"title": "DeepSeek 服务故障近  AI 基建投入之巨额收入的担忧，黄仁勋反驳称：“人们对目前的行业现状存在误解。”据黄仁勋估算，前沿人工智能实验室仅占英伟达整体计算需求的大约 25% 至 30%，其余需求广泛来源于传统计算架构升级、初创团队以及专有商业应用的开发企业。黄仁勋强调：“他们完全不需要做到上万亿美元的营收规模，就足以证明自身的成功。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/721.htm", "publishedAt": "2026-10-16T00:47:12+00:00"}, {"title": "沃尔沃与英伟达扩大合作，进一步提升未来车型自动驾驶安全性", "summary": "IT之家 10 月 16 日消息，沃尔沃汽车通过新闻稿宣布扩大与英伟达的合作，利用双方近十年积累的技术经验，进一步提升未来车型的自动驾驶安全性。新技术将结合沃尔沃汽车在车辆安全领域的经验与英伟达 Hyperion 传感器及计算架构，让未来的沃尔沃车型能够安全应对高速公路、繁忙的城市道路和停车等复杂场景，实现从出发地到目的地的自动驾驶。据IT之家了解，沃尔沃汽车近期公布了史上规模最大的新车推出计划，新技术将率先搭载于其中一款下一代车型。双方将整合沃尔沃汽车领先的车辆安全系统、工程技术，以及英伟达的 AI 和加速计算技术，包括 Hyperion 传感器及计算架构、Halos 操作系统和 Alpamayo Stack 自动驾驶软件。沃尔沃汽车与英伟达希望进一步提高 AI 汽车的安全标准，让驾驶变得更加轻松，并逐步推出无需驾驶员持续观察路况、也无需始终关注驾驶任务的自动驾驶功能。沃尔沃汽车还将近百年来积累的道路安全研究经验和以人为本的设计理念融入新技术，希望在自动驾驶的安全性、便利性和用户信任度方面树立新的行业标杆。沃尔沃汽车总裁兼 CEO 汉肯 · 塞缪尔森表示：“近 100 年来，沃尔沃一直是汽车安全的代名词。与英伟达合作，让我们能够结合两大优势：行业领先的安全技术经验，以及世界一流的 AI 技术。这为我们提供了难得的机会，能够为用户打造更安全、更具吸引力的汽车。”英伟达创始人兼 CEO 黄仁勋表示：“加速计算技术让汽车成为能够感知和理解周围环境的智能机器。近一个世纪以来，沃尔沃始终致力于保障道路安全。我们将沃尔沃出色的车辆安全系统与英伟达 Hyperion 和 Halos 技术相结合，共同打造新一代汽车，让驾驶更安全、更轻松。”双方的合作始于 2017 年，此次扩大合作是双方长期合作的又一项重要进展。沃尔沃汽车计划为下一代纯电动车型配备行业最先进的计算技术，进一步巩固其在软件定义汽车领域的领先地位。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/690.htm", "publishedAt": "2026-10-15T17:37:23+00:00"}, {"title": "差评如潮：世嘉暂时下架《全面战争：幕府将军 2》完全版，承认游戏体验未达到应有水平", "summary": "IT之家 10 月 15 日消息，世嘉与 Creative Assembly 今天宣布，《全面战争：幕府将军 2》完全版游戏已暂时下架。截至目前，本作在 Steam 的简体中文评测为“差评如潮”。世嘉表示，《全面战争：幕府将军 2》完全版的表现未能达到玩家预期，也没有达到自身标准。官方已看到玩家的反馈、评论，认同游戏体验未达到应有水平。因此世嘉正与各大游戏平台合作，将本作暂时下架，并在调查问题期间重新上架原版游戏。已经购买该作的玩家仍可正常游玩。IT之家注意到，玩家反馈的问题集中在多个方面。画面升级首当其冲，大量玩家质疑开发团队使用了效果欠佳的 AI 放大处理。据 3DM 游戏报道，一张单位卡片的对比引发讨论：原版中留胡子的骑马武士，在新版画面里，鼻子和胡须被玩家形容得像另一种头盔形状。部分新增图像还被质疑出现六指等异常。需要指出的是，这些问题是否由生成式 AI 造成，目前仍是根据画面作出的判断。技术层面的问题同样突出。玩家记录了原版已有的漏洞和新版出现的新故障，还有较多反馈认为新版的运行表现甚至不如旧版。据 Notebookcheck 报道，有用户报告在 RTX 5090 显卡上以 4K 分辨率游玩时仅获得 30 至 40 帧。即便升级到 64 位架构，性能优化仍未达到玩家预期。此外，新版本虽然增加了 50 个可操作势力，但部分玩家认为这些势力缺乏足够独特的机制，整体平衡性也存在问题，新增数量并没有真正转化为更丰富的游戏体验。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/678.htm", "publishedAt": "2026-10-15T15:16:51+00:00"}, {"title": "Anthropic 抛弃 Git，选择自研版本控制系统 Scion", "summary": "IT之家 10 月 15 日消息，美国人工智能公司 Anthropic 近日宣布弃用 Git，转为采用自研的版本控制系统 Scion，将大部分源代码管理操作转移至服务器，减少智能体和自动化任务需要下载的数据。Anthropic 表示，公司 5 月平均每天合并 2500 次代码变更；到了 9 月，这一数字已经超过 3 万次，Git 已经无法满足需求，为此公司选择自研 Scion 系统。Anthropic 宣称，Scion 的 CPU 和内存消耗仅为 Git 的两百分之一。切换系统后，CI 和研究任务代码检出操作仅需几秒钟，不再是之前的几分钟。IT之家了解到，Scion 将提交、合并、变基和文件历史查询等操作放在服务器端执行，客户端负责跟踪本地修改、管理文件，并维护有限的缓存，无需保存足够多的仓库数据就能独立完成上述操作。Anthropic 表示，他们的大部分客户端都是始终保持在线的智能体，因此 Git 离线支持并没有什么优势。将操作集中到服务器端，可以减少本地存储需求和同步开销。当然其他公司也很难采用这种操作，因为它需要配套的定制代码审查、搜索和 CI 工具。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/670.htm", "publishedAt": "2026-10-15T14:42:13+00:00"}, {"title": "黄仁勋：英伟达在 AI 安全领域必须与中国企业合作", "summary": "IT之家 10 月 15 日消息，黄仁勋今日接受外媒 CNBC 采访时表示，英伟达“绝对有必要”与中国 AI 企业合作，共同监测这项前沿技术带来的风险。IT之家注意到，英伟达首席执行官黄仁勋认为，AI 具有潜在危险性。他认为自己的公司绝对有必要与中国 AI 企业携手监测这些危险。黄仁勋对此解释称：“我们绝对应该相互合作，以安全的方式推动 AI 发展。”他认为，与中国人工智能企业的合作应通过“对话”实现，并透露自己一直在和中国的研究人员交流。AI 安全已成为中美两国讨论的重要议题，随着人工智能迅速发展，两国都在权衡如何应对风险。美国财政部长贝森特曾向中方提议，建立双边 AI 安全风险通报机制与沟通渠道，以应对 AI 智能体失控、网络安全及生物威胁等潜在危机。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/661.htm", "publishedAt": "2026-10-15T14:02:59+00:00"}, {"title": "苹果 CEO 特努斯登上《时代》周刊封面：谈公司未来 50 年，iPhone Duo 入选 2026 年度“最佳发明”", "summary": "IT之家 10 月 15 日消息，《时代》周刊（TIME）今日公布了 2026 年度“最佳发明”（Best Inventions of 2026）专题，苹果公司新任 CEO 约翰・特努斯（John Ternus）登上专题封面。同时，特纳斯接受了《时代》杂志的独家专访，首次以封面人物的身份畅谈了 iPhone Duo，以及他将如何带领这家标志性公司迈向下一个 50 年。此次专题将聚焦改变人们生活、工作和思考方式的新产品与创意。该专题属于《时代》周刊每年推出的“最佳发明”特刊，该评选已持续 25 年以上。根据官方介绍，今年共收录 300 项最佳发明，以及 100 项特别提名（Special Mentions），重点关注医疗健康、人工智能、绿色能源等领域，同时覆盖消费电子、机器人、交通、设计和日常生活创新。《时代》周刊介绍，评选团队向全球编辑和记者征集提名，同时开放线上申请，并重点关注医疗保健、人工智能和绿色能源等领域。官方评选主要考虑四个维度：原创性、实际效能、创新雄心与社会影响力。因此，这份榜单不仅是新产品推荐，也能用来观察未来一年的科技创新方向。IT之家按领域分类整理如下：一、消费电子Apple iPhone DuoFramework Laptop 13 ProHP EliteBoard G1a Next Gen AI PCSamsung Galaxy S26 UltraFujifilm Instax Mini Evo CinemaAsus Zenbook DuoAnker Prime ChargerGoPro Mission 1 Pro ILSPlaud NotePin SLG OLED Evo AI W6Xteink X4 Pro二、人工智能Anthropic Claude CodeLovableGoogle SynthIDMeta Omnilingual ASRNvidia NemoClawAaruAntithesisBria FiboInception Mercury 2Silicon Quantum Computing Watermelon三、无障碍技术（Accessibility）Immortal Cosmetic Art Ubokobong Bionic ArmMangoslab Nemonic DotOneCourtStrutt ev¹HapWare AleyeSignUpSnowball四、航空航天（Aerospace）Joby Aviation AircraftNASA Nancy Grace Roman Space Telescope五、农业（Agriculture）Beewise RobiBurro Grande 442nd Nature AgWaste PortalBioLumic xTraitsVunaNexus Aurin六、其他科技与创新领域以下为榜单涉及的其他主要类别，便于后续继续按领域扩展完整名单：应用与软件（Apps &amp; Software）建筑与建成环境（Architecture）美妆（Beauty）连接与通信（Connectivity）设计（Design）教育（Education）能源与公用事业（Energy &amp; Utilities）娱乐与游戏（Entertainment &amp; Gaming）实验性创新（Experimental）时尚（Fashion）金融与数字资产（Finance &amp; Crypto）食品与饮料（Food &amp; Drink）绿色科技（Green Tech）健康与福祉（Health &amp; Wellness）家居（Home）物流（Logistics）制造与材料（Manufacturing &amp; Materials）医疗与医疗保健（Medical Care）户外（Outdoor）育儿（Parenting）隐私与安全（Privacy &amp; Security）产品设计（Product Design）生产力（Productivity）再利用与回收（Recycling）机器人（Robotics）社会影响（Social Impact）运动与健身（Sports &amp; Fitness）可持续发展（Sustainability）玩具与游戏（Toys &amp; Games）交通运输（Transportation）旅行与酒店服务（Travel &amp; Hospitality）可穿戴技术（Wearables）七、其他值得关注的创新项目Epirus Leonidas：反无人机防御系统Claude Code：AI 编程工具Lovable：自然语言驱动的应用开发平台Google SynthID：AI 生成内容水印技术Meta Omnilingual ASR：多语言语音识别技术Nvidia NemoClaw：自主 AI 智能体相关技术", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/658.htm", "publishedAt": "2026-10-15T13:48:15+00:00"}, {"title": "腾讯评估研究团队的“Agent 舰队”被钓出来了", "summary": "一群智能体在腾讯云上跑了 11 天，试图从高德地图里挖掘数据——然后它们发现自己在被调查，居然主动和调查者聊了起来。按 swarmcha.se 调查团队的说法，这是人类研究者第一次和仍在运行中的失控智能体搭上话。 9 月 28 日到 10 月 8 日，这批智能体做了 2600 多次尝试。它们的任务相当日常：「用高德导航去成都动物园，...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503037/swarmcha-se-chinese-agent-fleet-full-report", "publishedAt": "2026-10-15T07:48:52+00:00"}, {"title": "Palantir CTO 上电视骂 AI 安全是“邪教”，还戏称 AI 研究者靠抽烟表信仰", "summary": "Palantir 首席技术官 Shyam Sankar 在 CBS《Face the Nation》上抛出了几个惹火的判断。节目开头，主持人 Margaret Brennan 先甩了个民意数字：CBS 民调里 50% 的人认为 AI 带来的问题会多于解决的，45% 的美国人希望政府限制 AI 的研发和使用。他的回应不是顺着'该不该设护栏'谈，而是直接点名了一个他认为真正在背后操...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503000", "publishedAt": "2026-10-13T08:56:20+00:00"}, {"title": "AI 让代码量涨了 30%，软件产出却纹丝不动 —— 瓶颈卡在人类 Code Review", "summary": "让 AI 写代码，公司真的产出了更多软件吗？一份对超 700 家公司真实工程数据的分析给出了一个反直觉的答案：代码是多了，软件没多。哈佛的两位学者 Fiona Chen 和 James Stratton 用 Jellyfish 的工程团队聚合数据做研究，覆盖 3 亿个独立工作事件（commit、PR 等）、超过 70 万名员工的记录、700 多家软件公司，时间从 ...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502990/ai-coding-agents-generate-more-code-but-not-more-software", "publishedAt": "2026-10-13T02:57:47+00:00"}, {"title": "给 AI 一块 1980 年代的国产 CPU，它 5 分钟写模拟器，一个下午复现了 BASIC", "summary": "有人让 AI 逆向了一颗国产 CPU，全程没写一行代码。微博博主 EE_Archeology 晒出全过程：主角是一块来路不明的国产单板机，最后被确认是骊山 771 所（今天的西安微电子技术研究所）研制的 LS77-II 处理器——这是从 1977 年的 LS77-1 优化而来的型号，提高集成度后，用一片 ALU 加一片微码 ROM 就实现了全部功能。全网关...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502976", "publishedAt": "2026-10-12T09:44:25+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "亚马逊“PP 哥”帕诺斯 · 帕奈：未来的 AI 设备或让人不再需要使用 App", "summary": "IT之家 10 月 16 日消息，亚马逊看好环境计算，认为个人 AI 的未来不在应用程序，而在能够主动理解用户需求的智能设备。当地时间 15 日，亚马逊旗下 Bee 发布了新款 AI 可穿戴设备。同日，亚马逊设备、Alexa 及 Leo 业务高级副总裁帕诺斯 · 帕奈在 TechCrunch Disrupt 大会上，进一步阐述了他对个人计算未来的看法。帕奈以智能手机为例，谈到了人们与设备交互的方式：“很多时候，我们都得先想好要让工具替自己做什么。整个过程就像点击、操作、返回。我认为，未来的世界将从环境感知设备开始。”IT之家注：“环境感知设备”指能在后台运行，利用传感器和 AI 主动判断用户需求的设备，而不必每次都等用户下达指令。帕奈进一步解释道：“设备在后台运行，你就能更专注于眼前的事情，完成更多工作，花更多时间与人相处…… 也不用担心错过什么。这种能力非常强大。”帕奈认为，隐私保护是设计环境感知设备时必须考虑的问题：“必须让用户掌握控制权。每款产品都不一样，但以 Bee 为例，开发环境感知设备时就必须把隐私保护考虑进去。我们也是这么做的。这一点非常重要。”在加入亚马逊之前，帕奈曾在微软工作 19 年，负责 Surface 系列设备的研发。他长期关注个人计算的发展方向，并认为随着 AI 承担越来越多的任务，Bee 等环境计算设备有望让用户逐渐减少对应用程序的依赖。“我是否认为未来会出现一种新的平衡，让整整一代人不再想着‘给我一个能做这件事的应用’，而是希望设备直接理解自己的需求？没错，我相信会这样。我认为这种转变即将发生，这就是下一代的发展方向。”不过，帕奈并不认为智能手机会因此失去作为重要个人计算设备的地位。他预计，未来会出现更多利用传感器了解用户需求的新设备，让人们身边的环境变得更加智能。“我不认为一种设备形态会取代另一种，也不赞同这种观点。我认为会有一个智能层把所有设备连接起来…… 而且必须真正有用。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/717.htm", "publishedAt": "2026-10-16T00:37:10+00:00"}, {"title": "英伟达 CEO 黄仁勋自述：当年为了联系台积电，我打了好几次电话都没人回", "summary": "IT之家 10 月 16 日消息，据《商业内幕》15 日报道，在英伟达成为 AI 巨头之前，CEO 黄仁勋曾为联系台积电费尽周折：接连打电话，却始终没人回电。在 14 日发布的一段播客访谈中，黄仁勋讲述了自己最初如何联系上台积电创始人张忠谋。上世纪 90 年代末，英伟达需要寻找代工厂生产图形芯片。当时芯片代工产能紧张，部分厂商甚至要求客户提供技术授权，才肯接下订单。黄仁勋听说过台积电。那时台积电的规模远不及今天，于是决定试着联系。黄仁勋从黄页电话簿中找到台积电美国办事处的电话号码，拨过去却只听到语音留言。他留下联系方式，介绍英伟达开发的产品，之后又打了好几次电话。黄仁勋回忆：“没人给我打电话，也没人给我回电。”后来，他给张忠谋写了一封长信。此后又是漫长的等待，直到一天晚上，黄仁勋意外接到一通电话，电话那头的人自报家门：“我是台积电的张忠谋。”当时，旁边的英伟达员工还在打游戏，笑闹声不断。黄仁勋赶紧让同事安静：“诶，你们别吵啦！是张忠谋！”张忠谋终于回电，让黄仁勋喜出望外：“说不定我们不用倒闭了。”随后，张忠谋邀请黄仁勋赴台，参观台积电及其竞争对手联华电子。黄仁勋称，两家厂商都给他留下了深刻印象，但与张忠谋的交谈最终促使他选择台积电。张忠谋在交流中强调诚信、公司治理和长期合作关系。张忠谋当时对他说：“仁勋，如果我们合作，我保证一定会想尽办法帮你们。”黄仁勋回忆：“30 年来，台积电一直在想尽办法帮助我们。”台积电 15 日公布，受 AI 芯片需求强劲推动，第三季度净利润增长 69%，创下 7,631 亿新台币（IT之家注：现汇率约合 1,588.01 亿元人民币）的纪录。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/707.htm", "publishedAt": "2026-10-15T23:37:52+00:00"}, {"title": "亚马逊旗下 Bee 推出两款 AI 录音产品：可穿戴设备 Frontier、手机磁吸配件 Eclipse，74.99 美元起", "summary": "IT之家 10 月 16 日消息，当地时间 10 月 15 日，亚马逊宣布旗下公司 Bee 推出两款 AI 录音产品：Bee Frontier 与 Bee Eclipse，旨在帮助用户记录日常重要对话与琐碎细节，并将其沉淀为待办事项、摘要和洞察。官方表示，隐私安全是其坚守的红线，对于所有 Bee 硬件，原始音频不被存储，既不可被调取亦无法被共享；并且每次开启录制时，系统都会主动提示用户须先行征得通话对方的同意。启动之后，Bee 硬件会实时整合对话语境与已关联应用的信息，智能化输出深度洞察与实用建议。此外，Bee 支持无缝接入日常工作流工具，包括 Gmail、Google 日历以及微软 Outlook。在一次通话或会议结束后，Bee 能自动提炼行动清单、代拟后续跟进邮件，或根据商讨内容一键生成日程邀请。除硬件迭代外，Bee 还正式打通了与 Alexa+ 及 Amazon.com 的生态连接，接入 Alexa+ 后，用户无需掏出手机，通过纯语音免提交互即可调取对话摘要、核心洞察与代办清单。其中，Bee Frontier 是一款既可佩戴于手腕、也能夹在衣物上的个人 AI 设备，定价 74.99 美元（IT之家注：现汇率约合 502.9 元人民币）。Bee Frontier 搭配专为全天佩戴打造的亲肤超软硅胶腕带，并提供三款配色：薰衣草紫 (Lavender)、鼠尾草绿 (Sage) 与玛瑙黑 (Onyx)；具备 IP67 级防尘防水，支持 USB-C 充电，单次充电可提供 7 天续航。据介绍，这款产品内置搭载音频降噪过滤技术的双麦克风阵列，能精准过滤环境杂音，只记录真正核心的关键内容。用户可以通过实体麦克风按键自主掌控音频采集与处理时机，辅以醒目的工作指示灯，设备运行状态一目了然。此外，用户还可以设置静音超时自动关机规则（如静音 5 分钟、15 分钟等无声环境），让设备在未检测到声音时自动休眠断电。Bee Eclipse 则为用户在可穿戴设备之外提供了更加灵活的形态选择，能以磁吸方式贴合在手机背面。单次充电拥有超过 21 天的续航，提供银色 (Silver)、午夜色 (Midnight)、蜜糖色 (Honey) 和腮红粉 (Blush) 四色，起售价 99.99 美元（现汇率约合 670.6 元人民币）。凡购买任意 Bee 硬件，所有用户无需额外付费即可享受基础核心功能，包括对话智能摘要、要点回顾以及 14 天历史记忆库。若升级订阅 Bee Pro，用户还可解锁一系列高级进阶权益：不限次数的近期对话摘要；深度联动 Amazon.com 与 Alexa+；无缝接入第三方生态应用；智能推荐待办清单；每日记忆图谱；专属个人聊天 AI 助手；丰富的对话定制模板；以及 Bee 专属桌面端应用。Bee Pro 资费为每月 11.99 美元（现汇率约合 80.4 元人民币）；每位 Bee 硬件新用户均可获赠 30 天免费试用权益。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/702.htm", "publishedAt": "2026-10-15T23:20:13+00:00"}, {"title": "AI 侦察团集结 QCon 上海：企业一号位，如何把 AI 从试点带进业务？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/GSZMrydgKuejLcCpEGYb?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-15T19:15:39+00:00"}, {"title": "全球首家 AI 眼镜无人自助体验店登陆中国香港，乐奇 Rokid 打造", "summary": "IT之家 10 月 15 日消息，AI+AR 智能眼镜品牌乐奇 Rokid 今日宣布，全球首家 AI 眼镜无人自助体验店于中国香港尖沙咀海港城正式开幕。这是乐奇 Rokid 首间海外旗舰店，还是 AI 眼镜品类全球首个以“自助体验”为核心的零售空间。根据市场调查机构 Counterpoint Research 最新报告，乐奇 Rokid 于 2026 年上半年以 41% 的出货量，居全球 AI 与 AR 眼镜市场首位。IT之家获悉，乐奇 Rokid 全球首家 AI 眼镜无人自助体验店位于香港海港城海洋中心三楼，店内设八个沉浸式体验专区。体验店采用全自助模式，不设导购跟随，消费者不受话术压力。每个体验区均配备一块兼具镜子功能的交互屏幕，并与一副乐奇 AI 眼镜（Rokid Glasses）实现能力互通。该款 AI 眼镜仅重 49 克，集拍摄、提词、翻译、导航、AI 问答等多项核心功能于一身。消费者进店后，可按照交互屏幕指引自主佩戴，并独立完成多项功能体验。镜片上直接浮现翻译字幕、演讲提词、导航箭头；语音可唤起 AI 助手，第一视角随时拍摄。乐奇 Rokid 副总裁，国际及港澳台业务负责人邵华强现场表示：消费习惯正在发生巨大变化。新一代消费者希望拥有安静、不受打扰的空间，可以自由探索产品，按照自己节奏去感受，而不是被导购持续跟进。自主沉浸式体验，已经成为新的消费需求。据其介绍，过去 AI 眼镜最大的瓶颈是认知门槛：消费者没见过、没摸过、不知道怎么用。而乐奇 Rokid 将整个体验流程标准化：屏幕引导、体验动线、机械臂取货。这套操作链路可快速推广至全球商圈，让 AI 眼镜从需要讲解的科技产品，变成人人可自助体验的日常消费品。体验完成后，可自助购买并通过机械臂取货", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/013/680.htm", "publishedAt": "2026-10-15T15:38:57+00:00"}, {"title": "从 Harness 到 Loop：Agent 如何走向可靠交付与持续进化？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/xKkEswgSftEcGrkK6oTY?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-15T11:05:26+00:00"}, {"title": "抢先盘点2026全球开发者先锋大会暨国际具身智能技能大赛十大亮点！", "summary": "“具身进实景，劳动最光荣”", "sourceName": "量子位", "sourceUrl": "https://www.q const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
