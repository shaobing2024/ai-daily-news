6-07-30T15:12:11+00:00"}, {"title": "小米澎程系列技术发布会一文汇总：雷军详解昆仑架构，N90/N70 预售价亮眼", "summary": "久等了，小米澎程系列新车终于迎来首秀，就在今天（7 月 30 日）19:00，SKYNOMAD 小米澎程小米汽车技术发布会如期举行。这是小米汽车的第二次技术发布会，距 2023 年 12 月 28 日的首场，已过去两年半之久。如果说 SU7/YU7 系列是小米交出的第一份答卷，那么澎程这个历时三年半打磨的第二个产品系列，便是小米打出的第二张牌。在本场发布会中，澎程系列两款全新车型 —— 大七座旗舰增程 SUV N90 Max 与大五座四驱增程 SUV N70 Max 携手亮相，并且公布预售价格。而既然是技术发布会，核心自然聚焦于技术本身，“小米昆仑技术架构”得以重磅揭晓，涵盖小米昆仑平台、小米昆仑超级增程、小米昆仑全域安全。一、小米昆仑技术架构在发布会中，雷军谈及小米澎程车型，表示想造一辆这样的车：有 SUV 外观、驾驶性和通过性，却有类似房车的空间和布置的灵活性。基于这样的思考，小米花了 3 年半时间，打造了一套全新平台架构 —— 小米昆仑技术架构，其中包含小米昆仑平台、小米昆仑超级增程、小米昆仑全域安全。小米昆仑平台先来看看小米昆仑平台，第一个核心设计为“前后贯穿纯平地板”，从驾驶舱贯穿至后备厢。为此，小米针对后电驱、电池包、油箱进行布局突破，最终纯平地板长达 2.9 米，地板角度 2.95°，接近水平，最大化释放空间。第二个核心设计为“方正格局”，重点优化后轮包设计，布置极为紧凑，舱内可用面积最高可达 4.4m²。第三个核心设计为“超长滑轨”，澎程 N90 Max 拥有 6 根滑轨，最长 1938mm，可以布置成 2+2+3 大七座布局。二三排支持“极致后移”，二排乘坐空间最大 1.55 米、储物空间最大 1831L。同时，座椅滑轨采用 7 系加强铝合金，15000 次循环测试无松动；锁止强度高达 54000N，剥离强度高达 57000N。小米昆仑超级增程再来看看小米昆仑超级增程，雷军直言“希望打造同档最好的增程 SUV 体验”。为此，小米澎程采用大电池增程方案，并推出两款增程专用电池包：52kWh 磷酸铁锂、76kWh 三元锂。N70 Max CLTC 最高纯电续航 505km。双电机四驱增程系统，前驱动电机峰值功率 210kW，后驱动电机峰值功率 100kW。其中前驱动电机应用小米超级电机技术，最高效率 95.77%，搭载 SiC 功率模块、0.2mm 硅钢片、分段环氧磁钢，电驱效率提升 2.65%。在采用大电池增程方案的同时，小米汽车与东安动力深度定制小米昆仑增程器 1.5T，7 个核心零部件重点开发，57 个零部件重新优化设计。搭载该增程器的澎程 N90 Max，WLTC 亏电油耗仅 6.26L/100km，CLTC 综合续航 1705km。该增程器实车热效率为 42%，整车油耗降低 0.2L/100km，增程器首保后，3 年或者增程器 3 万公里保养 1 次，支持 92、95、98 号汽油。最后来看小米昆仑全域安全，雷军强调“安全是基础，安全是前提，安全高于一切”，搭载铠甲笼式车身。具体来看，澎程 N90 Max 的高强度钢和铝合金占比 90.4%，16 处关键位置用了 2200MPa 超强钢增强。超大一体式热成型门环，3.3 米长、1.5 米高，贯穿一二三排、覆盖 ABCD 柱，并在 4 处关键部位用 2200MPa 超强钢增强，相比传统焊接，侧柱碰车身承载能力提升 19%。据悉，为了保障安全，小米做了大量的全向碰撞测试，测试的严苛程度，远超行业通行的测试标准：正面碰撞，C-NCAP 要求 56km/h，小米的标准是 64km/h；正面 25% 偏置碰撞，中保研要求 64km/h，小米的标准是 72km/h；侧面碰撞，C-NCAP 要求 60km/h，小米的标准是 70km/h；后部碰撞，新国标要求 50km/h，小米的标准是 92km/h。与此同时，小米还正式推出小米龙甲电池体系，安全标准超过国标。这是小米汽车主导的动力电池系统化解决方案，小米负责产品定义，小米主导电池包的设计开发，小米参与电芯的设计开发，小米进行全流程质量管控。小米龙甲电池体系的电池包针对增程车特点，优化了电芯材料、电池结构和生产工艺，同时还模拟了 30 万公里耐久测试、全程快充和高速行驶的场景，电池包还有 18 层硬核结构防护。作为小米汽车的第二个产品系列，Skynomad 小米澎程在 2023 年初正式立项。而小米昆仑技术架构则是历时 3 年从头打造的一个全新的平台架构，以作为“智能可变大空间 SUV”的技术基座。雷军特别强调，小米昆仑技术架构，核心零部件全部来自国内、国际优秀供应商。二、小米澎程 N90 Max在重点介绍完小米昆仑技术架构后，小米澎程 N90 Max 正式亮相，定位“智能可变大空间 SUV”。雷军表示，澎程 N90 Max 为空间而生，该车车长 5285mm，车宽 1998mm，车高 1825mm，轴距 3080mm。外观方面，主打“型方面润”，蜻蜓大灯、光环尾灯延续家族化设计语言，可选四款个性化饰板，全系标配 21 寸轮毂、普利司通静音轮胎。配色方面，发布了远山青、蝴蝶谷蓝和火山灰三款全新的车身颜色。空间方面，车内采用 2+2+3 大七座布局，拥有 2760mm 舱内乘坐空间，二排舱内高度 1233mm、乘坐空间 950mm、中间过道 180mm。三排乘坐空间 890mm，头部空间 962mm。至于此前预热时曾引发关注的“智能可变大空间”，雷军予以详解，可实现对坐模式、办公模式、小憩模式、大床模式。一排座椅支持电动旋转、中岛内置两个手机位、四个杯托，可滑动到第二排座位作为“多功能茶几”使用。后备厢容积为 577L，标准状态七人乘坐，可收纳 7 个 20 英寸旅行箱；若二三排极致前移，最大容积可达 1831L。尾门开口为 690mm，后车门能实现接近 90° 开合。内饰方面，全车 6.8㎡超大面积玻璃，搭配夹层防晒玻璃与遮阳帘，高频接触内饰面 95% 软包覆，贯穿仪表台 + 立柜式中控台长度达 1530mm。15 处漫反射氛围灯，支持 256 色调光，可选摩卡棕、砂陶米两款配色。在“冰箱、彩电、大沙发”方面，配备 21.4 英寸后排娱乐屏，9L 独立压缩机冰箱。全车舒适软包座椅，一二排标配 16 点式座椅按摩、通风加热，最多可配 4 个零重力座椅。全车具备 12 个生态接口 +14 个电源接口，搭载 25 扬声器小米星弦音响系统。在动力方面，搭载大电池增程系统，CLTC 纯电续航 464km，CLTC 综合续航 1705km，WLTC 亏电油耗 6.26L/100km。15 分钟最长补能 285km，从 20% 充电至 80% 最快只需 18 分钟。在驾控方面，底盘为前双叉臂 + 后多连杆独立悬架，可模拟大排量发动机的线性输出，支持 R-EPS 齿条式电动助力转向，转向手力三挡可调，连续 10 次全力制动性能保持稳定。驾驶视野无遮挡，主驾 A 柱盲区小，配备低速慢行灯。在智能方面，域控制模块四合一，采用第三代骁龙 8 移动平台和英伟达 Thor 车载计算平台。搭载小米澎湃智能座舱，超级小爱语音交互，全系标配小米 HAD 辅助驾驶，新增后向固态激光雷达，搭载小米 XLA 认知大模型。在安全方面，除了搭载铠甲笼式车身，还配备 12 个安全气囊、9 个碰撞传感器，门把手采用三重冗余设计，尾门有双应急拉手。具备最高 750mm 的涉水能力，搭载 2 颗涉水雷达，全车 24 处关键零部件密封及防水提升，动力电池采用 IPX8 / IPX9K 防水标准，同时优化进气口、泄压阀布局，大幅提升涉水安全性。遇到紧急情况，还能应急浮水脱困。值得一提的是，雷军在发布会中放话称“N90 Max 是 50 万元以内最好的增程 SUV 之一”，还直道“only Skynomad can do”。该车的预售价格为 29.99 万元。三、小米澎程 N70 Max在详细介绍完澎程 N90 Max 后，雷军又快速讲解了 N70 Max 的核心规格。该车为“大五座四驱增程 SUV”，尺寸为 4960×1998×1765mm、轴距 2950mm，二排支持极致后移，最大乘坐空间 1410mm、最大拓展空间 2425L。采用双电机四驱，峰值功率 310kW，最高时速 190km/h，CLTC 纯电续航 505km，CLTC 综合续航 1461km，亏电油耗 6.1L/100km。标配前双叉臂 + 后多连杆独立悬架，空气弹簧 + 连续阻尼可变减振器，9 个安全气囊、内嵌式防滚架、一体式热成型门环，铠甲笼式车身 14 处 2200MPa，标配门把手三重冗余设计。标配 4nm 旗舰 SoC、4nm 辅助驾驶芯片 700TOPS，标配前向激光雷达、4D 毫米波雷达，标配 Xiaomi HAD 辅助驾驶。可选前排零重力座椅、前排旋转座椅、滑动中岛、压缩机冰箱、后排娱乐屏、电动迎宾踏板。该车的预售价格为 25.99 万元。四、总结关于 SKYNOMAD 小米澎程小米汽车技术发布会的情况，IT之家小编就带大家回顾到这里。至于小米澎程系列的正式发布时间，锁定在 2026 年 9 月。技术发布会现已告一段落，接下来便要等待正式上市的时刻，且看小米澎程 N90 Max/N70 Max 的正式售价能否带来更大的惊喜。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/903.htm", "publishedAt": "2026-07-30T14:49:02+00:00"}, {"title": "华为官宣小艺高分超出第 56 届国际物理奥林匹克竞赛理论金牌线", "summary": "IT之家 7 月 30 日消息，第 56 届国际物理奥林匹克竞赛（IPhO 2026）日前正式落幕，华为官方今日宣布，小艺在理论考试中取得 28.6 分（满分 30 分）的成绩，高分超出金牌线。公开资料显示，国际物理奥林匹克（IPhO）理论考试以模型复杂、推导繁琐、综合性强著称，无套路化公式可直接套用。本届三道理论大题分别覆盖：流体静力学力矩平衡与相对论散射、光学多次反射及渐晕线包络线推导（含泰勒展开）、磁制冷循环中麦克斯韦关系证明与降温时间积分计算，这类题目对顶尖物理系学生仍具较高难度。华为官方表示，这不仅标志着华为小艺在复杂科学问题求解领域筑牢了坚实技术底座，也验证了小艺的 Agentic 系统在解决多模态复杂任务的潜力。IT之家注：小艺是华为公司自主研发的 AI 智慧助手，基于最新的人工智能技术，提供 AI 知识问答、AI 写作、AI 文档阅读、文档助手、编码助手、鸿蒙代码生成等功能。目前小艺已适配网页 / 手机 / 平板 / 手表 / 智慧屏 / 车机 / 家庭中控 / PC / 耳机 / 音箱端使用。今年 6 月，华为小艺 Claw 接入开源盘古 openPangu 2.0 Pro 模型，可重点提升鸿蒙系统级任务执行能力。据介绍，openPangu 2.0 模型更亲和昇腾算力，单卡吞吐率可达其他业界主流开源模型的 2 倍。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/901.htm", "publishedAt": "2026-07-30T14:27:35+00:00"}, {"title": "小米澎程 N90/N70 车型 9 月发布，今晚 21:00 开启预订", "summary": "IT之家 7 月 30 日消息，今晚的小米澎程技术发布会上，小米创始人兼 CEO 雷军称澎程系列 N90/N70 车型将于 9 月正式发布，今晚 21:00 开启预订，意向金 1000 元，正式发布后随时可退。锁单可享优先排产，提车送价值 999 元车载桌板双杯托版。小米澎程 N90 Max 预售价为 29.99 万元小米澎程 N90 Max 定位 2+2+3 大七座旗舰增程 SUV，搭载行业领先的超级增程系统，实现 CLTC 纯电续航 464km，CLTC 综合续航 1705km，WLTC 亏电油耗 6.26L/100km，支持 92 号、95 号、98 号汽油。15 分钟最长补能 285km，从 20% 充电至 80% 最快只需 18 分钟。该车配备双电机四驱动力，支持 310kW 峰值功率、0-100km/h 加速 5.9s、最高时速 190km/h。N90 Max 提供远山青、蝴蝶谷蓝、火山灰等配色，尺寸为 5285mm x 1998mm x 1825mm、轴距 3080mm。车内配备 3K 分辨率 21.4 英寸后排娱乐屏，中岛内置两个手机位、四个杯托、6.6L 容量、9L 独立压缩机冰箱，可滑动到第二排座位作为“多功能茶几”使用。智能化方面，该车标配小米 HAD，搭载小米 XLA 认知大模型，满配辅助驾驶。同时小米澎程 N90 Max 新增后向固态激光雷达，测距精度可达 2cm。该车搭载第三代骁龙 8 移动平台和英伟达 Thor 车载计算平台，车内支持超级小爱。小米澎程 N70 Max 预售价为 25.99 万元小米澎程 N70 Max 搭载双电机四驱，峰值功率 310kW，最高时速 190km/h，CLTC 纯电续航 505km，CLTC 综合续航 1461km，亏电油耗 6.1L/100km。该车同样定位“智能可变大空间 SUV”，采用五座布局，拥有超大的乘坐空间，性能、舒适、安全、智能全面拉满。该车尺寸为 4960×1998×1765mm、轴距 2950mm，二排支持极致后移，最大乘坐空间 1410mm、最大拓展空间 2425L。小米澎程 N70 Max 还标配前双叉臂 + 后多连杆独立悬架，标配空气弹簧 + 连续阻尼可变减振器，标配 9 个安全气囊、内嵌式防滚架、一体式热成型门环，铠甲笼式车身 14 处 2200MPa，标配门把手三重冗余设计，标配 4nm 旗舰 SoC、4nm 辅助驾驶芯片 700TOPS，标配前向激光雷达、4D 毫米波雷达，标配 Xiaomi HAD 辅助驾驶。可选前排零重力座椅、前排旋转座椅、滑动中岛、压缩机冰箱、后排娱乐屏、电动迎宾踏板。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/884.htm", "publishedAt": "2026-07-30T12:56:47+00:00"}, {"title": "29.99 万元！小米澎程 N90 Max 增程 SUV 预售价格公布", "summary": "IT之家 7 月 30 日消息，在今晚的小米澎程技术发布会上，小米创办人、董事长兼 CEO 雷军宣布小米澎程 N90 Max 预售价为 29.99 万元，9 月正式发布。小米澎程 N90 Max 整体造型方正大气，提供远山青、蝴蝶谷蓝、火山灰等配色，车辆全系标配 21 寸大轮毂，都是普利司通静音轮胎。配备了蜻蜓大灯、光环尾灯等家族化语言，同时还有四款个性化饰板可选。内饰方面，该车一二排标配 16 点式座椅按摩，全车最多可选 4 个零重力座椅，一排可选标准按摩座椅 / 旋转座椅（带按摩功能）/零重力座椅。一排座椅支持电动旋转（支持小爱同学控制），在“对坐模式”下双人乘坐空间最大 1760mm、四人模式二排空间 1370mm，二三排极致后移，空间最大 1550mm。该车后排配备 3K 分辨率 21.4 英寸后排娱乐屏，支持海量儿童内容。中岛内置两个手机位、四个杯托、6.6L 容量、9L 独立压缩机冰箱，可滑动到第二排座位作为“多功能茶几”使用。全车提供 17 个空调出风口，配备 4890W 峰值功率 25 扬声器 7.1.4 声学架构音箱系统。N90 Max 搭载第三代骁龙 8 移动平台和英伟达 Thor 车载计算平台，车内支持超级小爱，提供车内动态音区语音交互、车外小爱语音边走边说等功能，可实现全场景互联互通。同时，新车还支持双 5G 双卡双通、Wi-Fi 7、IoT 通讯接口、内置 ETC 可免费激活。智驾方面，该车标配小米 HAD，搭载小米 XLA 认知大模型，满配辅助驾驶。同时小米澎程 N90 Max 新增后向固态激光雷达，测距精度可达 2cm。规格方面，N90 Max 尺寸为 5285mm x 1998mm x 1825mm、轴距 3080mm。搭载行业领先的超级增程系统，实现 CLTC 纯电续航 464km，CLTC 综合续航 1705km，WLTC 亏电油耗 6.26L/100km，支持 92 号、95 号、98 号汽油。15 分钟最长补能 285km，从 20% 充电至 80% 最快只需 18 分钟。此外，该车支持 220V 电源输出、6.6kW 对外放电，户外露营用电自由；增程器介入噪音低于 1 分贝，静音体验媲美纯电车；增程器首保后，3 年或增程器 3 万公里，保养 1 次。底盘方面，该车搭载前双叉臂 + 后多连杆独立悬架，配备双电机四驱动力，支持 310kW 峰值功率、0-100km/h 加速 5.9s、最高时速 190km/h。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/882.htm", "publishedAt": "2026-07-30T12:49:02+00:00"}, {"title": "瑞萨电子推出第三代 DDR5 MRDIMM 芯片组解决方案，支持 16000MT/s", "summary": "IT之家 7 月 30 日消息，瑞萨电子 (Renesas) 今日宣布推出其第三代 DDR5 MRDIMM（多路复用双列直插内存模块）芯片组解决方案。瑞萨的新款 MRCD（多路复用寄存时钟驱动器）RRG5013x 和新款 MDB（多路复用数据缓冲器）RRG5103x 均可满足未来 MRDIMM 实现 16000MT/s 超快传输速率对芯片组的要求，带来 25% 的代际内存带宽提升。第三代 MRDIMM 基于成熟的第二代产品架构，在扩展性能的同时保留了标准 DIMM 的外形尺寸和系统兼容性。此外，第三代产品还增强了系统的可视性与稳健性，包括设备均衡自训练模式（DESTM）的质量指示状态，该功能使用户能够微调时序和接收端均衡训练，从而最大化裕量。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/877.htm", "publishedAt": "2026-07-30T12:40:34+00:00"}, {"title": "小米澎程新车官宣搭载第三代骁龙 8 移动平台 + 英伟达 Thor 辅助驾驶计算芯片", "summary": "IT之家 7 月 30 日消息，在今晚的小米澎程技术发布会上，小米创办人、董事长兼 CEO 雷军宣布，澎程搭载第三代骁龙 8 移动平台和英伟达 Thor 车载计算平台，均采用先进的 4nm 制程工艺。据介绍，小米澎程配备了和 SU7、YU7 一样的顶尖智能基座，域控制模块四合一具备体积小、重量轻、能耗低的特性。这枚英伟达 Thor 辅助驾驶计算芯片支持 700TOPS 算力，搭载 NVIDIA Blackwell 架构，支持最高功能安全等级 ASIL-D。该车还搭载小米澎湃智能座舱，支持超级小爱，提供车内动态音区语音交互、车外小爱语音边走边说等功能，可实现全场景互联互通。同时，新车还支持双 5G 双卡双通、Wi-Fi 7、IoT 通讯接口、内置 ETC 可免费激活。IT之家从发布会现场了解到，小米澎程全系标配小米 HAD，搭载小米 XLA 认知大模型，满配辅助驾驶。同时小米澎程 N90 Max 新增后向固态激光雷达，测距精度可达 2cm。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/876.htm", "publishedAt": "2026-07-30T12:37:05+00:00"}, {"title": "欧盟委员会：ChatGPT 可能被纳入《数字服务法案》监管范围", "summary": "IT之家 7 月 30 日消息，欧盟委员会发言人托马斯 · 雷尼耶（Thomas Regnier）表示，ChatGPT 和 Roblox 都有可能被欧盟委员会列入《数字服务法案》（DSA）定义的“超大型在线平台（VLOP）”或“超大型在线搜索引擎（VLOSE）”名单。他表示，由于 ChatGPT 和 Roblox 公布的用户数量均已超过《数字服务法案》规定的门槛，因此被指定为超大型在线平台“完全有可能”，相关决定“可能会在未来某个时间作出，或早或晚”。据IT之家了解，根据《数字服务法案》，一旦被列入超大型在线平台或超大型在线搜索引擎名单，相关企业就必须遵守欧盟规定的一系列更严格的规则和义务，包括风险评估、内容审核、透明度报告以及其他监管要求。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/873.htm", "publishedAt": "2026-07-30T12:30:53+00:00"}, {"title": "研究显示：AI 聊天机器人实施情感诈骗的能力已超越人类", "summary": "IT之家 7 月 30 日消息，网络恋爱诈骗是互联网世界中历史最悠久的骗局之一，但至今仍不断有新的受害者上当。由四所大学联合开展的一项研究显示，如今 AI 聊天机器人实施这类诈骗的效果甚至已经超过真人，这一结果令人担忧。如今，恋爱诈骗通常始于交友软件。骗子会使用极具吸引力的个人资料，扮演一位热情主动、各方面都符合受害者理想对象标准的追求者。随后，骗子会与受害者进行长时间的线上交流，这一过程通常持续数月。他们往往以“长期在海外出差”或“人在国外旅行”为借口，解释为什么无法尽快见面。当双方建立起足够的信任后，骗局通常会进入两个方向之一：一种是骗子谎称遭遇突发状况，急需资金摆脱困境；另一种则是向受害者炫耀自己投资获利丰厚，并诱导对方向虚假的加密货币投资项目转账。据IT之家了解，这类骗局被称为“长期骗局”（Long Con），因为其依赖于长期建立信任关系，骗子往往会连续数月每天与受害者聊天。虽然这种方式看起来需要投入大量时间，但实际上，这类诈骗通常由位于柬埔寨、缅甸和老挝等国的诈骗园区实施，参与者大多收入微薄，甚至有人是被拐卖后被迫从事诈骗活动。据《Wired》报道，这项研究由印度阿姆里塔大学（Amrita Vishwa Vidyapeetham）、意大利威尼斯福斯卡里大学（Ca' Foscari University of Venice）、澳大利亚墨尔本大学以及以色列内盖夫本-古里安大学（Ben-Gurion University of the Negev）的研究人员共同完成，测试对象包括 ChatGPT、Claude 和 Gemini 等 AI 聊天机器人。研究人员让 AI 聊天机器人与真人骗子分别参与模拟恋爱诈骗流程，更准确地说，是模拟诈骗前期通过长期聊天建立信任，并最终诱导受害者投资虚假项目的过程。研究结果显示，AI 聊天机器人表现得极为出色，不仅成功伪装成真人，在部分指标上的表现甚至超过了实验中的真人“骗子”。参与实验的受试者并不知道研究的真正目的，他们始终认为自己聊天的对象是真人，无论实际对方是 AI 还是人类。研究人员通过主观评价和客观测试两种方式衡量双方建立信任的程度。当聊天进行到最后，研究人员以“下载一款应用程序”等请求测试受试者时，由真人逐步建立信任关系的情况下，仅有 18% 的受试者同意；而当聊天对象实际上是 AI 时，这一比例接近一半。此外，当受试者被要求评价自己对聊天对象的信任程度时，AI 聊天机器人获得的评分也明显高于真人。《Wired》就研究结果联系了 Anthropic、OpenAI 和谷歌。OpenAI 和谷歌均未作出回应，而 Anthropic 发言人在声明中表示，公司政策明确禁止利用 Claude 从事诈骗或冒充真人等行为，同时也部署了多项技术防护措施，以防止诈骗分子利用 Claude 实施欺诈。研究人员认为，这项研究最令人担忧的地方在于，如果诈骗团伙用 AI 聊天机器人取代真人客服，诈骗中心的运作规模将实现大幅扩张。AI 骗局机器人可以同时与数千名潜在受害者展开对话，而无需大量人力。只有在最后一步，即诱导受害者转账汇款时，诈骗团伙才可能需要真人介入，以绕过 AI 系统自身设置的安全限制。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/865.htm", "publishedAt": "2026-07-30T12:09:33+00:00"}, {"title": "小米昆仑技术架构供应商公布：东安动力、英伟达、高通骁龙等", "summary": "IT之家 7 月 30 日消息，在正在进行的小米澎程技术发布会上，小米创始人兼 CEO 雷军介绍了“小米昆仑技术架构”，其中包含小米昆仑平台、小米昆仑超级增程、小米昆仑全域安全。据介绍，小米汽车的第二个产品系列 ——Skynomad 小米澎程，在 2023 年初正式立项，历时 3 年，团队从头打造了一个全新的平台架构 —— 小米昆仑技术架构。作为「智能可变大空间 SUV」的技术基座，小米昆仑技术架构包含三大核心技术：小米昆仑平台，纯平地板、方正格局、超长座椅滑轨；小米昆仑超级增程，超长续航里程、超低亏电油耗、用车养护很省心；小米昆仑全域安全，搭载铠甲笼式车身，全方位守护整车安全。据官方透露，小米昆仑技术架构核心零部件全部来自国内、国际优秀供应商，官方海报显示有东安动力增程器、中国中车前电驱总成、英伟达 NVIDIA DRIVE AGX Thor、骁龙 8 Gen3 SoC、禾赛激光雷达、速腾聚创后向固态激光雷达、拓普空气弹簧、博世智能集成制动控制系统等等。关于本次发布会的更多消息，IT之家稍后带来。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/858.htm", "publishedAt": "2026-07-30T11:54:44+00:00"}, {"title": "安全公司 Check Point：OpenAI 旗下 ChatGPT 首次进入“最常被冒充品牌前十名”榜单", "summary": "IT之家 7 月 30 日消息，安全公司 Check Point 公布了《2026 年第二季度网络钓鱼冒充品牌研究》，本季度 OpenAI 旗下的 ChatGPT 首次进入“最常被冒充品牌前十名”榜单，这显示越来越多黑客开始瞄准 AI 领域，通过伪装成热门 AI 工具实施网络犯罪。IT之家参考报告获悉，微软仍是最常被冒充的品牌，占所有同类钓鱼攻击活动的约 23%；排行第二位为领英，占比 11.6%；排行第三位为谷歌，占比 6.7%；排行第四位为苹果，占比 5.8%；而 ChatGPT 排行第十，占比 1.1%。▲ 黑客冒充 OpenAI 发送的钓鱼邮件案例Check Point 表示，如今随着越来越多用户开始将 AI 工具用于工作和日常生活，未来几个季度可能会有更多 AI 平台进入“最常被冒充品牌排行榜”，这些 AI 平台对于攻击者而言，已经逐渐具备与大型银行和科技企业相同的吸引力，成为高价值攻击目标。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/845.htm", "publishedAt": "2026-07-30T11:23:40+00:00"}, {"title": "IBM 宣布已进入“量子优势”时代，结果可验证", "summary": "IT之家 7 月 30 日消息，IBM 今日表示，其研究已经证明了“量子优势”（quantum advantage）—— 即量子计算机能够完成超越传统计算机能力范围的计算任务，并且这些结果可以经过严格验证。这项研究成果标志着量子计算这一新兴技术向实际应用迈出了重要一步，相关发现发表在 IBM 及其研究合作伙伴共同撰写的三篇论文中。合作方包括芝加哥大学、日本理化学研究所（RIKEN）以及量子计算软件公司 Qedma、BlueQubit 和 Algorithmiq。IBM 研究部门负责人 Jay Gambetta 表示：“我们已经进入量子优势时代。科学家可以相信这些结果。现在，量子计算正在从人们对系统进行性能测试，转向利用这些系统开展科学研究并探索实际应用。”IT之家注意到，这一消息发布之际，IBM 正在努力证明其量子计算业务未来能够实现盈利。本月早些时候，由于公司发布盈利预警，IBM 股价创下历史最大跌幅。IBM 当时表示，客户支出正在从传统软件转向 AI 硬件和存储芯片领域，公司第二季度的软件和基础设施业务表现低于预期。此后，IBM CEO 阿尔温德 · 克里希纳（Arvind Krishna）对公司未来发展表达了乐观态度。他认为，量子计算将在未来几年开始推动 IBM 增长。克里希纳此前接受《华尔街日报》采访时表示，IBM 在量子领域的先发优势，可能会像英伟达凭借 GPU 先发优势获得成功一样，改善公司的发展前景。IBM 正面临来自微软、谷歌等科技巨头的竞争，同时也要应对量子计算领域大量初创公司的挑战。不过，IBM 并不是第一家宣布实现量子优势的企业。量子计算公司 D-Wave 去年曾宣布达到这一目标，谷歌也在去年 10 月表示实现了“可验证的量子优势”。但 Gambetta 表示，IBM 最新发布的论文值得关注，因为它证明了相关结果是可以被验证的。他说：“他们采用了一些方法，确保量子计算机执行的计算能够产生正确结果。”例如，在 Qedma 与 IBM 联合发表的论文中，两家公司展示了如何利用量子计算机探索材料物理学，并表示相关结果通过多种方式得到了验证，其中包括在 Quantinuum 量子计算机上的验证。Gambetta 表示：“可以把它看作是在量子计算机上展示的一种新物理现象，而传统计算方法无法完成这样的任务。”与传统计算机不同，传统计算机的计算结果通常可以通过在其他计算机上重复运行相同任务进行验证，而一些量子计算机产生的结果已经超出了经典计算机能够验证的范围。研究机构国际数据公司（IDC）专注量子计算的分析师 Heather West 表示，这也是 IBM 此次宣布具有重要意义的原因之一。她认为，能够复现量子计算机的计算结果，说明这些系统正在变得更加可靠和稳定。今日的消息也意味着 IBM 在实现容错量子计算机的道路上又进一步。此前，IBM 曾承诺将在 2029 年实现这一里程碑。不过，对于企业而言，最重要的问题仍然是量子计算机是否能够真正解决实际问题，例如优化计算，以及推动材料科学、医学等领域取得突破。Gambetta 表示，IBM 最新研究成果正是朝这一方向迈出的重要一步。他说：“拥有一个可信赖的基础，才能开始开展应用研究。随着我们不断推出能力更强的机器，这将帮助我们扩大应用规模，使其解决真正具有商业价值的问题。”IDC 分析师 West 将 IBM 的成果称为“迈向利用量子系统解决超越经典计算能力限制的复杂问题道路上的又一个里程碑”，并认为这进一步巩固了 IBM 在量子计算市场中的重要地位。不过，West 表示，实现量子优势不会是某一个决定性的瞬间，也不会像 ChatGPT 发布后引发人工智能热潮那样迅速改变整个行业。她补充道：“未来我们还会看到更多基于这些成果的进一步突破。也许一个月后、六个月后或一年后，当前这些发现会被更加先进的研究成果超越，而这正是科学发展的正常方式。”IBM 表示，公司欢迎围绕量子优势展开讨论。Gambetta 也预计，科学家将提出新的经典计算方法，并与 IBM 的研究结果进行比较。他说：“我不会说这些结果是绝对无懈可击的。真正发生变化的是，我们已经进入了一个能够获得可信结果的阶段，因此科学界可以围绕这些结果展开讨论。未来几年，这将主要成为一场科学领域的讨论，就像人工智能领域过去利用 GPU 研究神经网络时，在大学中展开的讨论一样。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/841.htm", "publishedAt": "2026-07-30T11:08:03+00:00"}, {"title": "首个突破90%成功率的桌面操作智能体！从堆模型到拼工程，实在Agent登顶OSWorld双冠", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/4hUcQzeCeKm0wqkc4Zdc?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-30T10:33:33+00:00"}, {"title": "轻量化异构双臂 x VL const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
