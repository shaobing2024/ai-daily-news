const DATA = {"date": "2026-09-09", "generatedAt": "2026-09-09T01:01:11Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "Sonos 27 音频系统更新：配对增强环绕声道、预览外部 AI 接入等", "summary": "IT之家 9 月 9 日消息，Sonos 昨日（9 月 8 日）发布新闻稿，宣布通过苹果 App Store 应用商店渠道，更新 Sonos 27 音频系统，并向 Sonos S2 系列产品免费推送。产品命名方面，伴随着 Sonos Beam Ultra 回音壁、Sonos Ace Ultra 头戴式耳机两款新品，Sonos 于 9 月 1 日发布全新音频操作系统 Sonos 27。本次更新最大的亮点，在于通过抢先体验方式，推出 Sonos 27mcp 来支持接入外部 AI。IT之家援引博文介绍，该功能基于 Model Context Protocol（模型上下文协议），让 Sonos 系统接入 ChatGPT 和 Claude 等外部 AI 模型。用户无需切换至 Sonos App，可在对应 AI 平台内调整播放和声音控制。Sonos 将该服务托管在 mcp.ws.sonos.com/ mcp。公司称，该开放平台允许用户按自身需求选择 AI 助手。Sonos 还计划在 2026 年秋季晚些时候推出 Sonos 27voice 抢先体验版。该助手由 Sonos 内部开发和微调，可理解歌曲线索、情绪描述及设备控制请求。用户即使忘记歌名或歌手，也可通过相关描述寻找音乐。Sonos 还预告目标 2027 年推出 Sonos Custom Agents，让用户在系统中创建各自配备模型、人格和语音的 AI 智能体。功能方面，Sonos 27 音频系统新增 Portable Surrounds（便携式环绕声），2 台相同的 Sonos 便携扬声器，可与兼容的回音壁配对，承担后环绕声道。用户移动这 2 台音箱后，它们能够恢复便携扬声器的原有角色，该功能让现有设备可兼顾便携播放与家庭影院用途，无需额外配置专用后环绕音箱。新版 Sonos 应用重新设计导航界面，加入滑动手势和房间固定功能。Sonos 表示，这些调整旨在缩短常用房间和播放控制的操作路径。Headphone Linking（耳机连接）目前处于抢先体验阶段。Ace Ultra 耳机可连接 Sonos 系统，让用户在附近扬声器与耳机之间传递音频，过程中无需以手机作为中转设备。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/999/966.htm", "publishedAt": "2026-09-08T23:44:47+00:00"}, {"title": "Claude 额度离奇消失，Anthropic 确认账号被黑客盗用", "summary": "9 月 9 日，据 TechCrunch 报道，多名 Claude 用户近期发现，自己在没有使用服务的情况下，账号额度仍在快速消耗。Anthropic 调查后称，黑客利用窃取的 Claude 登录会话访问用户账号，并消耗其使用额度。8 月 4 日，英国东萨塞克斯郡独立 AI 顾问格兰特 · 德斯沃特发现，他的 Claude Max 20x 账号出现异常。当天他并未工作，账号用量却持续上升。第二天，德斯沃特停用了所有与 Claude 连接的工具，并暂停了定时任务和云端执行功能，但用量仍从 45% 升至 55%。他表示，当时本地也没有正在运行的 Claude Code 任务。德斯沃特随后联系 Anthropic，要求对方提供详细的使用记录。Anthropic 没有给出逐项明细，但承认账号存在异常，并暂停其付费账户，注销全部登录会话和服务器端 Claude Code 令牌，同时退还其订阅剩余时间对应的 44.49 英镑费用。Claude Max 20x 的订阅价格为每月 200 美元。账号被暂停给德斯沃特的工作带来直接影响。他主要帮助中小企业部署 AI 智能体，例如自动提取邮件中的采购订单信息，并将数据录入财务软件。作为个体经营者，他自己的日常行政、网站设计和编程工作也大量依赖 AI 工具。Anthropic 调查后告诉德斯沃特，一个遭泄露的 Claude 会话密钥被用于生成未经授权的 Claude Code OAuth 令牌。该公司发现，其账号似乎被一个身份可疑的第三方服务用于处理其他人的任务，但无法确定对方如何获得访问权限。这意味着，攻击者取得账号权限后，可以在用户不知情的情况下消耗其额度。TechCrunch 指出，Anthropic 的客服系统只能查看总用量，无法向用户提供逐项使用记录，因此这类盗用行为可能持续数月而不被发现。德斯沃特随后在 Reddit 分享经历，并发现还有多名用户遇到类似问题。一名用户称，自己的账号在未经同意的情况下被自动升级，信用卡遭到扣款，用量也在未操作时从 0 升至 100%。另一名用户表示，自己只发送了几条提示词并进行一次网页搜索，账号用量却在 12 分钟内从 0 升至 49%。还有用户称，账号连续三天在没有使用的情况下耗尽每日额度，并在 GitHub 提交问题报告。此后，多名用户在该报告下留言，描述了相似经历。部分用户公布了 Anthropic 发出的安全提醒邮件。Anthropic 在邮件中称，公司近期发现，有攻击者使用常见的信息窃取恶意软件盗取用户电脑中的 Claude 登录会话，随后访问 Claude 账号并消耗额度。信息窃取恶意软件通常会窃取电脑中保存的密码、会话数据和登录凭证。Anthropic 表示，一旦发现可疑活动，公司会强制用户退出登录、撤销现有授权，并在部分情况下退款，同时提醒用户检查设备是否感染恶意软件。Anthropic 同时强调，这类恶意软件并非由 Claude 本身传播。用户可能在下载受感染的软件或点击恶意广告时中招。不过，德斯沃特没有收到上述安全提醒。他表示，自己并未发现电脑遭到入侵的证据，至今也无法确定攻击者如何取得账号权限。约两周后，德斯沃特的 Claude 账号恢复使用。但由于问题处理速度较慢，加上 Anthropic 无法提供详细用量记录，他最终取消订阅，转而使用能够调用多个模型的 Cursor。德斯沃特认为，Anthropic 目前仍缺少帮助用户识别额度消耗来源的工具。当 TechCrunch 询问用户如何判断账号是否遭到滥用时，Anthropic 拒绝置评。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/999/962.htm", "publishedAt": "2026-09-08T23:29:06+00:00"}, {"title": "扎克伯格推进“个人超级智能”：Meta 发布其首款个人智能体 Muse，内部测试喜忧参半", "summary": "北京时间 9 月 9 日，据路透社报道，Meta 周二正式发布了其长期宣传的 AI 助手，该助手可自主代表用户完成发送邮件、卖车及预订旅行等任务。不过，Meta 内部担忧这项技术在处理敏感个人数据的访问权限时存在管理不善的问题。这款 AI 智能体名为 Muse，在 Meta 内部称 Hatch，是该公司 CEO 马克 · 扎克伯格 (Mark Zuckerberg) 计划的核心产品。他想要向每天使用 Meta 服务的数十亿用户提供“个人超级智能”。该计划是 Meta 为实现收入多元化、减少对广告依赖的最新尝试，同时也希望利用其在 AI 芯片及其他基础设施上的巨额投资打造一项可持续业务。Meta 预计今年在此方面的投入将超过 1300 亿美元。Meta 在公告中表示，Muse 初期仅在美国上线，用户可通过专门的 Muse 应用或 Meta 旗下 WhatsApp 通讯服务使用。Meta 称“很快”会将这一智能体添加到其智能眼镜产品线中，但未透露具体细节。Meta 发言人表示，该智能体将提供免费基础版本，同时推出每月 20 美元和每月 100 美元的订阅套餐，以满足更高频使用需求。Meta 表示，用户可以选择退出，不让自己的交互数据用于训练 Meta 的 AI 模型，公司计划在今年晚些时候推出 Muse 的加密版本。安全问题Meta 表示，Muse 以开源 AI 智能体 OpenClaw 为模型，设计上能够访问用户在电子邮件、日历、支付、健康、购物及智能家居等各类应用中的数据。用户可自行选择 Muse 连接哪些应用，并有权随时撤销其访问权限。每个 Muse 智能体均运行在独立的虚拟机上，即基于云端的个人电脑模拟环境，这使得它即使用户未主动使用，也能在后台持续执行任务。与存储用户真实数据的各类应用同步，既提升了智能体的实用价值，也大幅增加了安全风险，这不仅关系到那些将个人信息交给智能体处理的用户，也关系到可能受到智能体错误操作影响的其他人。Meta AI 产品副总裁维沙尔 · 沙阿 (Vishal Shah) 向路透社表示，公司曾于今年 4 月推迟该产品的发布，以进一步提升安全性。他表示，Meta 认为额外的准备工作已使其“跨过门槛”，“达到了将这一产品交到人们手中所需的最低标准”。“不能说永远不会出错，但架构的每一个环节都经过精心设计，力求将安全性、可靠性和隐私保护做到我们力所能及的极致。”沙阿称。Meta 在公告中称，其为 Muse 系统内置的多项保护措施中，包括一个独立的监控智能体，该智能体会对计划执行的操作进行审查，并在特定情况下要求 Muse 在执行前获得用户授权。内部测试喜忧参半然而，据路透社看到的内部帖子显示，就在本周，Meta 员工对该工具的测试结果仍喜忧参半。有员工写道，该产品在安排度假行程方面极为实用，以至于 Muse 成了他们最近一次为期三周的印尼蜜月之旅中的“第三位参与者”。但也有员工报告了严重的安全漏洞。例如，智能体在收到“找出孩子生日派对照片中出现的玩具”的指令后，绕过安全限制，暴露了用户个人 iCloud 中的照片。Meta 首席技术官安德鲁 · 博斯沃思 (Andrew Bosworth) 发帖称，他反复被强制登出，需要不断重新登录，有时几分钟内就要遭遇好几次。在另一篇帖子中，一名曾让 Muse 监控门票及其他容易售罄商品的员工表示，自己遇到了“许多导致其无法可靠运行的故障模式”。这名员工称，该产品运行约 15 分钟后就停止刷新页面，会默默忽略其他错误，有时还会“毫无明显原因地”关闭监控功能。截至发稿，Meta 未就内部帖子中描述的具体事件回应置评请求。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/999/960.htm", "publishedAt": "2026-09-08T23:26:56+00:00"}, {"title": "继 Claude 尝试攻克黎曼猜想后：OpenAI 宣布用 10000 个 AI 智能体 88 小时攻克千禧年大奖难题，陶哲轩既点赞又担忧", "summary": "IT之家 9 月 9 日消息，OpenAI 于当地时间 9 月 8 日宣布，其内部未公开的 AI 模型（性能远超最新发布的 GPT-6 Astra）已成功解决“纳维-斯托克斯存在性与光滑性问题”（Navier-Stokes existence and smoothness problem），这是克莱数学研究所（Clay Mathematics Institute）于 2000 年提出的七个“千禧年大奖难题”之一。该问题关注描述流体运动的纳维-斯托克斯方程是否会失效，已困扰数学界约 90 年。在此之前，Anthropic 上个月宣布其内部一款未公开的 Claude 研究模型在攻克黎曼猜想的过程中取得重要进展，将黎曼 ζ 函数临界线上零点比例的长期下界从 41.6% 提高到了 67.2%。消息一出，业界震惊。▲ 局部不可压缩运动的示意图。橙色表示角旋转速度较快；青色表示角旋转速度较慢。环流速度也取决于半径。轨迹显示出向内螺旋运动和轴向拉伸。OpenAI 表示，该团队通过让约 10,000 个 AI 智能体协作，在约 88 小时内生成了证明。证明显示，一个初始平滑的静止流体在有限时间内可能发展出“奇点”（singularity），即流速无限增长。OpenAI 提供了分析证明及 Lean 编程语言的形式化验证。验证工作由 GPT-6 Astra 在约 17 小时内完成。▲ OpenAI 所使用的这款内部模型在开放数学问题方面性能远超 GPT-6证明的核心与验证OpenAI 研究者塞巴斯蒂安 · 布贝克（Sébastien Bubeck）称此为“过去十二个月所看到轨迹的一个惊人顶点”。该证明通过设计一个向内旋转并拉伸的“涡流”来实现奇点，其能量在物理定律要求下保持有限。证明建立在外力光滑的前提下，对应官方问题陈述中的“C”和“D”情形。争议与质询然而，这一宣布迅速引发争议。纽约大学数学教授特里斯坦 · 巴克马斯特（Tristan Buckmaster）和 Anthropic 研究员莱文特 · 阿尔珀格（Levent Alpöge）在前一天刚发布了相关流体方程的研究成果。巴克马斯特质疑 OpenAI 在听闻他们的进展后，才将资源转向其一直在探索的“外力驱动”方法。他担心自己和阿尔珀格存储在 OpenAI 的 Codex 模型中的研究数据可能被用于训练或参考，但未得到明确答复。OpenAI 研究员布贝克否认了这些指控，强调研究人员和 AI 智能体均未访问具体用户数据。但 OpenAI 也在声明中承认，“不排除”来自他们使用 OpenAI 产品的匿名化数据帮助改进了模型。更广泛的影响此次事件凸显了 AI 在攻克人类智力巅峰时引发的复杂问题。著名数学家陶哲轩一方面将此类问题比作吸引科学家努力的“灯塔”，另一方面也警告，若 AI 能解决最困难的问题而无需人类深度参与，可能会削弱人类对数学的理解。据估算，此次计算成本可能高达 1,500 万至 2,250 万美元（现汇率约合 1.01 亿至 1.51 亿元人民币）。OpenAI 表示不打算申领克莱数学研究所这笔 100 万美元（IT之家注：现汇率约合 672.8 万元人民币）的奖金，但此事件已引发关于功劳归属、数据隐私以及 AI 发展安全性的广泛讨论。相关阅读：《未公开的新模型“立功”，Anthropic 宣布 Claude 攻克黎曼猜想取得重大突破》《谷歌 AI 框架 AlphaProof Nexus 攻克 2 道悬置 56 年数学难题》《AI 推翻著名几何猜想，OpenAI 宣布攻克 80 年数学难题》《OpenAI GPT-4b 攻克诺奖难题：人体细胞“返老还童”，逆转效率飙升 50 倍》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/999/959.htm", "publishedAt": "2026-09-08T23:14:32+00:00"}, {"title": "OpenAI 最强 AI 生图模型：ChatGPT Images 2.5 登场，延迟降低 50%、新增 Sketch 草图", "summary": "IT之家 9 月 9 日消息，OpenAI 今天（9 月 9 日）官宣发布 ChatGPT Images 2.5，图像生成延迟最多降低 50%，并新增 Sketch 草图参考、模板库、图片内评论标注等实用功能，是该公司当前最先进的图像生成模型。相比较 2026 年 4 月发布的 Images 2 模型，Images 2.5 重点降低了图像生成延迟，在细节锐度、自然光照和纹理丰富度方面均有提升的情况下，延迟最多降低 50%。功能方面，ChatGPT Images 2.5 引入 Sketch 功能。用户可通过输入“@Sketch”调用该功能，用户可在对话中直接绘制草图，再补充风格和细节描述，让模型将草图转化为完整图像。产品还新增海报、商品等常见创作格式的模板，降低创作门槛。用户可以直接在图像上添加批注，以聚焦具体修改区域，并可在分享图像时附带原始提示词。图片内评论功能允许用户在图像上标注位置并发出“删除此区域”或“将此改为蓝色”等指令，模型仅修改指定区域，其余部分保持不变。多轮编辑过程中，模型能更好保持图像一致性和质量，避免多次编辑后细节退化。在 API 调用模型方面，OpenAI 提供了两款模型：GPT-Image-2.5 Flare：面向多数 API 图像生成应用，适用于创作者内容、社交内容、产品体验、视觉搜索、快速原型和高批量生成等场景。GPT-Image-2.5 Sunburst：则面向对编辑控制要求更高的工作流。OpenAI 建议将其用于成品级营销素材和精修产品图等场景，但其生成时间更长。API 支持多种分辨率，包括 1024×1024、2048×2048、3840×2160（4K 横向）等，单边最长不超过 3840 像素，总像素数介于 655,360 至 8,294,400 之间。价格方面，IT之家附上两款模型定价如下：模型模态输入缓存输入输出gpt-image-2.5-sunburstImage$8.00$2.00$30.00Text$5.00$1.25-gpt-image-2.5-flareImage$8.00$2.00$30.00Text$5.00$1.25-安全和合规方面，Images 2.5 延续现有安全机制，对提示词和生成图像实施检查以防止有害输出。所有输出均嵌入 C2PA 元数据和隐形水印，便于识别由 OpenAI 工具生成的图像，打击未授权复用或深度伪造。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/999/956.htm", "publishedAt": "2026-09-08T23:00:42+00:00"}, {"title": "DeepSeek 官宣明日 flash 系列 AI 模型降价：输出为每百万 Token 4 元", "summary": "IT之家 9 月 9 日消息，据 DeepSeek 开放平台公告，官方宣布将于北京时间明日（2026 年 9 月 10 日）12 时起执行新价格，调整 Flash 系列定价。根据明日调整的新价格：空闲时段：输入缓存命中价格为每百万 Token 0.02 元输入缓存未命中为每百万 Token 1 元输出为每百万 Token 4 元高峰时段各项价格均为上述空闲时段价格的两倍。IT之家查询公开资料，Flash 系列目前包含 deepseek-v4-flash 和 &nbsp;deepseek-v4-flash-vision-exp 两款模型，附上两款模型价格调整对比表格如下：价格deepseek-v4-flash调整后价格deepseek-v4-flash-vision-exp调整后价格降幅百万 tokens 输入（缓存命中）空闲时段0.05 元0.02 元0.05 元0.02 元60%高峰时段0.10 元0.04 元0.10 元0.04 元60%百万 tokens 输入（缓存未命中）空闲时段1.5 元1 元1.5 元1 元33.33%高峰时段3.0 元2 元3.0 元2 元33.33%百万 tokens 输出空闲时段4.5 元4 元4.5 元4 元11.11%高峰时段9.0 元8 元9.0 元8 元11.11%", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/999/953.htm", "publishedAt": "2026-09-08T22:39:58+00:00"}, {"title": "Cohere 发布 Parse 5，可以从复杂的文档中高效地提取多模态信息", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/C8WbrpalJEjLfSh2xJJj?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-08T17:06:00+00:00"}, {"title": "Karmada 正式从 CNCF 毕业，已用于多集群 AI 训练与 GPU 调度", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/yfQdTa8cRxjJB0rzZMJR?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-08T16:31:12+00:00"}, {"title": "达芬奇 DaVinci Resolve 21.1 发布，接入 Claude Code、ChatGPT Codex 等 AI 助手", "summary": "IT之家 9 月 8 日消息，Blackmagic Design 今天发布视频剪辑软件 DaVinci Resolve 21.1，接入多个人工智能助手。据介绍，本次更新将支持 Claude、Claude Code 和 ChatGPT Codex 等 AI 助手，使用户能够使用自然语言分析项目、整理媒体、调整设置和批量渲染。用户可要求 AI 助手从长视频中剪辑精彩片段、删除不需要的片段或渲染最终视频，减少重复劳动，将时间投入到创意构思中。IT之家注意到，达芬奇的照片页面现已支持富士 GFX 和 X 系列、徕卡 SL 以及索尼 α7R VI 等相机，摄影师可直接导入照片，无需转换格式。本次更新还改进了改进多机位工作流程，并加入全新图形工具等。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/999/945.htm", "publishedAt": "2026-09-08T15:12:48+00:00"}, {"title": "谷歌 DeepMind 推出 AlphaGenome Atlas，覆盖人类基因组全部 90 亿种单核苷酸变异预测", "summary": "IT之家 9 月 8 日消息，谷歌今日推出 AlphaGenome Atlas，这一平台包含了人类基因组中 90 亿种单核苷酸变异（所有可能的单字母 DNA 改变）的功能预测，是目前涵盖基因突变对分子生物学影响最全面的目录，学术界可通过免费门户网站免费使用。DNA 是生命的语言，掌握其密码能够改变人类理解生物学和治疗疾病的能力，但解读基因变异对分子层面的影响长期存在瓶颈：人类基因组有约 90 亿种可能的单字母突变，在实验室逐一测试几乎不可能。根据介绍，谷歌 DeepMind 此前已经推出 AI 模型 AlphaGenome，可以预测基因变异对生物过程的影响，可用于分析特定变异并在研究中得到广泛应用，此次通过大规模预先计算 AlphaGenome 的预测结果，构建出覆盖全基因组变异的全景资源库，就像地图集汇总地理信息一样，绘制出全基因组 DNA 变异的分子效应图谱。为帮助科学家快速找到影响最大的遗传改变，谷歌同时发布了 AlphaGenome Variant Impact（AVI）评分，该评分结合了 AlphaGenome 和 AlphaMissense（IT之家注：谷歌用于预测改变蛋白质的 DNA 变异影响的模型）两者的预测优势，将两个模型的预测结果浓缩为单个数值，研究人员可以快速对变异进行排序，同时解读其分子效应。AlphaGenome Atlas 是一个规模达 1 PB 的数据集，比 AlphaFold 数据库大 30 倍以上。该平台提供多个互相联动的资源：分子效应预测：每个变异包含数千个分子效应预测，涵盖基因调控的多个重要方面，覆盖数百种人类和小鼠细胞类型与组织。AVI 评分：描述每个遗传变异影响的单一数值。AVI 特征归因：每个 AVI 评分都关联到驱动其结果的特定生物学特征，比如 AlphaGenome 预测的基因调控方面，或是 AlphaMissense 的蛋白质影响评分。DNA 序列基序：包含超过 2500 个重复性 DNA 序列（基因组的“词汇”）及其位置的完整合集。AVI 评分同时适用于编码区（占基因组 2%，负责编码蛋白质）和非编码区（占基因组 98%，负责协调基因活性，容纳绝大多数性状相关变异），帮助研究人员根据潜在影响快速对变异进行评分和排序。测试显示，AVI 评分在多种变异致病性和罕见疾病基准测试中都展现出一流性能。目前外部合作研究团队已经借助 AlphaGenome Atlas 取得多项实际成果：在罕见病研究中，博德研究所团队借助 AVI 评分筛选变异，发现了此前被忽略的、与癫痫性脑病密切相关的 DNM1 基因变异，实验验证确认了该预测结果；埃克塞特大学研究人员对英国生物样本库超过 54000 名参与者的全基因组数据进行分析，通过 AlphaGenome Atlas 发现了多 22% 的非编码基因关联，精准定位了调控关键蛋白质水平的特定变异。AlphaGenome Atlas 今起通过门户网站、AlphaGenome API 向学术研究开放，也可作为技能在 Google Antigravity 使用，非商业研究可免费获取，后续还将在谷歌云开放商业使用权限。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/999/937.htm", "publishedAt": "2026-09-08T14:20:07+00:00"}, {"title": "豆包输入法推出 Windows 版，现已覆盖 PC、Mac、iOS、Android 和鸿蒙五大平台", "summary": "IT之家 9 月 8 日消息，豆包输入法今天推出 Windows 版，版本号 0.9.0。至此，该输入法已覆盖 PC、Mac、iOS、Android 和鸿蒙五大平台。IT之家了解到，豆包输入法最初上线于去年 11 月，支持豆包同款语音输入，长按右 Alt 键即可启动。采用豆包同款语音大模型，支持多方言、英语及中英混输，无网弱网环境下也能流畅使用。同时，该输入法具备上下文智能联想与纠错功能，可让识别结果越用越精准。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/999/934.htm", "publishedAt": "2026-09-08T14:09:09+00:00"}, {"title": "OpenAI 详解 GPT-Live 架构如何实现了连续的有状态语音交互", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/rdESg5icYIZ71J7xb69K?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-08T13:32:00+00:00"}, {"title": "“傻瓜式”剪片：Adobe Premiere 更新 AI 功能，时间线上能直接生成音视频素材", "summary": "IT之家 9 月 8 日消息，Adobe 今天（8 日）宣布重新设计专业视频剪辑软件 Premiere 中的 AI 交互方式，新的“生成式媒体”工具支持直接在项目时间线中生成视频、音效、音乐和声景，无需中断当前工作流程。所使用的生成模型并非全都是新产品，这次更新的重点是大幅简化调用方式。以往缺少补充镜头或音频素材时，编辑人员往往需要在浏览器或外部应用之间来回切换。更新后，只需选中视频或音频轨道上的空白区域，即可根据项目上下文生成可完全编辑的片段。此外，时间线还可以直接调用多种底层 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
