const DATA = {"date": "2026-08-15", "generatedAt": "2026-08-14T23:17:22Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "硅光新时代来了？英伟达全面投产 Spectrum-X，全球首款量产 200G/lane CPO 交换机", "summary": "IT之家 8 月 15 日消息，英伟达官方账号 @NVIDIAAIInfra 昨日（8 月 14 日）在 X 平台发布推文，官宣已全面投产 Spectrum-X 以太网光子交换机，成为全球首款量产的 200G/lane 共封装光器件（CPO）以太网交换机系统。IT之家注：G/lane 是高速通信、芯片设计和数据中心领域中衡量单通道（Lane）数据传输速率的核心技术指标，表示每个物理通道每秒能传输多少吉比特（Gb）的数据。应用场景方面，英伟达表示该交换机主要面向大规模 AI 训练与推理集群。随着 AI 工厂扩大，密集部署 GPU 的服务器需要在高带宽下频繁交换数据。传输方面，传统网络通常把独立光模块插入交换机面板，光模块先将电信号转为光信号，经光纤传输后再转回电信号，这种方案会增加功耗、热量和潜在故障点。Spectrum-X Ethernet Photonics 在同一模块内封装光学引擎与交换芯片。光信号的生成与转换靠近负责数据包转发的交换 ASIC，缩短电信号传输路径。Spectrum-X 以太网硅光芯片 MCM 封装系统核心是一块多芯片模块，内部并行集成数百个硅光子引擎。每个引擎可处理多条高速通道，并把交换 ASIC 输出的电信号转换为光信号。英伟达称，这种布局可减少能量损耗，维持信号质量，并降低电阻与散热带来的额外功耗。该架构还把激光器从单个收发器中移出，改由外置激光源模块向多个光学引擎统一供光。英伟达称，这一设计所需激光器数量仅为此前方案的 1/4。激光器数量减少后，系统的功耗、热量和可能失效的部件也会相应减少。与采用传统可插拔光模块的网络相比，英伟达称功耗降低至 1/5，AI 应用无中断运行时间可延长 5 倍，平均事件间隔时间可提高 10 倍。硬件方面，SN6810 可在 2U 液冷机箱内配置 128 个 800 Gb/s 端口，总交换能力为 102.4 Tb/s。更大的 SN6800 在 5U 系统中堆叠 4 颗 ASIC，可提供 409.6 Tb/s 交换能力，支持 512 个 800 Gb/s 端口，或超过 2,000 个 200 Gb/s 端口。基于 Spectrum-X 以太网硅光技术的 SN6800 和 SN6810 以太网交换机制造环节中，光学引擎直接焊接到模块基板上，工艺可纳入常规量产流程。顶部光纤连接器用于高精度连接光纤。台积电负责硅光子技术，SPIL 负责芯片级封装与测试，Lumentum 与 TFC 供应激光器组件，富士康负责整机交换机系统开发。英伟达在自有设施完成交换机出货前的最终测试，目前已启动全面生产。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/989/970.htm", "publishedAt": "2026-08-14T22:53:56+00:00"}, {"title": "微软发布 Win11 26H1 RP 28000.2796 预览版：文件管理器适配 KB / MB / GB 单位", "summary": "IT之家 8 月 15 日消息，微软昨天（8 月 14 日）发布博文，邀请 Release Preview 频道的 Windows Insider 项目成员，测试适用于不同版本 Windows 11 的最新预览版更新，具体内容如下：Windows 11 版本 24H2：更新后版本号升至 Build 26100.9267Windows 11 版本 25H2：更新后版本号升至 Build 26200.9267Windows 11 版本 26H1：更新后版本号升至 Build 28000.2796功能方面，IT之家注：面向 Windows 11 26H1 系统更新中，本次更新分两个部分：分阶段逐步推送、全面正式推送。分阶段逐步推送：采用分批下发模式。新功能会分批次抵达不同设备，不会一次性全部生效。不同设备的功能启用状态存在差异。全面正式推送：面向全部符合条件设备大规模分发。该模式一般在功能正式对外发布（GA）阶段启用。一、分阶段逐步推送本章节罗列 Windows 11 电脑新增功能与优化项。覆盖 AI 能力迭代、功能持续创新、整机性能提升等方向。1.1、文件管理器详情视图下，文件大小改用适配单位展示（KB、MB、GB），不再统一只显示 KB。用户一眼就能读懂文件体量。地址栏、主页页面，现已支持鼠标中键点击，在新标签页打开文件夹。统一资源管理器多标签交互逻辑，提升操作效率。修复主页页面加载时出现灰色闪屏、特定场景下页面莫名滚动至顶部的故障。优化主页“推荐”板块的文件缩略图渲染效果。缩略图画面更锐利，内容辨识度更高。1.2、Windows 搜索强化应用搜索能力。更好兼容拼写错误、输入部分名称的场景，精准定位已安装应用。提升设置项的搜索匹配度。把高价值的系统设置，优先展示在搜索结果靠前位置。1.3、语音访问新增功能：为语音访问加入人声隔离功能。该功能过滤他人说话声与环境杂音，强化语音识别准确率。用户前往「语音访问设置 &gt; 提升语音识别能力」，可切换三种语音识别模式：人声隔离：屏蔽旁人语音与背景噪音。需要完成一次性人声配置。仅消除背景噪音：过滤敲击键盘、关门等非人声杂音。无需额外配置。不启用过滤：直接读取麦克风原始输入，不做额外信号处理。使用人声隔离，路径为：语音访问设置 &gt; 提升语音识别能力，选中人声隔离选项即可。新增功能：语音访问正式支持韩语。强化语音访问程序的启动稳定性。1.4、小组件新增功能：任务栏通知角标，改用系统主题强调色渲染，摒弃原先红色样式。减少不必要的弹窗打扰。新增功能：简化锁屏小组件使用逻辑。新设备初始化后，锁屏界面默认仅展示天气小组件。1.5、触控板新增功能：精准式触控板开放全新手势控制，配置入口：「设置 &gt; 蓝牙和设备 &gt; 触控板」滚动与缩放速度：自定义滚动、缩放手势的基础响应速度。加速滚动：重复执行滚动手势，滚动速度同步加快。快速浏览长篇文档更加顺手。1.6、开始菜单加固开始菜单视图偏好记忆能力。牢牢保留用户选定的显示样式。优化开始菜单应用列表区域的键盘导航逻辑，键盘焦点跳转更顺畅。1.7、语音输入新用户默认关闭流畅听写功能。首次调用该功能时，系统弹出操作提示弹窗。1.8、输入模块优化鼠标光标大小的记忆保存能力，设置不易丢失。1.9、窗口管理保障小型平板设备上，系统弹窗以合适尺寸正常弹出。1.10、辅助功能优化触屏设备下放大镜使用体验。用于平移放大画面的横向、纵向触控条，默认处于关闭状态，不再遮挡放大后的内容。习惯触控平移操作的用户，可以前往「设置 &gt; 辅助功能 &gt; 放大镜」手动重新开启触控条。1.11、Windows Hello新增功能：Windows Hello 增强登录安全（ESS）现已支持外接指纹传感器。这项安全登录能力，不再局限设备内置指纹模组。台式机、Copilot+ PC 等各类 Windows 11 设备均可使用。操作流程：插入兼容 ESS 标准的指纹识别外设，打开「设置 &gt; 账户 &gt; 登录选项」，跟随指引录入指纹。该特性已于 2026 年 1 月（KB5074105）对外披露，现阶段开启分批推送。1.12、字体恢复缅甸文本字体对 Unicode 变体序列的兼容支持。修复蒙古白体（Mongolian Baiti）字体字形绘制逻辑，输出文字形态更准确、显示效果更统一。1.13、账户控制翻新开始菜单账户面板的界面样式。新增徽章标识，直观展示订阅状态。查看方式：点开开始菜单，点击左下角账户头像。该体验仅限微软账户登录用户使用。1.14、任务栏提升平板形态触屏设备下，任务栏系统托盘区域的加载稳定性。1.15、AI 组件允许 Copilot+ 兼容设备，卸载本机已经安装的图像生成 AI 组件。1.16、Windows 安装程序系统安装流程新增家长控制提示。向用户展示可用的家庭安全防护功能。1.17、电源与电池强化电源设置的生效可靠性。设置内修改的参数，同步作用到全部电源计划。涵盖显示器、睡眠、休眠、电源按键、睡眠按键、合盖行为等选项，牢牢保存用户自定义偏好。在「设置 &gt; 系统 &gt; 电源和电池」中，重新开放省电模式自动触发阈值的自定义选项。1.18、Windows 更新优化 Windows 更新设置页内，更新进度的计算逻辑，进度展示更准确。调整更新清理策略。安装完更新之后，立刻改善整机系统性能。1.19、系统声音优化深色模式运行 Windows 时的各类系统提示音效。1.20、日期和时间优化时区变更通知的触发识别逻辑。修正多套夏令时数据：中东标准时间（贝鲁特）、摩洛哥标准时间（卡萨布兰卡）、以色列标准时间（耶路撒冷）、格陵兰标准时间（努克），时间数据精度得到提升。1.21、网络改善部分场景下 DHCP 续租稳定性。重点优化 DHCP 服务器返回否定确认报文、现代待机设备的网络表现。1.22、打印提升 IPPS（安全互联网打印协议）打印机的打印吞吐速度，提高每分钟输出页数。1.23、剪贴板修复部分远程桌面、Azure 虚拟桌面（AVD）场景，剪贴板工作不稳定的问题。1.24、综合可靠性增强资源管理器 explorer.exe 的运行稳定性。覆盖跳转列表、最近文件打开、文件文件夹共享、任务视图、多虚拟桌面等操作场景。加固 Windows 登录界面、锁屏界面的抗故障能力，内存资源紧张环境下表现尤为明显。同时提升开机阶段，开始菜单、任务栏的运行稳定性。二、全面正式推送本次非安全更新，提供多项质量层面修复。更新同步附带其他多项质量优化。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/989/969.htm", "publishedAt": "2026-08-14T17:23:30+00:00"}, {"title": "阿里开源 Qwen3.8-27B 模型，编程、办公场景表现超越 Qwen3.7-Plus", "summary": "IT之家 8 月 14 日消息，今天（14 日）晚间，阿里“千问大模型”公众号宣布，Qwen3.8-27B 模型正式开源，所有开发者、科研机构和企业均可自由下载、部署和使用。IT之家附体验地址：Hugging Face 魔搭社区根据介绍，27B（270 亿参数）是全球 AI 社区呼声最高的模型尺寸，Qwen3.8-27B 是原生多模态稠密（Dense）模型，支持 262K 原生上下文，通过 YaRN 技术可外推至 1M Tokens 上下文。较 Qwen3.6-27B，新模型在编程和办公场景的性能大幅提升，表现甚至超越了 Qwen3.7-Plus；同时，模型还新增了 reasoning_effort 功能，根据任务难度控制思考深度，更省资源。Qwen3.8-27B 也拥有 Qwen3.8 系列模型的共性，可以端到端完成复杂任务，号称直接交付“经得起检验”的可靠成果。官方还公布了该模型在部分场景中的表现情况。Text PerformanceVL Performance", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/989/953.htm", "publishedAt": "2026-08-14T15:13:53+00:00"}, {"title": "中国医生用 GPT-5.6 破解 22 年数学难题，Crouzeix 本人确认正确", "summary": "IT之家 8 月 14 日消息，2025 年，一连串的协和 4+4 博士引发关注和热议，其中就包括金山木事件。时隔一年之后，金山木这个名字再次引发热议。据《南华早报》今日报道，北京协和医院神经外科博士后、住院医师金山木利用 OpenAI 的 GPT-5.6-Sol 模型，只用了约 16 小时就成功证明了自 2004 年以来困扰数学界长达 22 年的 Crouzeix 猜想。美国康奈尔大学数学家 Alex Townsend 与华盛顿大学数学系教授 Anne Greenbaum 公开发表文章，披露了他们与这位中国医生的邮件往来，使得这一突破性成果为公众所知。Townsend 和 Greenbaum 表示，他们两人以及猜想提出者、法国数学家 Michel Crouzeix 本人均已审阅了论文手稿，并确认证明正确无误。金山木的学术背景与数学相去甚远。百度百科显示，其本科为北京大学地质学专业，2016 年通过自主招生加分（高考成绩 622 分，北大录取线 660 分）进入地质学类。2019 年参与南阿尔卑斯山地质考察后，于 2020 年通过协和医学院“4+4 试点班”转入临床医学，2024 年成为神经外科博士后。据称，他之所以闯入数学领域，源于其在经颅超声研究中的实际需求 —— 试图用超声波穿透复杂的人体颅骨结构时，他在这一过程中接触到了矩阵分析，并在自学过程中偶然了解到 Crouzeix 猜想。金山木在接受采访时表示，他所接受的正式数学教育仅限于理工科本科生的基础课程，其余数学知识均为自学。Crouzeix 猜想由法国数学家 Michel Crouzeix 于 2004 年提出，其核心内容为：对于任意矩阵和任意多项式函数，矩阵经函数作用后的范数不超过该函数在矩阵数值域上最大值的两倍。该猜想表述简洁但证明难度极高。2007 年，Crouzeix 本人仅证明了常数在 11.08 时成立；2017 年，全球顶尖专家在美国数学研究所专题研讨会上一周苦战后，才将常数降至 2.414。此后该问题再无实质进展。在该研究中，金山木采用了一种非常规的解题路径。他没有进行传统的纸笔推导，而是借助 GPT-5.6-Sol 模型在 ChatGPT Work 平台上完成了证明。他借鉴了 OpenAI 此前攻克 Cycle Double Cover 猜想时的提示词策略：要求模型在物理断网环境下进行纯粹原创思考，启动大量智能体沿不同路径发散探索并防止过早收敛，对候选策略进行对抗性审计，并指令模型在获得完整证明前不得放弃。金山木在设定完成后即离开，全程未进行任何干预。GPT-5.6-Sol 在约 16 小时的自主运行中，经历了数万次假设、推翻与重建，最终给出了证明。多位数学家们评价称，AI 并未采用人类预想中的繁杂硬估计，而是通过巧妙的采样策略简化出简洁的正性条件。Townsend 和 Greenbaum 在审阅证明后以“震惊”形容自己的感受。金山木已将全部研究资料开源，在 GitHub 仓库中公开了最终论文、提示词、历次迭代手稿、Lean 4 形式化证明代码及公理审计报告。值得一提的是，在该预印本发布仅 8 天后，数学家 Emiel Lorist 和 Felix Schwenninger 于 2026 年 8 月初发布了一篇仅 5 页的独立证明，思路截然不同，将经典双层势表示法与 2-扩张扰动引理相结合。两人坦言在探索证明策略时同样使用了 ChatGPT 5.6。此次突破正值前沿 AI 系统在数学领域日益发挥关键作用之际。2026 年 5 月，OpenAI 称其内部通用推理模型自主解决了匈牙利数学家 Paul Erdős 于 1946 年提出的平面单位距离问题。2026 年 8 月初，OpenAI 披露下一代模型 Astra 的内部版本已在 10 项数学与理论计算机科学难题上取得突破。此外，Anthropic 于 2026 年 8 月 11 日宣布，其未公开的研究版 Claude 模型在尝试攻克黎曼猜想过程中，将黎曼 ζ 函数临界线上零点比例的已知下界从 41.6% 提升至 67.2%。IT之家附论文地址：https://alextownsend.net/essays/SIAMNews_CrouzeixConjecture.pdf", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/989/952.htm", "publishedAt": "2026-08-14T15:08:53+00:00"}, {"title": "新研究证实，AI 生成书籍已挤压人类作者作品市场空间", "summary": "IT之家 8 月 14 日消息，在 Anthropic 做过的诸多事情中，最容易让普通人感到震惊的，可能是处理训练书籍的方式。Anthropic 购买了数百万本二手书，切掉书脊后扫描内容，用于训练 AI 模型，完成后再把原书销毁。很多人听到这种做法会觉得难以接受，但 Anthropic 实际上“遵循了版权法”。法律允许把自己拥有的书籍数字化，只要过程中没有额外增加一份副本。在一起受到广泛关注的案件中，美国一名联邦法官也裁定，Anthropic 这一环节属于合理使用。真正长期存在争议的问题，是 AI 模型完成训练之后，利用已经学到的内容生成新作品会造成什么影响。美国版权局去年研究了这一问题，并指出了 AI 公司抗辩中的最大弱点。合理使用需要考察四项因素，其中一项就是新作品是否会损害原作品的市场。美国版权局认为，利用受版权保护的作品生成商业内容，再让生成内容与原作品竞争，就会超出传统合理使用的界限。据《商业内幕》今天（14 日）报道，过去最大的难题，是很难证明这种市场损害确实存在。而现在，研究人员已经找到了部分证据。研究人员最近分析了 2023 年至 2026 年间在亚马逊销售的 1.4 万多本电子书，发现不少图书含有大量 AI 生成文本，而且数量已经多到足以挤压其他图书的市场空间。有销量的图书数量增至原来的 19 倍，读者在这些图书上的总支出只增至原来的 9 倍。也就是说，市场变得拥挤得多，整体规模却没有以同样速度扩大，单本图书能够分到的平均收入因此减少。IT之家从报道中获悉，研究人员还发现，随着含 AI 生成文本的图书不断增加，未检测出 AI 文本的图书市场份额也在下降。AI 几乎可以零成本批量生成数千本书，人类作者因此唯有与大量新增内容竞争。然而，如果没有人类作者原本的作品，这些内容也不会存在。非营利组织 Fairly Trained CEO 埃德 · 牛顿-雷克指出，AI 公司一直声称，模型不会给那些作品被用于训练的创作者造成经济损失，可这项研究已经让那个说法“彻底站不住脚了”。相关阅读：《研究：人们无法有效区分 AI 生成与人类原创短篇小说》《AI 挤压作家收入：14419 本小说洞察，约 20% 书籍 AI 含量超 25%》《AI 生成的盗版书泛滥，苹果图书和亚马逊上出现大量假冒作品》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/989/951.htm", "publishedAt": "2026-08-14T15:06:49+00:00"}, {"title": "DeepSeek 把 Harness 开源了：模型、工具、Agent Loop 全是插件", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/de9AljWc4ejW2KAyW8dD?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-14T14:38:24+00:00"}, {"title": "科技行业史上最大收购之一，SpaceX 豪掷 600 亿美元拿下 AI 编程公司 Cursor", "summary": "IT之家 8 月 14 日消息，SpaceX 完成了对 AI 编程初创公司 Cursor 的 600 亿美元（IT之家注：现汇率约合 4,054.22 亿元人民币）收购。对于马斯克而言，这笔交易是追赶 Anthropic 和 OpenAI 的重要一步。监管文件显示，收购于当地时间 8 月 14 日正式生效。SpaceX 两个月前已经宣布与 Cursor 达成收购协议。据彭博社报道，作为科技行业有史以来规模最大的收购之一，SpaceX 希望借助 Cursor 加快开发更先进的 AI 工具，用于简化编程等任务。编程已经成为 AI 领域利润丰厚的重要市场。马斯克旗下 AI 业务目前名为 SpaceXAI，此前在企业市场的普及程度有限，也经历过多轮裁员和重组。Cursor 于 2023 年推出 AI 编程助手，帮助程序员提高代码编写和调试效率。随着越来越多软件开发人员开始使用能够根据聊天机器人提示词直接生成和构建软件的工具，Cursor 迅速成长为全球增长最快的初创公司之一，并成为科技行业“氛围编程”浪潮中的重要参与者。收购完成后，Cursor 联合创始人将跻身亿万富翁行列，团队也可以使用 SpaceX 储备的大量先进 AI 芯片。Cursor 通过博客文章宣布：“我们将能够使用全球规模最大的 GPU 集群，获得充足算力来开发能力更强、运行成本更低的模型。”双方在交易正式完成前已经开始合作。SpaceX 和 Cursor 于 7 月推出首个联合模型 Grok 4.5，主要用于编程、金融和法律任务。两家公司称，Grok 4.5 的使用成本低于其他竞争模型。SpaceX 随后又推出 Grok Bot，由一组 AI 智能体全天接收并完成任务，同时发布了升级后的 Grok 4.6 模型。SpaceX 还签署了多笔价值数十亿美元的协议，向 Anthropic 和谷歌等公司开放算力资源。本月早些时候，马斯克在 SpaceX 员工会议上称，公司必须在软件方面取得成功。到 9 月，AI 收入将超过 SpaceX 其他所有业务收入的总和。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/989/944.htm", "publishedAt": "2026-08-14T14:34:20+00:00"}, {"title": "月之暗面严正声明：警惕可疑交易，已向公安机关反映涉嫌违法犯罪的行为", "summary": "IT之家 8 月 14 日消息，今天（14 日）晚间，月之暗面 Kimi 公众号发布严正声明，提醒“警惕可疑交易”。IT之家从声明获悉，针对市场上冒用月之暗面名义虚假融资、涉嫌违法犯罪的行为，公司已向公安机关反映。现严正声明：不存在所谓“朋友基金”或“特殊通道”。不存在所谓“老股额度”或“预留额度”。不存在所谓“官方代理”或“授权中介”。延伸阅读这并非月之暗面首次发布此类声明。2026 年 6 月 29 日，月之暗面就曾发布声明称，市场上出现多起假借其名义的不实融资及股权交易信息，已发现部分机构和个人涉嫌欺诈，并强调所有融资活动仅由公司直接负责，未授权任何第三方处理融资交易。近期月之暗面资本化进程显著提速。2026 年 7 月 29 日，月之暗面宣布完成超 35 亿美元 F 轮融资，投后估值达 350 亿美元，原定 8 月启动的 G 轮（Pre-IPO 轮）提前开始，投前估值升至 500 亿美元。2026 年 7 月，公司还发布了新一代旗舰大模型 Kimi K3，总参数规模达 2.8 万亿，并随后宣布全面开源。此外，2026 年 8 月初市场曾传出月之暗面计划于当月内提交香港 IPO 申请的消息，但随后被接近月之暗面的知情人士否认。2026 年 8 月 12 日，月之暗面还完成了工商变更，注册资本由 152.36 万元增至 223.85 万元，经营范围剔除了第二类增值电信业务，被业内视为冲刺 IPO 阶段的合规清理动作。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/989/920.htm", "publishedAt": "2026-08-14T12:10:39+00:00"}, {"title": "消息称腾讯混元资深研究员徐灿转岗微信 WeLM，微信 AI 或进入加速阶段", "summary": "IT之家 8 月 14 日消息，据 36 氪今天报道，腾讯混元资深研究员徐灿近期加入微信 WeLM 团队，从事大模型研发相关工作。多名知情人士透露，在姚顺雨接手腾讯大语言模型研发前，徐灿在混元 LLM 体系中担任后训练一个方向上的负责人。值得一提的是，本次转岗发生在微信持续强化自研大模型和 Agent 能力的阶段。据IT之家此前报道，微信原生 AI 助手“小微”已于 6 月灰度上线。公开招聘信息也显示，微信近期在招聘 WeLM 推理优化及 Agent 方向研究人员，徐灿的加入或将进一步补充微信 WeLM 团队在训练、推理及复杂任务执行方面的研发力量。互联网公开资料显示，徐灿本科毕业于四川大学计算机专业，硕士毕业于北京大学计算机技术专业。他曾担任微软 AI 高级研究科学家，为微软小冰、必应、WizardLM 和 Phi-3 等项目贡献了核心技术。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/989/893.htm", "publishedAt": "2026-08-14T10:29:02+00:00"}, {"title": "太初元碁助力国家级“AI+教育”大赛 “AI+加速卡模型适配赛道”开启招募", "summary": "", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/473149.html", "publishedAt": "2026-08-14T10:25:36+00:00"}, {"title": "涛思数据创始人&CEO陶建辉博士确认出席AICon深圳，将分享“大模型在工业场景落地的挑战与实践”", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/Uiz6Ovab2eKT0T9q3Nzp?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-14T10:00:00+00:00"}, {"title": "荣耀方飞：Robot Phone 只是第一代探索，未来手机会从“应用的容器”走向“智能体的舞台”", "summary": "IT之家 8 月 14 日消息，今天（14 日）下午，荣耀终端股份有限公司产品线总裁 @荣耀方飞 在微博发文，谈到了自己对荣耀 Robot Phone 的一些思考。方飞认为，荣耀 Robot Phone 不是简单地“给手机加一个云台”，而是我们对 AI 时代手机新物种的一次探索：当 AI 有了更强的“大脑”，手机能不能进一步拥有自己的“小脑”和“身体”，真正把感知、理解与行动连接起来？为此，团队用了大半年时间，把一个大胆想法做成了真正可交付的产品。方飞表示，荣耀一直认为未来手机会从“应用的容器”走向“智能体的舞台”。荣耀 Robot Phone 只是第一代探索，未来将会继续把想象变成用户真正能够感知、使用和信任的产品。8 月 12 日，全球首款机器人手机 —— 荣耀 Robot Phone 正式发布，定价 9,999 元起。12GB+512GB：9,999 元16GB+1TB：12,999 元据IT之家了解，该机是荣耀与顶级电影摄影机厂商 ARRI（阿莱）合作的首款落地产品，融合了荣耀的移动影像以及 ARRI 百年底蕴的电影摄影技术。硬件方面，荣耀 Robot Phone 后置三摄方案包含一颗 2 亿像素 F1.6 光圈、等效 23 毫米的 4D 云台主摄，一颗 5000 万像素超广角镜头，以及一颗 2 亿像素潜望式长焦镜头。该机还首发自研影像芯片“荣耀驭光 H1”，云台主摄 CMOS 尺寸达 1/1.28 英寸。参数方面，荣耀 Robot Phone 搭载第五代骁龙 8 至尊版芯片，配备一块 6.31 英寸的 1.5K 分辨率四等边直屏。该机内置端侧大模型 YOYO，具备情感感知能力，能够主动识别用户的情绪状态、使用习惯及当前所处环境。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/989/866.htm", "publishedAt": "2026-08-14T09:59:31+00:00"}, {"title": "刚刚，GLM-5.3发布：Coding更接近Fable 5！潜伏40年的bug都被揪出来了", "summary": "顺手拿下最强开源安全模型", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/473038.html", "publishedAt": "2026-08-14T08:47:51+00:00"}, {"title": "得物知识问答：复合检索 Agent 的系统设计实践", "summary": "知识问答的核心挑战是准确率和质量。一个回答要准确，需要：查得全（召回率），查得准（精准度），理解得对（多模态），看得对（权限隔离）。这些能力不是堆功能就能实现的，需要一个强大的 Agent 运行时来支撑。", "sourceName": "开源中国", "sourceUrl": "https://my.oschina.net/u/5783135/blog/19738367", "publishedAt": "2026-08-14T07:54:19+00:00"}, {"title": "Visual Studio Code 1.133 发布", "summary": "Visual Studio Code 1.133 版本现已发布。此版本为用户提供了更灵活的 Claude 会话体验，让长篇对话更易于跟进，并能在用户工作时实时刷新本地 HTML 预览。 更改 Claude 会话的模型供应商：在不重新配置 agent host 的情况下，在回合之间切换供应商。 无需登录 GitHub 即可使用 Agent 窗口：当无法登录 GitHub 时，可使用...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/501932/vs-code-1-133-released", "publishedAt": "2026-08-14T06:42:46+00:00"}, {"title": "GLM-5.3 正式发布：编程能力最强的开源模型", "summary": "智谱宣布正式发布 GLM-5.3。且 GLM Coding Plan 全员额度在今天 13:00 重置，所有用户后台「用量统计」可见使用额度回满。 与 GLM-5.2 相比，GLM-5.3 基座模型没变，但通过极致的后训练 Scaling 大大提高了模型的智能上界：数十倍的长程任务环境、更丰富多样的环境类型、超长的后训练时间。 公告称，充分的模型后训练涌现...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/501931", "publishedAt": "2026-08-14T05:51:38+00:00"}, {"title": "DeepSeek V4 Flash 之后，大模型开始卷「智效比」了", "summary": "Agent 时代，怎么挑选「高智效」模型#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1675156?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-08-14T02:14:56+00:00"}, {"title": "DeepSeek Harness 正式开源：一切皆插件，Agent 框架的新玩法", "summary": "DeepSeek 正式开源了 DeepSeek Harness（DSH）的 v0.1 开发者预览版——一个\"一切皆插件\"的 Agent 运行时框架，MIT 协议，源码已托管到 GitHub。 和市面上大多数 AI Agent 框架不同，DSH 的核心卖点不是模型能力，而是架构的开放性。 网页内容支持浮窗（逐步开放，需灰度到小程序浮窗）；11.收藏的聊天记录支持长按文字复制；12.发现-游戏-我-记录中的游戏动态分享为图片到聊天中支持显示来源，但点击后提示暂不支持访问；13.小程序 / 公众号文章 / 贴图 / 网页内容 / 笔记 / 视频号支持点击右上角设置星标，我-收藏长按收藏内容新增星标，收藏新增星标分类（逐步开放）；14.朋友圈主图文和评论区支持显示和点击#话题、网址、小程序链接、手机号等蓝色超链接文字（逐步开放）；15.长按朋友圈主图文文字弹窗对齐其他端，新增部分选中，新增全选、翻译、收藏、搜一搜（逐步开放）；16.使用内置文件查看器查看文件时点击右上角新增收藏；17.发表视频号时支持选择位置信息，视频号隐私设置新增允许获取视频和图片的地理位置信息（逐步开放）；18.多选消息逐条或合并转发支持转发到其他应用（当前支持企业微信，需安装对应应用）；19.好友主页支持显示朋友圈缩略图（逐步开放）；20.地址详情页界面重构，对齐三端，新增距离 / 路程耗时 / 导航 / 打车 / 收藏 / 转发给朋友 / 复制位置信息 / 完善位置信息 / 商家信息 / 位置附近的视频号内容（逐步开放）；21.设置-通用-存储空间-清理缓存新增小程序、朋友圈、视频号、收藏、网页浏览插件、公众号、音乐和音频的清理选项（逐步开放）；22.我-服务-钱包-客服中心-消费者保护-安全保障新增安全锁，支持设置手势密码或者生物识别进入钱包或收付款（逐步开放，面容机型删除系统指纹后可开启面容识别）；23.朋友圈评论长按新增翻译（逐步开放，8.0.19 已支持）；24.我-视频号-发起直播-更多-更多设置新增展示个人创作礼物开关；25.观看直播时评论支持动画表情和搜索表情，支持送礼物；26.表情隐私设置回归，我-表情-右上角表情设置新增隐私设置，可设置浏览和查找表情时个性化推荐、输入文字时推荐未添加的表情和包含文字的收藏表情（逐步开放）；27.小店与卡包新增限时秒杀（逐步开放）；28.视频号支持发送和接收私信（逐步开放）；29.更换朋友圈封面时支持选择图库视频，支持查看朋友圈视频封面（逐步开放）；30.修复了一些已知问题。大家在IT之家微信号回复“微信”两字，即可获取当前最新官方内部版微信下载。相关阅读：《微信鸿蒙版 App 获 8.0.20.47 正式版升级》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/989/966.htm", "publishedAt": "2026-08-14T15:43:50+00:00"}, {"title": "从“工具”到“同事”——AI 时代的产品进化", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/ABCk0CzDtSKMHbPXCdWF?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-14T14:37:37+00:00"}, {"title": "长城魏牌 V8X 上市：定位大五座旗舰 SUV，限时权益价 22.68 万元起", "summary": "IT之家 8 月 14 日消息，长城魏牌 V8X 汽车今日上市，新车主打豪华质感及运动姿态兼具，拥有“双 VLA”原生 AI 舱驾智能体，配备超级 Hi4 混动系统，限时权益价 22.68 万元起。IT之家附该车各版本定价如下：运动版：运动版 Max：统一零售价 23.98 万元，限时权益价 22.68 万元起运动版 Ultra：统一零售价 27.98 万元，限时权益价 26.68 万元起豪华家庭版：豪华家庭版 Max：统一零售价 25.98 万元，限时权益价 24.68 万元起豪华家庭版 Ultra：统一零售价 27.98 万元，限时权益价 26.68 万元起豪华家庭版 Ultra+：统一零售价 31.58 万元，限时权益价 30.28 万元起据介绍，魏牌 V8X 采用“东方美学”外观设计，长宽高分别为 5125/2025/1821mm，轴距 3050mm。前脸带有飞檐微翘灯组，全车配有 9 处隔音玻璃，车门采用三重环视立体密封结构，具备 104 处空气动力学主动导流设计。新车可选深庭翠、文渊黑、玉露白、丹宸紫、影壁灰五种配色，搭载“双 VLA”原生 AI 舱驾智能体 ——“小魏同学”座舱 / 行车智能体，号称一句话搞定起步、变道、调速、掉头、泊车等操作，支持车位到车位全场景 NOA 领航、园区漫游等辅助驾驶功能。动力方面，魏牌 V8X 搭载超级 Hi4 SK 海力士在美国的首个工厂 —— 印第安纳州西拉斐特先进封装工厂，计划于 2026 年 8 月 27 日举行奠基仪式。该工厂投资约 38.7 亿美元（现汇率约合 261.5 亿元人民币），预计 2028 年下半年量产新一代 HBM 产品，将创造超 1000 个工作岗位。崔泰源表示，公司正在研究在美国建设前端制造工厂的可能性，但“真的很难找到合适的地点”。相关阅读：《消息称长鑫拒绝苹果压价，坚持要求内存采购价不低于三星电子和 SK 海力士》《三星预测 2027 年内存短缺问题将进一步加剧，供应紧张至少持续至 2028 年》《SK 集团会长崔泰源：内存应该降价，如果一直高价消费电子行业可能受到冲击》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/989/912.htm", "publishedAt": "2026-08-14T11:23:34+00:00"}, {"title": "梁文锋身价一年暴涨 3850%，登顶全球亿万富豪增速榜首", "summary": "10亿美元变成395亿美元，只用了一年。 海外金融研究机构 BestBrokers 基于福布斯实时富豪榜数据（2025年7月27日至2026年7月27日）发布了一份全球亿万富翁财富涨幅排名。DeepSeek 创始人梁文锋以 3850% 的年度财富增长率拿下全球第一，把第二名甩开了三倍多。 梁文锋 2025 年净资产为 10 亿美元，截至 2026 年统计节点已暴...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/501895", "publishedAt": "2026-08-12T06:12:32+00:00"}, {"title": "动态语言对 AI 编程更友好？开发者用三个真实任务给了答案", "summary": "\"动态语言对 AI 编程更友好，因为少了类型声明，代码更紧凑，token 消耗更少。\"这个说法在过去一年被反复引用，几乎成了 AI 编程语言选择的常识。Dan Luu 设计了三组严格实验，给出了一个不那么舒服的答案：这个说法在小任务上可能成立，但在真实规模的编程任务面前，它消失了。 Dan Luu 的实验设计值得先讲清楚。他不做...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/493223/pl-tokens", "publishedAt": "2026-08-11T09:13:20+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "走进 CTO 圆桌：构建 AI 原生组织的工程领导者经验分享 | 技术趋势", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/cFMO2oN8SyaR9vuUVUeQ?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-14T11:30:09+00:00"}, {"title": "首发 | 澎湃OS 4 体验：小米第一个 AIOS，用起来怎么样？", "summary": "只有小米的 AI 才能成就 AI 的小米。#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1675208?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-08-14T06:00:53+00:00"}, {"title": "不止是命令行：Gitee CLI 如何成为 AI Agent 的「Gitee 之手」", "summary": "AI 编程助手已经很能写代码了。Claude Code、Codex、OpenCode 们可以读懂你的仓库、改好一个 Bug、补上一段测试。 但当任务走到「把这个分支提个 PR」「顺手建个仓库」「把这批 issue 归档」时，它们往往就卡住了，网页界面点不动，裸调 REST API 又要记住一堆端点、鉴权和分页规则。 Gitee CLI 正在补上这「最后一公里」...", "sourceName": "开源中国", "sourceU   const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
