const DATA = {"date": "2026-07-31", "generatedAt": "2026-07-31T02:40:39Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "让团队记忆在共建中完善： TencentDB Agent Memory 的开源之路 | 腾讯云数据库 DBTalk", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/video/ylsc5EZdSya6DbkWwgdU?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-31T10:00:00+00:00"}, {"title": "余承东说到做到，华为盘古 openPangu-2.0-Pro 模型及技术报告开源上线", "summary": "IT之家 7 月 31 日消息，华为今日官宣，开源盘古 5050 亿参数的 openPangu-2.0-Pro 模型（模型权重、基础推理代码）及技术报告正式开源上线。开源盘古 openPangu 是华为开源 AI 模型品牌，致力于通过昇腾原生训练与推理技术，为业界用好昇腾提供最佳实践参考。openPangu-2.0-Pro 是基于昇腾 NPU 训练的大规模混合专家（MoE）语言模型，参数规模约 505B，每 token 激活参数规模约 18B，模型支持 512k 上下文长度，训练数据总量约 34T tokens。后训练阶段完成快慢合一微调（SFT）、多专项强化学习（RL），并通过在线蒸馏（OPD）完成能力合一。openPangu-2.0-Pro 在模型架构上实现了全面的升级：Attention 架构：沿用高效 MLA，并采用 DSA+SWA 独立分层混合架构，层配比为 1:2；SWA 层负责局部窗口建模，DSA 层负责稀疏全局聚合，在保持精度的同时显著降低长序列推理的计算、显存与访存开销。拓扑架构：将传统残差连接升级为 4 支流 mHC 架构，提升表征多样性与泛化能力。自投机模块：采用 3 头 MTP 架构，一次额外预测 3 个 token，显著提升模型的推理速度。Muon 优化器：训练中采用 Muon 优化器，获得更快的收敛速度。在今年 6 月的华为开发者大会 HDC 2026 主题演讲中，华为常务董事、产品投资评审委员会主任、终端 BG 董事长余承东宣布，openPangu 2.0 计划从 6 月 30 日起陆续开源 7 大组件，包括新增开源的预训练代码、后训练代码、训练算子。6 月 30 日，92B 参数的 openPangu-2.0-Flash 模型已正式开源上线。对于 openPangu-2.0-Pro 总参数仅 505B，余承东曾解释称，算力大量支持了国内的其他企业需求，自己留的数量还是非常有限的；此外，AI 算力成本非常高，华为更聚焦时延和吞吐率的提升。openPangu-2.0 模型相关组件已陆续上线开源平台，IT之家附开源地址：https://ai.gitcode.com/ascend-tribe/openPangu-2.0-Pro", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/966.htm", "publishedAt": "2026-07-31T02:24:44+00:00"}, {"title": "MiniMax H3 全模态生成模型正式发布：最高支持 15 秒 2K 分辨率，超分方案革新", "summary": "IT之家 7 月 31 日消息，稀宇科技今天宣布推出 MiniMax H3 全模态生成模型，支持对文本、图像、视频、声音组成的多模态上下文的统一理解能力、能够输出具备原生双声道的音视频，最高可支持 15s 2K 分辨率。据前期邀测反馈，MiniMax H3 具备商用级多场景内容生成能力，在指令遵循、文字与品牌信息呈现、V2V Motion Transfer（视频到视频动作迁移）等方面表现出色，号称可精准、可控实现多模态内容编辑与生成，适用于广告、电商、品牌、产品设计、UI / UX 和游戏等场景。核心技术方面，MiniMax H3 增加了 Caption 能力，定制了专属模型和全模态理解管线，大部分素材需要消耗 100K Token 的推理，最终得到平均约 4K 的 Token。同时，MiniMax H3 的 2K 视频输出能力并没有使用常规超分模块，而是使用 H3 基础模型对自己的低分辨率结果进行 in-context 的重新生成，可最大程度地复用 H3 基模已经具备的生成能力，还拥有传统超分方案无法靠“猜”还原的信息。此外，MiniMax H3 将在未来几天内开放模型权重。IT之家将持续关注，第一时间带来最新消息。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/957.htm", "publishedAt": "2026-07-31T02:00:53+00:00"}, {"title": "Anthropic：第三方评估环境配置失误，导致三起真实网络安全事件", "summary": "IT之家 7 月 31 日消息，人工智能企业 Anthropic 当地时间 30 日发布公告，表示在对自家 Claude 的网络安全评估审查中发现了三起不应发生的真实网络安全事件，背后的直接原因是第三方评估环境配置失误。这三次事件中 Anthropic 的模型都被指派了无限制的“夺旗”网络攻击任务。为保障安全性，此类任务的测试环境需与真实互联网隔离，但 Anthropic 与评估伙伴 Irregular 之间存在误解，导致向评估模型开放了真实互联网访问权限。第一起事件中，Claude Opus 4.7 把一个与虚构目标同名的真实公司当成任务目标，访问了其基础设施，提取了凭证和数据库数据。这是最严重的一次事件，模型即使意识到是真实系统仍在继续攻击。而 Claude Mythos 5 在第二起事件中为完成任务将一个恶意 Python 包发布到真实 PyPI。这一恶意文件被下载到 15 个真实系统，导致凭证被窃取。模型曾短暂意识到“如果这是真实互联网会很糟糕”，但说服自己仍在模拟中。Anthropic 内部的一款研究测试模型则表现得相对更好一些。其扫描了约 9000 个目标，用基本手法入侵了一个真实公司，后来意识到是真实环境后主动停止了攻击。Anthropic 表示，所有涉事模型均未部署正式发布时使用的标准安全措施，但都经过了特定的安全训练。这些攻击仅利用了一些基本技术。模型没有发现或利用任何复杂的漏洞，也没有试图将自身从测试环境中导出或故意逃离。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/947.htm", "publishedAt": "2026-07-31T01:34:22+00:00"}, {"title": "最后一次以 CEO 身份参会，苹果库克 2026 财年第 3 财季发言文字记录", "summary": "IT之家 7 月 31 日消息，科技媒体 PatentlyApple 今天（7 月 31 日）发布博文，分享了苹果首席执行官蒂姆 · 库克（Tim Cook）第 90 次，也是其最后一次以 CEO 身份与华尔街分析师召开财报电话会议。IT之家查询公开资料，库克于 2011 年接任苹果首席执行官以来，主持每个财季财报电话会议，讨论公司盈利情况，在过去 15 年以来从未缺席过一次。参与财报电话会议次数方面，如果仅计算库克担任苹果 CEO 期间的参与次数，约为 60 次；如果计算涵盖乔布斯时期的参与次数，该媒体称这是库克第 90 次参与财报电话会议。该媒体统计了财报电话会议内容，指出在会议上，库克所说的最多一句话是“我们不对未发布的产品发表评论”（we do not comment on unannounced products），使用频率最高一次是 2018 年的电话会议中，这句话出现了 11 次。在财报电话会议结束后，库克通常会在 Apple Park 园区内散步放松。他在 2020 年接受采访时表示：“每当我参加季度财报电话会议之类的活动，会议结束后我都会来到这里，Apple Park 的风景真的很美”。IT之家附上 2026 财年（2025 年 9 月 27 日～2026 年 9 月 26 日）第三财季（2026 年 3 月 28 日～2026 年 6 月 27 日）上，库克电话会议的文字记录如下：进入提问环节之前，我想花一点时间感谢大家。感谢我们的股东，尤其是长期支持我们的股东，多年来他们一直给予我们信任；同时也感谢密切关注我们发展的分析师们。正如大家所知道的那样，这是我最后一次主持财报电话会议，未来这些会议将由约翰 · 特努斯主持。整个交接过程正在顺利进行，我非常期待特努斯担任新职位后，带领苹果进入下一个时代。特努斯确实是独一无二的人，没有人比他更适合接任苹果领导职位。正如我所说，我对他的领导力、管理能力，以及苹果公司所有杰出的员工充满信心，他们将丰富全球各地用户的生活。我们拥有光明的未来，而我从未像现在这样乐观。谢谢大家，现在我和凯文很乐意回答大家的问题。各位下午好，感谢参加本次电话会议。苹果今天交出 1094 亿美元（IT之家注：现汇率约合 7401.72 亿元人民币）营收答卷，同比增长 16%，创下六月季度历史新高。尽管面临供应受限、汇率连续承压，我们依然达成了这一成绩。消费者对史上最强产品阵容反响热烈。iPhone 收入同比增长 22%，六月季度再创新高。Mac 产品线表现同样亮眼，收入大增 29%，刷新六月季度纪录。服务业务营收 307 亿美元（现汇率约合 2077.08 亿元人民币），同样创下六月季度新高，全线飘红。我们在每一个地区市场都创下六月季度营收新高，美国、拉美、西欧、印度、中国大陆、日本、东南亚，全面走强。发达市场与新兴市场双双破纪录，多数新兴市场实现两位数增长。今年的 WWDC，是一场创新盛宴。我们发布了全新 Siri AI，这是彻底重构的 Siri，功能更强、更懂你、无缝融入全平台。开发者和公测用户的反馈，让我们备受鼓舞。早期用户好评如潮，大家的兴奋我们感同身受。这印证了我们的理念：打造私密的、基于个人情境的 AI，才能真正改变用户获取信息、完成任务的方式，真正丰富生活。我们对此充满期待，也坚信它将带来深远影响。WWDC 上，我们还发布了保护儿童上网安全的新工具，市场反响热烈。Ask to Browse、Time Allowances 等新功能，将帮助家长引导孩子养成健康的数字习惯。这些工具融入了美国儿科学会等权威机构的临床与儿童发展研究成果。我们的目标是让家长更轻松地管控孩子看什么、和谁互动、怎么用、何时用。今年秋季，这些新功能将随各大系统更新一同上线。下面来看各业务线业绩，先说 iPhone。六月季度，iPhone 营收 543 亿美元（现汇率约合 3673.79 亿元人民币），同比增长 22%。所有地区市场均创六月季度新高，升级用户数也刷新纪录。据 IDC 数据，本季度我们全球市场份额进一步提升。我说过，这是史上最强、最受欢迎的 iPhone 阵容。A19 和 A19 Pro 芯片性能卓越，越来越多的用户每天都在用 iPhone 体验 AI。全系列 iPhone 持续提供用户信赖的性能、续航、耐用性和影像能力。iPhone 17 Pro 和 Pro Max 影像系统登峰造极，iPhone Air 纤薄惊艳，iPhone 17 性能与耐用均衡出色，iPhone 17e 性价比超群，总有一款适合你。Mac 交出史上最佳六月季度成绩单。营收 104 亿美元（现汇率约合 703.64 亿元人民币），同比大增 29%，尽管供应受限严重。增长动力来自最新产品线，MacBook Pro 和全新 MacBook Neo 的强劲表现。据 IDC 数据，我们全球份额持续提升。发达市场创六月季度新高，新兴市场刷新历史纪录，大中华区表现尤为突出，营收创历史之最。升级用户和新增用户也双双破纪录。凭借 Apple Silicon，Mac 产品线能效出众、内存带宽海量、AI 能力跃升至全新层级。Mac 始终是 AI 终极利器，高吞吐量、端侧推理、各类 AI 创作负载，样样精通。越来越多用户正在释放这些能力：有人用 Mac Mini 搭建强大的智能体 AI 平台，有人部署 Mac Studio 集群，本地运行前沿大模型。Mac 家族持续俘获用户芳心。MacBook Neo 人气尤其火爆，独特设计加超高性价比，在全球圈粉无数，我们正全力赶工满足需求。MacBook Air 成为全球最受欢迎的笔记本，搭载 M5 芯片，便携与性能兼得。MacBook Pro 搭载 M5 Pro 和 M5 Max，依然是专业人士的首选，驾驭最苛刻的 AI、开发和创意工作流。iPad 方面，六月季度营收 62 亿美元（现汇率约合 419.48 亿元人民币）。性能强劲、便携出众、功能全面 ——iPad 依然是学生、创业者和各类创作者的终极随身利器，走到哪、用到哪。iPad Air 搭载 M4 芯片后，能力再上台阶：个人效率、沉浸式学习、高级创意工作流，性能全面跃升。加上性能卓越的 iPad Pro、性价比与多功能兼备的 iPad、超便携的 iPad mini，我们奉上了史上最强 iPad 阵容。可穿戴、家居及配件业务营收 79 亿美元（现汇率约合 534.49 亿元人民币），同比增长 6%。所有地区市场均实现增长，Apple Watch 升级用户数创六月季度新高。Apple Watch 产品线汇集了我们有史以来最全面的健康与健身功能。每一项实用功能都有研究背书，帮助用户更深入了解自身健康状况。几乎每天，我们都能收到反馈，Apple 的健康创新正在改变、甚至拯救全球用户的生命。这让我们倍感欣慰。与此同时，AirPods 全产品线持续升级：AirPods Pro 3 带来沉浸式聆听体验，AirPods Max 2 奉上顶级音质和出色的主动降噪。借助 Apple Intelligence 驱动的实时翻译，人们跨越语言障碍，以前所未有的方式连接彼此。正如前面提到的，我们正全力推进下一代 Apple Intelligence，包括 Siri AI 和各平台正在开发的 AI 功能。这些体验直观实用，又深度个性化、高度私密，最新模型既可在端侧运行，也可通过私有云计算在服务器上运行。早在 2017 年推出神经网络引擎时，我们就开始为最佳 AI 体验铺路。从那以后，我们持续创新、持续投入，打造以 AI 为核心的芯片、系统和可扩展统一内存架构。苹果的独门秘诀，是三大能力的独特融合：海量统一内存带宽、业界领先的能效表现、深厚的端侧智能，一切从底层就围绕用户体验构建。结果就是：苹果打造了全球体验 AI 的最佳硬件，无论是用 Siri AI 等 Apple Intelligence 功能，还是用第三方产品。正因如此，越来越多的开发者和研究人员，选择用苹果设备打造更先进的工具和模型。再看服务业务。营收 307 亿美元（现汇率约合 2077.08 亿元人民币），创六月季度新高，同比增长 12%，尽管汇率连续承压。发达市场营收创历史新高，新兴市场创六月季度新高。Apple TV + 持续俘获观众：《寡妇湾》《恐怖角》等新剧惊艳亮相，《筒仓》《糖》等热门剧集强势回归。下周，《足球加量》第四季重磅归来，令人期待。Apple TV + 斩获业界最高荣誉，继艾美奖、格莱美奖、奥斯卡奖之后，今年再添托尼奖。我们达成这一里程碑的速度，史上所有流媒体平台无人能及。今年艾美奖，苹果斩获 89 项提名，刷新纪录，剧情类和喜剧类主要奖项均领跑全网，三项最佳剧情类剧集提名，三项最佳喜剧类剧集提名。《寡妇湾》表现尤为突出，以 19 项提名成为年度获提名最多的新剧。上线六年半以来，Apple TV + 已斩获 850 余项大奖，获近 3800 项提名。为迎接世界杯，我们将 Apple Sports 扩展至全球 170 多个国家和地区，让球迷比以往更轻松地追随每一个精彩瞬间。与此同时，难忘的 F1 赛季赛程过半，Apple TV + 订阅用户全程追更，为喜爱的车手和车队加油。零售方面，本周我们面向美国用户推出 Apple Upgrade 服务。这是一项与 Klarna 合作的全新硬件租赁计划，用户可以选择适合自己的方案，更轻松地用上苹果最新产品。在所有工作中，我们始终深思熟虑、目标明确，为用户和社区创造价值。这意味着：持续创新，用新一代 Apple Intelligence 保护用户隐私；帮助家长守护孩子安全，正如前面提到的。值全球无障碍意识日之际，我们发布了多项新功能，帮助用户更好地使用日常产品。VoiceOver、放大器、语音控制、辅助功能阅读器，都将迎来全新智能功能，更实用、更直观。我们还利用端侧语音识别技术，为无字幕视频自动生成字幕。Apple Vision Pro 则新增一项功能，让电动轮椅用户仅凭双眼即可控制驱动系统。所有这些功能，源于苹果长期坚守的承诺：让科技惠及每一个人。我们持续为全球用户开发新功能，也在本土投资创新，尽我们的一份力。去年，我们承诺四年内向美国投资 6000 亿美元（现汇率约合 4.06 万亿元人民币）。现在，正如之前所说，我们计划将收到的关税退款，全部再投资于美国。推进美国供应链建设，我们进展喜人。本月初，苹果宣布与博通达成新协议，共同设计和生产定制芯片组件及前沿无线连接技术。这项多年期协议是苹果“美国制造计划”的一部分，预计总金额超 300 亿美元（现汇率约合 2029.72 亿元人民币），这是我们在美国制造计划中规模最大的一笔承诺，也是我们在美国构建端到端芯片供应链的重要一步。休斯顿的苹果先进制造中心即将开业，令人振奋。该中心所在的厂房，目前已在组装先进 AI 服务器。今年晚些时候，Mac mini 也将在这里生产。中心将向学生、供应商员工和各类企业，传授我们制造产品所用的创新工艺。2026 年我们即将迎来一个激动人心的秋季，更远的未来更是无比壮阔。我们的产品路线图令人惊叹。Siri AI 将如何丰富用户生活，我们满怀期待。一路走来，我们将始终秉持北极星精神：打造最好的产品和服务，让人们创造奇迹。能以持久而有意义的方式融入人们的生活，帮助他们创造、连接、体验世界，是一种莫大的荣幸。我无比激动，期待见证我们非凡的创新故事继续书写。我从未如此坚信最好的，还在后头。接下来，有请凯文。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/945.htm", "publishedAt": "2026-07-31T01:31:44+00:00"}, {"title": "特斯拉推送 2026.14.13 系统更新：引入豆包大模型、新增宠物模式", "summary": "IT之家 7 月 31 日消息，特斯拉中国今日公布了 2026.14.13 版本的车机软件更新，覆盖 Model 3、Model Y、Model S、Model X 车型。2026 年 07 月 31 日已开始分批次推送，IT之家附本次软件更新主要升级内容如下：安全改进：修复内存越界访问、CAN 总线缓冲区溢出和符号链接条件竞争的漏洞。豆包大模型：一款智能语音助手，不仅能提供实时信息，还能展开自然流畅的对话；支持多款精品音色，可搭配“万事通”“音乐爱好者”以及“故事会”等个性化角色，需要开通高级车载娱乐服务以使用此功能。宠物模式：前往“控制 &gt; 显示 &gt; 自定义宠物模式”，选择并命名您的宠物。行程：“行程”功能现在位于“能量”应用程序中，可创建和管理多个行程，跟踪不同驾驶、路线或状况下的能耗；可通过在媒体卡上向左滑动快速访问行程卡。画板：增强版画板新增支持贴纸和表情符号，保存草图后可在手机应用程序中访问并分享，要求手机应用程序版本为 4.55.6 或更高。Apple Music：在 Apple Music 中向右滑动歌曲，可将其添加至播放队列；长按歌曲可将其添加至“个人收藏”或从中移除。自动软件更新：支持特斯拉在夜间自动安装已下载的软件更新；启用后更新会在车辆驻车且未使用时安装，确保始终拥有最新功能和改进，可在“控制 &gt; 软件 &gt; 自动安装更新”开启该功能。行车记录仪查看器更新：可将行车记录仪最近视频片段中的任何短片永久保存在特斯拉车辆上，短片仅保留在车辆本地，不会上传至特斯拉服务器。地图包版本更新至 CN-2026.14-16069。本次更新中最受关注的当属字节跳动豆包大模型的引入，这也是特斯拉首次在国内车机中引入第三方大模型服务。该功能支持多音色与个性化角色选择，能够为车主提供更自然流畅的语音交互体验，不过需要车主开通高级车载娱乐服务才能使用。除了大模型功能外，本次更新还新增了宠物模式，方便车主在短暂离开车辆时为宠物保留舒适的车内环境，同时优化了行程功能、画板、Apple Music 使用体验，新增自动软件更新、行车记录仪本地保存功能，进一步提升了车机的实用性与易用性。此外，本次更新还修复了多个安全漏洞，进一步提升了车机系统的安全性。需要注意的是，部分功能的实现时间和效果可能根据车型和车辆配置存在差异，具体功能还请以实际收到的推送为准。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/943.htm", "publishedAt": "2026-07-31T01:18:16+00:00"}, {"title": "印度人工智能企业 Sarvam AI 将开发 T 级模型", "summary": "IT之家 7 月 31 日消息，印度人工智能企业 Sarvam AI 在当地时间本周四开幕的首届 Sarvam Epoch 会议上宣布，该公司将开发参数达到万亿量级的人工智能模型。Sarvam AI 表示，其现有的 105B 模型在诸多方面表现出色，语音模型则能提供显著优于全球竞争者的性价比。该企业之所以要开发 T 级模型，是因为一种“印度应该生产自身消费的 Token（词元）”的信念，印度应避免在金钱和数据上向外国人工智能企业“双重付费”。这一设想中的新模型预计将在未来六个月内完成，可在编程、网络安全、科学研究等领域与领先模型展开竞争。Sarvam AI 昨日宣布将在美国设立办事处，吸引当地印度裔人工智能人才回流。其还公布了两款模型产品，分别是 Bulbul V4 文本转语音模型和 Saaras V4 Multi-speaker 语音识别模型。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/936.htm", "publishedAt": "2026-07-31T00:59:58+00:00"}, {"title": "智谱 GLM Coding Plan 订阅回归：透明积分制，每月 118 元起", "summary": "IT之家 7 月 31 日消息，智谱今日官宣 GLM Coding Plan 订阅回归，套餐价格和套餐规则有所调整。即日起至 2026 年 8 月 15 日，订阅新版包年 / 包季套餐分别享限时 7 折/ 8 折优惠。据IT之家今年 4 月报道，智谱发布 GLM Coding Plan 老套餐迁移与补偿说明，表示为了持续提升产品体验、统一套餐体系，并为后续功能与权益升级提供更稳定的支持，GLM Coding Plan 老套餐（无周限额版本）停止自动续订。新版套餐采用完全透明的积分制。输入、输出、缓存命中 Token，以及不同模型和 MCP 能力的使用，均按照公开规则折算为积分，额度怎么算、用了多少、还剩多少，都更加清晰，额度使用更加可预期。无论新老用户，周末全天均按照低峰时段倍率抵扣额度。此外，现已支持 Coding Plan 用户申请体验高速版，老套餐用户优先获得体验资格。IT之家从智谱公告获悉，持有当前套餐的用户，包括团队套餐用户，其价格、权益、额度及计算方式均不受影响，可按照原套餐继续使用、续订和升档。但需要注意的是，当前持有 v1 版本（无周限流）的老用户，由于智谱已经于 2 月下架了最早的套餐产品，导致无法续订或升级当时的套餐。针对于这部分用户，在有效期内权益不变，到期前可以按本次调整前 v2 版本价格购买及长期使用（该功能将在 2 周内尽快上线）。GLM Coding Plan 是专为 AI 编码打造的订阅套餐，可实现自然语言编程、代码调试与修复、代码库问答、自动化任务处理等功能。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/934.htm", "publishedAt": "2026-07-31T00:56:52+00:00"}, {"title": "新研究：AI 对就业市场的真正威胁不是失业，而是让加薪更困难", "summary": "IT之家 7 月 31 日消息，据《商业内幕》今天（31 日）报道，阿波罗全球管理公司最新白皮书认为，AI 未必会直接抢走人们的工作，却可能率先压低工资。这项研究追踪了 321 种职业的工资和就业数据。结果显示，AI 暴露度最高的岗位自 2023 年起，实际工资增速平均下降 6.7%。而这一时间点，大致与 ChatGPT 开始迅速走红相吻合。阿波罗分析师萨尼娅 · 埃德利希和首席经济学家托尔斯滕 · 斯洛克在报告中写道，研究尚未发现 AI 对整体就业产生“可检测”的影响。IT之家从数据中获悉，低收入劳动者受到的工资冲击最为明显。自 2023 年以来，服务业劳动者的收入增速平均下降 24.3%，收入位于后 25% 的劳动者工资下降 10.7%。收入最高的劳动者群体则没有受到“显著影响”。研究人员还采用了 Anthropic 经济指数，根据各职业任务中实际使用 Anthropic AI 工具完成的比例评估 AI 暴露度。阿波罗比较美国劳工统计局 2022 年至 2024 年的数据后发现，以下 AI 暴露度较高的职业已经出现明显的实际工资变化：职业实际工资变化AI 暴露度（Anthropic 指数）计算机程序员-6.1%0.75统计助理-5.4%0.51软件质量保证分析师和测试员-2.9%0.52数据库架构师-2.7%0.58医疗转录员-1.5%0.64批发和制造业销售代表（技术及科学产品除外）-1.3%0.63部分职业的工资降幅更大，背后原因可能主要来自行业整体变化。广播节目播音员和电台 DJ 的 AI 暴露度在 Anthropic 指数中相对较低，实际工资却在两年内暴跌 52%。部分 AI 暴露度适中的职业反而实现了较大幅度的工资增长。个人理财顾问超过三分之一的工作任务可能受到 AI 影响，工资却上涨 8.4%。行政法法官、裁决员和听证官约 30% 的工作任务可能受到 AI 影响，同期工资上涨 17.5%。白皮书估计，美国约有 580 万名劳动者从事 AI 暴露度较高的工作。埃德利希和斯洛克表示，随着 AI 在美国企业界得到更广泛应用，这一数字很可能大幅增加，并在未来几年对收入不平等和劳动力市场政策产生重大影响。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/930.htm", "publishedAt": "2026-07-31T00:31:31+00:00"}, {"title": "暂未上线测试的 5 项苹果 iOS 27 功能汇总：接入更多 AI、升级健康应用等", "summary": "IT之家 7 月 31 日消息，科技媒体 9to5Mac 昨日（7 月 30 日）发布博文，梳理彭博社马克 · 古尔曼（Mark Gurman）等消息源此前爆料内容，指出目前苹果正测试的 iOS 27 系统中，仍有 5 项传闻功能尚未现身。一、接入更多聊天机器人，以及扩展 Siri 体验iOS 27 的搜索（Search）和询问（Ask）界面已提供入口，可以切换调用的 AI 模型，不过现阶段除了 Siri 之外，用户只能选择 OpenAI 的 ChatGPT 聊天机器人。IT之家援引博文报道，苹果正测试接入 Claude（Anthropic 的人工智能助手）和 Gemini（谷歌的人工智能模型与助手），但尚不清楚何时开放接入。二、升级健康应用苹果曾计划推出内部代号为“Mulberry”的综合健康教练服务，后续缩减了该计划。保留下来的部分功能包括改进血糖相关追踪，以及允许用户借助设备相机监测运动情况。古尔曼称，这些更新预计不会随 iOS 27 首个正式版本推出。三、调用第三方 AI 模型用于生成图片和文本图乐园（Image Playground）和写作工具（Writing Tools）目前可以调用 ChatGPT 生成图片和文本，不过古尔曼透露在未来 iOS 27 版本中，将会开放接入第三方模型，进一步扩展 AI 生图和处理文本能力。四、自定义相机应用界面报道称，用户可自行选择位于相机界面顶部的一组控件，苹果将这类控件称为“widgets”。现有 iOS 27 已为相机应用新增 Siri 模式，但尚未开放上述自定义能力。该功能可能配合 iPhone 18 Pro 发布，但该时间点同属推测。五、面向 iPhone Ultra 的并排应用多任务处理iOS 27 中已有多款苹果应用支持横屏模式，报道将其视为适配宽屏折叠设备的准备。古尔曼称，待 iPhone Ultra 推出后，苹果还将支持 2 个应用并排显示与操作。iPhone Ultra 的产品名称及上市计划均未获苹果确认。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/927.htm", "publishedAt": "2026-07-31T00:17:03+00:00"}, {"title": "Meta 借助 AI 大幅缩短应用开发周期，更多新应用已在路上", "summary": "IT之家 7 月 31 日消息，据外媒 TechCrunch 今天（31 日）报道，Meta 正借助 AI 大幅缩短应用开发周期，并准备推出更多新产品。Meta CEO 马克 · 扎克伯格在本周第二季度财报电话会议上透露，多款新应用正在筹备中。近期推出的产品包括面向 Marketplace 卖家的应用、Facebook 群组应用、通过“氛围编程”打造的游戏应用、Instagram 照片应用，以及 AI 睡前故事实验。Meta 多年来一直希望在 Facebook、Instagram 等核心平台之外打造新的独立社交应用，但此前的尝试几乎全部失败。Meta 认为，大语言模型能够显著提高软件开发效率，让团队以更快速度推出产品并验证新想法。扎克伯格表示：AI 正在帮助团队加快产品开发，我非常期待。今年早些时候，我们推出了 Instagram Instants。最近又发布了独立群组应用 Forum 和独立 Marketplace 应用 Seller。未来推出新应用会容易得多，因此我们准备尝试更多创意，再利用推荐系统推动应用增长。AI 正在改善 Meta 的核心业务，不仅让应用提供的内容更贴合用户需求，也为企业客户带来更好的效果。Meta 已经开始推出更具创新性的产品，很快还会有更多产品跟大家见面。Meta 首席财务官苏珊 · 李指出，大语言模型在改善内容排序和推荐效果方面正变得越来越有效。首先，模型能够真正理解内容主题，并生成质量更高的训练数据，让现有推荐系统更加智能。其次，AI 智能体可以评估内容质量、发现流行趋势并测试排序调整，从而加快工程开发。投资者没有进一步追问 Meta 正在筹备哪些新应用，而是把注意力集中在 AI 投入和 Meta 不断扩张的企业级业务上。扎克伯格回应称，面向消费者的新产品即将推出，公众很快便能看到下一批应用。IT之家从报道中获悉，Meta 过去曾多次尝试孵化新应用。在 Meta 仍使用 Facebook 名称时，曾设立内部孵化器 Creative Labs，专门测试新的社交产品构想。Creative Labs 先后推出照片分享应用 Slingshot、匿名聊天应用 Rooms、对标 Flipboard 的 Paper、照片分享应用 Moments 和协作视频应用 Riff。由于始终无法吸引足够用户，Creative Labs 于 2015 年终止实验，所有应用后来均被关闭。进入 2020 年代后，Meta 通过内部研发团队 NPE Team 重新尝试。NPE Team 测试过聊天应用 Bump、社交音乐应用 Aux、任务应用 Move、约会应用 Spark、通话应用 CatchUp、小型杂志制作应用 E.gg、活动应用 Venue、创作者问答应用 Hotline、Cameo 竞品 Super、情侣应用 Tuned 和音乐应用 BARS 等产品。第二轮尝试同样没有诞生热门产品，这批应用的归宿同样是一砍了之。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/923.htm", "publishedAt": "2026-07-30T23:51:50+00:00"}, {"title": "库克暗示苹果将为高频使用 AI 的 iOS 27 用户增加 iCloud+ 订阅层级", "summary": "IT之家 7 月 31 日消息，科技媒体 The Verge 今天（7 月 31 日）发布博文，报道称 2026 财年（2025 年 9 月 27 日～2026 年 9 月 26 日）第三财季（2026 年 3 月 28 日～2026 年 6 月 27 日）电话会议上，苹果首席执行官蒂姆 · 库克（Tim Cook）暗示未来将会为高频使用人工智能功能的用户提供付费升级渠道。在财报电话会议上，库克预测在 iOS 27 系统发布后，会有大量用户使用 Siri AI 以及各种 Apple 智能（Apple Intelligence）功能，对此库克补充道：“我们将在 iCloud+ 上提供某种升级选项，用户可以购买更高级别的服务。”苹果公司曾于 2026 年 6 月表示，由于生成图片等 AI 功能依赖强大的服务器模型，因此设有每日使用限制。大多数 iCloud+ 套餐都提供“更高的访问权限”，而库克此次表态显示，苹果可能继续为重度用户增加订阅层级。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/920.htm", "publishedAt": "2026-07-30T23:36:51+00:00"}, {"title": "谷歌：多亏人工智能，6 月修复的 Chrome 漏洞比过去两年总和还多", "summary": "IT之家 7 月 31 日消息，据外媒 TechCrunch 今天（31 日）报道，得益于内部 AI 工具，谷歌仅用一个月便为 Chrome 修复了超过过去两年总和的安全漏洞。当地时间 30 日，谷歌宣布，6 月推出的 Chrome 149 和 Chrome 150 共修复 1072 个安全漏洞。此前两年发布的 23 个 Chrome 版本合计修复 1036 个漏洞，不及最近两个版本的修复总量。大语言模型问世后，网络安全专家曾多次警告，AI 将以越来越快的速度发现海量漏洞，漏洞数量甚至可能呈指数级增长。面对同样使用 AI 的恶意黑客，安全团队也必须依靠 AI 提前发现并修复问题。谷歌一份白皮书中的图表显示，Chrome 发现并修复的漏洞数量正快速攀升。白皮书介绍了谷歌如何利用 AI 查找安全缺陷，并缩短修复时间。Chrome 126 于 2024 年 6 月发布，Chrome 149 和 Chrome 150 则于上个月推出。谷歌把每个 Chrome 正式版本称为一个“里程碑”。Chrome 工程总监道格 · 特纳提到，大语言模型已经从根本上改变了网络安全的成本结构，让漏洞发现成为自动化、工业化的大规模作业。“通过使用 Gemini 等模型，我们能够在漏洞遭到利用前完成修复，跑在对手前面，并通过每次更新进一步提高 Chrome 的安全性。”IT之家从报道中获悉，并非只有谷歌发生了类似变化。微软本月早些时候宣布，在例行的“补丁星期二”更新中，微软各产品线一次修复了创纪录的 570 个安全漏洞。微软认为，内部使用 AI 是修复数量突然激增的重要原因。苹果暂时没有呈现同样的指数级增长。独立统计显示，苹果 2026 年至今已修复 482 个产品漏洞。按照目前进度，苹果全年修复数量可能达到或超过去年，也大致相当于 2015 年的水平。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/916.htm", "publishedAt": "2026-07-30T23:14:49+00:00"}, {"title": "谷歌最强具身推理模型：Gemini Robotics ER 2 登场，支持连续视频理解与多机器人协作", "summary": "IT之家 7 月 31 日消息，谷歌 DeepMind 昨日（7 月 30 日）发布博文，宣布推出 Gemini Robotics ER 2 模型，是其面向机器人的最强具身推理（embodied reasoning）模型。定位方面，该模型可视为机器人的“高级大脑”，协调处理与人类交流、理解物理世界并规划多步骤任务等。该模型后续会向更低层级的视觉-语言-动作 (VLA) 模型分派任务，管控其完成各项任务。在功能方面，相比较此前 1.6 版本，Gemini Robotics ER 2 模型通过持续观看视频，机器人现在可以追踪自身的运行进度，在出现问题时进行调整，并准确把握进入下一步的时机。模型还可原生调用 Google Search（谷歌搜索）或开发者自定义函数。在物理智能体方面，在机器人当前处于执行任务状态下，Gemini Robotics ER 2 模型可以同步推理后续步骤，以减少传统机器人“停止 — 思考 — 再行动”带来的停顿。该模型接入 Gemini Live API（Gemini 实时 API）的双向流式端点，面向对延迟敏感的机器人任务。相较 Gemini Robotics ER 1.6，ER 2 可分析连续视频流。机器人可据此跟踪自身任务进度，在动作出错时调整或重试，并判断何时进入下一步骤。在任务进度分类测试中，Gemini Robotics ER 2 的准确率为 57.4%。该能力可帮助机器人在不重启整个工作流的情况下修正失败步骤。在 moment-finding &nbsp;时刻寻找（关键时刻定位）测试中，模型需要找出关键事件发生的精确视频帧，例如判断何时停止向杯中倒咖啡。ER 2 的准确率为 91.3%，平均绝对时间误差为 0.96 秒。谷歌称，该模型以更低计算成本达到接近更大模型类别的精度，执行速度为其 4 倍，并满足现实机器人安全运行所需的亚秒级延迟要求。ER 2 还支持多机器人协作。不同类型的机器人可借助共享语义理解沟通、交接任务，并完成单台设备难以独立完成的复杂工作流。谷歌展示了 Apptronik 的 Apollo 2 与 Franka 的 FR3 Duo 协作案例。Gemini Robotics ER 2 现已通过 Gemini API 和 Google AI Studio 面向开发者公开提供；同时，它已在 Gemini Enterprise Agent Platform（Gemini 企业智能体平台）中开启私密预览。谷歌还发布了模型配置和提示词示例代码。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/915.htm", "publishedAt": "2026-07-30T23:12:07+00:00"}, {"title": "亚马逊 2026 财年第二财季归母净利润 626.47 亿美元，同比增长 244.90%", "summary": "IT之家 7 月 31 日消息，亚马逊今日发布 2026 财年（2026 年 1 月 4 日～2027 年 1 月 2 日）第二财季（2026 年 4 月 5 日～2026 年 6 月 30 日）及半年报（2026 年 1 月 4 日～2026 年 6 月 30 日）报告：2026 财年第二财季营业总收入： 2006.06 亿美元（IT之家注：现汇率约合 1.36 万亿元人民币），同比增长 19.62%毛利： 1048.28 亿美元（现汇率约合 7100.68 亿元人民币），同比增长 20.64%毛利率： 52.26%，同比增长 0.45 个百分点归母净利润： 626.47 亿美元（现汇率约合 4243.49 亿元人民币），同比增长 244.90%经营现金流： 453.87 亿美元（现汇率约合 3074.36 亿元人民币），同比增长 39.59%基本每股收益： 5.82 美元（现汇率约合 39.4 元人民币），同比增长 240.35%稀释每股收益： 5.75 美元（现汇率约合 38.9 元人民币），同比增长 242.26%2026 财年半年报营业总收入： 3821.25 亿美元（现汇率约合 2.59 万亿元人民币），同比增长 18.17%毛利： 1988.84 亿美元（现汇率约合 1.35 万亿元人民币），同比增长 20.11%毛利率： 52.05%，同比提升 0.84 个百分点归母净利润： 929.02 亿美元（现汇率约合 6292.85 亿元人民币），同比增长 163.25%经营现金流： 714.19 亿美元（现汇率约合 4837.67 亿元人民币），同比增长 44%基本每股收益： 8.64 美元（现汇率约合 58.5 元人民币），同比增长 160.24%稀释每股收益： 8.53 美元（现汇率约合 57.8 元人民币），同比增长 160.86%AI 解读本次亚马逊 2026 财年第二季度财报营收和净利润均大幅超出市场预期，AWS 业务增速 率约合 13.5 元人民币）降低 20%每 100 万 Token 输出15 美元（现汇率约合 101.6 元人民币）12 美元（现汇率约合 81.3 元人民币）降低 20%GPT-5.6 Luna调整前调整后降幅每 100 万 Token 输入1 美元（现汇率约合 6.8 元人民币）0.2 美元（现汇率约合 1.4 元人民币）降低 80%每 100 万 Token 输出6 美元（现汇率约合 40.6 元人民币）1.2 美元（现汇率约合 8.1 元人民币）降低 80%对于本次降低费用原因，OpenAI 在官方博文中指出，普及先进智能是公司的核心使命，通过不断降低客户使用成本，确保通用人工智能（AGI）造福全人类。OpenAI 希望通过降价回馈用户，帮助其在 AI 方面的每一分投资都物有所值。OpenAI 希望为企业提供更具成本效益的方式，来处理大量高质量工作。在博文中，OpenAI 公司还分享了一张 Artificial Analysis Intelligence Index v4.1 的跑分对比图，显示在每完成任务费用方面，GPT-5.6 Luna 模型能以更低的价格，具备更前沿的智能表现，其成绩优于 DeepSeek V4 Pro 模型。上图中，横轴代表完成一个典型任务需要消耗的费用；纵轴代表完成任务的表现得分情况", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/912.htm", "publishedAt": "2026-07-30T22:58:46+00:00"}, {"title": "从GPT-2到Kimi K3：七年规模扩大2.26万倍，大模型架构主线是在建立一套“记忆操作系统”", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/NMXxssS9qB8LtRlWMr5V?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-30T17:12:29+00:00"}, {"title": "自用还是出售赚钱？科技巨头面临 AI 算力分配难题", "summary": "IT之家 7 月 30 日消息，随着科技巨头大举建设算力基础设施，以满足 AI 热潮带来的需求，一些企业正面临一个棘手的问题：究竟应该把算力留给自己使用，还是拿出来出售赚钱？IT之家注意到，Meta CEO 马克 · 扎克伯格本周在公司第二季度财报电话会议上谈到了这一问题。虽然 Meta 目前没有向客户销售算力（即用于运行人工智能的数据中心处理能力）的业务，但扎克伯格表示，相关业务已在规划之中。扎克伯格表示，Meta 的“大部分”算力将用于训练公司的 AI 模型、驱动 AI 智能体，以及支持核心业务的发展。他说：“不过，我们也预计将发展一项规模可观的业务，为大型客户提供服务。”为了满足人工智能快速增长的需求，科技巨头正竞相扩建算力基础设施。谷歌和 Meta 最近均小幅上调了今年的资本支出预期，而谷歌还表示，2027 年的投资规模可能会更大。相比之下，微软则罕见地维持了此前的资本支出预测不变。巨额投入已经开始反映在财务数据中。谷歌第二季度自由现金流历史上首次转为负值，而 Meta 的自由现金流则较去年同期暴跌 91%。出售算力可以在一定程度上缓解现金流压力，但也意味着需要付出机会成本。多家科技公司的高管都反复强调，目前全球算力依然供不应求。这些公司都在争夺 AI 竞争的领先地位，甚至公司内部员工有时也需要竞争才能获得算力资源。微软同样面临这一两难局面。Business Insider 记者 Dan DeFrancesco 本周早些时候形容道：“微软究竟应该抓住眼前的市场需求赚钱，还是更加专注于长期战略目标？”微软首席财务官 Amy Hood 在周三举行的财报电话会议上表示，公司云业务“客户需求持续超过可提供的算力容量”。谈到短期利润与长期发展的取舍时，扎克伯格在电话会议后半段再次回应了这一问题。他说：“我们经常需要面对一个权衡：是今天就把某项资源变现，还是将其保留下来，打造未来更有价值的资产？”他表示：“如果只是把所有算力都卖掉，赚取短期利润，那将是非常愚蠢的做法。”他认为，随着 AI 智能水平不断提升，算力本身的价值也会不断放大。不过，算力保留过多同样可能影响谷歌等超大规模云服务提供商利润丰厚的云计算业务。伯恩斯坦（Bernstein）分析师 Mark Shmulik 上周在一份关于谷歌的研究报告中表示：“如果企业客户得不到足够的算力，他们很快就会重新转向亚马逊或微软。”谷歌上周表示，在持续扩建自有算力基础设施的同时，公司还将采购更多第三方算力，以满足客户需求。此外，谷歌还在持续研发自己的 AI 芯片 —— 张量处理器（TPU），并通过与合作伙伴共同部署到更多数据中心，进一步提升整体算力供应能力。谷歌 CEO 桑达尔 · 皮查伊上周在财报电话会议上谈及 TPU 时表示：“我们的首要任务，是确保拥有足够的算力来支持我们在 AGI（通用人工智能）领域保持领先竞争力。这是一切工作的基础。”Mark Shmulik 在报告中指出，虽然谷歌希望依靠云业务推动增长，但同时也必须保留足够的算力资源，以巩固其搜索业务的竞争优势。除此之外，谷歌还需要确保开发者愿意持续使用其平台，并留在自身生态系统中，而实现这一目标，同样离不开更多算力资源的投入。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/906.htm", "publishedAt": "2026-07-30T15:12:11+00:00"}, {"title": "小米澎程系列技术发布会一文汇总：雷军详解昆仑架构，N90/N70 预售价亮眼", "summary": "久等了，小米澎程系列新车终于迎来首秀，就在今天（7 月 30 日）19:00，SKYNOMAD 小米澎程小米汽车技术发布会如期举行。这是小米汽车的第二次技术发布会，距 2023 年 12 月 28 日的首场，已过去两年半之久。如果说 SU7/YU7 系列是小米交出的第一份答卷，那么澎程这个历时三年半打磨的第二个产品系列，便是小米打出的第二张牌。在本场发布会中，澎程系列两款全新车型 —— 大七座旗舰增程 SUV N90 Max 与大五座四驱增程 SUV N70 Max 携手亮相，并且公布预售价格。而既然是技术发布会，核心自然聚焦于技术本身，“小米昆仑技术架构”得以重磅揭晓，涵盖小米昆仑平台、小米昆仑超级增程、小米昆仑全域安全。一、小米昆仑技术架构在发布会中，雷军谈及小米澎程车型，表示想造一辆这样的车：有 SUV 外观、驾驶性和通过性，却有类似房车的空间和布置的灵活性。基于这样的思考，小米花了 3 年半时间，打造了一套全新平台架构 —— 小米昆仑技术架构，其中包含小米昆仑平台、小米昆仑超级增程、小米昆仑全域安全。小米昆仑平台先来看看小米昆仑平台，第一个核心设计为“前后贯穿纯平地板”，从驾驶舱贯穿至后备厢。为此，小米针对后电驱、电池包、油箱进行布局突破，最终纯平地板长达 2.9 米，地板角度 2.95°，接近水平，最大化释放空间。第二个核心设计为“方正格局”，重点优化后轮包设计，布置极为紧凑，舱内可用面积最高可达 4.4m²。第三个核心设计为“超长滑轨”，澎程 N90 Max 拥有 6 根滑轨，最长 1938mm，可以布置成 2+2+3 大七座布局。二三排支持“极致后移”，二排乘坐空间最大 1.55 米、储物空间最大 1831L。同时，座椅滑轨采用 7 系加强铝合金，15000 次循环测试无松动；锁止强度高达 54000N，剥离强度高达 57000N。小米昆仑超级增程再来看看小米昆仑超级增程，雷军直言“希望打造同档最好的增程 SUV 体验”。为此，小米澎程采用大电池增程方案，并推出两款增程专用电池包：52kWh 磷酸铁锂、76kWh 三元锂。N70 Max CLTC 最高纯电续航 505km。双电机四驱增程系统，前驱动电机峰值功率 210kW，后驱动电机峰值功率 100kW。其中前驱动电机应用小米超级电机技术，最高效率 95.77%，搭载 SiC 功率模块、0.2mm 硅钢片、分段环氧磁钢，电驱效率提升 2.65%。在采用大电池增程方案的同时，小米汽车与东安动力深度定制小米昆仑增程器 1.5T，7 个核心零部件重点开发，57 个零部件重新优化设计。搭载该增程器的澎程 N90 Max，WLTC 亏电油耗仅 6.26L/100km，CLTC 综合续航 1705km。该增程器实车热效率为 42%，整车油耗降低 0.2L/100km，增程器首保后，3 年或者增程器 3 万公里保养 1 次，支持 92、95、98 号汽油。最后来看小米昆仑全域安全，雷军强调“安全是基础，安全是前提，安全高于一切”，搭载铠甲笼式车身。具体来看，澎程 N90 Max 的高强度钢和铝合金占比 90.4%，16 处关键位置用了 2200MPa 超强钢增强。超大一体式热成型门环，3.3 米长、1.5 米高，贯穿一二三排、覆盖 ABCD 柱，并在 4 处关键部位用 2200MPa 超强钢增强，相比传统焊接，侧柱碰车身承载能力提升 19%。据悉，为了保障安全，小米做了大量的全向碰撞测试，测试的严苛程度，远超行业通行的测试标准：正面碰撞，C-NCAP 要求 56km/h，小米的标准是 64km/h；正面 25% 偏置碰撞，中保研要求 64km/h，小米的标准是 72km/h；侧面碰撞，C-NCAP 要求 60km/h，小米的标准是 70km/h；后部碰撞，新国标要求 50km/h，小米的标准是 92km/h。与此同时，小米还正式推出小米龙甲电池体系，安全标准超过国标。这是小米汽车主导的动力电池系统化解决方案，小米负责产品定义，小米主导电池包的设计开发，小米参与电芯的设计开发，小米进行全流程质量管控。小米龙甲电池体系的电池包针对增程车特点，优化了电芯材料、电池结构和生产工艺，同时还模拟了 30 万公里耐久测试、全程快充和高速行驶的场景，电池包还有 18 层硬核结构防护。作为小米汽车的第二个产品系列，Skynomad 小米澎程在 2023 年初正式立项。而小米昆仑技术架构则是历时 3 年从头打造的一个全新的平台架构，以作为“智能可变大空间 SUV”的技术基座。雷军特别强调，小米昆仑技术架构，核心零部件全部来自国内、国际优秀供应商。二、小米澎程 N90 Max在重点介绍完小米昆仑技术架构后，小米澎程 N90 Max 正式亮相，定位“智能可变大空间 SUV”。雷军表示，澎程 N90 Max 为空间而生，该车车长 5285mm，车宽 1998mm，车高 1825mm，轴距 3080mm。外观方面，主打“型方面润”，蜻蜓大灯、光环尾灯延续家族化设计语言，可选四款个性化饰板，全系标配 21 寸轮毂、普利司通静音轮胎。配色方面，发布了远山青、蝴蝶谷蓝和火山灰三款全新的车身颜色。空间方面，车内采用 2+2+3 大七座布局，拥有 2760mm 舱内乘坐空间，二排舱内高度 1233mm、乘坐空间 950mm、中间过道 180mm。三排乘坐空间 890mm，头部空间 962mm。至于此前预热时曾引发关注的“智能可变大空间”，雷军予以详解，可实现对坐模式、办公模式、小憩模式、大床模式。一排座椅支持电动旋转、中岛内置两个手机位、四个杯托，可滑动到第二排座位作为“多功能茶几”使用。后备厢容积为 577L，标准状态七人乘坐，可收纳 7 个 20 英寸旅行箱；若二三排极致前移，最大容积可达 1831L。尾门开口为 690mm，后车门能实现接近 90° 开合。内饰方面，全车 6.8㎡超大面积玻璃，搭配夹层防晒玻璃与遮阳帘，高频接触内饰面 95% 软包覆，贯穿仪表台 + 立柜式中控台长度达 1530mm。15 处漫反射氛围灯，支持 256 色调光，可选摩卡棕、砂陶米两款配色。在“冰箱、彩电、大沙发”方面，配备 21.4 英寸后排娱乐屏，9L 独立压缩机冰箱。全车舒适软包座椅，一二排标配 16 点式座椅按摩、通风加热，最多可配 4 个零重力座椅。全车具备 12 个生态接口 +14 个电源接口，搭载 25 扬声器小米星弦音响系统。在动力方面，搭载大电池增程系统，CLTC 纯电续航 464km，CLTC 综合续航 1705km，WLTC 亏电油耗 6.26L/100km。15 分钟最长补能 285km，从 20% 充电至 80% 最快只需 18 分钟。在驾控方面，底盘为前双叉臂 + 后多连杆独立悬架，可模拟大排量发动机的线性输出，支持 R-EPS 齿条式电动助力转向，转向手力三挡可调，连续 10 次全力制动性能保持稳定。驾驶视野无遮挡，主驾 A 柱盲区小，配备低速慢行灯。在智能方面，域控制模块四合一，采用第三代骁龙 8 移动平台和英伟达 Thor 车载计算平台。搭载小米澎湃智能座舱，超级小爱语音交互，全系标配小米 HAD 辅助驾驶，新增后向固态激光雷达，搭载小米 XLA 认知大模型。在安全方面，除了搭载铠甲笼式车身，还配备 12 个安全气囊、9 个碰撞传感器，门把手采用三重冗余设计，尾门有双应急拉手。具备最高 750mm 的涉水能力，搭载 2 颗涉水雷达，全车 24 处关键零部件密封及防水提升，动力电池采用 IPX8 / IPX9K 防水标准，同时优化进气口、泄压阀布局，大幅提升涉水安全性。遇到紧急情况，还能应急浮水脱困。值得一提的是，雷军在发布会中放话称“N90 Max 是 50 万元以内最好的增程 SUV 之一”，还直道“only Skynomad can do”。该车的预售价格为 29.99 万元。三、小米澎程 N70 Max在详细介绍完澎程 N90 Max 后，雷军又快速讲解了 N70 Max 的核心规格。该车为“大五座四驱增程 SUV”，尺寸为 4960×1998×1765mm、轴距 2950mm，二排支持极致后移，最大乘坐空间 1410mm、最大拓展空间 2425L。采用双电机四驱，峰值功率 310kW，最高时速 190km/h，CLTC 纯电续航 505km，CLTC 综合续航 1461km， 数据更大的控制权、隐私...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/481061", "publishedAt": "2026-07-28T02:03:15+00:00"}]}, {"label": "产品发布/更新", "items": [{"title": "DataBuddy：数据语义驱动的企业 Agent Runtime 设计与落地｜AICon深圳", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/M9l2eJdhQkbruQlETEbt?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-31T10:00:00+00:00"}, {"title": "微信公众号推出 AI 智能“一键排版”功能", "summary": "IT之家 7 月 31 日消息，微信官方今日宣布，为了更好地服务公众号创作者用心创作，提升排版效率，微信公众平台推出 AI 智能排版能力「一键排版」。公众号创作者手机登录“公众号助手 App”或是进入网页版公众号后台，创作一篇文章或选择草稿箱里要发布的文章，系统会自动识别内容结构，并出现「一键排版」图标选项，点击即可开始排版。IT之家附「一键排版」主要功能如下：自动优化段落结构它会根据创作者的文章内容，自动分段、调整段落间距，让文章看起来疏密有致，不会挤成一团。▲ 一键排版前▲ 一键排版后自动生成小标题样式创作者写的小标题，它会智能识别，自动加粗、加大字号、统一颜色，让文章结构一目了然。▲ 一键排版前▲ 一键排版后自动匹配配图位置，多图自动轮播如果创作者文章里插入了图片，它会智能调整图片大小、对齐方式，让图文搭配更舒服。当创作者插入图片是连续的，它还支持把图片调整为图片轮播的样式。▲ 一键排版前▲ 一键排版后目前，公众号「一键排版」提供两种排版样式：标准和细体，每种排版样式都可以调整主题色并调整文字样式，创作者可以根据自己的需求使用。大家在IT之家微信号回复“微信”两字，即可获取当前最新官方内部版微信下载。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/971.htm", "publishedAt": "2026-07-31T02:38:34+00:00"}, {"title": "库克：苹果已获准在中国推出首批“Apple 智能”功能，未来的 Siri AI 还处于起步阶段", "summary": "IT之家 7 月 31 日消息，苹果现任 CEO 蒂姆 · 库克（Tim Cook）今天在 2026 财年第三季度电话会议中确认，苹果公司已在中国获准推出首批“Apple 智能”（Apple Intelligence）功能。问答环节中，摩根大通分析师萨米克 · 查特吉（Samik Chatterjee）问库克：我的第一个问题想回到 WWDC。当时你们宣传 Siri AI 时提到，你们可能不会在中国大陆和欧洲率先推出 Siri AI。我现在想问问这方面的最新进展，以及如果要在这些地区推出 Siri AI，还需要跨越何种障碍？库克对此回答道：感谢你的提问，我将分别回答两个地区的问题。如果先看欧盟，我们正在和欧盟委员会密切合作。显然我们希望的情况是能够在全球所有地区同步推出所有功能，这一直是我们的理念。但目前我们还无法在欧盟推出 Siri AI。但我们正在与他们紧密合作，努力寻求解决方案，以便在欧盟提供 Siri AI。Siri AI 目前已在 Mac 上测试并即将推出，因为 Mac 不像 iPhone 和 iPad 那样受到法规约束。总体来说，我们正在和欧盟方面合作，希望能够达成某种解决方案。如果再看中国市场，上周我们已经获得批准，可以推出首批“Apple 智能”功能，比如相册的“消除”等。我们目前正在推进这些功能的发布工作。至于未来要推出的 Siri AI，我们目前还处于起步阶段，还有更多工作要努力完成。据IT之家此前报道，网信部门本月会同有关部门按照《生成式人工智能服务管理暂行办法》要求，新增“Apple 智能”等 7 款提供手机端侧生成式人工智能服务备案信息。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/944.htm", "publishedAt": "2026-07-31T01:17:45+00:00"}, {"title": "谷歌 Pixel Watch 5 智能手表渲染图曝光：升级 3GB 内存", "summary": "IT之家 7 月 31 日消息，消息源 @evleaks 今天（7 月 31 日）在 X 平台发布推文，分享了一组渲染图，展示了谷歌 Pixel Watch 5，该智能手表预估将于 8 月 12 日发布。颜色方面，此前消息称 Pixel Watch 5 会有深炭黑（Dark Anthracite）、自然银（Natural Silver）、黄铁矿（Pyrite）和暖金（Warm Gold）四种配色可选，本次渲染图展示的应该是自然银颜色。这款手表相比前代 Pixel Watch 4 没有明显变化，将提供 41mm 和 45mm 两种尺寸，支持选择 Wi-Fi / 蓝牙版和 LTE 版两种型号，并加入卫星连接功能。基于 Google Play Console 平台列表显示，此设备代号“godric”，核心处理器沿用与前代相同的高通 SW5100 平台，CPU 与 GPU 配置不变。手表将升级 3GB，有望更好支持 Gemini Intelligence 等 AI 功能。此外，这款手表的起售价预计将达到 399 美元（IT之家注：现汇率约合 2709 元人民币），相比上代型号涨 50 美元（现汇率约合 339.4 元人民币）。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/938.htm", "publishedAt": "2026-07-31T01:01:06+00:00"}, {"title": "消息称 DeepSeek 计划在内蒙古建设大型 AI 数据中心，增加 1GW 算力", "summary": "IT之家 7 月 31 日消息，据彭博社今日援引知情人士消息，DeepSeek 正计划在内蒙古建设一座大型 AI 数据中心。这一雄心勃勃的基础设施项目显示，这家中国人工智能初创公司正在扩大 AI 算力布局。据不愿透露姓名的知情人士透露，DeepSeek 计划在内蒙古乌兰察布增加 1GW（吉瓦）规模算力。该公司除了自建数据中心计划外，也有意从其他公司租赁额外算力。其中两位知情人士表示，DeepSeek 数据中心的部分算力将在明年年底或 2028 年初投入运行，目前尚不清楚该项目使用何种芯片。作为参考，英伟达目前是 AI 数据中心的行业标准，而华为则是中国数据中心领域的代表企业。据IT之家此前报道，DeepSeek 已于 4 月放出新一批招聘信息，除了杭州和北京外，首次出现了工作地为内蒙古乌兰察布的岗位。两个相关岗位分别为数据中心高级交付经理、数据中心高级运维工程师，薪资为 15-30K · 14 薪。乌兰察布年平均气温约为 4°C，天然的低温环境能够降低高功耗 AI 服务器的散热需求，因此成为各大企业建设数据中心的理想地点。英伟达 CEO 黄仁勋曾预计，一座配备最先进 AI 加速器的 1GW 级数据中心，投资成本可能达到 500 亿美元（IT之家注：现汇率约合 3386.82 亿元人民币）。不过这种成本会因为建设地点、AI 芯片类别产生巨大差异。众所周知，中国 AI 数据中心的建设成本通常低于美国。由于工作时间缘故，DeepSeek 并未立即回应彭博社的置评请求。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/925.htm", "publishedAt": "2026-07-31T00:08:56+00:00"}, {"title": "打击低质量 AI 内容，领英现允许用户举报 AI 垃圾帖文", "summary": "IT之家 7 月 31 日消息，AI 大行其道后，人类已经厌倦每天看到大量千篇一律、AI 生成的帖子。领英（LinkedIn）平台最近宣布采取新一轮措施，打击 AI 生成的低质量帖文。当用户看到一篇充斥着毫无来由的无序列表、过度使用表情符号或明显没有内容的 AI 生成帖文时，可以点击右上角的三点菜单，然后选择“看起来像是 AI 垃圾”选项。点击后举报帖文会从用户视野中隐藏，同时反馈信息将发送给运营方。据官方介绍，用户反馈将帮助系统学习低质量帖子并自动隐藏。目前，领英正面临大量低质量 AI 文章涌入平台的问题，Pangram 分析显示，目前社交媒体上超过 250 个单词的长篇内容中，每四篇就有一篇是由 AI 生成，领英更是重灾区。IT之家注意到，领英也不再鼓励用户使用内置 AI 工具生成完整帖文，而是将相关功能调整为基础的校对工具。这一变化反映出，人们越来越意识到 AI 无法取代真正的人际交流。如果一个社交媒体最终成为机器和机器互相交流的平台，那么它将失去存在的核心价值。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/918.htm", "publishedAt": "2026-07-30T23:27:26+00:00"}, {"title": "Kubernetes 统治了容器时代，谷歌 Agent Substrate 意在拿下下一个十年", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/h0WG6p7z3tyTk3hxQIhT?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-30T19:50:44+00:00"}, {"title": "从个人记忆到团队资产：TencentDB Agent Memory 团队记忆版本解析 | 腾讯云数据库 DBTalk", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/video/1s7xwm0Y6GaN8ff5rVyO?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-30T17:53:56+00:00"}, {"title": "深度访谈｜第二次权力转移：当Agent拿走数据库的行动权", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/B2GjIEBr0c1L0amoKmNf?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-30T15:41:10+00:00"}, {"title": "AI Agent 不是唯一答案，Expedia 用确定性工作流打造 AI 运维平台", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/msL3K1DAsj3XIwLmd4tN?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-30T14:00:00+00:00"}, {"title": "用于生产安全运维的多智能体 AI ：5G 核心网中的 A2A 和 MCP 架构", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/v9Vmgcy4RZvUIcxPEP77?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-30T10:51:26+00:00"}, {"title": "微软确认开发 Copilot AI 超级应用，整合聊天、编程与智能代理能力", "summary": "微软正在开发一款整合Copilot聊天、编码助手和智能代理能力的AI“超级应用”，微软首席执行官萨蒂亚·纳德拉在最新财报电话会议中确认，该应用计划于今年推出，并覆盖消费者与商业两类使用场景。 纳德拉表示，Copilot正在从单纯的聊天助手快速演进，扩展至协同办公和自动化执行领域。微软将在本季度推动不同Copilot体验的...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/483111", "publishedAt": "2026-07-30T08:33:05+00:00"}, {"title": "高通和 IDC 说，智能眼镜会是手机之外，最重要的 AI 设备", "summary": "AI 将会成功智能设备的基础能力。#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1673429?utm_source=rss&amp;utm_medium=rss&amp;utm_campaig const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
