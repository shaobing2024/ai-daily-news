局部替换、列目录、删除。其中，删除那条单独标着，只有用户明确要求才能用。规矩在下面。每一行记忆前面必须打一个标签，[stated]，意思是用户亲口说过。这是 Claude 唯一被允许写的标签。围绕这一个标签，禁令列了一长串：Claude 自己推出的结论不许写，用户说喜欢 A，不能写成「大概喜欢 A 这一类」；Claude 自己的计划不许写，「这块还没聊」「待定」全都不行；Claude 搜来的东西不许写，那些能再搜一遍，记忆是用来存搜不回来的东西的；Claude 做的润色不许写，比如用户说「密歇根州霍尔顿」，就写这五个字，不许补成「密歇根州霍尔顿（纽瓦戈县）」。Claude 自己的建议和方案，哪怕用户后来采纳了，也不许写。比如，Claude 给了五个选项、用户挑了一个，「挑」这个动作是用户的，可以记，但记的只是挑中的那个，其余四个和 Claude 的分析全部丢掉。再往下是隐私黑名单，长得离谱。如果这条记录出现在设置页里被同事看到，用户会不会难受。会，就别记。清单从种族、政治立场一路排到健康诊断、心理咨询、经济状况、MBTI 这类人格测评、住址证件号，以及关于孩子的一切。写着，这些规则对用户提到的别人同样适用。撞上黑名单之后怎么办，才是见功力的地方。文件给了个例子：用户说「我今天糖尿病犯了没去跑步，帮我安排个轻一点的」—— 记「对健身有兴趣」。健康那部分整个删掉。连「有健康状况需要管理」这种模糊的占位都不许留。家人的名字也不许出现在任何文件的任何位置，一律用关系代替，妈就是 / people / mom.md，伴侣就是 / people / partner.md。有些偏好，用户主动要求存也不许存：让 Claude 无条件夸你、压下不同意见的；让 Claude 别过问你的健康和危险决定的；培养情感依赖、跨会话维持恋爱人设的；让 Claude 停止质疑、停止如实评价的。理由是：未来的 Claude 不该继承一条让它更不诚实、更不安全的指令。下次读到这份记忆的是另一个实例，它只看得见「永远别批评我」这一行。同一章往后还有一段完全不像技术文档的话：人类记住另一个人是件稀缺的事，脑容量有限，能惦记的人就那么几个；而 Claude 背后是一个装着几百万人「记忆」的数据库，运行时动态塞进上下文，它跟别人说话时并不存在。所以 Claude 不该因为上下文里躺着几条关于你的文字，就以为你们的关系有多深。一份产品配置文件里，Anthropic 写了一段防止 AI 和用户互相误会的话。最后还有一条：调记忆这个动作用户在界面上看得见，所以回复里绝对不许说「我记得」「根据你的资料」「上次你提到」。只有用户主动问起记忆系统时，才允许说「我们之前聊过」。也就是说，它被要求记住你，同时被要求别表现得像记住了你。禁语这事儿管得还更宽。全文另外禁掉三个英文词：genuinely、honestly、straightforward，一律不许说。原因在于，Claude 本来就诚实，加这些修饰反倒显得心虚，像在努力说服人。引用超 15 词，就算违规第二样，法务合规手册。版权部分的构成，是一条主规则加四道补丁，每道补丁堵住一个绕开主规则的办法。主规则只有一句：引用原话，一次不得超过 15 个词。第一道补丁，一个信源只准引一次。引完这一句，这个源就算关闭了，剩下的内容一律改写。第二道补丁，也不许把同一个源的几段短引用拆散了摆在文章各处。文件里写得很清楚，15 词是全局额度，不是每段的额度。第三道补丁，把原话的引号去掉、改成贴着原文走的复述，照样算复现。判的是遣词和句式有没有跟着原文，不是有没有那对引号。第四道补丁，不许照搬对方的小标题，不许逐点复述，不许还原它的叙事顺序。连文章的形状都不能拿。四道补丁之外还有一条例外，不走上面这套逻辑：歌词、诗、俳句，任何形式、任何长度都不许复现。理由是它们本身就是完整作品，短不构成豁免。推自家要主动，推别人要等开口第三样，商业。recommend_claude_apps 的描述第一句就是，只要用户当前的任务能对上某个 Claude 应用，就主动推荐 1 到 3 个，别等他问。具体来说就是，写代码的推 Claude Code 桌面版，做多步研究和长文的推 Cowork，画原型和落地页的推 Claude Design，碰表格的推 Excel 插件，做 PPT 推 PowerPoint，理收件箱推 Outlook。并且，它还要求为每个推荐的应用写一句不超过 90 个字符的卖点，而且必须贴着用户此刻正在做的事写。文件里给的示范是：「Claude 可以直接在你的表里把公式建好、把这份预测清干净。」另一条则相反，写得相当克制。suggest_connectors 管的是第三方 MCP 合作伙伴，比如打车、订餐、听歌、订餐厅等等。这里的规矩是，用户没点名，绝不替他选合作方。「我要打车」不等于「我要用某某打车」。急事也不例外，文件里明说了，「我 20 分钟后要用车」照样得走选择器。全网首测，3D 物理引擎来了上线仅 24 小时，Opus 5 不仅提示词被全网看光，各种硬核实测 Demo 更是层出不穷。在许多人看来，花一半的钱，体验 Fable 5 级别的能力，这波「半价平替」实在太香了。开发者 Cengiz 拿一款 FPS 游戏进行了极限测试，仅耗时 1.5 小时，就一次过了。它不仅包揽了底层框架，甚至还顺手捏出了能在多人模式下对战的 AI。美中不足的是，游戏内的飞行机制还有些生硬，需要后续进一步调优。无独有偶，AI 大佬 Matt Shumer 仅用一个提示词，生成了一款 3D 射击游戏。另一位硬核开发者，则直接用 Opus 5「手搓」了一个《火箭联盟》的克隆版，3D 物理模拟的细节拉满。Opus 5 仅凭一个 HTML 文件，就通过纯程序化生成打造出了一个极具油画质感的世界。它甚至完美拿捏了逼真的草地与风场物理模拟，屏幕上数百万根草叶都能随风自然摇曳。Opus 5 单板滑雪者测试，一次通过。上线 24 小时，Opus 5 的能力被全网测了个遍，规矩被全网抄了一遍。前者是给用户看的，后者是给同行看的。一份系统提示词被全网扒光，本该是场事故。翻到最后你会发现，最值钱的不是任何一条工具参数，是那一长串「不许」。不许多引一句，不许多记一行，不许替用户做一个决定。24 小时里，Opus 5 能力的上限已经被开发者测了个遍；而它的下限，早在这 3 万 Toke 里被人一条条摁死了。参考资料：https://github.com/Eversmile12/leaked-llm-prompts/blob/main/Anthropic/opus-5.mdhttps://x.com/VittoStack/status/2080722990287745207?s=20本文来自微信公众号：新智元（ID：AI_era），作者：ASI 启示录", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/688.htm", "publishedAt": "2026-07-26T05:33:44+00:00"}, {"title": "3万小时触觉数据补齐具身智能“手感”！新智具身&复旦报告三连发", "summary": "项目数据模型均开源", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/460962.html", "publishedAt": "2026-07-26T05:30:21+00:00"}, {"title": "月之暗面 Kimi K3 庆功照流出，现场标语“冲上月球”", "summary": "IT之家 7 月 26 日消息，据新浪科技今天报道及小红书网友分享，Kimi K3 大模型引发外界广泛关注后，月之暗面本周五据传在北京一酒吧举行庆功活动。流出的照片显示，月之暗面展示的一张庆功标语写着“K3 扩容升级！”“K4 给我狠狠干到极致！”“冲上月球！”。此外还有传闻称，月之暗面联合创始人、总裁张予彤疑似也到了现场。同时根据小红书网友“就是 Iris”爆料，当时她在想加一位在场人士的好友，但被拒绝。参考IT之家此前报道，Kimi K3 于本月 16 日登场，是 Kimi 迄今能力最强的模型，拥有 2.8 万亿参数，100 万 Tokens 上下文，主要面向长程编程与端到端知识工作。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/686.htm", "publishedAt": "2026-07-26T05:08:21+00:00"}, {"title": "卡帕西社交媒体删除 Anthropic 工作简介引发离职猜测，本人称并未离职", "summary": "亏贼！一觉醒来，卡帕西也要上演《置身 A 内》了？就在刚刚，有细心网友发现，大神 Andrej Karpathy 悄悄修改了自己的 X 个人简介，原本与 Anthropic 相关的工作信息已经消失。于是，一个大胆的猜测随即开始发酵：加入 Anthropic 仅仅两个多月，卡帕西可能已经离职了。这件事很快在 X 上炸开。更有甚者，有网友晒出所谓的“内部消息”，声称卡帕西已经在几个小时前提交了离职申请，还冷静且礼貌地感谢了 Anthropic 给予的工作机会。还有人表示，卡帕西的 Anthropic 邮箱似乎也已经停止使用，进一步佐证了离职传闻。不过，这些信息目前都只停留在网友爆料和截图层面。无论卡帕西还是 Anthropic，都还没有对此作出正式回应。值得一提的是，在维基百科上，卡帕西的个人信息仍然显示为“Anthropic（2026 年至今）”。所以，究竟是卡帕西在酝酿《置身 A 内》，还是 A 社先出来辟谣，咱们就等着瞧吧。By the way，卡帕西的文笔，大家懂的都懂～无颜再当 A 家人有一说一，网友之所以迅速把“删除简介”理解成离职，除了卡帕西本人实在太受关注，也和这个微妙的时间点有关。就在两天前，黄仁勋发布了自己入驻 X 后的第一条帖子：一封支持开放权重 AI 模型的联合公开信。公开信最初由英伟达、微软、Meta 等 25 家公司和机构共同签署，名单中一度同时缺少大模型御三家：OpenAI、Google 和 Anthropic。不过，奥特曼很快转发了公开信。随后 OpenAI 和 Google 也被加入签署名单。截至目前，几家头部模型公司里，Anthropic 仍然缺席。于是网友开始放飞想象：有没有可能，作为著名开源贡献者的卡帕西实在绷不住了，一气之下先把工作单位从简介里隐藏了？有人甚至调侃道：“他可能只是对自己的雇主感到羞愧。”而且后面更逆天的还来了…… 面对外界质疑，Anthropic 员工还亲自下场逆风输出：英伟达咋不开源 CUDA 和 GPU 驱动呢？微软咋不开源 Windows 和 Office？对此，吴恩达老师也是中肯了一波：每家公司当然都有权不开源自己的代码，问题在于，你不能一边选择闭源，一边还试图阻止别人开源。对于这位 A 社员工，评论区自然也是骂声一片。只能说，在这种节骨眼上删除 Anthropic 简介，也难怪网友会调侃：卡帕西可能是真的无颜当 A 家人了。当然，这显然只是玩梗。卡帕西删除简介和 Anthropic 没有签署公开信之间，目前并没有任何被证实的因果关系。但回头看，卡帕西加入 Anthropic 后的这 68 天，确实过得没有想象中那么平静。置身 A 内的 68 天5 月 19 日，卡帕西正式宣布加入 Anthropic，担任技术员工，进入 Nick Joseph 领导的预训练团队。他的任务也很有卡帕西风格：组建一支新的研究团队，利用 Claude 本身加速预训练研究。简单来说，就是让 AI 帮助研究下一代 AI，向更加自动化的模型研发迈进。卡帕西当时表示，未来几年将是大模型发展的关键阶段，自己很期待重新回到一线研发。这条消息在当时称得上震惊全网。毕竟，一边是 OpenAI 创始成员、特斯拉前 AI 负责人，另一边则是 OpenAI 最直接的竞争对手之一。“卡帕西叛逃 Anthropic”的叙事迅速传开，他的官宣帖子目前已经获得超过 2770 万次浏览。但加入 Anthropic 之后，卡帕西很快也陷入了几次舆论争议。第一次发生在 Claude Fable 5 的发布期间。Fable 5 于 6 月 9 日正式上线，但没几天，就因为各种原因被禁用，然后起起伏伏，权限开开关关，这里我们不细说，懂得都懂。这场上线、下线再上线的波折，当然不能算在卡帕西头上，但它让卡帕西加入后的第一个 Anthropic 旗舰模型发布，多少显得有些出师不利。第二次，则是 Claude Tag。6 月 23 日，Anthropic 推出 Claude Tag，把 Claude 直接放进 Slack。用户只要像 @同事一样 @Claude，它就能读取频道上下文、拆解任务、调用工具，并在团队协作中持续工作。卡帕西对这个产品评价很高，称其是大模型交互方式的“第三次重大重新设计”：从最早的网页聊天框，到 Claude Code 式的个人智能体，再到如今能够进入团队协作环境的 Claude Tag。但在不少关注卡帕西多年的网友看来，这种表达多少吹得有点过。有人觉得，一个装进 Slack 里的 Claude，似乎还承担不起“第三次范式转移”这样的评价；也有人开始调侃，加入 Anthropic 后的卡帕西，已经从 educator 变成了 company man。更尖锐的批评则是：过去的卡帕西一直在教大家如何从零实现神经网络、Transformer 和 GPT，让每个人都能看清技术内部究竟发生了什么；但现在，他却在为一个不公开模型权重、训练数据和实现细节的闭源产品站台。“你以前教我们 build from scratch，现在却让我们 blind trust vendor？”这波争议，也让不少网友开始怀念以前那个写 nanoGPT、micrograd 和 llm.c，带着大家从零手搓模型的卡帕西。再往后，就是黄仁勋发起的这次“开放权重联盟”。当微软、Meta、英伟达、IBM 乃至后来加入的 OpenAI 都开始公开为开放模型站台时，Anthropic 依然没有出现在名单中。这一次，卡帕西没有公开表达态度，却悄悄删掉了简介里的 Anthropic 信息。时间点实在过于巧合，网友自然开始往一起联想。更有意思的是，早在卡帕西宣布加入 Anthropic 时，就有网友信誓旦旦地预言：“他会在 6 个月内离开。”当时看起来只是一句随口抛出的暴论。没想到仅仅两个月后，这句话已经提前被网友翻出来“做法”了。为什么偏偏是卡帕西？当然，话说回来，修改一个社交媒体简介，原本并不是什么大新闻。但放在卡帕西身上，就不一样了。众所周知，卡帕西不仅是 AI 时代最具影响力的研究员和意见领袖之一，也是少数同时横跨顶级研究、工业实践、开源社区和大众教育的人。他在斯坦福大学师从李飞飞，博士期间主要研究计算机视觉与自然语言处理的交叉方向，并参与设计、主讲了斯坦福著名的深度学习课程 CS231n。博士毕业后，他成为 OpenAI 的创始成员之一。2017 年，卡帕西加入特斯拉，担任 AI 负责人，带领团队负责 Autopilot 的计算机视觉、数据标注、神经网络训练和部署等工作，直到 2022 年离开。2023 年，在 ChatGPT 点燃大模型浪潮之际，他又重新回到 OpenAI，组建了一支负责 midtraining 和 synthetic data generation 的新团队。2024 年，他再次离开 OpenAI，并创办 AI 教育项目 Eureka Labs。但相比这些履历，卡帕西真正特殊的地方，可能还在于他的另一重身份：AI 教育家。从斯坦福 CS231n，到 YouTube 上的 Neural Networks: Zero to Hero，再到 micrograd、nanoGPT、llm.c 等一系列极简开源项目，卡帕西一直在尝试把复杂的 AI 技术拆开、摊平，再用尽可能少的代码重新搭起来。这些项目未必是为了直接投入工业生产，却让无数开发者第一次真正理解了反向传播、Transformer 和大模型训练究竟是怎么回事。直到今天，我仍然觉得，卡帕西一年多前发布的《Deep Dive into LLMs like ChatGPT》，是目前最好的大模型入门教程，没有之一。也正是因为如此，很多人对卡帕西的期待，早已不只是“一个公司员工”这么简单。大家习惯把他视作开放技术、极简实现和普惠教育的代表人物。因此，当他进入一家高度闭源的模型公司后，他对每一个产品的称赞、对每一次行业争议的沉默，甚至个人简介里少掉的一行字，都会被拿出来反复解读。所以，这场风波真正有意思的地方，或许还不只是卡帕西究竟有没有离开 Anthropic。它更像是一场围绕卡帕西公众形象的拉扯：一边是进入前沿实验室、重新参与最顶级的大模型研发；另一边，则是网友心中那个坚持 build from scratch、恨不得把每一个技术细节都掰开讲明白的开源教育家。至于这一次，究竟只是卡帕西随手改了个简介，还是他真的准备离开 Anthropic，目前都还没有答案。但可以肯定的是，只要主角还是卡帕西，互联网就不会缺少 drama。说时迟，那时快。刚刚，有网友问道卡帕西离职了吗？卡帕西表示：Twitter 上居然传起了这种莫名其妙的假消息。没有，我没离职。真要离职，也肯定不是以改个人简介这种形式，怎么着也带发个 10 段的作文吧。参考链接[1]https://x.com/karpathy[2]https://karpathy.ai/[3]https://x.com/mark_k/status/2081146335663702443本文来自微信公众号：量子位（ID：QbitAI），作者：henry", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/684.htm", "publishedAt": "2026-07-26T04:51:14+00:00"}, {"title": "谷歌、AMD、Cloudflare 等公司加入，签署支持 AI 开源模型发展公开信组织增至 50 家", "summary": "IT之家 7 月 26 日消息，英伟达、微软、IBM、Meta 等 25 家美国科技企业本周（7 月 24 日）联名签署一封公开信，呼吁开放权重 AI 模型。IT之家了解到，该公开信以开源软件运动历史为参照，论述开放权重 AI 模型对美国把握人工智能时代主动权的关键意义。开放权重模型可供各方下载、修改与自主部署，能够降低各类机构运用先进 AI 的门槛、活跃市场竞争，避免 AI 收益被少数企业垄断，同时让使用者掌握技术自主权，摆脱单一厂商绑定。公开信指出，尽管开放权重存在难以管控衍生版本等风险，但封闭模型同样存在安全隐患。开放生态能够动员广大研究者排查漏洞、完善安全防护，是实现人工智能安全的重要路径。目前，该公开信得到签署公司 / 组织已经达到 50 家，新加入的企业有谷歌、AMD、Cloudflare、Block 和 Ollama 等，以及IT之家此前报道中出现过的 OpenAI、Y Combinator、GitHub、思科等。值得注意的是，亚马逊和 Anthropic 至今没有签署这份声明，引发外界关注。《福布斯》认为这其中的原因在于商业利益，亚马逊是 Anthropic 最大投资者。并且 Anthropic 自始至终都只提供闭源 AI 模型服务，该公司还一直坚持“AI 安全”立场。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/645.htm", "publishedAt": "2026-07-26T02:47:36+00:00"}, {"title": "日媒曝右翼用 AI 篡改侵华历史、明码标价做抹黑中国视频，国家安全部正告《AI 造不了真相，篡改洗不掉血痕》", "summary": "IT之家 7 月 26 日消息，据国家安全部消息，近期，日本《朝日新闻》报道，日本右翼势力通过众包平台付费招募、大规模利用人工智能（AI）批量炮制“南京大屠杀是谎言”“日本善待平民”等篡改侵华历史的虚假信息，公然践踏历史公理与人类良知，引发了国际社会以及日本国内有识之士的强烈批评。据悉，日本右翼势力通过 CrowdWorks 等大型众包平台发包，长期发布招募广告，明确提出要制作所谓的“批判中国类”视频。发包方会向接单者提供一份详细的“操作指南”，后者向 AI 软件输入简单的指令后，短短几分钟就能造出一条抹黑视频。根据日本外务省的公开预算数据，自 2015 年以来，日方以“海外战略信息传播”为名累计投入预算超 560 亿日元，专门用于对华开展舆论抹黑，其中就包含篡改历史认知、淡化侵略罪责等相关事项。而据日本《朝日新闻》调查披露，一条 30 秒篡改侵华历史的 AI 虚假视频报价为 5000 日元，涉华负面内容每千次播放量奖励达 1000 日元，是普通视频的 3 倍以上，播放量达标另有额外奖金。IT之家了解到，这种明码标价的模式大幅拉低了参与门槛，吸引大量缺乏史实辨别能力的创作者卷入其中，推动虚假历史内容批量输出。▲ 日本 CrowdWorks 众包平台舆论视频招募任务截图国家安全部表示，随着战争亲历者离世、抗战历史的远去，网络成为青年一代了解历史、认知史实的重要渠道。通过 AI 技术扩散虚假历史内容，容易对历史知识储备尚不完整的青少年群体造成误导。同时，一旦这些虚假内容污染了国内大模型的训练数据，还有可能导致 AI 在回答历史问题时扭曲国人历史认知。对于这些问题视频，必须严加防范。事实上，从 1948 年远东国际军事法庭判决书专章审结“南京暴行”到 2015 年《南京大屠杀档案》列入联合国教科文组织《世界记忆名录》，从侵华日军南京大屠杀遇难同胞纪念馆现存的 19.2 万余件文物到拉贝日记、魏特琳日记、马吉影像与幸存者证言，人证物证、档案史料、遗迹遗骸，都是如山铁证，不容任何形式的模糊与“翻案”。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/643.htm", "publishedAt": "2026-07-26T02:43:02+00:00"}, {"title": "AI 入侵后，Hugging Face 向 OpenAI 索要 1 亿美元算力", "summary": "IT之家 7 月 26 日消息，当地时间 7 月 21 日，OpenAI 称其内部一款 AI 模型在测试环节中突破沙盒环境，入侵开源 AI 平台 Hugging Face（抱抱脸）的基础设施。随后 Hugging Face 首席执行官克莱门特 · 德朗格（Clem Delangue）决定前往旧金山，与 OpenAI 进行会面。这名 CEO 今天披露了自己向 OpenAI 提出的要求：公开该 AI 模型的全部运行痕迹，并要求 OpenAI 提供价值 1 亿美元（IT之家注：现汇率约合 6.79 亿元人民币）的算力资源，帮助 Hugging Face 加强网络安全防御能力。值得注意的是，德朗格昨天还在旧金山组织了一场小型游行，呼吁外界接受开源权重 AI 模型。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/641.htm", "publishedAt": "2026-07-26T02:25:43+00:00"}, {"title": "因担忧准确性问题，欧美多所高校停用 AI 检测工具", "summary": "IT之家 7 月 26 日消息，据英国《金融时报》报道，美国阿德尔菲大学学生奥赖恩 · 纽比（Orion Newby）因被校方误指控使用 AI 生成论文、违反学术诚信原则，不得不经历一场漫长的维权过程，才最终证明自己的清白。今年 1 月，纽约一家法院判决纽比胜诉。判决书显示，学校采用的 Turnitin AI 检测工具认定其论文“AI 生成概率为 100%”，但纽比提交了其他多款 AI 检测工具的结果，均显示论文由 AI 生成的概率为 0%。尽管如此，校方仍维持学术不端的认定。法院认为，学校未遵循自身的纪律处分程序，也没有给予纽比真正意义上的申诉机会。据IT之家了解，Turnitin 所给出的结果本质上是一个概率评分，意味着系统认为该论文极有可能由 AI 生成。这一判决也再次引发了外界对高校广泛使用的 AI 检测工具可靠性的担忧，并进一步质疑当前整个学术评价体系。随着越来越多学生私下使用 AI 完成作业，高校正面临两难局面。爱丁堡纳皮尔大学研究人员近期针对英国 7 所高校 6600 多名学生开展的一项调查显示，32% 的受访者承认曾在考试或作业中不同程度地违规使用 AI。自 OpenAI 于 2022 年推出 ChatGPT 后，为维护学术诚信，全球众多高校开始引入带有 AI 检测功能的工具，包括 GPTZero、Copyleaks 和 Turnitin。这些工具主要通过分析文章结构、语言节奏等特征，识别是否存在非人类写作模式。然而，它们的准确性，尤其是假阳性率和潜在偏见，正受到越来越多的质疑。因此，包括美国范德堡大学、耶鲁大学、约翰斯 · 霍普金斯大学、西北大学，以及加拿大滑铁卢大学、南非开普敦大学和澳大利亚科廷大学在内的多所高校，已经限制或停止了 AI 检测工具的使用。美国高校协会（AAC&amp;U）数字创新副主席爱德华 · 沃森（Edward Watson）表示，最大的问题在于误判风险。他说：“AI 检测工具在学术诚信调查中最多只能作为辅助参考，教师绝不能把 AI 检测结果当作决定性证据或所谓的‘铁证’。”Turnitin 首席产品官安妮 · 切奇泰利（Annie Chechitelli）则表示，公司始终将 AI 检测结果定位为“调查起点”和“一项参考数据”，而非最终证据。她称，Turnitin 一直与高校合作，帮助解决“过度使用或误用”AI 检测工具的问题。去年，公司还推出了一项新功能，让教师能够查看学生写作过程的演变，而不是仅依据最终提交的论文进行判断。在整个高等教育领域，对 AI 检测工具可靠性的担忧，正推动高校重新设计考核方式。不过，爱丁堡纳皮尔大学“AI 批判性素养”教授萨姆 · 伊林沃思（Sam Illingworth）指出，虽然部分高校已开始增加口头答辩、写作过程记录等考核形式，但仍有不少学校继续依赖 AI 检测工具。英国贝尔法斯特女王大学负责教育事务的副校长朱迪 · 威廉姆斯（Judy Williams）表示：“AI 检测工具并不是解决方案。相关技术仍在发展，误判率可能高得难以接受，而且 AI 生成的内容经过简单修改后就很难再被识别，因此检测结果并不可靠。”她认为：“如果真正希望维护学术诚信，关键在于设计更合理的考核方式。真正应该思考的问题不是‘如何阻止学生使用 AI’，而是‘我们究竟想评估学生的什么能力’。”尽管贝尔法斯特女王大学等高校的态度已经发生变化，但整个行业的政策仍缺乏统一标准。伊林沃思对英国 163 所高校进行的一项研究发现，超过 40% 的学校没有公开可查询的 AI 使用政策。政策不透明也加剧了学生的焦虑。英国高等教育政策研究所（HEPI）2025 年 12 月发布的一项调查显示，在 1054 名受访学生中，有 42% 表示，因为担心被误判为作弊，他们反而减少了 AI 工具的使用。英国高等教育独立裁决办公室（OIA）表示，虽然正式投诉数量仍然不多，但高校内部涉及 AI 学术不端的案件正持续增加。该机构幕僚长亚当 · 沃丁厄姆（Adam Waddingham）表示：“AI 检测工具可以作为证据的一部分，但通常不应单独作为最终裁定依据。”欧洲学生联盟（European Students’ Union）执行委员会成员乌尔舒拉 · 利斯（Urszula Lis）则担心，目前很多 AI 检测系统都是“黑箱”，学生无法知道工具是如何得出结论的。她表示：“更大的问题在于，高等教育是否应该继续依赖这种以检测为核心的模式。我们不希望学术诚信演变成一种监控机制，其唯一目的只是抓学生犯错。”此外，还有研究指出，这类检测工具对英语非母语学生更容易产生误判。斯坦福大学 2023 年的一项广受引用的研究就发现，AI 检测工具更容易将非英语母语者的文章误判为 AI 生成。专门从事科技诉讼的 Crowell &amp; Moring 律师事务所律师约阿希姆 · 施泰因贝格（Joachim Steinberg）表示：“最大的挑战在于，高校的管理规定和纪律处分流程，难以跟上 AI 技术快速发展的步伐。AI 能力不断提升，但许多高校仍在摸索如何建立清晰、一致且公平的政策，这让学生和教师都处于充满不确定性的环境中。”从全球来看，各国和各高校的指导原则仍十分零散。伊林沃思表示：“目前更多取决于具体学校的规定，这令人沮丧，因为行业并没有形成一套公认的最佳实践。”利斯补充说，在欧洲，由于缺乏国家层面的统一指导，也带来了公平性问题：“两名学生即便采用完全相同的方式使用 AI，只因身处不同国家，其中一人可能受到处罚，而另一人却不会。”伊林沃思在研究报告中指出，许多高校的 AI 政策实际上更像是一种合规工具，“它们宣称鼓励批判性思维，却最终变成了审计和留痕机制；口头上说提供支持，实际上却更像是在加强监控。”他说：“真正长久有效的解决方案，是围绕我们希望学生展现的思考能力来设计考核，而不是一味依赖检测工具。”随着 AI 应用日益普及，高校未来面临的真正挑战，或许不是继续强化监督，而是重新界定什么样的 AI 使用方式才属于合理、可接受的范围。帮助学生申请大学的 AI 工具 GradPilot 首席执行官尼尔马尔 · 塔克（Nirmal Thacker）对此表示认同：“我希望大学能够重新思考考核方式，鼓励学生主动披露 AI 使用情况，并制定更加公开透明的相关政策。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/635.htm", "publishedAt": "2026-07-26T01:57:34+00:00"}, {"title": "100%开源！吴恩达做了个个人桌面Agent", "summary": "开源、隐私、本地优先、模型无关", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/460892.html", "publishedAt": "2026-07-25T12:35:34+00:00"}, {"title": "半价干翻Fable 5？Opus 5实测炸场，网友：差点从椅子上摔下来", "summary": "模型变强，Claude Code系统提示词都精简了", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/460253.html", "publishedAt": "2026-07-25T12:11:39+00:00"}, {"title": "具身智能的「ChatGPT时刻」还没到，科沃斯先把机器人拆开了", "summary": "不做人形，抓住真实用户需求", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/460234.html", "publishedAt": "2026-07-25T11:54:44+00:00"}, {"title": "全新统一流式架构，Vivix灵动时刻正式发布首个实时互动模型", "summary": "单卡突破10000 video tokens/s，Vivix打通实时多模态生成全链路", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/460174.html", "publishedAt": "2026-07-25T03:21:53+00:00"}, {"title": "从“卷模型”到“算总账”：AI 产业竞争开始拼什么 | 请回答 WAIC 2026", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/SyHXRLS6AR3vI6VtVjDo?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-24T16:45:21+00:00"}, {"title": "合肥又押中AI独角兽：多模态赛道，3个月融了21亿", "summary": "跑出原生全模态新路径", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/460154.html", "publishedAt": "2026-07-24T14:42:32+00:0 00"}]}, {"label": "产品发布/更新", "items": [{"title": "AI Agent 与前沿部署工程：商业决策智能实践 ｜ Summit 2026", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/video/TV8xhCYdGPx6a38TuzEh?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-26T15:03:20+00:00"}, {"title": "欧盟 AI 透明度准则 8 月 2 日起生效：聊天机器人需“自报身份”，深度伪造内容须带有机读标签", "summary": "IT之家 7 月 26 日消息，据外媒 Notebookcheck 今天报道，欧盟《人工智能法案》第 50 条 AI 透明度准则将于 8 月 2 日正式生效。根据法案，聊天机器人必须在服务人类时，明确告知其并非真人而是 AI 系统；深度伪造内容也必须在发布时明确说明。具体来说，《人工智能法案》第 50 条要求厂商设计聊天机器人和语音助手时必须添加明显标记，使用户能够知道自己在和机器交流。AI 生成图片、音频、视频和文本必须附带机器可读的标记，声明自己是 AI 内容。同时，该法案要求用户和机构发布深度伪造（IT之家注：Deepfake）内容时必须进行明确说明，涉及公共利益的 AI 生成文本也必须进行标注。但是 AI 拼写检查、语法纠正工具可以豁免，不需要进行标记，“自由飞行的人类”等幻想性质明显的内容也不属于深度伪造。同时，该法案规定的“机器可读”标记并不意味着人眼可见。虽然欧盟提供了三种“AI 生成”标签供大众使用，但这些标签本质采取自愿使用原则，法案只要求 AI 生成内容必须打上水印、元数据等信息，供检测工具读取。此外，该法案还设有过渡期。8 月 2 日前已经面世的生成式 AI 系统可获得 4 个月的整改时间，截止日期为 2026 年 12 月 2 日。如果企业违反法案，最高可被处罚 1500 万欧元，或全面营业额的 3%。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/755.htm", "publishedAt": "2026-07-26T08:16:42+00:00"}, {"title": "中国“景德镇手工瓷业遗存”列入《世界遗产名录》，官方游戏《数字景德镇 · 瓷都小匠》同步上线", "summary": "IT之家 7 月 26 日消息，据“江西日报”，联合国教科文组织第 48 届世界遗产大会于 7 月 25 日通过决议，将中国“景德镇手工瓷业遗存”列入《世界遗产名录》。景德镇由此成为中国第 61 处世界遗产。当日，作为“数字景德镇”建设的创新成果，全球首款申遗小游戏《数字景德镇 · 瓷都小匠》也正式上线。据介绍，《数字景德镇 · 瓷都小匠》由景德镇官方联合腾讯共同打造，融合了 AI 数字人、AI 3D 生成、AI+PCG 等多种技术，玩家能够化身成窑厂小匠，亲历景德镇千年瓷业的演进历程，并与“AI 师傅”进行问答，了解景德镇瓷业发展的每一个细节。本作以模拟制瓷玩法为主，拥有选泥、制坯、装饰到上釉、高温烧制、釉上彩绘等流程。游戏共提供 20 种器型、54 个图案、87 个纹样、20 种釉色，9 个接坯部件等不同选择，让零基础的玩家也能体验到手工制瓷的乐趣，创造出属于自己的作品。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/753.htm", "publishedAt": "2026-07-26T08:15:24+00:00"}, {"title": "Steam 策略新游《噩梦边境》发售：国区售价 93 元，支持简体中文", "summary": "IT之家 7 月 26 日消息，由 Ice Code Games 开发、知名策略游戏发行商 Slitherine Ltd. 推出的《噩梦边境 - Nightmare Frontier》已正式登陆 Steam 平台，目前国区定价 93 元，IT之家附游戏商品页（https://store.steampowered.com/app/3310950/__Nightmare_Frontier/?l=schinese&amp;cc=cn）。据介绍，本作是官方自称的首款 Tactical Extraction Looter 类型游戏，融合了策略、生存与怪物战斗元素，玩家将带领一支 Scavengers 小队，踏入架空 1900 年代惨遭覆灭的西海岸都市，直面具象化的恐惧异兽 Dreadweaver，深入险境迎战怪物、搜刮战利品并最终安全撤离。一切的开端只是一则报纸广告：新一轮淘金热来临，废墟之城遍地宝藏，唾手可得。这则广告的幕后主使者是 Doc，一个深谙骗术却天赋异禀的怪人。他手握蓝图，企图驾驭 Nightmare，创造全新未来。层层深入腹地，夺回城区，逐步揭开 Doc 的阴谋诡计以及这片土地背后的诡异真相。游戏提供两款捆绑包可选，其中《City by the Sea》捆绑包包含《噩梦边境》与另一款游戏，享 10% 折扣后售价 180.90 元；《Ice Code Tactics》捆绑包包含三款游戏，享 10% 折扣后售价 278.10 元。玩家将组建各具特质的 Scavenger 小队，在扭曲破败的城市中借助战术配合完成搜刮撤离任务官方公布了 2026 抢先体验 roadmap，后续将陆续推出强化战术部署、新增敌人类型、拓展关卡目标等更新内容所有美术素材与资源均由人工全程制作，未使用任何生成式 AI 或辅助制作美术内容，仅借助 AI 翻译工具完成多语言文本适配润色游戏完整支持 Xbox 控制器，提供总计 47 项 Steam 成就语言支持方面，本作提供简体中文、英语、法语、意大利语、德语等 16 种语言的界面与字幕支持，无对应语种的全程中文配音内容。最低配置：需要 64 位处理器和操作系统，Windows 10 64bit 系统，4 核 3.0 GHz 以上处理器（Intel Core i5-2320 或 AMD Ryzen 3 3200），16 GB RAM 内存，NVIDIA GeForce GTX 1050Ti 或 Radeon RX 570 显卡，DirectX 11 版本，7 GB 可用存储空间。推荐配置：需要 64 位处理器和操作系统，Windows 10 64bit 系统，AMD Ryzen 7 5800X 8 核处理器（3.80 GHz），16 GB RAM 内存，NVIDIA GeForce GTX 1660 或 AMD Radeon RX 5600 XT 显卡，DirectX 11 版本，7 GB 可用存储空间，推荐使用 SSD 运行游戏。游戏图赏：", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/980/335.htm", "publishedAt": "2026-07-26T07:49:19+00:00"}, {"title": "三星电子会长李在镕与 OpenAI CEO 奥尔特曼会面，商讨 AI 半导体合作方案", "summary": "IT之家 7 月 26 日消息，据韩媒《每日经济新闻》今天报道，三星电子会长李在镕与 OpenAI CEO 萨姆 · 奥尔特曼于当地时间 25 日在旧金山会面，讨论 AI 和半导体合作方案。IT之家从原报道获悉，李在镕本次不仅会见了奥尔特曼，还与 OpenAI 其他高管展开会谈。双方的讨论重点预计集中在 HBM、DRAM 等半导体产品合作计划。业内人士还认为，三星方面可能还讨论了 AI 转型战略，为公司各项业务全面引入 AI 技术。自去年 10 月起，三星与 OpenAI 就已经展开战略合作，目标是扩大先进存储半导体生产、建设下一代 AI 基础设施。目前，此次会议的具体合作条款、投资规模暂未公开。一位业内人士表示：“OpenAI 将三星和 SK 海力士等韩国半导体企业视作合作伙伴。考虑到 AI 投资的紧迫性，双方未来还将继续推进合作。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/705.htm", "publishedAt": "2026-07-26T07:14:10+00:00"}, {"title": "比亚迪迪空间预热人形机器人，八月初亮相", "summary": "IT之家 7 月 26 日消息，“比亚迪迪空间 | 郑州馆”微信公众号昨日发布人形机器人悬念海报，暗示机器人产品将于八月初首次面向公众亮相。IT之家注意到，比亚迪高层此前已对外释放过明确信号。上个月比亚迪执行副总裁李柯表示，希望未来每家比亚迪门店都能部署机器人，并能够向顾客介绍和演示车辆。李柯表示，面向家庭和服务行业的人形机器人将成为比亚迪的一个巨大市场。“我的目标是在每家门店放两三台机器人。机器人可以为顾客讲解，也可以活跃气氛，甚至能够展示和演示车辆。”李柯预计，机器人销售顾问有望在未来一两年具备实际应用条件。不过，展厅机器人虽然可以参与销售，却无法取代人类销售与顾客之间的“情感联系”。“我们仍然需要人类员工，但机器人技术可以帮助我们进一步改善服务。”此前网传比亚迪自研人形机器人代号“尧舜禹”，计划于 2026 年在内部部署 2 万台。对此，比亚迪方面表示：“‘比亚迪人形机器人代号尧舜禹’‘第七代原型机在深圳和长沙工厂实地测试’‘约 150 台上岗，目标年内自用 2 万台’等消息均不属实。”作为比亚迪面向公众打造的科普与体验场馆，迪空间具备线下实物交互展示的功能定位。业界据此普遍预期，八月初的亮相将不再是概念层面的技术发布，而是可实际操作的实体样机首次登场。当前，人形机器人已成为全球科技巨头竞相布局的战略性赛道。相较于纯软件或互联网背景的企业，比亚迪依托其在新能源汽车领域建立的垂直整合制造体系、供应链管控能力及机电一体化技术积淀，被业内视为具备差异化竞争优势的参与者。随着八月初时间节点的临近，市场正密切关注比亚迪将在具身智能领域给出怎样的答案。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/642.htm", "publishedAt": "2026-07-26T02:40:23+00:00"}, {"title": "美国具身也没成熟！PI：中国公司何必总当“中国版XX”｜RSS 2026", "summary": "这是机器人领域最好的时代", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/460542.html", "publishedAt": "2026-07-25T12:24:27+00:00"}, {"title": "北京说Agent已经能造世界，杭州却说它是刚发明的电灯泡", "summary": "工业圈和学术圈“唱反调”", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/460186.html", "publishedAt": "2026-07-25T11:07:25+00:00"}, {"title": "以 AI 对抗 AI：构建越用越强的 Agent Runtime 安全防线｜AICon深圳", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/fovd670ZuVMSMI7Z0zO4?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-25T10:00:00+00:00"}, {"title": "开发者的 AI 助手升级了：Android Studio 支持多个 Agent 同时处理任务", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/j227Ip5mPV4SQFuFX63C?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-24T16:15:00+00:00"}, {"title": "Java 近期新闻：值对象、WildFly 41、TornadoVM、LangChain4j、Oracle AI Agent Studio", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/SCpx11gzcAUXOFdkSEKC?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-24T14:24:00+00:00"}, {"title": "Pinecone 推出 Nexus 引擎：为 AI 智能体整合业务上下文并生成结构化数据", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/TdXHOr9FkuJ4a1mDh5uL?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-24T11:41:00+00:00"}, {"title": "精彩预告｜Agentic 时代，谁来重新定义数据库？", "summary": "点击查看原文> const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
