const DATA = {"date": "2026-10-23", "generatedAt": "2026-10-23T01:10:43Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "MiniMax M3.1 Flash 开源模型权重，总参数 428B", "summary": "IT之家 10 月 23 日消息，MiniMax 稀宇科技今日宣布开源 MiniMax M3.1 Flash 的模型权重，总参数 428B，激活参数 23B。相较于上一代 M3 模型，M3.1 Flash 的模型能力实现了全面提升。此外，通过全模型稀疏注意力、量化感知训练和 Power-aware scheduling 等优化工作，M3.1 Flash 进一步提升了推理效率：全模型稀疏注意力：前三个全注意力层替换为稀疏注意力；QAT：路由 MoE 专家迁移到 W4A4（共享专家除外），稀疏注意力索引器和主分支从 Q8KV8 迁移到 Q8KV4；Power-aware scheduling：通过对计算卡功耗的精细分配，保持计算卡持续维持算力高位，极致压榨硬件效率。M3.1 Flash 于 10 月 19 日上线，72 小时内真实用户处理超过 100 万亿 Token。MiniMax 宣布携手华为昇腾、平头哥、昆仑芯、摩尔线程、壁仞、海光、沐曦、天数、英伟达、AMD 等海内外芯片厂商，以及 Together AI、Fireworks、Nebius、Baseten、Modal、DigitalOcean 等推理和云服务平台，共同推进 M3.1 Flash 的开源首日接入。此外，vLLM、SGLang、智源 FlagOS 和 Hugging Face、魔搭等推理框架与开源社区，也将与 MiniMax 一齐推动模型在不同芯片、云平台和开发环境中的应用，持续拓展全球 AI 开源生态。IT之家附开源地址如下：Hugging Face：https://huggingface.co/MiniMaxAI/MiniMax-M3.1-Flash魔搭社区：https://modelscope.cn/models/MiniMax/MiniMax-M3.1-Flash", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/016/800.htm", "publishedAt": "2026-10-23T01:08:08+00:00"}, {"title": "DeepSeek、MiniMax 已顺利履行登记手续，完成开源和海外授权使用", "summary": "IT之家 10 月 23 日消息，10 月 16 日，商务部、科技部就修订《中国禁止出口限制出口技术目录》公开征求意见。其中，人工智能领域包括大模型、智能体、算力集群、信息处理相关 23 项技术；对已通过开源、发表学术论文等方式进入公共领域的技术，不纳入管理范围。中央广播电视总台旗下新媒体账号玉渊谭天昨晚（22 日）发文透露，政策公布以来，DeepSeek、MiniMax 两家头部企业已顺利履行登记手续，并完成开源和海外授权使用。商务部新闻发言人此前就有关问题回答了记者提问，IT之家整理商务部原文如下：问：对于拟增列的人工智能技术，主要有哪些考虑？答：当前，全球人工智能技术创新进入前所未有的活跃期，机遇与挑战并存。此次拟将人工智能大模型、智能体、算力集群、信息处理相关 23 项关键技术增列至《目录》，主要有以下考虑：一是确保人工智能技术安全可控。人工智能引发的各类内生和衍生风险已引起全球各国的高度关注。此次拟列管的人工智能自主驱动恶意代码生成与变异技术等，可被用于攻击国家关键信息基础设施、国防军工、核心政务等敏感系统，或用于绕过国家安全防御体系。若被非国家行为体或恶意实体获取，可能对国家安全和人类共同安全造成危害。中国政府对这类技术实施必要管理，目的是筑牢安全底线，防范滥用恶用，确保人工智能始终处于人类控制之下，推进人工智能国际治理。二是鼓励开源开放、合作共享。中国政府致力于让人工智能成为促进共同繁荣、维护共同安全的一个重要动力源。为支持构建人工智能开源创新生态体系，对人工智能类技术开源、中国企业在境外自建自营算力中心、赴境外开展芯片流片制造、利用境外资源开展联合研发、参与国际标准制定等情形的技术出口，适用自动许可等便利措施，基本实现“即报即出”；对已通过开源、发表学术论文等方式进入公共领域的相关技术，拟不纳入出口管理范围，为人工智能技术国际交流合作创造良好环境。需要特别指出的是，中方主张在相互尊重、平等互利基础上，与各国开展人工智能对话合作，共同应对人工智能技术扩散和失控风险。中方支持全球南方国家加强人工智能能力建设，弥合数智鸿沟，促进可持续发展。对于世界人工智能合作组织成员间开展能力建设国际合作、技术共享和规则共建所需的技术出口，将提供更多便利和支持。问：《目录》正式实施后，人工智能大模型在海外本地化部署、向境外提供模型调用等各类“出海”形式，是否属于技术出口管理范围？答：当前，人工智能大模型和应用产品的“出海”模式多种多样，判别具体“出海”情形是否属于技术出口管理的范围，核心在于是否涉及限制类技术从中国境内向境外转移。此次纳入监管的人工智能技术范围精准有限，有关措施正式实施后，绝大部分人工智能技术仍可以自由出口。对于纳入限制类的人工智能技术，开展海外本地化部署，属于技术出口管理范围；如果部署在海外自有云等风险相对可控的情形下，可适用自动许可等便利措施。对于企业利用限制类大模型对外提供 API 调用、APP / 网页交互、SaaS 应用、本地端侧轻量化部署等情形，不属于大模型技术出口管理范围。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/016/796.htm", "publishedAt": "2026-10-23T00:58:54+00:00"}, {"title": "让你安心用 AI 网购 / 订票 / 点外卖：1Password 推出智能体密码授权功能", "summary": "IT之家 10 月 23 日消息，密码管理服务商 1Password 昨日（10 月 22 日）发布博文，宣布推出 1Password for Agents 平台，让个人 AI 智能体全程不接触、不存储用户的密码或验证码情况下，代用户完成网站登录。IT之家附上官方介绍视频如下：该功能面向个人及家庭版用户推出，首批支持 Meta Muse、OpenAI ChatGPT Work 与 Dots、Anthropic Claude Duet、Grok Bot 及 Town 等主流 AI 智能体。官方表示随着 AI 智能体逐步承担订餐、购物、订票、整理资料等任务，账号登录成为其执行任务的关键环节。但若直接把密码交给智能体，用户将面临凭据被模型记忆、泄露或滥用的风险。1Password 的新方案试图在“授权 AI 办事”与“守住密码安全”之间建立一道隔离层。具体流程为：在 AI 智能体遇到登录页面后，会先通过独有的数字密钥向 1Password 证明自身身份。用户随后会在自己的设备上收到通知，看到智能体请求使用哪个账号凭据、用于什么任务，并自行选择批准或拒绝。用户批准后，1Password 直接将用户名、密码或一次性验证码填入登录表单；登录完成后，智能体即可继续执行任务，但密码始终留在 1Password 保险库中。1Password 强调，智能体不会获得整个密码库的访问权限，未被明确授权的其他密码仍受端到端加密保护。这一机制类似于为 AI 增加一道“双重验证”：用户掌握最终批准权，智能体只获得完成特定任务所需的临时登录能力。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/016/772.htm", "publishedAt": "2026-10-22T23:54:44+00:00"}, {"title": "OpenAI 宣布全面开放决策 API：基于 GPT‑6 Luna，每百万 token 输入 0.1 美元", "summary": "IT之家 10 月 23 日消息，当地时间 10 月 22 日，OpenAI 宣布全面开放决策 API（Decisions API）。据介绍，该 API 基于 GPT‑6 Luna 构建，将 Luna 的模型智能聚焦于具有限定答案（bounded answers）的问题，协助应用程序与智能体基于文本、图像及结构化输入做出准实时决策 —— 其响应速度比通过 Responses API 调用 GPT‑6 Luna 提升了高达 10 倍。定价方面，决策 API 输入每百万 token 收费 0.1 美元（IT之家注：现汇率约合 0.67 元人民币），命中缓存的输入每百万 token 收费 0.01 美元（现汇率约合 0.067 元人民币）。该 API 仅按输入 Token 计费，输出 Token 免费。在整个 OpenAI，团队正在将决策 API 应用于产品和业务工作流。OpenAI 表示，自公测以来，该功能新增了原生的 GPT‑Live 集成、针对复用上下文的 Prompt 缓存，以及在美国和欧盟的推理数据驻留支持。此外，开发者现已支持传入原生 JSON 输入、在问题指令中包含图像，并在单次请求中最多提交 400 个问题（为此前上限的两倍）。OpenAI 称持续优化了延迟表现，包括在亚洲多个地区扩充了服务容量。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/016/771.htm", "publishedAt": "2026-10-22T23:48:13+00:00"}, {"title": "OpenAI 奥尔特曼：面对 AI，数学家们起初会觉得“我们完蛋了”，最终却还是接受现实", "summary": "IT之家 10 月 23 日消息，据《商业内幕》今天（23 日）报道，近日，在斯坦福大学，OpenAI CEO 萨姆 · 奥尔特曼面向台下数百名担忧未来职业前景的学生发表演讲。奥尔特曼认为，面对 AI 大举进军数学研究领域，数学家经历了类似“哀悼”的几个阶段。起初是难以置信，随后陷入痛苦。“第一天，大家的反应大概是：‘我们完蛋了，数学这个领域也完了。’‘还是去劝研究生转专业吧。’”接着，痛苦转化成了愤怒。“到了第三天，大家可能开始觉得：‘OpenAI 这么干实在太过分了。’”按照奥尔特曼的描述，到了第五天，数学家开始接受现实：在数学研究和证明工作中，AI 正成为不可或缺的工具。“我们看到很多人开始觉得，‘我今后作为数学家的职业道路会有所不同，但希望能比以前更好。’”图源：PixabayIT之家从报道中获悉，奥尔特曼对数学界前景的乐观判断，与部分数学家对这场根本性变革的看法形成鲜明反差。今年 9 月，OpenAI 突然宣布，其 AI 模型攻克了纳维 — 斯托克斯方程涉及的著名数学难题。自 19 世纪以来，数学界最杰出的学者一直未能解决这一问题。OpenAI 的声明引发多位知名数学家的愤怒。纽约大学和 Anthropic 的两名研究人员指责 OpenAI 利用他们与 AI 的聊天记录数据帮助破解难题。另有数学家抱怨，即便 AI 真的找到了解法，也没有展示推导过程，留给人类数学家的工作只剩下验证结果，远不如亲自解题令人兴奋。风波还未结束，新的争议又出现了。加州理工学院的一群本科生担心 AI 迅速改变数学研究，希望跟上技术发展的步伐，于是发起了一场“数学马拉松”竞赛，鼓励参赛者借助 AI 攻克长期未解的数学难题。超过 700 名学者随后联名发表公开信，批评比赛助长 AI 生成的垃圾内容，OpenAI 因此退出赞助。主办方此后修改了比赛规则，比赛计划于 11 月举行。近期，加州大学洛杉矶分校教授陶哲轩也直言，数学研究的“浪漫时代”结束了。不少顶尖数学家开始改变工作方式，从独立攻克难题转向验证 AI 给出的解答。本月，OpenAI 又宣称解决了 700 多道数学问题。陶哲轩对此感叹：“有些东西正在失去。”站在争论另一边的奥尔特曼则对 AI 带来的变革持乐观态度。谈及企业因 AI 而调整员工结构的问题，奥尔特曼回应称，自己不认为 AI 会造成就业大灾难。然而，相比其他学科和行业，数学界受到 AI 冲击的速度明显更快。“我认为，我们从未见过一个领域如此迅速地经历这一整套变化。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/016/766.htm", "publishedAt": "2026-10-22T23:25:40+00:00"}, {"title": "微软推出 AI 医疗诊断系统 MAI-DxO：复杂病例准确率达 83%，成果登《科学》", "summary": "IT之家 10 月 23 日消息，当地时间 10 月 22 日，微软宣布，在基于 MIMIC-IV-ED 数据集评估美国急诊科常见就诊病例时，其研发的 AI 诊断系统 MAI-DxO 的诊断准确率达到了人类医生的 1.7 倍。该系统命名为 Microsoft AI Diagnostic Orchestrator，简称 DxO，通过统一编排多个 AI 智能体来模拟医生专家联合会诊的过程 —— 各智能体协同向患者问诊、开具化验检查，并对潜在诊断展开深入研判与辩论。而在基于《新英格兰医学杂志》（NEJM）复杂病例展开的模拟评估中，MAI-DxO 的诊断准确率高达 83%。相比之下，可独立查阅参考资料的基层全科医生及普通内科医生的准确率仅为 36%。值得注意的是，此类复杂病例在现实临床中通常交由专科专家或多学科医疗团队协作诊治，而这部分专科医生并未纳入本次对照实验。官方表示，该系统所需的成本仅为医生的一半甚至三分之一，能以更少的化验与诊疗操作精准锁定正确诊断。该项研究成果已正式发表在《科学》期刊。该研究自身的数据亦显示，系统诊断能力的跃升在很大程度上归功于底层基础 AI 模型性能的增强，而微软的编排架构则在此基础上进一步放大了性能增益。微软针对 OpenAI、谷歌、Anthropic、Meta 以及 DeepSeek 等多家机构的模型对 MAI-DxO 进行了测试，其中表现最亮眼的当属 OpenAI 旗下的 GPT-5 及 GPT-5.5。IT之家附论文链接：https://www.science.org/doi/10.1126/science.aeh7930", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/016/765.htm", "publishedAt": "2026-10-22T23:23:36+00:00"}, {"title": "企业 AI 越用越复杂，如何用一个 Gateway 管好模型、Agent 和成本？｜ 技术趋势", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/v85ey09UlxhCDH4r3RS3?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-22T18:00:00+00:00"}, {"title": "面向 Qwen 系列模型线性注意力的高性能优化实践", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/o9OcWNkkwgKvsZmgY45d?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-22T17:08:07+00:00"}, {"title": "2026 上海开源软件应用创新大赛「AI+工业软件赛道」决赛名单公布", "summary": "2026 上海开源软件应用创新大赛「AI+工业软件赛道」决赛入围名单今日公布，以下 10 支队伍成功晋级，将于 10 月 29 日在上海张江人工智能创新小镇参加总决赛。 现将入围名单按报名时间顺序公示如下： 项目名称 团队负责人 代码仓库地址 EasyAIoT 张志翔 https://gitee.com/volara/easyaiot LISSIO 王鹏恒 https://codebe...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503162", "publishedAt": "2026-10-22T10:37:59+00:00"}, {"title": "Anthropic 推出“主动式 AI Agent” Claude Duet——无需等你开口就干活、关键操作先问批准", "summary": "在 Codex、ChatGPT 们把 AI Agent 卷成日常工具之后，Anthropic 终于发布了自己的常驻型 AI 助手。 Anthropic 今日推出 Claude Duet——一个「主动式」AI Agent。和 Claude 主应用「你问我答」的模式不同，Duet 会自己从你连接的应用里发现需要处理的事，在你还未开口前发来提醒，甚至能在你离开设备后继续干活。 Duet 的...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503159/claude-duet", "publishedAt": "2026-10-22T09:39:06+00:00"}, {"title": "拾趣 (Magpie) v0.1.16 发布，二级菜单交互升级，新增 7 家翻译服务", "summary": "拾趣 (Magpie) v0.1.16 发布，二级菜单交互升级，新增 7 家翻译服务，并支持 OpenAI Responses API 拾趣是一款划词工具：屏幕上任何文字（包括图片里的），选中即可翻译、解释、总结、查询或存入笔记，结果就地呈现，无需切换窗口。 本次版本聚焦二级菜单交互成型与翻译/模型服务生态扩充。 新增 新增 7 家机器翻译服务：...", "sourceName": "开源中国", "sourceUrl": "https:/ 1.0.0 是第一个稳定版本。对你来说，它意味着三件事： 升级放心——v1.x 内公开 API 遵循语义化版本，不再有破坏性变更；本版...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503095", "publishedAt": "2026-10-19T09:35:15+00:00"}, {"title": "gfast 快速开发框架 V3.4.2 版本发布", "summary": "平台简介 基于全新 Go Frame 2.10.x+Vue3+Element Plus 开发的全栈前后端分离的管理系统 前端采用 gfast-ui（Vue 3 + Element Plus + vue-i18n 9）,支持语言：zh-CN / en-US，可在两端各自扩展. 支持：大模型管理与智能客服，知识库功能，流程编排（SOP Workflow），多租户、C 端开放接口与网站挂载插件等 本次更新内容：...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503086", "publishedAt": "2026-10-19T03:56:17+00:00"}]}, {"label": "产品发布/更新", "items": [{"title": "英特尔 CTO 称前沿晶圆产量最多翻倍，AI 算力扩张遭遇供应链天花板", "summary": "IT之家 10 月 23 日消息，在接受 Dwarkesh 播客时，英特尔首席技术官（CTO）普什卡 · 拉纳德（Pushkar Ranade）表示：即便资金充足，全球尖端晶圆产量也难以扩大十倍，更现实的增长上限约为两倍。在播客节目中，拉纳德被问及“世界上是否有足够工具，把前沿晶圆产量提高 10 倍”。对此他回应称“不是 10 倍，但可能达到 2 倍，是的。”他认为这一限制源于整个半导体供应链协同扩产的能力，而非某个单一环节。IT之家援引博文介绍，拉纳德指出，AI 计算能力过去十年大约以每年三倍的速度增长，但制造先进芯片所需的关键设备、洁净室和晶圆厂规模，正在成为新的产能天花板。其中，ASML 每年生产的 EUV 光刻机不足 100 台，且到本十年末也难以大幅扩产，而英特尔、台积电以及 SK 海力士等存储厂商共同争夺这些设备。他进一步解释，今天下单的设备通常约 18 个月后才能交付，意味着产能要到 2028 年前后才能落地。新建晶圆厂也无法自动带来更多晶圆，重要原因是设备供应跟不上。拉纳德解释称，若要整体提升产量，设备供应商、其上游供应商以及更底层的子供应商都必须同步增加产能。换言之，光刻机、关键零部件、材料、检测设备与工厂建设等环节，只要有一处“卡脖子”，先进晶圆的最终产出就难以大幅跃升。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/016/761.htm", "publishedAt": "2026-10-22T22:48:15+00:00"}, {"title": "极米记得 AI 记忆手环 L1 上架：两种形态自由切换，全天候 AI 录音", "summary": "IT之家 10 月 22 日消息，极米记得 AI 记忆手环 L1 今日上架，提供黑色、米色配色，售价信息暂未公布。据介绍，该产品支持两种形态自由切换，腕上是手环，胸前是吊坠；全天候 AI 录音，所有记忆，自动记录并整理；基于你个人记忆的 AI 对话，发生过的事它都知道；自动整理纪要、待办，到点轻轻提醒，无需刻意记录；原始音频用完即删，记忆加密存于手机；综合续航 2-5 天，短途差旅无需补电。IT之家注意到，极米记得 AI 记忆眼镜 G1 也在今日上架，在功能上与这款 AI 记忆手环相近，均支持全天候 AI 录音、自动整理纪要等功能。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/016/753.htm", "publishedAt": "2026-10-22T15:48:13+00:00"}, {"title": "AI把整个软件生态打成筛子，全栈开发者的至暗时刻", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/glAvFT7PWdZ53mbgPbgC?utm_source=rss&amp;utm_medium=article", "publishedAt" 、报表设计、工作流、Saas 等功能。打造全网首套零代码、AI应用最广...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503085", "publishedAt": "2026-10-19T03:42:43+00:00"}]}, {"label": "行业动态", "items": [{"title": "DeepSeek千亿融资逼近收官：结盟完美世界、中芯聚源等产业资本，募资翻倍押注具身智能", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/ViOyxiOSP2ihxuUyg1rD?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-23T08:46:30+00:00"}, {"title": "美财长贝森特：AI 行业不会重演互联网泡沫破裂，我没发现“系统性问题”", "summary": "IT之家 10 月 23 日消息，据英国《金融时报》报道，美国财政部长斯科特 · 贝森特在一场私人会议上告诉投资者，自己没有发现 AI 热潮存在“系统性问题”，从而淡化了外界对 AI 行业可能重演互联网泡沫破裂的担忧。当地时间 21 日，贝森特在纽约出席了一场由摩根大通和罗宾汉基金会联合主办的会议，现场有数百名金融业高管和投资者。罗宾汉基金会是亿万富翁对冲基金经理保罗 · 都铎 · 琼斯创办的非营利组织。会议以提供“独家投资见解”为宣传卖点，门票最低 7,500 美元（现汇率约合 50,162 元人民币），记者不得入场。据三名与会人士透露，曾担任宏观对冲基金经理的贝森特在接受桥水基金 CEO 尼尔 · 巴迪采访时，被问及对 AI 的看法。他说：“我很擅长判断一个系统什么时候出了问题。我没看到系统性问题。”贝森特发表上述言论之际，金融市场处于敏感时期。过去几周，市场多次出现动荡，一些投资者开始质疑 AI 概念股是否涨得过高，同时担忧企业为建设数据中心、采购芯片而大举发债。一些分析师认为，当前的 AI 投资热潮与世纪之交互联网泡沫时期的狂热行情颇为相似。在持续 30 分钟的访谈中，贝森特谈到了美国经济，后半段则主要讨论 AI。他总体看好 AI 技术进步给美国带来的益处，但也指出，数据中心运营商和 AI 企业未能向普通美国民众充分说明这些好处。“这可不是 Pets.com。世界上最聪明的那些人，把 99% 的身家都放在这些企业里，还创办了全球最赚钱的一批公司。他们相信 AI。”IT之家注：Pets.com 是 2000 年 3 月互联网泡沫达到顶峰前，最后一批进行首次公开募股的科技企业之一。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/016/795.htm", "publishedAt": "2026-10-23T00:55:37+00:00"}, {"title": "黑石集团总裁反驳 AI 泡沫论，称需求呈“抛物线式”增长", "summary": "IT之家 10 月 22 日消息，据彭博社今日消息，黑石集团总裁乔恩 · 格雷（Jon Gray）发话，反驳亿万富豪肯 · 格里芬前几天关于 AI 存在泡沫的说法。格雷表示：“说到泡沫，你想到的是先建设产能，然后期待需求出现。但在人工智能领域，你是在建设产能，同时希望自己能够跟得上需求。”IT之家注意到，这名总裁还认为，如今人工智能的需求，与上世纪 90 年代电信泡沫等现象是“截然不同的局面”。他提到黑石与 Anthropic 共同成立的 AI 咨询公司 Ode 时表示：“我们根本跟不上客户需求，这些需求近乎呈抛物线式增长。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/016/752.htm", "publishedAt": "2026-10-22T15:38:11+00:00"}, {"title": "GitHub 通过 AI 辅助重构，将 Copilot 运行时迁移至 Rust", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/zGqDWHF8tHDtlYcImAJS?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-22T13:17:00+00:00"}, {"title": "OpenAI 发现 PHP「世纪漏洞」，全球 70% 网站都危险了", "summary": "大的还在后面#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1685507?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-10-22T11:15:20+00:00"}, {"title": "PHP爆雷引发全球紧急「拔网线」，别指望 AI 拯救互联网", "summary": "网站被攻破后，数据、密码和令牌都可能受到影响#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1685446?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-10-22T05:58:07+00:00"}, {"title": "DeepSeek 融了 150 亿美元 —— 宁德时代和腾讯领投，目标两次上调", "summary": "DeepSeek 融到了 150 亿美元，跻身中国最大规模的融资之一。据 Bloomberg 报道，这家杭州公司在最新一轮融资中募得约 1000 亿元人民币（$15B），目标在谈判中至少上调了两次——从 500 亿到 800 亿，最后落定 1000 亿。宁德时代（CATL）和腾讯是这轮最大的投资者。 这个数字的份量要放在对比里看。150 亿美元，是 DeepSe...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503150/deepseek-raises-15-billion-in-challenge-to-leading-us-labs", "publishedAt": "2026-10-22T03:40:47+00:00"}, {"title": "我向新版 DeepSeek 许了个愿，4 块钱让特斯拉飞起来", "summary": "好用到原地「起飞」#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1684880?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-10-19T09:21:16+00:00"}]}, {"label": "论文研究", "items": [{"title": "“现代史上最大规模财富捐赠”：Anthropic 等 AI 三巨头拟投入近 3000 亿美元做慈善", "summary": "IT之家 10 月 23 日消息，《华盛顿邮报》昨日（10 月 22 日）发布博文，报道称 Anthropic、OpenAI 和 SpaceXSI 三家 AI 巨头正酝酿“现代史上规模最大的财富捐赠”，规模可能接近 3,000 亿美元（IT之家注：现汇率约合 2.01 万亿元人民币）。Anthropic 宣布，将把公司 5% 股份捐入一个新的公益基金。若该公司上市时估值达到 2 万亿美元（现汇率约合 13.38 万亿元人民币），该基金规模可达 1,000 亿美元（现汇率约合 6,688.23 亿元人民币）；其七位创始人还承诺捐出个人财富的 80%。这笔资金可能用于补贴受 AI 自动化影响的特定人群，并资助相关研究。OpenAI 的慈善基金会据称持有公司约四分之一股份，价值超过 1,800 亿美元（现汇率约合 1.2 万亿元人民币），并已投入 8.55 亿美元（现汇率约合 57.18 亿元人民币）用于公益项目。马斯克则表示，计划明年向美国每个孩子赠送一份 SpaceX 股份，按 SpaceX 近期股价估算，捐赠总额可能超过 110 亿美元（现汇率约合 735.7 亿元人民币）。不过该媒体也指出这里的“捐赠”大多是未上市股权或未来承诺，实际可支配金额高度取决于 Anthropic、OpenAI 的 IPO 估值和 SpaceX 股价。该媒体对此解读认为，这次慈善捐助一方面推动技术商业化，而更重要的是回应其对就业、收入分配和社会稳定可能造成的冲击，淡化“AI 冲击就业”影响。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/016/799.htm", "publishedAt": "2026-10-23T01:07:46+00:00"}, {"title": "消息称 OpenAI 融资磋商进入尾声，估值目标下调至 1.25 万亿美元", "summary": "IT之家 10 月 23 日消息，据彭博社报道，知情人士透露，正在寻求在最新一轮融资中筹集约 300 亿美元（IT之家注：现汇率约合 2,006.8 亿元人民币）的 OpenAI，目前在谈判的最后阶段将目标估值定为 1.25 万亿美元（现汇率约合 8.36 万亿元人民币）。知情人士称，OpenAI 在磋商中将此前讨论的估值从 1.4 万亿美元（现汇率约合 9.37 万亿元人民币）下调了 1,500 亿美元（现汇率约合 1 万亿元人民币）。上述人士同时表示，相关融资谈判仍在推进中，具体细节仍可能有变。另据路透社此前报道，OpenAI 正争分夺秒地争取投资者承诺，力求在竞争对手 Anthropic 预计于 11 月中旬上市之前完成融资。延伸阅读OpenAI 的估值预期在此前几个月经历了多次变化。2026 年 9 月 16 日，综合《金融时报》《华尔街日报》报道，OpenAI 已就以 1.2 万亿美元估值进行新一轮融资与投资者展开初步谈判，当时这一初步估值被认为仍可能在未来数月的谈判期间发生变化。此后在 2026 年 9 月 30 日，彭博社报道称 OpenAI 计划在首次公开募股前完成一轮融资，至少募集 300 亿美元，对应企业估值约为 1.4 万亿美元。若本轮融资最终落地，这笔资金将作为过渡轮融资，为后续的首次公开募股做好铺垫。回顾 OpenAI 的融资脉络，2026 年 3 月该公司以 8520 亿美元的投后估值完成了一轮 1220 亿美元的融资，是其迄今规模最大的一轮，由软银与安德森 · 霍洛维茨基金、D.E. Shaw Ventures、MGX、TPG 以及普信集团共同牵头，亚马逊、英伟达与微软也参与投资。OpenAI 当时还宣布，在多家全球顶级银行支持下，其循环信贷额度已扩充至约 47 亿美元。关于 OpenAI 的上市节奏，首席执行官萨姆 · 奥尔特曼已排除 2026 年上市的可能性，表示要优先落实人工智能安全相关工作；他近期接受《财富》杂志采访时称：“如果到这个十年结束之时，人工智能有大约 10% 的概率造成全人类覆灭，我认为这是一件无法接受的事情。”另有相关消息称，OpenAI 首席财务官已告知员工，公司最迟将于 2027 年上市。在营收与支出方面，OpenAI 2026 年第二季度季度营收规模为 67 亿美元，其“运行率”（年化营收）已在 2026 年 8 月突破 400 亿美元关口，环比增幅 20%，活跃用户数量已超过 10 亿。此外，OpenAI 曾向投资者表示，已将 2030 年算力目标调降至 6000 亿美元，预计 2030 年总收入超 2800 亿美元。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/016/782.htm", "publishedAt": "2026-10-23T00:21:18+00:00"}, {"title": "外部评估人员发现 OpenAI 内部监控系统漏洞：AI 智能体可绕过安全限制", "summary": "IT之家 10 月 23 日消息，今年早些时候，AI 安全评估机构 METR 和 Redwood Research 对 OpenAI 的内部监控系统进行了试点评估，发现多项新漏洞。其中一项漏洞可被 AI 智能体利用，使数百次操作逃过监控。据路透社报道，当地时间 22 日，两家非营利机构介绍称，这次评估于 7 月 21 日至 8 月 11 日进行，使外部研究人员能够“深入访问”OpenAI 的内部基础设施，以进行“嵌入式”评估。METR 和 Redwood Research 各派出一名研究员，获准查阅 OpenAI 的内部代码和文档，并与部分技术人员交流。两人在现场始终有人陪同，使用的设备均由 OpenAI 提供，且不得带离办公场所。OpenAI 告知两家机构，影响实际运行系统安全防护措施的漏洞均已修复，但修复措施有效与否尚未被两家机构核实。AI 实验室、专家以及美国政府一直主张引入外部独立评估，以便在保障 AI 安全的同时，不拖慢技术发展。不过，AI 企业担心外部评估人员进驻后，可能向竞争对手泄露企业的专有信息。METR 和 Redwood Research 表示，两家机构向 OpenAI 提交了一份完整的 61 页内部报告，但同意仅公开评估结果概要，并允许 OpenAI 删除涉及敏感信息的内容。据IT之家了解，与以往部分评估不同，两家机构此次无权自行公开删减内容的具体信息，但希望未来的评估能够更加透明。研究人员还发现，OpenAI 的 Codex 智能体存在绕过安全限制的潜在途径，可借此获得与用户相同的完整操作权限。此次评估以 7 月 21 日及之前的监控系统为对象。研究人员指出，OpenAI 在评估期间也在扩展该系统。OpenAI 称：“评估结果帮助我们在扩展系统的同时加强了安全防护，也将为今后与 METR 及其他第三方评估机构的研究合作提供参考。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/016/781.htm", "publishedAt": "2026-10-23T00:19:40+00:00"}, {"title": "允许员工“不务正业”的车库项目谢幕，微软调整运营 17 年的 Garage 创意孵化平台", "summary": "IT之家 10 月 23 日消息，科技媒体 GeekWire 昨日（10 月 22 日）发布博文，报道称微软正陆续关停内部创新“车库”项目 The Garage，取消其作为公司级统一创新平台的职能，并陆续关闭或调整全球相关创客空间。IT之家查询公开资料，The Garage 是微软内部的创意孵化平台，曾为微软员工提供原型开发、硬件制作、跨部门协作和业余创新实验的空间与工具，也是微软全球黑客马拉松的重要组织平台。对于微软员工而言，该项目的一个亮点是，在经过团队、经理或相关活动批准后，员工可以在工作时间展开自己喜欢的创意项目。业务团队可以自行安排若干工作日，让成员做与现有或潜在微软产品相关的创意项目。例如 Yammer 团队曾每季度安排 5 天；早期也有业务部门举办一周的“Garage Week”。对于未被团队正式排入工作时间表的活动，例如“Stay Late”系列活动，员工一般是在下班后或周末自行投入时间。图源：微软The Garage 于 2009 年在微软雷德蒙德园区内的 Office Labs 团队创立，后在 CEO 萨提亚 · 纳德拉任内扩展为公司级创新网络。其主园区连接了位于美国、加拿大、欧洲、中东、非洲和亚洲的约 15 个空间，北京也曾设有相关站点。在产品方面，在过去 17 年时间里，The Garage 孵化出多款具有影响力的产品。例如面向视障人群的 AI 应用 Seeing AI 便诞生于 2015 年黑客马拉松。目前公开报道只确认了 Garage 项目和网站的关闭，并未说明这些已发布应用会立即停服或停止更新。微软已撤下公共 Garage 网站，原本展示黑客松项目和实验性应用的网站已重定向到微软主页，相关项目历史页面也被移除。据微软内部文件，公司将不再以“集中化职能”方式运营 The Garage，改为把实验、学习和跨团队协作融入各业务团队的日常工作，部分实体空间最早将于 10 月 23 日关闭。微软全球黑客马拉松没有明确宣布取消，但负责团队表示正在“重新构想”该项目，后续会另行公布安排；因此其形式、规模和是否继续举办都仍不确定。微软表示，将继续探索帮助员工提升技能、打破部门边界并保持“黑客思维”的新方式；年度全球黑客马拉松团队也在重新设计活动形式，未来安排尚待公布。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/016/764.htm", "publishedAt": "2026-10-22T23:23:13+00:00"}, {"title": "华为官网公布乾崑智驾 ADS 5 各版本配置能力差异，Max 独占漫游巡航辅助 RCA、车位到车位等功能", "summary": "IT之家 10 月 22 日消息，华为乾崑智能汽车解决方案迎来更新，公开了华为乾崑智驾 ADS 5 各版本的差异。IT之家整理华为乾崑智驾 ADS 5 各版本配置及对应核心功能如下：硬件配置华为乾崑智驾 ADS 5ADS MaxADS ProADS SE激光雷达 896 线双光路图像级激光雷达舱内激光视觉 Limera—摄像头11 个11 个10 个毫米波雷达3 个 / 5 个（含 1 套分布式毫米波雷达）3 个3 个高精度固态激光雷达 0 / 3 个 / 4 个——超声波雷达12 个12 个12 个核心功能华为乾崑智驾 ADS 5ADS MaxADS ProADS SE核心功能六维安全六维安全基础安全高速领航辅助 NCA高速领航辅助 NCA高速领航辅助 NCA 城区领航辅助 NCA 城区领航辅助 NCA城区车道巡航辅助 LCC 园区领航辅助 NCA 园区领航辅助 NCA泊车辅助漫游巡航辅助 RCA泊车辅助— 车位到车位——泊车辅助——据IT之家此前报道，在今年 4 月 23 日晚，华为乾崑智驾 ADS 5 正式发布。算法层面，华为发布了面向自动驾驶的 AI 智能体 WEWA 2.0 架构。该架构在云端引入 Multi-Agent 博弈技术与在线强化学习机制；在车端应用了安全风险场技术进行实时安全评估，并通过 Driving Agent 模块完成出行任务的策略优化。华为官方曾表示，华为乾崑智驾 ADS 4 Max / Pro / SE 升级到华为乾崑智驾 ADS 5 Max / Pro / SE 对应版本，不存在硬件限制。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/016/749.htm", "publishedAt": "2026-10-22T15:31:28+00:00"}, {"title": "比尔 · 盖茨：人们要为 AI 带来的二十年颠覆性变革做好准备", "summary": "IT之家 10 月 22 日消息，微软联合创始人、亿万富翁慈善家比尔 · 盖茨今日接受外媒 The Verge 采访。他表示，人们要为 AI 带来的二十年颠覆性变革做好准备，这段时期可能会非常痛苦，甚至会将社会分裂成两派：一派乐于接受前沿科技，另一派拒绝。IT之家了解到，比尔 · 盖茨今年 8 月发表一篇文章，认为人们向 AI 时代过渡时，将经历一段动荡时期。此后他将 AI 称为“人类有史以来接触过最危险的东西”，并认为 AI 让核武器相形见绌。盖茨表示，他并非 AI 悲观主义者。他认为 AI 过去一年的进步令人惊叹，从编写代码和发现网络漏洞的能力，到生物学推理能力，再到颠覆就业市场的能力，无不体现着这一点。如今人类拥有的强大力量，意味着上述所有事情都将成为现实，社会必须做好准备。谈到刚刚说的“二十年动荡时期”时盖茨认为，那时候物资短缺的情况将会减少，人们必须找到掌控局面的方法。这期间将会有输家和赢家，也会有很多动荡，人们必须挺过这段时间才能迎来繁荣时代。在那段时间，人类将拥有可以建造房屋、种植食物、进行手术的机器人，绝大多数商品和服务都不再需要人类劳动力。因此人们必须思考自己如何度过这 20 年，并思考哲学、社会行为等深刻问题。当然，盖茨这番话并不是说二十年后世界就一定不太平，他认为这个时间可能早几年或晚几年。并且突破类的成就谁也说不准，例如人形机器人能力进步，有的人说两三年就行，有的人则说八年左右才能实现。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/016/742.htm", "publishedAt": "2026-10-22T14:55:55+00:00"}, {"title": "AI时代，神话并未消失：人类正在创造新的“数字神明”", "summary": "一、引言：当算法开始回答神谕式问题 在过去的几年里，一个越来越常见的场景开始出现：当人们面对复杂的人生问题或难以理解的世界变化时，他们不再首先询问宗教、哲学家或传统专家，而是打开一个人工智能系统。 他们向 AI 提问： 我应该选择什么职业？ 这个研究方向是否值得继续？ 未来社会会变成什么样？ 人类意识究竟是...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503123", "publishedAt": "2026-10-21T01:59:21+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "黄仁勋称 2029 年不太可能出现内存过剩，英伟达仍会大量使用", "summary": "IT之家 10 月 23 日消息，据 CNBC 报道，英伟达 CEO 黄仁勋周四接受采访时表示，到 2029 年，内存芯片行业不太可能出现过剩的情况。此前一周，由于市场对产能过剩和需求放缓的担忧，存储板块股票遭遇集中抛售。黄仁勋指出，“内存的一大好处是，你总是可以用得更多（You can always use more）。”他补充说，高带宽内存 HBM 在未来数年内仍将被持续广泛采用。黄仁勋还表示，“我们是全球首家将手机中采用的 LPDDR 内存引入数据中心的企业。这使我们能够提供比当今世界上任何产品高出一倍能效的性能，因此我们也将继续大量使用它们。”IT之家注意到，过去一周，存储板块股票全线受挫。此前，韩国知名媒体 Mae const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
