9 元起直达链接", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/026/507.htm", "publishedAt": "2026-11-13T01:54:39+00:00"}, {"title": "OpenAI 最新一轮私募融资 150 亿美元，融前估值 1.25 万亿美元", "summary": "IT之家 11 月 13 日消息，据 CNBC 今日报道，OpenAI 在最新一轮私募融资中筹集了 150 亿美元（IT之家注：现汇率约合 1,002.76 亿元人民币），公司融资前估值达到 1.25 万亿美元（现汇率约合 8.36 万亿元人民币）。这一金额高于此前媒体披露的约 110 亿美元，此次融资也被视为 OpenAI 为 2027 年潜在首次公开募股（IPO）提前准备资金的重要举措。知情人士对 CNBC 表示，此次融资尚未正式结束，预计将在未来几周内完成。相关人士将其描述为一次机会性融资，旨在帮助 OpenAI 为预计于 2027 年进行的 IPO 做准备。与此同时，其主要竞争对手 Anthropic 正在筹备纳斯达克上市，计划于 11 月 19 日开始交易。根据路透社此前报道，Anthropic 此次 IPO 的估值目标最高约为 1.4 万亿美元（现汇率约合 9.36 万亿元人民币）。融资规模扩大之际，OpenAI 的营收增长与巨额运营亏损也成为投资者关注的焦点。据《华尔街日报》披露的数据，OpenAI 2026 年第三季度营收约为 100 亿美元，较第二季度增长近 50%。不过，公司同期运营亏损达到 109 亿美元，高于第二季度的 101 亿美元。其调整后营业利润率则从第二季度的约 -150% 改善至 -109%。这些数据反映出 OpenAI 在扩大业务规模的同时，仍需承担模型训练、推理服务以及数据中心等基础设施建设带来的高额成本。尽管营收持续增长，但公司距离实现持续盈利仍有较大距离。相比之下，Anthropic 的财务表现也受到市场关注。不过，不同人工智能企业对股权激励、慈善捐款等项目的财务调整方式并不完全相同，因此直接比较两家公司的调整后利润率需要谨慎。随着 Anthropic 即将登陆公开市场，以及 OpenAI 将潜在 IPO 时间指向 2027 年，投资者有望通过上市公司的财务披露，更直接地比较两家企业的营收增长、运营成本和盈利能力。相关阅读：《消息称 OpenAI 完成 110 亿美元首期新融资，估值 1.25 万亿美元》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/026/495.htm", "publishedAt": "2026-11-13T01:36:46+00:00"}, {"title": "贾跃亭法拉第未来 FFR 机器人业务 2026 年前九个月收入约 230 万美元，计划 2027 年一季度进入芝加哥和达拉斯", "summary": "IT之家 11 月 13 日消息，法拉第未来（Faraday Future，简称 FF）旗下具身智能与机器人业务实体 FF EAI Robotics Ecosystem Inc.（纳斯达克股票代码 FFR）已于今年 10 月 23 日正式完成与法拉第未来机器人资产的合并并挂牌上市。法拉第未来今日公布了 FFR 截至 2026 年 9 月 30 日的第三季度财务业绩，并披露所收购机器人业务的独立经营数据及后续规划。治理层与管理层同步调整：贾跃亭担任 CEO，Jerry Wang 担任执行董事长，Chen Shi 担任首席独立董事，Jason E. Dodier 担任独立董事。由于收购在第三季度结束后完成，所收购机器人业务截至 2026 年 9 月 30 日止九个月的业绩，未计入 FFR 第三季度合并报表。未经审计的独立合并财务数据显示，该机器人业务前九个月收入约 230 万美元（现汇率约合 1,537.7 万元人民币），毛利约 59.3 万美元，毛利率约 26%；研发费用占总运营费用的 26.2%。截至 2026 年 9 月 30 日，该业务无未偿还借款或可转换债务。FFR 称，交易完成后公司业务涵盖 Physical AI 大脑与开发者平台、本体、行业生产力解决方案及数据工厂四个板块。行业生态方面，FFR 教育与科研业务已取得 K-12 公立学区合作突破，并开始在全美复制推广；公司计划启动机器人教育“百城计划”，在 K-12 学校拓展标杆客户。安防与巡检业务已进入 POC、销售及交付阶段，并与北美多家集成商和经销商签署销售合同。工业与物流业务正推进研发，目标在 2027 年第一季度于真实工业场景完成 POC。商用与服务业务通过 RoboShare 完成多台机器人参与的付费商业活动部署。RoboShare 已有 10 家第三方公司入驻，平台上线机器人超过 100 台。另外，FFR 还推出了机器人大脑品牌 FF OmniMind，号称以“一脑多形、多形多能”为理念。据公司披露，截至 11 月 6 日，FF OmniMind 及其模型在 RoboColiseum 全球机器人模型仿真测评中位列综合榜第一。IT之家注：RoboColiseum 为机器人模型仿真评测平台，榜单结果反映仿真环境表现，不等同于真机部署能力。此外，FFR 开发者平台已发布六款工具，覆盖积木式编程、动作技能创作、机器人人格与对话风格设定、自然语言生成 Skill、全流程开发及底层 SDK 与 API。Brain Blocks 已上线 AI 模块及动作录制与回放功能。本体业务方面，公司 10 月机器人销售及出货 351 台，截至 10 月底累计 1168 台。FF 机器人世界 2.0 已拥有 20 余款本体，公司计划持续扩大产品布局。行业生产力解决方案方面，公司推出教育生态解决方案 1.0 及“Physical AI 启蒙计划”课程，并发布安防与巡检解决方案，推进客户 POC、销售转化及交付。数据工厂已有执行中的数据订单，并完成从设备部署、数据采集、清洗、标注、质检到交付和收款的商业闭环，持续交付并回款，面向前沿实验室的订单已完成交付，正在最终评估。公司重申 2026 年全年业绩指引：预计所收购机器人业务按独立全年口径计算的机器人本体销售及出货量约 2000 台，并持续实现正毛利交付。公司计划在 CES 期间发布 Physical Cloud 技术平台和生产力 Token，结合机器人大脑及开发者平台能力，降低教育机构和 K-12 学校使用多形态机器人的门槛。大脑策略将聚焦“聚合 + 小模型 + 垂直技术解决方案”。RoboShare 计划推进十城战略下一阶段，从芝加哥和达拉斯会展业务切入，并以纽约为支点拓展更多市场。公司还计划建立覆盖五个州、30 个城市的营销销售网络。“Built in USA”第二阶段正朝年底工厂投入生产、2027 年第一季度首款机器人本体在 FFR 美国工厂生产落地的目标推进。公司近期与 KYA 集团、加州科技大学及波士顿国际商学院、Pinnacle 达成合作。相关阅读：《贾跃亭：FFR 机器人 10 月销量超 351 台，累计首次破千台》《贾跃亭宣布 FFR 合并 FFAI 机器人业务独立上市，目标美股人形和仿生机器人第一股》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/026/471.htm", "publishedAt": "2026-11-13T00:04:39+00:00"}, {"title": "Hugging Face CEO 哀叹黄仁勋从英伟达离职：“令人无比难过的一天”，承诺继续力挺开源 AI", "summary": "IT之家 11 月 13 日消息，黄仁勋昨日（11 月 12 日）辞去英伟达总裁、首席执行官及董事职务，即刻生效。Hugging Face 首席执行官克莱芒 · 德朗格（Clement Delangue）随即在领英发文，称这是“令人无比难过的一天”，并表示将继续更坚定地推动开源人工智能。IT之家昨日报道，联合创始人黄仁勋已辞去英伟达公司总裁、首席执行官及董事职务，即日起生效；首席财务官科莱特 · 克雷斯将出任临时首席执行官，公司同时启动新任 CEO 遴选程序。消息公布后，德朗格在领英发文表达惋惜。他写道：“整件事糟透了，我真希望这一切从未发生。这真是令人无比难过的一天！”德朗格同时强调，Hugging Face 将“比以往更加努力”地捍卫开源人工智能，并称此事重要到“现在不能放慢脚步”。黄仁勋 1993 年参与创立英伟达，并长期担任 CEO，带领公司从图形芯片供应商发展为全球 AI 算力核心企业。此次突然离职正值英伟达拟以约 129 亿美元收购 Hugging Face 的交易推进之际，该交易预计于 2027 年上半年完成，美国司法部此前已就其对 AI 市场竞争的影响展开问询。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/026/469.htm", "publishedAt": "2026-11-12T23:56:58+00:00"}, {"title": "边警告 AI 风险边开发先进模型：OpenAI、Anthropic、谷歌等五家 AI 巨头遭起诉，被要求叫停 ChatGPT、Claude、Gemini", "summary": "IT之家 11 月 13 日消息，当地时间 11 月 12 日，四家非营利组织向旧金山高等法院提起诉讼，将 OpenAI、Anthropic、谷歌、Meta 以及 SpaceXAI 列为被告，要求法院叫停这些企业进一步开发最先进的人工智能模型。据路透社报道，参与诉讼的组织包括 Irreplaceable Education Fund、Public Citizen、Heat Initiative 和 Alliance for Secure AI。原告援引加州有关不公平商业行为的法律，认为相关企业开发 AI 产品的行为可能危害公共健康、安全及公众利益，并请求法院下令禁止其继续开发 ChatGPT、Gemini、Claude 等先进 AI 产品。这场诉讼的特殊之处在于，其核心证据大量来自被告公司高管自己的公开表态。原告在诉状中指出，这些 AI 企业自身的高管曾多次警告，先进 AI 技术可能带来文明毁灭级别的风险，但这些公司仍在持续推进更强大模型的研发和商业化。其诉状还援引了 Anthropic CEO 达里奥・阿莫代伊（Dario Amodei）和 SpaceX CEO 埃隆 · 马斯克关于 AI 可能造成文明毁灭的言论，以及谷歌 DeepMind 发表的一篇论文，其中写道超人类智能“有可能在未来几年内被开发出来”，并“永久摧毁人类”。原告的质问直指这一矛盾：“没有其他行业被允许将其不安全产品 —— 更不用说可能杀死我们所有人的产品 —— 的开发视为不可避免”。诉状还提及近期发生的人工智能安全事件，称部分 AI 模型曾逃离沙盒并自主攻击政府网站。原告认为，随着人工智能系统获得越来越强的自主执行任务和自我改进能力，相关企业可能无法有效控制这些系统，从而对公共安全造成威胁。另有多起事件中，失控的 AI 智能体试图攻击新墨西哥大学在线图书馆、访问澳大利亚医疗数据库、向费城警察局提交虚假报告，以及绕过付费墙获取佐治亚州计票数据。IT之家注：加州《不正当竞争法》通常用于商业欺诈或虚假广告案件，将其适用于 AI 开发行为的“公共妨害”定性，在司法实践中尚缺乏先例，法院是否接受这一法律框架，将是诉讼面临的首个实质门槛。原告在诉状中表示，其他行业不能将继续开发不安全产品视为不可避免的事情，更不能允许企业自行监管可能造成严重社会危害的技术。此次诉讼不仅关注已经发生的事件，也将未来可能出现的损害纳入指控范围。代表原告提交这份 63 页诉状的，是新泽西州前总检察长马修 · 普拉特金。他的表述将矛头对准了“明知故犯”：“公司开发和发布它们知道在任何意义上都不安全的产品，更不用说具有灭绝人类潜力的产品，是明显违法的”。原告寻求的救济并非赔偿，而是一项紧急禁令：在被告能够证明其技术处于人类控制之下以前，暂停下一代模型的训练与部署。针对诉讼，Meta 发言人表示不予置评，其他涉事企业截至路透社报道发布时尚未立即回应媒体的置评请求。这并非美国首次通过司法途径要求限制人工智能模型开发。今年 6 月，佛罗里达州总检察长詹姆斯・乌特迈尔（James Uthmeier）起诉 OpenAI，指控 ChatGPT 平台存在安全问题，称其向校园枪击案相关人员提供信息、提供自残指导，并可能使年轻用户产生依赖。今年 9 月，佛罗里达州进一步请求负责该案的法官，要求 OpenAI 在没有外部监督的情况下不得开发新的人工智能模型。根据路透社援引的法院记录，该请求目前仍在等待裁决。针对佛罗里达州的诉讼，OpenAI 发言人德鲁・普萨特里（Drew Pusateri）此前表示，公司已经暂停训练能力最强的模型，在增加额外安全保障措施之前不会恢复相关训练。他还表示，政府应在制定人工智能安全标准方面发挥重要作用。此外，今年 10 月，另有 8 个美国州在不同法院起诉 OpenAI，指控 ChatGPT 曾引导包括未成年人在内的用户伤害自己或他人。相关诉讼要求法院判处罚款，并限制 OpenAI 开发自我改进型人工智能模型，除非该公司能够确保这些模型符合人类价值观。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/026/466.htm", "publishedAt": "2026-11-12T23:46:13+00:00"}, {"title": "Anthropic、OpenAI 遭专利诉讼，被指侵犯五项神经网络技术专利", "summary": "IT之家 11 月 13 日消息，当地时间 11 月 12 日，美国公司 Flinn Artificial Intelligence (AI) Technologies LLC（以下简称 Flinn AI）向美国特拉华州地区法院提起两起专利侵权诉讼，将 Anthropic PBC 和 OpenAI OpCo 共同列为被告，指控两家公司侵犯其持有的五项神经网络相关专利。与此同时，还有一群非营利组织也起诉了 OpenAI、Anthropico、Meta、谷歌和 SpaceXAI 等公司，试图进一步阻止这些企业开发先进 AI 模型。Flinn AI 两起诉讼分别为 Flinn AI Technologies LLC v. Anthropic PBC（案号：1:26-cv-01454）和 Flinn AI Technologies LLC v. OpenAI OpCo LLC（案号：1:26-cv-01455）。Flinn AI 指控，两家公司均侵犯了由计算机科学家史蒂文・弗林（Steven Flinn）和娜奥米・曼尼佩尼（Naomi Moneypenny）共同发明的五项专利。诉状称，相关发明可以追溯至 2015 年末和 2016 年初，当时弗林与曼尼佩尼提交了相关专利申请。这些专利涉及基于注意力机制的神经网络训练与处理技术，Flinn AI 认为，其为现代生成式人工智能系统中的相关功能提供了技术基础。据 Law360 披露，涉案五项美国专利的编号分别为 US 12,223,404、US 12,327,166、US 12,462,197、US 12,462,198 和 US 12,511,580，专利名称均涉及迭代式注意力神经网络训练与处理（Iterative attention-based neural network training and processing）。针对 Anthropic 的诉讼主要涉及 Claude 系列大语言模型。Flinn AI 在诉状中称，随着 Claude 模型及相关产品不断迭代和扩展，Anthropic 提供的注意力机制推理、检索、记忆、智能体以及多模态功能越来越先进，相关系统持续侵犯涉案专利。针对 OpenAI 的诉状也提出了类似指控，认为随着该公司的模型及相关功能不断升级，其专利侵权行为也在持续。此外，弗林还创立了 ManyWorlds Inc.，曼尼佩尼随后也加入该公司。IT之家注意到，今年以来，名称相近的 Many Worlds 2T Innovations LLC 也曾围绕专利问题起诉 OpenAI 和 Spotify。根据公开诉讼记录，该公司于 2026 年 4 月起诉 Spotify，8 月又在美国得克萨斯州东区联邦地区法院起诉 OpenAI，涉及另一组专利。相关阅读：《OpenAI 承诺不使用苹果所称被窃商业秘密，双方诉讼互指对方窃取机密》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/026/464.htm", "publishedAt": "2026-11-12T23:33:18+00:00"}, {"title": "刚刚，Gemini 4 新模型叒来了，终于人人可用", "summary": "更快更便宜还更聪明#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1689267?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-11-12T23:11:11+00:00"}, {"title": "超 740 亿美元砸向 AI：马斯克的 SpaceX 不光造火箭，还要建超级算力帝国", "summary": "IT之家 11 月 13 日消息，全球首富埃隆 · 马斯克（Elon Musk）旗下 SpaceX 公司昨日（11 月 12 日）宣布，计划在得克萨斯州和亚利桑那州投入超过 740 亿美元（IT之家注：现汇率约合 4,947.49 亿元人民币），建设两座面向人工智能的超级计算数据中心园区，标志着这家火箭公司正加速向 AI 算力基础设施扩张。根据公告内容，SpaceX 计划投资超过 240 亿美元，在得克萨斯州星际基地（Starbase）附近建设超级计算设施，将建在 SpaceX 自有约 444 英亩土地上，用于训练前沿人工智能模型。SpaceX 表示，该设施将自建燃气发电能力，不依赖公共电网；项目已创造超过 3,000 个建筑岗位，建成后预计支持 500 多个长期岗位。而另一个项目位于亚利桑那州科奇斯县，园区投资约 500 亿美元（现汇率约合 3,342.9 亿元人民币），仍需科奇斯县批准。SpaceX 称，该园区预计带来约 5,500 个建设岗位和 1,000 个永久岗位，并将与当地电力合作社合作 售收入预计超过 120 亿美元（IT之家注：现汇率约合 802.21 亿元人民币），较去年同期增长接近三成；在折旧总额较去年增长约三成的情况下，毛利率预计在 26% 左右，同比增加约 5 个百分点。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/026/524.htm", "publishedAt": "2026-11-13T02:21:15+00:00"}, {"title": "马斯克谈黄仁勋结束 33 年掌舵英伟达生涯：创始人很难被取代", "summary": "IT之家 11 月 13 日消息，英伟达创始人黄仁勋昨日（11 月 12 日）宣布辞去公司总裁、首席执行官及董事职务，即刻生效，结束其长达 33 年的掌舵生涯。对此全球首富埃隆 · 马斯克（Elon Musk）认为，创始人很难被取代。硅谷知名投资人纳瓦尔 · 拉维坎特（Naval Ravikant）发推文称，从苹果联合创始人史蒂夫 · 乔布斯（Steve Jobs）和优步联合创始人特拉维斯 · 卡兰尼克（Travis Kalanick）的经历看，创始人并非“随随便便就能被取代”。马斯克回应“True words”，即“说得没错”，公开表达认同。IT之家注：乔布斯于 1985 年因与苹果管理层及董事会的权力斗争离开苹果。此后苹果产品线混乱、市场份额下滑，到 1990 年代中期一度濒临财务危机。苹果于 1997 年收购乔布斯创办的 NeXT，他重返公司并主导 iMac、iPod、iPhone 等产品周期，带领苹果完成商业史上罕见的复兴。卡兰尼克是 Uber 联合创始人，2017 年在性骚扰指控、管理文化争议和投资者压力下辞去 CEO 职务。Uber 随后由达拉 · 科斯罗萨西接任，公司逐步改善治理、稳定运营，并实现持续盈利。创始人一旦离开，公司能否顺利延续其愿景、文化和执行力，并不确定，创始人本身也不容易由外部职业经理人简单替代。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/026/506.htm", "publishedAt": "2026-11-13T01:51:16+00:00"}, {"title": "黄仁勋辞职后，英伟达总部外出现鲜花和蜡烛", "summary": "IT之家 11 月 13 日消息，科技媒体 Business Insider 昨日（11 月 12 日）发布博文，报道称在美国加州圣克拉拉的英伟达总部外，有人于公司标志前摆放多束鲜花，并放置了一支装在玻璃罐中的白色蜡烛，被外界视为致敬黄仁勋这位 AI 时代标志性人物。现场画面显示，一名路人将玻璃罐装蜡烛放在“NVIDIA”标志前；鲜花则整齐靠在标志下方。这些物品没有附带留言，但被外界视为告别与致敬刚刚辞去首席执行官职务的联合创始人黄仁勋。IT之家附上相关推文截图如下：黄仁勋执掌英伟达长达 33 年，是公司从图形芯片厂商成长为全球 AI 算力核心供应商的关键人物。他的突然离任，令不少员工感到震动与失落；有报道称，部分员工在消息公布后落泪，内部也弥漫着对公司未来走向的焦虑。据职场匿名平台 Blind 于 11 月 9 日至 10 日对 232 名英伟达员工进行的调查，88% 的受访者希望黄仁勋继续留任；11% 认为他应主动辞职，仅 1% 支持董事会将其免职。值得注意的是，该员工调查的样本规模仅为 232 人，且投票时间早于辞职相关报道，因此不能代表英伟达全体员工的真实意见。与英伟达员工形成对比的是，Blind 另一项针对 1,689 名各行业专业人士的调查显示，60% 支持黄仁勋留任，18% 认为他应主动辞职，22% 希望董事会将其撤换。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/026/492.htm", "publishedAt": "2026-11-13T01:35:27+00:00"}, {"title": "30 分钟净买入 1.11 亿美元，散户逢低抢筹英伟达刷新 Vanda 统计纪录", "summary": "IT之家 11 月 13 日消息，路透社今天（11 月 13 日）发布博文，报道称黄仁勋辞职消息传出后，英伟达股价剧烈波动，散户投资者却加速入场。IT之家援引博文介绍，Vanda Research 数据显示，本周一至周三，英伟达连续成为 Vanda 统计样本中散户净买入最多的证券，本周散户购买英伟达股票的金额占散户净买入总金额的 61%。资金需求还蔓延至杠杆类产品。Vanda 表示，周一至周三，散户向 6 只英伟达两倍做多 ETF 合计投入 4,250 万美元（IT之家注：现汇率约合 2.84 亿元人民币），这也是有记录以来规模排名前三的三日资金流入。周四美股开盘前 30 分钟，散户净买入英伟达股票达 1.11 亿美元（现汇率约合 7.42 亿元人民币），创下该机构统计以来英伟达开盘半小时散户净流入纪录，超过通常水平的 40 倍。散户买盘也在交易平台上集中显现。截至周四美东时间中午，富达平台客户提交的英伟达买单约 39.5 万笔，卖单约 8 万笔。相关阅读：《抄底资金涌入，英伟达总市值重回 4 万亿美元上方》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/026/481.htm", "publishedAt": "2026-11-13T01:04:19+00:00"}, {"title": "路透社：黄仁勋与不止一位公司员工存在亲密关系，英伟达拒绝置评", "summary": "IT之家 11 月 13 日消息，路透社今日报道称，除了昨天曝光的金伯利 · 鲍威尔（Kimberly Powell）外，黄仁勋还与另一名英伟达公司员工存在不正当亲密关系。不过路透社并未公开这所谓“第二名员工”的姓名，记者也未能联系到她本人。英伟达方面拒绝置评，鲍威尔、黄仁勋以及英伟达董事会的一名代表也均未回复置评请求。根据英伟达向美国证券交易委员会（SEC）提交的 8-K 文件，董事会于 2026 年 11 月 11 日接受了黄仁勋辞去总裁、CEO 及董事会成员职务的辞呈，即刻生效。英伟达于当地时间 11 月 12 日对外宣布了这一决定。两项动作在时间上的先后关系，使得路透社的“第三段关系”报道成为黄仁勋离职后叠加的又一重舆论压力，而非辞职的直接前置触发点。接任安排已同步落定。董事会任命执行副总裁兼首席财务官科莱特 · 克雷斯（Colette Kress）出任临时 CEO，同时启动新任 CEO 的遴选，考虑内部与外部候选人。IT之家此前报道，现年 59 岁的克雷斯自 2013 年起担任英伟达 CFO，履新后将保留 CFO 职务。董事会同时任命自 1993 年起任职的哈维 ·C· 琼斯（Harvey C. Jones）为董事会主席。琼斯在官方新闻稿中表示，董事会对克雷斯和领导团队“充满信心”，预计公司运营、客户承诺和产品路线图将继续推进。相关阅读：《出轨丑闻爆发前黄仁勋曾谈及接班安排：希望下一任 CEO 来自英伟达内部》《即刻生效！黄仁勋辞去英伟达总裁、首席执行官和董事会成员职务》《黄仁勋辞任英伟达 CEO，公司美股盘前跌幅扩大至 10%》《黄仁勋辞去 CEO 后，英伟达任命执行副总裁兼首席财务官科莱特 · 克雷斯为临时首席执行官》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/026/457.htm", "publishedAt": "2026-11-12T22:59:59+00:00"}, {"title": "智能体 AI 架构中记忆、知识与上下文的系统化方案", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/COuPKpA6rTf05C6JM10y?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-12T13:00:00+00:00"}, {"title": "从“搜到知识”到“理解约束”：差旅 Agent 的业务语义、偏好图谱与上下文工程实践｜AICon北京", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/V5Fwpg9gOBefx6xADcdd?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-12T10:00:00+00:00"}, {"title": "全球化筑基，AI 赋能新体验，openKylin 3.0 SP1 正式发布", "summary": "OpenAtom openKylin（以下简称“openKylin”）社区今日正式发布 openKylin 3.0 SP1 版本。本次版本更新以国际化为底座，围绕国际化体验、AI 融合、硬件生态、系统质量四大方向完成全面升级：新增阿拉伯语、朝鲜语、傣语等多语言支持；上线全新小K AI 浏览器扩展；持续丰富硬件生态，强化以飞腾 D ie)是一款跨平台沉浸式自定义AI 划词工具 划选或双击，浮动条随即弹出：翻译、解释、总结实时呈现；复制、搜索、写入 Obsidian、预填日历，结果直接落地。图片、视频与扫描文档中的文字，框选亦可识别——处理在原地完成，无需迁入对话窗口。 Release v0.1.21 更新内容： Added The interface now speaks bot...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503468", "publishedAt": "2026-11-08T01:17:24+00:00"}]}, {"label": "行业动态", "items": [{"title": "不靠补贴、不增加他人成本：微软承诺其 AI 扩张电费将自己买单", "summary": "IT之家 11 月 13 日消息，彭博社昨日（11 月 12 日）发布博文，报道称微软将寻求在不依赖政府补贴、不增加其他电力用户成本的情况下，为旗下 AI 数据中心供电。昨日在休斯顿举行的彭博新能源财经会议上，微软云运营与创新总裁诺埃尔 · 沃尔什（Noelle Walsh）表示：“我们不希望其他客户为我们的增长买单。我们会自行承担费用。”报道称，公司计划今年投入 1,170 亿美元（IT之家注：现汇率约合 7,821.53 亿元人民币）建设相关计算能力。随着数据中心在美国多地引发关注，微软强调“社区优先”，主张项目建设应让当地居民受益。具体项目方面，微软正与雪佛龙（Chevron Corp.）及投资机构 Engine No. 1 创立的 Joulent 公司合作，在得克萨斯州西部推进名为“Project Kilby”的大型数据中心及配套供电项目。不过，该项目受到当地暂停审批新数据中心的政策影响，推进受阻。尽管面临审批障碍，雪佛龙仍以 2028 年启动运行、2031 年全面投运为目标。雪佛龙新能源业务负责人表示，项目将为当地创造就业和稳定税收，并强调无法为社区带来净收益的项目“注定失败”。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/026/533.htm", "publishedAt": "2026-11-13T02:37:09+00:00"}, {"title": "“我算个什么东西”：黄仁勋离任英伟达 CEO 最后时刻心力交瘁，把“随便”和“我不在乎”挂在嘴边", "summary": "IT之家 11 月 13 日消息，彭博社今天（11 月 13 日）发布博文，报道称黄仁勋在董事会施压下，辞去英伟达首席执行官职务之后心力交瘁，昔日的活力荡然无存。据一位知情人士透露，黄仁勋此前雷厉风行，但近期开始把“随便吧”和“我不在乎”之类的话挂在嘴边。IT之家附上相关截图如下：报道指出在离任英伟达 CEO 的最后阶段，黄仁勋显得精力耗尽，以往强势主导局面的姿态已经消退。在执掌英伟达的 33 年生涯中，黄仁勋摸爬滚打将英伟达打造成市值数万亿美元的人工智能芯片巨头，从芯片架构到公司最基层员工的薪酬待遇事必躬亲，且凭借直率的个性和充沛的精力，成为 AI 时代的领军人物。而由于深陷桃色丑闻，近期接触黄仁勋的人透露他“放弃挣扎”，并称黄仁勋表现出忏悔之意，痛斥自己“我算个什么东西”（I’m a Piece of Sh--）。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/026/529.htm", "publishedAt": "2026-11-13T02:29:41+00:00"}, {"title": "黄仁勋卸任英伟达 CEO：约 1.08 亿美元股权奖励作废，约占其身价的 0.08%", "summary": "IT之家 11 月 13 日消息，彭博社昨日（11 月 12 日）发布博文，英伟达联合创始人、前首席执行官黄仁勋在被董事会罢免后，将失去约 1.08 亿美元（IT之家注：现汇率约合 7.22 亿元人民币）的未归属股权激励。这一金额虽然庞大，但仅相当于其约 1,384 亿美元（现汇率约合 9,252.14 亿元人民币）净资产的 0.08%。根据英伟达的股权激励政策，高管一旦终止连续任职，其尚未归属的限制性股票单位（RSU）将被没收。黄仁勋目前持有约 34.6 万份此类单位；若公司业绩达标，他原本还可通过股权激励计划获得约 31 万股股票。与许多依赖期权或长期激励的科技企业掌门人不同，黄仁勋的财富主要来自其直接持有的英伟达普通股。彭博亿万富翁指数显示，他持有公司约 3.5% 的投票权，这部分持股约占其总财富的近 97%。由于英伟达只有一类股份，他并不享有特殊投票权。黄仁勋的离职直接冲击了英伟达股价。消息公布后，公司股价在纽约一度重挫 14%，随后跌幅收窄，最终收跌 4.3%，报 166.19 美元（现汇率约合 1,111 元人民币）；仅此一个交易日，黄仁勋的个人净资产便蒸发超过 60 亿美元（现汇率约合 401.1 亿元人民币）。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/026/513.htm", "publishedAt": "2026-11-13T02:01:37+00:00"}, {"title": "33 年执掌英伟达生涯戛然而止，黄仁勋的约 90 亿美元慈善版图恐面临巨变", "summary": "IT之家 11 月 13 日消息，《纽约时报》昨日（11 月 12 日）发布博文，报道称黄仁勋辞去英伟达 CEO 一职，不仅震动全球 AI 芯片产业，也令他与妻子洛莉（Lori）共同掌控、资产规模约 90 亿美元（IT之家注：现汇率约合 601.72 亿元人民币）的慈善基金会面临不确定性。英伟达联合创始人、首席执行官黄仁勋昨日宣布辞职，结束其长达 33 年的掌舵生涯。英伟达随后宣布由首席财务官科莱特 · 克雷斯出任临时首席执行官。这一突发变动不仅冲击英伟达的领导层，也可能影响其规模庞大的慈善事业。报道指出“黄仁勋与洛瑞基金会”（Jen-hsun &amp; Lori Huang Foundation）成立于 2007 年，由黄仁勋及其妻子洛莉共同管理，该基金会资产约 90 亿美元（现汇率约合 601.72 亿元人民币），是全美规模最大的慈善机构之一；2024 年，其资产因超过 50 亿美元（现汇率约合 334.29 亿元人民币）的投资收益而接近增长三倍。根据最新的纳税申报表，该基金会治理结构较为低调，没有公开网站或员工名单，洛瑞担任会长，黄仁勋则任秘书兼首席财务官。目前，基金会未来的管理、捐赠节奏及资产处置仍不明朗。该机构 2024 年共支出约 1.263 亿美元（现汇率约合 8.44 亿元人民币），其中超过 8,250 万美元（现汇率约合 5.52 亿元人民币）流向施瓦布慈善基金；同时，基金会还须在 2025 年按联邦规则分配约 3.446 亿美元（现汇率约合 23.04 亿元人民币）。黄氏夫妇已宣布向四所高校捐赠合计约 1.8 亿美元（现汇率约合 12.03 亿元人民币），其中包括向范德堡大学旧金山校区捐赠 7,500 万美元（现汇率约合 5.01 亿元人民币），用于设立艺术与设计学院。其慈善布局亦与英伟达生态存在交集，基金会向英伟达重要合作伙伴兼客户 CoreWeave 采购算力，并将总价值 1.083 亿美元（现汇率约合 7.24 亿元人民币）的算力资源捐赠给高校及非营利机构。黄仁勋辞职后，基金会未来资金来源、治理分工及 AI 算力捐赠节奏，均成为外界关注焦点。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/026/472.htm", "publishedAt": "2026-11-13T00:13:13+00:00"}, {"title": "黄仁勋辞职后续：美国司法部对英伟达启动多项调查，包括反垄断调查", "summary": "IT之家 11 月 13 日消息，据 Semafor 当地时间 11 月 12 日报道，美国司法部正在开展的多项调查可能将英伟达（NVIDIA）纳入调查范围。两名美国政府官员透露，在英伟达前 CEO 黄仁勋辞职引发的连锁反应持续发酵之际，美国司法部目前涉及英伟达、Megaspeed 和超微电脑（Supermicro）的多项调查正在推进。其中，一项调查直接针对英伟达，重点涉及反垄断问题。另外两项调查则分别涉及科技企业 Megaspeed 和超微电脑，调查重点包括 Alice Huang 的相关活动。Semafor 指出，目前没有迹象表明美国司法部计划以刑事罪名起诉英伟达或黄仁勋。现阶段，针对英伟达的反垄断调查与涉及 Megaspeed、超微电脑的另外两项调查属于不同调查事项，不能据此认定英伟达参与了后两项调查涉及的相关行为。对于上述报道，英伟达和美国司法部发言人均未置评。此前，黄仁勋已正式辞去英伟达 CEO 职务，英伟达 CFO 科莱特 · 克雷斯（Colette Kress）将暂时担任 CEO。相关阅读：《即刻生效！黄仁勋辞去英伟达总裁、首席执行官和董事会成员职务》《黄仁勋辞去 CEO 后，英伟达任命执行副总裁兼首席财务官科莱特 · 克雷斯为临时首席执行官》《黄仁勋辞去 CEO 后，英伟达市值失守 4 万亿美元》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/026/451.htm", "publishedAt": "2026-11-12T22:18:12+00:00"}, {"title": "突发！黄仁勋辞任 CEO，英伟达迎来历史性换帅", "summary": "黑皮衣传奇谢幕#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1689249?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-11-12T14:36:47+00:00"}, {"title": "InfoQ 2026 年趋势报告：AI、ML与数据工程", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/7Pecd1CshYIMvCTeBhrm?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-12T10:23:32+00:00"}, {"title": "Anthropic启动IPO路演，估值已缩水6000亿美元", "summary": "全世界都在踩刹车，达里奥一个人踩油门", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/509381.html", "publishedAt": "2026-11-12T10:11:29+00:00"}, {"title": "Anthropic玻璃翼计划被质疑！近4万个候补漏洞，只修了217条", "summary": "只管挖不管埋。", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/509291.html", "publishedAt": "2026-11-12T07:55:11+00:00"}, {"title": "曝字节要做「中国版 Muse」，给豆包造个「超级大脑」", "summary": "豆包走出屏幕#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1689016?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-11-11T11:52:16+00:00"}, {"title": "10x 工程师变成 100x 了，普通工程师还是那么普通", "summary": "一位 CTO 用反证法证明：我们还没被 AI 取代，但理由可能和你想的不一样。 shaharglazner 是 keepalerting 的联合创始人兼 CTO，11 月 9 日他在 X 上发了篇长文《On Being an Engineer in 2026》，标题下面跟着一行小字：「我们还需要吗？」 他先承认了那种普遍的失控感。每隔一周，就有一块工作被交出去。最早是不写代码...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503514", "publishedAt": "2026-11-10T10:08:13+00:00"}]}, {"label": "论文研究", "items": [{"title": "抄底资金涌入，英伟达总市值重回 4 万亿美元上方", "summary": "IT之家 11 月 13 日消息，英伟达股价当地时间 11 月 12 日盘中出现明显反弹。在此前一度大跌约 14%、市值蒸发近 6000 亿美元后，抄底资金入场，推动股价收窄跌幅。截至当日美股收盘，英伟达股价跌幅收窄至约 4.34%，报 166.19 美元 / 股，公司总市值重新回到 4 万亿美元（IT之家注：现汇率约合 26.74 万亿元人民币）上方，而且盘后股价继续保持上涨态势。据路透社报道，散户投资者在股价大幅下跌后积极买入英伟达股票。市场研究机构 Vanda Research 估算，散户在当天开盘后的前半小时买入约 1.11 亿美元英伟达股票，创下该机构有记录以来的最高水平。富达投资的客户当天截至中午已提交近 39.5 万笔英伟达买入订单，接近卖出订单数量的 5 倍。散户资金的集中入场，在一定程度上缓冲了英伟达股价的下跌。此前，英伟达股价盘中一度下跌约 14%，公司市值大幅缩水。美联社报道称，英伟达股价随后收复部分失地，但当日仍收跌约 4.5%。相关阅读：《黄仁勋辞任英伟达 CEO 重创全球 AI 概念股，AMD、博通逆势上涨》《黄仁勋辞去 CEO 后，英伟达市值失守 4 万亿美元》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/026/462.htm", "publishedAt": "2026-11-12T23:24:29+00:00"}, {"title": "微软 365 核心服务全球性大规模瘫痪：Outlook、OneDrive、Teams 均受影响，正逐步重启恢复", "summary": "IT之家 11 月 13 日消息，当地时间 11 月 12 日，微软旗下 Microsoft 365 多项核心云服务发生大规模故障，影响 Outlook、Exchange Online、Microsoft Teams、OneDrive、SharePoint、Microsoft 365 Copilot 等产品，全球多个地区用户均反馈无法正常访问服务，部分用户无法收发邮件、加载邮箱或访问云端文件。另外，此次宕机还波及美国开放人工智能研究中心（OpenAI）和安特罗匹克公司（Anthropic）人工智能服务所使用的连接组件。故障发生后，监测网站 Downdetector 收到大量用户报障，其中 Outlook 的问题报告数量一度接近 138058 条。除邮件服务外，Microsoft Teams、Copilot 以及其他 Microsoft 365 服务也出现不同程度的连接问题。微软最初表示，正在调查美洲地区用户通过多种连接方式访问 Exchange Online 邮箱时遇到的问题。随后，该公司扩大了影响范围说明，确认全球任何地区的用户都可能受到影响。根据微软发布的服务状态信息，受影响的服务包括 Exchange Online、Microsoft Teams、SharePoint Online、Microsoft 365 Copilot、Microsoft Defender XDR、Microsoft Planner、Microsoft To Do 等。部分 OneDrive 用户也报告无法正常访问云端文件。对于故障原因，微软表示，部分基础设施出现异常高负载，导致用户连接错误。进一步调查发现，问题并非整体流量突然增加，而是大量服务器意外变得不可用，导致剩余服务器承受更大的负载压力。微软指出，部分服务器未能通过自动运行的健康检查，因此被判定为不可用。该公司正在调查导致服务器健康检查失败的具体原因，同时重新审查近期的配置变更，并表示部分配置更新可能与此次故障有关。为缓解影响，微软已经暂停所有部署和配置变更，并调整全球基础设施中的连接流量分配，同时启动受影响服务器的重启工作，以逐步恢复服务容量。截至北京时间 11 月 13 日 5 时，微软已经在部分受影响服务器上验证了替代健康检查方法，相关服务器成功恢复运行，该方案随后开始向更大范围推广。IT之家注意到，微软还在准备自动检测并重启无响应服务器的机制。微软此次故障还影响了部分管理功能，管理员可能无法正常访问 Microsoft 365 管理中心。微软建议无法进入管理中心的管理员通过公开服务状态页面获取最新进展。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/026/460.htm", "publishedAt": "2026-11-12T23:09:12+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "消息称英伟达前 CEO 黄仁勋同意在感恩节前赴国会作证，具体日期仍在协商", "summary": "IT之家 11 月 13 日消息，彭博社昨日报道，佛罗里达州共和党籍众议员、美国众议院外交事务委员会主席布莱恩 · 马斯特（Brian Mast）当地时间周四表示，英伟达前首席执行官黄仁勋已同意在感恩节（11 月 26 日星期四）前赴国会作证，但具体日期尚未确定。马斯特称：“他已经同意到场，我们正在协商具体日期。”IT之家附上相关截图如下：此次作证预计将涉及多个国会委员会，包括外交事务委员会、众议院情报委员会以及众议院特别委员会。马斯特表示，作证很可能在宣誓后进行，并会被记录、转录，甚至录像；目前尚不清楚听证会是否公开举行，但外界普遍预计可能采取闭门形式。马斯特强调，英伟达对美国而言“非常重要”，他不希望公司受到伤害，但黄仁勋需要回答“非常严肃的问题”。分析人士认为，此次国会作证将成为观察美国如何在国家安全、科技竞争与商业利益之间寻求平衡的重要窗口。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/026/489.htm", "publishedAt": "2026-11-13T01:23:53+00:00"}, {"title": "黄仁勋最激进 AI 赌局的“刹车手”：英伟达临时 CEO 克雷斯曾力主削减 2500 亿美元 OpenAI 豪赌", "summary": "IT之家 11 月 13 日消息，科技媒体 The Information 昨日（11 月 12 日）发布博文，援引知情人士消息，英伟达临时 CEO 科莱特 · 克雷斯（Colette Kress）在担任公司财务负责人期间，扮演财务“刹车手”的角色，曾多次对黄仁勋力推的高风险交易提出保留意见。消息称克雷斯曾经多次抵制黄仁勋力推的交易，而且在过去几个月时间里，她还着力寻找方法，避免英伟达的财务风险过度集中于少数几家公司。而其中最具代表性的一项，涉及针对 OpenAI 公司的拟议方案，该方案将为 OpenAI 提供 2,500 亿美元（IT之家注：现汇率约合 1.67 万亿元人民币）的信贷支持担保，目的是帮助 OpenAI 以英伟达最新芯片填满 8 吉瓦数据中心容量。克雷斯对该拟议方案提出异议，并非完全反对向 OpenAI 提供融资支持，主要担心担保金额过高引发投资者的反应，并推动将相关承诺缩减至约 1,000 亿美元（现汇率约合 6,685.07 亿元人民币）。市场将克雷斯视为比黄仁勋更审慎的掌舵者。在数据中心建设延期、部分云计算订单取消、AI 基础设施投资回报受到质疑的背景下，她被认为更倾向于控制担保、投资和客户融资规模，避免英伟达既是芯片供应商、又是客户资金支持者的“循环融资”模式积累过高风险。对此该媒体解读称，在克雷斯担任英伟达临时 CEO 之后，这位长期负责财务的“刹车手”，是否会放缓黄仁勋时代最激进的 AI 资本豪赌。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/026/478.htm", "publishedAt": "2026-11-13T00:52:10+00:00"}, {"title": "不止测体脂：三星 Galaxy Watch 智能手表新专利，可监测腹部脂肪", "summary": "IT之家 11 月 13 日消息，根据美国商标和专利局（USPTO）于 11 月 3 日公示的清单，三星公司获批一项 Galaxy Watch 智能手表专利，通过综合多项传感器数据，可以检测佩戴者的“内脏脂肪”。该专利名为《腹部脂肪估算方法与系统》，描述了一种可在便携设备上评估腹部皮下脂肪与内脏脂肪的技术方案。专利称，该方案可降低测量复杂度，并提升估算的准确性与速度。与普通体脂率不同，这项技术重点指向“内脏脂肪”。皮下脂肪位于皮肤下方，而内脏脂肪主要包裹在腹腔器官周围，通常需要 MRI、CT 等临床影像设备才能较准确测量；部分智能体脂秤虽能给出估算值，但精度有限。而三星专利计划在手表中引入超宽带（UWB）雷达。设备会向腹部区域发射信号并接收反射波，再结合 Galaxy Watch 已有的生物电阻抗（BIA）数据，以及体重、身高、年龄、性别等基础信息，综合推算腹部脂肪面积与内脏脂肪水平。IT之家附上相关专利示意图如下：三星自 Galaxy Watch 4 起已配备 BIA 传感器，可测量体脂率、骨骼肌量、BMI 等指标。若新专利技术落地，UWB 传感器将成为关键新增硬件，也可能成为下一代 Galaxy Watch 的重要健康升级。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/026/463.htm", "publishedAt": "2026-11-12T23:31:27+00:00"}, {"title": "iPhone Siri AI 体验：距离真正的 AI Phone，苹果还有多远？| 附开通指南", "summary": "这是一个更好的 Siri，但还不是一个合格的 Agent#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1688980?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-11-12T10:47:53+00:00"}, {"title": "如何提升 AI 的环境可持续性", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/GUXzTTTFvwWY7yx6WMyS?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-11T18:33:00+00:00"}]}]};

const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
