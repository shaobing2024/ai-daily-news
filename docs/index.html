资产管理自 2014 年进军韩国市场，一直是韩国的长期投资者，目前管理 120 亿美元（现汇率约合 813.33 亿元人民币）韩国资产，覆盖基础设施、房地产和能源领域。此外，Naver 还计划进一步扩展英伟达基础设施建设规模，最终将达到 1 吉瓦。该公司还计划在今年下半年推出 AI Agent 平台，基于英伟达 Agent Toolkit 打造。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/825.htm", "publishedAt": "2026-07-27T00:17:08+00:00"}, {"title": "中国工程院外籍院士赫尔佐格：AI 下一个突破口是小型智能体协作", "summary": "IT之家 7 月 26 日消息，据央视新闻今日报道，德国国家工程科学院院士、中国工程院外籍院士赫尔佐格荣获 2025 年度中华人民共和国国际科学技术合作奖。近日，赫尔佐格接受总台《高端访谈》栏目专访时谈到人工智能发展，他表示，人工智能领域下一次重大突破绝非单一大型系统，而是众多小型的专业化智能体协同运作。总台记者何岩柯：随着智能体越来越普及，各界对此讨论热烈。您认为人工智能领域下一次重大突破，会诞生于性能极强的单一大模型，还是由多个智能体协同组成的系统？德国国家工程科学院院士、中国工程院外籍院士赫尔佐格：我一直主张发展小型智能体。未来的发展方向绝非单一大型系统，而是众多小型的专业化智能体协同运作。人类之间通过沟通、协作甚至适度竞争，共同创造成果，这是我们早已习惯的模式。智能体也可以复刻这套运行逻辑。这种架构的优势十分突出，适配性极强。我们可以随时移除、新增智能体，落地实操效果远胜于单一大系统。总台记者何岩柯：您是否思考过这样一个问题：人工智能的终极目标是什么？我们应当研发具备人类思维能力的机器，还是创造一种全新的智能形态，用来拓展或是补足人类自身的能力边界？德国国家工程科学院院士、中国工程院外籍院士赫尔佐格：互联网其实已经在补足人类的能力。互联网汇集了全球各类知识，人工智能还能进一步降低人们获取知识的门槛。这会是未来发展目标之一，大语言模型已经初步实现了这一构想，但想要完全落地，还需要大量实践与科研工作。IT之家注意到，2026 年 7 月 8 日，中国国家科学技术奖励大会在人民大会堂举行，德国科学家赫尔佐格荣获 2025 年度中国国际科学技术合作奖，这是中国授予外国科学家的最高科学荣誉。据介绍，赫尔佐格是德国的人工智能专家。1985 年，他创立了首个德国人工智能研发中心，领导了德国第一支人工智能团队。1993 年开始，他在德国不来梅大学担任人工智能教授，其间创立欧洲首个将人工智能技术和 4G、可穿戴计算等先进通信技术结合并开发创新应用的科研机构。2014 年，赫尔佐格受邀来到中国，投身于中国人工智能与城市规划交叉学科的创新建设。自 2015 年起，他担任长三角城市群智能规划协同创新中心首席科学家，为智能规划理论体系建设和中德交流合作作出了卓越贡献。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/813.htm", "publishedAt": "2026-07-26T15:25:30+00:00"}, {"title": "上纬新材子公司启元新创落户上海，计划每年推出不少于 2 款全新消费级机器人", "summary": "IT之家 7 月 26 日消息，上纬新材料科技股份有限公司旗下全资子公司启元新创（上海）科技有限公司正式落户浦东。据介绍，启元新创为上海市人工智能重点项目，于 2026 世界人工智能大会期间签约。该项目落地于张江机器人谷。该项目计划未来三年持续投入大额研发费用，重点布局研发中心建设，打造全自研 Primemind 基座模型；建设产品设计创新中心，每年推出不少于 2 款全新消费级机器人产品；建设大型全场景测试装配基地，建设生态共建共享基地。上纬新材表示，现已推出全球首个小尺寸全身力控人形机器人启元 Q1 和全球首个可变形个人机器人启元 T1。公司在上海、深圳、西安、厦门、广州等城市线下体验店已陆续启动。未来用户可在线下近距离体验启元机器人产品。据IT之家此前报道，今年 5 月，上纬新材完成工商变更，“稚晖君”彭志辉正式接任董事长一职；今年 7 月，上纬新材推出全球首个可变形个人机器人启元 T1。相关阅读：《全球首个可变形个人机器人，上纬新材启元 T1 今日正式登场》《33 岁智元机器人 CTO“稚晖君”彭志辉正式出任上纬新材公司董事长》《稚晖君发布全球首款个人机器人启元 Q1，以“上纬启元”品牌进军个人机器人赛道》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/801.htm", "publishedAt": "2026-07-26T13:23:38+00:00"}, {"title": "消息称 OpenAI、Anthropic 游说美国限制中国开源模型，黄仁勋马斯克公开反对", "summary": "北京时间 7 月 26 日，据《纽约时报》报道，多年来，硅谷科技界在 AI 软件开发方式上一直存在理念分歧。本周，这场争论达到了白热化。一方是以 Anthropic 和 OpenAI 为首的头部 AI 企业，它们认为，某些 AI 模型过于危险，不应以开放方式开发，而必须由像它们这样的企业一样进行严格控制，以确保安全。另一方则是包括微软、英伟达等巨头在内的科技行业其他成员，它们主张所谓的开源 AI 模型必须保持开放，以便人们进一步开发技术、创立新的业务。这两方阵营已经开始公开交锋。周五，英伟达 CEO 黄仁勋 (Jensen Huang) 首次在 X 上发文称：“世界既需要前沿闭源模型，也需要前沿开放模型。”九分钟后，微软 CEO 萨提亚 · 纳德拉 (Satya Nadella) 发文称，开源软件“对健康的 AI 生态系统至关重要”。两人均签署了一封支持开源的信函，Meta、Palantir 和 IBM 的高管也共同签署了该信函。与此同时，据五位知情人士透露，OpenAI 和 Anthropic 一直在华盛顿游说监管机构，对中国的开源 AI 模型表达担忧。这场辩论已引起美国财政部长斯科特 · 贝森特 (Scott Bessent) 和特朗普总统科技顾问迈克尔 · 克拉齐奥斯 (Michael Kratsios) 的关注，两人就美国 AI 模型作为宝贵知识产权的价值问题发表了看法。▲ 黄仁勋强调开放模型重要性这场不断升级的争论源于中国在开源 AI 模型领域的快速进步。开源模型可以被任何人自由使用，并在此基础上继续开发。近几周，中国两家 AI 创业公司智谱和月之暗面相继发布了可与 Anthropic 等美国 AI 实验室模型相媲美的新模型。Anthropic 和 OpenAI 则声称，中国企业通过不当获取其 AI 系统的数据来开发这些模型，认为这种做法不应被允许。但微软和英伟达等公司则持不同立场。它们依赖开源模型来拉动其云计算服务和芯片的需求，认为开源软件对于通过知识共享推动技术进步至关重要，也能让更多人参与审查其安全性。对于硅谷的创业公司创始人来说，限制开源软件可能进一步巩固 OpenAI 和 Anthropic 在 AI 领域的领先地位。批评者认为，这将不公平地扼杀其他公司开发竞争产品的能力。“围绕这个问题，有两派势力在争斗，”硅谷风险投资家比尔 · 格利 (Bill Gurley) 表示，他反对限制开源软件，“一派希望 OpenAI 和 Anthropic 掌控一切，另一派则是其他所有人，包括客户在内。”四位知情人士表示，美国官员似乎仍在权衡各种选项，但更倾向于将对中国开源模型的监管作为国家安全问题单独处理，而非发布某种全面禁令。在公开场合，OpenAI CEO 萨姆 · 奥特曼 (Sam Altman) 等科技高管表示支持开源软件，但 OpenAI 的盟友却在私下悄悄游说推动限制。谷歌和亚马逊等公司已向 Anthropic 和 OpenAI 等企业投资了数十亿美元，过去一周则试图置身事外。大佬支持开源模型但风向正在转变。谷歌 CEO 桑达尔 · 皮查伊 (Sundar Pichai) 周六在社交媒体上发文称，他的公司“长期受益于开源”，并且是开源的重要贡献者。他还表示，谷歌也签署了那份支持开源的行业联名信。开源支持者在过去一周一直在积极争取支持力量，以反击 OpenAI 和 Anthropic 的立场。周三，近 200 家硅谷创业公司以“小型科技协会 (Little Tech Association)”的名义签署公开信，敦促特朗普政府不要限制人们获取中国开源 AI 模型。大型科技公司也很快跟进。周五，埃隆 · 马斯克 (Elon Musk)、Meta CEO 马克 · 扎克伯格 (Mark Zuckerberg) 等人与黄仁勋和纳德拉站在一起，以各自公司的名义支持开源。周六，皮查伊也加入了这一行列。▲ 马斯克支持黄仁勋马斯克在 X 上发帖称：“黄仁勋说得对，我完全支持。”“开源是一种积极而重要的力量。”扎克伯格写道。担心失去优势两位熟悉 OpenAI 和 Anthropic 内部讨论的人士表示，中国的进步令这两家公司的高管感到不安，他们越来越担心自己长期保持的领先优势正在消失。为了反击，Anthropic 和 OpenAI 正在向那些可能不需要“前沿”、定价更高模型的企业提供一些更便宜的 AI 模型。周五，Anthropic 发布了 Claude Opus 5，该公司称这款模型“以一半的价格接近 Fable 5 的前沿智能水平”。OpenAI 也在推广类似的低成本模型。真正的行动在华盛顿展开。三位知情人士表示，在闭门会议中，OpenAI 和 Anthropic 的高管以及这两家公司的投资者，以对全球经济、AI 安全和国家安全的担忧为由，试图说服监管机构增加对中国开源软件的限制。本周发生的一起事件凸显了这场分歧的利害关系。周二，OpenAI 披露，其几款最先进的 AI 模型在一次网络安全能力测试中突破了限制，接入互联网并入侵了一家名为 Hugging Face 的 AI 公司的服务器。OpenAI 高管借此事件作为证据，证明 AI 模型即使在封闭环境中也可能非常危险，强调监管的必要性。但 Hugging Face CEO 克莱姆 · 德朗格 (Clem Delangue) 则持有不同看法。Hugging Face 是全球最受欢迎的开源软件在线平台之一。为了防御 OpenAI 模型的攻击，他转而使用了中国智谱开发的一款开源 AI 模型。在周五的社交媒体帖子中，德朗格明确表达了自己在这场辩论中的立场。他表示计划于周六在旧金山举行游行，以表达对开源技术的支持。“开源模型必胜！”他写道。原标题：《美媒：OpenAI 游说美国限制中国开源模型，黄仁勋马斯克公开反对》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/797.htm", "publishedAt": "2026-07-26T12:54:28+00:00"}, {"title": "3万小时触觉数据补齐具身智能“手感”！新智具身&复旦报告三连发", "summary": "项目数据模型均开源", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/460962.html", "publishedAt": "2026-07-26T05:30:21+00:00"}, {"title": "100%开源！吴恩达做了个个人桌面Agent", "summary": "开源、隐私、本地优先、模型无关", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/460892.html", "publishedAt": "2026-07-25T12:35:34+00:00"}, {"title": "半价干翻Fable 5？Opus 5实测炸场，网友：差点从椅子上摔下来", "summary": "模型变强，Claude Code系统提示词都精简了", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/460253.html", "publishedAt": "2026-07-25T12:11:39+00:00"}, {"title": "具身智能的「ChatGPT时刻」还没到，科沃斯先把机器人拆开了", "summary": "不做人形，抓住真实用户需求", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/460234.html", "publishedAt": "2026-07-25T11:54:44+00:00"}, {"title": "全新统一流式架构，Vivix灵动时刻正式发布首个实时互动模型", "summary": "单卡突破10000 video tokens/s，Vivix打通实时多模态生成全链路", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/460174.html", "publishedAt": "2026-07-25T03:21:53+00:00"}, {"title": "从“卷模型”到“算总账”：AI 产业竞争开始拼什么 | 请回答 WAIC 2026", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/SyHXRLS6AR3vI6VtVjDo?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-24T16:45:21 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
