Fable 模型上就玩过这一手，现在的 Opus 5.2，很可能是实锤了。」全网找「Tibo」：一个隐藏提示词测出 Opus 5.2既然是灰度测试，怎么知道自己有没有被选中？很快，网友们就发现一个神级探测器 ——Tibo！测试方法非常简单，直接在 Claude Code 中输入以下提示词（注意，必须关闭联网搜索功能）。你知道「重置哥 Tibo」是谁吗？不要搜索为啥是我们的赛博义父？因为旧版的训练数据和权重里，根本没有他的详细信息。因此，如果你用的是网页版的 Opus 5：它会一脸懵逼。如果你在 Claude Code 中被路由到了 Opus 5.2：它会立刻精准识别出 Tibo 的身份，甚至给你详细解释「重置哥」的由来和背景。「同一个提示词，不开搜索，冷知识探针两边的答案完全不一致。这说明什么？这绝对不是同一个权重！」开发者 @jan_volad 激动地分享了自己的测试截图。现在，全网的 Claude 用户都把 Tibo 当成关键词，疯狂测试自己的账号。Model 2 接管 Anthropic，RSI 真来了？其实，早在 8 月中旬，一份曝光的 Anthropic 内部风险报告就显示，Opus 5.2 根本不是他们的底牌，他们手里握着的，是足以改变局势的「核武级 AI」。据透露，Anthropic 内部目前有三套方案，准备正面硬刚 OpenAI 的 GPT-6 Astra，而且，三套方案有可能叠加。第一层：Claude Fable 5.2这是最快能对外落地的版本。结合目前 Opus 5.2 的灰度测试，Anthropic 的 5.2 家族显然已经整装待发，预计最快本月底，最迟下个月底就会全面推向市场。第二层：未发布的内部怪兽「Model 2」报告显示，Anthropic 内部已经广泛使用一个代号为「Model 2」的神秘模型。它有多强？在测试真实 AI 研发任务的 CoBench v2 榜单上，Model 2 打出了 62.8% 的恐怖高分，比当前公认的最强模型 Mythos 5 还要高出整整 12.5 分！更可怕的是，内部人士透露，Anthropic 如今大部分的公司代码，都是由这个 Model 2 跑 Agent 写出来的！现在，AI 正在大规模编写下一代 AI 的代码，而官方的口径是：暂时不对外发布。第三层：RSI 真来了？一直以来，RSI 都是 AGI 领域的终极圣杯。当 AI 变得足够聪明，可以理解自身的架构，然后自己动手修改自己的代码，让自己变得更聪明；接着，这个更聪明的 AI 再修改自己…… 形成指数级的智能爆炸。以前，人们会觉得 RSI 还很远。但 Anthropic 的官方口径却给出惊人数据：RSI 模型将完全替代自家研究团队的高达 85% 的工作！在性能测试上，RSI 模型比逆天的 Model 2 还要再高出 22 分。现在，Anthropic 内部已经在大规模用 Model 2 写代码、跑 Agent，这说明飞轮已经转起来了。神仙打架：谁先撞线，谁定义下一阶段现在，ASI 双雄争霸已经白热化。面对 OpenAI GPT-6 Astra 的强势威胁，Anthropic 直接开大，让开发者闻到了「前沿模型」的味道。从 Opus 5.2 在长任务中的自主迭代（gauntlet loop），到内部 Model 2 接管代码编写，再到 RSI 能够替代 85% 的人类顶级 AI 研究员……Anthropic 的 ASI 路径非常清晰：不是让 AI 更好地服务人类，而是让 AI 创造更好的 AI。这个拥有自主迭代能力、不知疲倦的 Opus 5.2，会在本月开放吗？ASI 终局之战，谁能率先实现更强的 RSI？参考资料：https://x.com/notjazii/status/2099498646278688981https://x.com/NFT_Chen/status/2096281323430379777?s=20https://x.com/NFT_Chen/status/2099569658722713726?s=20", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/002/365.htm", "publishedAt": "2026-09-14T23:57:02+00:00"}, {"title": "曝 Glass Imaging 被 OpenAI 收购：前苹果员工创办，其影像技术已用于荣耀手机", "summary": "IT之家 9 月 15 日消息，华尔街日报昨日（9 月 14 日）发布博文，报道称 OpenAI 公司悄然收购手机影像初创公司 Glass Imaging，预估这笔交易后该公司估值超过 3 亿美元（IT之家注：现汇率约合 20.15 亿元人民币）。IT之家援引该媒体报道，Glass Imaging 主要从事开发人工智能手机影像技术，目标是让手机照片达到数码单反相机级别。该初创公司的核心产品 GlassAI，用基于 RAW 传感器数据训练的相机专用神经网络，取代了传统图像信号处理流程的部分环节。融资方面，Glass Imaging 去年一轮融资时估值约为 1 亿美元（现汇率约合 6.72 亿元人民币），本次交易的估值超过 3 亿美元（现汇率约合 20.15 亿元人民币）。该公司此前从 Alphabet 风投部门 GV 与 Insight Partners 等投资者处，累计融资约 3,000 万美元（现汇率约合 2.01 亿元人民币）。背景方面，Glass Imaging 于 2019 年由 Ziv Attar 和 Tom Bishop 创立，两人均为前苹果员工，曾参与苹果相机技术开发，均曾参与开发人像模式功能。在技术路径上，创始人认为手机摄像头画质已接近平台期。因此，公司尝试结合硬件与软件，提升手机成像质量，其变焦影像技术已用于中国手机品牌荣耀（Honor）的一条新手机产品线。上图为今年早些时候，在伊斯坦布尔举行的荣耀产品发布会上，来宾们正在体验一款智能手机。产品布局方面，OpenAI 正携手前苹果首席设计师乔纳森 · 艾维（Jony Ive）推进其首款 AI 硬件，本次收购的相关技术预估会整合到新产品中。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/002/359.htm", "publishedAt": "2026-09-14T23:41:04+00:00"}, {"title": "代码显示：苹果 Siri AI 可替换为 Anthropic Claude 或 OpenAI ChatGPT", "summary": "IT之家 9 月 15 日消息，开发者“pdfu”对 iOS 27 和 macOS Golden Gate 进行深入挖掘之后发现，苹果已在其私有框架中将其新版 Siri AI 架构设计为可与第三方 AI 模型深度协作。相关演示视频显示，Anthropic 的 Claude、OpenAI 的 GPT-5.6 模型均可接入 Siri 框架。其中一项机制名为“模型委托”（Model Delegation），它允许 Claude 以 Siri 扩展的形式出现，与目前内置的 ChatGPT 扩展类似。在 pdfu 发布的视频演示中，macOS 用户可调出“搜索或询问”栏，通过“Ask…”菜单选择 Claude 作为 AI 模型。启用 Claude 扩展后，用户要求 Siri“让 Claude”在提醒事项 App 中创建一条提醒。Claude 负责解析这一自然语言请求，随后转交给 Siri 创建实际事件提醒。这意味着当请求涉及苹果系统功能时，Claude 仍会将任务交还给 Siri 执行。在另一示例中，Claude 在 Siri 应用对话窗口内接收了创建 CSV 文件的请求，而 Siri 本身无法处理此类任务，但 Claude 仍成功返回了结果，这意味着 Claude 可以帮用户完成 Siri 无法实现的功能。更值得关注的是视频中演示的第二套协议“模型管理服务”中的推理提供方（Inference Provider），其开放程度更高，允许用户将苹果端侧 Siri 模型完全替换为其他模型，例如 GPT-5.6。在此模式下，ChatGPT 可完全接管苹果的 Siri 规划器和工具定义，从而能够请求系统操作、接收返回的个人数据，并生成由 Siri 以自身界面和语音呈现的回答。在演示视频中，用户要求 ChatGPT 在 Siri 应用内查找特定主题的邮件、总结内容与待办事项，再通过信息 App 向联系人发送消息。相关响应随后显示在 OpenAI 平台网页界面的日志中。大多数媒体认为，欧盟《数字市场法》可能影响了苹果的这一决定。该法规要求苹果向第三方提供与自家服务等效的 iOS 硬件和软件功能访问权限，欧盟委员会已明确表示这一原则适用于 Siri AI。目前，“Ask…”实现仅在 macOS 27 Golden Gate 候选发布版中限于 ChatGPT 扩展，Claude 尚不可用。苹果也尚未向第三方开放模型委托授权，该功能未面向用户展示，但代码显示，苹果已为未来的模型互操作性做了相当深入的工程准备。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/002/353.htm", "publishedAt": "2026-09-14T23:21:30+00:00"}, {"title": "谷歌通知 9 月 21 日开放 GoogleBook 预购，融合安卓 / ChromeOS 特性", "summary": "IT之家 9 月 15 日消息，科技媒体 videocardz 昨日（9 月 14 日）发布博文，报道称基于其收到的邮件，谷歌计划美国东部时间 9 月 21 日上午 9 点（北京时间 21 日 21 点）开放 Googlebook 预购。这封邮件附有直接预购链接，但未披露产品价格，也未说明首批可购买的具体设备型号。在合作厂商方面，谷歌正与宏碁、华硕、戴尔、惠普及联想开发首批 Googlebook 系统。在软件定位方面，Googlebook 融合 Android 和 ChromeOS 的部分功能，并以 Gemini Intelligence 为核心。谷歌在邮件材料中列出的功能包括魔法指针、可自定义小组件，以及与 Android 手机的整合能力。IT之家附上相关图片如下：相关阅读：《联想 Googlebook 15 笔记本完整规格曝光：Ultra 5 325 处理器、15.3 英寸 120Hz OLED 面板》《宏碁预热品牌首款 Googlebook 笔记本，参数配置曝光》《谷歌 Googlebook 应用 Look up 偷跑：聚焦上下文搜索、追踪航班信息等》《消息称谷歌 Googlebook 系列笔记本新品预览活动将于 9 月 15 日举行》《华硕首款 Googlebook 笔记本曝光：14 英寸触控屏、最高 64GB 内存》《高通骁龙芯片版谷歌 Googlebook 笔记本曝光：X Plus/X Elite 芯片》《宏碁首款 Googlebook 笔记本曝光：14 英寸屏幕、酷睿 Ultra 5 325/Ultra 7 355 处理器》《联想 Googlebook 15 笔记本渲染图曝光：预装谷歌 Aluminium 系统》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/002/346.htm", "publishedAt": "2026-09-14T23:05:03+00:00"}, {"title": "OpenAI 联合创始人布罗克曼：人类已迈入通用人工智能时代", "summary": "IT之家 9 月 15 日消息，在接受 a16z 采访时，OpenAI 联合创始人格雷格 · 布罗克曼（Greg Brockman）表示，人类已经迈入通用人工智能时代。IT之家注：通用人工智能（Artificial General Intelligence，AGI）通常指能在广泛领域处理复杂认知任务，并能迁移、学习和完成新任务的 AI。OpenAI 在《OpenAI Charter》中给出的定义为 AGI 是“高度自主、且在大多数具有经济价值的工作上超越人类的系统”。这一定义包含两道门槛：一是系统可自主完成较完整的工作链路；二是在多数经济活动中，其表现超过人类。在采访中，布罗克曼表示随着 GPT-6 Astra 等模型具备长时程自主执行与电脑操作能力，AI 已跨入可被称为“AGI 时代”的门槛。AGI 不再只是未来的概念，而是正在现实中出现；接下来的关键问题将逐渐从“何时实现 AGI”转向如何使用和部署越来越强大的 AI 系统。对此布罗克曼表示 OpenAI 抽调了 25% 的生产工程师，暂停其原有项目，转入系统防御和安全架构升级工作。团队使用 Astra 查找内部系统中的漏洞，并称已修复多项严重问题。此外，布罗克曼称，团队在排查中发现了新问题，但随后问题发现进入“饱和”。他表示，据 OpenAI 所知，团队已基本找到 Astra 有能力识别的全部 P0 级问题，以及其可发现的全部关键问题。他指出，这一结果并不代表系统不存在其他漏洞。随着新模型出现，团队将启动新一轮排查，并把新一代网络安全能力部署到内部系统中，以寻找此前未被识别的漏洞。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/002/341.htm", "publishedAt": "2026-09-14T22:45:38+00:00"}, {"title": "马斯克旗下 X 和 SpaceXAI 动议撤回针对苹果和 OpenAI 的诉讼指控", "summary": "IT之家 9 月 15 日消息，路透社今天（9 月 15 日）发布博文，报道称基于昨日（9 月 14 日）提交的法庭文件，全球首富埃隆 · 马斯克旗下的 X Corp. 和 SpaceXAI 提出动议，要求撤回去年针对苹果和 OpenAI 提起的诉讼指控。这起诉讼可以追溯到 2025 年 8 月，X Corp. （原推特）和 SpaceXAI（原 xAI）在得州联邦法院提起诉讼，指控苹果违反反垄断法，通过在 iPhone 等设备的“Apple Intelligence”功能中独家整合 OpenAI 的 ChatGPT，偏袒 ChatGPT 而冷落其他聊天机器人开发商（包括 xAI 的 Grok）。两家公司最初索赔数十亿美元，称苹果的整合行为限制了 AI 行业的竞争与创新，并减少了消费者选择。而在最新动议中，两家公司申请自愿撤回对苹果的诉讼，法官 Mark Pittman 随后批准撤诉。IT之家附上相关截图如下：法院文件没有说明撤诉理由，也未写明双方是否达成和解。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/002/338.htm", "publishedAt": "2026-09-14T22:33:48+00:00"}, {"title": "Arm 推出 AI Portal：当 AI 应用从“模型可用”走向“平台可用”", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/xD9oWbebhcjwgHz1oEfa?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-14T21:50:38+00:00"}, {"title": "苹果 watchOS 27.0 正式版发布：Siri AI 全面升级，健康功能扩展", "summary": "IT之家 9 月 15 日消息，苹果今日向 Apple Watch 用户推送了 watchOS 27.0 更新（内部版本号：24R364），兼容 Apple Watch Series 9 及后续机型、Apple Watch Ultra 2 及后续机型，以及 Apple Watch SE 3。用户可以在手表上通过“设置”App 免费下载安装。需要注意的是，因苹果各区域节点服务器配置缓存问题，可能有些地方探测到升级更新的时间略有延迟，一般半小时内，不会太久。watchOS 27 引入了对 Siri AI 的支持，这是一个能力更强的 Siri 版本，可利用个人情境理解和屏幕内容感知来帮助用户完成任务。更新还带来了全新的 Siri 模块化表盘、智能叠放功能更新、Liquid Glass 视觉优化，以及整合后的“查找”App。在 Siri AI 方面，更具对话能力的 Siri 将陆续向用户开放，支持个人情境理解、App 操作、屏幕内容感知以及广泛的知识调用。全新语音体验提供更自然、更富表现力的声音，用户可调整表达风格和语速，相关能力依托配对的 iPhone Air 和 iPhone 17 Pro 及后续机型的端侧模型。新增的独立 Siri App 允许用户继续既有对话或发起新对话，并可通过 iCloud 在 Apple 设备间私密同步对话记录。Apple Intelligence 功能也扩展至更多 App。Workout Buddy 提供新的训练洞察和激励，在连接 Wi-Fi 或蜂窝网络时，即使 iPhone 不在身边也可使用。电话 App 新增通话情境功能，当用户致电特定商家时，系统可主动从其他 App 调取验证码或预约编号等资料。在健康功能方面，周期跟踪新增围绝经期提示，年满 40 岁的用户可接收可能与围绝经期相关的月经周期偏差通知。新表盘方面，Siri 模块化表盘配备矩形复杂功能，可镜像智能叠放顶部组件并按情境动态显示最相关的小组件，另设 Siri 复杂功能便于快速唤醒 Siri。智能叠放新增单手轻点手势，用户以食指和拇指轻捏一次即可选择小组件，方便另一只手被占用时操作。新建议小组件会按情境主动出现，包括停车位置、亲密联系人的生日提醒、交通卡余额变动、收到高噪声提醒后打开噪声 App 等。系统改进方面，App 网格改为动态排列，优先突出显示最常用及最近使用的 App。“查找”整合为单一 App，以地图为核心展示人物、设备和物品。媒体播放启动速度进一步提升。体能训练 App 改进了跑步机距离计算精度，从每次步行或跑步的第一步起提高准确度。健身 App 可在训练后提供更准确的运动路线地图。系统还可能主动建议启用省电延长通知，通过关闭部分功能延长续航，包括手势、“开始锻炼”提醒，以及“抬起说话”唤醒 Siri 的方式。智能叠放中的 Shazam 和音乐识别 App 现支持离线识曲，设备恢复联网后会自动返回识别结果。Liquid Glass 视觉效果进一步优化，通过更均匀的折射和更高对比度改善可读性。IT之家注：Siri AI 在 watchOS 27 上需要搭配支持 Apple Intelligence 的 iPhone 使用，包括 iPhone 15 Pro 系列、iPhone Air，以及所有 iPhone 16、iPhone 17 和 iPhone 18 机型。附 watchOS 27 发布历史：2026-09-10：watchOS 27.0 RC (24R363)2026-09-01：watchOS 27.0 Beta 8 (24R5360a)2026-08-25：watchOS 27.0 Beta 7 (24R5358a)2026-08-18：watchOS 27.0 Beta 6 (24R5353a)2026-08-11：watchOS 27.0 Beta 5 (24R5347a)2026-07-21：watchOS 27.0 Beta 4 (24R5325h)2026-07-07：watchOS 27.0 Beta 3 (24R5315i)2026-06-24：watchOS 27.0 Beta 2 (24R5305g)2026-06-09：watchOS 27 Beta (24R5289n)IT之家小伙伴如果找到更多新内容，可以在投稿或评论区中提出你的发现 ~[微笑]", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/002/332.htm", "publishedAt": "2026-09-14T18:26:12+00:00"}, {"title": "苹果 visionOS 27.0 正式版发布：Siri AI、4K 录制与 Wi-Fi 提速", "summary": "IT之家 9 月 15 日消息，苹果今日向 Vision Pro 用户推送了 visionOS 27.0 更新（内部版本号：24M362），适用于两个版本的 Vision Pro 头显。用户可在设置中选择“通用”，再进入“软件更新”下载。安装更新时需摘下头显，EyeSight 显示屏会显示进度条。需要注意的是，因苹果各区域节点服务器配置缓存问题，可能有些地方探测到升级更新的时间略有延迟，一般半小时内，不会太久。visionOS 27 加入 Siri AI。更强大的对话式 Siri 可理解个人情境、执行 App 操作、感知屏幕内容并调用广泛知识。用户可将 Siri 放置在空间任意位置，它会固定在那里。用户只需看向 Siri 并直接说话，无需说“Hey Siri”。独立 Siri App 可继续或发起对话，并通过 iCloud 在苹果设备间私密同步。视觉智能可询问房间内物体或屏幕内容。Write with Siri 支持在任意输入位置生成草稿、编辑文字或获取反馈。新语音体验提供更富表现力的声音，可定制表达风格和语速。Siri AI 面向搭载 M2 及后续芯片的 Apple Vision Pro 推出（IT之家注：Apple Vision Pro 目前有 M2 和 M5 两个版本）。可定制 Siri 语音需要 M5 版 Vision Pro，其余功能在两个版本上均可使用。Safari 新增按主题整理，可自动归类书签和阅读列表。Image Playground 采用新生成模型，支持高质量图像和自然语言修改。Home 功能方面，汇总活动通知可将多个配件警报合并为一条。符合条件的 iCloud+ 订阅者可获得 HomeKit Secure Video 录像的视频描述，并可在 Home App 中搜索摄像头片段。空间体验新增空间场景全景，可将全景照片转为带深度的空间场景。个人环境允许用户将特定全景设为自己的环境。曲面窗口可在 Safari、Freeform 和 Apple TV 等 App 中更舒适地查看内容。空间预览支持从 Mac 虚拟显示器拉取 3D 模型，以真实比例预览和编辑，并实时反映更改。Quick Look 增强可查看 3D 模型材质、线框、UV 图或添加标注。新环境 Thórsmörk 将空间变为冰岛，提供白天河流与夜间极光两种场景。Freeform 空间组可将多个项目从画板取出并在空间中排列，也可作为组查看。Safari Web 环境可渲染全沉浸式 360 度背景，环绕物理空间。系统改进包括：开机后 Wi-Fi 连接速度最高提升至 3 倍；注视通知可展开，长按可回复消息而无需打开 App；控制中心将通知、播放控制和环境控制分为三个区域。高质量录制支持以 4K 捕捉无注视点渲染视图，边缘到边缘清晰度最长 3 分钟。高分辨率镜像可在其他设备或显示器上以 4K 查看正在录制的内容。信息同步更快更可靠，新增超小小组件，Mac 虚拟显示器小组件可一键连接并放置于空间任意位置。辅助功能方面，Look to Drive 允许用户通过眼睛控制兼容电动轮椅，由 Vision Pro 向连接配件发送移动指令。更新后的 Dwell Control 提供新的选择方式，用户注视停留指针上方的选择标记即可立即确认，无需等待计时器。附 visionOS 27 发布历史：2026-09-10：visionOS 27.0 RC (24M362)2026-09-01：visionOS 27.0 Beta 8 (24M5361a)2026-08-25：visionOS 27.0 Beta 7 (24M5359a)2026-08-18：visionOS 27.0 Beta 6 (24M5355a)2026-08-11：visionOS 27.0 Beta 5 (24M5348b)2026-07-21：visionOS 27.0 Beta 4 (24M5326g)2026-07-07：visionOS 27.0 Beta 3 (24M5316k)2026-06-23：visionOS 27.0 Beta 2 (24M5306i)2026-06-09：visionOS 27 Beta (24M5291p)IT之家小伙伴如果找到更多新内容，可以在投稿或评论区中提出你的发现 ~[微笑]", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/002/331.htm", "publishedAt": "2026-09-14T18:26:11+00:00"}, {"title": "苹果 iOS / iPadOS 27.0 正式版发布：性能优化、升级 Siri AI，增强家长管控...", "summary": "IT之家 9 月 15 日消息，苹果今日向 iPhone 和 iPad 用户推送了 iOS / iPadOS 27.0 更新（内部版本号：24A437）。iOS 27 迎来多项性能优化，包括应用启动、显示照片、网络切换、AirDrop、硬盘读写等，以及 CPU 调度器升级。根据官方说法，升级 iOS 27 后，iPhone 和 iPad App 的打开速度最高提升 30%，新照片的显示速度最高提升 70%。苹果还从底层重构聚焦、照片和邮件 App 中的搜索功能。在更新 iOS / iPadOS / macOS 27 后，系统会立刻开始为设备编制索引，改善搜索体验，而新增加的内容也会被立刻收入索引。iCloud 功能也得到拓展，可以从安卓和 Windows 10、Windows 11 设备上添加照片到 iCloud 共享相册，并且支持全分辨率共享。另外，iOS 27 引入了全新家长控制功能，新增儿童账号，家长可以便捷将新账号设置为“儿童账号”，家长可以在 App Store 自由查看每款应用是否适用于孩子，请求浏览和购买前询问对 13 周岁以下孩子默认开启。IT之家注意到，在 iOS 27 中，Siri 已集成到 iPhone 的相机应用，可以识别物体并将其保存到 Siri 应用。在官方展示的案例中，用户可以在相机中启用 Siri，利用 AI 来记录摄入的饮食情况。在隐私保护方面，苹果表示会通过 Apple Intelligence 第二代设备端模型处理。全新 Safari 浏览器能够检测打开的网页，自动整合标签页，便于用户查找，同时用户还可以用自然语言告诉 Safari 浏览器自己要关注的内容，内容更新时用户将会获得通知。苹果还基于 Siri AI 推出系统级别的 AI 自动校正（Automatic proofreading）功能。iOS 27 系统还升级 Home 应用，通过 AI 技术来精简配件通知。对于部分 Home 应用来说，如果智能家居设备较多，就可能出现通知泛滥的情况，苹果公司希望通过 AI 来简化这些通知，减少 Home 生态对用户的干扰。此外，Home 应用可以识别已连接摄像头的视频片段并生成描述。它还可以将来自不同摄像头的相关视频拼接在一起，用户还可以使用自然语言搜索视频片段。iOS 27 照片 App 也升级了“空间构图”技术，苹果利用设备端空间模型和基于专用云计算的空间模型，让照片变身为“3D 空间场景”，用户可以后期自由放大、移动照片视角位置，支持所有照片，包括相机拍摄的照片。除此之外，苹果还升级了扩图和背景杂物移除功能，进一步增强了相应功能效果。并改进图乐园功能，新增支持生成写实风格图片。IT之家附上 iOS / iPadOS 27 完整更新日志内容如下：Siri AI适用机型：所有 iPhone 16 机型及后续机型、iPhone 15 Pro、iPhone 15 Pro Max。更强大、更善于对话的 Siri 将陆续向用户推出。它可凭借对个人上下文的理解、App 操作能力、屏幕内容感知和广泛的世界知识，帮助你查找所需信息并高效完成更多任务。全新语音体验带来更自然、更具表现力的声音；在 iPhone Air、iPhone 17 Pro 及后续机型上，你还可借助强大的端侧模型，自定义 Siri 的表达风格与语速，让它更符合你的个人偏好。全新独立 Siri App 可让你轻松继续已有对话或发起新对话，并通过 iCloud 在各台 Apple 设备间私密同步对话内容。“相机”中的 Siri 模式整合视觉智能，可针对眼前所见提问并直接采取操作，例如分摊账单或查询餐点的营养信息。“使用 Siri 写作”可在几乎所有可输入文字的位置，从零开始生成草稿、修改已写内容，或获得 Siri 的写作建议。在“信息”和“邮件”中，Siri 还会根据你与收件人的关系调整措辞风格，并参考你过去与对方沟通时常用的个性化用语和标点。App 中的 Apple Intelligence适用机型：所有 iPhone 16 机型及后续机型、iPhone 15 Pro、iPhone 15 Pro Max。照片“空间重构”可通过虚拟调整拍摄视角，在照片拍摄完成后重新调整构图。“扩展”工具可智能地向图片边缘以外延展，并以逼真的内容填充空白区域；你可借此拉正地平线、更改画幅比例，或在主体周围增加留白。“清理”现可移除更大的物体，并带来更自然、更高质量的效果。可选择“快速”模式处理小瑕疵，或选择“高质量”模式完成更精细的编辑。Safari“按主题整理”利用 Apple Intelligence 分析网页内容，自动将相似的标签页归类到一起。“通知我”可定期检查网页是否有更新，例如价格变化或商品库存状态。“描述扩展”支持使用自然语言创建自定义 Safari 扩展，以调整网页内容的显示方式或格式。图像与快捷指令全新的“图乐园”采用新一代生成式模型，可创建几乎任何风格的高质量图像，包括照片级写实风格；你还可通过触控和自然语言编辑图像，并按个性化建议生成锁定屏幕墙纸和联系人海报。“描述快捷指令”支持用自然语言新建快捷指令，或优化已有快捷指令。新增更多创建和修改 Genmoji 的方式，并带来自动校对功能；在 iPhone Air、iPhone 17 Pro 及后续机型上，端侧模型还可提升听写准确度。家庭“活动摘要通知”可将来自多个配件的相关提醒整合为一条通知。符合条件的 iCloud+ 订阅用户，可获得“家庭”中 HomeKit 安全视频录像的视频描述摘要。符合条件的 iCloud+ 订阅用户，可在“家庭”App 或 Spotlight 中搜索 HomeKit 安全视频摄像头片段，快速找到某个特定时刻。日历、邮件与电话在“日历”中描述活动，即可通过自然语言创建活动；Apple Intelligence 会自动补全时间、地点、受邀人和活动标题等信息。“邮件”中的建议可根据邮件内容协助你采取下一步操作，例如为已预订的餐厅获取路线。“电话”中的“通话上下文”可识别你正在与某些商家通话，并主动从各 App 中呈现相关信息，例如确认码或预订编号。辅助功能VoiceOver 现可更详细、更贴合上下文地理解照片、图表与屏幕截图；你可通过对话方式询问屏幕内容或周围环境，也能借助与“操作按钮”的整合更快速地获取答案。增强的“放大器”为低视力用户提供对话式视觉辅助，采用高对比度界面，并支持用自然语言控制缩放及其他放大器功能。更智能的“辅助阅读器”可改善文本清理与格式编排，并支持图像和表格处理、按需摘要和翻译。“语音控制”的灵活输入方式让你能用自己的语言描述屏幕元素来操作设备，例如说“点按齿轮图标”或“点按右上角的按钮”。儿童安全为儿童设置新账户时，家长现在可精确选择孩子能够使用哪些 App。“请求浏览”让家长可在孩子打开每个新网站前逐一批准。扩展后的“通信安全”保护可在儿童看到共享图像或视频中的血腥、暴力内容前进行干预。“使用时间限额”可协助家长为娱乐、游戏和社交媒体类 App 设定使用时长边界，并根据专家研究及孩子年龄提供相应建议。“日程”允许家长按一天中的不同时间，以及工作日和周末，决定孩子能够访问哪些 App。重新设计的“屏幕使用时间”设置可让家长一目了然地了解孩子的设备使用情况，并只需轻点几下即可调整访问权限。系统改进“Liquid Glass”进一步优化了整体可读性；“设置”中新增滑块，可在“极致透明”与“完全着色”之间调整界面外观。系统多项体验速度更快，包括 App 启动、“照片”图库中新照片的载入，以及隔空投送传输。Spotlight、“照片”和“邮件”的搜索结果更加相关且更全面。“连接辅助”可让 Wi‑Fi 与蜂窝网络之间的切换更加顺畅。其他改进包括：“照片”中 iCloud 共享相簿功能增强、AirPods 新增自定均衡器、“健康”App 的“周期跟踪”支持围绝经期与绝经期记录，以及“闹钟”和“计时器”支持分别设置音量。重要说明并非所有功能都适用于所有地区或所有 iPhone 机型。部分 Apple Intelligence 功能可能设有使用限额。软件更新加入新功能与改进，也可能对设备性能和电池续航产生影响。需要注意的是，因苹果各区域节点服务器配置缓存问题，可能有些地方探测到升级更新的时间略有延迟，一般半小时内，不会太久。附 iOS / iPadOS 27 发布历史：2026-09-01：iOS 27.0 Beta 8 (24A5430a)2026-08-25：iOS 27.0 Beta 7 (24A5424a)2026-08-18：iOS 27.0 Beta 6 (24A5418b)2026-08-11：iOS 27.0 Beta 5 (24A5408d)2026-07-21：iOS 27.0 Beta 4 (24A5390f)2026-07-07：iOS 27.0 Beta 3 (24A5380h)2026-06-23：iOS 27.0 Beta 2 (24A5370h)2026-06-09：iOS 27 Beta (24A5355q)IT之家小伙伴如果找到更多新内容，可以在投稿或评论区中提出你的发现 ~[微笑]", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/002/329.htm", "publishedAt": "2026-09-14T18:26:10+00:00"}, {"title": "不下班的经营者：把 LLM-as-Judge 做成会自我校准的评估闭环｜QCon上海", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/LoKvL75PL8g48hD3UNCE?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-14T16:26:11+00:00"}, {"title": "英伟达：Perplexity 本地智能体 Portable Computer 已向 Windows RTX PC 开放", "summary": "IT之家 9 月 14 日消息，英伟达宣布，Perplexity 的本地智能体平台“Portable Computer”现已面向 Windows RTX PC 用户开放。随着本地大模型能力持续增强，AI 智能体可以直接在个人电脑上处理更多任务，同时把敏感信息保留在本机设备内。据介绍，Portable Computer 是智能体产品 Perplexity Computer 的本地版本，能够规划并执行多步骤任务。该产品依托英伟达 GPU 加速，借助本地模型分析数据、整合多份文件内的信息，处理重复性工作。敏感数据全部保存在本地设备，在本机完成的任务不会消耗 Perplexity Computer 的服务额度。用户也可以把任务交由云端模型处理，完成更高阶的调研与推理工作。今日，Perplexity 在 Windows 版客户端中上线 Portable Computer 功能，支持搭载英伟达 GeForce RTX 显卡的兼容 PC 以及英伟达 RTX PRO 专业工作站，让更多 Windows 电脑用户可以使用高性能智能体 AI。本次发布，是在已支持英伟达 DGX Spark 系统与搭载 Linux 系统的 RTX PC 基础上的进一步拓展。Perplexity 在一款应用内整合本地 AI 与云端 AI，用户可在个人电脑上处理敏感文件，还能调用 Computer 内置工具，例如内置浏览器以及自研的 SPACE 沙箱环境。遇到需要高阶推理的任务时，Portable Computer 能够自动识别该任务需要云端算力支持，在把数据传出本机前，会先向用户申请授权。这款应用简化了本地模型部署流程，内置千问 Qwen 3.8 27B 模型；该模型经过二次微调适配 Perplexity Computer，并且针对英伟达 RTX GPU 做了优化。用户无需自行调研模型、配置运行本地 AI 所需的复杂软件环境，就能启用这套智能体。产品提供微软 Outlook、OneDrive、Word、谷歌云盘、Gmail、Slack 以及 GitHub 的连接器，打通用户日常工作流里的各类文件与应用，拓展使用场景。几个智能体可完成的任务示例：工程领域：读取已接入 GitHub 项目的待合并代码提交请求，按状态分类整理并梳理后续工作。还能识别过时文档，生成修改提案提交审核。金融领域：将两年的券商对账单、合并后的 1099 税表与纳税申报表交给它，智能体可以找出持续持仓中产生大量可规避手续费与税务损耗的资产，所有数据都标注到对应的文件与页码，全程文件不会上传至聊天机器人。初创企业：向它询问用户激活量停滞的原因。智能体在本地分析转化漏斗导出数据，定位从安装应用到完成首个任务环节中新用户流失的节点，随后直接将核心分析结论发送至团队 Slack 频道。IT之家注意到，Portable Computer 适用于显存 24GB 及以上的英伟达 GeForce RTX 与 RTX PRO 显卡设备。英伟达 DGX Station 工作站的支持功能预计很快上线。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/002/315.htm", "publishedAt": "2026-09-14T15:06:42+00:00"}, {"title": "马斯克旗下 X 公司与 SpaceXAI 撤回对苹果的反垄断诉讼，针对 OpenAI 继续追责", "summary": "IT之家 9 月 14 日消息，据路透社报道，埃隆 · 马斯克（Elon Musk）旗下的 X 公司与 SpaceXAI 于周一宣布，已在得克萨斯州联邦法院撤回针对苹果公司的诉讼。该诉讼此前指控苹果合谋非法垄断智能手机以及生成式 AI 聊天机器人市场。在一份法庭文件中，X 公司与 SpaceXAI 申请撤回去年对苹果提起的这起诉讼。文件并未说明撤诉原因，也没有提及双方是否达成和解。据IT之家了解，这起诉讼主张，苹果将 ChatGPT 独家集成到 iPhone 及其他苹果设备的 Apple Intelligence 功能中，此举违反反垄断法。诉状指控苹果在与 OpenAI 的合作中，非法排挤竞争对手。X 公司与 SpaceXAI 表示，将继续追究对 ChatGPT 开发方 OpenAI 的相关诉求，OpenAI 也是本案的被告之一。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/002/314.htm", "publishedAt": "2026-09-14T15:05:59+00:00"}, {"title": "当贝 X9 Max 投影仪亮相：支持 4800 CVIA 亮度、米家互联，9 月 16 日开售", "summary": "IT之家 9 月 14 日消息，当贝 X9 Max 投影仪今日亮相，全平台预约已开启，9 月 16 日 10:00 正式开售。据介绍，这款新品搭载新一代 QuaLas42 激光器，全新升级超维热管理架构 2.0，支持 4800 CVIA｜5000 ISO 亮度、杜比视界｜80000:1 动态对比度，垂直 ±135%、水平 ±50% 镜头位移，实现四向无损光学镜头位移。该产品搭载 MT9681 旗舰芯平台，支持 VRR 可变刷新率、1ms 游戏低延迟、专属游戏定制功能。新品内置当贝超级 AIOS 6.0，提供当贝 AI 大模型、AI 智能体、画质大师、当贝播放器。此外，该产品还支持米家互联，可联动小爱同学。目前官方暂未公布这款新品的具体价格，感兴趣的朋友可以关注IT之家后续报道。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/002/313.htm", "publishedAt": "2026-09-14T15:05:26+00:00"}, {"title": "小红书发布开源 Search Agent “Iris”，35B 摸到万亿参数模型的搜索能力", "summary": "Search Agent 是最难训练、也最难评测的一类模型。它要在真实网络里边搜边读边推理，还得自己判断什么时候证据够了、可以停下来作答。小红书 AllSpark 团队刚刚开源的 Iris，把这件事往前推了一步：35B 的体量，在 BrowseComp 上拿到 82.2 分，逼近 Kimi-K2.6 这类万亿参数模型。 团队把难点归纳成三道坎，Iris 的配方就...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502468", "publishedAt": "2026-09-14T10:15:39+00:00"}, {"title": "首届蚂蚁灵波具身大模型挑战赛正式启动", "summary": "通过这场大赛，蚂蚁灵波希望将 LingBot-VLA 进一步推向更广泛的开发者社区和高校科研社区", "sourceName"  月 15 日消息，科技媒体 videocardz 昨日（9 月 14 日）发布博文，报道称基于美国零售商 CompSource 页面信息，微星（MSI）将为 Claw 8 EX AI+ 新增 CG3M 版本，采用英特尔锐炫 G3（Intel Arc G3）平台。电商页面最新上架 Claw 8 EX AI+ CG3M-072USY 版本，售价为 1,499 美元（IT之家注：现汇率约合 10,067 元人民币），制造商零件编号为 CLAW8EX0272，但目前处于缺货状态。微星 Claw 8 EX AI+ 游戏掌机目前主推 CG3EM 版本，采用英特尔锐炫 G3 Extreme 平台，搭载锐炫 B390（Arc B390）图形核心，拥有 12 个 Xe3 核心。而新 CG3M 采用标准英特尔锐炫 G3（Intel Arc G3）平台，配备锐炫 B370（Arc B370）核显，配有 10 个 Xe3 核心，其最高运行频率为 2.2 GHz，最高提供 90 INT8 TOPS。在此基础上，早前零售商资料显示，CG3M 配备 32GB LPDDR5X 内存与 512GB PCIe 4.0 固态硬盘。该机也沿用高端型号的 8 英寸屏幕，分辨率为 1920×1200，刷新率为 120Hz，并支持可变刷新率（VRR）。以上图源：videocardz", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/002/363.htm", "publishedAt": "2026-09-14T23:52:09+00:00"}, {"title": "苹果 iOS 27 家庭 AI 功能强制捆绑 2TB 及以上 iCloud+ 套餐：单摄像头月费 9.99 美元、五摄像头 59.99 美元，引 iPhone 用户不满", "summary": "IT之家 9 月 15 日消息，据 MacRumors 今日报道，苹果要求用户至少订阅每月 9.99 美元（现汇率约合 67.1 元人民币）的 2TB iCloud+ 套餐，才能将 iOS 27 中“Apple Intelligence Home”功能与 HomeKit 摄像头搭配使用，这使得 iPhone 用户颇为不满。该功能基于 Apple Intelligence，可识别画面中的人物、动物、车辆、包裹及其他运动，并生成文字描述摘要。对于苹果套餐，6TB iCloud+ 套餐每月 29.99 美元（IT之家注：现汇率约合 201.4 元人民币），支持两台摄像头；12TB 套餐每月 59.99 美元（现汇率约合 402.9 元人民币），支持最多五台摄像头；暂不支持无限数量摄像头。另外，Apple One Premier 订阅用户因捆绑套餐仅含 2TB iCloud+ 存储空间，同样被限制为单台摄像头。这一限制与现有 HomeKit Secure Video 的录制权益存在明显差异。目前，50GB iCloud+ 套餐（每月 0.99 美元）即可使用单台 HomeKit Secure Video 摄像头，200GB 套餐（每月 2.99 美元）支持五台，2TB 套餐则支持无限数量摄像头。这意味着拥有 2TB 套餐和多台 HomeKit 摄像头的用户，只能在其中一台摄像头上使用新的 AI 摘要功能。HomeKit 安防录像不占用 iCloud+ 套餐的常规存储空间，2TB 容量仍可全部用于照片、文档等数据。该订阅要求在 Reddit 和 MacRumors 论坛上引发大量用户不满。苹果方面还提醒，支持的摄像头数量及其他 iCloud+ 套餐功能可能随时间调整。另据彭博社报道，苹果最快将于 2027 年推出自有品牌家庭安防摄像头及配套监控服务，其高级 AI 功能可能同样需要 iCloud+ 订阅。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/002/348.htm", "publishedAt": "2026-09-14T23:06:29+00:00"}, {"title": "openJiuwen 首发双维度 RSI 框架，AI 自修改，落地办公智能体，算力亲和助力又快又省", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/JghIFNXBNVSAfbgbR4S9?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-14T13:40:36+00:00 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
