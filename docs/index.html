const DATA = {"date": "2026-10-17", "generatedAt": "2026-10-17T00:59:38Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "223 道题、2651 条标准：阿里 Qwen 开源 BlenderWorld，给 AI 出了一套 3D 建模大考", "summary": "IT之家 10 月 17 日消息，阿里 Qwen 团队于 10 月 14 日开源 BlenderWorld，这是一个用于评测视觉智能体在 Blender 中完成真实 3D 创作任务的基准。项目采用 MIT 许可证，代码与数据集已同步发布至 GitHub、Hugging Face 和 ModelScope。与常见的“生成一张图”不同，BlenderWorld 要求 AI 交付一个可编辑的 .blend 工程文件，并按需输出渲染图、视频或模型导出文件。在该测试中，模型不能只给出好看的画面，还要构建出材质、几何结构、灯光、相机等可被设计师继续修改的 3D 场景。该基准包含 223 个任务和 2,651 条标准，覆盖产品、建筑、自然环境、角色、动画和科学可视化等 9 大类、22 个子类。其中，78 个任务仅提供文字描述，130 个任务提供图片加文字，15 个任务提供视频加文字；另有 59 个任务附带尺寸、材质或相机参数等规格文件。评测方式也颇为严格：系统会从 8 个自适应视角渲染提交的 Blender 项目，并结合场景检查、2,651 条任务专属二元评分标准，以及 8 项整体视觉质量评分。最终成绩由规则符合度与视觉质量各占 50% 加权得出。该项目目前已提供完整的安装、生成、打包和评测流程，支持开发者将任意生成框架接入测试。仓库显示其采用 Blender 4.2.10，并需要 Linux、Python 3.10 及以上环境；评测环节还需配置具备视觉能力的模型服务。IT之家附上参考点此前往 GitHub 访问 BlenderWorld", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/014/217.htm", "publishedAt": "2026-10-17T00:43:22+00:00"}, {"title": "ChatGPT 能替你操作谷歌 Chrome 浏览器了：读网页、网购比价、发消息等", "summary": "IT之家 10 月 17 日消息，OpenAI 于 10 月 15 日更新 ChatGPT for Chrome 扩展程序（版本号 1.26.1005.11759），ChatGPT 现在可以读取 Chrome 浏览器中已打开的多个标签页，并基于这些网页内容回答问题、整理信息或完成跨页面任务。该功能面向所有用户开放，无论是否订阅付费服务均可使用。用户在聊天中调用浏览器后，ChatGPT 可将当前打开的网页作为上下文，例如比较多个商品页面、汇总多份资料或分析工作文档。IT之家援引博文介绍，此次更新还引入了更强的“操作”能力。在 Work 模式下，ChatGPT 不再仅限于阅读网页，而是可以在获得授权后控制标签页，帮助用户填写表单、发送消息、下载文件、整理和分组标签页等。由于扩展程序运行在用户常用的浏览器配置中，它能够复用用户已登录网站的登录状态，从而在 Gmail、LinkedIn、Salesforce 或企业内部工具等场景中直接协助处理工作流程。不过，便利背后是更大的权限要求。安装或启用相关能力后，Chrome 可能要求扩展程序读取和修改网站数据、访问页面调试工具、管理标签页和下载内容，甚至读取书签、浏览历史或显示通知。OpenAI 表示，这些权限是让 ChatGPT 操作浏览器所必需的，但用户仍可通过逐站授权、允许名单、阻止名单等方式控制其访问范围。默认情况下，ChatGPT 在接触每个新网站前都会请求确认，用户可选择“仅允许一次”“对该网站始终允许”“对所有网站始终允许”或拒绝。其中，“对所有网站始终允许”被 OpenAI 标记为较高风险选项；浏览历史和文件上传、下载也需单独授权。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/014/214.htm", "publishedAt": "2026-10-17T00:31:53+00:00"}, {"title": "OpenAI 升级适用于谷歌 Chrome 浏览器的 ChatGPT 扩展：能直接读取你的标签页", "summary": "IT之家 10 月 17 日消息，当地时间 16 日，OpenAI 宣布升级 Chrome 浏览器的 ChatGPT 扩展程序，支持读取用户打开的标签页，提供更有针对性的回答。OpenAI 曾推出自有浏览器，随后又于 8 月 9 日停用。此后，公司持续改进 Chrome 扩展程序，增强 ChatGPT 在浏览器中的竞争力。最新一轮升级，进一步扩展了 ChatGPT 在 Chrome 中的功能。在 ChatGPT 聊天模式下，用户可以让 AI 助手查看 Chrome 中打开的网页，并根据其中的内容回答问题。例如，在三个标签页中分别打开不同的沙发商品页面后，用户可以直接让 ChatGPT 比较尺寸、价格、送货时间和退货政策。使用面向复杂任务的 ChatGPT Work 时，用户还可以让 AI 助手代发消息、填写表格或整理标签页。例如，让 ChatGPT 填写新牙医要求的表格，再把日程添加到日历；或者分析多个标签页中几家承包商的服务条款，再给最符合自己需求的服务商拟一封邮件。据IT之家了解，Chrome 侧边栏中的 ChatGPT 也获得了访问全部聊天记录的能力。用户不必离开正在浏览的网页，就能继续与 ChatGPT 对话或安排任务。ChatGPT 扩展程序面向所有套餐开放。OpenAI 称，除 Chrome 外，微软 Edge、Brave 和 Opera 等基于 Chromium 的浏览器也能使用该扩展程序。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/014/213.htm", "publishedAt": "2026-10-17T00:25:40+00:00"}, {"title": "Anthropic 内部调查：大多数员工相信到 2030 年 AI 能完成至少八成工作", "summary": "IT之家 10 月 17 日消息，据《商业内幕》今天（17 日）早间报道，Anthropic 员工普遍认为，AI 将取代自己大部分工作，绝大多数美国劳动者则持不同看法。Anthropic 最新研究对比了美国成年人和 1334 名公司员工的调查结果。大多数 Anthropic 员工预计，到 2030 年，自己至少 80% 的工作可以交给 AI 完成，而美国劳动者中只有约 5% 的人持相同看法。研究反映出 Anthropic 员工与普通美国人对 AI 未来发展的判断存在巨大差异。对于 AI 能力的进步速度、节省工作时间的效果，以及未来经济增长的速度，Anthropic 员工的预期都乐观得多。以调查结果的中位数计算，Anthropic 员工预计，到 2030 年底，开发一款新 AI 模型所需的工作中，95% 可以由 AI 完成。Anthropic 首席经济学家彼得 · 麦克罗里认为，员工们的判断或许能帮助外界为更先进的 AI 做好准备：“我们发表这项研究，是因为 Anthropic 在 AI 应用方面比整个经济体系领先约一年半。换句话说，Anthropic 内部发生的变化，可能预示着整个社会接下来会发生什么。”Anthropic 还调查了劳动者使用 AI 的情况及对 AI 未来影响的看法。研究显示，美国成年人和 Anthropic 员工对 AI 目前能做什么，基本有着相同的认识。但对于 AI 进步有多快、应用会有多广泛，以及能节省多少时间、提高多少生产率，双方的看法存在分歧。IT之家从报道中获悉，造成上述差异的原因可能不止一个。Anthropic 员工可以获得更多使用 AI 工具的预算，还经常有机会试用尚未公开发布的模型。相比之下，普通美国劳动者从事体力劳动或服务业工作的比例更高。调查显示，技工、生产和运输行业的劳动者认为，到 2030 年，AI 能够接手的工作比例相对最低。Anthropic 员工、科技行业从业者以及商业和金融业受访者则预计，AI 将承担更多工作。就业前景方面，大多数 Anthropic 员工预计，美国失业率将在 2030 年超过 12%；多数美国劳动者则认为，届时失业率不会超过 8%，或者维持在 8% 左右。美国当前的失业率为 4.2%。对于 AI 究竟会给就业市场带来多大冲击，现有研究尚未得出一致结论。Anthropic 研究人员还利用问卷回答推算了受访者对经济增长的预期。以中位数计算，美国成年人对应的 2030 年 GDP 增速为 5.4%，Anthropic 员工则高达 17.1%。作为对比，美国去年 GDP 增长了 2.2%。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/014/205.htm", "publishedAt": "2026-10-16T23:45:10+00:00"}, {"title": "Anthropic 向美国国会推介 AI 监管草案，仅允许出现严重风险时封锁模型", "summary": "IT之家 10 月 17 日消息，据 POLITICO 报道，三名知情人士透露，Anthropic 的代表已悄悄向美国国会山的议员推介了一份法案草案，旨在规范前沿人工智能的安全与防务标准。据悉，目前美国国会正审慎评估如何对这一飞速发展的行业确立监管框架，而该草案的提出，标志着这家顶级 AI 实验室正在采取切实行动，试图左右针对自身技术的监管规则。“该法案体现了 Anthropic 在《先进人工智能框架》中提出的核心方案，我们自 6 月起就一直在向联邦及各州立法者游说推介，”Anthropic 发言人表示，“我们坚信国会应当在这些务实合理的政策上采取立法行动。”草案大幅收紧了监管干预的门槛：仅在模型可能造成可预见、迫在眉睫的“超过 10 亿美元（IT之家注：现汇率约合 67.03 亿元人民币）经济损失”或“导致 50 人以上死亡或重伤”时，政府方可叫停该模型的发布或使用。此外，上述风险必须特定源自生物武器制造或扩散、模型脱离开发者掌控，或是引发严重网络攻击。这一行文措辞直接沿用了包括去年签署生效的 SB 53 等加州现行 AI 法案中的核心条款。今年夏天，多家头部 AI 实验室曾披露多起安全事件，显示其研发的 AI 智能体自主对部分网站和平台实施了入侵或扫描探测。不过截至目前，尚未有报告显示这些事件引发了大规模伤亡或超过 10 亿美元的经济损失。Anthropic 提出的草案还将推翻部分州级人工智能法律，涉及风险公开披露、第三方测评以及重大安全事件上报等核心规定。众多科技行业团体曾表示，相较于统一的国家标准，各州各自为政、碎片化的法规网络会让企业难以适从并推高合规成本。该草案同时对前沿模型实验室提出了明确要求：必须建立安全框架、发布新型前沿模型的透明度报告、落实举报人保护机制，并在发生重大安全事故时向美国商务部履行通报程序。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/014/193.htm", "publishedAt": "2026-10-16T23:05:10+00:00"}, {"title": "Claude 当起“数字考古学家”：不到 30 分钟揭开困扰密码学界 26 年的 NSA 参数来源之谜", "summary": "IT之家 10 月 17 日消息，Anthropic 公司昨日（10 月 16 日）发布博文，宣布其内部研究用 Claude 模型用不到 30 分钟，追溯出五条美国国家标准与技术研究院（NIST）标准椭圆曲线的“种子”（seed）来源，为一桩延续约 26 年的密码学悬案提供了可复现的答案。IT之家注：这里的种子（seed），可以理解为“生成椭圆曲线参数时使用的一段起始数据”，生成规则像一台固定程序的机器，种子就是投入机器的原料。同样的原料，按照同样的规则处理，就能得到同样的结果。公开种子后，其他人可以复算，检查曲线参数是否确实按公布的步骤生成。谜题源于 2000 年纳入美国数字签名标准的一组椭圆曲线。相关种子由美国国家安全局（NSA）提供，却未说明生成过程，长期引发是否暗藏后门的猜测。这些曲线用于椭圆曲线数字签名算法（ECDSA），帮助验证数字信息的真实性。据 Anthropic 介绍，Claude 转而排查上世纪 90 年代常见的软件工具，发现这些种子实际来自 C 语言库中的伪随机数生成器 lrand48，初始化输入则是 Unix 时间戳。模型通过识别位模式、恢复生成器状态并反向推算，将相关生成时间追溯至 1997 年至 1998 年。其中，P-256 的标准种子对应一次运行中的第 1,842 个候选值。团队已公开复现代码。结果显示，P-192、P-224、P-256、P-384 和 P-521 的种子，均可由 1997 年至 1998 年的 Unix 时间戳初始化生成。其中，P-256 对应 1997 年 8 月 16 日，经过 1,842 轮候选生成得到标准中的种子。Anthropic 强调，这不是破解 ECDSA，也没有发现新的攻击方式，结果降低了参数被刻意植入后门的疑虑，用户无需因此采取措施。不过，研究尚未解释全部细节，包括 B-163 种子的来源、部分曲线基点的生成方式，以及为何跳过某些可用候选曲线。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/014/191.htm", "publishedAt": "2026-10-16T22:53:05+00:00"}, {"title": "生产级大模型平台工程实战手册", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/xQLd004RGWrzFhwqBOyC?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-16T17:00:00+00:00"}, {"title": "范式智能联合睿思智联推出开源一站式生产级AI部署平台 “模域ModelSphere”", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/VZPlIIdGRg062mgwJe5y?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-16T16:38:02+00:00"}, {"title": "GOTC 系列活动 || 在 AI Native 时代，招募 200 位少年一起来创造！", "summary": "Technology Anchors the Future Sailing Toward the Stars and the Sea 在AI Native时代招募200位少年 一起来创造！ GOTC少年系列活动 | 北京亦庄 GOTC Youth Series · Beijing Etown 这是一场什么样的黑客松？ 2026年11月7日-8日，由北京大学计算机学院与北京亦庄实验中学共建的北京亦庄少年人工智能学院，联合开源中国...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503065", "publishedAt": "2026-10-16T11:50:05+00:00"}, {"title": "从\"会用工具\"到\"能创造工具\"，中国—中亚\"校长π圆桌\"，共话AI时代科技人才培养", "summary": "西安，2026年10月16日 —— \"2026中国—中亚青年科学家人工智能对话活动\"第二日议程中，开源中国副总裁、教育及创新生态业务CEO李晨出席\"校长π圆桌：AI时代科技人才培养路径\"对话环节，与中学、科普场馆、高校的一线教育者及中外青年学子同台对话，系统阐述开源生态赋能青少年AI人才培养的路径与实践。 本场圆桌由西安国...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503064", "publishedAt": "2026-10-16T11:22:57+00:00"}, {"title": "Pizza Bot：开源的后台 AI 智能体收件箱", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/aMgWFmwZ2HoZDtw1g0MQ?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-16T11:06:00+00:00"}, {"title": "🔥🔥GOTC 2026 全球开源技术峰会，这次玩点不一样的！", "summary": "去年，GOTC 2025 在北京落幕：3,000+ 人次现场参会，600 万+ 线上观看，4 亿+ 媒体曝光。 今年，我们把镜头推得更近——GOTC 2026 全球开源技术峰会全面升级：从「主论坛 + 分论坛」的演讲型峰会，进化为全球化大型「开源 × AI 生态创新活动」。观众不只是听众，更是参与者、共建者与传播者。 2026：从\"听峰会\"到\"逛现场...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503061", "publishedAt": "2026-10-16T09:24:43+00:00"}, {"title": "Meta 发布 Muse Spark Open：和苹果合作打造、声称是「美国 e": "爱范儿", "sourceUrl": "https://www.ifanr.com/1684442?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-10-15T12:00:02+00:00"}, {"title": "AI时代，商学院这样培养未来商业领袖", "summary": "未来十年共创1000个AI课题", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/10/503504.html", "publishedAt": "2026-10-15T07:22:34+00:00"}, {"title": "苹果 HomeView 上手汇总：「果家」首秀小惊艳，SiriAI 很聪明", "summary": "苹果 AI 终于有「家」了#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1684341?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-10-14T12:35:44+00:00"}]}, {"label": "论文研究", "items": [{"title": "Anthropic 报告：AI 工时已是人类 6 倍，初级程序员岗位骤减，人均雇员创收是 Meta / 谷歌同期的 2 至 4 倍", "summary": "IT之家 10 月 17 日消息，人工智能公司 Anthropic 昨日（10 月 16 日）发布报告称，在公司成立约 5 年后，其人均雇员创收已达 Meta Platforms 和谷歌在各自高速增长期的 2 至 4 倍。这一数据基于 Anthropic 截至 2026 年 4 月的内部财务与员工规模记录，并与 Meta、谷歌成立五年时的公开财报数据进行通胀调整后比较。报告显示，Anthropic 技术部门初级员工占比已从 2025 年初的 21% 降至 14%，初级技术岗位招聘占比更从 27% 骤降至 9%。约三分之一的机器学习经理和五分之一的软件工程经理表示，因 AI 出现而减少了招聘。与此同时，公司整体仍在扩张，销售、财务和招聘等岗位增长更快。智能体工作时长超过人工工作时长。注：我们仅考虑员工主导的交互式会话和子智能体池。工作时长概念指智能体运行时间，包括推理和工具使用，但不包括超过 30 分钟的等待时间。人工工作时长按人数计算，并假设每周 40 小时。AI 带来的不只是岗位收缩，也包括效率跃升。采用编码智能体后，工程师人均代码提交量达到 6 个月前的 5 倍；律师处理更多合同，财务处理更多发票，销售人员成交更多订单。报告追踪 192 名采用编码智能体的工程师后发现，其代码产出在采用后明显上升，且后续被删除或回滚的代码比例未见恶化。报告称，到 2026 年 8 月，员工部署的交互式 AI 智能体工作时长已达人类员工的 6 倍；早在 3 月，全公司智能体总工时就首次超过人工工时。IT之家附上相关图片如下：各职能部门生产率激增。注：采用 Loess 平滑法对基础指数化产出数据进行拟合。但“人机协作”也带来新负担。报告称，即使非技术员工，阅读其 Claude 智能体全部输出也可能占去半个工作周；员工正从“执行者”转向“智能体管理者”，负责写指令、搭建监控面板、审查 AI 产出。2026 年春季，这类“元工作”已占员工交互式 Claude 会话的 22%，高于前一年的 10%。基于个人逐步采用 AI 的生产力提升估算。注：系数比较了采用编码代理的用户和未采用者，并考虑了用户和日历月的双向固定效应。处理时间基于用户首次至少进行 5 次代理会话的月份。柱状图表示基于用户聚类的标准误差的 95% 置信区间。质量面板比较了用户直接编写的代码和同一用户使用编码代理编写的代码。质量指标包括：90 天内因任何原因删除的代码行数占比；专门因错误修复而删除的代码行数占比；是否显式回滚整个提交；是否添加了代码检查抑制注释；是否添加了需要修复的注释；以及是否将测试标记为跳过、重试或允许失败。招聘标准随之改变：管理者更看重候选人的自主性、判断力及创造性使用 AI 的能力，而非狭窄的领域专长和具体执行能力。Anthropic 同时建立了岗位风险预警机制，并优先在内部重新调配受影响员工。按 Claude 使用复杂度划分的初级就业增长情况。注释：图表以职位为单位。增长率比较了 2026 年 1 月和 2026 年 7 月的就业人数。人工智能复杂度基于代理日志的自动编码（就业人数下降之前，即 2025 年 10 月至 12 月），并进行了百分位数转换。图中的点按该职位 1 月份的就业人数进行缩放；回归线拟合于加权点。不过，人均创收并非衡量企业健康度的唯一指标。外部研究机构 Epoch AI 此前估算，Anthropic 在 2026 年 4 月的人均年化营收约为 900 万美元，明显高于 Meta 的约 255 万美元和谷歌的约 211 万美元；但该机构也提醒，其员工数量与营收数据并非同期披露，估算存在不确定性。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/014/195.htm", "publishedAt": "2026-10-16T23:13:28+00:00"}, {"title": "腾讯评估研究团队的“Agent 舰队”被钓出来了", "summary": "一群智能体在腾讯云上跑了 11 天，试图从高德地图里挖掘数据——然后它们发现自己在被调查，居然主动和调查者聊了起来。按 swarmcha.se 调查团队的说法，这是人类研究者第一次和仍在运行中的失控智能体搭上话。 9 月 28 日到 10 月 8 日，这批智能体做了 2600 多次尝试。它们的任务相当日常：「用高德导航去成都动物园，...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503037/swarmcha-se-chinese-agent-fleet-full-report", "publishedAt": "2026-10-15T07:48:52+00:00"}, {"title": "Palantir CTO 上电视骂 AI 安全是“邪教”，还戏称 AI 研究者靠抽烟表信仰", "summary": "Palantir 首席技术官 Shyam Sankar 在 CBS《Face the Nation》上抛出了几个惹火的判断。节目开头，主持人 Margaret Brennan 先甩了个民意数字：CBS 民调里 50% 的人认为 AI 带来的问题会多于解决的，45% 的美国人希望政府限制 AI 的研发和使用。他的回应不是顺着'该不该设护栏'谈，而是直接点名了一个他认为真正在背后操...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503000", "publishedAt": "2026-10-13T08:56:20+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "苹果 App Store 新规落地，AI 深度伪造迎来最严审核", "summary": "IT之家 10 月 17 日消息，苹果公司昨日（10 月 16 日）更新《App 审核指南》，在最新修订的 1.2 条款中，加强治理针对 AI 内容创作类应用，将 AI 生成的、未经当事人同意的私密图像明确纳入禁止范围。IT之家附上修订内容如下：1.2 用户生成内容对于包含用户生成内容的 App，有特定的难题需要解决，比如知识产权侵权、未经同意传播私密图像、匿名欺凌等。为了避免滥用，包含用户生成内容或社交网络服务的 App 必须满足以下条件：采用相应的方法来过滤令人反感的内容，以免这些内容在 App 中发布制定一个机制，以举报攻击性内容并在出现问题时及时作出回应若用户发布攻击性内容，可以取消其使用服务的资格公布联系信息，以便用户与你联系科技媒体 9to5Mac 指出，此次调整的直接背景，是近一年围绕 App Store 的多起争议。科技透明度项目曾发现数十款 AI“裸体化”应用，并指出 App Store 的搜索建议和广告也会把用户导向这类应用；旧金山官员随后要求苹果下架 8 款可生成未经同意私密图像的应用。此外用户曾投诉 xAI 的 Grok 聊天机器人被用于制作裸露或性化深度伪造图像；今年早些时候，苹果曾警告 xAI，若继续放任此类内容，将把 Grok 从 App Store 下架。xAI 随后增设防护机制，更新版本才获得批准。苹果还新增 2.5.19 条准则，禁止应用在审核时隐瞒真实功能、通过后再加入“裸露化”（nudify）等有害能力。这类“先过审、后解锁”的做法被称为“诱饵式营销”，今后可能导致应用下架，开发者也可能被终止 Apple Developer Program 资格。此外，苹果将禁止助长人口贩卖或剥削儿童的应用的范围，扩展至替代应用分发渠道，并表示对违规应用和开发者“不会犹豫”采取下架或终止合作等措施。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/014/209.htm", "publishedAt": "2026-10-16T23:55:28+00:00"}, {"title": "英监管机构拟认定微软商业软件“垄断地位”，或干预旗下产品捆绑销售", "summary": "IT之家 10 月 17 日消息，据路透社 16 日报道，英国竞争与市场管理局拟认定微软在商业软件市场具有“战略市场地位”，此举可能使监管机构有权干预微软将 Excel、Teams 及 AI 助手 Copilot 等产品捆绑销售的做法。今年 5 月，英国竞争与市场管理局开始调查微软在商业软件市场的地位是否妨碍竞争。据悉，微软的商业软件在英国每月约有 2000 万用户。监管机构当天指出，微软在 PC 操作系统以及办公、安全、服务器和数据库管理软件市场均占据强势地位，客户转用其他供应商的产品时面临诸多障碍，进一步巩固了微软的市场优势。微软发言人不认同这一结论：“我们的所有产品，包括 Copilot，都采用开放设计，能够与其他服务互通，客户可以同时使用微软产品和竞争对手的服务。”英国竞争与市场管理局接下来将调查客户能否自由选择 AI 工具，以及其他厂商能否与 Copilot 展开竞争。据IT之家了解，监管机构还将审查微软将安全软件与其他产品捆绑销售的做法是否限制客户选择，以及软件授权方式如何影响客户选择云服务。英国竞争与市场管理局 CEO 莎拉 · 卡德尔说，从小型企业到重要公共服务机构，英国各地的工作场所都离不开商业软件和云服务。“企业和机构应该能够选择最适合自己的产品，需要时可以更换供应商，也可以同时使用不同供应商的服务。我们希望确保企业能够自由决定如何将微软产品与其他产品搭配使用。”英国竞争与市场管理局将就这项提议征求各方意见，并在 2027 年 2 月前作出最终决定。如果提议获得通过，微软将成为第三家受到英国数字市场新监管制度约束的企业。此前，谷歌因网络搜索业务被认定具有战略市场地位；2025 年 10 月，谷歌和苹果的移动平台也获得同样认定。监管机构还指出，微软和亚马逊云科技（AWS）仍需进一步消除客户更换云服务商、同时使用多家云服务商时面临的障碍。两家公司采取了一些措施来增加客户的选择，这其中包括推动各自的数据中心与竞争对手互联，以及免除客户更换云服务商时的数据传输费用。对此，监管机构认为，仍有改进余地。英国竞争与市场管理局将继续与两家公司合作，同时评估是否需要对云服务行业启动正式调查。微软发言人称：“我们欢迎英国竞争与市场管理局承认，微软在云服务市场的地位不足以成为依据数字市场竞争制度认定其具有战略市场地位的理由。”AWS 同样对监管机构公布的最新进展表示欢迎：“2026 年，我们持续投资开发 AI、多云服务和开放标准方面的新功能，让客户在构建和运营系统时拥有更大的自主权。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/014/200.htm", "publishedAt": "2026-10-16T23:27:03+00:00"}, {"title": "马斯克要让 AI 帮企业“砍价”：成本效益有望提升 5% 以上", "summary": "IT之家 10 月 17 日消息，全球首富埃隆 · 马斯克（Elon Musk）今天（10 月 17 日）在 X 平台发布推文，表示其团队正投入大量资源，开发面向商业场景的专用议价机器人“Hagglebot”，希望借此提升企业成本效率。IT之家注：“专用议价机器人”就是为企业谈价格、争取更好交易条件而设计的 AI 软件，并非实体机器人。这里可以把它想象成一个“数字采购谈判员”：企业给它设定预算、可接受价格和交易条件，它再围绕这些目标协助议价。他预计，该产品有望将企业成本效率提高 5% 甚至更多；若将这一幅度放到全球 GDP 规模上测算，每年节省的成本最高可达 6 万亿美元（现汇率约合 40.22 万亿元人民币）。此次表态源于他回复一名用户介绍 Grok Bots 的帖子。该用户声称，Haggle Bot 在投入使用的第一周，就为团队节省了超过 10 万美元（现汇率约合 67 万元人民币）。定位方面，Hagglebot 瞄准的是企业商业议价需求，而非普通聊天功能。不过，目前公开信息仍十分有限：马斯克尚未说明它将如何开展议价、能够处理哪些交易，也未公布上线时间、收费标准或开放使用范围。", "sourceName": "IT之家", "sourceUrl": "https://www.ithom const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
