种图片等恶意规避审核行为实施前置拦截。暑期旅行安全专项方面，7 月以来小红书针对“危险旅游景点、虚假旅游信息”展开治理，累计清理违规信息万余条。对飞拉达漂流、悬崖秋千、赛里木湖游泳等高危项目笔记实施搜索隐藏和流量限制，干预 20 余组安全隐患搜索词并上线安全提示条。平台同时对以“AB 制”“旅行搭子”“拼车拼团”等名义进行虚假引流的欺诈产业链进行摸排治理。上半年已配合多地警方抓获批量造假注册专业号的黑灰产团队 4 个、嫌疑人 14 名。在旅游经营资质治理方面，平台集中处置虚假营销账号超 2000 个，处置无资质营销企业账号超 6000 个，无资质营销的个人及导游账号超 9000 个。平台表示将对任何侵害未成年人合法权益的行为“零容忍”，并持续压实主体责任。相关阅读：《网信办将整治毒动画：利用 AI 技术恶搞经典动画形象，刻意放大暴力恐怖元素》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/985/708.htm", "publishedAt": "2026-08-04T14:06:50+00:00"}, {"title": "Microchip 与美光合作展示高性能 PCIe 6 存储架构：资源解耦设计、兼容组播功能", "summary": "IT之家 8 月 4 日消息，Microchip 今天与美光合作展示高性能端到端 PCIe Gen 6 存储架构，这套方案结合了 Microchip 的 PCIe Gen 6 交换芯片和美光 9650 NVMe 固态硬盘。据介绍，Microchip PCIe Gen 6 交换芯片可与多款美光固态硬盘连接，支持高带宽、低延迟特性，兼容资源解耦设计，可帮助数据中心充分扩展存储资源。同时，PCIe 6.0 的带宽相比 PCIe 5.0 提升一倍，每通道数据传输速率可达 64GT/s，完全满足高负载 AI 工作所需的持续吞吐能力。规格方面，Microchip 的 PCIe Gen 6 交换芯片基于 3nm 制程工艺打造，支持高级错误隔离功能、全面诊断能力，并兼容组播（IT之家注：Multicast）功能，可在 PCIe 域内实现高效的一对多数据分发。而美光 9650 固态硬盘专为数据密集型工作设计，适用于 AI 大模型训练、大型数据库等应用场景。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/985/703.htm", "publishedAt": "2026-08-04T13:44:34+00:00"}, {"title": "开源版Claude Science来了！零依赖、MIT协议，内置30+项科研Skills", "summary": "北京大学&元空AI Agent联合实验室", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/466386.html", "publishedAt": "2026-08-04T13:14:27+00:00"}, {"title": "Linux 暂存区不欢迎 AI 生成补丁，安全修复需通过实际硬件测试验证", "summary": "IT之家 8 月 4 日消息，Linux 内核维护者、Linux 基金会研究员 Greg Kroah-Hartman 于当地时间周一宣布了一项新政策：针对 Linux 内核的暂存区（drivers/staging/），将不再接受由 AI 模型生成的补丁，但真实有效的安全漏洞修复除外。Greg 解释称，近期 Linux 暂存区收到大量由 LLM 生成的补丁，因此有必要明确相关政策。他指出，暂存区的主要目的并不是维护成熟代码，而是作为新开发者学习 Linux 内核开发流程的入口。Greg KH 认为，如果直接使用 AI 工具自动完成这些修改，将违背该区域帮助新人学习和成长的初衷。Greg 强调，暂存区并非为了追求代码完美，如果团队真正关心代码质量，完全可以借助工具在一天内解决所有编码风格问题，但保留这些问题的意义正在于让新人得以起步和成长。他同时警告，提交者提交的 LLM 补丁很容易被识别，不要以为不披露使用情况就能“蒙混过关”。如果有人蓄意欺骗维护者，此次声明即为预先警告。对于安全问题，Greg KH 表示，当前 LLM 工具在发现 Linux 内核潜在安全漏洞方面已经具备一定能力。但目前即使是最优秀的 AI 工具，其生成结果中至少有三分之一是完全错误或有害的。因此，如果提交者认为 LLM 发现并修复的暂存区问题确实有效，可以提交，但必须首先在对应驱动的实际硬件环境中完成测试，并详细说  统一存储，Web 端提供拓扑 / Trace / 指标与多 Agent 排障。项目已在 OSCHINA 软件库收录：https://www.oschina.net/p/databuff 今天，DataBuff 正式发布 v0.1.6。相对 v0.1.5 共 20 个提交，本版无 Schema...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/485932/databuff-0-1-6-released", "publishedAt": "2026-08-03T01:30:24+00:00"}, {"title": "实测 DeepSeek V4 正式版：3 块钱干完 5 件事，AI「智价比」之战开打了", "summary": "顶级模型的竞争，正在从单纯比拼能力上限，转向同时争夺「智价比」。#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1673553?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-07-31T11:50:59+00:00"}]}, {"label": "产品发布/更新", "items": [{"title": "W16 发动机并未谢幕？布加迪预告新品", "summary": "IT之家 8 月 5 日消息，W16 发动机时代已经结束，至少布加迪此前一直都是这么说的。在 Mistral 项目期间，这款车型被官方定义为“W16 发动机的告别之作”。不过，现在看来，这场告别并没有真正画上句号，或者说，更像是一场迟迟不肯结束的“漫长告别”。近日，布加迪再次发布了一段与 W16 发动机有关的预热视频，虽然视频时长仅 4 秒，官方透露的信息也寥寥无几，但足以引发外界猜测。这次显然不会是另一款量产车型，不过，布加迪专门负责打造超限量定制车型的 Programme Solitaire 部门，似乎正在筹备一款全新的作品。IT之家注意到，首支预告片名为《速度的雕塑》（The Sculpture of Speed）。视频中仅短暂展示了一块刻有经典“W16”标识的发动机盖板。官方配文写道：“Captured, shaped, preserved（捕捉、塑造、珍藏）。”这也让人猜测，这次发布的究竟是一辆新车，还是类似于布加迪此前推出的高端腕表等联名作品。仅一天后，布加迪又发布了第二支预告片。这次视频隐约展示了一款全新的进气格栅设计。它与现有布加迪车型采用的狭长马蹄形格栅截然不同，整体更加宽大且接近方形，即便是最新的 Tourbillon 也没有采用类似设计。如果熟悉 2015 年发布的 Atlantic 概念车，这一造型会让人感到似曾相识。第二支预告片配文写道：“对惊艳比例与美感的礼赞。当卓越工程与极致性能化作纯粹优雅的艺术杰作。”官方再次标注了 Programme Solitaire 部门，这一部门此前曾打造过向现代布加迪缔造者致敬的 FKP Hommage 等超限量定制车型。借助这一部门推出特别作品，也让布加迪能够绕开此前“W16 正式谢幕”的表态。事实上，不难理解布加迪为何迟迟不愿彻底放弃 W16 发动机。这台 8.0 升四涡轮增压 W16 发动机不仅是一项极具代表性的工程成就，也体现了大众集团前掌门人费迪南德 · 皮耶希（Ferdinand Piëch）近乎执着的技术理想。当时几乎没有任何一家车企像皮耶希那样，愿意不计成本追求工程极限，而这一理念也造就了大众集团在世纪之交推出的一系列传奇产品。随着 Mate Rimac 接掌布加迪，以及日益严格的排放法规带来压力，公司最终决定结束 W16 时代。布加迪早在 2022 年便宣布，Mistral 将成为最后一款搭载这台经典发动机的车型。根据不同车型调校，这台 W16 发动机最大功率可超过 1,800 马力。未来，布加迪将全面转向全新的自然吸气 V16 混合动力系统。这套动力总成仅发动机本身即可输出 1,000 马力，再配合电动机提供约 800 马力的额外动力。无论布加迪此次准备发布什么产品，答案应该很快就会揭晓。本周末，一年一度的美国蒙特雷汽车周（Monterey Car Week）即将开幕。这项被誉为全球最顶级、最昂贵的汽车盛会，历来都是超豪华品牌发布重磅新车和限量定制作品的重要舞台，而布加迪此次神秘新品，也极有可能会选择在那里正式亮相。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/985/755.htm", "publishedAt": "2026-08-04T23:50:33+00:00"}, {"title": "Anthropic 与初创公司 Volta 签订 100 亿美元算力采购协议，后者成立仅半年", "summary": "IT之家 8 月 5 日消息，人工智能公司 Anthropic 已与云计算初创企业 Volta Infra Holdings 签署了一项价值 100 亿美元（IT之家注：现汇率约合 676.59 亿元人民币）的算力采购协议，锁定未来六年的计算资源。据彭博社报道，Volta 成立仅数月，这笔交易将持续六年。此次提供的算力来自挪威蒂达尔（Tydal）的一座数据中心。该数据中心由比特币矿企 Bitdeer Technologies 运营，采用水力发电供能，并部署了英伟达最新的 Vera Rubin AI 芯片。Volta 表示，该项目可提供 133 兆瓦的算力容量，交付将分两个阶段完成，预计最迟于 2027 年 3 月全部交付。该公司还表示，已在近期锁定了总计 1 吉瓦的数据中心电力资源。受消息影响，Bitdeer 股价上涨 14%。Volta 由资产管理公司 Brookfield 的前高管于 2026 年初创立。借助此次与 Anthropic 达成的合作，公司同步完成了 3 亿美元（现汇率约合 20.3 亿元人民币）风险投资融资，本轮融资由 Andreessen Horowitz 和 Altimeter Capital 领投。英伟达和戴尔创始人迈克尔 · 戴尔（Michael Dell）也参与了投资，使 Volta 的估值达到 24 亿美元（现汇率约合 162.38 亿元人民币）。此外，Volta 还设立了一项规模 50 亿美元（现汇率约合 338.29 亿元人民币）的融资计划，帮助客户承担价格高昂的 AI 芯片采购成本。Anthropic 目前正大幅扩充自身的算力资源。除 Volta 之外，该公司此前已经与谷歌、博通、亚马逊、SpaceX 以及 AMD 等企业达成了相关合作协议。不过，也有分析人士对此表示担忧。他们认为，AI 开发商与芯片供应商之间不断加深的合作关系，使整个产业链相互依赖程度越来越高。一旦未来 AI 需求低于市场预期，这种复杂的利益绑定关系可能会放大整个行业面临的风险。Volta 本身就是这种趋势的典型案例。英伟达既是 Volta 的投资方，同时也是其部署 AI 芯片的供应商，兼具投资者和设备提供商的双重身份。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/985/747.htm", "publishedAt": "2026-08-04T23:25:20+00:00"}, {"title": "Agent 的错误记忆，比没有记忆更加危险！", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/video/QLwCqPT2T2ZwzbTs8xud?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-04T16:23:54+00:00"}, {"title": "Agent 记忆，不能只靠聊天记录", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/qm3RHL133SESFZJGrmeA?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-04T14:37:52+00:00"}, {"title": "台积电晶圆与 GDDR7 双重涨价：英伟达 RTX 50 系列韩国最高涨价 30%，RTX 5090 最高涨至 730 万韩元", "summary": "IT之家 8 月 4 日消息，受台积电先进制程晶圆涨价及 GDDR7 显存成本攀升影响，NVIDIA GeForce RTX 50 系列显卡在韩国市场迎来新一轮价格调整。据 ZDNet Korea 昨日报道，多位韩国进口商与经销商已证实，各大显卡品牌计划自 8 月起将 RTX 50 系列产品价格上调，不同型号涨幅在 20% 至 30% 之间。台积电于 7 月通知客户，计划将 3nm、5nm 及 7nm 制程价格上调 5% 至 10%，覆盖其七成以上晶圆代工营收。与此同时，TrendForce 数据显示，RTX 50 系列搭载的 GDDR7 2GB（16Gb）模块单价已涨至 20 美元出头。英伟达向显卡厂商交付时采用 GPU 核心与 GDDR7 显存捆绑打包的套件形式，上游成本波动直接传导至板卡厂商。以 RTX 5090 所需的 16 颗 GDDR7 芯片计算，仅显存采购成本就已超过 320 美元（现汇率约合 2,165 元人民币），这还不包含 GPU 核心本身及板卡厂商的运营成本。一位制造商代表透露，主要品牌在 8 月涨价前已暂停出货，能在涨价前完成备货的业者并不多。据韩国比价网站 Danawa 数据，最便宜的 RTX 5060 Ti（8GB）现售价约 70 万韩元（现汇率约合 3,295 元人民币），较此前上涨约 10 万韩元（现汇率约合 470.7 元人民币）；RTX 5070（12GB）最低售价约 110 万韩元（现汇率约合 5,178 元人民币），上涨约 20 万韩元。其中，旗舰型号 RTX 5090（32GB）涨幅最大，最高已达 730 万韩元（IT之家注：现汇率约合 34,361 元人民币），较 7 月中旬上涨达 150 万韩元（现汇率约合 7,061 元人民币）。相关阅读：《消息称英伟达 RTX 50 系列显卡场批价一周最高上涨 800 元》《网传显卡涨价引热议，消息称各品牌 RTX 50 系列供货量进一步收紧》《消息称 NVIDIA 非 GeForce RTX 5090 / 5090 D v2 显卡迎来套件出货价格补涨》《GDDR7 显存太贵：RTX 50 SUPER 显卡被曝已交付 AIB，但英伟达要求暂缓发售》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/985/687.htm", "publishedAt": "2026-08-04T12:57:34+00:00"}, {"title": "给 Agent 装上方向盘和刹车，Harness 时代的工程新范式", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/QxdM6J3uFpZA0CXgNhDq?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-04T09:59:56+00:00"}, {"title": "九有数据库“可信多模 AI 数据底座关键技术及应用”通过科技成果评价", "summary": "近日，深圳九有数据库有限公司（以下简称“九有”）联合北京大学共同攻关的“可信多模AI数据底座关键技术及应用”项目，顺利通过先进技术成果西部转化中心组织的科技成果评价。经专家组严格评审，项目获评权威结论：成果技术总体达到国内领先水平，部分技术达到国际领先水平。 本次科技成果评价专家组由中国科学院院士张...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/487222", "publishedAt": "2026-08-04T09:55:54+00:00"}, {"title": "开发者苦 “造轮子” 久矣，HarmonyOS 7 正在抹平系统能力的接入鸿沟", "summary": "Skill和Agent也能被封装调用", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/466262.html", "publishedAt": "2026-08-04T09:18:08+00:00"}, {"title": "DeepSeek低价风暴打服硅谷！海外平台争相倒贴V4 Flash", "summary": "那还说啥了梁圣，我订阅费全给你就是了呗", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/465814.html", "publishedAt": "2026-08-04T08:18:45+00:00"}, {"title": "API 智能开发平台 5.3 发布", "summary": "ApiGo 是是一款基于 AI 技术的企业级低代码 API 开发与治理平台。 通过智能化配置快速将数据变成标准 REST API，生成 AI Skill 技能， 实现从设计、开发到运维的全生命周期智能管理。支持多数据源（mysql、oracle、postgresql、Kingbase、达梦、TiDB、es、H 审代码、...", "sourceName": "开源中国", "sourceUrl": "https://my.oschina.net/koderover/blog/19732505", "publishedAt": "2026-08-03T10:45:48+00:00"}, {"title": "Elastic 的 AI agent 为你编写自动化流程", "summary": "Elastic Workflows 接受纯文本提示词，并生成你可以检查、版本控制和针对 Elasticsearch 数据运行的 YAML。现在已正式发布，支持 Slack 中的人机协同工作流、并行执行以及 10 个新的连接器。", "sourceName": "开源中国", "sourceUrl": "https://my.oschina.net/u/3343882/blog/19732209", "publishedAt": "2026-08-03T08:06:44+00:00"}]}, {"label": "行业动态", "items": [{"title": "被指招聘时歧视美国公民，OpenAI 支付 320 万美元和解", "summary": "IT之家 8 月 5 日消息，美国司法部当地时间周二宣布，OpenAI 将支付 320 万美元（IT之家注：现汇率约合 2,165.1 万元人民币），以和解其在招聘过程中被指优先录用持临时签证的外国员工、歧视美国公民的相关指控。美国司法部调查发现，OpenAI 在招聘部分岗位时，未在公司的对外招聘网站上公开发布职位信息，而是直接招募并录用了外国员工。司法部还表示，OpenAI 及其子公司 Statsig Inc.采取了其他一些不寻常的做法，以降低美国求职者的申请意愿，例如选择在深夜发布招聘信息，并要求求职者提交纸质申请材料，而非电子申请。根据美国移民法，如果企业无法找到符合条件的美国本土员工，可以为外国员工申请永久居民身份（绿卡），但前提是必须先完成严格的公开招聘程序。根据和解协议，OpenAI 将支付 120 万美元（现汇率约合 811.9 万元人民币）民事罚款，并设立一项 200 万美元（现汇率约合 1,353.2 万元人民币）的补偿基金，用于赔偿“因公司歧视性招聘行为受到影响的受害者”。此外，OpenAI 还必须调整招聘流程和相关政策，为员工提供移民法律培训，并接受持续监督和定期报告要求。OpenAI 发言人表示，公司需要在全球范围内招聘人才，以实现“确保通用人工智能（AGI）造福全人类”的使命。该发言人表示：“虽然我们不同意司法部的调查结论，但我们达成这项协议，是为了妥善解决此事，并继续推进公司的 PERM 项目。该项目对于需要移民支持的员工和求职者至关重要。”司法部表示，此次调查涉及的职位数量“不足 10 个”，但之所以推进此次和解，是因为“美国劳动者被排除在高薪科技岗位招聘之外所造成的损害十分严重”，因此罚款金额体现了这一影响。此次与 OpenAI 达成的协议，也是美国司法部自 2025 年重新启动公民身份就业歧视执法项目以来达成的第 13 起相关和解案件。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/985/753.htm", "publishedAt": "2026-08-04T23:41:42+00:00"}, {"title": "马斯克旗下 SpaceX 宣布携手英伟达开发 Starmind AI1 算力卫星，目标上天 100 万颗", "summary": "IT之家 8 月 5 日消息，埃隆 · 马斯克（Elon Musk）旗下 SpaceX 公司今天（8 月 5 日）宣布携手英伟达公司，探索在地球之外部署 AI 算力，共同开发名为 Starmind AI1 的算力卫星。根据 SpaceX 公布的宏伟蓝图，该公司设想构建一个轨道网络，最终规模可达 100 万颗卫星，从而在太空打造一个分布式人工智能超级计算机。该项目如果能落地，将大幅扩展地球数据中心以外的计算能力，并依靠激光链路以极高的速度在卫星间传输数据。马斯克在 SpaceX 的 2026 年第 2 季度财报电话会议上表示：我们认为 Vera Rubin 架构是最好的架构。我们认为它是目前最好的 AI 计算机，我们非常重视与英伟达在多个层面的密切合作与伙伴关系，所以我们只与英伟达合作。在规格方面，马斯克还表示，该公司计划在其 Starmind 卫星计划中，在地面和太空部署英伟达 Vera Rubin NVL72 机架式系统。", "sourceName": "IT之家", "sourceUrl": "https://www.ithom : "https://www.infoq.cn/video/PPO5ZN9pTtS5WCqgohgz?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-03T16:35:13+00:00"}, {"title": "马斯克要用 AI 打造《奥德赛》电影，我用小云雀 Seedance 2.5 提前实现了", "summary": "导演 AI，正在成为新的创作能力#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1673556?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-07-31T13:27:40+00:00"}]}, {"label": "论文研究", "items": [{"title": "特斯拉财报电话会议数据：马斯克近半发言聚焦 AI 与机器人业务", "summary": "IT之家 8 月 5 日消息，尽管特斯拉上个季度交付了近 50 万辆汽车，约 70% 的收入仍来自汽车销售，但埃隆 · 马斯克正试图让外界相信，特斯拉已经不再是一家传统汽车公司，而是一家人工智能和机器人公司，即便这些 AI 技术中的一部分仍运行在汽车之中。过去几年，马斯克不断强调，特斯拉真正的未来在于人工智能和机器人业务，例如 Optimus 人形机器人和完全自动驾驶 Robotaxi，而传统汽车制造商所关注的日常业务正逐渐退居次要位置。为了展示这一战略转变，TechCrunch 与纽约金融研究公司 Hudson Labs 合作，对马斯克及其他特斯拉高管过去七年在季度财报电话会议上的发言内容进行了分析。据IT之家了解，Hudson Labs 收集了自 2019 年以来标普市场情报（S&amp;P Market Intelligence）提供的财报电话会议文字记录，并利用其专为高精度金融研究打造的 AI 工具 Co-Analyst，对每一句发言进行主题分类，再统计各类话题出现的频率。数据显示，如今马斯克在财报电话会议中，近一半的发言都围绕人工智能、Robotaxi 以及 FSD 展开。相比之下，2022 年时，这些内容通常仅占他发言时间的 15% 至 20%。与此同时，马斯克也一直试图向投资者证明，自动驾驶技术才是支撑特斯拉高估值的核心理由。他在 2024 年第一季度财报电话会议上表示：“如果只是把特斯拉看作一家汽车公司，那么从根本上来说，这就是错误的分析框架。如果有人不相信特斯拉能够实现自动驾驶，我认为他就不应该投资这家公司。”过去三年，马斯克谈论机器人业务的频率同样大幅提升。特斯拉于 2021 年首次公布 Optimus 人形机器人项目。项目公布后的第一年，马斯克谈及 Optimus 的时间占比还不到 2%。而在过去一年，这一比例已经提升至至少 10%，其中在 2025 年第三季度财报电话会议上，Optimus 甚至占据了他近三分之一的发言内容。值得注意的是，马斯克开始频繁谈论这些未来科技概念，恰逢特斯拉核心汽车业务增长陷入停滞。因此，如今他在财报电话会议中谈及汽车制造和生产的话题，已经不足全部发言时间的三分之一。在去年第三季度财报电话会议上，马斯克用于讨论汽车业务的时间甚至不到 20%。相比之下，出席财报电话会议的其他特斯拉高管，例如首席财务官 Vaibhav Taneja 和工程副总裁 Lars Moravy，战略重心转移的速度明显较慢。即便是在最近几次财报电话会议中，他们仍有约 30% 的发言围绕汽车业务展开，其次才是人工智能、Robotaxi 和 FSD 等话题。虽然这些高管的关注重点也在逐步发生变化，但相比马斯克，他们对 AI 和机器人业务的热情明显没有那么高，原因很可能在于这些新业务目前尚未带来真正可观的商业回报。事实上，在更早几年，这些高管在财报电话会议上几乎有一半甚至更多时间都在讨论汽车生产和销售业务。直到 2024 年，随着传统车企和中国品牌竞争加剧，特斯拉汽车业务开始承压，这一情况才发生明显改变。不过，当他们与马斯克一同描绘特斯拉未来蓝图时，依然会延续其一贯的乐观基调。Taneja 在今年第二季度财报电话会议上表示：“通往更加富足未来的道路始终充满挑战，这需要我们大胆下注。我们的进展不会是一条直线，但未来一定会非常美好。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/985/744.htm", "pub     .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
