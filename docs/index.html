const DATA = {"date": "2026-09-22", "generatedAt": "2026-09-22T01:24:38Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "小鹏汽车第二代 VLA 全新版本 XOS 6.3.0 开启推送，号称从 3D 空间识别跃迁至 4D 时空理解", "summary": "IT之家 9 月 22 日消息，小鹏汽车官方今日宣布，第二代 VLA 全新版本 XOS 6.3.0 正式开启推送。官方宣称：全新版本，全面升级。从 3D 空间识别跃迁至 4D 时空理解，凭借更强的时序记忆、轨迹预判与决策响应能力，实现看得更远、想得更深、反应更快、开得更稳。另外，小鹏汽车第二代 VLA Lite 同步开启推送，单图灵 Max 车型正式升级第二代 VLA。小鹏汽车官方此前在 8 月的小鹏物理 AI 分享暨第二代 VLA 全新版本体验日活动表示，第二代 VLA 基于统一技术底座，已实现 L2 至 L4 能力贯通，进一步向更高阶自动驾驶拓展。据IT之家从活动现场了解，小鹏通过学习式 Token 压缩与蒸馏训练，在不牺牲输入信息和模型容量的基础上，以更少的有效 Token 实现高质量视觉理解，将第二代 VLA 基座模型能力部署到算力更低的平台，伴随基座模型能力的增强，蒸馏后的图灵 VLA 2.0 Lite 同样获得能力提升。根据介绍，小鹏第二代 VLA 全新版本模型能力全面增强。小鹏宣布 X-Foresight 预测世界模型首次上车，可预判未来 6 秒会发生什么，推演周边交通参与者未来的可能行为。此外，第二代 VLA 全新引入 Infini-VLA 长时序架构，记得前 30 秒的世界，驾驶判断开始拥有更长的上下文，更多有效信息进入模型。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/005/528.htm", "publishedAt": "2026-09-22T01:12:47+00:00"}, {"title": "荣耀亲选 AI 投影仪 Ultra 亮相：1700CVIA 亮度、真 1080P 画质，国补到手价 1999 元", "summary": "IT之家 9 月 22 日消息，荣耀亲选 AI 投影仪 Ultra 上架京东开启预约（9 月 28 日开售），原价 2599 元、国补到手价 1999 元。京东荣耀亲选 AI 投影仪 Ultra2599 元直达链接这款新品拥有 1700CVIA 流明亮度，符合国家标准并获得权威认证，宣称即使白天不拉窗帘、夜晚开灯直投，也能拥有清晰画面。它采用自研全封闭光机 2.0 技术，升级了防尘性与散热性，从源头提升耐用性，大幅降低光损，让画面更清晰。还配备光镜双玻隔热系统，无偏光片屏体，高密度超亮光源，5 片全域高解析镜头和动态轻音风扇，进一步提升画面亮度和清晰度，保障耐用性同时运行噪音低至 30dB。画质方面，这款投影仪搭载鸿鹄画质引擎，AI PQ 算法深度赋能逐帧精修画面，滤除杂质，拥有更好的质感。它原生分辨率为真 1080P（1920*1080），同时支持 HDR 10、HDR Vivid 解码和 4K 解码，对比度达到 3000:1。核心配置上，荣耀亲选 AI 投影仪 Ultra 搭载 V670 8 核芯片，配备 2GB+64GB 存储，算力提升，支持第三方应用安装；支持 MEMC 运动补偿，减少高速画面拖影、抖动与卡顿。音效方面，它由 vifa 丹麦大师调音，拥有 24W 大功率音箱和 400CC 大音腔；搭载鸿鹄音效 2.0，支持 AI 人声增强和虚拟环绕声。这款新品支持 GPMI 一线通反向操控，单根 GPMI 即可承载全部信号链路，简化布线，还可以实现对外部设备的跨屏反向操控。智能体验方面，它配备 AI 画面校准系统，拥有无感自动对焦、无感自动梯校、自动避障、自动入幕功能，位移投影仪也不中断观影，并能够动态调节。它还支持 AI 隔空指向遥控 2.0，遥控器配备触控板，可以像笔记本一样点按、滑动、拖拽操作，光标精准游走。全局接入 AI 大模型，支持 AI 语音互动，能够实现找片、查天气、调音量等操作，还可以陪你闲聊。此外还支持 AI 触控投影，搭配触控笔可实现精准点触，将投影仪变身为智能白板，适合会议批注、记录笔记、绘画等场景。其他方面，荣耀亲选 AI 投影仪 Ultra 内置了各大平台的海量影视内容，接入荣耀智慧空间，支持远程操控，支持疾速开机无广告，Wi-Fi 6 低延迟，支持 DIY 动态桌面壁纸，接口丰富，配备 USB * 2、3.5mm、HDMI、GPMI、RJ45 接口。拥有钛空灰配色可选，能效等级为一级。IT之家附荣耀亲选 AI 投影仪 Ultra 产品参数如下：京东荣耀亲选 AI 投影仪 Ultra2599 元直达链接2026 年数码家电政府补贴持续进行中，IT 之家为大家汇总国补领券地址，买数码家电之前记得领取。数码补贴：点此领券手机 / 平板 / 3C 数码支持 8.5 折政府补贴，不超过 6000 元的产品至高立减 500 元。家电补贴：点此领券多类家电支持 8.5 折政府补贴，单品至高补贴 1500 元。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/005/522.htm", "publishedAt": "2026-09-22T01:01:25+00:00"}, {"title": "浪潮信息发布元脑 SD200 Ultra 超节点：单机承载 2.8 万亿参数 Kimi K3，Token 时延首次突破 5.85 毫秒", "summary": "IT之家 9 月 22 日消息，在昨日的 2026 人工智能计算大会（AICC2026）上，浪潮信息宣布推出元脑 SD200 Ultra 超节点 AI 服务器与元脑 HC2000 多元算力机组。据官方介绍，元脑 SD200 Ultra 基于国产 AI 芯片打造，单机可承载运行 2.8 万亿参数的 Kimi K3 大模型。浪潮表示，SD200 Ultra 的 Token 生成时延首次降至 5.85 毫秒以内，相当于单用户速度 170 Tokens/s，达到业界平均水平的 5 倍。该机型支持 10 万亿参数规模前沿模型单机运行。IT之家注：Token 生成时延指大模型每输出一个词元所需的平均时间，是衡量推理响应速度的核心指标之一。SD200 Ultra 采用 3D Hyper Mesh 架构，紧耦合 128 芯本土 AI 芯片，提供 8TB 统一编址显存和 64TB 内存。系统采用原生内存语义通信，通信时延低至 0.69 微秒。该超节点通过全局统一编址、虚拟影子设备映射、跨域地址翻译与路由，实现 GPU 跨主机域的统一寻址访问，构建百纳秒级低时延内存语义互连域。浪潮称，借助对称内存技术，SD200 Ultra 首次在基于本土 AI 芯片的超节点上实现 GPU 显存直连，使 GPU 可直接访问远端 GPU 显存。AllReduce 通信时间降低 3.5 倍。针对 Kimi K3 推理，SD200 Ultra 使用 Kimi K3 构建超级算子智能体，实现通算融合、Tile 级流水的超级算子，将 KDA、Gated MLA、MoE 中的基础算子融合。算子数量降低 10 倍，推理性能提升 3 倍以上。浪潮同日发布元脑 HC2000 多元算力机组。该机组采用 DirectCom 2.0 极速架构，基于高密液冷 AI 整机柜，搭配 MCIS 推理软件栈，可动态匹配计算负载。官方称同等投资下 Token 产能提升 10 倍。浪潮将 Agent 时代 AI 计算分为两个方向：Capability AI Compute 能力型智算，支撑突破智能上限；Capacity AI Compute 容量型智算，实现智能充分供给。浪潮称，前沿模型参数规模已从 DeepSeek R1 的 6710 亿增长到 Kimi K3 的 2.8 万亿，并走向 10 万亿级；上下文从 128K 扩展到 1M 以上；Agent 从单体走向成百上千个协同。模型权重、KV Cache（键值缓存，用于存储注意力机制中的键和值，减少重复计算）和并发任务规模同步增长，对显存容量、高速互连和并行扩展效率提出更高要求。复杂 Agent 任务包含大量“推理 — 工具调用 — 反馈 — 重新规划”循环，每轮时延都会累积。浪潮信息称，时延已不只是体验指标，可能影响任务能否及时完成。复杂 Agent 任务需连续运行数小时甚至数天，期间经历大量模型调用、工具调用和数据交互。任何计算、通信或软件故障都可能中断任务。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/005/504.htm", "publishedAt": "2026-09-21T23:40:31+00:00"}, {"title": "索尼 SIE 申请“AI 自修复系统”专利：利用人工智能实时生成诊断固件以修复 PlayStation 游戏机故障", "summary": "IT之家 9 月 22 日消息，据专利聚合网站 Patentlyze 披露，索尼 SIE 近日提交一项基于 AI 的 PlayStation 自动诊断和修复系统专利，该系统可以持续监测联网的 PlayStation 设备，在发现软件问题后由 AI 服务器实时生成针对性的诊断固件，并将其直接部署到出现故障的主机上，从而减少用户联系客服的需求。IT之家参考专利描述，该系统的目标之一是减少保修申请、客服工单以及传统故障排查过程中需要用户反复操作的步骤。当系统检测到主机存在问题后，AI 模型不会简单调用预先编写好的修复方案，而是根据具体故障生成相应的修复代码，并进一步判断问题能否自动处理。如果无法解决，则将相关问题升级给人工客服或技术人员。不过，让 AI 直接生成并部署消费级硬件固件显然存在明显风险。目前 AI 模型无法 100% 准确，相应模型可能生成带有缺陷的固件补丁，反而可能导致设备“变砖”，最终需要返厂维修更换。此外，该系统还涉及服务器端的安全风险。由于 AI 代码生成、诊断以及补丁部署流程集中在云端服务器，一旦相关服务器遭到攻击，攻击者理论上可能利用这一机制向大量 PlayStation 设备推送恶意或存在缺陷的固件。因此，如果未来这一方案真正落地，服务器安全、代码验证以及部署权限控制都将成为关键环节。事实上，这并不是索尼首次探索在 PlayStation 生态中使用生成式 AI。此前索尼曾提出利用 AI 生成游戏提示，通过游戏中的“幽灵”角色为遇到困难的玩家提供帮助；公司还申请过利用 AI 生成加载界面内容的相关专利。这些方案显示，索尼正在探索利用生成式 AI 改善 PlayStation 用户体验，同时降低服务成本和运营压力。不过，与其他专利一样，这项 AI 自修复系统目前仅代表索尼探索中的技术方案，并不意味着未来一定会应用到实际 PlayStation 产品。如果索尼最终推动该方案落地，在允许 AI 自动生成并部署固件之前，如何确保补丁经过严格验证、避免错误更新导致设备故障，以及防止整个自动修复系统成为攻击目标，将是需要重点解决的问题。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/005/501.htm", "publishedAt": "2026-09-21T23:28:47+00:00"}, {"title": "OpenAI 宣布成立数学与 AI 顾问组，神秘新模型 24 天攻破 100+ 世界级难题", "summary": "IT之家 9 月 22 日消息，OpenAI 宣布成立“数学与 AI 顾问组”（Advisory Group on Mathematics and Artificial Intelligence）。据介绍，该顾问组设在普林斯顿高等研究院，由九位数学家组成，将独立于 OpenAI 运作。相较于此，更重磅的是 OpenAI 在公告中披露 —— 公司于 8 月 28 日开始训练的一个神秘模型已成功解决了多个数学领域中 100 多个长期未解决的开放问题（包含此前引发争议的纳维-斯托克斯千年大奖难题）。OpenAI 称，该模型在数学领域的进展速度令公司内部的数学家感到惊讶，这引发了关于如何以最佳方式告知学界的内部讨论。OpenAI 认为，数学属于基础科学领域，AI 取得新的数学发现后可能产生广泛应用，因此相关能力的开发和部署需要采取更稳重的方式。公司目前正在研究如何更广泛地部署与数学相关的 AI 能力。此前，陶哲轩、邓煜、彼得 · 舒尔茨等数学家联名发表公开信，对将解决数学开放问题作为新型 AI 系统基准可能产生的负面影响表达担忧。OpenAI 表示，这些意见表明 AI 公司有必要与数学界开展更充分的交流。OpenAI 明确，该顾问组独立于 OpenAI 运作，有权提出公司未请求的建议、公开评论 OpenAI 对数学的影响，并可自行决定调整成员构成，成员不从 OpenAI 领取报酬。不过，OpenAI 同时说明，该顾问组不负责就公司内部数学研究的推进节奏提供建议。顾问组首批成员包括：François Charles（巴黎高等师范学院 ENS-PSL）Camillo De Lellis（普林斯顿高等研究院 IAS、Gran Sasso 科学研究所）Timothy Gowers（法兰西公学院、剑桥大学）Martin Hairer（洛桑联邦理工学院、伦敦帝国理工学院）Nikhil Srivastava（伯克利、西蒙斯研究所）Ulrike Tillmann（牛津大学、INI）Ravi Vakil（斯坦福大学）Edward Witten（IAS）Melanie Matchett Wood（哈佛大学）其中 Gowers、Hairer 和 Witten 均为菲尔兹奖得主（IT之家注：九位成员中仅 Camillo de Lellis 一人同时是前述公开信的签署者）。该顾问组将就新兴成果的评审与传播提供建议，帮助 OpenAI 评估成果的重要性，并就数学研究的学术标准提供意见。小组还将就 OpenAI 的工具如何支持数学研究与学习提供建议。相关阅读：《继 Claude 尝试攻克黎曼猜想后：OpenAI 宣布用 10000 个 AI 智能体 88 小时攻克千禧年大奖难题，陶哲轩既点赞又担忧》《不到一个月连破两道千禧年大奖难题？消息称 OpenAI 即将攻克霍奇猜想》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/005/500.htm", "publishedAt": "2026-09-21T23:27:23+00:00"}, {"title": "小米 MiMo-V2.6 发布：Pro 与 Flash 双版本价格不变，超越 Kimi K3、GLM-5.3 成为当前 AA 指数排名最高的开源模型", "summary": "IT之家 9 月 22 日消息，小米今日凌晨正式发布并开源了全新的 Xiaomi MiMo-V2.6 系列，包含 Pro 与 Flash 两个原生全模态模型。小米称这是其探索 RSI（递归自我改进）路径的关键一步，通过规模化扩展强化学习算力，让模型在持续的探索与反馈中拓展智能边界。得益于 RL 算力的扩展，MiMo-V2.6-Pro 在 Artificial Analysis Intelligence Index（AA 综合智能指数）v4.3.2 中取得 46 分，超过 Kimi K3（44 分）和 GLM-5.3（45 分），成为当前 AA 指数上排名最高的开源权重模型，较其前代 MiMo-V2.5-Pro 的 26 分高出 20 分。小米官方同时说明，该模型与 Claude Fable 5.1 和 GPT-6 Astra（均为 53 分）等顶级闭源模型相比仍有差距。在 RL 训练阶段，MiMo-V2.6 可能是目前国产开源模型中投入 RL 算力最多的模型之一。Pro 与 Flash 训练历时不到 6 天，成本分别约 262 万美元与 85 万美元，各完成 30 步，累计约 75 万条轨迹。训练任务平均通过率分别相对提升 25% 和 12%，样本外的长程软件工程评测基准 DeepSWE v1.1 分别提升约 17 分（48.8 至 65.7）和约 14 分（58.4 至 72.6）。本次训练从三个维度扩展 RL 算力：更大的 Batch 与更高吞吐，单次更新使用 1568 个样本，支持 100 万上下文长度训练，单步训练 Token 达 3.5 至 3.7B；更多任务与复杂环境，构建覆盖 Code、General、Visual、Cyber 等方向的多任务训练体系；更大的 Grader 算力，通过 Group 内相对比较为长程 RL 任务提供更精准的奖励信号。能力扩展上，MiMo-V2.6 融合了 3D 空间推理、多模态感知与计算机操作能力。在游戏开发中，用户输入图片、视频或文字后，模型可将需求拆解为多个任务，由多智能体协作完成 3D 场景搭建、交互逻辑编写与视觉验证。在具身仿真环境中，MiMo-V2.6 可直接以多视角相机画面为输入，通过视觉反馈闭环控制 Franka Panda 机械臂，完成物体抓取、颜色匹配与精准放置。IT之家注：全模态模型指可同时处理文本、图像、视频和音频等多种输入形式的模型。科研方面，MiMo-V2.6-Pro 协助研究人员完成了全氟和多氟烷基物质（PFAS）吸附用金属有机框架（MOF）材料的设计方案筛选，并在 Lean 4 中完成了 Li-Yorke 经典论文《周期三蕴含混沌》原始主定理的完整形式化，形成 6000 余行 Lean 源码，完整证明通过 Lean 内核核验。模型未接受过针对 Lean 的专项后训练。MiMo-V2.6 系列沿用 V2.5 系列的 API 定价：Flash 为每百万词元输入 1 元、每百万输出 2 元；Pro 为 3 元和 6 元，并提供 99% 缓存折扣。在同等智能水平下，价格仅为海外模型的 1/20 至 1/60。伴随新模型发布，MiMo Desktop 桌面客户端（支持 Windows 与 Mac）及会员订阅方案同步上线，订阅会员即可使用 MiMo-V2.6-Pro 和 Flash 模型，也可配置自己的 API Key 使用客户端。MiMo Desktop 同步上线 MiMo-V2.6-Pro 的 UltraSpeed 超高速模式，提供最高 20 倍的推理速度。MiMo-V2.6 系列已上线 Xiaomi MiMo 开放平台。原邀测活动将在 1 周后结束，已获得邀测资格的用户切换模型名称后方可继续使用。同时，小米全面开源 MiMo-V2.6-Pro、Flash 模型权重与技术报告，同步开放 MiMo-V2.6-Distill-Qwen-9B 及配套 RL 研究资源，分享经过验证的训练实践，以下是详细开源内容：7k+ 高质量 RL 任务环境：覆盖软件工程、漏洞复现、知识型工作、网页设计开发四类智能体任务。以 MiMo-V2.6-Distill-Qwen-9B 为起点展开 RL 训练，在 11 项评测中均较 SFT 基线取得提升：SWE-bench Verified 从 61.1 提升至 66.2，MiMo Cyber Bench 从 31.3 提升至 47.0，Terminal Bench 2.1 从 37.1 提升至 52.8，MiMo Visual Coding 从 64.0 提升至 72.4；端到端 RL 训练框架：基于 verl、uni-agent 和 mini-swe-agent，覆盖环境交互、轨迹采集、奖励评估与策略优化的完整训练流程。结合开放的模型与任务环境，支持社区围绕训练算法、奖励机制和 agent harness 开展研究与迭代；轻量可组合的 Harness：开源极简 mini-harnesses，将系统提示、工具与上下文管理解耦，构建多样且可控的训练配置。通过 Multi-Harness Training，能够将多样性和整洁性纳入 RL 训练，提升模型在不同框架、包括未见框架上的泛化能力，支持社区自由组合框架组件、拓展训练配置，持续探索新的研究方向。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/005/496.htm", "publishedAt": "2026-09-21T23:05:45+00:00"}, {"title": "马斯克 SpaceXAI 发布旗下最强编码和知识处理模型 Grok 4.7，百万词元输入 2 美元起", "summary": "IT之家 9 月 22 日消息，SpaceXAI 今日宣布推出新一代 Grok 4.7，主打编程和知识工作场景。官方称其采用全新更大规模基础模型，并通过更长时间的强化学习训练提升复杂任务处理能力，是该公司目前最强的编码和知识处理模型 —— 速度是同类模型的两倍，价格却只有一半。如前所述，Grok 4.7 针对编程和知识工作进行了优化。与 Grok 4.6 相比，新模型能够在困难任务上持续更长时间，并加强了对自身输出结果的检查能力。在 CursorBench 4.0 测试中，Grok 4.7 面向长时间运行的编程任务，在价格与性能方面处于同类模型的前列。官方同时表示，该模型的运行速度和定价与 Grok 4.6 相同。Grok 4.7 使用了比 Grok 4.6 更大的基座模型，并接受了更长时间的强化学习训练。训练数据更加侧重需要数小时完成的复杂任务，同时针对模型的自我验证和长上下文管理能力进行了优化。SpaceXAI 还针对 Grok Bot harness 对 Grok 4.7 进行了原生训练，使其在对话以及一般知识工作任务中的表现得到提升。此外，该模型在文档和演示文稿生成方面也有所改进。在 GDPval 和 AA Briefcase 两项基准测试中，Grok 4.7 均较 Grok 4.6 有所提升。这些测试要求 AI 完成律师、护士、金融分析师等专业人士日常工作中的相关任务。官方称，Grok 4.7 在两项测试中的表现已达到与其他前沿模型相近的水平。安全方面，SpaceXAI 为 Grok 4.7 采用了全新的安全防护体系。官方表示，该模型在拒答和抵抗越狱攻击方面达到了公司目前测试中的最高水平。在网络安全和生物领域等具有双重用途的场景中，Grok 4.7 试图兼顾合法任务的可用性与危险任务的安全拒答。在 LatchBio 生物安全基准测试中，该模型取得 62.4% 的成绩。针对网络安全场景，SpaceXAI 表示，Grok 4.7 在 HackerBench v0.3 测试中仅允许 3.3% 的高风险双重用途提示通过，同时较少阻止合法的安全工作。此外，公司已经开始向部分网络安全合作伙伴提供邀请制访问权限，用于红队能力和防御研究。目前，Grok 4.7 已通过 Cursor 和 Grok Build 提供，同时开放 Grok API，并支持第三方编程工具、模型路由服务及云平台。价格方面，Grok 4.7 每百万词元输入起价为 2 美元（IT之家注：现汇率约合 13.4 元人民币），输出起价为 6 美元（现汇率约合 40.2 元人民币）。SpaceXAI 同时还提供了高速版本，输出速度翻倍，但价格也翻倍。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/005/494.htm", "publishedAt": "2026-09-21T22:56:49+00:00"}, {"title": "MiniMax H3 开源后，本地 AIGC 走到了哪里？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/video/fJe6qRKX70UqqCEDMRTK?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-21T21:31:00+00:00"}, {"title": "70强项目观察之新智基座：Agent正在从“会聊”走向“会干活”", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/G58AHJw8gT8CQuiq5sap?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-21T18:15:51+00:00"}, {"title": "苹果 2026 款 Mac Studio 发售：M5 Max / Ultra 芯片，19999 元起", "summary": "IT之家 9 月 21 日消息，苹果于 8 月 25 日推出全新 Mac Studio（2026 款），搭载 M5 Max 和全新 M5 Ultra 芯片，新品将于 9 月 22 日正式发售。IT之家附全新 Mac Studio 售价如下：Mac Studio（搭载 M5 Max 处理器）起售价为 19,999 元（36GB+512GB），教育版售价为 18,399 元。Mac Studio（搭载 M5 Ultra 处理器）起售价为 46,999 元（96GB+1TB），教育版起售价为 43,599 元。全新 Mac Studio 的 AI 性能提升最高可达 4.3 倍，存储速度提升最高可达 2 倍，图形处理器速度提升最高可达 1.8 倍，中央处理器速度提升最高可达 1.3 倍，内存带宽更高。搭载 M5 Max 芯片的 Mac Studio 配备 18 核中央处理器、最高 40 核图形处理器（每颗核心均集成神经网络加速器）以及最高 128GB 统一内存，为复杂专业任务和 AI 工作负载加速。搭载强劲 M5 Ultra 芯片的 Mac Studio 则进一步升级至 36 核中央处理器和最高 80 核图形处理器，统一内存容量高达惊人的 512GB，供用户完全在设备端运行超大规模大语言模型。Mac Studio 首次支持 Wi-Fi 7 和蓝牙 6，雷雳 5 端口则丰富了连接性，供用户利用高速外接存储设备、PCIe 扩展机箱和强大的中枢解决方案处理繁重任务。雷雳 5 还可实现多个 Mac Studio 系统的集群，相比单个系统，分布式 AI 推理性能提升最高可达 3 倍。京东苹果 Mac Studio M5 Max 19999 元起直达链接京东苹果 Mac Studio M5 Ultra 46999 元起直达链接", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/005/478.htm", "publishedAt": "2026-09-21T15:40:09+00:00"}, {"title": "纯 LLM 做 NL2SQL 总不准？金融场景为什么必须做本体工程", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/TcTrU2Ap9VsxxHVestfw?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-21T14:20:12+00:00"}, {"title": "不靠最强大模型，也能拿全球第一？OceanBase 的 “纯国产组合” 登顶国际 Data Agent 榜", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.info 612", "publishedAt": "2026-09-20T07:19:46+00:00"}, {"title": "前 OpenAI 研究员发布 Jev 模型，旨在帮助软件做出快速、结构化的决策", "summary": "TypeSafe AI 前两天从隐身状态出来了。这个实验室由前 OpenAI 研究员 Diogo Almeida 创办，他参与过 ChatGPT 背后的指令跟随方法研究。这次发布的不是又一个聊天模型，而是一类他们叫\"System One Model\"的新东西，首款型号叫 Jev，开放了早期访问。 把 Jev 理解成\"一次函数调用级别的智能\"最直观：输入非结构化状态，输出...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502609/typesafe-ai-system-one-models-and-jev", "publishedAt": "2026-09-20T06:39:45+00:00"}, {"title": "体验完 Step 5 Preview，我发现阶跃重新坐上国产大模型主桌", "summary": "模型入海，阶跃走向人群#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1680881?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-09-20T04:00:16+00:00"}, {"title": "别再让 Agent 裸连数据库了：如何用 MCP + 语义网关解决 NL2SQL 幻觉与权限失控", "summary": "在 2026 年，给 AI Agent（Cursor、Claude Desktop、Dify、Coze 等）外挂一个数据库连接，已经成为很多开发者的标配操作。从简单的官方 SQLite/MySQL MCP 到各种通用客户端扩展，让大模型“直接查库”的门槛被降得极低。 然而，一旦进入真实业务场景，大部分团队很快就会撞上两堵高墙： 语义幻觉严重：大模型根本不懂企业...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502591", "publishedAt": "2026-09-18T12:54:57+00:00"}, {"title": "GLM-5.3-FlashX 上线，智谱把国产卡上的推理速度顶到 200 token/s", "summary": "GLM-5.3 前阵子以\"Ox Alpha\"的匿名身份上线时，就已经是 OpenCode 和 OpenRouter 双平台调用量最大的模型。今天智谱给它加了个更快的版本，名字也直白——GLM-5.3-FlashX，最高 200 tokens/s。 背后的一张牌值得单独说。上一代 GLM 上线时，团队是在 10 万张国产芯片组成的集群上把推理服务从零搭起来的，当时的难点是内...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502582", "publishedAt": "2026-09-18T07:26:31+00:00"}, {"title": "🔥 优化及缺陷修复：开源 AI 无代码平台 NocoBase", "summary": "汇总一周产品更新日志，最新发布可前往我们的博客查看。 NocoBase 目前更新包括三个分支： main、next 和 develop。** main： 截至目前最稳定的版本，推荐安装此版本。 next： 包含即将发布的新功能，经过初步测试的版本，可能存在部分已知或未知问题。主要面向测试用户，用于收集反馈和进一步优化功能。适合愿意提前体验...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502580", "publishedAt": "2026-09-18T06:03:04+00:00"}, {"title": "开源一站式智能终端 uniTerm v1.9.4 发布：跨工作区广播、SSH Kerberos / Agent 认证等 50 余项更新", "summary": "uniTerm 是一款轻量级一站式开源终端软件。整合终端、文件传输、远程桌面、数据库客户端、容器等 5 大类协议于一身，覆盖 30+ 协议，安装包仅 14 MB；内置可自主执行的 AI Agent，能规划并执行多轮 Shell 命令。 v1.9.4 是一次面向「连接」、「文件传输」和「工作区」的深度打磨：SSH 新增 Kerberos 与 SSH Agent 认证，...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502575", "publishedAt": "2026-09-18T05:06:06+00:00"}]}, {"label": "产品发布/更新", "items": [{"title": "AI 编程平台 Bitrig 宣布为苹果 iPhone Duo 引入支持，提供交互式 3D 模拟器供开发者测试应用", "summary": "IT之家 9 月 22 日消息，据外媒 9to5Mac 报道，随着苹果上周发布 Xcode 27.1 Beta 1 并加入 iPhone Duo 应用开发支持，如今一款 AI 编程平台 Bitrig 也宣布支持构建和测试 iPhone Duo 应用。据介绍，Bitrig 最初是一款面向“氛围编程”（vibe coding）的应用，用户可以通过文字或语音提示生成原生 SwiftUI 应用，并直接在 iPhone 上的 Bitrig 应用中运行。此后，该平台不断扩展功能，推出 Mac 版应用，加入完整的 Xcode 工具链、内置 iPhone 模拟器以及真机测试功能，同时支持将项目导出至 Xcode，或通过 TestFlight 和 App Store 进行分发。在苹果发布 Xcode 27.1 Beta 1，正式支持构建和测试 iPhone Duo 应用后，Bitrig 也迅速加入相关支持，目前提供了一套交互式 3D 模拟器。开发者可以在模拟器中自由折叠、倾斜、旋转和调整设备姿态，以测试应用在不同使用场景下的表现。针对 iPhone Duo 的铰链交互，开发者可以使用 SwiftUI 中的 onHingeChange 来根据设备折叠状态调整应用的交互和视觉效果，Bitrig 模拟器可以实时读取铰链数据，帮助开发者测试设备从闭合到展开过程中的应用响应。Bitrig 还支持利用 ArrangementView 打造各类创意交互场景。例如，当 iPhone Duo 以类似帐篷的形态放置在桌面上时，开发者可以将媒体内容放置在上半部分，将控制按钮放在下半部分；在设备立于边缘时，则可以利用横向布局，让用户通过外屏使用应用。此外，Bitrig 还能够帮助开发者管理多个 Xcode 版本，因此开发者可以使用测试版 Xcode 提前准备 iPhone Duo 应用，同时切换回 Xcode 27 正式版继续构建和发布现有应用更新。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/005/513.htm", "publishedAt": "2026-09-22T00:07:56+00:00"}, {"title": "2026 上半年全球 AI 眼镜出货量同比大增 263%，“无屏幕”产品占主流", "summary": "IT之家 9 月 22 日消息，外媒 Android Authority 援引 Counterpoint Research《智能眼镜市场追踪“报告，认为目前智能眼镜仍属于相对小众的科技产品，但其市场增长速度正在明显加快。数据显示，2026 年上半年全球 AI 眼镜出货量同比增长 263%，其中绝大多数产品并不配备 AR 显示屏，主要利用扬声器 / 麦克风进行交互。此类“无屏幕 AI 眼镜”以 Meta 雷朋联名眼镜为代表，相对于 AR 波导产品价格更低、产品成熟度更高。今年上半年相应产品出货量同比增长 258%，相比 2025 年下半年也增长 22%。相比之下，配备实际 AR 显示屏的智能眼镜目前仍只占整个市场很小的比例，但增长速度更加迅猛。Counterpoint 数据显示，2026 年上半年 AR 和 AI 显示眼镜出货量同比增长 449%，不过这一增幅建立在较小的出货基数之上。在这一细分市场中，Rokid 以 41% 的份额位居前列，Meta 则以 37% 的份额紧随其后。中国市场占全球 AR 和 AI 显示眼镜出货量的 45%。随着 AI 眼镜逐渐普及，行业正可能面临新的挑战。外媒指出，零部件成本上涨以及公众对摄像头和隐私问题的担忧，都可能成为近期影响市场发展的因素。Meta 此前就曾因智能眼镜的录制指示灯问题受到业界批判。不过这些问题暂时不会阻碍 AI 眼镜市场的整体增长。预计未来市场可能出现更多从产品形态上规避摄像头隐私问题的设备，例如不配备摄像头、主要依靠麦克风和 AI 功能实现交互的音频眼镜。IT之家注意到，近期也有报道称 Meta 正在考虑开发一款以麦克风和 AI 功能为核心、取消摄像头的智能眼镜产品。如果相关产品最终推出，也可能成为 AI 眼镜厂商应对隐私问题的一种新方向。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/005/498.htm", "publishedAt": "2026-09-21T23:23:06+00:00"}, {"title": "英国消费者权益机构 Citizens Advice：基本服务供应商应停止在客服工作中依赖 AI 聊天机器人", "summary": "IT之家 9 月 22 日消息，英国消费者权益机构 Citizens Advice 近日呼吁，能源、银行、电话和互联网等提供基本服务的企业在客服工作中应当停止依赖 AI 机器人，保障用户“与真人沟通的权利”。该机构调查发现，超过一半需要使用聊天机器人的用户因此浪费时间、产生压力或面临问题解决延迟。Citizens Advice 表示，越来越多能源、银行、电话和互联网服务商使用 AI 系统提供客户支持，让数百万本就面临数字化障碍的用户更难解决日常服务问题。该机构去年在英格兰和威尔士为超过 270 万人提供了一对一帮助，并认为聊天机器人在部分情况下已经造成实际负面影响。该机构称，聊天机器人经常让用户陷入“无休止的循环”，始终无法解决实际问题。调查显示，近一半不得不使用聊天机器人的用户认为其没有帮助，一些用户甚至认为系统似乎是在故意“让我放弃”。许多用户甚至会在拨打客服服务时反复大喊“人工服务”，试图绕过自动化服务并联系人工客服。Citizens Advice 因此呼吁服务商赋予用户在无法通过自动化系统解决问题时直接联系真人客服的权利。该机构此前针对数字化排斥问题展开调查，并估计英国至少有 1400 万人受到影响。调查发现，对于无法熟练使用在线系统或缺乏数字设备的人群而言，客户支持往往速度更慢、可靠性更低，而电话、线下服务和纸质通信渠道逐渐减少，也进一步形成了“两级支持体系”。Citizens Advice 政策主管 Tom MacInnes 表示，反复与聊天机器人沟通不仅令人烦恼，还可能成为获取基本服务的障碍。他指出，一些机构过度依赖聊天机器人和在线表单，导致用户无法解决账单问题、处理债务，甚至无法获得预防无家可归的相关服务。他认为聊天机器人仍然有其作用，但电话和线下服务渠道的逐渐减少，正在让越来越多的人无法获得必要帮助。同时，传统沟通渠道的减少也意味着没有良好数字接入条件的用户需要花更长时间才能解决简单的问题。例如，Citizens Advice 发现，如果系统正常，通过在线方式提交能源电表读数并纠正错误账单可能只需不到 1 小时；而对于缺乏良好数字接入条件的人来说，线下处理可能需要长达 6 周，并可能面临进一步损失。此外，Citizens Advice 还发现，一些地区甚至要求用户通过纯数字化方式申请低价社会资费宽带，而这种服务本身正是为了减少数字化排斥。该机构一名前线顾问表示，一些人在申请无家可归援助时因难以完成纯数字化流程而陷入困境，可能因此更长时间无家可归、损失收入甚至背负债务，并称这种情况“可能毁掉很多人的生活”。Citizens Advice 今年 7 月进行的一项调查显示，仅有 20% 的英国成年人表示聊天机器人是自己首选的沟通方式。相比之下，电话、电子邮件和即时通讯等传统方式更受欢迎。在难以或无法通过真人客服解决基本服务问题的人群中，49% 表示因此产生压力或沮丧情绪，27% 感到无能为力，44% 经历了问题解决延迟，另有 14% 最终放弃继续解决问题。Citizens Advice 指出，如今随着 AI 客服越来越普及，用户对这类系统的不满也持续增加。如今，企业应当愈发有义务以清晰且易于获取的方式向消费者提供真人客服。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/005/497.htm", "publishedAt": "2026-09-21T23:14:46+00:00"}, {"title": "独立开发者称自己游戏新作遭其他开发商使用 AI 工具 1:1 恶意复刻，双方各执一词", "summary": "IT之家 9 月 22 日消息，据 IGN 报道，独立游戏开发者 Rado Klasa 发文，抨击一家名为 Golden Horn Studios 的开发商新作《Potato Please》预告片 1:1 复刻了自己的游戏《1,000,000 Potatoes》。IT之家获悉，《1,000,000 Potatoes》是一款第一人称物理模拟游戏，玩家需要利用物理机制削土豆。而这款《Potato Please》的游戏同样以削土豆为核心玩法，两款作品还都采用了前苏联风格的军事场景，并带有一定恐怖游戏元素。Klasa 表示，自己于今年 7 月曾公开介绍《1,000,000 Potatoes》，本作概念最初源自 GMTK 游戏开发大赛。自己一直没有急于上线 Steam 页面，而是花费大量时间打磨游戏机制。而在今年 9 月，其发现开发商 Golden Horn Studios 公布了一款名为《Potato Please》的游戏预告片，两款游戏之间存在惊人的相似之处，已构成知识产权抄袭。Klasa 声称，自己投入了大量时间完善游戏手感、操作方式以及各种细节，因此看到一个仓促制作的类似作品抢先进入市场让他感到愤怒。不过，他仍认为自己的原版作品能够凭借更高质量的完成度获得玩家认可。目前，Steam 部分鉴赏家已经将《Potato Please》标记为“使用 AI 抄袭《1,000,000 Potatoes》”，社交媒体上也有玩家表示支持 Klasa，并称将把他的游戏加入愿望单。Golden Horn Studios 则发文回应 Klasa，声称其指控不实。工作室称，在 Klasa 公开相关内容之前，他们从未见过《1,000,000 Potatoes》，《Potato Please》的创意源自社区中流行的一则土豆相关梗图和视频。工作室还强调，两个游戏拥有相似概念并不能证明存在抄袭，并表示团队确实投入了大量时间进行游戏设计、建模、编程和开发。如果有必要，他们愿意公开项目文件以及完整开发过程，以证明游戏的制作来源。不过，部分玩家并未接受 Golden Horn Studios 的解释。有玩家指出，两款游戏不仅都采用了前苏联风格场景和土豆削皮玩法，而且《Potato Please》的相关账号直到 GMTK 游戏大赛结束后才出现。也有玩家表示，自己无法找到 Golden Horn Studios 所提到的那些所谓的“社区土豆梗图”。同时《Potato Please》的社交媒体账号目前创建仅约两个月，截至目前也没有公开展示游戏开发过程的任何 DEV 测试版本截图。目前，双方对于《Potato Please》的创作是否受到《1,000,000 Potatoes》影响各执一词，AI 是否参与游戏开发以及两款作品之间是否存在实际知识产权侵权，也尚未得到独立证实。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/005/495.htm", "publishedAt": "2026-09-21T23:05:33+00:00"}, {"title": "70强项目观察之具身未来：机器人走进现实世界，关键不只是完成动作", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/EU5m831fwoFA6RdhcOlo?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-21T18:23:23+00:00"}, {"title": "70强项目观察之无界应用：AI应用正在从“有功能”走向“能完成任务”", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/te2qjg2J6Ausgc6vAeNy?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-21T18:18:29+00:00"}, {"title": "《2026年中国人工智能计算力发展评估报告》发布，智能体重塑算力基础设施，智能算力规模预计增长87.9%", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/vA7opkWL5WYlwYcPIdds?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-21T17:07:01+00:00"}, {"title": "IDC评估中国 AI算力管理平台：范式综合评分位列第一", "summary": "点击查 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
