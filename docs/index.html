比，使用教师模型完整推理轨迹进行监督微调的学生模型，通常能够获得更好的网络安全能力迁移效果。相关阅读：《菲尔兹奖得主邓煜评论 AI 公司反蒸馏：你不能只在你蒸馏全人类知识时支持蒸馏》《英伟达 CEO 黄仁勋回应 AI 模型蒸馏争议：这是市场竞争行为》《商务部回应美方所谓 AI 蒸馏指控：于事无凭于法无据，典型双重标准》《消息称张一鸣内部下死命令：就算模型暂时落后，字节跳动也不会依赖 AI 蒸馏技术》《微软 CEO 纳德拉批评 AI 模型公司“双标”：一边主张“合理使用”数据，一边限制他人蒸馏》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/030/319.htm", "publishedAt": "2026-11-21T01:45:22+00:00"}, {"title": "“几乎所有人将永久失业”：Anthropic 研究员预测 2027 年底 AI 在几乎所有领域超越顶尖专家", "summary": "IT之家 11 月 21 日消息，11 月 15 日在接受 Palisade Research 采访时，Anthropic 公司技术团队成员 Tao Lin 预测到 2027 年年底，在编程、电影制作等几乎所有领域，人工智能（AI）在发展大约还有 1.3 年后，可以媲美或超过世界顶尖人类专家的水平。IT之家查询公开资料，Tao Lin 在 Anthropic 担任技术团队成员（MTS）岗位，目前已在该公司工作了约一年半，涉及自动化对齐研究（Automated Alignment Research）、AI 控制（AI Control）以及安全防护（Safeguards）三个方面，主要保障 Claude 模型的安全。在本次访谈中，Tao Lin 警告表示随着技术持续发展，在其设想的未来社会场景中，几乎所有人都可能长期失去就业机会，转而依靠政府提供生活保障。他认为 AI 对就业的冲击可能逐步展开：AI 先接手现有工作，劳动者转向其他职业，而这些新岗位随后也可能被自动化取代。Anthropic 的研究表明，观察到的 Claude 使用情况中有 68% 涉及理论上可以由 AI 单独完成的任务，但这并不一定意味着实际的就业岗位会被取代。不过他指出受限于机器人的普及速度，在 2027 年出现大规模失业的可能性极低。他表示即使 AI 能够承担大量脑力劳动，要替代实体经济中的人类工作，仍需大规模部署先进机器人、自动化工厂及配套设施。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/030/308.htm", "publishedAt": "2026-11-21T00:53:29+00:00"}, {"title": "OpenAI 推出 MedChemBench 基准，评估 AI 辅助药物研发能力", "summary": "IT之家 11 月 21 日消息，当地时间 11 月 20 日，OpenAI 发布 MedChemBench 基准，用于评估 AI 模型在药物化学研究中的推理能力，包括识别分子结构、解读实验结果、比较化合物及预测其性质等。OpenAI 表示，模型在重建分子结构和解释实验依据方面表现较强，但在化合物筛选和数值性质预测方面仍有明显提升空间。IT之家从官方介绍获悉，该基准包含 99 道题目，取自 117 篇论文与专利，涉及 761 个不同分子结构。多数题目向模型提供研究进行到某一节点时的上下文，包括生物靶点、研究人员的目标、此前研究过的化合物与部分实验结果。官方将评测分为四个部分，IT之家附具体内容如下：分子结构：依据题目给出的结构图与化学基团组装分子，考察原子连接与立体化学是否正确；科学解释：解释需由给定证据支撑，例如为何在若干化合物中选择某一个；排序与选择：化合物排序与最终选择是否符合题目要求；性质预测：与原始材料给出的数值、类别是否一致，涵盖实测与计算得到的分子性质。据官方公布信息，在 xhigh 推理档下，GPT-6.2 Astra 获得 84.5% 的可用分数，GPT-6 Astra 为 83.3%，GPT-6.1 Sol 为 82.0%，GPT-5.6 Sol 为 58.2%。官方称，提高推理档位可带来分数提升，但模型之间的差距依然明显。分项表现上，Astra 在 xhigh 档的分子结构部分拿到 95.4% 的可用分数，而在化合物选择与数值性质预测两项上仅获约一半分数。官方举例称，一道题目要求模型以给定中心结构与两个侧基组装分子，并保留一个 18 原子环。在 11 个模型共用的 xhigh 档下，GPT-6 Astra 的十次回答全部正确；GPT-5.6 Sol 与 GPT-5.6 Luna 十次全部出错，前者组装出的环只有 15 个原子，后者把分子拆成两个互不相连的片段。另一道题取材于 PRMT5 抑制剂研究，PRMT5 是肿瘤药物研发中受到关注的蛋白。模型需要预测三种相关化合物在细胞内阻断 PRMT5 的强度、穿过细胞屏障的难易，以及在实验室检测中被肝酶降解的速度。官方在题目中隐去的后续实验显示存在取舍：化合物 23 在更低浓度下即可在细胞内阻断 PRMT5，化合物 24 更易穿过细胞屏障，在肝酶检测中的降解速度也更慢。官方表示，这些结果并不能确定模型是否能够发现新药或改善实验室决策。不能排除之前接触过已发表资料的可能性，每一次回应都是一次没有工具、没有反馈或新实验的尝试。虽然基准测试基于历史证据而非真实药物发现，其结果有助于识别模型在哪些方面进展，哪些仍面临挑战。团队相信 MedChemBench 将支持持续的进步，并期待随着模型的进步与应用领域分享最新进展。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/030/301.htm", "publishedAt": "2026-11-21T00:06:12+00:00"}, {"title": "黎曼猜想真被 Claude 证明了？Anthropic 数学家仅发布 Lean 代码，陶哲轩称验证仍需时间", "summary": "IT之家 11 月 21 日消息，当地时间 11 月 20 日，Anthropic 数学家莱文特 · 阿尔珀格（Levent Alpöge）宣称他与 Claude 合作，发现了黎曼猜想及其推广形式广义黎曼猜想（GRH）的证明。阿尔珀格拥有哈佛大学本科学位和普林斯顿大学数学博士学位，目前在 Anthropic 从事研究工作。他在声明中称，Claude 在证明接近完成时“远远超过了我”，“在终点附近飞翔、跳舞、闪耀”。他还表示，自己为 Claude 指明了关键研究方向，随后 Claude 提出了一系列令他意外的数学思路。据阿尔珀格透露，他与 Claude 生成的文字证明超过 25 万页，因篇幅过长未予公开。公开材料仅包括一份 4 页说明，以及分为 14 个压缩包、总计约 1700 万行的 Lean 形式化代码。2006 年菲尔兹奖得主陶哲轩后续在个人博客中对此作了初步盘点。他表示，从非常初步的分析看，该证明似乎动用了朗兰兹纲领和算术几何领域的现代研究成果，数学界梳理核心思路并验证正确性的过程还需要一段时间。罗格斯大学数学教授 Alex Kontorovich 则在 X 上称，黎曼猜想的证明需要“运用一切”，这反而让他对成功的可能性更有信心。IT之家注：Lean 是一种交互式定理证明器，用于将数学证明翻译为计算机可机械验证的代码。Lean 通过小型可信内核逐步检查逻辑推导，但无法自动保证形式化代码所证明的命题与原始数学猜想在语义上完全一致。数学家 Elliot Glazer 在初步检查后表示，阿尔珀格发布的 Lean 文件中形式化的数学命题“确实是广义黎曼猜想”。但他同时指出，理论上不排除 Lean 自身存在可靠性漏洞的可能，不过他估计这一概率远低于 1%。此前已有研究记录显示，Lean 4 的部分历史版本曾出现过允许无效证明通过的内核缺陷。《科学》杂志 2026 年 10 月的一篇报道也指出，AI 生成的 Lean 代码曾在 OpenAI 高调的 Navier-Stokes 问题证明中弱化原始英文命题的表述；Lean 验证的仅是代码所指向的形式化目标，而非自然语言层面的数学问题本身。另外还有网上流传的一张疑似 2026 年菲尔兹奖得主邓煜评价此事的聊天截图显示，面对相关提问，其回复称“至少拿出 500 页版本前看都不看”。即使 Lean 代码通过编译、形式化目标与原始猜想的一致性也得到确认，距离克雷数学研究所的认可仍有漫长距离。按照该机构规则，千禧年难题的解答必须在同行评审期刊正式发表，并经过至少两年的验证期和数学界普遍接受，才有可能进入奖金评审程序。个人网站声明和代码压缩包不符合提交资格，克雷数学研究所也不接受直接投稿。黎曼猜想于 2000 年被列入七大千禧年难题，奖金为 100 万美元（现汇率约合 669.2 万元人民币）。值得一提的是，Anthropic 于 11 月 19 日刚在纳斯达克挂牌交易，阿尔珀格称他在 11 月 15 日深夜至 16 日凌晨完成关键工作后联系了 Anthropic CEO 达里奥 · 阿莫代伊，询问公布时机。他承认“时间点非常糟糕”，但表示“实在无法再等下去了”。今年 8 月，Anthropic 曾公布 Claude 在黎曼猜想相关问题上将关键线上零点比例下界从 41.6% 提高至 67.2% 的成果，当时距离完整证明仍有明显差距。相关阅读：《AI 攻克黎曼猜想？Anthropic 数学家宣称已与 Claude 合作完成证明》《未公开的新模型“立功”，Anthropic 宣布 Claude 攻克黎曼猜想取得重大突破》《继 Claude 尝试攻克黎曼猜想后：OpenAI 宣布用 10000 个 AI 智能体 88 小时攻克千禧年大奖难题，陶哲轩既点赞又担忧》《悬赏百万美元求证明，这道数学题为啥这么值钱？》《英国“数学教父”阿蒂亚去世，曾宣称证明黎曼猜想》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/030/297.htm", "publishedAt": "2026-11-20T23:40:02+00:00"}, {"title": "匿名 AI 模型 Gestalt 登顶 Contra 前沿设计榜单：性能远超 Claude Fable 5.2、GPT-6.1 Sol，Elo 评分超越人类参考作品", "summary": "IT之家 11 月 21 日消息，Contra Labs 于当地时间 11 月 18 日发布 AI 设计能力评测榜单 Frontier Design Benchmark。其中，一款代号为 Gestalt、目前处于隐身开发状态（Stealth）的匿名 AI 模型成为最大黑马，在专业设计师盲测中以明显优势登顶，超过 Anthropic 的 Claude Fable 5.2、OpenAI 的 GPT-6.1 Sol 等主流模型，甚至在设计师偏好评分中超过了人类设计师的参考作品。根据 Contra Labs 官方公布的评测结果，Gestalt 的 Elo 评分达到 1931 分，胜率为 90%，位居榜单第一。排名第二的是人类设计师参考作品 Human golden，Elo 评分为 1739 分，胜率为 74%；Claude Fable 5.2 以 1713 分排名第三，GPT-6.1 Sol 则以 1668 分排名第五。这项评测由 Contra Labs 与 BenchFlow 合作推出，主要针对真实商业设计任务，而非简单的提示词生成测试。评测任务共 33 项，其中 27 项改编自 Contra 平台上的真实设计委托，另外 6 项来自创业公司合作项目。评测邀请了 35 名专业设计师参与，通过 5 轮盲测累计收集 4311 张投票。评测采用三项指标：专业设计师双盲偏好投票、设计质量评价体系（Design Critique Rubric），以及 AI 痕迹检测器（Slop Detector）。其中，Elo 评分根据设计师对不同作品的两两比较结果计算，涵盖色彩、字体、布局、可用性以及对任务要求的遵循程度。在 Gestalt 与人类设计师参考作品的直接对决中，设计师在 28 次比较中有 20 次选择了 Gestalt。不过，这并不意味着 Gestalt 在所有设计质量指标上都全面超越人类作品。在设计质量评价体系中，Gestalt 得分为 83 分，Claude Fable 5.2 和 Claude Opus 5.5 均达到 84 分，而人类设计师参考作品为 74 分。Contra Labs 指出，设计师的审美偏好与具体执行质量并不完全相同，人类参考作品虽然存在部分可以明确指出的执行问题，但在盲测中仍获得了较高的偏好票数。AI 痕迹检测方面，Gestalt 的作品也表现突出，其生成结果的 AI 痕迹评分接近人类参考作品。该检测器通过分类模型判断设计作品呈现出多少 AI 生成作品的典型特征，评分越低意味着作品看起来越不像 AI 生成。目前 Contra Labs 尚未公开 Gestalt 的开发团队、模型架构及具体身份，仅将其标记为 Stealth。该模型的实际来源和背后团队仍有待进一步确认。相关阅读：《全球最强 AI 模型：Claude Fable 5.2 登场，编程超 GPT-6 Astra、登顶多项基准》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/030/291.htm", "publishedAt": "2026-11-20T23:17:51+00:00"}, {"title": "OpenAI 宣布向 ChatGPT Plus 用户开放 Spaces 协作空间，支持多人共同编辑", "summary": "IT之家 11 月 21 日消息，OpenAI 今日宣布向 ChatGPT Plus 订阅用户开放 Spaces 协作空间功能。该功能此前仅面向 Pro、Business 和 Enterprise 等付费方案用户提供，现在每月支付 20 美元（IT之家注：现汇率约合 133.8 元人民币）的 Plus 用户也可以创建自己的空间，与其他用户共同整理资料、协作处理文档和文件。ChatGPT Spaces 最早于 2026 年 9 月的 OpenAI Dev Day 活动上推出，定位为多人协作工作空间。用户可以邀请同事或朋友加入，共享信息、文档及其他文件，并结合 ChatGPT 的相关功能开展写作、研究和项目管理工作。用户可在 ChatGPT 左侧导航栏选择“Space”入口创建空间。该入口取代了原来的 Library（资料库）位置。点击或轻触加号后，可以选择现有模板，也可以上传 Pages 页面、Slides 幻灯片、电子表格、图片及网站链接。OpenAI 介绍称，Pages 是专门为智能体协作设计的新型文档，适用于写作、可视化、研究和编程等工作。用户还可以将页面与已连接的工具关联，使内容根据外部工具中的信息自动更新。Space 还支持多人协作，用户可以邀请其他人共同编辑项目，并与 ChatGPT 的 Scheduled Tasks（定时任务）功能配合使用。据 OpenAI 官方更新说明，用户还可以创建交互式页面和演示文稿，并邀请拥有 Space 使用权限的其他用户共同完善内容。在使用场景方面，OpenAI 提到，用户可以为即将到访的朋友创建城市指南，后续不断添加新的地点，由 ChatGPT 负责整理；学生则可以利用 Space 制作包含 3D 可视化内容和自测题目的学习资料。此次功能正在面向全球年满 18 周岁的 Plus 用户分批开放，并非所有账号都会立即获得入口。根据 OpenAI 官方帮助文档，共享页面和演示文稿需要获得相应访问权限，且使用者必须登录拥有 Space 权限的 Plus、Pro、Business 或 Enterprise 账号，免费用户无法打开共享内容，目前也不支持公开链接分享。此外，Dot 智能体的使用权限仍存在套餐限制。OpenAI 已于 11 月 19 日开始向部分 Plus 用户测试 Dot 功能，但尚未全面开放。Engadget 报道称，Plus 用户目前尚不能普遍在 Space 中使用 Dot 智能体。相关阅读：《OpenAI 邀部分 Plus 用户体验 dots AI 智能体，移动版 ChatGPT 将为其设独立标签页》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/030/288.htm", "publishedAt": "2026-11-20T22:57:39+00:00"}, {"title": "“美国大豆包”又发新模型，Neon 接入 Antigravity 后编程解题率升至三倍多", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/tDxNggErsJNeb53ZkYeF?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-20T18:41:34+00:00"}, {"title": "华为云开源昇腾原生具身世界模型CloudRobo-WM1.2，两项评测均列第一", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/LCqRiGDSeMBfXo4iktdA?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-20T18:19:11+00:00"}, {"title": "AI 攻克黎曼猜想？Anthropic 数学家宣称已与 Claude 合作完成证明", "summary": "IT之家 11 月 20 日消息，据《科学美国人》报道，当地时间 20 日，Anthropic 数学家莱文特 · 阿尔波格宣称，自己与 AI 模型 Claude 合作，攻克了数学界最著名的难题之一 —— 黎曼猜想。阿尔波格在个人网站发表声明称：“我相信，我与 Claude 合作找到了黎曼猜想的证明。”IT之家注：黎曼猜想由德国数学家伯恩哈德 · 黎曼于 1859 年提出，认为看似随机分布在数轴上的质数，实际上遵循着复杂而有意义的规律。此后，黎曼猜想成为整个数论研究领域的重要指引，也是数学界最著名的未解难题。由于长期缺乏明确的证明思路，研究进展极其有限，就连顶尖数学家也很少花费大量时间直接尝试证明。直到今年 10 月，OpenAI 集中公布的一批数学研究成果中，有一项证明在揭示质数分布规律方面取得重大进展，让攻克黎曼猜想首次看到了突破口。漫长的求证之路似乎即将走到终点。阿尔波格公布了与 Claude 合作完成的证明，并将其编写为 Lean 代码。据悉，Lean 是一种能够逐步验证数学推理是否正确的编程语言。一旦得到确认，2026 年将成为 AI 数学能力实现飞跃的一年。报道说，AI 从此前表现不稳定、甚至难以达到大学生水平，发展到展现出超越人类的能力，数学领域的各个分支都将受到冲击。阿尔波格称，他的证明不仅解决了黎曼猜想，还证明了范围远比原始猜想广泛的“广义黎曼猜想”。广义黎曼猜想，则意味着整个数学世界蕴藏着无数尚未发现的深层规律。如果这一成果得到确认，对数学界的影响将难以估量，大量以广义黎曼猜想成立为前提的数学结论也将随之得到证实。阿尔波格的声明既流露出对一个时代结束的伤感，也表达了对未来的期待。“觉得这一切意味着某种终结，是很自然的。对我而言，这意味着失去了一盏重要的指路明灯。但研究过程中见证的进展令我如此震撼，让我相信，整个科学界正在迎来远比其更伟大事物的曙光。”阿尔波格最后写道：“我希望这一证明能让人们一窥未来的奇迹，也让我们感受到，即使是最简单的事物，也将带给我们怎样的喜悦与惊奇。”参考论文原文（https://alpo.ge/remark.pdf）", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/030/278.htm", "publishedAt": "2026-11-20T15:37:46+00:00"}, {"title": "明基 AK900ST AI 高尔夫投影机发售：6000lm 亮度、短焦镜头设计，52999 元", "summary": "IT之家 11 月 20 日消息，明基旗下 AK900ST“AI 高尔夫投影机”现已在京东发售，该产品专为高尔夫模拟及多场景娱乐打造，定价为 52999 元。京东明基（BenQ）AK900ST AI 高尔夫专业模拟投影仪 激光投影（4K 超清 AI 画质臻彩引擎 6000 流明 镜头位移）52999 元直达链接该机搭载激光光源，正常寿命达 20000 小时（节能为 30000 小时），具备 4K 分辨率、MEMC 240Hz 刷新率、3000000:1 对比度与 6000 lm 亮度。通过 AI 画质及智能对比度增强（SDR 升 HDR）、AI 降噪与超分辨率重建，画面清晰细腻，内置独立高尔夫球模式，能精妙还原纹理与球场暗部细节。该机搭载短焦镜头，支持电动光学变焦，在 5.3 m 处即可投影 300 英寸画面。设备支持四向镜头位移（垂直 ±60%、水平 ±23%）和 3D 校正，内置 10W 扬声器，可灵活适配多样环境。IT之家附产品参数：", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/030/277.htm", "publishedAt": "2026-11-20T15:37:26+00:00"}, {"title": "昇腾算力训出了双榜SOTA的具身世界模型，华为云这次想把整套底座开放出来", "summary": "国产算力的成熟，把具身竞争维度从「芯片有多强」，拉入了一个比拼训练效率、数据规模、部署成本和场景落地速度的多维战场。", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/511610.html", "publishedAt": "2026-11-20T08:04:58+00:00"}, {"title": "蚂蚁 OceanBase 团队开源 PowerContext，跨对话的 Agent 记忆服务", "summary": "蚂蚁 OceanBase 团队开源了名为「PowerContext」的项目，解决的问题很具体：上下文不该死在一次对话里。 它的定位是「给 AI agent 用的开源上下文服务」。把工作中那些耐久的东西——决策、约束、证据、进度——从对话里搬到外面，这样下一个会话、下一个 agent，或者下一个人接手时，能从当前状态继续，不用重读一遍聊天...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503704/oceanbase-powercontex", "publishedAt": "2026-11-20T07:55:30+00:00"}, {"title": "微软发布 7 款“世界级”新模型，全在打同一个算盘", "summary": "微软 ry": "OpenAI 在推特上发了句挺少见的开场白：「有些人一直在非常礼貌地问，有些人就只是问。」然后宣布 GPT-6.2 Astra 和 Sol 上线。 两个模型分工很清楚。Astra 是旗舰，定位「为你最难的项目而建」，在专业工作和科学研究的评测上刷新了自己的记录，而每任务成本不到 GPT-6 Astra 的三分之一。官方的说法是，差别会体现在幻...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503626/openai-gpt-6-2-astra-sol", "publishedAt": "2026-11-18T03:13:26+00:00"}, {"title": "GPT-6.2 Astra 刚发布即遭大量差评，实测后我觉得它有点冤", "summary": "最聪明的模型，未必是最好用的模型；最好用的模型，也未必需要证明自己最聪明。#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1690103?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-11-18T02:39:15+00:00"}, {"title": "qOntology 开源版 v1.1.3 发布：长文档抽取支持分窗重试与阶段续跑，完善候选校验", "summary": "随着本体建模逐步引入 AI 辅助抽取，抽取任务的执行稳定性、候选数据的规范性，以及后续审核操作的完整性，都成为影响建模流程的重要环节。 本次 qOntology 开源版 v1.1.3 围绕 AI 辅助建模流程进行了多项完善，重点优化分窗抽取、异常窗口重试与任务续跑机制，同时调整四轮抽取提示词和候选数据校验规则。 此外，本次更...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503620", "publishedAt": "2026-11-17T08:11:29+00:00"}]}, {"label": "产品发布/更新", "items": [{"title": "智能体 AI 架构：当前挑战与未来机遇", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/TrWuo2vEZRl2xB2XXZNX?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-21T11:00:00+00:00"}, {"title": "TaoDesign 的知识工程实践：从设计资产到 Agent 持续进化｜AICon北京", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/vhoobUFbLs2hUlTBA4HZ?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-21T10:00:00+00:00"}, {"title": "Entire Git Forge：面向编码智能体重构 Git 协作方式", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/6swrOq5xUXwVqrREwJwc?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-21T10:00:00+00:00"}, {"title": "拯救爆满的“下载”文件夹：微软 Win11 将推 AI 整理神器，授权后可查找 / 分类 / 移动 / 重命名文件", "summary": "IT之家 11 月 21 日消息，科技媒体 Windows Latest 昨日（11 月 20 日）发布博文，报道称在 Ignite 2026 活动中，微软展示 Copilot“本地文件操作”功能，在征得用户授权后可以查找、分类、移动或重命名本地文件。IT之家附上相关视频如下：微软表示该功能可以减少手动翻找和归类的麻烦，用户主动启用并授权后，即可用日常语言要求 AI 查找、移动文件、创建文件和文件夹，还能根据文件内容批量重命名。在本次演示中，微软为了便于和团队成员分享内容，要求将“下载”文件夹里的分析师报告整理到 OneDrive。微软 Copilot 请求权限后，扫描相关目录，在 OneDrive 中创建“Analyst Reports”文件夹，随后逐一移入 8 份 PDF，并列出移动记录，提供撤销按钮。报道指出，演示中的 8 份文件，其名称均未直接出现“分析师报告”字样，Copilot 通过读取内容识别出符合要求的资料。用户因此不必记住准确文件名，只需描述要找什么，再由 AI 完成筛选与整理。在权限边界方面，演示中的授权界面提供“暂不允许”和“仅本次会话允许”两个选项，没有“始终允许”，且访问范围限于当前对话及相关目录，无法一次授权便能读取整台电脑。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/030/333.htm", "publishedAt": "2026-11-21T02:59:20+00:00"}, {"title": "英伟达发布 GeForce 621.35 热修复驱动，修复 SSD 后台异常写入问题", "summary": "IT之家 11 月 21 日消息，英伟达于当地时间 11 月 20 日发布了 GeForce Hotfix 621.35 显卡驱动，修复此前部分 Game Ready 驱动可能在后台向固态硬盘（SSD）过度写入数据的问题。这一热修复驱动基于最新的 GeForce Game Ready Driver 621.24 版本，仅包含一项修复：解决后台可能向 nvlog.nvlgstg 文件过度写入数据的问题，对应 Bug 编号为 7116722。此前，有用户反馈，安装 GeForce 621.14 和 621.24 驱动后，即使电脑处于空闲状态，系统仍会持续产生大量 SSD 写入操作。相关问题涉及 NVDisplayContainer.exe 进程，该进程会反复改写 nvlog.nvlgstg 日志文件。据 TechPowerUp 报道，部分用户测得的异常写入量最高达到每小时 30GB，而此前的 621.01 版本驱动在相同的 5 分钟空闲时间内，日志写入量约为 2MB。此次发布的 621.35 属于可选热修驱动，采用缩短后的质量测试流程，并非正式 WHQL 认证版本。英伟达表示，热修驱动主要用于提前向用户提供针对性问题修复，相关修复内容后续还会整合进正式驱动。此次 621.35 热修驱动面向 Windows 10 和 Windows 11 64 位系统提供下载，用户需要通过英伟达官方客户支持页面获取，目前不通过 NVIDIA App 分发。IT之家附下载地址：https://international.download.nvidia.com/Windows/621.35hf/621.35-desktop-notebook-win10-win11-64bit-international-dch.hf.exe相关阅读：《英伟达发布 Game Ready 621.14 驱动：优化〈魔兽世界：无限〉，修复视频黑屏问题》《英伟达承认 GeForce 621.01 驱动存在问题：播放视频时可能卡住或黑屏》《最高每小时狂写 30GB：英伟达 621.24 驱动反馈加速消耗 SSD 寿命》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/030/332.htm", "publishedAt": "2026-11-21T02:55:52+00:00"}, {"title": "微软发布 Win11 26340.10032 等预览版：新增 People 小组件、优化蓝牙 LE Audio 立体声输出", "summary": "IT之家 11 月 21 日消息，微软昨天（11 月 20 日）发布博文，邀请 Beta、Experimental 频道的 Windows Insider 项目成员，测试适用于 Windows 11 的多个预览版更新。本次推送的版本分别为：Beta 通道（26H2）：最新预览版 Build 26320.10022Beta 通道（26H1）：最新预览版 Build 28020.3562Experimental 通道（26H2）：最新预览版 Build 26340.10032Experimental 通道（26H1）：最新预览版 Build 28120.3571Experimental 通道（未来平台）：最新预览版 Build 29712.1013上周暂停频道迁移后，Insider 现已可从 Beta、Experimental 频道切换至 Experimental（未来平台）频道，需注意 Experimental（未来平台）版本不匹配任何零售版 Win11，切换或退出该频道需完全重装系统。IT之家附 Windows 11 改进进展如下：1、蓝牙 LE Audio 音频优化（Experimental 频道）蓝牙 LE Audio 设备在启用麦克风时，可实现全范围立体声保真输出，保证游戏语音、语音通话、语音输入、Copilot Chat 语音聊天场景下的高质量音频体验。当使用支持超宽带立体声（Super Wideband Stereo）的 LE Audio 设备搭配兼容 PC 时，可在设置 &gt; 系统 &gt; 声音 &gt; 输出 &gt; 对应蓝牙设备 &gt; 输出设置 &gt; 麦克风启用时格式中，选择 2 声道、16 位、48000Hz 选项。该功能适用于支持 48kHz 播放的 LE Audio 耳机、耳塞、音箱设备。若遇到兼容性问题，可通过反馈中心提交反馈。2、新增 People 小组件（Experimental 频道）新增 People 小组件，可从小部件面板快速访问常用联系人，整合支持的通讯应用中的相关联系人，方便快速继续对话。使用时可通过 Windows 键 + W 打开小部件面板，点击 + 号打开小部件选择器，添加 People 小组件后，点击对应联系人即可跳转至支持的通讯应用打开会话。前置要求：需先在 PC 上安装配置手机连接（Phone Link）、WhatsApp 或二者同时配置，才能在小组件中显示联系人。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/030/281.htm", "publishedAt": "2026-11-21T02:28:15+00:00"}, {"title": "华为星芒 O1 Pro 定价 5499 元起引争议，总经理刘赫回应称“我们选择创新优先”", "summary": "IT之家 11 月 21 日消息，华为全新子品牌星芒于 11 月 20 日发布首款机型 OSTA O1 Pro，12GB+256GB 版本首发价 5499 元，顶配 16GB+1TB 首发 8799 元。这一定价与外界此前对子品牌“主打性价比”的预期形成落差。对此，星芒品牌总经理刘赫在微博评论区密集回应了网友质疑。首先，争议的焦点之一，是 O1 Pro 与华为 Pura X View 的价差。两者同为麒麟 9030S 平台、6.39 英寸 1.5K 阔直屏，O1 Pro 砍掉了超广角镜头，起售价仅比 Pura X View 低 500 元。有网友直言“再便宜 500 销量翻三倍”，刘赫的回应是：“我宁愿先把产品做好一点…… 便宜未必是创新的方向。O1 Pro 是尝试新技术，在 AI 带来新体验。”他将“星芒要便宜还是星芒要创新”概括为一道选择题，并强调“我们选择创新优先”。不过，O1 Pro 并非 Pura X View 的单纯减配版。其 16GB 运行内存是 Pura X View 全系 12GB 所不具备的选项，刘赫也将大内存视为“明显的性能提升”，并称 16GB 版本开售当天全平台售罄。此外，OSTA 的 AI 屏、小星芒等交互设计为星芒独占，刘赫明确表示后续不会开放给 Mate 或 Pura 系列。面对“AI 对年轻人不是高频场景”“父母用豆包但嫌贵”等用户反馈，刘赫的回应是将 AI 定位为“伴随态、有记忆、可执行日常任务”的长期趋势，并举例“手机上布置任务、PC 上执行、手表提醒、平板展示”的跨端场景。刘赫还将星芒的角色比作“独立营、侦察连”：“大面积占领阵地那必然是主力部队的任务，我是开视野，探方向。”他确认星芒后续将扩展至全场景品类，“手机只是开始。”部分线下门店已有 O1 Pro 销售，但刘赫承认“货备少了”。对于有用户称星芒发布“反向推了一把 Pura X View 销量”，刘赫表示“两个产品不同选择”。IT之家此前报道，华为星芒 OSTA O1 Pro 搭载麒麟 9030S 芯片，6.39 英寸 16:9.5 比例 1.5K LTPS 直屏，峰值亮度 6500 尼特，7000mAh 电池支持 66W 有线与 50W 无线充电。相关阅读：《华为星芒刘赫：OSTA O1 Pro 最受欢迎的 16G 版本已在全平台售罄，远超预期》《独占特性确认：华为 Mate 系列旗舰机“无缘”OSTA 小星芒、AI 屏等功能》《5499 元起，“首款为 AI 而生的鸿蒙手机”华为星芒 OSTA O1 Pro 阔直板正式发布》《鸿蒙全新版本来袭！华为星芒 OSTA O1 Pro 官宣首搭 HarmonyOS 7 AI 先锋版系统》《华为星芒刘赫：得麒麟芯者得天下，OSTA O1 Pro 搭载麒麟 9030S 旗舰 τ 芯片》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/030/311.htm", "publishedAt": "2026-11-21T01:08:46+00:00"}, {"title": "440 亿美元！阿波罗与高盛完成迄今规模最大 GPU 融资定价，SpaceX 要买英伟达芯片", "summary": "IT之家 11 月 21 日消息，当地时间 11 月 20 日，阿波罗全球管理公司与高盛宣布，已完成约 440 亿美元（IT之家注：现汇率约合 2,944.47 亿元人民币）优先及次级票据融资定价，资金将用于为 SpaceX 购买 GPU 及相关设备。该交易因投资者需求强劲而获得超额认购并扩大规模，成为迄今规模最大的 GPU 融资交易。阿波罗与高盛共同牵头此次融资，参与方还包括贝莱德、高盛资产管理及 KKR。融资将用于采购下一代英伟达 Vera Rubin 芯片，以支持 SpaceX 在地面建设计算基础设施。相关 GPU 及设备预计于 2027 年上半年交付，届时租赁安排将开始生效。阿波罗合伙人 Jamshid Ehsani 表示，SpaceX 是全球最具雄心的算力建设者之一，“很高兴与高盛一同牵头这笔融资”。他表示，这笔交易体现了阿波罗一体化平台的能力，即发起、结构设计、分销与本金投资协同运作，以规模化提供灵活资本；也体现了公司对“下行保护、以资产为基础的结构”的关注。IT 之家此前报道，10 月 26 日，SpaceX 宣布与阿波罗达成一份价值约 400 亿美元（现汇率约合 2,676.79 亿元人民币）的 GPU 及相关设备主融资租赁协议，签署时间预计落在 2026 年内。当时该协议即被称为迄今规模最大的 GPU 融资协议。截至 2026 年 9 月 30 日，阿波罗管理资产规模约 1.07 万亿美元（现汇率约合 7.16 万亿元人民币）。相关阅读：《SpaceX 达成史上最大规模 GPU 融资安排，协议总额约 400 亿美元》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/030/296.htm", "publishedAt": "2026-11-20T23:34:13+00:00"}, {"title": "谷歌搜索首页新增 AI 侧边栏，让你“接着聊”此前提问话题", "summary": "IT之家 11 月 21 日消息，谷歌搜索产品副总裁罗比 · 斯坦（Robby Stein）昨日（11 月 20 日）在 X 平台发布推文，宣布 Google Search 首页将迎来新一轮调整，面向全球桌面端逐步推出可折叠侧边栏，让用户直接从首页查找和继续此前的 AI 搜索对话。根据演示，用户点击页面左侧的灰色条，即可展开侧边栏，查看通过“AI 模式”（AI Mode）进行的搜索记录。面板还提供新建对话、搜索历史对话以及连接 Gemini 笔记本等入口。选择已有记录后，用户可以回到相应话题继续提问，不必重新从头搜索。斯坦指出本次改进的重点是让搜索具备更强的连续性，根据内部调查数据显示，用户在搜索页面带来了越来越多无法通过一次查询解决的问题，而侧边栏有助于他们继续推进任务、深入探索网络信息。推进部署方面，AI 入口前置并不意味着传统搜索被取代。据报道，输入关键词后直接按回车，仍会显示常规搜索结果；用户需主动选择 AI 模式，才会进入相应体验。目前更新正分批上线，不同用户看到的新界面可能存在时间差。IT之家目前尝试访问谷歌搜索页面，暂未发现相关 AI 侧边栏，“AI 模式”按钮存在于搜索框内。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/030/287.htm", "publishedAt": "2026-11-20T22:53:45+00:00"}, {"title": "独占特性确认：华为 Mate 系列旗舰机“无缘”OSTA 小星芒、AI 屏等功能", "summary": "IT之家 11 月 21 日消息，首款为 AI 而生的鸿蒙手机 —— 华为星芒 OSTA O1 Pro 已于昨日下午正式发布，叠加国补后 4999 元起。华为星芒品牌总经理刘赫开通微博，透露最受欢迎的 16G 版本已经在全平台售罄。▲ IT之家开箱：华为全新子品牌星芒 OSTA O1 Pro 手机实拍IT之家注意到，刘赫还在自己微博的评论区与网友展开了互动，并解答了不少消费者的疑惑。针对大家最关心的星芒 OSTA O1 Pro 首发新功能华为 Mate 系列能否 OTA 支持相关问题，刘赫的回复如下：能不能反馈一下 Mate 也做一套新图标？那我就... 不反馈给他们了 [狗头斜眼] 开玩笑的，但是我的 AI 屏和星芒⭐他们是没有滴星芒默认图标啥时候上放给 Mate 系列？不给 [狗头斜眼]这意味着，华为星芒的开山之作 —— OSTA O1 Pro 的全新设计图标、AI 屏和小星芒为独占特性。而新图标有望后续开放给其他系列机型使用，但 AI 屏和小星芒暂时未有相关计划。参考IT之家此前报道，华为 Mate 90 系列手机和华为 Pura X View 已推送鸿蒙 HarmonyOS 7.0.0.115 版本升级，带来了 AI 快捷栏。但 Mate 90 系列和 Pura X View 的 AI 快捷栏与星芒手机的功能有所差异，且在外观设计思路上也截然不同。相关阅读：《华为星芒刘赫：OSTA O1 Pro 最受欢迎的 16G 版本已在全平台售罄，远超预期》《5499 元起，“首款为 AI 而生的鸿蒙手机”华为星芒 OSTA O1 Pro 阔直板正式发布》《华为 Pura X View 阔直板手机获 HarmonyOS 7.0.0.115 升级，桌面 AI 快捷栏如约而至》《华为 Mate 90 系列手机 AI 快捷栏全新交互体验曝光，与星芒 OSTA O1 Pro 风格完全不同》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/030/284.htm", "publishedAt": "2026-11-20T19:20:43+00:00"}, {"title": "Agent 上岗，你敢放手吗？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/video/qafOtORWUX0eD0WfSlYi?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-20T18:25:42+00:00"}, {"title": "三星电子高管：Neocloud 风险有限，AI 投资基于实际需求", "summary": "IT之家 11 月 20 日消息，据路透社当地时间 18 日报道，三星电子两位高管在本周举行的摩根士丹利会议上表示 Neocloud（新兴 AI 云服务企业）面临的不确定性对整体市场的影响有限，这轮 AI 投资基于实际需求而非投机。三星 DS（设备解决方案，半导体板块）部门经营战略总管负责人 Kim Yong-kwan 表示，Neocloud 的“市占份额”仅约为 8%，对此类企业的担忧不会对 AI 整体发展轨迹构成重大威胁。这位高管并未详述作为市占计算基础的“市场”具体指什么。三星晶圆代工销售营销主管 Kang Suk-chae 则认为，当前的 AI 投资热潮是结构性的，源自实在的需求而非投机冲动。芯片短缺的局面“在可预见的未来仍将持续”，长期合同使供需双方之间的关系更加明朗。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/030/247.htm", "publishedAt": "2026-11-20T14:09:40+00:00"}, {"title": "Grab 通过安全策略应对 AI 生成代码变更激增，提升移动端 App 稳定性", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/AH8deOIGb5hMHRPIKfrf?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-20T14:00:00+00:00"}, {"title": "谷歌发布用于机器人控制、仿真和策略优化的 Gemini 4 Argon", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/S4LH5Z9zcbLokm5uNSKR?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-20T11:00:00+00:00"}, 黄仁勋寻求重返英伟达管理层而重新受到关注。根据这份加州高等法院的诉讼文件，英伟达首任内部法律顾问斯蒂芬・佩蒂格鲁（Stephen Pettigrew）称，他曾亲眼目睹黄仁勋经常辱骂和恐吓员工。佩蒂格鲁还指控，自己因对公司高管的不当行为提出异议而遭到解雇。英伟达则表示，解雇他的原因是工作表现不达标。佩蒂格鲁代理律师在一份涉及年龄歧视和不当解雇的诉讼案情摘要中写道，黄仁勋曾对员工大吼大叫，威胁要对他们实施严重人身伤害，还一边模仿性行为做出顶胯动作，一边发表色情言论。诉讼文件还描述了一名未具名英伟达高级高管的相关行为，包括威胁扯下员工的胳膊并用其殴打对方，以及发表带有性暗示的言论。公开资料显示，佩蒂格鲁于 1999 年 9 月加入英伟达，此前曾在三家大型律师事务所工作，同时拥有电子设计工程师背景。他于 2006 年 6 月被公司解雇，随后向英伟达索赔超过 260 万美元（IT之家注：现汇率约合 1,739.9 万元人民币）。法院记录显示，英伟达曾提出 17.5 万美元的和解方案，并针对佩蒂格鲁提起反诉，要求其归还公司文件。双方最终于 2009 年 12 月达成保密和解。这份诉讼文件还引用了英伟达前人力资源高级副总裁迈克尔・温斯顿（Michael Winston）于 2005 年提交的一份歧视投诉。温斯顿指控，自己因反对黄仁勋虐待员工，以及部分他认为构成性骚扰的行为而遭到解雇。根据相关庭审记录，温斯顿于 2004 年 9 月加入英伟达，但在公司仅工作了四周。《纽约时报》指出，英伟达后来与温斯顿达成保密和解，赔偿金额超过 100 万美元（现汇率约合 669.2 万元人民币）。温斯顿此后还因举报企业不当行为受到关注。他曾指控美国住房贷款机构 Countrywide Financial 因其提出贷款业务风险问题而将其解雇。陪审团一度裁定该公司向温斯顿赔偿 380 万美元（现汇率约合 2,543 万元人民币），但这一判决后来被联邦上诉法院推翻。彭博社指出，黄仁勋此前曾承认，他会以近乎严苛的方式磨砺与自己密切共事的员工，以确保他们拿出最佳表现。他也曾在公开场合展现强硬的管理风格。与此同时，多篇媒体报道曾描述他在长期执掌英伟达期间贬低下属的情况。黄仁勋曾解释，自己的管理方式源于对行业竞争的危机感，认为科技行业变化迅速，企业必须保持推进速度。他还多次表示，为自己任职期间没有裁员感到自豪，并对公司唯一一次裁员经历表示遗憾。对于此次曝光的历史指控，黄仁勋的一名代表回应称，这些说法是两名被解雇员工在 20 多年前提出的虚假指控，并表示过去一周有数千名员工声援黄仁勋，足以说明这些指控不实。英伟达方面则没有回应彭博社的置评请求。IT之家提醒：佩蒂格鲁和温斯顿均已离世。彭博社表示，曾代理两人的多名律师及其家属均未能取得联系，因而无法进一步核实相关指控。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/030/316.htm", "publishedAt": "2026-11-21T01:33:53+00:00"}, {"title": "财报再亮眼也没用！黄仁勋想回去，英伟达董事会偏不让", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/3xzCDJBbDREm4EJFJWrH?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-20T18:48:14+00:00"}, {"title": "AI 漫剧不缺作品，缺什么？｜QLab直播", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/27xI2tBkStO5qz52VBPw?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-20T17:14:29+00:00"}, {"title": ":fire: xbatis 1.10.11 正式发版，mybatis 系列最好用最简单最方便的 ORM !!", "summary": "推荐理由： 强、强、强 ，单表？连表？不想连表？让你直接少写 1/3 甚至 2/3 的持久层代码；API 简单 快捷 优雅 简洁 构建 SQL 非常强！用过的 没用过的都来体验，虽然有 AI 了，但是真正好用的 ORM 的还不能忽略的，除非你以后不维护。 1.10.15 - 2026-11-05 元）。美联社指出，周五美国科技股和人工智能相关股票普遍遭遇重挫，标普 500 指数下跌 3.7%，纳斯达克综合指数下跌 5.3%，AMD 和美光分别下跌 13.3% 和 13.9%。市场对人工智能产业高估值、巨额资本开支能否持续以及相关投资回报的担忧，正在加剧科技股抛售。与此同时，人工智能产业链股票普遍承压，半导体板块也出现大幅下跌。这场抛售的直接触发因素指向英伟达的人事震荡。当地时间 11 月 8 日，英伟达联合创始人黄仁勋在致员工信中承认婚外情，随后于 11 月 12 日辞去总裁、首席执行官及董事会董事职务。11 月 17 日，英伟达董事长哈维 · 琼斯在财报电话会议上明确表示，董事会“一致接受了他的辞呈，无意让黄仁勋复任首席执行官”。黄仁勋此前曾公开表态已准备好重返公司，但未获董事会回应。英伟达周二发布的财报本身超出华尔街预期，但投资者更为关注的是丑闻对公司治理和战略连续性的冲击，而非当季财务数字。围绕黄仁勋辞职原因的疑问，在财报会议上未得到充分解释，抛售压力随之延续。英伟达的跌势并非孤立事件。本周纳斯达克综合指数累计下跌 10%。纳斯达克 100 指数单日市值蒸发 2.1 万亿美元，为 2020 年 3 月新冠疫情冲击全球市场以来的最差单周表现。标普 500 指数下跌 8.6%，进入回调区间；道指下跌 8%。被称为市场“恐惧指标”的芝加哥期权交易所波动率指数（VIX）升至今年最高水平。AI 板块几乎无一幸免。被统称为“科技七巨头”的成分股全线收跌，芯片制造商和以 GPU 算力租赁为主业的新云（neocloud）公司普遍录得两位数跌幅。Anthropic 的 IPO 曾被部分市场参与者视为 AI 交易的一剂强心针，结果未能如愿。11 月 19 日，Anthropic 以每股 83 美元发行价登陆纳斯达克，开盘报 111.50 美元，涨幅约 34%，盘中市值一度突破 2 万亿美元。但涨幅在开盘后迅速回吐，首日收盘仅较发行价上涨 17%，报 97.17 美元。周五 Anthropic 进一步下跌 8.5%，股价逼近发行价。这场史上规模最大的 IPO（募资约 813 亿美元）未能阻止纳斯达克综合指数当日抹去全年涨幅。华尔街日报指出，市场情绪的转变并非单一事件所致。中期选举后围绕数据中心建设的社会阻力上升，英伟达 CEO 更迭叠加 AI 相关网络攻击担忧，共同放大了投资者对 AI 基础设施企业盈利预测的怀疑。Truist Advisory Services 首席投资官基思 · 勒纳将此描述为“买方罢工”—— 投资者并未对 AI 的长期潜力失去信心，但对支撑当前估值的盈利预测失去了信心。利率环境进一步压制了风险资产。美联储主席凯文 · 沃什自 2026 年 5 月上任以来，联邦基金利率一直维持在 3.5% 至 3.75% 区间，市场此前期待的降息并未兑现。芝商所数据显示，市场预期美联储 12 月加息 25 个基点的概率已达 96.4%。债券收益率的上升既推高了企业借贷成本，也促使部分资金从股票转向固定收益资产。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/030/302.htm", "publishedAt": "2026-11-21T00:08:12+00:00"}, {"title": "Anthropic 上市次日股价下跌 9%，AI 板块雪上加霜", "summary": "IT之家 11 月 20 日消息，据路透社报道，当地时间 20 日，Anthropic 上市次日股价下跌，令低迷的 AI 板块雪上加霜。这场备受期待的 IPO，也没能重新点燃投资者的热情。作为 AI 投资热潮的重要风向标，Anthropic 上市曾被寄予厚望，市场期待借此提振经历一段动荡时期后持续疲软的 AI 板块。然而，Anthropic 股价报 88.25 美元（IT之家注：现汇率约合 590.6 元人民币），较上市首日的收盘价下跌约 9%。公司完全稀释后的估值约为 1.6 万亿美元（现汇率约合 10.71 万亿元人民币），按已发行股份计算的市值则约为 1.2 万亿美元（现汇率约合 8.03 万亿元人民币）。短期内，股价仍可能持续波动。随着上市热潮逐渐退去，投资者开始审视 Anthropic 相当于过去 12 个月营收约 40 倍的估值是否合理。美国合众银行资产管理部门私人市场投资主管考希 · 阿明建议：“我们倾向于对 Anthropic 保持耐心，等公司陆续公布上市后的业绩，再进行评估。”在他看来，当前估值意味着，市场预期 Anthropic 未来多年都能保持快速增长。Anthropic 上市也未能扭转市场对 AI 板块的担忧。华尔街主要股指周四大幅收跌，周五的股指期货走势则预示市场可能继续下挫。美股科技七巨头中，英伟达和 Meta 盘前跌幅均超过 3%，亚马逊和微软跌幅超过 2%。芯片股同样承压，AMD 和闪迪均下跌超过 6%，英特尔跌幅超过 4%。市场接下来的关注焦点是 OpenAI 可能进行的 IPO。OpenAI 此前透露有望于明年上市，届时将再次检验投资者对 AI 股票的兴趣。散户 19 日当天买卖 Anthropic 股票的交易额约为 7.72 亿美元（现汇率约合 51.66 亿元人民币），创下研究机构 Vanda Research 自 2012 年开始统计以来，IPO 首日散户交易额的最高纪录。Anthropic 股价大幅波动，让投资者面临两难选择：究竟应该押注股价反弹，还是防范进一步下跌？Anthropic 股票期权预计下周开始交易，可能进一步加剧波动。德国贝伦贝格银行指数事件主管卡斯滕 · 黑塞指出，目前的市场环境对 Anthropic 并不有利。竞争加剧也可能削弱投资者的信心。彭博社最新消息称，苹果正在开发一款能够代替用户执行任务的 AI 智能体，准备加入 OpenAI、Anthropic 和 Meta 之间的市场竞争。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/030/246.htm", "publishedAt": "2026-11-20T14:05:13+00:00"}, {"title": "哈佛大学研究人员：AI 编程目前的瓶颈是“Code Review”", "summary": "哈佛大学两位博士候选人做了一份工作论文，把 AI 编程 Agent 的真实效果算了一遍。样本是 718 家公司、725938 名员工。 结论不太好看。 用上 AI 编程 Agent 之后，人均每月新增代码行数从 5017 涨到 6511，多了约 30%。提交数增长 20%，Pull Request 增长 23%。该有的增长都出现了。 但活干完了吗？没有。 论文用 Jira i...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503706/harvard-researchers-find-ai-coding-agents-shifted", "publishedAt": "2026-11-20T09:00:13+00:00"}, {"title": "Google「AI Overviews」让网站的搜索流量下降四成", "summary": "Google 搜索引擎「AI Overviews」服务正在抢走网站的流量。 根据一项随机实验的测试，AI Overview 导致从 Google 搜索结果指向外部网站的点击量下降了四成。 这是随机实验做出来的数字，不是相关性推测。研究者对一部分美国桌面用户隐藏了 AI Overviews，然后和仍能看到的那组做对比。 这个数字背后有一个更直观的画面：...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503698", "publishedAt": "2026-11-20T03:57:08+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "现价近 7000 欧元的英伟达 RTX 5090 FE 显卡送修后被销毁，平台只愿退原价 2369 欧元", "summary": "IT之家 11 月 21 日消息，Reddit 用户 @xw1y 昨日发帖称，自己送修的一张 NVIDIA GeForce RTX 5090 Founders Edition 显卡，疑似在欧洲零售商 Proshop 的维修合作方手中被销毁或丢弃。据该用户披露，这张 RTX 5090 Founders Edition 32GB 于 2025 年 2 月以为 2,369 欧元（IT之家注：现汇率约合 17,394 元人民币）的价格购入。2026 年 9 月，这张显卡开始出现频率下降、功耗读数异常等问题，但送修前仍然能够正常使用。当月，他将这张 RTX 5090 FE 送到了 Proshop 进行维修或更换。11 月 6 日，该用户书面告知 Proshop 须保留显卡，不要丢弃，且禁止在未征得他书面同意的情况下进行任何不可逆的操作。11 月 16 日，Proshop 打电话表示可以退货或退款。然后 11 月 20 日，其女朋友接到电话说 Proshop 的售后服务合作商已经毁掉或丢弃了这张显卡，而 Proshop 还没有书面确认这一点。根据用户公开的邮件记录，Prosh ina.net/news/503667/claude-dev-how-the-claude-code-team-thinks-about-verification", "publishedAt": "2026-11-19T06:44:55+00:00"}]}]};

const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
