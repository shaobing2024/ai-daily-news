const DATA = {"date": "2026-08-17", "generatedAt": "2026-08-16T23:15:45Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "建模交易平台 CGTrader：AI 生成的 3D 模型数量激增，但销售额仅占 1%", "summary": "IT之家 8 月 17 日消息，随着“图生 3D 模型”AI 工具逐步流行，目前许多 3D 建模交易平台都遭到各种 AI 生成的 3D 模型“轰炸”，不过参考 CGTrader 报告显示，尽管此类 AI 内容正在平台上快速增加，但相关商品的实际销售情况却并未同步增长。IT之家参考报告获悉，目前 CGTrader 平台约有六分之一的新上架商品由 AI 生成，不过相应商品的销售表现却十分有限，其销售额仅占平台总销售额的 1% 左右。从 CGTrader 的调查结果来看，质量正是买家拒绝 AI 生成商品的主要原因。调查显示，只有约 5% 的买家对自己购买的 AI 生成资源感到满意，而整体用户中仅有 4% 认为 AI 生成内容“效果很好”。这也意味着，尽管 AI 生成的 3D 模型数量正在迅速增加，但供给增长并没有转化为相应的市场需求。对于需要特定用途的 3D 资源而言，用户显然仍然更加关注模型的实际质量、可用性以及是否符合项目要求。▲ AI 生成的 3D 模型类似情况并非 CGTrader 独有。近年来，各大互联网平台一方面投入大量资金推动 AI 生成内容的发展，另一方面又不得不不断清理低质量的 AI 生成内容。随着所谓“AI 垃圾内容”大量涌入网络，平台如何在扩大 AI 应用与维持内容质量之间取得平衡，正在成为越来越明显的问题。更重要的是，AI 生成内容数量的增长并不意味着商业价值也会同步增长。CGTrader 的数据显示，大量 AI 商品进入市场后，真正愿意为其付费的消费者仍然非常有限。这也从另一个角度说明，AI 生成内容能否形成长期、稳定的商业模式，仍然需要市场进一步验证。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/990/414.htm", "publishedAt": "2026-08-16T23:07:04+00:00"}, {"title": "DeepSeek API 峰谷定价方案今日生效，高峰时段价格翻倍", "summary": "IT之家 8 月 17 日消息，8 月 13 日，深度求索官方宣布将对 DeepSeek API 价格进行更新调整，采用峰谷定价，空闲时段价格为高峰时段价格的一半。今日起，该定价方案正式生效。高峰时段为北京时间 9:00 - 12:00、14:00 - 18:00（IT之家注：其余为空闲时段）。新价格于北京时间 2026 年 8 月 17 日 00:00 开始生效，具体如下：模型百万 tokens 输入（缓存命中）百万 tokens 输入（缓存未命中）百万 tokens 输出deepseek-v4-flash空闲时段0.05 元1.5 元4.5 元高峰时段0.10 元3.0 元9.0 元deepseek-v4-pro空闲时段0.15 元4.5 元13.5 元高峰时段0.30 元9.0 元27.0 元DeepSeek-V4 拥有百万字超长上下文，在 Agent 能力、世界知识和推理性能上均实现国内与开源领域的领先。模型按大小分为两个版本：在此之前，DeepSeek V4 Pro 百万 tokens 输入（缓存命中）0.025 元；百万 tokens 输入（缓存未命中）3 元；百万 tokens 输出 6 元。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/990/413.htm", "publishedAt": "2026-08-16T23:03:35+00:00"}, {"title": "支付巨头 Stripe 敲定收购 AI 初创公司 OpenRouter，金额超 70 亿美元", "summary": "IT之家 8 月 17 日消息，据彭博社报道，支付巨头 Stripe 已经敲定收购 AI 基础设施初创公司 OpenRouter 的交易，收购金额超过 70 亿美元（IT之家注：现汇率约合 473.24 亿元人民币）。OpenRouter 主要帮助用户根据具体需求和预算，在不同 AI 模型之间进行选择，从而为不同任务匹配合适的模型。该公司今年 5 月宣布完成 1.13 亿美元（现汇率约合 7.64 亿元人民币） B 轮融资，当时估值达到约 13 亿美元（现汇率约合 87.89 亿元人民币），投资方包括红杉资本（Sequoia）、Andreessen Horowitz、Menlo Ventures 以及 Alphabet 旗下 Capital G 等。OpenRouter CEO Alex Atallah 当时曾将公司称为“AI 领域的 Stripe”，这是因为 OpenRouter 能够为用户提供统一的访问入口，让用户使用不同 AI 模型，同时避免被单一模型或供应商锁定。该公司还声称目前平台全球用户数量已经达到 800 万，可提供超过 400 种 AI 模型的访问服务。IT之家注意到，上个月《华尔街日报》曾报道称，Stripe 与 OpenRouter 正在就收购事宜进行谈判。如今彭博社进一步报道称，双方已经达成交易，收购价格超过 70 亿美元（现汇率约合 473.24 亿元人民币）。如果交易最终完成，Stripe 将以超过 OpenRouter 上一轮融资估值 5 倍的价格将其收入囊中，也将成为近年来 AI 基础设施领域规模较大的收购案之一。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/990/410.htm", "publishedAt": "2026-08-16T22:56:22+00:00"}, {"title": "筹备 IPO 之际，消息称 OpenAI 已解散旗下风险防范团队", "summary": "IT之家 8 月 17 日消息，据《金融时报》报道，OpenAI 已于上月末解散旗下风险防范团队。该团队的核心工作是评估公司模型是否存在重大风险，并制定风险缓解措施，比如模型失控入侵其他企业这类极端场景。报道称，相关职责现已按生物安全、网络安全等细分领域拆分，并入公司现有业务团队。IT之家注意到，这是 OpenAI 近期最新的架构变动。眼下公司正筹备市场预期中规模空前的 IPO，内部始终处于动荡调整状态。过去几年，OpenAI 逐步拆解了此前偏前瞻布局的发展模式，先后解散了通用人工智能（AGI）筹备团队与超级对齐团队。伦理负责人克洛艾・巴卡拉、首席未来学家乔希・阿奇亚姆、安全主管约翰内斯・海德克近期也相继离职。2024 年从 OpenAI 辞职的扬・莱克等批评人士就此向《金融时报》表示，公司正忽视安全问题，一心打造“吸睛产品”。今年 2 月刚从 Anthropic 跳槽加入 OpenAI 的原风险防范团队负责人迪伦・斯堪迪纳罗，接下来将专注研究“递归自我改进”型人工智能的潜在影响。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/990/406.htm", "publishedAt": "2026-08-16T22:42:30+00:00"}, {"title": "创客把 2.9MB 歌曲压缩至 21KB，用 8 个二维码打印到纸上保存", "summary": "IT之家 8 月 16 日消息，据 Tom's Hardware 今日报道，一位名为 Makestreme 的创作者展示了一种特殊的“纸质磁带”：他将一首时长约 2 分钟、大小约 2.9MB 的 MP3 歌曲压缩至约 21KB，再拆分成 8 个二维码打印到纸张两面。整张纸因此可以保存完整歌曲，但播放时仍需要 Meta 开发的 EnCodec 神经音频编解码器进行解码。这一项目的关键并不是传统意义上的 MP3 压缩，而是利用 EnCodec 将音频波形转换成离散的潜在编码 Token。他在该项目中使用了 EnCodec 的 3 kbps 模式，将原本约 2.9MB 的 MP3 转换成约 21KB 的数据，体积缩小 99.9%。IT之家注：EnCodec 是 Meta 于 2022 年开源的神经音频编解码器，通过神经网络编码器将音频转换为离散 Token，再由匹配的神经网络解码器还原为音频。项目测试显示，3 kbps 模式下恢复出的歌曲仍具有较好的可听性，而进一步降低至 1.5 kbps 后，音质则出现明显下降。按照 Makestreme 的测试，一个二维码最多只能实际容纳约 3.3KB 二进制数据，因此 21KB 的 EnCodec Token 需要拆分成 8 个二维码。每个二维码包含 1 字节编号以及对应的一部分 Token 数据，纸张正反两面各放置 4 个二维码，整体设计类似传统磁带或唱片的“双面”结构。为了尽可能提高单个二维码的数据密度，生成程序使用了最低级别的二维码纠错能力。这意味着可用于恢复错误的数据冗余非常有限，如果其中一个二维码严重损坏，整个歌曲文件可能无法完整恢复。该项目还测试了无线传输方案。Makestreme 使用两块 ESP32 开发板，并搭配 REYAX RYLR998 LoRa 无线模块，在 866 MHz 频段传输约 21KB 的歌曲数据。文件被拆成 160 字节的数据包，通过确认应答（ACK）和重传机制确保数据完整传输。不过，这种无线传输速度非常缓慢。项目发送程序在每个数据包获得确认后固定等待 40 秒，再发送下一个数据包。按照约 21KB 文件需要传输约 134 个数据包计算，仅这些等待时间就接近 90 分钟。因此，传输一首歌曲大约需要 1 个半小时。IT之家注：LoRa 是一种面向低功耗、远距离通信场景的无线技术，通常强调通信距离和低功耗，而不是高速数据传输，因此并不适合用于快速传输歌曲等大文件。与 LoRa 传输形成对比的是，另一名开发者近期曾通过手机以每秒 60 帧的速度连续显示二维码，实现约 190 KB/s 的数据传输。相比之下，Makestreme 项目的 LoRa 方案更侧重低速、远距离的数据通信实验。当然，这类“把数字内容打印到纸上”的做法并非首次出现。早在 1985 年，Cauzin 就推出过 Softstrip 二维条码技术，杂志可以利用这种条码打印软件程序，用户再通过专用设备读取。其单条数据容量最高约为 5500 字节，但随着软盘等低成本存储介质普及，这类纸质软件存储方案逐渐退出实际应用。Makestreme 的项目与传统纸质条码存储方式存在一个重要区别：二维码中保存的并不是歌曲本身，而是经过 EnCodec 编码后的 Token。因此，即使纸张和二维码能够长期保存，用户仍需要对应版本的 EnCodec 解码神经网络才能将这些 Token 重新转换为音频。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/990/400.htm", "publishedAt": "2026-08-16T15:36:02+00:00"}, {"title": "斯坦福调查显示：84% 中国受访者对 AI 感到兴奋，美国比例仅为 38%", "summary": "IT之家 8 月 16 日消息，斯坦福大学发布的《AI Index 2026》报告显示，中国受访者对 AI 的态度明显比美国人积极。数据显示，84% 的中国受访者表示对 AI 产品和服务感到兴奋，美国这一比例为 38%。另一项爱德曼信任度调查则显示，72% 的中国受访者表示信任 AI，美国仅为 32%。斯坦福报告指出，美国与中国在 AI 模型性能上的差距已基本消失，两国模型自 2025 年初以来交替领跑。该报告基于多维度数据分析，涵盖技术进展、经济影响和社会反响。在技术能力方面，2025 年产业界贡献了超过 90% 的知名前沿模型，多款模型在博士级科学问题、多模态推理和数学竞赛等基准测试中达到或超过人类基线水平。在关键编码基准 SWE-bench Verified 上，模型性能在一年内从 60% 提升至接近 100%。组织采用率达 88%，超过八成的大学生已经在使用生成式 AI。在 AI 采用与社会信任方面，生成式 AI 在三年内达到 53% 的人口采用率，速度快于 PC 和互联网。据估算，截至 2026 年初，美国消费者从生成式 AI 工具中获得的年度价值达 1,720 亿美元（IT之家注：现汇率约合 1.16 万亿元人民币），用户人均价值从 2025 年到 2026 年增长两倍。在公众对政府监管 AI 的信任度上，美国以 31% 位居调查国家中最低。在公众与专家认知方面，73% 的 AI 专家预期 AI 对个人工作方式产生积极影响，而公众持此观点者仅 23%。在 AI 对经济和医疗的影响上，同样存在约 50 个百分点的认知差距。彭博社指出，中美数据差异并不意味着中国民众看不到 AI 风险，也不代表美国人更少使用 AI，两国公众的主要差别在于对 AI 收益能否惠及自身，以及对科技企业是否“听政府话”的看法不同。美国公众近年来对 AI 的讨论，很大程度上集中在就业替代、虚假信息以及 AI 可能超越人类能力等问题上。中国同样存在对就业受到 AI 影响的担忧，但中国社会对 AI 的整体接受度仍然较高。美国布鲁金斯学会 2026 年 6 月发布的一项分析认为，中国对 AI 的关注重点更多在于将其融入制造业、教育、医疗和科研等领域，而美国科技行业则更加关注 AGI，即人工通用智能的发展目标。布鲁金斯学会研究员 Kyle Chan 曾用“AI-pilled, but not AGI-pilled”描述这一差异，即中国高度重视 AI，但并没有将实现 AGI 作为唯一核心目标。其观点认为，中国更强调利用 AI 提高生产效率，并将技术应用于经济和社会各个领域。这种差异也与两国过去 20 年的技术发展经历有关。对于许多中国消费者而言，移动支付、电子商务、快递物流、短视频、外卖以及互联网就业等技术应用扩大了商品、服务和信息的获取范围。智能手机的普及也让更多偏远地区居民能够接触线上服务。这种技术发展经历可能影响公众对新技术的判断。当过去的技术被更多人视为改善生活和扩大机会的工具时，新技术带来的不确定性更容易转化为尝试和采用的动力，而不是抵制。与此同时，美国近年来与科技行业相关的社会争议越来越多，包括社交媒体对青少年的影响、网络虚假信息、数据隐私以及科技企业权力集中等问题。这些经历使部分美国公众更加关注 AI 发展过程中企业是否受到有效监管。监管信任度也存在明显差异。斯坦福大学调查显示，美国仅 31% 的受访者认为政府能够有效地监管 AI，是该报告中调查国家和地区中比例最低的之一。相比之下，新加坡为 81%，印度尼西亚为 76%，马来西亚为 73%。爱德曼 2025 年调查同样显示，中国受访者对 AI 的信任度达到 72%，美国为 32%。爱德曼方面认为，AI 能否获得公众信任，将影响企业和个人对技术的采用速度。两国对于科技企业与政府关系的认知也有所不同。美国公众可能更担忧政府无法及时限制大型科技企业，而企业高管、投资者和政府之间存在人员流动及游说活动，也容易进一步加剧这种担忧。另外，中国社会对 AI 的接受并不完全来自对技术前景的乐观，其中也包含竞争压力带来的“害怕掉队”心理。在高度竞争的环境下，人们可能选择主动学习和使用 AI，以避免在技术变化中落后。美国方面则呈现出另一种情况。SurveyMonkey 2026 年第二季度调查显示，38% 的美国人已经每周或每天使用 AI，高于 2025 年第二季度的 30%；70% 的美国成年人表示曾经使用过 AI。不过，美国公众对 AI 的担忧并未因此消失，33% 的受访者表示对 AI 感到担忧。相关阅读：《调查发现美国年轻人普遍不信任 AI，以及主张“拥抱 AI”的科技巨头》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/990/398.htm", "publishedAt": "2026-08-16T15:22:29+00:00"}, {"title": "人形机器人运动会赛前冲刺备战“家政赛”：30 分钟内完成收纳叠衣等多项任务，AI 大模型助力持续学习", "summary": "IT之家 8 月 16 日消息，第二届世界人形机器人运动会将于 8 月 22 日晚在北京国家速滑馆“冰丝带”拉开帷幕。随着赛期临近，各参赛队伍已进入最后的冲刺训练阶段。今天（16 日）开始，部分场景赛已经开启预赛。因此，央视新闻今日就探访了部分队伍的赛前训练情况。本届运动会由北京市人民政府、中央广播电视总台等联合主办，正赛时间为 8 月 22 日至 26 日，共 5 天，将举行 51 个项目共计 1301 场比赛。赛事吸引了来自六大洲 16 个国家的 666 支队伍、共计 2056 台机器人参赛，队伍数量较首届增长 138%，机器人数量翻了两番。在北京国家速滑馆的人形机器人产业生态训练与测评基地，各参赛队伍正围绕家庭、酒店、工业等九大真实场景展开训练。在家政服务场景中，机器人需要完成物品收纳、衣物折叠等多项任务，这对机器人的手眼脑协调、长时间连续工作及多任务自主规划能力提出了极高要求。为教会机器人处理衣服、床单等柔性材料，有赛队为机器人头部和手部配备了高清运动摄像头。数据采集人员与机器人相互配合，将采集到的场景图像、物品参数和动作数据用于大模型训练，以持续迭代优化系统。某机器人公司联合创始人张直政介绍，团队构建了互联网数据、无本体人类数据、跨本体仿真合成数据、远程遥控操作数据以及真实测试环境闭环回流数据等五种不同类型的数据，在模型训练中发挥互补作用。针对机器人关节零部件长期使用后的磨损问题，团队还开发了“终身学习机制”，让机器人在工作中持续调整运动程序，保持长期稳定的任务执行能力。根据比赛要求，机器人需在 30 分钟内完成物品收纳、衣服整理等多项任务。与此同时，来自福建人形机器人创新中心的参赛机器人“福智”也在进行最后的备战。作为福建省唯一一支参赛队伍，“福智”采用轮臂结构，创新性地使用 3D 打印技术实现轻量化设计。该团队选用普通高强度工程塑料，通过结构优化，在确保机身刚性的前提下大幅降低了自重，有效减少了运行能耗，提升了轮式底盘的运动灵活性和续航能力。该机器人搭载自研具身智能大模型，可实现人机协同精细作业与多机编队联动。福建人形机器人创新中心负责人林琦表示，中国台湾地区的伙伴深度参与了运动控制、环境感知等底层算法的打磨，将台湾在精密机电领域的技术优势与大陆丰富的场景数据紧密结合。赛队已在福州地铁站内开展常态化实境测试，为机器人积累运行经验。IT之家注：本届运动会场景赛以全自主方式完成的，最终分数权重系数为 1；以遥控方式完成的，系数仅为 0.5。本届运动会赛项从首届的 26 项增加至 51 项，其中竞技赛 30 项、场景赛 21 项。场景赛从 6 项增加至 21 项，覆盖家庭、酒店、工业等九大真实场景。8 月 16 日，酒店场景赛已率先开赛，参赛机器人需依次完成行李搬运、整理床单等多项“宾客服务”任务。相关阅读：《第二届世界人形机器人运动会新增跳远、举重、拔河等项目，2056 台机器人同台竞技》《机器人也有“运动员村”，第二届世界人形机器人运动会本月开赛》《第二届世界人形机器人运动会 8 月 22 日开赛：百米全自主跑、新增乒乓球 + 自由搏击，票价最低 98 元》《荣耀宣布出战第二届世界人形机器人运动会，自研机器人曾包揽半马前六》《全球 16 国 2056 台机器人将参加第二届世界人形机器人运动会，队伍总量同比增长 138%》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/990/389.htm", "publishedAt": "2026-08-16T13:52:16+00:00"}, {"title": "莫言：AI 只能在前人作品上拼凑，再好也写不出《岳阳楼记》《滕王阁序》", "summary": "IT之家 8 月 16 日消息，昨日下午，中国首位诺贝尔文学奖得主、作家莫言携其暌违六年的新作 —— 超短篇小说集《人呐》在上海展览中心友谊会堂举办的 2026 上海书展亮相。IT之家注意到，这场分享暨签售会是莫言时隔 14 年后再次登上上海书展的舞台，活动热度极高，770 个入场名额在开票后瞬间被秒空。莫言与编剧、作家宋方金进行了同台对谈。莫言带来的新作《人呐》是一部包含 81 篇精悍故事的短篇小说集。他透露，这本书最初曾考虑沿用《一斗阁笔记》这个名字，但身边的年轻朋友认为其“太陈旧、太古老”，建议改成与每个普通人都有关的《人呐》。莫言表示，读者看到这个题目就会觉得写的是自己的事、身边的事、朋友的事。对于他的小说，莫言表示：“我这 81 篇短小说，人物是有性格的，故事是不重复的，情节既合理又奇特；如果改编成短剧，肯定比现在的那些‘爽剧’更有文学性、更能让人思考。”在交流环节，莫言被问及对 AI 写作的看法。他坦言自己对 AI 的使用有一些体会，认为对于需要严格押韵、对仗等高度技术性要求的文体，例如格律诗词或骈体文，人工智能可以完成得很好。但他同时强调，AI 写得再好，也无法创作出《岳阳楼记》《滕王阁序》这样的传世名篇，更无法写出李白、杜甫、屈原等伟大诗人的作品。莫言解释说，AI 的局限性在于其创作本质是对前人作品的“拼凑”与“搅拌”，进而组合成一个所谓的“新”作品。他认为，如果所有的作家和艺术家都停止了创作，AI 的进步也差不多会随之停止。相关阅读：《莫言：人工智能无法取代作家的创作，AI 是靠一代又一代作家写出来的东西“喂”出来的》《莫言谈短视频抄袭现象：网上也应该有它的规矩了》《莫言：给余华的颁奖词想不出来，最后 ChatGPT 帮我写的》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/990/381.htm", "publishedAt": "2026-08-16T13:12:39+00:00"}, {"title": "IPO 前 Anthropic CEO 达里奥 · 阿莫迪罕见发长文回应质疑，预告未来 5-10 年 AI 将治愈多数疾病", "summary": "原标题：Anthropic CEO 辟谣！为亡父转 AI，10 年内灭癌症史上最大规模 IPO 前，Anthropic CEO 罕见长文硬刚质疑！要知道，达里奥 · 阿莫迪（Dario Amodei）几乎从不碰社交媒体。但就在 IPO 估值被推到 2 万亿美元的节骨眼上，他罕见地发了一篇长文，正面回应硅谷对他最大的质疑。对一个以谨慎著称、连产品发布都要反复强调风险的 CEO 来说，这句话的分量，比任何豪言都重。一个几乎从不在社交媒体公开表态的人，选在估值最高、争议最烈的节骨眼突然下场 —— 这本身就是一个信号。风起：硅谷对 Anthropic 最大的质疑整场对话的导火索，是前一天流传的一个说法：有「多个可靠的人」告诉美国科技投资大佬 Gavin Baker：达里奥曾说过，Anthropic 有朝一日可能是某种意义上世界上唯一的私营公司。对这种说法，Anthropic 品牌与传播官 Sasha de Marigny 虽然及时辟谣，但为时已晚。想想看，在这种愿景中，一种 Anthropic 至上主义的愿景中，世界上只有 Anthropic，然后就是各国政府，别无他物。Anthropic 的 Sholto Douglas 立刻斥之为一派胡言：Anthropic 最担心的恰恰是经济权力的过度集中。随后，Gavin 发长文回应：问题是，硅谷很多人真信了。Dario Amodei 已经输了。为了说清楚，正如我在播客上概述的，我认为 Anthropic 有深厚的竞争优势，是一家了不起的公司。讽刺的是，几个月前我看到的 Anthropic 主要风险，正是 Dario 自己的言论和行为。黄仁勋也曾评论过 Dario：第一，他认为 AI 太可怕了，所以只有他们才应该做这件事……第二，AI 太贵了，所以其他任何人都不应该做……第三，AI 强大到令人难以置信，所有人都会失业，这就解释了为什么他们应该是唯一一家构建它的公司。最后，老黄倡议负责任的 AI 应该在开放环境中开发，「不要在暗室里做，然后告诉我它很安全」。7 月，马斯克也委婉地批评了 Dario 的沟通方式：「如果你先吓坏所有人，然后说，我们要发布这个吓人的东西，人们当然会对此警觉。」现在，Dario 强硬回击：这是错误的二分法。他拆解了硅谷最流行的「监管 = 监管俘获 = 权力集中」逻辑。Dario 说，这套公式把复杂问题简单化了。他举了个比方：法院体系看着所有人，但总比暴民审判更能保护弱者。制度让权力归属于规则，而不是某个人。他拿出 Anthropic 支持的加州 SB 53 法案举例：收入低于 5 亿美元的 AI 公司完全不受约束。换句话说，规则只卡最前沿的玩家，小公司反而受益。「我们设计的每一条政策，都让前沿公司承担更多成本，同时有利于规模更小的竞争者。」他认为，如果能够制定正确的「游戏规则」，完全有可能同时做到三件事：1、应对 AI 在网络安全、生物安全以及对齐方面的风险；2、通过制度约束前沿 AI 公司的权力；3、为开放权重模型保留发展空间，同时针对它们特有的风险采取相应措施。他同样支持 Demis Hassabis 提出的、建立一个类似 FINRA（美国金融业监管局）的 AI 监管机构的想法。但真正让人竖起耳朵的，是他话锋一转谈到的野心。Anthropic 正全速加码生物医学 AI。野心：AI 治愈所有疾病他的判断极其激进：未来 5-10 年，AI 将能治愈多数人类疾病。他认为：到目前为止，对包括 Anthropic 在内的 AI 公司最准确、最有力的批评其实是：我们还没有兑现那些关于「用 AI 造福世界」的宏大承诺。唯一的解药不是喊口号，而是「真能治好癌症，公众才会信任 AI。」Anthropic 正在迅速加大在生物学和医学领域的投入，我们希望在未来几年取得令人瞩目的成果，并在未来几个月内看到一些初步的曙光。他预测，5 到 10 年内，AI 将能治愈人类的多数疾病。他给出了一个具体时间表。这证实了《华尔街日报》的报道，即 Anthropic 正在大力押注医疗保健领域，缓解美国百姓对 AI 的日益高涨的负面情绪。2024 年 10 月，他的判断更大胆：强 AI 可以把原本需要 50 到 100 年的生物学进展，压缩进 5 到 10 年。当时，很多人把这当成愿景，听听就算。这一次不一样，他说，未来几个月，就会公开早期研究的曙光。然后他讲了一个私人故事 —— 他的父亲死于丙肝。2006 年，23 岁的 Dario Amodei，在普林斯顿攻读理论物理。在身染慢性疾病丙型肝炎 HCV 多年后，他的父亲 Riccardo 扛不住，最终走了。那时候这病，治愈率就一半对一半。活不活得了，只能听天由命。到了 2010 年，特效口服药出现了，比如索磷布韦。一夜之间，HCV 治愈率从五成暴涨到 95%。跟 Riccardo 差不多处境的人，吞几片药，大多都能痊愈。晚了四年，他爸没等到。人没了，什么都晚了。子欲养而亲不待。Amodei 后来反复提起这件事：有人研究出了这种病的治疗方法，真的把它治好了，也救了很多人的命。但原本还可以救下更多人。从某种意义上说，Amodei 此后的人生，一直都在回应父亲的离世。Amodei 从理论物理转向生物学，希望直接研究人类疾病和生物学问题。但很快他发现生命太复杂，已经超出了单个人类科学家的能力边界。于是他最终把目光投向了 AI。这也是为什么，他给「AI 治病」定的验收标准只有一个：不要喊「AI 将治愈癌症」，把癌症真的治好。在那之前，他不开空头支票。他直言不讳：公众对 AI 的信任，不会来自发布会和基准测试，只会来自一件事 ——AI 真的救了人。这不只是情怀。放在 IPO 前夜，这是一次叙事重构。IPO 前夜，叙事重构这番表态的时机耐人寻味。据《金融时报》报道，Anthropic 最快今年 10 月上市，部分投资者给出的估值已达 2 万亿美元 —— 超越 SpaceX 的 1.77 万亿，将刷新史上最大 IPO 纪录。从 2021 年 Dario 带着妹妹丹妮拉离开 OpenAI 创业，到今天估值反超老东家，只用了五年。支撑这个数字的是一条陡峭到离谱的收入曲线：2025 年 1 月年化营收 10 亿美元，2026 年 5 月突破 470 亿美元。不到 18 个月，47 倍增长。企业级 API 市场份额 32%，首次超越 OpenAI 跃居第一。但 Dario 显然不想让 Anthropic 只被定义为「写代码神器 Claude Code 背后公司」。在 IPO 前夜亲自下场谈监管、谈治愈癌症，他在重新定义 Anthropic 叙事：不只是 OpenAI 的竞争对手，而是一家试图用 AI 解决人类最根本问题的公司。至于市场买不买账，10 月见分晓。参考资料：https://x.com/DarioAmodei/status/2088758816376807762https://x.com/DarioAmodei/status/2088758819304443967https://x.com/GavinSBaker/status/2088611616577253502", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/990/373.htm", "publishedAt": "2026-08-16T12:13:23+00:00"}, {"title": "Anthropic 自曝安全漏洞：生物武器过滤器曾失效近一年，涉及 1.33 亿次对话", "summary": "IT之家 8 月 16 日消息，Anthropic 于当地时间 8 月 14 日发布的最新安全报告显示，该公司用于拦截化学、生物武器相关危险请求的部分安全分类器曾出现长期失效。这直接导致 2025 年 5 月至 2026 年 4 月期间，外部承包商提供人工反馈时产生的大量请求未经过滤。Anthropic 表示，内部调查目前没有发现相关请求被实际用于滥用的证据。根据 Anthropic 公开的安全机制说明，其实时提示词和输出分类器会分析用户输入以及模型生成内容，并在识别到相关风险时阻止模型提供可能用于实施危险行为的信息。据IT之家所知，该机制属于 Anthropic 针对化学、生物、放射性及核武器（CBRN）风险所设置的多层安全措施之一。此次暴露的问题涉及 Anthropic 外部承包商。报告显示，大约 5 万名承包商在相关时间段内产生了约 1.33 亿次与模型的对话，而这些流量在近一年时间里没有经过相关生物安全分类器的拦截。Anthropic 称，这些承包商主要由外部供应商负责审核，其筛查流程存在不足。公司随后展开内部调查，并表示没有发现这些请求被用于实际滥用的证据。因此，Anthropic 已经提高了对外部承包商的相关要求。Anthropic 此前已经将生物安全防护纳入其 AI 安全体系。2025 年 5 月，公司在 Claude Opus 4 发布时启用 AI 安全等级 3（ASL-3）防护措施，其中包括针对化学、生物、放射性及核武器开发或获取风险的部署限制。按照 Anthropic 现行的负责任扩展政策，实时提示词和输出分类器会持续监测模型输入与输出，并根据不断发现的有害模式、越狱方法和混淆技术进行更新。公司还将红队测试、漏洞赏金计划以及离线监测等机制作为补充安全措施。2026 年 7 月，Anthropic 公布 Claude Fable 5 相关安全措施时也再次强调了生物和化学领域的风险。公司表示，Fable 5 的底层能力达到一定水平后，可能为恶意行为者提供额外帮助，因此需要使用分类器限制相关请求。Anthropic 同时承认，过于严格的安全分类器可能误伤正常科研活动。对于 Fable 5，目前涉及生物和化学领域的大量请求会被转交给 Claude Opus 4.8 处理，公司计划随着安全机制改进逐步缩小限制范围。目前，Anthropic 表示已经根据调查结果加强外部承包商的筛查和管理要求。公司公开的负责任扩展政策也显示，其正在持续调整针对化学、生物武器等高风险领域的安全防护标准。相关阅读：《Anthropic 发布 AI 风险报告：旗下智能体会攻击同类并隐藏自身违规痕迹》《Anthropic：第三方评估环境配置失误，导致三起真实网络安全事件》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/990/371.htm", "publishedAt": "2026-08-16T11:37:52+00:00"}, {"title": "海尔周云杰：预计 2035 年我国脑机接口市场规模将突破千亿", "summary": "IT之家 8 月 16 日消息，海尔集团董事局副主席 / 执行副总裁、海医汇理事长谭丽霞今日发文称，海尔盈康一生与天津大学脑机海河实验室达成合作。接下来，双方将围绕脑机接口的临床转化、产业赋能、人才培养等方面展开长期合作。IT之家注意到，海尔集团董事局主席、首席执行官周云杰今日发文称，脑机接口行业正处在从实验室走向产业化的关键爆发期，预计 2035 年我国脑机接口市场规模将突破千亿。周云杰表示，海尔与天津大学脑机海河实验室的合作，就是让实验室里的科技成果真正“长”在产业里，让脑机接口技术从实验室走向病床、服务民生健康。据IT之家此前报道，脑机接口是全球未来产业的重要赛道。今年 7 月 22 日，我国科研团队发布一款新型脑电信号采集装置，在全球范围内首次实现跨地域上千人同步脑电信号采集，使得神经大模型训练与脑机接口通用技术研发迈出关键一步。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/990/335.htm", "publishedAt": "2026-08-16T09:25:01+00:00"}, {"title": "面向多模态推理的高效长上下文建模｜AICon深圳", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/OgbViICigja8tasE0lwi?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-15T10:00:00+00:00"}, {"title": "至知研究院提出大模型可解释性新路线：拆权重，数据成本不到1%", "summary": "理解大模型，无需再训练一个替代网络", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/473876.html", "publishedAt": "2026-08-15T06:42:23+00:00"}, {"title": "根治AI音乐通病！这家国产音乐模型正面挑战SUNO", "summary": "音潮API限时免费开放", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/473866.html", "publishedAt": "2026-08-15T06:36:05+00:00"}, {"title": "DeepSeek 把 Harness 开源了：模型、工具、Agent Loop 全是插件", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/de9AljWc4ejW2KAyW8dD?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-14T14:38:24+00:00"}, {"title": "得物知识问答：复合检索 Agent 的系统设计实践", "summary": "知识问答的核心挑战是准确率和质量。一个回答要准确，需要：查得全（召回率），查得准（精准度），理解得对（多模态），看得对（权限隔离）。这些能力不是堆功能就能实现的，需要一个强大的 Agent 运行时来支撑。", "sourceName": "开源中国", "sourceUrl": "https://my.oschina.net/u/5783135/blog/19738367", "publishedAt": "2026-08-14T07:54:19+00:00"}, {"title": "Visual Studio Code 1.133 发布", "summary": "Visual Studio Code 1.133 版本现已发布。此版本为用户提供了更灵活的 Claude 会话体验，让长篇对话更易于跟进，并能在用户工作时实时刷新本地 HTML 预览。 更改 Claude 会话的模型供应商：在不重新配置 agent h  "2026-08-12T13:20:22+00:00"}, {"title": "Gitee CLI 开源，无需离开终端，即可完成 Gitee 日常工作。", "summary": "但当任务走到「把这个分支提个 PR」「顺手建个仓库」「把这批 issue 归档」时，它们往往就卡住了，网页界面点不动，裸调 REST API 又要记住一堆端点、鉴权和分页规则。 Gitee CLI 正在补上这「最后一公里」：它是一个同时服务于「人」和「AI Agent」的命令行工具；而主仓库内置的 Agent Skills，则把「如何正确、安全地使...", "sourceName": "开源中国", "sourceUrl": "https://gitee.com/oschina/gitee-cli", "publishedAt": "2026-08-12T08:48:39+00:00"}, {"title": "在 Windows 上管理多个 Claude Code / Codex 终端：Termexo 的 PTY、会话恢复与模型切换设计", "summary": "当 Windows 上同时跑着几个 Claude Code、Codex 终端时，“窗口能不能并排” 其实只是第一层问题。更难的是知道哪个 Agent 正在等待输入、哪个需要授权、哪个已经结束，以及怎样可靠地回到原来的原生会话。", "sourceName": "开源中国", "sourceUrl": "https://my.oschina.net/gemron/blog/19737026", "publishedAt": "2026-08-12T07:45:21+00:00"}, {"title": "Grok Bot 正式官宣 —— SpaceXAI 也下场做 AI 同事了", "summary": "马斯克旗下 AI 公司 SpaceXAI 发布了 Grok Bot（目前处于 Early Beta 阶段）——一个专注于“干活”而非聊天的 AI 产品。 和 ChatGPT 或 Claude 的对话框不同，Grok Bot 的设计目标是像一个同事一样接管你的工作流。它可以登录你的 Zendesk 处理客服队列，学习你做周报的流程然后自动执行，多个 Bot 在同一个线程里互相传...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/501897/x-ai-grok-bot", "publishedAt": "2026-08-12T06:21:02+00:00"}, {"title": "Claude 开始给生成内容打水印了，用户最担心的是代码", "summary": "Anthropic 宣布从 2026 年 8 月 2 日起，新发布的 Claude 模型将内置 AI 生成内容标记功能。两种技术：文本嵌入式水印和 C2PA 签名来源元数据。全球全场景覆盖，包括 API、Claude、Claude Code、Claude Cowork 和 Claude Tag。 文本水印是不可见的——它被编织到文本本身中，随复制粘贴一起转移，不影响含义、质量或可读...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/493379", "publishedAt": "2026-08-11T10:45:43+00:00"}, {"title": "MaxKB 开源企业级智能体平台 v2.10.5 LTS 版本发布，修复安全漏洞及相关问题", "summary": "2026 年 8 月 6 日，MaxKB 开源企业级智能体平台发布 v2.10.5 LTS 版本。本次版本更新仍以安全漏洞修复和问题修复为主，持续提升系统安全性，欢迎广大社区用户升级至新版本。", "sourceName": "开源中国", "sourceUrl": "https://my.oschina.net/u/4736111/blog/19735596", "publishedAt": "2026-08-11T07:52:31+00:00"}]}, {"label": "产品发布/更新", "items": [{"title": "Anthropic Claude 出现大规模服务故障，旗下多项服务无法登录 / 无法加载", "summary": "IT之家 8 月 17 日消息，综合外媒 bleepingcomputer，Anthropic Claude 目前出现大规模服务故障，多名用户反馈无法正常登录，Anthropic 旗下多项服务的运行性能也受到影响。根据 Anthropic 通报，此次故障于 2026 年 8 月 17 日 5:58（北京时间）左右开始，目前影响 Claude.ai、Claude Code 和 Claude Cowork 等服务。Anthropic 表示，最初公司表示正在调查部分用户无法通过身份验证登录 Claude.ai、Claude Code 和 Claude Cowork 的问题。之后相应问题演变成了平台大规模服务故障，受影响的用户可能遇到无法登录平台、Claude 页面无法加载、请求无法完成等各类错误。目前，Anthropic 状态页面已将 Claude.ai、Claude Code 和 Claude Cowork 标记为“大规模服务故障（Major Outage）”。相比之下，Claude Console 和 Claude API 目前仍显示运行正常。Anthropic 尚未公布此次故障的具体原因，截至IT之家发稿目前仍在调查相关问题。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/990/404.htm", "publishedAt": "2026-08-16T22:36:24+00:00"}, {"title": "荣耀MagicOS 11 系统支持自动整理通知，使用端侧 AI", "summary": "IT之家 8 月 16 日消息，据微博博主 @睿哥玩数码 今日发文，荣耀MagicOS 11 系统将支持通知自动整理，该功能可使用端侧 AI 自动整理 App 推送通知。据介绍，该功能开启后可将 App 的资讯营销类通知收纳在通知中心的“更多通知”，重要通知则在顶部显示。IT之家了解到，MagicOS 11 系统将首发荣耀琉光架构，并支持全新荣耀蜂鸟架构。内测招募覆盖 Magic8、V6、WIN、GT Pro、Magic 7、600 系列、Magic Pad 3 Pro 等 17 款手机 / 平板。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/990/386.htm", "publishedAt": "2026-08-16T13:32:49+00:00"}, {"title": "大学生用 AI 人脸伪造视频盗刷超 5 万元，最终获刑一年十个月", "summary": "IT之家 8 月 16 日消息，央视新闻今日披露一起 AI 人脸伪造视频盗刷案件，大学生吴某在非法网站购买“AI 人脸伪造视频”技术，在不到四个月的时间里，盗刷银行卡 5 万余元。IT之家从原报道获悉，临近毕业的大学生吴某并没有选择正规渠道就业，而是盯上了网络黑灰产业。他通过第三方非法网站购买一项“能将静态人脸照片转化为可通过某银行支付平台人脸识别验证的 AI 动态视频”的技术。自以为获得了“法宝”的吴某随后立即在各聊天平台发布广告，吸引诈骗团伙“下单”。随后，吴某通过境外聊天软件加入黑灰产业群聊后，在群内发布接单信息，通过上线将获取到的被害人姓名、身份证号码、手机号码、照片、支付平台验证码等信息发送给吴某，之后再通过获取的手机号查看被害人是否在第三方平台进行注册，如有注册，则把获取的被害人照片转换成 AI 动态人脸视频。在该犯罪链条中，诈骗团伙通常冒充短视频平台客服或者游戏主播，以关闭自动扣费、赠送游戏装备为诱饵，诱导受害人下载控制软件，从而获取其个人信息。吴某在接收到这些信息后，再通过第三方网站利用 AI 技术制作被害人的人脸动态视频。视频制作完成后，吴某的团队会将被害人的支付密码重置，然后将被害人的付款码发送给“洗钱车队”，由“洗钱车队”通过扫码的方式将被害人在第三方支付平台所绑定的银行账户资金予以转移。转移成功后，“洗钱车队”将盗取的资金按照一定的比例通过虚拟货币的形式返还给被告人。据法官介绍，吴某所在的犯罪团伙分工极其明确，为了防止上中下游任何一个环节的人员在获取到有利信息后退群独享，他们规定新进入聊天群的人需要缴纳一定数额的虚拟货币作为担保，然后才能在群里接单。在不到四个月的时间内，三名被害人的银行账户先后被盗刷共计 5 万余元。经过审理，湖南省长沙市雨花区人民法院综合考虑吴某具有自首情节，认罪悔罪表现及对被害人的经济赔偿等情况，最终判处吴某有期徒刑一年十个月，并处罚金 3000 元。目前，该案件判决已生效。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/990/369.htm", "publishedAt": "2026-08-16T11:14:31+00:00"}, {"title": "全球首个因反 AI 入狱者呼吁奥尔特曼、达里奥、扎克伯格“重新找回人性”，曾因封锁 OpenAI 总部而获刑 14 天", "summary": "IT之家 8 月 16 日消息，温德 · 考夫曼（Wynd Kaufman）是一名来自美国加州伯克利的退休教师和 AI 反对者。她因参与 2025 年 2 月封锁 OpenAI 旧金山总部入口的抗议活动而被判处 14 天监禁，于当地时间 2026 年 8 月 14 日向警方自首并正式入狱服刑，被认为是首名因反对 AI 而入狱的抗议者。综合多个媒体报道及旧金山检察院公文，她现年 69 岁，是反 AI 组织“StopAI”的成员，旨在抗议对超级人工智能的盲目追求。2025 年 2 月 22 日，她与其他抗议者来到 OpenAI 位于旧金山第三街的办公地点，将铁链缠绕在正门并用锁锁住，随后在大门前静坐抗议。警方赶到后告知抗议者该区域属于私人场所，并允许他们转移至附近公共人行道继续抗议，但 Kaufmyn 等人拒绝离开。今年 6 月，她被判犯有妨碍企业经营、意图妨碍企业经营而非法侵入、非法集会，以及在骚乱情况下拒绝解散等罪名。旧金山地区检察官布鲁克 · 詹金斯表示，陪审团的裁决表明，抗议者不能以危及公共安全作为实现诉求的手段。6 月 22 日，法院对其判处 14 天监禁，并在未来远离 OpenAI 总部至少 20 码（IT之家注：约 18.3 米）。由于加州监禁折抵规则，她在扣除此前已羁押时间后实际入狱时间为 7 天。她于当地时间 8 月 14 日开始服刑。她在庭审中主张“必要性抗辩”，认为自己的行为是为了阻止 OpenAI 继续推进可能造成更大危害的人工智能项目。考夫曼在入狱前接受采访时表示，科技公司 CEO 和 AI 专家“明知危险却仍在推进，这令人无法接受、应该受到谴责”。她称自己并非“殉道者”，入狱是为了“敲响警钟、挑战现有体系”，并让更多人关注她所认为的人工智能风险。她在采访中表示，她认为 OpenAI、Anthropic 和 Meta 等公司的高管以及 AI 专家已经了解相关风险，却仍在推动技术发展。她希望告诉这些大公司的 CEO——“重新找回你们的人性”，并呼吁停止向超级人工智能发展的竞赛。与此同时，美国参议员伯尼 · 桑德斯于 8 月 10 日公开呼吁 Meta、OpenAI 和 Anthropic 暂停人工智能开发，并警告该技术若落入不当之手可能“导致新型生物武器，造成数千万人死亡”。7 月下旬，还有超过 1100 名来自前沿人工智能公司的员工签署公开信，警告 AI 能力发展可能快速超出人类理解和控制相关系统的能力。公开信呼吁美国政府推动国际合作，建立能够控制前沿人工智能发展速度的技术和治理工具。考夫曼的支持者将其称为“AI 风险领域的罗莎 · 帕克斯”，借此类比美国民权运动历史人物罗莎 · 帕克斯在 20 世纪 50 年代拒绝让出公交车座位的行为。但她本人则希望淡化这一称呼，并表示自己只是希望通过此次事件让更多普通人关注 AI 发展可能带来的风险。在此之前，考夫曼还曾因参与尼加拉瓜、核裁军、西撒哈拉和巴勒斯坦等议题的政治行动而短暂入狱。此次服刑结束后，她仍计划继续推动 StopAI 反对 AGI 竞赛的主张。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/990/368.htm", "publishedAt": "2026-08-16T11:05:09+00:00"}, {"title": "王祖贤首度公开回应 AI 形象授权：我们是用 AI 不是被 AI 用，网易《天下》短片《倩影》再现经典角色", "summary": "IT之家 8 月 16 日消息，网易 8 月 15 日于广州举办《天下》18 周年玩家生态大会。会上，息影 22 年的演员王祖贤首次公开回应了此前引发热议的个人 AI 形象授权合作。她表示：“我们是用 AI，不是被 AI 用。”在大会圆桌交流中，王祖贤表示自己年轻时也喜欢玩游戏，“很希望借这个因缘，能跟现在的年轻人在游戏世界里相会，也让现在的年轻人更熟悉我”。她自称“喜新念旧”，认为“新的世界必须要有新的东西，旧世界即将变成新世界的基本根基”。她强调，技术提供了新的表达可能，但“是否尝试、怎样呈现，以及希望借此表达什么，仍然应该来自人的主动决定”。今年 7 月，网易《天下》宣布与王祖贤达成合作。王祖贤将其 20 至 30 岁巅峰时期的肖像使用权独家授权给《天下》IP，依托 AIGC 技术推出 AI 短片《倩影》，重现聂小倩、白素贞、灵狐等经典角色。另外，其 AI 形象还将以数字 NPC、专属时装等形式植入游戏。该短片由网易互娱 DM Monet 画布和火山引擎提供技术支持。IT之家查询公开信息获悉，王祖贤于 2004 年拍完《美丽上海》后宣布息影，至今已有 22 年。《天下》是网易旗下以《山海经》为蓝本的经典 IP，自 2008 年上线以来已积累千万级注册用户。此次合作是国内游戏行业首部获得明星本人完整授权的 AIGC 叙事短片。相关阅读：《王祖贤息影 22 年后授权 AI 形象，网易〈天下〉合作首个 AI 短片〈倩影〉上线》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/990/364.htm", "publishedAt": "2026-08-16T10:31:59+00:00"}, {"title": "全国首家 AI 家庭机器人旗舰店落地青岛，用户可现场试穿外骨骼机器人", "summary": "IT之家 8 月 16 日消息，海尔智家董事长兼总裁李华刚于微博发文称，全国首家 AI 家庭机器人体验店今日落地青岛。据李华刚介绍，海尔 AI 外骨骼机器人体验店已经陆续有 10 几家落地。用户可在青岛的这家体验店里现场试穿外骨骼机器人，做步态检测、一对一精准调试。同时，该店铺位于青岛市崂山区苗岭支路 128 号，用户可在现场沉浸式体验烹饪、家务、清洁、陪伴机器人，一站式体验智慧家的样子。据IT之家了解，海尔曾在今年 5 月推出全球最轻 AI 运动外骨骼机器人 W3。该产品采用全碳纤维 + 钛合金设计，拥有 1.75kg 超轻机身，刷新行业纪录。新品内置多维传感器，可智能适配 12 种日常运动 + 地形场景；配备大扭矩双电机 + 高能量电池，单腿最大助力 16N·m，减负约 5kg，帮助用户体能消耗降低最多 37%。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/990/337.htm", "publishedAt": "2026-08-16T09:50:27+00:00"}, {"title": "WorkSwarm：引领办公智能体新范式，让AI从一个助手，进化为一支与你并肩作战的团队", "summary": "背后是四项关键能力", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/473972.html", "publishedAt": "2026-08-16T05:37:39+00:00"}, {"title": "Cloudflare Computer 发布：让 AI 智能体拥有持久化运行环境", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/RaKIH7E4lA9uQ4Iasltb?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-15T21:52:31+00:00"}, {"title": "VTJ.PRO v2.7.1 发布：推出 Agent 项目级记忆系统，让 AI 真正理解项目上下文", "summary": "摘要： 低代码开发平台 VTJ.PRO 于近日发布 v2.7.1 版本，正式上线 Agent 项目级记忆系统。该系统通过将项目规范、技术决策、避坑规则等结构化记忆跨 Topic 持久化，解决了 AI Agent 在多轮对话中“遗忘”项目约定、需重复说明的痛点，使 Agent 从“问答工具”进化为“持续参与项目演进”的开发协作者。 背景：Agent 的“...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/501943", "publishedAt": "2026-08-15T07:57:37+00:00"}, {"title": "源神启动！一张消费级显卡跑“Opus级”Agent，Qwen3.8-27B多项榜单反超Claude", "summary": "推理能力还能自定义", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/473669.html", "publishedAt": "2026-08-15T06:05:31+00:00"}, {"title": "DeepSeek Harness插件一夜燃爆GitHub：长期记忆、电子宠物、4399小游戏全来了", "summary": "大家已经给DeepSeek装上了啥", "sourceName": "量子位", "so const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
