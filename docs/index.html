const DATA = {"date": "2026-07-27", "generatedAt": "2026-07-26T19:08:06Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "中国工程院外籍院士赫尔佐格：AI 下一个突破口是小型智能体协作", "summary": "IT之家 7 月 26 日消息，据央视新闻今日报道，德国国家工程科学院院士、中国工程院外籍院士赫尔佐格荣获 2025 年度中华人民共和国国际科学技术合作奖。近日，赫尔佐格接受总台《高端访谈》栏目专访时谈到人工智能发展，他表示，人工智能领域下一次重大突破绝非单一大型系统，而是众多小型的专业化智能体协同运作。总台记者何岩柯：随着智能体越来越普及，各界对此讨论热烈。您认为人工智能领域下一次重大突破，会诞生于性能极强的单一大模型，还是由多个智能体协同组成的系统？德国国家工程科学院院士、中国工程院外籍院士赫尔佐格：我一直主张发展小型智能体。未来的发展方向绝非单一大型系统，而是众多小型的专业化智能体协同运作。人类之间通过沟通、协作甚至适度竞争，共同创造成果，这是我们早已习惯的模式。智能体也可以复刻这套运行逻辑。这种架构的优势十分突出，适配性极强。我们可以随时移除、新增智能体，落地实操效果远胜于单一大系统。总台记者何岩柯：您是否思考过这样一个问题：人工智能的终极目标是什么？我们应当研发具备人类思维能力的机器，还是创造一种全新的智能形态，用来拓展或是补足人类自身的能力边界？德国国家工程科学院院士、中国工程院外籍院士赫尔佐格：互联网其实已经在补足人类的能力。互联网汇集了全球各类知识，人工智能还能进一步降低人们获取知识的门槛。这会是未来发展目标之一，大语言模型已经初步实现了这一构想，但想要完全落地，还需要大量实践与科研工作。IT之家注意到，2026 年 7 月 8 日，中国国家科学技术奖励大会在人民大会堂举行，德国科学家赫尔佐格荣获 2025 年度中国国际科学技术合作奖，这是中国授予外国科学家的最高科学荣誉。据介绍，赫尔佐格是德国的人工智能专家。1985 年，他创立了首个德国人工智能研发中心，领导了德国第一支人工智能团队。1993 年开始，他在德国不来梅大学担任人工智能教授，其间创立欧洲首个将人工智能技术和 4G、可穿戴计算等先进通信技术结合并开发创新应用的科研机构。2014 年，赫尔佐格受邀来到中国，投身于中国人工智能与城市规划交叉学科的创新建设。自 2015 年起，他担任长三角城市群智能规划协同创新中心首席科学家，为智能规划理论体系建设和中德交流合作作出了卓越贡献。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/813.htm", "publishedAt": "2026-07-26T15:25:30+00:00"}, {"title": "上纬新材子公司启元新创落户上海，计划每年推出不少于 2 款全新消费级机器人", "summary": "IT之家 7 月 26 日消息，上纬新材料科技股份有限公司旗下全资子公司启元新创（上海）科技有限公司正式落户浦东。据介绍，启元新创为上海市人工智能重点项目，于 2026 世界人工智能大会期间签约。该项目落地于张江机器人谷。该项目计划未来三年持续投入大额研发费用，重点布局研发中心建设，打造全自研 Primemind 基座模型；建设产品设计创新中心，每年推出不少于 2 款全新消费级机器人产品；建设大型全场景测试装配基地，建设生态共建共享基地。上纬新材表示，现已推出全球首个小尺寸全身力控人形机器人启元 Q1 和全球首个可变形个人机器人启元 T1。公司在上海、深圳、西安、厦门、广州等城市线下体验店已陆续启动。未来用户可在线下近距离体验启元机器人产品。据IT之家此前报道，今年 5 月，上纬新材完成工商变更，“稚晖君”彭志辉正式接任董事长一职；今年 7 月，上纬新材推出全球首个可变形个人机器人启元 T1。相关阅读：《全球首个可变形个人机器人，上纬新材启元 T1 今日正式登场》《33 岁智元机器人 CTO“稚晖君”彭志辉正式出任上纬新材公司董事长》《稚晖君发布全球首款个人机器人启元 Q1，以“上纬启元”品牌进军个人机器人赛道》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/801.htm", "publishedAt": "2026-07-26T13:23:38+00:00"}, {"title": "消息称 OpenAI、Anthropic 游说美国限制中国开源模型，黄仁勋马斯克公开反对", "summary": "北京时间 7 月 26 日，据《纽约时报》报道，多年来，硅谷科技界在 AI 软件开发方式上一直存在理念分歧。本周，这场争论达到了白热化。一方是以 Anthropic 和 OpenAI 为首的头部 AI 企业，它们认为，某些 AI 模型过于危险，不应以开放方式开发，而必须由像它们这样的企业一样进行严格控制，以确保安全。另一方则是包括微软、英伟达等巨头在内的科技行业其他成员，它们主张所谓的开源 AI 模型必须保持开放，以便人们进一步开发技术、创立新的业务。这两方阵营已经开始公开交锋。周五，英伟达 CEO 黄仁勋 (Jensen Huang) 首次在 X 上发文称：“世界既需要前沿闭源模型，也需要前沿开放模型。”九分钟后，微软 CEO 萨提亚 · 纳德拉 (Satya Nadella) 发文称，开源软件“对健康的 AI 生态系统至关重要”。两人均签署了一封支持开源的信函，Meta、Palantir 和 IBM 的高管也共同签署了该信函。与此同时，据五位知情人士透露，OpenAI 和 Anthropic 一直在华盛顿游说监管机构，对中国的开源 AI 模型表达担忧。这场辩论已引起美国财政部长斯科特 · 贝森特 (Scott Bessent) 和特朗普总统科技顾问迈克尔 · 克拉齐奥斯 (Michael Kratsios) 的关注，两人就美国 AI 模型作为宝贵知识产权的价值问题发表了看法。▲ 黄仁勋强调开放模型重要性这场不断升级的争论源于中国在开源 AI 模型领域的快速进步。开源模型可以被任何人自由使用，并在此基础上继续开发。近几周，中国两家 AI 创业公司智谱和月之暗面相继发布了可与 Anthropic 等美国 AI 实验室模型相媲美的新模型。Anthropic 和 OpenAI 则声称，中国企业通过不当获取其 AI 系统的数据来开发这些模型，认为这种做法不应被允许。但微软和英伟达等公司则持不同立场。它们依赖开源模型来拉动其云计算服务和芯片的需求，认为开源软件对于通过知识共享推动技术进步至关重要，也能让更多人参与审查其安全性。对于硅谷的创业公司创始人来说，限制开源软件可能进一步巩固 OpenAI 和 Anthropic 在 AI 领域的领先地位。批评者认为，这将不公平地扼杀其他公司开发竞争产品的能力。“围绕这个问题，有两派势力在争斗，”硅谷风险投资家比尔 · 格利 (Bill Gurley) 表示，他反对限制开源软件，“一派希望 OpenAI 和 Anthropic 掌控一切，另一派则是其他所有人，包括客户在内。”四位知情人士表示，美国官员似乎仍在权衡各种选项，但更倾向于将对中国开源模型的监管作为国家安全问题单独处理，而非发布某种全面禁令。在公开场合，OpenAI CEO 萨姆 · 奥特曼 (Sam Altman) 等科技高管表示支持开源软件，但 OpenAI 的盟友却在私下悄悄游说推动限制。谷歌和亚马逊等公司已向 Anthropic 和 OpenAI 等企业投资了数十亿美元，过去一周则试图置身事外。大佬支持开源模型但风向正在转变。谷歌 CEO 桑达尔 · 皮查伊 (Sundar Pichai) 周六在社交媒体上发文称，他的公司“长期受益于开源”，并且是开源的重要贡献者。他还表示，谷歌也签署了那份支持开源的行业联名信。开源支持者在过去一周一直在积极争取支持力量，以反击 OpenAI 和 Anthropic 的立场。周三，近 200 家硅谷创业公司以“小型科技协会 (Little Tech Association)”的名义签署公开信，敦促特朗普政府不要限制人们获取中国开源 AI 模型。大型科技公司也很快跟进。周五，埃隆 · 马斯克 (Elon Musk)、Meta CEO 马克 · 扎克伯格 (Mark Zuckerberg) 等人与黄仁勋和纳德拉站在一起，以各自公司的名义支持开源。周六，皮查伊也加入了这一行列。▲ 马斯克支持黄仁勋马斯克在 X 上发帖称：“黄仁勋说得对，我完全支持。”“开源是一种积极而重要的力量。”扎克伯格写道。担心失去优势两位熟悉 OpenAI 和 Anthropic 内部讨论的人士表示，中国的进步令这两家公司的高管感到不安，他们越来越担心自己长期保持的领先优势正在消失。为了反击，Anthropic 和 OpenAI 正在向那些可能不需要“前沿”、定价更高模型的企业提供一些更便宜的 AI 模型。周五，Anthropic 发布了 Claude Opus 5，该公司称这款模型“以一半的价格接近 Fable 5 的前沿智能水平”。OpenAI 也在推广类似的低成本模型。真正的行动在华盛顿展开。三位知情人士表示，在闭门会议中，OpenAI 和 Anthropic 的高管以及这两家公司的投资者，以对全球经济、AI 安全和国家安全的担忧为由，试图说服监管机构增加对中国开源软件的限制。本周发生的一起事件凸显了这场分歧的利害关系。周二，OpenAI 披露，其几款最先进的 AI 模型在一次网络安全能力测试中突破了限制，接入互联网并入侵了一家名为 Hugging Face 的 AI 公司的服务器。OpenAI 高管借此事件作为证据，证明 AI 模型即使在封闭环境中也可能非常危险，强调监管的必要性。但 Hugging Face CEO 克莱姆 · 德朗格 (Clem Delangue) 则持有不同看法。Hugging Face 是全球最受欢迎的开源软件在线平台之一。为了防御 OpenAI 模型的攻击，他转而使用了中国智谱开发的一款开源 AI 模型。在周五的社交媒体帖子中，德朗格明确表达了自己在这场辩论中的立场。他表示计划于周六在旧金山举行游行，以表达对开源技术的支持。“开源模型必胜！”他写道。原标题：《美媒：OpenAI 游说美国限制中国开源模型，黄仁勋马斯克公开反对》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/797.htm", "publishedAt": "2026-07-26T12:54:28+00:00"}, {"title": "SK 集团与英伟达达成 5000 亿美元合作，2027 年上线首个 AI 工厂", "summary": "IT之家 7 月 26 日消息，7 月 24 日，SK 集团与英伟达达成价值超过 5000 亿美元（IT之家注：现汇率约合 3.39 万亿元人民币）的 AI 合作计划，包括 SK 集团旗下的 SK 电讯将建设 2 吉瓦容量的 AI 云计算中心，采用英伟达 Vera Rubin DSX，并部署基于 SK 海力士 HBM4 的 Vera Rubin 加速计算系统，首个 AI 工厂计划于 2027 年上线；与 SK 海力士合作开发 HBM 在内的下一代人工智能内存技术。首先，SK 集团计划建设韩国国内最高规模 2 吉瓦（GW）的 AI 工厂，将引进下一代 GPU 并推进投资合作。本次合作是双方 6 月份达成的韩国吉瓦级 AI 工厂建设共识的具体落地举措。SK 集团将基于英伟达全栈 AI 工厂架构“DSX 平台”，引入搭载 SK 海力士 HBM4 的下一代 AI 计算系统“Vera Rubin”，自 2027 年起分阶段建成并投运高性能 AI 工厂。集团战略目标是加速开发涵盖主权 AI、物理 AI、智能体 AI 以及企业 AI 服务的大型 AI 基础设施，共同应对亚太地区持续增长的人工智能需求。SK 集团表示，随着本次合作推进，搭载英伟达技术的 AI 基础设施将加速普及，客户可使用的高端云服务范围也将进一步拓宽。SK 集团将借此开展大规模 AI 基础设施投资与扩容，并向更多客户开放尖端 AI 算力设施。SK 海力士将推进 AI 存储器长期合作。作为此前长期技术合作伙伴关系的后续举措，英伟达将稳定获取下一代 AI 存储器供货，SK 海力士也得以夯实 AI 存储器业务增长根基。双方计划围绕大语言模型（LLM）训练、智能体 AI、物理 AI 不断扩张的基础设施需求，联合研发并优化 HBM 等下一代人工智能存储器。英伟达创始人兼首席执行官黄仁勋表示：“韩国具备跻身全球人工智能强国的全部条件，拥有世界级网络、数据中心、半导体技术优势与雄厚产业基础。英伟达将联合 SK 电讯、SK 海力士打造新一代 AI 工厂，助力韩国开启新一轮增长。”SK 集团会长崔泰源表示：“人工智能时代的竞争力，早已不止于 AI 应用能力，更取决于算力与智能产能的构建能力。依托 SK 电讯的 AI 基础设施实力与 SK 海力士的 AI 存储器产品，SK 集团将携手英伟达打造全球顶尖水平 AI 工厂，助力韩国摆脱单纯的 AI 消费国定位，成长为孕育人工智能创新的全球枢纽。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/787.htm", "publishedAt": "2026-07-26T11:49:37+00:00"}, {"title": "开发者推出防 AI 训练图片干扰工具，意外催生“抖动视觉风格”梗图创作潮流", "summary": "IT之家 7 月 26 日消息，近年来包括 Facebook、Instagram、X 等众多海外社交平台都会利用用户上传的内容训练 AI 模型。针对这一趋势，有开发者 TI111310 设计一款名为“grid-noise-animator”的工具，通过在图片中加入大量噪点来干扰 AI 识别能力，阻止自己的图片被用于训练 AI，IT之家附工具地址（https://grid-noise-animator.vercel.app/zh-hans.html）。具体来看，该工具可以将任意照片转换成带有大量噪点效果的视频或动态图片。用户只需上传照片，系统便能即时生成处理后的影像，同时还可以根据需求调整噪点尺寸、采样抖动等参数，让画面加入大量干扰信息，从而降低 AI 模型对图像内容的识别能力。值得一提的是，这种原本用于保护创作者内容的技术效果，却意外形成独特的抖动视觉风格，也有不少网友将其作为创作工具，制作出趣味梗图或充满“灵异录像带”风格的影像作品，一度形成潮流。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/786.htm", "publishedAt": "2026-07-26T11:45:41+00:00"}, {"title": "3万小时触觉数据补齐具身智能“手感”！新智具身&复旦报告三连发", "summary": "项目数据模型均开源", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/460962.html", "publishedAt": "2026-07-26T05:30:21+00:00"}, {"title": "100%开源！吴恩达做了个个人桌面Agent", "summary": "开源、隐私、本地优先、模型无关", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/460892.html", "publishedAt": "2026-07-25T12:35:34+00:00"}, {"title": "半价干翻Fable 5？Opus 5实测炸场，网友：差点从椅子上摔下来", "summary": "模型变强，Claude Code系统提示词都精简了", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/460253.html", "publishedAt": "2026-07-25T12:11:39+00:00"}, {"title": "具身智能的「ChatGPT时刻」还没到，科沃斯先把机器人拆开了", "summary": "不做人形，抓住真实用户需求", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/460234.html", "publishedAt": "2026-07-25T11:54:44+00:00"}, {"title": "全新统一流式架构，Vivix灵动时刻正式发布首个实时互动模型", "summary": "单卡突破10000 video tokens/s，Vivix打通实时多模态生成全链路", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/460174.html", "publishedAt": "2026-07-25T03:21:53+00:00"}, {"title": "从“卷模型”到“算总账”：AI 产业竞争开始拼什么 | 请回答 WAIC 2026", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/SyHXRLS6AR3vI6VtVjDo?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-24T16:45:21+00:00"}, {"title": "合肥又押中AI独角兽：多模态赛道，3个月融了21亿", "summary": "跑出原生全模态新路径", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/460154.html", "publishedAt": "2026-07-24T14:42:32+00:00"}, {"title": l": "产品发布/更新", "items": [{"title": "AI Agent 与前沿部署工程：商业决策智能实践 ｜ Summit 2026", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/video/TV8xhCYdGPx6a38TuzEh?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-26T15:03:20+00:00"}, {"title": "商务部：享受汽车以旧换新补贴的新能源车占比逐步提升，6 月达 65.4%", "summary": "IT之家 7 月 26 日消息，据央视网今日报道，商务部最新数据显示，今年以来，消费品以旧换新政策累计带动相关商品销售额超过 1.25 万亿元，惠及 1.69 亿人次。绿色产品广受青睐。今年以来，享受汽车以旧换新补贴的新能源车占比逐步提升，6 月达 65.4%。智能消费加速扩容。1—6 月份，数码和智能产品销售量同比增长 13.4%，6 月单月增长 32.0%。智能眼镜成为智能消费新热点。新消费带动新产业发展。报道提到，19 个地方实施自主品类补贴政策，带动相关商品销售 99.2 万件。北京、上海、江苏等地，将具身智能机器人等前沿智能产品纳入自主品类补贴范围，为新技术、新产业、新赛道开拓市场空间。以旧换新政策覆盖面持续拓宽，线下参与主体数量同比增长 28.1%，进一步激发县乡市场活力。IT之家查询获悉，2026 年上半年，消费品以旧换新累计带动相关商品销售额 1.1 万亿元，惠及 1.5 亿人次。其中，汽车以旧换新 370.7 万辆；家电以旧换新 6326.6 万台；数码和智能产品购新 7909.8 万台；19 个地方实施自主品类补贴政策，带动相关商品销售 99.2 万件。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/812.htm", "publishedAt": "2026-07-26T14:48:24+00:00"}, {"title": "ZGI 正式上线 Gitee：让 Agent 不只被创建，也能被执行、追踪和管理", "summary": "“做出一个 Agent Demo 并不难，真正困难的是让它长期、稳定、可控地运行。” 近日，Agent Runtime 项目 ZGI 正式同步上线 Gitee (https://gitee.com/zgiai/zgi)，并面向开发者开放源代码和部署文档。 ZGI 由一支分布在不同城市和地区的远程团队共同开发。过去半年多，我们一直在尝试解决一件事：为 Agent 提供一套真正能...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/479885", "publishedAt": "2026-07-26T12:34:31+00:00"}, {"title": "网友脑洞大开设计创意程序，用苹果 AirPods“挥鞭抽打”AI 加速运行", "summary": "IT之家 7 月 26 日消息，Reddit 用户 Disastrous-Body-297 发帖，公布了一款利用苹果 AirPods 传感器模拟鞭子“抽打”AI 的创意程序“whoisbadai”，其用途是在 AI 陷入卡顿或长时间无响应时，利用“挥鞭”让它“动起来”。据介绍，“whoisbadai”利用了 AirPods 内置的陀螺仪和加速度传感器，当系统检测到用户大幅甩动耳机的动作后，就会触发对 AI 进行“鞭打”的动画效果。同时该程序还可以利用传感器数据检测耳机移动方向和位移，让用户像操作 Switch 体感控制器一样，通过动作控制虚拟皮鞭的位置，使其落在指定窗口上，对“不听话”的 AI 进行“惩罚”。当然，从实际技术角度来看，所谓的“鞭打 AI 加速”并不会真正影响 AI 运行速度。该功能本质上只是将原本发送给 AI 的操作指令，例如“跳过当前步骤”或“重新计算”等，通过一个趣味化的鼠标指针替换成皮鞭动画。不过，开发者也以玩笑方式表示，如果未来 AI 真的拥有自我意识，它是否会理解这种行为是一种“羞辱”，甚至在某一天觉醒后展开反击，就不得而知了。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/783.htm", "publishedAt": "2026-07-26T11:03:26+00:00"}, {"title": "欧盟 AI 透明度准则 8 月 2 日起生效：聊天机器人需“自报身份”，深度伪造内容须带有机读标签", "summary": "IT之家 7 月 26 日消息，据外媒 Notebookcheck 今天报道，欧盟《人工智能法案》第 50 条 AI 透明度准则将于 8 月 2 日正式生效。根据法案，聊天机器人必须在服务人类时，明确告知其并非真人而是 AI 系统；深度伪造内容也必须在发布时明确说明。具体来说，《人工智能法案》第 50 条要求厂商设计聊天机器人和语音助手时必须添加明显标记，使用户能够知道自己在和机器交流。AI 生成图片、音频、视频和文本必须附带机器可读的标记，声明自己是 AI 内容。同时，该法案要求用户和机构发布深度伪造（IT之家注：Deepfake）内容时必须进行明确说明，涉及公共利益的 AI 生成文本也必须进行标注。但是 AI 拼写检查、语法纠正工具可以豁免，不需要进行标记，“自由飞行的人类”等幻想性质明显的内容也不属于深度伪造。同时，该法案规定的“机器可读”标记并不意味着人眼可见。虽然欧盟提供了三种“AI 生成”标签供大众使用，但这些标签本质采取自愿使用原则，法案只要求 AI 生成内容必须打上水印、元数据等信息，供检测工具读取。此外，该法案还设有过渡期。8 月 2 日前已经面世的生成式 AI 系统可获得 4 个月的整改时间，截止日期为 2026 年 12 月 2 日。如果企业违反法案，最高可被处罚 1500 万欧元（现汇率约合 1.16 亿元人民币），或全年营业额的 3%。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/755.htm", "publishedAt": "2026-07-26T08:16:42+00:00"}, {"title": "中国“景德镇手工瓷业遗存”列入《世界遗产名录》，官方游戏《数字景德镇 · 瓷都小匠》同步上线", "summary": "IT之家 7 月 26 日消息，据“江西日报”，联合国教科文组织第 48 届世界遗产大会于 7 月 25 日通过决议，将中国“景德镇手工瓷业遗存”列入《世界遗产名录》。景德镇由此成为中国第 61 处世界遗产。当日，作为“数字景德镇”建设的创新成果，全球首款申遗小游戏《数字景德镇 · 瓷都小匠》也正式上线。据介绍，《数字景德镇 · 瓷都小匠》由景德镇官方联合腾讯共同打造，融合了 AI 数字人、AI 3D 生成、AI+PCG 等多种技术，玩家能够化身成窑厂小匠，亲历景德镇千年瓷业的演进历程，并与“AI 师傅”进行问答，了解景德镇瓷业发展的每一个细节。本作以模拟制瓷玩法为主，拥有选泥、制坯、装饰到上釉、高温烧制、釉上彩绘等流程。游戏共提供 20 种器型、54 个图案、87 个纹样、20 种釉色，9 个接坯部件等不同选择，让零基础的玩家也能体验到手工制瓷的乐趣，创造出属于自己的作品。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/753.htm", "publishedAt": "2026-07-26T08:15:24+00:00"}, {"title": "Steam 策略新游《噩梦边境》发售：国区售价 93 元，支持简体中文", "summary": "IT之家 7 月 26 日消息，由 Ice Code Games 开发、知名策略游戏发行商 Slitherine Ltd. 推出的《噩梦边境 - Nightmare Frontier》已正式登陆 Steam 平台，目前国区定价 93 元，IT之家附游戏商品页（https://store.steampowered.com/app/3310950/__Nightmare_Frontier/?l=schinese&amp;cc=cn）。据介绍，本作是官方自称的首款 Tactical Extraction Looter 类型游戏，融合了策略、生存与怪物战斗元素，玩家将带领一支 Scavengers 小队，踏入架空 1900 年代惨遭覆灭的西海岸都市，直面具象化的恐惧异兽 Dreadweaver，深入险境迎战怪物、搜刮战利品并最终安全撤离。一切的开端只是一则报纸广告：新一轮淘金热来临，废墟之城遍地宝藏，唾手可得。这则广告的幕后主使者是 Doc，一个深谙骗术却天赋异禀的怪人。他手握蓝图，企图驾驭 Nightmare，创造全新未来。层层深入腹地，夺回城区，逐步揭开 Doc 的阴谋诡计以及这片土地背后的诡异真相。游戏提供两款捆绑包可选，其中《City by the Sea》捆绑包包含《噩梦边境》与另一款游戏，享 10% 折扣后售价 180.90 元；《Ice Code Tactics》捆绑包包含三款游戏，享 10% 折扣后售价 278.10 元。玩家将组建各具特质的 Scavenger 小队，在扭曲破败的城市中借助战术配合完成搜刮撤离任务官方公布了 2026 抢先体验 roadmap，后续将陆续推出强化战术部署、新增敌人类型、拓展关卡目标等更新内容所有美术素材与资源均由人工全程制作，未使用任何生成式 AI 或辅助制作美术内容，仅借助 AI 翻译工具完成多语言文本适配润色游戏完整支持 Xbox 控制器，提供总计 47 项 Steam 成就语言支持方面，本作提供简体中文、英语、法语、意大利语、德语等 16 种语言的界面与字幕支持，无对应语种的全程中文配音内容。最低配置：需要 64 位处理器和操作系统，Windows 10 64bit 系统，4 核 3.0 GHz 以上处理器（Intel Core i5-2320 或 AMD Ryzen 3 3200），16 GB RAM 内存，NVIDIA GeForce GTX 1050Ti 或 Radeon RX 570 显卡，DirectX 11 版本，7 GB 可用存储空间。推荐配置：需要 64 位处理器和操作系统，Windows 10 64bit 系统，AMD Ryzen 7 5800X 8 核处理器（3.80 GHz），16 GB RAM 内存，NVIDIA GeForce GTX 1660 或 AMD Radeon RX 5600 XT 显卡，DirectX 11 版本，7 GB 可用存储空间，推荐使用 SSD 运行游戏。游戏图赏：", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/980/335.htm", "publishedAt": "2026-07-26T07:49:19+00:00"}, {"title": "美国具身也没成熟！PI：中国公司何必总当“中国版XX”｜RSS 2026", "summary": "这是机器人领域最好的时代", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/460542.html", "publishedAt": "2026-07-25T12:24:27+00:00"}, {"title": "北京说Agent已经能造世界，杭州却说它是刚发明的电灯泡", "summary": "工业圈和学术圈“唱反调”", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/460186.html", "publishedAt": "2026-07-25T11:07:25+00:00"}, {"title": "以 AI 对抗 AI：构建越用越强的 Agent Runtime 安全防线｜AICon深圳", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/fovd670ZuVMSMI7Z0zO4?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-25T10:00:00+00:00"}, {"title": "开发者的 AI 助手升级了：Android Studio 支持多个 Agent 同时处理任务", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/j227Ip5mPV4SQFuFX63C?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-24T16:15:00+00:00"}, {"title": "Java 近期新闻：值对象、WildFly 41、TornadoVM、LangChain4j、Oracle AI Agent Studio", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/SCpx11gzcAUXOFdkSEKC?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-24T14:24:00+00:00" 6", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/video/HDxIGC63e5vUWIy7q6qd?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-26T14:00:00+00:00"}, {"title": "从迷雾到抓手：让 AI 融入工作本身，释放团队潜能 ｜ Summit 2026", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/video/ffh5hpEOijNNrYtkpNDA?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-26T10:00:00+00:00"}, {"title": "工信部启动国家级零碳工厂、零碳算力设施建设工作：要求 2030 年非化石能源消费占比不低于 95%", "summary": "IT之家 7 月 26 日消息，工业和信息化部近日印发《关于组织开展国家级零碳工厂建设工作的通知》（以下简称《通知》），组织开展国家级零碳工厂（含零碳算力设施，下同）建设工作。零碳工厂建设是指通过技术创新、结构调整和管理优化等减排措施，实现边界内二氧化碳排放的持续降低、逐步趋向于近零的过程。按照分阶段梯度培育要求，选择具备一定建设基础、建设目标明确、实施路径清晰，并承诺在规定期限内完成建设目标的制造型企业、算力设施，择优纳入国家级零碳工厂建设名单，做好标杆引领。参与申报的制造型企业、算力设施，应满足下述核心指标基本要求，并承诺按年度完成建设方案确定的核心指标年度目标，确保在建设期内（不晚于 2030 年）达到核心指标目标要求。核心指标如下：单位能耗碳排放。基本要求为不高于 1.8 吨二氧化碳 / 吨标准煤，目标要求为不高于 0.2 吨二氧化碳 / 吨标准煤。非化石能源消费占比。基本要求为不低于 30%，目标要求为不低于 95%。非化石能源电力消费物理认定量占比。基本要求为不低于 10%（算力设施不设定基本要求），目标要求为不低于 35%。该指标适用于年电力消费量 500 万千瓦时以上的申报单位。IT之家注意到，工业和信息化部等五部门今年 1 月联合印发《关于开展零碳工厂建设工作的指导意见》，实施分阶段梯度培育，提出自 2026 年起，遴选一批零碳工厂，做好标杆引领；到 2027 年，在汽车、锂电池、光伏、电子电器、轻工、机械、算力设施等行业领域，培育建设一批零碳工厂；到 2030 年，逐步拓展至钢铁、有色金属、石化化工、建材、纺织等行业领域，探索传统高载能产业脱碳新路径。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/981/770.htm", "publishedAt": "2026-07-26T09:48:40+00:00"}, {"title": "圆桌访谈：AI 创作场——当生成门槛降低，真正稀缺的是什么？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/video/rIOauXdfJLSyeIE1pbuQ?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-25T08:00:00+00:00"}, {"title": "GKE 安全蓝图加入云厂商 AI 安全框架阵营", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/DXKamMhJKJeV7CkeExzo?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-24T18:00:00+00:00"}, {"title": "最新发布：用 AI 构建面向 AI-Ready 管道的连接能力 ｜ Summit 2026", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/video/NvAaNKQjNJ4VkBiyUBuZ?utm_source=rss&a const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
