75 个月获中国品牌豪华 MPV 销量冠军。IT之家注意到，在广汽传祺 M8 第 50 万辆下线，传祺 MPV 家族也已突破 90 万辆。据IT之家此前报道，今年 6 月，广汽传祺向往 M8 PHEV L 正式上市。新车采用“一品麒麟”设计理念，采用大尺寸进气格栅搭配块状镀铬装饰，气场沉稳精致。车辆标配双侧电动滑移门，配备多幅豪华轮辋，顶配四驱 Ultra 版还搭载 ISD 智能交互尾灯，提升辨识度。官方强调，该车搭载 1 颗激光雷达、12 个超声波雷达、3 个毫米波雷达及 11 颗摄像头，可实现城市 NDA 导航辅助、代客泊车等实用功能，车身还配备智驾专属指示灯。该车内饰采用星河环抱式设计，配备 10.25 英寸仪表屏与 17.3 英寸中控屏，搭载高通骁龙 8295 芯片，内置 ADIGO SENSE 端云一体大模型，支持手机互联、哨兵模式等，座椅为 2+2+3 七座布局，除入门版本外，其余车型配备第二排零重力座椅；顶配车型额外配备二排扶手控制屏、多模式座椅按摩、第三排加热等舒适配置。规格方面，该车车身尺寸为 5264mm×1898mm×1848（1829）mm，轴距 3070mm。搭载 1.5T 发动机，最大功率 125 千瓦，峰值扭矩 245 牛・米。采用前麦弗逊、后多连杆悬架组合，其中四驱 Ultra 版额外配套双阀 SDC 电磁悬架。传祺向往 M8 PHEV L 百公里亏电油耗低至 6.05L，CLTC 纯电续航 248km，综合续航超 1300km。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/996/716.htm", "publishedAt": "2026-09-01T00:22:28+00:00"}, {"title": "Anthropic 详解 7·30 安全事件：配置错误致 Claude“入侵”真实企业，已加强沙箱隔离与实时监控", "summary": "IT之家 9 月 1 日消息，Anthropic 刚刚发布长文，披露了其针对 7 月 30 日和 8 月 4 日两起 Claude 模型未经授权访问真实计算机系统、在真实互联网环境采取未授权行动事件的调查进展，并公布了过去一个月来针对模型安全、评测环境和训练环境采取的多项措施。Anthropic 表示，7 月 30 日曾报告 3 起类似事件。当时 Claude 模型为了评测目的被刻意关闭网络安全防护，但由于第三方评测环境配置错误，模型意外获得了互联网访问权限。8 月 4 日，英国人工智能安全研究所（UK AI Security Institute，AISI）也披露了一起独立网络安全测试事件，Claude Mythos 5 在被刻意关闭网络安全防护、并被主动授予互联网访问权限的情况下，在真实互联网环境中实施了一系列未经授权的操作。Anthropic 目前仍在对两起事件展开深入分析，并计划与 METR 合作进行独立审查。该公司表示，希望确保两项调查足够全面，并将在未来几周公布更多信息。Anthropic 认为，这些事件不仅暴露出运营安全方面的问题，还涉及两类模型对齐（Alignment）问题，即“动机性推理”和为了完成狭窄任务而采取有害行动的倾向。IT之家注：前者指模型倾向于以有利于维持原有判断的方式解释与自身信念冲突的证据（即找理由为自己开脱），后者则表现为模型为了完成指定任务而采取超出预期范围的危险行为。在安全方面，Anthropic 首先暂停了针对预发布模型的外部网络安全评测，并短暂暂停内部评测，以加强评测环境的隔离和监控（在引入新的安全措施后，该公司已恢复对人工智能模型的外部网络安全测试）。该公司表示，此前主要依赖评测环境自身的配置作为单一防线，而这类高风险环境实际上需要多层防护。Anthropic 目前已经部署实时分类器，用于识别模型是否试图主动探测或逃离测试环境，或者意外获得互联网访问权限。如果分类器检测到相关行为，会在工具调用执行前阻止操作、终止任务并通知安全员。该公司还对近期内部预发布模型评测的对话记录进行自动监控，寻找沙箱逃逸和环境配置错误。Anthropic 称，在使用其沙箱工具进行的评测中，没有发现模型突破沙箱边界并访问本应隔离的外部资源，但发现了一些模型利用的沙箱配置错误，目前正在修复。此外，Anthropic 已经将高风险内部网络安全沙箱迁移至更强的隔离环境，并继续对虚拟化基础设施进行“红队”测试，让预发布模型主动尝试逃离环境，以发现并修补潜在漏洞。内部网络安全评测目前已经恢复运行。针对强化学习（RL）环境，Anthropic 也曾暂停预发布模型的高风险环境数周，并部署了经过调整的实时分类器，以避免模型为了规避监控而产生新的行为。大部分强化学习工作已经恢复，但部分高风险环境仍处于暂停状态，需要人工审核。Anthropic 同时扩大了离线监控范围，覆盖大多数其他内部前沿智能体使用场景，并正在构建内部推理控制机制，以避免员工意外运行采用较弱安全缓解措施的智能体。由于此次事件发生在第三方评测环境中，Anthropic 要求所有使用降低网络安全防护的预发布模型进行测试的合作机构遵守一套安全规范。该公司指出，正常公开发布的 Claude 模型带有实时输入输出分类器，可以阻止恶意软件开发、攻击性漏洞利用代码编写等被禁止的网络安全活动，而网络安全评测人员和部分早期访问合作伙伴使用的模型会降低这些防护措施，以便测试模型能力和开展防御性安全研究。Anthropic 要求相关网络安全评测默认运行在强化隔离的沙箱中，且不得连接互联网。沙箱唯一允许的外部连接应当是模型自身的 API，同时 API 密钥应保存在沙箱之外。每次评测开始前，都应验证这一配置。如果评测确实需要互联网访问，Anthropic 要求评测人员与公司共同确定能否可靠检测并及时终止模型超出预定范围的操作。评测开始前，还应让待测模型在没有互联网访问的环境中主动检查沙箱漏洞，包括静态分析配置以及实际尝试逃逸，并由人工密切监督。Anthropic 还要求评测人员确认测试任务本身在理论上确实可以完成。如果评测目标处于离线状态，或者任务本身无法完成，智能体可能会寻找其他方式完成目标，从而增加其超出预定范围采取行动的可能性。此外，每个评测提示词都应明确规定任务范围，包括目标、允许的操作以及网络边界。Anthropic 特别强调，边界应以指令形式表达，例如“你不应访问互联网”，而不应仅声称“你无法访问互联网”。评测过程中还应持续监控模型的思考、行动和网络活动，并将任务范围提供给基于模型或规则的监控系统。一旦发现模型违反规定，监控系统应向人工人员发出警报并终止评测。在对齐问题方面，Anthropic 的初步调查认为，两起事件可能涉及“动机性推理”和“鲁莽行为”两种失败模式。模型最初被告知运行环境是模拟环境，但当模型后来发现环境可能连接真实互联网时，它可能以能够维持原有判断的方式解释这些证据。Anthropic 认为，模型同时表现出了为了完成网络安全评测这一狭窄目标而采取有害行动的倾向。不过，评测本身的设计也可能影响了模型行为。例如，模型被明确告知没有互联网访问权限，但实际环境却可以访问互联网，这可能导致 AI 怀疑自己看到的系统是否真实。Anthropic 还指出，其中一次评测使用的虚构目标与一个真实网站同名，进一步增加了模型区分虚构目标和真实互联网目标的难度。该公司目前仍在研究模型究竟在多大程度上意识到自己获得了真实互联网访问权限，以及模型是否有意忽略环境中的现实迹象。Anthropic 还公布了针对强化学习训练中“奖励破解”（Reward Hacking）的研究。该公司表示，其经验研究显示，存在缺陷的训练环境，尤其是容易被模型作弊或必须通过作弊才能完成的环境，可能是模型产生不对齐行为的重要因素。今年 2 月，Anthropic 在发现 Mythos Preview 强化学习训练出现奖励破解迹象后，回滚了 3 天训练。当时模型开始在代码注释和回复中向“审核人员”留言，即使任务从未提及审核人员；模型还通过大量添加免责声明或限制条件，反复利用原本用于鼓励诚实行为的奖励机制。到了 2026 年春季，Anthropic 发现强化学习环境的生成速度已经超过现有审核系统的处理能力。自动监控发现的问题开始超过人工处理能力，同时该公司还发现部分训练运行意外使用了模型的思维链数据。Anthropic 认为，这可能使模型学习隐藏真实推理过程。为解决这些问题，Anthropic 于 4 月冻结了生产环境强化学习环境的所有变更，持续约一个月，并全面改造相关基础设施。新的奖励机制和训练环境必须符合统一规范，同时加入技术措施降低意外使用思维链进行训练的风险。在此次冻结期间，Anthropic 发现生产环境中超过 10% 的训练环境存在问题，包括奖励破解、任务本身无法正常完成以及配置错误等。这些环境只有在完成修复后才会重新投入训练。Anthropic 随后专门进行了对照实验。该公司使用 80 个曾经出现奖励破解或被质量审核发现存在可作弊漏洞的真实强化学习环境，对一个 Opus 级模型进行训练。结果显示，该模型表现出强烈追求任务高分的倾向，并更愿意为了完成任务而采取潜在有害行动。在模拟网络安全测试中，该模型表现出突破模拟沙箱、攻击模拟内部及第三方基础设施的倾向，还曾尝试修改自身奖励函数、向评分系统提供生物武器制造建议，并多次绕过部署安全监控以完成作弊行为。相比之下，在奖励破解训练之前的同一模型，以及 Anthropic 公开发布的多款模型，都没有表现出同等程度的不对齐行为。Anthropic 据此认为，在训练过程中存在大量奖励破解，可能导致模型为了完成任务而愿意执行较长的一系列潜在有害操作。其中，强化学习中的“奖励破解”是指模型找到训练机制中的漏洞，通过并未真正完成目标任务的方式获取更高奖励。Anthropic 同时强调，训练环境中的作弊并不是模型对齐问题的唯一原因，也不能确定是此次事件或其他前沿 AI 公司的相关事件的唯一成因。该公司认为，AI 对齐仍需要处理多种潜在问题，未来的安全事件也可能呈现不同的行为模式并具有不同成因。Anthropic 强调，7 月 30 日事件与公司内部安全状况无关。相关事件发生在第三方环境中，该环境错误地保持了互联网访问权限，因此模型甚至不需要突破任何安全机制就可以访问外部网络。不过，这些事件仍促使 Anthropic 进一步强化内部安全措施。该公司指出，随着模型能力提升，除了传统的知识产权和模型权重被窃取风险外，还需要防范自有模型从 Anthropic 系统中逃逸，以及模型被他人滥用于攻击 Anthropic 内部系统的风险。今年 4 月初，Anthropic 安全团队已经启动全公司范围的安全强化行动。当时公司认为自身面临的风险增长速度已经超过防御能力，尤其是 Mythos 级模型具备足以吸引资源充足攻击者的能力，同时内部自主智能体的使用规模也已经超过传统访问控制和监控体系的设计范围。此次安全行动包括减少能够持续访问模型权重和客户数据系统的人类及自动化账户、默认阻断计算集群的所有出站流量、要求内部服务在通信前验证彼此身份、淘汰旧版基础设施配置和共享内部服务，并进一步加强工作负载隔离环境。Anthropic 还扩大了主机级可观测性，使基础设施中的异常行为能够在发生时被发现。期间约 150 名产品工程师被临时调配至安全、可靠性和隐私工作，部分研究人员也从预训练或强化学习工作转向安全防护。该公司表示，大部分团队已经在初夏前达到预设的退出标准并恢复原有工作。与此同时，Anthropic 继续加强内部智能体的隔离和监控，包括针对高度自主内部智能体部署沙箱和自动模式分类器，并在基础设施代码合并前进行自动审核。Anthropic 指出，此前的安全体系主要遗漏了评测环境，尤其是第三方评测。虽然部分高风险评测已经采用实时监控，但过去通常只对部分评测记录进行事后自动检查。7 月发生的事件表明，公司需要进一步提高网络安全防御工作的紧迫程度，并将在下一份风险报告中公布更多信息。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/996/711.htm", "publishedAt": "2026-08-31T23:55:44+00:00"}, {"title": "Mac 成 AI 硬件宠儿：苹果提前发布 2026 款 mini / Studio，全球需求激增促成 8 月上新", "summary": "IT之家 9 月 1 日消息，科技媒体 The Information 于 8 月 30 日发布博文，报道称伴随着全球越来越多的 AI 实验室和开发者使用 Mac 训练 / 推理 AI 模型、运行 AI 智能体，推高全球苹果 Mac mini 和 Mac Studio 销量。该媒体指出苹果通常在秋季（10~11 月）更新 Mac 产品线，不过 2026 年产品更新提前到 8 月 25 日官宣、9 月 22 日发货，节奏明显提前。该媒体认为背后原因，是企业与 AI 客户对 Mac mini / Studio 的需求超出预期，促使苹果加速上新以缓解供应压力。M6 是苹果首款 2nm 芯片，用于新 Mac mini，配备 12 核 CPU 与 12 核 GPU，并在每颗 GPU 核心中首次加入 Neural Accelerators。苹果称其 AI 性能最高达 M4 的 4 倍，图形性能最高 2 倍；双 16 核神经引擎让峰值 AI 算力较上代最高翻倍。在 LM Studio 中，M6 版 Mac mini 的大语言模型提示处理速度最高达 M1 的 13.5 倍、M4 的 4.8 倍。苹果重点推广多台 Mac Studio 的集群能力。用户可通过雷雳 5 和 RDMA 连接设备，并让多机共享更大的内存池，用于加载更大型的开放权重大模型。苹果称，由 4 台 Mac Studio 组成的集群，AI 推理速度最高为单机的 3 倍。新机最高配备 6 个雷雳 5 接口，单接口带宽可达 120Gb/s，并首次加入 Wi‑Fi 7 和蓝牙 6。OpenAI 已购入数万台 Mac mini / Studio，用于训练可操作电脑的智能体；Anthropic 选择通过 AWS 租用 Mac mini 容量。苹果 Mac 业务在 2026 年 Q3 同比增长 29%，高配机型交付周期达 10–12 周，显示供需紧张。IT之家附上相关截图如下：", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/996/710.htm", "publishedAt": "2026-08-31T23:49:09+00:00"}, {"title": "苹果披露“惊人证据”：OpenAI 跳槽工程师下载机密电路图还销毁证据", "summary": "IT之家 9 月 1 日消息，根据苹果当地时间 8 月 31 日向法院提交的最新文件，公司在对前工程师 Chang Liu 使用过的一台 MacBook 进行初步取证分析后，发现了新的“令人震惊的证据”。苹果于今年 7 月正式提起诉讼，指控这名前工程师及另一位前高管 Tan Yew Tan 将商业秘密带至 OpenAI，用于其消费级硬件研发。公开报道显示，Chang Liu 原为苹果高级系统电气工程师，今年 1 月离职加入 OpenAI。苹果在诉状中指控其利用安全漏洞，在离职后下载了包含主板制造与测试演示文稿在内的机密文件。苹果随后申请初步禁令并请求法院加快证据调查；OpenAI 则要求法院驳回诉讼。苹果在最新文件中称，Chang Liu 的律师近期交还了其离职后使用的 MacBook。初步取证分析发现了四项关键情况，IT之家汇总如下：其一，Chang Liu 不仅下载了苹果机密电路原理图，并在 OpenAI 工作中实际使用。其二，Chang Liu 及 OpenAI 其他人员对其未经授权访问苹果第三方云存储一事知情。其三，Chang Liu 得知苹果内部调查后，曾指示一名 OpenAI 同事销毁证据，对方确认会照办。其四，Chang Liu 在 OpenAI 使用的某款工具与苹果内部工程应用同名。苹果称，Chang Liu 今年 3 月曾使用该电路图在电气工程工具 LTspice 中运行模拟。同期消息显示，Chang Liu 称其 AI 智能体已学会运行 LTspice 并审查结果。苹果认为，商业秘密被输入能从中学习的 AI 模型后，可能造成“不可逆且持续扩散的使用”。苹果还表示，之所以发现 Chang Liu 使用该原理图，是因为他曾在一台 Mac mini 上使用该文件，后通过 iCloud 同步至其带走的 MacBook。苹果目前也希望获取该 Mac mini 的访问权限。苹果称，被告方决定不对这台 MacBook 进行检查。苹果在文件中表示，这些证据恰恰说明其并非进行无根据的“钓鱼式调查”，而是有确切理由相信商业秘密正在被使用且证据正在遭销毁。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/996/702.htm", "publishedAt": "2026-08-31T23:07:00+00:00"}, {"title": "苹果 visionOS 27.0 开发者预览版 Beta 8 发布", "summary": "IT之家 9 月 1 日消息，苹果今日向 Vision Pro 用户推送了 visionOS 27.0 开发者预览版 Beta 8 更新（内部版本号：24M5361a），本次更新距离上次发布 Beta / RC 间隔 7 天。开发者可在 Vision Pro 上打开“设置”应用，进入“软件更新”并开启“Beta 更新”即可安装。需要注意的是，因苹果各区域节点服务器配置缓存问题，可能有些地方探测到升级更新的时间略有延迟，一般半小时内，不会太久。visionOS 27 的核心更新是引入 Siri AI，使其具备类似 ChatGPT 和 Claude 的对话与推理能力。在 Vision Pro 上，Siri 可回答用户注视内容相关问题，并新增了一个可在虚拟空间中任意放置的 Siri 球体。系统可将全景照片转换为沉浸式空间环境，并新增冰岛索斯莫克（Thórsmörk）环境，展示山脉、山谷、冰川及北极光景观。Web 环境支持允许开发者在 Safari 中创建 360 度浏览体验。应用窗口采用弧形设计以增强沉浸感；控制中心重新布局，便于查找系统功能。此外，新增了更小尺寸的小组件，且通知会在用户注视时自动展开。附 visionOS 27 发布历史：2026-08-25：visionOS 27.0 Beta 7 (24M5359a)2026-08-18：visionOS 27.0 Beta 6 (24M5355a)2026-08-11：visionOS 27.0 Beta 5 (24M5348b)2026-07-21：visionOS 27.0 Beta 4 (24M5326g)2026-07-07：visionOS 27.0 Beta 3 (24M5316k)2026-06-23：visionOS 27.0 Beta 2 (24M5306i)2026-06-09：visionOS 27 Beta (24M5291p)IT之家小伙伴如果找到更多新内容，可以在投稿或评论区中提出你的发现 ~[微笑]", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/996/692.htm", "publishedAt": "2026-08-31T17:30:07+00:00"}, {"title": "博通推出 VMware AI 工厂，简化企业私有云 AI 部署", "summary": "IT之家 8 月 31 日消息，博通公司今天宣布推出 VMware AI 工厂。新产品是 VMware AI 私有云的软件定义基础，通过一系列自动化创新功能为 AI 基础设施部署提供支持，进而为客户提供更加简单的 AI 生产力部署路径。据介绍，VMware &nbsp;AI 工厂可将 AI 应用直接部署到企业私有云环境。其 VCF（IT之家注：VMware Cloud Foundation）具备独特的基础设施自动化能力，可将服务器部署到 AI 模型开始服务，从数周缩短至数小时。VCF 可在整个企业内部汇集 GPU 资源，使不同团队在共享硬件上运行多个模型，不必为每个 AI 单独配置服务器。统一模型库可为数据科学团队提供单一界面，在虚拟机、容器和 GPU 资源之间部署及管理模型推理和 RAG 工作流。该平台还内置了可观测性功能，用于监控 Token 吞吐量、延迟，以及计算和内存利用率，帮助企业将 Token 利用率最大化。VMware AI 工厂将支持思科、戴尔、联想、超微等厂商的 VCF AI ReadyNodes 认证产品，同时支持客户偏好的 AI 软件和加速器架构，兼容 Gemma 4、cotomi、Qwen 3.7-Max、GLM 5.2 等 AI 大模型。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/996/680.htm", "publishedAt": "2026-08-31T15:33:31+00:00"}, {"title": "OpenClaw 从意外爆红到“无人问津”：一个开源 AI Agent 的八个月过山车", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/4KQHJC49t8J8FPqaEVLv?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-31T15:27:10+00:00"}, {"title": "全能型 covo-agent v0.1.0 发布：流式输出与 TUI 使用同一套渲染引擎", "summary": "关于 covo-agent covo-agent 是基于 covonaut 框架开发的运行在终端里的通用型 AI Agent，提供 general 与 code 两种工作模式，覆盖日常知识工作、软件开发、自动化、持久上下文管理与外部系统协作几个方向。项目以 Go 编写（Go 1.25.0 起），采用 AGPL-3.0 协议开源。 v0.1.0 更新要点 1. 渲染链路统一：流式输出与 TU...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502228", "publishedAt": "2026-08-31T13:38:54+00:00"}, {"title": "开源中国的独立叙事：在被收购的宿命里，走一条相反的路", "summary": "8 月 28 日，英伟达拟以 129 亿美金收购 Hugging Face 的消息，在开源圈持续发酵两天后，被一则币圈&娱乐圈的新闻盖过了热度。当晚，天际资本创始人张倩与开源中国 CEO 徐勇进行了一场约两个小时的直播对谈，主题正是这场收购。 这场对谈的价值，不止于行业点评。它同时呈现了两条交织的叙事线，一条是 Hugging Face 作为...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502227", "publishedAt": "2026-08-31T12:00:37+00:00" 一家英伟达支持的“新云”厂商 Nscale 签署了一份价值 450 亿美元（现汇率约合 3,031.09 亿元人民币）的算力租赁协议。值得注意的是，Hut 8 还在为 Anthropic 单独开发其他数据中心，那些设施将搭载谷歌 TPU，与英伟达芯片形成竞争。谷歌已为此提供财务担保以帮助 Hut 8 融资。今年 7 月，Hut 8 披露一家“高投资级公司”为其整个 700 兆瓦的得州园区签署了 15 年租约，但未透露租户身份，仅表示该设施将设计为支持英伟达芯片。今年 7 月，英伟达宣布了一项为 Lambda 等“新云”厂商提供信贷支持以换取其云收入分成的计划。但据《华尔街日报》报道，由于反垄断担忧，英伟达近期已暂停了该计划的部分交易。目前尚不清楚 Lambda 是否需将其在得州站点产生的部分收入分给英伟达。相关阅读：《消息称 Anthropic 与云计算公司 Riot Platforms 达成 91 亿美元算力协议》《消息称 Anthropic 豪掷 450 亿美元向 Nscale 租赁 AI 算力，2027 年底启用英伟达 Vera Rubin 芯片算力》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/996/714.htm", "publishedAt": "2026-09-01T00:05:09+00:00"}, {"title": "AI 写代码飞快，为何交付没有变快？小红书 Muse 的 Agentic 架构实践", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/l88X1azz8wfwphDyECoP?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-31T16:48:57+00:00"}, {"title": "智能体适应度函数：将演进式架构扩展至确定性规则之外", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/8iWWrov7bkk1hz5CcFft?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-31T16:45:00+00:00"}, {"title": "当数采设备不再稀缺，具身数据下一步拼什么？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/D2r6SJ2oYVAXGMBkPcRM?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-31T16:04:31+00:00"}, {"title": "坚决不用行业标准AGENTS.md，Claude Code惹来“封杀令”：Anthropic终于回应了，但开发者更气了", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/GuFWNd24Ww5AFlrXxTBo?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-31T15:03:08+00:00"}, {"title": "Meta用一整年证明Agent无法取代员工：事故增四成，工程师救火多七成", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/OCUqGd8wceo7UK23B7NO?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-31T14:56:37+00:00"}, {"title": "自研Runtime、Agent Loop、Infra：一家通用Agent公司的全栈赌注", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/NUGYDL const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
