const DATA = {"date": "2026-11-22", "generatedAt": "2026-11-22T02:47:30Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "2026 脑机接口报告：全球企业增至 1175 家，中国三大城市群集聚 190 余家", "summary": "IT之家 11 月 22 日消息，据“北京昌平”公众号，11 月 21 日，以“脑智芯联机遇昌平”为主题的 2026 脑机接口大会在昌平石油科技交流中心开幕。开幕式上，《2026 年脑机接口创新发展研究报告》正式发布。报告认为，2026 年脑机接口的战略意义，正从“大脑与外部设备的直接连接”走向更为多维的产业赋能。从产业态势看，2026 年全球脑机接口企业数量从 800 多家增至 1175 家，多数企业选择技术门槛较低、产业化落地较快的路线。中国脑机接口产业集聚于京津冀、长三角、粤港澳三大城市群，共集聚 190 余家企业、占全国的 77.4%。IT之家注意到，报告以“靶点、流向、递送、信号”四个维度重新界定脑机接口。从作用靶点看，既有大脑与外部交互的中枢脑机接口，也包括外周神经接口；从信号递送方式看，分为侵入式、半侵入式和非侵入式；从信息流向看，分为由脑向外的“感知”与由外向脑的“调控”；从信号类型看，既有电信号，也有脑磁光信号、超声信号。这一框架把过去的、现有的和未来的脑机接口设备放进同一技术体系，为技术研究和方向预测提供了统一坐标。在此基础上，报告重新梳理了脑机接口的系统架构：无论是侵入式、非侵入式还是介入式整机，拆解之后最终都落在脑科学发现、生物材料、核心器件、解码算法和未来前沿技术五个基础领域，由材料、器件、算法形成的多学科技术集成，构建起“感知 — 解码 — 调控”的多元技术架构。面向未来，报告参照通信技术的代际划分，将脑机接口分为多代：一代是开环感知与开环调控的单向设备，读写分离；二代是目前研发的中心，在同一靶点区内的感知与刺激的闭环功能；三代是多模态脑机接口，集成电、光、磁、声的交叉协作闭环生态，这也是当前产业重点研发和攻坚的方向；四代则指向 AI 原生与碳硅融合的脑机接口。报告指出，脑机接口的产业集中度高于普通制造业，更接近于生物医药行业；企业选址主要考量注册审查资质、基金投入和供应链完善度。同时提出，产业整合分化与治理监管将并行推进，产学研用正由中部向两端延伸，同质化发展会逐渐走向专业深耕与分工。不过，支付体系和人才体系仍不完善，产业还需要战略耐心、资本耐心，以及持续的政策支持与资源供给。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/030/545.htm", "publishedAt": "2026-11-22T02:00:38+00:00"}, {"title": "试题经过大模型测试？国家中医药管理局认证中心：未与任何大模型企业合作，亦未开展测评", "summary": "IT之家 11 月 22 日消息，11 月 21 日晚，国家中医药管理局中医师资格认证中心通过官方公众号发布声明称，该中心从未公开历年真题，未与任何大模型企业合作，亦未开展测评。声明称，中心从未以任何形式向社会公开、发布或出售中医类别医师资格考试历年试题（含真题、原题）、参考答案及相关考试资料，亦未授权任何单位或个人公开、发布、销售。市场上以“历年真题”“官方真题”“内部题库”“原题还原”等名义提供、销售或用于训练、测评人工智能大模型的内容，均非中心提供。声明还称，中心从未与任何人工智能大模型企业、平台或相关机构建立合作关系；未授权任何主体使用中心名称、简称、标识、考试数据及考试资料用于大模型训练、产品宣传或者商业推广；中心未对任何大模型产品开展过测评、认证、认可或者推荐。声明表示，任何单位或者个人应立即停止不当宣传，删除、下架相关信息与内容，中心保留依法追究其法律责任的一切权利。IT之家从公开资料获悉，国家中医药管理局中医师资格认证中心，2000 年 12 月 19 日，经中华人民共和国中央编制委员会办公室批准，成立了国家中医药管理局中医师资格认证中心。2007 年经批准增加组织实施中医药行业特有工种职业技能鉴定工作职能，并加挂国家中医药管理局职业技能鉴定指导中心牌子。2022 年中编办批准中心机构职能和编制调整。该中心承担中医药行业相关考试和人才评价，以及有关考试质量评估、科学研究与交流、信息化建设等工作，中医药行业职业技能鉴定的有关指导工作。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/030/540.htm", "publishedAt": "2026-11-22T01:42:10+00:00"}, {"title": "2027 款岚图泰山旗舰纯电大六座 SUV 定档 11 月 27 日开启预售", "summary": "IT之家 11 月 22 日消息，岚图汽车官方今日宣布，旗下“中式旗舰纯电大六座”SUV —— 2027 款岚图泰山将于 11 月 27 日正式开启预售。目前，岚图汽车官方暂未公布 2027 款泰山更多配置信息，IT之家将持续关注，并在第一时间带来最新情报。作为参考，现款岚图泰山已于去年 11 月 18 日上市，共推出四个版本，售价 37.99 万-50.99 万元。该车主要配置信息如下：中国首发三腔空气悬架：110mm 调节行程、100 次 / 秒道路预瞄智能调节阻尼、4 档刚度调节、5 档高度调节华为乾崑智驾 ADS 4：华为乾崑智驾 ADS 4 四激光方案、分布式 4D 毫米波雷达华为鸿蒙座舱 HarmonySpace5：首搭 AI 语音大模型、MoLA 架构首搭上车、五大 Agent 智能体行业首创・AI 云舒座椅：66 颗高精度传感器、22 向电动零重力调节、26 点大师级按摩、12 层云感科技6 座 / 5 座 / 4 座灵活切换HUAWEI XPIXEL 智慧投影大灯鲲鹏展翼踏板及光毯行业唯一双盾防撞加固车门：2200MPa 热成型防撞梁、侧碰防护力提升 30%800V 高压平台 + 5C 超快充：65kWh 大电池、CLTC 纯电续航 350km、CLTC 综合续航 1400km+外观颜色：鎏金紫、玄墨金、赤霞紫、远山蓝、玄英黑、宸星灰、香槟金、杜若白；内饰颜色：玄红、暖棕、云米", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/030/539.htm", "publishedAt": "2026-11-22T01:37:52+00:00"}, {"title": "李小龙预热华为史上最薄智能手表 WATCH Air：对男性穿西装衬衣非常友好", "summary": "IT之家 11 月 22 日消息，华为史上最薄智能手表 —— 华为WATCH Air 将于 11 月 24 日 14:30 登场。该产品拥有 6.9 毫米机身，号称“薄，且强”。11 月 20 日，华为终端 BG CTO 李小龙对这款新品进行了预热。他表示，这款表又轻又薄，佩戴舒适性非常好，尤其对男性穿西装衬衣非常友好，不会和衬衣袖子干涉。他还提到：“因为非常轻，运动时佩戴也非常稳定，心率数据准确性很好，是一个全能型选手。”据此前官方公布信息，新机采用 6.9mm 超薄设计，提供 1.4mm 超窄四等边、蓝宝石玻璃表镜，高亮钛合金一体化机身搭配三款机身配色。IT之家注意到，数码博主 @数码闲聊站 此前已发文透露华为 WATCH Air 的屏幕、材质与机身参数，华为史上最薄机身、最窄黑边、最大屏占比，集齐三个“华为之最”。据该博主介绍，华为 WATCH Air 配备 1.92 英寸 AMOLED 方屏，采用全新结构设计，厚度压至 6.9mm，重量为 27g；在这一厚度下还内置高硅叠片异形电池，续航可做到一周一充。功能方面，博主表示华为 WATCH Air 的健康功能对齐 WATCH 6，运动功能对齐 GT 7 Pro。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/030/534.htm", "publishedAt": "2026-11-22T01:10:17+00:00"}, {"title": "群联展示内置 NPU 与 64GB 内存的智能固态硬盘，可直接运行 AI 模型", "summary": "IT之家 11 月 22 日消息，据科技媒体 Tom's Hardware 昨天报道，群联在 SC26 大会中展示两款企业级固态硬盘，专为 AI 场景设计。其中一款甚至带有 NPU 和 64GB 内存，可以直接运行 AI 模型。IT之家从原报道获悉，其中一款产品 SSD 内置 NPU（神经网络引擎）、64GB 内存，带宽达到 130GB/s，支持直接在硬盘上运行 PyTorch、vLLM、OpenVINO 和 llama.cpp 等 AI 框架及推理工具。该产品的设计思路是将部分计算任务从服务器转移至 SSD，让设备直接处理存储的数据，仅向主机返回结果，无需完整传输数据集。群联表示，该方案在特定工作负载下有望将数据传输量减少 10 至 100 倍，从而降低主机 CPU 的负载。另一款产品采用全新的 Mixed Media 混合介质设计，将高耐久性的 pSLC 缓存与大容量 QLC 闪存整合在同一块 SSD 中，并通过一颗 16 通道主控进行管理。该方案将部分 QLC 闪存切换至 SLC 工作模式，以牺牲部分存储容量为代价，提升写入性能和耐久性。两个存储区域分别分配独立命名空间，主机可以根据数据类型选择对应的存储区域，无需额外安装专用软件。群联称这种方案能够减少独立缓存盘的依赖。在包含 24 块 SSD 的系统中，如果其中一块硬盘发生故障，缓存损失比例仅为 4%，而采用 4 块独立缓存盘的传统方案可能损失 25% 的缓存容量。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/030/524.htm", "publishedAt": "2026-11-22T00:04:47+00:00"}, {"title": "加密聊天应用 Signal 默认屏蔽截图，防止 AI 智能体读取用户消息", "summary": "IT之家 11 月 22 日消息，开源端到端加密聊天应用 Signal 近日推出 iOS / Android 版更新，默认关闭应用程序内截图功能，以阻止 Siri AI 和 Gemini 等 AI 智能体读取用户私人消息。Signal 总裁 Meredith Whittaker 表示，系统级 AI 智能体的影响力正不断扩大，这对 Signal 长期建立的隐私机制构成威胁，因为这些智能体可能在用户毫不知情的情况下访问私人对话。在 Signal 8.37（IT之家注：iOS 27 系统）中，应用默认启用了“阻止 Siri AI”设置，用户无法在 Signal 内截图或录屏。用户可选择关闭该功能 10 分钟，或是直接永久禁用。来到安卓这边，Signal 8.35.1 或更高版本检测到 AI 助手试图截图读取消息时，会自动启用“屏幕安全”策略阻止截屏。不过官方表示，由于不同安卓设备的实现方式存在差异，这项检测功能并不能在所有设备上稳定运行。此外 Signal 表示，由于缺少必要开发工具，macOS 版 Signal 无法实现类似的防止截图功能。官方建议用户在系统设置中，将 Signal 放入“Siri 排除列表”中。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/030/517.htm", "publishedAt": "2026-11-21T23:28:10+00:00"}, {"title": "1967 款保时捷 912 借电动化喜获新生：输出 304 马力，续航 400 公里", "summary": "IT之家 11 月 21 日消息，现如今在海外，让经典车通过电动化改造获得新生的项目不断涌现。外媒 insideevs 今天（21 日）介绍了一辆“复活”的 1967 款保时捷 912，该车由改装厂商 Inverted 经手，改装团队为它装上了电池组和电动机。改装完成后，车辆外观与原厂 912 毫无二致，经典的复古造型得以完整保留，开起来却已经是一辆当代的电动汽车。这套改装最巧妙的地方在于电池布局。由于车身本就轻巧，62kWh 的电池组因此足以让车辆拥有相当可观的续航。然而，电池重量如果全部集中在后轴上方，却会让车尾负担过重。老款风冷保时捷本来就容易在收油时出现转向过度，再增加后部重量，自然不是好主意。Inverted 为此将电池组拆分成两部分：一部分放在原发动机舱的位置，另一部分则安装在车头的前备箱内。经过这样的布局调整，电动版 912 的前后重量分配反而比原车更加合理。IT之家从报道中获悉，车辆续航约为 400km，支持 75kW 直流快充。对于当下的电动汽车来说，这样的充电功率算不上突出，不过考虑到车辆的定位，已经完全够用。动力方面，该车后置电动机可输出 304 马力，远超原厂四缸发动机约 91 马力的水平，从静止加速至 97km/h 也仅需 4 秒，作为对比，原厂车型完成同样的加速需要约 13 秒。这辆 912 的改造也远不止更换动力系统，内饰经过了彻底翻新，完成度相当出色。仪表盘依旧保留着保时捷经典的复古设计，内部显示功能已经针对电驱系统进行了调整。例如，原本位于中央的转速表换成了动力输出百分比表，燃油表也改成了指针式电量表。整套内饰既保留了老保时捷的韵味，也融入了电动汽车的使用逻辑。", "sourceName": "IT之家", "sourc 码可编译：数十人报告编译通过，并复现出相同的原始证明导出文件；证明对应正确陈述：社区新增一个仅导入 Mathlib 的文件以隔离该陈述，再用 comparator 和 con-leche --compare 两套独立工具比对，确认库中证明的定理与 Mathlib 的陈述完全一致；证明有效：原始导出文件经多个证明检查器检验，包括 Lean 官方内核、con-leche、con-ron，以及第三方以不同编程语言实现的检查器。声明特别提到，con-leche 与 con-ron 附带相对集合论的形式化证明，因此可以保证它们不会接受错误证明，这也回应了“Lean 逻辑本身可能存在漏洞”的担忧。上述检查在惰性导出文件上运行，不受源码中潜在恶意代码影响。声明最后称，感谢为验证提供资源的社区成员，并期待数学界后续工作解释该证明中的新思路。IT之家注：黎曼猜想由德国数学家伯恩哈德 · 黎曼于 1859 年提出，认为看似随机分布在数轴上的质数，实际上遵循着复杂而有意义的规律。此后，黎曼猜想成为整个数论研究领域的重要指引，也是数学界最著名的未解难题。IT之家附声明原文及译文：Lean verification of the Riemann HypothesisJoint statement by the Lean and Mathlib communities, endorsed by the Lean FRO and the Mathlib Initiative.On November 20, 2026, Levent Alpöge released a proof of the Riemann Hypothesis as a Lean library comprising 17 million lines of code.We have full confidence that Alpöge's proof of the Riemann Hypothesis is correct, and we congratulate him on this achievement.Our rationale is outlined below.The codebase depends directly only on Mathlib. Over the past day, the Lean and Mathlib communities have rallied to verify the proof's correctness. We hereby certify that both the statement and the proof of the Riemann Hypothesis are correct. The four criteria in https://xenaproject.wordpress.com/2026/11/12/and-the-proof-is-checked-in-lean/ are all satisfied.The statement of the Riemann Hypothesis is correct. This statement is part of Mathlib: RiemannHypothesis and has been carefully vetted by experts in Lean and number theory.Alpöge’s library compiles correctly. By now, dozens of people have reported correct compilation of the codebase, reproducing the same raw proof export file. The library compiles without errors or build failures.The code proves the correct statement. Crucially, the community has added a file that isolates the statement of the Riemann Hypothesis and imports only Mathlib. That statement was compared against the theorem proved by Alpöge using two independent tools ( and ), both confirming that the theorem proved in Alpöge’s library is exactly Mathlib’s statement of the Riemann Hypothesis. comparatorcon-leche –compareThe Lean proof is valid. The exported raw proof has been checked by several proof checkers, including Lean’s official kernel, the and checkers, and several independent checkers contributed by third parties and implemented in different programming languages. The checkers and come with a formal proof, relative to set theory, that they cannot accept a false proof, thus addressing concerns that Lean’s logic itself might have flaws that the proof could exploit. An extensive overview is available at https://math.mit.edu/~drew/grh/. These checks ran on an inert export of the proof, out of reach of hypothetical malicious code in the Lean proof sources. con-lechecon-roncon-lechecon-ronThanks are owed to everyone in the community who provided resources for the verification.We look forward to all the activity in the mathematical community that will help explain the new ideas in this proof.Lean 对黎曼猜想的验证Lean 与 Mathlib 社区联合声明，由 Lean FRO 与 Mathlib Initiative 背书。2026 年 11 月 20 日，莱文特・阿尔波格（Levent Alpöge）在发布了一项黎曼猜想的证明，该证明以包含 1700 万行代码的 Lean 库形式呈现。我们完全相信阿尔波格的黎曼猜想证明是正确的，并对这一成就表示祝贺。我们的依据如下。该代码库仅直接依赖 Mathlib。在过去一天里，Lean 与 Mathlib 社区齐心协力核验了该证明的正确性。我们特此认证：黎曼猜想的陈述与证明均是正确的。四项标准均已满足。黎曼猜想的陈述是正确的。该陈述是 Mathlib 的一部分，并已由 Lean 与数论领域的专家仔细审核。阿尔波格的库可以正确编译。目前已有数十人报告代码库编译正确，并复现出同一份原始证明导出文件。该库编译无错误，也没有构建失败。代码证明的是正确的陈述。关键在于，社区新增了一个文件，用于隔离黎曼猜想的陈述，并且只导入 Mathlib。该陈述已使用两套独立工具（comparator 与 con-leche --compare），与阿尔波格所证明的定理进行比对，两者均确认：阿尔波格库中所证明的定理正是 Mathlib 对黎曼猜想的陈述。Lean 证明是有效的。导出的原始证明已通过多个证明检查器的检验，包括 Lean 官方内核、con-leche 与 con-ron 检查器，以及第三方贡献的、以不同编程语言实现的若干独立检查器。con-leche 与 con-ron 附带相对于集合论的形式化证明，证明它们不可能接受错误的证明，从而回应了“Lean 的逻辑本身可能存在缺陷、并可能被该证明利用”的担忧。这些检查是在该证明的惰性导出文件上运行的，因此不会接触到 Lean 证明源码中假设存在的恶意代码。我们期待数学界接下来的各项工作，帮助解释这一证明中的新思路。相关阅读：《黎曼猜想真被 Claude 证明了？Anthropic 数学家仅发布 Lean 代码，文字证明超 25 万页》《AI 攻克黎曼猜想？Anthropic 数学家宣称已与 Claude 合作完成证明》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/030/547.htm", "publishedAt": "2026-11-22T02:31:50+00:00"}, {"title": "前英特尔 CEO 基辛格：随着 AI 需要“一万倍的效率飞跃”，渐进式芯片性能提升无法满足", "summary": "IT之家 11 月 21 日消息，据 Wccftech 报道，前英特尔首席执行官帕特 · 基辛格（Pat Gelsinger）表示，随着人工智能需要“10,000 倍的效率飞跃”，渐进式的芯片增益将无法满足需求，他同时否认了摩尔定律已走向终结。在 2026 年 COSM 科技峰会上，帕特 · 基辛格出席了一场题为“现实检验：超越芯片（Reality Check: Beyond Chips）”的炉边谈话。基辛格在谈话中反驳了半导体微缩已触及物理极限的观点，他认为 AI 需要的不是常规的代际升级，而是计算效率实现激进的 10,000 倍跃升。他还指出，摩尔定律（Moore’s Law）能否重焕生机，取决于五大核心工程领域（IT之家注：光学、供电、散热、材料和封装）的根本性突破。峰会结束后，帕特 · 基辛格在 X 上写道：“摩尔定律已死？我说现在是唤醒它的时候了！”尽管一些行业观察人士可能会认为传统的摩尔定律微缩已经结束，但基辛格坚持认为半导体工程正在进入一个多学科创新的新时代，他表示：“在半导体行业工作 40 多年后，我相信我们最伟大的创新仍在前方！”自 2025 年 3 月以普通合伙人身份加入风险投资机构 Playground Global 以来，基辛格一直在积极支持针对这些硬件瓶颈的初创企业，其中包括获得美国政府支持的光刻初创企业 xLight（该公司目标突破阿斯麦 ASML 的 13.5 纳米极紫外 EUV 波长壁垒），以及核能产能公司 Alva Energy。除了光刻与发电领域，基辛格的技术路线图还瞄准了光互连与硅光子技术，旨在用光信号替代传统的铜线来传输数据。相关阅读：《前英特尔 CEO 基辛格称 HBM 是“糟糕的内存”》《前英特尔 CEO 基辛格押注新 AI 内存：Z2RAM 拟绕开 EUV 光刻，4 年内送样》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/030/464.htm", "publishedAt": "2026-11-21T11:43:07+00:00"}, {"title": "哈佛大学研究人员：AI 编程目前的瓶颈是“Code Review”", "summary": "哈佛大学两位博士候选人做了一份工作论文，把 AI 编程 Agent 的真实效果算了一遍。样本是 718 家公司、725938 名员工。 结论不太好看。 用上 AI 编程 Agent 之后，人均每月新增代码行数从 5017 涨到 6511，多了约 30%。提交数增长 20%，Pull Request 增长 23%。该有的增长都出现了。 但活干完了吗？没有。 论文用 Jira i...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503706/harvard-researchers-find-ai-coding-agents-shifted", "publishedAt": "2026-11-20T09:00:13+00:00"}, {"title": "Google「AI Overviews」让网站的搜索流量下降四成", "summary": "Google 搜索引擎「AI Overviews」服务正在抢走网站的流量。 根据一项随机实验的测试，AI Overview 导致从 Google 搜索结果指向外部网站的点击量下降了四成。 这是随机实验做出来的数字，不是相关性推测。研究者对一部分美国桌面用户隐藏了 AI Overviews，然后和仍能看到的那组做对比。 这个数字背后有一个更直观的画面：...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503698", "publishedAt": "2026-11-20T03:57:08+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "韩国总统李在明：速度在 AI 竞赛中至关重要", "summary": "IT之家 11 月 21 日消息，据路透社报道，当地时间 21 日，韩国总统李在明前往韩国东南部城市蔚山，视察当地一座在建数据中心，并敦促韩国加快在全球 AI 竞赛中的步伐。“全世界都在竞相角逐，速度至关重要。”数据中心是芯片需求的重要来源。李在明希望，SK 建设的蔚山项目能够取得成功，进而吸引全球 AI 企业加大投资。蔚山 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

  let counter = 0;

  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);

      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
