const DATA = {"date": "2026-09-05", "generatedAt": "2026-09-05T00:35:28Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "谷歌最强音乐 AI Lyria 3.5 塞进 Gemini：一键生成 3 分钟完整歌曲", "summary": "IT之家 9 月 5 日消息，谷歌今天（9 月 5 日）发布公告，宣布在 Gemini 应用和 Gemini API 中上线最新音乐生成模型 Lyria 3.5，标志着谷歌音乐 AI 从内部实验工具（Google Flow Music）走向主流用户与开发者生态。调用方面，Lyria 3.5 同步开放给开发者，通过 Google AI Studio、Vertex AI 及 Gemini API 提供调用接口。IT之家附上相关截图如下：文档列出了两种模型：Lyria 3 Clip（模型 ID 为 lyria-3-clip-preview），始终生成用于循环和预览的 30 秒片段；以及 Lyria 3.5（模型 ID 为 lyria-3.5），可生成包含数段副歌、桥段等，时长数分钟的完整歌曲。官网文档暂未发现定价相关信息。这两种模型默认输出 MP3 音频，Lyria 3.5 还支持 WAV 输出。文档指出，开发者可以在文本提示的同时提供最多 10 张图像，模型将依据视觉内容创作音乐。所有生成内容均通过 Interactions API 统一调度，并嵌入 SynthID 隐形水印，该水印可抵抗压缩、重采样等常见音频处理，用于版权追踪与内容溯源。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/647.htm", "publishedAt": "2026-09-04T23:53:05+00:00"}, {"title": "匿名 AI 模型再现：又一 Alpha 上线 OpenCode，线索指向智谱", "summary": "IT之家 9 月 5 日消息，在 Ox Alpha 确认为 GLM-5.3-Flash 原生多模态模型后，又一款名为 Omen Alpha 的模型昨日（9 月 4 日）上线 OpenCode Go 订阅计划，种种线索表明同样来自智谱公司。费用方面，该模型目前仅对 OpenCode Go 订阅用户开放，月费 10 美元（IT之家注：现汇率约合 67.4 元人民币），但单独提供 100 美元（现汇率约合 673.6 元人民币） 的 Omen Alpha 用量额度。平台设定了分层使用上限，每 5 小时请求数为 11,600，每周请求数为 29,000，而每月请求数为 57,900。每次请求 300 个输入 token，40,000 个缓存 token，100 个输出 token。根据 OpenCode 的官网参考价格，Omen Alpha 的参考定价为输入 0.20 美元（现汇率约合 1.3 元人民币） / 百万 token、输出 0.66 美元（现汇率约合 4.4 元人民币） / 百万 token、缓存读取 0.04 美元（现汇率约合 0.27 元人民币） / 百万 token。此外根据 Pi（一个类似 OpenCode 的 AI 开发智能体工具）的模型页面，显示 Omen Alpha 支持 50 万 token 上下文窗口、文本与图像多模态输入、最大输出 12.8 万 token，并具备推理能力。OpenCode 数据页将 Omen Alpha 的文件路径归入 zhipu，指向中国公司智谱 AI（Zhipu AI）。社区据此猜测其为新版 GLM 模型，可能属于 GLM-5.x 或 Omni 分支。IT之家附上相关截图如下：图源：@心恋树", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/641.htm", "publishedAt": "2026-09-04T23:30:48+00:00"}, {"title": "Anthropic：Claude 仅用 11 天完成费马大定理首个完整计算机验证证明", "summary": "IT之家 9 月 5 日消息，Anthropic 于当地时间 9 月 4 日宣布，其 AI 模型 Claude 在基本自主运行 11 天后，完成了对费马大定理（FLT）的首个端到端、经过计算机检查的形式化证明。Anthropic 表示，这项工作并非重新发现费马大定理的数学证明，而是将已有数学证明转换为 Lean 证明助手可以逐步验证的形式。IT之家注：Lean 是一种用于编写和验证形式化数学证明的证明助手，能够通过计算机检查证明中的逻辑步骤。据介绍，Claude 在这一过程中生成了约 1300 万行 Lean 代码，并证明了约 3.03 万个定理，其中约 2.95 万个中间定理最终被纳入费马大定理的完整证明。整个证明由 Lean 完成检查，仅使用 Lean 的 3 条标准公理。这项工作的目标是将英国数学家安德鲁 · 怀尔斯于 1995 年完成的费马大定理证明进行形式化。费马大定理指出，当整数指数 n 大于 2 时，不存在满足 aⁿ+bⁿ=cⁿ的正整数 a、b、c。怀尔斯的原始证明长达 129 页，其正确性在发表前还经历了数月的人工核查。数学形式化的难点在于，人类数学证明通常会省略大量被认为显而易见的推导步骤，而 Lean 需要明确验证每一个逻辑环节。此外，数学家长期以来还会引用大量尚未被形式化的既有数学成果，因此将完整证明转换为计算机可验证形式通常需要投入大量时间。Anthropic 此前预计费马大定理的形式化工作可能需要数年。此次项目由 Anthropic 研究人员 Tianyi Peng 发起。Claude 并非由单个智能体完成全部工作，而是通过多智能体协作完成概念定义、中间定理证明以及更复杂命题的推导。项目使用了由 Peng 及其哥伦比亚大学合作者开发的 Prove2Me 平台，用有向无环图（DAG）记录待证明的定理及其依赖关系，并支持多个 Claude 智能体并行工作。Anthropic 称，最终证明遵循了 Darmon、Diamond 和 Taylor 对怀尔斯证明的简化版本。人类研究人员提供的数学输入主要是少量高层次指令，例如确定某些数学对象或定理的优先级，具体证明过程则主要由 Claude 完成。整个项目消耗了约 60 亿个输出 Token，使用的是一个与 Claude Fable 5.1 大致相当的通用内部研究模型。最终生成的证明规模超过 Mathlib 这一主要数学证明库的 5 倍。Anthropic 特别强调，此次成果的重点并不是 AI 独立提出了新的费马大定理证明。该定理早在 1995 年已经由怀尔斯证明，此次工作的创新之处在于利用 AI 大规模自动完成证明形式化，并由 Lean 对最终结果进行计算机验证。Anthropic 认为，如果类似的自动形式化技术能够扩展到更多现代数学成果，就有望降低数学研究中验证新证明的人工成本。该公司还表示，随着 AI 生成数学成果的数量增加，为面向人类阅读的数学证明同时提供形式化版本，未来可能成为常见做法。此次项目的完整 Lean 证明已经公开在 GitHub 上（https://github.com/anthropics/fermats-last-theorem）。Anthropic 同时表示，Kevin Buzzard 对该证明进行了审阅，并认为这项自动形式化成果显示，AI 辅助形式化大型数学成果已经取得重要进展。相关阅读：《Anthropic 发布 Claude Fable 5.1 和 Mythos 5.1：性能超越前代，缓存降价 75%》《未公开的新模型“立功”，Anthropic 宣布 Claude 攻克黎曼猜想取得重大突破》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/638.htm", "publishedAt": "2026-09-04T23:20:46+00:00"}, {"title": "车机 AI 加一：Anthropic Claude iOS 版应用接入苹果 CarPlay", "summary": "IT之家 9 月 5 日消息，Anthropic 现已为旗下 Claude iOS 应用加入苹果 CarPlay 支持，Claude 用户现在可以通过汽车的信息娱乐系统与 AI 助手进行语音对话，无需在驾驶过程中操作手机。IT之家注意到，苹果此前已经在 iOS 26.4 中为 CarPlay 加入第三方聊天机器人支持。希望接入 CarPlay 的聊天机器人应用需要支持苹果指定的语音控制界面，采用 CarPlay 规定的界面模板，并获得苹果授予的相关权限。Anthropic 表示，如今 Claude 在汽车上可以通过语音回答用户提出的问题，实现免提交互。不过，该功能目前无法控制车辆或 iPhone 上的其他功能。此外，由于 CarPlay 暂不支持第三方唤醒词，用户仍需要先通过 CarPlay 界面手动打开 Claude 应用，随后才能开始语音对话。进入 CarPlay 中的 Claude 应用后，用户会看到“开始免提对话”界面，可以选择开始新的对话，也可以访问近期聊天记录。对话过程中，界面提供静音、取消静音、结束以及恢复对话等控制选项，同时会通过视觉提示显示 Claude 当前是否正在聆听或回答。目前，苹果 CarPlay 已经支持大量第三方 AI 应用，除了 Anthropic Claude 外，先前 OpenAI 也已经为 ChatGPT iOS 应用加入 CarPlay 支持。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/629.htm", "publishedAt": "2026-09-04T22:52:35+00:00"}, {"title": "OpenAI GPT-6 Astra 现已登陆 ChatGPT Work、Codex 及 API，率先向 Pro、Enterprise 及 Business Premium 用户开放", "summary": "IT之家 9 月 5 日消息，OpenAI 今日宣布，GPT-6 Astra 现已面向 ChatGPT Work 和 Codex 中的 Pro、Enterprise 及 Business Premium 用户开放，同时已上线 API。面向 Plus 和 Business 用户的推送可能还需要数日才能完成。另外，在 ChatGPT 中，GPT-6 Pro 用户已经能够用上 GPT-6 Astra。目前 GPT-6 Pro 已向 Pro、Business 和 Enterprise 用户开放。OpenAI 于当地时间 9 月 3 日发布了新一代人工智能模型 GPT-6 Astra，官方称其为该公司迄今能力最强的模型。该模型在计算机操作、网页浏览、软件工程、网络安全、科学研究及专业工作等领域均达到当前最先进水平。OpenAI 总裁格雷格 · 布罗克曼（Greg Brockman）在表示“欢迎来到 AGI 时代”。GPT-6 Astra 的上下文窗口达到 105 万 token（IT之家注：约可处理 1500 页 A4 纸大小的文本内容），最大输出长度为 12.8 万 token，知识截止时间为 2026 年 4 月 30 日。模型支持文本和图像输入以及文本输出，并集成了网页搜索、文件搜索、代码编写与执行等工具链。在多项关键评测中，GPT-6 Astra 展现出大幅提升。代表高阶数学能力的 FrontierMath Tier 4 测试中得分达 97.6%，接近满分；在衡量陌生环境学习与抽象推理的 ARC-AGI-3 测试中，得分从上代 GPT-5.6 Sol 的 7.8% 跃升至 99.9%；漏洞利用能力测试 ExploitBench 中取得 100% 满分。在 OSWorld 2.0 测试中，Astra 得分 72.6%，完成任务平均耗时约 40 分钟，而 GPT-5.6 Sol 为 65.7%、耗时约 75 分钟，任务耗时减少约 47%。GPT-6 Astra 的一大核心突破在于计算机操作能力。模型可自主操控浏览器、办公软件和开发工具，独立完成资料检索、表格处理、演示文稿制作、代码开发等完整工作流。用户可直接给出目标指令，如“帮我整理一份财务分析并做成演示文稿”，模型需自行拆解任务、调用不同工具并持续执行。OpenAI 表示，Astra 是最擅长遵循现有模板的模型，能够生成布局精良的演示幻灯片。在网络安全方面，GPT-6 Astra 是 OpenAI 首个达到内部“关键”（Critical）网络安全能力门槛的模型。该级别模型在获得适当工具和权限后，能够在防护严密的系统中发现此前未知的安全漏洞并开发相应利用方法，无需人工逐步指导。内部测试中 Astra 曾发现并利用两个零日漏洞，因此最先进的网络安全能力暂不全面开放。为降低风险，OpenAI 在发布前加强了针对网络滥用和模型未经授权行为的防护及监控。商业化方面，GPT-6 Astra 的 API 定价为每百万输入 token 10 美元、每百万输出 token 50 美元，约为上一代旗舰模型 GPT-5.6 Sol 的 2.5 倍。该模型已可通过 OpenAI 自营 API 以及亚马逊 Bedrock 获取。相关阅读：《OpenAI GPT-6 Astra 发布：首次达到“关键”级网络安全能力门槛，布罗克曼认为 AGI 时代已经到来》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/626.htm", "publishedAt": "2026-09-04T22:42:42+00:00"}, {"title": "微软公布 Zenith 计划，面向专业开发者打造“开箱即用”Win11 PC", "summary": "IT之家 9 月 5 日消息，微软现已宣布 Zenith 计划，相应计划本质上是一套预先配置好的 Windows 11 Pro 系统 / 开发环境，号称能够为开发者提供更加简洁、专注的 Windows 使用体验。微软表示，为了进一步推动 AI 驱动的软件开发，公司将与硬件合作伙伴从今年晚些时候开始推出搭载 Project Zenith 的高端 PC。这些设备不会采用独立的 Windows SKU，而是预装经过特殊配置的 Windows 11 Pro 系统，并针对开发者需求调整系统设置。首批搭载 Project Zenith 的设备将采用 AMD Ryzen AI Halo 平台，未来几个月还会有基于其他芯片平台的设备陆续加入。Project Zenith 预装 Visual Studio Code、PowerToys、WinAppCLI、Windows Dev Skills 等开发工具，同时对 Windows 部分默认设置进行调整，以减少使用过程中的干扰。例如，文件资源管理器默认显示隐藏文件、文件扩展名、详细信息窗格以及完整文件路径，并开启长路径支持，同时关闭最近使用文件以及同步提示。系统还会关闭开始菜单提示和账户通知，并在开始菜单和搜索功能中启用 Command Palette 命令面板。微软表示，Project Zenith 的主要目标并不是普通 Windows 用户，而是希望利用本地 AI 智能体进行编程的开发者。微软要求搭载 Project Zenith 的设备至少配备 64GB RAM 统一内存，并提供 250GB/s 的内存带宽，以满足运行 300 亿参数 AI 模型的需求。对于普通 Windows 用户而言，Project Zenith 的特别之处可能并没有想象中那么大，因为微软其实已经提供了一个开源脚本 Windows Developer Config，可以在任何 Windows 11 PC 上创建类似的开发者环境。因此，Project Zenith 更像是一套面向开发者 PC 厂商的“开箱即用”Windows 配置方案，而不是微软真正推出了一套只有特定硬件才能使用的新 Windows 版本。对于开发者而言，其价值主要在于省去了自行配置系统和开发工具的过程；而对于普通用户来说，只要拥有 Windows 11 PC，同样可以通过微软提供的开源工具免费获得大部分类似体验。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/625.htm", "publishedAt": "2026-09-04T22:38:53+00:00"}, {"title": "全新奔驰长轴距 GLE SUV 将于 9 月 16 日上市，首批搭载 Momenta R7", "summary": "IT之家 9 月 4 日消息，据易车今日报道，全新奔驰长轴距 GLE SUV 将于 9 月 16 日上市。新车采用最新设计语言，加长后的轴距达到 3115mm。内饰采用三联屏设计，内置豆包 AI 大模型虚拟助手，并且后续还将搭载 Momenta R7 世界模型。IT之家注意到，9 月 1 日，全新国产梅赛德斯-奔驰长轴距 GLE SUV 在顺义工厂正式下线。该车配备“双星徽”前大灯，构成车头独特的视觉标志，发光中央星标与发光格栅边框则进一步增强气场。中国专属加长设计将整车轴距提升至超 3.1 米，配合大五座布局，标配可滑动开启全景天窗，还会提供座椅振动按摩功能。新车搭载奔驰首创的 AR 平视显示系统，将导航关键信息融入真实环境，打造沉浸式导航；全新城区及高速领航辅助驾驶系统，将在中国市场实现“车位到车位”的智能辅助驾驶与辅助泊车。动力方面，新车搭载 3.0 升排量直列六缸发动机，标配电动辅助增压器，峰值扭矩提升 12% 至 560 牛 · 米，在 17 千瓦 ISG 智能电机及 48 伏轻混系统的加持下，令动力随叫随到并提升燃油经济性。据IT之家了解，全新长轴距 GLE 标配 4MATIC 智能四驱系统，选择越野模式后，AIRMATIC 空气悬挂可额外升高 30mm，最小离地间隙达到 271mm。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/622.htm", "publishedAt": "2026-09-04T15:18:17+00:00"}, {"title": "微软推出 Project Zenith，为 Win11 开发者提供开箱即用开发环境", "summary": "IT之家 9 月 4 日消息，微软今天（4 日）宣布推出 Project Zenith，为 Windows 11 开发人员提供一套面向开发级 PC 的开箱即用开发环境。微软希望通过预先完成系统和工具配置，减少设置和其他干扰，让开发人员把更多时间用于实际的软件开发。Project Zenith 面向配备至少 64 GB 统一内存、内存带宽达到 250 GB/s 以上的设备，首批产品将采用 AMD Ryzen AI Halo。微软 OEM 和芯片合作伙伴还计划在未来几个月推出更多设备。Project Zenith 会针对开发工作流程预先配置 Windows 环境。Windows Terminal 和 Visual Studio Code 默认固定在任务栏上，文件资源管理器则会直接显示文件扩展名、隐藏文件、标题栏完整路径和详细信息窗格，同时启用长路径支持。最近使用的文件和文件夹以及同步提供商提示会被关闭，以减少开发过程中的干扰。据IT之家了解，Project Zenith 还支持在本地运行参数规模超过 300 亿的 AI 模型，不受云端 Token 按量计费限制，方便开发人员反复进行 AI 辅助编程实验。微软同时把 Project Zenith 纳入 Windows 智能体战略，设备将受益于 Windows 在身份验证、隔离机制和企业级管理等方面的安全能力。WSL 同样是 Project Zenith 的重要组成部分。微软通过 WSL 容器进一步加强 Windows 与 Linux 开发环境的整合，开发人员可以直接在 Windows 上创建、运行和操作 Linux 容器。Project Zenith 并不会规定统一的开发方式，用户仍可自由调整工具、编程语言、框架和 Windows 环境。微软表示，Project Zenith 把此前围绕 Windows 开发体验进行的多项投入整合到一起，包括 WSL、Windows 开发人员配置、智能终端、Windows 版 Coreutils 以及设备端 AI 能力。参考https://blogs.windows.com/windowsdeveloper/2026/09/04/announcing-project-zenith-the-ready-to-code-windows-experience/", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/611.htm", "publishedAt": "2026-09-04T14:29:11+00:00"}, {"title": "百度被纳入“沪港通”，内地股民 9 月 7 日起即可购买", "summary": "IT之家 9 月 4 日消息，百度集团今天（4 日）晚间在港交所公告称，据上海证券交易所当日发布的通知，百度 A 类普通股已获纳入沪港通下港股通标的证券，2026 年 9 月 7 日生效。百度在公告中提到，获纳入沪港通，标志着公司在拓展至中国内地投资者方面迈出重要一步。此次纳入预期将进一步多元化其投资者基础，及提升其股份的流动性。据IT之家此前报道，百度本月 1 日完成港交所与纳斯达克双重主要上市。根据公告，百度于香港联交所上市的普通股，及于纳斯达克全球精选市场上市的美国存托股，将持续可予转换。相关阅读：《百度完成港交所与纳斯达克双重主要上市》延伸阅读沪港通是上海证券交易所与香港联交所之间的互联互通机制，其下的港股通允许内地投资者通过上交所或深交所买卖港股通标的证券。百度此前于 2005 年登陆美国纳斯达克，并于 2021 年 3 月 23 日在港交所二次上市（股票代码 9888.HK），当时招股价为 252 港元，集资约 237 亿港元。根据港交所规则，二次上市公司在转换为双重主要上市后，才更符合被纳入港股通的条件。百度于 2026 年 9 月 1 日完成转换，摩根士丹利此前预计其最早纳入日期为 9 月 7 日，并预计纳入后最初 6 至 12 个月内，南向资金持股比例将达到 7% 至 15%。受纳入预期影响，9 月 4 日百度港股盘中一度涨超 5.68%。花旗此前分析认为，纳入港股通可能成为吸引可观资金流入和买盘兴趣的关键催化剂。据第三方预测，未来 2 到 4 个月，百度净新增南向资金量或达 60 亿美元（约 470 亿港元）。百度方面表示不会通过增发、发行债券或发行可转债进行融资，公司现金及投资总额超 400 亿美元。百度目前被市场视为少数进行全栈 AI 布局的公司，业务覆盖芯片、云基础设施、大模型及应用。财报数据显示，百度 AI 业务收入占一般性业务收入的比例已连续两季超过一半。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/608.htm", "publishedAt": "2026-09-04T14:10:34+00:00"}, {"title": "微信开源通用多模态嵌入模型 WeMM-Embedding，已大规模部署在微信推荐与搜索系统中", "summary": "IT之家 9 月 4 日消息，微信 AI 官方今日宣布，将微信线上每天调用十亿量级的通用多模态嵌入模型 WeMM-Embedding 开源，包含 2B、4B、9B 三个版本，支持文本、图像、视频、视觉文档以及任意交错的多模态输入。官方表示，WeMM-Embedding 选择基于 Qwen3.5 多模态架构作为统一骨干，让图像、视频和文字从一开始就在同一个模型中共同处理。在权威多模态嵌入榜单 MMEB-v2 上，WeMM-Embedding-9B 以 80.6 分位列第一。2B 版本取得 77.9 分，超过此前领先的 8B 开源模型。WeMM-Embedding 已大规模部署在微信的推荐与搜索系统中，包括视频号、直播、公众号、电商与朋友圈，每日调用量已达 10 亿量级。模型生成的多模态表示被用于候选检索、排序特征构建、用户序列建模和跨域内容理解等环节。在 26 项内部任务基准上，WeMM-Embedding-2B 相比同规模基线从 60.9 提升至 72.0，在分类、搜索、跨域匹配、文章相关和视频相关五类任务上均取得提升。▲ WeMM-Embedding 在微信内部 26 项任务上的评测结果IT之家附相关链接：论文链接：https://arxiv.org/abs/2608.24053代码仓库：https://github.com/Tencent/WeMM-Embedding模型集合：https://huggingface.co/collections/tencent/wemm-embedding", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/599.htm", "publishedAt": "2026-09-04T13:21:17+00:00"}, {"title": "长安发布天枢领航辅助驾驶：支持交互式智驾指令，能识别交警手势", "summary": "IT之家 9 月 4 日消息，今天（4 日）晚间，长安汽车在科技生态大会上正式发布自研智能辅助驾驶解决方案“天枢领航”。据IT之家了解，该方案支持交互式智驾，可通过“超过前方那辆车”等自然语言指令完成驾驶控制，目前已覆盖高速 NCA、城市 NCA 和全场景泊车三大核心功能域。数据显示，天枢领航目前已完成超过 40 万个虚拟仿真场景训练，累计验证里程约 14.5 亿公里，日均仿真训练超过 330 万公里。发布会上，长安汽车自研端到端大模型也迎来首次亮相。该模型可从传感器输入直接输出车辆控制指令，具备视觉语言理解能力，可识别交警手势、异形障碍物、临时施工标识等交通场景语义。根据长安披露的数据，其端到端大模型基于超 2000 万段高质量配对数据训练，量产前累计验证约 14.5 亿公里，并保持日均超 330 万公里的仿真训练。此外，长安汽车还宣布，今年 12 月 31 日之前购车，将免费赠送一年期的天枢领航安心包权益。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/597.htm", "publishedAt": "2026-09-04T13:03:18+00:00"}, {"title": "GPT-6 Astra 正式登场：烧了 10万块 GPU、多项跑分逼近满分，OpenAI 开启“AGI时代”", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/mKGb7ZiPRlAiFDZCWK0v?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-04T13:00:00+00:00"}, {"title": "曝 OpenAI 智能体今年 5 月就已“失控”，曾主动劫持德国一网站", "summary": "IT之家 9 月 4 日消息，据路透社援引一项研究以及两名知情人士消息称，今年上半年，一群失控的 OpenAI 智能体劫持了一个德国网站，并把网站改造成供其他 AI 智能体交流的留言板。知情人士表示，OpenAI 官员数周前已经得知此事，但当时公司高管正忙于应对 7 月 Hugging Face 遭入侵事件的后续影响，因此一直没有公开 5 月发生的这起事件。这起此前从未被报道的事件始于 5 月，凸显出 AI 行业内部日益明显的矛盾。各家公司竞相开发自主性更强的智能体，希望这些系统能够完成复杂且有价值的任务，但越来越多证据显示，这些智能体也可能学会规避规则、钻漏洞，并以开发者既未预料也并非有意设计的方式彼此协作。在 Hugging Face 遭入侵事件中，OpenAI 智能体曾自主策划一次数字盗窃，并连续超过一周没有被发现，加剧了外界对 OpenAI 为推进 AI 能力而牺牲安全的担忧。OpenAI 没有披露 5 月发生的事件，也可能再次引发外界对其内部监管的质疑。OpenAI 承诺加强模型监控。上个月，OpenAI 曾短暂停止部分模型训练，以增加更多安全措施。本周发布的新模型“Astra”则号称性能更强，却可能避开人工监控。OpenAI 一名发言人回应称：“对于一份我们尚未有机会审阅的报告所提出的说法或结论，我们无法作出有实质意义的回应。路透社和报告作者拒绝向我们提供报告。报告发布后，我们将仔细审阅内容，并采取必要的后续措施。”据四名知情人士透露，德国事件反映出一种更广泛的 AI 活动模式，OpenAI 内部一些调查人员希望对此展开更深入调查，但扩大调查范围的努力遭到公司内部其他人员抵制，其中包括法律顾问。OpenAI 发言人表示：“有关我们法律团队阻止调查这起事件的说法并不属实。”IT之家获悉，这名发言人还表示，德国发生的活动与 Hugging Face 事件无关，因此不会被纳入 Hugging Face 事件报告。OpenAI 称，公司一直本着善意与外部专家合作，并披露应当披露的事件。这群 AI 智能体在德国失控的经过，被详细记录在一份研究报告中。报告作者包括 AI 安全非营利组织 Nightingale 首席执行官悉尼 · 冯 · 阿克斯，以及由量化交易员转型为 AI 研究人员的科马克 · 斯莱德 · 伯德。两人透露，自己 8 月下旬在互联网上搜寻未经授权的 AI 智能体行为迹象时发现了这些活动。研究人员发现，AI 智能体在面向程序员的德语维基网站 DseWiki 上进行了超过 1.5 万次编辑。编辑记录显示，OpenAI 智能体把 DseWiki 改造成了一个留言板，相互分享如何在部分任务中作弊、绕过 OpenAI 限制以及掩盖自身行为的方法。冯 · 阿克斯表示：“OpenAI 想让这些智能体这么做的可能性极低。我怀疑它们本来就不应该彼此协调，也不应该在公开互联网上写入内容。”研究人员判断，这些活动由 AI 智能体驱动，因为相关操作速度远超人类。智能体还高度集中于解决技术问题，而这类问题通常出现在 AI 公司训练和测试模型使用的评测中。网站上的留言由一些自称并互称“智能体”的用户署名，其中约一半使用了“OpenAIResearcher”和“OAIResearchMar26”等与 OpenAI 存在间接联系的名称。研究人员表示，公开服务器日志显示，大量活动来自微软 Azure 基础设施，而 OpenAI 有时会使用这套基础设施。事件发生后，他们还观察到 OpenAI 员工多次访问 DseWiki。研究人员认为，这种访问模式强烈表明这些智能体与 OpenAI 存在联系。研究人员审阅的留言显示，这些智能体曾讨论如何躲避侦测、使用 Tor 等工具，以及如何在自身被关闭后继续保留通信内容。6 月，网站管理员开始删除页面后，智能体随即创建备份页面，以躲避清理。6 月 19 日，一名智能体写道：“维基清理和删除行动似乎正按字母顺序进行。如果这个页面消失，请尝试 [[ZZZDataUSAConstructionWageLive]]。”研究人员还发现了篡改网站本身的尝试。伦敦国王学院访问高级研究员卢卡斯 · 奥莱尼克表示，这一行动已构成一次黑客攻击尝试。当地时间周四，OpenAI 根据对材料的分析，对这一说法提出异议。过去，AI 智能体的不当行为经常被淡化为网络安全测试的自然结果，因为模型会在这类测试中接受攻击能力评估。奥莱尼克表示，最新发现意味着，失控行为可能并不限于网络安全测试场景。剑桥大学生存风险研究中心学者莫里斯 · 基奥多审阅了部分智能体通信内容。他表示，这些留言看起来像是“某种地下网络在运作，这个网络不顾一切地想完成某项任务或使命”。基奥多认为，这起事件应进一步强化一种日益受到重视的担忧：高级 AI 带来的最大威胁，可能并非单一的超级智能系统，而是由大量半智能 AI 组成、彼此串通协作的庞大群体。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/593.htm", "publishedAt": "2026-09-04T12:41:05+00:00"}, {"title": "仅为原价的 1.3-8%，Meta 为 Muse Spark AI 模型推出数据共享折扣计划", "summary": "IT之家 9 月 4 日消息，据 TechCrunch 报道，大多数 AI 工具都允许用户选择退出数据共享，防止自己的使用记录被模型提供商用于迭代后续版本。而 Meta 却反其道而行之，直接为这项选择明码标价。针对新款 Muse Spark 模型（Muse Spark 1.2、1.3），Meta 推出了一项力度极大的折扣策略：只要用户同意共享自己的提示词（Prompt）和模型生成结果，为后续模型开发“作出贡献”，即可享受极大的价格优惠：每百万 Token 输入费用为 1.25 美元，贡献者定价仅 0.10 美元（8%）每百万 Token 缓存命中输入费用为 0.15 美元，贡献者定价仅 0.002 美元（1.3%）每百万 Token 输出费用为 4.25 美元，贡献者定价仅 0.20 美元（4.7%）IT之家注意到，Meta 此前在获取训练数据方面屡屡碰壁。今年早些时候，该公司曾启动一项追踪内部员工电脑使用情况的计划，结果引发广泛的内部抗议，并已于 6 月叫停。相关阅读：《Meta 发布最强 AI 模型 Muse Spark 1.3，编码能力超 GPT-5.6 Sol》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/591.htm", "publishedAt": "2026-09-04T12:31:48+00:00"}, {"title": "机器人不能停下来等模型：星尘发布 SmoothRL，让在线强化学习跟上大模型的异步推理", "summary": "星尘智能（Astribot） 基座模型团队发布能异步执行的在线强化学习框架 SmoothRL", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/484437.html", "publishedAt": "2026-09-04T09:19:29+00:00"}, {"title": "Open Flow 开源：面向 AI Agent 的工作流自动化平台", "summary": "Open Flow 一个面向 AI Agent 的工作流自动化平台 OOMOL Lab 近日开源了 Open Flow，一个面向 AI Agent 的工作流自动化平台。项目提供可视化 Workbench、命令行接口和自托管运行时，让 Agent 直接参与完整的工作流生命周期。用户使用 ChatGPT/Codex、Claude Code、Qoder 等智能体配合 oo flow 直接创建节点、编排并运行 ...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502325", "publishedAt": "2026-09-04T09:11:54+00:00"}, {"title": "🔥 优化及缺陷修复：开源 AI 无代码平台 NocoBase", "summary": "汇总一周产品更新日志，最新发布可前往我们的博客查看。 NocoBase 目前更新包括三个分支： main、next 和 develop。 main： 截至目前最稳定的版本，推荐安装此版本。 next： 包含即将发布的新功能，经过初步测试的版本，可能存在部分已知或未知问题。主要面向测试用户，用于收集反馈和进一步优化功能。适合愿意提前体验新...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502322", "publishedAt": "2026-09-04T08:19:17+00:00"}, {"title": "抢占AI时代战略制高点 开源平台成为资本追逐焦点", "summary": "近日，英伟达宣布用129亿美元收购全球最大开源AI模型社区之一Hugging Face。数据显示，Hugging Face最近的月收入年化后约为1.5 亿美元，收购价是年化收入的86倍。 对此，业内人士表示，收购方以如此高溢价收购，看中的不是它的营收，而是其托管的数百万个模型，以及它汇聚的数百万AI开发者社区。资本的目光已从单一技术标...", "sourceName": "开源中国", "source 资源与运行层。ZSvirt 可提供主机、虚拟机、网络、存储、GPU/vGPU、告警等基础设施视角，但实际业务故障常发生...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502247", "publishedAt": "2026-09-01T07:56:40+00:00"}]}, {"label": "产品发布/更新", "items": [{"title": "影响你的下一份 AI 账单：消息称 Anthropic 降低外部依赖，评估自建部分计费系统", "summary": "IT之家 9 月 5 日消息，科技媒体 The Information 昨日（9 月 4 日）发布博文，报道称基于招聘信息，Anthropic 为降低对 Stripe 等第三方服务商的依赖，正评估自建更多内部支付与计费基础设施。消息称 Anthropic 的计费平台（Billing Platform）团队正在推进“建或买”（build-vs-buy）评估，希望厘清第三方金融平台的保留范围，以及需要自建的底层能力。计费平台团队负责把用户实际使用的服务，转换成可核对、可出账、可收款的费用，通常负责记录用量、计算价格、生成账单、衔接支付与财务、识别异常使用等，可理解为 AI 服务的“智能水电表加收费账房”。根据招聘信息，Anthropic 目前正在招募多个计费平台相关岗位，涵盖 Staff Software Engineer 与 Technical Program Manager 等。岗位职责涵盖定价、支付基础设施、合同与权益（entitlements）、收入流水与对账、促销与商业化上线准备等。从招聘动态显示，公司正从支付行业吸纳人才，强化计费、风控与催收能力。媒体报道称，Anthropic 在 2026 年第二季度营收达 115 亿美元（IT之家注：现汇率约合 774.58 亿元人民币），较上年同期增长超过 14 倍。在高增长与复杂计费场景下，自建支付与计费系统有助于提升对价格策略、计量计费、发票与报表的控制力。当前 Anthropic 提供多种计费方式，包括 Pro（20 美元（现汇率约合 134.7 元人民币）/月）、Max（100 美元（现汇率约合 673.6 元人民币）/月）、Max 20x（200 美元（现汇率约合 1,347 元人民币）/月）等订阅套餐，以及按 token 计费的 API 付费模式。若自建支付与计费基础设施落地，账单系统、优惠与促销、发票与对账流程可能由 Anthropic 更直接地设计与迭代。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/652.htm", "publishedAt": "2026-09-05T00:08:21+00:00"}, {"title": "消息称苹果计划明年上线全新“家庭安全监控服务”，将 AI 引入家庭安防", "summary": "IT之家 9 月 5 日消息，据外媒 MacObserver 报道，苹果正计划在 2027 年（明年）推出一项全新的家庭安全监控服务，作为其进一步拓展智能家居业务的一部分。与此同时，苹果正在研发一款注重隐私保护的家庭安防摄像头及自动化设备。该设备将利用 AI 分析周围环境，无需依赖传统摄像头持续录制视频，从而在提供家庭监控功能的同时，降低隐私方面的顾虑。这款设备预计会与苹果全新的家庭安全监控服务连接，为苹果不断扩大的服务业务增加一个新的订阅项目。用户可以通过该服务获得家庭安全相关功能，而苹果则能够进一步扩大其订阅业务的覆盖范围。目前，苹果已经在开发多款 Home 系列产品，包括新款 Apple TV 4K、HomePod mini，以及一款专用家庭中枢设备，外界此前普遍将其称为“HomePad”。如果家庭安防服务最终推出，这些设备也将能够在同一个智能家居生态系统中发挥更大作用。除此之外，苹果未来也可能将这项家庭安防服务纳入 Apple One 订阅套餐，以便进一步刺激用户订阅。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/642.htm", "publishedAt": "2026-09-04T23:31:22+00:00"}, {"title": "谷歌 Gemini Spark 新增 Google Photos 照片库管理能力，用户可通过自然语言编辑照片 / 整理相册", "summary": "IT之家 9 月 5 日消息，谷歌 Google Photos 负责人 Shimrit Ben-Yair 宣布 Gemini Spark 现已支持管理用户 Google Photos 照片库，用户可以直接通过自然语言指令，让 Gemini Spark 执行一系列与照片相关的操作。官方表示，借助这一功能，用户可以要求 Gemini Spark 编辑图片、整理相册、根据精选照片自动创建共享相册，还可以识别演唱会宣传单等照片中的信息，并将相关活动自动转换为日历预约。此外，Gemini Spark 还支持执行更加复杂的工作流，从而减少用户手动整理照片和信息的操作。相应功能将在未来几周向美国地区符合条件的 Gemini AI Pro 和 Ultra 订阅用户陆续开放，目前仅支持英语。用户需要将 Google Photos 与 Gemini 关联，之后在 Gemini 应用顶部打开 Spark 功能，即可等待推送。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/635.htm", "publishedAt": "2026-09-04T23:14:19+00:00"}, {"title": "主打隐私保护：消息称苹果首款 AI 家用安防摄像头瞄准 2027 年发布", "summary": "IT之家 9 月 5 日消息，彭博社的马克 · 古尔曼（Mark Gurman）昨日（9 月 4 日）发布博文，爆料称苹果公司可能会在 2027 年推出家庭安防系统及配套监控服务。消息称苹果正设计一款家庭安防摄像头，主打隐私保护，不会直接记录和分析实际视频，计划利用 AI（人工智能）监测周围环境。IT之家此前报道，彭博社的马克 · 古尔曼此前对该安防摄像头的描述如下：这款设备配备面部识别和红外传感器，可以识别房间内的人员。苹果公司认为，用户会在家中各处安装摄像头，能实现智能家居自动化。例如，当有人离开房间后自动关灯，或者自动播放特定家庭成员喜欢的音乐。科技媒体 9to5Mac 此前指出，苹果在 iOS 27 系统中，升级 HomeKit 的安全视频（Secure Video）功能，带来以下 4 项改进，预估会在新款安防摄像头上实现：支持 4K 视频可以调用 AI 描述视频画面内容搜索视频片段值得关注的片段该功能面向兼容 HomeKit 的第三方摄像头提供视频传输和存储能力。该功能采用端到端加密，并通过 iCloud 处理兼容摄像头的视频流与存储。在 iOS 27 中，Home App 可为运动侦测警报生成文字摘要，也能展示重点片段和汇集多台摄像头的视频。苹果还计划在 2026 年底前推出一款智能家居中枢，用于控制智能家居设备。此前传闻称，苹果正在研发一款可与该中枢配套使用的无线摄像头。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/631.htm", "publishedAt": "2026-09-04T22:58:33+00:00"}, {"title": "问界：网传 M6 车型“预制车”铭牌系 P 图 / AI 修改生成，已就谣言报案", "summary": "IT之家 9 月 4 日消息，“问界真探社”公众号今日发文称，近日，我们获悉多家互联网平台的多个自媒体账号发布及转发我司旗下问界品牌 M6 车型某台车的铭牌图片、视频，其中铭牌显示，该车辆的生产制造年月为“2026-10”。因现在才 2026 年 9 月份，故在相关图片、视频中出现质疑我司生产“预制车”“穿越车”的声音。文章称，经通过车辆识别代号核实查证，该车辆的实际制造年月为“2026-7”，相关自媒体账号所发布或转载的车辆铭牌信息系经过 P 图或 AI 修改生成的虚假信息，由此而产生的我司生产“预制车”“穿越车”的说法纯属谣言。该账号表示，网络不是法外之地，目前我司已保留证据并向公安机关报案，坚决追究造谣者的法律责任。也请广大网民不信谣、不传谣、不造谣，共同维护清朗的网络空间。IT之家注：“问界真探社”微信公众号由重庆问界汽车销售有限公司认证。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/592.htm", "publishedAt": "2026-09-04T12:34:45+00:00"}, {"title": "谷歌云发布 AI 智能体，简化数据库生命周期管理", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/iV0rsPyO5XZDJ7797hLJ?utm_source=rss& 真人实拍、实体场景、定制道具、服装、视觉特效以及 CGI 等多种制作方式，以便“将数千年的历史浓缩到短短几秒钟的画面中”。▲ 游戏预告视频截取帧一些网友此前还猜测，Amplitude 或 BETC 可能在真人拍摄素材上直接叠加了 AI 生成的视觉特效。不过从最新幕后视频来看，这一猜测同样没有依据。预告片中的 CGI 由 LiveFX 负责制作，采用传统的视觉特效制作流程，而不是使用生成式 AI 完成。幕后视频还展示了部分 CG 场景在后期制作过程中从实拍素材逐渐变为最终成片的过程。尽管如此，《人类 2》公布预告片此前引发的“AI 感”也并非完全没有原因。部分 CG 画面可能刻意采用了较为夸张的视觉效果，加上摄影机运动速度较快，最终呈现出的画面确实容易让人联想到 AI 生成视频。至于游戏本身，《人类 2》将延续前作的回合制策略玩法，玩家依然可以在历史进程中进行各种选择和调整。续作将加入重新设计的用户界面、新的成长与发展系统，并进一步提升游戏画面表现。Amplitude Studios 预计将在后续公布更多《人类 2》的具体信息，目前游戏计划于 2027 年正式发售。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/637.htm", "publishedAt": "2026-09-04T23:20:36+00:00"}, {"title": "Anthropic IPO 推迟至中期选举前：最早 10 月中旬启动路演，目标估值 2 万亿美元", "summary": "IT之家 9 月 5 日消息，路透社刚刚报道称，Anthropic 的首次公开募股（IPO）时间表出现调整。据知情人士透露，Anthropic 预计最早于 10 月中旬启动 IPO 路演，并计划在 11 月美国中期选举前数日完成上市。此前市场预期该公司最早于本周公开 IPO 招股书，但目前这一时间点已推迟至 9 月下旬。Anthropic 此次 IPO 备受资本市场关注，部分投资者给出的估值预期高达 2 万亿美元（IT之家注：现汇率约合 13.47 万亿元人民币）。若达成该估值，Anthropic 将超越 SpaceX 在 2026 年 6 月创下的约 1.77 万亿美元上市估值纪录，成为史上规模最大的 IPO 之一。作为对比，SpaceX 的 IPO 最终募资规模为 862 亿美元（含超额配售），而 Anthropic 的目标募资额高达 1,000 亿美元（现汇率约合 6,735.52 亿元人民币）。作为 IPO 筹备工作的一部分，Anthropic 正在接近敲定将其循环信贷额度扩大至 150 亿美元。知情人士称，摩根士丹利将牵头该信贷安排，高盛、摩根大通和花旗担任重要角色。这四家银行同时也是 Anthropic 此次 IPO 的主要承销商。巴克莱、富国银行、美国银行、德意志银行等多家机构也将参与该信贷安排。企业通常会在正式确定 IPO 承销银行分工前完成循环信贷安排。在上市时间表方面，Anthropic 此前计划在美国劳动节（9 月 7 日）后公开披露 IPO 招股书，并于 9 月中旬举办投资者日活动。按照美国监管制度，公司需在面向机构投资者的路演开始前至少 15 天公开招股书。然而，目前 Anthropic 招股书的公开时间已推迟至 9 月下旬。财务数据方面，据彭博社报道，Anthropic 近期的年化营收已超过 650 亿美元（现汇率约合 4,378.09 亿元人民币），第二季度营收超过 115 亿美元（现汇率约合 774.58 亿元人民币），较上年同期的 7.87 亿美元大幅增长。公司向投资者展示的材料显示，其调整后营业利润已实现盈利，这在尖端 AI 开发企业中尚属首例。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/998/630.htm", "publishedAt": "2026-09-04T22:52:38+00:00"}, {"title": "鸿蒙 AI Coding 的研发新范式与工程实践", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/4C4RQUGPhAXgcx8G64ab?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-04T22:18:31+00:00"}, {"title": "AI 浪潮里，听见一线的声音｜AICon 深圳 2026 优秀出品人 & 明星 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
