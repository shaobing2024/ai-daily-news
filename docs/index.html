验已经很有意思，但真正的乐趣还得是亲自扮演聊天机器人。当然，平台里有大量用户要求绘制冷门动漫角色，可自带的绘图工具十分简陋，功能堪比早期的微软画图软件，要在两分半钟内完成几乎是不可能的事。但这恰恰是乐趣的一部分：在极度受限的条件下尽力完成需求，同时还要维持自己是 AI 的假象。如果遇到不感兴趣的请求，你随时可以跳过。IT之家注意到，平台甚至还搭建了 Discord 社群与名人堂，名人堂里就收录了一幅还原度高得惊人的《星夜》演绎作品。诚然，平台的广告投放有些过度，也颇为突兀。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/990/198.htm", "publishedAt": "2026-08-15T22:58:38+00:00"}, {"title": "全球第一：阿里通义千问 AI 模型全球下载量破 30 亿，碾压 Meta 和谷歌", "summary": "IT之家 8 月 15 日消息，据彭博社今日报道，阿里旗下开源 AI 模型千问家族在过去六个月内全球累计下载量突破 30 亿次，超越 Meta、Alphabet 等一众竞争对手，成为全球下载量第一的 AI 模型。根据开源 AI 社区 Hugging Face 于当地时间 8 月 14 日发布的《开放模型现状》报告，2026 年谷歌模型下载量约 4.18 亿次，Meta 约 2.27 亿次，而阿里千问达到了 20.45 亿次（仅 Hugging Face Hub 上的下载量，不含魔搭社区等平台），远超其他竞品。阿里表示，千问系列累计已开源超过 460 个模型，并衍生出超 30 万个衍生模型。Hugging Face 报告指出，Qwen 的下载数据使其成为“开放 AI 生态系统中最大的基础之一”，“Qwen 已成为开发者决定微调和部署哪些模型的默认工作流的一部分”。报告显示，基于 Qwen 的衍生模型在 Hugging Face 上达到 151,448 个，是 Meta 的 2.6 倍，是 Llama 系列仓库的 4.7 倍。谷歌衍生模型数为 82,506 个。Hugging Face 报告显示，2026 年中国前沿 AI 实验室发布的最大开放模型参数规模普遍超过美国实验室。中国实验室月上限在 7540 亿至 2.78 万亿参数之间，美国多数月份低于 1300 亿参数。中国模型的授权也更为宽松。在 2026 年发布的 178 个 20B 参数以上的中国模型中，59% 采用 Apache 2.0 协议，22% 采用 MIT 协议，没有一个带非商业限制。报告指出，1B 以下参数模型占历史累计下载量的 83%，100B 以上仅占 1%。Qwen 的 GGUF 格式本地部署模型每月下载量达 3960 万次，接近 Gemma 的两倍，是 Llama 的五倍以上。Hugging Face 提醒，下载量不直接代表模型质量或市场份额，API 调用和私有部署未纳入统计。相关阅读：《消息称阿里计划向下一代千问 Qwen 开源模型大型商用用户收取营收分成》《阿里巴巴千问 Qwen3.8-Max 模型正式上线，总参数量 2.4 万亿》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/990/187.htm", "publishedAt": "2026-08-15T15:10:36+00:00"}, {"title": "另类 AI：前谷歌员工打造“聊天机器人”ChatTJB，不过背后全是真人回复", "summary": "IT之家 8 月 15 日消息，多年来，人们一直被警告 AI 可能抢走工作。据《财富》杂志当地时间 12 日报道，32 岁的前谷歌员工塔克 · 布莱恩特决定反过来还以颜色，并创建了由真人回答问题的网站 ChatTJB。用户面对的仍是普通聊天框，输入问题后等待回复。真正不同的是，另一端根本没有大语言模型，回答问题的是布莱恩特本人，以及 1 万多名申请加入、帮助他回复用户的人。布莱恩特最初产生这个想法，是因为他担心人们把越来越多的思考交给 AI，却很少认真检查 AI 提供的答案。布莱恩特透露，自他花 6,000 美元（现汇率约合 40,534 元人民币）在旧金山竖起 ChatTJB 广告牌以来，网站已经收到超过 10 万条提问，志愿者等候名单每天还增加约 1000 人。最初只是一个探讨人们依赖 AI 的艺术项目，后来却形成了 AI 热潮中最典型焦虑的一种奇特反转：企业争着让机器越来越像人，布莱恩特却发现，有很多人愿意看到人像机器一样回答问题。网站刻意采用 ChatGPT 流行后十分常见的极简设计，只有文本框、用户提出的问题，以及过一段时间才出现的回答。最初，这些问题都由布莱恩特亲自阅读和回复。今年夏天，布莱恩特又用一块广告牌把这个玩笑说得更直白。广告把 ChatTJB 宣传为“由 AI 驱动的领先聊天界面”，旁边一个小星号则说明，这里的 AI 其实是“普通人”（IT之家注：average individual）的缩写。在收到的众多问题中，布莱恩特一直忘不了一条留言。有人在蜜月第一晚写信询问，自己始终无法彻底放松下来，产生这种感觉是否正常。“我想，就是从那一刻开始，这个项目不再只是一件超现实的讽刺作品，而逐渐变成了一个让人们认真和一个心怀善意、但毫无疑问十分普通的人聊天的地方。”随着提问量激增，布莱恩特本人已经很少继续作答。高峰时期，ChatTJB 每小时会收到 5000 多条提问，远远超过一个人能够处理的范围。布莱恩特目前已经基本停止亲自回答，而是由志愿者“代劳”。ChatTJB 从一开始就不是为了赚钱。不过，项目意外走红，也让布莱恩特看到了原本没有明确计划过的发展可能。“我已经和几位有兴趣以不同方式参与这个项目的人聊过。”目前，他仍把 ChatTJB 看成自己想尝试的多个艺术项目之一，而且倾向于让它保持短期性质，同时并未彻底排除继续发展的可能。“如果有合适的合作伙伴愿意帮助把它做成一个能够持续下去的项目，我很愿意和他们谈谈。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/990/184.htm", "publishedAt": "2026-08-15T14:53:09+00:00"}, {"title": "菲尔兹奖得主马丁 · 海尔：AI 数学推演已达博士水平，中国基础科学投入令人印象深刻", "summary": "IT之家 8 月 15 日消息，2026 国际基础科学大会于 8 月 9 日在北京开幕。菲尔兹奖获得者、中国科学院外籍院士马丁 · 海尔出席开幕式并担任颁奖嘉宾。他在接受央视《高端访谈》专访时表示，大会覆盖面极广，涵盖纯数学、应用数学、理论物理乃至工程学领域。谈及人工智能对数学研究的影响，马丁 · 海尔认为，人工智能在数学能力上进步巨大，已经可以完成博士层级的数学推演，成为实用性极强的工具。但他同时指出，数学家所关注的恰恰是那些无法通过自动化手段解决的问题。马丁 · 海尔表示，人工智能会改变数学学科，推动研究转向不同方向，大幅提速部分工作，甚至让部分细分领域缩减，但不会终结数学，只会改变数学家的研究模式。他并不认同“两年内人工智能数学能力全面超越人类数学家”的判断，他认为人工智能在特定领域表现出众，但不代表在所有数学工作上都能全面超越人类。对于中国基础科学的发展，马丁 · 海尔评价称，过去五到十年，中国数学研究水平实现质的飞跃。中国政府向数学乃至整个基础科学领域持续投入大量资源，并通过长期政策吸引海外学者归国，已经成功吸引大批优秀人才回国。他还提到，如今大量优秀青年科研学子选择留在中国攻读博士学位，完整的学术生涯全程在中国完成，这一点令他印象深刻。今年，两位中国数学家邓煜、王虹获得菲尔兹奖（IT之家注：数学界最高荣誉之一，每四年颁发一次）。马丁 · 海尔认为，这一结果证明中国涌现出的顶尖数学家已经斩获该领域最高荣誉。马丁 · 海尔本人于 2014 年因对随机偏微分方程理论的贡献获得菲尔兹奖。他在专访中解释，随机偏微分方程用于描述带有随机扰动的系统演化，例如海面波浪可视为受风力随机作用的偏微分方程，该理论可应用于物理、金融等多个领域。马丁 · 海尔本科至博士阶段学习物理，后转向数学研究。他同时是一名程序员，学生时代开发的音频处理软件 Amadeus 至今仍在更新使用。他建议青年科研人员找准自己真正热爱的方向，不要单纯因为某个研究方向当下热度高就选择投身其中。2026 国际基础科学大会以“聚焦基础科学，引领人类未来”为主题，多位菲尔兹奖、图灵奖得主及中外院士、学者代表出席。相关阅读：《菲尔兹奖得主邓煜谈 AI：已能帮助数学证明，但不能替代独立思考》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/990/181.htm", "publishedAt": "2026-08-15T14:29:23+00:00"}, {"title": "索尼 PS5 Pro 增强版 PSSR 技术揭秘：让 AI 少干活，画质反而更好", "summary": "IT之家 8 月 15 日消息，索尼 SIE 首席软件工程师丹尼尔 · 克雷格在 SIGGRAPH 2026 会议上详细介绍了 PlayStation 5 Pro 上增强版 PSSR（IT之家注：PlayStation 光谱超分辨率）技术的重新设计思路。新版 PSSR 的核心变化在于让 AI 承担更少的工作量，而非扩大神经网络规模，以此实现画质提升与资源占用降低。据介绍，初代 PSSR 将几乎整个重建流程交由色彩预测网络（CPN）处理，由模型直接预测输出颜色。后来，索尼与 AMD 的工程师发现，这种方式导致了从 HDR 处理到时序重建再到高倍率超分辨率的一系列问题。在 PSSR 增强版中，团队恢复了大部分传统重建流程，将 CPN 替换为核预测网络（KPN）。KPN 不再直接预测最终像素颜色，而是预测混合权重，实际的混合操作由传统滤波直接执行。由于模型不再需要隐式处理 HDR 色彩，其容量得到更高效利用。团队还重新设计了与历史数据的连接，改善了梯度流动，使网络能够学习更长的时序关系。此外，工程师引入了一种输入空间椭圆高斯滤波器，以确保在高倍率超分辨率下仍保持有效性，解决了原始模型在 2.5 倍和 3 倍图像重建中的问题。克雷格展示的结果显示，升级版模型在图像质量和时序稳定性方面均有提升，尤其是在较低输入分辨率下，同时 GPU 时间和内存占用也有所降低。在参数分配上，初代 CPN 仅有约 30% 的参数处于最低的 540p 分辨率层级，而新版 KPN 将约 90% 的参数分配在 540p 及以下，在 4K 层级几乎不做计算。训练时间也从初代的大约 4 个 GPU 月缩短到不足 1 个 GPU 周。相关阅读：《索尼 PS5 Pro 推动 PSSR 2.0 普及：Beta 系统更新后自动启用画质增强选项》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/990/159.htm", "publishedAt": "2026-08-15T11:19:30+00:00"}, {"title": "英伟达 CEO 黄仁勋出手安抚 AI 算力市场：部分 AI 投资项目可获最高 25% 残值支持", "summary": "IT之家 8 月 15 日消息，英伟达 8 月 11 日宣布与阿波罗、贝莱德、黑石、布鲁克菲尔德、高盛和 KKR 合作，建立独立融资平台，计划随着时间推移调动超过 5000 亿美元的第三方资本，用于 AI 基础设施建设。英伟达 CEO 黄仁勋在声明中提到：公司可能会在某个时候针对部分 AI 基础设施投资项目提供最高 25% 的残值支持，以帮助金融机构降低相关资产融资风险。英伟达将这一计划定位为推动 AI 算力成为可投资资产类别的一项举措。公司认为，过去企业通常自行采购 GPU 并建设数据中心，而未来 AI 工厂可以像其他生产性基础设施一样，通过长期机构资本和标准化融资平台进行建设。黄仁勋表示，这些融资平台面向符合条件的 AI 实验室、企业和 AI 云服务商。超过 5,000 亿美元（IT之家注：现汇率约合 3.38 万亿元人民币）指的是相关平台计划随着时间推移调动的第三方资本总规模，并非英伟达的收入、单一基金规模，也不是对某一家客户的单笔融资承诺。根据英伟达公布的信息，参与合作的金融机构将独立评估具体项目，包括客户情况、算力需求、利用率、现金流和资产残值等因素。英伟达负责提供 AI 工厂平台，而长期资本和融资则由金融机构提供。此次计划公布后，市场关注点之一是这种融资模式是否会形成所谓“循环融资”。英伟达对此回应称，相关融资平台将由独立的长期机构资本参与，具体项目也需要经过金融机构独立评估，公司并不会替投资机构决定是否提供融资。在残值支持方面，黄仁勋表示，在部分情况下，英伟达可能为单个项目提供最高 25% 的残值支持，但会逐个项目进行审慎评估。英伟达强调，这一支持机制以资产残值为基础，旨在补充而非取代金融机构自身的风险评估。所谓残值支持，核心是降低金融机构对 AI 算力设备未来价值下降的担忧。如果相关项目出现违约或资产处置情况，GPU 等设备的实际残值低于融资模型预期，英伟达提供的支持机制可以覆盖部分风险，但并不意味着英伟达承担整个项目的融资责任。英伟达认为，其 AI 算力基础设施具有一定的资产属性。公司所称的“AI 工厂”并不只是 GPU，还包括高速网络、系统软件、AI 框架以及 CUDA 开发生态，可以运行语言、视觉、语音、生物、机器人等不同类型的 AI 工作负载。黄仁勋认为，NVIDIA 平台具有较广泛的客户和应用基础。当某一客户需求发生变化时，相关算力基础设施理论上可以重新部署给其他客户、云服务商或运营商，因此资产并非只能服务于单一用户。英伟达还强调，软件升级可以延长硬件的经济使用周期。公司以 A100 为例称，该产品于 2020 年推出，到 2026 年仍在用于 AI 训练、微调、推理和高性能计算，并有客户继续签订多年算力部署协议。相关阅读：《NVIDIA 牵头组建 5000 亿美元人工智能计算基础设施融资平台》《英伟达 CEO 黄仁勋谈 5000 亿美元融资计划：AI 芯片已是“投资级资产”》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/990/154.htm", "publishedAt": "2026-08-15T10:41:07+00:00"}, {"title": "面向多模态推理的高效长上下文建模｜AICon深圳", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/OgbViICigja8tasE0lwi?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-15T10:00:00+00:00"}, {"title": "智能体成“逃课神器”？部分美国学生用 AI 代替自己完成整门网络课程", "summary": "IT之家 8 月 15 日消息，据《纽约时报》8 月 10 日报道，随着智能体模型越来越普及，部分美国学生已经不满足于让聊天机器人帮忙查答案，而是直接把整门网络课程交给 AI 智能体。AI 可以在后台替学生完成课程任务，学生本人则把时间拿去刷手机、玩游戏。AI 作弊从代写作业发展到几乎“代上课”的程度，暴露出网络教育相较实体课堂更难防范作弊的问题。线下课程可以通过考试、口头展示等方式确认学生是否真正掌握知识，网课却很难采用同样的手段。网课的大部分活动都在屏幕上完成，学生因此可以让 AI 智能体登录 Canvas、Blackboard 等学习平台，替自己做测验、观看课程视频、写论文，甚至冒充学生本人参加讨论。IT之家获悉，AI 公司几乎没有采取措施阻止这种行为。学生最常使用的 ChatGPT、Gemini 和 Grammarly 都不会拒绝替学生完成整篇论文的请求。这些公司也没有阻止 AI 模型登录 Canvas、Blackboard 等学习平台，也未理会教育工作者关于“模型在这些平台上使用时应自我标识”的请求。其中，部分公司的理由听起来相当牵强。开发 AI 浏览器的 Perplexity 在给《纽约时报》的声明中称，要求 AI 智能体在学习平台上表明身份会让学生的隐私和安全面临风险。从事网络课程教学已有 20 年的凯伦 · 科斯塔回忆，自己曾问：“我现在只是在和机器人互动吗？”加州州立大学系统的卡罗尔 · 休厄尔称：“我没有得到任何关于如何劝阻学生使用 AI 的指导。我得到的却是更多学习如何使用 AI 的机会。”值得一提的是，加州州立大学系统去年与 OpenAI 签署了一项价值数百万美元的协议。许多大学仍不愿全面禁止 AI，但已经有学校开始寻找应对办法。芝加哥大学法学院最近把禁止在课堂上使用手机、平板电脑和笔记本电脑纳入新的“AI 战略”，规定适用于一年级课程。普林斯顿大学则在一起 AI 作弊丑闻后，取消了延续一个多世纪的“荣誉守则”传统。按照过去的做法，学生可以在无人监考的情况下参加考试。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/990/115.htm", "publishedAt": "2026-08-15T09:05:10+00:00"}, {"title": "至知研究院提出大模型可解释性新路线：拆权重，数据成本不到1%", "summary": "理解大模型，无需再训练一个替代网络", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/473876.html", "publishedAt": "2026-08-15T06:42:23+00:00"}, {"title": "根治AI音乐通病！这家国产音乐模型正面挑战SUNO", "summary": "音潮API限时免费开放", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/473866.html", "publishedAt": "2026-08-15T06:36:05+00:00"}, {"title": "DeepSeek 把 Harness 开源了：模型、工具、Agent Loop 全是插件", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/artic LFO。用户可以直接把 MIDI 数据交给 AI 作为提示。例如，用户可以先弹一组和弦，再让 Suno 将 MIDI 生成音频、续写旋律，或者根据已经演奏的部分创作 B 段。Studio 2.0 还增加了 DAW 常见的自动化控制，用户可以随编曲进程调整单独音轨的声像和音量。Suno 还把聊天机器人直接整合进 Studio 界面，用户可以让 AI 创作歌词或生成新的吉他声部。聊天机器人会读取当前工程的音乐内容，而不是脱离项目单独生成结果。用户只要提出“让这条人声音轨听起来更好”之类的要求，AI 就可以自动添加混响、压缩和 EQ。Studio 2.0 同时新增了一套基础内置效果器，支持失真、延迟、混响、压缩和 EQ。聊天界面中最值得注意的功能，是让用户通过 AI 创建自定义效果插件，从独特的混响、砖墙式压缩到合唱效果均不在话下。其形式类似 Polyend 的 Endless AI 吉他效果器。生成的效果还会保存在用户账户中，之后可以继续调用。Suno Studio 2.0 的功能明显比第一版丰富，但聊天功能的测试版也进一步减少了用户亲自动手的必要。在演示中，Suno 的亨利 · 菲普斯先修正弹错的音符并进行 MIDI 量化，随后坦言，这些工作其实应该直接交给聊天机器人完成。人声效果链的选择也被交给 AI，而不是由他自己逐项挑选效果器。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/990/190.htm", "publishedAt": "2026-08-15T15:28:28+00:00"}, {"title": "极摩客 EVO-X5 迷你主机现身 Geekbench：锐龙 AI Max+ Pro 495 处理器", "summary": "IT之家 8 月 15 日消息，一款型号为 EVO-X5 的极摩客迷你主机近日现身 Geekbench 跑分数据库，新机搭载锐龙 AI Max+ Pro 495 处理器。IT之家查询 Geekbench 数据库发现，这款迷你主机配备 123.68GB 内存，CPU 最高频率可达 5.25GHz，拥有 16 核心、32 线程；配备 Radeon 8065S 显卡，Vulkan 跑分为 103,729 分。值得注意的是，Geekbench 目前仍将锐龙 AI Max+ Pro 495 标记为 Strix Halo 平台，而 AMD 官方称该处理器为 Gorgon Halo 平台。极摩客曾在此前确认，其 EVO-X3 迷你主机将提供锐龙 AI Max+ Pro 495 配置，最高可选 192GB 内存。不过本次曝光的设备应该是工程样机，我们仍需等待官方确认。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/990/177.htm", "publishedAt": "2026-08-15T13:59:10+00:00"}, {"title": "群联谈存储短缺：NAND 新增产能最快需 4 年，供应紧张或持续多年", "summary": "IT之家 8 月 15 日消息，群联电子 (股) 公司董事长兼总经理潘健成在财报会上表示，NAND 闪存新扩建的产能从投资到真正量产所需时间远比市场预期更长，供需吃紧局面可能延续多年。他指出，市场普遍认为存储芯片价格上涨后，原厂即可快速增加资本支出扩充产能，但实际情况并非如此。他近期与 NAND 原厂高层交流时曾询问从投资到量产需要多久，原先估计约两年，但对方给出的答案是“四年”。即便目前 NAND 价格上涨，群联也不会大量出售手中库存，否则未来若无法重新取得足够货源，可能影响长周期客户专案供货。AI 已成为群联重要增长来源。2026 年第二季度，群联合并营收达 678.88 亿元新台币（IT之家注：现汇率约合 142.56 亿元人民币），环比增长 65.7%，同比增长 279.5%；毛利率攀升至 65.3%，创历史新高；税后净利润达 262.19 亿元新台币，环比增长 72.8%，同比增长约 34 倍。潘健成认为，过去 NAND 需求主要由 PC 和智能手机出货，以及单台设备存储容量提升推动。进入 AI 时代后，生成式 AI 产生的图片、视频和 AI Agent 数据量持续增加，存储需求正在从传统的消费电子景气周期驱动，逐步转向更加长期的结构性增长。不过，NAND 价格上涨也会推高群联自身的采购成本，因此产品售价上涨并不意味着毛利率会同步增加。群联第二季度毛利率达到 65.3%，创历史新高，但公司仍需要通过研发、企业级 SSD 以及 AI 相关平台提升产品附加价值。相关阅读：《群联 2026Q2 总收入同比增长 279.5%，净利润同比增长 3419.3%》《群联 CEO 潘健成：Flash 缺货是长期且不可逆趋势，公司订单已排到 2027 年 Q2》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/990/129.htm", "publishedAt": "2026-08-15T10:01:09+00:00"}, {"title": "调查发现美国年轻人普遍不信任 AI，以及主张“拥抱 AI”的科技巨头", "summary": "IT之家 8 月 15 日消息，据外媒 TechRadar 今天（15 日）报道，CNBC 与 Generation Labs 对 1088 名 18 至 34 岁美国人进行的一项新调查显示，美国年轻人对 AI 的戒心正在加深，而且这种不信任也延伸到了积极推动 AI 发展的企业高管和行业倡导者。绝大多数受访者称，自己并不信任马斯克、奥尔特曼和扎克伯格等大举投资 AI 的企业领导者。45% 的受访者认为 AI 会对自己的职业发展产生负面影响，认为 AI 能给自己带来帮助的只有 10%。调查还询问了年轻人对未来的其他担忧，经济和就业压力位居前列。AI 带来的威胁也明显存在，并随着应用不断扩大，越来越多地影响日常生活。这种不信任同样指向了 AI 行业最具代表性的高管。调查列出了 9 名 AI 行业重要人物，并询问受访者是否相信他们未来会负责任地处理 AI 问题。IT之家从数据中获悉，结果没有一人获得正面评价。帕兰提尔 CEO 亚历克斯 · 卡普的不信任率最高，达到 81%；帕兰提尔董事长彼得 · 蒂尔为 79%；Alphabet CEO 桑达尔 · 皮查伊和 Anthropic CEO 达里奥 · 阿莫代伊均为 75%。OpenAI CEO 萨姆 · 奥尔特曼、Meta CEO 马克 · 扎克伯格、英伟达 CEO 黄仁勋和 SpaceX CEO 埃隆 · 马斯克的不信任率都在 70% 左右。微软 CEO 萨提亚 · 纳德拉的表现相对“最好”，但仍有 65% 的受访者称不信任他。对于 AI 应该由谁监管，40% 的受访者认为应由“联邦政府”制定规则，36% 支持交给“独立专家机构”，只有 8% 认为 AI“不应该受到监管”。在数据中心建设问题上，60% 的受访者认为建设速度“必须放缓”，支持“加快建设”的只有 15%。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/990/119.htm", "publishedAt": "2026-08-15T09:30:41+00:00"}, {"title": "源神启动！一张消费级显卡跑“Opus级”Agent，Qwen3.8-27B多项榜单反超Claude", "summary": "推理能力还能自定义", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/473669.html", "publishedAt": "2026-08-15T06:05:31+00:00"}, {"title": "DeepSeek Harness插件一夜燃爆GitHub：长期记忆、电子宠物、4399小游戏全来了", "summary": "大家已经给DeepSeek装上了啥", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/473597.html", "publishedAt": "2026-08-15T05:53:01+00:00"}, {"title": "从“工具”到“同事”——AI 时代的产品进化", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/ABCk0CzDtSKMHbPXCdWF?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-14T14:37:37+00:00"}, {"title": "AI 智能体开始参与交付，谁来证明它没有“动手脚”？IBM 与 Red Hat 给出一套新方案", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/AJz1m242RSJLpXpsC1eg?utm_source= 4810?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-08-13T07:40:36+00:00"}, {"title": "Pixel 11 上手：AI 不支棱，涨价不消停", "summary": "差不多得了#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1675041?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-08-13T06:00:08+00:00"}]}, {"label": "论文研究", "items": [{"title": "OpenAI 奥尔特曼：大学读四年可能有点久，两年就够了", "summary": "IT之家 8 月 15 日消息，据《商业内幕》今天（15 日）报道，OpenAI CEO 萨姆 · 奥尔特曼认为，自己大学只读两年恰到好处，而且可能也适用于其他人。“我觉得两年里已经学到了很多，再继续读下去，新增的收获可能会越来越少。”在奥尔特曼看来，现在的大学教育未必还需要维持传统的四年制。“我一直在想，世界发展到现在，大学或许不需要读这么久。当然，大学仍然提供了很好的机会，让人认识朋友、开始独立生活，也能亲手参与一些项目。”2005 年，奥尔特曼在斯坦福大学读了两年后退学，与他人共同创办位置分享应用 Loopt。Loopt 后来成为 Y Combinator 首批孵化项目之一，也由此开启了奥尔特曼与 Y Combinator 的长期联系，直到后来亲自执掌。奥尔特曼在一场面向科技实习生举办的峰会中提到，如果自己当时再留在学校两年，未必会有多大价值。“所以，我很满意自己的选择，只是人生不可能重新再做一次同一个实验。我现在认识很多根本没上过大学、照样发展得很好的人。”类似观点在科技界并不少见。奥尔特曼的导师、PayPal 联合创始人彼得 · 蒂尔就长期支持年轻人放弃传统大学道路。蒂尔资助的奖学金计划向年轻人提供 25 万美元（IT之家注：现汇率约合 168.9 万元人民币），鼓励他们完全不读大学，或者至少暂时休学。谈到自己过去同时兼顾 OpenAI 和其他事务的经历时，奥尔特曼认为，要求刚起步的人从一开始就只做一个项目，并不是好建议。“刚开始时同时做几个项目完全没问题，因为你还不知道哪个会成功，不知道自己最终会对什么感兴趣，也不知道什么真正适合自己。真正的错误，是当你已经确定自己最坚定看好的方向之后，还不愿意忍痛放下其他事情。到了那个时候，就应该摆脱其他项目，全力投入。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/990/156.htm", "publishedAt": "2026-08-15T10:45:26+00:00"}, {"title": "北京 2026 E-Town 机器人消费节启动：促消费资金提至 1800 万元，首次打造机器人消费街", "summary": "IT之家 8 月 15 日消息，北京经济技术开发区（简称北京经开区，也称北京亦庄）今日宣布启动“2026 E-Town 机器人消费节”。本届消费节以“买卖机器人，到北京亦庄”为主题，在 2025 年基础上全面升级，旨在打通从技术到市场的“最后一公里”。据北京亦庄官方介绍，2025 年 8 月，全球首届 E-Town 机器人消费节在亦庄举办，整体销售额突破 3.3 亿元，售出机器人及相关产品超 19 万台。消费券直接撬动销售额超 7000 万元，京东全站机器人及 AI 品类日均销售额环比增长 101.9%。全球首个具身智能机器人 4S 店在 16 天内产生多笔百万级订单，100 万元以上订单占比达 25%。今年消费节的促消费专项资金从首届的 1500 万元提升至 1800 万元，重点向 AI、具身智能产业倾斜。消费券领取流程大幅简化，支持微信小程序手机号一键验证。据介绍，此次消费节联动 2026 世界机器人大会，创新构建“会、展、赛、节”四位一体活动模式。在去年基础上新增 9600 平方米机器人消费街区，设置品牌展示、科技文创、特色餐饮、互动娱乐四大板块近百个展位，投放 50 余款覆盖教育、养老、家庭场景的机器人体验设备。首创“内场看未来、外场买现在”双核消费模式，并设置 AR 集章打卡、文创售卖等环节。北京经开区有关负责人表示，今年扩充了消费街区的规模和业态，让这里不仅是一个展示窗口，更是一个能真正“买起来”的消费空间。本届消费节还全新推出三条工业科技研学线路 ——AI 智能探索、航天逐梦和智驾未来，串联星海钢琴、北京火箭大街、南海子麋鹿苑、北汽极狐等区内产业与文旅点位，由无人驾驶小巴串联。京东开设机器人消费节专属专区，上线 600 余款机器人商品，配套线上专项补贴，开展首发、专场促销、直播带货等活动。消费券补贴覆盖 AI 感知设备、AI mini 主机、烫画机等新兴智能硬件品类。8 月 19 日至 23 日，2026 世界机器人大会将在北京亦庄北人亦创国际会展中心举办。大会现场将首次打造机器人消费街 ROBOT SHOPPING STREET。消费街分为室内和户外两大区域。室内区位于 A 馆和 C 馆之间的玻璃连廊，包括 Robot-Mall、网红机器人体验项目、智能厨站、官方特许文创商店等。户外区位于 B、C 馆之间，覆盖品牌特展、大型展区、特色餐饮、科技文创四大展区，汇集 90 余位摊主。消费街特别设置 AR+ 实体双模式集章寻宝活动，全场共设 10 枚印章。北京经开区有关负责人表示，未来将持续深化“人工智能 + 消费”融合发展，以消费节为纽带、以世界机器人大会为舞台，推动文商旅体展深度融合，将“买卖机器人，到北京亦庄”转化为品牌符号。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/990/110.htm", "publishedAt": "2026-08-15T08:25:59+00:00"}, {"title": "梁文锋身价一年暴涨 3850%，登顶全球亿万富豪增速榜首", "summary": "10亿美元变成395亿美元，只用了一年。 海外金融研究机构 BestBrokers 基于福布斯实时富豪榜数据（2025年7月27日至2026年7月27日）发布了一份全球亿万富翁财富涨幅排名。DeepSeek 创始人梁文锋以 3850% 的年度财富增长率拿下全球第一，把第二名甩开了三倍多。 梁文锋 2025 年净资产为 10 亿美元，截至 2026 年统计节点已暴...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/501895", "publishedAt": "2026-08-12T06:12:32+00:00"}, {"title": "动态语言对 AI 编程更友好？开发者用三个真实任务给了答案", "summary": "\"动态语言对 AI 编程更友好，因为少了类型声明，代码更紧凑，token 消耗更少。\"这个说法在过去一年被反复引用，几乎成了 AI 编程语言选择的常识。Dan Luu 设计了三组严格实验，给出了一个不那么舒服的答案：这个说法在小任务上可能成立，但在真实规模的编程任务面前，它消失了。 Dan Luu 的实验设计值得先讲清楚。他不做...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/493223/pl-tokens", "publishedAt": "2026-08-11T09:13:20+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "柏能集团警告：AI 热潮加剧供应紧张，显卡短缺或推高 PC 价格", "summary": "IT之家 8 月 15 日消息，据《海峡时报》报道，总部位于新加坡、旗下拥有映众、索泰等品牌的柏能集团昨日警告称，未来几个月的显卡供应情况可能进一步恶化。该公司对此表示，PC 市场仍面临巨大挑战，供应受到严重限制，导致零部件成本大幅上涨，进而导致消费者需求下降。入门级显卡将面临较严重的短缺现象，可能导致台式电脑制造成本增加。IT之家从原报道获悉，虽然柏能集团并没有给出供应短缺的具体原因。但结合目前 PC 市场的形势我们不难看出，AI 热潮带来的内存短缺，正导致整个 PC 市场受到影响。柏能透露，供应短缺问题已经影响到显卡以外的产品，CPU、内存等 PC 零部件的交付周期已大幅延长，影响整个行业。随着这种情况下半年进一步加剧，各大 PC 厂商的处境将更加严峻。但该公司计划下半年出货全新 GPU 服务器和 AI 产品，抵消消费电子领域的增长疲软。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/990/189.htm", "publishedAt": "2026-08-15T15:23:57+00:00"}, {"title": "谷歌安卓负责人萨米尔 · 萨马特畅想未来：只要说清想做什么，系统就能替你完成", "summary": "IT之家 8 月 15 日消息，据美国 CNN 当地时间 12 日报道，谷歌安卓生态系统总裁萨米尔 · 萨马特称，谷歌规划新版安卓时，通常会提前大约三年考虑消费者未来如何使用手机。“目前我们对安卓的设想是，你只需要说清自己的目标、意图或者想完成什么，系统就足够聪明，可以替你把事情完成。”公众越来越担忧 AI 对社会和经济造成的影响，也让 AI 未来发展面临的风险更加突出。目前的技术距离真正实现萨马特描述的场景仍有很大差距。不过，谷歌仍然押注这一方向。萨马特说：“我看到很多人，包括我自己，都低着头盯着手机，忙着完成各种事情。如果每天能把 5 分钟、10 分钟甚至 30 分钟还给用户，想想这些时间还可以用来做些什么。”为了完成一件事而在多个应用之间反复切换的使用方式，未来可能不再常见。IT之家从报道中获悉，萨马特举例称，AI 智能体将来有望可以读取用户看医生时留下的记录，向保险公司确认核磁共振检查是否在承保范围内，再直接完成预约。安卓目前还做不到这些。但即便如此，萨马特希望推动安卓朝这一方向发展，让用户不再需要对手机进行“事无巨细的操控”。以本周发布的 Pixel 11 Pro 为例，该机背面的新指示灯会在 Gemini 处理指令或回答用户时亮起。谷歌希望借此让用户不用拿起手机确认 AI 智能体有没有听见，就能直接通过语音与虚拟助理交流。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/990/172.htm", "publishedAt": "2026-08-15T13:08:13+00:00"}, {"title": "走进 CTO 圆桌：构建 AI 原生组织的工程领导者经验分享 | 技术趋势", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/cFMO2oN8SyaR9vuUVUeQ?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-14T11:30:09+00:00"}, {"title": "首发 | 澎湃OS 4 体验：小米第一个 AIOS，用起来怎么样？", "summary": "只有小米的 AI 才能成就 AI 的小米。#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1675208?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-08-14T06:00:53+00:00"}, {"title": "不止是命令行：Gitee CLI 如何成为 AI Agent 的「Gitee 之手」", "summary": "AI 编程助手已经很能写代码了。Claude Code、Codex、OpenCode 们可以读懂你的仓库、改好一个 Bug、补上一段测试。 但当任务走到「把这个分支提个 PR」「顺手建个仓库」「把这批 issue 归档」时，它们往往就卡住了，网页界面点不动，裸调 REST API 又要记住一堆端点、鉴权和分页规则。 Gitee CLI 正在补上这「最后一公里」...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/500509/gitee-cli", "publishedAt": "2026-08-12T01:49:23+00:00"}, {"title": "首发 | 如意玲珑打包 Agents： 用 AI 重构 Linux 生态打包体验", "summary": "在 Linux 生态中，应用打包的工作一直以来都有一定门槛。面对 Debian 构建规则、玲珑的 linglong.yaml 配置、各种格式的软件包转换……即使是经验丰富的开发者，也难免在重复劳动中消耗大量精力。 现在，这些问题有了更智能的解法。 如意玲珑（Linyaps）打包 Agents 工具集 1.0.0 （linyaps-packaging-agents-toolset-1....", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/493018", " const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
