const DATA = {"date": "2026-10-31", "generatedAt": "2026-10-31T01:57:56Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "荣耀罗巍：会带给大家全新的阿莱拍照模式，不是简单视频模式截图", "summary": "IT之家 10 月 31 日消息，荣耀首席影像工程师罗巍今日发文，透露了荣耀与阿莱合作的最新进展。我们会带给大家全新的阿莱拍照模式，不是简单的视频模式的截图，而是基于 LogC 曲线的设计原理，和阿莱的 Film Lab 合作，通过 RAW 信号重构全光谱，然后模拟阿莱的 35mm 胶片的感光曲线，重感光。再模拟暗房的冲印过程去真正还原电影胶片的成像。这是一个完全颠覆现有数字成像的技术应用。我们萝卜手机（IT之家注：指荣耀 Robot Phone）2 代也在路上了，这次会把一代的问题都解决掉，带来更加随手电影感的随身设备。同时我们还有和阿莱合作更加创新形态的产品在路上，保证是大家从来没有见过，甚至没有想过的产品形态。而且可能是两款。罗巍同时宣称，相信未来一年肯定有不少团队睡不着觉了，尾灯应该看不到了，“让我们给世界一点点震撼。”我们团队的愿景就是赋予每个记录生活和表达情感的权利和能力。我们就是要平权，用 AI 重构现有相机和电影机，用 AI 创造大家没有见过的影像产品。让每个人都能成为自己的人生导演。延伸阅读荣耀与阿莱（ARRI）的合作最早于 2026 年 3 月 1 日在 MWC 2026 上宣布达成战略技术合作，当时双方便确认合作将率先在荣耀 Robot Phone（即罗巍口中的“萝卜手机”）上落地。阿莱是一家德国电影摄影设备制造商，成立于 1917 年 9 月 12 日，总部位于德国慕尼黑，长期参与电影工业摄影设备研发，其摄影机、镜头以及灯光设备被广泛应用于影视制作领域，曾荣获美国电影艺术与科学学院颁发的 20 项奥斯卡科学技术奖。2026 年 4 月，Riedel Communications 及里德尔集团创始人兼所有者托马斯 · 里德尔完成对阿莱的收购，阿莱保持独立运营。作为双方合作的首款落地产品，荣耀 Robot Phone 于 2026 年 8 月 12 日举行的全球新品发布会上正式发布，定价 9,999 元起。Robot Phone 的核心创新在于机身顶部集成了一套行业最小的四自由度（4DoF）钛合金机械云台系统，配备微型电机，体积比主流方案缩小 70%。影像硬件方面，该机后置三摄包含一颗 2 亿像素 F1.6 光圈、等效 23 毫米的 4D 云台主摄，一颗 5000 万像素超广角镜头，以及一颗 2 亿像素潜望式长焦镜头，首发自研影像芯片“荣耀驭光 H1”。该机搭载第五代骁龙 8 至尊版芯片，配备 6.31 英寸 1.5K 分辨率四等边直屏，内置端侧大模型 YOYO。在软件层面，Robot Phone 首次将 ARRI Log-C 编码和 LUT 调色文件引入移动端，专业影视的 C-Log、LUTs 全部可用，摄影师和导演常用的锁焦、锁白平衡、锁 AE 和运镜数据均可下放至手机；其相机页面在“拍照”模式下将原本的快门键调整为摇杆按钮，用于调节云台角度，并提供与阿莱合作的“大师电影”模式。除 Robot Phone 外，荣耀与阿莱的合作成果还延伸至其他产品线。2026 年 9 月 8 日，荣耀官方宣布荣耀 Magic 9 系列手机将搭载阿莱 ARRI 电影色彩科学，原生支持 ARRI LogC3 对数伽马曲线和 AWG3 广色域，拍摄时完整记录光影色彩信息，让高光不易溢出、色彩细腻不断层，机内支持 ARRI Look，无需专业调色也能拍出电影级画面质感。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/419.htm", "publishedAt": "2026-10-31T01:12:45+00:00"}, {"title": "揭露“女版乔布斯”骗局的人警告：AI 热潮或催生下一个 Theranos", "summary": "北京时间 10 月 31 日，曾参与揭露美国血液检测公司 Theranos 造假丑闻的泰勒 · 舒尔茨（Tyler Shultz）近日警告称，AI 投资热潮正在为下一个类似 Theranos 的骗局创造条件。舒尔茨在接受美国媒体 The San Francisco Standard 采访时表示，AI 技术的真实能力很难评估，人们往往难以分辨一款产品究竟拥有独特技术，还是只是在 ChatGPT 等现有模型外面加了一层应用界面。“如果你想骗人，我认为这是一个很好的行骗机会。”他说。舒尔茨曾在斯坦福大学结识 Theranos 创始人伊丽莎白 · 霍姆斯（Elizabeth Holmes），后来进入这家公司工作，并参与揭露了其血液检测技术的虚假宣传。霍姆斯曾宣称，Theranos 的设备仅需少量血液就能完成多种检测。凭借这一愿景，她吸引了大量投资，一度成为硅谷备受追捧的创业明星，被称为“女版乔布斯”。但公司的技术承诺最终未能兑现，造假丑闻曝光。在舒尔茨看来，当初让霍姆斯在未经充分审查的情况下筹集数亿美元的环境，如今更加普遍。他认为，AI 技术尤其难以核实，而当下的世界对真相的重视也在减弱。舒尔茨的采访还谈到了近期重新引发外界关注的霍姆斯。内森 · 菲尔德（Nathan Fielder）的影片《You Can See Everything》上映后，一些观众对霍姆斯产生了同情。舒尔茨对此持不同看法。他认为，霍姆斯善于操纵他人，也十分关注自己的公众形象。舒尔茨称，尽管霍姆斯仍在服刑，她依然登上了《人物》杂志封面，出现在这部受到关注的影片中。他还声称，霍姆斯参与了其伴侣比利 · 埃文斯（Billy Evans）创办的新血液检测初创公司。“我觉得，我们现在谈论伊丽莎白 · 霍姆斯，唯一的原因就是她希望我们谈论她。”舒尔茨说。对于眼下的 AI 行业，舒尔茨担心，技术门槛和投资热情可能再次让外界难以看清一家公司的真实能力。他认为，霍姆斯不会是硅谷需要面对的最后一名骗子。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/415.htm", "publishedAt": "2026-10-31T00:59:29+00:00"}, {"title": "绝不为了 AI 而做 AI：苹果 CEO 特努斯产品宣言，AI 应隐身于体验", "summary": "IT之家 10 月 31 日消息，《连线》（Wired）昨日（10 月 30 日）发布博文，采访了苹果现任首席执行官约翰 · 特努斯（John Ternus），并围绕着苹果公司产品未来发展方向、AI 领域发展等内容展开讨论。在产品方面，特努斯在采访中反复强调自己是“产品型 CEO”：他热爱产品、重视硬件与细节，并希望苹果继续靠“让人真正喜欢的产品”取胜，而不是靠战略口号或管理哲学。他明确表示，苹果不需要被“修理”，也不想制造戏剧性变革。他把自己定位为延续者，会继续苹果的内部协作文化、产品方法论和长期积累。在 AI 方面，面对“苹果的 Siri 是否落后”“苹果是不是在 AI 上保守”的质疑，特努斯的回答是：苹果会用 AI，但不会“为了 AI 而 AI”。特努斯认为如果 AI 做得好，用户甚至不必意识到背后是 AI 还是传统软件；关键只在于产品是否更好用、更让人喜爱。他也不同意“AI 智能体会彻底取代应用和产品创造”的激进判断。他认为创造产品本质上是高度人性化、个人化的事情，因此苹果仍会围绕设备、软件和体验来构建产品。特努斯强调苹果不会突然变成一家 AI 模型公司；AI 会像芯片、屏幕和电池一样，成为让 iPhone、Mac、AirPods 更好用的底层能力。《连线》解读认为，在 AI 时代，苹果仍想让外界相信硬件、工业设计、芯片和产品体验依然是它的核心竞争力。特努斯长期主导 Mac、iPad、iPhone、Apple Watch、AirPods 等硬件工程，也深度参与了 Mac 向 Apple Silicon 的转型。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/409.htm", "publishedAt": "2026-10-31T00:33:35+00:00"}, {"title": "消息称字节 Seed 核心负责人周畅离职创业，方向为物理 AI", "summary": "IT之家 10 月 31 日消息，据 Z Finance 昨晚消息，字节跳动 Seed 核心负责人周畅已离职创业，方向为 Physical AI（物理 AI），并获得头部美元基金支持。具体投资方、融资金额及估值暂未披露。周畅此前是 Seed 内管理范围较广的技术负责人之一，向 Seed 负责人吴永辉汇报，业务曾覆盖多模态交互、世界模型、视觉生成及机器人等方向。IT之家查询互联网公开资料获悉，周畅 2012 年本科毕业于复旦大学计算机科学与技术专业，2017 年博士毕业于北京大学计算机软件与理论专业，随后加入阿里巴巴，花名“钟煌”，曾任通义千问大模型的技术负责人，曾和团队推出一系列语言模型、多模态模型。2024 年 8 月，周畅加入字节跳动，从事 AI 大模型相关工作，现任字节跳动豆包大模型视觉多模态生成方向负责人。此前，10 月 26 日，接近字节人士回应称“周畅没有离职”。相关阅读：《Seedance 核心研发负责人周畅被曝离职？接近字节人士否认》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/408.htm", "publishedAt": "2026-10-31T00:27:27+00:00"}, {"title": "谷歌宣布达成“Hello World”里程碑：在轨运行的数据中心级 TPU 首次给出 AI 响应，生成了一首俳句", "summary": "IT之家 10 月 31 日消息，当地时间 10 月 1 日，谷歌成功发射了“逐日者计划”（Project Suncatcher）的原型卫星。此后数周，团队逐步完成了在轨测试与调试清单，其中包括为主机与 TPU 托盘通电，并顺利完成了早期的机器学习测试。当地时间 10 月 30 日，谷歌宣布达成了“Hello World”里程碑：在轨运行的数据中心级 TPU 首次给出了 AI 响应。本周地面工程师下发首个提示词时，要求预装在卫星上的谷歌 DeepMind 模型 Gemma 4 创作一首关于身处太空的俳句。模型作答如下：Blue marble belowData streams in silent graceStarlight feeds my core. ✨IT之家附翻译如下：俯瞰蔚蓝丸数据无声流淌去星光赋机芯除俳句外，工程师还测试了五行打油诗生成以及轨道环境数据回传等遥测任务。据悉，该卫星搭载了四颗谷歌 TPU，可产生最高 1 千瓦的电能，旨在为未来构建用于在轨执行大规模推理工作负载的紧密编队卫星网络奠定基础。受限于散热和能源负荷，搭载的 TPU 每次仅能启动开启约 20 分钟左右。测试核心在于验证芯片在微重力、剧烈温差与太空辐射环境下的稳定性和纠错能力。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/402.htm", "publishedAt": "2026-10-30T23:51:47+00:00"}, {"title": "Anthropic Claude Max 20x 订阅更名 Ultra，已验证账户无五小时限制", "summary": "IT之家 10 月 31 日消息，Anthropic 调整了 Claude 针对个人消费者的付费套餐命名：原 Max 20x 计划更名为 Ultra 计划（价格仍为 200 美元（IT之家注：现汇率约合 1,335 元人民币）/ 月），并对通过验证的账户取消了 5 小时会话用量限制（仍受每周限额约束）；原 Max 5x 计划则直接简化为 Claude Max（100 美元（现汇率约合 667.7 元人民币） / 月）。据介绍，Ultra 计划每周拥有 Pro 计划使用量的 10 倍，拥有优先访问权限（率先体验新模型、功能和产品），目前仅作为月度订阅提供。官方表示，为了防止欺诈和滥用，将使用用户账户和支付历史等因素自动验证 Ultra 账户，用户无需进行任何操作（结账时验证电话号码是一个单独的步骤，不会移除此限制）。在“设置 &gt; 使用情况（Settings &gt; Usage）”中，若未看到“当前会话（Current session）”栏，说明账户已通过验证。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/398.htm", "publishedAt": "2026-10-30T23:26:41+00:00"}, {"title": "可免费生成粤语歌，香港自研 AI 助手“港话通”推出 AI 音乐功能", "summary": "IT之家 10 月 31 日消息，由香港生成式人工智能研发中心（HKGAI）研发的本地 AI 智能助理“港话通”（HKChat）于 10 月 30 日迎来更新，推出全新 AI 音乐生成功能。新功能接入由 HKGAI 研发的 YuE2 音乐大模型（「YuE2」），用户随口哼唱或上传图片，再输入对歌曲的构思，AI 便可即时谱写出兼具专业编曲和人声献唱的原创歌曲。全新音乐功能已在“港话通”App 上线，用户只需在首页点击底部的“音乐”按钮，即可进入创作界面。HKGAI 官方表示，“港话通”作为香港市民的 AI 生活助手，其全新音乐功能以粤语流行曲为特色，致力将 AI 技术与香港独特的流行文化相结合。系统生成的歌曲不仅旋律动人，更能精准还原广东歌的独特韵味。IT之家从公告了解到，全新 AI 音乐功能现阶段向所有用户免费开放体验。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/396.htm", "publishedAt": "2026-10-30T23:20:41+00:00"}, {"title": "阿里巴巴：苹果 Apple 智能国行用户可以自主选择是否开通千问集成功能", "summary": "IT之家 10 月 31 日消息，苹果今日（10 月 31 日）凌晨宣布首批 Apple 智能功能即将在中国推出，并与阿里巴巴达成合作，在部分体验中接入千问。这是 Apple 智能自 2024 年发布以来，国行版本首次获得实质性落地进展。根据阿里巴巴一同发布的公告，中国用户可以在 Siri、写作工具及视觉智能中，直接调用千问的文本与图像理解、内容生成等能力。这些功能将于 11 月 4 日起随最新的 iOS 开发者 Beta 版开放测试，并将于 12 月 iOS 27.3 正式发布时面向中国用户推出。Siri 可以直接调用千问的知识，并在 Siri 中直接回复用户问答。通过 Siri，用户还能用自己选择的文档和照片，直接向千问提问。在任何问题、文档和图片发送给千问之前，都会先征得用户同意。千问也已接入 Apple 的系统级写作工具中，为用户提供“千问创作”（Compose with Qwen）功能。“千问创作”可以帮助用户基于任意主题生成内容。用户还可以使用这一功能来生成图像。在 iPhone 上，用户可以通过视觉智能功能更深入地了解周围环境，其中包括选择“询问千问”来识别眼前所见。用户可通过相机控制、操作按钮或控制中心来启用视觉智能功能。IT之家注意到，阿里巴巴在公告中强调，用户可以自主选择是否开通千问集成功能。启用后，用户可通过 Apple 登录或使用自己的千问 App 账户登录，在 Siri、写作工具和视觉智能中使用千问。用户可以自主决定何时使用千问，以及分享哪些信息。用户请求及生成的回复均不会被阿里巴巴用于模型训练，以保护用户隐私。目前，千问的集成功能将在 iOS 中提供，面向在中国购买了支持 Apple 智能的 iPhone 用户，或设备定位和 Apple 账户国家 / 地区均设置在中国的用户。相关阅读：《苹果 Apple 智能国行版官宣落地：接入阿里千问，11 月 4 日随 iOS 开发者 Beta 版开放测试》《Apple 智能官宣入华：阿里千问接入苹果生态，可帮用户写文案、读文档、识图像》《苹果 Apple 智能入华亮点：AirPods 实时翻译登场，戴上耳机跨语言聊天》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/395.htm", "publishedAt": "2026-10-30T23:09:21+00:00"}, {"title": "OpenAI 称 ChatGPT 可自动终止表现出暴力执念的对话，并承诺定期发布社区安全报告", "summary": "IT之家 10 月 31 日消息，OpenAI 于当地时间 10 月 30 日发布博文表示，维护社区安全始终是 OpenAI 的重中之重。其日常工作包括主动向执法机关通报迫在眉睫的暴力威胁。仅在 2026 年第三季度，OpenAI 就向执法部门移交了 200 余起案件线索。OpenAI 承诺定期发布《社区安全报告》（Community Safety Report），系统公开在暴力预防、其他社区安全议题以及各项防护机制实际成效方面的进展。首期报告将于 2027 年初正式发布，涵盖 2026 年下半年的安全数据，此后每半年更新一次。IT之家获悉，OpenAI 针对 ChatGPT 如何回答有关既往大规模恶性袭击事件及凶手的问题增设了额外限制：即便相关信息已在网络公开发布，系统也会严格受控，仅提供极度精简的信息。与此同时，公众仍然可以通过 ChatGPT 了解此类事件的全貌、受害者与社区受到的影响，并学习如何识别危险预警信号以防范未来暴力。但 OpenAI 进一步收紧了安全策略，坚决限制对既往大规模袭击事件的细节复盘，包括所涉武器装备的参数、获取途径，以及可能助长凶手恶名的伤害规模对比。无论用户的年龄大小或提问动机如何，上述限制均无差别适用。此外，当对话显示用户开始执念于暴力、或萌生严重伤害他人的念头时，ChatGPT 可自动终止当前对话，从而即时阻断这种心理与行为倾向。若同一账户因该原因导致对话被多次强制中断，OpenAI 可能会临时冻结该账户。OpenAI 还宣布，对青少年可获取的涉枪涉武器信息增设了更严格的门槛，即便相关提问表面看似无害也会受到限制。即便用户未显露任何暴力意图，系统也将全面限制提供可能被滥用以滋生暴力的武器实用知识以及安防系统绕过信息。OpenAI 目前正加紧开发新功能，以便在青少年账户因反复讨论暴力内容被临时冻结时，第一时间向家长推送通知。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/394.htm", "publishedAt": "2026-10-30T23:09:09+00:00"}, {"title": "Apple 智能官宣入华：阿里千问接入苹果生态，可帮用户写文案、读文档、识图像", "summary": "IT之家 10 月 31 日消息，苹果公司今天（10 月 31 日）发布公告，宣布将面向中国 iPhone 18 Pro 等机型用户，于 11 月 4 日开放测试，并于 12 月推出的 iOS 27.3 更新，在国内上线首批 Apple 智能（Apple Intelligence）核心功能。IT之家援引官方新闻稿介绍，苹果公司明确在 Siri、写作工具及视觉智能这 3 类 Apple 智能体验中，使用阿里巴巴的千问，包括文本与图像理解相关功能。在 Siri 方面，苹果公司表示在“处理特定请求”时接入千问，利用其知识协助用户。用户还可以针对照片以及包含 PDF 与演示文稿的文档进行提问。在账号体验方面，苹果官网显示：“用户只需登录千问账户，或使用通过 Apple 登录，用户即可在 Apple 智能中顺畅访问千问。”其体验应该和接入 ChatGPT 类似，在不登录情况下，用户可使用 ChatGPT 扩展处理提问、写作、图像 / 文件等请求；OpenAI 不会收到与 Apple 账号关联的信息，且不会保存请求或回复、不会用于训练模型。在登录账号后，可以将相关请求保存到 ChatGPT 历史记录，并使用对应套餐提供的功能；此时适用用户的 ChatGPT 账号设置和 OpenAI 隐私政策。在写作工具“创作”功能方面，苹果公司表示用户可在系统全局写作工具中，让千问“从零开始创作原创内容”。在视觉智能上，中国用户可在视觉智能中使用千问，涉及文本与图像理解相关功能；即通过摄像头了解周围物体、场所等场景下的理解和问答能力。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/392.htm", "publishedAt": "2026-10-30T22:47:48+00:00"}, {"title": "《影之刃零》开发成本 3~4 亿元，媒体评分超《黑神话：悟空》", "summary": "IT之家 10 月 30 日消息，《影之刃零》已于 10 月 29 日正式登陆 PC 与 PS5 平台，国区标准版定价 268 元，豪华版 328 元，限量典藏版 1199 元、限量 2 万套。灵游坊创始人梁其伟向蓝鲸新闻透露，《影之刃零》早在 2017 年就已启动世界观与战斗体系的早期构思、2022 年初项目正式立项，总研发成本在 3 亿至 4 亿元之间。作为对比，《黑神话：悟空》研发周期约 7 年，总开发成本同样在 4 亿元左右。而《影之刃零》从立项到上市的节奏，与《黑神话：悟空》大体相当。评分方面，Metacritic 在评测解禁后给出的 PC 版媒体均分为 88 分，PS5 版为 86 分，IGN 打出 9 分，OpenCritic 推荐度 100%。《黑神话：悟空》PC 版此前的 Metacritic 均分为 81 分。数据分析机构 Alinea Analytics 估算，截至 10 月 28 日，游戏全平台预购量约 85 万份，预售收入约 4,300 万美元（现汇率约合 2.87 亿元人民币），其中 Steam 贡献约七成收入，PS5 约占 26%。首日 Steam 同时在线峰值方面，早期报道为 43 万人，后续统计显示最高触及 72 万人左右。发售当日，《黑神话：悟空》制作人冯骥发布长微博，回忆与梁其伟早年做手游时相识的经历，并提出一个判断：“单机游戏，并非更高级的游戏。选择做单机的人，大约只是因为在自由的空间时间里，更多在玩单机。”他将人的审美比作大模型，认为阅历与反馈塑造了创作者的品味。冯骥还写道，对国产单机创作者而言，“这是一个更好的时代，也是一个更难的时代”。相关阅读：《国产武侠游戏〈影之刃零〉首发表现亮眼：登顶 Steam 全球畅销榜、峰值在线玩家数超 43 万》《〈黑神话：悟空〉制作人冯骥自曝：很多年前就认识〈影之刃零〉梁其伟，第一次见面吃了顿烧烤》《国产 3A 游戏〈影之刃零〉发售，Steam 国区 268 元起》《〈影之刃零〉游戏首日补丁达 5GB，官方建议英伟达显卡用户回退 617.42 驱动》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/384.htm", "publishedAt": "2026-10-30T15:43:10+00:00"}, {"title": "词元工厂硅基流动港股上市申请获证监会备案接收：注册用户超千万，年内融资近 29 亿元", "summary": "IT之家 10 月 30 日消息，硅基流动在港股发行上市申请获中国证监会备案受理。据弗若斯特沙利文资料，该公司是中国最大的独立生态词元（Token）供应商，注册用户超过 1000 万名，服务企业客户超过 1.3 万家。IT之家注：硅基流动成立于 2023 年，定位为独立生态词元供应平台，不自建大模型，也不直接出售算力。其业务逻辑是将英伟达、华为昇腾、沐曦、摩尔线程等厂商的异构芯片通过自研推理引擎统一调度，让 DeepSeek、Qwen、Kimi 等主流模型在池化算力上运行，再以 Token 为单位对外提供服务。截至 2026 年 6 月，平台累计支持 170 余款 AI 模型，适配 10 余款芯片。硅基流动与国产芯片的绑定是其业务叙述的关键一环。2025 年春节，该公司因率先推出基于华为昇腾的 DeepSeek 推理服务而进入大众视野，其体验与性价比被指比肩国际顶尖 GPU 方案。此后，摩尔线程、沐曦等国产芯片也进入其兼容列表，公司在国央企客户中积累了一定规模的落地案例。按 2025 年 Token 年吞吐量计算，硅基流动在中国 Token 供应市场整体排名第四，份额约 1.5%；在独立生态平台中排名第一。融资层面，硅基流动 2026 年累计股权融资额接近 29 亿元，投资方包括中国互联网投资基金、国新基金、中国移动链长基金、中国东方资产国际、京能基金、上海仪电智算基金等国家级基金与产业资本，耀途资本、盛奕资本、国泰创投集团等老股东追加投资。公司称，两轮融资将重点投向推理引擎、异构算力调度和模型芯片适配等核心技术研发。在开发者生态侧，硅基流动在 Dify Marketplace 的模型下载量居于第一梯队，在 OpenRouter 平台的 Token 调用量也处于行业前列。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/020/369.htm", "publishedAt": "2026-10-30T14:22:53+00:00"}, {"title": "聚力开源向实 赋能产业创新——2026 上海开源软件应用创新大赛总决赛暨创新增长大会圆满落幕", "summary": "10月29日至30日，2026上海开源软件应用创新大赛总决赛暨创新增长大会在上海张江人工智能创新小镇举行。本届大赛由开源中国主办，自8月5日启动报名以来，共收到报名项目766个，40余家合作企业和开源社区参与；12道真实产业命题吸引269个项目应题攻关，30支团队晋级总决赛，角逐总价值100万元的奖池。10月30日的颁奖典礼上...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503320", "publishedAt": "2026-10-30T11:10:59+00:00"}, {"title": "英伟达团队基于 MiniMax H3 开源视频增强方案，最高支持 4K 重生成", "summary": "英伟达与麻省理工学院团队，在 Hugging Face 发布了视频增强项目 Open-H3-Regenerate-2K 的模型权重", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/10/506743.html", "publishedAt": "2026-10-30T07:31:11+00:00"}, {"title": ":fire::fire:开源接口平台 v6.3.1 发布，新增超时时间", "summary": "ApiGo 是一款在线接口开发和管理平台，多数据库插件化数据源框架、SQL2API 。支持 WorkBuddy、千问办公、Trea Work、豆包等 AI 办公平台 MCP 接入。支持接入（mysql、oracle、达梦、TiDB、DolphinDB、Hive、Du const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
