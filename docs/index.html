const DATA = {"date": "2026-09-07", "generatedAt": "2026-09-07T00:38:59Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "英伟达黄仁勋祝贺 OpenAI 团队发布 Astra，称“AGI 已经到来”", "summary": "IT之家 9 月 7 日消息，英伟达创始人兼首席执行官黄仁勋今天在 X 平台发文，祝贺 OpenAI 发布最新大模型 Astra，并抛出引人注目的观点：AGI 已经到来。黄仁勋表示：“OpenAI 从发布 ChatGPT 到 o1，再到 Astra 只用了 4 年，AGI 已经到来，恭喜 OpenAI 团队。”IT之家注：通用人工智能（AGI）指的是具备与人类同等智能或超越普通人类的人工智能，能表现正常人类所具有的所有智能行为。OpenAI 本周四正式发布 Astra，官方称其是全球“最智能、最符合人类价值观的模型”，认为该模型能以“无与伦比的速度、准确性和判断力完成最具挑战性的专业工作”。OpenAI 总裁格雷格 · 布罗克曼随后在一场电话会议中表示：“欢迎来到 AGI 时代。”AI 研究院、批评学者加里 · 马库斯（Gary Marcus）认为，黄仁勋的判断为时过早。他称黄仁勋没有提供任何科学定义，也没有给出任何证据。在他看来，英伟达只是通过单方面宣布，接管原本属于科学范畴的问题。马库斯同时附上了自己的 10 项 AGI 定义标准，并指出 Astra 目前只能满足其中一到两项。另一方面，OpenAI 首席执行官萨姆 · 奥尔特曼最近出席播客节目时认为，AGI 充其量只是定义非常模糊的术语，他甚至表示，AGI 可能只是一个“无关紧要的营销词”。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/999/069.htm", "publishedAt": "2026-09-07T00:06:45+00:00"}, {"title": "Anthropic 15 亿美元 AI 版权和解金开始陆续发放，但出版社和作者分配补偿争议不断", "summary": "IT之家 9 月 7 日消息，Anthropic 去年就版权集体诉讼案达成和解。法院裁定，Anthropic &nbsp;使用受版权保护的材料训练 AI 模型符合“合理使用”（Fair Use）原则，属于合法行为，但通过盗版方式获取这些材料则不受合理使用保护，因此 Anthropic 将为训练模型时使用的近 50 万部盗版作品原作者提供赔偿，补偿标准为每部盗版作品 3,000 美元（IT之家注：现汇率约合 20,203 元人民币），和解金合计为 15 亿美元（现汇率约合 101.02 亿元人民币），该和解方案今年 7 月获得最终批准，相关赔偿金随后开始进入发放流程。根据和解协议，如果相关图书仍由传统出版社出版，赔偿金将由作者和出版社各分 50%；如果图书由作者自行出版，或者出版社此前已经让该图书绝版并将版权返还给作者，那么 3,000 美元（现汇率约合 20,203 元人民币）赔偿金应全部归作者所有。不过，近期一些作者在社交媒体上发文称，部分出版社似乎正在申领超过其应得比例的赔偿金。例如，悬疑及惊悚小说作家 April Henry 就公开质疑 HarperCollins，称该出版社竟然申领了她一本早在至少 17 年前就已经返还版权的作品。此外，她还发现就在同一天，自己的信用记录中突然出现 HarperCollins 被添加为“雇主”的信息，而她从未为该公司工作过。对此，知名作家维权博客 Writers Beware 的作者 Victoria Strauss 表示，近期收到的作者投诉大致可以分为两类：第一类是出版社针对已经不再拥有合法版权的作品提出赔偿申领（例如版权早已返还作者的图书）；第二类则是出版社悄悄向 Anthropic 申领了 100% 的赔偿金，但按照和解协议，出版社实际上只能获得 50%。不过 Victoria Strauss 认为，这种情况通常是“糟糕的版权记录管理以及复杂的和解流程”导致，通常并非“出版社恶意抢钱”，目前一些出版社已经承认相关申领存在错误，并表示正在要求 Anthropic 进行修正。除此之外，试图从这笔赔偿金中获得分成的并不只有出版社。Strauss 透露，她还收到了一些关于文学经纪机构提出赔偿申领的投诉。目前，随着 Anthropic 15 亿美元（现汇率约合 101.02 亿元人民币）版权和解金正式进入发放阶段，出版社、文学经纪机构与作者之间围绕赔偿资格和分配比例的争议仍在持续。大量重复出现的申领错误，也可能进一步考验这起大规模版权和解案的执行效率。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/999/049.htm", "publishedAt": "2026-09-06T22:43:34+00:00"}, {"title": "诡异又倒胃口：AI 食物图片攻占餐厅菜单，让消费者食欲全无", "summary": "IT之家 9 月 6 日消息，据卫报报道，午休期间，吉尔 · 森内特看到了一些让她完全提不起食欲的东西，于是忍不住分享给自己在 X 平台上的 2.6 万名粉丝：一家牙买加烧烤快闪餐厅使用人工智能生成的菜单图片，里面的肉看起来像是一条条皮带，上面还爬满了细小的甲虫。这些图片随后被 500 多人转发，许多人同样表达了厌恶之情。现年 37 岁、居住在丹佛的护士森内特表示，吃饭“是人类最基本的体验之一”。她说：“我认为，餐厅开始采用这种恐怖、诡异又让人毫无食欲的食物图片，是一种不好的文化现象。”不过，森内特最终还是点了鸡肉和芝士通心粉。这家餐厅是她午餐时为数不多的选择之一，而且她以前也在那里吃过饭。如今，越来越多消费者开始在餐厅菜单和营销材料中看到 AI 生成的食物图片。很多食客认为，这些图片既不诱人，也可能误导消费者；而餐厅方面则表示，在食品和人工成本不断上涨、利润空间越来越薄的情况下，使用 AI 可以帮助降低成本。美国餐饮协会 2026 年的一份报告显示，26% 的餐厅经营者正在使用 AI 协助开展营销、库存管理、员工排班、菜单优化以及订单处理等工作。不过，消费者对这项技术的反弹也可能来得又快又猛烈，尤其是在 AI 产业高度集中的旧金山湾区。此前，旧金山咖啡馆 Grind &amp; Unwind 曾挂出一块展示菜单选项的招牌，当地居民很快发现其中的图片是 AI 生成的。随后，有人在店面外墙上涂鸦，咖啡馆老板林赛 · 洛萨诺辨认后认为，上面写的是“seriously”。在 Reddit 上一篇题为“Yum, slop”的帖子中，评论者纷纷吐槽这些图片，有人认为图片里的面包看起来像爬行动物的皮肤，也有人觉得像丝瓜络一样。洛萨诺今年 7 月曾告诉 SFGate，这样的反应“完全出乎我们的意料”，并表示这些招牌原本只是临时使用。根据 SFGate 的报道，洛萨诺和丈夫后来撤下了 AI 招牌，并花费约 700 美元（IT之家注：现汇率约合 4,714 元人民币）重新粉刷墙面，覆盖涂鸦。随着广告领域关于 AI 使用的行业规范仍在逐步形成，一些餐饮业人士也开始认真思考，AI 在什么情况下能够帮助企业，又会在什么情况下带来负面影响。《Food &amp; Wine》杂志主编亨特 · 刘易斯表示，他看到一些餐厅随着开始自动化后台运营流程而实现增长。但他认为，这项技术最好不要让食客察觉，因为 AI 图片可能会“让人非常倒胃口”。他说：“美国的食客很聪明。他们知道自己想要什么，也知道什么是真的。”一些餐厅甚至因为公开宣布“永远不会使用 AI”而在网络上走红，它们转而在社交媒体上发布手绘的汉堡图片。怀俄明州餐厅 Chugwater Soda Fountain 就曾在一块纸板上写下这样的承诺。该餐厅将照片发布到 Instagram 后，获得了超过 20 万个点赞。一些评论者称赞这种朴素的真实感，也有人指出，把这条反 AI 信息发布在一个由 AI 技术驱动的平台上，本身就颇具讽刺意味。旧金山湾区职业摄影师杰米 · 索亚表示，AI 最容易出错的地方，往往是食物的质感。索亚曾为餐厅营销活动和外卖服务拍摄食物照片。他说：“食物的颜色、质感以及各种食材的排列方式，看起来往往都有些不对劲。”他还补充称，AI 图片中的光线也经常显得不自然。包括外卖平台 DoorDash 在内的科技公司，也正在不断将 AI 功能整合进自己的平台，这进一步加剧了围绕 AI 菜单图片的争议。DoorDash 在一份电子邮件声明中表示，公司提供 AI 图片工具，可以通过调整光线、颜色或背景等方式，“改善现有菜品图片的展示效果”。该公司的政策禁止餐厅制作或修改具有误导性的菜单图片，并表示会审核菜单图片，以确保其符合相关规定。简单搜索后可以发现，一些图片带有 DoorDash 的“AI-增强”标签。当餐厅使用 DoorDash 的 AI 图片编辑工具时，这一标签会自动添加。不过，即使是索亚这样的职业摄影师，有时也很难判断一张图片究竟是由 AI 生成的，还是仅仅经过了过度修图。研究人员也开始关注，消费者看到 AI 生成的食物图片后，会如何影响他们的看法和食欲。牛津大学实验心理学教授查尔斯 · 斯彭斯在 2024 年的一项研究中发现，当消费者不知道食物图片由机器生成时，他们通常更喜欢 AI 生成的图片。然而，一旦得知图片是由 AI 制作的，食客就会觉得这些图片的吸引力下降。斯彭斯还发现，AI 会以一些可预测的方式改变食物。当用户要求 AI 把食物图片制作得更诱人时，AI 往往会自动增加脂肪元素，例如在土豆泥上添加更多黄油。斯彭斯担心，这类 AI 图片可能会在潜意识中影响食客和厨师，让他们逐渐倾向于选择分量更大、脂肪含量更高的食物。AI 图片也可能给消费者留下不好的印象，尤其是那些每天都与这项技术打交道的人。旧金山一家设计和营销机构的 CEO 布兰登 · 希尔最近路过市中心的 Bella Cafe 时，就被店里的 AI 食物图片弄得非常反感。他拍下照片，并分享给自己在 X 平台上的 8.6 万多名粉丝，同时配上了一段日文文字。根据 X 提供的英文翻译，这段文字的意思是：“就连在旧金山…… 一些地方也开始使用生成式 AI 制作菜单图片了。但你知道，它们看起来真的没那么让人有食欲。”希尔表示，这些 AI 图片也让他“开始怀疑真正端上来的食物到底会是什么样子”。尽管希尔的帖子引发了讨论，Bella Cafe 的老板妮拉 · 诺雷罗 · 萨尔瓦托雷却表示，她个人并没有收到任何关于这些由 ChatGPT 设计的招牌的投诉。无论是餐厅街边展示的招牌，还是店内用于宣传早餐菜单的广告牌，都包含食物图片。现年 65 岁的诺雷罗 · 萨尔瓦托雷表示，她和丈夫都是“比较传统的人”，并称尝试 AI 对他们来说“很有趣”，也是“我们以前没有接触过的新事物”。除了制作招牌，她还会使用 ChatGPT 帮员工撰写推荐信，并协助编写咖啡馆的员工手册。除了能够节省平面设计费用之外，诺雷罗 · 萨尔瓦托雷本人也喜欢 AI 图片呈现出来的效果。她说：“我认为，这是一种宣传我们产品的好方法，尽管有时候人们会说 AI 没有效果，或者看起来不够自然。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/999/042.htm", "publishedAt": "2026-09-06T14:37:44+00:00"}, {"title": "科技巨头密集更新 AI 模型，“模型疲劳”问题凸显", "summary": "IT之家 9 月 6 日消息，据 CNBC 报道，本周，人工智能行业再次迎来一轮密集更新。首先是 Anthropic 更新了 Fable 和 Mythos 模型，随后 Meta 和谷歌相继推出模型升级，OpenAI 紧接着发布了 GPT-6 Astra。短短一周内，多家争夺人工智能技术领先地位的公司接连推出更新和升级，节奏之快令人眼花缭乱。OpenAI CEO 萨姆 · 奥尔特曼当地时间周四在接受 CNBC 采访时表示：“我们都在加快迭代节奏。”他认为，近期更新速度加快的部分原因，是“大家都结束暑假回来了”。但对于 AI 模型和服务的用户而言，这种快速迭代也带来了复杂性和混乱。为了避免掉队，企业 CEO 和 IT 管理人员不得不投入大量时间和资源，对不同产品的价格和能力进行比较。AI 初创公司 Runpod CEO Zhen Lu 表示：“我觉得‘模型疲劳’确实已经成为一个真实存在的问题。不要误会，我对目前发生的各种创新感到非常兴奋，但我确实认为，我们现在所处的环境有太多泡沫，企业不得不不断制造声量。”圣母大学门多萨商学院教授、拥有 25 年 AI 从业经验的 Ahmed Abbasi 表示，各家模型开发商如今都在争夺用户预算份额，它们一边努力跟上竞争对手的节奏，一边不断提醒开发者，自己至少与其他公司一样快地推进创新。尤其是 Anthropic 和 OpenAI，两家公司正朝着公开市场迈进，因此竞争节奏尤为激烈。目前，私募投资者给这两家公司的估值都已接近 1 万亿美元（IT之家注：现汇率约合 6.73 万亿元人民币）。谷歌和 Meta 也有各自的战略目标，而快速发展的开源 AI 社区最近又迎来了一位重量级新成员 —— 英伟达。它们都希望从今年规模高达 2.59 万亿美元（现汇率约合 17.44 万亿元人民币）的 AI 支出中分得一杯羹。Gartner 预计，这一数字将比 2025 年增长 47%。Gartner 在今年 5 月发布的一份报告中表示，超过一半的 AI 支出将用于 AI 基础设施，而服务、软件、网络安全、模型及其他工具的支出总额也将超过 1 万亿美元（现汇率约合 6.73 万亿元人民币）。本周的更新潮由 Anthropic 在周二率先拉开序幕。该公司发布了 Claude Fable 5.1 和 Claude Mythos 5.1，并称其为“全球最先进的编程和知识工作模型”。周三，Meta 发布 Muse Spark 1.3，谷歌推出 Gemini 3.8 Flash，两家公司都重点宣传了新模型在编程和 AI Agent 任务方面的能力提升。周四，OpenAI 发布了 GPT-6 Astra。这款模型重点强化了网络安全和计算机操作能力。OpenAI 表示，它是“多年研究和重大投入”的成果。同一天，位于阿布扎比的穆罕默德 · 本 · 扎耶德人工智能大学也向开源社区发布了自己的 K2 Horizon 系列 AI 模型，再次凸显 AI 研究和投资已经成为一场全球性的竞争。与此同时，全球市值最高的公司、此次 AI 热潮核心芯片供应商英伟达也不甘示弱，正式同意以 129 亿美元（现汇率约合 868.74 亿元人民币）收购开源 AI 平台 Hugging Face。英伟达近期也在持续推出开源模型，其中包括上个月发布的 Nemotron 3.5 Lightning。该公司表示，这是一款“轻量级”模型，可以在笔记本电脑或台式机的单块 GPU 上运行。如此密集的模型更新，再加上 AI 监管政策仍存在诸多不确定性，也加剧了外界对于先进 AI 模型风险的担忧。过去几周里，OpenAI、Anthropic 和 Meta 开发的模型都曾访问原本不应该访问的第三方网站。而 OpenAI 的模型上个月还成功入侵 Hugging Face，这一事件在整个行业引发强烈震动。“可能陷入彻底的混乱”Abbasi 等专家尤其担心 AI Agent 的快速发展。他表示，令人担忧的不仅是这些能力本身，更在于“它们正在被如此轻易地部署”。Abbasi 表示：“随着这些 Agent 的出现，它们不仅存在于你的电脑上，也开始活跃在网络上，整个威胁和漏洞环境都变得更加复杂。如果我们不够谨慎，局面可能彻底陷入混乱。”Abbasi 还认为，各大模型开发商恰好在同一周宣布更新，“这并非巧合”。AI 金融初创公司 Farsight 的技术负责人 Noah Faro 也持类似观点。Faro 表示，企业可以通过多种方式了解竞争对手正在筹划什么。例如，可以观察云端计算资源的供应情况，因为这些公司都在争夺少数几家供应商提供的大规模算力。此外，整个行业内部也存在大量信息交流。他表示：“任何一点微小的风吹草动，都会以极快的速度传播出去。”当然，并非所有模型更新都具有同等重要性。Faro 表示，与 OpenAI 发布的 GPT-6 Astra 不同，Anthropic、Meta 和谷歌本周推出的大多数更新都属于“点版本更新”。这意味着，它们是在现有 AI 模型基础上进行升级，而不是从头开发一个全新的模型。Faro 认为，最近真正对行业格局产生重大影响的两款模型，是 Anthropic 在 6 月发布的 Fable 5，以及中国月之暗面在 7 月推出的 Kimi K3。不过，企业 AI 初创公司 Clockwork Systems CEO Suresh Vasudevan 表示，即使只是渐进式更新，在 AI 技术快速改变商业和软件开发方式的背景下，也依然具有重要意义。他表示：“现在每一次发布的产品都强得离谱，以至于人们已经很难判断什么才算真正的跨越式进步了。大家都知道，当你身处一条指数增长曲线之中时，你往往意识不到自己正在经历什么。只有退后一步，回头看看自己原来在哪里、现在又走到了哪里，才能真正感受到变化。”Vasudevan 也承认，持续追踪每一次模型更新已经成为一件令人头疼的事情，尤其是在评估过程还需要消耗宝贵计算资源的情况下。他说，如果自己的初创公司希望针对某项任务评估 10 个 AI 模型，最终可能只会挑选其中 5 个进行测试。Vasudevan 表示：“要把目前所有正在推出的模型逐一评估，真的非常困难。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/999/036.htm", "publishedAt": "2026-09-06T13:44:18+00:00"}, {"title": "具身ICL来了创业玩家！上下文成Scaling新赛道", "summary": "让机器人学会利用更长的多模态Context", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/484897.html", "publishedAt": "2026-09-06T11:44:21+00:00"}, {"title": "微软借力 AI 重塑 Win11 应用生态：30 分钟即可生成 WinUI 原生应用", "summary": "IT之家 9 月 6 日消息，在普遍认为企业还不知道该如何真正利用 AI 的当下，微软却已经制定了一套计划：借助 AI，让更多原生 WinUI 应用进入 Microsoft Store。IT之家注意到，微软近日发布了一份新的快速入门指南，帮助开发者利用 AI、VS Code 和自家的 winapp CLI，从一个空文件夹开始，一步步创建并发布 WinUI 3 应用。微软表示，整个流程大约只需要 30 分钟，而且无需安装 Visual Studio，使用的工具也都是免费的，包括 GitHub Copilot 的免费版本。这份简单的 30 分钟指南，本质上是在吸引初学者为 Windows 11 开发应用，而且不必再经历传统开发中那些“繁重”的编码工作。现在，任何人都可以借助 AI 创建一个新的 WinUI 应用，让 AI 智能体添加功能、测试结果，将应用打包成 MSIX，然后提交到 Microsoft Store，整个过程免费，而且所需人工操作非常少。不过，更值得关注的是微软随指南提供的 AI 辅助迁移指南，尤其是针对现有 WPF 和 UWP 应用的迁移方案。这才是微软解决 Windows 长期以来原生应用问题的真正思路：让 WinUI 应用更容易开发，让老应用更容易迁移，同时让 AI 处理这两个过程中那些繁琐的工作。新应用开发流程基于 VS Code、.NET 10、微软 Windows App Development CLI、WinUI 项目模板、GitHub Copilot 以及 WinUI Agent 插件。不能将这里的 WinUI Agent 与微软此前推广的通用聊天机器人 Copilot 混为一谈。WinUI Agent 配备了针对 WinUI 设计、代码审查、UI 测试、应用打包以及框架迁移等任务的专门能力。微软还建议将该 AI 智能体连接到 Microsoft Learn MCP 服务器，这样它就可以在执行查询时获取最新的 WinUI API 文档。考虑到 WinUI 3 的普及程度相对较低，可以合理推测，AI 模型在 WPF 和 UWP 方面积累的训练材料要多得多，而且时间跨度也更长。WPF 迁移指南并没有把这件事包装成简单的查找和替换工作。例如，System.Windows.* 需要转换为 Microsoft.UI.Xaml.*。微软为 AI 智能体提供了一整套替换对照表，涵盖控件、线程处理、窗口管理、DPI 处理和数据绑定等内容，同时还提供了一段初始提示词，告诉 AI 智能体需要重点检查哪些问题。微软针对 UWP 迁移到 WinUI 3 的指南则开门见山地指出，UWP 已经不再处于积极开发状态，而 WinUI 3 和 Windows App SDK 才是它的后继方案。有意思的是，微软特别提醒，由于 AI 模型已经基于多年来积累的大量 UWP 示例进行了训练，如果迁移技能没有明确告诉 AI 应该采用哪些替代方案，模型很可能会继续生成传统 UWP 的代码模式。本质上，微软正在尝试降低将海量现有 WPF 和 UWP 软件迁移到新原生框架上的成本。长期以来，Windows 上不断出现 Web 应用，而不是原生应用，一个重要原因就是跨平台 Web 框架的开发成本更低。开发者可以复用一套代码，在不同平台上运行，而不必专门针对 Windows 的开发框架编写代码，更不用担心这个框架未来可能像过去那样再次发生重大变化。在 Build 2026 大会上，微软明确表示希望改变开发者的这种看法，并将 WinUI 称为“Windows 应用的生产平台”。同时，微软还从名称中去掉了“3”，试图向开发者社区传达一个信号：未来不会再把整个框架推倒重来。微软还承诺降低内存占用，增加 DataGrid 和图表支持，改善 WPF 互操作能力，并进一步扩大开源参与度。事实上，如今 WinUI 已经完全开源。WinUI 的作用也不仅仅是帮助开发者制作应用。微软一直在用 WinUI 3 替换 Windows 11 中一些历史悠久的界面组件，最近的例子包括自动播放、打印管理等功能，未来还会有更多组件进行替换。如果微软自己都不愿意使用这套技术，那么要求第三方开发者采用它显然也不太公平。微软推广原生应用，并不是因为它认为 WebView2 或 Electron 是糟糕的技术。微软的官方文档将 WebView2 视为开发混合应用的一种合理方案，并表示应用的资源占用最终取决于开发者对 Web 内容的优化程度。讽刺的是，Windows 11 的天气应用就是基于 WebView2 构建的。它在空闲状态下就会占用约 1.2GB 内存，大约是苹果原生 macOS 天气应用的 5 倍，而且后台还运行着 9 个 Chromium 子进程。尽管微软一直采取企业优先的开发思路，但 Teams 在经历了多年的用户抱怨之后，才终于加入“效率模式”。一些热门第三方应用也面临类似问题。例如 WhatsApp 的 Windows 应用一直存在加载速度较慢的问题，同时还会大量消耗内存。Discord 甚至承认自己的 Windows 应用属于“资源消耗大户”，并测试了一项功能：当内存占用超过 4GB 后自动重启应用。也就是说，微软一方面要求第三方开发者开发更加轻量的原生应用，另一方面，它自己的一些应用以及 Windows 的部分界面却仍然建立在 WebView2 之上。微软负责 Aspire 项目的杰出工程师 David Fowler 最近表示，“手写代码”已经彻底成为过去。没错，在微软目前展示的 WinUI 开发工具中，AI 代理可以生成代码、理解整个项目、运行测试，并修复出现的问题，而不是要求开发者亲手敲出每一行代码。但 AI 降低代码生产成本，并不等于代码质量也会随之提高。微软自己也很清楚这一点，这也是为什么 WinUI Agent 会配备专门的代码审查和 UI 测试能力。如果微软希望借助 AI 生成更多 Windows 软件，那么这些软件依然必须足够高效。否则，让原生应用变得更容易开发，只会导致 Windows 上出现更多优化糟糕的原生应用。多年前，微软需要让史蒂夫 · 鲍尔默站在台上高喊“开发者、开发者、开发者”，如今情况已经发生了变化。现在，越来越多开发者倾向于使用 Linux 开发环境，而大量 AI 应用开发者则选择 MacBook，因为它拥有强大的硬件性能。微软现在试图做的，是让 Windows 应用开发直接发生在一个围绕 AI Agent 打造的 Windows 开发环境中。如果这套方案能够成功，Windows 或许就能获得更多原生应用，同时开发者也不必再手动重写大量代码。但微软仍然需要证明一点：这些由 AI 构建的 WinUI 应用，真的能够比它想要取代的 Web 应用运行得更快、占用更少资源。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/999/015.htm", "publishedAt": "2026-09-06T11:17:12+00:00"}, {"title": "微软重塑 Win11 AI 战略：“无计量智能”将让更多 AI 在 PC 本地运行", "summary": "IT之家 9 月 6 日消息，据 Windows Latest 报道，微软希望 Windows 重新赢得用户喜爱，并正在采取一系列措施改善这款操作系统。该系统将迎来可移动的任务栏，甚至还有不再依赖 Bing 的 Windows 搜索。不过，这是否意味着微软会从 Windows 11 中彻底淡化 AI，把精力重新放在稳定性和质量上？当然不是。未来只是不会再把重点放在 Copilot 按钮上。微软 CEO 萨蒂亚 · 纳德拉的第三季度讲话非常罕见地多次提到了 Windows。他首先透露，Windows 每月活跃设备数量已经达到 16 亿台；随后又确认微软正在采取更广泛的战略，把重点重新放回基础体验，同时还用一个新的概念“unmetered intelligence”（无计量智能）来暗示操作系统的未来方向。这到底是什么意思？微软最近在 IFA 2026 上的一场演讲，让我们终于有了一些答案。在 IFA 2026 上，微软 Windows 与设备部门企业副总裁 Mark Linton 同样使用了“unmetered intelligence”这一说法，用来描述 Windows 操作系统的未来。他的意思是，AI 当然不会从 Windows 11 中消失，但它未来的呈现方式可能会发生很大变化。微软认为，Windows 不应该继续单纯追求增加更多 Copilot 按钮或 AI 功能。事实上，这种变化已经开始出现在操作系统的多个角落。例如，微软最近就从 Microsoft Photos 和截图工具中移除了 Copilot，同时还把记事本中的 Copilot 集成功能重新命名为“Writing tools”（写作工具）。与其不断向 Windows 中塞入更多由 AI 驱动的功能和按钮，微软更希望把 Windows 打造成一个平台，让 AI 模型和 AI 智能体能够直接在本地运行。这其实也是最近在整个 AI 行业中越来越明显的一种趋势：AI 正在从“聊天机器人”转向“智能体”。例如，ChatGPT Astra 的设计就完全围绕这一方向展开。这种变化似乎是因为 AI 公司已经认定，智能体将成为未来更重要的商业机会。因此，从消费者到企业，再到开发者，AI 公司都会推动更多人转向智能体。微软希望 Windows 能够为这样的未来做好准备。微软提出的“unmetered intelligence”更加值得关注。这个概念也是一种颇为巧妙的营销方式，可以让微软减少对 Copilot 以及传统“AI”概念的依赖。在 IFA 2026 上，Linton 将微软对 AI 的野心与公司过去著名的目标进行了类比 —— 让每张办公桌、每个家庭都拥有一台 PC。“我们现在谈论的一个重要领域就是 AI，以及我们能够为无计量智能做些什么。”Linton 说，“如果你仔细想想，我们谈的是让每张办公桌、每个家庭都拥有无计量智能。”他补充道：“如果你还记得比尔 · 盖茨担任微软老板的时候，当时的目标是让每张办公桌、每个家庭都拥有一台 PC。”Windows Latest 了解到，“Unmetered intelligence”实际上意味着，将原本运行在微软云端，或者 OpenAI、Claude 等云端服务上的更多日常 AI 工作，转移到用户已经拥有的 PC 上。如果某个 AI 模型可以直接在你的电脑上运行，那么你就不需要为此支付订阅费用，而且可以一直使用，直到本地可用的“token”耗尽。微软并不是要彻底取代云端 AI。云端 AI 仍然会是整个体系的重要组成部分。但对于一些规模较小的任务或日常交互，微软希望用户能够直接利用自己的 PC 来完成。微软认为，随着 Windows PC 的性能越来越强大，它们应该能够在本地运行更多 AI 模型，而不是每次提出请求都依赖云端。“我们的意思是，这些高性能 PC 可以补充你在云端进行的工作，但对于那些你每天都可以使用的模型，你不应该每次都必须访问云端。”Linton 解释道。Linton 还将这一理念与 AI 的经济模式联系起来，尤其是 token 成本。他提出了一个很实际的问题：“如果你的 PC 性能足够强大，本质上，你能不能通过让 AI 在自己的 PC 上运行，改变 token 的经济模式？”Linton 说。当 AI 模型直接运行在 PC 的 CPU、GPU 或 NPU 上时，微软就不需要通过昂贵的云端数据中心来处理每一次请求。与此同时，用户也不一定每次要求 AI 完成某项任务时，都要消耗云端 token。当然，微软并不是在暗示 Copilot 将无限免费使用。“unmetered”在这里指的是 AI 在用户自己的 PC 上运行，不再按照云端推理的方式计量。“这些高性能 PC 能做这么多事情，为什么不把 AI 工作负载和创作者工作负载转移到 PC 上？”他说。在同一场活动中，微软还讨论了能够在本地运行数百亿甚至数千亿参数模型的 PC。Linton 形容，其中一些设备已经开始接近“桌面上的超级计算机能力”，开发者和创作者将能够直接在自己的办公桌上运行 AI 工作负载。越关注微软在 IFA 上的这场演讲，我就越意识到，Windows 最终很可能会成为 AI 智能体的操作系统。微软自己也非常明确地表达了这一方向，直接表示希望让 Windows 成为“最好的 AI 平台”。微软列出了三个正在推进的方向，希望最终实现这一目标。首先是开发者体验，也就是打造“一种精简的体验，帮助构建者更快地开发和创作”。IT之家注意到，Linton 提到了 Windows 最近推出的一些创新功能，例如开发者模式，以及微软正在推进的直接在 Windows 中进行开发的相关工作。“客户的态度非常明确：我不希望智能体在我的企业网络中随意运行。”Linton 说，“我需要安全性和可管理性，因为我希望利用这些…… 能够长期运行的智能体所带来的能力，但我又不希望因此放弃现有的策略和管理规则。”未来版本的 Windows 11 似乎还会让用户进一步掌控 AI 智能体在 PC 上的运行方式。例如，用户可能可以审计 AI 智能体、查看它们在 Windows 11 上产生的日志，并更加精细地控制智能体能够执行哪些操作。微软已经开始为 Windows 构建面向 AI 的容器和子系统，从而确保 AI 智能体不会干扰用户的个人文件，也不会在 PC 上进行失控操作。微软表示，将在今年晚些时候公布更多细节。但至少现在可以确定，不要指望 Windows，或者任何其他主流平台，会在未来避开 AI。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/999/014.htm", "publishedAt": "2026-09-06T10:51:36+00:00"}, {"title": "大众与众 08 猎影版车型已陆续登陆全国门店：预售价 23 万元，9 月 12 日上市", "summary": "IT之家 9 月 6 日消息，大众安徽今日宣布，与众 08 猎影版已陆续登 ": "开源中国", "sourceUrl": "https://www.oschina.net/news/502274", "publishedAt": "2026-09-02T09:30:03+00:00"}, {"title": "开源中国开源 AI 编程工具 MothX，主打一个“省”字，驾驭中国词元", "summary": "用 Claude Code 写一个月代码要多少钱？问问研发工程师，答案都是几百美元起步。终端 AI 编程这个领域，能力上各家都做得不差，拉开差距的其实是账单。 开源中国近期在 Gitee 开源了终端 AI 编码工具 MothX（默思，原名 VibeCoding），约一万行 Go 代码，编译成一个二进制，装完即用。这类”模型之外的脚手架”，行业里叫...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502273/oschina-opensource-mothx-ai-coding-cli-agent-harness-vibe", "publishedAt": "2026-09-02T09:12:55+00:00"}, {"title": "ChatGPT 桌面应用里藏着 430MB 的 LibreOffice", "summary": "Simon Willison 在清理磁盘时发现了一个 1.7GB 的目录。他打开一看，里面装着一整套 LibreOffice。 路径在 ~/.cache/codex-runtimes/codex-primary-runtime/plugins/openai-primary-runtime/plugins/documents。目录里不仅有完整 Python（440MB）和 Node.js（446MB），还有 Poppler（188MB）、git（148MB），以及一个 43...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502272/chatgpt-codex-libreoffice", "publishedAt": "2026-09-02T09:03:52+00:00"}, {"title": "从 SIP 到大模型：一天构建可本地部署的 AI 智能外呼系统 VibeVoip", "summary": "VibeVoip 是一套面向企业业务场景设计的 AI 智能外呼平台", "sourceName": "开源中国", "sourceUrl": "https://my.oschina.net/u/4806939/blog/19752597", "publishedAt": "2026-09-02T01:52:01+00:00"}]}, {"label": "产品发布/更新", "items": [{"title": "曝魅族 AI 小方块将量产上市，搭载紫光展讯 T8200 处理器 + 4 英寸小方屏", "summary": "IT之家 9 月 7 日消息，据博主 @体验more 透露，魅族 AI 小方块将量产上市，搭载紫光展讯 T8200 处理器，配备 4 英寸小方屏。博主还晒出了魅族 AI 小方块的产品包装盒。参考IT之家此前报道，在 9 月 2 日的腾讯 WorkBuddy 生态发布会上，魅族 AI 小方块概念机亮相。据介绍，魅族 AI 小方块概念机搭载基于原生 AI 的 Flyme AIOS，通过深度融合智能交互与 WorkBuddy 云端 AI 工作台核心能力，带来全新 AI 协同办公体验。另外，魅族在今年 1 月的 2026 魅友新春会中公布了魅族 22 Next“AI 小方块”，使用聚碳酸酯亮面外壳，内置 Flyme AIOS。事实上，魅族已为该机规划了比较完善的 AI 智能体交互体验，其号称拥有数十个场景、超 100 个表情界面，可以放在吉利系汽车上作为“驾乘机器人”，不过后续就没了官方消息，只是在今年 6 月曝光了工程机。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/999/061.htm", "publishedAt": "2026-09-06T23:29:25+00:00"}, {"title": "《神鬼寓言》游戏总监称本作所有 NPC 均为人工设计，未使用 AI 及随机生成器", "summary": "IT之家 9 月 7 日消息，《神鬼寓言》游戏总监 Ralph Fulton 在接受外媒 GamesRadar+ 采访时，透露《神鬼寓言（Fable）》中的每一名 NPC 均为单独设计的，开发团队希望每个角色的职业、外貌和性格能够相互匹配，让整个世界更加真实可信。与许多游戏开发商直接使用 AI / 随机生成器不同，《神鬼寓言》开发团队放弃使用此类方式，希望通过人工设计，让 Albion 世界中的每个角色都更加独特，也更具生命力。Fulton 透露，最初团队内部确实有一个可以随机生成 NPC 特征的工具，这本来会大幅节省人力，也能为我们节省大量时间。但团队后来发现，如果完全依赖随机生成器，很容易出现职业、性格特征和外貌互相矛盾的情况。例如，一个角色的职业与其外观或行为特征并不匹配，就会让玩家感觉这个 NPC 只是由程序随机构建出来的，而不是这个世界中真正存在的人。因此，开发团队最终选择放弃使用生成器构建 NPC，开发团队在设计每个 NPC 时都会详细构思他们的所有细节，让他们成为一个可以被玩家理解、从头到尾都合理的角色。《神鬼寓言》预计于 2027 年发售。按照此前公布的信息，这也将是该系列首次登陆索尼 PlayStation 主机平台。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/999/052.htm", "publishedAt": "2026-09-06T22:53:56+00:00"}, {"title": "古尔曼：苹果考虑调整 App Store 以提高收入和利润率", "summary": "IT之家 9 月 6 日消息，据彭博社记者马克 · 古尔曼最新一期《Power On》时事通讯透露，苹果据称正在考虑对 App Store 进行一些调整，目标是进一步提高这一平台带来的收入。目前还不清楚苹果究竟计划对 App Store 做出哪些改变。古尔曼表示，苹果希望“想办法提高利润率，并从这一平台榨取更多持续性收入”，而这项工作主要由苹果新任 CEO 约翰 · 特努斯和现任服务业务高级副总裁埃迪 · 库伊推动。据称，这项计划也是苹果长期高管菲尔 · 席勒上周离职的原因之一。席勒在 2020 年卸任苹果全球营销高级副总裁一职后，转任苹果 Fellow（苹果院士），其职责之一就是负责 App Store。不过，席勒似乎并不赞成这一想法。古尔曼写道，席勒认为，这类举措只会进一步激怒开发者和政府部门。虽然公司内部并没有因此爆发什么严重冲突，但席勒显然不愿参与其中。苹果可以通过多种方式提高 App Store 的利润率。例如，苹果可以取消目前的人工应用审核流程。随着 AI 编程技术的发展，这套人工审核机制很可能成本高昂，而且效率并不算高。不过，进一步推动应用审核自动化恐怕不会受到用户欢迎，但从降低成本的角度来看，这无疑是一种可行的办法。苹果还可以提高开发者会员计划的收费。目前，苹果开发者计划的费用为每年 99 美元（IT之家注：现汇率约合 666.7 元人民币）。考虑到如今许多小型开发者为了开发应用，每月已经需要支付 200 美元（现汇率约合 1,347 元人民币）购买 Codex 和 Claude 等订阅服务，因此也有人认为，苹果完全可以提高开发者会员费用，而且开发者或许仍然会接受。此外，苹果还可以针对大型开发者推出基于流量的订阅收费模式，从而让这些开发者分担部分基础设施成本。最终苹果会采取哪些措施，目前还无法确定。究竟这些调整会发展成什么样，还需要时间才能揭晓。不过，这些潜在变化最终会是什么样子，确实值得关注。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/999/044.htm", "publishedAt": "2026-09-06T15:03:28+00:00"}, {"title": "谷歌云发布 AI 智能体，简化数据库生命周期管理", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/iV0rsPyO5XZDJ7797hLJ?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-04T09:21:00+00:00"}, {"title": "LibreOffice 26.8 首周下载量 103 万次创造新纪录，最大亮点是“没有一个 AI 功能”", "summary": "1,031,162。这是 LibreOffice 26.8 发布第一周的官网下载量。 The Document Foundation 说这是 LibreOffice 整个历史上最高的首周下载记录。上一个版本 25.8 的首周是 88 万次左右。 这个数字 s": []}]};

const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
