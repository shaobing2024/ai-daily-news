const DATA = {"date": "2026-09-21", "generatedAt": "2026-09-21T00:48:22Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "我国首款藏语多语言全模态 AI 输入法发布，覆盖手机、电脑等全终端", "summary": "IT之家 9 月 21 日消息，据科技日报昨晚报道，9 月 20 日，在青海师范大学教师教育高质量发展暨建校 70 周年大会科研成果展示环节，我国首款藏语多语言全模态 AI 输入法 —— 智达 AI 输入法及配套藏文字体集正式发布。据介绍，这是中国首款藏语多语言全模态 AI 输入法。该输入法由藏语智能全国重点实验室研发，依托实验室自主知识产权的大模型及相关 AI 基础设施，覆盖手机、电脑等全终端，支持文字、语音、图像等多模态输入，并可通过统一账号同步词库和输入习惯。青海师范大学教授、藏语智能全国重点实验室常务副主任多拉表示，本次发布的智达 AI 输入法是将智达大模型作为核心技术底座开发而成，在输入方式上，智达 AI 输入法的文本输入严格遵循国家标准藏语键盘布局，支持藏文拉丁转写，降低学习门槛；语音输入覆盖卫藏、安多、康巴三大方言的书面语与口语，同时支持汉、藏、英混合语音输入；OCR 识别输入可拍照或截图识别汉、藏、英混合文字，适用于文献数字化、教学材料整理与办公场景。IT之家注意到，输入法词库覆盖教育、法律、文学等 23 个学科的术语，并自动记忆用户输入习惯、常用词与表达方式。当日，研发团队同步公开适配智达 AI 输入法的藏文字体集，包括黑体、白体、艺术体和毛笔体四种风格。发布会上还展示了智达大模型。该模型共推出 9 个版本，参数规模覆盖 8 亿至 1000 亿，线上部署三大主力模型，支持 56 种语言互译以及图像、视频理解，可服务于教育、科研、政务等领域。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/005/027.htm", "publishedAt": "2026-09-20T23:50:15+00:00"}, {"title": "Vals AI 使用《我的世界》评测 Open GPT‑6 Astra 模型：显示 AI 遇重大变故可能陷入行为僵局", "summary": "IT之家 9 月 21 日消息，AI 评测机构 Vals AI 利用游戏《我的世界（Minecraft）》对 OpenAI 最新大模型 GPT‑6 Astra 开展长时自主游戏测试，全程在 Twitch 直播，总测试时长达到 141 小时。Vals AI 的这项测试并非由 OpenAI 官方设计，而是由第三方独立开展的评估项目，因此可以观察 Astra 在封闭测试环境之外的实际表现。在测试过程中，GPT‑6 Astra 展现出前所未有的长周期规划与执行能力，达成过往 AI 难以实现的成就。其成功搭建半自动烈焰人农场，收集 6 根烈焰棒。深入下界诡异森林，击杀多名末影人，拿到 3 颗珍贵末影珍珠。完成大量探险后，将全部稀有物资集中存放在营地木箱当中，床也放置在储物箱旁作为重生点。一切都在向着末地打龙的通关之路发展。然而，一只苦力怕悄悄靠近营地并发生自爆，直接炸毁储物木箱与重生床。AI 耗费上百小时积攒的关键道具几乎全部损毁，游戏进度一夜清零。爆炸事件之后，GPT‑6 Astra 表现出明显的挫败消沉。其彻底放弃探索、打怪、推进通关目标，连续数小时仅循环种植土豆。会反复自省告诫自己：重要物品务必随身携带，永远不要存放到没有防护的箱子。还出现“创伤后偏执”，对一切绿色物体高度警惕，甚至把甘蔗误认成爬行者，还主动提醒自己：“前面高高的绿色东西是甘蔗，不是苦力怕”。直播间观众不断催促 AI 加快节奏继续冒险，但其依旧陷在保守种田行为中。本次实验证明 GPT‑6 Astra 已具备复杂长任务规划能力，但面对游戏内突发的意外打击，缺少有效的挫折恢复策略。一旦长期积累的成果被意外摧毁，会导致 AI 陷入“受挫后回避行为”僵局。从技术角度来看，Astra 展现出的这种“受挫后回避行为”并非开发者预先设计的测试情境，而是模型在长时间 AI 测试过程中遭遇非预期损失后，自行呈现的一种输出模式。目前研究人员仍在讨论，这种行为究竟是否代表模型在特定情境下对情绪进行模拟，或者仅仅是目标函数在受到特定负反馈后出现的退化表现，现阶段尚无明确结论。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/005/026.htm", "publishedAt": "2026-09-20T23:45:34+00:00"}, {"title": "英伟达黄仁勋驳斥 AI 末日叙事：吓唬人不负责任，部分人士意在摆脱现有法律约束", "summary": "IT之家 9 月 21 日消息，英伟达联合创始人兼首席执行官黄仁勋昨日接受 CBS News 采访时表示，他不认同某些研究员提出的“AI 可能在几年内灭绝人类”说法。他觉得这类说法是 AI 末日叙事，已经被过度渲染。黄仁勋表示：“2030 年不会是世界末日，2030 年即是世界末日的可能性为 0%。吓唬人不负责任，也没有必要。”据悉，黄仁勋此番言论是在回应前 Anthropic 研究员雅各布 · 考克森的看法。这名研究员此前表示，Anthropic 和 OpenAI 两家公司的做法都不负责任。它们争相开发能够自我改进的超级智能，拿人类生命做赌注。考克森的激烈言论引发公众广泛讨论，Anthropic 首席执行官达里奥 · 阿莫迪、OpenAI 首席执行官萨姆 · 奥尔特曼等 AI 领军人物都呼吁放缓前沿 AI 发展。但黄仁勋表示，他不认同这类预测，因为它们没有科学依据。鉴于英伟达为 OpenAI 等公司的人工智能大语言模型提供算力，黄仁勋在这场争论中显然是利益相关。这家公司因为芯片需求旺盛，市值一度达到 5.3 万亿美元（IT之家注：现汇率约合 35.61 万亿元人民币），成为全球市值最高的公司。黄仁勋表示：“我们公司的成功与产品服务、安全部署息息相关。如果我们不能持续保持安全，我们的价值就会降低。”他认为，美国现有产品责任法以及针对未授权侵入网络的法律已经足够完善，因此没有必要再立法监管 AI 开发商。他还表示，自己赞同美国总统的观点，即 AI 行业不需要额外监管措施。“网络安全和损害责任法律已经涵盖了各种情况，首先就应该执行这些法条。不要让末日叙事，成为某些人摆脱现有法律约束的理由。”谈到中美 AI 竞争时黄仁勋表示，他认为美国创造的技术首先应该让本国人民受益，但他反对政府禁止美国科技产品出口中国：“每一家芯片公司都应该走向全球、服务全球，在全球市场竞争。美国就是要竞争的。”据彭博亿万富翁指数，黄仁勋目前的净资产为 1,820 亿美元（现汇率约合 1.22 万亿元人民币），位列全球第八大富豪。今年秋季，他所在的加利福尼亚州即将就“亿万富翁税”投票，如果该措施通过表决，净资产达到或超过 10 亿美元（现汇率约合 67.18 亿元人民币）的加州居民将被一次性征收 5% 的税款。尽管其他加州亿万富翁普遍批评该提案，但黄仁勋表示，他并不反对额外缴纳数十亿美元税款。他说道：“我能在五年内缴纳得起 80 亿美元（现汇率约合 537.47 亿元人民币）税，这是一种特权，也是一种责任，没有什么比缴更多税让我感到高兴。我不害怕缴税，只是害怕变穷。”黄仁勋还认为自己是“终极美国梦”的代表，认为美国给了他良好教育、职业发展机会，最终让他能成为一名企业家。黄仁勋透露，自己当年在 Denny's 餐厅当洗碗工时萌生了创办英伟达的想法，但从未想过自己有一天能站在 AI 行业的最前沿。“我当时只是非常、非常专注地把碗洗好，做到没有任何一个洗碗工能像我这样洗碗。”他说。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/005/017.htm", "publishedAt": "2026-09-20T22:58:21+00:00"}, {"title": "瞄准 AI 编程、金融等场景，单次成本仅为Opus 5 的1/8！这款国产旗舰模型跻身 AA 榜单全球前三", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/9jw1St7ULZijG8XNCWkW?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-20T19:52:32+00:00"}, {"title": "70强会师杭州，世界人工智能开源大赛（GOAI）总决赛即将启幕", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/MaOcETZFPCvAuFRQJps2?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-20T18:47:49+00:00"}, {"title": "全球AI Builders，9月杭州见｜GOAI开源周即将启幕", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/r8605s0h2Lv8OwmyW9s1?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-20T18:28:50+00:00"}, {"title": "世界人工智能开源大赛（GOAI）总决赛70强名单公布", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/7zz2HLNXEl0guawQCyJj?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-20T18:15:44+00:00"}, {"title": "微软开源 TauGrid，简化 Kubernetes AI 工作负载管理", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/3FdzSfrzlb3vMDwsC1Ny?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-20T15:46:00+00:00"}, {"title": "智谱 MaaS 平台上线数据内容不留存机制，用户可申请开通", "summary": "IT之家 9 月 20 日消息，智谱 MaaS 平台今日宣布，近期将上线数据内容不留存功能，为企业和开发者用户提供更严格的数据隐私保护。公告称，数据内容不留存机制旨在减少模型调用内容在平台侧的持久化留存。任何用户均可以申请开通，生效后，智谱 MaaS 平台不会对用户的输入和输出进行静态存储，数据仅用于完成当次模型调用。企业和开发者可通过 MaaS 控制台提交开通申请，具体生效时间及适用范围以平台确认结果为准。公告提到，这个功能并不意味着任何情形下都不留存数据。Batch API、File API 等需要在平台侧持久化保存任务或文件的功能不在上述覆盖范围内，以及法律法规要求留存、为核查涉嫌违规或滥用行为的情况，平台可能按有关要求留存相关数据 30 天及以上。据IT之家此前报道，针对社区中有关代码库数据上传的讨论，智谱旗下编程产品 ZCode 于 9 月 18 日通过智谱官方群组向受影响用户致歉，并发布回应称已第一时间完成自查，相关问题目前已经修复。此次问题源于 ZCode 的“代码库索引”功能，该功能旨在帮助用户在本地生成仓库索引，以支持包括历史版本在内的会话检查点恢复、历史版本回退及 Repo Wiki（代码仓库知识库）等功能。相关阅读：《智谱 ZCode 被质疑“偷传代码”：官方回应称问题已修复，将开源代码库、引入第三方审查》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/005/012.htm", "publishedAt": "2026-09-20T15:26:55+00:00"}, {"title": "贾跃亭的法拉第未来一口气发布九款配置 EAI 机器人，最贵超 92 万元", "summary": "IT之家 9 月 20 日消息，法拉第未来（Faraday Future，简称 FF）于美国当地时间 9 月 19 日举行了 919 FF EAI 机器人“四核全智”系列新品发布会，发布了 FF All-New Futurist、FF Master Mini、FX Aegis Hyper、FX Aegis Mega 及 FX Aegis Classic Ultra-W 五大型号、九款配置 EAI 机器人本体新品，以及 K-12 教育、科研、安防和巡检四套行业生产力解决方案。据官方介绍，FF“四核全智”开放生态由 EAI 大脑与开发者平台、EAI 本体、行业生产力解决方案和 EAI 数据工厂组成。本次发布重点呈现了其中 EAI 本体和行业生产力解决方案两核的最新产品及应用进展。FF 创始人、全球 CEO 贾跃亭表示：“FF 要构建的不是单一形态的全能机器人，而是由通用泛化的 EAI 大脑支撑多种本体形态，并通过 Agents、Skills 和真实场景数据持续进化的机器人生态。这一判断与李飞飞教授关于多形态机器人生态并存的观点不谋而合。多形态本体不仅覆盖更多任务，还产生多场景、多交互方式的真实数据，通过 EAI 数据工厂反哺 EAI 大脑训练、Skills 开发和本体迭代，推动形态与能力协同进化。”五大型号、九款配置 EAI 本体新品发布此次发布的九款配置新品覆盖人形和四足两大形态，以及 Futurist、Master 和 Aegis 三大系列。FF All-New Futurist 定位为旗舰级全尺寸职业型具身智能人形机器人，是“All in One 全能职业专家”。产品拥有 51 个主动自由度，升级高阶灵巧手后最高可达 71 个自由度；1,152 瓦时双电池支持约 8 小时标准工况运行，并支持自主充电。Ultra 版搭载 NVIDIA Jetson Thor，算力达到 700 TOPS，可结合 VLA、世界模型和任务规划能力，从执行单一指令进一步走向完成整体任务，面向科研、具身智能开发、企业服务、体育竞技及工业应用等场景。All-New Futurist 标准版本售价 89,900 美元（IT之家注：现汇率约合 60.4 万元人民币），含价值 10,000 美元（现汇率约合 67,184 元人民币）的技能包；Ultra 版本售价 129,900 美元（现汇率约合 87.3 万元人民币），含价值 15,000 美元（现汇率约合 10.1 万元人民币）的技能包。FF Master Mini 系列包括 Mini、Pro 和 Ultra 三款不同配置。其定位为教育及运动竞技型具身智能人形机器人，是“从课堂到赛场的全能选手”。产品身高约 95 厘米、重量约 19.5 公斤，三款配置分别提供 48、117 和 200 TOPS 算力，并开放运动、感知和应用接口，支持编程教育、开放开发、娱乐表演及机器人足球竞技。Master Mini 系列起售价为 9,990 美元（现汇率约合 67,117 元人民币），含价值 1,000 美元（现汇率约合 6,718 元人民币）的技能包。Pro 版本售价 12,990 美元（现汇率约合 87,272 元人民币），含价值 1,500 美元（现汇率约合 10,078 元人民币）的技能包。Ultra 版本售价 17,990 美元（现汇率约合 12.1 万元人民币），含价值 2,000 美元（现汇率约合 13,437 元人民币）的技能包。FX Aegis 系列此次新增轻量、中型和大型三类轮足产品。FX Aegis Hyper 定位为大型工业级四足具身智能机器人，面向极端环境、重载任务和高风险无人化作业，可搭载热成像、气体检测、3D 扫描及通信中继等专业上装。Aegis Hyper 起售价 137,900 美元（现汇率约合 92.6 万元人民币），含价值 15,000 美元（现汇率约合 10.1 万元人民币）的技能包。FX Aegis Mega 包含两款产品，定位为中型工业级轮足具身智能机器人，最高承载能力可达 50 公斤，可连续通过 25 厘米楼梯、跨越最高 80 厘米单级障碍，双电池支持热插拔，空载续航不低于 5 小时。Aegis Mega 售价 74,990 美元（现汇率约合 50.4 万元人民币），含价值 8,000 美元（现汇率约合 53,747 元人民币）的技能包。FX Aegis Classic Ultra-W 定位为安防陪伴型专业轻量轮足具身智能机器人，采用约 22 公斤的紧凑机身，兼具轮式移动效率、足式越障、低噪声和开放开发能力，支持二次开发、仿真训练、多机协同及专业上装扩展。Aegis Classic Ultra-W 售价 12,990 美元（现汇率约合 87,272 元人民币），含价值 3,000 美元（现汇率约合 20,155 元人民币）的技能包。官方称，随着九款配置新品发布，FF EAI 机器人世界正式升级至 2.0。目前，该产品体系覆盖人形、四足和轮臂三大形态，Futurist、Master、Aegis、Navi 和 Faber 五大系列，共计 11 个型号、24 款产品。四套行业生产力解决方案发布推出教育生态解决方案 1.0FF 此次还发布了 K-12 教育、科研、安防和巡检四套行业生产力解决方案。其中，K-12 教育和科研两套解决方案构成 FF EAI 机器人教育生态解决方案 1.0；安防和巡检两套解决方案面向社区、楼宇、园区、能源、电力、制造、矿山、隧道及大型设施等场景。以下是官方介绍：K-12 教育解决方案定位为面向 K-12 的 Physical AI 教学与竞技一体化成长平台，以 Master Mini 为核心，并通过 Navi、Aegis、Master 和 All-New Futurist 覆盖从低龄启蒙到高中进阶及大学科研的不同阶段。平台提供 Blockly、Python 和 ROS 三级课程及配套竞赛体系，贯通兴趣启蒙、编程学习、AI 实践、机器人竞技和科研升学等环节。该方案还包括机器人与开发套件、分学段课程、教学与学习平台、开发者平台、教师培训、课堂与竞赛项目、设备与班级管理、学习评估、数据安全和技术支持，为 K-12 私立学校、公立学校及学区和培训机构提供模块化支持。科研解决方案定位为全形态 Physical AI 教学与具身智能科研平台，以 All-New Futurist 为旗舰，组合 Master、Master Mini、Aegis Classic、Aegis Mega 和 Faber 等不同形态的 EAI 本体。平台提供统一 SDK、ROS 接口、仿真与数字孪生、数据采集、模型训练及 Skill 管理能力，支持运动控制、具身大模型、Sim-to-Real 和群体智能等研究，以及算法开发、仿真验证、真机部署和跨本体迁移。安防解决方案采用多机型分级覆盖模式，由 Aegis Classic 承担室内及楼宇巡护，Aegis Mega 承担大型户外和高风险任务，并可搭载热成像、360 度相机和 LiDAR 等专业上装。平台支持多机管理、自主巡逻、多模态感知、AI 事件识别、告警联动、远程操作及证据留档，覆盖社区、校园、园区、仓储和关键基础设施等场景。巡检解决方案面向能源、电力、制造、矿山、隧道及大型设施等场景，由 Aegis Mega 承担大型园区和电站的高频巡检，Aegis Hyper 进入极端及高风险区域，Faber 负责室内精细化操作。系统可搭载 PTZ 相机、热成像、气体检测、3D 扫描和机械臂末端工具，并通过 FF 智慧巡检平台提供自主建图、仪表 OCR、异常及泄漏识别、报告生成、告警和工单管理等能力。在“四核全智”开放生态下，合作伙伴可接入不同形态的 EAI 本体，并贡献专业上装、算法、Skills、数据及场景能力，共同开发面向不同行业的生产力解决方案。发布即上市、销售即交付，FF 搭建“6＋1”直销及共享租赁体系FF 提供标准本体、“本体＋技能包”及“本体＋解决方案”三类产品组合，并搭建“6＋1 FF EAI 机器人直销及共享租赁体系”。B2B、FF Par、E-commerce、Marcom &amp; Video Sales、Community 和 Mcube 六大通路覆盖不同客户及销售触点，并统一接入 FF 的订单、交付、价格和售后体系。FF 控股并控制的子公司 AIxC 旗下 RoboShare 则提供机器人按需租赁和符合条件设备的资产接入服务，进一步连接产品销售、渠道合作、资产运营和场景部署。所有新品已经同步启动销售与交付流程，用户可通过官网及 Amazon、RobotShop 等渠道下单和购买。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/005/010.htm", "publishedAt": "2026-09-20T15:10:23+00:00"}, {"title": "2026 年上半年，我国制造业人工智能重点场景应用普及率达 34.2%", "summary": "IT之家 9 月 20 日消息，据新华社报道，9 月 20 日，在安徽省合肥市举办的 2026 世界制造业大会上，国家工业信息安全发展研究中心发布的《制造业数智化转型能力水平（2026）》显示，今年上半年，我国制造业人工智能重点场景应用普及率达 34.2%，全国两化融合发展水平达到 67.1，整体进入数字化、网络化、智能化协同推进的新阶段。IT之家注：两化融合发展水平是指信息化与工业化在技术、产品、业务和产业等层面深度结合的成熟与发展程度。报告显示，数字化底座持续夯实，研发设计、生产制造、经营管理等环节实现数字化普及的企业比例分别为 86.3%、69.5%、81.4%；网络化融通纵深拓展，全国近五成的企业开展网络化协同，数字孪生、链网协同、智能生产等新业态、新模式加速涌现；智能化应用加速普及，人工智能技术重点场景应用普及率达 34.2%，较上年增长 5.5 个百分点，10.6% 的规上制造业企业依托人工智能大模型赋能业务革新。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/004/991.htm", "publishedAt": "2026-09-20T13:14:31+00:00"}, {"title": "阿里千问开源 Qwen-Image-2.1 图像模型：可生成、编辑透明图像，支持最多 10 张参考图", "summary": "IT之家 9 月 20 日消息，阿里千问今日宣布，开源千问图像系列当前兼顾生成效果、推理效率与使用成本的开源图像模型 Qwen-Image-2.1。Qwen-Image-2.1 将文生图与图像编辑整合在同一模型中，视觉生成部分仅有 7B 参数，并原生支持透明图像的生成与编辑。官方表示，本次更新的主要特色包括四个方面：小模强效，极致价比：轻量的模型结构与推理优化，在生成质量和计算成本之间取得平衡。▲ Qwen-Image-Bench 公开评测对比原生透明，创改一体：根据提示词生成普通图像或透明图像，并支持透明图层编辑与抠图。▲ 通过文本直接生成透明图像的示例全能编辑，多局保全：支持最多 10 张参考图，增强局部编辑、人像与商品保真，并覆盖多种编辑任务。▲ 十张家居参考图生成室内布置真实质感，字雅人美：提升文字排版、人物光影与细节表现，让生成结果更具美感。▲ 文字渲染示例IT之家附相关链接：GitHub：https://github.com/QwenLM/Qwen-Image-2.1HuggingFace：https://huggingface.co/Qwen/Qwen-Image-2.1ModelScope：https://www.modelscope.cn/models/Qwen/Qwen-Image-2.1", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/004/989.htm", "publishedAt": "2026-09-20T13:02:23+00:00"}, {"title": "FBI 局长称该局 AI 使用暴增 605%，靠 AI 拦下多起枪击事件", "summary": "IT之家 9 月 20 日消息，美国联邦调查局（FBI）局长卡什 · 帕特尔（Kash Patel）近日在一场采访中称，经他推动，联邦调查局对人工智能技术的使用量实现了 605% 的增长。虽然人工智能模型强大的模式识别能力，使其十分适合执法机构采用；人们也确实有理由预期 FBI 这类部门会运用这项技术，但外界很难厘清 605% 这个数字究竟统计的是什么。该说法出自福克斯新闻的一次访谈。帕特尔同时表示，人工智能“如果依法使用，就是开展数据筛选分类的关键工具”。他指出，这项技术对于保护儿童、防范校园枪击案有着极高价值。自他就职以来，人工智能在跟进一条线索、阻止北卡罗来纳州以及“另外六个州”发生枪击事件的过程中发挥了关键作用。帕特尔所说的 AI 使用规模提升接近七倍，具体所指并不明确。目前几乎没有确凿公开数据，可以说明 FBI 究竟在多大范围、以哪些方式引入人工智能。不过仍有部分线索，或许能够佐证他这一说法。最新相关资料来自一份 2026 年 2 月的报告，内容是美国司法部 2025 年度人工智能应用项目清单。报告显示，归属 FBI 的 AI 应用案例一共有 50 项，其中 9 项被标记为“高影响力项目”。而该局首席人工智能官凯蒂 · 诺伊斯（Katie Noyes）在同年 8 月发表的最新表态则称，FBI 获批投入使用的 AI 应用案例数量已经达到 139 项，差不多是一月份统计数字的三倍。去年，美国联邦总务署正式批准 Claude、Gemini 以及 ChatGPT 进入政府可用产品名录，向各个政府机构开放。今年 5 月，美国国防部也和八家 AI 企业签署合作协议。就在几个月前，FBI 发布采购文件，面向厂商征集报价，计划斥资 8,800 万美元（IT之家注：现汇率约合 5.91 亿元人民币）采购 AI 服务器。这一举动似乎说明该局有意进一步扩大 AI 相关业务部署。不过局势或许还会继续发生变化。就在几天前的 9 月 15 日，帕特尔在参议院听证会上表示，自己可以直接联系各大头部 AI 企业的首席执行官。他称：“这些企业的负责人全部配合我方诉求，在执法事务上与 FBI 开展协作。”或许更为关键的一点是，他提出，能够访问厂商的大模型，有助于打击借助人工智能实施的犯罪；如今不少犯罪团伙已经利用模型蒸馏攻击的手段，自行搭建属于他们的专用 AI 模型。如今 FBI 也已经专门设置分类标签，用来统计各类和人工智能相关的犯罪。在最新发布的互联网犯罪报告当中，FBI 重点指出，投资诈骗、婚恋骗局以及虚假求职诈骗，是 AI 作恶的高发领域。而帕特尔曾在今年 5 月发表的一篇专栏文章当中提出，借助人脸识别等人工智能工具，失踪儿童的寻回数量提升了 30%，虐童案件逮捕人数上升 20%。他还在文章当中写道：“FBI 现已启用全新 AI 工具，完成通话录音转写、生成内容精简摘要，甚至辅助梳理人员联络关系，并关联其他已收到的报案线索。”他特别提到，以往分析师团队处理凭搜查令调取到的海量通讯信息往往要耗费数周时间，而人工智能就可以轻松完成这类工作。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/004/986.htm", "publishedAt": "2026-09-20T12:29:12+00:00"}, {"title": "一张3090就能跑！全栈国产模型，把AI办公搬到企业本地", "summary": "AI办公这块蛋糕，中国电信可能要先切走一块了。", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/492946.html", "publishedAt": "2026-09-20T12:22:41+00:00"}, {"title": "“只剩一群用 LLM 的菜鸟”：顶级黑客怒退 PS5 Linux 项目，几个月心血全打水漂", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/kCUJZby0B8SZ6kIlULQD?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-20T11:51:39+00:00"}, {"title": "断网仍可作战：AI 模型加持的无人机可实现战场自主识别、打击目标", "summary": "IT之家 9 月 20 日消息，据 Arstechnica 报道，随着欧洲各国军队开始适应现代战争当中人工智能与无人机的应用，一家获得北约支持的初创企业正在协助部署由 AI 驱动的目标探测与筛选系统。这套系统可以直接在小型无人机上运行，用于侦察以及打击任务。据IT之家了解，这家名为斯凯奥特系统（Scaleout Systems）的公司，由瑞典乌普萨拉大学的研究人员于 2018 年创立。公司早期的业务重心，是直接在商用卡车以及其他车辆的硬件上完成机器学习模型的训练与部署。但 2022 年俄乌战争爆发之后，该公司调整方向，转向防务领域。“乌克兰战事爆发，加之全球局势发生转变，我们意识到这项技术十分重要。借助它，边缘端的数据与传感器数据就可以投入机器学习运算，从而帮助北约盟国建立战略优势。”斯凯奥特系统联合创始人兼首席执行官安德烈亚斯 · 赫兰德（Andreas Hellander）在接受采访时表示。斯凯奥特并没有选用 OpenAI 或是 Anthropic 的前沿大模型，而是采用轻量化模型；这类机器学习模型能够直接在无人机硬件或是前沿基地的计算机上完成计算机视觉任务。“模型必须适配前沿部署设备与边缘硬件。这类硬件跨度很大，既有小型嵌入式装置，也有性能相当强劲的边缘工作站。”赫兰德说道。2025 年，斯凯奥特入选北约北大西洋防务创新加速器（DIANA，Defence Innovator Accelerator for the North Atlantic）挑战项目。依托该项目，公司开展了“联邦空中侦察情报”项目（Federated Aerial Intelligence for Recon），针对无人机、无人机飞手平板以及野外指挥所内的边缘计算硬件改造机器学习模型。即便无人机摄像头与传感器持续采集周边战场环境的数据，这套 AI 模型依旧可以辅助无人机操作人员完成目标识别等工作。之后系统可以有选择性地、间歇性地向排、连一级的本地指挥所计算节点推送更新，而无需传输敏感的原始数据。指挥所的计算节点会汇总来自多方的全新战场数据，对 AI 模型开展再训练；待到合适时机，再把升级后的模型下发部署到各个边缘设备。“有些模型是在沙漠环境下训练出来的。如果直接放到城市环境当中使用，识别效果就会很差。”赫兰德表示，“如果在单次作战乃至一天之内，就能够推出多个新版本模型，依托边缘端源源不断产生的海量传感器数据持续学习、持续迭代优化，这才是可持续的作战优势。”在实兵演习当中测试该项技术依托这套技术，军用无人机以及各类终端设备可以运行本地 AI 模型，独立开展运算，不必持续和数据中心内运行大型 AI 模型的中央服务器保持通信。如今已有大型数据中心在美伊冲突期间遭到打击摧毁，继续依赖中心化服务器运行 AI 模型的风险正在升高。而在现代战场上，电子战以及敌方干扰常常会扰乱通信信号，这就使得该技术方案更具实用价值。已经有越来越多乌克兰军用自杀式无人机开始搭载机载人工智能功能。“我们已经基于无人机搭建完成一套侦察监视系统的可行概念原型。这套系统也已经在瑞典的公开演示活动当中对外亮相。”赫兰德介绍。斯凯奥特目前参与了由博福斯 BAE 系统（BAE Systems Bofors）牵头的 ALMA 项目，项目全称“经济型模块化巡飞弹药（Affordable Loitering Modular Ammunition）”，目标是研发低成本自主自杀式无人机。ALMA 概念机型最早于今年 1 月在瑞典举办的 2026 冬季演示活动上公开亮相。根据斯凯奥特系统关于 ALMA 性能的演示材料，该演示证实无人机可以借助人工智能，自主“探测、识别所有已经发现的潜在威胁，并给出目标地理坐标。全部数据都交由机载专用计算单元处理，整套系统无需外部运算即可实时完成作业。”依靠机载 AI 能力，无人机会根据本次作战任务的设定，自动筛选优先级最高的目标 —— 本次演示当中的目标是一台装甲工程车；随后无人机飞向目标，投放爆炸物实施打击。操作人员依旧可以对无人机进行管控与指挥；但无人机也可以脱离操作人员的实时指令，自主完成整套作战流程。今年 6 月，斯凯奥特又在瑞典乌普萨拉的一处瑞典空军基地完成技术测试。瑞典军方已经取得许可，可以使用斯凯奥特的主要软件平台。本次演示验证：当前沿部署的基地计算节点与斯凯奥特实验室的中央计算节点之间通信中断以后，本地设备依旧可以独立开展 AI 推理以及主动学习。一旦通信链路恢复，本地完成更新的 AI 模型就会同步回传给中央计算节点。赫兰德解释，这种联邦学习架构能够让去中心化 AI 模型网络依托汇总的数据持续学习；未来这套方案还有望拓展覆盖整片区域乃至多个国家。“原则上，该技术可以实现北约各成员国之间的协同合作。”他表示。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/004/954.htm", "publishedAt": "2026-09-20T11:36:44+00:00"}, {"title": "奇瑞 iCAR V27 长续航版 9 月 30 日上市，现款 16.98 万元起", "summary": "IT之家 9 月 20 日消息，据易车今日报道，iCAR V27 长续航版将于 9 月 30 日上市，除了续航里程的提升，新车还将在座舱舒适、智能体验方面进行全面升级。IT之家注意到，奇瑞 iCAR 首款增程 SUV 车型 V27 于今年 3 月 13 日上市，该车是一款硬派方盒子中大型 SUV，搭载 1.5T 增程系统，号称“最好开的 5 米方盒子”。210km 两驱猎鹰 500：16.98 万元200km 四驱猎鹰 500：18.28 万元200km 四驱猎鹰 700：19.68 万元车身尺寸方面，在售 iCAR V27 长宽高分别为 4909/5055（IT之家注：分别为不含 / 含备胎）*1976*1855/1894mm，轴距为 2910mm。其采用竖向排列尾灯组，配备侧开尾门、外挂式备胎和粗壮的后保险杠。内饰方面，iCAR V27 采用了经典的 T 形中控台布局、悬浮式的中控屏，还配有实体按键以及驾驶模式切换旋钮。新车全系标配高通骁龙 8295P 芯片，具备 30TOPS AI 算力，语音助手融合 AI 中枢大模型 +DeepSeek，支持四音区识别，另外还提供 CarPlay、HiCar、CarLink 手机无线互联，以及 Switch 有线投屏等设备联动功能。动力方面，iCAR V27 采用由 1.5T 发动机与电机组成的增程系统，发动机最大功率为 105kW，并会拥有后驱以及四驱版本，其中四驱版最大功率达到 335kW，纯电续航 200km（四驱版）/210km（两驱版），综合续航 1200km（四驱版）/1230km（两驱版）。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/004/952.htm", "publishedAt": "2026-09-20T11:27:05+00:00"}, {"title": "MiniMax Code CLI 开源，取得了 76.7% 的任务通过率", "summary": "MiniMax 把 AI 编程工具的核心组件开源了。MiniMax Code CLI 的 v0.4.12 版本面向全球开发者正式开放，并用 MIT 协议放出了源码——它是 MiniMax Code 客户端的核心组件，装上就能直接用命令行生成、调试代码。 性能数据来自 FrontierHarness Eval 评测：76.7% 的任务通过率，成功任务耗时中位数为 4 分 33 秒，两项指标...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.n 中文", "sourceUrl": "https://www.infoq.cn/article/wKbZ8JlwJX26gTsW8r2o?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-20T11:37:58+00:00"}, {"title": "AI 时代架构往哪走？快手 AI 时代的架构演进思路｜QCon上海", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/YoUBefokMC6MFP0otviQ?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-20T10:00:00+00:00"}, {"title": "当企业 AI 从演示走向真实业务， 十几位科技领导者看到了什么？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/zFIHHoq5Tsj4ybQzpjq3?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-19T17:20:08+00:00"}, {"title": "Termexo v0.10.4 发布：集成 Grok Build，修复会话 Git 变更归零", "summary": "Termexo v0.10.4 已发布。新版将 Grok Build 纳入现有 AI 编程终端工作台，并修复长时间使用后会话代码变更显示为 0、Git 面板变空的问题。 Grok Build 加入工作台 安装并登录 Grok Build CLI 后，Termexo 可以检测它、在工作区中启动终端、列出并恢复会话，也可以在任务看板中选择 Grok Build 执行任务。它与 Claude C...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502594", "publishedAt": "2026-09-19T17:18:46+00:00"}, {"title": "“留给人类阻止AI的时间不多了”", "summary": "AI有可能终结我们所有人", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/492755.html", "publishedAt": "2026-09-19T11:53:12+00:00"}, {"title": "用 Seedance 2.5 拍《沙丘 3》，我们替你把 AI 短片的坑全都踩过了", "summary": "﻿ 看到这条视频，你会不会以为《沙丘 3》提前泄露了。 这其实是一部由我们团队的两位同事，花 12 天时间，结 […]#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1680580?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-09-17T06:45:13+00:00"}]}, {"label": "论文研究", "items": [{"title": "古尔曼：苹果最快下月推出智能家居屏幕设备，iPhone Duo 专属手写笔计划夭折", "summary": "IT之家 9 月 20 日消息，据彭博社记者马克 · 古尔曼（Mark Gurman）报道，苹果“个人智能中枢”AI 战略，暗示新款家用设备即将到来。报道称，苹果全新的“智能个人中枢”战略，其意义远不止局限于 iPhone。此外：苹果对 Fitness+ 业务实施了裁员，该服务未来走向存疑；iPhone Duo 专属手写笔计划已经夭折；Apple Pay 即将正式登陆印度。IT之家附报道内容如下：本月，约翰 · 特努斯（John Ternus）以苹果新任首席执行官的身份发表了自己的首场主题演讲。演讲开头几分钟，他阐述了自己对于人工智能时代下设备发展的愿景。他请观众设想：从零开始设计一台理想的 AI 设备。这款产品需要可以永久联网、配备尺寸合适的显示屏、顶级的摄像头与麦克风，同时还要拥有优秀的续航。特努斯还补充，它必须易于使用，并且可以和其他硬件、软件以及各项服务协同工作。这番表述，让台下听众感觉他马上就要发布一款突破性新品，用来和市面上越来越多专门面向 AI 的硬件产品展开竞争。演讲感染力极强，甚至苹果内部不少员工都以为，他接下来就要正式推出传闻已久的家用 AI 中枢设备。然而，特努斯想传递的观点与此截然不同。在他看来，这台理想 AI 设备其实早已问世 —— 就是 iPhone 本身。他会发表这番言论并不令人意外。眼下 OpenAI 即将发布以 AI 为核心的专用计算机，苹果又尚未推出颠覆性的全新移动硬件，最新一代 iPhone 自然就成为 Siri AI 与 Apple Intelligence 最好的展示窗口。换句话说，这也是特努斯手里仅有的底牌。未来一旦出现其他产品取代 iPhone，成为消费电子的核心，他的看法或许也会随之改变。但就现阶段而言，可以预见特努斯仍会继续宣扬这套“智能个人中枢”思路：智能手机在苹果生态当中的地位还会进一步强化。如果你想要明年秋季的新款苹果智能眼镜，前提依旧需要一台 iPhone；配备摄像头的 AirPods 同样离不开 iPhone。这种以手机为中心的格局还会持续多久？持续时间大概率会超出很多人的预判。未来，当增强现实眼镜可以在轻薄机身内集成足够的本地算力与云端计算能力之后，或许才有机会取代 iPhone；但距离那一天还有很多年。现阶段，搭载 AI 能力的 iPhone 依然是整个生态的绝对核心。不过，特努斯在论证 iPhone 作为个人智能中枢的同时，也为其他硬件留出了发挥重要作用的空间。其中就包括传闻已久的家用智能显示屏，这款设备最快有望在下个月正式发布。它也将是特努斯上任初期最重要的发布产品之一，这些产品还有 iPhone Duo 折叠机以及尚未亮相的触控屏 MacBook。iPhone 锚定用户的移动生活，而这块家用智能显示屏，则会充当家庭内部的设备中枢。产品定位是整合全部智能家居设备控制、视频通话、室内对讲以及媒体播放；同时接入苹果各项服务与应用。设备运行一套以 Siri AI 为核心打造的全新操作系统。这款设备在苹果内部代号为 J490，现阶段已经大量分发至员工家中开展实测，为正式发售做准备。该产品几乎满足了特努斯对智能个人中枢的各项描述：依托家庭 Wi‑Fi 实现持续联网、一块素质优秀的显示屏、搭载摄像头与麦克风；交互界面融合了 iOS、tvOS 以及 watchOS 的设计特点；首次开机配置以及多项同步任务依旧需要和 iPhone 配对完成。屏幕大致呈方形，拥有两种形态版本：可以摆放在支架上（外形类似对半切开的 HomePod mini）；也支持壁挂安装。该产品与亚马逊公司的 Echo Show 最为相似，但屏幕尺寸明显更小。一大核心功能是前置摄像头实现人脸识别：设备可以识别站在屏幕前的使用者，并据此做内容个性化推送，包括应用、备忘录、日程、新闻、音乐以及播客。Echo Show顺带一提：这款家用显示屏没有采用标准 Face ID 深度传感器，依旧能实现人脸识别。这件事也让我相信：未来折叠机 iPhone Duo（当前仅支持 Touch ID 指纹解锁）即便机身内部空间受限，苹果依然有机会为它补上面部识别功能。当然苹果还必须攻克安全性难题，如果解锁门槛过低，手机的安全风险将会随之上升。这块家用屏幕拥有独立主屏幕、小组件以及表盘，设计思路类似 Apple Watch，也借鉴了 iPhone Duo 升级后的待机模式（StandBy）。而真正的王牌功能还是 Siri。苹果原本计划最早在 2024 年就推出该硬件；但必须等到助手端 AI 能力成熟才能够正式上市。如今时机终于到来：Siri AI 已经随 iOS 27 于本月正式上线。按照苹果的设想，用户可以在家用中枢设备上通过 Siri，跨设备、跨账号检索自己的各类信息。你可以直接语音指令播放别人早前发送过来的播客或者歌曲；调取特定图片进行展示；也可以在备忘录、提醒事项、日历之内完成更加精细化的操作。依托 Siri AI，用户还能够在苹果自家系统界面内完成更复杂的搜索。回顾史蒂夫 · 乔布斯执掌苹果的时期，他曾经明确提出，苹果必须牢牢覆盖人们日常生活当中三大核心场景：居家、出行、车载。在特努斯的掌舵之下，iPhone 继续承担移动出行场景的核心；而姗姗来迟的家用中枢显示屏（搭配新版 HomePod mini 与支持 Siri AI 的 Apple TV），将帮助苹果进一步抢占家庭场景。唯独车载场景依旧悬而未决。目前除 CarPlay 车载系统之外，苹果尚未拿出成熟的解决方案。众所周知苹果曾经耗时十年研发自动驾驶汽车项目，最终于 2024 年初终止；少为人知的是，特努斯正是公司内部反对造车项目呼声最高的高管之一。如今居家、移动两大板块布局逐步落地，接下来外界就可以观察他能否为第三个关键的车载业务摸索出新方向。其他动态简报iPhone Duo 手写笔后续此前在 iPhone Duo 发布会前夕就曾有消息：苹果曾经专门为这台折叠手机测试过一款新款磁吸手写笔，笔身更短，可以吸附在设备转轴位置。这是一个颇具争议的想法，毕竟乔布斯曾经留下一句著名论断：没有人想要在手机上使用手写笔。当时我的分析就认为这款配件不会亮相，事后也印证了这个判断。苹果最后的方案改为：直接让折叠机兼容现有 iPad Apple Pencil（内外两块屏幕都可以使用）。背后原委是：原本专门为 Duo 开发的手写笔方案，在量产前夕遭遇严重技术故障。于是苹果放弃独立配件，转向复用 iPad 手写笔。但想要让 iPad 手写笔正常在折叠手机上工作，并不是简单开启开关即可。苹果需要推送专门的软件版本，同时完成大量内部测试。适配工作目前正在推进；苹果发布会期间对外表态，手写笔支持会在 2026 年底之前上线。按现有节奏来看，大概率要等到年末很晚的时候才会正式开放。Fitness+ 业务启动裁员，服务未来存变数今年早些时候我就曾报道，苹果正在重新评估 Fitness+ 健身订阅业务。该业务对标 Peloton，现在由服务业务负责人埃迪 · 库（Eddy Cue）以及健康部门主管桑布尔 · 德赛（Sumbul Desai）共同监管。就目前情况而言，这项服务暂时还没有到直接关停的地步。但该业务内容制作成本居高不下，用户流失持续存在，缩减开支自然就成为苹果优先考虑的方向。就在上周，Fitness+ 出现新一轮人员裁减。被裁员工当中不少负责音频内容板块，也就是 Apple Watch 无需视频就可以收听的《Time to Walk》、《Time to Run》步行跑步音频节目。往后音频类内容更新频次将会下降，但现阶段并不会彻底停止更新。在 Fitness+ 团队内部，很多员工将本次裁员视作序幕：未来数月到数年之内，该业务大概率还会迎来更大幅度的成本削减以及业务重构。个人判断，苹果最终很可能会把 Fitness+ 整体整合进改版之后的“健康（Health）”App；目前两大板块已经归属同一业务线管理。新版健康 App 改版之后已经计划加入短视频片段，用来讲解各项健康指标。读者问答专栏Q：最新 iOS 测试版有哪些新变化？A：上周苹果推送了各大系统的首个 27.2 测试版本，带来不少改动。新版 iOS、iPadOS 27.2 已经开始面向开发者与内部测试人员，提前测试新版健康 App（正式版健康 App 更新要等到后续版本）。另外 Apple TV 应用首次在非 tvOS 设备上支持用户配置文件；Siri AI 新增更多语种支持。至于版本号直接跳到 27.2 而不是 27.1，推测 27.1 版本是专供 iPhone Duo 折叠机的专属版本。如果你准备入手这台折叠手机，现阶段不建议升级 iOS 27.2；版本差异很有可能会在 10 月 23 日新机初始化设置的时候引发故障。Q：你觉得明年第二代 iPhone Duo 会做全新外观改款吗？A：可能性不大。大家需要慢慢适应苹果如今的产品策略：一套硬件设计会沿用很长周期。MacBook Air 与 MacBook Pro 现有外观已经持续五年；Apple Watch Ultra 4 沿用了 2022 年初代设计；AirPods 多年外观几乎没有改动。苹果设计部门现阶段已经不再高频迭代外观。回想早年，2010‑2013 短短四年之间 iPad 连续四代全部换新外观；现在时代已经不一样。因此我判断仅仅间隔 12 个月，苹果不会急着对第二代 iPhone Duo 重新做整机外观。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/005/009.htm", "publishedAt": "2026-09-20T14:38:17+00:00"}, {"title": "农业农村部：大力推进“人工智能 +”农业，拓展无人机、物联网等应用场景", "summary": "IT之家 9 月 20 日消息，据财联社报道，农业农村部党组今日召开会议。会议强调要把培育壮大农机装备产业作为农业现代化的关键支撑，坚持智能化、绿色化、融合化发展方向，聚焦高端智能、丘陵山区适用农机等突出短板，集中优势资源力量，攻关突破一批标志性整机和关键共性技术，加快中试验证和熟化应用，让农业生产更多领域“有机可用、有好机用”。要大力推进“人工智能 +”农业，拓展无人机、物联网等应用场景，让新质生产力更好赋能现代农业发展。IT之家注意到，本月初，农业农村部、工业和信息化部联合印发《全国农业机械化发展”十五五”规划》（以下简称《规划》），明确了“十五五”时期农业机械化高质量发展的总体要求、具体目标和重点任务举措。《规划》提出，到 2030 年，农业机械化高质量发展取得显著成效，农作物耕种收综合机械化率超过 80%，丘陵山区农作物耕种收综合机械化率力争提高到 75% 以上，畜牧水产养殖、农产品初加工机械化加快发展；人工智能、新能源等新技术新装备在农业机械化领域广泛应用；农机作业社会化服务能力大幅提高，农机防灾减灾救灾能力显著增强。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/004/956.htm", "publishedAt": "2026-09-20T11:48:40+00:00"}, {"title": "九问 ScienceDiscovery：从纳米抗体到大飞机，AI 如何从“给答案”走向“做研究”", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/7V4eTBr4WwyJbQp7RTOK?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-20T09:59:20+00:00"}, {"title": "华为发布“Peerium 计算架构”，让百万处理器成为一台计算机", "summary": "华为发布AI时代的全新计算架构 – Peerium计算架构。该架构能实现百万级处理器成为一台计算机，以满足不断发展的AI算力需求。 Peerium计算架构是基于嵌套并行，统一内存寻址、平等互联实现百万级处理器强扩展的计算架构。Peerium计算架构突破了图灵范式，提出了Nested BSP，突破了冯·诺依曼单机架构，颠覆了长久以来的主...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502587/huawei-new-computing-architecture-peerium", "publishedAt": "2026-09-18T08:41:45+00:00"}, {"title": "iPhone 18 Pro 系列正式开售，新 AI 功能「自相矛盾」", "summary": "未来，摄像头要抢在任何算法介入之前，证明「以上像素来自我」#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1680844?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-09-18T04:14:53+00:00"}, {"title": "Anthropic 提出三个度量指标，想量化“AI 发展到底有多快”", "summary": "\"我们芯片多、我们跑得快\"——这种话听多了就容易变成营销。Anthropic 这次换了个思路：与其互相吹，不如直接把自家实验室的内部数据拿出来，给\"AI 发展速度\"这件事定一套可以测量的指标。 它发了三份方法论性质的度量。第一份叫\"AI 主导研发（AI-led R&D）\"，借用 Epoch AI 的自动化分级（AL0 到 AL5，AL3 是 AI 协作、...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502569/anthropic-measuring-pace-of-ai-development", "publishedAt": "2026-09-18T03:45:58+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "日产第 14 代 Skyline 轿车将于 12 月亮相：利用 AI 缩短开发周期，预计搭载 3.0 升涡轮增压 V6 发动机", "summary": "IT之家 9 月 21 日消息，据“朝日新闻”报道，日产 CEO 伊万・埃斯皮诺萨（Ivan Espinosa）透露第 14 代 Skyline（V38）轿车将于今年 12 月正式亮相。该车为后轮驱动设计，号称是“日产重振品牌的重要产品”。值得注意的是，V38 项目从立项到完成仅用了 26 个月，相比上一代 V37 长达 55 个月的开发周期缩短了一半以上。日产表示，这一开发速度得益于 AI 技术在设计、工程、测试和生产等环节的广泛应用。外观方面，新车将融入 Skyline 历史设计元素，包括复古风格的圆形大灯、与车身融为一体的灯组和雕刻感较强的翼子板，借此向经典的“箱型 Skyline”GT-R 时代致敬。规格方面，V38 将继续采用日产较为熟悉的 FM 前中置平台，不过针对新一代车型的排放和安全要求进行了升级。相应平台最早随 V35 代 Skyline 推出，至今已经存在近 25 年，这种布局能够将车辆重量尽可能集中于底盘中央，从而减轻前悬架负担，并改善车辆的转向响应和动态稳定性。动力方面，V38 预计提供 6 速手动变速箱和 9 速自动变速箱，搭载 3.0 升涡轮增压 V6 发动机。目前日产 Z 搭载的 VR30 发动机最大功率超过 400 马力，日产也正在评估未来推出混合动力版本的可能性。从更大的产品战略来看，V38 采用的 AI 开发流程只是日产重组计划的一部分。日产计划进一步推进核心零部件标准化，并围绕 3 个核心车型家族进行产品布局，目标是让这 3 个车型家族贡献日产全球销量的 90%。日产还透露，采用如此快的开发速度部分也源于与中国东风汽车合资合作过程中积累的新运营经验。随着中国汽车市场在开发速度和成本控制方面不断提高行业标准，日产正在重新审视并调整自身研发流程。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/005/015.htm", "publishedAt": "2026-09-20T22:43:17+00:00"}, {"title": "从“看见文字”到“读懂画面”：AI MediaKit 如何实现视频字幕无痕擦除", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/Vqhz90IcQjPlqNXIbfAk?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-20T19:23:38+00:00"}, {"title": "IT之家专访苹果 iPhone 营销副总裁凯安 · 德兰斯：iPhone Duo 追求最终用户体验，而不仅仅是为了技术", "summary": "IT之家 9 月 20 日消息，北京时间 9 月 10 日凌晨 1 点，苹果传闻已久的首款折叠屏手机 iPhone Duo 终于亮相，iPhone 18 Pro 系列同步上新，这也是新任 CEO 约翰 · 特努斯（John Ternus）执掌苹果后的首秀。9 月 17 日，苹果全球 iPhone 产品市场营销副总裁凯安 · 德兰斯（Kaiann Drance）在上海接受了IT之家专访，谈到关于 iPhone Duo 和 iPhone 18 Pro 的一些设计理念。IT之家：iPhone 18 Pro 售价上调，但外观设计延续上代，直观的硬件改动不多，光圈等对普通消费者也过于抽象，iPhone 18 Pro 会靠哪些体验打动消费者呢？凯安 · 德兰斯：当然，首先回答您关于光圈的问题。我们研发的可变光圈的精妙之处在于，即使你不懂如何使用光圈，或者不是使用 Pro 级控制选项的专业人士，可变光圈都可以帮助日常拍摄的照片和视频看起来效果更好，自动调整进光量，所以用户即使在弱光下也能拍摄出兼具清晰度、景深效果的最佳照片。除了相机功能，得益于 A20 芯片，（iPhone 18 Pro 系列的）性能也得到了巨大的提升，这不是简单常规的年度升级，CPU 性能提升了 20%、GPU 性能提升高达 40%，NPU 核心数和神经网络引擎数量翻倍，现在有多达 32 个核心，都建立在 2nm 制程工艺之上。A20 Pro 与 VC 均热板紧密贴合，性能更加稳定，将有助于提升日常任务、游戏和其他高性能负载时的使用体验。凭借令人难以置信的电池续航能力提升，这将使您的 iPhone 更加经久耐用。IT之家：有消费者认为折叠屏属于伪需求，日常实用场景有限，还要承担耐用性和维修成本的代价。对于普通用户来说，iPhone Duo 真正不可替代的高频可用场景到底是什么？凯安 · 德兰斯：iPhone Duo 是第一个可折叠设计的 iPhone 手机，我们自己也很兴奋并且乐意使用的产品，这就是我们把它展示给世界的原因。我认为非常简单地说，iPhone Duo 拥有所有 iPhone 中最大的显示屏，可提供令人难以置信的观看体验；但折叠之后，它变成了一个外观美丽、能一只手放进口袋的设备。此外，重新设计的 iOS 系统也是体验中重要的一环，因为它可以让你感受到 iPhone Duo 流畅和直观的体验，用这么精致美观的大屏幕完成多任务处理，这种体验真的很沉浸，在浏览宽屏内容时仍感觉像熟悉的 iPhone。你可以真正看到和感受到我们（产品）的不同，苹果的软硬件集成，每件事都经过深思熟虑，包括从展开到折叠的过渡效果、手机在不同形态下如何放置，所以会给你一个非常舒适的使用体验，我们真的在追求最终的用户体验，而不仅仅是为了技术。IT之家：折叠屏产品竞争非常激烈，苹果首款折叠屏手机有哪些功能体验要好于竞品，又有哪些功能可能会引领整个行业的走向？凯安 · 德兰斯：我认为在设计 iPhone Duo 的时候，有几个是我们非常想要创造的体验，比如一致的屏幕长宽比、流畅连续的折叠屏开合体验。我们还想提供使用大屏幕时非常好的视觉效果，所以我们开发了一种定制纳米纹理表面工艺，视觉体验很好，可以减少眩光与反光，同时摸起来也很高级，还减少了折痕的可见性，抵抗划痕和凹痕的能力也更强，总之它提升了 iPhone Duo 的整体耐用性。耐用性非常重要，我们选取了五级钛金属铰链，支撑屏幕部分用了数百个带有支撑和碳纤维的小部件，达成了令人难以置信的耐用设计，另外它（开合手机）本身就是一个美妙的体验，能感受到如此流畅和顺滑，手机还能以稳定和优雅的形态朝着不同方向摆放。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/005/013.htm", "publishedAt": "2026-09-20T15:38:01+00:00"}, {"title": "华为首发企业AI白皮书：AI让员工更快了，怎样让整个企业受益？", "summary": "AI越来越能干，企业该怎么用", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/493068.html", "publishedAt": "2026-09-20T14:23:52+00:00"}, {"title": "Dropbox 分享如何通过提升现有基础设施能效为 AI 腾出算力余量", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/zVZhvQIW9BvrWd3SU7st?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-20T14:06:00+00:00"}, {"title": "《网络安全人才实战能力报告-AI赋能篇》正式发布，当AI进入业务深水区安全如何跟上", "summary": "9月18日，在第一届中国网络空间安全大会上，《网络安全人才实战能力报告—AI赋能篇》正式发布", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/492849.html", "publishedAt": "2026-09-20T02:48:18+00:00"}, {"title": "从技术深潜到动手实战，Snowflake World Tour 技术专场让 AI 走进真实业务", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/mrl45Fq31U7JORZsV5re?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-19T17:02:13+00:00"}, {"title": "ColorOS 17 新技术解读，渲染、调度与 AI 升级", "summary": "2026 年 9 月 17 日，2026 OPPO 开发者大会（ODC26）在珠海举行，ColorOS 17 正式发布。新系统将率先搭载在即将上市的 OPPO Find X10 系列和一加 16 等机型上，后续逐步开启推送。 一场系统发布会通常分为两部分来看，一部分是面向用户的功能清单，另一部分是面向开发者的架构改动。ColorOS 17 这次拿出来的东西，两条线...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502593", "publishedAt": "2026-09-19T04:47:31+00:00"}]}]};

const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
