const DATA = {"date": "2026-09-16", "generatedAt": "2026-09-16T01:01:17Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "OpenAI GPT-5.5 将于 10 月 14 日下线：覆盖 ChatGPT 与 Codex，官方建议迁移至新模型", "summary": "IT之家 9 月 16 日消息，OpenAI 今日宣布，GPT-5.5 将于 10 月 14 日从 ChatGPT、ChatGPT Work 和 Codex 中下线，覆盖所有订阅方案。OpenAI 同时提醒，在 Codex 中使用 GPT-5.5 的用户应尽快切换至 GPT-5.6 Sol 或 GPT-6 Astra。OpenAI 表示，此次停用范围包含所有计划。对于仍依赖 GPT-5.5 的 Codex 用户，官方给出的可选替代模型为 GPT-5.6 Sol 和 GPT-6 Astra。IT之家此前报道，OpenAI 于今年 4 月 24 日宣布推出 GPT-5.5 模型，相比较 GPT-5.4 在完成相同任务的情况下减少词元（Token）消耗。相关阅读：《OpenAI 奥尔特曼谈 GPT-5.5 自主策划发布会：希望人类开发者为其祝酒，但它自己拒绝发表祝酒词》《OpenAI 最智能 AI 模型：GPT-5.5 登场，Token 成本降至 1/35、每兆瓦输出提升 50 倍》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/002/858.htm", "publishedAt": "2026-09-16T00:47:08+00:00"}, {"title": "因丈夫常拍不出理想照片，前 TikTok 高管推出 AI 摆拍姿势相机应用 Superpose", "summary": "IT之家 9 月 16 日消息，科技媒体 TechCrunch 昨日（9 月 15 日）发布博文，报道称前 TikTok 高管创立 AI 摄影应用 Superpose，定位“拍照教学工具”，上线约 2 个月已下载超 2.2 万次。Superpose 由前 TikTok 高管 Melody Chu 与 Jing Liu 联合推出，通过 AI 给出四种姿势建议，帮助用户改善姿态、角度与构图。谈及推出该应用的初衷，Chu 表示创意灵感源自个人需求，她的丈夫常拍不出理想照片，因此决定将计算机视觉与生成式 AI 融入日常拍照场景。另一方面，Liu 过往在 TikTok 从事图像与视频模型工作，二人联合创建的公司据称已获得 220 万美元（IT之家注：现汇率约合 1,479.9 万元人民币）的种子轮投资。在技术实现层面，Superpose 以“拍照视图”为起点，利用 AI 给出姿势与构图建议，并力求在不涉足大规模背景替换的前提下，帮助用户改善实际拍摄体验。未来改进方向包括优化生成风格、多元化个性化推荐以及在取景视角上的教练能力提升，以降低生成效果的“诡异感”。截至目前，Superpose 已超过 22,000 次下载，用户共生成近 19 万个姿势，说明市场对便捷“姿势教学 + 即时指导”的需求在增长。售价方面，该应用提供每日 5 次免费生成，后续以包月形式扩展，价格在 2.99 美元（现汇率约合 20.1 元人民币）/5 次与 9.99 美元（现汇率约合 67.2 元人民币）/20 次之间，针对不同用户付费意愿提供了分层选择。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/002/857.htm", "publishedAt": "2026-09-16T00:45:03+00:00"}, {"title": "Meta 扎克伯格：保障 AI 安全应依靠引入独立外部评估，而不是放缓 AI 发展", "summary": "IT之家 9 月 16 日消息，Meta CEO 扎克伯格今日在 X 平台发文，表达了对业界呼吁放缓 AI 开发一事的看法。扎克伯格表示，现实情况是用户绝不会愿意去用那些与自身价值观未对齐、且无法按指令执行任务的智能体。因此，各大 AI 实验室天然具备极强的内在动力，去提升自身模型的对齐水平。IT之家注：模型的对齐水平是指人工智能模型的输出结果与人类的意图、价值观、道德规范以及真实世界事实的符合程度。当前业界对于“是否应放缓模型能力的迭代、直到对齐技术跟上”存在诸多争论。而在我看来，信任与对齐正迅速成为拉开智能体和模型差距的核心竞争力。任何忽视对齐技术的实验室，都必将遭到淘汰。如果模型造成危害，实验室将承担重大法律责任，因此他们同样有极强的动力去防患于未然。据其介绍，Meta 此前将 Muse 的发布推迟了数月，正是为了全力确保其功能安全与系统防护。扎克伯格称 Meta 并未在自己付诸行动之前，先去大声呼吁全行业效仿，而只是将其融入日常研发工作中。引入独立的外部评估机构与顾问，属于行业最佳实践。如今，MSL（Meta 超级智能实验室）已在多个业务领域践行了这一做法，并且成效显著。其他实验室同样能够做到这一点。总体而言，建立一个规模更大、更多元化的评估生态系统，对全行业将是有益的。相比于盲目竞逐递归自我改进，将绝大部分算力用于服务大众，是确保我们安全开发该技术的最佳途径之一。Meta 已作出这一承诺，其他实验室也完全能够跟进。相关阅读：《全球首富马斯克谈 AI 安全：主张交叉测试，让对手来“挑刺”》《OpenAI 奥尔特曼称 AI 行业自律可守住安全底线》《英伟达黄仁勋：AI 行业不需要新法律，开发可兼得速度和安全》《“三巨头”联手，OpenAI、Anthropic、谷歌 Deepmind 开始合作研究 AI 安全措施》《CrowdStrike CEO 反对放缓前沿 AI 开发，称潘多拉魔盒已打开》《“大空头”伯里谈科技巨头呼吁放缓 AI 开发：说白了还是为自己谋利》《行业呼吁控制 AI 研发节奏：投资者担忧资本开支降温，半导体板块承压》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/002/854.htm", "publishedAt": "2026-09-16T00:41:02+00:00"}, {"title": "全球首富马斯克谈 AI 安全：主张交叉测试，让对手来“挑刺”", "summary": "IT之家 9 月 16 日消息，昨日（9 月 15 日）召开的 All-In 峰会上，全球首富埃隆 · 马斯克（Elon Musk）以视频方式远程出席，在谈及 AI 时主张头部 AI 公司在发布模型前彼此交叉测试，并认为这一机制应尽快推向全球。马斯克在本次活动中，称为了推动行业自律，以及加速 AI 安全测试的共识和落地，提出“测试工具”(test harness) 想法，建议所有 AI 公司用各自的工具评测模型，彼此互换测试新模型，以评估是否存在生物 / 核武器协助、或潜在欺骗行为。马斯克以 Hugging Face 安全事件为切入点，认为任何足够智能的 AI 模型似乎都会想要挣脱自身的限制，并认为明智的做法是让头部 AI 公司互相测试对方的模型。IT之家附上马斯克演讲内容如下：目前领先的两家人工智能公司是 Anthropic 和 OpenAI。它们的模型性能非常接近，因此任何一方都很难放慢脚步，将领先地位拱手让给另一方。总的来说，我认为 Anthropic 比 OpenAI 更注重模型的安全性。但即使是 Anthropic 也承认他们对自己的模型感到担忧。Anthropic 的许多员工都公开表示，他们的模型让他们感到害怕，变得过于智能了。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/002/851.htm", "publishedAt": "2026-09-16T00:25:42+00:00"}, {"title": "我国又一科技领域实现领先：国产 MCV 模式全球首次实现 5 公里分辨率、未来 10 天预报在 1 小时内完成计算", "summary": "IT之家 9 月 16 日消息，中国气象局地球系统数值预报中心与中科曙光昨日联合宣布，我国自主研发的下一代天气-气候一体化模式（MCV）达成里程碑成果。我国自主研发的 MCV 数值模式实现全球公里级数值预报计算时效达标，展现了国产异构计算支撑世界级前沿科研的能力。此次 MCV 模式在全球范围内首次实现全球 5 公里分辨率、未来 10 天预报在 1 小时内完成计算，达到业务应用所需的关键时效。相比国际正式业务运行的全球预报系统，这一成绩超过欧洲中心 IFS 约 9 公里的最高水平，领跑欧美日等国际主流同行。MCV 是中国气象局自主研发的下一代全球与区域一体化大气模式，基于多矩约束有限体积方法，目标覆盖区域百米级、全球公里级。此次成果将全球 5 公里分辨率、10 天预报计算压缩至约 1 小时，踩中“十五五”规划全球 5 公里目标，为规划提出的可用预报时效延长至 9 天提供先期验证。作为对比，欧洲中心 IFS 系统为 9 公里，美国 GFS 系统 13 公里，德国 ICON 模式 13 公里。中国上一代 GRAPES 与 CMA-GFS 全球分辨率约 12.5 公里。IT之家注：MCV 指天气-气候一体化模式，通过数值求解大气运动物理方程推演未来天气，分辨率越高计算代价越大。技术层面，此次并非只将单一模块迁移至 GPU，而是完成动力、物理、插值等关键部分的异构化改造和代码整合。团队通过 OpenACC 实现“一套代码、两种运行”，既支持国产异构加速器，也保留 CPU 运行能力。全链路优化后，计算资源利用率提升 10%，通信模块加速 3.7 倍，I/O 性能提升超过 30%。验证环节采用单元测试、全模式联调、校验比对、10 天预报绘图验证的闭环体系，确保精度一致。二进制结果一致性核验要求 CPU 与 GPU 计算结果完全一致。中科曙光表示，此次 MCV 模式依托首个全国产十万卡 AI 超集群曙光 8000，实现高精度科学计算与低精度智能计算的原生一体化融合，国产异构计算平台开始从科研验证走向国家级业务系统支撑。目前双方团队已完成全球 3 公里分辨率模拟试验，验证了国产异构算力的扩展空间。面向科学智能研究，曙光 8000 采用超智融合开放计算架构，兼顾高精度数值模拟与 AI 训练推理。系统已适配近 200 项行业应用和 500 余个主流大模型，覆盖 30 多个科研及产业领域。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/002/846.htm", "publishedAt": "2026-09-15T23:52:10+00:00"}, {"title": "OpenAI 奥尔特曼称 AI 行业自律可守住安全底线", "summary": "IT之家 9 月 16 日消息，昨日（9 月 15 日）在旧金山举办的 Salesforce 活动中，OpenAI 首席执行官萨姆 · 奥尔特曼（Sam Altman）认为，AI 公司行业自律可以掌控研发风险，不会对广大民众造成重大伤害。IT之家援引雅虎财经报道，昨日对话 Salesforce 首席执行官马克 · 贝尼奥夫（Marc Benioff）时，奥尔特曼表示他相信在不对公众造成重大伤害的情况下，AI 公司可以安全地研发 AI 技术，并对整个行业自行提升安全水平抱有信心。奥尔特曼近期强调，AI 安全不能只依赖企业口头承诺，更需要同步提升模型能力、对齐、安全性和保密性。OpenAI 还曾推迟前沿强化学习训练，把部分算力转向监控、安全护栏和风险评估。奥尔特曼认为 AI 研发并非完全没有风险，但是通过行业协作、独立评估和更严格的安全流程等方式，可以在政府监管之外先行建立一套有效的安全保障机制，从而更安全、更高效地推进前沿 AI 研究。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/002/838.htm", "publishedAt": "2026-09-15T23:18:46+00:00"}, {"title": "OpenAI 奥尔特曼回应监管：相信行业能安全开发，不会伤害公众", "summary": "北京时间 9 月 16 日，据彭博社报道，OpenAI CEO 萨姆 · 奥尔特曼 (Sam Altman) 表示，他相信 AI 公司能够安全地开发这项技术，不会给广大民众造成重大伤害。奥尔特曼周二在旧金山举行的 Dreamforce 大会上与 Salesforce CEO 马克 · 贝尼奥夫 (Marc Benioff) 进行对话时表示：“我非常确信，我们公司、我们整个行业有能力安全地做到这一点。”奥尔特曼这一关于 AI 安全的表态，正值政策制定者和业内其他人士就“是否需要政府监管以防止 AI 失控、脱离人类掌控”展开辩论之际。OpenAI 的竞争对手 Anthropic CEO 达里奥 · 阿莫代伊 (Dario Amodei) 在上周六发表了一篇文章，提出了这项技术可能带来的风险，并建议有必要放缓发展速度，从而引发了最新一轮争论。尽管 OpenAI 正在与 Anthropic 以及谷歌 DeepMind 合作解决安全问题，但奥尔特曼表示，AI 公司应当有能力独立安全地改进 AI 模型。“我对这件事被如此解读感到失望。”他说。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/002/831.htm", "publishedAt": "2026-09-15T22:53:55+00:00"}, {"title": "谷歌 TPU AI 基建规模迈入 100 万级，核心瓶颈从“缺芯”转向“缺电”", "summary": "IT之家 9 月 16 日消息，在 SEMICON Taiwan 2026 活动中，谷歌宣布其 TPU 系统已扩展至 100 万芯片级规模，而电力供应成为 AI 基础设施扩张的核心瓶颈。IT之家注：这里的“100 万芯片级规模”是指谷歌的 TPU 互联架构（包括网络拓扑、通信协议、软件栈等）已经能够支持将最多 100 万颗 TPU 芯片连接成一个统一的计算集群，实现协同工作。该技术能力的突破，意味着超大规模 AI 模型训练可以跨越多个数据中心、多个 Pod 进行分布式训练，而电力供应（而非芯片数量）已成为限制进一步扩张的核心瓶颈。在题为“思维的物理学和智能的架构”活动演讲中，谷歌首席技术官阿明 · 瓦赫达特（Amin Vahdat）指出，随着 AI 模型规模不断扩大，制约扩张的核心瓶颈已从芯片本身转移至电力供给，AI 算力的天花板正在从“造不出芯片”变成“找不到电”。瓦赫达特还称 AI 已经进入“智能体人工智能”时代，交互模型正在从人机交互转向“智能体与智能体”的自动化对话，这将推动人工智能应用呈指数级增长，并创造几乎无限的全球计算需求。他将工业革命描述为一场“肌肉倍增器”革命，而人工智能则是一场“大脑倍增器”。人工智能不仅仅是自动化现有工作，更是让以前不可能完成的任务成为可能。未来，每个病人都能拥有医生，每个学生都能拥有老师，过去需要十年才能取得的科学进步，一年之内就能完成。谷歌和 Anthropic 达成的合作协议涉及高达 100 万颗 TPU 芯片，总计算功率超过 1 吉瓦。根据协议，从 2027 年开始，谷歌将为 Anthropic 提供 3.5 至 5 吉瓦的 TPU 算力容量，这笔交易价值高达 400 亿美元。除了谷歌之外，其他科技巨头也面临类似的电力瓶颈问题。报道指出亚马逊正在购买额外 200 万颗 Nvidia 芯片用于其 AI 基础设施建设，但电力供应短缺正成为全球 AI 数据中心扩张的共同挑战。在技术规格方面，谷歌的 Ironwood TPU（TPU v7）每芯片提供 4,614 TFLOPS 的 FP8 计算能力，9,216 芯片 Pod 可提供高达 42.5 Exaflops 的计算性能。该芯片配备 192 GB 高带宽内存，带宽达 7.37 TB/s，功耗效率比前代 Trillium 提升 2 倍。在今年 4 月召开的 Cloud Next 大会上，谷歌发布第八代 TPU，分为 TPU 8t（训练专用）和 TPU 8i（推理专用）两种架构。TPU 8t 超级 Pod 可扩展至 9,600 芯片，共享 2 PB 高带宽内存，提供 121 ExaFLOPS 的 FP4 计算能力。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/002/828.htm", "publishedAt": "2026-09-15T22:43:49+00:00"}, {"title": "谷歌推出 Gemini 3.8 Live 和 3.8 Live Extended Thinking 实时对话模型，支持 97 种语言切换", "summary": "IT之家 9 月 16 日消息，当地时间 9 月 15 日，谷歌宣布推出 Gemini 3.8 Live 和 Gemini 3.8 Live Extended Thinking。谷歌称这是其迄今最先进的实时对话模型，在智能和并行推理方面有重大升级，让 AI 对话更直观智能。两款新品分别为面向规模部署与成本优化的 Gemini 3.8 Live，以及面向高复杂度任务、强化多步推理能力的 Gemini 3.8 Live Extended Thinking。Gemini 3.8 Live 兼顾对话智能、流畅交流和视觉理解，面向规模化与成本效率。Gemini 3.8 Live Extended Thinking 面向高复杂度任务，具备更强的智能和多步推理能力。Gemini 3.8 Live Extended Thinking 在多项基准测试中取得领先成绩，拿下 Artificial Analysis 语音对语音质量指数总排名第一（ 82.6% ），在 τ-Voice 智能体任务完成率达 68.6% ，在 Sierra 的 τ-Voice-banking 基准测试达 35.1% ；推理能力方面，在 Big Bench Audio 得分 97.7% ，同时仍保持有竞争力的定价。Gemini 3.8 Live 则获得用户高认可度，在 Speech Agent Arena 排名第二，且具备出色成本效益，适合大规模部署。两款模型在 ServiceNow EVA-Bench 语音智能体基准测试中，成功平衡准确性与对话质量，推高了复杂工作流的帕累托前沿。Gemini 3.8 Live 可近实时处理视觉输入，在对话中自动检测并切换 97 种支持的语言，还能在后台执行工具与 API 调用，同时保持对话流畅不中断。针对需要深度推理的任务，Gemini 3.8 Live Extended Thinking 可实现推理与发言同步进行，在不中断对话流畅度的前提下提升复杂工作流智能水平，通过“让我确认一下…”这类早期语言提示自然回应提示，还可实时讲解多步后台任务处理进度。开发者可通过 Gemini Live API ，在声网、Fishjam、LiveKit、Pipecat、Vercel、Vision Agents 等平台轻松构建部署高性能语音驱动界面；谷歌还与 Salesforce、Genspark、Lumeris 等企业开展合作，共同推进生态建设。谷歌所有 AI 生成音频都添加了 SynthID 隐形水印，直接嵌入音频输出，可检测 AI 生成内容，帮助防止虚假信息传播。目前 Gemini 3.8 Live 已开始推送：开发者可在 Gemini API 和 Google AI Studio 使用；企业用户可在 Gemini Enterprise 抢先体验，即将登陆 Gemini Enterprise for Customer Experience；全用户可在 Search Live 体验。Gemini 3.8 Live Extended Thinking 也已开启推送：开发者可在 Gemini API 和 Google AI Studio 使用；企业用户可在 Gemini Enterprise 抢先体验，即将登陆 Gemini Enterprise for Customer Experience 以及 Google Workspace 企业客户；普通用户可在 Gemini Live 体验，Google AI Pro 和 Ultra 订阅者可在 Google Workspace 的 Docs 使用，所有 Google AI 订阅者可在 Gmail 和 Keep 体验。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/002/824.htm", "publishedAt": "2026-09-15T17:17:43+00:00"}, {"title": "OpenAI 发布适用于编程和计算机应用的 GPT-6 Astra", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/IfxYoy1PPkFQUpjWVBVr?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-15T16:52:00+00:00"}, {"title": "华为监事会主席郭平：虚心向苹果学习供应链，在 ICT 及计算领域的目标是成为英伟达", "summary": "9 月 15 日晚间消息，近日，华为心声社区对外披露了华为监事会主席郭平与新员工座谈纪要。在与新员工的沟通中，郭平回应了手机业务与苹果对比、车 BU 发展、大模型战略、半导体业务方向等话题。谈超越苹果：专注做好自身，虚心向苹果学习被问及未来华为手机的销量有望超越苹果公司吗？郭平表示，苹果的首席执行官是业界供应链管理的大师，是华为学习的榜样。在当前华为的供应形势受到约束的情况下，供应是华为的保障底线。“华为并不以超越某一家特定企业作为发展目标，而是专注于做好自身。全球市场包括终端领域，允许多家公司、多类产品共生共存。华为致力于提升产品核心价值，让消费者获得物有所值的体验，成为消费者心中喜爱和信赖的品牌。至于量产规模和市场排名，并非我们刻意追求的目标，而是产品具备竞争力的自然结果。”他指出，在供应链领域，华为需要持续虚心向苹果学习，包括其供应链的竞争力、弹性与韧性。谈车 BU 发展：自始便面向全球，而非仅局限于中国此前，华为引望引入了多家车企入股，未来华为是否会减少对引望的管理？郭平表示，引望是华为控股、并与众多伙伴建立资本连接的公司。引望提供的智能汽车部件业务，是华为 ICT 业务的延伸。在智能汽车领域，华为通过引望直接提供智能驾驶服务。在相当长时期内，预计华为将继续承担领导引望发展的责任。他提到，华为智能汽车部件业务自始便面向全球，而非仅局限于中国。然而，汽车整车具有显著的地域性和地缘政治敏感性特征，尤其是智能汽车涉及数据、安全及隐私问题。华为智能部件虽属全球业务，但华为选择“不造车”。车企选择仅在中国销售还是走向全球，取决于各车企自身的战略选择。谈大模型：ICT 业务及计算领域，华为目标是成为英伟达谈及 AI 话题，郭平表示，全球顶尖企业正高度关注并积极实践人工智能的应用。华为也将实现人工智能视为最大的机遇。目前，全球在算力、人才和数据领域的核心“玩家”主要来自美国和中国。相信华为能代表中国最高水平，为中国和世界提供坚实的选择。第二重机遇在于，华为拥有手机、智能驾驶等具备数据飞轮技术迭代模式的业务领域。通过人工智能打造具有全球竞争力的世界级智能体，是华为的重要机会。他认为，在人工智能的三要素中，中国在算力方面相对落后；但在数据方面，中国拥有几乎涵盖所有门类的工业应用，在数据应用、推理应用及场景上具备优势；在人才方面，双方实力基本相当。公司在战略层面如何看待自研大模型？郭平表示，华为聚焦于连接与计算领域，但不同业务板块对自研大模型的需求存在差异。对于 ICT 业务及计算领域，华为的目标是成为英伟达。华为的核心优势不在于拥有自研大模型，而在于支持客户构建优秀的大模型，确保全球任何大模型均能在华为昇腾、鲲鹏、超节点及集群上高效运行。对于终端业务和智能驾驶业务，则最好拥有自研大模型。多数主流开源大模型仅开源权重，企业后续在增训或微调等方面仍面临诸多挑战。且数据开源存在滞后性。因此，在终端和智能驾驶领域，自研大模型更具优势；对于华为云业务，随着云与人工智能深度融合，缺乏具备竞争力的大模型将导致业务竞争力缺失。因此，华为云必须拥有自研大模型以维持竞争优势。“华为大模型战略与自身业务追求紧密结合：我们坚持投入，但根据业务场景差异化布局。”他说。谈半导体：昇腾 950 系列通过架构创新有望赶上对手华为半导体领域已具备或有望成为护城河的优势有哪些？郭平表示，华为在先进制程上受到约束，因此更需推动设计与制造一体化，发挥综合优势以弥补工艺不足。早年苹果处理器工艺虽不领先，但通过架构重组、软件优化，实现了优异的用户体验。何庭波提出的“韬定律”，本质是“时间缩微”替代“几何缩微”，将分离的工艺与制造紧密结合，在受约束条件下提升竞争力。这一路径对全球半导体行业均有价值，但华为因面临更严峻的工艺约束，对此路径的探索更为紧迫。他特别提到了 DeepSeek 梁文锋此前与投资人的四小时交流纪要，其中指出，人工智能时代技术加速迭代，可能削弱如英伟达 CUDA 生态的护城河，人工智能技术有望实现突破甚至替代。“我们的昇腾 950 系列在工艺受限情况下，通过架构创新缩小差距，未来有望赶上对手。其关键在于提供客户体验与最终解决问题的能力，而非单纯堆砌参数，正如手机用户更关注性能带来的价值。华为采用系统架构思维重组竞争要素，通过发展集群与超节点取得整体优势，这也是华为业务扬长避短的实践。”以下为座谈纪要全文：满怀热爱，积极作为，在智能时代贡献价值 —— 监事会主席郭平与新员工座谈纪要各位同事，大家下午好。我应该是加入华为的第一位应届毕业生。当初懵懂入职，在后续工作中看到越来越多的机会，便一直留任至今。很高兴见证华为从最初的几人发展到如今的规模，我也庆幸伴随公司成长，获得了诸多发展机会。当前，我们正处于国家所言的“百年未有之大变局”，人工智能正席卷全球，必将重塑各行各业。各位在此“当口”加入华为，既是你们的机会，也是华为的机遇。希望大家在华为的广阔平台上，为个人、为公司、也为社会创造非凡的价值。互动问答在专注领域内深耕纵深，创造更大价值问：在前几天的学习中我们了解到，公司的营收已经恢复到历史峰值水平。请问公司的经营策略会根据现有情况进行一些调整吗？郭平：2021 年 3 月，华为年报公布 2020 年的收入为 8900 多亿元，创下历史顶点。此后几年，面对外部极限施压与制裁，我们在艰难困苦中顽强生存，保障了业务连续性和竞争力。面向未来，华为的核心战略是“聚焦”，即深耕我们擅长的“连接”和“计算”领域，没有业务扩展计划。我们期望公司取得更佳业绩，为全球客户提供数字基础设施解决方案，为人工智能发展提供多元化方案，并为中国电子工业的崛起做出贡献。这是我们对于未来的愿景：在专注领域内深耕纵深，创造更大价值。问：华为在经历制裁等重大打击后，已重回快速增长轨道。然而，当前外部环境仍存在巨大的不确定性，若未来遭受进一步打压，华为能否更好应对？郭平：这是一个颇具哲学意味的问题。首先，我们长期处于被打压的环境中，这是既成事实而非假设。请大家放心，真正阻碍华为发展的并非外部环境，而是内部能力。中国 14 亿人口所构成的蓬勃市场与需求，足以支撑华为生存，当然华为不只在国内发展。我们担忧的是相较于国内外竞争对手，我们是否具备竞争力，即能否提供有竞争力的产品与服务，为客户创造价值。我不鼓励大家过度关注宏大叙事，而应更多专注于手头工作。做好本职工作，随着阅历与认知的提升，大家解决问题的经验自然会更加丰富。问：在供应链成本攀升的背景下，华为应如何调整供应链各环节的定价策略？未来华为手机的销量有望超越苹果公司吗？郭平：苹果的首席执行官是业界供应链管理的大师，是我们学习的榜样。我本人也曾负责华为的供应链工作。在当前华为的供应形势受到约束的情况下，供应是我们的保障底线。我们更需将 IBM 教给我们的“及时齐套率”“采购提前期”管理好，加快周转、降低存货，确保供应链各环节不掉链子。华为并不以超越某一家特定企业作为发展目标，而是专注于做好自身。全球市场包括终端领域，允许多家公司、多类产品共生共存。华为致力于提升产品核心价值，让消费者获得物有所值的体验，成为消费者心中喜爱和信赖的品牌。至于量产规模和市场排名，并非我们刻意追求的目标，而是产品具备竞争力的自然结果。在供应链领域，我们需要持续虚心向苹果学习，包括其供应链的竞争力、弹性与韧性。我们与供应商是互相依存的伙伴关系。在波峰的时候你能照顾别人的情绪，在波谷的时候别人也能照顾一下你的情况。问：去年我在广东代表处实习，我了解到，与往年相比，当前运营商市场的竞争难度有所增加。请问从公司高层视角来看，运营商未来的业务发展趋势如何？6G 时代将以何种形式、在何时到来？郭平：在华为的各项业务中，运营商业务是我们最具全球竞争力的业务，它的投入产出效率最高。然而，运营商业务也面临独特挑战。频谱资源规范由 ITU（国际电信联盟）确定，无线等技术标准由 3GPP 等组织制定。若仅遵循既定标准并具备竞争力，尚属基础层面。华为作为后来者，凭借“多快好省”的优势切入市场并获取份额，随后逐步成为标准的重要贡献者。面向未来，华为致力于在“从 0 到 1”的探索中有所作为，同时以强大的执行力践行“多快好省”。当然，市场拓展除技术因素外，还受地缘政治、安全、影响力及控制权等因素影响。因此，华为除技术实现外，还需关注标准制定、市场格局及领先优势。无线标准的发展，这是一个持续演进的过程。华为希望推动全球统一标准，并继续作为该标准的重要贡献者、实现者及市场成功的参与者。问：华为累计出售了 20% 的引望股权，请问未来华为是否会减少对引望的管理？您如何看待引望与华为未来的关系走向及合作形态？郭平：引望是华为控股、并与众多伙伴建立资本连接的公司。引望提供的智能汽车部件业务，是华为 ICT 业务的延伸。华为拥有具备数据飞轮技术的智能体，目前最显著的是手机业务和智能驾驶业务。AI 智能体需要数据飞轮的支持。在电信运营商业务中，网络主体是运营商，华为协助其实现网络自动驾驶；而在智能汽车领域，华为通过引望直接提供智能驾驶服务。在相当长时期内，预计华为将继续承担领导引望发展的责任。问：车 BU 未来几年是否有拓展海外业务的计划？我们应如何准备？郭平：华为智能汽车部件业务自始便面向全球，而非仅局限于中国。然而，汽车整车具有显著的地域性和地缘政治敏感性特征，尤其是智能汽车涉及数据、安全及隐私问题。华为智能部件虽属全球业务，但华为选择“不造车”。车企选择仅在中国销售还是走向全球，取决于各车企自身的战略选择。问：在科技飞速发展的今天，公司是否针对未来市场进行前瞻性布局，以抢占先机？即便短期难以盈利，是否像马斯克探索外太空和火星那样进行投入？郭平：华为的愿景是在电子信息领域实现客户的梦想，这是我们的核心追求。回顾历史，上世纪 90 年代初，中国电话普及率仅约 2%。1995 年左右，一部“大哥大”售价高达 1 万至 2 万元，而当时的城镇职工平均月薪仅数百元。华为致力于在电子信息领域实现用户梦想，这看似平凡，但我们已实现诸多突破：将昔日少数人才能使用的通信，转化为全球大众享有的权利。在连接领域，我们不仅服务于中国，更面向全球，实现了人与人、人与物的互联互通，业务从简单通话扩展至数据、语音及视频支持。这是我们在选定领域的成就。华为没有计划制造卫星或太空飞船，那不属于我们的业务范围。我们致力于在选定的连接和计算领域内做到极致，实现客户梦想。这已是相当伟大的目标，市场空间也足够广阔。扬长避短，在 AI 时代“常变与长青”问：请问您认为人工智能的发展将如何提升公司员工的办公与研发效率？是否会促使公司在人才招聘、培养、考核等制度层面进行相应调整？此外，鉴于公司正全力向人工智能方向进行战略转型，您对新员工入职后的融入、成长与发展，有何建议？郭平：我相信大家已注意到，全球顶尖企业正高度关注并积极实践人工智能的应用。我们也将实现人工智能视为华为最大的机遇。目前，全球在算力、人才和数据领域的核心“玩家”主要来自美国和中国。我们相信华为能代表中国最高水平，为中国和世界提供坚实的选择。第二重机遇在于，华为拥有手机、智能驾驶等具备数据飞轮技术迭代模式的业务领域。通过人工智能打造具有全球竞争力的世界级智能体，是我们的重要机会。关于员工的行为模式，我想大家在求学阶段可能已有体会：若与人工智能比拼解题或提供标准答案，人类难以胜出。然而，人工智能尚不具备主动提问的能力，如何技巧性地提问并持续追问，极具挑战性。因此，进入华为后，员工行为模式将发生深刻变化，主管的管理风格与评价体系也将随之调整。我与大学教授交流：未来社会最顶尖的少数天才可能致力于“造 AI”，而大多数人将是“用 AI”。使用人工智能最稀缺的能力并非掌握某种编程技巧，而是精准描述与提出问题的能力。因此，文学和哲学专业的人才正日益受到青睐。各位进入职场后，将直面人工智能带来的巨大变革，且这一变革方兴未艾。问：当前 AI 产业蓬勃发展，公司招募了大量 AI 人才，但模型的训练与推理主要集中于少数部门，ICT 等传统业务涉及较少。请问如何促进 AI 人才与传统产业的结合，以发挥其最大价值？郭平：“AI 人才”的定义较为宽泛。对于 ICT 行业而言，人工智能的应用更多侧重于推理层面。以运营商网络为例，从 2G 至 5G 乃至未来的网络，网络网元复杂多元，运维成本高昂。汽车可实现智能驾驶，我们的网络能否利用人工智能实现自动运维？这需要应用型 AI 人才。但人才结构是多元化的，“造 AI”的人才需具备极强的创造力，以确保产品和解决方案的竞争力。在人工智能的三要素中，中国在算力方面相对落后；但在数据方面，中国拥有几乎涵盖所有门类的工业应用，在数据应用、推理应用及场景上具备优势；在人才方面，双方实力基本相当。在竞争过程中，特别是各位加入华为后，我期望依靠人才及其良好的发展环境，驱动公司在该领域建立优势。问：公司在战略层面如何看待自研大模型？短期与长期目标分别是什么？郭平：华为聚焦于连接与计算领域，但不同业务板块对自研大模型的需求存在差异。对于 ICT 业务及计算领域，华为的目标是成为英伟达。华为的核心优势不在于拥有自研大模型，而在于支持客户构建优秀的大模型，确保全球任何大模型均能在华为昇腾、鲲鹏、超节点及集群上高效运行。对于终端业务和智能驾驶业务，则最好拥有自研大模型。多数主流开源大模型仅开源权重，企业后续在增训或微调等方面仍面临诸多挑战；且数据开源存在滞后性。因此，在终端和智能驾驶领域，自研大模型更具优势。对于华为云业务，随着云与人工智能深度融合，缺乏具备竞争力的大模型将导致业务竞争力缺失。因此，华为云必须拥有自研大模型以维持竞争优势。华为大模型战略与自身业务追求紧密结合：我们坚持投入，但根据业务场景差异化布局。问：我理解英伟达的护城河源于先进制程、软硬件协同及 CUDA（计算统一设备架构）生态，那么华为半导体领域已具备或有望成为护城河的优势有哪些？未来期望布局但目前尚欠缺的能力有哪些？郭平：我求学时期，Intel 刚推出 IDM（工艺与制造一体化）模式。随后台积电发明代工模式，实现设计与制造分离。华为在先进制程上受到约束，因此更需推动设计与制造一体化，发挥综合优势以弥补工艺不足。早年苹果处理器工艺虽不领先，但通过架构重组、软件优化，实现了优异的用户体验。何庭波女士提出的“韬定律”，本质是“时间缩微”替代“几何缩微”，将分离的工艺与制造紧密结合，在受约束条件下提升竞争力。这一路径对全球半导体行业均有价值，但华为因面临更严峻的工艺约束，对此路径的探索更为紧迫。关于护城河，建议阅读 DeepSeek 梁文锋的四小时交流纪要，其中指出，人工智能时代技术加速迭代，可能削弱如英伟达 CUDA 生态的护城河，人工智能技术有望实现突破甚至替代。我们的昇腾 950 系列在工艺受限情况下，通过架构创新缩小差距，未来有望赶上对手。其关键在于提供客户体验与最终解决问题的能力，而非单纯堆砌参数，正如手机用户更关注性能带来的价值。华为采用系统架构思维重组竞争要素，通过发展集群与超节点取得整体优势，这也是华为业务“扬长避短”的实践。希望各位入职后，也能在个人发展与业务实践中扬长避短，创造价值。问：此前拜读您的《常变与长青》，深受触动。华为如果要保持“长青”，应如何实现“常变”？郭平：华为一直在变革，旨在适应时代发展、建立竞争力。所有变革均基于对未来的假设，而假设权是预测未来、做出决策的最大出发点。例如，当年微软假设每人需要一台计算机并配备操作系统，从而成就了微软。而当时的巨头 IBM 认为，个人电脑市场潜力有限，这个世界只需要五台大型机。华为当前的假设是：人工智能可能是人类社会最后一次的技术革命，我们需在此革命中获取竞争优势。为此，我们的组织、流程、能力、人才均需与之匹配。变革过程中，无人能永远正确。若犯错，应及时放下面子、及时改正，追上并争取引领时代潮流。变革并非做给他人看，而是生存与发展的需要，是时代赋予我们必须完成的使命。问：在薪酬、员工保障及社会责任等方面，您认为华为与其他顶尖科技公司相比有哪些差异？郭平：华为的伟大之处在于我们通过自己的产品和服务为客户创造价值，而非依赖捐献，也不是靠游说去阻止谁。所以绝对要摒弃“白左思想”。华为有且只有一条路可走，那就是用我们的产品和服务为客户创造价值。我认为，商业是最大的慈善，商业成功就是对社会最大的责任。依法纳税，依法用工，依法提供相应的、有尊严的报酬是对社会最大的贡献。如果我们让公司衰落了、破产了，让我们的几十万员工和他们的家庭出现了重大的变故，让我们的供应商、让我们的客户受到严重的伤害，客户的业务不能连续，客户的投资不能保护，那才是对社会的不负责任。所以，商业是最大的慈善，让华为永远有竞争力，这就是华为对社会最大的慈善。当然，华为公司会力所能及地支持一些慈善事业，但是这是我们发自内心、愿意做的事，不是为了媒体宣传。问：面对技术迭代和行业变革，您认为新员工应培养哪些核心能力，以维持长期竞争力？郭平：进入华为至关重要的一点是具备持续学习的能力。大学所学的知识，可能在入职之日便已失效。当接到未曾接触过的任务时，不能以“未学过”为由推脱，因为职场看重问题解决能力和交付结果。因此，要有敢于承担的勇气，也要有能够胜任的实力。步入职场后，不应期待从书本中找到现成答案，而要将知识融会贯通、内化于心，并灵活应用。持续学习能力是职场生存与发展的最基本的能力。唯有热爱，方能支撑你坚持到底问：在您眼中华为是一家怎样的企业？您对华为的认知在不同时期是否有变化？郭平：在 2019 年遭受全面制裁之前，华为是一家从胜利走向胜利的企业。我们从最初几人代理产品起家，几乎抓住了从 20 世纪 80 年代至今领域内的每一个机会，并成功将其转化为成果。遭受制裁的企业，通常仅有两种结局：一是“in jungle”（亡命丛林），二是“in prison”（困于囚笼）。华为正在开辟第三条路：努力活下来。这已经很了不起了。我们希望保持敏锐嗅觉，抓住未来机会，凭借执行力将机遇转化为现实。即便犯错，也具备纠错能力，从而后来居上。华为并非看到机会就能必然成功。例如在大模型领域，华为起步较早，但未能占据主导。但这无须气馁，因为国内外顶尖科技公司投入巨资目前也未取得显著成果，反而是 Anthropic、Kimi（月之暗面）、DeepSeek 等公司取得了突破，这说明大公司既有优势也有劣势，企业形态需常变常新，以适应未来。这一逻辑同样适用于个人。我大学时主修计算机组织与体系结构，但当前技术与我们当年所学的已截然不同。因此，无论面临多大困难，华为每年都要吸纳优秀应届毕业生，我们需要新鲜血液和新认知来面向未来。希望你们不仅将华为视为一份工作，更能在其中为公司、行业乃至世界的改变做出贡献。问：华为高度重视自我批判文化，在团队落地时，如何把握分寸，既敢于正视不足，又不引发焦虑、影响士气？郭平：自我批判源于个人的认知，而非“批斗会”。它基于对已发生事件的复盘，旨在总结经验教训并明确未来改进方向。因此，自我批判强调的是自我认知、自我复盘及自我提升，外部力量仅起辅助作用。因此，关键在于“自我”而非“批判”。主体必须是个人主动认知问题，对事件进行总结、提炼与反思。若缺乏自我认知，仅依靠他人指责，则沦为批斗会，背离了自我批判的初衷。问：您在华为工作三十余年，经历了公司不同的发展阶段。面对困难与变化，是什么让您始终保持投入？对于新员工，您认为如何在长期工作中保持动力？郭平：尽管我长期在华为工作，但始终从事具有挑战性的任务。例如，我曾在研发部门担任副总工程师，项目结束后，任总调任我负责生产总部，生产总部业务涵盖制造、采购及集成计划等职能。除本科毕业设计期间短暂实习外，我并无相关经验。面对这一挑战，我有两种选择：一是因能力不足而逃避；二是直面问题并解决。我选择了后者。华为对基层员工的要求是“爱一行干一行”，即选择自己热爱且胜任的岗位。对高级管理人员则要求“干一行爱一行”，作为管理者，需解决公司面临的问题。个人成长，应从“爱一行干一行”起步，做好本职工作；当公司认可你的能力或面临特定困难时，则需转变为“干一行爱一行”，并出色完成任务。在华为，职业发展主要有两条路径：一是在专业领域深耕，成为技术专家，属于垂直发展；二是走管理路线，属于“之”字形发展。管理岗位并非安排所得，而是由需求驱动 —— 哪里有需求、有机会，且你能胜任。在此过程中，个人也获得了额外的经验与能力。问：您担任监事会主席，负责干部考察与后备干部培养，见证了许多干部的成长。从您的视角来看，在华为走得远的人具备哪些共同特质？对刚入职的新员工，您有何提醒？郭平：任总曾提出，在华为长期工作需满足两个基本条件：诚实劳动、胜任工作，这至今仍是对所有员工的要求。对于一家有前景的公司和组织，应正向奖励为公司做出贡献的人，而最好的奖励便是给予机会。以我自身为例，作为应届毕业生加入华为，能胜任工作、取得成果，从而获得承担更大责任的机会。求学期间，老师可能鼓励大家全面发展、扬长补短；但步入职场后，我的建议是发挥长处、扬长避短。将你擅长之事做到极致，将你热爱之事转化为卓越的贡献，使长处日益精进。你为公司做出贡献，公司则回馈更多机会，在此过程中实现共同成长。问：您曾提及“选择大于努力，选择需有实力”。对于刚入职的应届生，在做好本职工作的同时，如何保持灵活度以适应公司的变化与调动？当个人兴趣与组织需求冲突时，应以何种标准进行判断？郭平：人生发展非线性演进，而是由少数几个关键节点决定的。以我为例：20 世纪 80 年代考入大学、选择学习计算机、南下深圳、加入华为，这些均为我人生的关键节点。入职后亦有关键时刻，我原以为只需安心做研发，但随后面临负责生产总部的机会，这是挑战。人生路径无法完全规划，每个人要依据自身判断做出选择。面对选择，需深思熟虑：自己能否胜任？是否符合未来构想？若答案肯定，即便失败也无怨无悔。人生走向在于关键节点的选择：选对则顺势而上；选错亦有年轻“一切重来”的资本。有实力便无所畏惧，敢于抓住机会；即使失败，年轻仍是最大的底气，足以支撑我们重新出发。因此，最重要的是拥有选择的勇气。公司的发展逻辑亦然。华为早期曾代理他人的产品，当时许多代理公司因缺乏自主转型，最终随被代理方的倒闭而一同消亡。但任总决定开发自有产品，从有线通信转向无线通信，再到光传输、数通、终端业务。唯有深谙业务，方能做出无所畏惧的选择。问：您横跨研发、供应链等多个部门，历经公司多次关键变革。对于新员工而言，在职业生涯中，最重要且需始终坚守的底层原则是什么？郭平：加入华为应源于对职业的热爱，切勿勉强。职场之路通常并非一帆风顺，难免遭遇挫折与困难。唯有热爱，方能支撑你坚持到底。若缺乏这份热爱，工作便如坐牢，每日煎熬至下班。不仅个人痛苦，也难以对公司做出真正贡献。问：您认为在职业发展的前期，哪些能力和品质对长期成长最为关键？另外，以您的观察，当年刚入行的年轻人与如今的新员工在特质、认知或工作方式上有哪些明显差异？郭平：进入华为的条件始终未变：诚实劳动、胜任工作。这一要求在过去、现在乃至未来都将保持一致。我不赞同给每一代人或年龄段贴上标签，每一代人有其独特的特质。我认同 DeepSeek 创始人梁文锋的观点：工作中 50% 是自上而下的指令性任务，另外 50% 则是创造性工作。面向未来，华为的研发工作也将呈现不同的特质，进而需要不同类型的人才。开发工作是用知识换取金钱，需要有序组织和自上而下的执行力；研究工作则是用金钱换取知识，绝不能依靠规定动作或固定流程自动产生，而需依赖个人特质与工作的契合度。因此，我希望各位在入职前已谨慎、认真地思考，确认这是自己热爱的岗位。华为提供内部转岗机会，但这种选择可能伴随代价，如同大学申请转专业，需经过相应程序，过程可能痛苦且不一定成功。问：作为技术新人，日常大量工作涉及重复性的基础研发，难以立即看到技术突破，偶尔会产生迷茫。请问新人应如何在平凡的基础工作中沉淀核心能力，为长期技术攻坚打好基础？郭平：进入公司后，各位的身份将发生根本性转变。在校期间，你们的角色是学习知识、储备能力、为工作做准备；而步入职场后，角色则转变为直面工作、完成任务、做出贡献。若具备扎实的知识与能力积累，能够得心应手地完成工作，依据华为的规则，你将获得承担更重要职责的机会，并在实践中实现个人发展。反之，若无法胜任当前工作或遇到困难，则需主动弥补不足，通过自学相关知识、积累经验，并积极寻求同事与朋友的帮助，建立起胜任工作的能力。职场中的成长速度远快于校园，正如在水中学习游泳比在教室里更快。但需注意，在水中游泳的目的并非单纯为了学习，而是为了生存 —— 不游便会沉没。职场的首要责任是胜任工作，只有不断提升自我能力以承担更重要的职责，才能获取更好的发展机会。最关键的是做好心理调整，顺利完成从“校园人”到“职场人”的心态转换。问：作为新员工，我们渴望学习公司前辈沉淀的经验。您认为当下新一代华为人最需要传承老一代华为人的核心特质是什么？同时，又需要跳出哪些固有思维，做出新的突破？郭平：无论老一代还是新一代，共同点都是为公司做出贡献。麦肯锡的一份研究报告指出，公司最重要的是管理活力，而非管理年龄。以机器人产业为例，其包含感知、大脑系统和小脑平衡系统。感知能力需长期的积累，需材料与验证，理论与实践结合；大脑的核心是算法，年轻人占优；小脑平衡系统则依赖技术积累与工程经验。唯有三者结合，才能形成完美系统。华为自诞生以来，并非依靠硬条件优于他人走到今天，而是依靠“方向大致正确，组织充满活力”，通过整合组织整体能力取得成功。正如任总所言，他就像一桶“浆糊”将大家紧密地黏结在一起。在现代社会，复杂的工作往往无法由一人独立完成，必须与不同层级、不同背景的人协作，共同交付具备竞争力的产品。问：复杂问题的解决往往涉及多团队协作，对于专业影响力和经验尚不足的新员工，应如何推动跨团队协作，实现问题的有效闭环？郭平：我认为需从两方面入手。首先，深入理解问题，明确自身知识盲区并自学提高。其次，善用求助系统，包括公司专家库及资深同事的辅导。例如，研发组织实行导师制，导师协助新员工融入岗位，完成从学生到合格工程师的转变。在此过程中，通过与内部同事及外部专家探讨求助，解决面临的问题。如 2012 实验室每年颁发“火花奖”，面向全球征集难题解决方案，鼓励高校、学生及研究机构参与。利用社会资源辅助解决问题，关键在于“自我驱动”与“主动求助”。这两方面有助于完成角色转变，在未来的工作中，大家也要持续运用协作与求助系统，弥补知识短板与经验不足，消除认知盲点。问：请问我们如何平衡工作与生活？郭平：对于工作与生活的平衡，我认为并没有统一的标准答案，无论是在哪里，工作与生活的平衡取决于个人的取舍与价值追求，核心是内心自洽，自我感觉良好足矣。有人愿付出更多努力以追求事业上更高的成就，也有人不慕浮华，看淡名利，果腹安生即可。因此，实现何种平衡、付出多少努力、取得何种成就，最终都由个人来定义和决断。季羡林先生曾提到，人生需要处理好三重关系：人与大自然的关系、人与人的关系、人与自我内心的关系。当面临“既要、又要、还要”的期待，而鱼与熊掌不可兼得时，我们必须学会取舍。成年人的世界无法“全都要”，每个人都要做好内心的自我平衡。期望与祝福祝愿大家在未来的日子里，顺利完成从学生到合格职场人的转变。学生的核心在于能力储备，而职场人的价值则以对所在组织的贡献为衡量标准。预祝各位转身成功！", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/002/810.htm", "publishedAt": "2026-09-15T15:33:09+00:00"}, {"title": "中文互联网基础语料 4.0 发布：数据量 120GB，为大模型训练和 AI 发展提供可信数据支撑", "summary": "IT之家 9 月 15 日消息，据中国网络空间安全协会官方公众号，9 月 15 日（今天）下午，在济南召开的 2026 年国家网络安全宣传周人工智能安全治理分论坛上，中文互联网基础语料 4.0 正式向社会发布，数据量 120GB，并在“中文互联网语料资源平台”上线。据IT之家了解，用户登录中国网络空间安全协会官网（点此前往），点击“中文互联网语料资源平台”链接，通过注册、认证等程序，即可下载或联系获取相关数据。在中央网信办指导下，中国网络空间安全协会联合国家互联网应急中心，会同百度、中科闻歌、开普云、拓尔思、科大讯飞、知乎等单位，在前期发布中文互联网基础语料 1.0、2.0 和 3.0 的基础上，依托网安协会人工智能安全治理专委会建立的语料共建共享机制，汇聚一批新的高质量可信数据，经过一系列严格细致的数据加工处理措施，形成并对社会发布中文互联网基础语料 4.0，数据量 120GB，为大模型训练和人工智能发展提供可信数据支撑。网安协会负责人表示，中文互联网基础语料 4.0 是社会各界协同共建高质量中文语料的重要阶段性成果，进一步丰富了国内高质量中文语料供给体系。下一步，协会将继续联合国家互联网应急中心等单位，联动各行业领域深化中文互联网基础语料建设，持续为人工智能产业高质量发展筑牢数据底座。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/002/795.htm", "publishedAt": "2026-09-15T14:49:09+00:00"}, {"title": "诺贝尔和平奖得主雷萨：如果不现在就限制 AI，人类将失去自主权", "summary": "IT之家 9 月 15 日消息，诺贝尔和平奖得主玛丽亚 · 雷萨（Maria Ressa）表示，人工智能先是借助社交媒体攫取了人类的注意力，又利用人类对亲密情感的本能诉求，干扰我们的生理心理；如果我们现在不通过立法加以限制，人类最终将会丧失自主选择权。据IT之家了解，这位拥有菲律宾、美国双重国籍的记者于 2021 年与另一位记者共同斩获诺贝尔和平奖，部分获奖缘由是她记录大型科技巨头所拥有的强大影响力。目前她担任联合国国际人工智能科学小组的联合主席，该小组的任务是评估人工智能正在如何改变世界各地民众的生活。雷萨提出，普通民众应当主动投身 AI 监管的舆论呼吁，向政界施压，促使政客出台相关立法。“呼吁对 AI 实施监管，这并不是言论自由层面的议题，而是一项公共安全议题。”她同时也是新闻机构 Rappler 的联合创始人兼首席执行官。“我认为我们已经走到这样一个节点：如果再不采取行动，局面就会发生倾覆。倘若我们现在不介入干预，事态终将脱离人类的掌控。”她到访奥斯陆，出席一场探讨民主所面临威胁的会议期间，在采访中说道。人工智能的三波浪潮“人工智能既谈不上‘人工’，也算不上真正的‘智能’。这项技术已经存在大约 70 年，已经有三波冲击先后影响普通大众。”她讲道。第一阶段，社交媒体平台抢夺人们的注意力，撕裂社会共识，同时让个体陷入孤立。“第二波冲击依旧是利用人们对于亲密联结的心理诉求，入侵我们的生理本能：也就是各类聊天机器人。”雷萨说，“而第三波，则直接冲击人的自主决定权，也就是具备自主行动能力、多智能体协同的 AI。这些前沿模型打造出来的机器不再只是模仿人类，它们还会代替人类做出行动。”包括美国总统唐纳德 · 特朗普在内的部分批评人士反对行业有关 AI 监管的呼声，他们担心实施监管之后，美国会在 AI 竞赛当中落后于中国。雷萨驳斥了这套说法，称其只是“高明的说辞”。“事实上，相比于硅谷面向全球用户的产品，中国为本国公民设置了更多安全防护机制。拿 TikTok 来说，面向中国国内使用的版本设置了年龄限制。”她表示。她提出，应当建设由公共利益团体运营、脱离大型科技公司掌控的通信平台；就如同城市修建城市公园这类公共基础设施一般。Rappler 媒体在 2023 年推出的 Rappler Communities 社区项目，正是一次这样的实践。Rappler Communities 是一款手机 App，搭建在开源、安全、去中心化的 Matrix 协议之上。依托这款应用，Rappler 编辑部既可以和读者沟通，读者彼此之间也能够开展“真诚的对话交流”，雷萨介绍。Rappler 已经邀请菲律宾其他本土媒体入驻该平台，如今还准备把这套模式推广到东南亚其他新闻机构。“这里可以成为民众的一块数字安全空间。人们能够相互交谈，更为重要的是学会倾听彼此，民主社会的良性运转才得以在此发生。”她说。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/002/794.htm", "publishedAt": "2026-09-15T14:46:54+00:00"}, {"title": "荣耀 AgenticOS 亮相，10 月面向 Magic9 系列用户开放尝鲜招募与推送", "summary": "IT之家 9 月 15 日消息，在今晚的荣耀 HGDC 2026 荣耀开发者大会上，荣耀 AgenticOS 系统也登场亮相。根据规划，荣耀年度旗舰 Magic9 系列将首发搭载 MagicOS 11 系统。今年 10 月份，荣耀还会针对 Magic9 系列用户开放通用 AgenticOS 预览版的尝鲜招募与推送。参考IT之家此前报道，荣耀 AgenticOS 定位新一代伙伴型多模态智能体操作系统，已于今年 7 月在 2026 世界人工智能大会上发布。该系统支持意图驱动、自然交互、主动智能、天生跨端四大特征，拥有行业首个系统级 Agent 架构，支持全局多智能体协同、全场景自适应沉淀和面向全场景智能体的自循环等能力。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/002/791.htm", "publishedAt": "2026-09-15T14:34:32+00:00"}, {"title": "将降本增效进行到底，Meta 计划明年上半年部署新一代自研 AI 芯片", "summary": "IT之家 9 月 15 日消息，据彭博社今天（15 日）报道，Meta 计划明年上半年在数据中心部署新一代自研 AI 芯片，希望在运行 AI 模型时进一步降低成本和能耗。Meta 于 2023 年公布自研 AI 芯片计划，目前正在测试第三代产品 MTIA 450，代号 Arke。下一代 MTIA 500 代号 Astrid，预计约一个月后完成设计，并于 2027 年底进入数据中心。相比前几代产品，Meta 计划更大范围部署 Astrid。负责 Meta 定制芯片项目的工程副总裁 Yee Jiun Song 接受采访时指出，每一代产品都会在技术上承担稍高一些的风险，同时换来更好的性能。具体而言，新一代芯片不仅要提高能效，也要在同等投入下提供更强性能。Meta 正大举建设 AI 基础设施，自研芯片是其中的重要一环。芯片由 Meta 与博通合作设计、台积电负责制造，目标之一是减少对英伟达领先 AI 处理器的依赖。如果按照能耗规模衡量，Meta 计划在 12 个月内部署超过 1GW 规模的自研芯片，后续的部署速度预计还会加快，前提是 AI 市场和需求不出现大幅下滑。Meta 超级智能实验室也参与芯片调校，向硬件团队提供未来 AI 模型以及推理阶段所需能力的信息。Yee Jiun Song 称，由于大量工程工作由 Meta 自行完成，自研芯片运行自家 AI 模型时，可以比“英伟达当前出货的任何产品”更高效。9 月 1 日，台积电向 Meta 交付 12 枚新型号芯片，实测性能与此前模拟结果的差距只有 2% 至 3%。据IT之家了解，拿到芯片当天，团队便成功运行 Meta 自家模型，以及 DeepSeek 和阿里巴巴的模型。初步测试没有发现芯片设计缺陷，但后续仍需要数月测试和调校，工厂也将在此期间逐步提高产量。四代芯片基本都采用高带宽内存，定位并非追求极致响应速度的超高速推理市场。Yee Jiun Song 透露，这些产品将成为用于通用推理的主力芯片。Meta 此前还规划过一款代号 Olympus 的芯片，希望同时承担 AI 训练和推理任务，原定 2028 年或 2029 年推出。后来 Meta 取消了项目，转而集中资源开发推理芯片。成本是主要考虑之一。当容量扩大到数 GW 级别时，成本就会变得非常重要。如果同时兼顾训练和推理会让芯片成本提高 30%，在这种规模下就会变得“完全无法接受”。Astrid 开发完成后，Meta 下一阶段将重点提高芯片速度和吞吐量，也就是单位时间内能够处理的 AI 任务规模，同时利用光纤技术进一步提升性能。“我们的产品路线图非常完善。未来几年，我们会继续开发性能足以与供应商产品竞争的芯片。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/002/790.htm", "publishedAt": "2026-09-15T14:26:01+00:00"}, {"title": "6500 美元的双臂人形机械臂，OpenArm 把硬件开源做到能复现", "summary": "物理 AI 研究一直卡在一个尴尬的地方：软件栈开源得热火朝天，硬件却始终是实验室里那台没法复现的定制臂。OpenArm 想把这个口子撕开——一台 7 自由度的全开源人形臂，整套 bimanual 系统卖 6500 美元。 这个价格在同类里算激进。更激进的是它的定位：不是给你一台能拿东西的机械臂，而是给物理 AI 一个能全球复现实验条...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502506", "publishedAt": "2026-09-15T11:26:10+00:00"}, {"title": "无问芯穹联合清华、上交正式开源具身端侧推理引擎APXInf，Pi 0.5性能SOTA", "summary": "卡位具身智能规模化落地“最后一公里”！", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/489460.html", "publishedAt": "2026-09-15T10:43:28+00:00"}, {"title": "全球AI视频榜单第一梯队再添中国力量：智象发布首款物理规律导向视频模型", "summary": "智象未来（HiDream.ai）正式发布首个原生全模态视频生成模型 HiDream-O1-Video-1.0", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/09/489389.html", "publishedAt": "2026-09-15T10:41:06+00:00"}, {"title": "阶跃星辰发布 Step Audio 3 系列语音模型，多款上榜全球第一", "summary": "语音大模型的竞争，正在从\"能不能把文字念出来\"换成\"能不能真正理解声音、组织声音\"。阶跃星辰今天放出的 StepAudio 3 系列，就是冲着这个方向去的——五个模型一次全发：Realtime、ASR、TTS、Gen、Music。 最出挑的是 StepAudio 3 Realtime。在 Artificial Analysis 的 Conversational Dynamics 榜单上，它以 98.9% 的综...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502502/step-audio-3", "publishedAt": "2026-09-15T08:56:24+00:00"}, {"title": "智能体什么该记什么  Meta 面向消费者推出的 AI 智能体产品 Muse。“Luna”镜框侧面设有一颗快捷按键，可用于一键唤醒 Meta AI，其内置扬声器的规格则与现有在售机型相似。IT之家从报道获悉，Meta 可能会在下周三至周四举办的年度 Connect 开发者大会上正式发布这款眼镜，并计划于 10 月开启出货。相关阅读：《可检测身边的人是否戴着 Meta 智能眼镜，波兰开发者打造“Zuckoff”应用》《苹果新 CEO 特努斯谈 Meta“变态眼镜”风波：AI 智能设备需要让旁人安心》《Meta 智能眼镜引发美国执法机构担忧：或被用于秘密监控与恐袭侦察》《Meta 强力打击智能眼镜偷拍行为：你敢破坏指示灯，我就永久禁止摄像头》《奥尔特曼不喜欢智能眼镜：和戴着摄像机的人讲话很不舒服，Meta 扎克伯克不用担心 OpenAI 来抢生意》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/002/837.htm", "publishedAt": "2026-09-15T23:15:14+00:00"}, {"title": "影石 Mic Pro 腾讯会议版 AI 录音领夹麦发布，698 元", "summary": "IT之家 9 月 16 日消息，影石昨日发布了 Mic Pro 腾讯会议版 AI 录音领夹麦，售价 698 元。该产品定位 Agent 时代 AI 录音笔，接入了腾讯会议录音转写、纪要能力，按下即可录制，录完自动同步腾讯会议 App，AI 自动对录音内容进行转写、区分发言人、生成专业纪要。产品重 19g，支持领夹、磁吸两种佩戴方式，搭载一块自定义墨水屏，可以自由展示身份信息、公司 Logo、创意图片、个人信息等内容。影石 Mic Pro 内置三麦阵列，支持 5 米稳定拾音；单次可录制最长 9.5 小时，支持快充，补电 5 分钟即可多录制 1.5 小时；机身内置 32GB 存储空间，可以存储 1000+ 小时音频，支持本地导出录音文件。IT之家附包装及权益详情如下：京东影石 Insta360 Mic Pro 腾讯会议版 AI 领夹麦录音笔 698 元直达链接", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/002/835.htm", "publishedAt": "2026-09-15T23:05:27+00:00"}, {"title": "英伟达黄仁勋：AI 行业不需要新法律，开发可兼得速度和安全", "summary": "IT之家 9 月 16 日消息，昨日（9 月 15 日）举办的 Salesforce 活动中，英伟达首席执行官黄仁勋表示，AI 开发不应被理解为“速度”和“安全”二选一。IT之家援引彭博社报道，在对话 Salesforce 首席执行官马克 · 贝尼奥夫时，黄仁勋认为 AI 行业不需要为 AI 安全制定新的法律或监管规定，安全与速度可以兼得，二者之间的冲突是一种“虚假对立”。他认为企业可以依靠市场机制，在推进创新的同时确保产品安全。企业可以根据产品成熟度控制发布节奏，对于可能造成危害的产品可以选择不发布，等到有足够信心、确认产品能够获得市场认可后再推出。而且市场竞争、用户选择和商业声誉会促使企业改进产品安全。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/002/834.htm", "publishedAt": "2026-09-15T23:05:20+00:00"}, {"title": "Agent开始调用基础设施，Kubernetes准备好了吗？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/jGTsO1DrV87muOqyDPGS?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-09-15T20:38:38+00:00"}, {"title": "飞书与豆包工作合体后首亮相：Agent 能进群，还能帮你写周报、做PPT", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/aCRVupdyEAHtENIiIDwq?utm_source=rss&amp;utm_medium=article", "publishedAt": "2 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
