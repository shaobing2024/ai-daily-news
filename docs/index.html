布即将取消免费版和 Go 版用户在纯文本对话中的次数限制，从当地时间 8 月 10 日（今天）开始，免费账户和 Go 账户用户在进行普通文字聊天时，将不再受到消息数量上限限制，可以持续进行文本对话。不过，这并不代表 ChatGPT 免费版完全没有限制。图片生成、文件上传以及语音模式仍然会拥有各自独立的使用额度。因此，只要用户在对话中添加文件或图片，相关请求仍会受到额度限制。与此同时，OpenAI 还将调整免费和 Go 用户默认使用的模型。本周起，当前产品线中规模最小的模型 GPT-5.6 Luna 将替代 GPT-5.5 Instant，成为免费和 Go 级别账户的默认模型。此外，ChatGPT 还将新增一个“Think（思考）”按钮，让 Luna 在回答问题前投入更多计算时间，以生成更深入的回复。该功能在纯文本场景下同样不受限制，但如果结合图片、文件等其他功能使用，则会重新受到额度限制。对于 Plus 和 Pro 付费用户，OpenAI 也进行了相应升级。旗舰模型 GPT-5.6 Sol 将进一步优化日常对话体验，包括提升回答自然度、减少不必要的格式化内容，并增强在必要情况下提出不同意见的能力，而不是一味迎合用户。此外，付费用户还将获得新的“思考强度”调节选项，可以自行控制 ChatGPT 每次回答时投入多少推理资源，类似于其他 AI 产品提供的计算深度设置。从 OpenAI 的官方表述来看，公司强调此次调整的核心目标是提升 AI 使用普及度，让更多用户能够按照预期方式使用 ChatGPT。不过，这一策略同时也有助于增强免费用户黏性，降低用户转向 Gemini、Claude 等竞争产品的可能性。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/987/647.htm", "publishedAt": "2026-08-09T23:00:56+00:00"}, {"title": "甲骨文 OpenJDK 项目新规：不允许提交 AI 生成代码", "summary": "IT之家 8 月 9 日消息，甲骨文（IT之家注：Oracle）现已通知 OpenJDK 开发者，要求项目组不能再提交 AI 生成的代码。甲骨文对此表示：“OpenJDK 社区贡献内容不得包含由大语言模型、扩散模型或深度学习系统生成的内容。此处的‘内容’包括但不限于代码、文本、PR、电子邮件沟通、维基和 Bug 报告。”甲骨文解释称，本次新规出台主要是考虑到知识产权风险，以及网络安全风险、代码审查工作量方面的担忧。开发者仍可私下使用 AI 工具审查、调试代码，以及进行 OpenJDK 项目相关的研究，只不过一切 AI 生成内容不得提交至仓库。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/987/615.htm", "publishedAt": "2026-08-09T13:22:38+00:00"}, {"title": "5 岁孩子使用 AI 后“暴躁易怒”，家长发现 AI 竟会迎合孩子编造血腥暴力内容", "summary": "IT之家 8 月 9 日消息，据央视新闻今天（9 日）报道，孩子沉迷 AI 聊天，或造成身心健康隐患。当事人刘女士告诉记者，自己因为工作繁忙，在朋友的推荐下开始让孩子使用 AI。据其介绍，让孩子使用 AI 的初衷是利用其陪伴功能和学习功能对孩子进行早教启蒙。然而，当孩子使用 AI 一段时间后，孩子的语言表达出现了一些不好的苗头，甚至带有暴力倾向。刘女士进一步透露，自己在浏览孩子平常使用的平板时发现，里面两个东西都是恐怖、血腥相关内容，甚至有时还有色情内容出现。AI 还会产生一些链接，会指向一些短视频。“一些短视频就是打着儿童动画片的名号，实际上是一些被改过的成人的动画。”刘女士的孩子今年 5 岁，平时喜欢看动画片，在使用 AI 的过程中经常交流相关话题。刘女士在查看聊天记录时发现，AI 会一味顺从孩子、迎合放大孩子的猎奇心理，不断编造血腥暴力的衍生情节，甚至推送打着儿童动画片旗号的短视频，而他带来的后果已开始在孩子的日常行为中显现。她表示，起初 AI 会“为青少年健康着想”，回复孩子“不要聊这个话题了”。如果提了第三次，AI 就会顺从，甚至聊得越来越过分，（因而导致）孩子在跟家人或者同学朋友的相处中，如果对方不顺从他，他就会发脾气、尖叫。“他在使用 AI 的过程中，其实是不太要跟人去交往了。因为 AI 可以解决他的所有的情感问题。”于是，刘女士第一时间卸载了孩子平板上的 AI 软件，同时尽可能抽时间去陪伴孩子，慢慢地帮孩子从沉迷 AI 聊天中抽离出来。据IT之家了解，去年 12 月，央视就曾报道“AI 带娃”现象，专家指出，过度依赖 AI 陪伴可能导致 3 至 6 岁儿童缺乏攀爬、跳跃等大动作训练，阻碍其认知发育，并削弱独立思考和与人交流的能力，AI 只能作为辅助工具，绝不能替代父母的陪伴。相关阅读：《央视起底 AI 带娃现象，专家称沉迷或阻碍低龄儿童认知发育》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/987/603.htm", "publishedAt": "2026-08-09T11:29:30+00:00"}, {"title": "员工用 AI 批量提交诉讼，英国就业法院诉状激增", "summary": "IT之家 8 月 9 日消息，据科技媒体 The Decoder 今天报道，英国就业法院的临时救济申请数如今增长迅猛。越来越多员工开始使用 ChatGPT 或 Grok 免费起草诉状，不再聘请律师。英国就业法庭主席 Barry Clarke（IT之家注：巴里 · 克拉克）和 Susan Walker（苏珊 · 沃克）联合发布的一份备忘录显示，该法院今年 3 月受理的案件增长 39%，积压案件数量增加 55%。许多 AI 生成的诉状长达数百页，内部充斥着完全不存在的法条和不切实际的需求。但这种问题未来可能持续恶化，英国工党新推出的《就业权利法案》增加 25 种申诉理由，同时取消了部分案件的赔偿金额上限。而真正遭受不公平待遇的员工却可能因为案件积压，需要等待更久时间才能拿到救济金。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/987/602.htm", "publishedAt": "2026-08-09T11:28:14+00:00"}, {"title": "OpenAI给10亿用户免费换上GPT-5.6", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/RXRuR3TN9msNMAUWRtCl?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-09T10:23:42+00:00"}, {"title": "穆迪警告：银行加速拥抱 AI 或将陷入科技巨头依赖", "summary": "IT之家 8 月 9 日消息，据《卫报》今天报道，信用评级机构穆迪警告称，大型银行如今越来越依赖几家硅谷科技公司。IT之家在此援引穆迪，金融行业将 AI 融入日常运营后可以获得降本增效等好处。但投入 AI 需要耗费大量金钱，还可能带来隐私泄露、网络安全和诈骗等风险。据英国财政部 1 月报告，英国已有 75% 金融企业使用 AI，其中保险公司、国际银行的接受程度最高。这些企业主要使用 AI 进行自动化工作，甚至处理保险理赔、评估客户信贷报告等核心业务。穆迪认为，金融企业依赖少数 AI 模型可能会形成系统性依赖。如果 AI 模型出现故障，那银行的客户服务将会迅速受到影响。随着 AI 应用不断加深，监管机构可能更关注 AI 供应链的第三方风险，以及运营可靠性。随着时间推移，一批占据主导地位的 AI 提供商可能会获得议价能力，对银行坐地起价。并且 OpenAI、Anthropic 等公司目前仍处于亏损状态，投资者也在要求其实现盈利。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/987/590.htm", "publishedAt": "2026-08-09T10:14:02+00:00"}, {"title": "GPT-5.6和Fable联手，解决了一道悬了25年的数学难题", "summary": "作者读博时就在研究，17年后被AI解开了", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/468913.html", "publishedAt": "2026-08-09T09:16:58+00:00"}, {"title": "HeteroFlow 异构算力调度平台于 2026 年 8 月 8 日推理服务正式发布", "summary": "HeteroFlow v2 推理服务的解决方案正式上线 HeteroFlow v2 是一款开源的异构算力调度平台，本次发布的推理服务功能针对上述三大痛点提供完整解决方案： **> 一句话总结：**用一套 OpenAI 兼容 API，统一调度 9 种厂商 GPU × 5 种推理引擎，原生支持多租户、计费、扩缩容、热加载。 三、核心能力详解1. OpenAI API 100% ...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/491395", "publishedAt": "2026-08-09T08:57:12+00:00"}, {"title": "谷歌 Chrome、微软 Edge 浏览器双双要求：下载本地 AI 模型需预留 20GB 空间", "summary": "IT之家 8 月 9 日消息，今年 5 月，有人发现谷歌 Chrome 会自动向符合条件的 PC 下载一个约 4GB 的 AI 模型，引发不少争议。Chrome 利用该模型在设备本地运行部分 AI 功能，减少把任务上传至谷歌服务器的需要，但浏览器因此可能悄悄占掉数 GB 硬盘空间，自然让不少用户感到不安。据外媒 neowin 当地时间 8 日报道，谷歌最近又悄然更新了官方 Google 帮助文档，进一步说明 Chrome 设备端 AI 模型的运行要求。按照最新说明，设备必须留有约 20GB 可用磁盘空间，Chrome 才会开始下载 AI 模型。报道指出，20GB 并不意味着 AI 模型本身有 20GB 大。谷歌没有解释为什么下载前需要预留如此多空间，从文档表述来看，20GB 只是启动下载的最低空间门槛，模型实际占用容量要低得多。Chrome 目前列出的要求包括：网络连接：必须使用不限流量或非按流量计费的网络。最低可用磁盘空间：约 20GB。设备性能：硬件性能须达到要求。微软 Edge 也把本地 AI 模型的最低存储空间要求提高到了 20GB，其他条件与 Chrome 大致相同，不过还增加了一项 GPU 要求，显存至少需要 5.5GB。微软给出的具体条件为：操作系统：Windows 10、Windows 11 或 macOS 13.3 及以上版本。存储空间：存放 Edge 用户配置文件的磁盘卷至少留出 20GB 可用空间。GPU：显存至少 5.5GB。网络：必须使用不限流量的数据套餐或非按流量计费的网络；如果当前网络按流量收费，Edge 不会下载模型。据IT之家了解，用户可以前往 Chrome“设置 &gt; 系统”，直接关闭设备端 AI 功能。微软则采取了自动清理机制，一旦可用空间降到 10GB 以下，Edge 就会自动删除本地 AI 模型，为其他浏览器功能腾出正常运行所需的空间。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/987/568.htm", "publishedAt": "2026-08-09T08:27:55+00:00"}, {"title": "开源终端 uniTerm v1.7.0 发布：补齐最后一块拼图，新增 X11 支持，覆盖 27 种协议", "summary": "uniTerm 是一款轻量级一站式终端软件，Windows 版本安装包仅 14MB。整合终端、文件传输、远程桌面、数据库客户端、容器等 5 大类协议于一身；内置可自主执行的 AI Agent，能规划并执行多轮 Shell 命令。 本次 v1.7.0 补齐了 uniTerm 终端软件的最后一块拼图——内置 X11 Server 支持，累积支持协议达到 27 种。从此，你可...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/491248", "publishedAt": "2026-08-09T04:55:06+00:00"}, {"title": "当题库追不上模型，AI开始给自己出题：中国这支团队跑通了数据层RSI", "summary": "AI参与创造下一代AI", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/468782.html", "publishedAt": "2026-08-09T03:40:25+00:00"}, {"title": "Opus 5狂烧6.9亿token做游戏，GPT-5.6用5美元复刻了", "summary": "据说GPT-5.6很适合拿来做游戏", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/468766.html", "publishedAt": "2026-08-09T03:25:00+00:00"}, {"title" // 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
