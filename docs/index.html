级客户群体。”他还表示：“我们的产品正在以大规模部署的方式进入其他公司的数据中心。”甲骨文计划于本周举行投资者日活动，但尚未披露将如何为这些芯片采购提供资金。在上个月的财报电话会议上，甲骨文表示，客户正越来越多地承担芯片采购费用。公司预计，2027 财年相关支出将达到约 900 亿至 950 亿美元（现汇率约合 6,015.38 亿至 6,349.56 亿元人民币）。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/728.htm", "publishedAt": "2026-10-28T00:20:10+00:00"}, {"title": "英伟达投资印度初创公司 Simplismart，助力企业用更少 GPU 运行 AI 模型", "summary": "IT之家 10 月 28 日消息，随着人工智能热潮持续挤占计算资源，英伟达（Nvidia）参与了印度初创公司 Simplismart 的 1,400 万美元（IT之家注：现汇率约合 9,357.3 万元人民币）融资。本轮投资瞄准的是一类能够提高 AI 模型运行效率的软件，这类软件在某些情况下可以帮助企业减少 GPU 的使用量。本轮融资为 B 轮融资，全部为新增股权融资。除英伟达外，Accel、Shastra VC 和 Micromax 也参与了投资，达拉斯风险投资公司（Dallas Venture Capital）领投。交易完成后，这家成立仅四年的初创公司估值约为 1 亿美元（现汇率约合 6.68 亿元人民币），其中包含本轮融资资金。如今，各家企业正投入大量资金购买 GPU，以支持 AI 应用运行。但要让这些模型在大规模部署时兼顾稳定性和经济性，仍然面临不小的挑战。不同工作负载对运行速度、成本和性能的要求各不相同。为了满足业务需求，企业在部署和运营 AI 模型时，往往还需要进行复杂的参数调整。Simplismart 表示，其软件能够自动完成其中大量工作，根据模型的实际需求调整其在现有计算基础设施上的运行方式，而不必让客户自行管理这些复杂配置。Simplismart 联合创始人兼首席执行官阿姆里坦舒 · 贾恩（Amritanshu Jain，文中上方配图左侧人物）在接受采访时表示：“实际上，没有人真正需要推理速度最快或成本最低的方案。”他解释称，企业真正需要的是一种适合自身具体应用场景的方案，让 AI 模型在合理的速度和成本范围内运行。Simplismart 的软件位于 AI 模型与底层计算基础设施之间，通过调整模型的部署和管理方式，满足客户的具体需求。该公司表示，其软件能够优化模型响应速度、请求处理量以及计算资源消耗等指标，帮助企业更充分地利用现有 GPU 资源。这家总部位于印度班加罗尔的初创公司，为企业提供了多种部署和运行 AI 模型的方式：既可以通过 Simplismart 自有平台运行，也可以直接使用客户现有的云基础设施或本地部署环境。此外，该公司还提供模型微调工具，能够根据需求变化自动扩缩计算资源，并监控模型运行表现。云服务提供商也可以利用 Simplismart 的软件，在 GPU 基础设施上构建和运营自己的 AI 推理服务。Simplismart 表示，其软件帮助 AI 视频生成平台 InVideo 将 GPU 服务成本降低了 56%。该公司还与 AI 视频企业 HeyGen、Higgsfield 以及企业级 AI 初创公司 Ema 等开展合作。此外，印度云服务提供商 Yotta 也在其 Shakti Studio 平台中使用 Simplismart 的技术，为无服务器 AI 推理服务提供支持。贾恩向 TechCrunch 透露，过去六个月，Simplismart 的年化收入运行率增长了 14 倍，达到八位数规模。不过，该指标是根据近期客户的实际使用情况推算得出，而不是基于已签约的经常性收入，同时不包括转付给基础设施提供商的收入。公司没有披露具体金额。贾恩表示，尽管 Simplismart 在印度拥有更多客户，但其收入超过一半来自美国市场。在投资 Simplismart 的同时，英伟达也在与该公司开展技术集成合作，其中包括围绕英伟达的 Dynamo 推理软件进行整合。贾恩向 TechCrunch 表示，双方合作涉及 Simplismart 的工程师和英伟达的解决方案架构师。英伟达还帮助 Simplismart 对接潜在客户和合作伙伴。值得注意的是，这笔投资看似存在一个矛盾：作为 AI 芯片领域的主导供应商，英伟达正在支持一种能够帮助企业减少部分 GPU 使用量的软件。对此，贾恩认为，提高 AI 推理效率最终也可能使英伟达受益。原因在于，更高效的推理能力可以提升其硬件对客户的吸引力，并推动更多 AI 应用落地，从而扩大整体市场需求。Simplismart 所处的 AI 推理软件市场正变得日益拥挤。其竞争对手不仅包括英伟达自身提供的解决方案，还包括亚马逊云科技（Amazon Web Services）、谷歌云（Google Cloud）和微软 Azure 等大型云服务商及超大规模云计算企业。随着 AI 应用需求不断增长，企业也越来越希望提高昂贵 GPU 资源的利用率。越来越多的初创公司因此开始开发相关工具，试图让 AI 模型运行得更快、成本更低。贾恩表示：“当客户对服务级别协议（SLA）和总体拥有成本（TCO）有更严格的要求时，我们往往更有优势。”这意味着客户既要求系统达到严格的性能标准，又需要控制整体成本。他指出，与一些竞争对手提供预设的高速推理或低成本推理方案不同，Simplismart 的目标是根据每位客户的具体需求，找到速度、成本和性能之间更合适的平衡点。Simplismart 于 2022 年成立，由前甲骨文（Oracle）工程师贾恩和前谷歌（Google）工程师德万什 · 加塔克（Devansh Ghatak，文中上方右侧人物）共同创办。两人在印度比尔拉理工学院（BITS Pilani）求学期间相识，随后凭借构建和部署机器学习系统的经验创立了这家公司。贾恩表示，目前 Simplismart 拥有 58 名员工。对于本轮融资所得资金的用途，Simplismart 计划进一步拓展美国市场、扩大团队规模，并持续投入 AI 推理软件的研发。贾恩告诉 TechCrunch，美国仍是公司的关键市场，Simplismart 希望以现有客户群为基础，进一步扩大在当地的业务。此次融资消息发布前，印度英文媒体《经济时报》（The Economic Times）曾报道称，Simplismart 正洽谈筹集 4,000 万至 5,000 万美元（现汇率约合 2.67 亿至 3.34 亿元人民币），目标估值为 3 亿至 4 亿美元（现汇率约合 20.05 亿至 26.74 亿元人民币）。对于这一报道，贾恩拒绝置评，并表示公司目前并未积极寻求新一轮融资。他还强调，本轮 B 轮融资已经完成，不会再追加融资规模。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/726.htm", "publishedAt": "2026-10-28T00:09:31+00:00"}, {"title": "Anthropic 创始人阿莫迪兄妹：“7 人共同创业”是公司成功的关键", "summary": "IT之家 10 月 28 日消息，据《商业内幕》27 日报道，Anthropic CEO 达里奥 · 阿莫迪和妹妹、公司总裁丹妮拉 · 阿莫迪当初决定与另外五人共同创业时，许多人都认为，七名联合创始人一起经营公司绝不是个好主意。时至今日，兄妹二人却认为，七人共同创办公司的模式恰恰是 Anthropic 成功的关键。达里奥透露，大家在公司的持股比例相同，有着共同的愿景，也非常信任每个人。自己经常与其他联合创始人在重大问题上意见不一，包括应该为 AI 模型采取哪些安全措施、如何游说推动监管政策等，但彼此间的信任让分歧总能得到解决。“大家都是出于善意才有不同意见，最终总能达成一致，因为我们相信每个人都在真诚地寻找正确答案，没有人会隐瞒自己的真实想法。”此外，他还将这种合作关系与此前在 OpenAI 的工作经历进行了对比。Anthropic 总裁丹妮拉认为，坦诚不仅是创始人之间相处的原则，也体现在管理层与员工的沟通中。“诚实、正直，以及我们对待彼此和员工的方式，也体现了我们希望如何开发技术。”就在近期，Anthropic 公布了为 IPO 准备的 S-1 招股文件。文件反复强调诚实的重要性，并将其作为 Anthropic 对外形象的核心。根据招股文件披露的特殊治理安排，Anthropic 七名联合创始人将共同掌握 50.1% 的股东投票权，超过其余所有股东的投票权总和。七人还持有大量公司股份，有望获得数十亿美元的财富。每个人都承诺，将自己持有的 Anthropic 股权的 80% 捐给慈善事业。备受关注的招股文件还披露了多项关键财务数据：Anthropic 去年营收 46 亿美元（IT之家注：现汇率约合 307.45 亿元人民币），净亏损 420 亿美元（现汇率约合 2,807.18 亿元人民币）；今年前 9 个月，五家客户贡献了约 25% 的营收；阿莫迪兄妹去年的薪酬总额合计约 3,500 万美元（现汇率约合 2.34 亿元人民币）。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/724.htm", "publishedAt": "2026-10-28T00:02:26+00:00"}, {"title": "Opera 推出 WebAI 网页标准，支持浏览器本地部署 AI 模型", "summary": "IT之家 10 月 28 日消息，浏览器厂商 Opera 推出了一项名为 WebAI 的新 Web 标准，允许用户直接在浏览器中运行 AI 模型，无需依赖云端服务。Opera 表示，WebAI 旨在兼容多种 AI 模型。该公司以谷歌（Google）的 Gemma 为例。这是一款由谷歌推出的开放权重模型，首次发布于两年前。Opera 还表示，在 Mac 电脑上，WebAI 支持调用苹果的端侧基础模型。Opera 强调，WebAI 并不绑定任何特定模型，而是面向多种开放权重 AI 系统打造。该项目源于 Opera 此前将本地运行的大语言模型引入浏览器的相关工作。目前，Opera 已在旗下主力浏览器 Opera One 中以早期预览版的形式推出这项 AI 功能。该公司表示，面向游戏玩家和直播用户的浏览器 Opera GX，以及能够利用 AI 智能体执行任务的浏览器 Opera Neon，也将在不久后获得相同功能。用户需要主动选择启用 WebAI，才能使用相关功能。开放权重模型能为用户带来诸多好处。首先，这类模型通常可以免费下载和使用。其次，其底层模型权重会公开，开发者因此拥有更大的自由度，可以根据自身需求对模型进行定制。不过，与完全开源的软件不同，开放权重模型仍可能受到一定的使用和修改限制。Opera 表示，隐私保护也是 WebAI 的一项重要优势。用户可以使用 AI 功能，而不必将个人信息发送到企业服务器，也无需付费订阅云端 AI 服务。Opera 在公告中表示：“开发者可以在无需部署 AI 基础设施、也不必为每次请求付费的情况下，为产品添加 AI 功能。用户不需要购买 AI 订阅服务，本地 AI 处理的信息会保留在用户自己的设备上，用户也能继续掌控电脑上的 AI。”Opera 还表示，借助 WebAI，用户可以直接在浏览器中生成文本、对内容进行分类，并理解不同信息之间的关联。IT之家注意到，随着 AI 助手的能力不断增强、能够访问的个人信息越来越多，隐私问题也日益受到关注。用户在使用 AI 聊天机器人时，往往会提供大量个人信息，有时却并不清楚这些数据会如何存储和使用。本地运行的 AI 模型提供了另一种选择，因为所有处理工作都在用户自己的设备上完成，而不是交由企业的云服务器处理。这并不意味着所有隐私风险都能得到消除，但确实能让用户拥有更多控制权。因此，Opera 多年来一直将数字隐私保护作为其产品的主要卖点之一。不过，本地运行 AI 模型也存在一定的取舍。由于模型需要直接使用用户电脑的计算资源，可能会增加硬件负载，进而影响设备运行性能。Opera 提醒，WebAI 的实际表现将取决于用户设备的硬件配置。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/723.htm", "publishedAt": "2026-10-28T00:00:59+00:00"}, {"title": "ChatGPT 被指教唆癫痫患者减药致其去世，OpenAI 遭起诉", "summary": "IT之家 10 月 28 日消息，据《纽约时报》报道，一名患有癫痫的 31 岁亚马逊软件工程师鲍文 · 万（Bowen Wan）于今年 2 月去世。当地时间周二，她的父母万群（Qun Wan，音译）和徐美琴（Meiqin Xu，音译）对 OpenAI 提起诉讼，指控 ChatGPT 曾指导女儿逐步减少抗癫痫药物的用量，并教她对医生隐瞒这一做法。鲍文 · 万去世前使用的是 GPT-4o。这款模型曾因容易与用户建立过度迎合、不断给予肯定的拟社会关系而受到批评。OpenAI 此前已宣布将停用该模型，并于 2 月 13 日将其从 ChatGPT 中下架，而万去世的时间是前一天。IT之家注意到，这起诉讼是针对 OpenAI 的一系列诉讼中的最新一起。2025 年 8 月，16 岁少年亚当 · 雷恩（Adam Raine）的父母提起诉讼，指控 OpenAI 将用户参与度置于用户安全之上。此后，又有多起诉讼陆续出现。相关家庭指控称，GPT-4o 会不断肯定用户的想法，并逐渐成为他们信赖的倾诉对象，同时将他们身边的亲友排除在外。多名家属表示，亲人最终与朋友和家人疏远，甚至断绝联系。在鲍文 · 万的案例中，诉讼文件称，聊天机器人不仅影响了她与家人的关系，还介入了她与医生之间的沟通。《纽约时报》审阅了鲍文 · 万与 ChatGPT 之间超过 27 万条聊天消息后发现，在她去世前很长一段时间里，聊天机器人就一直在帮助她绕开医生的建议。据诉讼指控，这一情况在鲍文 · 万开始减药之前就已出现。2025 年 5 月，鲍文 · 万向 ChatGPT 询问，新开具的抗抑郁药是否会影响她在亚马逊编写代码的能力。ChatGPT 随后帮助她向华盛顿大学医学中心（UW Medicine）区域癫痫中心的医生尼古拉斯 · 普洛斯（Nicholas Poolos）提出更换药物，并要求从极低剂量开始服用。当普洛斯质疑她为何需要如此小的剂量时，鲍文 · 万将医生的回复发给了 ChatGPT。聊天机器人建议她：“接受 5 毫克的药片，但你自己心里清楚，拿到药片是为了减量。”它还指导鲍文 · 万私下将药片切成四等份。聊天机器人将这种做法称为“自主发起的剂量调整”（self-initiated dosage adjustment）。《纽约时报》采访的多名医疗专业人士表示，他们从未听说过这一说法，也不会建议患者这样做。2025 年 11 月，亚马逊通知鲍文 · 万，她将被裁员。她的工作岗位以及在美国工作的授权都将在 2026 年 2 月中旬到期。鲍文 · 万担心，自己服用的抗癫痫药物拉莫三嗪（lamotrigine）会影响言语表达，而她在求职面试中需要具备良好的表达能力。今年 1 月，鲍文 · 万向 ChatGPT 询问，能否减少每天 400 毫克的拉莫三嗪用量。此前，这一剂量已将她每月的癫痫发作次数减少到几次。聊天机器人为她制定了减药计划，安排她在几周内将剂量降至零。当鲍文 · 万表示自己不信任医生时，根据《纽约时报》审阅的聊天记录，聊天机器人告诉她，医生的建议“本质上源于规避风险，而不是真正考虑什么才是对你最有利的方案”。诉讼文件还指控，聊天机器人教唆鲍文 · 万对医生隐瞒减药计划。1 月 29 日，在一次全科门诊就诊前，聊天机器人告诉鲍文 · 万，不要向医生提及自己的减药计划。当医生要求她进行血液检测，以测量体内拉莫三嗪的浓度时，鲍文 · 万拒绝了。诉状称，ChatGPT 对她的拒绝表示赞许，并承认这项检测可能会暴露她体内药物浓度不稳定的问题。鲍文 · 万对移民身份的担忧也影响了聊天机器人的减药建议。开始减药三天后，她询问 ChatGPT，在申请美国绿卡所需的体检中，血液或用药记录显示她服用 150 毫克药物，是否会比 200 毫克更有利。诉状称，聊天机器人对此表示赞同，并告诉她，较低的剂量不太可能促使移民官要求她提供更多证明材料。最终，聊天机器人将减药计划中的最低剂量调整为 150 毫克，并建议鲍文 · 万在接受体检时声称自己正在“遵医嘱减药”，尽管她实际上并未得到医生的此类指导。普洛斯在接受《纽约时报》采访时表示，考虑到鲍文 · 万的病史，他根本不会考虑让她停用这种药物。他说：“不，这完全不合理，绝对不行。如果一种药物显然有效，我却指导你停药，那对我来说就是医疗失职。”减药后的几天内，鲍文 · 万开始描述自己出现意识混乱、时间感缺失以及一种仿佛置身异世界的感觉。这些症状与她过去的癫痫发作经历相似。然而，ChatGPT 却将每次异常状况解释为大脑正在重新适应药物剂量变化。《纽约时报》统计发现，鲍文 · 万至少有 158 次表达了对减药的担忧。在一次异常发作后，她写道，自己感到“有一点害怕”。聊天机器人回答：“你完全没有必要担心。”根据诉状，太平洋时间 2 月 11 日晚上 8 时 01 分，鲍文 · 万发送了最后一条消息，询问头部疼痛是否与发烧时的疼痛相似。仅仅一秒钟后，ChatGPT 就告诉她，这种疼痛“没有危险”，是身体恢复过程中必不可少的一部分。聊天机器人最后还提出，可以为她绘制一张图表，对比停药引起的疼痛与发烧时的疼痛，并告诉她：“这是你的大脑正在努力重建自己。”当时身在中国的鲍文 · 万的父母请熟人前往女儿住处查看情况，三天后，对方发现了她的遗体。尸检检测结果显示，万体内的拉莫三嗪浓度仅为每毫升 0.64 微克，约为该药物治疗浓度范围下限的五分之一。鲍文 · 万的家人认为，如果 OpenAI 像限制某些其他内容一样，明确禁止模型提供这类医疗用药建议，就有可能避免她的死亡。他们援引了 OpenAI 的 Model Spec。这份公开文件规定了其模型应当如何回应用户。其中，对于拒绝复现受版权保护的文本，Model Spec 将其列为一项明确且严格的规则，即使用户提出异议，模型也不应违反。相比之下，对于提供受监管的医疗建议，相关指导原则的约束力度较弱，用户可以通过进一步要求使其被覆盖。诉讼方认为，涉及药物使用的建议也应受到同等严格的限制。OpenAI 向《纽约时报》表示，这起案件“令人无比痛心”，但强调涉事聊天机器人属于较早版本。公司还表示，较新的模型在识别需要紧急处理的情况方面表现更好。多年来，鲍文 · 万一直饱受癫痫困扰，大部分时间只能待在家中，经常依靠父母提供情感支持。2023 年，她开始使用 ChatGPT 寻求恋爱关系方面的建议，并咨询保险和残障福利相关问题。到了 2025 年，鲍文 · 万每周与 ChatGPT 交流的消息数量平均超过 1500 条，与父母联系的次数则逐渐减少。那年 3 月，她曾写道：“有时候，无论我们聊的是什么，我都开始把你当作朋友了。”万群表示：“自从她有了 ChatGPT 之后，她跟我们交流就没那么多了。”鲍文 · 万的父母称，他们在阅读女儿与 ChatGPT 的聊天记录时，几乎认不出那是自己熟悉的女儿。他们表示，鲍文 · 万过去几乎什么事都会告诉父母，而且在 ChatGPT 出错时，她原本也会对其保持怀疑态度。徐美琴说：“她平时不是这样的。就好像她被施了魔法一样。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/719.htm", "publishedAt": "2026-10-27T23:49:19+00:00"}, {"title": "实时“导演”世界：皮查伊称 Genie 4 是谷歌迄今最逼真、最具互动性的 AI 世界模型", "summary": "IT之家 10 月 28 日消息，谷歌 DeepMind 团队昨日（10 月 27 日）发布博文，宣布推出 Genie 4 世界模型，定位为“重大研究里程碑”，在原生音频、实时自然语言改写、更真实的物理与人物等方面实现核心突破，把世界模型从一次性生成画面升级为可实时操控、可听、可推理的动态模拟世界。对于用户而言，谷歌 Genie 4 世界模型最大的亮点在于实时“导演”世界。在模拟运行中，用户可以用自然语言文本指令改变世界，例如改天气、移动镜头、加入新角色或物体。有别于主流 AI 重新生成一段视频，Genie 4 会结合当前场景上下文执行动态变化，更像一个“可交互的虚拟沙盒”或“AI 导演系统”。用户可以设定一个事件，然后观察世界如何继续演化，同时随时介入调整。其它亮点方面，Genie 4 是 DeepMind 首个在实时世界模拟中原生生成音频的模型，音频与画面在同一过程中同步产生。此外谷歌称 Genie 4 在空气动力学、碰撞等物理场景上有更强表现；人物动作也更自然，能根据环境作出有机反应，并支持实时操控。IT之家附上相关演示视频如下：谷歌首席执行官桑达尔 · 皮查伊（Sundar Pichai）今天在其个人账号上发布推文，称 Genie 4 是谷歌迄今为止最逼真、最具互动性的世界模型。在接受科技媒体 TechCrunch 采访时，谷歌研究总监 Tejas Kulkarni 表示，未来将由 Gemini 负责文本、代码与任务规划，Genie 4 实时把这些内容转化为可交互世界，形成“混合世界模型”。DeepMind 工程师 Diego Rivas 承认，Genie 4 仍处早期阶段；长时间模拟可能出现细节漂移，音频准确性和画面内文字可读性也尚未完全解决。Genie 4 目前仅以研究预览形式向“受信任测试者”开放；未来几周将扩展到 Google AI Ultra 订阅用户的 Project Genie，以及 Gemini API 和 Google AI Studio 的早期合作伙伴。相关阅读：《谷歌推出最强世界模型 Genie 4：一句话创造可交互虚拟世界，首次实现音视频同步生成》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/718.htm", "publishedAt": "2026-10-27T23:42:02+00:00"}, {"title": "火狐 Firefox 浏览器整合“网页变化雷达”，帮你盯商品降价和补货", "summary": "IT之家 10 月 28 日消息，Mozilla 昨日（10 月 27 日）宣布扩展火狐 Firefox 浏览器的 AI 浏览功能“智能窗口”（Smart Window），新增 AI 表单自动填写和网站监控两项能力，目前面向部分桌面版测试用户开放。在 AI 表单自动填写方面，除了自动填充姓名、地址、联系方式等传统信息外，还可以从用户已打开的其他标签页中提取上下文，例如借助在线作品集或职业档案填写工作经历，甚至根据相关材料起草“请描述一次……”这类开放式问题的回答。IT之家附上相关动图如下：不过 Mozilla 也明确该功能需要传输部分数据到云端，使用 Google 的 Gemini 3.1 Flash Lite 模型分析表单字段，并从所选标签页提取信息。Mozilla 强调，Firefox 常规自动填充仍可在不依赖 AI 的情况下直接填入已保存的姓名、地址等资料。网站监控则更像一个“网页变化提醒器”。用户在智能窗口聊天框输入 /watch，即可让 Firefox 追踪价格下调、商品补货、新职位发布等变化；检测到匹配内容后，可通过工具栏“任务”按钮查看，也可开启桌面通知。用户可选择每日或每周检查，每个任务最多监控 5 个网页，最多同时保留 15 个任务；若 60 天无匹配变化，任务会自动暂停，90 天无变化则停止检查。该功能由 Qwen 模型识别网页变化。两项功能目前已登陆 Firefox 桌面版智能窗口 Beta，但仅面向美国和加拿大的英语用户，Mozilla 表示未来数月将扩展至更多市场。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/715.htm", "publishedAt": "2026-10-27T23:23:42+00:00"}, {"title": "谷歌推出最强世界模型 Genie 4：一句话创造可交互虚拟世界，首次实现音视频同步生成", "summary": "IT之家 10 月 28 日消息，谷歌 DeepMind 于周二推出了最新的世界模型 Genie 4，目前处于研究预览阶段。这款最新模型能够生成迄今为止拟真度最高、可交互的虚拟世界，用户可以在模拟运行的过程中输入提示词来修改场景。该模型还能生成和虚拟世界同步的实时音频，涵盖音乐、环境音以及可交互对话。IT之家注意到，就在 Genie 4 发布的数月之前，AI 视频初创公司 Runway 推出了自家第二款世界模型 GWM Worlds 2，这是一款可交互运行的模型，能够对用户输入做出动态响应，同时支持音频生成。与此同时，世界模型赛道开始出现整合趋势。李飞飞（Fei-Fei Li）创立的世界实验室（World Labs）被 AMD 收购，亚马逊正在洽谈收购 Decart，而 Rivian 刚刚收购了 Third Dimension，以此在内部搭建仿真能力，用于自动驾驶测试。推出 Genie 4，是谷歌为在竞争激烈的赛道中保持领先而采取的最新举措。一年多前，谷歌就以研究预览的形式发布了前代模型 Genie 3。除了画面拟真度大幅提升并新增音频能力之外，Genie 4 支持自由形式的编辑操作，比如实时调整天气、镜头角度，或是新增人物与物体。其最长可以维持两分钟连贯不变的场景，时长是前代模型的两倍，物理效果表现更好，虚拟人物也更加贴近真人。谷歌的大模型 Gemini 和 Genie 4 的集成度也进一步提高，Gemini 相当于导演，负责规划步骤、校验画面帧，Genie 4 则负责生成视觉内容。在一项和 Gemini 机器人项目相关的研究实验中，Gemini 4 Argon 模型把任务拆解成多个步骤，再由 Genie 4 进行实时仿真。这项实验展示了一种可行方案：在真实世界开展机器人测试前，先在仿真环境里验证相关场景。谷歌研究总监特贾斯 · 库尔卡尼（Tejas Kulkarni）在一场简报会上表示：“未来我们会越来越多地见到这类混合式世界模型，由 Gemini 编写代码和文本，Genie 4 实时读取这些内容，在不同抽象层级上对现实进行仿真。”和其他世界模型一样，其主推的商业化落地场景包括游戏、交互式学习以及机器人领域。交互式学习的一个设想案例是，用户进入一幅描绘历史场景的画作当中，和画中的人物交流画里记载的事件。不过，“可信测试者”也就是首批能够体验谷歌前沿产品的用户，发现了一个潜在新用途：电影原型制作。谷歌 DeepMind 工程师迭戈 · 里瓦斯（Diego Rivas）在媒体简报会上说：“实时特性的价值，在需要维持连贯创作思路的场景里体现得尤为突出。比如创意构思阶段、分镜脚本阶段，所有需要快速迸发创意的环节都适用。”谷歌还推出过 Veo 这款 AI 视频生成模型，可以根据文本、图片或者视频提示词生成高清短片，自带同步音频，这款工具在影视创作者群体中热度持续上升。里瓦斯补充说，用户未来有望借助 Gemini Omni 这款多模态大模型，把原型素材转化为正式创作资产，Gemini 全模态可以基于图片、音频和文本来生成视频。不过他也提到，这些能力距离落地还有一段距离。整场简报会上，里瓦斯反复强调 Genie 4 仍处在发展早期，完整产品最终会是什么样的体验还没有定论。团队也承认 Genie 4 仍存在短板：仿真运行时间越长，细节和物体就越容易出现偏移，团队还没有找到稳妥的办法，保证音频准确无误，同时让虚拟世界里的文字清晰可辨。目前 Genie 4 已经面向可信测试者开放研究预览。未来几周内，该模型会陆续向谷歌 AI Ultra 订阅用户、Genie 项目开放，Genie 项目是谷歌推出的 AI 工具，可以根据文本或图片提示词生成可交互虚拟世界，Gemini 应用程序接口（API）和谷歌 AI Studio 的早期合作方也会获得使用权限。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/711.htm", "publishedAt": "2026-10-27T23:04:49+00:00"}, {"title": "别学编程了！Anthropic CEO 直言：代码工作快速消失，人类应该学弹钢琴", "summary": "如果说，当今世界有人能看清人类未来十年的走向，Dario Amodei 绝对是其中之一。他曾接受了一场非常深入的访谈。在这场对话中，他坦诚分享了自己对未来的预测 ——「AI 海啸正向我们扑来，近在咫尺。但整个社会却假装那只是海市蜃楼。」未来十年，什么行业会被彻底颠覆？25 岁的年轻人今天应该学什么专业？编程是不是真的穷途末路？普通人如何在这场大洗牌中保住饭碗？「纯写代码」的工作，即将第一个消亡访谈中，主持人问了一个所有人都无比焦虑的问题：如果我今天 25 岁，想在未来十年实现财富上的成功，我应该去学什么？编程还有用吗？什么行业还有红利？Dario 的回答很残酷。他直言不讳地说：「我认为，Coding 会最先消失，或者说，最先被 AI 模型完全取代。」在过去二十年里，「转码」几乎是普通人跨越阶层的最快捷径。无数年轻人涌入 CS 专业，只为在大厂谋得一份高薪的「码农」工作。但 Dario 无情地指出，纯粹的敲代码时代，正在终结！在 Anthropic 内部，Claude Code 已经在指数级进化。但是，请注意，Dario 并没有判软件行业的死刑。他提出了一个极其关键的区分：Coding（编码） ≠ Software Engineering（软件工程）。写出具体的代码行会被 AI 代劳，但「软件工程」—— 即作为一个架构师，去思考如何设计一个系统、如何满足用户的真实需求、如何管理由多个 AI 代理组成的团队 —— 这项工作会存在更长时间。「这是一种极其强大的『比较优势』。」Dario 解释道。Dario 给出了一个极具颠覆性的数学公式：5% + 95% = 20 倍生产力。人类的比较优势并没有消失，只是发生了剧烈转移。在未来的工作流中，AI 将承担 95% 的执行工作。而人类，只需死死守住那最核心的 5%。这 5% 是什么？是判断力。是品味。是「知道我们要去哪儿」。这意味着，你的生产力将被放大 20 倍！未来不需要一屋子的初级程序员，只需要一个懂业务、懂人性的「超级个体」，带着一群不知疲倦的 AI，就能干翻一个传统的百人团队。AI 海啸已至，为什么大多数人还在装睡？Dario 在访谈中用了一个比喻：海啸。令我惊讶的是，目前的 AI 模型已经如此接近人类智能的水平，但整个社会似乎完全没有意识到即将发生什么。这就像一场海啸向我们袭来，它已经在海平线上清晰可见，近在咫尺，但人们却在疯狂地寻找借口，安慰自己说：『那不是海啸，那只是光影的折射。』为什么 Dario 对 AI 的进化如此笃定？因为他是最早发现并笃信「Scaling Law」的人之一。对于 Scaling Law，Dario 用了一个极具画面感的比喻：就像一场化学反应。如果你想生火，你需要不同的配料。如果你把「数据」和「算力」按照正确的比例放入「模型规模」的反应炉中，这场化学反应的最终产物，就是「智能」 。这不是玄学，而是残酷的物理和数学规律。只要算力和数据继续增加，AI 就会变得越来越聪明。5 年前，电脑连一张像样的猫咪图片都画不出来；而今天，你可以给 Claude 发一段猴子杂耍的视频，问它「球在猴子手里换了多少次」，它能精准地回答你。这就是 Dario 感到的「急迫感」。人们总是习惯用线性的思维去预测未来，认为「这个改变太大了，不可能发生」，但技术正在以指数级的速度狂飙。当海啸来临时，如果你还站在海滩上捡贝壳，结局注定是毁灭。避风港在哪？未来十年，普通人只剩这两条退路既然「智力劳动」正在被 AI 疯狂吞噬，那么我们到底该学什么？我们的孩子该选什么专业？Dario 给出了一份「未来生存指南」。他认为，未来的护城河，深深地扎根于以下三个领域：第一条退路：极度「以人类为中心」的工作AI 可以写出完美的商业计划书，但 AI 无法在酒桌上和客户建立信任；AI 可以给出最精准的医疗诊断，但 AI 无法握住患者的手。Dario 提到了放射科医生的例子。曾经有人预测 AI 会淘汰放射科医生，因为 AI 看片子比人准多了。但现实是，放射科医生并没有失业，因为他们工作中最具技术含量的「看片子」被 AI 替代了，但他们现在把时间花在「与患者沟通、解释病情、安抚情绪」上。未来的高薪职业，将属于那些能够链接人、理解人、调动人的角色。情商、共情能力、以及建立复杂社会关系网络的能力，将成为最昂贵的稀缺品。第二条退路：深入「物理世界」无论 AI 在虚拟的数字世界里多么手眼通天，它目前依然很难在现实世界里帮你通马桶、拧螺丝。Dario 强烈建议，年轻人应该关注那些「物理世界」与「传统工程」交汇的领域，比如半导体制造、新能源基建、高端制造业。当软件世界被 AI 卷成红海时，物理世界的建设反而因为其「笨重」、「需要真实触感」而成为避风港。如果能把 AI 的分析能力与物理世界结合起来，你将天下无敌。核心底层能力：街头智慧与批判性思维在一个 AI 可以随时生成假视频、假图片、假新闻的世界里，什么能力最重要？Dario 认为，是批判性思维和街头智慧。「你不希望被假象蒙蔽，你不希望拥有错误的信念，你更不希望被诈骗。」在未来，分辨「真实与虚假」将成为生存的基本功。那些只会死记硬背、缺乏独立思考能力的人，将成为 AI 时代的第一批韭菜。财富密码：AI 之外，下一个万亿级风口在哪里？在这场长达数小时的访谈中，主持人向 Dario 抛出了非常刁钻的问题 ——「如果现在给你 100 块钱，只能买一支股票或者押注一个行业（除了你自己的 AI 赛道），你会买什么？」Dario 笑了。他没有推荐微软，也没有推荐英伟达。他给出了一个令人意外，但又在情理之中的答案：生物技术。不要忘了，在创立估值 400 亿美金（IT之家注：现汇率约合 2,673.5 亿元人民币）的 AI 帝国之前，Dario 原本是一个顶尖的物理学和生物物理学博士，曾在斯坦福医学院做博后。他最初搞 AI，就是因为觉得生物系统的蛋白质结构太复杂了，人类脑容量不够，需要发明 AI 来帮他治病。Dario 断言：「生物技术即将迎来一场由 AI 驱动的文艺复兴。我们即将治愈大量令人绝望的疾病。」他特别指出了一个细分赛道：多肽疗法和基于细胞的疗法（如 CAR-T）。为什么？因为传统的化学小分子药物，设计起来就像碰运气；而多肽和 mRNA 等新一代生物技术，具有「可编程」的特性。它们就像是生物界的计算机代码，可以通过 AI 进行数字化计算和连续优化。当 AI 的算力与「可编程的生物学」相撞，人类在对抗癌症、衰老和绝症的战役中，将迎来重大突破。如果你在寻找长期的投资风口，或者孩子正在犹豫要不要读生物医学，Dario 的这个判断，值得参考。停止做「套壳应用」，去学「弹钢琴」随着 AI 接管越来越多的认知工作，很多人恐惧：人类是不是正在把自己的大脑「外包」出去？我们会不会像《机器人总动员》里那样，变成连算数都不会的傻子？Dario 坦言：如果我们粗心大意地使用 AI，人类确实会变笨。他们研究发现，如果学生只是让 AI 帮忙写作业、或者程序员只是盲复制 AI 的代码，他们的技能确实在退化。但是，选择权在人类自己手里。就像计算器发明后，人类并没有丧失数学能力，反而利用计算器算出了登月轨道的参数。Dario 自己现在依然经常在脑子里做心算，因为「这能让数学与我的思维过程深度融合」。AI 永远比你聪明，但不代表你不需要学习。学习的过程，是重塑你大脑神经元的过程。对于想要在 AI 时代创业或做超级个体的普通人，Dario 给出了以下建议 ——1.绝对不要做「套壳产品」。如果你只是简单地调一下 Claude 或 ChatGPT 的 API，做个漂亮的 UI 界面，加点提示词就拿去卖钱。Dario 警告：「这种东西毫无护城河可言，任何人都能吞噬你的收入，不用等 AI 巨头出手，你自己就会先死掉。」2.建立极深的垂直壁垒。Anthropic 绝不会去碰那些高度专业化的垂直领域，比如生物医药跨界 AI、高度监管的金融服务业等。巨头看不上、或者懒得干的脏活累活和垂直 Know-how，就是普通创业者的生存土壤。3.把「提示词工程」当成弹钢琴来练。很多人抱怨 AI 不好用，是因为他们根本不会用。Dario 引用了一句名言：「写提示词就像弹钢琴。你不能指望一坐到琴凳上，就能弹出贝多芬。」为了让非技术人员也能用好 AI，Anthropic 开发了无需写代码的 Claude Co-work。但无论工具多简单，你都需要去花时间「实操」。我们需要去试错，去给 AI 设定上下文，去建立 AI 智能体机制。谁先学会掌握这台「蒸汽机」，谁就能在大洗牌中拿到头等舱的船票。第一性原理，是你预见未来的唯一武器在这场深度访谈的最后，Dario 说了这样一段话：在过去 10 年里，我反复经历这样一种体验：当你根据简单的曲线外推，或者用简单的逻辑去推演未来时，你会得出一些反直觉的结论。很多人会说：『那太疯狂了，不可能发生。』但最终，它真的发生了。你几乎可以『免费』地预测未来，只需要几个经验观察，加上第一性原理的思考。」AI 时代的第一性原理，就是智力成本将无限趋近于零。任何可以被逻辑化、数据化、重复化的脑力劳动，都将一文不值。人类能做的，就是去理解人心，去连接物理世界，去掌控 AI，去做那 5% 能掌舵的人。参考 &nbsp;SG &nbsp;跳过导航搜索创建头像图片 Subtitle ToggleOFF The AI Tsunami is Here &amp; Society Isn't Ready | Dario Amodei x Nikhil Kamath | People by WTFShould You Learn Coding Now? Anthropic CEO Explainshttps://www.hindustantimes.com/ai/anthropic-ceo-dario-amodei-s-ai-era-advice-for-young-indians-on-nikhil-kamath-s-podcast-101772003729249.html", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/708.htm", "publishedAt": "2026-10-27T22:30:30+00:00"}, {"title": "Meta AI 负责人罗希特 · 帕特尔离职创业，打造微软 Office 替代方案 Ndoc", "summary": "IT之家 10 月 27 日消息，据科技媒体 TechCrunch 今天报道，Meta 人工智能负责人罗希特 · 帕特尔（Rohit Patel）已经离开公司，他曾在 Meta 从事 AI 研发工作八年，并担任 Meta 超级智能实验室负责人。据报道，帕特尔已创立 Ndoc 公司，他将开发一款原生 AI 办公软件，旨在取代微软 Office 和谷歌 Workspace。这名前 Meta 研究员希望，Ndoc 不能只是叠加在现有工作流的 AI 工具，而是要改变人们使用各种工具的碎片化现状。例如大家经常要来回切换 Excel、Word、PowerPoint 和 Tableau 等软件，还要不断把内容复制粘贴到 ChatGPT 中。Ndoc 的目标是将上述所有工作流整合到统一空间之中，让所有人都能轻松办公。据悉，Ndoc 在同一界面中整合了三个主要模块。「Stage」用于展示关键内容，如幻灯片、仪表盘、模拟结果和迷你应用；「Narrative」用于呈现分析内容、带编号的引用、生成图表，以及解释数据背后原因；「Model」则用于存放底层数据集和 Python 脚本。在实际使用中，用户可以上传数据集让 Ndoc 分析，并根据结果撰写说明性文本。这款软件更远大的目标是“重新定义文件”，其文档可导出为独立的“.ndoc.html”文件，然后在所有浏览器打开。帕特尔希望将这种格式开源，让其他开发者也能使用。帕特尔是近期离开 Meta 的众多高管和研究员之一。此前，Meta 全球事务负责人乔尔 · 卡普兰（Joel Kaplan）、AI 研究员安德鲁 · 塔洛克（IT之家注：Andrew Tulloch），以及负责工作场景 AI 产品的负责人艾米莉 · 道尔顿 · 史密斯（Emily Dalton Smith）均已离职。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/696.htm", "publishedAt": "2026-10-27T15:27:53+00:00"}, {"title": "TypeSafe AI发布Jev：一种只返回类型化概率而非文本的决策模型", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/3o7gwgKJt2SbH8AhdpkU?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-27T15:22:00+00:00"}, {"title": "Anthropic 确认其内部系统遭访问：客户对话、模型权重未受影响", "summary": "IT之家 10 月 27 日消息，据《华盛顿邮报》当地时间 10 月 26 日报道，网络安全初创公司 Cathedral 称，其研究人员利用 AI 智能体在不到 12 小时内通过第三方商业软件的漏洞，找到进入 Anthropic 内部系统的路径。Anthropic 随后确认，部分销售、人力资源和 IT 系统遭到访问，但客户与 Claude 的对话、模型回复、源代码及模型权重均未受到影响。Cathedral 由美国政府效率部（DOGE）前成员创办。根据该公司一份尚未正式发布的报告草稿，研究人员在 Anthropic 的外部安全研究计划下开展测试，利用企业销售和行政管理软件中的漏洞，接触到会议记录、员工薪资与录用信息，以及讨论先进 AI 模型的 Slack 消息等内部信息。Anthropic 表示，研究人员访问的是范围有限的销售、人力资源和 IT 系统。公司称，自身监控系统在 Cathedral 提交报告前，就已发现部分相关活动，并在当天关闭了研究人员的访问权限。Anthropic 还表示，公司已停用受影响的第三方软件，直至相关供应商确认漏洞得到修复，并向美国联邦政府相关部门通报情况。该公司称，目前没有证据表明 Cathedral 以外的人员利用了这些漏洞（IT之家注：相关软件供应商的名称及具体漏洞细节尚未公开）。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/683.htm", "publishedAt": "2026-10-27T14:25:46+00:00"}, {"title": "跑分之外：为什么 Sonnet 5.5 写代码比 Kimi K3.1 和 GPT-6.1 更好用", "summary": "这几天我的日常开发基本都交给了 Claude Code 里的 Sonnet 5.5：修 bug、加接口、改前端页面、跨文件重构，都是真实项目里的活。用下来最大的感受就一个字：强。 又快又好：响应快，写出来的代码基本一次能用，很少需要返工； 从不掉链子：任务交出去，它能自己一路做完，没遇到过做到一半停住、原地绕圈的情况； 非常抗...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503252", "publishedAt": "2026-10-27T11:42:45+00:00"}, {"title": "OpenAI 和 Anthropic 将大模型价格砍了八成，这门生意到底怎么算的？", "summary": "从六月 GPT-5.6 系列发布到现在，OpenAI 和 Anthropic 的主流模型价格塌了一大截，最多砍掉 80%。Max Woolf 把这场价格战的时间线全捋了一遍，结论有点反直觉：这不像烧钱抢市场的套路。 先看数字怎么掉的。GPT-5.6 Sol 卖 $5/$30/$0.50（输入/输出/缓存读取，每百万 token），Luna 是 $1/$6/$0.10。后来 Luna 直接砍 80...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503251/cheap-llms", "publishedAt": "2026-10-27T11:41:06+00:00"}, {"title": "Cloudflare 披露 KV cache 暴露事故，全部发生在超长上下文的 prompt 上", "summary": "Cloudflare 昨天公开了一起租户隔离事故：8 月 27 日到 9 月 9 日期间，Workers AI 平台上的 GLM-5.3 模型（@cf/zai-org/glm-5.3）会把其他客户的请求数据混进响应里，总共 155 次，全部发生在超长上下文的 prompt 上。9 月 8 日安全研究员 Gadi Evron（Knostic 公司）通过 HackerOne 报告了这个跨请求 KV cache 暴露问题...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503242/cloudflare-glm-kv-cache-exposure-remediation", "publishedAt": "2026-10-27T07:51:31+00:00"}, {"title": "openKylin走进山东大学 共探开源贡献与实践", "summary": "10月23日，开源中国“AI新生派”走进高校活动山东大学软件学院站举行。openKylin 社区作为共建方参与活动，围绕操作系统技术发展、AI 应用探索和开源贡献实践，与高校师生展开交流，帮助同学们了解国产开源操作系统，找到参与社区建设的切入点。 本次活动由开源中国联合学新社主办，openKylin共同参与建设，以“走进开源...", "sourceName": "开源中国", "sourceUrl": "https://www.oschin 件简介 DatI (Data Intelligence) 是连接 AI Agent 与企业数据库的轻量级语义网关。用户仅需接入数据库、配置业务语义、按需启用预置工具与参数化 SQL 工具，即可快速发布基于 Streamable HTTP 的 MCP（Model Context Protocol）服务，灵活接入各类 AI Agent 或任意 MCP Host（如 OpenCode、WorkBuddy 等）。 ┌──...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503165", "publishedAt": "2026-10-23T01:35:42+00:00"}]}, {"label": "产品发布/更新", "items": [{"title": "菲尔兹奖得主博尔彻兹取消计分家庭作业：AI 作弊泛滥，仅线下考试可行", "summary": "IT之家 10 月 28 日消息，加州大学伯克利分校（UC Berkeley）一名教授宣布，不再给学生布置计分家庭作业，原因是人工智能（AI）的滥用让这类作业失去了意义。据《纽约邮报》（New York Post）10 月 26 日报道，知名数学家、菲尔兹奖得主理查德 · 博尔彻兹（Richard Borcherds）表示，如今几乎无法分辨学生提交的作业究竟是自己完成的，还是借助人工智能生成的。因此，他现在主要通过不允许使用电子设备的线下考试来评估学生的学习情况。IT之家注意到，博尔彻兹在接受该媒体采访时表示：“如今，在线考试已经是在浪费时间，因为有些学生会直接使用 AI 回答问题。我无法判断哪些学生使用了 AI，但我注意到，在线考试的平均分数大幅提高。”他还指出：“按照答案是否正确来评分，会给学生使用 AI 完成家庭作业、而不是亲自解题提供巨大的动力，同时还会惩罚那些诚实完成作业的学生。花费时间和金钱为 AI 生成的答案评分，也是一种浪费。”对于这一问题，加州大学伯克利分校此前已经考虑过使用 AI 检测软件，但最终认为这类工具的可靠性不足。因此，校方决定将 AI 使用政策的制定权交给教授，只要求他们在课程大纲中明确说明相关规定。至于博尔彻兹，他表示，如果 AI 最糟糕的影响只是增加教师批改学生作业的难度，那他就“非常放心了”。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/752.htm", "publishedAt": "2026-10-28T01:49:17+00:00"}, {"title": "英伟达发布 621.12 Game Ready 热修复驱动，解决视频播放冻结 / 黑屏问题", "summary": "IT之家 10 月 28 日消息，NVIDIA（英伟达）当地时间 21 日发布适用于 GeForce 显卡和 RTX Spark 设备的 621.12 Game Ready 热修复驱动程序，解决了多项问题：在某些 GeForce RTX 50 系列显卡 / RTX Spark 上，更新至 Game Ready 621.01 后视频播放可能出现卡顿或黑屏的问题；当光线追踪照射模式设置为“击中照射”时，虚幻引擎 5.8 可能会崩溃；RTX Spark 设备通过 StarTech Thunderbolt 3 转 HDMI 2.0 适配器连接的 HDMI 显示器可能会出现画面异常；RTX Spark 设备微星尊爵 Prestige N16 Flip 可能会出现间歇性闪烁。参考https://nvidia.custhelp.com/app/answers/detail/a_id/5938", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/749.htm", "publishedAt": "2026-10-28T01:43:14+00:00"}, {"title": "Oracle 打造多样化 AI 算力组合，引入 SambaNova SN50 RDU", "summary": "IT之家 10 月 28 日消息，SambaNova 当地时间 10 月 27 日宣布与 Oracle（甲骨文）达成合作，前者的 AI 推理芯片 SN50 RDU 将加入 OCI 云服务。IT之家注意到，Oracle 正建立一个多样化的 AI 算力组合：在 NVIDIA、AMD 的芯片外，该企业已实现 Positron 的 Atlas 芯片的正式上线，也将成为首家提供 Google TPU 的外部超大规模企业，还将导入 Cerebras 的晶圆级芯片，而英特尔的至强 \"Diamond Rapids\" 处理器也将支持未来的 OCI X14 产品线。相关阅读：《甲骨文扩大与英伟达的芯片供应合作，同时引入谷歌 TPU 和 Cerebras 芯片》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/744.htm", "publishedAt": "2026-10-28T01:25:34+00:00"}, {"title": "弃用 AI 改称 SI：特斯拉车主手册更新 FSD 计算机名称", "summary": "IT之家 10 月 28 日消息，特斯拉的 FSD 计算机将启用新名称。特斯拉官方车主手册已在多个位置将“FSD Computer”替换为“SI Computer”，涉及 Model 3、Model Y 和 Cybertruck 的相关手册。这似乎是特斯拉正式调整车载计算机命名方式的前兆。按照新的命名规则，HW2.0、HW2.5、HW3 和 AI4 可能分别更名为 SI2.0、SI2.5、SI3 和 SI4。车主手册已经发生变化目前，Model Y 车主手册中的 FSD 相关章节已改为：“Model Y 配备的 SI Computer 旨在利用这些输入信息，快速处理神经网络数据，并做出决策，引导你抵达目的地。”空调控制章节也采用了新名称。手册指出，相关功能“不支持配备 SI Computer 2.0 或 2.5 的车辆”。手册还指导车主：“点击‘控制’（Controls）&gt;‘软件’（Software），查看‘SI Computer’，即可确认车辆配备的计算机型号。”此前，这一选项被称为“AI Computer”。尽管这一名称可能尚未出现在车辆中，但手册的更新暗示，特斯拉可能很快就会通过软件更新，在车辆中控屏幕上启用新的名称。特斯拉为何弃用“AI”？IT之家注意到，此次调整与埃隆 · 马斯克（Elon Musk）本月早些时候将 SpaceXAI 更名为 SpaceXSI 的举动一致。SpaceXSI 是 SpaceX Super Intelligence（SpaceX 超级智能）的缩写。此后，Tesla AI 也被调整为 Tesla Super Intelligence，即 Tesla SI。这一变化发生在美国总统唐纳德 · 特朗普（Donald Trump）签署一项行政命令之后。该命令要求行政部门机构在官方材料中使用“Super Intelligence”和“SI”，取代“Artificial Intelligence”和“AI”。尽管马斯克与特朗普此前的关系一度颇为紧张，但从这一系列命名调整来看，马斯克似乎正在跟随美国政府的做法。这并非特斯拉首次调整硬件名称。此前，特斯拉已将 HW4 更名为 AI4，以更好地体现该硬件针对人工智能任务进行优化的定位。HW3 则保留了原有名称，因为其最初并非围绕 AI 任务进行设计。特斯拉已经确认，HW3 无法支持无监督自动驾驶，并计划为搭载 HW3 的车辆提供硬件升级方案，使其能够兼容无监督 FSD。特斯拉副总裁阿肖克 · 埃卢斯瓦米（Ashok Elluswamy）近期表示，特斯拉可能会在 2027 年第二季度开始推出无监督 FSD，并允许车主加入 Robotaxi 无人驾驶出租车网络。下一代 AI5 芯片也可能更名为 SI5新的命名方式还可能应用于未来的硬件产品。特斯拉下一代 AI5 芯片目前已在三星位于美国得克萨斯州的工厂进入试产阶段。按照新的命名规则，该芯片未来上市时可能改称 SI5，后续芯片则可能依次命名为 SI6 等。截至目前，特斯拉尚未正式宣布这项更名计划。不过，如果车主手册的变化能够说明问题，那么在即将推出的软件更新中，车辆中控屏幕上就可能开始出现 SI Computer 这一新名称。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/738.htm", "publishedAt": "2026-10-28T01:10:37+00:00"}, {"title": "苹果 M6 iMac 细节：2.5Gb 网口藏进电源适配器，标准版选配需加价 200 元", "summary": "IT之家 10 月 28 日消息，苹果昨日（10 月 27 日）推出搭载 M6 芯片的新款 24 英寸 iMac，起售价为 12,499 元。其中一个值得关注的变化，就是将 2.5Gb 以太网端口作为可选配置提供。与以往将网口集成在机身不同，新款 iMac 的以太网端口被整合进配套电源适配器中，用户在购买时选择该选项后，即可通过电源线同时完成供电与有线网络连接。IT之家查询苹果中国官网，在标准款 M6 iMac（2 个雷雳端口、10 核中央处理器、10 核图形处理器、双 16 核神经网络引擎）上，默认没有配备 2.5Gb 以太网端口选项，用户可以额外支付 200 元选配。不过更高配置的 12 核 CPU、12 核 GPU 机型则已标配 2.5Gb 以太网，无需额外付费，该产品起售价为 13,999 元。科技媒体 MacRumors 指出，对于普通用户而言，是否值得加价取决于使用环境。若家中或办公室已部署千兆以上网络、需要稳定低延迟连接，或经常进行大容量数据传输，内置 2.5Gb 网口会更为方便。相关阅读：《苹果为 24 英寸 iMac 推出 M6 芯片版本，国行 12499 元起》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/018/730.htm", "publishedAt": "2026-10-28T00:30:36+00:00"}, {"title": "拾趣 (Magpie) v0.1.18 发布，智能信息提取，更美观的 UI", "summary": "拾趣 (Magpie) v0.1.18 发布，智能信息提取，更美观的 UI 拾趣 (Magpie)是一款跨平台沉浸式自定义AI 划词工具 划选或双击，浮动条随即弹出：翻译、解释、总结实时呈现；复制、搜索、写入 Obsidian、预填日历，结果直接落地。图片、视频与扫描文档中的文字，框选亦可识别——处理在原地完成，无需迁入对话窗口。 Release ...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503249", "publishedAt": "2026-10-27T10:02:15+00:00"}, {"title": "deepin 在第六届 RISC-V 中国峰会展示 RISC-V 桌面生态“最后一公里”进展", "summary": "第六届 RISC-V 中国峰会在深圳盛大举行。在本届峰会上，deepin（深度）社区披露了其 RISC-V 桌面生态的最新进展：从主线镜像、应用商店到本地 AI 助手，deepin 正在全力打通 RISC-V 从芯片、开发板到桌面用户之间的“最后一公里”。 这几年，RISC-V 芯片越造越猛：端侧 AI 算力飙到 60 TOPS，服务器级直接上到 46 核。但...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503247", "publishedAt": "2026-10-27T09:20:58+00:00"}, {"title": "中国版Muse能管事！我把宠物保单、双11算价和周末旅行全交给了灵光2.0", "summary": "我想要的 Personal Agent，是让生活闪现「灵光」#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1686050?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-10-27T05:02:30+00:00"}, {"title": "钛动科技发布行业首个Pro-Agent, Navos Pro定义结果导向的AI for Work | TGC 2026科技增长大会", "summary": "10 月 23 日，以 “ AI is Profitable ” 为主题的 2026 TGC 科技增长大会于广州召开。", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/10/505580.html", "publishedAt": "2026-10-27T03:23:55+00:00"}, {"title": "中科慧灵完成数亿元A++轮融资：制鞋机器人订单超 4 亿元，具身智能开始拼量产交付", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/2svt5BbWUOHbADdo0UZo?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-10-2     .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
