const DATA = {"date": "2026-11-08", "generatedAt": "2026-11-08T02:00:09Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "埃森哲报告被曝存在虚假引用案例，公司否认系 AI 幻觉所致", "summary": "IT之家 11 月 8 日消息，埃森哲（Accenture）被指发布了一份充斥人工智能“幻觉”的研究报告，其中不仅包含大量虚假信息，还出现了多处疑似捏造的研究案例。据 GPTZero 最新分析，这家咨询巨头发布的一份报告涉嫌包含 15 条虚假引用，以及完全虚构的案例研究，因此正受到外界审查。这份名为《跨越式发展》（Leapfrogging Development）的报告由埃森哲与马德里 IE 大学的研究人员合作发布，旨在探讨人工智能如何提高非洲农业产业的生产力。埃森哲否认相关错误是由人工智能造成的。不过，这一事件仍可能令埃森哲陷入尴尬境地。此前，该公司管理层曾威胁称，不愿使用人工智能的员工可能面临解雇。埃森哲首席执行官朱莉 · 斯威特（Julie Sweet）去年曾警告称，作为公司人工智能转型工作的一部分，未能使用这项技术的顾问将被公司“淘汰”。GPTZero 的报告凸显了咨询行业日益广泛使用人工智能所引发的担忧。其中一个风险在于，人工智能“幻觉”可能通过聊天机器人回答和摘要传播虚假信息，进而“污染信息源”。GPTZero 表示：“该公司认为，虚构引用对研究人员、学者、顾问、学生，以及任何通过互联网搜索信息的人而言，都是迫在眉睫的现实威胁。”这并非咨询行业首次出现类似事件。此前，德勤、安永、毕马威和普华永道等大型咨询公司也曾被指在报告中出现人工智能错误。与此同时，全球一些规模最大、收费最高的律师事务所，也已承认在重要法律文件中出现过人工智能生成的错误。英国大型律师事务所之一 Pinsent Masons 此前承认，其提交给英国高等法院的法律文件中包含人工智能“幻觉”内容。另一家律师事务所 Sullivan &amp; Cromwell 的律师收费最高可达每小时 3,000 美元（IT之家注：现汇率约合 20,058 元人民币），该公司也于今年早些时候承认，提交给纽约一家法院的文件中存在人工智能错误。埃森哲是众多积极推动员工使用人工智能的专业服务公司之一。不过，由于员工使用需求过于旺盛，该公司上个月被迫对人工智能工具的使用设置新的限制。此前，部分员工使用 Claude 等工具产生的月度账单超过 1,000 美元（现汇率约合 6,686 元人民币）。埃森哲一名发言人对 GPTZero 的研究结果提出异议，称：“我们的审查表明，报告中发现的错误源于人为失误。没有证据支持这些错误是由人工智能幻觉造成的这一结论。我们正在修正这份报告，并将在重新发布前完成相关工作。我们始终欢迎借此机会进一步提升报告质量。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/845.htm", "publishedAt": "2026-11-07T23:51:36+00:00"}, {"title": "《塞尔达传说：时之笛》重制版刚发售，就已可在越狱版 PS5 和 iPhone 上运行", "summary": "IT之家 11 月 8 日消息，任天堂《塞尔达传说：时之笛》重制版于 11 月 5 日登陆了 Switch 2，但游戏发售后没过多久，就已经有人成功让其在越狱版 PlayStation 5 和 iPhone 上运行。在 PS5 方面，开发者 Vampinity 在 GitHub 上的 EglantinePS5 项目仓库中公布了测试结果。EglantinePS5 是一款移植到 PS5 平台的 Switch 模拟器，基于 Eden 模拟器开发。IT之家注意到，测试显示，在 PS5 12.40 版系统固件上，游戏已经能够读取存档，玩家操控林克（Link）走出自己的房子，进入科奇里森林（Kokiri Forest），运行帧率约为 15 至 20 FPS。不过，游戏运行几分钟后就会因内存不足而崩溃。与此同时，森林场景还存在严重的白色雾效问题，部分场景模型也无法正常显示。Vampinity 直言，目前的版本“距离能够正常游玩还差得很远”，并表示相关补丁是由 Claude 编写的。据悉，此次移植的大量着色器相关工作借鉴了 Lichii 模拟器的分支代码。此前，Lichii 已在游戏发售当天通过 Switch 2 模拟器成功让这款重制版在 PC 上运行。iPhone 方面，开发者乔 · 蒋（Joe Jiang）展示了《时之笛》重制版在 iPhone 17 Pro Max 上运行的画面，游戏中的科奇里森林场景已经能够正常显示。乔 · 蒋表示，移植过程中最棘手的问题是内存限制。游戏运行大约需要 9 GB 内存，而 iOS 对单个应用的内存使用上限为 8192 MB（8 GB）。他声称，自己采用的方案能够在保证画面质量的同时，将场景加载时的内存峰值控制在仅 3.4 GB。据介绍，这种技术方案并非专门针对《时之笛》重制版开发。乔 · 蒋表示，其有望让任天堂 Switch 和 Switch 2 游戏运行在 iOS、iPadOS、Apple TV、Android 以及鸿蒙操作系统（HarmonyOS）设备上。目前，乔 · 蒋尚未公开发布这一方案。不过，这也不是第一款成功在 iPhone 上启动的 Switch 2 游戏。此前，任天堂 Switch 2 越狱方案首次公开后不久，《马力欧卡丁车世界》（Mario Kart World）就已经成功在 iPhone 上启动。至于 PS5 版本，则需要使用 Relapse 越狱方案，该方案支持 PS5 7.00 至 13.60 版系统固件。当然，无论是 iPhone 还是 PS5，目前都还无法提供真正实用的游戏体验。不过，任天堂恐怕不会乐于看到这款重制版在发售后如此迅速地突破平台限制。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/841.htm", "publishedAt": "2026-11-07T23:36:39+00:00"}, {"title": "Claude Max 订阅套餐使用额度被指“虚标”，Anthropic 辩词未获法官采纳", "summary": "IT之家 11 月 7 日消息，美国联邦治安法官谢文辉（Alex Tse）裁定，Anthropic 必须继续应对 Claude Max 套餐使用额度涉嫌误导消费者的主要指控。据 Courthouse News 报道，谢文辉周五驳回了案件中的其他几项诉求。Anthropic 宣传称，月费 100 美元（IT之家注：现汇率约合 668.6 元人民币）和 200 美元（现汇率约合 1,337 元人民币）的 Max 套餐，使用额度分别是 Pro 套餐的 5 倍和 20 倍。但今年 6 月提起诉讼的消费者指控，如果按整周计算，实际额度远远达不到宣传中的倍数。两名原告卡尔 · 卡恩和所罗门 · 史密斯计算发现，以 Claude 的一款模型为例，200 美元（现汇率约合 1,337 元人民币）套餐的每周额度只有 Pro 套餐的 6 倍，100 美元（现汇率约合 668.6 元人民币）套餐则为 3.5 倍。问题出在额度计算方式上。Max 用户每 5 小时的使用额度确实可以达到 Pro 用户的 5 倍或 20 倍，但每周的使用上限并没有同比例增加。Anthropic 辩称，消费者应该明白，宣传中的倍数指的是单次使用周期的额度，并援引帮助页面作为依据。谢文辉并未采纳这一说法。裁决书写道：“Anthropic 对单次使用周期的说明，需要从 claude.com 的主要销售页面点击两次链接才能看到。”谢文辉认为，既然消费者按月支付订阅费，就有理由认为 Anthropic 承诺的使用额度也是按月计算。因此，原告可以继续追究 Anthropic 涉嫌过失性虚假陈述和违约的责任。相关阅读：《美国消费者指控 Claude Max 订阅套餐额度“虚标”，拟对 Anthropic 发起集体诉讼》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/824.htm", "publishedAt": "2026-11-07T14:57:42+00:00"}, {"title": "马斯克再次表白中国，称赞中国汽车工业水平高", "summary": "IT之家 11 月 7 日消息，据 RT今日俄罗斯报道，当地时间 11 月 6 日，特斯拉 CEO 埃隆 · 马斯克接受投资者罗恩 · 巴伦采访时表示，他热爱中国，并高度评价中国汽车工业的竞争力。“中国令人惊叹。顺便说一句，我爱中国。去那里旅行令人深受鼓舞，”马斯克在采访中说。他同时指出，在上海生产的特斯拉 Model Y 是中国最畅销的电动汽车，但强调实现这一成绩“并不容易”。马斯克特别补充道：“中国汽车公司非常厉害 过那一刻，入账、通知、回写业务系统由规则链自动执行。 本次 v1.4.1 围绕流转留痕、IM 集成、开放集成、表单打印、安全合规五大方...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503364", "publishedAt": "2026-11-03T03:14:56+00:00"}, {"title": "Go 语言重构 Java 项目会提升了多少", "summary": "把Java项目ApiGo使用Go语言重构为ApiGoo，提升了哪些 背景: ApiGo 是一个gitee上开源的 SQL2API 平台——在线写 SQL，AI对话即可快速发布成 REST 接口。Java版是 Spring Boot 4 + Mybatis，实现MySQL/Oracle/SQLServer/达梦/ClickHouse 等十几种数据库的 JDBC 驱动全打进一个 fat jar。ApiGoo 现在用 Go(Gin + database/...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503342", "publishedAt": "2026-11-02T05:32:35+00:00"}, {"title": ":fire::fire: ApiGo 开源接口平台 Go 版本发布", "summary": "ApiGoo 是 ApiGo 的go语言版本，是一款在线接口开发和管理平台，多数据库插件化数据源框架、SQL2API 。支持 WorkBuddy、千问办公、Trea Work、豆包等 AI 办公平台 MCP 接入。支持接入（mysql、oracle、达梦、TiDB、DolphinDB、DuckDB ）等 SQL 或 NoSQL 数据源，在线可视化编写 SQL 快速发布接口，支持接口上下线、接口管...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503339", "publishedAt": "2026-11-02T02:58:36+00:00"}, {"title": "DeepSeek 团队把 Agent 设计成“操作系统”：多任务的上限不该是人的注意力", "summary": "DeepSeek Harness 团队发了一篇架构长文，讲他们怎么做出一个\"永远在线\"的 Agent。文章有一句话很精辟： 单任务的上限取决于模型能力，多任务的上限取决于人的注意力。 他们观察到，一个人通常只能同时跟进 3 到 5 个活跃 Session。因为现有 Agent 都以单个 Session 为单位，Session 之间彼此独立——你并行推进多项工作...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503338/deepseek-harness-super-agent", "publishedAt": "2026-11-02T02:39:53+00:00"}, {"title": "Postgres 19 迟到了，原因是 LLM 找出了太多老 bug", "summary": "PostgreSQL 19 要迟到了，大概率拖到 11 月才发。过去十年它的发布节奏准得像钟表——不早于 9 月中，不晚于 10 月中——今年破了例。 更反常的是今年在测试阶段后期，一些相当重要的功能被撤销：UPDATE/DELETE FOR PORTION OF、SQL Property Graph Queries（SQL/PGQ）、ALTER TABLE … MERGE/SPLIT PARTITION，全部在 ...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503336/postgres-19-is-late-and-its-ais-fault", "publishedAt": "2026-11-02T02:28:14+00:00"}]}, {"label": "产品发布/更新", "items": [{"title": "Backglow 应用上线：可让新款 MacBook Pro 发光苹果 Logo 随音乐律动", "summary": "IT之家 11 月 8 日消息，由设计师胡安 · 布伊斯（Juan Buis）开发的一款名为“Backglow”的新应用，允许用户自定义新款 MacBook Pro 笔记本电脑顶盖上的发光苹果 Logo。该应用的免费版本允许用户手动调节苹果 Logo 的亮度，而且不受 MacBook Pro 屏幕亮度设置的影响。用户也可以一键彻底关闭 Logo 灯光，无需通过终端（Terminal）执行命令。免费版本还提供一种名为“Breathe”的呼吸模式，可以让苹果 Logo 的灯光缓慢、柔和地明暗交替，效果类似于老款 MacBook 上的睡眠指示灯。用户只需一次性付费即可解锁应用的 Pro 版本，限时售价 9 美元（IT之家注：现汇率约合 60.2 元人民币），之后将涨至 15 美元（现汇率约合 100.3 元人民币）。Pro 版本额外提供两种灯光模式：“Music”模式可以让苹果 Logo 的灯光跟随 Mac 上播放的音乐节奏变化；“Agents”模式则会在 Claude Code 执行任务时让 Logo 灯光持续闪烁式呼吸，当需要用户介入时则通过闪烁发出提醒。苹果从 2015 年开始逐步取消 MacBook 上的发光 Logo 设计，不过在新款 14 英寸和 16 英寸 MacBook Pro 上，苹果重新引入了这一设计，两款机型均配备触控 PROLED XDR 显示屏。在老款 MacBook 上，苹果 Logo 的光线来自屏幕背光。但 OLED 显示屏本身没有背光，因此苹果需要采用全新的技术方案。《Daring Fireball》作者约翰 · 格鲁伯（John Gruber）透露，苹果专门设计了一种定制光源，让 Logo 重新发光，同时不会增加笔记本电脑顶盖的厚度。至于苹果为何要重新采用这一设计，他听到一位苹果代表给出的回答是：“因为它很酷。”苹果在官方支持文档中表示，默认情况下，只要 Mac 处于唤醒状态，Logo 就会亮起。电脑会根据屏幕亮度以及环境光传感器检测到的周围光线条件，自动调节 Logo 的亮度。布伊斯表示，苹果 Logo 使用的是白色 LED 灯，不支持切换颜色。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/839.htm", "publishedAt": "2026-11-07T23:25:12+00:00"}, {"title": "GitHub 推出新 Git 存储架构：内部测试单个代码仓库支持 5000 个智能体同时协作，每秒处理 7200 次推送", "summary": "IT之家 11 月 7 日消息，当地时间 11 月 5 日，GitHub 发布博文，称上周在 GitHub Universe 大会上，正式公布了全新的 Git 存储架构，代号“Rubicon”。官方表示，该架构不仅具备每秒处理数千次写入的能力，还能实现读取按需水平扩展。经内部压力测试验证，新架构能够在保持极低读取延迟的同时，支持单个代码仓库容纳 5000 个智能体（Agent）并发协作，并承受每秒高达 7200 次的代码推送。IT之家获悉，该架构目前已经开启小范围定向内测（limited private preview），并计划于明年初逐步扩大开放范围。据介绍，如今 GitHub 上最繁忙的代码仓库，其单秒写入峰值最多也不过数十次，且往往呈现短暂脉冲式的突发状态。然而，随着越来越多的研发工作交由全天候高并发运行的 AI 智能体处理，预计在未来一年内，这种瞬时突发将演变为常态化的持续高吞吐负载。每一次代码推送（Push）都会级联触发更多的读取请求：CI 流水线即刻启动、部署系统拉取最新提交，其他协同智能体也会同步获取代码作为上下文。这种读操作的扇出扩散（Read Fan-out），随着写入频率的攀升，对平台整体流量产生了极为显著的放大效应。在流量分布曲线最顶端的头部仓库中，这一趋势已然显现。下方图表展示了 GitHub 上某个典型代码仓库在 3 月至 5 月期间的日请求量变化 —— 短短两个月内，其流量便激增了约 4 倍；此后至今，其访问增长更始终维持着陡峭的指数级上升轨迹。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/823.htm", "publishedAt": "2026-11-07T14:57:23+00:00"}, {"title": "印度 IT 行业领袖警告：AI 或致应届毕业生更难进入科技行业", "summary": "IT之家 11 月 7 日消息，据日经亚洲 6 日报道，印度最大科技行业协会 —— 印度全国软件与服务公司协会会长拉杰什 · 南比亚尔警告，随着 AI 逐渐接手基础编程和软件测试工作，印度应届大学毕业生进入科技行业可能更加困难。南比亚尔认为，求职难的问题，可能要等到印度软件出口企业适应新的商业环境后才能缓解。随着技术基础设施管理等传统核心业务的工作量减少，企业需要开拓网络安全、AI 咨询、技术部署及维护等新业务，弥补由此造成的业务缺口。他进一步指出，软件企业的收费模式正从按项目投入人数计费转向按实际成果收费，应届毕业生的求职门槛也会随之改变。因此，高校需要调整计算机专业课程，否则印度可能出现数以千计的工科毕业生，所学技能却无法满足企业需求。“对刚毕业的学生来说，这确实是个令人担忧的问题，我不想粉饰这一点。如果我们的教育体系不能尽快跟上变化，学生可能一毕业就发现，自己学到的技能早就过时了。…… 课程体系从未像现在这样需要如此大幅度的改革。”官方估算显示，在截至今年 3 月的财年，印度共有 5903 所工程与技术类院校，入学人数接近 260 万人。由于科技行业薪资丰厚，许多人将科技岗位视为实现经济富裕的途径。但即使 AI 时代还处于起步阶段，印度也面临严峻的大学生就业问题。阿齐姆 · 普莱姆吉大学估计，2004 年至 2023 年，印度失业大学毕业生人数增加至原来的近 4 倍，达到约 1100 万人。IT之家从报道中获悉，南比亚尔认为，印度软件行业正经历一场“再平衡”，调整还会持续一段时间，直到 AI 业务增长足以弥补传统 IT 基础设施维护业务的收入损失。“这个过程中难免会时不时遇到阵痛，但只要跨过这个难关，几年后再回头看，我认为结果会非常非常好。”不过，随着整个行业向 AI 转型，部分企业仍可能面临生存压力。“整个行业能否生存下去，基本没有悬念，真正的问题在于各家企业。”南比亚尔相信，80% 至 85% 的企业能够继续生存，但一些企业或许会因为过于习惯过去的经营方式，难以顺利完成转型。“企业必须主动改革自身业务，否则就无法适应新时代。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/813.htm", "publishedAt": "2026-11-07T13:48:23+00:00"}, {"title": "微信鸿蒙版 App 获 8.0.23.36 邀测升级，灰度公众号文章 / 贴图中图片长按问小微等功能", "summary": "IT之家 11 月 7 日消息，据用户反馈，微信鸿蒙版 App 今晚在华为应用市场（App Gallery）发布了 8.0.23.36 (8394532) 版本邀测升级（需收到短信通知后点击链接跳转安装），测试时间为 2026/11/7-2026/12/7。和往常一样，本次更新的说明依旧为“修复了一些已知问题”。据博主 @伤心萨摩耶Ciuciu ，8.0.23 版本的微信新增了如下特性：部分 Flutter 跨端页面（如朋友圈、听一听、表情管理等页面）响应系统字体粗细；更换铃声选择界面右上角新增铃声设置入口，支持启用或停用个性化内容推荐；发表视频号内容时新增添加标注，视频号已发布的内容点击分享同步新增添加标注；发现 &gt; 直播 &gt; 更多直播新增搜索按钮；听一听主页面右下角新增小微分支入口浮动按钮，并根据当前页面内容弹出对应提示词，可快速使用听一听相关问小微功能，播放页面点击分享新增问小微（主页面右下角浮动按钮为逐步开放）；公众号图标焕新，对齐其他端；好友昵称、群昵称、备注、微信号、地区等信息支持长按复制；服务号信息流页面已关注的服务号发布的文章支持长按，选择不再关注或删除文章消息；聊天中的图片或视频点开右下角此聊天中的图片视频按钮样式更改（该条确认为 bug，已在 8.0.23.33 修复）；服务号信息流 &gt; 推荐的贴图长按新增转发；聊天工具新增问小微（逐步开放，需账号灰度到小微主体）；直播页面支持显示当前直播转发分享人数；听一听浮标样式焕新；在具有管理权限的群聊中查看群成员资料，进群方式中邀请该群员进群的群员昵称变更为蓝色可点击状态；支持展示其他端设置的朋友圈点赞彩蛋；视频号内容点击分享新增问小微（逐步开放，需账号灰度到小微主体）；服务号的通知提醒红字部分新增新通知的服务号名称提醒，由 [n 条消息] 变更为 [xxx 等 n 条消息]；群收款右上角新增导入，支持在发起群收款时导入账单、群接龙、历史群收款（逐步开放，支持 8.0.22 及以上版本）；公众号 / 服务号主页 &gt; 右上角… 新增更多信息，可查看公众号 / 服务号简介、关注时间、基础信息、名称记录、授权第三方服务等信息；小店与卡包 &gt; 右上角…&gt; 设置 &gt; 隐私设置新增小程序订单授权开关，开启后小程序订单信息将同步至「小店与卡包 &gt; 订单」（热更新）；开启群消息免打扰之后，群设置新增以下消息仍通知，可设置 @我、@所有人、群公告以及指定群成员的消息在群消息免打扰时仍通知（逐步开放）；设置＞消息通知＞新增消息提示音，可设置微信内置的 7 个提示音（逐步开放）；设置＞账号安全新增登录设备管理，可删除登录设备，删除后在对应设备登录需进行安全验证（逐步开放）；元宝＞体验更多支持跳转应用市场下载元宝 APP（热更新）；扫一扫融入小微分支，新增右上角翻转摄像头与底部拍照给 AI，支持识别、翻译、记住此刻、记住朋友（逐步开放，小微分支单独灰度，不依赖小微主体）；服务号＞个人中心新增赞、收藏和最近阅读，记录赞、收藏和最近阅读过的贴图号内容（三端同步新增功能，仅展示贴图号发布的贴图，不展示公众号发布的贴图，8.0.23.33 或 34 版本新增）；部分视频号视频支持展示右下角小微分支悬浮提问快捷入口（热更新，仅部分视频支持显示，不展示小微分支悬浮提问的视频则展示原有悬浮搜索入口，该功能不依赖小微主体）；发表朋友圈时新增小微分支 AI 帮写（逐步开放，不依赖小微主体）；听一听＞个人歌单新增歌单来源分类（微信音乐 / QQ 音乐 / 酷狗音乐），支持绑定 QQ 音乐 / 酷狗音乐账号并同步对应平台收藏歌曲（我喜欢）至听一听（逐步开放，前置条件需灰度到音乐空间，前置条件详见 8.0.16 第 19 条，可通过已有音乐空间的朋友创建空间并邀请加入激活）；发现＞直播界面逻辑重构对齐，取消更多直播入口，搜索按钮移至一级界面，新增双 11、看剧、颜值、资讯等更多个性化或限时分类（逐步开放，部分分类类型不固定，因账号而异）；我＞小店与卡包新增小店金币 tab，可签到领取金币（逐步开放）；听一听＞个人歌单＞右上角🎧沉浸听歌新增时光电台（逐步开放，需灰度到小微主体）；公众号文章标题下新增 AI 摘要，滑动阅读时右下角新增 AI 摘要悬浮按钮，长按选择文字新增问 AI（需更新至 8.0.23.35 及以上版本）；扫码登录鸿蒙电脑微信时支持选择自动登录该设备（逐步开放，鸿蒙电脑需更新至 4.1.13 及以上版本）；公众号文章或贴图点击分享新增问小微（需灰度到小微主体并更新至 8.0.23.35 及以上版本）；聊天消息长按新增问小微（需灰度到小微主体并更新至 8.0.23.35 及以上版本）；聊天中的网页链接消息、文档类文件长按新增小微总结（需灰度到小微主体并更新至 8.0.23.35 及以上版本）；公众号文章或贴图中的图片长按新增问小微（需灰度到小微主体并更新至 8.0.23.35 及以上版本）；聊天中的图片点击查看大图新增 AI 处理，编辑图片时新增 AI 处理（逐步开放）；服务通知右上角新增通知设置，可设置消息免打扰和播放语音提醒开关（逐步开放）。大家在IT之家微信号回复“微信”两字，即可获取当前最新官方内部版微信下载。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/806.htm", "publishedAt": "2026-11-07T12:53:18+00:00"}, {"title": "抢跑DeepSeek！硅谷华人把下一代Agent Harness造出来了！？", "summary": "苦单Session久矣，两大Agent玩家不谋而合。", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/508264.html", "publishedAt": "2026-11-07T05:01:17+00:00"}, {"title": "AGENTS.MD，危险危险危险！！！", "summary": "全新的电脑病毒", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/508244.html", "publishedAt": "2026-11-07T03:43:55+00:00"}, {"title": "DigitalOcean 推出学习与数据服务，帮助 AI 智能体进行自我迭代", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/upfROwtEl8R75H24D13J?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-06T15:25:00+00:00"}, {"title": "智能体 Harness 的演进：从链、图到代码化", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https:/ :00:00+00:00"}, {"title": "从仓储到配送，全程由 AI“指挥”：京东物流“超脑”3.0 的工业级 AI 实践", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/jBdvoUXheWN0oe6NfklO?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-06T11:14:55+00:00"}, {"title": "阿里巴巴发布《2026 AI向善行动报告》 AI数据中心可持续发展成年度亮点", "summary": "11月5日，阿里巴巴发布《2026 AI向善行动报告》", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/508165.html", "publishedAt": "2026-11-06T09:19:00+00:00"}, {"title": "AI 狂烧 2000亿美元，谷歌全球启动“自愿买断”计划：最高补偿12个月工资", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/vMSj216sQUhmeDH4H0G7?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-06T08:00:00+00:00"}, {"title": "DeepSeek带火稀疏计算，国产芯片公司加速突围：这家公司又融近10亿", "summary": "Q3营收实现数倍增长", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/508155.html", "publishedAt": "2026-11-06T07:00:29+00:00"}, {"title": "一边赛博修仙，一边卖家电！AI短剧开始冲双11业绩了？", "summary": "挑战商业视频的高难度场景", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/508118.html", "publishedAt": "2026-11-06T06:54:17+00:00"}, {"title": "Anthropic微微发力，AI中转站的天就要塌了？", "summary": "就像发邮件加上数字签名一样#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1687702?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-11-04T10:34:38+00:00"}, {"title": "UJCMS 13.2.1 发布，多语言网站 AI 自动翻译", "summary": "UJCMS 支持多语言网站，可支持多种语言网站，语言数量不受限制。支持发布一种语言的文章后，可以使用 AI 或百度翻译、有道翻译自动翻译其它语言的文章；同时支持文章批量翻译。文章修改后，同样可以同步翻译至不同语言网站。如发现翻译有不恰当之处，可以手动修改。 本次更新新增会员投稿，会员可在会员中心提交文章，经...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503350", "publishedAt": "2026-11-02T10:51:17+00:00"}]}, {"label": "论文研究", "items": [{"title": "芝加哥大学教授：AI 时代数学人才招聘将更看重研究愿景与表达能力", "summary": "IT之家 11 月 8 日消息，人工智能正在降低数学研究取得突破的门槛，但这也意味着，学术界可能需要重新审视人才招聘方式。芝加哥大学一位知名数学教授认为，未来招聘数学研究人员时，个人交流能力和清晰表达研究构想的能力将变得更加重要。芝加哥大学数学领域的杰出学者弗兰克 · 卡莱加里（Frank Calegari）近日在一篇文章中谈到了自己对研究人员的招聘标准。他写道：“我想了解你希望数学走向何方，也需要具备能解释这为何可能实现的专业能力。”卡莱加里担忧，随着人工智能工具不断进步，学术界各个领域的初级研究岗位可能会被一些学生占据，而这些人之所以能够获得相关成果，可能只是因为他们大量使用人工智能生成证明。不过，他认为，一场 30 分钟的面对面交流，就足以区分两类候选人：一类只是批量制造低质量研究成果的人，另一类则拥有清晰的研究愿景，并且善于表达。卡莱加里在发布于陶哲轩（Terence Tao）博客上的文章中表示：“招聘流程将不得不更多地依赖人与人之间的直接交流，而不是仅仅审查书面材料。”他还批评了一些他所称的“懒惰的评审委员会”，认为这些委员会过去仅凭一篇论文或一项学术成果就决定是否录用学生，而如今，这类成果完全可能由人工智能生成。他表示：“一旦我们采取这种方式，就有责任培养自己的研究生，让他们具备更好的数学表达能力。我们本应更加认真地对待这件事。”上个月，康奈尔大学教授史蒂文 · 斯特罗加茨（Steven Strogatz）也曾指出，具备“rizz”（俚语，意为个人魅力）特质的数学家如今更受重视，因为他们能够解释人工智能生成的研究结果，并以此提出新的数学问题。IT之家注意到，人工智能公司迅速进军数学领域，已经让不少数学研究人员感到不安和困惑。随着 OpenAI 向这一领域大量推出针对世界上最复杂数学难题的解决方案，数量达到数百项，整个数学界都在思考如何在人工智能时代保持自身价值。一些教授已经明确表示不再使用人工智能。不过，大多数人仍在尝试寻找将这项技术融入自身研究的方法。美国各地的学生也在努力适应这一变化，并要求教授明确公布人工智能使用指南，说明学生是否可以使用这类工具，以及应该如何使用。一名学生在麻省理工学院（MIT）近期开展的一项调查中写道：“整个学术界目前缺乏高层次的领导和指导。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/859.htm", "publishedAt": "2026-11-08T01:10:20+00:00"}, {"title": "消息称 Anthropic 仍在推进上市：最多募资 1000 亿美元，“史上最大 IPO”或有变数", "summary": "IT之家 11 月 8 日消息，据《金融时报》昨天报道，尽管美国科技股近期遭遇剧烈波动，Anthropic 仍在推进上市计划。这家来自美国的人工智能初创企业，已经做好接受低于乐观预期估值的准备。据多位 Anthropic 投资者透露，这家美国公司仍计划在感恩节前进行 IPO（首次公开募股），预计募资 800 亿美元-1,000 亿美元（IT之家注：现汇率约合 5,352.66 亿元- 6,690.83 亿元人民币），目标估值为 1.25 万亿美元-1.75 万亿美元（现汇率约合 8.36 万亿元- 11.71 万亿元人民币）。上述传闻中数字高于 Anthropic 目前的 9,650 亿美元（现汇率约合 6.46 万亿元人民币）估值，但与投资者一个月前预计的翻倍水平相比存在不小差距。一位持有大量 Anthropic 股份的投资者表示：“我认为他们会采取非常保守的定价策略，比如将估值定在 1.5 万亿美元（现汇率约合 10.04 万亿元人民币），然后再逐步上涨。”其他参与此次交易的人士则认为估值可能更低，约为 1.3 万亿美元（现汇率约合 8.7 万亿元人民币）。这种预期下调反映出科技行业正在重新评估市场走势。投资者们越来越担心借贷成本上升，以及 AI 企业不断膨胀的支出计划。大量 AI 概念股已经开始出现抛售现象，贷款机构也开始回避高风险项目。本周美国中期选举，民主党取得压倒性胜利，部分原因在于该党候选人承诺阻止数据中心建设。这种结果进一步加速了市场抛售。六名以上投资者透露，Anthropic 仍打算上市，CEO 达里奥 · 阿莫迪为此不得不接受估值下调。本周四美国股市剧烈震荡，单日蒸发 3.2 万亿美元（现汇率约合 21.41 万亿元人民币）市值。以科技股为主的纳斯达克 100 指数暴跌 6.4%，市场担忧 AI 基础设施投资热潮可能放缓。市场研究机构 Vital Knowledge 分析师表示：“AI 股票遭到抛售，这让 Anthropic 上市变得更加困难，意味着可用于资本支出的资金减少，进而引发更多抛售。”同时 OpenAI 也难以完成自己的私募融资。该公司已将寻求的估值从 1.4 万亿美元（现汇率约合 9.37 万亿元人民币）下调至 1.25 万亿美元（现汇率约合 8.36 万亿元人民币），同时将融资规模从 300 亿美元（现汇率约合 2,007.25 亿元人民币）缩减至 200 亿美元（现汇率约合 1,338.17 亿元人民币）。Anthropic 的支持者希望，本次 IPO 能够吸引一些被动卖家，即指数基金和大型资产管理公司。这些机构目前尚未持有 Anthropic 的股票，但在公司上市后不久，他们实际上将不得不买入相关股票。此外 Anthropic 冲击“史上最大 IPO”的传闻也有变数。据多位了解阿莫迪想法的人士透露，他对超越马斯克 SpaceX 并没有太大兴趣。一位投资者表示：“他们并不在乎估值能否超过 SpaceX，也不追求 IPO 融资规模最大化。”Anthropic 的七位联合创始人已经承诺，将个人持有的公司股权中的 80% 捐赠给慈善事业。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/854.htm", "publishedAt": "2026-11-08T00:44:04+00:00"}, {"title": "尽管遭到恶意刷差评，《塞尔达传说：时之笛》重制版游戏仍创下 M 站用户评分新高", "summary": "IT之家 11 月 8 日消息，评测网站 Metacritic 已在 11 月 5 日开放《塞尔达传说：时之笛》重制版游戏玩家评分。目前本作的用户评分为 9.7 分，成为 M 站史上用户评分最高的游戏。作为参考，以下是最新的 M 站用户评分排名：第一名：《塞尔达传说：时之笛》重制版，9.7 分第二名：《光与影：33 号远征队》，9.4 分第三名：《寂静岭 2》（2001），9.3 分第三名：《巫师 3：狂猎 — 血与酒》，9.3 分第三名：《生化危机：安魂曲》，9.3 分第三名：《斯普拉遁涂击队》，9.3 分IT之家了解到，《时之笛》重制版的 M 站媒体评分为 96 分，低于 N64 原版的 99 分。M 站用户普遍认可本作的诸多优点，例如有玩家表示，这是掌机平台画质最出色的游戏之一。但海拉鲁开放区域出现的画面闪烁问题，还是有些遗憾。同时部分玩家认可了本作的改进，操作方式更加现代、迷宫探索体验不再令人烦躁，都是用户经常提及的优点。不过有些用户也指出，大师挑战没有加入是一大遗憾。此外，本作遭遇了一些恶意的 0 分评价，有些用户提出了毫无依据的指控，例如游戏使用生成式 AI，或过于像原版。目前至少有 30 条同类评价已经被平台方删除。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/848.htm", "publishedAt": "2026-11-08T00:02:02+00:00"}, {"title": "消息称因台积电产能吃紧，英伟达提供数十亿美元支持日月光扩产 CoWoS 先进封装", "summary": "IT之家 11 月 7 日消息，据路透社报道，一场构建 AI 基础设施的全球竞速，正推动数十亿美元巨资涌入先进封装领域。这一过去并不起眼的技术环节，如今已成为打造全球顶尖处理器的关键瓶颈。“过去，封装永远是那种你根本不必操心的事情。”英特尔前首席执行官、现任风投机构 Playground Global 合伙人帕特 · 基辛格（Pat Gelsinger）近日对媒体感慨道。市场研究机构 Yole Group 预测，先进封装市场规模预计将于 2026 年首次超越传统封装，相关资本支出预计将逼近 280 亿美元（IT之家注：现汇率约合 1,872.11 亿元人民币）。全球最大晶圆代工厂台积电主导着最尖端的先进封装技术，包括其专有的晶圆级芯片基板封装（CoWoS）。该技术将处理器、内存等多块独立硅片置于共享基板上互联，使其能够以极高带宽高速协同工作。目前该技术已被英伟达、AMD、博通以及自主研发 AI 芯片的各大云巨头广泛采用。然而，台积电吃紧的产能正倒逼芯片设计厂商另寻外援。一位业内高管透露，英伟达正在提供数十亿美元的资金支持，以协助日月光投控旗下封测大厂矽品精密扩充 CoWoS 封装产能。该高管表示，这笔此前未公开的资金将用于支持新无尘厂房扩建与设备采购。对此，英伟达未回应置评请求；日月光则表示，不针对涉及客户的市场传闻置评。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/814.htm", "publishedAt": "2026-11-07T13:50:41+00:00"}, {"title": "索尼“养老神器”全球首发：不靠摄像头和穿戴设备，Wi-Fi 信号就能感知老人跌倒", "summary": "IT之家 11 月 7 日消息，据索尼中国资讯公众号，在 11 月 5-10 日期间举行的第九届进博会上，索尼中国全球首发面向居家养老的隐私友好型无线感知跌倒检测系统。该系统通过 Wi-Fi 信号感知人体活动，无需佩戴额外设备，也不进行影像采集，面向卧室、卫生间等居家环境以及养老机构、社区养老服务场景，帮助看护人员及时发现跌倒情况。该系统利用 Wi-Fi 信号感知人体活动。人体活动会改变无线信号的传播特征，系统据此采集信道状态信息（CSI），结合人体运动特征与深度学习算法识别跌倒事件，实时检测并触发现场的声光提示，或通过 App 及小程序告警。该系统仅需要 Wi-Fi 信号发射器、接收器以及数据处理器，无需摄像头、不采集图像，可从根本消除影像隐私风险，支持缓慢跌倒、滑倒等常见跌倒类型的单人检测。根据介绍，在该系统的加持下，老人无需佩戴额外设备，日常起居不受打扰；对家庭和照护机构而言，系统不涉及摄像头画面采集，尤其适合卧室、卫生间等隐私敏感场景。看护人员无需增加画面监控，即可获得跌倒告警信息，辅助及时应对。IT之家从新闻稿获悉，该系统可适用于居家养老、公共卫生服务中心、养老院、康养机构及医疗机构的老年人跌倒检测，能够融入从居家到社区、从机构到医疗的多元照护场景，为老人安全提供全天候守护，目前已在上海开展试点落地，正在通过实际运行进一步验证系统稳定性与检测准确性。值得一提的是，该系统由索尼中国研究院本土自研。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/801.htm", "publishedAt": "2026-11-07T12:26:23+00:00"}, {"title": "GOTC 来我这放个 P！Vibe Coding 的同时也要记得关怀屁股", "summary": "你是否遇到过这种情况：Vibe Coding 最上头的地方，是你永远觉得“再改一版就好”。于是你让 AI 再跑一轮，AI 让你再等一会儿。代码迭代了十版，屁股一个 commit 都没挪。直到终于跑通，才发现你的屁股已经和椅子合并分支了。 我们是即刻放P垫，一群认真研究“屁大点事”的硬件整活选手，正在做一款用放屁音效和触感提醒...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503412", "publishedAt": "2026-11-05T06:38:40+00:00"}, {"title": "JeecgBoot V3.9.6 发布，67 项安全漏洞集中修复，AI 图像生成上线", "summary": "前言 JeecgBoot V3.9.6 是一次以「安全」为主线的版本。距离 V3.9.5 发布两个多月，这一版集中处理了社区和安全研究人员报告的 67 项安全漏洞，覆盖越权访问、租户隔离、登录爆破、短信轰炸、SQL 注入、SSRF、XSS、远程代码执行等方向，并为大量导入导出、新增、删除接口补齐了按钮权限。 功能方面，AI 流程编排新增「图...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503401", "publishedAt": "2026-11-05T01:30:09+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "庆祝《霍格沃茨之遗》上线 DLSS 5，英伟达推出定制版 RTX 5090 显卡抽奖活动", "summary": "IT之家 11 月 8 日消息，为庆祝 DLSS 5 于 11 月 5 日登陆《霍格沃茨之遗》，英伟达正在举办抽奖活动，送出一张采用《霍格沃茨之遗》定制主题外观的 GeForce RTX 5090 Founders Edition 显卡。参与者需要在英伟达 GeForce 官方 X、Instagram、Facebook 或 TikTok 账号中找到对应的抽奖帖，并在评论区留下话题标签 #RTXON。每人最多只能参与一次，四个平台的参与次数合并计算。活动将持续至太平洋时间 11 月 12 日晚 11:59，并计划于 11 月 13 日左右随机抽出一名获奖者。英伟达为奖品估值 2,599 美元（IT之家注：现汇率约合 17,377 元人民币），其中显卡价值 1,999 美元（现汇率约合 13,366 元人民币），定制外观贴膜价值 600 美元（现汇率约合 4,012 元人民币）。参与者必须年满 18 周岁，并居住在符合条件的国家或地区，名单包括美国、英国、加拿大（魁北克省除外）、德国、法国、日本、韩国和中国台湾等。参与活动无需购买任何商品。需要注意的是，1,999 美元（现汇率约合 13,366 元人民币）是英伟达为 RTX 5090 设定的官方建议零售价（MSRP），但目前实际零售价格要高得多。TechSpot 在 10 月进行的调查显示，RTX 5090 的全球标准化售价已达到 7,240 美元（现汇率约合 48,407 元人民币），而美国市场目前有现货的最便宜型号售价也高达 9,400 美元（现汇率约合 62,849 元人民币）。与此同时，RTX 5090 的供应一直极为紧张。上个月有报道称，英伟达已停止向 RTX 5090 分配 GB202 GPU 芯片。对此，英伟达个人计算业务高级副总裁杰夫 · 费舍尔（Jeff Fisher）回应称，RTX 5090 并未停产，但承认目前显卡供应受到限制。此前，英伟达也曾针对《战地 6》和《007 初露锋芒》等游戏，推出过类似的定制外观 RTX 5090 抽奖活动。考虑到目前 RTX 5090 的实际售价已达到官方建议零售价的数倍，且市场供应极其有限，这类抽奖活动似乎成了许多玩家目前获得 RTX 5090 的少数现实机会之一。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/847.htm", "publishedAt": "2026-11-07T23:57:55+00:00"}, {"title": "为什么每个 Personal Agent 背后，都必须配备一台“云电脑”？", "summary": "PPIO 沙箱，把“云电脑”做成开箱即用的 API", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/508174.html", "publishedAt": "2026-11-06T09:25:59+00:00"}, {"title": "MacBook Pro 能触屏了，但这只是它最小的升级｜附选购指南", "summary": "触控向左，算力向右#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1687989?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-11-05T14:00:13+00:00"}, {"title": "视频生成只是开始，AI 如何把内容做对？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/GGILIuzW0RTGhoeuz9TD?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-05T13:54:21+00:00"}, {"title": "用 AI 写后端，为什么还是在造轮子？", "summary": "很多人已经习惯让 AI 写代码： 生成一个 CRUD 接口、补一段 SQL、写一个工具类，效率确实比手敲高。 但真正落到一个企业后台项目上，你会发现节奏并没有变快多少。AI 帮你写完了接口，接下来还是要处理权限、菜单、工作流、报表、审计日志、数据字典。这些代码不复杂，却占了项目的大半时间，而且每个项目都要重来一遍。...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503428", "publishedAt": "2026-11-05T10:52:19+00:00"}, {"title": "Chromebook 统治美国校园，AI 成了没得选的「套餐」", "summary": "为什么 AI 成了搜索的 「必选项」#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1687912?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-11-05T10:00:23+00:00"}]}]};

const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
