，提供 Wi-Fi 7 无线网卡，集成 4 扬声器和 3 麦克风，搭载一块 14\" 1920×1200 的 100% DCI-P3 色域 OLED 屏幕，标配微星灵隐触控笔。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/832.htm", "publishedAt": "2026-08-02T23:19:40+00:00"}, {"title": "贾跃亭：法拉第未来 FF EAI 机器人 7 月实现销售及出货 152 台，创单月新高", "summary": "IT之家 8 月 3 日消息，法拉第未来创始人贾跃亭今日发文透露，FF EAI 机器人 7 月实现销售及出货 152 台，再创单月新高。截至 7 月底，累计实现销售及出货 394 台，向全年 2000 台出货目标稳步迈进。据其此前公布的消息，今年 6 月，FF EAI 机器人的销售、出货及交付量达到 105 台，3-6 月累计 242 台，超额完成原定的 220 台目标。IT之家注意到，法拉第未来于 2 月 5 日举办美国国家汽车经销商大会（NADA），活动中法拉第未来公布了旗下首批具身智能机器人产品。其中，Futurist 系列是全尺寸职业型具身智能人形机器人；Master 系列是运动型具身智能人形机器人；Aegis 系列是安防和陪伴型专业四足具身智能机器人，标配四足结构，同时可选四轮版本。轮臂系列二季度发布。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/831.htm", "publishedAt": "2026-08-02T23:16:23+00:00"}, {"title": "AI 产业扩张引发内存芯片短缺，消息称苹果 MacBook Air 笔记本出现供应紧张局面", "summary": "IT之家 8 月 3 日消息，据彭博社记者马克 · 古尔曼（Mark Gurman）报道，全球内存芯片短缺正在影响苹果 Mac 产品供应，其中受消费者欢迎的 MacBook Air 正面临库存压力。古尔曼表示，此次内存短缺主要受到 AI 产业快速扩张影响。随着人工智能企业大量采购高性能存储芯片，挤压了消费电子市场供应，苹果旗下部分产品已经受到影响。此前，用户基数更少的 Mac mini 和 Mac Studio 已经出现供应限制，而如今这一问题正在扩展至销量更高的 MacBook Air。目前，通过苹果官网购买 MacBook Air，部分型号预计需要等待至 8 月下旬才能发货，部分特殊配置甚至要等到 9 月。同时多家第三方零售商也声称，目前 MacBook Air 库存情况比以往更加紧张。值得注意的是，今年苹果返校季宣传材料也首次明显减少对 MacBook Air 的强调，转而突出基础款 MacBook Pro，并特别标注“MacBook Air 视供应情况而定”。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/822.htm", "publishedAt": "2026-08-02T22:34:25+00:00"}, {"title": "因造成环境污染，马斯克 SpaceXAI 宣布数据中心将逐步拆除 69 台移动涡轮发电机", "summary": "IT之家 8 月 2 日消息，据 Tom's Hardware 报道，马斯克的 SpaceXAI 公司宣布，旗下 Colossus 数据中心的移动发电设备将从今年 8 月逐步开始拆除。SpaceXAI 称，这 69 台（IT之家注：此前有媒体报道为 59 台，SpaceXAI 公布的数量为 69 台）临时移动涡轮机此前因涉嫌造成污染而面临诉讼，它们将在 2027 年 7 月前被彻底清退。这意味着 SpaceXAI 耗时近 1 年才能将这些拖车式发电机从厂区完全撤出。与此同时，SpaceXAI 正在建设一座装机容量为 1.2GW 的新发电厂，包含 41 台永久涡轮机，这些设备已于 2026 年 3 月授予 SpaceXAI 的《清洁空气法》许可中正式获批。SpaceXAI 此前创下了史上最快的数据中心部署纪录之一，仅用 19 天就完成了 10 万块英伟达 H200 图形处理器的安装配置。英伟达首席执行官黄仁勋曾表示，此类工程通常需要耗费四年甚至更长时间。马斯克之所以能做到这一点，是因为他直接引入了自有电源，而没有苦等公共电网接入，这在当时被视为一个非常新颖的创举。如今包括 OpenAI 在内的一些数据中心运营商都在效仿马斯克的做法，部署自己的涡轮发电机来为服务器供电，不再受制于外部电力供应商。不过，Colossus 1 和 Colossus 2 数据中心周边的社区居民一直在抱怨这些移动涡轮机带来的环境污染。他们指出这些涡轮机缺乏合法运营所需的许可证，而该公司辩称这些设备的移动性和临时性使其理应获得豁免。美国环境保护署在今年早些时候明确表示，这些设备并不能免除许可要求，但 SpaceXAI 依然我行我素继续运营。事态甚至发展到了美国全国有色人种协进会针对这些无证涡轮机提起诉讼的地步，不过美国司法部随后介入其中，声明拆除这些设备将危及国家安全，因为 Colossus 2 数据中心“支持着关键任务操作”。尽管如此，SpaceXAI 最终还是与密西西比环境质量部达成了该拆除协议。该公司还表示，正为其所有的移动涡轮机配备“先进的排放控制技术”，此举有望降低其供电设备对环境造成的影响。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/984/803.htm", "publishedAt": "2026-08-02T12:45:12+00:00"}, {"title": "基于 CyberData 的 Data Agent：构建企业数据智能中枢的工程范式｜AICon深圳", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/5KYVt93chdBrtDsvTEcK?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-02T10:00:00+00:00"}, {"title": "WAIC 收官真心话：数百家机器人刷屏背后，AI 究竟重写了什么？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/D9d8F0SUE4gCrXbbyU8N?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-01T17:20:20+00:00"}, {"title": "「天线宝宝」机器人上门做保洁，200元/小时，纯·人工·智能", "summary": "具身智能的τ（bushi）", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/464781.html", "publishedAt": "2026-08-01T10:45:46+00:00"}, {"title": "Quick BI 数据分析智能体的可靠工程实践｜AICon深圳", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/VJ3s26QZUG1C5ANF2O4Q?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-01T10:00:00+00:00"}, {"title": "Agent 成本失控背后：上下文、人工审核与维护成本正在被低估｜请回答 WAIC 2026", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/x4PTF8mgDBvtQQYa8B97?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-31T18:48:26+00:00"}, {"title": "下一个国民级 AI 产品，或许就诞生于一人之手", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/uZNH5KLzR1efgGEG0wEq?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-07-31T18:44:43+00:00"}, {"title": "Agent 形态一天一个样，Infra 到底该为谁而建？| 请回答 WAIC 2026", "summary": "点击查看原文 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
