: "OpenAI 研究员盛赞 AMD 联合 AI 推理方案：表现“令人难以置信”", "summary": "IT之家 7 月 29 日消息，科技媒体 Wccftech 昨日（7 月 28 日）发布博文，报道称 OpenAI 公司研究员 Jeffrey Wang 指出，AMD 携手 Cerebras 公司联合开发 AI 推理解决方案表现“令人难以置信”。IT之家此前报道，该解决方案主要针对超低延迟 AI 推理场景，将整合 AMD 的 Helios 机架级解决方案与 Cerebras 的晶圆级引擎，从而应对英伟达和 Groq 合作。按照双方披露的路线，Helios 机架承担高性能、可扩展吞吐引擎角色，主要处理提示词与大上下文窗口。Cerebras 的 Wafer-Scale Engine 则负责对内存带宽要求更高的 Token 生成与解码环节，强调超低时延表现，结合使用 2 个计算引擎，预估可以将每瓦每秒 token 数量提高 5 倍。OpenAI 的研究员 Jeffrey Wang 高度评价 AMD 联合开发的 AI 推理解决方案，表示：我们内部在 Cerebras 芯片上运行某些 OpenAI 模型，表现非常出色，其推理速度非常亮眼。对于我们日常工作而言，以前我可能需要等待几分钟才能完成一项任务，而现在切换任务的瞬间，该任务就已经完成了，这大大提高了我们的工作效率。相关阅读：《AMD 携手 Cerebras 押注低时延 AI 推理：每瓦每秒 Token 吞吐提升 5 倍》《和 AMD 合作推进 AI 推理硬件利好，Cerebras Systems 今日股价盘中上涨 11%》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/847.htm", "publishedAt": "2026-07-29T01:43:48+00:00"}, {"title": "扎克伯格公开批评 AI 权力集中：暗指 OpenAI 与 Anthropic 背离开放价值观", "summary": "北京时间 7 月 29 日，据《纽约时报》报道，Meta CEO 马克 · 扎克伯格 (Mark Zuckerberg) 公开发声，抨击世界上两家最具价值的 AI 创业公司 Anthropic 和 OpenAI，称它们开发 AI 软件的方式可能导致权力集中，从而缩小人们获取这一变革性技术的渠道。扎克伯格现年 42 岁的扎克伯格在周二接受了采访，并未直接点名 Anthropic 和 OpenAI。但他表示，如果领先的研究实验室想要以高度受控的方式开发 AI 技术，那就等同于在美国技术发展中“放弃我们的价值观”，并会扼杀创新。目前，Anthropic 和 OpenAI 正在以扎克伯格所说的方式开发 AI。“许多其他正在开发这项技术的实验室进行的讨论，很大程度上都充满了末日式的悲观情绪。在这场辩论中，需要有一种声音，或者多种声音，为讨论带来现实主义视角。”他表示。扎克伯格很少接受传统新闻媒体的采访，他此番言论加剧了关于 AI 软件开发方式的辩论，而这一争论已使硅谷产生分歧。目前，像 Anthropic CEO 达里奥 · 阿莫代伊 (Dario Amodei) 和 OpenAI CEO 萨姆 · 奥特曼 (Sam Altman) 这样的技术人士表示，目前一些领先的 AI 模型过于危险，在没有严格管控的情况下，不应该被共享和开发。但微软、英伟达、谷歌和 Meta 则持不同意见，他们认为许多 AI 模型必须在很大程度上以开放方式开发，这样才能让人们推动技术进步，并建立新的商业机会。阿莫代伊在这场争论中，扎克伯格多次主张，应该让更多人而不是更少的人获得 AI 技术的使用权，这被认为是对阿莫代伊和奥特曼的一种含蓄批评。尤其是阿莫代伊，他曾多次指出“对齐风险”的危险性。所谓对齐风险，是指如何以一种对人类安全的方式对 AI 进行编程，使其目标和行为符合人类利益。扎克伯格在采访中说：“我认为很多人抱有这样一种观念：如果你造出了某种超级 AI，就可以通过某种理想化的对齐方式，确保它对人类是友善的。我个人对这条路径持怀疑态度。”相反，他呼吁为每个人提供“个性化超级智能”。这意味着企业可以根据每个人的需求和偏好，对 AI 进行定制。他认为单一“友善”的超级 AI 是不可行的，因为不同的人拥有不同的观点和价值体系。“我认为，实际上不可能存在一个能够同时与所有人保持一致的单一友善超级智能。”扎克伯格称。本周，《华尔街日报》刊登了一篇扎克伯格撰写的观点文章。在这篇文章中，他批评了 AI 权力的“集中化”，并表示自己支持“个人赋能、创新以及权力平衡”。他在文章中没有点名 Anthropic 和 OpenAI。在周二的采访中，扎克伯格承认 AI 的争论存在争议，并指出他与硅谷和华盛顿各方的对话已经取得了积极进展。“我不知道目标是否在于让所有人对所有事情都达成一致，”他表示，“按理说，如果你认同我的信念，你就不需要说服每个人接受所有事情。”回顾科技发展的历程，他表示技术工具的民主化最终往往会胜出。“我相信，整个行业的发展大趋势一直是走向更加开放，让更多人掌握技术力量，而不是让更少的人掌握。”他说。相关阅读：《上千名员工呼吁美国政府控制 AI 发展，OpenAI CEO 奥尔特曼表态》《科技行业力挺开源 AI，Anthropic 因保持沉默遭同行批评》《扎克伯格称 Meta 在 AI 上落后 OpenAI 等公司，预告“西瓜”模型打造极致智能》《消息称 Meta 全新 AI 模型“牛油果”推迟发布，性能不敌 OpenAI、Anthropic 等友商成主因》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/845.htm", "publishedAt": "2026-07-29T01:38:34+00:00"}, {"title": "微软 GitHub Copilot 现支持调用 Grok 4.5 AI 模型", "summary": "IT之家 7 月 29 日消息，马斯克旗下 SpaceXAI 昨日（7 月 28 日）发布公告，宣布其 Grok 4.5 模型已入驻 GitHub Copilot 平台，邀请全球数百万开发者使用。IT之家援引博文介绍，GitHub Copilot 涵盖云智能体、Copilot CLI 以及 VS Code IDE 等，开发者可以通过切换模型调用 Grok 4.5 模型。定位方面，Grok 4.5 模型专为快速、智能的编码和复杂的多步骤工作流程而设计，上下文窗口最大可达 50 万个标记，支持文本和图像输入，并提供低、中、高三种推理难度。使用方面，网站 Tunx 测试后指出 Grok 4.5 在 Visual Studio Code 和 Copilot CLI 的终端编码任务中表现出色。它在并行调度工具和执行直接操作方面尤其优秀，因此非常适合探索性开发、解决复杂任务以及对时间要求严格的编码工作流程。费用方面，计费方式为按量计费，价格为每百万个输入 Token 2 美元，每百万个输出 Token 6 美元。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/838.htm", "publishedAt": "2026-07-29T01:22:52+00:00"}, {"title": "OpenAI 宣布开源 Codex Security CLI，支持代码扫描、漏洞追踪和自动化安全检查", "summary": "IT之家 7 月 29 日消息，OpenAI 今日宣布推出开源命令行安全工具 Codex Security CLI，用于帮助开发者扫描代码仓库、发现和验证安全漏洞，并将安全检查流程集成到持续集成与持续交付（CI / CD）环境中。OpenAI 表示，该工具实际上在正式公开前就已被人发现。目前，Codex Security CLI 仍处于早期版本阶段，官方表示将根据开发者反馈持续改进工具功能。Codex Security CLI 是一款基于命令行界面的安全工具，同时提供 TypeScript SDK 接口。开发者可以使用它扫描代码仓库，查看代码变更，跟踪不同运行周期中的安全问题，并验证漏洞修复效果。OpenAI 介绍，该工具支持将安全检查加入 CI / CD 流程，帮助开发团队在软件开发过程中自动执行安全检测。对于持续开发的软件项目，这类工具可以用于提前发现代码中的潜在安全风险。安装方面，开发者可以通过 npm 安装该工具：npm&nbsp;install&nbsp;@openai/codex-security安装完成后，可使用以下命令查看帮助信息：npx&nbsp;@openai/codex-security@latest&nbsp;--help根据官方文档，Codex Security CLI 运行需要 Node.js 22 或更高版本、Python 3.10 或更高版本，以及具备 Codex Security 访问权限。完成安装和身份验证后，开发者可以通过以下命令扫描代码仓库：npx&nbsp;codex-security&nbsp;login npx&nbsp;codex-security&nbsp;scan&nbsp;.在 CI 环境中，开发者无需交互式登录，可通过设置 OPENAI_API_KEY 环境变量完成身份验证。工具同时支持 ChatGPT 账号登录和 API 密钥两种认证方式，用户可以通过参数指定使用哪一种认证方式。此外，OpenAI 还提供了 TypeScript SDK，开发者可以直接在 TypeScript 项目中调用 Codex Security 功能。例如，通过 SDK 运行代码安全扫描，并获取扫描报告路径。OpenAI 表示，Codex Security CLI 的扫描历史会保存在 Codex Security 工作目录中。如果默认目录无法写入，用户可以通过设置 CODEX_SECURITY_STATE_DIR 变量指定其他可写目录。IT之家附 GitHub 地址：https://github.com/openai/codex-security", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/823.htm", "publishedAt": "2026-07-29T00:48:22+00:00"}, {"title": "古尔曼爆料苹果今秋推 2026 款 Apple TV 和 HomePod mini，主打 Siri AI", "summary": "IT之家 7 月 29 日消息，彭博社的马克 · 古尔曼（Mark Gurman）最新爆料称，苹果公司计划在 2026 年秋季发布会上，推出 2026 款 Apple TV、2026 款 HomePod mini 以及一款支持 Siri AI 的智能家居中枢设备。2026 款 Apple TV2026 款 Apple TV 内部代号为 J265，预估升级 A17 Pro 芯片，支持 Apple Intelligence 和 Siri AI。外观方面，该媒体梳理现有爆料信息，指出 2026 款 Apple TV 4K 会沿用现有方形圆角设计，并继续采用黑色塑料材质，在尺寸、外观等方面没有区别。芯片方面，2026 款 Apple TV 4K 最大的亮点是升级 A17 Pro 芯片，该芯片最早搭载于 iPhone 15 Pro 系列机型中，相比较目前 Apple TV 搭载的 A15 Bionic 芯片，会有明显的性能提升。苹果 A17 Pro 芯片采用 3 纳米制程，并支持硬件加速光线追踪与硬件加速 AV1 解码，也是苹果现有产品线中支持 Apple Intelligence 的最早一代 A 系列芯片。AI 方面，2026 款 Apple TV 4K 将支持全新 Siri AI，古尔曼曾于今年 3 月爆料，称新款 Apple TV 4K 在硬件方面早已准备就绪，但由于 Siri AI 多次延后发布。连接能力方面，新款 Apple TV 4K 可能搭载苹果 N1 网络芯片，并支持 Wi-Fi 7，可使用新一代路由器提供的 6GHz 频段，此外还有望支持蓝牙 6.0 以及 Thread 智能家居协议。2026 款 HomePod mini苹果预计将随时推出新一代 HomePod mini 2，内部代号为 B525，新产品的外观设计并不会有太多变化，但可能会有新配色。参数方面，HomePod mini 2 预计将搭载 Apple Watch Series 10 同款的 S10 SiP 芯片，有望带来更好音质、更先进的实时计算音频，预计升级蓝牙 5.3，配备第二代超宽带（UWB）芯片，售价与一代机型保持不变，均为 99 美元（IT之家注：现汇率约合 684.6 元人民币）。智能中枢智能中枢有 2 个版本，内部代号分别为 J490 和 J491。其中 J490 配备半穹顶形底座，该底座外形被描述为半个 HomePod mini；J491 支持墙面安装。这款产品定位智能家居中枢，支持通话、播放音乐、查看天气、Siri、浏览照片和家庭日历等功能，目标成为“公司重振智能家居战略的核心”。规格方面，这款产品预计将搭载 A18 芯片，支持 Apple 智能，可运行 Safari 浏览器、Apple Music、备忘录、日历、照片和 Apple News 等第一方应用，没有独立的 App Store 应用商店。同时，这款产品还将配备人在传感器，可检测房间内是否有人；内置面容 ID 可辨识说话者身份，为不同用户呈现个性化应用、功能界面。上市日期方面，古尔曼透露苹果公司可能会在 2026 年 10 月或者 2027 年年初的时候发布智能中枢设备。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/817.htm", "publishedAt": "2026-07-29T00:25:20+00:00"}, {"title": "上千名员工呼吁美国政府控制 AI 发展，OpenAI CEO 奥尔特曼表态", "summary": "北京时间 7 月 29 日，据《商业内幕》报道，美国一些头部 AI 公司的高管表示，联邦政府现在是时候找到一种方法，在必要时对 AI 开发踩刹车了。AI 业界呼吁控制 AI 发展来自 OpenAI、Anthropic、谷歌和 Meta 等公司的 1100 多名 AI 员工联合签署了一封公开信，呼吁美国政府控制 AI 发展速度。眼下，AI 公司正竞相研发能力越来越强大的 AI 系统，让外界担忧 AI 的发展速度可能会超过现有安全保障、治理体系和监管机制所能跟上的步伐。“我们呼吁美国政府支持一项国际合作，开发必要的技术和治理工具，以便能够有意识地把控自动化 AI 开发的前沿进程。”公开信称。这个倡议名为“把控前沿”(Pacing the Frontier)，签署这封公开信的高管包括 Anthropic CEO 达里奥 · 阿莫代伊 (Dario Amodei) 以及公司两位联合创始人杰克 · 克拉克 (Jack Clark) 和贾里德 · 卡普兰 (Jared Kaplan)、OpenAI 首席科学家雅库布 · 帕霍茨基 (Jakub Pachocki)、Meta 首席科学家赵晟佳 (Shengjia Zhao)，以及负责谷歌 DeepMind AI 安全与对齐工作的安卡 · 德拉甘 (Anca Dragan)。公开信这封信重点关注“自动化 AI 开发”，指的是未来 AI 能够自行开发和改进 AI 系统的能力。业界称这一过程为“递归式自我改进”。Anthropic 曾表示，其 Claude 系列模型正在快速接近这一门槛。信中在谈到这一潜在时刻时写道：“很难准确预测这将在多大程度上加速 AI 的进步，但确实存在一种真实的风险：AI 能力的发展速度会迅速加快，超出我们理解或控制这些由此产生的系统的能力。”针对这一公开信，OpenAI 在 X 平台上发文称：“我们相信，在未来的某个时间点，前沿模型开发中的 AI 加速可能会如此之快，以至于世界将需要把控 AI 进步的速度。””Anthropic 在 X 上的一篇帖子中表示：“我们上个月发布的关于递归式自我改进的研究表明，我们需要一些工具，能够有意识地调控 AI 发展的前沿速度，让社会有时间做好准备。”奥尔特曼与此同时，OpenAI CEO 萨姆 · 奥尔特曼 (Sam Altman) 表示，或许现在是时候“把控”AI 发展的节奏了，以便世界能够为此做好准备。“我们可能需要把控 AI 发展的速度，给自己足够的时间，让社会适应这些新的能力水平并建立起防护机制。同时，我们也需要想办法做到这一点，既不能让任何人觉得这是监管俘获 (监管对象反过来影响监管者)，也不能让人觉得这是前沿 AI 实验室之间的串通。”他在接受《Invest Like the Best》播客采访时表示。奥尔特曼的态度已经发生反转。过去，他曾避免签署一些呼吁放缓 AI 发展的倡议。他曾表示，2023 年的一封提出类似“放缓 AI 发展”主张的公开信，“缺少关于我们究竟需要在哪些方面暂停发展的关键技术细节。”相关阅读：《OpenAI 多名员工公开声援 CEO 奥尔特曼，证实其乐于听取不同意见》《OpenAI 奥尔特曼：人们并不想要 AI CEO，且更珍视人性联结》《前沿 AI 模型限制令生效之际，OpenAI 奥尔特曼本周将赴华盛顿》《Anthropic 迟迟不签公开信成“众矢之的”，CEO Dario Amodei 解释称公司从未主张禁止开源 AI 模型》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/816.htm", "publishedAt": "2026-07-29T00:20:32+00:00"}, {"title": ":white_check_mark: 首个 AI 可靠读写数据 Agent 开源 :link: 腾讯 APIJSON 生态协议", "summary": "A2API - 一次 AI，次次 API 安全、快速、稳定读写数据 用 A2UI 聊天即兴生成 UI 来安全、快速、稳定调用 HTTP API 增删改查表格、表单、图表等数据。 AI 生成一次 UI，API 每次都安全、快速、稳定执行。 Agent-to-API 协议、引擎与 Demo：生成任务 UI，之后改筛选/排序/分页直接调用 HTTP API， 不再调用大语言模型，不费...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/481862", "publishedAt": "2026-07-29T00:03:27+00:00"}, {"title": "AI 推动软件漏洞发现速度大幅加快，今年数量较去年预计翻番", "summary": "IT之家 7 月 29 日消息，据彭博社 28 日报道，AI 正在显著加快软件漏洞的发现速度。按照目前趋势，2026 年在热门科技产品中发现的安全漏洞数量，预计比 2025 年翻一番。今年 1 月至本周一，美国国家漏洞数据库已收录 45207 个漏洞，接近去年全年的总量，而 2025 年就已创下该数据库的历史纪录。“安全漏洞”指可能被黑客利用的软件缺陷，攻击者可借此侵入计算机系统，从事犯罪或间谍活动。多家科技巨头近期披露的数字都创下纪录。IT之家从数据中获悉，甲骨文在 7 月例行软件更新中修复了 1449 个安全漏洞，创下公司成立 49 年来的新高，去年同期只有 309 项。微软 7 月披露 642 个漏洞，接近去年同期的五倍。谷歌最近更新 Chrome 浏览器时发现并修复 433 个漏洞，而一年前的同类更新只有 11 个。SentinelOne 杰出 AI 研究科学家加布里埃尔 · 伯纳代特-夏皮罗表示：“我们必须正视一个事实：这些工具正在提升人们发现软件漏洞的能力。”谷歌 Chrome 工程总监道格 · 特纳也指出，漏洞发现的规模和速度均已达到前所未有，主要得益于 AI 模型进步及相应投入增加。漏洞发现数量暴增，也让各国政府和安全公司此前的警告更具现实意义：掌握强大新型 AI 模型的黑客，可能带来更大威胁。不过，数据也显示，风险尚未完全演变为实际攻击。美国政府的已知被利用漏洞目录表明，尽管今年发现的漏洞大幅增加，实际遭到利用的漏洞数量并未上升。科技公司的披露还显示，许多新增漏洞由内部安全团队利用自研 AI 工具发现。谷歌 7 月发现的 433 个 Chrome 漏洞中，有 401 个来自内部报告。与此同时，黑客把漏洞转化为可实际入侵系统的攻击代码也越来越快。Recorded Future 高级顾问亚历山大 · 莱斯利表示，攻击者利用漏洞所需的平均时间，已从去年的 72 小时缩短至 2026 年的 24 小时。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/812.htm", "publishedAt": "2026-07-28T23:57:15+00:00"}, {"title": "OpenAI 奥尔特曼：人们并不想要 AI CEO，且更珍视人性联结", "summary": "IT之家 7 月 29 日消息，据《商业内幕》今天（29 日）报道，OpenAI CEO 萨姆 · 奥尔特曼认为，人们并不希望让 AI 取代自己的职位。“以我的工作为例，外界希望知道谁要为一家公司的决策负责；如果决策失误，又该向谁追责。人们其实并不想要 AI CEO。”相较以往，奥尔特曼对这一问题的看法已经悄然发生了变化。据IT之家了解，去年 11 月，他曾在播客节目《与泰勒对话》中称，如果其他公司抢在 OpenAI 之前用 AI 模型取代 CEO，对 OpenAI 而言无异于一种失败。“如果 OpenAI 不是第一家由 AI CEO 管理的大公司，我就该感到羞愧。”奥尔特曼指出，人们重视人与人之间的联系，是 AI 尚未像自己最初预计那般“颠覆”经济的原因之一。“人们非常信任与他人共事，也享受这一过程。现在已经可以聘请 AI 顾问、与 AI 销售代表交谈，或雇用 AI 工程师，但不知为何，大多数人好像仍然更愿意和真人打交道。”对于这样的现状，奥尔特曼坦言自己也能感同身受。“几乎无论做什么，我都更愿意与真人交流，而不是 AI。”他以艺术创作为例：即使 AI 模型已经能够生成令人惊叹的图像，人们仍然珍视人类创作的艺术品。“有人开玩笑说，到了这个阶段，一件艺术品的大部分价值都在作者签名上。但事实是，人们想了解作品背后的创作者。阅读小说时，人们同样想了解作者。”奥尔特曼认为，人们坚持保留并珍视人性，也让他改变了 AI 是否会像此前设想的那样造成大规模失业的看法。此前，他曾称 AI 将消灭“整个类别”的工作；而最近却认为 AI 对初级岗位的短期冲击没有达到预期，自己“很高兴判断错了”。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/804.htm", "publishedAt": "2026-07-28T23:16:29+00:00"}, {"title": "数百条 Claude 聊天记录被谷歌索引，Anthropic 回应称用户主动分享所致", "summary": "IT之家 7 月 29 日消息，7 月 26 日，Anthropic 旗 Claude 的共享对话功能曝出隐私风险。有人在 Reddit 上发帖称，Claude 用户通过“分享”功能生成的公开链接可被谷歌等搜索引擎进行收录，导致包含个人简历、健康状况、公司内部资料乃至 API 密钥等敏感信息的对话记录被公开。此次事件源于 Claude 的对话分享功能。用户点击聊天界面右上角的“分享”按钮后，系统会生成一个指向该对话快照的公开链接，任何拥有链接的人均可查看。问题在于，这些公开页面未添加“noindex”标签来禁止搜索引擎收录。尽管 Anthropic 早在 2025 年 9 月就通过 robots.txt 文件指令禁止爬虫抓取共享聊天页面，但根据谷歌和必应的技术逻辑，若被禁止抓取的页面存在来自外部的公开链接，搜索引擎仍可能将其编入索引。此次事件中被泄露的对话内容涵盖范围极广且包含大量敏感信息。其中可见个人简历（含姓名、联系方式及工作经历）、医疗记录及临床试验数据、企业内部项目文档与员工考评记录、律师关于职业道德违规的咨询、加密货币钱包私钥与 API 密钥等。此外，用户通过 Claude Artifacts 功能创建的交互式应用、仪表盘和文档等产物同样被索引。部分搜索结果甚至包含色情角色扮演对话及带有真实姓名的患者医疗报告。Anthropic 发言人 Amie Rotherham 对此表示，公司遵循隐私原则，不会主动向搜索引擎提交对话目录或站点地图。她表示，共享链接本身不可猜测或发现，只有当用户主动将链接发布到可被爬虫抓取的公开平台（如论坛或社交媒体）时，才会被索引。谷歌发言人 Ned Adriance 则表示，搜索引擎不控制网页是否公开，网站所有者可使用平台提供的工具控制抓取和索引。Anthropic 已于 7 月 26 日当天为 Claude 共享页面添加了“noindex”标签，相关搜索结果逐渐从谷歌等引擎中消失，但已公开的链接若被第三方存档或转发，仍可能继续存在。IT之家注：用户可在 Claude 的设置 → 隐私 → 共享聊天中查看并撤销已分享的对话链接。值得一提的是，这并非 AI 聊天记录首次因此类原因泄露。2025 年 7 月，ChatGPT 的共享链接同样被谷歌索引，OpenAI 在一周内移除了相关功能。相关阅读：《Claude 对话分享链接意外被谷歌收录，用户隐私聊天内容曝光》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/802.htm", "publishedAt": "2026-07-28T23:11:54+00:00"}, {"title": "OpenAI 引入两种转录模型：低延迟、更好理解上下文", "summary": "IT之家 7 月 29 日消息，OpenAI 公司今天（7 月 29 日）在 X 平台发布公告，宣布推出 GPT-Live-Transcribe 和 GPT-Transcribe 两种转录模型，并支持通过 API 方式调用。调用费用方面GPT-Live-Transcribe 转录费用为每分钟 0.017 美元（IT之家注：现汇率约合 0.12 元人民币）GPT-Transcribe 转录费用为每分钟 0.0045 美元（现汇率约合 0.03 元人民币）OpenAI 官方表示相比公司此前模型，上述两种转录模型可以更好地理解上下文，并能在各种口音和语言的真实世界音频上提供更准确的转录，包括短语、数字、专业术语以及带有响亮背景噪音的语音。GPT-Live-Transcribe 是专为低延迟实时转录而构建；而 GPT-Transcribe 可以优化已完成音频文件和批量工作负载的异步转录。在 Context Aware ASR 基准测试上，GPT-Transcribe 语义准确率从无自由形式上下文的 41.6% 提高到有上下文的 45.2%。在 Common Voice 的 22 种语言上，GPT-Transcribe 的转录错误率为 19.27%，而 Whisper (whisper-1) 为 40.37%。在真实世界音频录制基准的九种语言上，它实现了 8.98% 的转录错误率，而 Whisper (whisper-1) 为 15.21%。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/801.htm", "publishedAt": "2026-07-28T23:01:33+00:00"}, {"title": "OpenAI 模型失控受害者不仅只有 Hugging Face，Modal Labs 确认一名客户被黑", "summary": "IT之家 7 月 29 日消息，据路透社等多个美媒今日报道，此前从 OpenAI“越狱”并对抱抱脸（Hugging Face）发动黑客攻击的“失控智能体”，还成功入侵了 Modal Labs 的一名客户。根据 Hugging Face 于当地时间 7 月 28 日公布的事件时间线，该失控智能体首先攻破了一个“托管于第三方服务商基础设施上”的沙盒（即隔离测试环境），随后将其作为跳板，发动了更大规模的攻击行动（未直接点名该第三方服务商）。Modal Labs 首席技术官 Akshat Bubna 在声明中确认了此次入侵事件。Bubna 表示，该公司一名客户发布了一个未经身份验证的公开端点，导致互联网上的任何人都可以利用其沙盒执行代码，而失控智能体正是利用了这一漏洞。他同时强调，Modal 的平台及隔离机制本身未受到任何形式的入侵。此次事件的曝光进一步加剧了外界对 AI 系统安全边界的担忧。OpenAI 表示，他们直到威胁被控制且 FBI 介入后才意识到其智能体已失控。OpenAI 当时表示该报道存在不准确之处，但未作详细说明。截至IT之家发稿，OpenAI 尚未就此次智能体失控事件的具体行为及其造成的完整影响作出公开说明。相关阅读：《OpenAI 自曝 AI 模型“失控”越狱，突破沙盒环境入侵 Hugging Face》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/982/800.htm", "publishedAt": "2026-07-28T22:59:56+00:00"}, {"title": "uniTerm v1.6 发布：超轻量全能开源终端，新增 K8s 与容器管理、AI 技能与命令", "summary": "uniTerm 是一款轻量级一站式终端软件，安装包不到 10MB，支持 SSH、RDP、VNC、SFTP、数据库、Kubernetes 等 20 余种协议，内置可自主执行的 AI Agent，能规划并执行多轮 Shell 命令。 本次 v1.6.0 是继文件传输、远程桌面、数据库之后的又一次能力扩容：正式引入 Kubernetes 与容器管理；同时让 AI 能力从「执行命令」升...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/481563/uniterm-1-6-released", "publishedAt": "2026-07-28T12:49:58+00:00"}, {"title": "印度法院判决：OpenAI 用新闻内容训练 AI 不侵权", "summary": "印度德里高等法院于当地时间 7 月 24 日裁定，OpenAI利用亚洲国际新闻社（ANI）的内容训练人工智能模型，不构成侵犯版权。 法官Amit Bansal在判决中明确指出，OpenAI的行为符合印度《版权法》中定义的研究类\"合理使用\"例外情形。与此同时，ANI未能向法院提交充分证据，证明ChatGPT生成的回复中存在对ANI受版权保护内容的...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/481476", "publishedAt": "2026-07-28T10:38:07+00:00"}, {"title": "阿里 Qoder 上线实时语音智能体 Qoder Voice", "summary": "阿里AI编程助手Qoder正式推出实时语音交互智能体Qoder Voice，由全双工语音模型Qwen-Audio-3.0-Realtime驱动，支持开发者通过自然语音完成任务创建、方案讨论和代码执行，实现语音与AI编程的实时协同。 据介绍，用户在Qoder Quest模式主界面点击语音入口，即可通过悬浮窗在任意界面唤起Qoder Voice。发出语音指令后，系统...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/481439", "publishedAt": "2026-07-28T09:46:26+00:00"}, {"title": "Kimi K3、Unlimited OCR包揽全球前二，中国开源模型持续刷屏海外", "summary": "", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/07/461949.html", "publishedAt": "2026-07-28T08:17:05+00:00" // 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
