美国必须建立强制性安全标准的重要原因之一。勒汉恩进一步指出：“模型只有在证明并保证达到一定安全水平后，才能向公众发布或部署。我认为美国首先需要建立一套全国性的制度，再以此为基础推动国际制度，最终确实需要某种国际层面的治理架构。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/993/305.htm", "publishedAt": "2026-08-23T14:13:31+00:00"}, {"title": "OpenAI 推出青少年版 ChatGPT，多名儿童安全专家质疑安全机制透明度", "summary": "IT之家 8 月 23 日消息，OpenAI 本周推出了 ChatGPT 青少年版，专门面向年轻用户，并通过年龄识别机制限制部分功能。对此，外媒 Engadget 采访了多名儿童安全专家，他们对 ChatGPT 青少年版的评价并不一致。但所有人都认为，在向家长和年轻人推荐之前，这套系统还需要接受大量独立测试，OpenAI 必须更加透明地说明安全机制究竟如何运作。为家庭提供娱乐和科技产品建议的 Common Sense Media 公司 AI 与数字评估负责人罗比 · 托尼认为：“OpenAI 这次做出了一些非常重要的承诺，但必须拿出证据，证明这些安全承诺和功能真的有效。”儿童网络安全倡议组织 Fairplay 执行董事乔什 · 戈林的态度更加严厉：“从纸面上看，OpenAI 公布的一些措施确实像是在朝正确方向前进，但继续深挖后，仍然有很多值得担忧的地方，其中就包括没有问责机制。社交媒体已经证明，在保护儿童的问题上，仅仅相信企业并不管用，OpenAI 也已经出现过同样的问题。在那之前，OpenAI 本就有针对自杀、暴力和吸毒的内容限制，但这些限制要么不起作用，要么会随着时间推移逐渐失效。”二人都怀疑，OpenAI 的自动年龄识别系统能否稳定识别青少年，并切换到 ChatGPT 青少年版。托尼指出：“OpenAI 没有公布这套系统的效果数据，误报率和漏报率都不为人知，自动系统远不可能识别 ChatGPT 上的所有青少年。回想 OpenAI 此前计划推出部分色情内容功能时，当时有报道说的，最终没有推出的一个原因，就是年龄估算技术无法准确识别足够多的青少年。”托尼还认为，青少年几乎肯定会尝试绕过年龄识别，寻找更加出人意料的规避办法。OpenAI 做出的最具体承诺，恰恰也是专家最怀疑能否落实的一项。OpenAI 青少年与家庭事务负责人劳伦 · 乔纳斯曾回应称，“所有被标记的内容都会先由 OpenAI 全职员工审核，之后才会通知家长。我们的目标是在用户发出提示后一小时内通知家长。”她又明确指出，OpenAI 确实拥有足够的人手和处理能力，可以保证所有被标记内容经过人工审核，并在一小时内通知家长。托尼对此提出质疑：“这道工序仍然依赖自动化决策，那么问题来了：负责筛选内容、再把内容交给人工审核员的自动分类器，到底值不值得信任？”戈林也表示：“我希望看到一些硬数据，比如每天到底有多少对话被标记和审核、负责审核的人有多少，以及每次审核平均花多长时间。很难想象 OpenAI 招到了够多的人，而且能够认真审查每一段可能存在危险的对话。”三名专家还一致认为，必须由家长和孩子主动绑定 ChatGPT 账户的机制，削弱了这项功能的实际效果。戈林指出：“绝大多数家长根本不会去使用家长监督工具，其中一个原因，就是这些工具往往被设计得很难找到，也很难操作。”其认为，更有效的办法是默认开启，并在产品设计阶段就把保护机制做进去：“一开始就采用最严格的保护设置，例如默认设置使用时间限制，再让家长决定是否修改，而不是把责任交给家长，要求他们自己去设置限制。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/993/301.htm", "publishedAt": "2026-08-23T13:53:40+00:00"}, {"title": "第二届世界人形机器人运动会：智元精灵 G2 成功摘取“消防应急场景”“图书场景”两枚金牌", "summary": "IT之家 8 月 23 日消息，今日，第二届世界人形机器人运动会正式开赛，智元核心产品精灵 G2、灵犀 X2、远征 A3 悉数参加。在已经完赛的“场景赛”部分项目中，智元精灵 G2 取得了两金三银两铜的好成绩。截至目前，智元位于奖牌榜首位。IT之家注意到，本届运动会新增“场景赛”，将赛项延伸到真实环境，覆盖工业、酒店、家庭、物流等领域。其中，智元精灵 G2 成功摘取了“消防应急场景”“图书场景”两枚金牌。消防应急场景：比赛还原真实火灾场景，参赛队伍需要完成危险品识别、异常阀门关断、灭火器抓取与灭火三大核心任务。灭火器重达 4.5-5 公斤，远超市面绝大多数人形机器人末端夹爪的负载上限。智元没有选取昂贵的定制夹爪，而是在手腕处加装结构件，利用手腕结构强度将灭火器勾起，插入底盘带 20° 倾角的专用承载桶，解决负载问题。图书场景：智元与清华大学、上海交通大学组建的联合赛队参与比赛，该项目包含三个环节：出库与运输、图书上架归位、错放图书识别与纠正，任一环节失败都可能导致任务中断，对全流程鲁棒性要求极高。团队预先建立了高精度地图并标定关键点位，通过定位与导航算法计算最优路径，并采用开源视觉模型识别图书脊背标签，搭建出了一个稳定可靠的机器人大脑自主决策系统。据官方介绍，智元精灵 G2 是一款成熟具身智能产品，已在大量真实场景中规模化部署使用。它拥有额定负载 5 公斤的力控谐波关节手臂，可胜任绝大多数物体操作；域控制器搭载 2070 TOP 算力，让算法在端侧高效运行，彻底摆脱对外部算力与网络的依赖，性能输出更稳定。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/993/292.htm", "publishedAt": "2026-08-23T12:59:19+00:00"}, {"title": "美国专家示警：学生依赖“AI 代写”会削弱思考能力", "summary": "IT之家 8 月 23 日消息，美国学生使用 AI 完成作业、甚至代写整篇论文的现象已经十分普遍，也有不少学校允许学生在一定范围内借助 AI 工具。据《纽约时报》当地时间 17 日报道，越来越多专家担心，问题可能不只是学生会不会写文章，而是长期依赖 AI 可能削弱他们本身的思考能力。认知心理学家罗纳德 ·T· 凯洛格在接受《纽约时报》采访时指出，写作是一种用于思考的技术。其认为，起草一篇普通论文对大脑造成的负担，就像挖沟对身体造成的疲劳一样。写作者需要反复寻找准确的词语，把零散想法整理成别人能够理解的结构，再通过自我修改或他人反馈不断调整观点。因此，写作无法与其中的思考劳动分开。机器一旦代替人完成这套过程，学生省下的不只是打字和遣词造句的时间，也同时失去了原本应该由大脑完成的训练。写作并不只是把已经形成的想法记录下来。写作过程本身能够训练工作记忆、规划能力和元认知，也就是观察、理解自身思维过程的能力。写作常被赋予很多浪漫想象，真正动笔却是一项高强度脑力劳动。麻省理工学院今年早些时候的一项研究也发现，使用 AI 写论文的人，脑部活动低于完全依靠自己写作的人。更值得注意的是，借助 AI 完成论文的参与者很难回忆起自己刚写出的任何一句话。之后即使要求他们脱离 AI 重新写作，脑部活动仍然维持在较低水平。《纽约时报》指出，大多数人当然不会主动选择“挖沟”，写作同样令人畏难。亚利桑那州立大学写作研究专家、教育心理学家史蒂夫 · 格雷厄姆提醒，写作过程中的任何部分交给 AI 代劳，都不是毫无代价的。《纽约时报》记者达娜 · 戈尔茨坦由此提出，如果写作就是思考，那么把挣扎过程中的任何一部分外包给技术，都意味着放弃一部分感知和判断的自由。如果学生让机器替自己直接给出答案，他们又怎么可能知道自己真正如何看待任何事物？全美中小学和大学已开始重新考虑如何限制学生使用 AI。一些学校用回了纸笔写作和口试，另一些学校禁止大一新生在课堂中使用数字设备。普林斯顿大学等常春藤盟校甚至放弃了部分长期沿用的荣誉准则做法，不再允许学生在无人监考的情况下参加测验和考试。稍显积极的一面是，不少学生也开始自己意识到，用 AI 代写指定文学作品的分析文章，等于主动放弃了一部分教育过程。一名大学三年级学生告诉《纽约时报》：“如果不真正去分析这些很难的文本，就锻炼不了这种能力。这些文本本来就是应该有难度的。”相关阅读：《智能体成“逃课神器”？部分美国学生用 AI 代替自己完成整门网络课程》《专家警示医学生过度依赖 AI：或从一开始就无法形成诊疗推理能力》《美国大学教授出奇招抓 AI 作弊：往试卷里塞隐藏提示词，35 名学生中 32 人中招》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/993/274.htm", "publishedAt": "2026-08-23T12:28:38+00:00"}, {"title": "诺亦腾机器人发布 HiPHI，开源 617.5 小时高精度人体运动数据", "summary": "IT之家 8 月 23 日消息，诺亦腾机器人在 2026 世界机器人大会期间发布 HiPHI，这是一套面向人形机器人学习、数字人，以及计算机图形学领域研究人员和工程师的高精度光学动作捕捉数据集。据报道，该数据集总长 617.5 小时，内含 371.8 小时的全身人体运动数据，以及 245.7 小时的人 — 物交互数据，含左右镜像。数据源来自 132 名动捕演员，以 90 Hz 频率、亚毫米级光学动捕精度完成采集，并依据 FrameNet 对人类动作语义的组织框架，以动作单元进行结构化整理。IT之家注意到，该数据集目前已在 Hugging Face 平台公开上线，提供文档、论文等，基于 HiPHI 训练的模型已经在宇树 G1 人形机器人真机部署中实现跑步、坐下、爬行、搬运箱子和拖拉行李箱等动作。参考：noitomrobotics/HiPHI · Datasets at Hugging Face", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/993/258.htm", "publishedAt": "2026-08-23T11:18:50+00:00"}, {"title": "因预约人数远超预期，《莱莎的炼金工房》衍生 AI 聊天游戏延期上线", "summary": "IT之家 8 月 23 日消息，据日媒 4Gamers 报道，由光荣特库摩游戏授权、SpiralAI 开发的 AI 聊天游戏《RyzaChat:AI 与莱莎共同创造只属于你的盛夏梦幻故事》将延期上线。据报道，本作原定 8 月 18 日上线，但由于预约人数远超预期，官方决定加强服务器环境，以便玩家能够在稳定的环境中体验游戏。官方强调，开发团队为了按照原计划上线，直到原定开服前最后一刻还在调整。但评估当前服务器环境后，决定调整上线日期。开发人员当前的目标是确保下周开服，具体日期日后公布。据IT之家了解，本作的剧情世界观将以《莱莎的炼金工房 ～常暗女王与秘密藏身处～》为基础。游戏玩法与传统 RPG 不同，玩家将通过与莱莎聊天的形式，推进战斗、旅行和建设。此外，本作中莱莎的插画素材均由人工绘制，完全没有使用生成式 AI。语音则是使用野口百合专门录制的素材，通过 SpiralAI 语音合成技术运行。文本使用 SpiralLLM 大语言模型生成。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/993/257.htm", "publishedAt": "2026-08-23T10:56:46+00:00"}, {"title": "广汽埃安 N60 曜夜型格运动套装上市：价值 6666 元，限时购车免费送", "summary": "IT之家 8 月 23 日消息，广汽埃安 N60 曜夜型格运动套装现已上市，价值 6666 元，8 月购车限时免费送。据介绍，曜夜型格运动套装包含曜夜前唇、驭风后扰流、边锋侧裙、掠风尾翼；全套黑化风格，优化车身姿态。据IT之家此前报道，广汽埃安 N60 纯电紧凑型 SUV 于 4 月 28 日上市，依据 CLTC 续航里程的不同分为 410km、510km 和 610km 三个版本，官方指导价分别为 10.98 万元、11.98 万元、12.98 万元。目前该车有 5000 元的限时焕新补贴和 999 元抵 2000 元限时膨胀金，限时焕新价 10.38 万元起。新车长宽高分别为 4615×1860（1883）×1673mm，轴距 2775mm；全系标配 4D 毫米波雷达与激光雷达，采用文远知行 L4 级 Robotaxi 同源的一段式端到端大模型；搭载广汽埃安弹匣电池 2.0 技术，采用全球首款非晶合金碳化硅电驱，官方数据显示其百公里电耗低至 11.7kWh。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/993/255.htm", "publishedAt": "2026-08-23T10:47:21+00:00"}, {"title": "AI 机器人进厨房：橡鹿机器人全球首发三款烹饪机器人产品", "summary": "IT之家 8 月 23 日消息，据新华网报道，橡鹿机器人今日在 2026 世界机器人大会全球首发三款新品：多模态烹饪 AI 基座 CookingMuse 厨启、3K 视觉 AI 炒菜机器人和具身烹饪机器人“现炒方舟”。IT之家从原报道获悉，3K 是一款融合了 AI 视觉与烹饪智脑的智能 AI 炒菜机器人，它拥有三颗 4000 万像素全局快门工业相机，以 30 FPS 的帧率捕捉锅内画面，再交由百万级菜品数据训练的 AI 大模型实时判断食材状态，让 AI 能够“看到”锅里的变化，并依此自主决策。同时，这款机器人能够将出品管控从“事后”提前到“事中”，提升餐饮品牌的后厨运营效率。解决过去炒菜机器人只能按预设程序执行，导致材料大小、解冻状态出现变化时出品波动的问题。该产品能以毫秒动态级调整加热功率、炒制时长等，食材不一致、菜盒没放对，也能炒得好。而现炒方舟则是一款基于具身智能机器人打造、可移动的微型无人后厨解决方案，它可以跑通净菜保鲜储存、现烹饪、供碗出餐、油烟处理，到设备自清洁的全流程无人化闭环，相当于一个不需要厨师、不需要排烟施工、不需要固定店面的小型移动无人餐厅。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/993/248.htm", "publishedAt": "2026-08-23T10:01:14+00:00"}, {"title": "匿名牛来大模型被扒出智谱血缘，也有人怀疑Cursor拿开源GLM训的", "summary": "Tokenizer、视频编码、API报错全扒一遍", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/478191.html", "publishedAt": "2026-08-23T09:56:12+00:00"}, {"title": "OpenAI Codex 明天重置额度，并修复近期出现的用量消耗快问题", "summary": "IT之家 8 月 23 日消息，OpenAI Codex &amp; ChatGPT 团队负责人蒂博 · 索蒂奥（Thibault Sottiaux）今天在 X 平台发文，回应近期网友提出的用量消耗过快问题，并将在明天为所有 Codex 订阅用户重置额度。据蒂博所述，他们目前发现了三个影响用量计算的问题：a：在长时间会话中使用图片并进行多次上下文压缩（compaction）时，存在效率问题；b：计算机历史记录（Computer History）的 P95 及上分位数使用量较高；c：原本用于生成对话标题的某项功能，消耗使用量比预期稍多。OpenAI 现已组建专项团队排查上述问题，并计划明天推出修复措施。公司还发现一种全新方案提升使用效率（与上述问题完全无关），将在下周着手开发。此外，OpenAI 将于太平洋时间明天下午 14:00 左右，为所有订阅用户重置额度。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/993/235.htm", "publishedAt": "2026-08-23T09:11:30+00:00"}, {"title": "皮尤研究中心：ChatGPT 问世以来的新网页中，三分之一存在 AI 痕迹", "summary": "IT之家 8 月 23 日消息，据外媒 TechCrunch 报道，当地时间 20 日，皮尤研究中心发布的一项研究显示，自 2022 年 11 月 ChatGPT 问世后发布的网页中，超过三分之一可能带有 AI 生成痕迹。这一结果与其他研究相互印证，表明近年来新增的大量网页已经由 AI 直接生成，或经过了 AI 的“魔改”。就在这一研究发布前不久，互联网基础设施服务商 Cloudflare 指出，机器人产生的网络流量已经超过人工访问流量，比此前预测的还要来得更早。皮尤研究中心此次研究关注的重点在于“互联网上哪些内容正在被访问”。研究结果显示，大量网页可能正在形成一种由机器人阅读机器人生成内容的循环。为了开展研究，皮尤研究中心利用 Common Crawl 网页存档收集了过去约 5 年的近 50 万个英文网页。研究人员随后借助 Open Pangram 的技术，判断这些网页是否可能由 AI 编写或经过 AI 大量修改。在 2026 年 7 月随机抽取的 1 万个网页样本中，约 10% 的网页显示出明显的 AI 创作迹象。皮尤研究中心指出，由于随机样本中必然包含一些较早发布的网页，而这些网页发布时 AI 写作工具尚未出现，因此这些网页不可能由 AI 生成。因此，为了更准确评估 AI 对互联网内容的影响，皮尤研究中心进一步剔除了 ChatGPT 发布前的旧网页，只分析 ChatGPT 问世后新增的内容。在这一调整后的样本中，35% 的网页存在 AI 创作迹象。从域名类型来看，.com 网站出现 AI 创作迹象的比例约为.edu 和.gov 网站的 10 倍。后两类网站中，AI 创作内容比例均约为 1%。.org 网站的比例则为 4.6%。皮尤研究中心承认这项分析存在局限。与其他 AI 检测工具一样，Pangram 存在误判可能，将人工编写的网页识别为 AI 生成。不过，从大规模样本来看，研究结果仍能反映整体趋势。研究还发现，一些通常被视为 AI 写作特征的表达方式近年来也更加常见：破折号、牛津逗号，以及“这不是 X，而是 Y”这类句式。IT之家注：牛津逗号（Oxford Comma）也称连续逗号（Serial Comma），是指在英语写作中包含三个或更多项目的列表里，在倒数第二项与连接词（如 and 或 or）之间使用的逗号。譬如在“A, B, and C”中，B 后面的那个逗号就是牛津逗号。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/993/234.htm", "publishedAt": "2026-08-23T09:02:48+00:00"}, {"title": "DeepSeek 发布多模态模型，“小鲸鱼”长出了眼睛", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/jlTfe57D4r0Juzpz8Fk5?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-21T19:34:36+00:00"}, {"title": "本地运行、支持视觉与工具调用：Meta 开源智能体模型", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/aGfkSN1YlmLrUQMPea9L?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-21T17:00:00+00:00"}, {"title": "不跟风、不堆模型，百度靠什么突围AI办公赛道？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/9x1ohAMlMpMCLdygg8Yf?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-21T16:47:55+00:00"}, {"title": "开源连接器网关 OpenConnector：让 AI Agent 安全调用 1000+ SaaS 服务", "summary": "Open-Connector 是一个面向 AI Agent 和应用开发者的开源连接器网关。项目旨在解决 AI Agent 接入外部 SaaS 服务时普遍存在的认证管理、权限控制、接口适配和运行审计等问题。 OpenConnector 可以将用户已经使用的应用账号连接到统一运行时，并向 Agent 暴露标准化的 Actions。项目目前提供覆盖 GitHub、Gmail、Notion、...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502067/oomol-lab-open-connector", "publishedAt": "2026-08-21T11:02:29+00:00"}, {"title": "突发| DeepSeek 多模态模型上新，鲸鱼终于开「天眼」了", "summary": "那个熟悉的 DeepSeek 终于又回来了。#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1676067?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-08-21T10:23:24+00:00"}, {"title": ":fire: SolonCode 是不是国产化替代 ClaudeCode 的优选？", "summary": "安全审计、代码脱敏、数据本地化，是国内企业换掉 ClaudeCode（或任何海外 AI 编码助手）的三条真实理由。但「能换」和「换得舒服」之间，还隔着很多具体细节——安装、配置、模型选择、代码理解能力、与既有工程线的兼容性，一项项都比较清楚，才能判断谁才是「最优」。 本文不喊口号，逐条对照，结论在最后。 二、Sol...", "sourceName": "开源中国", "sourceUrl": "http 产品发布/更新", "items": [{"title": "谷歌 Pixel 11 Pro 手机拆解揭示 HiLight 背后的秘密：硬件为 8 颗 RGB LED", "summary": "IT之家 8 月 24 日消息，随着 Pixel 11 系列手机的发布，谷歌推出了一个新的后置视觉提醒环，名为 HiLight，正式取代了前几代 Pixel 上的红外温度传感器。IT之家注意到，该硬件直接围绕后置相机条上的闪光灯构建，并覆盖全系列机型。目前，HiLight 作为一款专用指示灯，在 Gemini 助手激活时脉冲闪烁，当手机屏幕朝下放置时，会为来自收藏联系人的来电发出亮光。尽管谷歌在发布会上宣布该功能将支持短信，但这一能力在发布时缺失。此外，HiLight 不支持第三方应用集成，这意味着用户无法为单个应用分配特定颜色，以便一眼识别通知来源。视觉自定义也受到严格限制，用户只能从五种预设颜色中选择，且没有红色选项。为了弄清 HiLight 功能的确切工作原理，YouTuber Phone Repair Guru 对 Pixel 11 Pro 进行了详细拆解。移除后盖玻璃并拧下固定后置相机条的支架后，视频清晰展示了该模组。该组件包含 8 颗表面贴装的 LED，环绕中央相机闪光灯排列成圆形。在这些 LED 正上方是一块磨砂白色光学扩散板，用于将各颗灯珠融合成平滑、连续的辉光。为了确认硬件是否真正支持 RGB，该 YouTuber 移除了扩散板，将裸板置于强力显微镜下观察。在放大下，8 颗 LED 中的每一颗内部都清晰可见独立的红、绿、蓝三色发光二极管，证明谷歌安装的确实是 RGB LED。这位 YouTuber 还指出，从技术上讲，可以通过永久移除扩散板来改装设备，直接暴露原始 LED。最终，拆解证明 HiLight 的限制完全基于软件，谷歌目前故意将该功能限制为仅支持几个基本触发条件和预设颜色。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/993/325.htm", "publishedAt": "2026-08-23T23:11:34+00:00"}, {"title": "三星 Galaxy S27 Ultra 手机后盖工程图流出，可能存在两个版本", "summary": "IT之家 8 月 23 日消息，微博博主 @i冰宇宙 今日放出了三星 Galaxy S27 Ultra 手机的后盖工程图，显示该机目前存在两个版本：一个和后摄模组对齐，一个靠下。X 平台消息人士 Sonny Dickson 随后表示，Galaxy S27 Ultra 将有两种尺寸。如果消息属实，这将是三星 Galaxy S Ultra 系列直板手机首次推出不同尺寸版本。从图片来看，Galaxy S27 Ultra 的主摄和超广角摄像头采用纵向排列，5 倍长焦镜头与闪光灯一起被放置在胶囊形区域内，过去的 3 倍长焦镜头则可能被取消。结合IT之家此前援引韩媒消息，三星电子明年推出的 Galaxy S27 系列手机将全系配备 3 颗后置摄像头。此次调整的核心在于，Ultra 机型后置镜头数量从 4 颗缩减至 3 颗。之前一直搭载的 1000 万像素 3 倍长焦摄像头将取消，而 5000 万像素 5 倍潜望长焦镜头将继续保留。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/993/303.htm", "publishedAt": "2026-08-23T14:07:20+00:00"}, {"title": "他给了王兴兴第一个200万，现在给下一个「宇树」当董事长", "summary": "多多支持像王兴兴这样优秀的具身机器人创业者", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/478234.html", "publishedAt": "2026-08-23T11:17:22+00:00"}, {"title": "英伟达AI服务器将涨价15%！1GW数据中心成本激增50亿美元", "summary": "内存成本飙升逼涨硬件", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/478164.html", "publishedAt": "2026-08-23T09:51:49+00:00"}, {"title": "Cloudflare 推出 Agent Tracing：支持截断限制，不同框架的 Payload 默认记录策略存 微软英国超大规模 AI 数据中心项目遇阻，遭 4 万居民联署反对", "summary": "IT之家 8 月 23 日消息，据外媒 Neowin 当地时间 21 日报道，微软计划在英国利兹斯凯尔顿农庄建设一座超大规模 AI 数据中心园区。其规模包括 3 栋建筑，总建筑面积达到 4.65 万平方米。这项计划遭到当地居民反对，社区发起了要求阻止项目获得最终规划批准的请愿，目前已收集到 4 万个签名。项目所在地原为一座发电站。Harworth Group 于 2014 年仅以 300 万英镑（IT之家注：现汇率约合 2,755.6 万元人民币）买下约 65.6 公顷土地，之后以 1.066 亿英镑（现汇率约合 9.79 亿元人民币）出售给微软。利兹规划委员会目前只是有条件批准项目开工，最终仍需首席规划官马丁 · 埃利奥特签字批准。参与发起请愿的 100 人指出，室外气温达到 29℃ 时，数据中心的日常运营将消耗大量水资源。他们认为，气候变化导致当地达到 29℃ 的情况越来越常见。除了夏季少数几周，利兹的气温通常远低于这一水平。以本周为例，即使正值夏季，预计最高气温也只有 24℃。居民担忧的还有数据中心庞大的用电需求。俄罗斯天然气进口停止后，英国已经面临高昂的能源价格，家庭平均年度能源账单目前超过 2,500 美元（现汇率约合 16,858 元人民币）。数据中心带来的额外电力需求，可能进一步推高能源价格。请愿发起者表示，目前仍有机会阻止项目获得最终批准；即使项目获批，也可以通过法律途径提出挑战。他们认为，项目此前没有得到充分公示，公众没有获得适当的反对机会，对项目潜在影响的审查也不够充分。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/993/242.htm", "publishedAt": "2026-08-23T09:49:59+00:00"}, {"title": "AI 即将接管流量，而广告正在疯狂「末日反扑」", "summary": "我们在腌臜的广告泥潭中，畅想着美好的 AGI 未来。#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1676208?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-08-23T03:53:55+00:00"}, {"title": "Windows 是 AI PC 路上的绊脚石", "summary": "你知道我不想离开 你知道我有多无奈#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1676189?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-08-22T10:00:42+00:00"}, {"title": "JetBrains详细阐述了控制AI支出快速增长的首批举措", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/CQhb4TOREpEZshtqWZMy?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-22T09:05:00+00:00"}, {"title": "神秘“Ox Alpha”突袭 OpenRouter，性能超过 Fable 5？全网盲猜智谱 or 小米", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/3MNJh5F34GSsRQJJWJzY?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-21T19:41:49+00:00"}, {"title": "材科源图三个月完成两轮融资，AI全链路闭环加速材料产业化", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "ht the-august-17-outage-and-the-work-ahead", "publishedAt": "2026-08-21T02:15:26+00:00"}, {"title": "AI 开始改写癌症治疗，真相是什么？", "summary": "「可编程疫苗」改变世界#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1675934?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-08-20T15:06:13+00:00"}]}, {"label": "论文研究", "items": [{"title": "加州伯克利数学教授撰文批评学生基础差，却被抓包“用 AI 写的”", "summary": "IT之家 8 月 23 日消息，据英国《卫报》20 日报道，加州大学伯克利分校数学教授兹韦兹德利娜 · 斯坦科娃日前在《旧金山标准报》撰文批评部分学生存在“严重”的数学基础缺失，却又承认文章本身曾借助 AI 编辑，由此引发争议。《旧金山标准报》上周刊登了斯坦科娃一篇约 2000 词的评论文章。她指出，自己教授的一些数学课学生水平落后“五到八年”，连分数和基础代数等初中阶段知识都没有掌握。斯坦科娃将问题归咎于加州大学不参考标准化考试成绩的招生政策，认为 SAT 这类长期沿用的衡量标准取消后，一些尚未做好准备应对课程难度的学生也被录取。上周末，加州大学伯克利分校学生报《加州人日报》的记者发现，这篇文章的语言带有 AI 生成痕迹。伯克利大二学生弗朗西斯 · 罗表示，他们使用 AI 检测工具 Pangram 进行检查后，软件判断文章有 33% 的内容由 AI 生成或经过 AI 协助。斯坦科娃随后承认，自己确实使用 AI 软件帮助编辑文章，但文章是累计数百小时高强度人工工作的成果，其中约 80 小时由她本人完成。她还通过电子邮件说明，自己用 AI 查找与这项倡议有关的大量文件和文章，但所有分析均由团队成员完成。《旧金山标准报》在被问及 AI 使用政策时回应称：“AI 可以提供协助，但我们的要求是，我们刊登的每一篇文章背后都必须有人类作者，并由人类对每一个字负责。我们在与这篇评论文章作者合作时的理解一直都是，这篇文章体现了她和同事进行的大量原创分析、研究以及专业工作。”斯坦科娃承认使用 AI 后，社交媒体上也出现了关于学者使用 AI 的更广泛争论。一些批评者认为，一篇讨论学生准备不足的文章却依靠 AI 协助，本身颇具“讽刺意味”；还有人认为，评论文章应该完全由作者原创，不应使用人工智能辅助。支持斯坦科娃的人则认为，使用 AI 并不是严重问题，围绕 AI 的争论反而偏离了文章真正讨论的内容。斯坦科娃在电子邮件中回应：“AI 究竟怎么用…… 与我们团队为推动恢复招生标准化考试投入的数千小时工作并无直接关系，反而转移了对真正问题的关注。”近年来，加州大学是否应该恢复 SAT、ACT 等标准化考试要求，争议持续升温。2020 年，加州大学董事会投票决定逐步取消申请时提交标准化考试成绩的要求，哈佛大学、斯坦福大学、麻省理工学院和耶鲁大学等高校当时也做出了类似决定。此后，这些高校已经全部恢复了上述要求。斯坦科娃在评论文章中引用了自己和同事分析的数据。结果显示，加州大学实行不参考标准化考试成绩的招生政策后，在修读微积分 I 之前存在“严重基础不足”的学生人数增加到原来的 3 倍。文章发表前，斯坦科娃还与超过 3000 名加州大学教职员工共同签署了 6 月的一封公开信，支持恢复招生考试。作为公开信作者之一，她表示，信件编辑过程中也使用了 AI。加州大学系统本身还设有“AI 委员会”，协助各校开发 AI 项目和资源。委员会成员卡米尔 · 克里滕登表示，她并不清楚学校是否针对教师在个人研究或评论文章中使用 AI 制定了具体规定。对于 Pangram 这类工具，她指出：“大多数 AI 检测工具仍然相当不可靠，而且缺乏细致判断能力。”Pangram 则在官网宣称，识别 AI 生成文档的准确率达到 99.66%，平均约每扫描 24000 份文档才会误判一次。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/993/309.htm", "publishedAt": "2026-08-23T14:33:38+00:00"}, {"title": "挪威呼吁校园内禁止使用 AI 眼镜", "summary": "IT之家 8 月 23 日消息，据 CCTV 国际时讯援引挪威广播公司报道，挪威负责中小学教育及幼教事务的大臣卡丽 · 内萨 · 诺尔敦当地时间 8 月 22 日呼吁，挪威各地方政府和学校应通过学校规章制度，禁止在校园内使用 AI 眼镜。据悉，挪威政府目前限制在学校场景下使用 AI，要求小学 1 至 7 年级学生原则上不应使用生成式 AI；初中阶段则“应逐步、谨慎地引入生成式 AI”。延伸阅读据IT之家了解，早在 2026 年 6 月，挪威政府就已宣布，从 8 月下旬新学期开始，在小学（1-7 年级，6-13 岁）全面禁止使用生成式 AI 工具，并计划通过立法要求学校提供更多实体教材。挪威首相约纳斯 · 加尔 · 斯特勒当时表示，自 2015 年前后，挪威学生的整体学习成果持续下滑，关键因素之一就是智能手机、电子屏幕和算法，而无批判地使用 AI 会导致学生跳过关键的学习步骤。此次针对 AI 眼镜的呼吁，是对此前校园 AI 禁令的进一步细化。与此同时，韩国也在积极应对 AI 眼镜带来的作弊风险。今年 6 月，首尔市教育厅已通知禁止中小学生戴 AI 眼镜参加期末考试，并提醒监考教师重点留意反复触碰镜框的学生。此前，韩国两名考生因在托业英语能力考试中利用 AI 眼镜作弊，被处以成绩作废且 4 年内不得再考的处罚。韩国教育部正考虑在 11 月举行的大学修学能力考试（CSAT）中明确将 AI 眼镜列入禁带物品清单。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/993/260.htm", "publishedAt": "2026-08-23T11:28:01+00:00"}, {"title": "2026科学智能大会圆满闭幕，近50位院士凝聚共识推进AI4S赋能科学研究", "summary": "2026科学智能大会成功举办 ——以“智能驱动”重塑科研范式，推进人工智能赋能科学研究 8月21-22日，2026科学智能大会在北京成功举办。作为我国人工智能赋能科学研究（AI for Science，简称AI4S）领域最高规格的学术盛会，本次大会由“学术科协”科学智能专家委员会提供学术指导，以“人工智能变革科研范式”为主题，通过...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502074", "publishedAt": "2026-08-22T11:23:02+00:00"}, {"title": "2026科学智能大会在京召开，聚焦“人工智能变革科研范式”", "summary": "2026年8月21日，以“人工智能变革科研范式”为主题的2026科学智能大会全体会议在北京中关村国际创新中心隆重举行。本次大会是2026中关村论坛系列活动之一，由中国科技发展基金会、北京科学智能研究院主办，《科技导报》、Research、《前瞻科技》、Science及中国科协科技期刊集群提供学术支持。 中国科协党组书记、分管日...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502071", "publishedAt": "2026-08-22T00:01:34+00:00"}, {"title": "2026科学智能大会在京开幕 聚力推动科学智能向科研实践深入", "summary": "2026科学智能大会在京开幕 聚力推动人工智能赋能科学研究 8月21日，2026科学智能大会在北京海淀中关村国际创新中心开幕。大会由“学术科协”科学智能专家委员会提供学术指导，以“人工智能变革科研范式”为主题，汇聚近50位院士、80余位青年学者、百余场高水平学术报告。中国科协党组书记、分管日常工作的副主席、书记处...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/502069", "publishedAt": "2026-08-21T23:34:41+00:00"}, {"title": "Unsloth Dynamic 3.0 GGUF 发布，同体积下准确率再提 10%", "summary": "Unsloth 今天发布了 Dynamic 3.0 量化方案，首发 Qwen3.8-27B 量化版本。相比 v2.0，新版本在同等磁盘空间下 top-1% 准确率提升超过 10%，KL Divergence 指标全面优于所有其他量化提供商。 准确率提升来自几个方面：更高质量的 imatrix 校准数据集（从多样化数据源构建，针对 ag const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
