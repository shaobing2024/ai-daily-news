https://www.ithome.com/0/991/360.htm", "publishedAt": "2026-08-18T15:44:56+00:00"}, {"title": "豆包视频通话升级，火山引擎多模态传输系统提供技术支撑", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/kJK3qG9m7UEYtf7siCgU?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-18T14:46:57+00:00"}, {"title": "百度 2026 Q2 业绩会实录：文心将重回 AI 第一梯队，年底前完成香港主要上市", "summary": "百度发布 2026 年第二季度财报，季度总营收 313 亿元；百度一般性业务收入 252 亿元，其中 AI 业务收入占比 50%，已连续两季占比过半。本季度，AI 云基础设施中 GPU 云同比增长 283%，连续四个季度实现三位数增长。财报发布后，百度董事长兼 CEO 李彦宏，移动生态事业群总裁罗戎，智能云事业群总裁沈抖，CFO 何海建等高管出席随后召开的财报电话会议，解读财报要点并回答分析师提问。以下为本次电话会议分析师问答环节的主要内容：摩根大通分析师 Alex Yao：感谢管理层接受我的提问。随着数万亿参数的大模型快速涌现，不断刷新基准测试的性能上限，百度如何看待文心在此处的竞争定位？在近期引进资深基础大模型人才之后，文心的核心技术与产品重点是什么？投资者应当对它下一阶段的发展抱有怎样的预期？谢谢。首先，从行业视角来看，基础大模型仍在快速迭代。大致每隔几个月，就会有不同模型在某些能力上取得领先。这表明该领域依旧高度变化，竞争格局远远没有尘埃落定。在这样的市场当中，我们认为长期竞争力往往归结于持续的技术投入、以应用为驱动的思路以及耐心。百度一直是一家相信技术、并且愿意对技术做长期投入的公司。过往经验反复证明，有价值的技术创新需要耐心和坚持。如今，百度很多重要的人工智能资产，包括昆仑芯以及萝卜快跑，都是超过十余年持续投入的成果。它们已经成为我们差异化竞争力的核心来源，并且它们的性能和商业价值正在获得越来越广泛的认可。对此，我们深感自豪。同样，文心一直是百度人工智能战略以及全栈人工智能能力当中重要的一环。我们属于中国最早投入基础大模型的一批企业。一路走来，过程中有尝试也有失误，但是我们要让文心具备竞争力的决心从未动摇。展望未来，我们会持续投入所需资源，推动文心持续发展。作为这项工作的一部分，我们进一步优化了组织架构，近期引进顶尖人工智能人才。我们有信心加快人工智能迭代，让文心重新回到基础大模型的第一梯队。展望未来，我们会继续采取应用驱动的方式。基础大模型覆盖的能力范围十分广泛，没有任何一个模型能够在所有维度永远保持领先。因此，我们将聚焦对百度各类应用最重要的能力，让文心在这些领域做到最强，包括 AI 搜索、数字人、秒哒、伐谋，还有豆包这类通用智能体。这些应用是推动文心持续迭代改进的关键组成。我以 AI 搜索举例：当我们提升文心理解用户意图、评判内容质量的能力时，我们会直接把这些改进落地到搜索以及信息流业务。这让我们能够快速看到结果，识别出仍待改进之处，并且把相关数据反馈回模型训练，让我们的模型在用户意图理解、内容质量评判方面变得更加出色，并且我们完成这个闭环，把它作为文心发展的一条重要路径，这条路径可以将技术进步更加直接地转化成更优质的产品体验，实实在在的用户价值与商业价值，并最终惠及更加广泛的用户与企业。谢谢。花旗银行分析师 Alicia Yap：管理层晚上好。感谢接受我的提问。我的问题关于云业务。百度 AI 云基础设施的营收维持高速增长，管理层能否谈一谈核心增长驱动因素，还有你们对接下来几个季度营收增长的展望？另外随着业务扩大规模，我们应当如何看待长期利润率潜力？谢谢。沈抖：二季度 AI 云基础设施营收同比增长 50%。我认为这依旧是一个强劲的增速，高于行业平均水平。放在更长周期来看，我们的 AI 云基础设施已经连续多个季度维持高速增长，持续跑赢行业。本季度的亮点是 GPU 云，它的营收同比增长 283%，实现连续第四个季度三位数增长，相比一季度的 184%，增速进一步加快。展望未来，我们看到有多项驱动因素支撑持续增长。当前，中国市场对 AI 算力的需求依旧十分旺盛，随着 AI 更加深度嵌入现实应用以及业务工作流，尤其是推理业务持续快速扩大规模，我们预计需求会进一步增长。与此同时，我们的客户群体同样在快速扩张，不同规模的新客户开始使用我们的 AI 云基础设施，而现有的核心客户也持续提升使用量与支出规模。需求也正在向更多行业与使用场景扩散，包括互联网、游戏、具身智能、自动驾驶、智能手机、金融服务以及其他领域。事实上，最重要的一点是，我们已经搭建并持续强化具备差异化的全栈 AI 架构，覆盖芯片、云基础设施、大模型以及应用，每一层都具备有竞争力的产品。尤其是在应用层，我们较早布局，搭建了一套智能体与 AI 应用产品矩阵，伐谋、豆包、秒哒等产品已经获得市场认可，强化了我们抓住越来越多元 AI 机遇的能力。因此，基于当下的需求趋势、我们的客户储备以及这些差异化优势，我们有信心 AI 云收入在下半年可以维持强劲增长，并且存在进一步加速的可能性。在盈利能力方面，正如你刚刚提到的，对于营收高速增长的同时盈利持续改善，我们感到欣喜。二季度，AI 云基础设施的利润以及利润率均实现同比上涨。展望未来，我们认为多项因素将支持利润率进一步扩张。第一，GPU 云的增速显著高于 AI 云基础设施整体，并且持续在收入结构当中占据很高占比。同时相比传统 CPU 云，GPU 云拥有更可观的利润率水平；依托持续优化产品与客户结构、提升资源利用率以及运营效率，随着其规模扩大，利润率还有进一步改善的空间。因此随着 GPU 云的贡献占比提升，这种结构变化会持续推高整体利润率。第二，在 MaaS 业务上，千帆平台外部客户调用 Token 带来的营收正在高速增长，不过 MaaS 在我们 AI 云基础设施总营收当中占比仍然相对较小。但我们目前看到的早期发展势头十分喜人。随着使用规模扩大、单位推理成本持续下降，我们相信长期来看 MaaS 相关业务能够释放更多盈利潜力，对利润率做出越来越重要的贡献。最后，我们的全栈 AI 能力以及自研芯片同样带来端到端的成本优势，可以助力利润率扩张。综合来看，我们认为 AI 云业务的利润率长期仍然存在很大的提升空间。谢谢。美银美林分析师 Miranda Zhuang：感谢管理层接受我的提问。我的问题和利润率相关。AI 驱动业务如今占到营收的一半，同时资本开支持续攀升，你们如何看待百度营业利润率的发展路径？管理层将如何平衡持续的 AI 投入与盈利目标？谢谢。何海建：本季度 AI 驱动业务继续占到百度通用业务营收的一半，进一步凸显 AI 在我们业务当中的核心地位。在 AI 驱动业务板块内部，AI 云基础设施营收高速增长，利润同样快速上涨，利润率同比改善。在 AI 云基础设施当中，我们的 GPU 云业务通常具备更优秀的利润率，它在总营收当中的占比持续走高。随着业务结构持续转变，叠加旺盛的市场需求，还有自研芯片、全栈 AI 能力带来的成本优势，我们相信 AI 云基础设施的利润率长期仍然具备可观的扩张空间。随着业务扩大规模，我们同样预期资源利用率提升、经营杠杆增强，会进一步支撑利润率扩张。我们同样看到 AI 应用拥有可观的长期盈利潜力。这类应用当中很多产品天然具备用户粘性，并且以订阅模式为主；随着用户采纳规模扩大、商业化推进，它们有机会实现越来越亮眼的利润率，我们预期它们会对整体盈利做出更为重要的贡献。与此同时，我认为我们依旧处在 AI 投资周期当中，我们进行投资的决心毫不动摇。我们坚定地投入，但同等重要的是，我们审慎开支，高度关注投资回报率。我们的投资由客户以及内部业务真实明确的需求驱动，让我们大部分 AI 投入可以快速落地，在相对较短时间内就开始产生营收贡献。此外，我们持续强化供应链管理能力，我们相信这会在业务规模扩张的过程中，持续帮助我们提升资本效率。综合这些优势，我们对投资回报有较好的预判，并且有信心持续提升投资效率。即便如此，不同 AI 投资项目的回报周期各不相同，部分项目需要更长时间才能兑现。我们正处在投资的关键阶段，我们计划坚决投入那些对长期竞争地位最重要的领域，同时对投入资本回报率、运营效率以及现金流保持同等严格的管控。随着我们 AI 业务进一步扩大规模、商业化走向成熟，我们相信这些投资会越来越多地转化为可持续的利润增长。谢谢。高盛分析师 Lincoln Kong：感谢管理层接受我的提问。能否向我们更新昆仑芯拟议上市的进展，以及接下来的关键里程碑？我想知道什么因素会驱动它未来的增长，管理层如何看待它长期商业潜力，还有它在百度 AI 生态当中的战略定位？谢谢。沈抖：上市流程仍在推进当中，一旦有更多信息，我们会第一时间向市场更新。从业务角度，基于以下几点原因，我们对昆仑芯长期增长以及商业潜力保持高度信心。第一，放眼整个行业，不管是训练还是推理场景，AI 算力需求持续上涨；模型能力持续提升，越来越多应用落地真实场景，尤其是智能体技术进步，拓展到更加广泛的使用场景。因此我们看到推理算力需求增速尤其加快。我们相信该趋势会延续，为 AI 芯片行业带来长期结构性增长机遇。第二，国内市场具备巨大增长潜力，同时算力供给在一段时间内大概率仍会处于紧张状态。在这样的大背景之下，客户越来越渴求高性能、高可靠、高性价比的国产 AI 芯片。因此我们相信，这给技术实力强劲、具备大规模交付能力的芯片厂商创造大量机会。历经十余年投入，昆仑芯已经在芯片性能、软硬件一体化、主流模型与框架适配、大规模落地部署方面搭建扎实能力，收获越来越多客户认可。这些优势让昆仑芯可以在这个市场占据有利位置，把握住中国不断增长的 AI 算力需求带来的商业机会。第三，在百度 AI 生态内部，昆仑芯是我们全栈 AI 架构基础设施层的重要组成部分，这套全栈架构覆盖芯片、云基础设施、大模型以及应用。各个层级之间紧密协同，能够实现端到端优化，让我们交付更优异的性能、可靠性与成本效率。这支撑 AI 云基础设施以及我们其他 AI 业务的长期落地部署，同时进一步强化百度全栈 AI 能力的竞争力。展望未来，我们预期昆仑芯会持续在我们 AI 基础设施当中发挥重要作用，抓住更多商业机遇，服务更加广泛的市场需求。谢谢。瑞银证券分析师 Wei Xiong：管理层晚上好，感谢接受我的提问。能否为我们梳理香港双重主要上市转换的预期时间线，以及纳入港股通的可能性？另外背后的战略逻辑是什么？长期来看，这件事会对百度的投资者群体、股票流动性以及估值产生怎样的影响？谢谢。何海建：我先讲时间线。我们董事会早在 7 月就批准了转换为双重主要上市。我们也已经向港交所递交申请，并且收到港交所的收悉回执。下一步是定于 8 月 26 日召开的临时股东大会。会上，我们将提请股东批准完成转换所需要的若干事项。在此之后，在港交所审批通过、并且满足其他适用申请条件的前提下，我们预计今年之内完成转换生效。关于港股通，完成双重主要上市之后，我们也在积极准备争取纳入港股通，希望我们股票能够尽早被纳入。当然，这件事依旧需要满足对应的资格要求、走完审核流程，取决于相关交易所的最终决定。至于背后的逻辑，双重主要上市的核心目的就是拓宽我们的投资者基础，提升股票流动性，同时让我们可以更加灵活地对接香港与美国两大资本市场。它同样可以让更多投资者，尤其是亚洲地区的投资者，能够更好理解、参与这家以 AI 为核心的百度的价值。往更远看，如果后续我们成功纳入港股通，我们预计这会显著扩大中国大陆投资者的参与度，长期助力股东结构进一步多元化。后续取得更多进展，我们会及时同步市场。杰富瑞分析师 Thomas Chong：晚上好，感谢管理层接受我的提问。管理层能否向我们更新 AI 搜索在产品能力、用户体验以及商业化三方面的进展？我们看到二季度网络营销收入持续承压，主要影响因素是什么？管理层如何看待该业务下半年走势？罗戎：过去几个季度，我们推进 AI 搜索转型的重心，就是提升 AI 回答的质量，以此大幅优化用户体验。准确性与权威性一直都是我们的核心优势，在 AI 转型推进过程当中，我们一直在着力巩固这些优势。如今，我们的 AI 搜索可以更好理解用户想要查找的内容。输出的答案可靠性更强，结构更加清晰，并且以多样化形式进行呈现；与此同时，幻觉率维持低位，我们的模型现在分辨内容优劣的能力变得更强。因此，我们输出更多高质量回答，低质量回答变少。用户对这些改动反馈十分积极，我们看到用户满意度、搜索意愿以及用户留存稳步提升。本季度，我们进一步把 AI 搜索和文心助手打通，把单次搜索回答转化成逻辑更连贯、具备交互性的多轮对话，可以更好处理用户追问以及更加宽泛的用户需求。同时我们持续强化工具调用、多步骤规划以及复杂任务执行能力，帮助用户完成更多事情。近期，文心助手的任务智能体在两项极具影响力的第三方智能体基准评测当中取得靠前成绩，分别是聚焦现实世界复杂任务的全球基准 PinchBench V2，还有国内主流智能体产品评测 Super CLUE-X Claw。我认为这些评测结果印证了文心助手在工具调用、多步规划以及任务执行方面的领先能力。即便如此，行业竞争依旧十分激烈。随着空中出租车这类新产品形态持续获得市场认可，用户获取、消费信息的方式持续演变，争夺用户时间与注意力的竞争进一步加剧。与此同时，我们持续推进 AI 搜索转型，并且主动克制 AI 搜索的商业化变现。以上两点在短期之内都对我们广告业务形成拖累。考虑到这类市场态势大概率还会延续，我们预期广告业务在下半年依旧会面临压力。商业化层面，我们当前的优先事项依旧是打磨产品，做好用户体验。随着模型能力、用户体验以及任务复杂度持续提升，我们相信未来会涌现更多和 AI 交互体验天然适配的商业化机会。（完）", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/991/340.htm", "publishedAt": "2026-08-18T14:26:56+00:00"}, {"title": "世界人工智能开源大赛（GOAI）初赛评审正式启动，全球AI创新项目进入首轮遴选", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/gC7CU8lbYmha1QPMvqP7?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-18T13:22:04+00:00"}, {"title": "小米 CFO 林世伟：MiMo 首款个人桌面应用即将上线，新一代模型也在训练中", "summary": "IT之家 8 月 18 日消息，小米集团 CFO 林世伟今天（18 日）晚间在财报电话会上披露，小米 MiMo 近期将推出首款个人桌面端应用，可帮助用户一站式完成办公生活任务。新一代 MiMo 模型也正在训练中，有望很快发布。商业化方面，林世伟透露，当前 MiMo 大模型 Token Plan 已经开始贡献收入，增速较快。不过小米 AI 业务仍在大规模投入期，暂不以变现为主要目的，将继续推动 AI 重构人车家全生态。今年 7 月，小米 MiMo V2.5 模型在全球大模型调用量平台 OpenRouter 上拿下月调用量和周调用量第一。林世伟表示，这主要基于小米 MiMo 在模型能力推理效率和成本控制上的系统性优势。据IT之家此前报道，今年 6 月 11 日，小米 MiMo 官方正式发布并开源 MiMo Code V0.1.0 —— 一款运行在终端里的探索性 AI 编程助手。据介绍，它内置限时免费多模态模型 MiMo-V2.5，同时支持接入 DeepSeek、Kimi 和 GLM 等主流模型，以及第三方 Token Plan，满足不同开发者的需求。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/991/324.htm", "publishedAt": "2026-08-18T12:59:52+00:00"}, {"title": "全球首款 Prof. Jimmy Choo 联名车：全新一代智己 L6 都市高定轿跑发布，预售权益价 21.99 万元起", "summary": "IT之家 8 月 18 日消息，全球首款 Prof. Jimmy Choo 联名车 —— 全新一代智己 L6 今晚正式发布。新车定位“都市高定轿跑”，全系预售权益价 21.99 万元起。全新一代智己 L6 各版本价格如下：Prof. Jimmy Choo 高定限定版（76kWh）：23.49 万元；Prof. Jimmy Choo 高定限定版（93kWh）：24.99 万元；Max 版：21.99 万元；Pro Max 版：23.49 万元；Ultra 版：26.99 万元。据介绍，全新一代智己 L6 尺寸为 4924×1960×1474mm、轴距达 2950mm，全系配备全新一代「NEO 三电架构」、全新一代线控底盘、全新一代智能体验和新奢华高定座舱。全新一代「NEO 三电架构」全新 NEO 飓风电机IM ECU Master 能效大师管理系统 3.0全域 800V 高压纯电平台全新一代线控底盘全线控四轮转向双向 18° 智慧后轮转向德国大陆 MK C2 线控制动德国大陆 Conti 前四活塞卡钳全新一代智能体验全面适配 Momenta 世界模型IM Ultra AgentIM AD 高级辅助驾驶全功能包无图 NOA（高速 ETC | 环岛通行 | 路口掉头）一键 AI 代驾（一键智能泊车 | 一键脱困 | 一键贴边 | 一键循迹）新奢华高定座舱丹麦 B&amp;O 豪华音响5.7L 冷暖冰箱一体式瞬感智控防晒天幕前排座椅通风 / 加热 / 按摩后排座椅加热IT之家附全新一代智己 L6 预售专属权益如下：据IT之家此前报道，今年 8 月 7 日，智己汽车官宣 Prof. Jimmy Choo 周仰杰加盟智己，担任全新一代智己 L6 高定设计大师。公开资料显示，周仰杰出生于马来西亚槟城，祖籍广东梅县，华裔鞋类设计师。他是英国帝国勋章获得者，2003 年获英国女王颁授大英帝国四等爵士勋位，2004 年获马来西亚拿督勋位，2011 年被评为世界杰出华人设计师，2012 年获“影响世界华人盛典”文化艺术领域奖项。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/991/316.htm", "publishedAt": "2026-08-18T12:39:28+00:00"}, {" rl": "https://www.oschina.net/news/501944", "publishedAt": "2026-08-15T11:12:31+00:00"}, {"title": "得物知识问答：复合检索 Agent 的系统设计实践", "summary": "知识问答的核心挑战是准确率和质量。一个回答要准确，需要：查得全（召回率），查得准（精准度），理解得对（多模态），看得对（权限隔离）。这些能力不是堆功能就能实现的，需要一个强大的 Agent 运行时来支撑。", "sourceName": "开源中国", "sourceUrl": "https://my.oschina.net/u/5783135/blog/19738367", "publishedAt": "2026-08-14T07:54:19+00:00"}, {"title": "Visual Studio Code 1.133 发布", "summary": "Visual Studio Code 1.133 版本现已发布。此版本为用户提供了更灵活的 Claude 会话体验，让长篇对话更易于跟进，并能在用户工作时实时刷新本地 HTML 预览。 更改 Claude 会话的模型供应商：在不重新配置 agent host 的情况下，在回合之间切换供应商。 无需登录 GitHub 即可使用 Agent 窗口：当无法登录 GitHub 时，可使用...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/501932/vs-code-1-133-released", "publishedAt": "2026-08-14T06:42:46+00:00"}, {"title": "GLM-5.3 正式发布：编程能力最强的开源模型", "summary": "智谱宣布正式发布 GLM-5.3。且 GLM Coding Plan 全员额度在今天 13:00 重置，所有用户后台「用量统计」可见使用额度回满。 与 GLM-5.2 相比，GLM-5.3 基座模型没变，但通过极致的后训练 Scaling 大大提高了模型的智能上界：数十倍的长程任务环境、更丰富多样的环境类型、超长的后训练时间。 公告称，充分的模型后训练涌现...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/501931", "publishedAt": "2026-08-14T05:51:38+00:00"}, {"title": "DeepSeek Harness 正式开源：一切皆插件，Agent 框架的新玩法", "summary": "DeepSeek 正式开源了 DeepSeek Harness（DSH）的 v0.1 开发者预览版——一个\"一切皆插件\"的 Agent 运行时框架，MIT 协议，源码已托管到 GitHub。 和市面上大多数 AI Agent 框架不同，DSH 的核心卖点不是模型能力，而是架构的开放性。它没有选择重头造一个插件系统，而是基于一个叫 Cordis 的元框架构建——Cordis 只负责...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/501925/deepseek-harness-developer-preview", "publishedAt": "2026-08-14T02:00:14+00:00"}]}, {"label": "产品发布/更新", "items": [{"title": "消息称谷歌 Googlebook 系列笔记本新品预览活动将于 9 月 15 日举行", "summary": "IT之家 8 月 19 日消息，据外媒 Chrome Unboxed 报道，谷歌已悄悄向部分媒体发出邀请，透露公司将于 9 月 15 日举办 Googlebook 新品预览活动，届时除了产品演示外，媒体还可以现场体验这些新款笔记本。谷歌在今年 2026 年 I/O 开发者大会期间首次公布了 Googlebook 高端安卓笔记本，将由 Acer、ASUS、Dell、HP、Lenovo 率先推出首批高端机型。与传统 Chromebook 不同，Googlebook 将基于 Android 技术栈打造，但 Google 目前尚未公布这一新操作系统的正式名称。此前曝光的 Googlebook 还显示，其将针对大屏幕和触控、键鼠等不同输入方式进行优化，并进一步强化 Android 应用和 Gemini 人工智能功能。如果 9 月 15 日活动消息属实，那么 Googlebook 距离正式上市应该已经不远。按照谷歌过去的产品发布节奏，这类媒体预览活动通常会在产品正式开售前不久举行，因此 Googlebook 很可能会在今年初秋（9 月末 10 月初）正式上市。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/991/380.htm", "publishedAt": "2026-08-18T23:05:59+00:00"}, {"title": "乘坐自动驾驶车辆害怕“没人”开车？Stellantis 新专利在玻璃上投射“虚拟司机”", "summary": "IT之家 8 月 18 日消息，即使相信无人驾驶技术，有些人看到驾驶席空无一人时仍会感到不安。知道车辆由计算机控制是一回事，亲眼面对一个没有司机的驾驶席又是另一回事。据外媒 CarBuzz 今天（18 日）报道，Stellantis 申请了一项颇具科幻色彩的专利，希望用“虚拟司机”缓解这种不安。目前，自动驾驶面临着多项棘手的问题，其中之一便是信任。人们早已习惯车里有一个负责掌控车辆的人，不仅能带来安全感，也方便乘客与驾驶员沟通。Stellantis 认为，全息影像或投影技术或许能够同时补上这两个缺口。按照专利描述，系统会持续判断每名乘员的位置和视线方向，再通过车内投影设备生成一名虚拟驾驶员，与车内乘客进行交流。虚拟驾驶员不会真的“坐”在驾驶席上，而是以类似 HUD 的形式出现在挡风玻璃上。乘客能够看到虚拟形象的反射，系统还会通过机器学习生成表情，让口型与合成语音同步，甚至可以在说话时把视线转向正在交流的乘客。乘客还可以选择自己的“司机”。系统可以根据车内乘员定制虚拟形象，让乘客更容易接受无人驾驶车辆。Stellantis 还设想了一种更进一步的应用，让真人远程驾驶员通过同一套系统“出现在”车内。在车辆驶出运行设计域，或者道路上出现系统难以处理的异常情况时，自动驾驶汽车或仍需人工接管。远程操作员介入时，不会只是从后台接管车辆。车内投影设备还会同步显示远程驾驶员的影像，让乘客感觉对方仿佛就在车内。远程驾驶员可以看向乘客、直接交流，而本人实际上可能坐在世界另一端的驾驶工作站。IT之家从报道中获悉，这样一来，远程驾驶员不仅可以让乘客知道自己已经发现车辆的问题或异常，也可以直接解释情况，告诉乘客车辆仍处于控制之中。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/991/361.htm", "publishedAt": "2026-08-18T15:48:03+00:00"}, {"title": "阿里云的野心，不在 Agent Builder", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/QekQuwv8UhxAcrOFgKM8?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-18T15:32:44+00:00"}, {"title": "英伟达 GeForce NOW 云游戏平台终于支持 Firefox 火狐浏览器", "summary": "IT之家 8 月 18 日消息，英伟达 GeForce NOW 云游戏平台现已正式支持 Firefox 浏览器，火狐用户终于可以在浏览器里玩到英伟达提供的云游戏。英伟达和 Firefox 表示，双方工程师过去数月来共同努力，让 Firefox 能够和 Chrome、Edge、Safari 和 Opera GX 一样直接游玩云游戏。如今，用户只需要打开最新版 Firefox，然后访问 GeForce NOW 官网并登录自己的账号，就能游玩超 2000 款云游戏。IT之家了解到，GeForce NOW 用户至少需要 15Mbps 网络连接，才能以 720P 60FPS 进行游戏；如果想要将画质拉高到 4K 120FPS，至少需要 35Mbps 网络连接。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/991/356.htm", "publishedAt": "2026-08-18T15:24:57+00:00"}, {"title": "微软暂时停用 Win11 系统 Copilot 任务栏搜索框，聚焦统一版 Copilot 开发工作", "summary": "IT之家 8 月 18 日消息，据科技媒体 Windows Central 今天报道，微软暂时移除了 Win11 系统的 Copilot 任务栏搜索框，同时将更多精力放在统一版 Copilot 应用上。IT之家从原报道获悉，微软曾于去年更新 Windows 11 的任务栏，允许用户将原来的普通搜索框替换成 Copilot 搜索框，让用户直接从任务栏与 Copilot 互动，同时继续支持搜索应用和文件。目前该功能仅通过预览形式向少数用户开放，大多数能用到该功能的人都是 Microsoft 365 Copilot 企业用户，微软已经在几个月前将普通消费者版本停用。据悉，这两种搜索框由微软不同团队开发。其中 Windows 搜索由 Windows 团队负责，而 Copilot 搜索框则由 Copilot 和 Microsoft 365 AI 团队负责。微软对此表示：“我们将暂时停用任务栏的‘询问 Copilot’，未来将带来全新体验并持续收集用户反馈。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/991/352.htm", "publishedAt": "2026-08-18T15:14:16+00:00"}, {"title": "首发 2699 元闪极 AI 眼镜 loomos L1 发布：钛合金机身 43 克，接入飞书与腾讯 WorkBuddy", "summary": "IT之家 8 月 18 日消息，闪极科技今晚在武汉正式发布了全新的 loomos L1 AI 眼镜。线下服务体系同步落地，闪极武汉万象城旗舰店将于 8 月 19 日开业。该产品以“主动记忆”为核心定位，采用航空级钛合金前框与天然醋酸纤维板材，整机最轻 43 克，主打日均超 16 小时长时间佩戴。首发价 2699 元起，预计年底大规模交付。除眼镜外，本次发布会还有闪极 300W 移动电源，售价 1299 元；闪牌 Pro2 主动散热移动存储扩展坞，售价 399 元起，追求源于热爱联名设计款众筹价 499 元。京东 SHARGE 闪极 AI 眼镜 loomos L1 拍摄眼镜无线蓝牙音频智能眼镜语音操控男女通用款 【威灵顿 D】白色透明 | L 码 依视路钻晶膜洁 1.67 镜片 3699 元直达链接2026 年数码家电政府补贴持续进行中，IT 之家为大家汇总国补领券地址，买数码家电之前记得领取。数码补贴：点此领券手机 / 平板 / 3C 数码支持 8.5 折政府补贴，不超过 6000 元的产品至高立减 500 元。家电补贴：点此领券多类家电支持 8.5 折政府补贴，单品至高补贴 1500 元。欢迎下载最会买 App - 好货好价，高额返利，1 毛钱也能提现！扫描二维码或点击此处下载最新版（自动识别平台）。闪极表示，当前 AI 眼镜行业普遍采用墨镜蓝本设计，日均佩戴时长仅约 3 小时。loomos L1 则瞄准光学眼镜用户群体，从底层架构上进行重构。材质方面，这款产品采用航空级钛合金前框搭配天然醋酸纤维板材，具备优异的强度重量比且亲肤不刺激。铰链方面，采用自有专利螺旋铰链，由航空级钛合金柔性转轴打造，取消传统弹簧结构，开合 1 万次后阻尼手感依然精准，走线完全隐藏于铰链内部。其镜腿采用超窄“飞鱼镜腿”设计，将摄像头、电池、主板全部移至镜腿，重量重心后移至耳后。前框体感仅 19 克，鼻梁压力较主流产品减少 50%。值得一提的，这款产品提供波士顿框、威灵顿 D 型框、猫眼框、经典墨镜框共 4 种框型、5 种配色，并提供 M/L 多尺码选择，未来还将拓展 S/XL 码。AI 能力方面，loomos L1 的差异化在于其“主动式”AI 能力，区别于行业普遍的“被动唤醒”模式，所有功能均在用户授权及符合相关法律法规的前提下运行。多场景融合录音功能不仅能录制现实环境中的对话和通话，还能在听音乐、看视频、语音聊天等场景下持续录音。闪极表示，数字与现实融合 AI 日记可每日自动沉淀，融合现实录音与手机推送消息，智能归纳见面人物、对话时长、重点内容和待办事项。提醒待办纪要融合 AI 日历，将录音文件与日程联动。AI Live Photo 将拍摄照片与闪记功能融合，支持实时检索、归纳和整理。所有数据自动沉淀，构建个人专属 AI 记忆数据库。产品配备物理磁吸镜头盖，不使用时可完全遮盖以保护隐私。硬件配置上，loomos L1 搭载双芯片异构方案，包括高通骁龙 4nm 级 W5100 系列主处理器和恒玄 BES2700 低功耗蓝牙芯片，搭载安卓系统。据闪极发布会公布的测试数据，AI 记忆工况下 W5100 功耗较行业主流 AR1 方案低 38%。定制摄像头模组拥有 1200 万像素、111 度超广角和 f/2.2 大光圈。它还配备专属 AI 按键，轻按即可一键唤醒 AI，无需语音唤醒。音频系统采用定制歌尔 8mm 超线性扬声器。续航方面，该产品采用 5 秒极速换电架构，单块电池容量 258mAh，随身多功能充电仓可提供 3 至 4 次补能。综合续航达 40 小时，开启主动 AI 记忆后续航约 12 小时。生态交互方面，loomos L1 深度集成飞书，通过 CLI 接口实现 Agent 生态互联，语音即可完成飞书消息收发、总结、日程管理、任务指派。同时一键接入腾讯 WorkBuddy AI 助手，支持邮件查收回复。价格方面，loomos L1 首发价 2699 至 2999 元，其中搭配依视路钻晶 1.67 光学镜片版本售价 2699 元，搭配蔡司泽锐铂金 1.67 镜片版本售价 2999 元。首发期至 9 月 17 日，购机赠送价值 999 元的全年不限时 AI 会员及配镜验光服务。闪极创始人兼 CEO 张波称，按照传统眼镜的商业逻辑，这样的 AI 眼镜价格应该定在 4999 元。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/991/351.htm", "publishedAt": "2026-08-18T15:08:40+00:00"}, {"title": "火狐 Firefox 浏览器升级“智能窗口”，打造注重隐私的 AI 浏览体验", "summary": "IT之家 8 月 18 日消息，据科技媒体 The Verge 今天报道，火狐 Firefox 浏览器的“智能窗口”（Smart Window）模式现已升级，用户可在浏览器的 AI 聊天功能中获取网页信息。IT之家从原报道获悉，智能窗口现在还可以根据浏览内容自动推荐标签页分组，使用自然语言搜索浏览历史时，还可以直接看到之前浏览过网页的缩略图。推荐的标签页分组还能够识别并关闭重复的标签页，让用户更容易整理和追踪重要内容。与传统的 AI 浏览器不同，Firefox 更侧重于整理用户浏览过的内容，同时 AI 助手 Exa 也将为找到的信息添加来源引用。此外，Firefox 未来还将加入类似 Chrome 的近期浏览历程展示功能，帮助用户重新访问之前的浏览会话，以及基于 AI 的在线表单自动填写功能。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/991/343.htm", "publishedAt": "2026-08-18T14:35:02+00:00"}, {"title": "一台诞生于 AI 时代的电脑，该是什么样？", "summary": "从手机到电脑，AI 正在重新定义我们与设备交互的方式。 鸿蒙电脑发布一年多后，生态应用已经增长到超过 19000 款。更值得关注的是，越来越多应用开始围绕折叠屏、跨设备协同和系统级 AI，重新设计电脑上的工作流。 这一期，我们从日常办公、内容创作到专业软件实际体验了一遍鸿蒙电脑，看看一台诞生于 AI 和多设备全场景时代的电脑，究竟该是什么样。#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1675518?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-08-18T11:11:59+00:00"}, {"title": "Cloudflare 推出 Precursor，通过持续性行为分析识别恶意机器人与 AI 自动化程序", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/7QNfsJhpgskMtVllCpWJ?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-18T10:58:02+00:00"}, {"title": "网易传媒发布”蜜蜂AI” ：从工具到伙伴，让AI更懂人", "summary": "8月18日，网易传媒举办“蜜蜂AI媒体沟通会”", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/08/474857.html", "publishedAt": "2026-08-18T10:04:14+00:00"}, {"title": "Agenti 一款采用一体式水冷设计的华硕 ROG Astral LC RTX 5090 显卡在解锁 105% 功耗限制后，整卡功耗从 600W 的原生上限攀升至 640W 以上。此外，HYDRA 的 RTX-TUNER 功能也获得了多项增强，包括移除电压频率曲线修改限制、新增第二代 MSVDD 和 NVVDD 电压偏移控制（Rail Offsets），以及直接控制 XBAR 偏移量。IT之家注意到，该工具还添加了对英伟达 RTX PRO 6000 专业卡的实验性支持。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/991/358.htm", "publishedAt": "2026-08-18T15:34:10+00:00"}, {"title": "中国联通：全面收敛在售套餐数量，持续开展资费精简专项工作", "summary": "IT之家 8 月 18 日消息，中国联通在今晚举行的半年度业绩说明会上表示，传统通信市场已进入存量竞争阶段，稳固和提升用户价值已成为增收增利的关键，公司正全面收敛在售套餐数量，持续开展资费精简专项工作。中国联通今日刚刚发布了 2026 年半年度报告。财报显示，2026 年上半年中国联通实现营业收入 2014 亿元，同比增长 0.6%；主营业务收入 1780 亿元，同比下降 0.2%；归母净利润 41 亿元，同比下降 34.8%；利润总额 112 亿元，同比下降 36.6%。业绩说明会上，中国联通针对国家“六张网”战略作出部署。在新一代通信网方面，公司与中国电信合作建设全球最大 5G 共建共享网络。双方已共享 5G 基站超 154 万站、4G 基站超 200 万站，累计节省投资 565 亿美元（IT之家注：现汇率约合 3,815.53 亿元人民币），每年节约运营成本 65 亿美元。算力网方面，公司数据中心布局持续优化，智算规模已超 45EFLOPS。在算力与 AI 布局上，上半年资本开支 241 亿元，算力投资占比提升至 37%，投资额同比提升超过 80%。全网部署标准机架超 115 万架，资源利用率超过 74%，5G-A 基站已覆盖 330 多座城市。算力业务收入达 419 亿元，同比增长 13%，其中智算中心收入同比增长 11%。产品创新方面，“联通魔方”平台化产品自 4 月 28 日全面推广以来销量突破 150 万户。公司正式对外发布 UniClaw 自主执行智能体，云智产品付费用户超过 1.16 亿户。连接业务方面，中国联通移动和宽带净增用户规模合计超 700 万户，连接规模突破 13 亿。国际业务收入同比增长 14%。现金流表现亮眼，公司经营活动现金流净额 333 亿元，同比提升 13.6%，创近年新高。董事会宣布不派发 2026 年度中期股息。相关阅读：《中国联通：智算规模达 45EFLOPS，今年算力相关投资将超 175 亿元》《中国联通 2026 财年上半年归母净利润 94.68 亿元，同比下降 34.6%》《运营商低价竞争时代终结：中国联通杭州渠道佣金骤减 40%，融合宽带月租从 28 元涨至 79 元》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/991/330.htm", "publishedAt": "2026-08-18T13:37:56+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "Snowflake CoCo AI 成本优化指南：7 个关键方法 | 技术实践", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/pOfV96f9DHG9Cw1KQAZB?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-18T16:29:05+00:00"}, {"title": "埃及盲人企业家开发 AI 应用，通过实时描述周围影像助视障群体“看见”世界", "summary": "IT之家 8 月 18 日消息，5 年前，埃及开罗 16 岁女学生凯伦 · 莫拉德失去了视力。今年 6 月前往肯尼亚度假时，她第一次感觉自己仿佛重新“看见”了周围的世界。帮助她做到这一点的，是 20 岁哥哥马克 · 莫拉德开发的 AI 辅助应用 ScribeMe，可以实时描述身边的景象。据路透社今天（18 日）报道，ScribeMe 能安装到 Meta 智能眼镜中，为凯伦持续讲解周围有哪些动物、距离多远，以及动物当时在做什么。通过这些信息，她能够在脑海中拼出完整场景，并感受到野生动物观赏现场的氛围。凯伦直言：“我以前一直觉得这种事情不可能发生，但真的发生了，我真的能够看见。”ScribeMe 主要面向完全失明的人士，目前已经覆盖 140 个国家和地区，拥有数千名用户。其不仅可以用于 Meta 智能眼镜，也支持 iOS 和安卓系统。这款应用由凯伦的哥哥马克开发，马克本人同样是一名盲人。2018 年，他开始发现自己的视力出现异常。医生告诉他，由于一种罕见且无法治愈的视神经疾病，他最终会失明，但没有人能够判断具体时间。到 2021 年底，兄妹二人都已经完全失去视力。凯伦从视力恶化到完全失明只用了 6 个月，马克则经历了将近 3 年。母亲玛丽安 · 莫里斯最初难以接受现实，也没有人告诉她这个家庭接下来应该怎么办。那段时间，她每天都会借口出门办事，找一个地方独自哭完，再回到家中。学习成为兄妹二人面临的最大难题之一。马克在学校学习理化时尤其困难，因为屏幕阅读软件一旦遇到图表、示意图或方程式，往往就无法继续提供有效信息。马克曾向海外开发类似辅助工具的团队写信求助，却始终没有收到回复。于是，他开始跟着 YouTube 教程自学编程，到 2023 年已经做出了可以实际使用的 ScribeMe。随后，多项科技竞赛的认可帮助 ScribeMe 继续发展。其中，2024 年沃达丰的“AI 辅助工具黑客松”带来了极大进展。这项比赛旨在开发服务残障人士的辅助工具，不仅让马克找到了联合创始人，也推动 ScribeMe 从最初的文档扫描工具扩展成更完整的视觉辅助应用。ScribeMe 目前能够通过手机摄像头实时回答用户提出的问题，并支持 20 种语言。随后，该应用接入了 Meta 智能眼镜，让盲人用户无需一直手持手机，可以腾出双手使用手杖。应用可以免费下载，额外功能的订阅价格为每月 20 美元（IT之家注：现汇率约合 135.1 元人民币）或每年 200 美元（现汇率约合 1,351 元人民币）。凯伦平时会用 ScribeMe 寻找教室、辨认商店、挑选衣服，甚至辅助学习。父亲莫拉德 · 塞德基表示：“如果 4 年前有人告诉我，你的儿子和女儿今天会走到这一步，我肯定只会当成一句玩笑。梦想会不断成长，而我们一家人也已经不再说任何事情是不可能的。”", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/991/357.htm", "publishedAt": "2026-08-18T15:33:14+00:00"}, {"title": "DeepSeek Harness 怎么入门？这套极简教程用一个项目给你讲清楚", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/1EP0hwuqRzccrWArR7GJ?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-18T12:43:32+00:00"}, {"title": "当 AI 遇见 FinOps：Snowflake 如何为 AI 时代重新定义成本管理 | 技术趋势", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/0MLCGOPXzzILTxB8CORk?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-08-17T18:47:40+00:00"}, {"title": "《牛来》爆火之后，我更理解为什么 AI 视频需要自己的 Blender", "summary": "AI 视频卷到今天，updream 开始做「创作者的 Blender」#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1675279?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-08-17T09:11:09+00:00"}, {"title": "AI 写代码太快了，但你还跟得上吗？Notion 工程师说「理解」才是新瓶颈", "summary": "Geoffrey Litt 是 Not const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
