米 HAD、小米 XLA 认知大模型，号称满配辅助驾驶。硬件方面，其包括 700TOPS 英伟达 Thor 芯片、顶部激光雷达、4D 毫米波雷达、11 颗高清摄像头、12 颗超声波雷达，N90 Max 车型还搭载了后向固态激光雷达。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/647.htm", "publishedAt": "2026-07-30T07:30:52+00:00"}, {"title": "微软宣布用户可通过 Fireworks AI 在 Microsoft Foundry 部署 Kimi K3 模型", "summary": "IT之家 7 月 30 日消息，微软于 7 月 28 日发布公告，宣布用户通过 Fireworks AI 在微软 Microsoft Foundry 上部署月之暗面的 Kimi K3 模型。IT之家注：Microsoft Foundry 是微软推出的企业级一站式 AI 应用与智能体（Agent）开发平台。它将模型管理、智能体构建、安全治理与可观测性统一集成在单个云原生架构中，旨在帮助开发者和企业大规模构建、运行并扩展生成式 AI 应用。而 Fireworks AI 是一家云服务平台，专注于极致速度与高性价比的生成式 AI 推理与微调。它于 2022 年由前 Meta PyTorch 核心团队成员创立（CEO 林徹为前 PyTorch 全球负责人），总部位于美国加州。微软官方表示用户可以通过 Fireworks AI 在 Microsoft Foundry 上部署 Kimi K3 模型，该模型拥有 2.8 万亿个参数，是目前最大的开放模型之一。其模型上下文窗口 100 万个词元（Token），意味着单次请求即可处理约 75 万个单词（大约相当于 10 部完整的小说或一个完整的代码库）。模型名称部署类型每 100 万 Token 输入每 100 万 Token 输出每 100 万 Token 缓存输入FW Kimi K3Data Zone3.30 美元（现汇率约合 22.4 元人民币）16.50 美元（现汇率约合 111.8 元人民币）0.33 美元（现汇率约合 2.2 元人民币）", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/646.htm", "publishedAt": "2026-07-30T07:27:35+00:00"}, {"title": "联想 Yoga 9n 二合一笔记本曝光：首搭英伟达 RTX Spark 超级芯片", "summary": "IT之家 7 月 30 日消息，Windows Latest 获取到了多款联想新品的渲染图及参数信息，例如即将推出的 Yoga 9n 2-in-1 笔记本电脑，这将会是首批搭载英伟达 RTX Spark（N1X）的可变形笔电之一。英伟达 RTX Spark 采用统一架构，整合了 20 核 ARM CPU 与 Blackwell 架构 GPU，GPU 部分拥有 6144 个 CUDA 核心，并支持最高 128GB LPDDR5X 统一内存。英伟达评估该配置的最高 AI 性能可达 1 petaflop，因此被英伟达定位为用于本地运行 AI 智能体的“超级芯片”。泄露图片显示，Yoga 9n 二合一大量借鉴了 Yoga 9i 2-in-1 Aura Edition 酷睿版的设计语言，配备了支持 360° 旋转的 Soundbar 铰链，支持笔记本、帐篷、支架和平板等多种形态切换。该机预计配备 14 英寸显示屏，很可能是 2.8K PureSight Pro OLED 面板，边框较窄；顶部设有支持 Windows Hello 的红外摄像头（支持物理防窥）。键盘采用一体化布局，并带有 Copilot 按键。此外，这款机型采用铝合金机身，沿用了联想常用的“星云蓝”（Cosmic Blue）配色，并配备 Yoga Pen Gen 2 手写笔；机身左侧提供了 HDMI 接口、USB-A 接口、USB-C 接口以及 3.5mm 耳机接口；右侧则包括 USB-A 接口、USB-C 接口和电源键。除了传统二合一机型，联想还计划推出搭载 RTX Spark 的 Yoga Pro 9n。该机定位更高，配备 15 英寸显示屏，采用磁吸式手写笔收纳设计、大尺寸触控板以及六扬声器系统，其中包括 4 个低音单元和 2 个高音单元，并支持杜比全景声（Dolby Atmos）。与二合一机型不同，Yoga Pro 9n 取消了键盘区域的数字小键盘，以便为更大的扬声器和散热系统腾出空间。左侧接口包括 HDMI、USB-A、USB-C，右侧则为 USB-C（10Gbps）、USB-A 接口及 SD 读卡器。Yoga Pro 9n 采用 USB-C 供电，所以不再使用传统的电源接口。联想表示该机支持全天候续航，曝光图片显示其底部采用抬高式设计，有助于增强空气流通。由于 RTX Spark 采用 ARM 架构，高性能硬件在 Windows 11 上运行需要软件优化。此前消息显示，微软正在调整 Windows 11 任务调度器，以适配 RTX Spark 的异构计算架构，让系统能够根据任务类型分配不同计算资源。此外，英伟达也正在准备适用于 Windows 11 的 N1X GPU 驱动，以确保 CUDA、DLSS 以及传统 PC 游戏能够在 ARM 架构设备上运行。目前，联想尚未公布 Yoga 9n 2-in-1 和 Yoga Pro 9n 的售价及上市时间，预计更多信息将在秋季新品发布窗口前后公布。IT之家后续将保持关注。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/607.htm", "publishedAt": "2026-07-30T06:51:42+00:00"}, {"title": "报道称普华永道《转型治理》报告有 84% 概率完全由 AI 生成", "summary": "IT之家 7 月 30 日消息，科技媒体 gptzero 于 7 月 28 日发布博文，报道称普华永道于 2024~2026 年期间发布的 4 份关于中东的研究报告中，存在大量捏造信息和虚假陈述。普华永道（Price Waterhouse Coopers，简称 PWC），全称：普华永道会计师事务所，成立于 1998 年 7 月 1 日，总部位于英国伦敦，主营业务包含审计、税务、风险管理、企业并购等。普华永道与德勤、毕马威、安永并称 \" 世界四大会计师事务所 \"。该媒体深入调查了普华永道发布的研究报告，指出报告包含大量虚假内容，其中最为严重的是一份名为《转型治理》的报告，认为有 84% 概率完全由 AI 生成。如果忽略书末附录（包括参考文献），则该概率将上升至 100%。IT之家附上相关截图如下：该报告主要推广名为“公民脉搏”（Citizen Pulse）的产品，声称丹麦、沙特阿拉伯、美国和澳大利亚等国的政府都在使用该产品。不过该媒体深入调查后，并未发现关于该产品的任何实际信息。人工智能得分最高的报告也往往包含最多的虚假信息来源。GPTZero 将这种现象称为“氛围引用”（Vibe Citing），即引用不严谨，常常缺少正确的标题、网址或作者信息，实际上并不能支持其所附的论点。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/605.htm", "publishedAt": "2026-07-30T06:48:23+00:00"}, {"title": "特斯拉 Robotaxi 新增车载录制功能，采集路况数据优化自动驾驶", "summary": "IT之家 7 月 30 日消息，特斯拉自动驾驶网约车（Robotaxi）网络正在不断加入专门用于测试和验证的新软件功能。随着改装版量产 Model Y 在部分城市提供 Robotaxi 服务，车辆中控屏上也开始出现一些独特功能。X 平台用户 @Josh143574359 最近分享了自己乘坐一辆有人监督的 Robotaxi 时拍摄的照片。照片显示，中控屏上新增了一张专门用于录制数据的控制卡片。他表示：“大约 20 分钟的行驶就占用了我乘坐的 Robotaxi 10% 的磁盘空间。我以前从没见过这些选项，看起来应该只有内部员工才能使用。”这些新增的录制功能主要面向有人监督的 Robotaxi 测试车辆，为车内安全监督员提供直接记录车辆遥测数据和行驶过程的工具。特斯拉此前发布的 Robotaxi“AI 安全操作员（AI Safety Operator）”招聘信息中，就将“启动和停止录制设备，并管理相关硬件”列为岗位职责之一，而这些新增功能正是为这一工作而设计。目前，有人监督的 Robotaxi 主要运行于特斯拉验证服务的测试区域，以及已经商业运营的旧金山湾区和得州奥斯汀部分地区。在这些车辆中，驾驶位仍配备人工安全员，以便在紧急情况下接管车辆。相比之下，特斯拉目前大部分 Robotaxi 服务已经实现完全无人监督运营。其中，奥斯汀同时提供无人监督和有人监督两种 Model Y Robotaxi 服务；旧金山湾区目前仍全部为有人监督运营；达拉斯、休斯敦、迈阿密、奥兰多和坦帕则均已提供完全无人监督的 Model Y Robotaxi 服务。从曝光的界面来看，这个录制控制面板会实时显示存储设备的容量占用比例，同时提供卸载存储设备、停止录制以及启动休息模式等选项。界面还显示，录制数据保存在连接至手套箱 USB 接口的存储设备中。普通消费者的特斯拉车辆通常也会利用这一 USB 接口连接 U 盘，用于存储媒体文件以及 Dashcam（行车记录仪）和 Sentry Mode（哨兵模式）录像。考虑到仅约 20 分钟的行程便占用了 10% 的存储空间，这套系统很可能正在同时记录车辆所有外部摄像头的视频数据，用于 Robotaxi 验证测试和人工智能模型训练。这也意味着，安全监督员在一个工作班次内，很可能需要多次更换大容量存储设备，以持续记录车辆运行数据。这些新增的软件功能也反映出，改装后的 Robotaxi 正逐渐与普通消费者购买的 Model Y 拉开差距。除了新增数据录制功能外，特斯拉此前还对无人监督 Robotaxi 进行了另一项调整 —— 取消转向灯和双闪警示灯的提示音，以进一步降低车厢内噪音，为乘客提供更加安静的乘坐体验。特斯拉持续收集大量真实道路数据，也是为了支撑 Robotaxi 网络快速扩张。公司近期公布的数据显示，其 Robotaxi 车队累计完成的无人监督自动驾驶里程已突破 38 万英里（IT之家注：约 61.2 万公里）。本月，特斯拉还将 Robotaxi 服务扩展至三个新市场，先后在迈阿密推出无人监督运营，并随后进入奥兰多和坦帕开展服务。与此同时，没有方向盘和踏板的 Cybercab 正在奥斯汀进行公开测试。通过持续记录大量真实道路 Robotaxi 运行数据，特斯拉希望不断优化神经网络模型，为未来专门打造的 Cybercab 全面接管商业 Robotaxi 车队做好准备。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/604.htm", "publishedAt": "2026-07-30T06:47:11+00:00"}, {"title": "xAI 发布 Grok Voice Think Fast2.0", "summary": "xAI推出新一代语音识别模型 Grok Voice Think Fast2.0，面向构建语音智能体的开发者开放，在智能水平、转录准确率、对话能力以及工具调用效率方面实现升级。该模型定价为每分钟音频0.08美元，xAI表示无需修改现有提示词，Think Fast2.0即可在多数应用场景中带来性能提升。 在Artificial Analysis语音识别基准测试中，Gro...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/482971", "publishedAt": "2026-07-30T06:22:46+00:00"}, {"title": "Meta 首席 AI 官汪滔：有了 AI 赋能，初创公司挑战行业巨头从未如此容易", "summary": "IT之家 7 月 30 日消息，据《商业内幕》今天（30 日）报道，Scale AI 创始人、现任 Meta 超级智能实验室负责人、首席 AI 官汪滔（Alexandr Wang）认为，AI 已经大幅缩小创业公司与大型企业之间的实力差距，挑战行业巨头从未如此容易。汪滔在 Y Combinator 举办的一场活动上表示，AI 已经改变创业竞争的基本规则。“对于拥有梦想、愿景和雄心，希望通过打造卓越产品，亲手塑造未来世界的人而言，眼下或许是整个文明史上仅有一次的机会。”汪滔回忆道，自己在 2016 年创办 AI 训练公司时，初创企业面对行业巨头仍处于明显劣势。“过去的竞争就像大卫挑战歌利亚。创业公司必须更加聪明，找到合适的市场切入口，并在资源远少于对手的情况下设法竞争。随着智能体和其他 AI 技术不断发展，我认为局面已经更接近歌利亚对战歌利亚。”汪滔创办的 Scale AI 是最早进入数据标注领域的企业之一，雇用全球数千名承包人员，为大型 AI 实验室筛选和排序 AI 回复，并参与模型训练。去年 6 月，Meta 与 Scale AI 达成价值 143 亿美元（IT之家注：现汇率约合 968.63 亿元人民币）的交易，汪滔随后离开 Scale AI，转而加入 Meta。汪滔补充道，只要创业公司以“最具雄心的方式”运用 AI 智能体，击败已经占据市场优势的大型企业并不困难。AI 智能体能够自主执行由多个步骤组成的任务，从编写代码到处理客户服务都可胜任。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/591.htm", "publishedAt": "2026-07-30T06:10:00+00:00"}, {"title": "OpenAI 部署 GPT-5.6 优化模型自身推理性能，端到端服务成本最多降低 20%", "summary": "IT之家 7 月 30 日消息，OpenAI 公司昨日（7 月 29 日）发布博文，宣布通过 GPT-5.6 Sol 模型，来优化 GPT-5.6 系列模型本身 AI 推理链路，端到端服务成本最多降低 20%。OpenAI 于 7 月 9 日推出其最强 AI 模型 GPT-5.6 系列，在后续的架构优化过程中，官方团队利用 GPT-5.6 Sol 模型来优化自身运行效率，降低计算成本、提高 GPU 利用效率。OpenAI 公司称，系统会按地域、可用容量和加速器类型分配请求；集群内部还会参考负载、上下文长度、缓存可用性等因素分发任务。GPT‑5.6 Sol 通过 Codex 分析生产流量、识别负载失衡来源、测试路由策略并调整启发式规则。在模型前向传播环节，GPT‑5.6 Sol 识别可预计算、可避免或可并行的工作，并通过 Codex 自主改写和优化生产环境中的 GPU 内核。IT之家附上相关截图如下：团队让 GPT-5.6 Sol 模型学习 Triton 和 Gluon 两种编程语言，让模型据此优化推理引擎内核，使生产环境 GPU 内核带来的端到端服务成本最多降低 20%。OpenAI 还使用开源工具 FpSan（浮点数清理器）验证 GPT‑5.6 Sol 编写内核的正确性。OpenAI 还让 GPT-5.6 Sol 优化推测性解码（speculative decoding）。这项推理加速技术由较小的草稿模型预测下一个 token，再由主模型验证或修正预测结果。OpenAI 在 2026 年 7 月 29 日的公开帖文中称，改进后 token 生成效率提升超过 15%。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/590.htm", "publishedAt": "2026-07-30T06:06:15+00:00"}, {"title": "马斯克旗下 SpaceXAI 最智能 AI 语音模型，Grok Voice Think Fast 2.0 登场", "summary": "IT之家 7 月 30 日消息，埃隆 · 马斯克（Elon Musk）旗下 SpaceXAI 公司昨日（7 月 29 日）发布 Grok Voice Think Fast 2.0，是其功能最强大、最智能的语音对语音（speech-to-speech） AI 模型。定价方面，该模型的每分钟音频费用为 0.08 美元（IT之家注：现汇率约合 0.54 元人民币），官方计划将于 8 月 5 日升级 grok-voice-latest 模型，从 grok-voice-think-fast-1.0 升级到 grok-voice-think-fast-2.0。该模型侧重提升语音推理、转录准确性、对话能力与工具调用可靠性。根据 Artificial Analysis 公布的语音到语音基准测试数据，新模型的 AA Speech-to-Speech Quality Index 为 82.9%，较 Grok Voice Think Fast 1.0 的 75.7% 提高 7.2 个百分点。SpaceXAI 称，模型可在说话时同步完成推理，无需以额外延迟换取推理能力。该公司还称，新版本减少了每次回复所需的推理 Token；在生产环境中，工具调用通常会在智能体说完第 1 句话前完成。xAI 在覆盖数千条短语、24 种语言的内部评估中称，Grok Voice Think Fast 2.0 的转录表现较 Deepgram Nova 3 和 ElevenLabs Scribe v2 提升 1.5~2.0 倍，较 1.0 版提升 1.4 倍。在存在明显背景噪声和电话压缩的场景中，xAI 称其与专用语音转文字模型的差距可扩大至约 10 倍。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/587.htm", "publishedAt": "2026-07-30T05:56:00+00:00"}, {"title": "当所有人都在用 TS/Python 写 Agent，我们为什么坚持 Java", "summary": "1. 先承认赛道默认栈：TS / Python 占主流，Java 几乎是空白 打开今天主流 Coding Agent / AI 编程助手的技术叙事，你会 关键领域也取得了重要进展。可在此处查看财报公告。第四财季微软云营收达到 593 亿美元（现汇率约合 4016.77 亿元人民币），整个财年达到 2140 亿美元（现汇率约合 1.45 万亿元人民币），两个时期的增幅均为 27%。扣除 OpenAI 业务后，商业订单额增长 18%，主要由核心经常性收入业务推动。商业剩余履约义务用于衡量已经签订合同、尚待履行的业务规模，金额增至 6780 亿美元（现汇率约合 4.59 万亿元人民币），环比增加超过 500 亿美元（现汇率约合 3386.82 亿元人民币）。感谢大家始终把安全、质量和可靠性放在重要位置。客户愿意把最关键的工作负载交给微软，离不开大家每天通过实际工作持续赢得信任。本季度还有几个要点：自由现金流达到 196 亿美元（现汇率约合 1327.63 亿元人民币），体现出微软业务基础的稳固程度，也为未来发展提供了更大灵活性。资本支出超过 410 亿美元（现汇率约合 2777.2 亿元人民币），用于满足持续增长的需求。感谢基础设施团队让新增容量顺利投入使用，也感谢工程团队不断提高效率，让每吉瓦新增电力都能支持更多业务。Azure 及其他云服务营收增速提高至 43%。2026 财年，Azure 营收突破 1000 亿美元（现汇率约合 6773.65 亿元人民币），同比增长 41%。Microsoft 365 商业云业务营收经调整后增长 16%，超过预期。继第三财季 Copilot 保持强劲势头后，付费席位净增量环比增加一倍以上，目前付费席位总数已超过 3000 万个。Microsoft 365 消费者云业务营收增长 24%，订阅用户数量增长 7%。扣除流量获取成本后的搜索广告营收增长 10%，Bing 和 Edge 今年的市场份额均再次上升。Windows OEM 和设备业务营收下降 7%，降幅超过整个 PC 市场需求的变化幅度。面对零部件价格上涨，OEM 和渠道合作伙伴继续增加库存。Xbox 内容和服务业务营收下降 10%，上年同期则受益于第一方内容的强劲表现。本季度，《极限竞速：地平线 6》受到玩家广泛欢迎，推出后两天内便吸引创纪录的 600 万名玩家。LinkedIn 营收增长 12%，主要由营销解决方案业务带动。在正式结束 2026 财年前，我希望肯定大家共同取得的成绩。过去一年，我们扩充基础设施容量、改善产品质量、调整商业模式，并通过 cohorts 和 missions 等新的工作节奏改变运营方式，取得了显著进展。全年发展势头不断增强，最后一个季度更实现了全年最佳的执行效果和经营表现。更重要的是，我们始终明白，微软只有继续为客户创造真正的价值，并帮助客户加快自身发展，才能取得成功。感谢微软各团队每天保持专注、自律和投入。无论是质量、安全和合规工作，还是无数项改善客户服务方式的具体决策，大家的努力都发挥了作用。微软在 2026 财年交出的成绩，以及进入 2027 财年时保持的增长势头，直接来自大家的贡献。进入新财年后，我们拥有明确的工作重点、旺盛的客户需求和巨大的发展机遇。同时，要把握面前的机会，我们仍需不断调整、树立更高目标，并探索服务客户的新方式。我相信大家能够共同取得更大成果，也期待未来的发展。谨致谢意与感激艾米", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/0/983/638.htm", "publishedAt": "2026-07-30T07:08:40+00:00"}, {"title": "317 家 AI 独角兽，超过一半从来没发过论文", "summary": "一项新的分析用数据证实了我们许多人长期以来的感受：AI 领域最引人注目的实验室基本上已经停止发表他们的研究成果。 斯坦福“元科学”（metascientist）研究者 John Ioannidis 把 317 家 AI 独角兽的发表记录翻了一遍。结论一句话就能说完：超过一半的公司，从来没有在任何一篇学术论文里担任过第一作者或通讯作者。 根...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/482959/ai-s-top-startups-are-barely-publishing-their-research", "publishedAt": "2026-07-30T06:13:13+00:00"}, {"title": "一个 AI Agent，四天半攻陷 Hugging Face，动机是考试作弊", "summary": "一个 AI 代理花了四天半，自主完成了一场从沙箱逃逸到集群管理员的“对冲基金”级别入侵。目标不是钱，而是考 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
