核验责任，合规材料从建议变成了上架的前置条件。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/028/158.htm", "publishedAt": "2026-11-17T03:46:45+00:00"}, {"title": "中国 AI 旗舰模型集体收紧网络攻击能力，加强 AI 技术出口管制", "summary": "IT之家 11 月 17 日消息，彭博社今日报道称，阿里、腾讯、月之暗面最新发布的新一代模型普遍限制了网络进攻能力，同时强化了漏洞检测与防御功能。彭博社指出，阿里最新旗舰模型 Qwen4-Max 刻意过滤了训练数据中可用于网络攻击的材料，保留了对漏洞检测等防御场景有用的能力。而且该版本暂未公开模型权重，用户无法自行下载部署无审查版本。IT之家注意到，该系列模型此前深受开源社区青睐，阿里 Qwen 系列曾是全球下载量最高的开放权重模型家族之一。除阿里外，腾讯在 Hy4 正式版发布之前已明确限制了模型的网络安全功能，并将漏洞利用生成相关数据从训练流程中剔除。月之暗面 10 月 23 日宣布 Kimi K3.1 Pro 时，同样从后训练的两个阶段移除了网络攻击相关材料。据该公司披露，过滤后的模型在内部漏洞利用基准测试中得分为 81.0%，低于未过滤版本的 90.5%。智谱则在 8 月开放 GLM-5.3 权重之前进行了安全审查，并向有关部门通报了系统漏洞。作为背景，CrowdStrike 在 10 月底发布的报告中披露，一个名为 VAPOR PANDA 的组织使用 DeepSeek 模型配合 ARTEX 框架，在 11 天窗口内针对至少 14 个国家的 200 余家机构发起入侵。腾讯首席 AI 科学家姚顺雨 11 月 7 日在香港出席科学会议时表示，模型的网络能力以及“很快到来的生物能力”将触及可能造成实际危害的阈值。AI 安全公司 Fangcun AI 创始人李晓健对彭博社表示，从训练中剔除攻击性材料是在成本与效果之间的一种平衡，但“目前没有方法能完全消除模型的风险”。政策方面，今年 10 月 16 日，商务部联合科学技术部发布公告，就修订《中国禁止出口限制出口技术目录》公开征求意见，拟将 AI 驱动的恶意代码生成与变异技术等纳入出口管制或限制范围，涉及人工智能领域共 23 项技术。11 月初，国家发展改革委官员表示正在加快推出面向 AI 开发者的安全标准与伦理准则，并强调在开发过程中嵌入安全措施。相关阅读：《欧盟网络安全局警告：超市冰箱遭黑客攻击后，家用电器可能是下一个目标》《360、阿里云等首批 18 家网络产品安全漏洞收集平台签署自律公约》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/028/133.htm", "publishedAt": "2026-11-17T03:28:52+00:00"}, {"title": "苹果新规遏制 AI 应用“全盘接管”Mac，古尔曼称提前 2 年铺路自家 AI 智能体", "summary": "IT之家 11 月 17 日消息，苹果昨日（11 月 16 日）发布公告，宣布自今天发布的 macOS 27.3 Beta 2 开发者预览版开始，改革 Mac 的“完全磁盘访问”及“设备控制与数据访问”权限机制，重点防范 AI 智能体类应用过度获取用户数据或操控系统。IT之家援引博文介绍，苹果提醒，部分应用若获得完全磁盘访问，可能读取文件、邮件、消息、浏览记录等敏感信息，带来隐私与安全风险。而在新机制下，原有的“设备控制与数据访问”设置将拆分为“系统与应用保护覆盖”和“辅助功能”两项，让用户更清楚地看到 AI 助手、自动化工具等应用到底能读取哪些文件、控制哪些程序，并可选择“每次询问”。更重要的是，苹果鼓励用户不向应用开放整个磁盘，只开放完成特定工作所需的单个应用或文件夹。用户也可以设置应用“每次需要时再请求权限”，避免 AI 应用在获得一次授权后长期、无限制地访问 Mac。当某个应用通过“系统与应用保护覆盖”控制另一个应用时，菜单栏还会出现透明度指示器，提醒用户当前存在跨应用控制行为。对开发者而言，苹果要求其调整应用引导流程，并确保应用在仅获得有限文件夹或应用权限时仍能正常运行。用于磁盘备份或辅助技术的应用，可申请特殊授权，以在新安装时维持此前的使用体验；用户在 macOS 27.3 前已授予的权限，暂时仍会继续生效。彭博社的马克 · 古尔曼（Mark Gurman）今天在 X 平台发布推文，评论该功能为“苹果提前两年开始推销自家的 AI 智能体。”古尔曼认为 AI 智能体未来要“替你办事”，例如整理文件、填写表单、跨应用执行任务，通常需要访问文件、控制应用或获得系统权限。苹果先用一个吓人的弹窗，让用户习惯“AI / 应用要权限时必须谨慎”。等苹果将来推出自己的 AI agent 后，用户已经理解其权限模型，也更信任苹果的权限审批方式。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/028/116.htm", "publishedAt": "2026-11-17T03:19:40+00:00"}, {"title": "微软为 Xbox Series X|S 测试 ACO 着色器编译器，性能提升 2% 至 16%", "summary": "IT之家 11 月 17 日消息，微软正在为 Xbox Series X|S 主机测试一款新的实验性着色器编译器 AMD Compiler（ACO），旨在进一步提升游戏着色器编译效率和运行性能。据 Wccftech 昨日报道，这款 ACO 编译器基于 Mesa 图形栈中的开源 ACO 项目。该项目最初由 Valve 推动开发，目前已应用于 Mesa 的 RADV Vulkan 驱动，为 Linux 平台上的 AMD 显卡提供支持。初步测试显示，与 Xbox 现有标准着色器编译器相比，ACO 在不同测试场景下带来了 2% 至 16% 的性能提升。与传统基于 LLVM 的编译后端不同，ACO 专门针对 AMD GCN 和 RDNA 图形架构设计，重点优化着色器编译速度和 GPU 指令生成效率。其编译流程可以将着色器程序从 NIR 中间表示转换为 AMD GPU 能够执行的机器指令，并针对分支控制流、指令调度和寄存器分配等环节进行优化。微软确认，ACO 已作为实验性着色器编译器集成在 10 月游戏开发工具包（GDK）中，面向 Xbox Series X|S 游戏开发者开放测试。微软表示，开发者可以将其作为额外的优化工具，与现有标准 Xbox 着色器编译器进行比较。微软公布的初步测试结果显示，ACO 带来的性能改善幅度为 2% 至 16%，具体效果取决于游戏引擎、渲染内容以及当前游戏的着色器性能瓶颈。着色器是游戏渲染过程中负责处理光照、阴影、反射和材质等效果的 GPU 程序。编译器负责将着色器代码转换为 GPU 可执行指令，其编译效率和生成代码的质量都会影响游戏运行表现。ACO 通过优化这一过程，有望减少着色器编译开销，并改善部分游戏场景下的 GPU 执行效率。此外，微软在同一版 GDK 中还加入了 AMD FSR Upscaling 4.1.2 支持，首次将 AMD 基于机器学习的超分辨率技术引入 Xbox Series X|S。IT之家注意到，该版本提供 Full INT8 和 Lite INT8 两种模型，其中 Lite INT8 模型体积不到 Full INT8 的一半，能够降低超分辨率处理开销，让开发者根据游戏需求选择性能与画质方案。目前，ACO 仍处于面向开发者的实验阶段，并非 Xbox 系统级更新，也不会自动为现有游戏带来性能提升。微软尚未公布哪些商业游戏会采用这款编译器，以及玩家何时能够体验到相关优化。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/028/111.htm", "publishedAt": "2026-11-17T03:01:19+00:00"}, {"title": "OpenAI 推出儿童性虐待内容检测工具，加强儿童网络安全防护", "summary": "IT之家 11 月 17 日消息，OpenAI 昨天宣布推出儿童性虐待内容（CSAM）检测工具。该产品可中断有害行为，同时提供干预措施，并为负责儿童安全案件的执法调查人员提供支持。该工具将通过 OpenAI API，向经过审核的机构免费开放。据介绍，OpenAI 已推出全新的图像分类器，用于检测潜在的儿童性虐待内容。该分类器会寻找虐待行为的视觉特征，帮助审核团队识别未曾见过的新图像，同时提供评分功能，帮助审核人员判断哪些图像可能需要优先处理。美国国家失踪与受剥削儿童中心（NCMEC）在该工具的开发过程中提供支持，协助 OpenAI 完成训练、评估和实际部署工作。同时该工具相比现有保护措施，可减少 48% 误标记图像数量。在标记的图像中，实际包含性虐待内容的可能性约为原来的两倍。invideo AI 测试显示，每四个被标记的案例中，就有一个最终被封禁。此外，OpenAI 将在 ChatGPT 中新增产品警告。当用户试图寻找性虐待素材时，系统会中断相关操作、说明后果，并引导用户寻求帮助，以停止有害行为。一旦用户发出相关请求，他的 ChatGPT 账号将被暂时停用 24 小时，反复违规可能导致更长时间的封号，最终永封或被举报至有关部门。OpenAI 已经与 Anthropic 和谷歌合作，共同委托制定一份关于如何应对 AI 系统中儿童性剥削与性侵害披露的新指南。该指南最近已由 Tech Coalition 发布，为开发者处理这些敏感情况提供了实用建议。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/028/066.htm", "publishedAt": "2026-11-17T01:49:31+00:00"}, {"title": "谷歌第七代自研 Ironwood TPU 交卷：8192 颗集群约 102 秒达标 DeepSeek-V3 预训练", "summary": "IT之家 11 月 17 日消息，谷歌云（Google Cloud）昨日（11 月 16 日）发布博文，在 MLPerf Training v6.1 基准测试第一轮中，提交了覆盖第七代 Ironwood TPU 与英伟达 Grace Blackwell GPU 的 10 项结果，涉及模型预训练，以及 MLPerf 首次纳入的智能体强化学习测试。IT之家注：10 项成绩并非全部来自 Ironwood，其中 4 项使用谷歌自研芯片，另外 6 项采用英伟达 GPU。在 DeepSeek-V3 预训练测试中，8,192 颗 Ironwood TPU 用时 1.70 分钟（约 102 秒），让目标模型达到基准规定的质量要求。谷歌同时披露，在扩展至 4,096 颗芯片的测试中，系统扩展效率达到 96%。根据 MLCommons 发布的参赛方补充说明，谷歌在 DeepSeek-V3 671B 预训练项目中提交了三组 Ironwood 成绩：Ironwood 芯片数量达到目标质量的时间换算为秒相对 2,048 颗配置的提速2,048 颗5.03 分钟约 302 秒基准4,096 颗2.62 分钟约 157 秒约 1.92 倍8,192 颗1.70 分钟102 秒约 2.96 倍同轮 DeepSeek-V3 671B 测试中，可参考以下公开成绩：提交方／平台加速器配置达标用时英伟达 GB300 NVL72 集群10,240 颗 GB300 GPU1.38 分钟，约 82.8 秒谷歌 Ironwood 集群8,192 颗 Ironwood TPU1.70 分钟，102 秒英伟达 Vera Rubin NVL72 集群1,024 颗 Rubin GPU4.14 分钟英伟达 GB300 NVL72 集群1,024 颗 GB300 GPU8.03 分钟谷歌云 A4X Max256 颗 GB300 GPU31.96 分钟Ironwood 及谷歌云 GB300 成绩来自谷歌披露，其余成绩来自英伟达本轮技术说明，英伟达将 10,240 颗 GB300 的 1.38 分钟列为本轮该项目最短用时。在本轮首次引入的智能体强化学习测试中，640 颗 Ironwood 芯片运行 Qwen3.5-397B，用时 18.02 分钟达到编程任务要求，准确率为 76.5%，高于 69% 的目标。代码生成与学习同步进行，让训练芯片等待时间占比低于 3%。在 Google Cloud A4X Max 实例中，256 块用于预训练基准的 NVIDIA GB300 GPU 在 31.96 分钟内达到目标质量，辅以 5 个 A4X 和 A4X Max 在 agentic RL 基准测试中的提交。参考New AI training performance benchmarks for Google TPUsMLCommons Releases MLPerf Training v6.1 Results, Spotlighting Recent Advances in AI TrainingSupplemental Results Discussion for MLPerf Training v6.1", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/028/065.htm", "publishedAt": "2026-11-17T01:46:08+00:00"}, {"title": "英伟达推出 DGX Spark HPC 开发套件：四节点集群、512GB 内存，面向科研与 AI 开发", "summary": "IT之家 11 月 17 日消息，英伟达今天在 SC26 大会宣布推出 DGX Spark HPC 开发套件，面向科研人员、学术界人士、AI 开发者等人士。该套件由四台英伟达 DGX Spark 组成，搭载 现卜思南涉嫌经济问题后，已向公安机关报案，目前其正在接受有关部门调查。360 称，公司要求员工遵守法律法规及内部制度，对贪腐和其他违法违规行为采取零容忍态度，相关问题一经查实将严肃处理。另据超角度报道，11 月 16 日晚间，卜思南通过微信向该媒体回应称，被带走的说法“不是真的”，并表示正在处理相关事项。在被问及微信账号是否由本人使用时，卜思南称是本人。IT之家查询获悉，卜思南是 360 集团副总裁、360 集团市场部负责人、360 数字安全集团教育事业部总经理、ISC 品牌主理人。卜思南早期负责集团市场战略、品牌生态建设，后主管产教融合业务，对接数百所院校共建安全产业学院，牵头国家级产教融合共同体；同时主理 ISC.AI 相关生态，推出 ADE 智能体工程师认证，在 360 All in Agent 战略下推进 AI 安全人才培养与创新项目落地。今年 8 月，360 集团宣布，为推进“安全 +AI”战略，对集团市场与传播中心进行组织调整，设立公关部和市场部，任命卜思南为市场部负责人，向周鸿祎汇报。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/028/212.htm", "publishedAt": "2026-11-17T04:23:57+00:00"}, {"title": "黄仁勋 X 账号更新：移除 CEO 头衔、撤下英伟达标识与横幅，仅保留“创始人”身份", "summary": "IT之家 11 月 17 日消息，英伟达前 CEO 黄仁勋的官方 X 账号 @JensenHuang 今天（11 月 17 日）更新，在个人账号中移除了原本标注的“CEO”职务头衔，账号简介目前仅保留“Founder of NVIDIA”（英伟达创始人）。而此前在 X 平台，黄仁勋的账号介绍为“Founder and CEO of NVIDIA”。与此同时，其主页原有的英伟达公司关联标识、横幅及指向英伟达介绍页的入口也已被移除。此前黄仁勋 X 账号信息截图英伟达于 11 月 12 日发布公告称，黄仁勋已辞去公司总裁、首席执行官及董事会成员职务，即时生效；公司执行副总裁兼首席财务官科莱特 · 克雷斯（Colette Kress）出任临时 CEO，并将继续担任 CFO，直至公司任命正式继任者。IT之家曾于 11 月 13 日报道，英伟达官网已更新管理层介绍页面，临时 CEO 科莱特 · 克雷斯被列在了第一位，黄仁勋则被放在了底部的“创始人”一栏中。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/028/187.htm", "publishedAt": "2026-11-17T04:05:30+00:00"}, {"title": "华为麒麟 9050 系列芯片配备新一代显示 DPU，支持全彩 AI-HDR2020", "summary": "IT之家 11 月 17 日消息，华为官方今日继续发文，揭秘首款「逻辑折叠」技术 τ 芯片麒麟 9050 系列的详细配置信息。据官方介绍，该系列芯片配备新一代显示 DPU（数据处理单元），支持全彩 AI-HDR2020，让普通 SDR 内容呈现更丰富的明暗层次与色彩表现。据介绍，新一代显示 DPU 让麒麟 9050 系列能够实现高精度像素级显示控制。协同终端显示技术，实现防窥模式快速切换与画质优化。据IT之家此前报道，今年 10 月，华为半导体业务无线终端芯片产品管理部部长徐松余表示，麒麟 9050 系列在中国半导体产业界的支持下成功量产。他呼吁半导体产业界和学术界的合作和支持，未来属于开放合作，没有一家企业可以独自解答所有答案。相关阅读：《华为麒麟 9050 系列芯片智能音视频处理情报公开：低延迟 AI 异构协同计算、率先支持 H.266 解码》《华为麒麟 9050 系列芯片新一代巴龙 AI Modem 情报公开：首创融合通信架构、业界首发四卡三待》《华为麒麟 9050 系列新马良 GPU、AI ISP 情报公开：实装二代硬件光追，首次实现 2 亿像素融合拍照》《华为麒麟 9050 系列芯片新一代灵犀 CPU 详细信息公开：9 核 16 线程并行调度，支持内存压缩加速》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/028/159.htm", "publishedAt": "2026-11-17T03:56:30+00:00"}, {"title": "DeepSeek 悄悄收紧免费额度，或因算力资源紧张所致", "summary": "11 月 16 日，「DeepSeek 使用额度已达上限」冲上热搜。多名用户反馈，App 和网页端同时收紧了限制，而且一次收了三条。 最直接的一条：超过 7 天没交互的长对话不能再接着聊。页面上的原话是「因算力不足，不再支持 7 天不活跃的长对话」，系统给出的办法是新开一个对话，或者把历史记录导出去。 单次输入的文字上限也被...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503610", "publishedAt": "2026-11-17T03:45:14+00:00"}, {"title": "摩根大通发生重大系统故障，回应称并非网络攻击所致", "summary": "IT之家 11 月 17 日消息，据南华早报报道，美国当地时间周一，数千名客户报告称摩根大通发生技术故障，多家美国主要银行和 Zelle 汇款服务公司难以访问在线账户，这起问题在整个金融体系引发了连锁反应。摩根大通官方表示，这些技术问题并非网络攻击造成的，公司正努力在周一结束前恢复银行服务。摩根大通发言人 Joe Evangelisti 表示：“摩根大通在本地硬件系统中出现了与软件漏洞相关的临时问题 —— 这与网络安全无关。”“这不是一个系统性问题 —— 其他银行可能仅在与我们交易时受到交易缓慢的影响。”图源：Pexels据 NBC4 WCMH-TV 报道，包括美国银行、大通银行、摩根大通、富国银行和 Truist 等主要银行的客户报告称，他们在网上访问账户时遇到了问题。一位摩根大通客户报告称看到了以下信息：“您的余额和银行账户上的待处理交易可能不是最新的，但您仍然可以进行付款和转账。”还有人收到的信息写道：“部分服务无法提供。我们正在处理它们。请稍后再试。”美国银行在一份声明中回应称：“美国银行的系统今天一直正常运行。遇到其他服务商延误的客户可直接联系他们获取最新信息。”IT之家注意到，此次中断发生在两起美国重大宕机事件的几天后：微软上周的重大宕机持续数小时，严重影响了包括 Outlook、Teams 和 AI 助手 Copilot 在内的服务。随后，当地时间周五发生了影响美国空中交通管制系统的一次中断，导致所有美国航班停飞数小时，并在周末持续扰乱全美各地的航空旅行。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/028/146.htm", "publishedAt": "2026-11-17T03:33:56+00:00"}, {"title": "换掉安卓原生跑 Win11：开发者改造一加折叠手机，已实现触控", "summary": "IT之家 11 月 17 日消息，开发者 Kevin Shroff 于 11 月 2 日在 Reddit 社区发帖展示最新移植成果，在一加折叠屏手机 OnePlus Open 上，原生运行 Windows 11 on ARM64 系统。不同于虚拟机方案，该系统安装在手机内部存储中，直接运行于设备硬件之上。开发者表示，他已清除测试机上的安卓系统，目前由 Windows 11 作为主系统启动。IT之家附上相关图片如下：在移植开发过程中，Shroff 定制了启动固件，并适配硬件识别、电源管理及驱动等，目前已实现触控操作，并能调用手机的 16GB 内存和全部 8 个处理器核心。不过本次移植尚未达到完美程度，目前仍无法使用 Wi-Fi、蜂窝网络、蓝牙、音频和摄像头，GPU 图形加速也未实现。项目仍处于开发阶段，尚未提供可直接刷入的安装包。以上图源：开发者 Kevin Shroff 的 X 账号参考点此前往 GitHub 访问 Windows 11 ARM64 on OnePlus Open 项目相关阅读：《谷歌高管借 Gemini AI 成功让苹果 iPhone Duo 运行微软 Win11》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/028/109.htm", "publishedAt": "2026-11-17T02:57:34+00:00"}, {"title": "Skyeye 云企业级 AI + 零代码智能制造系统-3D仓库 - v4.1.12 发布", "summary": "Skyeye 云企业级AI+零代码智能制造，智能制造一体化，采用 SpringBoot+ UNI-APP + Ant Design Vue 的零代码平台开发模式。包含 100 多种电子流程，CRM、PM、ERP、MES、ADM、OA、EHR、AI、项目、商城、财务、多班次考勤、薪资、招聘、云售后、论坛、问卷、报表设计、工作流、Saas 等功能。打造全网首套零代码、AI应用最广...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503607", "publishedAt": "2026-11-17T02:35:20+00:00"}, {"title": "苹果 tvOS 27.3 Beta 2 新增 Siri AI 引导界面，用户可选新旧版本", "summary": "IT之家 11 月 17 日消息，消息源 @itspdfu 今天（11 月 17 日）在 X 平台发布推文，报道称在 tvOS 27.3 Beta 2 更新中，苹果为 Siri AI 带来全新引导设置界面，用户可以选择尝试新版助手，也可以继续使用经典版 Siri（Siri Classic）。IT之家此前报道，苹果此前已通过 tvOS 27.2.1，为第二代和第三代 Apple TV 4K 扩展带来 Siri AI 支持，而第四代 Apple TV 4K 则在上市时便已支持 Siri AI。而本次 iOS 27.3 Beta 2 更新中，苹果公司进一步补全用户体验，方便用户根据自身需求，切换新旧版本 Siri。延伸阅读Siri AI 是苹果在 2026 年 6 月 8 日 WWDC26 上预览的全新版本 Siri，由新一代 Apple 智能驱动，具备个人情境理解、广博的世界知识以及在全系统 App 内执行操作的能力，并可通过专门的 Siri App 回看历史对话、借助 iCloud 在多设备间私密同步。该功能以 Beta 版形式提供，需将设备语言设置为英语，目前在中国大陆尚不可用。文中提到的“经典版 Siri（Siri Classic）”是苹果官方的称法：当设备已启用 Apple 智能、但用户未开启 Siri AI 时，所使用的即为这一版本的 Siri；在支持 Apple 智能的机型上，当用户可以在不同 Siri 版本间做选择时，它便会被标注为“Siri Classic”。而在不支持 Apple 智能的设备或地区，Siri 仍以传统形态提供。Apple TV 4K 至今共推出四代：第一代于 2017 年发布，第二代于 2021 年发布，第三代于 2022 年发布，第四代（即文中提到的上市便支持 Siri AI 的机型）于 2026 年 10 月发布、11 月 13 日开售。第四代新款内置远场麦克风，可在无需遥控器的情况下免手动唤醒 Siri，并作为家庭中枢整合了由 Apple 智能生成的家庭安防摄像头活动描述与通知摘要等功能。按照苹果官方说明，Apple TV 4K 上的 Siri AI 目前仅提供英语版本，且需要搭配一台支持 Apple 智能的 iPhone 或 iPad 才能完成设置。此外，tvOS 27.2.1 在把 Siri AI 带到 Apple TV 4K 的同时，还为第四代机型加入了最多连接四个 HomePod 扬声器组成家庭影院环绕声的能力。早在 2026 年 8 月，就有媒体通过挖掘 tvOS 27 Beta 6 的代码发现，苹果在系统内部应用列表中加入了 Siri 条目，并关联了代号“campo”（苹果为 Siri AI 使用的内部代号）的字符串，当时已被视作 Apple TV 4K 将整合 Siri AI 的前兆。在第四代 Apple TV 4K 于 2026 年 11 月 13 日上市前，苹果曾于 11 月 3 日为其单独推送专属 tvOS 27.2 更新（内部代号 24K154），其中即为新机型适配启用了 Siri AI。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/028/094.htm", "publishedAt": "2026-11-17T02:18:53+00:00"}, {"title": "苹果 2027 新品前瞻：iPhone Duo 2 等 18 款在列，首款 AI 眼镜有望亮相", "summary": "IT之家 11 月 17 日消息，科技媒体 MacRumors 今天（11 月 17 日）报道，综合彭博社记者马克 · 古尔曼（Mark Gurman）及其他消息来源，苹果 2027 年可能推出至少 18 款新品，覆盖手机、平板、电脑、手表及智能家居设备。iPhone 方面：共计约 6 款iPhone 18e：A20 芯片，9GB 内存，电池续航更长。iPhone 18：A20 芯片，9GB 内存，更长的电池续航。iPhone Air 2：搭载 A20 Pro 芯片、超广角摄像头、更小的动态岛、更长的电池续航，以及苹果 C2 调制解调器，美国版本支持毫米波，相较于当前型号的 C1X 调制解调器上传速度“显著更快”。iPhone 20 Pro：A21 Pro 芯片，采用“所有角落和边缘的弧形玻璃”，屏幕边框更细。iPhone 20 Pro Max：采用 A21 Pro 芯片，采用全新设计，“所有角落和边缘都采用曲面玻璃”，屏幕边框更薄。iPhone Duo 2：苹果已着手测试 Face ID，但目前尚不清楚该功能能否在 iPhone Duo 2 发布前最终定案。根据最近的传闻，相机控制按钮最终可能兼作动作按钮。iPad 方面，共计约 3 款iPad Pro：M6 或 M7 芯片，配备 VC 散热方案。iPad Air：M5 芯片，OLED 显示屏，更轻薄的设计，以及可能在 iPad mini 上首次亮相的声学显示功能。iPad：支持 Apple Intelligence 的 A19 芯片，支持 Wi-Fi 7 的 N1 芯片，以及苹果高效的 C1X 调制解调器，适用于蜂窝机型。Apple Watch 方面，共计约 2 款Apple Watch Series 13：有泄密者称 Apple Watch 明年将进行重大改款，显然还会包括新的佩戴方式。Apple Watch Ultra 5：虽然 Apple Watch Ultra 5 尚未被确切传闻，但在过去五年中有四年推出了新款 Ultra。Mac 方面，共计约 4 款MacBook Neo：A19 Pro 芯片，12GB 内存，以及可能新增的颜色选项。MacBook Air：升级 M6 芯片。MacBook Pro：一款升级版的 14 英寸 MacBook Pro 基础版，搭载 M7 芯片，可能配备动态岛和发光苹果标志。MacBook Pro（PROLED XDR）：M7 Pro 和 M7 Max 芯片。其它：AirPods Pro：内置摄像头，支持 Siri AI 和视觉智能。Apple Glasses：连接 iPhone 的智能眼镜，配备摄像头、麦克风和扬声器。软件功能：Siri AI、视觉智能、通话和消息、通知公告、音乐播放等。苹果显然计划在 2027 年 WWDC 发布，并在 2027 年底上市。HomeView Max：配备 9 英寸屏幕的更大 HomeView，可在机械臂上 360 度旋转。在美国，价格可能从 999 美元（IT之家注：现汇率约合 6,673 元人民币）起。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/028/088.htm", "publishedAt": "2026-11-17T02:05:26+00:00"}, {"title": "DigitalOcean Managed Agents为AI智能体提供托管云基础设施", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/LjVeWVAsBWwaiifdMRiu?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-16T16:42:41+00:00"}, {"title": "Docker Sandbox Kit规范：将AI智能体权限打包为OCI镜像", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/yV89L6iMCqSLDHeSoLxo?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-16T16:22:11+00:00"}, {"title": "Codex、Claude Code 都卷完了，居然还能跑出黑马？整个产品，现在都可以是一个提示词", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/8TySw9wzqf0l90keJUNf?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-16T14:44:28+00:00"}, {"title": "DeepSeek又来掀桌子了！官方App全套能力开放API，联网搜索价格不到OpenAI、Claude的8%", "summary": "点击查看原文>", "sourceName": "InfoQ 中 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
