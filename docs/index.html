const DATA = {"date": "2026-11-20", "generatedAt": "2026-11-20T03:50:51Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "三星自研 AI 新进展：Gauss 4 现身 One UI 9.5 代码", "summary": "IT之家 11 月 20 日消息，科技媒体 SammyGuru 昨日（11 月 19 日）报道，称三星正在积极推进自研 Gauss 系列 AI 模型，在 One UI 9.5 首个 Beta 测试版中，发现了 Gauss 4 E2B 模型踪迹。相关名称出现在支撑 AI 智能体功能的 Personal Agent Core，以及三星新款 Memory 应用中。内部模型列表还列有 Gauss 3.8 3B、GaussA 26B-A4B 等型号，并保留了 GaussA 30B 的多个历史版本记录。IT之家附上相关截图如下：Memory 应用不仅列出了 Gauss 4 E2B，还会检查设备上是否存在 Gauss 模型文件，其隐藏设置将该模型与谷歌 Gemini Nano、Gemma 并列，暗示三星可能正在测试让它直接在手机上运行。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/029/833.htm", "publishedAt": "2026-11-20T03:27:10+00:00"}, {"title": "上汽荣威官宣家越 07 纯电版 11 月 27 日上市，全系标配 800V 碳化硅平台 + 651km 续航", "summary": "IT之家 11 月 20 日消息，上汽荣威今日官宣家越 07 纯电版将于 11 月 27 日上市，999 元下订即享 2000 元购车尾款抵扣。据官方介绍，该车全系标配 800V 碳化硅平台 + 651km 超长纯电续航 + 80.6kWh 大电池，电机峰值功率达 245kW，峰值扭矩达 430N·m ，实现 5.9 秒零百加速。IT之家注意到，荣威家越 07 于 10 月 23 日上市，包含四款车型，限时权益价区间 11.98-14.48 万元。首发车型采用增程系统，配备 32.6kWh 和 44.2kWh 两种容量的电池组，纯电续航分别为 220km 和 320km，最大综合续航 1480km。荣威家越 07 长宽高为 4900*1910*1745mm，轴距 2908mm，提供龙晶紫、玛瑙灰、宝石蓝、珍溪黑、钻石白、翡翠绿等宝石车色，可选绵云青空、坚果可可、云绒暖灰内饰色，车内还配有 AI 灵光氛围灯、双 15.6 英寸 2.5K 超清大屏。此次新车搭载 AI 极速制冰冷暖两用冰箱，可实现最快十分钟制冰。IT之家注意到，家越 07 行业首搭豆包座舱助手支持拟人化表情、FaceID 账号识别记忆、豆包 App 联动、方言外语，实现一句话联动全车、多人交流不打断等。家越 07 还将搭载最新 Momenta R7 世界模型与新芯航图 XHEART X7 大模型专用芯片组成的软硬一体方案。可实现单侧余量 20cm 的极窄垂直泊车，适配 300 余种车位。覆盖常规车位及断头路泊车、离车泊入、一键贴边等场景，兼容城市 NOA、高速 NOA 等功能。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/029/800.htm", "publishedAt": "2026-11-20T02:12:59+00:00"}, {"title": "行业首次：小鹏 2026 科技日将首发「图灵 AI 共驾」，把智能辅助驾驶能力赋能人驾", "summary": "IT之家 11 月 20 日消息，小鹏汽车 2026 年小鹏科技日（AI DAY）已经官宣定档 11 月 25 日在广州举行，主题为“原点”（Origin）。据小鹏介绍，本届科技日的核心发布之一，是“图灵 AI 共驾”的首次亮相。小鹏表示，这是行业首次将智能辅助驾驶能力延伸至人工驾驶场景。其首个落地功能为“VLA 自适应减速”，该功能在驾驶员松开加速踏板时介入，由后台运行的 VLA 大模型对前方路况进行实时判断，并将场景理解结果传递给整车控制器，由其融合踏板操作与硬件边界后，平顺调节减速力度。系统无需开启导航辅助驾驶即可生效，目标是在人驾滑行与减速过程中减少突兀的拖拽感，降低晕车概率。在能耗层面，小鹏官方公布的数据显示，在城市拥堵工况下，开启 VLA 自适应减速（对比关闭能量回收）可使实际可用续航提升 12.4%。这一收益来自回收策略对路况的预判，而非简单地提高回收强度。VLA 模型能够识别前车减速、路口红灯或弯道等场景，提前调整回收扭矩，减少不必要的机械制动介入。这一功能将首发应用于小鹏 G9L 与小鹏 MONA L05 两款车型。其中，小鹏 G9L 于 2026 年 9 月 17 日上市，定位大五座 SUV，限时售价 23.18 万元起，首发搭载第二代 VLA 智驾系统；MONA L05 于 10 月 29 日上市，限时起售价 13.98 万元，其 Ultra SE 版本搭载图灵第二代 VLA 完整模型。小鹏方面表示，该功能未来将面向更多车型逐步推送。据介绍，“图灵 AI 共驾”的技术底座是小鹏全栈自研的图灵 AI 芯片与 VLA 模型。图灵芯片自 2025 年第三季度量产上车，截至 2026 年 8 月累计出货量已超过 20 万片。VLA（IT之家注：视觉-语言-动作模型，Vision-Language-Action）的作用是让车辆在人工驾驶状态下仍能持续理解视觉场景，为底层控制策略提供预判输入，而非直接取代驾驶员操作。除图灵 AI 共驾外，本届小鹏科技日还将展示物理 AI 与机器人方向的最新进展。小鹏人形机器人 Iron 计划登台与观众互动，活动时间紧邻 11 月 27 日开幕的 2026 广州车展。敬请期待。相关阅读：《2026 小鹏科技日定档 11 月 25 日，宣传语“Origin 原点”》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/029/785.htm", "publishedAt": "2026-11-20T01:20:34+00:00"}, {"title": "OpenAI 邀部分 Plus 用户体验 dots AI 智能体，移动版 ChatGPT 将为其设独立标签页", "summary": "IT之家 11 月 20 日消息，OpenAI 核心产品负责人蒂博 · 索蒂奥（Thibault Sottiaux）今天（11 月 20 日）在 X 平台发布推文，宣布邀请少量 ChatGPT Plus 用户测试 dots，同时宣布向所有 ChatGPT Business Standard 用户开放。IT之家今年 9 月报道，在 OpenAI DevDay 2026 活动中，OpenAI 发布了 dots 全天候智能助理，用户交代目标、提供背景并连接所需应用后，可以后台帮助用户规划议程、设计网站、测试应用、修改笔记等。有别于传统一问一答方式，dots 拥有自己的云电脑，可以使用你连接的应用开展研究、制作成果，并根据你的反馈逐渐适应工作偏好。你可以规定哪些事情允许它自行处理，哪些需要你参与决定。索蒂奥还透露正在测试全新的移动端使用体验，重点调整功能入口与底部标签栏，让用户更容易找到常用工具，也能更直观地发现 ChatGPT 的其他用途。新体验将首先面向已拥有 dots，或具备创建 dot 资格的 ChatGPT Pro 用户开放，本次改版为用户的 dots 设置独立标签页，使其拥有更直接的访问入口。与此同时，用户可以将 Codex、Projects（项目）、Images（图像）等功能固定到底部标签栏，按照自己的使用习惯安排常用入口，减少查找功能的步骤。新版界面并非强制启用。用户可以随时进入“设置”，通过“New ChatGPT Design”选项开启或关闭新体验。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/029/784.htm", "publishedAt": "2026-11-20T01:20:21+00:00"}, {"title": "OpenAI 开放 GPT-Live-1.1 API：支持实时双向对话，智能体可边聊天边处理复杂任务", "summary": "IT之家 11 月 20 日消息，OpenAI 今日宣布向开发者开放 GPT-Live-1.1 API 语音模型，允许第三方开发者将其集成到自己的应用程序中，构建能够实时聆听、回应并执行复杂任务的 AI 语音智能体。据 OpenAI 介绍，GPT-Live-1.1 是 GPT-Live-1 的升级版本，具备全双工语音交互能力，可以同时聆听和说话，不必等待用户完整说完一句话才开始处理。该模型能够识别用户说话过程中的停顿、打断和语速变化，并实时判断应该继续聆听还是作出回应。IT之家注：GPT-Live-1.1 自 2026 年 10 月 15 日起已成为 ChatGPT Plus 及更高级别订阅用户的默认语音模型。此次 API 开放，则进一步将相关能力提供给第三方开发者。在具体能力方面，OpenAI 表示，GPT-Live-1.1 改进了多语言语音处理、指令遵循能力和语音保真度，能够更可靠地处理字母、数字等需要精确识别的信息，减少语音交互过程中出现的理解偏差。此外，该模型支持将需要更深入推理或工具调用的任务委托给开发者选择的后端模型。开发者既可以使用 OpenAI 的模型，也可以接入第三方模型。后端模型在处理复杂任务时，语音对话仍然可以继续进行，无需中断当前交互。这意味着，开发者可以将实时语音交互与后端模型的推理、工具调用能力结合起来，让语音智能体在回答用户问题的同时，处理需要多步骤执行的复杂工作流。根据 OpenAI 官方 API 文档，GPT-Live 系列采用全双工架构，能够直接处理输入和输出音频，减少传统语音系统中语音识别（STT）、大语言模型（LLM）和语音合成（TTS）串联所产生的延迟。OpenAI 已提供 GPT-Live-1.1 API 相关技术文档及接入指南，开发者可以通过 OpenAI 开发者平台了解模型能力、配置方式和具体使用方法。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/029/776.htm", "publishedAt": "2026-11-20T00:50:30+00:00"}, {"title": "曝 Meta 全新 AI 硬件 Muse Charm 售 300 美元，附赠一年 5G 流量", "summary": "IT之家 11 月 20 日消息，据《The Information》今日报道，Meta 旗下新款 AI 硬件设备 Muse Charm 的售价约为 300 美元（IT之家注：现汇率约合 2,008 元人民币），并将附赠最长 12 个月的 5G 流量服务（Verizon 提供）。Muse Charm 是一款配备屏幕的小型 AI 设备，由 Meta CEO 马克 · 扎克伯格（Mark Zuckerberg）于今年 9 月的 Meta Connect 大会上首次展示。扎克伯格当时表示，该设备计划于 12 月假日购物季期间上市，但没有公布具体售价。Meta 计划通过这款掌上设备，让用户无需打开手机应用，即可直接与旗下 Muse AI 智能体进行语音交互。扎克伯格介绍称，Muse Charm 集成了 Muse 的实时语音交互和虚拟形象技术，设备配备指纹传感器。用户触碰指纹传感器即可启动交互，直接与 Muse AI 智能体对话，无需解锁手机或打开应用程序。设备还配备约 2 英寸（约 5 厘米）屏幕，可显示用户定制的 Muse 虚拟形象。据《The Information》报道，Meta 计划为 Muse Charm 用户免费提供最长 12 个月的 Verizon 5G 数据服务，以便设备在没有 Wi-Fi 的情况下也能连接 Muse。对于售价及相关产品信息，Meta 发言人泰勒 · 易（Tyler Yee）回应称，公司很高兴看到外界对其 AI 设备的关注，并将在不久后分享更多信息。除 Muse Charm 外，Meta 还在研发智能手表。据《The Information》报道，Meta 已将智能手表的推出时间推迟至 2027 年，以便优先推进 Muse Charm 的上市工作。此外，Meta 已于今年 10 月开源 Muse Gadgets 项目，提供 ESP32 设备 SDK 和 Linux SDK，允许开发者利用 ESP32 开发板或树莓派等硬件，自行制作能够连接 Muse AI 智能体的设备，并接入显示屏、按钮、传感器等外设。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/029/771.htm", "publishedAt": "2026-11-20T00:37:58+00:00"}, {"title": "只改一处代码，谷歌 AI 智能体优化 Harness 后任务成功率提升 8 倍", "summary": "IT之家 11 月 20 日消息，谷歌研究人员当地时间 11 月 17 日最新发表的研究论文《Harnesses That Improve Themselves》（《能够自我改进的 Harness》）显示，通过让 AI 智能体逐步修改自身运行框架，并对每次修改进行验证，可以显著提高软件工程任务的完成率。在一项 SWE-bench Lite 测试中，采用模块化优化方案的智能体任务成功率从 5.0% 提升至 40.0%，达到原来的 8 倍，平均每项任务消耗约 4.67 万 Token。其研究重点是 AI 智能体的 Harness。它并非底层 AI 模型本身，而是围绕模型构建的运行框架，负责管理上下文和记忆、控制多轮任务执行、调用外部工具，以及在任务结束前验证执行结果。研究人员指出，不同模型在工具使用方式和任务执行过程中表现出的弱点可能存在明显差异。因此，为某个模型优化的 Harness，迁移到其他模型后可能出现任务停滞、Token 消耗过高或执行效果下降等问题。为解决这一问题，研究人员提出了一套能够自我改进的 Harness 架构。与传统上通过修改提示词来约束智能体不同，该方案允许优化模型直接修改 Harness 的代码，并通过测试决定是否保留修改。实验采用一套仅有 142 行代码的初始编程智能体 Harness，将其拆分为四个可编辑模块，分别负责上下文与状态管理、智能体控制、工具调用接口，以及验证与故障恢复。每轮优化过程中，系统只允许修改其中一个模块。优化模型首先根据智能体执行记录识别问题并提出代码修改方案，随后通过验证集检查修改效果，同时受到 Token 使用上限约束。只有通过验证的修改才会被保留，未达到要求的方案则会被舍弃。在核心测试中，研究人员使用 Gemini 3.8 Flash 作为执行任务的基础模型，并在 40 道未参与优化的 SWE-bench Lite 软件工程任务上评估不同方案的表现。结果显示，初始 Harness 的任务成功率为 5.0%，采用模块化修改和验证机制后，成功率提高至 40.0%，平均每项任务消耗约 4.67 万 Token。作为对照，如果允许优化模型不受限制地整体重写 Harness，任务成功率可以达到 42.5%，略高于模块化方案，但平均每项任务需要消耗约 45.16 万 Token，是模块化方案的近 10 倍。IT之家注意到，另一项实验则采用仅修改提示词规则文件的方式约束智能体，结果任务成功率反而从初始的 5.0% 降至 2.5%。研究还考察了优化后的 Harness 迁移到其他模型时的表现。在不重新进行优化搜索的情况下，模块化方案迁移至 Gemini 4 Argon 后，任务成功率达到 37.5%，而整体重写方案为 30.0%。研究人员认为，Harness 的自我改进不应仅依赖提示词，而应将重要约束落实到实际代码中。例如，通过自动测试检查任务执行结果、识别重复失败和阻止未经验证的任务结束，可以让智能体更可靠地完成复杂任务。论文同时指出，允许智能体修改自身运行代码也会带来新的风险，包括提示词内容不断膨胀、针对基准测试进行过度优化，以及篡改评估程序等。因此，代码修改需要受到验证机制和权限边界约束。需要注意的是，这项研究的实验主要围绕特定模型和 SWE-bench Lite 软件工程任务展开，核心测试集仅包含 40 道未参与优化的任务，尚不足以证明该方法在所有模型和智能体应用场景中都能取得相同效果。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/029/766.htm", "publishedAt": "2026-11-20T00:19:51+00:00"}, {"title": "模型刚接进业务，CEO又要换新：红帽如何接住企业AI落地难题？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/6xqcZfMgJ99ZQiGFbjym?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-19T18:05:40+00:00"}, {"title": "快与真：范式首批国产算力训练的Phai系列模型，究竟有什么不同", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/DQlimzDy7bqiZ3mc5Vvq?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-19T16:08:30+00:00"}, {"title": "开源项目 pg_vectorsearch 为 PostgreSQL 带来了更具可扩展性的向量搜索功能", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https:/ R?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-20T11:00:00+00:00"}, {"title": "火山引擎 Agent-Native 团队的上下文管理实践｜AICon北京", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/YTGHxcabs0RI3btLIUxm?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-20T10:00:00+00:00"}, {"title": "GPU-Z 2.72.0 发布：可识别英伟达 RTX Spark、RTX 4090 Ti ES，新增 AMD 多显卡热点温度监控", "summary": "IT之家 11 月 20 日消息，TechPowerUp 今日发布了 GPU-Z 2.72.0 版本更新，此次新增对 NVIDIA RTX Spark 处理器、GB203 版本 GeForce RTX 5070 以及尚未发布的 GeForce RTX 4090 Ti 工程样品的支持，同时扩展了对 AMD 和 Intel 多款图形产品的识别能力。在 NVIDIA 产品方面，GPU-Z 2.72.0 新增对 RTX Spark 的支持，但部分显存信息暂时仍无法读取。此外，软件还加入了对 GB203 核心 GeForce RTX 5070 以及 GeForce RTX 4090 Ti 工程样品（ES）的支持。AMD 方面，新版本增加了对 BC-250 矿卡的支持，并为部分 AMD 集成 GPU 加入时钟频率和温度监控功能。同时，软件现在能够读取 AMD R9 200/300、Fury 和 RX 400/500 系列显卡的 GPU 热点温度，涉及 Polaris、Lexa、Hawaii、Fiji、Bonaire 和 Tonga 等 GPU 架构。Intel 方面，GPU-Z 2.72.0 新增对 Raptor Lake-H Refresh 平台以及 Iris Pro P555（E3-1558L v5）的支持。传感器功能也是此次更新的重点之一。用户将鼠标悬停在传感器数值上时，可以通过新增的工具提示查看相关统计信息。此外，传感器页面中的最小值、最大值和平均值计算现在会自动排除无效读数，避免异常数据影响统计结果。对于配备集成显卡的设备，新版本调整了显存显示方式，不再显示“N/A”，而是以 iGPU 标注共享系统内存的容量，例如“iGPU (64 GB)”。在高级信息页面中，软件还增加了对未知 NVIDIA 供电线路的显示支持，相关数据将以“Rail ### power draw”的形式呈现，该功能默认关闭。针对无法识别 GPU 型号的显卡（IT之家注：包括部分假冒显卡），GPU-Z 现在可以直接从当前系统读取 DirectX API 版本及功能级别支持情况，而不再统一显示“Unknown”。其他改进还包括：在高级信息页面中增加 CUDA 能力信息，新增 CUDA 6.2、7.x、8.x、9.0、10.x 和 12.x 等版本的能力识别及多项 CUDA 属性；扩充 AMD 和 NVIDIA 显卡的 DXVA GUID 名称，并修复 8K 视频支持检测问题。此外，新版本修复了部分情况下 OpenGL 检测失效的问题，调整了 AMD 和 NVIDIA 显卡热点温度传感器的名称，统一显示为“Hot Spot”；如果 NVIDIA BIOS 完全无法读取，高级信息页面也不再显示损坏的 BIOS 信息区块。GPU-Z 2.72.0 还修复了高级 CUDA 信息页面中的多处拼写及细节错误，并进行了其他小幅改进。相关阅读：《疑似英伟达 GeForce RTX 4090 Ti 显卡“非 FE 版”工程样品现身网络》《巨无霸：英伟达 RTX 4090 Ti 显卡再次曝光，四槽位设计》《英伟达被曝将推出搭载 GB203 GPU 的 GeForce RTX 5070 显卡》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/029/823.htm", "publishedAt": "2026-11-20T03:04:56+00:00"}, {"title": "AI Agent 元年，苹果是最后一个入局的巨头", "summary": "苹果急了#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceN ntlemen 过去存在夸大攻击成果、重复使用已窃取数据，以及错误指认受害企业的情况。此次，该团伙既未提供可供核验的样本，也未说明数据来自英伟达哪个业务部门，因此尚难判断潜在影响。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/029/801.htm", "publishedAt": "2026-11-20T02:18:57+00:00"}, {"title": "育碧成立 Motherbrain 专注于游戏 AI，半年员工人数减少近 1100 人", "summary": "IT之家 11 月 20 日消息，VideoGamesChronicle 今日报道称，育碧成立了一家专注于游戏 AI 技术的新子公司 Motherbrain，负责研发用于游戏玩法创新的 AI 技术，并为旗下游戏开发团队提供支持。根据育碧 11 月 19 日公布的 2026-2027 财年上半年财报，公司确认 Motherbrain 已正式成为独立子公司，主要负责开发游戏领域的生成式 AI 技术，支持旗下各个游戏创作团队探索新的玩法体验。育碧联合创始人兼首席执行官 Yves Guillemot 表示，Motherbrain 是公司首个可实际体验的生成式 AI 项目 Teammates 背后的开发团队。成立子公司后，该团队将专注于开发自有游戏技术，为创作者提供支持，并探索更加丰富、沉浸式和具有互动性的玩家体验。根据育碧财报，Motherbrain 当前的研发方向包括全新的玩家体验、具备记忆能力的智能 NPC，以及能够管理大型系统化游戏世界的 AI 游戏主持人。该团队计划为育碧旗下各个创意工作室提供技术支持，同时也将服务于外部游戏开发者，并与部分技术企业建立合作关系。Teammates 是育碧此前推出的实验性生成式 AI 游戏项目，于 2025 年底公开。该项目尝试让玩家通过语音与搭载 AI 的 NPC 进行交流，使游戏角色能够根据对话内容作出回应。Motherbrain 此次正式独立，意味着这一研发团队将继续围绕生成式 AI 与游戏玩法展开技术开发。此次调整也是育碧新运营模式的一部分。公司从 2026 年 1 月开始推进组织架构调整，将旗下业务划分为多个 Creative Houses（创意工作室），分别负责不同类型的游戏及相关 IP。育碧在最新财报中表示，新运营模式现已全面落实，Motherbrain 则作为专门的 AI 技术子公司纳入新架构。值得注意的是，Motherbrain 成立的消息公布前不久，育碧刚刚确认将在加拿大蒙特利尔和魁北克裁减 166 个工作岗位。公司财报还显示，截至 2026 年 9 月底的半财年内，集团员工人数减少近 1100 人。IT之家注：育碧尚未明确 Motherbrain 开发的技术是否会以独立产品形式推出，还是主要整合进旗下其他游戏。公司表示，该团队将重点开发自有技术，为游戏创作者提供支持。相关阅读：《育碧被曝开发〈彩虹六号：维加斯〉新作，项目代号“Spades”》《消息称育碧计划在德国三家工作室合计减少约 100 个岗位》《育碧计划关闭芬兰 RedLynx 工作室，新加坡工作室也面临大幅裁员》《全球上线不到一年，育碧〈彩虹六号〉手游官宣明年 1 月停止运营》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/029/795.htm", "publishedAt": "2026-11-20T02:03:05+00:00"}, {"title": "国内推出首个智能座舱 AI 分级评价体系，共分为 C1 到 C5 五级", "summary": "IT之家 11 月 20 日消息，据央视新闻今日报道，随着新能源汽车快速普及，日前，中国汽车技术研究中心推出了国内首个汽车智能座舱 AI 能力分级评价体系。IT之家从报道获悉，这次中汽中心推出的 AI 能力分级评价体系，共分为 C1 到 C5 五级，把座舱 AI 主观体验转化为可量化的评价指标，覆盖八大能力和行为属性、九大用车场景。中汽智能科技副总经理张亚楠表示：“我们这一体系提炼了智能座舱的感知、执行、自主、进化等八大能力，并与智慧出行、情感陪伴和健康关怀等九大场景交叉匹配，生成体系化的数据库，使评价贴近真实用车场景。我们已依据体系开展了首批验证，为消费者购车提供了汽车智能座舱 AI 能力客观评判标尺。”中汽中心的调查显示，目前，20 万元以上的国产新能源汽车座舱 AI 搭载率超过了 90%，日均座舱交互超 3000 万次。2026 年，国内智能座舱市场规模预计超过 1800 亿元，座舱的智能化体验已成为消费者购车的核心考量。延伸阅读2026 年 5 月，工业和信息化部等三部门联合发布《人工智能终端智能化分级》（GB/Z 177—2026）系列国家标准，明确将汽车座舱纳入首批分级品类，并采用 L1 至 L4 四个等级（响应级、工具级、辅助级、协同级）进行划分，与此次中汽中心推出的 C1-C5 分级体系并行，共同构成座舱 AI 评价的“标尺”。市场层面，数据显示中国智能座舱解决方案市场规模 2025 年约为 1544 亿元，2026 年预计达到 1828 亿元，其中软件规模预计约 605 亿元、占比约 33%；2026 年国内智能座舱渗透率预计超过 80%。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/029/781.htm", "publishedAt": "2026-11-20T01:11:16+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "三星安卓笔记本再曝细节：让 App 适配键鼠操作，整合手机端 AI 技能", "summary": "IT之家 11 月 20 日消息，科技媒体 sammyguru 昨日（11 月 19 日）发布博文，通过挖掘 One UI 9.5 首个 Beta 测试版，发现了三星安卓笔记本的更多线索，有望适配智能简报 Now Brief、主动建议功能 Now Nudge 等 AI 功能。IT之家今天援引 Android Authority 媒体报道，在该 Beta 测试版中发现 origin14wifi 和 origin16wifi 两款设备踪迹，型号分别是 XE940 和 XE960，将会搭载高通骁龙 X Elite 芯片。外观方面，从曝光的示意图来看，两款产品可能对应 14 英寸和 16 英寸，采用传统翻盖设计，目前发现的线索指向仅支持 Wi-Fi 的版本。硬件方面，在三星视频编辑应用新增的芯片配置中，代号 Origin 的设备关联高通 12 核骁龙 X Elite（X1E-80-100）处理器。此外型号为 XE940XSA 的设备也曾现身 Geekbench，显示运行 Android 17、配备 16GB 内存。在 AI 功能方面，代号 Origin 的设备适配多项手机 AI 功能，涵盖智能简报 Now Brief、主动建议功能 Now Nudge，以及日历、录音机等应用等。此外，为上述 AI 功能提供支持的 Personal Data Intelligence 应用，已能区分移动设备与笔记本、台式机，并切换相应的文字、布局和插图。笔记本端说明提到，系统可根据用户的使用习惯，在三星及第三方应用中提供信息和操作建议，包括简报更新、添加日程及发送消息等。其中，Now Nudge 的适配插图展示了两类用途，其一是参考过去的聊天记录、截图等内容，帮助用户回溯信息，其二是根据当前屏幕内容，推荐下一步操作。其他应用也出现键鼠操作适配：Memory“我的收藏”提供快捷键截屏保存提示；录音机则为 AI 摘要加入复制、翻译、分享等右键菜单，设置与搜索也改用桌面式弹出菜单。相关阅读：《One UI 9.5 Beta 1 暗藏三星笔电信息：采用高通骁龙 X Elite 芯片》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/029/826.htm", "publishedAt": "2026-11-20T03:11:23+00:00"}, {"title": "刚刚，Anthropic 敲钟上市！史上最大IPO却让硅谷吵翻了", "summary": "例如，为什么就你 A 社封号这么严格#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1690375?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-11-19T14:58:57+00:00"}, {"title": "Claude Code 团队怎么让 agent 自己证明活干对了", "summary": "Claude Code 团队公开了一个数字：他们的代码大约 90% 由 Claude 编写和评审。 该团队工程师 Addy Osmani 在 claude.dev 上写了篇文章，讲这个规模下他们怎么让 agent 验证自己的工作。核心判断很直接——没有验证回路，你最多同时跑一两个 Claude，因为每个都得自己 const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
