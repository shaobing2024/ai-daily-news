const DATA = {"date": "2026-11-07", "generatedAt": "2026-11-07T02:30:37Z", "attribution": {"source": "中文科技媒体 RSS 聚合"}, "sourceList": ["量子位", "IT之家", "InfoQ 中文", "爱范儿", "开源中国"], "lead": "", "isFallback": false, "sections": [{"label": "模型发布/更新", "items": [{"title": "CyberwIIOS：如何驾驭大模型在 OT 侧跨越“幻觉”与“失控”｜AICon北京", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/K1bCIbHxeu3wLIjdusgr?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-07T10:00:00+00:00"}, {"title": "又一项重要成果，我国牵头制定脑机接口参考架构国际标准正式发布", "summary": "IT之家 11 月 7 日消息，据央视新闻报道，记者 6 日从国家标准委了解到，一项由我国牵头制定的脑机接口参考架构国际标准近日正式发布，这是我国在脑机接口国际标准化领域取得的又一项重要成果。报道称，该标准围绕“脑机接口是什么、怎么用、有什么功能、如何实现”四个核心问题，系统梳理了典型实现模式，形成包括概念、应用、功能和实现的完整技术框架。脑机接口参考架构国际标准起草人潘纲介绍，现在大家对脑机接口的定义，也在逐步地发展过程当中，早期脑机接口概念最主要就是意念的读出，现在经过二三十年的发展，它不单是读出，简单地说，其实是一个信号的读出来，去解读它，进而去调控、干预、影响它，这样形成信号的读出和写入的闭环。IT之家注意到，标准把脑机接口“怎么用”归纳为五类，包括实时感知人的注意力、疲劳、认知负荷等脑状态，可用于工业作业等安全预警场景。对于身体严重损伤或者没有办法交流的患者，通过脑机接口来跟外部机器人包括外控的轮椅实现打字、喝水这些日常的功能。脑机接口还可以与康复机器人等结合开展神经康复训练，促进脊髓损伤、卒中等患者运动功能恢复；通过神经反馈等方式帮助健康人开展注意力调节、认知训练等，提升或拓展原有能力；另外，将脑机接口与眼动、语音、手势、肌电等交互方式结合，还能形成更加准确、灵活的多模态人机交互。潘纲表示，现在脑机接口技术也到了从技术的突破逐步往产业转换的关键阶段。一个厂家是做不了所有的内容的，不同的部件，包括数据的格式都特别不一样，通过这个标准，让大家尽量能够在这个框架下去形成未来的整个产业体系。报道提到，我国已牵头发布三项脑机接口领域基础的国际标准，分别是术语、用例和参考架构。目前，我国正在牵头制定多项脑机接口国际标准。延伸阅读据 ISO 官网信息，此次发布的脑机接口参考架构国际标准编号为 ISO / IEC 27572:2026，全称为《信息技术脑机接口参考架构》，于 2026 年 9 月正式出版，共 18 页，由国际标准化组织（ISO）与国际电工委员会（IEC）下设的 ISO / IEC JTC 1/SC 43（脑机接口分委会）负责制定。ISO / IEC JTC 1/SC 43 于 2022 年 3 月成立，其前身是 JTC 1 第 16 咨询组（AG16），工作范围覆盖信息技术领域的脑机接口标准化，但明确将人体植入物及医疗应用标准排除在外。目前中国是该分委会 13 个参与成员（P 成员）之一。我国牵头发布的三项脑机接口领域基础国际标准中，术语标准为 ISO / IEC 8663:2025《信息技术脑机接口术语》，由中国医学科学院生物医学工程研究所专家蒲江波担任项目牵头人，我国于 2021 年 3 月提出提案、同年 9 月通过投票立项，先后有美、日、澳等 8 个国家参与，标准共梳理出基本概念、分类、信号、实验、应用等 8 大类 126 个词条；用例标准为 ISO / IEC TR 27599:2025，于 2025 年 5 月发布，共 108 页，收录了医疗健康、工业控制、智能环境等领域的代表性用例。文章中提到的标准起草人潘纲，是浙江大学教授，任职于浙江大学脑机智能全国重点实验室、计算机学院及良渚实验室，长期从事脑机接口、类脑计算等方向的研究。在国内层面，与之对应的国家标准为 GB/T 47023-2026《信息技术脑机接口参考架构》，由全国信息技术标准化技术委员会（SAC / TC 28）归口，起草单位包括浙江大学、中国电子技术标准化研究院、南湖脑机交叉研究院、天津大学、华为技术有限公司、电子科技大学、中兴通讯等，该标准于 2026 年 1 月 28 日发布、2026 年 8 月 1 日实施。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/631.htm", "publishedAt": "2026-11-07T01:05:12+00:00"}, {"title": "理想 Mega 新版本 MPV 谍照疑曝光，车头缩短、前三角窗加大", "summary": "IT之家 11 月 7 日消息，博主 @SugarDesign 昨日分享了一组新车谍照，猜测为理想 Mega 的新版本。从图上可以看到，该车车头变短，前三角窗更大。IT之家注意到，新一代理想 Mega Home 于 9 月 2 日发布，新车只提供一种配置，全国统一零售价 50.98 万元。作为参考，理想 Mega Home 可选灰 / 银 / 熊猫白 / 紫晶灰 / 新大象灰 5 种车色。该车新车前、后包围增加晶辉饰条装饰，新增智能三色星环灯提升精致感，车身长宽高分别为 5355*1965*1850mm，轴距 3300mm，提供 2.6m 长的 Sweet Home 超大迎宾光毯。内饰方面，新一代理想 Mega Home 搭载 29 英寸 OLED 6K 全景中控屏，二排带有 21 英寸 OLED 4K 移动屏。搭载高通骁龙 8797 智能座舱芯片，拥有 9.3.6 无瑕星环剧院音响系统。除此之外还带有 2 颗马赫 M100 芯片、4 个激光雷达，支持新一代马赫 VLA 司机大模型。此外，主副驾和第二排均配备零重力座椅。动力方面，新一代理想 Mega Home 采用前后双电机配置。前电机最大功率 155kW，后电机 258kW，综合功率可达 413kW 。配备 108kWh 三元锂 5C 超充电池，CLTC 综合续航里程可达 710km，10 分钟充电 500km。带有线控转向、后轮转向等功能，采用 800V 主动防倾魔毯底盘。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/618.htm", "publishedAt": "2026-11-06T23:58:57+00:00"}, {"title": "Planet AI 邀你“向地球提问”：超 10 年卫星影像变化，一句话就能查", "summary": "IT之家 11 月 7 日消息，美国卫星数据公司 Planet 于 11 月 5 日推出 Planet AI 应用，结合大语言模型与超过十年的全球卫星影像档案，让用户使用自然语言搜索、观察和分析地球表面的变化。IT之家附上演示视频如下：产品目前可通过 ai.planet.com 免费使用，用户登录 Planet Insights 账号后，未来可使用更多高级功能。Planet 强调，所有 AI 结论均以可查看的原始卫星影像为依据，以降低“AI 幻觉”带来的误判风险。用户只需用日常语言描述问题，即可在全球范围内搜索目标地点、追踪其时间变化，并生成对比图或延时影像。与需要专业 GIS 技能的传统遥感工具不同，Planet AI 采用“地图 + 聊天”界面。用户只需提出诸如“找出某地区新增建设用地”或“追踪某片森林的变化”等问题，AI 会解析需求，在覆盖全球的矢量地图和月度影像拼图中定位相关区域，并呈现可核验的卫星影像结果。该应用提供三大核心能力：一是“搜索地球”，通过 AI 理解影像中的视觉特征，在大范围区域内定位目标；二是“探究变化”，回溯十年以上的历史影像，识别变化发生的时间，并提供并排对比或延时画面；三是“深度分析”，可自动调用 AI 智能体完成复杂分析，支持上传图像、CSV 等外部资料，并设置趋势追踪和定时报告。Planet 表示，早期测试者主要将产品用于生态保护、土地管理和环境合规。例如，保护团队可用它监测栖息地、发现非法侵占或火灾风险，并在派出巡护人员前核实毁林预警；合规团队则能按临近水道等条件，在数分钟内筛出需要优先检查的工业场所，而此类工作过去可能需要数天的人工 GIS 排查。Planet 将这一能力归入其“行星智能”（Planetary Intelligence）战略，即把每日卫星观测与 AI 相结合，近实时地理解地球变化。业内人士认为，这款产品标志着地球观测从“专业遥感分析”向“自然语言驱动的公共决策工具”演进。若影像覆盖、更新频率和结果可解释性持续提升，农业、灾害响应、城市治理、保险与基础设施管理等领域都可能成为其落地场景。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/614.htm", "publishedAt": "2026-11-06T23:40:22+00:00"}, {"title": "Anthropic 研究称 Claude AI 智能体可以靠“做梦”变得更聪明", "summary": "IT之家 11 月 7 日消息，Anthropic 昨日（11 月 6 日）发布研究文章《The components of agent memory》，系统拆解 Claude 智能体如何跨会话记忆、筛选、纠错和整理知识。该研究指出 AI 智能体可借鉴人脑“睡眠整理记忆”的机制，在空闲时间反思历史记录、纠错并构建知识结构，从而显著提升长周期任务表现。该研究将智能体记忆分为会话日志、记忆笔记、知识表征（如 Wiki）和注入上下文四层，并引入“做梦”（dreaming）机制，让模型在两次交互之间的空闲时间回顾日志、修正错误、提炼规则和更新知识库。研究团队认为，AI 可像人脑在睡眠中巩固记忆一样，将即时经验逐步转化为可复用的长期知识。Claude 会在会话中标记重要事件或写入记忆笔记，但并非所有信息都值得保存，它需要判断哪些内容在未来真正有用。Anthropic 指出，记忆本质上是一种对未来的预测，例如记录一条已验证的规则，意味着模型预期未来会再次依赖它。在持续学习基准 CL-Bench 的数据库问答任务中，具备记忆能力的 Claude 模型表现明显优于无记忆基线。Claude Opus 5.5 和 Sonnet 5.5 在使用记忆后，平均得分分别达到 0.838 和 0.833，而二者无记忆基线分别为 0.655 和 0.644。更强的模型能够自主形成“失败 — 反思 — 验证 — 总结规则”的学习闭环。在《宝可梦红》游戏测试中，Anthropic 还发现“少而精”的记忆更有效。Claude Fable 5 仅维护 10 个记忆文件，却获得 4 枚徽章；而 Sonnet 3.7 写下 413 个文件，仅获得 1 枚徽章。研究认为，模型应优先保存策略、计划和经测试的规则，而非不断变化的屏幕状态。“做梦”机制还展现出纠错能力。当 Claude 错误记录了宝可梦中心的位置并因此迷路时，系统通过比对原始会话记录修正记忆，让其最终成功抵达下一座城市；未修正记忆的运行则反复折返，未能完成目标。在约 35 万份企业文档的测试中，Claude 通过多轮“做梦”逐步构建 Wiki。随着“做梦”规模从 2 次会话扩展到 128 次，25 个问题的达标率从 13% 提升至 48%；将 Wiki 与搜索工具结合后，综合得分从 54% 升至 61%。Anthropic 表示，智能体记忆仍面临何时写入、如何保持更新、如何避免错误累积等挑战。未来 AI 或将更善于在完成任务后“回顾经验”，把零散交互转化为可迁移、可验证的长期知识。IT之家附上参考地址The components of agent memory相关阅读：《告别知识截止日：谷歌让 AI 学会“睡觉”，边用边学还不忘旧知识》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/613.htm", "publishedAt": "2026-11-06T23:25:14+00:00"}, {"title": "AI 编程进入“通话时代”：Cursor 智能体可实时语音协作", "summary": "IT之家 11 月 7 日消息，AI 编程工具 Cursor 昨日（11 月 6 日）宣布推出“与智能体实时语音聊天”（Voice Chat with Agents）功能。开发者现在可以通过语音与 Cursor 的编码智能体双向对话，例如口头描述代码修改需求、询问任务进展、查看差异和运行状态，同时让智能体继续在后台完成编码工作。该功能支持在 Cursor 的 Agents Window、IDE、网页端及 iOS 应用中使用。当智能体空闲且输入框为空时，用户可点击“Start voice chat”启动通话。在 iPhone 上，还可通过“Hey Siri, call Cursor”发起通话，并在锁屏界面或灵动岛中静音、挂断。与此前仅把语音转成文字的“听写”功能不同，实时语音聊天是语音对语音的双向交流。语音智能体负责倾听、回应并接收任务，随后将具体编码工作交给当前聊天中的编码智能体；后者会在执行过程中主动播报简短进度，完成后给出简要结果说明。用户还可在通话中查询代码差异、检查运行情况、检索该智能体的历史消息与通话记录，或在包含多个工作者的 Project 中切换对象。这些查询为只读操作，不会中断正在执行的编码任务。技术上，语音聊天由 Grok Voice 驱动，负责语音识别与合成；编码智能体则继续使用用户所选模型。Cursor 提供包括 Ara、Eve、Leo、Rex、Sal 在内的多种语音选择，并支持在通话中切换语音。隐私方面，开启 Privacy Mode 后，语音聊天将实现零数据留存。Cursor 同时提示，通话有每日使用上限；若用户长时间沉默且智能体无任务运行，通话约 10 分钟后会自动结束。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/610.htm", "publishedAt": "2026-11-06T23:11:36+00:00"}, {"title": "OpenAI CEO 奥尔特曼警示：未来人类可能无法从 AI 手中夺回控制权", "summary": "IT之家 11 月 6 日消息，OpenAI 首席执行官萨姆 · 奥尔特曼（IT之家注：Sam Altman）最近出席 Raj Shamani 播客时表示，人工智能可能通过两种方式走向失控：一是人类逐步将控制权交给自主式 AI，二是某个人或实体垄断 AI 技术。针对第一种情况，奥尔特曼警告称：“AI 会逐渐失去控制，我们可能有意或无意地将控制权交给能力远超人类的系统，最终再也无法夺回。”第二种情况的风险在于巨头垄断，奥尔特曼解释称：“另一种情况是，某个人、公司或国家相对于其他所有人来说过于强大。让多个不同路线的 AI 实验室相互竞争，比所有人依赖一家企业安全得多。”这种对过度集权的担忧，解释了马斯克以及 OpenAI 的前高管等知名人士会选择离开，创办与之竞争的公司。奥尔特曼指出：“很多人的思维中都会出现一种想法，那就是他们只相信自己有能力开发这项技术，因为利害关系实在太大了。”话虽如此，奥尔特曼仍然坚信 AI 将让人类迎来更美好的未来。他特别提到了基础科学研究，认为下一代 AI 模型能让科学持续进步。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/596.htm", "publishedAt": "2026-11-06T15:13:11+00:00"}, {"title": "聚焦内容创作和传播推广两方面突出问题，广电总局开启新一轮微短剧专项治理", "summary": "IT之家 11 月 6 日消息，据央视新闻今日报道，近日，国家广播电视总局在巩固前期微短剧低俗有害和侵权盗版专项治理成效的基础上，针对 AI 微短剧质量良莠不齐、AI 技术助长低俗不良内容反弹等问题，部署开展新一轮微短剧低俗化同质化专项治理工作，治理为期两个月，自 11 月 1 日起至 12 月底。新一轮专项治理聚焦两个方面的突出问题：内容创作方面深化治理儿童类不良、软色情擦边、极端对立、拜金主义、严重违背家庭伦理道德等低俗不良内容；治理未按要求备案审核的特殊题材内容；治理“盗脸”“偷声”问题，规范 AI 微短剧创作。传播推广方面治理片名、宣推素材、弹幕评论、引流片段中的低俗内容；治理同一剧集通过更换片名或主角姓名等方式，改头换面、反复播出；治理首页首屏首推和重点榜单推荐同质化问题，提升算法推荐内容的多样性。IT之家从报道获悉，今年以来，通过开展微短剧低俗有害内容和侵权盗版专项治理，累计下架违规微短剧 7.5 万部，处置违规账号 1500 余个。新一轮专项治理聚焦 AI 技术助长低俗化同质化问题，进一步压实平台机构主体责任，规范平台及账号运营，推动行业生态持续净化。在加强规范管理的同时，广电总局还会深入实施“微短剧精品创作传播计划”，通过资金扶持、创作引导、文艺评论、组织传播等工作机制，提升微短剧的文化内涵、艺术品质和社会价值，以优秀作品持续涌现带动行业生态持续向好。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/579.htm", "publishedAt": "2026-11-06T15:04:17+00:00"}, {"title": "Day-0 支持：摩尔线程完成 3 万亿级参数 Kimi-K3.1 Pro 适配，支持文本与图片推理", "summary": "IT之家 11 月 6 日消息，本月 4 日，月之暗面正式公布 Kimi K3.1 Pro 完整模型权重。在 Arena 运营的 Agent Arena 智能体排行榜中，Kimi K3.1 Pro（Max）位列开放权重模型第一、全部参评模型第 13 位，并在工作、编程与聊天三个类别中均居开放模型首位。摩尔线程官方今日宣布，摩尔线程基于 AI 训推一体智算卡 MTT S5000 及 MUSA 软件栈，完成 Kimi-K3.1 Pro 模型的 Day-0 适配，打通模型加载、服务启动及文本、图片基础推理链路。IT之家了解到，Kimi K3.1 Pro 是 K3.1 系列首款模型，也是迄今能力最强的 3 万亿级参数模型，支持 100 万上下文。经过大规模后训练和强化学习，模型在代码、3D 创作、金融研究、知识问答及长程 Agent 任务等方面均全面提升；在代码与 Agent 基准测试中，其表现已达到或接近顶尖闭源模型水平：Terminal-Bench 4.0 得分 65.7%，Kimi Code Bench 3.0 Long-horizon 得分 61.2%，高于 K3 的 55.95%。摩尔线程官方表示，围绕 Kimi K3.1 Pro 的模型架构与计算特性，其通过 MUSA 软件栈，完成了关键推理路径迁移与适配，支持模型在 MTT S5000 上稳定运行。MUSA 软件栈高兼容，支撑新模型快速迁移：MUSA 在编程模型、运行时接口和 AI 框架层面的快速兼容迁移能力，是本次快速适配的重要基础。团队基于 SGLang-MUSA 承接上游模型实现，并通过 MATE 算子库、Triton-MUSA、TileLang-MUSA 及 MTCC 编译器，完成新架构关键计算路径的迁移与接入，将社区模型代码转化为 MTT S5000 上的实际推理服务。MUSA 软件栈同时覆盖框架执行、算子编译、设备运行和多卡通信，使模型适配能够复用成熟接口，并针对新增计算路径开展优化。接入 DSA，打通混合注意力与视觉计算：针对 Kimi-K3.1 Pro 的稀疏注意力 DSA，MUSA 软件栈完成索引选择、KV 缓存布局及 Prefill、Decode 计算路径的适配，接入 MATE 稀疏注意力算子，并与 KDA 状态管理、跨层残差及视觉 Attention 共同组成完整执行链路。面对模型采用的 MXFP4 专家权重，团队通过在线转换与跨层复用 FP8 工作区的方式执行专家计算，无需预先生成完整的离线 FP8 权重，为超大模型快速部署提供支持。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/561.htm", "publishedAt": "2026-11-06T14:41:55+00:00"}, {"title": "从混元研发体系重构到 MaaS 推理优化，模型能力如何走向真实业务？", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/azhgYaRTIjsSSVfA8AaU?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-06T14:34:37+00:00"}, {"title": "2026 开源行业解决方案创新赛「开源基础软件与解决方案赛道」决赛名单公布", "summary": "第四届开放原子大赛 · 2026 开源行业解决方案创新赛「开源基础软件与解决方案赛道」决赛入围名单今日公布，以下 10 支队伍成功晋级，将于 11 月 13 日在北京亦庄通明湖会展中心参加总决赛。 现将入围名单按报名时间顺序公示如下： 项目名称 负责人 仓库链接 实时交互数字人引擎 李恒中 https://github.com/lipku/LiveT...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503457", "publishedAt": "2026-11-06T11:23:16+00:00"}, {"title": "2026 开源行业解决方案创新赛「开源智能硬件解决方案赛道」决赛名单公布", "summary": "第四届开放原子大赛 · 2026 开源行业解决方案创新赛「开源智能硬件解决方案赛道」决赛入围名单今日公布，以下 10 支队伍成功晋级，将于 11 月 13 日在北京亦庄通明湖会展中心参加总决赛。 现将入围名单按报名时间顺序公示如下： 项目名称 负责人 代码仓库链接 Blockless 科创教育 AI 嵌入式软件开发平台 辛瑞莉 https:...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503456", "publishedAt": "2026-11-06T10:54:23+00:00"}, {"title": "2026 开源 "的 Agent。文章有一句话很精辟： 单任务的上限取决于模型能力，多任务的上限取决于人的注意力。 他们观察到，一个人通常只能同时跟进 3 到 5 个活跃 Session。因为现有 Agent 都以单个 Session 为单位，Session 之间彼此独立——你并行推进多项工作...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503338/deepseek-harness-super-agent", "publishedAt": "2026-11-02T02:39:53+00:00"}, {"title": "Postgres 19 迟到了，原因是 LLM 找出了太多老 bug", "summary": "PostgreSQL 19 要迟到了，大概率拖到 11 月才发。过去十年它的发布节奏准得像钟表——不早于 9 月中，不晚于 10 月中——今年破了例。 更反常的是今年在测试阶段后期，一些相当重要的功能被撤销：UPDATE/DELETE FOR PORTION OF、SQL Property Graph Queries（SQL/PGQ）、ALTER TABLE … MERGE/SPLIT PARTITION，全部在 ...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503336/postgres-19-is-late-and-its-ais-fault", "publishedAt": "2026-11-02T02:28:14+00:00"}]}, {"label": "产品发布/更新", "items": [{"title": "工信部就机器人“身份证”暂行办法征求意见，全品类机器人“一机一码”", "summary": "IT之家 11 月 7 日消息，工信部装备工业一司 11 月 6 日就《机器人产品标识码管理暂行办法（征求意见稿）》公开征求意见，公示期至 12 月 5 日。这份文件的核心是建立统一的机器人产品“身份证”体系，为每一台出厂的机器人赋予唯一的产品身份代码，支撑行业安全治理与全生命周期管理。根据征求意见稿，机器人产品标识码由制造商代码、产品说明代码、产品顺序号代码和其他代码四部分构成，编码与赋码须执行 GB/T 48541-2026《机器人产品标识码》国家标准。该国家标准的制定计划于 2026 年 1 月下达，由全国机器人标准化技术委员会归口，目前处于征求意见阶段。IT之家注：GB/T 为国家推荐性标准，企业可自愿采用，但一旦被行政规章引用，便在其适用范围内产生事实上的约束力。这一办法并非从零起步。2026 年 5 月，工信部人形机器人与具身智能标准化技术委员会已牵头发布全国首个人形机器人全生命周期管理服务平台，配套的《人形机器人全生命周期管理规范》采用 29 位四段式编码，依次为国家码、企业码、产品码与序列码，覆盖从出厂、流通、使用到报废回收的全链条追溯。截至 5 月，该平台已覆盖 100 余家企业、2.8 万余台人形机器人完成赋码。此次征求意见稿将标识码的适用范围从人形机器人扩展至全品类机器人，意味着工业机器人、服务机器人、特种机器人等均被纳入同一套编码框架之下。参考资料：《关于公开征求〈机器人产品标识码管理暂行办法（征求意见稿）〉意见的公示》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/625.htm", "publishedAt": "2026-11-07T00:29:29+00:00"}, {"title": "苹果、英伟达等科技公司面临潜在国会调查，曾在特朗普白宫宴会捐款 2500 万美元", "summary": "IT之家 11 月 7 日消息，路透社昨日报道称，即将接任美国参议院常设调查小组委员会主席的民主党参议员理查德・布卢门撒尔（Richard Blumenthal），已经要求苹果、Meta、谷歌、英伟达、亚马逊和微软等参与特朗普白宫宴会捐款的科技企业主动提交相关文件，否则可能在 2027 年 1 月面临传票。结合华盛顿邮报当地时间 11 月 6 日报道，民主党议员正在为明年展开的一系列企业调查做准备，苹果、Meta 以及马斯克旗下企业均可能成为调查对象。部分企业高管已经开始寻求律师协助，以应对可能到来的国会传票和调查。苹果可能面临的调查之一，与其 App Store 下架 ICEBlock 等追踪 ICE 执法人员活动的应用有关。这类应用允许用户报告当地移民执法人员的活动，引发了有关执法人员安全和公众言论自由的争议。苹果此前已经因这类应用受到民主党议员质询。2025 年 10 月，苹果在美国司法部施压后，从 App Store 下架了 ICEBlock 及其他类似应用。苹果当时表示，采取这一行动是出于联邦执法人员安全方面的考虑。此前，美国得克萨斯州达拉斯一处国土安全部设施遭枪击，造成两名被拘留人员死亡，美国联邦部门将袭击描述为针对 ICE 的暴力事件。美国众议院司法委员会民主党首席成员杰米・拉斯金（Jamie Raskin）今年 9 月 29 日再次致信苹果，要求公司重新审查下架决定，并提供因联邦政府要求而从 App Store 移除的应用完整名单。拉斯金指出，苹果已经确认其下架 ICEBlock 的决定受到特朗普政府司法部施压影响，但司法部尚未提供能够直接证明该应用与达拉斯枪击事件有关的证据。他认为，此事可能涉及美国宪法第一修正案所保护的言论自由权利。另一项可能引发国会调查的问题，是苹果向特朗普白宫宴会厅建设项目提供的捐款。据《华盛顿邮报》披露，苹果和英伟达分别承诺向该项目捐赠 2,500 万美元（IT之家注：现汇率约合 1.67 亿元人民币），是已披露的主要企业捐赠方之一。路透社称，布卢门撒尔要求企业提供与宴会厅项目捐款有关的记录，以便调查捐款的具体情况及其与特朗普政府之间的关系。他表示，如果民主党明年 1 月正式掌握相关委员会的调查权，而企业仍未提交文件，委员会将考虑采取其他措施强制配合。相关阅读：《特朗普白宫宴会捐款名单曝光：苹果、英伟达各捐 2500 万美元为单笔最高金额》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/620.htm", "publishedAt": "2026-11-07T00:08:51+00:00"}, {"title": "AI 编程工具 Amp 推出 Spaces：你的 AI 项目经理上线，自主编排 / 协调 Agent 干活", "summary": "IT之家 11 月 7 日消息，AI 编程协作工具 Amp 昨日（11 月 6 日）宣布推出 Spaces，希望构建面向 AI 智能体（Agent）和团队协作的全新工作方式。对于用户而言，不再需要手动创建、命名和管理多个 Agent 线程，只需对话一个主 Agent，由它理解需求、拆解任务，并让其自动生成和协调其他 Agent 线程。IT之家附上相关截图如下：Amp 指出在传统多 Agent 工作流中，用户往往要自己决定拆分、分派以及追踪任务，Spaces 将这一层组织工作交给 Agent：每个 Space 是用户与单个 Agent 的对话，该 Agent 会为用户启动并协调多个并行线程。例如，团队可以在一个 Space 中提出“推进某项功能上线”或“开展一次安全审查”。主 Agent 会将目标转化为多个具体任务，分别创建线程执行，并将进展以实时卡片形式呈现在聊天中。Spaces 不只是单人自动化工具，它被设计为团队共同规划和指挥工作的场所：成员可在同一聊天中提出需求、反馈问题或补充想法；每项被拆出的工作会显示当前状态，以及是否需要人工介入。用户点击任务卡片即可进入对应线程，查看 Agent 的产出、继续迭代或直接推进交付。团队成员还能在消息下评论讨论；只有当有人通过 @amp 提及时，Amp 才会读取相关评论，以减少不必要的干扰。Amp 将 Spaces 定位为一种“更高层级”的多 Agent 协作方式，用户从逐条安排 Agent，转向一个具备协调能力的 Agent 描述目标，再由后者负责任务分解、线程创建、进度组织和结果汇总。官方示例显示，一名成员曾通过单个 Space 完成服务账号功能的发布；另一个场景则是定期安全审查。用户只需在侧边栏的 Spaces 区域点击“+”，设置标题和项目，并向 Agent 说明要处理的工作即可开始。这一功能反映出 AI 编程工具正从“单人问答”走向“团队化、任务编排化”。当 Agent 能够自主拆解和并行执行任务时，开发者的角色可能更多转向定义目标、审查结果、处理关键决策，而非手动调度每一个子任务。Amp 是一款面向软件开发的 AI 编程 Agent 与开发环境，核心目标是让开发者把“做什么”交给 Agent，而由 Agent 负责读代码、改代码、跑测试、迭代，并在云端或本机持续执行任务。Amp 可以在用户的工作区中运行工具和 Shell 命令，用于检查代码、执行测试并快速迭代；它还能通过 Task 工具把特定子任务交给子 Agent 处理。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/609.htm", "publishedAt": "2026-11-06T23:02:32+00:00"}, {"title": "消息称微软不再续签甲骨文 AI 算力租赁协议，重新评估超 800 亿美元云合作", "summary": "IT之家 11 月 7 日消息，据彭博社今日报道，微软正在逐步结束与甲骨文（Oracle）的 AI 算力租赁合作。据介绍，微软此前已决定不再续签相关合同，然后近期开始关闭从甲骨文租用的部分计算资源。这也是微软重新评估数十亿美元云计算合作关系的一部分。知情人士透露，由于微软自身的技术规格不断变化，原先租用的计算资源逐渐无法满足其需求。甲骨文提供的服务器使用了较早一代的英伟达 GPU 芯片，因此对微软而言，这些算力的实用价值有所下降。甲骨文发言人表示，其 AI 基础设施需求依然强劲，其中也包括较早一代的 GPU。甲骨文此前在 9 月表示，部分使用约四年的 GPU 资源续约价格比最初合同价格高出 20%。微软则拒绝对此事发表评论。据彭博社报道，微软与甲骨文的这项合作于 2023 年公布。当时，甲骨文同意向微软提供服务器访问权限，为新版 AI 搜索引擎 Bing 提供算力支持。目前，这项租赁协议的完整金额尚不清楚。当时，微软向主要竞争对手甲骨文租用服务器，被视为 AI 行业算力资源严重短缺的一个早期信号。随着 AI 业务快速扩张，微软还与 CoreWeave、Nscale 和 Nebius 等新兴云计算服务商签署了大规模算力租赁协议，承诺投入超 800 亿美元（IT之家注：现汇率约合 5,346.02 亿元人民币），从外部云服务商租用计算资源，以支持自身 AI 业务。不过，微软目前正在重新评估相关合作策略。微软内部部分关键管理人员对新兴云服务商的高昂成本和项目交付延迟感到不满。在决定不再续签甲骨文这项协议的前后，微软也加强了对其他数据中心项目的监督，退出了一些被认为风险较高的项目，并在内部讨论是否继续签署新的新兴云服务商合作协议。同时，甲骨文的云计算业务自 2023 年以来持续扩张，OpenAI 和 Meta 等企业的大型 AI 合同为其带来业务增长。根据甲骨文公布的 2026 财年业绩，截至 2026 年 5 月 31 日的财年，公司云业务收入为 339.89 亿美元（现汇率约合 2,271.32 亿元人民币），其中云基础设施（IaaS）收入为 180.9 亿美元（现汇率约合 1,208.87 亿元人民币），同比增长 77%。与此同时，甲骨文正在大规模建设数据中心并扩充云计算基础设施。随着资本支出不断增加，公司自由现金流承压。甲骨文公布的 2026 财年数据显示，其自由现金流为负 237 亿美元。投资者也开始更加关注公司的基础设施投资规模及其资金压力。相关消息传出后，甲骨文股价一度下跌约 3%，此前的盘中涨幅被抹去。甲骨文股价此前曾于 6 月 1 日触及 248.15 美元的年度高点，随后持续回落。相关阅读：《消息称 Meta 已搁置向 Anthropic 出租 AI 算力的计划》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/606.htm", "publishedAt": "2026-11-06T22:44:15+00:00"}, {"title": "DigitalOcean 推出学习与数据服务，帮助 AI 智能体进行自我迭代", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/upfROwtEl8R75H24D13J?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-06T15:25:00+00:00"}, {"title": "微信鸿蒙版 App 发布 8.0.23.35 邀测升级，灰度聊天消息长按问小微等功能", "summary": "IT之家 11 月 6 日消息，据用户反馈，微信鸿蒙版 App 今晚在华为应用市场（App Gallery）发布了 8.0.23.35 (8394531) 版本邀测升级（需收到短信通知后点击链接跳转安装），测试时间为 2026/11/6-2026/12/6。和往常一样，本次更新的说明依旧为“修复了一些已知问题”。据用户反馈，8.0.23 版本的微信新增了如下特性：部分 Flutter 跨端页面（如朋友圈、听一听、表情管理等页面）响应系统字体粗细；更换铃声选择界面右上角新增铃声设置入口，支持启用或停用个性化内容推荐；发表视频号内容时新增添加标注，视频号已发布的内容点击分享同步新增添加标注；发现-直播-更多直播新增 表达意见的权利，但不认可违法行为。事件随后升级为警方清场。据德新社当日晚间报道，荷兰警方称，已拘捕 150 至 200 名涉嫌非法侵入的示威者。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/650.htm", "publishedAt": "2026-11-07T02:27:50+00:00"}, {"title": "“史上最大 IPO”遇挑战：Anthropic 上市估值存分歧，1.5 万亿美元仍被嫌贵", "summary": "IT之家 11 月 7 日消息，路透社昨日（11 月 6 日）发布博文，报道称 AI 公司 Anthropic 的首次公开募股（IPO）计划面临投资者估值质疑，部分投资者认为 1.5 万亿美元（现汇率约合 10.03 万亿元人民币）估值依然偏高。Anthropic 拒绝就相关疑虑置评。报道指出在冲击“史上最大 IPO”的道路上，Anthropic 的公司估值预期不断下调。Anthropic 公司原计划于 11 月 9 日当周启动路演、次周定价，争取 11 月挂牌，公司最初寻求高达 2 万亿美元（现汇率约合 13.37 万亿元人民币）的估值。IT之家曾于 11 月 3 日援引《华尔街日报》报道，上周科技股的暴跌，正在改变计划参与 Anthropic IPO 的机构投资者对这家 AI 公司的估值判断。这些投资者已向 Anthropic 及其顾问团队表示，本月晚些时候 IPO 时的估值应在 1.5 万亿美元至 1.6 万亿美元（现汇率约合 9.99 万亿元至 10.66 万亿元人民币）之间，远低于此前数月市场讨论的接近 2 万亿美元（IT之家注：现汇率约合 13.32 万亿元人民币）的水平。三家拟参与 IPO 的大型投资者认为应进一步降低估值，其中一名投资者认为估值可能更接近 1 万亿美元（现汇率约合 6.69 万亿元人民币）。从 2 万亿到 1 万亿，买卖双方预期相差一半，但这不代表公司已接受“腰斩”定价。投资者的谨慎也与市场环境和公司财务状况有关。路透社称，科技股遭遇猛烈抛售，叠加 Anthropic 此前的季度亏损及巨额 AI 基础设施支出承诺，让认购方要求更大折价。部分投资者还在等待 10 月营收数据，以判断近期放缓的增长是否重新提速。科技媒体 The Information 报道称，Anthropic 计划下周继续进行 IPO 路演，仍计划在 11 月 16 日那一周，也就是感恩节前夕进行公开上市。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/640.htm", "publishedAt": "2026-11-07T01:36:48+00:00"}, {"title": "环比增约 70%：马斯克预估 SpaceX 第四季度营收逼近 250 亿美元，股价涨超 8%", "summary": "IT之家 11 月 7 日消息，金融媒体 Barron's 今天（11 月 7 日）发布博文，报道称当地时间周五在纽约市林肯中心举行第 33 届巴伦投资大会上，全球首富埃隆 · 马斯克（Elon Musk）预估 SpaceX 第四季度（2026 年 10 月 1 日至 12 月 31 日）营收环比增长约 70%。IT之家此前报道，SpaceX 公司第三季度（2026 年 7 月 1 日至 9 月 30 日）营收为 145.75 亿美元，同比增长 161%、环比增长 86.52%。若以此计算，SpaceX 第四季度营收有望接近 250 亿美元（IT之家注：现汇率约合 1,671.53 亿元人民币）。马斯克同时重申，SpaceX 有望在 12 月实现 1,000 亿美元（现汇率约合 6,686.11 亿元人民币）的年化营收规模，并预计到 2027 年底年化营收将超过 5,000 亿美元（现汇率约合 3.34 万亿元人民币）。这一预测背后，SpaceX 的收入结构正在明显变化。马斯克称，本季度来自美国政府机构的收入占比将低于 10%，低于上一季度的 16.6%；人工智能算力业务则成为增长引擎，Anthropic 已是 SpaceX 单一最大客户。受上述表态影响，SpaceX 股价周五一度上涨 8.3%，盘后涨幅扩大至约 9%，创下近三个月最大单日涨幅。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/626.htm", "publishedAt": "2026-11-07T00:35:30+00:00"}, {"title": "消息称台积电考虑进军先进内存芯片制造，有望为英伟达打造 3D DRAM", "summary": "IT之家 11 月 7 日消息，科技媒体《The Information》昨日（11 月 6 日）援引两名知情人士报道，台积电正考虑扩大业务版图，进军先进内存芯片制造，以在快速扩张的 AI 硬件供应链中获取更大份额。报道称，台积电近期已应其最大客户英伟达的要求，开始规划生产一种名为“3D DRAM”的先进内存芯片。该架构通过垂直堆叠存储单元来提升容量，被视为应对 AI 算力对高带宽、高密度内存需求的关键方向之一。台积电目前尚未确定量产时间，也未最终决定产能来源。IT之家援引博文介绍，台积电正在评估两条路径：一是兴建专用新厂，二是收购现有晶圆厂并改造为内存生产设施。这一动向若落地，将意味着台积电从长期专注的晶圆代工、逻辑芯片制造，向三星电子、SK 海力士和美光长期主导的存储芯片市场延伸。对英伟达而言，若能获得更近的先进内存供应，也有助于缓解 AI 加速器所需高带宽内存的供应压力。不过，该消息仍属市场传闻。台积电回应称“不评论市场传闻或揣测”，并强调公司始终专注于晶圆代工核心业务；英伟达则未回应置评请求。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/619.htm", "publishedAt": "2026-11-06T23:59:05+00:00"}, {"title": "消息称 OpenAI 完成 110 亿美元首期新融资，估值 1.25 万亿美元", "summary": "北京时间 11 月 7 日，据彭博社报道，知情人士称，OpenAI 新一轮融资已完成大约 110 亿美元的首期款项，对公司的估值为 1.25 万亿美元。据知情人士透露，截至周五，这笔资金已汇入 OpenAI 账户。其中一位知情人士称，本轮融资的剩余部分预计将在未来几周内完成，融资总额最高可能达到 200 亿美元。在推迟首次公开招股 (IPO) 计划后，OpenAI 已与投资者就大规模融资进行了一个多月的谈判。彭博社此前报道称，OpenAI 最初计划以 1.4 万亿美元的估值融资至少 300 亿美元。但随着 AI 股票在公开市场遭遇大幅抛售，该公司随后缩减了融资计划。知情人士表示，参与首期融资的投资者包括寇图资本管理和普信集团。本轮融资的其他投资者还包括软银集团、红杉资本、Founders Fund 和安德森 · 霍洛维茨基金。彭博社此前报道称，一个来自阿联酋的投资者财团也参与了本轮融资。知情人士称，OpenAI 还在与投资银行合作，计划向高净值个人投资者和散户投资者募集资金。OpenAI 最近一次融资是在今年 3 月，当时该公司完成了 1220 亿美元融资，估值达到 8520 亿美元。截至发稿，OpenAI 不予置评。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/612.htm", "publishedAt": "2026-11-06T23:24:12+00:00"}, {"title": "Cloudflare 与 VoidZero 联合推出 tsrs：由 AI 生成的 TypeScript 编译器 Rust 移植版", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/lGoA1ZSw6ojeh68GVlBl?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-06T17:00:00+00:00"}, {"title": "最高投资 100 亿美元：SK 海力士设立美国 AI 投资子公司 Hyaico，崔泰源掌舵", "summary": "IT之家 11 月 6 日消息，美国监管机构披露文件显示，SK 海力士已在美国成立 AI 投资子公司 Hyaico Corp，SK 集团会长崔泰源担任董事会主席。IT之家了解到，SK 海力士成立的这家子公司此前暂定名为 AI。该公司将加速全球市场 AI 发展，并寻找 AI 增长新引擎，计划向美国 AI 领域投资至多 100 亿美元（IT之家注：现汇率约合 668.25 亿元人民币）。此外，该子公司将通过重组 SK 海力士现有的美国业务部门 SK hynix NAND Product Solutions 组建。SK 海力士总裁宋贤钟（Song Hyun-jong）将出任 Hyaico CEO。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/584.htm", "publishedAt": "2026-11-06T15:05:28+00:00"}, {"title": "美股 AI 硬件股集体反弹，费城半导体指数涨 6.5%", "summary": "IT之家 11 月 6 日消息，美国股市今日开盘后，AI 硬件产业链全线反弹，费城半导体指数最高涨 6.57%。个股方面，AMD 涨 13.2%，闪迪涨 11.75%，希捷科技涨 6.34%，美光科技涨 9.07%，迈威尔科技涨 9.46%，Lumentum 涨 9.58%；英伟达涨 6.44%，台积电涨 7.55%，博通涨 4.56%。IT之家注意到，美国股市 AI 概念相关股票当地时间周四迎来了暴跌，道琼斯工业平均指数收盘下跌超过 1,800 点，跌幅约 3.4%；标普 500 指数下跌 4.4%；纳斯达克综合指数暴跌 5.5%，创 2025 年 4 月以来最大单日跌幅，并跌入技术性回调区间。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/564.htm", "publishedAt": "2026-11-06T14:58:09+00:00"}, {"title": "从仓储到配送，全程由 AI“指挥”：京东物流“超脑”3.0 的工业级 AI 实践", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/jBdvoUXheWN0oe6NfklO?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-06T11:14:55+00:00"}, {"title": "AI 狂烧 2000亿美元，谷歌全球启动“自愿买断”计划：最高补偿12个月工资", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/vMSj216sQUhmeDH4H0G7?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-06T08:00:00+00:00"}, {"title": "DeepSeek带火稀疏计算，国产芯片公司加速突围：这家公司又融近10亿", "summary": "Q3营收实现数倍增长", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/508155.html", "publishedAt": "2026-11-06T07:00:29+00:00"}, {"title": "一边赛博修仙，一边卖家电！AI短剧开始冲双11业绩了？", "summary": "挑战商业视频的高难度场景", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/508118.html", "publishedAt": "2026-11-06T06:54:17+00:00"}, {"title": "99.4%登顶全球第一！这个中国AI师承世界冠军", "summary": "一举刷新「AI安全世界杯」CyberGym世界纪录", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/508107.html", "publishedAt": "2026-11-06T05:01:47+00:00"}, {"title": "香港金融科技周 x StartmeupHK 2026主论坛：以「金融+」、「AI+」及全球拓展开拓新机遇", "summary": "香港金融科技周 x StartmeupHK 2026踏入第11届", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/507988.html", "publishedAt": "2026-11-06T03:36:34+00:00"}, {"title": "AI短剧门槛降降降！实测即梦短剧工作室：剧本分镜预演一条龙，伙伴计划长期护航", "summary": "Seedance 2.5 单秒低至0.15元", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/507972.html", "publishedAt": "2026-11-06T03:20:05+00:00"}, {"title": "孩子的人生大事，你要怎样的AI？海亮科服把AI生涯规划带给更多家庭", "summary": "基础规划免费！", "sourceName": "量子位", "sourceUrl": "https://www.qbitai.com/2026/11/507919.html", "publishedAt": "2026-11-05T13:17:00+00:00"}, {"title": "谷歌发布 ML Drift：为各类 GPU 加速端侧 AI 推理", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/hHzARIJTeqoqYpjNKEuq?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-05T13:00:00+00:00"}, {"title": "谷歌用 Gemini 4 Argon 一夜优化 ADK 代码库的 20 万行代码", "summary": "点击查看原文>", "sourceName": "InfoQ 中文", "sourceUrl": "https://www.infoq.cn/article/u4fAoAH5vZPCV4TVqAcO?utm_source=rss&amp;utm_medium=article", "publishedAt": "2026-11-05T11:00:00+00:00"}, {"title": "Anthropic微微发力，AI中转站的天就要塌了？", "summary": "就像发邮件加上数字签名一样#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1687702?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-11-04T10:34:38+00:00"}, {"title": "奥运赛事首次来到非洲，AI 也学着「入乡随俗」", "summary": "用最硬核的技术，给在地文化最充分的尊重#欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "sourceName": "爱范儿", "sourceUrl": "https://www.ifanr.com/1687242?utm_source=rss&amp;utm_medium=rss&amp;utm_campaign=", "publishedAt": "2026-11-04T09:01:48+00:00"}, {"title": "UJCMS 13.2.1 发布，多语言网站 AI 自动翻译", "summary": "UJCMS 支持多语言网站，可支持多种语言网站，语言数量不受限制。支持发布一种语言的文章后，可以使用 AI 或百度翻译、有道翻译自动翻译其它语言的文章；同时支持文章批量翻译。文章修改后，同样可以同步翻译至不同语言网站。如发现翻译有不恰当之处，可以手动修改。 本次更新新增会员投稿，会员可在会员中心提交文章，经...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503350", "publishedAt": "2026-11-02T10:51:17+00:00"}]}, {"label": "论文研究", "items": [{"title": "苹果 iOS 键盘被曝隐藏约 10 万个敏感词汇名单：避免 iPhone 输入法自动推荐补全，但用户仍可手动输入", "summary": "IT之家 11 月 7 日消息，据路透社当地时间 11 月 6 日报道，独立研究人员 Derik Kauffman 发现，苹果 iOS 键盘系统内部存在一份未公开的多语言词汇限制名单，研究人员将其称为“灰名单”（Gray List）。这意味着苹果不会通过自动补全或滑行输入功能向用户主动推荐这些词汇，但不禁止用户手动输入。据介绍，这份名单不仅包括脏话、性相关内容以及毒品和暴力相关词汇，还涉及部分政治敏感表达。Kauffman 表示，他是在今年 9 月发现这份名单的。当时，他注意到 iPhone 滑行输入在处理某些短语时会出现异常，例如输入“Bad boy”（坏男孩）和“White man”（白人男性）时会出现卡顿，但输入“Bad girl”（坏女孩）和“Black man”（黑人男性）时却没有类似问题。随后，他使用 OpenAI Codex 和 Anthropic Claude Code 对系统内部文件进行了分析，最终找到了这份隐藏词汇名单。Kauffman 表示，他估计名单包含约 10 万个单词、短语及其不同变体。具体数量取决于统计方式，约 10 万个是相对保守的估算。名单中的大部分内容涉及粗俗表达、冒犯性词汇以及毒品、性和暴力相关内容，不过也包含一些政治和社会议题相关表达。例如，名单中包括“Dictator Trump”“Sleepy Joe”“Right wing conspiracy”（右翼阴谋论）和“United Ireland”（联合爱尔兰）等短语。不同语言也存在各自的限制内容，例如印地语中的部分针对印度总理莫迪和反对派领导人拉胡尔・甘地的讽刺表达，以及法语中的“Immigration too high”（移民数量过高）和希伯来语中的“Occupied territories”（被占领土）。苹果向路透社回应称，用户始终可以手动输入任何单词和短语，也可以覆盖键盘提供的预测文本建议。苹果表示，其键盘的设计目标是避免推荐可能不恰当或具有冒犯性的内容，但没有直接回应名单的规模、具体构成，以及为何将部分政治表达列入其中。路透社记者随后使用 iPhone 对 Kauffman 提供的部分词汇进行了独立测试，发现相关限制确实存在。例如，尝试通过滑行输入“United Ireland”，键盘可能将其识别为“United Iceland”；输入“Sleepy Joe”时，可能得到“Sleepy hope”。输入“Dictator Trump”虽然可以完成，但键盘不会正常推荐这一完整短语，甚至会将 Trump 自动处理为小写形式。在其他测试中，输入“White man”可能被识别为“White mean”，而“Red man”和“Blue man”则可以正常完成滑行输入。此外，“Read smut”（看小黄书）能够正常输入，但“Read gay smut”（看男同小说）则可能被错误识别为其他词汇。这份名单也得到了其他研究人员的独立验证。网络安全工程师、人工智能安全公司 Tolmo 的 Matt Suiche 表示，他也从苹果系统中恢复出了这份灰名单，并与 Kauffman 的研究结果进行了交叉比对，两者高度吻合。他还指出，这份名单已经隐藏在苹果软件中多年。对于这种设计，Kauffman 认为，苹果希望避免用户意外发送粗俗内容或具有煽动性的表达，这一出发点可以理解，但具体执行存在不一致。他将其称为一种“轻度形式的审查”，并指出，当这一机制应用于数以亿计的 iPhone 用户时，即使只是轻微干预，也可能产生广泛影响。美国电子前沿基金会（EFF）高级法律顾问 David Greene 则表示，限制不恰当的预测文本推荐有一定合理性，但用户应该充分了解这类机制的存在，并拥有一定的自定义权限。他认为，苹果不应该将这类限制名单完全隐藏起来。相关阅读：《macOS 藏着“脏话识别系统”，苹果词典分级机制被曝光》", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/638.htm", "publishedAt": "2026-11-07T01:33:31+00:00"}, {"title": "刷新算力巅峰：IBM 在美国芝加哥揭幕其最强量子计算机", "summary": "IT之家 11 月 7 日消息，IBM 昨日（11 月 6 日）发布联合公告，宣布携手芝加哥大学、美国伊利诺伊州政府、以及伊利诺伊量子与微电子园（IQMP），已在芝加哥海德公园实验室投运 IBM Quantum System Two 量子计算机。这是 IBM 在伊利诺伊州部署的首台量子计算机，也是该公司当前最先进的量子计算系统，其核心为 IBM Quantum Nighthawk 芯片，被 IBM 称为迄今打造的最强大量子芯片。Nighthawk 是 IBM 于 2025 年发布的超导量子处理器系列，芝加哥部署的是其第二代版本 Nighthawk r2。IBM 将其称为“迄今最强大的量子芯片”，综合了最高的电路复杂度、连接性和运行速度，并引入独立高速量子比特复位架构。每个量子比特可独立、快速复位，使系统能以每秒超过 10 万次的速率执行电路，从而显著提升科研和工业用户在相同时间内可完成的实验与计算量。该系统由芝加哥大学托管，未来将迁入正在建设的伊利诺伊量子与微电子园，并成为国家量子算法中心（NQAC）的核心计算平台。该中心由伊利诺伊州政府于 2024 年设立，IBM 为主要合作方，旨在联合高校、国家实验室、初创企业和产业界，开发下一代量子算法及实际应用。新系统将面向药物研发、电网优化、材料模拟、高能物理等计算密集型领域开放合作。IBM 称，伊利诺伊州的科研机构与企业已开始围绕量子计算如何扩展至复杂现实问题展开研究。其中，芝加哥大学与 IBM 的联合团队此前曾利用 70 个逻辑量子比特，在约 15 分钟内完成一项结构化计算任务，展示了超越传统经典模拟方法的潜力。IBM 董事长兼首席执行官阿尔温德 · 克里希纳表示，新系统已能为伊利诺伊州及更广泛地区的机构提供具有科学价值的研究成果，其落地标志着该州量子社区的重要里程碑。IT之家附上相关截图如下：伊利诺伊州州长 JB· 普利兹克则称，这一部署将为研究人员和企业提供把构想转化为现实解决方案的工具，并带动本地高质量就业。", "sourceName": "IT之家", "sourceUrl": "https://www.ithome.com/1/023/635.htm", "publishedAt": "2026-11-07T01:22:48+00:00"}, {"title": "GOTC 来我这放个 P！Vibe Coding 的同时也要记得关怀屁股", "summary": "你是否遇到过这种情况：Vibe Coding 最上头的地方，是你永远觉得“再改一版就好”。于是你让 AI 再跑一轮，AI 让你再等一会儿。代码迭代了十版，屁股一个 commit 都没挪。直到终于跑通，才发现你的屁股已经和椅子合并分支了。 我们是即刻放P垫，一群认真研究“屁大点事”的硬件整活选手，正在做一款用放屁音效和触感提醒...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503412", "publishedAt": "2026-11-05T06:38:40+00:00"}, {"title": "JeecgBoot V3.9.6 发布，67 项安全漏洞集中修复，AI 图像生成上线", "summary": "前言 JeecgBoot V3.9.6 是一次以「安全」为主线的版本。距离 V3.9.5 发布两个多月，这一版集中处理了社区和安全研究人员报告的 67 项安全漏洞，覆盖越权访问、租户隔离、登录爆破、短信轰炸、SQL 注入、SSRF、XSS、远程代码执行等方向，并为大量导入导出、新增、删除接口补齐了按钮权限。 功能方面，AI 流程编排新增「图...", "sourceName": "开源中国", "sourceUrl": "https://www.oschina.net/news/503401", "publishedAt": "2026-11-05T01:30:09+00:00"}]}, {"label": "技巧与观点", "items": [{"title": "谷歌母公司 Alphabet 斥资约 5.48 亿美元建仓高通，押注 AI 芯片新赛道", "summary": "IT之家 11 月 7 日消息，路透社今天（11 月 7 日）发布博文，报道称谷歌母公司 Alphabet 在第三季度首次买入芯片巨头高通约 297.7 万股股票，持仓市值约 5.48 亿美元（IT之家注：现汇率约合 36.62 亿元人民币），约占高通总股本 0.5%。根据美国证券监管文件披露，Alphabet 第三季度持仓总市值约为 883 亿美元（现汇率约合 5,900.67 亿元人民币），上一季度约为 991 亿美元（现汇率约合 6,622.38 亿元人民币），环比下降约 10.9%。当季新增 4 只股票持仓、增持 1 只股票、减持 3 只股票，并且清仓 3 只股票；前十大持仓合计占比达到 99.48%。根据披露的 Alphabet 持仓投资组合中，本次购入高通股票是新增的重要标的，按持仓市值排名第六：SpaceX：约 837.34 亿美元（现汇率约合 5,595.55 亿元人民币），占 94.78%芝商所（CME）：约 9.13 亿美元（现汇率约合 61.01 亿元人民币），占 1.03%Planet Labs：约 5.78 亿美元（现汇率约合 38.62 亿元人民币），占 0.65%Arm：约 5.68 亿美元（现汇率约合 37.96 亿元人民币），占 0.64%Revolution Medicines：约 5.49 亿美元（现汇率约合 36.69 亿元人民币），占 0.62%高通： const ACCENTS = ["--c1","--c2","--c3","--c4","--c5"];
function accentVar(i){ return "var(" + ACCENTS[i % ACCENTS.length] + ")"; }

// 完整 HTML 转义（文本内容与属性通用）
function esc(s){
  return (s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// 北京时间人话格式；默认相对“报告日期”(DATA.date) 计算 今天/昨天
function fmtBeijing(iso, withDay){
  if(!iso) return "时间未公布";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "时间未公布";
  const bj = new Date(d.getTime() + 8*3600*1000);
  const Y=bj.getUTCFullYear(), M=bj.getUTCMonth()+1, D=bj.getUTCDate();
  const h=bj.getUTCHours(), m=String(bj.getUTCMinutes()).padStart(2,'0');
  // 防源 pubDate 标到未来（如 InfoQ 把当天新闻统一标 18:00 北京），显示未来时间不合理
  const nowBJ = new Date(Date.now() + 8*3600*1000);
  if(bj.getTime() > nowBJ.getTime()){
    return withDay===false ? (h+":"+m) : "刚刚";
  }
  if(withDay===false) return h+":"+m;
  const p=(DATA.date||"").split("-");
  const rY=+p[0], rM=+p[1], rD=+p[2];
  const dayDiff=Math.round((Date.UTC(Y,M-1,D)-Date.UTC(rY,rM-1,rD))/86400000);
  let prefix;
  if(dayDiff===0) prefix="今天";
  else if(dayDiff===1) prefix="明天";
  else if(dayDiff===-1) prefix="昨天";
  else prefix=(M+"月"+D+"日");
  return prefix+" "+h+":"+m;
}

function clip(s, max){
  const arr = Array.from(s || "");
  if(arr.length<=max) return s || "";
  return arr.slice(0,max).join("")+"…";
}

const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function renderHero(){
  const dateStr = DATA.date;
  const p = dateStr.split("-");
  const Y=+p[0], M=+p[1], D=+p[2];
  const wd = WEEK[new Date(Y, M-1, D).getDay()];
  const dateEl = document.getElementById("heroDate");
  if(dateEl){
    let txt = Y + "年" + M + "月" + D + "日 · " + wd;
    if(DATA.generatedAt){
      txt += " · 生成于北京时间 " + fmtBeijing(DATA.generatedAt, false);
    }
    if(DATA.isFallback) txt += ' <span class="badge-fallback">当日未生成 · 回退最近一期</span>';
    dateEl.innerHTML = txt;
  }
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statSec").textContent = DATA.sections.length;
}

function renderLead(){
  const box = document.getElementById("leadBox");
  if(!DATA.lead){ box.style.display = 'none'; return; }
  box.innerHTML = '<span class="lead-tag">今日导语</span>' + esc(DATA.lead);
}

function renderNav(){
  const nav = document.getElementById("nav");
  let html = '<a href="#top">顶部</a>';
  DATA.sections.forEach(function(s,i){
    html += '<a href="#sec-' + i + '">'
      + s.label + '<span class="cnt">' + s.items.length + '</span></a>';
  });
  nav.innerHTML = html;
}

const CLOCK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function renderCards(){
  const main = document.getElementById("main");
  let counter = 0;
  let html = "";
  DATA.sections.forEach(function(s,i){
    const accent = accentVar(i);
    html += '<section class="section" id="sec-' + i + '">'
      + '<div class="section-head"><span class="bar" style="background:' + accent + '"></span>'
      + '<h2>' + s.label + '</h2><span class="count">' + s.items.length + ' 条</span></div>'
      + '<div class="grid">';
    s.items.forEach(function(it){
      counter++;
      const url = it.sourceUrl || "#";
      const src = it.sourceName || "来源";
      const time = fmtBeijing(it.publishedAt);
      const sumHtml = it.summary
        ? '<p class="summary" title="' + esc(it.summary) + '">' + esc(clip(it.summary, 60)) + '</p>'
        : '';
      html += '<article class="card" style="--accent:' + accent + '">'
        + '<div class="top">'
        + '<span class="badge">' + counter + '</span>'
        + '<span class="chip" title="' + esc(src) + '">' + esc(src) + '</span>'
        + '</div>'
        + '<h3><a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + '</a></h3>'
        + sumHtml
        + '<div class="foot">'
        + '<span class="time">' + CLOCK + time + '</span>'
        + '<a class="link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">阅读原文 →</a>'
        + '</div>'
        + '</article>';
    });
    html += '</div></section>';
  });
  main.innerHTML = html;
}

function renderFoot(){
  const total = DATA.sections.reduce(function(a,s){return a+s.items.length;},0);
  const sl = (DATA.sourceList || []).map(function(s){return esc(s);}).join("、");
  document.getElementById("footNote").innerHTML =
    '本页共 <strong>' + total + '</strong> 条 · 数据来源：' + (sl || "中文科技媒体 RSS") + '<br>'
    + '时间均以北京时间展示，点击卡片标题或「阅读原文」跳转原出处。';
}

renderHero();
renderLead();
renderNav();
renderCards();
renderFoot();
</script>
</body>
</html>
